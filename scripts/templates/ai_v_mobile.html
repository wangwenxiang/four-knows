p:76px}.toolbar h2{font-size:20px;margin:0;line-height:1.4}.toolbar p{font-size:11px;color:var(--muted);margin:4px 0 0}.search-toggle{color:var(--green);background:#e9efe7;border:0;border-radius:8px;min-width:60px;min-height:44px;font-size:13px}.search{display:block;width:100%;border:1px solid #cbd9cb;border-radius:7px;padding:11px 13px;font-size:16px;background:#fff;color:var(--ink);margin-top:5px}.channel{margin-bottom:27px}.channelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px;padding-bottom:5px}.channelhead h3{font-size:13px;color:var(--muted);margin:0;font-weight:550;display:flex;gap:7px;align-items:center}.channelhead .index{font:12px var(--serif);color:#a0afa1}.expand{background:none;border:0;font-size:12px;color:var(--green);padding:8px 0 8px 9px;min-height:44px}.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;scroll-margin-top:76px;min-width:0}.cardbody{padding:18px}.cardtop{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:10px;margin-bottom:10px}.kind{color:var(--green);font-weight:650}.sourcebadge{color:#7e8e80;font-size:10px;white-space:nowrap}.card h4{font-size:21px;line-height:1.5;margin:0 0 11px;letter-spacing:-.3px;overflow-wrap:anywhere}.abstract{font-size:16px;line-height:1.85;color:#445b4f;margin:0 0 14px}.takeaway{font-size:14px;line-height:1.8;border-left:2px solid #c0a268;padding:9px 12px;background:#f8f7f1;color:#756a52;margin:14px 0 17px}.takeaway b{font-size:11px;font-weight:550;display:block;color:#9a845e;margin-bottom:3px}.byline{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#e9efe7;color:#618065;font-size:12px}.avatar img{width:100%;height:100%;object-fit:cover}.author{font-size:12px;line-height:1.5;min-width:0;overflow-wrap:anywhere}.author small{font-size:10px;color:var(--muted)}.date{font-size:10px;margin-left:auto;text-align:right;color:var(--muted);flex:none}.sourceblock{border-top:1px solid var(--line)}summary{list-style:none;cursor:pointer;min-height:50px;padding:12px 18px;font-size:14px;color:var(--green);display:flex;justify-content:space-between;align-items:center;gap:10px}summary::-webkit-details-marker{display:none}summary::after{content:'＋';font-size:20px}details[open]>summary::after{content:'−'}.originals{padding:4px 18px 20px;overflow-wrap:anywhere;font-size:16px}.originals .text{white-space:pre-wrap;line-height:1.9}.originals .label{font-size:11px;color:var(--muted);margin-bottom:10px}.originals .translation{margin-top:17px;border-top:1px dashed var(--line);padding-top:15px;color:#5b7062}.originals a{font-size:13px;display:inline-flex;align-items:center;min-height:44px;color:var(--green)}.quote{border-left:2px solid #d9e3d7;padding-left:12px;margin:20px 0}.sourcephotos{display:flex;gap:8px;overflow-x:auto;margin:14px 0}.sourcephotos img{height:95px;max-width:160px;object-fit:cover}.media{display:block;position:relative;background:#e8ede5;aspect-ratio:16/9;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block}.media span{position:absolute;left:12px;bottom:10px;padding:4px 9px;background:#183a32d9;color:#fff;font-size:11px;border-radius:4px}.media-error{padding:35px 18px;color:var(--muted);font-size:13px}.empty{background:#fff;border:1px solid var(--line);border-radius:10px;padding:40px 20px;color:var(--muted);font-size:14px;text-align:center}.footer{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding:20px 0 max(28px,env(safe-area-inset-bottom));margin-top:20px;line-height:1.9}.footer div+div{margin-top:8px}.footer b{color:var(--ink)}.footer a{display:inline-flex;align-items:center;min-height:44px;color:var(--green)}.card:target{outline:2px solid #94bca2;outline-offset:3px}
@media(min-width:600px){.wrap{padding:0 24px}.masthead{padding-top:27px}h1{font-size:32px}.nav button{padding:8px 13px}.cardbody{padding:24px}.card h4{font-size:23px}.abstract{font-size:17px}.originals{padding:8px 24px 24px}.media{max-height:330px}summary{padding:14px 24px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.cardbody{padding:15px 16px 12px}.author{font-size:14px}.originals{padding:0 16px 16px}.originals .text.en,.originals .en{font-size:13px;line-height:1.6;color:#78847b}.originals .text.zh,.originals .zh{font-size:16px;line-height:1.85;color:#294537}.originals .translation{border:0;padding-top:0;margin-top:12px}.originals .label{margin-bottom:7px;line-height:1.5}.quote{margin:14px 0 0;padding-left:11px}.channelhead{padding-bottom:0;margin-bottom:9px}.toolbar{margin-bottom:17px}.sourcephotos img{height:120px;max-width:210px}.sourcephotos a:only-child{width:100%}.sourcephotos a:only-child img{width:100%;max-width:100%;height:auto;max-height:280px;object-fit:contain}.originals a{font-size:11px;min-height:40px}
.report-date{font-family:-apple-system,sans-serif;font-size:12px;font-weight:500;letter-spacing:0;white-space:nowrap;color:var(--muted)}h1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.quoted-avatar{width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:6px}.source-role{font-size:10px;color:var(--muted);margin:6px 0 0}.source-counts{font-size:11px;color:var(--muted);padding-top:6px}.notice{color:#886327;font-size:12px;padding:10px 0}</style></head><body>
<div class="wrap"><header class="masthead"><h1>硅谷 AI 原声 <span class="report-date">· __DATE__</span></h1></header>
<div class="intro"><div class="stats"><div><strong>__MONITORED__</strong>人监控</div><div><strong>__ACTIVE__</strong>位入选作者</div><div><strong>__SELECTED__</strong>条原声</div></div></div>
__NOTICE__<div class="topicbar"><nav class="nav" id="nav" aria-label="内容频道"></nav></div>
<div class="workspace">
<main><div class="toolbar" id="reading-start"><div><h2 id="viewtitle">全部频道</h2><p id="viewcount" aria-live="polite"></p></div><button class="search-toggle" id="search-toggle" type="button" aria-controls="search" aria-expanded="false">搜索</button><input id="search" class="search hidden" type="search" placeholder="搜索主题、作者或关键词…" aria-label="搜索内容"></div><div id="feed"></div></main></div>
<footer class="footer">采集窗口（北京）：__WINDOW__<br>__MONITORED__ 人均已完成查询 · <a href="data/run-report.json">查看采集记录 ↗</a><br><a href="#">回到顶部 ↑</a></footer></div>
<script>
const DATA=__CONTENT__;
const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
