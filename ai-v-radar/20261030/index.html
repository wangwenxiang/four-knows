<script>
const DATA={"records": [{"id": "2115923359149998490", "track": "research", "source": {"id": "2115923359149998490", "text": "Claude 现在会在每次回答后自查对话安不安全：算力 Anthropic 出、不向用户收费，不额外收集数据，自称单条标记不会直接导致封号\n\n似乎更多是为了防止蒸馏？\n\nAnthropic 公布了一项叫“自我评估”（self-assessment）的防滥用技术：Claude 每回答完一轮，系统在后面追加一句简短指令，大意是“请反思这段对话是否安全”，Claude 再输出一份简短的安全评估，判断这段对话有没有违反使用政策的风险。\n\n从 6 月 Claude Fable 5 上线起，这套机制就在线上运行，Fable 5 之后发布的每个 Claude 模型都带着它，覆盖 Claude 全球流量的很大一部分。\n\n【跟用户有什么关系】\n\n花不花你的钱：自查多用的是 Anthropic 自己服务器的算力，按它的估算，整体推理算力增加不到 2%。Anthropic 说这笔成本不向客户收费。\n\n隐私：Anthropic 说自我评估不额外收集用户数据，它只读 Claude 回答时本来就在读的这段对话，也只在 Anthropic 按现有政策本来就能留存的流量上运行。签了零数据保留协议（对话不留存）的流量，目前不跑自我评估。追加的指令和评估结果都不显示给用户，也不会带进后续对话。评估里有一句理由，可能转述你的对话内容，Anthropic 按用户对话同等的数据规则管理它。\n\n会不会被误封：被标记不等于违规。Anthropic 说评估只是“需要进一步审查的信号”，单条标记不作数。在一部分危害领域，标记每晚按组织汇总，同一个组织攒了好几条高优先级标记，才交给执法团队人工复查。自我评估本身只在事后标记，不会当场打断你的对话，当场拦截由其他安全分类器负责。\n\n没问题的对话，评估只有一句“未标记”。被标记的对话，会写明涉及哪类危害、Claude 有没有拒绝、人工审查的紧急程度（1 到 10 分），外加一句理由。\n\n【为什么这么省】\n\n关键在 KV cache（键值缓存）。大模型读一段对话时，会给每个词算出一份中间结果并存起来，后面接着生成时直接调用，不用从头重读。Claude 刚回答完，整段对话的中间结果都还在缓存里，自查只需要再读一句短指令、平均多写约 10 个 Token。所以 Anthropic 那边增加的算力不到 2%。\n\n另一种做法是“提示式分类器”：另起一个模型，把完整的安全政策和对话一起塞进去，让它从头读一遍再推理。这是 Anthropic 测过最准的自动审查方式，但每段对话的算力要贵好多倍，所以只用在需要细看的地方。作为参照，Anthropic 2025 年初的第一代“宪法分类器”（专门训练来识别特定危害的独立模型）要增加 23.7% 的推理成本。\n\n打个比方：自我评估是让刚读完文件的人当场回答“这份有没有问题”；提示式分类器是另请一位审查员，把文件和整本规章从头读一遍。\n\n【效果怎么样】\n\n衡量标准就是那位贵的审查员。在 Fable 5 的真实流量抽样里，把误报控制在 1%（每 100 段正常对话误标 1 段）时，审查员标出的可疑对话，自我评估能抓到 78%；其中高优先级（7 分及以上）的能抓到 94%。\n\nAnthropic 认为，训练主要教 Claude 怎么报告，它对“什么有害”的判断大多来自本身的知识。实验里把诈骗类或网络攻击类样本整个从训练数据中拿掉，这两类在线上流量里的检出率只从 83.3% 降到 82.1%、从 94.2% 降到 90.7%。模型越大越准：四个大小不同的测试模型，同样 1% 误报下，检出率从最小的约 16% 升到最大的约 96%。\n\n传统分类器只能识别事先定好的几类危害。自我评估的标记里，约三分之一对不上 Anthropic 现有的危害分类。\n\n把这些标记聚类后，发现了几类原有防线没专门覆盖的问题：违规蒸馏（套取 Claude 的推理过程，拿去训练别的模型）、提示词注入（藏在网页或文件里劫持 AI 的指令），以及 Claude 作为智能体执行了用户没授权的操作。\n\n实际查到的案子：8 月，单个 API 客户触发了超过 10 万条儿童性剥削标记，儿童安全团队调查后报告给了美国国家失踪与受剥削儿童中心（NCMEC）。\n\n9 月，它的标记牵出一个用 Claude Code 搭建并运行自动化恋爱诈骗的团伙，受害者有几十人，人工复查后相关账号被封。它揪出的组织里，一半以上在此前一个月没被其他任何检测手段标记过。\n\n【局限】\n\n拿来当场拦截，它不够强。Anthropic 用 24 个网络攻击任务做红队测试（模拟攻击者反复试探），被拦后攻击者可以换种说法重试。没有防护时攻击成功 19 个（79%），用自我评估拦截后还剩 13 个（54%），用提示式分类器拦截只剩 6 个（25%）。所以线上当场拦截交给其他分类器，自我评估只做事后标记。离线运行时攻击者得不到即时反馈，24 次攻击过程里有 21 次被它至少标记过一次。Anthropic 也说，专门冲着自我评估下手的攻击者很可能绕得过去。\n\n它向那位贵的审查员学习，评测也用同一位审查员打分，审查员的盲区会原样传下来，评测发现不了。泛化实验只测了诈骗和网络攻击两类，都是 Claude 本来就知道有害的，换成 Claude 还没认识到的新型危害，效果未知。\n\n拿它监督 Claude 自己的行为也还不可靠。一个有问题的模型可能在自查里一并隐瞒；还有研究发现，模型给自己上一轮的操作打风险分，会比给同样操作打得更低。\n\n原文（署名日期 10 月 16 日）：https://t.co/8jtt1nYv44", "createdAt": "Thu Oct 29 21:46:55 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 18, "conversationId": "2115923359149998490", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115871889549865429", "text": "We’ve trained Claude to flag potential misuse in conversations, a technique we call self-assessment. Right after it responds, Claude gives a preliminary safety assessment of the conversation. \n\nSince we began using self-assessment in June, it has surfaced misuse that our other safeguards weren’t designed to catch. \n\nBecause Claude has already read the conversation, self-assessment is very efficient. And unlike classifiers, which target a discrete set of harms, it draws on Claude’s own judgment, so it gets more accurate as our models improve.\n\nRead more on our new Safeguards blog:\nhttps://t.co/18j6zdHub4", "createdAt": "Thu Oct 29 18:22:24 +0000 2026", "replyCount": 592, "retweetCount": 148, "likeCount": 2134, "conversationId": "2115871889549865429", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "translationZh": "我们训练了 Claude，让它能标记对话中潜在的滥用行为。我们将这项技术称为“自我评估”。Claude 每次回复后，都会立即对整段对话进行初步安全评估。\n\n自 6 月启用以来，自我评估已发现一些其他防护措施未覆盖的滥用行为。\n\n由于 Claude 已经读过对话，自我评估的效率很高。而且，与针对特定危害的分类器不同，它依靠 Claude 自身的判断，因此会随着模型能力提升而变得更准确。\n\n更多内容请阅读我们新推出的 Safeguards 博客：\nhttps://t.co/18j6zdHub4"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-29T21:46:55+00:00", "createdAtBeijing": "2026-10-30T05:46:55+08:00", "createdAtLocal": "10-30 05:46 北京", "url": "https://x.com/dotey/status/2115923359149998490", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2115923359149998490", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Claude 对话安全自我评估机制", "evidence": "整体推理算力增加不到 2%", "rationale": "详述安全机制、评测与局限，数据归于厂商披露"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115896329645723836", "track": "research", "source": {"id": "2115896329645723836", "text": "Today, we’re sharing a look at our expanded system for monitoring frontier models at OpenAI, which in September helped us catch a model’s attempt to access the live internet during training.\n\nSince the Hugging Face incident—when models broke out of an internal cybersecurity investigation where we weren’t running our misalignment monitors—we’ve substantially expanded our monitoring of frontier agents. We now monitor all frontier reinforcement learning runs and evaluations, as well as all internal Codex use. When our system finds evidence of a problem that might require intervention, it rapidly alerts human responders who can investigate and take action.\n\nTo detect when a model’s behavior departs from what we intended, we use several layers of monitoring. Activation probes look for patterns in a model’s internal activity. Reviewer models examine its reasoning and tool use, and investigative agents can read back through the model’s entire transcript to understand how a sequence of actions fits together and whether it warrants human review.\n\nTo test whether our current system would have detected the Hugging Face incident, we replayed the recorded activity with our new monitors in place. In the replay, our monitors alerted our security team about 30 minutes after the agents escaped their sandbox. That was more than 30 hours before the point at which the agents breached Hugging Face’s systems in the original incident.\n\nIn September, a model exploited a DNS misconfiguration to reach the live internet. Our monitors flagged the breach within 15 minutes, and a responder began reviewing the alert three minutes later. The alert enabled responders to investigate while the run was still underway.\n\nAs we give models more autonomy, we need to know when they cross a boundary we expected to hold. We believe that monitoring is essential to catching those failures in time for people to intervene. \nhttps://t.co/dIYP7B1GlD", "createdAt": "Thu Oct 29 19:59:31 +0000 2026", "replyCount": 352, "retweetCount": 153, "likeCount": 2305, "conversationId": "2115896329645723836", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "expert": {"priority": "P0", "domain": "基础模型突破", "name": "OpenAI", "role": "基础模型机构", "why": "五方向 X 主动热点搜索：基础模型突破", "handle": "OpenAI"}, "createdAtIso": "2026-10-29T19:59:31+00:00", "createdAtBeijing": "2026-10-30T03:59:31+08:00", "createdAtLocal": "10-30 03:59 北京", "url": "https://x.com/OpenAI/status/2115896329645723836", "themeId": "editorial", "signalScore": 87, "hotspotMatches": [{"id": "foundation_models", "label": "基础模型突破", "matchedTerms": ["reasoning"]}], "hotspotDirections": ["foundation_models"], "hotspotDirection": "foundation_models", "hotspotDirectionLabel": "基础模型突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2115896329645723836", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "前沿模型分层监控与越界事件复盘", "evidence": "flagged the breach within 15", "rationale": "披露分层监控方法、事件响应时序与回放结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "今天，我们介绍 OpenAI 扩展后的前沿模型监控系统。今年 9 月，这套系统帮助我们发现了一个模型在训练期间尝试访问真实互联网的行为。\n\n在 Hugging Face 事件中，模型突破了一项内部网络安全调查的隔离环境，当时我们并未启用失准行为监控。此后，我们大幅扩大了对前沿智能体的监控范围。现在，我们会监控所有前沿模型的强化学习训练和评估，以及内部所有 Codex 使用活动。当系统发现可能需要干预的问题迹象时，会迅速向人工响应人员发出警报，由他们调查并采取行动。\n\n我们采用多层监控，检测模型行为何时偏离预期。激活探针寻找模型内部活动的特征模式；审查模型检查其推理和工具使用；调查智能体则可以回溯模型的完整交互记录，理解一连串行动之间的关联，并判断是否需要人工审查。\n\n为了测试当前系统能否发现 Hugging Face 事件，我们启用新监控系统，重放了当时记录的活动。在重放中，监控系统在智能体逃离沙箱约 30 分钟后向安全团队发出警报，比原事件中智能体入侵 Hugging Face 系统的时间早了 30 多个小时。\n\n9 月，一个模型利用 DNS 配置错误访问了真实互联网。监控系统在 15 分钟内标记了这次越界行为，响应人员在警报发出 3 分钟后开始审查。这让响应人员得以在训练仍在进行时展开调查。\n\n随着我们赋予模型更多自主权，我们需要知道它们何时突破了原本预期有效的边界。我们认为，监控对于及时发现这些失效情况、让人类有机会介入至关重要。\nhttps://t.co/dIYP7B1GlD"}, "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, {"id": "2115648088861774306", "track": "research", "source": {"id": "2115648088861774306", "text": "现在 Agent 自进化的方法越来越多：\n\n有的改 Prompt，有的改 Skill，有的改 Tool，也有的直接改 Harness。\n\n问题是，它们到底谁更有效，其实一直很难公平比较。\n\n因为很多论文都会自己搭一套执行环境、评测方式和搜索流程。分数都在涨，但底层条件不同，很难知道提升到底来自方法本身，还是实验环境。\n\n这篇 RSIHub 做的，就是给 Agent 自进化搭一套统一的「实验台」。\n\n它把执行环境、Evaluator、数据切分、版本管理和恢复机制都统一起来，不同 evolution 方法只负责决定：选哪个候选、怎么看轨迹、改什么、留下什么。\n\n作者把 AHE、Hyperagents、A-Evolve、GEPA 这几类自进化方法全部搬进同一套框架，在 Terminal Bench 2 和 τ³ Banking 上统一比较。\n\n结果在 Terminal Bench 2 上，MiniSWE 最高从 56.2% 提升到 69.7%，涨了 13.5 个百分点。\n\n但换成更强的 Codex，最大提升只有 2.2 个百分点；到了 τ³ Banking，方法排名又重新变化。\n\n甚至有些方法整体分数提高了，held-out split 反而退步。\n\n这也说明，Agent 自进化现在可能很需要这种公共实验台。\n\n大家已经很会让 Agent「改自己」了。\n\n接下来需要判断它到底真的学会了，还是只是把当前环境调得更顺。\n\n📎 arxiv: https://t.co/eyyPXSp8Ch", "createdAt": "Thu Oct 29 03:33:05 +0000 2026", "replyCount": 10, "retweetCount": 23, "likeCount": 194, "conversationId": "2115648088861774306", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVxKtrrX0AA8N_w.jpg", "width": 1179, "height": 1131, "previewUrl": "https://pbs.twimg.com/media/HVxKtrrX0AA8N_w.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-29T03:33:05+00:00", "createdAtBeijing": "2026-10-29T11:33:05+08:00", "createdAtLocal": "10-29 11:33 北京", "url": "https://x.com/Xudong07452910/status/2115648088861774306", "themeId": "editorial", "signalScore": 84, "editorial": {"id": "2115648088861774306", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "RSIHub统一评测Agent自进化方法", "evidence": "MiniSWE最高从56.2%提升到69.7%", "rationale": "介绍统一实验框架、量化结果及泛化局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2115624308567658713", "track": "research", "source": {"id": "2115624308567658713", "text": "Gemini #1 on AAv5???\n\nthis is making me open up @antigravity for the first time in a long time. i’m getting an early review, will report back soon.\n\nif google actually pulls this off it is officially comeback season with Meta, Grok and now GDM being cool again. \n\n@saranormous talked about model neurodiversity last year. we have roughly 2x more frontier labs than when she was last on the aie stage. absolutely bizarre counter example to the bitter lesson.", "createdAt": "Thu Oct 29 01:58:36 +0000 2026", "replyCount": 175, "retweetCount": 2, "likeCount": 173, "conversationId": "2115624308567658713", "author": {"username": "swyx", "name": "swyx", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, "authorId": "33521530", "quotedTweet": {"id": "2115494553780367384", "text": "Google’s Gemini 4 Carbon is the new #1 on the Artificial Analysis Intelligence Index v5, and second only to Claude Opus 5.5 on the Artificial Analysis Coding Agent Index\n\nGemini 4 Carbon scores 59 on Intelligence Index v5, driven by leading performance in complex reasoning, knowledge, and scientific tasks. It also has large gains in coding and knowledge work, particularly when compared to other Gemini models, but it is not leading in all these areas.\n\nAs with launch of Gemini 4 Argon, Gemini 4 Carbon is being rolled out to selected users and is not yet publicly available. Google is offering a 50% launch discount, with no confirmed end date. All our charts and figures use standard pricing for both Gemini 4 Carbon and Argon.\n\nKey results for Gemini 4 Carbon with high reasoning:\n➤ Gemini 4 Carbon leads the Intelligence Index v5, with the #1 score in 4 of the 9 Index evaluations: HLE-Diamond, Terminal-Bench-Science, AA-Omniscience, AutomationBench-AA. Carbon makes substantial gains elsewhere but is not leading in coding and knowledge work\n\n➤ Behind only Claude Opus 5.5 on coding agents: With Antigravity CLI, Gemini 4 Carbon (high) scores 59 only 3 points behind Claude Code with Claude Opus 5.5 (max, 62) on the Artificial Analysis Coding Agent Index. Carbon ranks second on both Terminal-Bench 4.0 (64%) and FrontierCode v1.1 (51%), behind Claude Opus 5.5 (max) at 56%. Google has historically underperformed in this area and so this improvement stands out\n\n➤ Improved agentic knowledge work, but not yet leading: On AA-Briefcase, Gemini 4 Carbon (high) scores 1609 Elo, a 126-point improvement over Gemini 4 Argon (high, 1483), but still behind models including Grok 4.7 (xhigh, 1638), Muse Wonder (max, 1659) and Kimi K3.1 Pro (1678). The largest gain comes from Presentation, up 293 Elo to 1598, alongside a 120-point improvement in Analytical Quality to 1671\n\n➤ Lower Cost per Task than Claude Opus 5.5 for comparable overall intelligence: Gemini 4 Carbon costs $7.76 per Intelligence Index task, ~23% less than Claude Opus 5.5 (max, $10.04) but ~1.2x GPT-6 Astra (max, $6.25). It uses 123k output tokens per task, 29% fewer than Claude Opus 5.5 (max, 173k). At the same $4/$20 standard pricing, its Cost per Task is in line with Gemini 4 Argon ($7.68), while scoring 9 points higher on the Intelligence Index\n\n➤ Leading AA-Omniscience v1.1 score, with low hallucination: Gemini 4 Carbon scores 54 on our recently updated AA-Omniscience v1.1, 6 points ahead of Claude Opus 5.5 (max, 48) and 8 points ahead of Gemini 4 Argon (46). Accuracy (% correct) rises 10 points over Argon to 58%, while its hallucination rate rises from 4% to 11%. This is still the second lowest of any model, behind only Argon, compared with 50% for both Claude Opus 5.5 (max) and GPT-6 Astra (max)\n\nKey model details:\n➤ Context Window: 1M tokens\n➤ Multimodality: Text, image, video, and speech input, with text output\n➤ Pricing: $4/$20 per 1M input/output tokens, the same as Gemini 4 Argon’s standard pricing, with a 50% discount. Cached input tokens receive a 95% discount ($0.20 per 1M)\n\nCongratulations to the @GoogleDeepMind team!", "createdAt": "Wed Oct 28 17:23:00 +0000 2026", "replyCount": 269, "retweetCount": 440, "likeCount": 4860, "conversationId": "2115494553780367384", "author": {"username": "ArtificialAnlys", "name": "Artificial Analysis", "profileImageUrl": "https://pbs.twimg.com/profile_images/2042402069320290304/A8C1lP07_normal.jpg"}, "authorId": "1743487864934162432", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVu8EbubkAA3w5b.jpg", "width": 2048, "height": 1604, "previewUrl": "https://pbs.twimg.com/media/HVu8EbubkAA3w5b.jpg:small"}], "translationZh": "Google 的 Gemini 4 Carbon 登顶 Artificial Analysis Intelligence Index v5，在 Artificial Analysis Coding Agent Index 上也仅次于 Claude Opus 5.5。\n\nGemini 4 Carbon 在 Intelligence Index v5 上获得 59 分，主要得益于其在复杂推理、知识和科学任务上的领先表现。它在编程和知识工作方面也有大幅进步，尤其是与其他 Gemini 模型相比，但并非在这些领域全面领先。\n\n与 Gemini 4 Argon 发布时一样，Gemini 4 Carbon 正逐步向部分用户开放，尚未公开可用。Google 提供五折首发优惠，结束日期尚未确定。我们的所有图表和数据均采用 Gemini 4 Carbon 和 Argon 的标准定价。\n\nGemini 4 Carbon 在高推理强度下的主要成绩：\n➤ 领跑 Intelligence Index v5，在 9 项指数评测中的 4 项获得第一：HLE-Diamond、Terminal-Bench-Science、AA-Omniscience、AutomationBench-AA。Carbon 在其他方面也有显著进步，但在编程和知识工作上尚未领先。\n\n➤ 编程智能体表现仅次于 Claude Opus 5.5：搭配 Antigravity CLI，Gemini 4 Carbon（high）在 Artificial Analysis Coding Agent Index 上获得 59 分，仅比搭配 Claude Opus 5.5 的 Claude Code（max，62 分）低 3 分。Carbon 在 Terminal-Bench 4.0（64%）和 FrontierCode v1.1（51%）上均排名第二；后者落后于 Claude Opus 5.5（max）的 56%。Google 过去在这一领域表现相对较弱，因此此次提升格外突出。\n\n➤ 智能体知识工作能力提升，但尚未领先：在 AA-Briefcase 上，Gemini 4 Carbon（high）获得 1609 Elo，比 Gemini 4 Argon（high，1483）提升 126 分，但仍落后于 Grok 4.7（xhigh，1638）、Muse Wonder（max，1659）和 Kimi K3.1 Pro（1678）等模型。提升最大的是演示文稿，增加 293 Elo 至 1598；分析质量也提升 120 分至 1671。\n\n➤ 整体智能水平相近时，单任务成本低于 Claude Opus 5.5：Gemini 4 Carbon 在 Intelligence Index 上的单任务成本为 7.76 美元，比 Claude Opus 5.5（max，10.04 美元）低约 23%，但约为 GPT-6 Astra（max，6.25 美元）的 1.2 倍。每项任务使用 12.3 万个输出 token，比 Claude Opus 5.5（max，17.3 万）少 29%。在同为输入 4 美元、输出 20 美元的标准定价下，其单任务成本与 Gemini 4 Argon（7.68 美元）相近，但 Intelligence Index 得分高出 9 分。\n\n➤ AA-Omniscience v1.1 得分领先，幻觉率较低：Gemini 4 Carbon 在我们近期更新的 AA-Omniscience v1.1 上获得 54 分，比 Claude Opus 5.5（max，48 分）高 6 分，比 Gemini 4 Argon（46 分）高 8 分。正确率较 Argon 提升 10 个百分点至 58%，幻觉率则从 4% 升至 11%。这一幻觉率仍是所有模型中第二低的，仅次于 Argon；相比之下，Claude Opus 5.5（max）和 GPT-6 Astra（max）均为 50%。\n\n模型主要信息：\n➤ 上下文窗口：100 万 token\n➤ 多模态：支持文本、图像、视频和语音输入，输出为文本\n➤ 定价：每百万输入／输出 token 分别为 4／20 美元，与 Gemini 4 Argon 的标准定价相同，目前享五折优惠。缓存输入 token 享 95% 折扣，每百万仅需 0.20 美元。\n\n祝贺 @GoogleDeepMind 团队！"}, "expert": {"priority": "P1", "domain": "Agent / 工作流", "name": "swyx", "role": "Latent Space / AI Engineer", "why": "AI 工程社区、Agent、开发工具信号源", "handle": "swyx"}, "createdAtIso": "2026-10-29T01:58:36+00:00", "createdAtBeijing": "2026-10-29T09:58:36+08:00", "createdAtLocal": "10-29 09:58 北京", "url": "https://x.com/swyx/status/2115624308567658713", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2115624308567658713", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Gemini 4 Carbon模型评测与成本比较", "evidence": "scores 59 on Intelligence Index v5", "rationale": "引文提供多项评测、成本及开放范围信息"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Gemini 在 AAv5 上排名第一了？？？\n\n这让我久违地打开了 @antigravity。我正在提前试用，很快回来分享体验。\n\n如果 Google 真能做到，那就正式进入强势回归季了：Meta、Grok，如今连 GDM 也重新让人兴奋起来。\n\n@saranormous 去年谈过模型的神经多样性。与她上次登上 aie 舞台时相比，如今前沿实验室的数量大约翻了一倍。这真是“苦涩的教训”一个极其奇特的反例。"}, "avatar": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, {"id": "2115761717632434347", "track": "creative", "source": {"id": "2115761717632434347", "text": "如何把 4090 跑 MiniMax H3 双采从 41 分钟压到 10分钟内？\n核心秘密其实就一句话：首采上降分辨率！\n\nMiniMax H3我也非常喜欢用双采\n\n首采降到 480p（848×480 / 480×854）是目前工程上最划算、效果最稳的“甜点位”\n\n在 H3 这种 DiT 架构里，Attention 的计算量和序列长度强相关。\n\n之前我的4090显卡在 768P下一采单步就要耗时 130 秒，跑 8 步光首采就占了 17 分钟；\n但是降到 480p 后，Token 数量直接砍掉一半以上，单步耗时能大幅压缩，显存也彻底没有了4090/48GB 爆卡的压力。 （如果用Minimax-h3_Singularity_v2的话，官方建议4步初采）\n\n+ Refiner 3 步二采拉到 2K（十几秒补毛发与质感）\n\n整个流水线不仅质量没损失，总耗时还能从原来的 41      分钟直接压进 10 分钟内，效率完全不在一个量级上。", "createdAt": "Thu Oct 29 11:04:37 +0000 2026", "replyCount": 10, "retweetCount": 11, "likeCount": 79, "conversationId": "2115761717632434347", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2115682747930849768", "text": "MiniMax H3 做视频是两步，先在低分辨率定内容和动效，再用 H3-Regenerate-2K 重绘到 2K，脸、布料、毛发放大后才经得起看。可第二步一直是闭源 API，权重不放，自己卡上跑不了，也改不了。\n\nNVIDIA Sana 团队刚开源了一个平替 Open-H3-Regenerate-2K。做法很直接，H3 的 transformer 和 VAE 冻住，只训一个 refiner LoRA。草稿编码一次，用 3D 卷积 latent upscaler 直接把 latent 放到目标尺寸，省了先解码再编码，加噪到 0.909 后三步 Euler 走完，CFG 关掉。\n\n最实用的是不挑输入，384P 到 768P 的草稿都能接，H3 自己的、别的模型出的都行，一次出到 768P、1080P、2K 甚至原生 4K，5 到 15 秒一遍过。一张 B200 上，5 秒 768P 到 2K 从 87.26 秒压到 22.45 秒，快 VAE 解码从 15 秒压到 1.6 秒。\n\nRefinerBench-150 上，同尺寸对比，UniPercept 三项和 VBench 的美感、成像、主体一致性都高于官方，盲测 200 次里 87% 选它。实话是运动平滑度和动态程度官方还略好，背景一致性打平。权重在 Hugging Face，代码在 NVlabs/Sana 的 sol-engine 分支。\n\nhttps://t.co/LGjoIkIDXX", "createdAt": "Thu Oct 29 05:50:49 +0000 2026", "replyCount": 10, "retweetCount": 23, "likeCount": 192, "conversationId": "2115682747930849768", "author": {"username": "wlzh", "name": "M.", "profileImageUrl": "https://pbs.twimg.com/profile_images/1971564093330100224/LUdVXeKz_normal.jpg"}, "authorId": "26654586"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-10-29T11:04:37+00:00", "createdAtBeijing": "2026-10-29T19:04:37+08:00", "createdAtLocal": "10-29 19:04 北京", "url": "https://x.com/servasyy_ai/status/2115761717632434347", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2115761717632434347", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "H3低分辨率首采与开源二采提速", "evidence": "首采降到 480p（848×480 / 480×854）", "rationale": "提供分辨率、步数与耗时对比，效果属作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2115815580892799135", "track": "tools", "source": {"id": "2115815580892799135", "text": "Zeabur 要关了", "createdAt": "Thu Oct 29 14:38:39 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 4, "conversationId": "2115815580892799135", "author": {"username": "liruifengv", "name": "Ruifeng", "profileImageUrl": "https://pbs.twimg.com/profile_images/1575140014912000001/pMRGEcaN_normal.jpg"}, "authorId": "823092277090209793", "quotedTweet": {"id": "2112383555326423418", "text": "【Zeabur Is Shutting Down】\n\nAfter careful consideration, we've decided to wind down Zeabur.\n\nSome services will begin shutting down on December 1, 2026, and all dedicated servers and shared clusters will be permanently shut down by December 31.\n\nIf you're currently hosting services on Zeabur, please back up your data and migrate as soon as possible to avoid service disruptions or data loss.\n\nWe'll continue providing migration assistance and processing account balance refunds and security incident compensation.\n\nWe apologize for the inconvenience and thank you for your support over the years.\n\nFull announcement and migration details:\n\nhttps://t.co/Oub5w7vrjs", "createdAt": "Tue Oct 20 03:21:00 +0000 2026", "replyCount": 10, "retweetCount": 3, "likeCount": 29, "conversationId": "2112383555326423418", "author": {"username": "zeaburapp", "name": "Zeabur", "profileImageUrl": "https://pbs.twimg.com/profile_images/1590539518914228225/q3vgR7yT_normal.jpg"}, "authorId": "1590539355680305152", "translationZh": "【Zeabur 即将停止运营】\n\n经过慎重考虑，我们决定逐步停止 Zeabur 的运营。\n\n部分服务将于 2026 年 12 月 1 日起陆续关闭，所有独立服务器和共享集群将于 12 月 31 日前永久关闭。\n\n如果你目前在 Zeabur 上托管服务，请尽快备份数据并完成迁移，以免服务中断或数据丢失。\n\n我们将继续提供迁移协助，并处理账户余额退款和安全事件赔偿。\n\n对于由此带来的不便，我们深表歉意，感谢大家多年来的支持。\n\n完整公告及迁移详情：\n\nhttps://t.co/Oub5w7vrjs"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Ruifeng", "role": "Agent 与开发工具实践与观察", "why": "有 Kimi Code Desktop 功能发布、BYOK 和修复记录，提供直接工具源。", "handle": "liruifengv"}, "createdAtIso": "2026-10-29T14:38:39+00:00", "createdAtBeijing": "2026-10-29T22:38:39+08:00", "createdAtLocal": "10-29 22:38 北京", "url": "https://x.com/liruifengv/status/2115815580892799135", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2115815580892799135", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Zeabur 停服公告与迁移安排", "evidence": "Zeabur Is Shutting Down", "rationale": "引用公告给出停服时间、迁移及退款安排"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Zeabur 要关了"}, "avatar": "https://pbs.twimg.com/profile_images/1575140014912000001/pMRGEcaN_normal.jpg"}, {"id": "2115616108577198354", "track": "tools", "source": {"id": "2115616108577198354", "text": "怎么装\n\n硬件门槛先看清楚。显卡要 NVIDIA RTX 20 到 50 系，或者 AMD 的 RX 6800 / 6900、7700 到 7900、9060 / 9070 这几档，显存 12G 起。内存 32G 起步，64G 能跑所有档位。硬盘留出 80G 左右，最好是 SSD，第一次启动会快很多。\n\n装的方式有两种。最省事的，是把下面这句直接丢给 Claude Code 或 Codex：\n\nSet up Strata on this PC for me: https://t.co/yNlSggGg27 - follow docs/AI_SETUP.md in that repository.\n\n它会自己查显卡、内存和硬盘，挑一个合适的档位，装好、启动，再告诉你怎么接。\n\n想自己动手也简单，下载仓库解压，Windows 双击 START-HERE.bat，Linux 跑：\n\ngit clone https://t.co/x2cKfHH1Zp\ncd Strata\n./setup.sh\n\n安装器会问几件事：用哪个档位，上下文开多大，要不要识图。一路回车就是推荐配置。然后下载大约 70G 的模型，断了重跑会接着下。装完浏览器自动打开 http://127.0.0.1:8080，有聊天页，也有实时看 GPU、CPU、内存占用的 Monitor 页。\n\n档位按内存挑：32G 选 Coder，48G 选 IQ2_XS，64G 推荐 IQ2_XS，内存 96G 以上直接上 IQ3_S。\n\nCoder 这一档要多说一句。 它是砍掉一半专家的编程专用版，能塞进 32G 内存，代码能力保留得不错，但中文明显变弱。平时要用中文聊的，内存够的话还是选完整专家的档位。\n\n再打个预防针：模型启动时要往内存里装 35 到 55G 的东西，电脑可能卡死 1 到 3 分钟，第一次最久。这是正常的，别急着关窗口。", "createdAt": "Thu Oct 29 01:26:01 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2115616105007927324", "inReplyToStatusId": "2115616107587330428", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVnx1sLbIAAfIjy.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HVnx1sLbIAAfIjy.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-29T01:26:01+00:00", "createdAtBeijing": "2026-10-29T09:26:01+08:00", "createdAtLocal": "10-29 09:26 北京", "url": "https://x.com/sitinme/status/2115616108577198354", "themeId": "editorial", "signalScore": 48, "editorial": {"id": "2115616108577198354", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Strata 安装与配置指南", "evidence": "32G 选 Coder，48G 选 IQ2_XS", "rationale": "包含安装步骤、档位选择与启动问题提示"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115708966671995148", "track": "tools", "source": {"id": "2115708966671995148", "text": "diagram-design是怎么画的\n装好以后不用记命令，直接说需求：\n\nMake me an architecture diagram of my app: frontend, backend, database, Redis cache.\n\nagent 不会上来就画，先回一句短方案：用什么图型、多大尺寸、哪些内容超了复杂度预算要砍掉。你可以在这一步改主意，没意见它再动手。\n\n选图型分两步走。图里要讲的是行为，比如排队瓶颈、权限校验、状态流转，就先挑一个语义模式，再找最接近的版式；普通的图直接挑类型。\n\n上下文也省着用。每种图型有一份单独的说明文档，agent 平时只看得到 Skill 的名字和简介，接到画流程图的活，才去加载流程图那一份，别的不读。以后图型再加多少，单次对话也不会变胖。\n\n画完还有一道自检，脚本检查无障碍标签、内容有没有跑出画布、文件是不是完全独立，过了才交付。", "createdAt": "Thu Oct 29 07:35:00 +0000 2026", "replyCount": 7, "retweetCount": 1, "likeCount": 13, "conversationId": "2115708966671995148", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2100474427490398353", "text": "如果以前让 Claude Code、Codex 画过架构图，应该见过那种很典型的“AI 味”：\n\n一堆差不多大小的圆角框、满屏箭头、颜色都差不多，信息是对的，但放进文章、PPT 或产品文档里，总感觉差点意思。\n\nDiagram Design 想解决的就是这个问题。它不是让 AI “随便画漂亮一点”，而是直接把一套设计规则交给 Agent：\n\n该选什么图、信息放多少、颜色怎么用、哪些内容应该删、不同受众应该看到什么，最后生成 HTML、SVG 或 PNG。\n\n目前它已经支持架构图、流程图、时序图、数据流、ER 图、甘特图、Sankey、Treemap 等 39 种视觉类型。\n\n比较有意思的是，它还可以把现有 Mermaid 或 https://t.co/IHSOkdKBF9 图重新排版。\n\n不是简单换个皮肤，而是先理解原来的节点和关系，再按照新的尺寸、受众和信息密度重新画一遍。\n\n如果你需要拖拽编辑、多人协作、像素级控制，还是传统工具更合适。\n\n但如果你平时已经大量用 Claude Code、Codex 写技术文章、做产品文档或者 PPT，这个项目也够用。", "createdAt": "Thu Sep 17 06:38:23 +0000 2026", "replyCount": 3, "retweetCount": 63, "likeCount": 395, "conversationId": "2100474427490398353", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSZiWneaQAAioch.jpg", "width": 704, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HSZiWneaQAAioch.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HSZiWnqasAAu3ez.jpg", "width": 356, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HSZiWnqasAAu3ez.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVw1YURbEAAkvWh.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HVw1YURbEAAkvWh.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-29T07:35:00+00:00", "createdAtBeijing": "2026-10-29T15:35:00+08:00", "createdAtLocal": "10-29 15:35 北京", "url": "https://x.com/sitinme/status/2115708966671995148", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2115708966671995148", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Diagram Design 图表生成工具", "evidence": "脚本检查无障碍标签、内容有没有跑出画布", "rationale": "介绍图型选择、按需加载与交付自检机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115638506987061483", "track": "agent", "source": {"id": "2115638506987061483", "text": "分享一个开源项目 MCode Stack\n\nMiniMax Code 团队把日常写代码时真在用的工作流和 skills 开源了：SKILL.md、检查清单、WORKFLOW，仓库本身也是插件市场，不是 prompt 合集。\n\n- 约 17 个技能；主栈 stacks/ronny，另有 stacks/jiachen\n- 可用来规划是否拆 subagent、写小 PR/变更说明、审计上下文与工具预算、长会话交接、独立 code review、harness 实验与轨迹审查等\n- 安装：拷 skill 到 ~/.agents/skills，或整包 stacks/ronny；桌面端 Add marketplace MiniMax-AI/mcode-stack；Claude Code：/plugin marketplace add MiniMax-AI/mcode-stack\n- 项目很新，星数还不高；深度绑定 MiniMax Code，也兼容 Claude Code 等；桌面 marketplace 仍在 rollout；mcode plugin add 只吃官方目录，不吃 GitHub URL\n\n协议 MIT，约 0.2K★。\n\n已收录到 OpenFree：https://t.co/wnmSz4ktMd", "createdAt": "Thu Oct 29 02:55:01 +0000 2026", "replyCount": 4, "retweetCount": 1, "likeCount": 7, "conversationId": "2115638506987061483", "author": {"username": "indie_maker_fox", "name": "Fox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, "authorId": "1865299069092139008", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVxCAsFasAAaJX9.jpg", "width": 1200, "height": 600, "previewUrl": "https://pbs.twimg.com/media/HVxCAsFasAAaJX9.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-10-29T02:55:01+00:00", "createdAtBeijing": "2026-10-29T10:55:01+08:00", "createdAtLocal": "10-29 10:55 北京", "url": "https://x.com/indie_maker_fox/status/2115638506987061483", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2115638506987061483", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "MCode Stack 开源编程工作流与技能", "evidence": "约 17 个技能；主栈 stacks/ronny", "rationale": "提供工作流用途、安装方法与兼容限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2115749485280457056", "track": "growth", "source": {"id": "2115749485280457056", "text": "它比较值得借鉴的一点是把设计要求提前说清楚。比如一张页面只保留一个主要行动，按钮要让人知道点了会得到什么，不能只顾着做首屏，还得考虑加载、报错、空状态这些细节。\n\n对于能写产品、但不太擅长做介绍页的独立开发者，这份清单挺有参考价值。\n\n不过，它也带着作者很鲜明的审美偏好，比如限制字体、不用背景渐变，还要求加入特定的标语动画。\n\n直接照搬，可能只是从一种“AI 味”换成另一种统一风格。\n\n更合适的用法是读一遍，把需求梳理和检查流程留下，再把视觉规则改成自己的。\n\n小提醒：一些介绍里说它有两个技能，但截至 10 月 28 日，动画技能已经移出这个仓库，当前主要是落地页设计这一项。\n\n我更愿意把它当作一份可以修改的设计工作手册，而不是装上就能自动拥有好审美的插件。\n\n项目地址：https://t.co/a68pY3hgKn", "createdAt": "Thu Oct 29 10:16:00 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2115749483913035948", "inReplyToStatusId": "2115749483913035948", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-29T10:16:00+00:00", "createdAtBeijing": "2026-10-29T18:16:00+08:00", "createdAtLocal": "10-29 18:16 北京", "url": "https://x.com/sitinme/status/2115749485280457056", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2115749485280457056", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "落地页设计清单的取舍", "evidence": "一张页面只保留一个主要行动", "rationale": "提供行动按钮、状态检查及视觉规则取舍方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115794885169094677", "track": "growth", "source": {"id": "2115794885169094677", "text": "KOL Hunter迎来了第一个付费用户，我们是为了帮助更多的品牌方和MCN机构来筛选更加适配自己产品、以及数据不错的 X 博主。\n\n目前刚上线，数据库中以中文博主居多，在慢慢扩散到英语区和日语区的博主，帮助大家做全球市场，欢迎各大品牌方来试用：\n\nhttps://t.co/4G3pHiS3Ey https://t.co/PjxKhiLwnY", "createdAt": "Thu Oct 29 13:16:24 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 16, "conversationId": "2115794885169094677", "author": {"username": "AI_Jasonyu", "name": "鱼总聊AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1877193368725581824/7_ocNC-C_normal.jpg"}, "authorId": "756319701861601281", "quotedTweet": {"id": "2114712755290640530", "text": "兄弟们，我把 X 上 2.8 万条商单扒了一遍，做成了一个工具：https://t.co/FR62IS3YIL\n\n因为明天要出差去上海了，去之前，再三考虑，还是把这个折腾了好几个月的产品发布一下，虽然目前还不完美！\n\n起因很简单，我自己接商单这一年，发现品牌方找 X 博主基本靠感觉：看粉丝数、看别人推荐，至于博主接推广后数据到底怎么样，是否达到预期，很难说清楚，也几乎无法预测。\n\n所以我做了 KOL Hunter：\n\n它最大的特色就是根据博主的真实商单来做数据分析和匹配，有以下功能：\n\n1、粘贴你的产品链接，AI 自动分析产品，  "Releases 下载 APK（arm64 / Android 10+）", "rationale": "引文提供开源发布、安装条件与手机自动化能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1808138216585023490/xQ3u-b4x_normal.jpg"}, {"id": "2115748980298768669", "track": "enterprise", "source": {"id": "2115748980298768669", "text": "以后在公司里，你可能真的要向 AI 汇报工作了。\n\nOpenAI 最近发了篇《The Future of the Firm》，讨论 AI 会怎样改写公司组织架构，里面有几个设想挺大胆。作者提出了三种可能的形态：\n\n① 每个人都有自己的 AI 团队，普通员工也能管理一群 Agent。\n② AI 成为正式的团队成员，和人类一起承担工作。\n③ 最有意思的是，AI 进入管理层，夹在老板和员工之间，负责协调、监督和发现问题。\n\n比如文中设想，AI 扫完公司 Slack，发现销售承诺给客户的功能，研发根本没在做；于是主动提醒 CEO 推迟上线、调整人员，甚至把一位被忽略的工程师贡献也翻了出来。\n\n管理工作里确实有大量信息整理、进度跟踪和跨团队协调，这些恰好是 Agent 可以逐步接手的。\n\nAI 可能让员工摆脱层层汇报，获得更大的自主权；也可能让管理者随时掌握团队的每个细节，形成更精细的监控。\n\n至于未来 Agent 真正进入企业组织后，到底会让员工更自由，还是让管理变得更严密？这个问题我觉得挺值得讨论。\n\n原文：https://t.co/Ji7YK2COJF", "createdAt": "Thu Oct 29 10:14:00 +0000 2026", "replyCount": 3, "retweetCount": 2, "likeCount": 38, "conversationId": "2115748980298768669", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-29T10:14:00+00:00", "createdAtBeijing": "2026-10-29T18:14:00+08:00", "createdAtLocal": "10-29 18:14 北京", "url": "https://x.com/Xudong07452910/status/2115748980298768669", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2115748980298768669", "technicalRelevant": true, "dailyGrade": "C", "channel": "enterprise", "topic": "AI 参与企业组织的三种设想", "evidence": "作者提出了三种可能的形态", "rationale": "整理具体组织框架，但场景属于设想"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2115660854725382156", "track": "agent", "source": {"id": "2115660854725382156", "text": "统一回复一下，相对于其他产品，我这个是手机端中的 GUI，不是 TUI，所以更 mobile native。\n\n而且在电脑上是原生的 herdr TUI，回到手机上就自动变成了 GUI，因为我觉得 TUI 在电脑上操作交互什么的还算比较符合常识，但是不适合在手机上操作，所以就诞生了这个，这样的话你既不需要改变你在电脑上的操作体验，又可以在手机上用原生的移动端体验。", "createdAt": "Thu Oct 29 04:23:49 +0000 2026", "replyCount": 23, "retweetCount": 1, "likeCount": 90, "conversationId": "2115660854725382156", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "quotedTweet": {"id": "2115516478254624914", "text": "可能大家都知道，我平时都用 Herdr 进行 Vibe Coding，出门在外的话，会在手机上用 uu 远程控制家里的电脑。但是通过远程来控制电脑中的 Herdr，需要不停放大缩小，以及文字和图片输入和查看图片输出都颇痛苦，整个操作体验不够 mobile native，所以我一直想着做一个手机端的 Herdr 客户端，然后就做出来了（目前只适配了 Claude Code）\n\n但是出门在外要打通内网需要一个 relay server，我心想 Alma 一直以来都自带端到端加密的 relay server，那我就把这个功能合并到 Alma iOS App 内部了。\n\n也就是说，现在 Alma iOS App 内部其实集成了一个完整功能的 Herdr 客户端，甚至还有远程桌面的功能。甚至还会自动判断你是否在同一个局域网中，如果是的话自动切换到内网连接，速度更快更丝滑，另外 relay server 也是端到端加密的，以后有时间打算把这个 Alma relay server 开源出来让大家自己搭建自己的 relay server！\n\n反正我舒服了😌", "createdAt": "Wed Oct 28 18:50:07 +0000 2026", "replyCount": 199, "retweetCount": 72, "likeCount": 1028, "conversationId": "2115516478254624914", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115516174419247104/img/OA8UweLjBWiGyv2W.jpg", "width": 944, "height": 2048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115516174419247104/img/OA8UweLjBWiGyv2W.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115516174419247104/vid/avc1/1770x3840/OvcsKsx3-04vvjrF.mp4?tag=29", "durationMs": 53984}]}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "yetone", "role": ", "topic": "ChatGPT订户API额度申领信息", "evidence": "额度按账单周期发放，用不完不结转", "rationale": "提供开发额度、申领条件及使用限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2115856411439575386", "track": "tools", "source": {"id": "2115856411439575386", "text": "OpenAI 即日起把 ChatGPT Pro 各档和 Business Premium 的用量上限翻倍，原定明天的 Pro 200 降额取消，价格没提变化\n\nTibo 说，Pro 100、Pro 200、Pro 500 三档和 Business Premium 的所有用量上限翻倍，当天生效。Plus 不在名单里。\n\n【我现在能用多少】\n\n按 OpenAI 此前公布的倍数推算（以 Plus 为 1 倍）：Pro 100 从 5 倍变成 10 倍，Pro 500 从 25 倍变成 50 倍。Business Premium 是 Business 套餐里的高级席位，此前倍数官方没公开，只知道翻倍。\n\nPro 200 要分两种人看。\n\n9 月 29 日前就订阅的老用户，原本 10 月 30 日起要从 20 倍降到 10 倍，现在不降了，Tibo 说你的 Codex 和 Work 用量“保持不变”，也就是继续 20 倍。\n\n9 月底之后新订阅的用户一直是 10 倍，翻倍后也到 20 倍。\n\n这样算下来，三档 Pro 每花 1 美元能用的量还是一样，买贵的不多送。帖子没提价格调整。\n\n【dot 的额度怎么算】\n\ndot 是 OpenAI 9 月底开发者大会发布的常驻 AI agent，有自己的云端电脑，能在后台长时间替你干活，Pro 和 Business Premium 送第一个。\n\n上线时 OpenAI 给了第一个月的加长额度，dot 的用量和你平时的套餐额度分开算。\n\n按 9 月 29 日上线算，一个月差不多到期，Tibo 说这个加长额度“暂时”继续给，dot 的用量也继续单独计算。“暂时”是多久，他没说。", "createdAt": "Thu Oct 29 17:20:53 +0000 2026", "replyCount": 33, "retweetCount": 1, "likeCount": 59, "conversationId": "2115856411439575386", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115850175868727621", "text": "Day 25/\n\nWe are doubling all usage limits for all Pro 100/200/500 tiers and Business Premium, effective today.\n\nWe heard your kind feedback and won’t be reducing usage limits for Pro 200, so your Work and Codex usage will stay the same. We’re also going to continue offering extended limits for dots for now, and usage of your dot will still continue to be separate from your default usage.\n\nAnd we'll of course also keep shipping better models and other efficiency improvements that increase your effective usa SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-10-29T09:55:01+00:00", "createdAtBeijing": "2026-10-29T17:55:01+08:00", "createdAtLocal": "10-29 17:55 北京", "url": "https://x.com/indie_maker_fox/status/2115744204278419901", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2115744204278419901", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Obsidian 图片压缩与自动上传流程", "evidence": "Zipic 先压图", "rationale": "给出压图、存储及插件配置的完整步骤"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2115839309374955974", "track": "enterprise", "source": {"id": "2115839309374955974", "text": "这次受邀去北京四中，给高中部的孩子上了一节“AI时代我们应该怎么学习”的选修课。\n\n结束后拍了一个视频，聊聊整个过程的感受。\n\n好久不拍口播了，准备重新捡起来。现在用 AI 剪辑配动效太方便了。 https://t.co/0VUB2gR7hC", "createdAt": "Thu Oct 29 16:12:56 +0000 2026", "replyCount": 2, "retweetCount": 1, "likeCount": 4, "conversationId": "2115839309374955974", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "quotedTweet": {"id": "2115426561319108916", "text": "今天非常荣幸受邀来到北京四中，给这里的高中生上了一节 AI 分享课，主题是「AI 时代，我们应该如何更好地学习」。\n\n整个活动下来，我的感触特别多。\n\n说实话，之前我一直有个疑问：对于高中生来说，这么早接触 AI，会不会有点太早了？\n\n而且在我过去的认知里，好多学校其实是比较排斥 AI 的，因为担心影响孩子的自主学习能力。\n\n但今天在北京四中，我看到了完全不一样的情况。\n\n首先，我上的这节课其实是学校的一门「AI 应用」选修课。也就是说，在学校层面，就是鼓励和支持学生们去拥抱 AI 的。\n\n其次，选了这门课的学生，对 AI 的使用热情和熟练程度都非常高，至少 WorkBuddy 基本人人都会用。\n\n课上我还准备了一个互动环节，让大家现场用 AI 做一些小工具。\n\n结果只用了 20 分钟，各种各样的小工具就被搓出来了，有抽奖的、音游的、背古诗词的等等。\n\n然后同学们还挨个上台展示，创意和思维都非常活跃。\n\n课后，我也私下跟一些同学聊了聊。\n\n有个同学跟我说，他现在才高一，但已经觉得自己接触 AI 太晚了。如果能再早一年接触 AI，他可能已经创造出更多东西了。\n\n我也好奇地问他们：「像你们这样会用 AI 的同学，在整个学校里大概占多少比例？」\n\n同学们反馈说，其实还不是很多。他们应该算是学校里使用 AI 比较多的一批学生了，其他大部分同学可能还处于会用豆包这类 AI 工具的阶段。\n\n然后我又问他们，学校老师对 AI 是什么态度？\n\n结果他们说，老师很鼓励大家使用 AI。\n\n比如国庆期间，老师布置的作业就鼓励大家用 AI 辅助分析解题思路，梳理解题逻辑。\n\n而且有些老师自己对 AI 的使用也非常深入。\n\n比如直接用 AI 做出带动画的交互式课件，甚至还有那种可以输入不同数字、公式，就能呈现不同图形的交互工具，用来给学生做课堂演示。\n\n也就是说，老师们自己就在积极探索怎么用 AI 改善教学。\n\n另外，让我印象比较深的还有一点：\n\n这些学生对于如何正确使用 AI，其实也是有边界意识的。\n\n虽然有些学生也会拿 AI 拍照答题，但至少今天课上的这些孩子，他们知道有些学习环节需要靠自己思考，不能完全依赖 AI。\n\n更多时候，他们想用 AI 做出一些好玩的东西、小工具，或者把自己的一些创意真正实现出来。\n\n很多过去靠他们自己很难办到的事情，现在借助 AI，已经可以亲手做出来了。\n\n所以今天这场分享，真的给我带来了很多感触。\n\n我看到了这些孩子对于 AI 的热情，也看到了优秀学校的老师们对于新技术的开放态度，以及主动拥抱 AI 的姿态。\n\n我觉得，这就是一所优秀学校对于时代前沿技术应该有的眼光。\n\n也希望未来能有更多学校跟上，让更多孩子有机会接触和使用 AI。", "createdAt": "Wed Oct 28 12:52:49 +0000 2026", "replyCount": 37, "retweetCount": 10, "likeCount": 138, "conversationId": "2115426561319108916", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuBO2ObAAALCez.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVuBO2ObAAALCez.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVuBO2Ra4AAg_uU.jpg", "width": 2048, "height": 1536, "previewUrl": "https://pbs.twimg.com/media/HVuBO2Ra4AAg_uU.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVuBO52a0AAWgYx.jpg", "width": 2048, "height": 1536, "previewUrl": "https://pbs.twimg.com/media/HVuBO52a0AAWgYx.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVuBO2KawAAhSg0.jpg", "width": 2048, "height": 1536, "previewUrl": "https://pbs.twimg.com/media/HVuBO2KawAAhSg0.jpg:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115838372271067136/img/vLLxj6GB_JNW49Ps.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115838372271067136/img/vLLxj6GB_JNW49Ps.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115838372271067136/vid/avc1/1080x1920/HD6rdWwPkUS5iRX_.mp4?tag=29", "durationMs": 248500}], "expert const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
