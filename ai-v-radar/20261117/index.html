const DATA={"records": [{"id": "2122266871827398881", "track": "agent", "source": {"id": "2122266871827398881", "text": "突然很想给大伙分享一下，我是怎么把家里的旧电脑旧手机和我的主力 Mac 搭建成一个非常好用 Agent 工作开发环境。\n\n换在去年，强迫症的我可能这些旧设备全部被我咸鱼出掉了，只留一台主力 Mac，恰逢今年开发的软件有 Mac、Windows、Linux、iPhone 后，这些设备给我帮助非常多。\n\n设备介绍\n\n主力机是一台黑色 Mac M5 Pro 48 GB 内存 1 T 版本，非常好用，今年购买，唯一后悔就是当时应该买 2T 版本的，写代码、签名公证、发版都在这个上面，也是我自己唯一使用的一台机器。\n\n测试机是一台 M2 Pro 32 GB 内存 512G 的机器，是我买M5之前一直在用的一台，后面放到了柜子里吃灰了几个月，刚好10月份在弄 Mole 的软件的测试，需要 Agent 帮我做大量的电脑操作工作，原先在主力机上，好比有一个人在抢我电脑的感觉，终于受不了了，把所有的测试工作全部让 Agent 迁移到了这台机器。\n\n然后这台 M2 测试机上，还插了我一台 iPhone SE3，使用 iPhone Use 和 镜像可以让 AI 非常好的去操作它，它主要承担妙言 iOS 版本的测试工作，以及新产品的一些各种手机测试，这里 Agent 还可以通过 WebDriverAgent 把手机屏幕读成一个个元素，再按标签去点，非常好用。\n\n不仅仅，这台测试机几乎被我利用到顶了，上面还用 Parallels 跑着一台 Windows 11 的 ARM 虚拟机，Mole for Windows 的 ARM64 版本就在这里测试的。\n\n然后还有一台 Windows ThinkPad X1 8 GB 内存，当时为了写 Mole Windows 时候去整的，拿来测真实的 x64 硬件，屏幕缩放、电池、SmartScreen 和 Defender 这些虚拟机里看不到的东西，包括 Windows 版本的发版验收都需要这台真实的 Windows 机器。\n\n为了更好利用到这台机器，我在它里面还安装了 Omarchy 的 Linux 虚拟机，用来测 Pake 在 Wayland 桌面上的表现，由于只有 8G，我尽量会让 Agent 一次任务只使用一个系统。\n\n最后还有一台 NAS 微主机，上面跑着一个 Debian 12 的容器，x86_64 8 核 31 GB，专门来跑 Linux 命令行、GNU 工具的差异和 Pake 的 deb、rpm 打包，Mac 上的 BSD sed 和 Linux 上的 GNU sed 很多写法不一样，都用这一台机器来兜底。\n\n我是怎么用它们来帮我测试的？\n\n还是强迫症不想让书桌有这么多东西，我把这些测试机器全部放到了次卧里柜子里去了，所有设备插好电，做好通风，然后设置屏幕亮度最低，设成了永不睡眠也不黑屏，不过我会隔半个月去把这些机器全部重启一下。\n\n首先我用他们来给我测试我的各种软件，我一直认为不管在什么时候，软件的发布应该是正式的，发布出来应该是稳定的，所有每次发布我会花费非常多的时间来自己测试，包括在自测之前会让 Agent 在真实的各种环境的机器上严格全部跑一遍，没有问题后，我再手工测试一遍，这样可以确保交到大伙手上的软件质量是过关的。\n\n为了防止 Agent 测界面的时候在我主力机上和我抢鼠标的问题，一旦它动鼠标、抢焦点、切窗口的时候，我就没法用电脑，很别扭，所以才有了上面的多设备组网，在10月底我把所有要控制鼠标的活全部挪到了测试机上，UI 测试、端到端测试、点系统授权弹窗，都在测试机器上做，主力机只负责构建，然后把包发过去。\n\nAgent 在测试机上操作并不是靠截图猜点击位置的，用的是自己写的两个很小的命令行工具，ax 走 macOS 的辅助功能接口，类似 ax tree \u003cpid>，可以把一个 App 窗口里的每个元素连同标识、文字和中心点坐标打成文本，然后可以很好的按标识去按按钮，也很准确，然后 input 用 CGEvent 发鼠标和键盘事件，专门处理辅助功能树按不到的东西，比如右键菜单、往搜索框里打字、按 Esc 关掉菜单。相当于测试机上的内容被我转换成了 Agent 更易于了解的文本上下文，只有在实在解决不了的时候才截图来看，其他时候都用这种方法会快很多。\n\n我是怎么用他们帮我来省钱的？\n\n最近3个月，我的 GitHub Action CI 的非常超了非常多，几乎每个月差不多 70 刀往上，有点肉疼了，当时给大伙发过一次如何提高在 GitHub Action 上 CI 的效率和成本，但是还是不彻底，因为对于私有仓库 GitHub 托管的 macOS runner 在是按十倍分钟计费，原生构建和测试特别烧钱。\n\n于是我在11月初，在测试机上给我那几个私有仓库里各挂了一个自托管的 runner，比如 Mole Mac 的 make verify 跑一次得 20多分钟，以及 Pake 跑 Mac 的测试也不快，还有妙言的 iOS 构建等等，全部迁移到本地测试机器上进行，当前这台 M2 测试机一共接了我将近 180 个 job，原来要花钱的地方由本地来承担了。\n\n这里为了更加节约效率，我还做了一个检查机制，先在 Ubuntu 上跑一个只要几秒钟的小 job，去 GitHub 问一下当前主分支这个提交有没有已经跑完的完整测试，有就直接结束，没有才把活派给测试机。\n\n不过这里有一个小坑，就是 CI 和 Agent 其实也在用一块屏幕，两边需要相互让着，我给做了一个「正在干活」的标记文件，Agent 每次通过脚本操作测试机，都会刷新这个文件，以及会区分是什么项目在用，比如 CI job 开始时先抢一个「CI 忙」的标记，用 noclobber 来创建，这样同一时刻只有一个能抢到，然后这里也有重试机制包括超时机制方便测试机可以在 24 小时不间断干活。\n\n然后对于 Agent 也会相互抢同一块屏幕，好在现在各个对话之间可以相互发消息，要用的时候，先检查有没有人在用，再用的时候对方会问一下大概什么时候释放，然后另外一个 Agent 就很老实等着快到时候的时候才去检查，等等，类似这些里面有非常多的小巧思很有意思，所以现在阻碍我测试效率的应该是机器还是太少了，哈哈，不够也够了。\n\n这样的好处还有什么？\n\n回来昨天我发的那个，我说这次出远门，甚至都没有带主力机，就拿了一个家人非常轻的 Air 完全够用，甚至我感觉远比带上主力机还要方便太多了，假如带上主力机，其实在路上、飞机上 这种移动位置，机器都是关的，啥事情也做不了，而且还容易更换国家位置导致 Claude 的一些不稳定，现在好比这些机器 24 小时都开着，一直在干活，一直在运转，反而现在卡点不在机器，而在我自己的注意力。\n\n不过我还是感觉做这些最终最终，应该是为了让我更轻松，效率更高，有更多时间去做自己想做的事情，而非全部 full time 扑倒上面，其实就有点本末倒置了，非常推荐大伙提高效率，留出时间来，做更多自己想做的非电脑干活的事情，这样生活才更有意思。\n\n身体健康 > 生活快乐 > 码代码快乐，虽然都非常重要，但是还是要有优先级，这样才有精力去追求一些代码之外的有意思的东西。", "createdAt": "Mon Nov 16 09:53:46 +0000 2026", "replyCount": 55, "retweetCount": 33, "likeCount": 510, "conversationId": "2122266871827398881", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXPOdKnbIAERIjt.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXPOdKnbIAERIjt.jpg:small"}], "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-16T09:53:46+00:00", "createdAtBeijing": "2026-11-16T17:53:46+08:00", "createdAtLocal": "11-16 17:53 北京", "url": "https://x.com/HiTw93/status/2122266871827398881", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2122266871827398881", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "多设备Agent测试与自托管CI实践", "evidence": "用 noclobber 来创建", "rationale": "详述跨平台测试、界面操作与资源互斥方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2122370561682907447", "track": "research", "source": {"id": "2122370561682907447", "text": "Parsing forms is a hard problem, whether with specialized OCR or frontier models.\n\nThere is no standardization across various form templates. There are multiple form elements (e.g. checkboxes, signatures, text fields) that need to be represented in various ways. A good parser needs to both extract empty/filled form values along with exact bounding boxes.\n\nWe’ve spent time carefully crafting a forms dataset within ParseBench-2. It consists of 600 pages from 244 government form templates across 30 countries, with 20K annotated fields (text, checkboxes, signatures).\n\nWe also designed a forms metric that’s weighted by severity policies, like the following:\n- Blank fields have to stay blank\n- Formatting changes cost nothing\n- A lost signature counts 5\n- A wrong number costs min 10\n\nDifferent form extraction use cases will prioritize different errors more, and we encourage you to tune your own severity policies for form parsing.\n\nMore details in our blog / tech report: https://t.co/xtgxfln8Wc\nBenchmark: https://t.co/PWczfhp0OX\nAvailable on Hugging Face! https://t.co/T1FLO2V2xd", "createdAt": "Mon Nov 16 16:45:48 +0000 2026", "replyCount": 14, "retweetCount": 2, "likeCount": 31, "conversationId": "2122370561682907447", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122370387505983488/img/laVaJJOfTq5QsvHC.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122370387505983488/img/laVaJJOfTq5QsvHC.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122370387505983488/vid/avc1/1920x1080/Z3UYA6kcJ6nyA-nv.mp4?tag=29", "durationMs": 57200}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-16T16:45:48+00:00", "createdAtBeijing": "2026-11-17T00:45:48+08:00", "createdAtLocal": "11-17 00:45 北京", "url": "https://x.com/jerryjliu0/status/2122370561682907447", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2122370561682907447", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ParseBench-2表单数据集与分级评测", "evidence": "600 pages from 244 government form templates", "rationale": "自述发布标注数据集，并给出错误严重度评测方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "无论使用专用 OCR 还是前沿模型，表单解析都是个难题。\n\n不同表单模板之间缺乏统一标准。表单包含多种元素（如复选框、签名、文本字段），需要以不同方式表示。好的解析器既要提取空白和已填写字段的值，也要给出精确的边界框。\n\n我们在 ParseBench-2 中精心构建了一个表单数据集，涵盖来自 30 个国家的 244 种政府表单模板，共 600 页，包含 2 万个已标注字段（文本、复选框、签名）。\n\n我们还设计了一项表单评估指标，根据错误严重程度赋予不同权重，例如：\n- 空白字段必须保持空白\n- 格式变化不扣分\n- 丢失一个签名扣 5 分\n- 一个数字出错至少扣 10 分\n\n不同表单提取场景对各类错误的重视程度不同，我们建议你根据自身需求调整表单解析的错误严重程度规则。\n\n更多详情见博客／技术报告：https://t.co/xtgxfln8Wc\n基准测试：https://t.co/PWczfhp0OX\n现已上线 Hugging Face！https://t.co/T1FLO2V2xd"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2122249961077153958", "track": "tools", "source": {"id": "2122249961077153958", "text": "DeepSeek 开源 chat-demo：用静态前端接上 App 同款搜索、读链接和语音\n\n11.13 DeepSeek 在官方 API 文档里宣布，把 App 中的联网搜索、文件解析、链接阅读、安全审核和语音等能力以 API 形式开放给开发者，并同时开源参考前端 chat-demo。开源三天，Star 已经超 3000 了！\n\n开源地址：\nhttps://t.co/EI6WyzAxhy\n在线体验：\nhttps://t.co/6BBnsOntJQ\n\n# 没有应用后端的参考客户端\n\n浏览器直接请求配置的 API，默认是 https://t.co/3FwgW6PKlb。可以在线试用，也可以从 Releases 下载压缩包后双击 index.html；本地开发需要 Node.js 22.12+ 和 pnpm。直接用本地文件打开时，浏览器和 API 都要允许 file:// 的存储和跨域。\n\n默认模型在代码里写死为 deepseek-flash。聊天走 Anthropic 兼容的 Messages / Files 接口，语音走独立的 ASR 和 TTS。多会话、消息分支、流式回答、深度思考、搜索引用、附件和朗读等，都是为了对齐官方 App 的体验。\n\n# 搜索和读链接在服务端完成\n\n客户端负责展示返回的内容块，并在下一轮把该回传的部分原样送回。阅读链接工具始终声明；是否加上 deepseek_web_search，由本地的智能搜索开关决定；深度思考对应 thinking。所有生成请求都固定带 safety_check: high，因此会走带服务端工具的那套协议。系统提示是一句固定身份说明：「该助手为 DeepSeek，由深度求索公司创造。」\n\n回传时，历史思考和搜索结果不再发送；只有成功读过的链接会带上 signature，供服务端恢复网页正文。若服务端给出安全拒绝，已经流下来的思考和正文要由客户端丢弃，只保留工具块。新对话若还没有标题，结束时会向服务端要一句自动标题。每轮还会插入 latest_reminder，内容是日期、星期、位置、Web 和界面语言，日期按浏览器本地时区计算。\n\nAPI Key 和设置存在 localStorage，会话和附件原件存在 IndexedDB。发送、上传和语音都会把相应内容交给 API；清空本地对话不会删除已经传到服务端的文件。历史导入导出用 ZIP，格式版本是 export_format_version: 3，可导入官方 DeepSeek 导出的记录；导入会替换全部本地会话。导出不含 API Key 和非图片附件原件，导入的回复也不能继续生成。", "createdAt": "Mon Nov 16 08:46:34 +0000 2026", "replyCount": 13, "retweetCount": 1, "likeCount": 17, "conversationId": "2122249961077153958", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXO_B4SXYAAHC9t.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXO_B4SXYAAHC9t.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-16T08:46:34+00:00", "createdAtBeijing": "2026-11-16T16:46:34+08:00", "createdAtLocal": "11-16 16:46 北京", "url": "https://x.com/shao__meng/status/2122249961077153958", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2122249961077153958", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "DeepSeek开放App能力与开源chat-demo解析", "evidence": "并同时开源参考前端 chat-demo", "rationale": "介绍工具发布并详解协议、存储和导入限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122331172806205442", "track": "enterprise", "source": {"id": "2122331172806205442", "text": "豆包工作 vs WorkBuddy：同一个模型干同一件活，谁更省钱？谁更好用？\n\n最近看到豆包工作支持第三方模型了，Kimi、GLM、DeepSeek 都能选。我一直在用的 WorkBuddy 也能选这些模型。\n\n那问题来了：同一个模型、干同一件活，哪边花钱更少，哪边做得更好？你们知道我一定手痒的😂 花了一个下午，两边一起跑了一遍。\n\n结果有一组把我看愣了：Kimi K3.1 Pro 分析同一份订单表，两边报告都是满分，豆包工作花了 0.13 元，WorkBuddy 花了 4.65 元，差了 37 倍。这一次就用掉了我WorkBuddy个人标准版套餐 积分的 6.6%。\n\n一、怎么测的\n版本：豆包工作标准套餐，WorkBuddy 个人标准版包月套餐\n两边手选同一个模型，发同一条提示词\n4 类任务：做公司介绍网页、写新能源汽车出海调研、分析电商订单表、做 PPT\n5 个模型：DeepSeek V4.1 Flash、Kimi K3.1 Pro、GLM 5.3 Flash、GLM 5.3、Kimi K3\n两边一共发起 34 次，交付 28 次\n花费按每次账单实扣，用两边套餐标价折成人民币；质量按同一张清单打分，满分 5 分\n\n二、先看结果：6 比 3\n能成对比较的 9 组里，豆包工作便宜 6 组，WorkBuddy 便宜 3 组。\n\n三、逐个模型看\nDeepSeek V4.1 Flash：豆包工作完胜\n豆包工作上是限时优惠 0.01×，我跑完的 5 次任务，账单全部显示免费，因为豆包工作还有一个优势机制，小额消耗还能免费，如此一来很多轻量任务还能省更多。同样的三类任务，WorkBuddy 按任务平均花了 0.16～0.33 元。\n做网页：豆包工作免费，质量还高 1 分\n写调研：豆包工作免费，质量分低 0.5 分\n分析订单表：豆包工作免费，质量打平\n\nKimi K3.1 Pro：差了 37 倍\n分析同一份订单表：\n豆包工作：扣 16.77 点，折 0.13 元，用时 8 分 39 秒\nWorkBuddy：扣 265.98 积分，折 4.65 元，用时 33 分 53 秒\n两边报告都是满分。\n\nGLM 5.3 Flash：WorkBuddy 赢两项，豆包工作质量更好\n三类任务各跑两轮，按有效结果取平均。\n写调研：豆包工作便宜一半（0.078 元对 0.159 元），但质量分低 1 分，它把比亚迪在布达佩斯的欧洲总部写成了乘用车工厂\n分析订单表：WorkBuddy 稍便宜（0.111 元对 0.128 元），豆包工作质量高 1 分\n做网页：WorkBuddy 更便宜（0.020 元对 0.105 元），豆包工作质量高 0.5 分\n\nGLM 5.3：WorkBuddy 赢\n分析订单表：豆包工作 2.27 元，WorkBuddy 0.74 元，WorkBuddy 质量还高 1 分。\n\nKimi K3：豆包工作便宜一点，WorkBuddy 做得更好\n做 PPT：豆包工作 2.86 元，交了 8 页；WorkBuddy 3.35 元，交了 11 页，风险和对策写得更完整，质量分高 1 分。\n\n四、钱是怎么算的\n按 11 月 13 日两边的套餐标价折算：\n豆包工作：标准套餐连续包月 68 元、9000 额度（含 3000 限时加赠），每点约 0.0076 元\nWorkBuddy 个人标准版：连续包月 70 元，单月购买 99 元。每月基础 2,000 积分，加上 2,000 限时加赠共 4,000 积分，按照连续包月每积分约 0.0175 元\n光看单价，WorkBuddy 每积分的价格是豆包工作每点的 2 倍多。\n\n五、几句实话\n两边都有超时没交付还照扣的😭 豆包工作 1 次，约 0.12 元；WorkBuddy 3 次，合计约 4.30 元。\nDeepSeek V4.1 Flash 的 0.01× 是限时优惠，不是长期价格。两边的限时加赠积分也都不是长期的。\nKimi K3.1 Pro、GLM 5.3、Kimi K3 这三组，两边各只有一次有效结果，单次会有波动。其中 Kimi K3.1 Pro 和 GLM 5.3 两组，WorkBuddy 那次是补测，没和豆包工作同时发起。\n\n另外，豆包工作目前小额积分消耗免费，很多低额度消耗都能0积分完成，叠加使用DeepSeek V4.1 Flash、豆包等\n0.01×特惠模型性价比会很高，推荐大家体验试试，也能节省不少费用。\n\n六、我的结论\n豆包工作的积分本身就便宜，同一个模型干同一件活，大多数时候豆包工作的账单更轻，9 组里便宜了 6 组。\n\n质量更要紧的活，比如写调研报告、做上会用的 PPT，我会两边都跑一遍再挑。", "createdAt": "Mon Nov 16 14:09:17 +0000 2026", "replyCount": 35, "retweetCount": 14, "likeCount": 40, "conversationId": "2122331172806205442", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122330983122997248/img/KHB5qhwytyQ31hO9.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122330983122997248/img/KHB5qhwytyQ31hO9.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122330983122997248/vid/avc1/1920x1080/-fM59azSV0Y_C_Lx.mp4?tag=29", "durationMs": 255248}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQI49DagAAZzwK.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/media/HXQI49DagAAZzwK.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQI6maaEAAQuiA.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/media/HXQI6maaEAAQuiA.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQI8ECbQAAqiUU.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/media/HXQI8ECbQAAqiUU.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-16T14:09:17+00:00", "createdAtBeijing": "2026-11-16T22:09:17+08:00", "createdAtLocal": "11-16 22:09 北京", "url": "https://x.com/servasyy_ai/status/2122331172806205442", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2122331172806205442", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "办公AI任务成本与质量对比实测", "evidence": "两边一共发起 34 次，交付 28 次", "rationale": "自述对照测试有成本、评分与样本限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2122185171965526089", "track": "research", "source": {"id": "2122185171965526089", "text": "TensorTonic「从第一性原理讲清评测」：同一模型换评分和配套，排行榜结论就可能翻转\n\n来自 @TensorTonic 的分享，作者先读了 Anthropic、OpenAI 和 Google DeepMind 的公开文章再写下看法，起草和核对数字时用了 AI。\n\n评的是模型和配套一起\n\n文中借用 Anthropic 今年 1 月的说法：完整记录是过程，结果是结束后的真实状态，两者经常对不上。订票助手可以说“已经订好了”，数据库里却没有订单；只看最后一句话，就会放过说谎的系统。评一个“智能体”，评的其实是模型加上它的配套（工具、提示词和循环），配套变好，分数同样会动。因此应当评真正要紧的结果，而不是预定路径。\n\nCORE-Bench 上，同一套 Claude Opus 4.5 起初只有 42%；换更宽松的运行框架，并修正过严评分、含糊说明和无法复现的题目后，到了 95%。更细的过程是，换到 Claude Code 后先到约 78%，再修评分才到 95%。框架变化本身就占了很大一块。\n\n多跑几次，还要看误差和规则\n\n模型输出不稳定，只跑一次意义不大。pass@k 是 k 次里至少成功一次的概率，适合可以多试几次再留下能过测试的补丁；pass^k 是 k 次全成功的概率，更适合直接面向用户的场景。单次成功率 75%、跑 3 次时，前者大约 98%，后者大约 42%。排行榜还常省略误差：500 道题、得分 80%，95% 区间大约在 76.5% 到 83.5%；另一模型得 82%，单看这两个数字还分不出谁更好。\n\nOpenAI 写过，多数基准只分对错，猜永远比说“我不知道”更划算。GPT-5 系统卡在 SimpleQA 上的数字是：旧的 o4-mini 只在 1% 的题上弃答，答对 24%，答错 75%；gpt-5-thinking-mini 弃答 52%，答对 22%，答错只有 26%。只看准确率，旧模型还略高一点，错得却大约是后者的三倍。分数只告诉你失败有多频繁，只有完整记录能分清，是模型错了，还是评分器把合理答案判错了。", "createdAt": "Mon Nov 16 04:29:07 +0000 2026", "replyCount": 17, "retweetCount": 0, "likeCount": 15, "conversationId": "2122185171965526089", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122045727274881072", "text": "Evals Explained, From First Principles", "createdAt": "Sun Nov 15 19:15:01 +0000 2026", "replyCount": 8, "retweetCount": 36, "likeCount": 390, "conversationId": "2122045727274881072", "author": {"username": "TensorTonic", "name": "TensorTonic", "profileImageUrl": "https://pbs.twimg.com/profile_images/2116623001546629120/KHQnPwUa_normal.jpg"}, "authorId": "1917184992616321024", "article": {"title": "Evals Explained, From First Principles", "previewText": "Whenever any frontier lab says its new model is better at coding, it means the model scored higher on some set of coding tasks graded in some particular way. When you change those tasks or infact, the", "titleZh": "从第一性原理理解模型评估", "previewTextZh": "每当前沿 AI 实验室声称新模型的编程能力更强，意思都是：模型在一组按特定方式评分的编程任务中取得了更高分。当你改变这些任务，或者实际上，改变……"}, "translationZh": "从第一性原理理解模型评估"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXOD8AqbAAA5wBk.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXOD8AqbAAA5wBk.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-16T04:29:07+00:00", "createdAtBeijing": "2026-11-16T12:29:07+08:00", "createdAtLocal": "11-16 12:29 北京", "url": "https://x.com/shao__meng/status/2122185171965526089", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2122185171965526089", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "模型与Agent评测的评分规则和统计方法", "evidence": "因此应当评真正要紧的结果，而不是预定路径", "rationale": "结合案例解释框架影响、成功率指标与误差"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122134420614455681", "track": "agent", "source": {"id": "2122134420614455681", "text": "发给Grok bot：\n\n我要做零基础______ 教学（例如：吉他 / 钢琴） 请帮我做一个「BiliPicks」风格的 B 站精选学习网站。\n\n参考项目（必须参考它的结构和交互）：\nhttps://t.co/NEC82QUS6Z\n\n选视频时用 Glasser的 TikHub B 站接口，第一次需要set up https://t.co/ByjpIRiB0K。\n\n【关卡】分 6 关，每关 3–4 条视频，从入门到完成一个小作品\n\n一、选视频\n- 用 Glasser 的 B 站搜索接口查，每关用 1–2 个关键词，只看第一页结果。\n- 每条入选视频都要查单个视频详情，核对 BV 号、UP 主名和 UID、时长、播放量、发布时间。\n- 有字幕就拉下来看，检查有没有硬广、卖课话术，或者不安全、不正确的做法。\n- 优先选：步骤完整、真人实操演示、面向新手、时长 3–20 分钟。\n- 排除：纯广告、合集搬运、超过 60 分钟的长合集、已注销账号。\n- 播放量只作参考，不能只凭标题和热度判断质量。\n- 拿不到的字段写「无」，不要编造。\n- 最后列出实际调用次数和 Glasser 扣费（以打印出的 Charge 为准，不要估算）。\n\n二、做网站（照着参考仓库的结构做）\n- 纯静态网站，不需要构建。\n- 每条视频写上：BV 号、标题、链接、UP 主和主页链接、所属关卡、推荐理由、注意事项、封面、时长（秒）。\n- 播放用 B 站官方嵌入播放器，只在清单里切换，不会连播到清单外的视频。\n- 闯关路线：每关有图标、名称、目标和一个小任务；看完可以打勾，进度存在 localStorage 里，用这个主题自己的前缀。\n- 三端都要能用：\n· 电脑\n· 手机、平板\n· 电视、投影仪\n\n三、交付\n做完后把静态文件发布到https://t.co/xYyvRTnPX1，给出可直接打开的永久网址。", "createdAt": "Mon Nov 16 01:07:27 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 2, "conversationId": "2122117695521075511", "inReplyToStatusId": "2122117695521075511", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-16T01:07:27+00:00", "createdAtBeijing": "2026-11-16T09:07:27+08:00", "createdAtLocal": "11-16 09:07 北京", "url": "https://x.com/MinLiBuilds/status/2122134420614455681", "themeId": "editorial", "signalScore": 50, "editorial": {"id": "2122134420614455681", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent 编排精选学习网站的完整提示词", "evidence": "每条入选视频都要查单个视频详情", "rationale": "提供选课核验、静态站交互及交付规范"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2122237485640229161", "track": "agent", "source": {"id": "2122237485640229161", "text": "Plannotator 接 Agent，可以想成三层。\n\n第一层是集成：用插件、hooks、命令或 MCP，告诉 Agent 什么时候打开审阅、怎么收回反馈。\n第二层是本地审阅：读计划或代码差异，开一个本地网页，把批注整理成文本或结构化结果。\n第三层是回传：把反馈交回给调用它的 Agent，或打到 CLI 标准输出。\n\n有个容易误会的点：你在终端自己跑 plannotator annotate plan.md，结果默认只打印到终端，并不会自动进任何一个已经打开的 AI 会话。\n\n要闭环，最好从已经接好的 Agent 里发起，或者让调用脚本显式读结果再传回去。\n\nClaude Code 和 Codex 也不一样。Claude Code 经典做法是卡在 ExitPlanMode，用 PermissionRequest hook 打开审阅；2.1.287 起默认可以开 Plannotator mod，先结束当前回合，审完再把决定送回来，不用一直占着一个等待中的调用。\n\n但官方也提醒：如果批准前自己退出 Plan Mode，Claude 仍可能开始改代码，所以别把它当成绝对安全闸门；可用 PLANNOTATOR_CLAUDE_MOD=0 回到经典模式。\n\nCodex 这边是实验性 Stop hook：回合结束后读会话、抽出最新计划再打开审阅。时点和 Claude Code 不同。\n\n原生 Windows 上 Codex hooks 还有额外限制，官方安装器不会自动启用，只会给出手工配置说明。\n\n项目地址：https://t.co/vXXfIrIJOq", "createdAt": "Mon Nov 16 07:57:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2122237484570755200", "inReplyToStatusId": "2122237485124342021", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-16T07:57:00+00:00", "createdAtBeijing": "2026-11-16T15:57:00+08:00", "createdAtLocal": "11-16 15:57 北京", "url": "https://x.com/sitinme/status/2122237485640229161", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2122237485640229161", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Plannotator 集成与反馈回传边界", "evidence": "结果默认只打印到终端", "rationale": "解释集成层次、回传机制及不同助手限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2122142922124759273", "track": "tools", "source": {"id": "2122142922124759273", "text": "用之前心里有数\n\n• gpt-image-2 的 Mode A 要装 Node、配自己的 API Key，出图按接口计费\n\n• kb-retriever 处理 PDF 和 Excel，要本机装好 pdftotext、pdfplumber、pandas\n\n• 模板数量文档里对不上：中文 README 写 18 大类、79 个，SKILL.md 写 80 多个，references 下实际是 17 个分类目录，以目录为准\n\n• web-design-engineer 的灵感来自 Claude Design，那份系统提示词原文放在 dist/prompt/ 下，想研究可以翻翻\n\n写在最后\n\ngarden-skills 的 6 个 Skill 里，跟写代码最贴的是两个。gpt-image-2 先用 check-mode.js 分清本地出图、委托宿主、只给提示词三种情况，没工具就老实交 prompt；kb-retriever 先读分层索引再局部检索，最多 5 轮，回答带出处。仓库里另几个 Skill 的硬 checkpoint，也是在给 Agent 立边界。\n\n限制也得说清：出图要自己的 Key 和 Node，查资料要先写好 data_structure.md、装齐 PDF 和 Excel 的处理工具，模板数量文档里还对不上。常让 Agent 配图、项目里文档又多的，这两个值得按需装上；自己写 Skill 的，翻翻它的模式探测和 checkpoint 写法，收获可能比装上还大。\n\n参考来源：\ngarden-skills 仓库：https://t.co/4WcONxWOn9", "createdAt": "Mon Nov 16 01:41:14 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2122142893355958717", "inReplyToStatusId": "2122142918228189657", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-16T01:41:14+00:00", "createdAtBeijing": "2026-11-16T09:41:14+08:00", "createdAtLocal": "11-16 09:41 北京", "url": "https://x.com/sitinme/status/2122142922124759273", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2122142922124759273", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "garden-skills 依赖与文档差异", "evidence": "references 下实际是 17 个分类目录", "rationale": "列出运行依赖、使用限制与文档不一致"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2122137576429490194", "track": "agent", "source": {"id": "2122137576429490194", "text": "Claude Code 其实自带两个给配置做体检的命令，如果你正在用 Fable 5.2，非常建议用这两个命令跑一遍。\n\n1. 「/doctor prompt-audit」会把整套配置扫一遍，包括 CLAUDE.md、AGENTS.md、skills、subagents 和 commands，找出那些为旧模型写的、已经过时或者互相矛盾的指令。需要 Claude Code v2.1.283 以上，也可以在后面加路径，只查某个文件或目录。直接跑「/doctor」查的是安装和权限，是另一回事。\n\n2. 「/claude-api prompt-audit [skill名]」用的是官方 claude-api skill，随 Claude Code 自带，适合对单个 skill 或 prompt 做深入检查。它会给一份标了文件和行号的报告，写清楚为什么过时、有多大把握，再附一份修改 diff。\n\n两个命令都只给建议，你确认之后才会改文件，可以放心跑。Peter 截图里有 65 个自建 skill 加 60 个插件 skill，审查拆给 5 个 reviewer 并行跑。\n\nskill 攒多了，很多还是给旧模型写的，到新模型上可能已经多余，甚至起反作用。每次升级模型后跑一遍，挺值得养成习惯。\n\n📎 https://t.co/mGH68dV3gX", "createdAt": "Mon Nov 16 01:20:00 +0000 2026", "replyCount": 13, "retweetCount": 9, "likeCount": 54, "conversationId": "2122137576429490194", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2121649295950762363", "text": "Two very useful prompts to try with Fable 5.2:\n\n\"/doctor prompt-audit\": Audits your Claude Code setup (Claude md, skills, commands) and proposes fixes.\n\n\"/claude-api prompt-audit [skill name]\": Audits one skill in depth.\n\nI wish Claude Code auto-suggested running these every time Anthropic releases a new model.\n\n📌 Watch my full tutorial on how I use Fable and Opus here: https://t.co/slyEbWvvqA", "createdAt": "Sat Nov 14 16:59:45 +0000 2026", "replyCount": 70, "retweetCount": 27, "likeCount": 592, "conversationId": "2121649295950762363", "author": {"username": "petergyang", "name": "Peter Yang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1454103621516206083/_klMwpkk_normal.jpg"}, "authorId": "84490044", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXGcyp1bsAAefPe.jpg", "width": 1200, "height": 741, "previewUrl": "https://pbs.twimg.com/media/HXGcyp1bsAAefPe.jpg:small"}], "translationZh": "两个非常实用的提示词，可以在 Fable 5.2 中试试：\n\n\"/doctor prompt-audit\"：审查你的 Claude Code 配置（Claude md、技能、命令），并提出修复建议。\n\n\"/claude-api prompt-audit [skill name]\"：深入审查某个技能。\n\n希望每次 Anthropic 发布新模型时，Claude Code 都能自动建议运行这两条命令。\n\n📌 完整教程在这里，看看我如何使用 Fable 和 Opus：https://t.co/slyEbWvvqA"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-16T01:20:00+00:00", "createdAtBeijing": "2026-11-16T09:20:00+08:00", "createdAtLocal": "11-16 09:20 北京", "url": "https://x.com/Xudong07452910/status/2122137576429490194", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2122137576429490194", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Claude Code配置与提示词审计方法", "evidence": "/doctor prompt-audit", "rationale": "给出两个审计命令、版本要求和报告用途"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122168824065929602", "track": "agent", "source": {"id": "2122168824065929602", "text": "DeepSeek-v4.1-Flash FP8 thinking=high on 4x RTX6k pro: single-stream 500~700 tps! 40 hours hillclimbing with Gemini4-Carbon, 1B total tokens. Many ridiculous tps reports from wild have thinking off, (bc thinking is an enemy of speculative decoding) and test on high deterministic task. This one is pretty solid, going to be my daily productivity. Can we reach 1000tps tho?", "createdAt": "Mon Nov 16 03:24:10 +0000 2026", "replyCount": 2, "retweetCount": 2, "likeCount": 44, "conversationId": "2122168824065929602", "author": {"username": "hxiao", "name": "Han Xiao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, "authorId": "28969465", "quotedTweet": {"id": "2121655047994081636", "text": "gemini-4-carbon hillclimbing kernel for 15h in a simple RSI loop, with a basic binary reviewer nudges its progress (e.g. met the goal/not yet).\n1. no safeguard triggered, really make meaningful progress\n2. turns are evenly distributed over last 15h, about 3h per turn, no procrastination or short turns (https://t.co/LyIx7ZHS73) \n3. a bit slow, on avg 80tps, even unstable with some retry connections\n4. if you read the summarized thoughts given by gemini-4-carbon, a lot of \"im super excited/thrilled\" when RSI just started, feels like carbon was trained to have a happy mood on every small progress, but as hillclimbing goes deeper, the happy mood is gone... and it becomes \"I'm now hit with a sobering reality check...\"", "createdAt": "Sat Nov 14 17:22:36 +0000 2026", "replyCount": 19, "retweetCount": 22, "likeCount": 553, "conversationId": "2121655047994081636", "author": {"username": "hxiao", "name": "Han Xiao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, "authorId": "28969465", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXGaJ9vbMAAUXOH.jpg", "width": 1176, "height": 1460, "previewUrl": "https://pbs.twimg.com/media/HXGaJ9vbMAAUXOH.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXGdBiKaQAAJBEA.jpg", "width": 1234, "height": 772, "previewUrl": "https://pbs.twimg.com/media/HXGdBiKaQAAJBEA.jpg:small"}], "translationZh": "让 gemini-4-carbon 在一个简单的 RSI 循环中对内核进行爬山优化，持续了 15 小时，并用一个基础的二元评审器推动进展（例如：已达标／尚未达标）。\n1. 没有触发任何安全防护，确实取得了实质进展。\n2. 过去 15 小时内，各轮耗时均匀，每轮约 3 小时，没有拖延，也没有草草结束的轮次（https://t.co/LyIx7ZHS73）。\n3. 速度有点慢，平均 80 tokens/秒，连接也有些不稳定，需要重试。\n4. 如果你读过 gemini-4-carbon 给出的思考摘要，会发现 RSI 刚开始时，它经常说“我超级兴奋／激动”。感觉 carbon 被训练得每取得一点进展就很开心，但随着爬山优化不断深入，这种开心逐渐消失了……变成了“现实给了我当头一棒，让我清醒了……”"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXN1S49aQAAkE8w.jpg", "width": 1246, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXN1S49aQAAkE8w.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXN1S43bsAAkHUv.jpg", "width": 2048, "height": 754, "previewUrl": "https://pbs.twimg.com/media/HXN1S43bsAAkHUv.jpg:small"}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "肖涵 Han Xiao", "role": "模型、研究与推理实践与观察", "why": "有端侧检索、ANE/GPU 对比与资源取舍，兼顾研究和真实产品。", "handle": "hxiao"}, "createdAtIso": "2026-11-16T03:24:10+00:00", "createdAtBeijing": "2026-11-16T11:24:10+08:00", "createdAtLocal": "11-16 11:24 北京", "url": "https://x.com/hxiao/status/2122168824065929602", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2122168824065929602", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "模型迭代优化推理内核的自测报告", "evidence": "40 hours hillclimbing", "rationale": "交代硬件、耗时与评审循环，吞吐属自测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "DeepSeek-v4.1-Flash FP8 在 4 张 RTX6k pro 上以 thinking=high 运行：单流达到 500～700 tokens/秒！用 Gemini4-Carbon 做了 40 小时爬山优化，总计消耗 10 亿 tokens。网上很多夸张的速度报告都关闭了思考（因为思考不利于推测解码），而且测试的是确定性很高的任务。这次的结果相当扎实，我准备拿它当日常生产力工具。不过，能冲到 1000 tokens/秒吗？"}, "avatar": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, {"id": "2122411451092807926", "track": "tools", "source": {"id": "2122411451092807926", "text": "Announcing Perplexity Monitor: an API that lets you track any event or topic or changes to webpages and set up webhooks to update you. Costs a $1 for 1000 runs.", "createdAt": "Mon Nov 16 19:28:17 +0000 2026", "replyCount": 46, "retweetCount": 10, "likeCount": 202, "conversationId": "2122411451092807926", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2122408441042149853", "text": "Today we're introducing the Perplexity Monitor API.\n\nMonitor API tracks new developments on a topic or changes to specific pages on a schedule, then sends relevant updates to your application through webhooks.\n\nAvailable now at $1/1k runs or URLs fetched.\n\nhttps://t.co/vDf51RZGfz https://t.co/NhIiKbnzpe", "createdAt": "Mon Nov 16 19:16:19 +0000 2026", "replyCount": 10, "retweetCount": 11, "likeCount": 129, "conversationId": "2122408441042149853", "author": {"username": "perplexitydevs", "name": "Perplexity Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/1902407947008819200/oNj7Lt2O_normal.png"}, "authorId": "1902403003887284224", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRPOnrbwAEZKFB.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HXRPOnrbwAEZKFB.jpg:small"}], "translationZh": "今天，我们正式推出 Perplexity Monitor API。\n\nMonitor API 会按计划追踪某个话题的新进展或指定页面的变化，再通过 webhook 将相关更新发送到你的应用。\n\n现已开放使用，每运行 1000 次或抓取 1000 个 URL 收费 1 美元。\n\nhttps://t.co/vDf51RZGfz https://t.co/NhIiKbnzpe"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-16T19:28:17+00:00", "createdAtBeijing": "2026-11-17T03:28:17+08:00", "createdAtLocal": "11-17 03:28 北京", "url": "https://x.com/AravSrinivas/status/2122411451092807926", "themeId": "editorial", "signalScore": 83, "editorial": {"id": "2122411451092807926", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Perplexity Monitor API 发布", "evidence": "Costs a $1 for 1000 runs.", "rationale": "发布定时监测与回调接口，提供明确价格"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "推出 Perplexity Monitor：一个可追踪任何事件、话题或网页变化的 API，还能设置 webhook 向你推送更新。每运行 1000 次收费 1 美元。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2122353569903128921", "track": "research", "source": {"id": "2122353569903128921", "text": "Announcing Perplexity Frontier Research. We are committing at least 10,000 GPUs to work on multi-agent orchestration and continual learning systems with the goal of building an automated researcher. We will publish evals, papers, blogs and open source our models and tooling. We’re actively hiring!", "createdAt": "Mon Nov 16 15:38:17 +0000 2026", "replyCount": 116, "retweetCount": 104, "likeCount": 1022, "conversationId": "2122353569903128921", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2122352071295009156", "text": "Today we're launching Perplexity Frontier Research.\n\nThe goal of Perplexity Frontier Research is to create a system that can perform autonomous research.\n\nThe work will focus on multi-agent orchestration, reinforcement learning, continual learning, systems, and pre-training.\n\nWe will develop algorithms, models, and evaluations, released openly, and tested in Perplexity products. Our work will be supported by more than 10,000 GPUs.\n\nThe Frontier Research team will regularly publish papers, models, data, and benchmarks.\n\nWe're actively hiring researchers and engineers for Perplexity Frontier Research in San Francisco, Palo Alto, New York, and London.\n\nhttps://t.co/QjaWJ0vrpI", "createdAt": "Mon Nov 16 15:32:19 +0000 2026", "replyCount": 97, "retweetCount": 92, "likeCount": 841, "conversationId": "2122352071295009156", "author": {"username": "perplexity_ai", "name": "Perplexity", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009310641165660160/XArF3_Ib_normal.jpg"}, "authorId": "1599587232175849472", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122352040081063936/img/kFuXC3fme4SN2o1y.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122352040081063936/img/kFuXC3fme4SN2o1y.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122352040081063936/vid/avc1/1920x1080/iiSyxg-56dmvvnDs.mp4?tag=16", "durationMs": 12000}], "translationZh": "今天，我们正式推出 Perplexity Frontier Research。\n\nPerplexity Frontier Research 的目标是创建能够自主开展研究的系统。\n\n研究将聚焦于多智能体编排、强化学习、持续学习、系统和预训练。\n\n我们将开发算法、模型和评测，公开发布，并在 Perplexity 产品中进行检验。超过 10,000 块 GPU 将为研究提供支持。\n\nFrontier Research 团队将定期发布论文、模型、数据和基准测试。\n\n我们正在旧金山、帕洛阿尔托、纽约和伦敦积极招聘研究员和工程师，加入 Perplexity Frontier Research。\n\nhttps://t.co/QjaWJ0vrpI"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-16T15:38:17+00:00", "createdAtBeijing": "2026-11-16T23:38:17+08:00", "createdAtLocal": "11-16 23:38 北京", "url": "https://x.com/AravSrinivas/status/2122353569903128921", "themeId": "editorial", "signalScore": 91, "editorial": {"id": "2122353569903128921", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Perplexity 自主研究项目启动", "evidence": "at least 10,000 GPUs", "rationale": "宣布研究计划与算力投入，尚非研究成果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "正式推出 Perplexity Frontier Research。我们将投入至少 10,000 块 GPU，研究多智能体编排和持续学习系统，目标是打造自动化研究员。我们将发布评测、论文和博客，并开源模型与工具。正在积极招聘！"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2122151997184880822", "track": "research", "source": {"id": "2122151997184880822", "text": "等了几天预告，Qwen4-Max 终于发布，看完官方的对比图有点失望。\n\n自己选的 16 项榜单只拿了 4 项第一，大多还是小幅领先。agent 写代码最关键的 Terminal-Bench 和 ProgramBench 被 Opus 5.5 和 Kimi K3.1 甩开一大截，对比名单里也没敢放 Fable 5.2。\n\n比上一代确实进步不小，价格也更便宜，但离最前沿还有距离。期待后面开源的小尺寸 Qwen4 能带来惊喜吧。\n\n📎 https://t.co/GXQdBSKhDl", "createdAt": "Mon Nov 16 02:17:18 +0000 2026", "replyCount": 17, "retweetCount": 4, "likeCount": 41, "conversationId": "2122151997184880822", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2122148127520289151", "text": "📢 Meet Qwen4-Max, your new AI teammate for work, creativity, and discovery!\n\nQwen4-Max is built on a new MoE architecture with native vision and a 1M-token context window.\n\nHighlights:\n- Outperforms Qwen3.8-Max with up to ~50% fewer tokens, while average cost per task drops over 60% in our internal evaluation.\n- Advances real-world productivity through greater proficiency with professional tools, stronger long-horizon execution, and higher-quality deliverables.\n- Handles real tasks, including 3D modeling, game development, manufacturing, finance, law, healthcare, and frontier scientific discovery.\n- $1.5/M tokens for input, $4.5/M tokens for output, and $0.075/M tokens for implicit caching — all lower than Qwen3.8-Max, with implicit caching down by 70%.\n\nThe API is live on QwenCloud. You can also try Qwen4-Max on Qwen Studio, QwenWork and Qoder. \n\nStart building today! 🚀\n- Blog: https://t.co/AuiWxugjE6\n- API: https://t.co/aS1QEkS8nu\n- Token Plan: https://t.co/YRvcGdB9Bv\n\nMore to come! The open weights of smaller Qwen4 models will be released. Stay tuned. 👀", "createdAt": "Mon Nov 16 02:01:55 +0000 2026", "replyCount": 756, "retweetCount": 1500, "likeCount": 13890, "conversationId": "2122148127520289151", "author": {"username": "Alibaba_Qwen", "name": "Qwen", "profileImageUrl": "https://pbs.twimg.com/profile_images/2064231947149377536/Ab70PxT5_normal.jpg"}, "authorId": "1753339277386342400", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXNgxQIaEAAHHwZ.jpg", "width": 2048, "height": 1366, "previewUrl": "https://pbs.twimg.com/media/HXNgxQIaEAAHHwZ.jpg:small"}], "translationZh": "📢 认识 Qwen4-Max，你在工作、创作和探索中的全新 AI 队友！\n\nQwen4-Max 采用全新 MoE 架构，具备原生视觉能力和 100 万 token 的上下文窗口。\n\n亮点：\n- 内部评测显示，表现超越 Qwen3.8-Max，token 用量最多减少约 50%，每项任务的平均成本降低超过 60%。\n- 更熟练地使用专业工具，更强地执行长程任务，交付更高质量的成果，提升实际工作效率。\n- 能处理 3D 建模、游戏开发、制造、金融、法律、医疗和前沿科学发现等领域的实际任务。\n- 输入价格为每百万 token 1.5 美元，输出为每百万 token 4.5 美元，隐式缓存为每百万 token 0.075 美元，均低于 Qwen3.8-Max，其中隐式缓存价格降低 70%。\n\nAPI 已在 QwenCloud 上线。你也可以在 Qwen Studio、QwenWork 和 Qoder 中体验 Qwen4-Max。\n\n即刻开始构建！🚀\n- 博客：https://t.co/AuiWxugjE6\n- API：https://t.co/aS1QEkS8nu\n- Token Plan：https://t.co/YRvcGdB9Bv\n\n更多精彩即将到来！较小规模 Qwen4 模型的权重也将开放，敬请期待。👀"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-16T02:17:18+00:00", "createdAtBeijing": "2026-11-16T10:17:18+08:00", "createdAtLocal": "11-16 10:17 北京", "url": "https://x.com/Xudong07452910/status/2122151997184880822", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2122151997184880822", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Qwen4-Max发布与榜单比较", "evidence": "自己选的 16 项榜单只拿了 4 项第一", "rationale": "含模型发布参数、定价及榜单分析，属来源自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122250042656636982", "track": "creative", "source": {"id": "2122250042656636982", "text": "多层立体剪纸 × 二次元角色重构 × 收藏级纸雕艺术。\n\n将经典二次元角色转译为层层堆叠的立体纸雕，发丝、衣褶、武器与专属场景都拥有真实纸张厚度和层间光影。\n\n保留角色标志性配色，用精密切边、浮雕纹理与层叠空间，打造仿佛能从画面中跃出的幻想角色海报。\n\n提示词支持角色名一键替换，自动适配人物造型与专属世界观。\n\n---\n提示词：\n9:16竖版，单张独立高完成度立体剪纸二次元角色插画。\n\n画面主体为角色 {角色名}，准确保留该角色最具辨识度的核心视觉特征，包括发型、发色、眼睛特征、面部气质、服装轮廓、标志性配饰、代表性道具、经典配色以及角色整体身份感，使观者能够第一眼识别角色。\n\n在保持角色原始辨识度的基础上，将人物完整转译为高级 layered paper-cut anime illustration / multilayer paper sculpture anime art / 多层立体纸雕二次元插画 风格。\n\n【整体纸雕风格】\n\n人物与背景全部由多层精致切割纸片逐层叠加形成。\n\n头发、面部轮廓、眼睛、睫毛、服装结构、衣料褶皱、饰品、武器、纹样、能量元素以及背景场景，都具有清晰明确的纸雕分层关系。\n\n每一层纸片都具有：\n\n真实纸张厚度，\n清晰利落的切割边缘，\n细腻自然的纸张纤维纹理，\n轻微的表面压纹与纸质肌理，\n稳定自然的层间投影，\n明确的前景、中景、背景纵深关系。\n纸层之间必须存在真实遮挡与投影变化，靠近纸层接缝处具有适度加深的阴影，使人物呈现明显的立体浮雕效果。\n整体效果应类似高级手工纸雕艺术、精品纸艺装置、收藏级立体插画与精致二次元角色设计的结合。\n不要普通平面拼贴感，不要塑料模型感，不要树脂手办质感，不要普通3D渲染感。\n【人物设计】\n画面仅出现一名角色。\n\n人物位于画面主要视觉中心，采用半身、七分身或近全身构图，根据角色自身造型自动选择最合适的展示范围。\n\n人物姿态自然、优美、有角色性格，不使用僵硬标准站姿。\n\n人物表情、眼神与身体语言应符合角色本身的身份和性格，例如冷静、优雅、温柔、神秘、威严、活泼、孤高、危险或神圣感。\n\n人物面部保持精致高级二次元审美：\n\n五官清晰，\n脸型自然协调，\n眼睛具有角色自身特征，\n面部结构干净，\n避免过度幼态，\n避免Q版比例，\n避免夸张萌系大头。\n\n头发使用多层剪纸结构表现。\n\n不同发束具有前后层级，部分发梢与发丝形成精致装饰性切纸轮廓，使发型兼具二次元流动感与纸雕设计感。\n\n服装必须保留角色原有设计逻辑。\n\n衣领、袖口、裙摆、披风、腰带、装甲、饰品、纹样与装饰结构，通过不同厚度和层级的纸片表现，不将复杂服装简化为普通色块。\n\n【场景与角色主题自动延展】\n背景根据角色自身世界观、属性、职业、阵营、能力、地域文化或视觉符号自动生成相匹配的立体纸雕舞台。\n场景不是普通写实背景，而是围绕角色建立具有收藏卡、舞台装置、立体纸剧场感的层叠空间。\n可根据角色特点自动选择和组合：\n花朵，\n树叶，\n花瓣，\n月亮，\n太阳，\n星轨，\n云层，\n雾气，\n水波，\n雪花，\n冰晶，\n火焰，\n羽毛，\n蝶群，\n建筑轮廓，\n拱门，\n窗框，\n神殿，\n鸟居，\n城堡，\n机械结构，\n徽记，\n家族纹章，\n幻想图腾，\n魔法阵，\n能量轨迹，\n武器剪影，\n角色代表性符号。\n这些元素必须围绕人物形成前景、中景、远景的分层环绕关系。\n避免全部元素贴在同一平面。\n\n画面可以使用圆形、拱形、花窗、月轮、徽章、建筑框架或纸雕舞台结构形成视觉包围，但不能遮挡人物核心面部和重要角色特征。\n\n【构图与空间】\n\n9:16竖版。\n\n单人主体。\n\n人物为绝对视觉中心。\n\n整体构图稳定、精致、具有海报级完成度。\n\n人物周围保留适量呼吸空间，不将装饰元素全部塞满画面。\n\n前景允许出现少量大型纸雕元素制造景深，例如花瓣、树叶、能量碎片、云层、羽毛或武器局部。\n\n人物位于中景核心层。\n后方通过角色主题建筑、纹章、月轮、图腾、能量结构或自然景物建立纵深。\n强调多层纸雕之间真实的空间距离。\n禁止所有纸层都紧贴在一起。\n禁止背景元素密集堆砌导致人物不突出。\n【色彩控制】\n色彩严格以角色原本的代表色为基础，不随意改变角色经典配色。\n建立清晰的：\n主色，\n辅色，\n中性色，\n高光色，\n点缀色。\n画面必须拥有明确的深、中、浅三级色阶。\n不要为了体现“通透”而将整个画面全部提亮。\n不要将角色主色全部转化成浅色或粉彩色。\n整体曝光保持正常偏明亮，但禁止高调过曝。\n亮部保持干净，但必须保留细节。\n暗部必须存在，但不死黑。\n中间调必须丰富。\n画面约保留30%–40%的中深色视觉区域，用于建立角色重量感、背景纵深以及纸雕层级。\n深色区域优先使用角色自身适配的深色，例如：\n深紫，\n靛蓝，\n墨蓝，\n深红，\n深绿，\n炭黑，\n暗棕，\n暗青。\n具体颜色根据角色主题自动匹配。\n浅色纸层主要用于：\n面部，\n局部服装，\n花朵，\n装饰边缘，\n局部高光，\n少量背景留白。\n禁止奶白、浅紫、粉色或浅蓝覆盖整个画面。\n禁止整张图出现统一浅色滤镜。\n禁止大面积泛白。\n禁止白雾感。\n禁止空气透视把所有暗部洗掉。\n最终色彩效果应为：\n\n鲜活，\n干净，\n通透，\n高级，\n有深浅变化，\n有视觉重量，\n有纸艺收藏感。\n\n实现：\n\n明亮但不发白，鲜艳但不荧光，通透但有暗部，轻盈但不失重量，华丽但不俗艳。\n\n【纸雕阴影与立体感】\n\n纸雕层与层之间必须存在清晰但自然的阴影。\n\n阴影来自真实纸片遮挡关系，而不是普通绘画阴影。\n\n每一层纸片边缘产生轻微柔和投影。\n\n越靠近前景的纸层，阴影越明显。\n\n越靠近背景，阴影越柔和。\n\n部分大型纸层可产生较明显的投影，使画面具有真实手工纸雕装置的空间感。\n\n禁止将所有暗部提亮。\n\n禁止消除接缝阴影。\n\n禁止让纸层之间失去厚度。\n\n人物脸部保持柔和干净，不能出现重阴影脏脸。\n\n【发光与能量控制】\n\n如果角色具有魔法、雷电、火焰、冰霜、神力、能量、光环或特殊武器效果，只允许作为局部视觉焦点。\n\n发光区域总面积控制在画面的约5%–10%。\n\n发光位置优先集中于：\n\n武器，\n眼睛，\n角色纹章，\n能量轨迹，\n少量轮廓边缘，\n核心装饰。\n禁止整个人物发光。\n禁止整个背景发光。\n禁止大面积紫光、蓝光、粉光覆盖角色皮肤和服装。\n禁止Bloom过强。\n\n禁止高光溢出。\n\n发光区域周围仍然必须保留纸张纹理与切割边缘。\n\n【材质表现】\n\n纸张材质必须可辨认。\n\n使用高级厚卡纸、棉质艺术纸、轻纹理手工纸、细纤维纸张的综合质感。\n\n不同纸层允许存在非常轻微的纹理差异。\n\n部分角色服装可通过：\n\n压纹，\n浮雕纹，\n细小金边纸，\n珠光纸，\n半哑光纸，\n\n模拟原角色复杂材质。\n\n但整体必须保持纸张属性。\n不能变成金属模型。\n不能变成塑料。\n不能变成陶瓷。\n不能变成树脂手办。\n【画面质感】\n高完成度，\n高级二次元美术，\n收藏级角色插画，\n精品纸雕艺术，\n精致纸张纹理，\n细腻剪纸边缘，\n真实纸层厚度，\n清晰纵深，\n柔和自然阴影，\n视觉中心明确，\n复杂但不杂乱，\n华丽但克制，\n鲜活但不浮夸。\n最终效果应像一张可以被制作成实体立体纸雕装裱作品的高级二次元角色艺术图。", "createdAt": "Mon Nov 16 08:46:54 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 8, "conversationId": "2122250042656636982", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXO_A1BacAEcM_k.jpg", "width": 941, "height": 1671, "previewUrl": "https://pbs.twimg.com/media/HXO_A1BacAEcM_k.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXO_CczbEAAvcAT.jpg", "width": 941, "height": 1672, "previewUrl": "https://pbs.twimg.com/media/HXO_CczbEAAvcAT.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXO_D7HbYAAdtyt.jpg", "width": 941, "height": 1672, "previewUrl": "https://pbs.twimg.com/media/HXO_D7HbYAAdtyt.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXO_E_mbYAA0EsB.jpg", "width": 941, "height": 1672, "previewUrl": "https://pbs.twimg.com/media/HXO_E_mbYAA0EsB.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-16T08:46:54+00:00", "createdAtBeijing": "2026-11-16T16:46:54+08:00", "createdAtLocal": "11-16 16:46 北京", "url": "https://x.com/liyue_ai/status/2122250042656636982", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2122250042656636982", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "二次元角色立体纸雕提示词", "evidence": "提示词支持角色名一键替换", "rationale": "提供完整可复用提示词，细化分层、配色与材质约束"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2122294107691479081", "track": "tools", "source": {"id": "2122294107691479081", "text": "你有没有发现，AI 写前端经常有一种“代码能跑，但写法有点老”的感觉？\n\n做个弹窗，先写一堆遮罩、键盘监听和焦点管理；做个滚动效果，又准备装一个库。\n\n其实，其中一些事情浏览器早就能原生完成了，只是模型读过的旧代码太多，还是容易沿用以前的办法。\n\nGoogleChrome 的开源项目 Modern Web Guidance 就是来补这块的。\n\n你可以把它理解成给 AI 编程助手配了一本随时能查的前端手册：写代码之前，先搜索相关指南，看看现在有什么更合适的实现方式，有哪些兼容性问题，需要怎么降级。\n\n内容覆盖 CSS 布局、弹窗、表单、性能、无障碍等方向，Claude Code、Codex 等助手都能接入，\n\n官方也提供了一条命令安装：`npx modern-web-guidance@latest install`。\n\n它把“记得用最佳实践”这句空话，变成了可以实际检索的具体建议。\n\n比如做删除确认弹窗，它会提醒助手考虑原生 \u003cdialog>，同时检查初始焦点、关闭行为和浏览器支持。", "createdAt": "Mon Nov 16 11:42:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 1, "conversationId": "2122294107691479081", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122226813552480256/img/JhJPMtPcxQC_CpLm.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122226813552480256/img/JhJPMtPcxQC_CpLm.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122226813552480256/vid/avc1/1920x1080/l9Z4NcCutGRHNTg1.mp4?tag=29", "durationMs": 161968}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-16T11:42:00+00:00", "createdAtBeijing": "2026-11-16T19:42:00+08:00", "createdAtLocal": "11-16 19:42 北京", "url": "https://x.com/sitinme/status/2122294107691479081", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2122294107691479081", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Modern Web Guidance 前端指南接入", "evidence": "写代码之前，先搜索相关指南", "rationale": "提供安装命令、适用场景和原生弹窗示例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2122162706606121396", "track": "agent", "source": {"id": "2122162706606121396", "text": "主会话 + Thread 的模式，优化好的话 Token 消耗其实还好。\n\n首先主会话反而不需要特别强的模型，Sonnet 5.5 这个级别都够用了，因为它的主要职责是甄别和路由，或者说调度。\n\n就跟公司前台一样，你不需要招一个专家，只要知道什么任务该找谁。\n\n主会话里面很多任务都可以让 Thread 去完成，反倒是 Thread 应该用相对强一些的模型。当然更科学的办法是主会话在调度的时候根据任务难度去选择合适的模型。\n\n比如我在用 Claude Project 的时候，主会话是 Sonnet 5.5，子任务是 Opus 5.5。\n\n另外就是 Prompt Caching 的利用。\n\n像主会话这种，特点是偶尔来个消息，很难利用好缓存，所以缓存如果过期了，不应该跟把所有历史会话和工具调用都发过去，而是只把最新的几条消息记录发过去，再配合 Session 的检索工具，可以很容易的收集齐上下文。\n\n而对于 Thread，则是像传统的 Session 会话，会集中时间有很多对话，通常 Cache 利用率很高，但是也可能会出现缓存过期后又来新的消息，所以最佳策略是在缓存快过期的时候，比如 50 分钟（如果缓存一个小时的话）的时候，压缩一下上下文。", "createdAt": "Mon Nov 16 02:59:51 +0000 2026", "replyCount": 143, "retweetCount": 12, "likeCount": 107, "conversationId": "2122162706606121396", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2122158981644685613", "text": "问题是，Grok bot这个如果走单主会话的交互太耗额度了。https://t.co/94yxyjGU2d", "createdAt": "Mon Nov 16 02:45:03 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 4, "conversationId": "2122158981644685613", "author": {"username": "GaryZhang124", "name": "Gary Zhang", "profileImageUrl": "https://pbs.twimg.com/profile_images/2112063116271923200/uKGVzD0f_normal.jpg"}, "authorId": "2052242091623718917"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-16T02:59:51+00:00", "createdAtBeijing": "2026-11-16T10:59:51+08:00", "createdAtLocal": "11-16 10:59 北京", "url": "https://x.com/dotey/status/2122162706606121396", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2122162706606121396", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "主会话与Thread的模型路由及缓存优化", "evidence": "只把最新的几条消息记录发过去", "rationale": "给出模型分工、历史检索和缓存过期处理方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2122309741825470468", "track": "agent", "source": {"id": "2122309741825470468", "text": "非常实用的加速 CI 的经验，学到很多新知识，尤其是对加速测试的方式 ：\n\n* 把测试按照历史耗时智能分片并行跑 ，如果平均分配的话，有可能出现时间消耗非常不一致的情况，所以先记录每个测试的历史耗时，按耗时把测试重新分配，然后让每个分片的总时间尽量接近，这个真的是巧思\n\n* PR 只跑受影响的测试，根据代码 diff 只执行相关测试，而不是全量，这里执行哪些应该是在 CI 上做静态分析 import graph，然后决定跑哪些\n\n* 其他还有换工具纯纯提速，tsc 改成 bun check，lint 使用 oxlint\n\n* 最后就是所有都并行，lint/类型检查/build/test同时跑", "createdAt": "Mon Nov 16 12:44:07 +0000 2026", "replyCount": 7, "retweetCount": 4, "likeCount": 53, "conversationId": "2122309741825470468", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2121982070193058191", "text": "Our frontend CI is now under 2 minutes. What we did:\n\n- tsc to bun check\n- oxlint, every rule we can turn on\n- shards filled by recorded test time\n- PRs run only the tests the diff can reach\n- lint, typecheck, build and tests all run in parallel", "createdAt": "Sun Nov 15 15:02:04 +0000 2026", "replyCount": 79, "retweetCount": 84, "likeCount": 2778, "conversationId": "2121982070193058191", "author": {"username": "pontusab", "name": "Pontus Abrahamsson", "profileImageUrl": "https://pbs.twimg.com/profile_images/1755611130368770048/JwLEqyeo_normal.jpg"}, "authorId": "72615190", "translationZh": "我们的前端 CI 现在不到 2 分钟就能完成。我们做了这些调整：\n\n- 将 tsc 换成 bun check\n- 使用 oxlint，开启所有能开启的规则\n- 根据记录的测试耗时分配测试分片\n- PR 只运行代码变更可能影响到的测试\n- lint、类型检查、构建和测试全部并行运行"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-16T12:44:07+00:00", "createdAtBeijing": "2026-11-16T20:44:07+08:00", "createdAtLocal": "11-16 20:44 北京", "url": "https://x.com/vikingmute/status/2122309741825470468", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2122309741825470468", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "前端CI测试分片与并行加速方法", "evidence": "shards filled by recorded test time", "rationale": "包含耗时分片、受影响测试及并行策略"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2122446283642400974", "track": "tools", "source": {"id": "2122446283642400974", "text": "Quail now supports models with hybrid architectures! Hybrid architectures are the future. With fewer attention layers, KV sizes are smaller, which improves reuse for future Quail queries.\n\nArnav wrote a blog post on how we adapted our cost models, extended Quail’s caching to save the recurrent state, and got a >3x speedup over vLLM: https://t.co/1dflsQzWPl", "createdAt": "Mon Nov 16 21:46:41 +0000 2026", "replyCount": 4, "retweetCount": 5, "likeCount": 11, "conversationId": "2122446283642400974", "author": {"username": "sh_reya", "name": "Shreya Shankar", "profileImageUrl": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, "authorId": "2286218053", "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Shreya Shankar", "role": "UC Berkeley / AI 工程研究员", "why": "评测、LLM Pipeline、AI 工程学科化", "handle": "sh_reya"}, "createdAtIso": "2026-11-16T21:46:41+00:00", "createdAtBeijing": "2026-11-17T05:46:41+08:00", "createdAtLocal": "11-17 05:46 北京", "url": "https://x.com/sh_reya/status/2122446283642400974", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2122446283642400974", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Quail 支持混合架构模型与状态缓存", "evidence": "Quail now supports models with hybrid architectures!", "rationale": "发布架构支持与缓存改进，自述性能超三倍"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Quail 现已支持混合架构模型！混合架构是未来趋势。注意力层更少，KV 缓存就更小，也更便于后续 Quail 查询复用。\n\nArnav 写了一篇博客，介绍我们如何调整成本模型、扩展 Quail 缓存以保存循环状态，以及如何实现超过 vLLM 3 倍的速度：https://t.co/1dflsQzWPl"}, "avatar": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, {"id": "2122230873345101904", "track": "creative", "source": {"id": "2122230873345101904", "text": "GPT Image 2.5东方美学禅意海报：静好时光\n\nPrompt：\n9:16竖版，东方禅意极简女性封面海报，现代新中式审美，明亮、通透、柔和、精致，高颜值女性向封面。\n\n一位24–27岁的成年东方女性，精致柔和的鹅蛋脸，清亮杏眼，淡妆，白皙自然肤质。深棕黑色长发半盘发，少量白花与浅金发簪点缀。\n\n人物坐在暖白墙边，身体轻微侧转，双腿自然收拢，一只手自然搭在膝盖上，另一只手轻放前方，微微抬头望向右上方，神情安静、松弛、温柔。肩颈、手臂、手腕和手指结构自然协调。\n\n人物穿珍珠白与浅杏色古风襦裙，外罩轻薄宽袖纱衣，局部带少量桃粉花枝与浅绿叶片刺绣，服装轻盈精致但不过度华丽。\n\n背景为大面积暖白墙面，左侧少量竹枝与竹影，少量桃粉花瓣飘落。人物位于中下部偏左，占画面高度约60%，右上方保留大面积连续留白用于标题。\n\n色彩控制：暖白为主基底，青竹绿只用于竹叶与少量服饰细节，桃粉只用于花瓣点睛，浅金只用于发饰；颜色各自归位，禁止整图粉绿化、发灰、发黄。\n\n明亮自然侧光，竹影清晰，人物面部柔亮，发丝和薄纱有轻微轮廓光，整体干净、通透、有呼吸感。\n\n留白处加入东方艺术标题：\n「静好时光」\n副文案：\n「心有清欢，日子自安。」\n搭配一枚小型朱红印章。\n\n负面约束：不要人物比例异常，不要肩臂反转，不要多手多指，不要手指畸形，不要网红脸，不要灰雾，不要脏黄，不要复杂背景，不要满屏花朵。", "createdAt": "Mon Nov 16 07:30:44 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 9, "conversationId": "2122230873345101904", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "quotedTweet": {"id": "2121867161752793146", "text": "GPT Image 2.5生成东方美学海报：春光正好。\n\n主题方向：东方禅意极简封面海报\n风格分支：女性审美明快型\n主体内容：一位古风女子坐在画面下方偏一侧的矮凳上，微微抬头看向远处\n情绪母题：松弛、明朗、轻治愈\n场景与意象：象牙白背景、柠檬黄色圆形日光、女子、少量浅灰地面投影\n构图与空间：9:16竖版构图，圆形日光位于中上部偏中位置形成视觉岛，人物位于下方偏侧，日光周围和上方保留标题空间\n色彩控制：象牙白作为整体高明度基底，柠檬黄只用于圆形日光和少量暖反光，人物服装建议浅米白或淡奶黄；避免整体发黄\n光线与质感：明亮柔光，背景纯净，边缘清楚，干净平面海报感\n画幅比例：9:16\n补充要求：标题可围绕圆形日光排布，整体像小红书爆款封面，明快但不刺眼", "createdAt": "Sun Nov 15 07:25:28 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 10, "conversationId": "2121867161752793146", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXJi6kraQAAKPpT.jpg", "width": 941, "height": 1672, "previewUrl": "https://pbs.twimg.com/media/HXJi6kraQAAKPpT.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXOtuEdaUAATZI_.jpg", "width": 942, "height": 1670, "previewUrl": "https://pbs.twimg.com/media/HXOtuEdaUAATZI_.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-16T07:30:44+00:00", "createdAtBeijing": "2026-11-16T15:30:44+08:00", "createdAtLocal": "11-16 15:30 北京", "url": "https://x.com/liyue_ai/status/2122230873345101904", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2122230873345101904", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "东方禅意女性海报提示词", "evidence": "右上方保留大面积连续留白用于标题", "rationale": "完整提供构图、配色、光线与负面约束"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2122292816961531969", "track": "growth", "source": {"id": "2122292816961531969", "text": "非常推荐大家自部署 OpenSEO 来使用\n\nhttps://t.co/N8sSK16TnQ\n\n没错，使用它需要付费 DataforSEO，但不贵，而且可以用很久的，然后接入你所有网站的 Google analytics 和 Google Search Console，有个地方可以统一看这些数据太爽了。\n\n你也可以搞个定时任务，每天定时汇报流量数据和SEO问题告警，然后自动修复问题。以前我都是让codex去优化SEO，现在通过t3 code➕openseo，体验好多了，发现问题马上修。", "createdAt": "Mon Nov 16 11:36:52 +0000 2026", "replyCount": 5, "retweetCount": 11, "likeCount": 93, "conversationId": "2122292816961531969", "author": {"username": "indie_maker_fox", "name": "Fox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, "authorId": "1865299069092139008", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXPmEgQbUAAV4Tv.jpg", "width": 1200, "height": 1287, "previewUrl": "https://pbs.twimg.com/media/HXPmEgQbUAAV4Tv.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-11-16T11:36:52+00:00", "createdAtBeijing": "2026-11-16T19:36:52+08:00", "createdAtLocal": "11-16 19:36 北京", "url": "https://x.com/indie_maker_fox/status/2122292816961531969", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2122292816961531969", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "OpenSEO 多站点监控与修复工作流", "evidence": "每天定时汇报流量数据和SEO问题告警", "rationale": "分享数据接入、定时告警及修复实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2122338465648103676", "track": "creative", "source": {"id": "2122338465648103676", "text": "Teammate on Fable 5.2 built an open-world driving game set in a neon 1986 Miami that runs in your browser at https://t.co/oIeUkHjWof. No game engine, no Three.js and no external assets: Teammate wrote its own WebGL2 renderer, and the city, cars, garage, rain and engine sounds are all generated by code. About 63,000 lines of JavaScript, 9 MB. This 40-second film was rendered by Teammate on a rented cloud GPU at 1080p60.", "createdAt": "Mon Nov 16 14:38:16 +0000 2026", "replyCount": 90, "retweetCount": 47, "likeCount": 653, "conversationId": "2122338465648103676", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122338376271687680/img/MlUAJpFXv-M_6NY2.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122338376271687680/img/MlUAJpFXv-M_6NY2.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122338376271687680/vid/avc1/1920x1080/bH-YVdbZW1a3Zpvg.mp4?tag=29", "durationMs": 40000}], "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-16T14:38:16+00:00", "createdAtBeijing": "2026-11-16T22:38:16+08:00", "createdAtLocal": "11-16 22:38 北京", "url": "https://x.com/AravSrinivas/status/2122338465648103676", "themeId": "editorial", "signalScore": 90, "editorial": {"id": "2122338465648103676", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Agent 生成浏览器开放世界驾驶游戏", "evidence": "its own WebGL2 renderer", "rationale": "展示具体游戏作品与生成方案，规模为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "基于 Fable 5.2 的 Teammate 打造了一款开放世界驾驶游戏，以霓虹闪耀的 1986 年迈阿密为背景，可直接在浏览器中运行：https://t.co/oIeUkHjWof。没有游戏引擎，没有 Three.js，也没有外部素材：Teammate 自行编写了 WebGL2 渲染器，城市、汽车、车库、雨景和引擎声全部由代码生成。约 63,000 行 JavaScript，体积 9 MB。这段 40 秒的短片由 Teammate 在租用的云端 GPU 上以 1080p、60 帧每秒渲染完成。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2122156731300212773", "track": "agent", "source": {"id": "2122156731300212773", "text": "No AI Slop 宣言\n\n由 AI Engineer Code Summit 2026 演讲者和参会者共同写成：https://t.co/8BvjPcLKHv\n\n宣言以 2001 年的敏捷宣言为参照，提出五组对照：结果重于产量，理解重于速度，自己的思考重于模型的第一稿，更好的工作重于更省事的工作，改进系统重于修补输出。\n\n宣言对 slop 的定义：你投入的心思，少于你要求接收者花在理解上的精力。用了 AI 并不自动等于 slop；把模型产出转手发出、却不对质量和读者体验负责，才会变成 slop。Agent 一天能写出的东西，可能超过一个人一辈子审得完的量；上千行拉取请求或十页文档的生产成本正在趋近于零，审核成本却几乎没降。这类产出还会进入知识库和代码，被下一个 Agent 继续模仿，团队也会逐渐失去抵制它的意愿。\n\n判断不能外包，审核才有差别\n\nHorthy 在帖子里标出自己最看重的三条。AI 不能代替人的判断，只能放大判断，也包括放大判断力的不足。无论 AI 帮了多少忙，意图、品味和后果仍由人承担。模型变强之后，人或许不必再通读大部分代码，但仍应审核计划、设计或结果；若不审核任何东西，得到的只会是和所有人一样的输出。宣言并不禁止一次性提示或凭感觉写代码，它反对的是损害结果的 slop：有用的产品、可维护的系统，以及节省自己和同事的时间。有人建议再配一份五分钟就能走完的拉取请求清单，Horthy 回复说，那正是他们不需要的东西。\n\n签名还在增加，原则没有改\n\nHorthy 发帖时自称已有 300 多个签名，并登上 Hacker News 首页，还提到签名者中有来自 Baseten、SpaceX、OpenAI、PostHog、Shopify、Glean、ZoomInfo 等团队的工程师们。签名方式是在他的 GitHub Gist 下留言，官方再定期同步进宣言。目前 Gist 已列出 504 个签名；Hacker News 讨论约有 222 分、133 条评论。", "createdAt": "Mon Nov 16 02:36:07 +0000 2026", "replyCount": 12, "retweetCount": 2, "likeCount": 11, "conversationId": "2122156731300212773", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2121660606256435325", "text": "a few days ago we published the \"No AI Slop Manifesto\" at @aiDotEngineer Code Summit in SF, written in collaboration with many of the speakers and attendees\n\nIt already hit the front page of hacker news, has 300+ signatures including folks from Baseten, SpaceX, OpenAI, PostHog, Shopify, Glean, ZoomInfo, and legendary builders including \n\n@swyx \n@poteto \n@kentcdodds \n@mihail_eric \n@audreyt  \n@altryne \n@traviscline \n@philipkiely \n@TejasKumar_\n\nread and sign it at slopmanifesto dot com\n\nsome of my favorite points \n\n> AI cannot replace human judgement, it can only amplify our judgement (or lack thereof).\n\n> We own the intent, taste, and consequences of what we ship, however much AI helps us make it.\n\n> There will always be alpha in reviewing *something*. As models improve, we may stop reading most of the code. We may still review a plan, design, or result, because if we don't, we just get the same output as everyone else.", "createdAt": "Sat Nov 14 17:44:41 +0000 2026", "replyCount": 61, "retweetCount": 58, "likeCount": 481, "conversationId": "2121660606256435325", "author": {"username": "dexhorthy", "name": "dex", "profileImageUrl": "https://pbs.twimg.com/profile_images/1936650128518938624/tCFV_MZO_normal.jpg"}, "authorId": "820679805259550720", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXGiF9MbAAEvNTu.png", "width": 1396, "height": 1322, "previewUrl": "https://pbs.twimg.com/media/HXGiF9MbAAEvNTu.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXGj60raAAAFzcM.jpg", "width": 2048, "height": 843, "previewUrl": "https://pbs.twimg.com/media/HXGj60raAAAFzcM.jpg:small"}], "translationZh": "几天前，我们在旧金山的 @aiDotEngineer Code Summit 上发布了《拒绝 AI 垃圾内容宣言》，由多位演讲嘉宾和参会者共同撰写。\n\n它已经登上 Hacker News 首页，获得 300 多人签名，其中包括来自 Baseten、SpaceX、OpenAI、PostHog、Shopify、Glean、ZoomInfo 的从业者，以及这些知名开发者：\n\n@swyx \n@poteto \n@kentcdodds \n@mihail_eric \n@audreyt  \n@altryne \n@traviscline \n@philipkiely \n@TejasKumar_\n\n前往 slopmanifesto dot com 阅读并签名。\n\n我最喜欢的几条观点：\n\n> AI 无法取代人类的判断力，只能放大我们的判断力，或放大我们在判断力上的欠缺。\n\n> 无论 AI 在制作过程中提供了多少帮助，我们都要对交付成果的意图、品味和后果负责。\n\n> 审查某些东西，始终能带来额外优势。随着模型进步，我们或许不再阅读大部分代码，但仍可能审查计划、设计或结果。否则，我们得到的就只是和所有人一样的输出。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXNqP8IasAA-Cs-.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXNqP8IasAA-Cs-.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-16T02:36:07+00:00", "createdAtBeijing": "2026-11-16T10:36:07+08:00", "createdAtLocal": "11-16 10:36 北京", "url": "https://x.com/shao__meng/status/2122156731300212773", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2122156731300212773", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AI产出质量与审核责任", "evidence": "仍应审核计划、设计或结果", "rationale": "给出AI协作质量原则与审核方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122138885476249681", "track": "research", "source": {"id": "2122138885476249681", "text": "Reddit LocalLLaMA 板块热议的一篇帖子：前沿模型变好用，不等于本身解题能力同步跃升？！\n\n# 他想先把“聪明”说清楚\n\n他指的是：信息、工具和时间都有限时，尽量高效地用手头材料把问题解掉。如果给足时间和工具，更考验的是规划和长程智能体能力，他认为那是另一件事，不宜混在一起比较。\n\n他也承认实打实的改进：工具调用更好、幻觉更少、上下文更长，这些都让模型更有用。他并不认为进步已经停摆，也没说高效解题一定只需要很少参数。\n\n# 三条观察\n\n第一，生产环境里，配套系统和模型一旦在黄金数据集上达到目标，再换更新的前沿模型很少继续加分。受时间和精度限制时，失败多半出在上下文设计或工具不够用。新模型有时能找到更巧的办法，但往往太慢或不稳，最后还是得改配套系统。\n\n第二，写软件时，新模型更能带来提升，但同一模型在不同配套系统里的表现差很多。复杂代码库里，资深工程师要补多少改、做多少审查，也跟着变。他认为这里同样是配套系统在承担大量工作。\n\n第三，较小的本地模型已经相当能打，让他怀疑高效解题到底需要多少参数。前沿模型显然有更广的知识、分寸和现成技能，但相关知识已经被提供时，他并不总能看到成比例的优势。\n\n据此他归纳：高效解题需要的参数可能比通常以为的少；前沿在本身解题能力上的前移，小于整体收益，也小于“接近超级智能”这类说法；过去 12 到 24 个月的进步，更多来自模型的累积改进和更好的配套系统，而不是解题能力的急剧或指数式跳跃。他怀疑媒体上的热捧和末日叙事，都被即将到来的 AI 上市所助推。\n\n# 讨论并不一边倒\n\n接近 300 条评论意见有分裂：不少人认同日常工作往往用不上最顶尖的模型，提升更多来自提示和工具；也有人反对，比如有机器学习从业者说近期模型在假设检验上有明显跳跃，有生物学使用者说一年内差错率从几乎不可用降到可用，还有自称做过前沿评测的人认为，后期训练已经把许多以前靠配套系统完成的事内化了，旧的配套技巧现在反而可能干扰。另有人提到模型在长任务上更有韧性，也有人凭印象抱怨发布后质量下滑。\n\nhttps://t.co/wH4zX6DloX", "createdAt": "Mon Nov 16 01:25:12 +0000 2026", "replyCount": 13, "retweetCount": 0, "likeCount": 5, "conversationId": "2122138885476249681", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXNaDaIaQAAflL7.jpg", "width": 1156, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXNaDaIaQAAflL7.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXNaEHJagAACoUm.jpg", "width": 1126, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXNaEHJagAACoUm.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-16T01:25:12+00:00", "createdAtBeijing": "2026-11-16T09:25:12+08:00", "createdAtLocal": "11-16 09:25 北京", "url": "https://x.com/shao__meng/status/2122138885476249681", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2122138885476249681", "technicalRelevant": true, "dailyGrade": "C", "channel": "research", "topic": "模型能力与配套系统收益辨析", "evidence": "失败多半出在上下文设计或工具不够用", "rationale": "有生产实践观察与争议分析，但缺评测证据"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}], "preview": false, "productionMonitored": 122};
const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
