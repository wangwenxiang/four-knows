<script>
const DATA={"records": [{"id": "2123208337965883873", "track": "tools", "source": {"id": "2123208337965883873", "text": "Google 开源 ABFS：Android 源码检出从约 36 分钟降到 8 秒内\n\nAndroid 17 开源版本有 1084 个 Git 仓库、约 162 万个文件，代码 161 GB，构建产物 155 GB，完整工作区大约 300 GB。再加上硬件厂商代码和自有应用，规模还要再放大两到三倍。传统流程里，拉一份 AOSP 往往超过 30 分钟，完整构建也常常超过一小时。新工作区、切分支，或 Agent 的临时会话，几乎每次都要从头开始。\n\nGoogle 的 Android ABFS 团队为此做了 Another Build File Service，并已在 GitHub 开源。它用内容寻址的方式，按需加载并缓存源码、工作区、中间文件和构建结果。\nhttps://t.co/kRQqh6SgWa\n\n先挂上目录元数据，真正读到再拉文件\n\nABFS 包含 Linux 内核里的内容寻址文件系统 CASFS、用户态的缓存和管理进程，以及服务端存储。服务端持续接收来自 Gerrit 或其他 Git 主机的对象；开发机上先只下载带有 Git 哈希的目录元数据，文件内容要到第一次读取时，才通过本地缓存拉取。标准的 git 和 repo 命令仍可照常使用。\n\n以 Cuttlefish 模拟器目标为例，一次构建有 192249 个 Ninja 步骤。开发者通常只改 1 到 10 个仓库，即便改的是比较核心的 system/libbase，构建图里仍有 97% 与持续集成已经做过的工作相同。可是按时间戳做增量时，隐藏依赖可能留下过期产物，最后只好清空输出目录重来。\n\n两阶段校验，让本地构建敢复用已有结果\n\nNinja-go 不再只看文件时间。它先按命令、环境和已声明输入的哈希，去已有构建里查找候选结果；再用这份结果当初实际读过的文件，核对当前文件系统是否一致。如果连未声明的依赖都变了，就拒绝缓存并重新执行。这样即使构建规则不完整，也能保持接近干净构建的正确性。\n\n在同一云网络的 64 核虚拟机上，三次运行的平均值是：按官方文档做部分克隆，检出要 36 分 19 秒；ABFS 在本地缓存为空时是 7.4 秒，缓存已热时是 3.6 秒。完整构建方面，现有流程要 1 小时 20 分 35 秒；本地缓存为空但远端缓存完整时是 2 分 11 秒，本地也有完整缓存时是 1 分 19 秒。同一台机器上可以并排挂载五个发布分支，每个不到 8 秒。Agent 能在 10 秒内检出完整源码树，并在 10 分钟内完成一次完整构建，再把同一修复并行移植到多个版本上验证。Android 17 之前的版本，使用 ABFS 还需要一些补丁。", "createdAt": "Thu Nov 19 00:14:49 +0000 2026", "replyCount": 8, "retweetCount": 2, "likeCount": 11, "conversationId": "2123208337965883873", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122748145637761473", "text": "Android's source code is huge. 1k git repos, 1.62 million files, and it takes 300GB for a built workspace.\n\nHow did we reduce checkout time from 36 minutes to 8 seconds? Full builds from 80 minutes to 2 minutes?\n\nWe just open sourced the solution.\nhttps://t.co/8lcqRmd5FI https://t.co/zEMmPATKgL", "createdAt": "Tue Nov 17 17:46:11 +0000 2026", "replyCount": 14, "retweetCount": 80, "likeCount": 660, "conversationId": "2122748145637761473", "author": {"username": "rseroter", "name": "Richard Seroter", "profileImageUrl": "https://pbs.twimg.com/profile_images/1517719733184868354/erDRiiQZ_normal.jpg"}, "authorId": "48529642", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWEDOYawAAIyQO.jpg", "width": 1850, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXWEDOYawAAIyQO.jpg:small"}], "translationZh": "Android 的源代码规模庞大：1000 个 git 仓库、162 万个文件，构建后的工作区占用 300GB。\n\n我们如何将代码检出时间从 36 分钟缩短到 8 秒，将完整构建时间从 80 分钟缩短到 2 分钟？\n\n我们刚刚开源了这套解决方案。\nhttps://t.co/8lcqRmd5FI https://t.co/zEMmPATKgL"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXcmuBSaYAAOhUU.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXcmuBSaYAAOhUU.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-19T00:14:49+00:00", "createdAtBeijing": "2026-11-19T08:14:49+08:00", "createdAtLocal": "11-19 08:14 北京", "url": "https://x.com/shao__meng/status/2123208337965883873", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2123208337965883873", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "ABFS开源与Android构建缓存", "evidence": "文件内容要到第一次读取时", "rationale": "详述按需加载、缓存校验机制及测试条件"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123232255309119893", "track": "agent", "source": {"id": "2123232255309119893", "text": "Shopify：移动应用出码提速 11 倍后，用攻击面地图把安全审查拆到单条深链\n\n来自 @ShopifyEng 工程团队博客，在 Agent 时代，他们移动应用的代码吞吐已经是去年同期的 11 倍。12 周重写 Shopify 应用期间，平均每周改动约 43.4 万行，去年同期大约是 3.9 万行。现有漏洞扫描已经会检查改动过的代码，他们还想把攻击面压小，并把已经学到的做法固化下来。\nhttps://t.co/mWRE1uijfn\n\n先给每个应用画一张攻击面地图\n\n每个应用都维护一份安全敏感清单，按深链、WebView、本地存储、权限、依赖等分类。每条会写清为什么重要，并附上结论和对应代码链接。结论只允许五种：修复（带严重程度）、权衡、安全、已修复、仅调试。\n\n地图由一组 Skill 生成，每个类别一种 Skill。起点是 OWASP 的移动应用安全标准 MASVS 和测试指南 MASTG，再叠上他们处理过的漏洞，包括自己应用里出现过的问题。Skill 会写清要列出什么、什么样算合格、该检查什么。定时审查、一次性安全评审，以及在代码里工作的 Agent，都可以加载同一套 Skill；学到新东西就更新 Skill，之后每次运行都会带上。\n\n一次只审一项，每个工作日对照变更\n\n如果让模型在整个应用里找漏洞，得到的往往是又长又含糊的清单。所以每个 Skill 会先做完整盘点：每条深链路由及它读取的参数、每个 WebView 及其加载的主机和 JavaScript 接口方法、每一项 Keychain 和 Keystore 条目、每个依赖及其版本。然后模型一次只审一项，并且只看这项相关的代码。以深链为例，就是看一条路由、它读取的每个参数，以及参数被恶意构造时会发生什么，答案要具体到可以核对。若还要判断是否真的可被利用，可以把这个问题交给前沿的网络安全模型。处理事故或 HackerOne 报告时，他们会先修漏洞，再把这类问题写进 Skill，之后每次运行都会拿当前代码对照。\n\n每个工作日，模型会查看应用的改动并更新攻击面：先把最新提交的盘点与上一版已接受的地图对比，只有被引用的代码行变了，或盘点结果本身变了，才算这项发生了变化；再只用只读工具、只根据代码，给每项新增或变更做出判断，并扫一遍改动文件，看有没有地图尚未覆盖的安全相关内容；每条回答都会检查格式、行号范围、措辞，并确认不含密钥；最后生成新地图和变更页，在 Slack 发摘要。有些问题不会出现在自己的改动里，Agent 会定期阅读安全新闻，对照地图和代码检查，发一份简短简报，只有真正影响到他们时才提醒团队。同一套 Skill 也用在引入第三方库之前。\n\n这些检查是对 Dispatch 的补充。Dispatch 是他们的 Agent 漏洞扫描器，负责在改动过的代码里发现并证实漏洞；攻击面地图则保证整个应用保持较小的攻击面，并遵守既有做法。每发现并修复一个漏洞，下一次检查就会更严。", "createdAt": "Thu Nov 19 01:49:52 +0000 2026", "replyCount": 4, "retweetCount": 1, "likeCount": 7, "conversationId": "2123232255309119893", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2123178949639356592", "text": "Our code throughput has increased by 11x in the past year, so we’ve had to quickly evolve how we keep our apps secure \n\nhttps://t.co/aahyqGDTKV", "createdAt": "Wed Nov 18 22:18:03 +0000 2026", "replyCount": 0, "retweetCount": 4, "likeCount": 78, "conversationId": "2123178949639356592", "author": {"username": "mustafa01ali", "name": "Mustafa Ali", "profileImageUrl": "https://pbs.twimg.com/profile_images/942964841249214465/WQwb1iIH_normal.jpg"}, "authorId": "148628641", "translationZh": "过去一年，我们的代码产出量增至原来的 11 倍，因此必须迅速改进应用安全保障方式。\n\nhttps://t.co/aahyqGDTKV"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXc8cFFbUAAkuQi.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXc8cFFbUAAkuQi.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-19T01:49:52+00:00", "createdAtBeijing": "2026-11-19T09:49:52+08:00", "createdAtLocal": "11-19 09:49 北京", "url": "https://x.com/shao__meng/status/2123232255309119893", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2123232255309119893", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Shopify 用攻击面地图扩展安全审查", "evidence": "然后模型一次只审一项", "rationale": "提供量化案例、逐项审查流程和漏洞经验回灌机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123451045657690627", "track": "research", "source": {"id": "2123451045657690627", "text": "Sharing new research on self-improving skills in Perplexity Computer. Brain, which already maintains a knowledge wiki about your work, now also writes and updates agent skills for you based on your past sessions. An improvement agent reads the full session trajectories (tool calls, reasoning, results), finds recurring patterns, and only proposes a new skill or an update when there’s enough evidence. Built-in skills that every user gets go through paired replay on failure scenarios and engineer review before any change goes live. In an 8-week randomized test on production traffic, 72.9% of users got at least one new personal skill vs 6.5% who added one manually. Tool call failures dropped 11% and dissatisfied threads dropped 7.6%, with no measurable change in cost or latency.", "createdAt": "Thu Nov 19 16:19:15 +0000 2026", "replyCount": 76, "retweetCount": 20, "likeCount": 209, "conversationId": "2123451045657690627", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2123449395882701224", "text": "Computer's personalized self-improvement agent, Brain, now automatically creates self-improving agent skills for you.\n\nBrain learns how you work from past sessions and memory, then writes and updates personalized skills for future tasks. https://t.co/6SUi3AakVi", "createdAt": "Thu Nov 19 16:12:42 +0000 2026", "replyCount": 46, "retweetCount": 18, "likeCount": 293, "conversationId": "2123449395882701224", "author": {"username": "perplexity_ai", "name": "Perplexity", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009310641165660160/XArF3_Ib_normal.jpg"}, "authorId": "1599587232175849472", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgB910a4AAzs66.png", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXgB910a4AAzs66.png:small"}], "translationZh": "Computer 的个性化自我改进智能体 Brain，现在会自动为你创建能够持续自我改进的智能体技能。\n\nBrain 会结合过往会话和记忆，学习你的工作方式，进而编写和更新个性化技能，用于今后的任务。https://t.co/6SUi3AakVi"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-19T16:19:15+00:00", "createdAtBeijing": "2026-11-20T00:19:15+08:00", "createdAtLocal": "11-20 00:19 北京", "url": "https://x.com/AravSrinivas/status/2123451045657690627", "themeId": "editorial", "signalScore": 87, "editorial": {"id": "2123451045657690627", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "从历史会话自动生成技能的自改进研究", "evidence": "Tool call failures dropped 11%", "rationale": "披露技能更新机制与随机试验结果，属官方自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "分享一项关于 Perplexity Computer 技能自我改进的新研究。Brain 原本就会维护记录你工作内容的知识 Wiki，现在还能根据过往会话，为你编写和更新智能体技能。改进智能体会读取完整的会话轨迹（工具调用、推理和结果），识别反复出现的模式，并且只在证据充分时才提出新增或更新技能。所有用户共享的内置技能，在任何变更上线前，都要针对失败场景进行配对回放测试，并接受工程师审核。在一项基于生产流量、持续 8 周的随机试验中，72.9% 的用户获得了至少一项新的个人技能，而手动添加技能的用户比例仅为 6.5%。工具调用失败减少了 11%，用户不满意的对话减少了 7.6%，成本和延迟则没有可测量的变化。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2123214459703267673", "track": "research", "source": {"id": "2123214459703267673", "text": "谷歌发布 Gemini 4 Neon：独立评测排第三，价格不到 GPT、Claude 旗舰的四成，Pro 和 Ultra 订阅用户今天起能用\n\n谷歌 11 月 18 日发布大模型 Gemini 4 Neon。在独立评测机构 Artificial Analysis 的综合智能指数上，Neon 得 61 分，总排名第三，只排在 OpenAI 的 GPT-6.2 Astra 和 Anthropic 的 Claude Fable 5.2 之后，而它的价格不到这两个旗舰模型的四成。订阅了 Google AI Pro 或 Ultra 的用户，今天起可以在 Gemini App 里直接选用，算在订阅里，不另收费。\n\n开发者通过 API 使用 Neon。API 是开发者把模型接进自己产品的接口，按用量收费，计量单位是 token，一个汉字大致算一到两个 token。Neon 的价格是每 100 万个输入 token 3 美元、每 100 万个输出 token 15 美元；重复使用的输入内容走缓存，只收 0.15 美元，是原价的 5%。Neon 能读文字、图片、视频和语音，但只输出文字。\n\n【和 Argon、Carbon、Hydrogen 是什么关系】\n\nGemini 4 七周内出了四个型号。最早的是 Argon，9 月 30 日发布，谷歌当时称它为“前沿模型”。之后是更强的 Carbon（11 月 10 日对所有人开放）、更小更快的 Hydrogen（11 月 12 日），以及这次的 Neon。\n\n谷歌这次给的家族对比图只列了三个：Carbon 最强，用来做最难、耗时最长的项目；Hydrogen 最快最便宜，处理日常任务，免费用户也能用；Neon 在中间。图里没有 Argon，谷歌也没说 Argon 会不会下线，开发者现在仍能通过 API 调用它。谷歌 11 月 10 日介绍 Carbon 时还说，Argon“仍是大多数软件开发和知识工作的理想选择”，这和 Neon 现在的定位基本重合。\n\n拿 Artificial Analysis 的数据比：综合智能指数上 Argon 得 50 分，比 Hydrogen（54 分）还低，Neon 比它高 11 分；输出速度 Argon 每秒约 66 个 token，Neon 约 110 个。价格上，Argon 和 Carbon 一样，11 月 30 日前优惠价 2 美元/10 美元，之后恢复 4 美元/20 美元，到那时 Neon 比它们便宜 25%；Hydrogen 是 1.5 美元/7.5 美元。\n\nNeon 和 Carbon 的智能指数分数几乎一样（61 对 60），但更便宜、更快。Artificial Analysis 用同一套题测所有模型，算出做一道题平均花多少钱、花多长时间。Neon 开最高档（xhigh）每道题 6.44 美元、约 21 分钟；Carbon 按 4 美元/20 美元的正常价算是 7.76 美元、约 36 分钟。Neon 其实多用了约 15% 的输出 token，省钱全靠单价低，省时间是因为它输出更快（每秒约 110 个 token，Carbon 约 57 个）。如果 Neon 用默认的 high 档，得分和 Carbon 持平，每道题花的钱不到 Carbon 的一半。\n\n【跟 GPT、Claude 比】\n\nNeon 不在最贵的旗舰档。GPT-6.2 Astra（11 月 17 日发布）和 Claude Fable 5.2（11 月 9 日发布）都是输入 8 美元、输出 40 美元，Neon 的价格是它们的 37.5%。往下一档，Claude Opus 5.5 是 4 美元/20 美元，比 Neon 贵三分之一；GPT-6.2 Sol 是 2 美元/10 美元，比 Neon 便宜三分之一。\n\n谷歌在发布文章里拿来对比的是下一档的 Opus 5.5 和 GPT-6.2 Sol。谷歌的表格里，Neon 在多数测试中领先，比如在让 AI 自动处理办公流程的 AutomationBench 上得 56.3%，另两家在 41% 到 43% 之间。也有落后的项目：编程测试 Terminal-Bench 4.1 和 FrontierCode 2.0 上，Opus 5.5 略高（65.8% 对 65.2%，47.3% 对 46.2%）；读专业图表的 Chartography 上，GPT-6.2 Sol 略高（75.1% 对 73.5%）。\n\n写代码这一项，Artificial Analysis 直接和旗舰比了。它的编程智能体指数测的是模型配上自家编程工具后的表现：Neon 配谷歌的 Antigravity 命令行工具得 59 分，Claude Fable 5.2 和 Opus 5.5 配 Claude Code 都是 58 分。每个任务的平均花费，Neon 是 6.86 美元，Opus 5.5 是 12.61 美元，Fable 5.2 是 15.47 美元。\n\n规格上，Neon 一次最多能读入 100 万 token，相当于几千页文档，GPT-6.2 和 Claude 的现有型号也是 100 万左右。单次输出上限 Neon 默认是 6.5 万 token，GPT-6.2 Sol、GPT-6.2 Astra 和 Claude 现有型号都是 12.8 万，Neon 是它们的一半；Neon 可以打开谷歌的“长输出”功能分段接着写，输入加输出合计最多约 105 万 token。\n\n【能用来干什么】\n\n谷歌主推三类用途：\n\n1. 写代码。Neon 适合“智能体”式的工作，也就是 AI 自己连续做多步操作，比如读代码、改代码、跑测试，再按结果继续改。在谷歌的 AI 编程工具 Antigravity 里，Neon 还能当总指挥，把活拆开分给多个 Hydrogen 同时做。谷歌说它会少读重复的文件，工作时间很长时也能正常压缩前面的内容继续干。\n\n2. 处理办公资料。表格、PDF、图表、音频、视频可以一起交给它，整理成报告。Artificial Analysis 评估办公类任务成果的 AA-Briefcase 测试里，Neon 在“呈现质量”一项排第一（1771 分），超过之前排第一的 Claude Sonnet 5.5（1726 分）。\n\n3. 日常事务。Gemini App 的“任务”功能现在可以用 Neon 来跑，谷歌举的例子是分析账单找出水电费为什么突然涨了、核对多张收据去申请退款。\n\nNeon 有 low、medium、high、xhigh 四个思考档位，档位越高，模型回答前想得越久，结果更好，用的 token 也更多，默认是 high。最高的 xhigh 档是谷歌在上周发布 Hydrogen 时才加进 Gemini 的，Carbon 没有这一档。\n\n谷歌还做了网络安全专用版 Neon for cyber，用来找代码漏洞和写补丁，接下来几天通过谷歌的 Fairwind 计划先开放给经过审核的安全防御人员。\n\n【怎么用】\n\n1. 普通用户：Google AI Pro、Ultra 订阅用户在 Gemini App 的模型菜单里选 Neon。免费用户用不了，免费用户能用的是 Hydrogen。\n\n2. 开发者：Google AI Studio 里的 Gemini API 付费层，以及 Android Studio。Pro、Ultra 订阅用户还能在 Antigravity 里用。\n\n3. 企业：Gemini for business，可以走 API，也可以在模型菜单里选。\n\n谷歌表格里的测试成绩，包括 Opus 5.5 和 GPT-6.2 Sol 的分数，都由谷歌公布；排名、每道题花费和速度数据来自 Artificial Analysis 发布当天的测评。对手的价格和输出上限来自 OpenAI、Anthropic 的官方模型页。\n\n原文链接：https://t.co/q2qeH9jIRX\n来源链接：\n谷歌博客《Introducing Gemini 4 Neon》（2026-11-18）https://t.co/q2qeH9jIRX", "createdAt": "Thu Nov 19 00:39:09 +0000 2026", "replyCount": 160, "retweetCount": 11, "likeCount": 302, "conversationId": "2123214459703267673", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2123167780988125621", "text": "Gemini 4 Neon: frontier-level intelligence with fast end-to-end task completion across complex software engineering, knowledge work, and science workflows.\n\nBegins rolling out today in the Gemini API in @GoogleAIStudio, Gemini for business, for paid Google AI Pro and Ultra subscribers in Google @Antigravity, and for Google AI Pro and Ultra subscribers in the @GeminiApp.", "createdAt": "Wed Nov 18 21:33:40 +0000 2026", "replyCount": 868, "retweetCount": 1388, "likeCount": 17259, "conversationId": "2123167780988125621", "author": {"username": "sundarpichai", "name": "Sundar Pichai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_normal.jpg"}, "authorId": "14130366", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXb9cQabgAAOkkn.png", "width": 2048, "height": 1782, "previewUrl": "https://pbs.twimg.com/media/HXb9cQabgAAOkkn.png:small"}], "translationZh": "Gemini 4 Neon：具备前沿水平的智能，能够在复杂软件工程、知识工作和科学工作流中，快速完成端到端任务。\n\n即日起陆续向以下渠道和用户开放：@GoogleAIStudio 中的 Gemini API、Gemini for business、Google @Antigravity 中的 Google AI Pro 和 Ultra 付费订阅用户，以及 @GeminiApp 中的 Google AI Pro 和 Ultra 订阅用户。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-19T00:39:09+00:00", "createdAtBeijing": "2026-11-19T08:39:09+08:00", "createdAtLocal": "11-19 08:39 北京", "url": "https://x.com/dotey/status/2123214459703267673", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2123214459703267673", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Gemini 4 Neon发布与性能成本对比", "evidence": "每 100 万个输入 token 3 美元", "rationale": "包含发布、定价、评测与使用入口，数据待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2123469922034667791", "track": "research", "source": {"id": "2123469922034667791", "text": "Building a great benchmark is challenging, building a perfect benchmark is near impossible. This especially holds true in the world of document parsing.\n\nI wrote a blog post that details the core design criteria needed for a document parsing benchmark, and the historical attempts to get there - from those based on static deterministic metrics to LLM as a judge approaches.\n\nBuilding a “great” benchmark requires at least the following:\n1. Representative data\n2. Granularity\n3. Quantifiable\n4. Repeatable\n5. Controllable\n6. Aligned with human judgment\n\nExisting benchmarks based on deterministic metrics are oftentimes granular/repeatable, but not controllable or aligned with human judgment. Those based on LLM as a judge are not granular, quantifiable, repeatable, and can obscure how human judgment is encoded.\n\nLast week we launched ParseBench-2 in an attempt to tackle all of these dimensions. It contains a taxonomy of metrics across 6 dimensions (tables, charts, layout, formatting, text, and forms) that precisely measure document parsing failures and quantifies their impact. It’s certainly not perfect, but does make an honest attempt towards advancing every design criteria. It’s also designed to be customizable by the user (see our metric lab!)\n\nWe’re rapidly shipping new iterations of this benchmark to improve annotations, metric quality, and customizability. If you do check it out, would love to hear your thoughts.\n\nBlog: https://t.co/NAchVsDfVC\n\nParseBench-2: https://t.co/PWczfhp0OX", "createdAt": "Thu Nov 19 17:34:16 +0000 2026", "replyCount": 18, "retweetCount": 2, "likeCount": 18, "conversationId": "2123469922034667791", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2123464897656705295", "text": "ParseBench has been cited by NVIDIA, Cohere and Perplexity. It still isn’t a perfect benchmark.\n\nPart of getting closer meant owning where ParseBench-1 got things wrong. On one McDonald’s financial statement, it scored a parser that broke a dollar amount above one that got every number right.\n\nSo for ParseBench-2, we changed how we build the metric. We decide how much each kind of error should matter first, then test and tune the scoring until it agrees.\n\n→ 330 perturbation types to check that scores move by the right amount\n→ 4,317 pages across six dimensions, now including forms\n→ Full reference tables for all 1,025 charts\n→ A Metric Lab to set scoring priorities for your own workload\n\nThere’s still more to do, and we wanted to be open about that too.\n\nRead more about how we’re building toward a perfect document parsing benchmark in the reply below.", "createdAt": "Thu Nov 19 17:14:18 +0000 2026", "replyCount": 7, "retweetCount": 5, "likeCount": 14, "conversationId": "2123464897656705295", "author": {"username": "llama_index", "name": "LlamaIndex 🦙", "profileImageUrl": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, "authorId": "1604278358296055808", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgQEfBWMAEuIWN.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXgQEfBWMAEuIWN.jpg:small"}], "translationZh": "ParseBench 已被 NVIDIA、Cohere 和 Perplexity 引用，但它仍不是一套完美的基准测试。\n\n要更接近这个目标，就得先承认 ParseBench-1 的不足。在一份麦当劳财务报表上，它给一个解析错美元金额的解析器打出的分数，竟然高于另一个正确解析所有数字的解析器。\n\n因此，在 ParseBench-2 中，我们改变了指标构建方式：先确定每类错误应有多大影响，再测试并调整评分，直到评分符合这一设定。\n\n→ 330 种扰动类型，用于检查分数变化幅度是否合理\n→ 4,317 页文档，覆盖六个维度，现已包含表单\n→ 为全部 1,025 张图表提供完整的参考数据表\n→ 提供 Metric Lab，可根据自己的工作负载设置评分优先级\n\n还有很多工作要做，我们也希望坦诚说明这一点。\n\n下方回复中介绍了我们如何朝着完美的文档解析基准测试迈进，欢迎阅读。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgUgoMa8AAdSDV.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXgUgoMa8AAdSDV.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-19T17:34:16+00:00", "createdAtBeijing": "2026-11-20T01:34:16+08:00", "createdAtLocal": "11-20 01:34 北京", "url": "https://x.com/jerryjliu0/status/2123469922034667791", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2123469922034667791", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ParseBench-2 文档解析评测设计与复盘", "evidence": "330 perturbation types", "rationale": "提供评分失误复盘、六维指标与可定制评测方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "打造优秀的基准测试很难，打造完美的基准测试则几乎不可能。在文档解析领域尤其如此。\n\n我写了一篇博客，详细介绍文档解析基准测试的核心设计标准，以及以往为实现这些标准所做的尝试——从基于静态确定性指标的方法，到由 LLM 担任评判的方法。\n\n一套“优秀”的基准测试至少需要满足以下条件：\n1. 数据具有代表性\n2. 评估粒度足够细\n3. 可量化\n4. 可重复\n5. 可控\n6. 与人类判断一致\n\n现有基于确定性指标的基准测试，往往粒度够细、可重复，但缺乏可控性，也难以与人类判断一致。由 LLM 担任评判的基准测试，则缺乏细粒度、可量化和可重复的评估，也可能让人难以看清人类判断是如何被编码进评估体系的。\n\n上周，我们推出了 ParseBench-2，尝试兼顾上述所有要求。它建立了覆盖 6 个维度（表格、图表、版面、格式、文本和表单）的指标分类体系，精确衡量文档解析错误，并量化其影响。它当然并不完美，但确实认真尝试在每项设计标准上取得进步。它还支持用户自定义（欢迎看看我们的指标实验室！）。\n\n我们正在快速迭代这套基准测试，改进标注、指标质量和可定制性。如果你试用了，欢迎分享想法。\n\n博客：https://t.co/NAchVsDfVC\n\nParseBench-2：https://t.co/PWczfhp0OX"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2123278617497186713", "track": "agent", "source": {"id": "2123278617497186713", "text": "CMU 17-214 第 21 讲：Agent 一下午改 2000 行，就把检查做成流水线门禁\n\nCMU 17-214「Agentic Software Development」课程认为，有了 Coding Agent 之后，写出看起来像样的代码已经不贵了，难的是理解、验证、演化，以及把一套软件真正跑起来。整个学期都围着同一个系统做设计和改版，并一直监督 Agent。第 21 讲「Verification in the Pipeline」接在 DevOps 后面，接下来是实验课 Lab 12，让学生自己搭一套持续集成门禁，还有作业 A6，要把系统真正跑起来，并给每次改动加上检查和部署。\n\n课程：https://t.co/H5Y55WMXHJ\n第 21 讲讲义：https://t.co/UPjCebixGM\n\n门禁要跟上 Agent 的出码速度\n\n讲义里举了个场景：预订团队有人带着 Agent，一下午就开出一个改了 2000 行的 PR。认真审完还是要几个小时。代码生成变快了，审查速度几乎没变。所以他们主张把检查做成每次改动都会跑的门禁，测试、类型检查、代码检查都可以用来拦住合并。一条好的检查，要能在这次改动里把这类问题找全，以后每次改动也能再找一遍。检查本身只写一次，之后每次持续集成多花一点时间就行。\n\n动态检查是把代码跑起来看结果，静态检查不跑代码，但能分析测试没走到的路径。两类检查抓住的问题不一样，所以大多数流水线会两头都做。讲义用一段预订代码说明这一点。测试里伪造的通知发送总是成功，所以测试全是绿的。可代码并没有等待发送结果：一旦邮件服务失败，这个没被接住的错误，默认会让整个进程退出。这时预订已经写入了，这个进程上正在处理的其他请求也会一起失败。这类问题，代码检查不用跑测试就能报出来。\n\n静态检查要少误报，也要防被关掉\n\n项目里的约定可以写成自定义规则，报错时直接写上该怎么改，这样会跑检查的 Agent 也能按提示修改。分析器没法判定程序里所有真正要紧的性质，漏报和误报都会有。大多数工具宁可少误报，因为经常报错的检查，人就会不当回事。至于同一间房不能重复预订这类业务规则，还是得靠测试、类型或者自定义规则来管。\n\n讲义引用了 Google 和 Meta 的做法：把检查结果放在代码审查里，修复率比丢在夜间清单里高得多；会打断构建的检查，本身几乎不能报错。这些要求当初都默认每次发现都会有人去读。Agent 不在乎一次要读多少条，规则可以更严，成本也不会明显变高。可它也可能随手加上抑制、写成 any 或 as，或者把覆盖率门槛调低，检查是通过了，问题却没修好。所以上新规则时，常用基线只拦住新出现的问题；做抑制时要把理由写清楚；改检查配置的 diff，也值得多看一眼。类型相当于能被机器核对的规格：不存在的方法调用它能抓住，可一个真实方法被用错了含义，它看不出来。\n\n哪些检查该拦住合并\n\n更省事的测试应该先跑，也跑得更勤。测试不稳定，常常是因为等待时间或共享状态没控制好，应该把根因修好，或者暂时把它从必过检查里拿掉，别靠反复重跑把失败蒙过去。覆盖率下限只能说明代码被执行到了；如果代码和测试都是 Agent 写的，这些测试有时只是在确认代码做了它已经做的事。\n\n能拦住合并的，应该是跑得快、结果稳、一旦失败基本就能认定有问题的检查。如果失败了还得再判断该不该管，就先报告，先别急着拦。拦住部署比拦住合并麻烦得多：有些检查代码没改也会变红，系统出故障时，又慢又不稳的检查还会拖住修复。检查可以对着这 2000 行同样跑一遍，人就能把时间花在设计好不好、规格对不对、某个依赖该不该信上。当然，这得先保证这些检查本身靠得住。Agent 最好在本地先跑同一套检查，但流水线还是要再跑一遍。Agent 给出的审查意见可以当参考，不少团队不会只凭这一条就拦住合并。Lab 12 和 A6 接下来就让学生自己把门禁接进持续集成和部署。", "createdAt": "Thu Nov 19 04:54:05 +0000 2026", "replyCount": 14, "retweetCount": 2, "likeCount": 17, "conversationId": "2123278617497186713", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXdmoylakAA8VN4.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXdmoylakAA8VN4.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-19T04:54:05+00:00", "createdAtBeijing": "2026-11-19T12:54:05+08:00", "createdAtLocal": "11-19 12:54 北京", "url": "https://x.com/shao__meng/status/2123278617497186713", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2123278617497186713", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent 开发的持续集成验证门禁", "evidence": "跑得快、结果稳", "rationale": "详述检查分层、误报治理及合并门禁标准"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123297107062997162", "track": "research", "source": {"id": "2123297107062997162", "text": "Everyone’s reacting to “256 tokens matches full-parameter RL.” Fair. But the result that would change how I build a serving stack is the one further down the thread.\n\nA different adapter per request, throughput within 1.5% of the bare model, 2.40× LoRA, P95 TTFT down 56%.\n\nHere’s why that number is the interesting one. Per-request customization has always been possible and always been expensive. With LoRA you’re swapping weights, which means your batch is no longer one model. You either group requests by adapter and pay in queueing delay, or you fuse at runtime and pay in throughput. Either way, personalization becomes a scheduling constraint, and scheduling constraints are what kill serving efficiency.\n\nA soft prompt doesn’t have this problem, because it isn’t a weight at all. It’s tokens. The model is bit-identical across every request in the batch, and the per-user part lives in the prefix, where your serving stack already has machinery: prefix caching, continuous batching, all of it applies unchanged. You don’t need a new system. You need the thing you already built to stop treating customization as a special case.\n\nThat reframes the economics. Today, per-user adaptation is a feature you ration, offered to enterprise tiers because the serving cost is real. If the marginal cost genuinely approaches zero, it stops being a tier and becomes a default. Every user gets their own prefix. Every agent gets its own.\n\nTwo things I’d want to see before believing it at scale: how the prefix cost behaves as you stack more experts, since four concatenated prompts is already 1K tokens of every context window and that’s not free at long context, and whether composition stays additive at ten experts or starts interfering. The curve from 50.4 to 67.7 is four points on a line. I’d like to see where it bends.\n\nBut if it holds, continual post-training stops being a retraining problem and becomes a serving problem. That’s a much better problem to have. Congrats @zhenzhangzz and team.", "createdAt": "Thu Nov 19 06:07:33 +0000 2026", "replyCount": 3, "retweetCount": 4, "likeCount": 48, "conversationId": "2123297107062997162", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2123215871434964998", "text": "We think we’ve found a better path to continual post-training: merging models in input space.\n\n🔹 A 256-token soft prompt (~0.01% of params) matches full-parameter RL\n🔹 Plug-and-play composition: prompts trained separately just stack, with no joint training, and the combo beats the experts. No more MOPD!\n🔹 Better OOD generalization, almost no forgetting\n🔹 ~0 inference overhead, even with a different prompt per request. Built for personalization.", "createdAt": "Thu Nov 19 00:44:45 +0000 2026", "replyCount": 27, "retweetCount": 62, "likeCount": 576, "conversationId": "2123215871434964998", "author": {"username": "zhenzhangzz", "name": "Zhen Zhang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1926296006024417280/mwQWldAI_normal.jpg"}, "authorId": "740391978639200256", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXctkc_aMAAlErH.jpg", "width": 2048, "height": 1307, "previewUrl": "https://pbs.twimg.com/media/HXctkc_aMAAlErH.jpg:small"}], "translationZh": "我们认为，我们找到了一条更好的持续后训练路径：在输入空间中合并模型。\n\n🔹 仅用 256 个 token 的软提示（约占参数量的 0.01%），就能媲美全参数强化学习\n🔹 即插即用的组合：单独训练的提示直接叠加，无需联合训练，组合效果就能超越各个专家模型。再也不需要 MOPD！\n🔹 分布外泛化更好，几乎没有遗忘\n🔹 推理开销几乎为零，即使每个请求使用不同的提示也一样。专为个性化打造。"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-19T06:07:33+00:00", "createdAtBeijing": "2026-11-19T14:07:33+08:00", "createdAtLocal": "11-19 14:07 北京", "url": "https://x.com/GenAI_is_real/status/2123297107062997162", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2123297107062997162", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "软提示持续后训练与个性化推理效率", "evidence": "P95 TTFT down 56%", "rationale": "给出研究结果、部署机制及规模化验证疑点"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "大家都在讨论“256 个 token 就能媲美全参数 RL”。这很正常。但真正会改变我构建推理服务架构方式的，是这串帖子后面的一项结果。\n\n每个请求使用不同的适配器，吞吐量与原始模型的差距不超过 1.5%，达到 LoRA 的 2.40 倍，P95 首 token 延迟（TTFT）降低 56%。\n\n这组数字为什么值得关注？按请求定制一直做得到，但成本也一直很高。使用 LoRA 时需要切换权重，这意味着同一个批次里不再只有一个模型。你要么按适配器将请求分组，付出排队延迟的代价；要么在运行时融合，牺牲吞吐量。无论哪种方式，个性化都会成为调度约束，而调度约束正是推理服务效率的杀手。\n\n软提示没有这个问题，因为它根本不是权重，而是 token。同一批次中的所有请求，使用的模型在比特层面完全一致；用户专属的部分放在前缀里，而推理服务架构早已有相应机制：前缀缓存、连续批处理，都可以直接沿用。你不需要一套新系统，只需要让现有系统不再将定制视为特殊情况。\n\n这改变了成本逻辑。如今，按用户适配是一项需要限量提供的功能，通常只向企业级用户开放，因为推理服务成本确实存在。如果边际成本真的趋近于零，它就不再是某个套餐等级的专属功能，而会成为默认配置。每个用户都有自己的前缀，每个智能体也一样。\n\n在相信它能大规模应用之前，我还想看到两点：一是叠加更多专家时，前缀成本会如何变化。毕竟拼接四个提示就已经占用每个上下文窗口中的 1K token，在长上下文场景下，这并非没有代价。二是组合到十个专家时，效果是否仍能叠加，还是会开始相互干扰。从 50.4 到 67.7 的曲线，目前只有一条线上的四个点。我想看看它会在哪里出现拐点。\n\n但如果这个结果成立，持续后训练就会从重新训练问题，转变为推理服务问题。后者要好解决得多。祝贺 @zhenzhangzz 和团队。"}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2123225707987816618", "track": "enterprise", "source": {"id": "2123225707987816618", "text": "OpenAI 的研究员，平均每天让 Agent 跑出相当于 5.7 个工作日的时长。但跑得多，离什么都能做好还有距离。\n\n刚发布的《Research acceleration: The jagged frontier》公开了不少内部数据，看看 Agent 到底帮 AI 研发加速了多少。\n\n同样是研发任务，差别很大。按内部估算，监控训练任务时，Agent 无需人类介入的成功率有 79%；写推理和服务系统代码时，只有 25%。\n\n关键研究想法也主要来自人类。在研究者回顾的案例里，Agent 更多负责实现、调试和实验，不过已经有研究者提到，和 Codex 讨论时得到了关键启发。\n\n这就是标题里「参差不齐的能力边界」。5.7 个工作日算的是 Agent 累计运行时长，也不能直接当成省下了人类这么多时间。\n\n这篇blog非常值得做 Agent 的朋友读读。能交出去的活越来越多，接下来研发能快多少，可能更取决于那些还得人盯着、反复返工的环节。\n\nhttps://t.co/CL8hcgHu9T", "createdAt": "Thu Nov 19 01:23:51 +0000 2026", "replyCount": 1, "retweetCount": 4, "likeCount": 18, "conversationId": "2123225707987816618", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-19T01:23:51+00:00", "createdAtBeijing": "2026-11-19T09:23:51+08:00", "createdAtLocal": "11-19 09:23 北京", "url": "https://x.com/Xudong07452910/status/2123225707987816618", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2123225707987816618", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Agent 在 AI 研发中的应用成效与边界", "evidence": "Agent 无需人类介入的成功率有 79%", "rationale": "提供研发任务成效数据，并区分运行时长与省时"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2123471884876427328", "track": "agent", "source": {"id": "2123471884876427328", "text": "Each task keeps its state and findings, so work can pass between agents and engineers and resume after a code review or deployment.\n\nEngineers define the workflow in the task service. A dispatch loop periodically checks which tasks are ready for the next step. It assigns an agent to each task by starting a Codex turn with the instructions for the task’s current state.\n\nFor example, a task waiting on a pull request review can subscribe to review comments. The agent doesn’t need to keep running while an engineer reviews the fix. When a matching comment arrives, the task becomes ready again and the dispatch loop can assign an agent to address the feedback.\n\nAfter deployment, another agent picks up the same task to check whether performance has returned to baseline.", "createdAt": "Thu Nov 19 17:42:04 +0000 2026", "replyCount": 3, "retweetCount": 3, "likeCount": 77, "conversationId": "2123471880292299171", "inReplyToStatusId": "2123471882858963146", "author": {"username": "OpenAIDevs", "name": "OpenAI Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_normal.jpg"}, "authorId": "1633874951508721686", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgVqubWcAAuYe3.png", "width": 1600, "height": 808, "previewUrl": "https://pbs.twimg.com/media/HXgVqubWcAAuYe3.png:small"}], "expert": {"priority": "P0", "domain": "Agent 技术突破", "name": "OpenAI Developers", "role": "Agent 平台与开发者产品", "why": "五方向 X 主动热点搜索：Agent 技术突破", "handle": "OpenAIDevs"}, "createdAtIso": "2026-11-19T17:42:04+00:00", "createdAtBeijing": "2026-11-20T01:42:04+08:00", "createdAtLocal": "11-20 01:42 北京", "url": "https://x.com/OpenAIDevs/status/2123471884876427328", "themeId": "editorial", "signalScore": 79, "hotspotMatches": [{"id": "agents", "label": "Agent 技术突破", "matchedTerms": ["agent"]}], "hotspotDirections": ["agents"], "hotspotDirection": "agents", "hotspotDirectionLabel": "Agent 技术突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2123471884876427328", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "持久化任务状态与事件驱动Agent调度", "evidence": "Each task keeps its state and findings", "rationale": "说明状态持久化、评审事件唤醒及部署后验证方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "每个任务都会保留自身状态和已有发现，因此工作可以在智能体与工程师之间交接，并在代码审查或部署后继续推进。\n\n工程师在任务服务中定义工作流。调度循环会定期检查哪些任务已准备好进入下一步，并为每个任务启动一轮 Codex 交互，传入对应当前状态的指令，从而分配智能体。\n\n例如，等待拉取请求审查的任务可以订阅审查评论。工程师审查修复方案时，智能体无需持续运行。收到符合条件的评论后，任务会重新就绪，调度循环便可分配智能体处理反馈。\n\n部署后，另一个智能体会接手同一任务，检查性能是否已恢复到基线水平。"}, "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_normal.jpg"}, {"id": "2123240573171892225", "track": "enterprise", "source": {"id": "2123240573171892225", "text": "Lauren 谈 Grok Bot 自动化：先分清目标与过程，再把判断和反馈教给 Bot\n\n@poteto 认为很多人还没用上 Grok Bot 的完整能力，难点往往不是工具本身，是不太会把一件事拆成可以自动化的目标和过程。所以她写了这篇文章来讲解如何做 Grok Bot 自动化。\n\n先分清目标和过程\n\n她把自动化看成一种思维方式：一边盯着最终要得到什么，一边把事情拆成小步骤。目标是终点，过程是怎么走到那里。她常看到的一个误区，是把过程当成了目标：填表、发邮件只是步骤，真正的目标可能是促成一笔销售、做出新功能，或把库存订到刚好够用。\n\n先把目标说清楚，Bot 才可能一起把过程改得更省事，而不必死守原来的做法。在 Grok Bot 里新建一个 Bot 后，先把目标告诉它；如果目标还说不清，就让 Bot 先提问、一起访谈，直到有一个自己满意的表述。\n\n把做法和判断讲清楚，再让它自己改进\n\n目标定下来后，把平时自己怎么做这件事讲给 Bot：常用步骤、会留意什么、用哪些应用和工具、怎样检查做对了、信息从哪里来、反馈从哪里来。她建议用语音一口气讲，不必先整理，先让 Bot 用简单的话复述目标和过程，确认后再动手；也可以让它对照目标，看有没有更省事的做法。过程里还有大量自己习以为常、却很少说出口的判断，比如预约时哪些服务更久、谁能做哪项工作、什么时候要多留间隔。还要讲清数据冲突时以哪份为准，以及怎样才算做完：发出邮件并不等于预约已经完成。不必一开始就穷尽所有情况，先拿几个真实例子，包括出过错的例子，问 Bot 会怎么处理，再给反馈。\n\nBot 开始接手后，要给它获取反馈的途径，让它自己改进，比如去看邮件、社交平台或评价网站，再对照当天记录，主动提出改过程的建议。业务里数字化程度越高、多个系统里又有一致的唯一标识，Bot 就越容易把数据对上，也越能提出改进。Grok Bot 还可以帮忙做记录工具。\n\n用日程或触发让它自动跑起来\n\n接下来是何时开始干活：邮件到达、有人发来 Slack 或 Teams 消息，还是按周、隔天这样的固定节奏。在 Grok Bot 里，这些用 routines 来设置。没有 routines，Bot 只有被问起才会做；要把人从中间环节里拿掉，就需要让它自动启动，直接让 Bot 帮忙配置即可。\n\n最后她介绍了 Dr Eggbot：这是一个 Bot 设计师，她把自己关于自动化工作的经验教给了它，用来帮人做出质量更高的 Bot。https://t.co/hqHOtp36kP", "createdAt": "Thu Nov 19 02:22:55 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 11, "conversationId": "2123240573171892225", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2123159537016533493", "text": "Automate Anything with Grok Bot", "createdAt": "Wed Nov 18 21:00:54 +0000 2026", "replyCount": 1104, "retweetCount": 1628, "likeCount": 15449, "conversationId": "2123159537016533493", "author": {"username": "poteto", "name": "lauren", "profileImageUrl": "https://pbs.twimg.com/profile_images/2049256514091929600/Qu4030T2_normal.jpg"}, "authorId": "2832427459", "article": {"title": "Automate Anything with Grok Bot", "previewText": "Automation can be surprisingly hard to get right, even for people who do it every day. I’d like to share how I approach it, at work and in my personal life, and how Grok Bot can help you take on more", "titleZh": "用 Grok Bot 自动化处理任何事", "previewTextZh": "即使每天都在做自动化，要把它做好也可能难得出乎意料。我想分享自己在工作和生活中处理自动化的方法，以及 Grok Bot 如何帮你完成更多事情。"}, "translationZh": "用 Grok Bot 自动化处理任何事"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXdEBbDagAAwqG7.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXdEBbDagAAwqG7.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-19T02:22:55+00:00", "createdAtBeijing": "2026-11-19T10:22:55+08:00", "createdAtLocal": "11-19 10:22 北京", "url": "https://x.com/shao__meng/status/2123240573171892225", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2123240573171892225", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "业务自动化的目标拆解与反馈闭环", "evidence": "先拿几个真实例子，包括出过错的例子", "rationale": "给出目标澄清、判断传授、反馈和自动触发方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123321668760469790", "track": "agent", "source": {"id": "2123321668760469790", "text": "非常高兴很多朋友 follow 我的建议开始尝试 T3 Code，这是我使用这段时间以来的建议：\n\n1. 不要用 ACP，不要用 ACP，不要用 ACP\n\nACP 可以毁掉你所有的美好体验。我的建议是这样的，你之前喜欢用什么 agent 就接着用，codex / claude / pi 都行（除了 agy），然后后面去对接 magpie 去用所有的模型\n\n千万不要用 ACP 去接入别的 Agent，也千万不要用 agy。\n\n2. 不要用 goal\n\nT3 Code 本质是按照 events 来编排的，它会注入很强的不要轮询，鼓励使用 wait event 然后结束的提示词。这样它会非常容易的跟 codex 的 goal 机制打架，导致跑不了几轮就会因为进入等待 CI / Review 的阶段而自动进入 goal blocked 状态。而 Agent 本身又没有 resume goal 的能力，导致就算 CI 已经过了，也没法恢复正常的状态。\n\n强烈建议基于 T3 构建一个 GTD 模型，使用一个统一的 Inbox Thread 去接收和处理各个 Loop 中遇到的问题，然后 Loop 本身搭配二三十分钟一次的自动化唤醒，体验会非常好。记得让 Loop 自己去担任 Leader，把活都派出去给 Worker 之类的，Loop 不要做太重的任务。\n\n3. 一定跨端使用\n\nT3 Code 只在本地跑的话没啥魅力，我个人评价是不如 Codex App 的体验好。但是如果搭配稳定的服务器跨端使用，体验感会非常好。你可以在一个中央的服务器上跑 Loop，然后把具体的工作派发到独立的构建服务器上，让他们自己跨服务器对话，持续推进问题。", "createdAt": "Thu Nov 19 07:45:09 +0000 2026", "replyCount": 64, "retweetCount": 20, "likeCount": 347, "conversationId": "2123321668760469790", "author": {"username": "xuanwo", "name": "Xuanwo", "profileImageUrl": "https://pbs.twimg.com/profile_images/1710192299588964352/WY_GNo3r_normal.jpg"}, "authorId": "3399124639", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Xuanwo", "role": "Agent 与开发工具实践与观察", "why": "能指出实际 Agent 请求参数和输出上限问题，补底层使用与维护经验。", "handle": "Xuanwo"}, "createdAtIso": "2026-11-19T07:45:09+00:00", "createdAtBeijing": "2026-11-19T15:45:09+08:00", "createdAtLocal": "11-19 15:45 北京", "url": "https://x.com/xuanwo/status/2123321668760469790", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2123321668760469790", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "T3 Code 编排故障与跨服务器实践", "evidence": "跑不了几轮就会因为进入等待 CI / Review", "rationale": "自述编排冲突机制，提供任务循环与跨端方案"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1710192299588964352/WY_GNo3r_normal.jpg"}, {"id": "2123245283136184727", "track": "agent", "source": {"id": "2123245283136184727", "text": "开源的 Grok Bot 来了，甚至是跑本地模型，真是不用花一分钱...\n\nDeepSeek 早期成员张博出来创业，上周开源了一个项目叫 Linger：Grok Bot 那种主动替你干活的 Agent，整个装在你自己电脑上，干活的模型也可以跑在本地，不按 token 付费。\n\n我自己用 Grok Bot 跑着出海运营、社媒分析、交易盯盘三个 Bot，对照着看了一遍，Grok Bot 能做的它都能做了：\n\n· 主动开口：盯着邮件、日历、Slack，有事才找你，晚上 10 点后只记不推\n· 记得你：每晚把邮件、聊天、会议整理成个人 Wiki，告诉一个 Agent，所有 Agent 都知道\n· 越用越懂：你嫌它烦两次，它自己记成规则，以后不再提\n· 能动手：直接用你已登录的 Chrome 和桌面应用，一句话组一支 Agent 团队\n· 发邮件、发消息必须你同意\n\n最大的区别是模型运行在哪：Grok Bot 的模型在云上，Linger 的可以就在你电脑里：\n1250 亿参数的模型，一张 12GB 的 RTX 3060 加 64GB 内存，跑到每秒 45 个 token，这个速度完全够用了。\n\n模型在本地，它才敢一直在线，每条消息都判断一次要不要打扰你，按他们的估算，同样的判断放在云上，一个月约 $270。记忆存成本机 Markdown，配置和修改起来很方便\n\n装起来也不用自己选择模型：\n桌面 App 选 Quick Install，它先读你的显卡和内存，推荐一个这台电脑跑得动的本地模型，写清要下载多大、占多少磁盘和内存。你点同意才会开始下载模型，模型答对一个真实问题才算装好。如果电脑带不动，它会直接告诉你原因，你再改用 Claude Code、Codex 的订阅。\n\n一个小坑：它按「此刻空闲」的内存挑模型。我之前48GB 的 Mac 开着一堆软件时只剩 14GB 空闲，它就只推荐小模型。大家装之前记得先把占内存的软件关掉。\n\n能跑多强看你的机器（官方跑分，第三方 AIHOT 量表）：\n· Mac 16GB：超过 GPT-4o\n· N 卡 12GB + 32GB 内存：和 Claude Sonnet 4.6 同一档\n· N 卡 24GB + 64GB 内存：接近 Claude Opus 4.6\n\n门槛先说清：要先装好 Claude Code、Codex 或 Pi 之一，每晚整理记忆这类后台活目前还走 Claude Code 或 Codex 的额度；本地模型最低 Apple 芯片 Mac 16GB，或 N 卡 8GB 显存 + 32GB 内存。\n\n想知道你的电脑能跑哪一档，装上点一次 Quick Install 就知道 \n\n开源地址👉 https://t.co/aWVJ2KVZmi", "createdAt": "Thu Nov 19 02:41:38 +0000 2026", "replyCount": 26, "retweetCount": 14, "likeCount": 185, "conversationId": "2123245283136184727", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "quotedTweet": {"id": "2123237197050794364", "text": "In the 1960s, computing was centralized until the PC put power into everyone's hands. Now Al is trained in datacenters and rented back to you token by token.\n\nToday we open source Linger (@HeyLingerAl), your personal agent living on your own computer. \n\nWe believe intelligence should be distributed. Your context, your data, and the intelligence that powers them should be owned entirely by you. \n\nGithub: https://t.co/CS1Rj8H8yJ Homepage: https://t.co/R7clDJdc6i", "createdAt": "Thu Nov 19 02:09:30 +0000 2026", "replyCount": 107, "retweetCount": 156, "likeCount": 615, "conversationId": "2123237197050794364", "author": {"username": "zhangboknight", "name": "Tony Zhang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1355794305701474304/c-mzSkYY_normal.jpg"}, "authorId": "730414778087137280", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123235635670704128/img/LG6mrUqMZ_egC3p9.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123235635670704128/img/LG6mrUqMZ_egC3p9.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123235635670704128/vid/avc1/1920x1080/lmWVZ1SQs_ZCTSjT.mp4?tag=29", "durationMs": 60600}], "translationZh": "20 世纪 60 年代，计算集中在大型计算中心，直到 PC 将计算能力带到每个人手中。如今，AI 在数据中心训练，再按 token 租给你使用。\n\n今天，我们开源了 Linger（@HeyLingerAl），一个运行在你自己电脑上的个人智能体。\n\n我们相信，智能应该是分布式的。你的上下文、你的数据，以及处理它们的智能，都应完全归你所有。\n\nGithub：https://t.co/CS1Rj8H8yJ 主页：https://t.co/R7clDJdc6i"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123245111916318720/img/nAn_mG72qDV_kY1K.jpg", "width": 2048, "height": 993, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123245111916318720/img/nAn_mG72qDV_kY1K.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123245111916318720/vid/avc1/3840x1862/VtJzwnrDAXDSvwnu.mp4?tag=29", "durationMs": 32483}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "雪踏乌云", "role": "内容、视觉与多模态实践与观察", "why": "具体拆出海运营、流量监控和自媒体 Bot 职责，跨场景实操价值高。", "handle": "Pluvio9yte"}, "createdAtIso": "2026-11-19T02:41:38+00:00", "createdAtBeijing": "2026-11-19T10:41:38+08:00", "createdAtLocal": "11-19 10:41 北京", "url": "https://x.com/Pluvio9yte/status/2123245283136184727", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2123245283136184727", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Linger本地主动Agent与安装经验", "evidence": "它按「此刻空闲」的内存挑模型", "rationale": "有开源入口、安装复盘与限制，性能属转述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, {"id": "2123245663182106812", "track": "agent", "source": {"id": "2123245663182106812", "text": "好家伙，自己的 Grok Bot，真让我在 4090 上搭出来了😂\n\nGrok Bot 是好用，可它跑在别人的服务器上，模型也是别人选好的，最近限流也很严重。我就想要一个自己的：模型自己挑，跑在自己的显卡上，跑多少个任务都是 0 Token。\n\n这次用的是开源的 Linger 和它的推理引擎 PolyStrata。PolyStrata 负责把大模型跑起来：\n\n1. 把 MoE 模型的专家分层放：常用的放显卡，少用的放内存，很少用的放 SSD，8G 显存的笔记本也能跑。\n2. 支持 Qwen、DeepSeek、GLM、Gemma 等 12 个模型，运行中就能换。跑大模型比同配置的 llama.cpp 最高快 5 倍。\n3. 兼容 OpenAI 和 Anthropic 的接口，Claude Code、Codex 这类工具能直接接上。\n\nLinger 是装在自己电脑上的开源个人助手：\n\n1. 接上邮件、聊天和日历后，能跨应用找上下文。邮件草稿写好了，你不点发送就不会发。\n2. 会主动找你。客户约你谈预算，它先占住时间、写好简报，等你确认。\n3. 活儿大一点，它会拉一个 Agent 团队分工，最后把成果交给你过目。\n\n最爽的是模型随便配。Linger 底下可以跑 Claude Code、Codex 或 Pi：主控交给 Opus 5.5、Fable 5.2 或 GPT-6 Astra这种顶级模型，用你已经在付的订阅；其他活儿交给本地模型，跑在自己的显卡上。哪个活儿用哪个模型，自己调配。\n\n我这次是 Linger 装在 Mac 上，接 本地部署4090显卡上的 Gemma4，跑得很快，当助手用也记得住我每周要做的事。连接外部应用、用语音和后台整理记忆，会用到外部服务。\n\n同一个 PolyStrata 引擎，我还在另一台 V100 上跑了千问，搭了一个微信雷达。我加了 190 个群，攒了二十多万条消息。雷达每小时扫一遍，谁@了我、群里在聊什么、有哪些链接，都分好了类。\n\n我还给 Linger 接上了自己的工具：\n知识库：我这些年的资料都存在里面。我问一个历史决定，它把答案和出处一起发了回来。晨报挂上了定时任务，每天早上八点半自动生成，要点发到聊天里。\n推特：只读不写，不会发帖，也不会点赞和私信。我让它看我最近发了什么，推文被分成了工具对比、视频技术和工作流三类。\n\n兄弟们，想要一个自己的 AI 助手，这套真值得折腾一下。\n\n两个项目都已开源，地址放评论区了👇 \n觉得有用，记得去 GitHub 点个⭐️", "createdAt": "Thu Nov 19 02:43:08 +0000 2026", "replyCount": 47, "retweetCount": 9, "likeCount": 81, "conversationId": "2123245663182106812", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2123237197050794364", "text": "In the 1960s, computing was centralized until the PC put power into everyone's hands. Now Al is trained in datacenters and rented back to you token by token.\n\nToday we open source Linger (@HeyLingerAl), your personal agent living on your own computer. \n\nWe believe intelligence should be distributed. Your context, your data, and the intelligence that powers them should be owned entirely by you. \n\nGithub: https://t.co/CS1Rj8H8yJ Homepage: https://t.co/R7clDJdc6i", "createdAt": "Thu Nov 19 02:09:30 +0000 2026", "replyCount": 107, "retweetCount": 155, "likeCount": 613, "conversationId": "2123237197050794364", "author": {"username": "zhangboknight", "name": "Tony Zhang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1355794305701474304/c-mzSkYY_normal.jpg"}, "authorId": "730414778087137280", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123235635670704128/img/LG6mrUqMZ_egC3p9.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123235635670704128/img/LG6mrUqMZ_egC3p9.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123235635670704128/vid/avc1/1920x1080/lmWVZ1SQs_ZCTSjT.mp4?tag=29", "durationMs": 60600}], "translationZh": "20 世纪 60 年代，计算集中在大型计算中心，直到 PC 将计算能力带到每个人手中。如今，AI 在数据中心训练，再按 token 租给你使用。\n\n今天，我们开源了 Linger（@HeyLingerAl），一个运行在你自己电脑上的个人智能体。\n\n我们相信，智能应该是分布式的。你的上下文、你的数据，以及处理它们的智能，都应完全归你所有。\n\nGithub：https://t.co/CS1Rj8H8yJ 主页：https://t.co/R7clDJdc6i"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123245370235133952/img/PCzPPPYnGwBNUJ2n.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123245370235133952/img/PCzPPPYnGwBNUJ2n.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123245370235133952/vid/avc1/1920x1080/B6cRBOGAkdehF26i.mp4?tag=29", "durationMs": 302500}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-19T02:43:08+00:00", "createdAtBeijing": "2026-11-19T10:43:08+08:00", "createdAtLocal": "11-19 10:43 北京", "url": "https://x.com/servasyy_ai/status/2123245663182106812", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2123245663182106812", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Linger本地助手与跨应用自动化实践", "evidence": "雷达每小时扫一遍", "rationale": "提供本地部署、消息分类和定时晨报实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2123224568022319248", "track": "enterprise", "source": {"id": "2123224568022319248", "text": "We've made it even easier to reduce coding agent costs with Unity Gateway! The new Unity Gateway Insights automatically finds cost saving opportunities once you pass your LLM traffic through Unity Gateway, including misconfigured tools/MCPs, off-topic use of coding agents, and opportunities for routing work to smaller models. It works with Claude Code, Codex, GitHub Copilot and any existing agent, on your existing LLM capacity. Just pass the traffic through Unity Gateway and hit analyze to get a report.\n\nWe're continually updating this product with new cost saving opportunities we find internally at Databricks (e.g. wasteful Claude settings) and in our work with customers.\n\nhttps://t.co/yQxPHDH3Y9", "createdAt": "Thu Nov 19 01:19:19 +0000 2026", "replyCount": 31, "retweetCount": 9, "likeCount": 78, "conversationId": "2123224568022319248", "author": {"username": "matei_zaharia", "name": "Matei Zaharia", "profileImageUrl": "https://pbs.twimg.com/profile_images/787317891867693061/isUFxFC1_normal.jpg"}, "authorId": "201130645", "expert": {"priority": "P0", "domain": "AI 基础设施 / 数据与 ML 平台", "name": "Matei Zaharia", "role": "Databricks 联合创始人；Berkeley", "why": "ML 数据平台、Spark、MLflow、Lakehouse + AI", "handle": "matei_zaharia"}, "createdAtIso": "2026-11-19T01:19:19+00:00", "createdAtBeijing": "2026-11-19T09:19:19+08:00", "createdAtLocal": "11-19 09:19 北京", "url": "https://x.com/matei_zaharia/status/2123224568022319248", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2123224568022319248", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Unity Gateway Insights 分析代理成本浪费", "evidence": "misconfigured tools/MCPs", "rationale": "发布成本分析功能，说明接入方式与诊断范围"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们让通过 Unity Gateway 降低编程智能体成本变得更简单了！只需将 LLM 流量接入 Unity Gateway，全新的 Unity Gateway Insights 就会自动发现节省成本的机会，包括配置不当的工具/MCP、将编程智能体用于无关任务，以及可以交给更小模型处理的工作。它支持 Claude Code、Codex、GitHub Copilot 及任何现有智能体，可直接使用你现有的 LLM 资源。只需将流量接入 Unity Gateway，再点击分析，即可获取报告。\n\n我们持续将 Databricks 内部及客户合作中发现的新节省机会加入产品，例如造成浪费的 Claude 设置。\n\nhttps://t.co/yQxPHDH3Y9"}, "avatar": "https://pbs.twimg.com/profile_images/787317891867693061/isUFxFC1_normal.jpg"}, {"id": "2123423428602663131", "track": "creative", "source": {"id": "2123423428602663131", "text": "兄弟们又给你们更新了MiniMax H3 打戏 skill\n\nh3-fight 最近更新：\nhttps://t.co/twn2vGh4O9\n打戏改成 10 秒 5 个镜头：每一招都能画完整，检查脚本会自动查时间表。另外新加了以小打大、团战、长短兵器的样例。\n\n新增“特效大场面快剪”：先多出一倍素材，再按 0.4 秒一切混剪。剪辑节奏追平参考片，声音单独铺一条连续底音，不会一卡一卡。\n\n新工具：量速度（和参考片比换镜和动作快慢）、拆帧挑镜头、一键混剪。\n\n另外有测试和 CI，一条命令就能生成 ComfyUI 模板。", "createdAt": "Thu Nov 19 14:29:31 +0000 2026", "replyCount": 5, "retweetCount": 4, "likeCount": 52, "conversationId": "2123423428602663131", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2123402033390875100", "text": "UU远程今天正式官宣了会员收费方案，我第一时间把客户端里的公告从头到尾翻了一遍。\n\n看完公告我心里悬着的石头反而落了地：拿它远程跑 AI Agent 的人，核心工作流依然一分钱都不用花；就算你想冲高刷画质，老用户领完五折券算下来一个月也才 9.9 元。\n\n好产品只有具备健康的造血能力才能长久维护下去，我帮大家把这次 12 月 1 日上线的收费边界和账本彻底算清楚：\n一、免费版保留了什么（AI 编程党全员白嫖）\n官方明确承诺基础远控继续免费，不限连接次数、不限时长、不排队、也不塞广告。我们远程跑代码最刚需的远程终端、端口映射、CLI 命令、文件互传、远程开机和隐私屏保，这次全都留在了免费版里，官方只把免费版的桌面画质上限调到了 1080P 30 帧。\n算了一笔对比账：\nToDesk 免费版每月死卡 80 小时和 200 次连接上限，光一个远程终端就要捆在 158 元/年的专业版里卖；\nUU远程直接把终端、端口映射和无限时长次数全放在免费版里敞开供应。\n\n二、付费版 VIP 和 SVIP 到底卖什么、该怎么选\n12 月 1 日上线的付费会员分两档，把收费点精准落在了高画质和跨境节点上：\n1、VIP 定价 238 元/年（月付 30 元，连续包月 24 元），解锁 4K 原画 144 帧、500Mbps 高码率、多通道、文件高速中转和多屏控多屏。12 月 1 日前注册的老用户去端内通知中心领一张五折年卡券，VIP 折后只要 119 元/年，算下来每月才 9.9 元（隔壁同规格 4K 高刷档位要卖 298 元/年起）。\n\n2、SVIP 定价 758 元/年（月付 98 元，连续包月 88 元，老用户五折后 379 元/年），在 VIP 基础上额外增加了全球远控加速节点。\n\n大家按自己的真实场景对号入座就行：\n你平时出门用手机连终端盯 Agent、传文件、看本地工作台，用免费版就完全够使；\n\n你需要 4K 144 帧远程剪片、看设计稿或打游戏，领张五折券开个 9.9 元/月的 VIP 最划算；\n\n你把 Mac mini 放在海外家宽里跑 Claude，直接上五折 SVIP 走全球节点就能告别跨国卡顿。另外鸿蒙版和 Linux 版内测期间所有付费功能也全部免费。\n\n现在我的工作状态是：Mac 用 Orca 跑着三支 AI 团队，我出门只用手机连上 UU远程，叭哥说动嘴派活。\n\n目前这套明码标价的收费逻辑我非常支持。\n大家不管眼下开不开会员，记得在 12 月 1 日前先打开客户端通知中心把那张五折老友券领到手再说！", "createdAt": "Thu Nov 19 13:04:30 +0000 2026", "replyCount": 14, "retweetCount": 3, "likeCount": 28, "conversationId": "2123402033390875100", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123401911751827456/img/lOkAiz-e91c9N6zT.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123401911751827456/img/lOkAiz-e91c9N6zT.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123401911751827456/vid/avc1/1920x1080/CStrnz44MmnByFKY.mp4?tag=29", "durationMs": 84316}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123421934696419328/img/gHRYKVawGk0k_rx7.jpg", "width": 1664, "height": 928, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123421934696419328/img/gHRYKVawGk0k_rx7.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123421934696419328/vid/avc1/1664x928/3X8AQy13qbzue8bI.mp4?tag=29", "durationMs": 31041}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-19T14:29:31+00:00", "createdAtBeijing": "2026-11-19T22:29:31+08:00", "createdAtLocal": "11-19 22:29 北京", "url": "https://x.com/servasyy_ai/status/2123423428602663131", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2123423428602663131", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "MiniMax H3 打戏技能与混剪流程更新", "evidence": "打戏改成 10 秒 5 个镜头", "rationale": "给出镜头节奏、连续底音及混剪工具等具体方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2123246304554041737", "track": "agent", "source": {"id": "2123246304554041737", "text": "Netlify 十年最大改版：让 Agent 搭建和开发者改代码走同一套工作流\n\n@Netlify 创始人兼 CEO @biilmann 宣布，公司推出新品牌、新网站，以及从头重新做的应用体验。他称之为十年来对品牌和用户体验最大的一次改动，也是近两年前开始的公司转型的最后一步。Netlify 已从一家许多人认为过了高峰的十年业务，做到单日新增超过 10 万用户，ARR 突破 1 亿美元，并预计 ARR 增长 130%。\nhttps://t.co/uokLngpegc\n\n把两种搭建方式放在同一个平台\n\n2025 年 Netlify 十周年时，他提出 Agent Experience（AX），并把公司重心放到让下一批十亿人也能在网上搭建应用：既为能自主行动的 Agent 做准备，让不必先学会写代码的人也能把想法做成软件，也始终把人和 Agent 一起工作的体验放在中间。\n\n他写道，眼下的工具分成两类：一类 AI 应用搭建器容易做出第一版，却很难继续往下走；一类开发者平台能跑正经软件，却把不会写代码的人挡在外面。团队往往要把应用从一边搬到另一边，过程中总会出问题。Netlify 的做法是让这两种搭建方式都能从头用到上线：做出来、分享出去、跑起来，从第一天到第一百天都在同一个平台上。\n\n新工作台、常驻服务器和集成\n\n新体验里，应用放在中间：描述想要什么，选择 Agent 和模型，对话旁边就能看到实时预览。数据、登录和表单是内置的。每次改动都会生成供团队审阅的预览，任何改动也都可以撤回。开发者可以在 Git、自己的开发环境或自己的编程 Agent 里接手同一个应用，所有改动走同一套工作流。他写道，这一体验目前已对大多数新用户开放，未来几周会向其他人放开，新控制台体验可加入等候名单。\n\n对需要持续运行的应用，比如实时多人、聊天、AI Agent、长时间任务，他们推出了 Netlify Server，把平台做成同时覆盖前端、后端和数据库的全栈环境，并且每次部署预览都有独立的服务器。他写道，目前已有超过 1 万台服务器在其上运行。另外还有 150 多项与 Stripe、Notion、Linear 等工具的集成，让 Agent 在搭建时能拿到业务上下文，应用上线后也能接到现有技术栈。\n\n他强调这并不意味着要抛开开发者。新体验下面仍是过去十多年那套有完整文档的基础能力，变化在于：开发者为之构建的那些人，现在可以在同一个应用上一起工作。", "createdAt": "Thu Nov 19 02:45:41 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 10, "conversationId": "2123246304554041737", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2123088138428129501", "text": "Today we’re launching a new Netlify. New brand, new website, new app experience, rebuilt from first principles.\n\nIt’s the biggest change in our decade-long history, and it comes from a bet we made on ourselves.\n\nThis is just the beginning.\n\nhttps://t.co/DpuU1WAIu0", "createdAt": "Wed Nov 18 16:17:11 +0000 2026", "replyCount": 133, "retweetCount": 70, "likeCount": 720, "conversationId": "2123088138428129501", "author": {"username": "biilmann", "name": "Matt Biilmann", "profileImageUrl": "https://pbs.twimg.com/profile_images/560874041452408833/a8obZPqr_normal.jpeg"}, "authorId": "24203304", "translationZh": "今天，我们推出焕然一新的 Netlify。全新品牌、全新网站、全新应用体验，一切从第一性原理出发重新打造。\n\n这是我们十年历史中最大的一次变革，源于我们对自身的一次押注。\n\n这仅仅是开始。\n\nhttps://t.co/DpuU1WAIu0"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXdJOgxa8AAXhEa.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXdJOgxa8AAXhEa.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-19T02:45:41+00:00", "createdAtBeijing": "2026-11-19T10:45:41+08:00", "createdAtLocal": "11-19 10:45 北京", "url": "https://x.com/shao__meng/status/2123246304554041737", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2123246304554041737", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Netlify 发布统一 Agent 与开发者工作流", "evidence": "每次改动都会生成供团队审阅的预览", "rationale": "发布新工作台与常驻服务器，包含具体协作能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123318463590474010", "track": "enterprise", "source": {"id": "2123318463590474010", "text": "趁着这个机会分享一下和一个做真实的制造业FDE的团队得到的信息，他们是真的接了一笔几百万对企业的FDE订单，如果说你想去做制造业的FDE，不妨看看下面这几点⬇️\n\n1、你以为的FDE是给部门和流水线做自动化，实际上最主要的工作是在做访谈，补十年前数字化的活儿\n\n2、谈单最大的一个摩擦是，甲方往往是五六十岁的某某部长，在一起沟通交流摩擦特别大，决策链路比较长\n\n3、2025年是Agent元年跟风的公司太多了，但是真正能够懂Agent又懂业务落地的人太少，导致交付的压力是比较大的\n\n4、本来以为只是一个小包，但是在过程中发现，真正要解决的不是AI问题，而是很多的业务卡点。最终完成的是企业改造，在这个过程中会把单子谈大\n\n5、客户想要的东西很多，他的使用场景是天马行空的。但是Agent是需要实际的业务场景约束的。有时候用户提出的Benchmark问答集根本没办法设定，只能通过类似于像Monid这类的数据接口，从外部找解决办法，定制skills来拉齐需求\n\n6、客户找上门，开口就是要上Agent，但有的场景压根就不适合。很多项目其实在立项那天就已经死了，只是拖到验收那天才露馅\n\n7、做方案得替客户多想一步。他没提的，你要主动提；以后要维护、要加功能的，现在就把口子留好。有些需求确实不合理，得把话说开，让业务那边让一步，客户才会真的接受\n\n8、很多需求为了结项，是用了很多人情功夫，而不是实际的业务功夫\n\n9、不需要用Claude、Deepseek等等，很多时候模型都是模型，但模型的本质是算法，最终是用10年前的一些计算机算法在完成任务，很多数字化的问题现在的企业并没有解决\n\n10、项目管理很重要，尤其是针对于小团队，更是要把控好需求管理、项目管理", "createdAt": "Thu Nov 19 07:32:25 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 2, "conversationId": "2123318463590474010", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "quotedTweet": {"id": "2123251216121819638", "text": "逆天！！做制造业FDE的兄弟们真的有福了，直接拿去就能用了！！最近在深入的研究具身智能+AI硬件，让我发现了个行业的惊天秘密\n\n做视觉识别，最麻烦的可能不是识别物体，而是每来一个新需求，就可能要重新标注数据、训练模型\n\n但如果只需要换一句话呢？\n找出被白色快递袋围着的黑色包裹\n找出左边穿蓝色工作服的工人\n找出白帽工人脚下的蓝桶\n同一个画面，换一句话，就能指定不同的定位目标\n\n最近关注到 @OmAI_lab 的开源视觉模型 VLX-Seek，觉得这个方向挺有意思\n\n不只是工业质检、仓储物流、机器人和智能硬件，很多过去难以实现的视觉识别需求，或许都有了新的解决思路\n\n以前是让人适应模型的检测类别，现在是尝试让模型理解人的需求\n\n如果你也有一个想让 AI 看懂、找准的场景，不妨拿自己的图片试试👇", "createdAt": "Thu Nov 19 03:05:12 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 7, "conversationId": "2123251216121819638", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123250462594072576/img/FgM7ZOwC6qycLYnA.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123250462594072576/img/FgM7ZOwC6qycLYnA.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123250462594072576/vid/avc1/1080x1920/6An7GYsIzy383TwJ.mp4?tag=29", "durationMs": 31500}]}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "叫我阿杭", "role": "内容、视觉与多模态实践与观察", "why": "公开 Obsidian、录音与自媒体制作流程，直接贴合内容生产需求。", "handle": "Astronaut_1216"}, "createdAtIso": "2026-11-19T07:32:25+00:00", "createdAtBeijing": "2026-11-19T15:32:25+08:00", "createdAtLocal": "11-19 15:32 北京", "url": "https://x.com/Astronaut_1216/status/2123318463590474010", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2123318463590474010", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "制造业FDE需求与交付复盘", "evidence": "最主要的工作是在做访谈", "rationale": "转述团队交付经验，具体涉及需求约束与项目管理"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, {"id": "2123215680153534612", "track": "agent", "source": {"id": "2123215680153534612", "text": "Agent 每走一步，都要停下来等大模型想一次？\n\nLMMs-Lab 刚开源的 The Harness 想换个思路。模型只在关键节点出场，做规划并写一段程序，之后由程序和反应规则接着跑，遇到处理不了的情况再交回给模型。\n\n它分四层，模型、程序、反应规则和安全层，各自按自己的节奏运行。能接桌面、浏览器和 Coding Agent，也能接机器人上的策略模型。\n\n并且在执行中验证有效的做法还可以存成 Skill，测试通过后同一次任务里就能接着用，模型权重不用动。\n\n项目还比较早期，但「边做边想、边做边攒经验」这个方向挺值得做 Agent 的朋友看看。\n\n项目：https://t.co/r4kxob9ZR4\n\nGitHub：https://t.co/WW79AB4zL4", "createdAt": "Thu Nov 19 00:44:00 +0000 2026", "replyCount": 5, "retweetCount": 6, "likeCount": 27, "conversationId": "2123215680153534612", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-19T00:44:00+00:00", "createdAtBeijing": "2026-11-19T08:44:00+08:00", "createdAtLocal": "11-19 08:44 北京", "url": "https://x.com/Xudong07452910/status/2123215680153534612", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2123215680153534612", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "The Harness 分层执行与技能积累", "evidence": "模型只在关键节点出场，做规划并写一段程序", "rationale": "介绍开源框架的执行分层与任务内技能复用机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2123232039256387989", "track": "agent", "source": {"id": "2123232039256387989", "text": "搭完就是一个 API\n\n我觉得这是 Langflow 最实用的地方：flow 保存好，接口就有了，不用你再包一层。\n\n在流程页面点 Share → API access，Python、JavaScript、curl 三种调用代码都是生成好的，地址和 flow ID 已经填进去：\n\ncurl -X POST \"http://localhost:7860/api/v1/run/你的FLOW_ID\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"x-api-key: $LANGFLOW_API_KEY\" \\\n  -d '{\"input_value\": \"你好\", \"output_type\": \"chat\", \"input_type\": \"chat\", \"session_id\": \"user-001\"}'\n\nsession_id 用来区分对话，同一个 id 的消息算同一段聊天。想让调用方临时改参数，比如换个模型温度，就在组件里把那个字段标成 API，请求里带上 tweaks 覆盖。只对这一次请求生效，保存的流程不会变。\n\n要挂到网站上，Share 里还有一段嵌入代码，贴进页面就多了一个聊天窗口。\n\n不想跑完整的 Langflow 服务也可以。把 flow 导出成 JSON，用轻量版的 lfx 单独起一个接口：\n\nexport LANGFLOW_API_KEY=\"换成你自己的随机字符串\"\nexport OPENAI_API_KEY=\"sk-...\"\nuvx lfx serve my-agent-flow.json\n\nlfx 不带数据库，也不存聊天记录，适合把调好的流程打进容器上线。", "createdAt": "Thu Nov 19 01:49:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2123232037977162030", "inReplyToStatusId": "2123232038555955311", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXc0OmrbwAAhVxP.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HXc0OmrbwAAhVxP.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-19T01:49:00+00:00", "createdAtBeijing": "2026-11-19T09:49:00+08:00", "createdAtLocal": "11-19 09:49 北京", "url": "https://x.com/sitinme/status/2123232039256387989", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2123232039256387989", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Langflow API 调用与轻量部署", "evidence": "请求里带上 tweaks 覆盖", "rationale": "包含调用示例、会话隔离及轻量部署方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2123212695310905763", "track": "agent", "source": {"id": "2123212695310905763", "text": "Chris Tate 分享了一个新技能，它基于 Google Chrome 团队推出的 Modern Web Guidance（现由 Chrome、Edge、Firefox 和 MDN 共同维护）。AI 代理会先查询这些官方最佳实践，再应用到代码中，并通过 vercel-labs/agent-browser 在真实浏览器里验证结果。覆盖布局偏移、减少动画、深色模式、对话框焦点等方面，示例中通过补全图片宽高等调整，CLS 从 0.14 降到了 0，性能明显提升。", "createdAt": "Thu Nov 19 00:32:08 +0000 2026", "replyCount": 1, "retweetCount": 2, "likeCount": 20, "conversationId": "2123212695310905763", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2122816672625275030", "text": "New skill: modern-web-guidance\n\nYour agent looks up Chrome's Modern Web Guidance, applies it to your code, then checks the result in a real browser\n\nLayout shift, reduced motion, dark mode, dialog focus, more\n\nStart here:\nnpx skills add vercel-labs/agent-browser https://t.co/SObV8fLNzh", "createdAt": "Tue Nov 17 22:18:29 +0000 2026", "replyCount": 37, "retweetCount": 103, "likeCount": 1816, "conversationId": "2122816672625275030", "author": {"username": "ctatedev", "name": "Chris Tate", "profileImageUrl": "https://pbs.twimg.com/profile_images/1793812678462365696/rJGwsL4h_normal.jpg"}, "authorId": "152108221", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXCgyWWcAArZZU.jpg", "width": 1080, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HXXCgyWWcAArZZU.jpg:small"}], "translationZh": "新技能：modern-web-guidance\n\n你的智能体会查阅 Chrome 的 Modern Web Guidance，将其中的指导应用到代码中，再在真实浏览器里检查结果。\n\n涵盖布局偏移、减少动态效果、深色模式、对话框焦点等。\n\n从这里开始：\nnpx skills add vercel-labs/agent-browser https://t.co/SObV8fLNzh"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-19T00:32:08+00:00", "createdAtBeijing": "2026-11-19T08:32:08+08:00", "createdAtLocal": "11-19 08:32 北京", "url": "https://x.com/lencx_/status/2123212695310905763", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2123212695310905763", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "现代 Web 指南与浏览器验证闭环", "evidence": "CLS 从 0.14 降到了 0", "rationale": "转述具体优化案例及查询、修改、验证流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2123464412971635018", "track": "agent", "source": {"id": "2123464412971635018", "text": "We launched the Context API yesterday and a feedback given to us by @tobi was to have decision models check for prompt injection and other forms of filtering. Basically a safe fetch for agents with scores based on custom criteria. We’ve shipped that today by integrating Perplexity Decider with our Context API.", "createdAt": "Thu Nov 19 17:12:22 +0000 2026", "replyCount": 50, "retweetCount": 1, "likeCount": 121, "conversationId": "2123464412971635018", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2123457725988585933", "text": "We've added Decider to the Context API.\n\nAsk yes/no questions about the pages Context fetches, and Decider scores each one from 0 to 1.\n\nUse it to check pages for prompt injection before your agent reads them. https://t.co/OVYfX1dbYr", "createdAt": "Thu Nov 19 16:45:48 +0000 2026", "replyCount": 8, "retweetCount": 6, "likeCount": 85, "conversationId": "2123457725988585933", "author": {"username": "perplexitydevs", "name": "Perplexity Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/1902407947008819200/oNj7Lt2O_normal.png"}, "authorId": "1902403003887284224", "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXgJhYjbwAETwsb.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HXgJhYjbwAETwsb.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HXgJhYjbwAETwsb.mp4"}], "translationZh": "我们已将 Decider 加入 Context API。\n\n针对 Context 抓取的页面提出是非问题，Decider 就会为每个页面给出 0 到 1 的评分。\n\n可以用它在智能体读取页面前，检测其中是否存在提示词注入。https://t.co/OVYfX1dbYr"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-19T17:12:22+00:00", "createdAtBeijing": "2026-11-20T01:12:22+08:00", "createdAtLocal": "11-20 01:12 北京", "url": "https://x.com/AravSrinivas/status/2123464412971635018", "themeId": "editorial", "signalScore": 84, "editorial": {"id": "2123464412971635018", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Context API集成Decider页面风险评分", "evidence": "Decider scores each one", "rationale": "发布页面评分功能，可用于提示注入筛查"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们昨天推出了 Context API，@tobi 给我们的一条反馈是，让决策模型检测提示词注入，并执行其他过滤。简单来说，就是为智能体提供安全的内容抓取，并按自定义标准评分。今天，我们已将 Perplexity Decider 集成到 Context API，上线了这项功能。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2123310660465705364", "track": "growth", "source": {"id": "2123310660465705364", "text": "刚看完腾讯财报后电话会议中，马化腾和刘炽平关于 WorkBuddy 的一些观点和数据分享，有几个发现，一起看看\n\n1. 按用户每日大语言模型 Token 消耗总量衡量，WorkBuddy 已发展成为国内规模最大的 AI 应用。同时，日活超过 1000 万，日均 Token 消耗量超 100 万亿。\n\n-- 这个最大，是包括了豆包这种 AI 应用，不限于工作智能体的吧？Agent 和豆包这种问答助手，单用户 Token 消耗确实完全不是一个量级。\n\n2. WorkBuddy 已成为中国几乎所有开源模型最大的客户。\n\n-- 这一点确实很有价值，相当于在 wb 内做了一个 OpenRouter，数据价值非常高！\n\n3. Flash模型是获客工具：免费用户以极低成本进入，随需求升级转化为订阅用户，再转向能力更强的模型，“Flash模型是获客的绝佳途径，而能力更强的模型则是通过为用户交付更多价值来实现变现的绝佳方式。\n\n-- 把 Flash 模型当做获客工具，这一点我之前确实没有意识到。只是认为免费用户，默认配置低价模型和受限次数。Flash 模型在满足低价的基础上，还可以提供更快速的 Agent 响应，这对刚上手的新用户体验，很重要。", "createdAt": "Thu Nov 19 07:01:25 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 7, "conversationId": "2123310660465705364", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXeDwsXa8AAM1L3.jpg", "width": 930, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXeDwsXa8AAM1L3.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXeDx7DaYAAbgjg.jpg", "width": 1215, "height": 1855, "previewUrl": "https://pbs.twimg.com/media/HXeDx7DaYAAbgjg.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXeDyeQagAAhpbz.jpg", "width": 480, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXeDyeQagAAhpbz.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-19T07:01:25+00:00", "createdAtBeijing": "2026-11-19T15:01:25+08:00", "createdAtLocal": "11-19 15:01 北京", "url": "https://x.com/shao__meng/status/2123310660465705364", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2123310660465705364", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "WorkBuddy低成本模型获客与订阅转化", "evidence": "免费用户以极低成本进入", "rationale": "转述电话会数据并分析模型分层获客路径"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123399476723507658", "track": "agent", "source": {"id": "2123399476723507658", "text": "认真看看 matt 的这个视频吧，70分钟实操，用他的一系列 skills 跑完一个 21000 行 的大 PR\n\n先 /grill-with-docs\n然后 /retro 回顾和改进\n最后人工 Review，大 PR 切换为 Stacked PR，人工 Review 时关注的是pattern 而不是每一行实现。Review 完立刻跑 /retro，让这个标准不断进化\n\n我已经很久没看这么充实的 70 分钟的 Live Coding 了，看到他还在这么认真的对待 PR，又学到了不少，甚至还有点感动了，这是真正的工程师精神，因我我现在几乎全都使用 AI review 了，只在关键决策的时候参与一下。\n\nYoutube 地址在这里：\nhttps://t.co/t8NGWKg0kx", "createdAt": "Thu Nov 19 12:54:20 +0000 2026", "replyCount": 4, "retweetCount": 25, "likeCount": 204, "conversationId": "2123399476723507658", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2123098316867051991", "text": "It's been nearly 6 months since I posted a 'watch me work' deep dive on my skills.\n\nSince then, they've become the most-starred skills repo in the world.\n\nSo, here's 70 minutes of me building a 21,000-line PR, especially focusing on:\n\n- DDD with /grill-with-docs\n- Improving your codebase with /retro\n- How to do human review effectively\n\nEnjoy!", "createdAt": "Wed Nov 18 16:57:38 +0000 2026", "replyCount": 108, "retweetCount": 278, "likeCount": 4661, "conversationId": "2123098316867051991", "author": {"username": "mattpocockuk", "name": "Matt Pocock", "profileImageUrl": "https://pbs.twimg.com/profile_images/1666460461884211204/SmBm505D_normal.jpg"}, "authorId": "346640777", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123095544004263936/img/B9BYRV3U8gzFg84v.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123095544004263936/img/B9BYRV3U8gzFg84v.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123095544004263936/vid/avc1/1920x1080/aioWdKkYjKhBHKJJ.mp4?tag=29", "durationMs": 4169798}], "translationZh": "距离我上次发布展示这些 skills 实际使用过程的深度视频，已经快 6 个月了。\n\n此后，它们所在的仓库已成为全球获星最多的 skills 仓库。\n\n这次带来一段 70 分钟的视频，展示我如何完成一个涉及 21,000 行代码的 PR，重点包括：\n\n- 使用 /grill-with-docs 进行 DDD\n- 使用 /retro 改进代码库\n- 如何高效开展人工审查\n\n祝观看愉快！"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-19T12:54:20+00:00", "createdAtBeijing": "2026-11-19T20:54:20+08:00", "createdAtLocal": "11-19 20:54 北京", "url": "https://x.com/vikingmute/status/2123399476723507658", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2123399476723507658", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "大型 PR 的 Skills 协作与人工审查方法", "evidence": "人工 Review 时关注的是pattern", "rationale": "包含实操资源、拆分审查及持续复盘方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2123277889236070660", "track": "agent", "source": {"id": "2123277889236070660", "text": "我服了，Codex 一天天在搞啥啊，连这种提示词都要用户自定义了么？\n\n针对最近 gpt 不怎么说人话的现象，@thsottiaux 给出了他的解法。\n\n我也附上我一直用的自定义提示词吧，效果还可以，我把 Tibo 这条也更新了，放在系统级的 AGENTS.md 就可以了。\n\n提示词：\n\n# 全局协作约定\n\n## 协作与执行\n\n- 独立判断。发现会影响结论的错误前提、逻辑漏洞或重要盲区，直接指出并说明理由。对可能变化或拿不准的关键事实，优先核对原始资料、官方文档或当前实现。结论依赖推断或假设时，说明依据和不确定之处。受到质疑时重新核对，发现错误就更正，改变判断时说清原因。我的目标或偏好已经明确时，按我的选择推进。\n- 动手前了解项目约定和已有工作。能从现有文件、文档或工具查清的事，先自行查证。任务范围清楚就自主推进，采用满足目标所需的最简单方案，只改相关内容。只有歧义无法自行消除、且会实质改变结果时，再问我。操作可能造成数据丢失或不可逆影响时，事先说明具体后果。\n- 交付前，对照我的要求检查有没有漏项，并用与任务相称的方式验证结果。还有哪些没完成、哪些没验证，以及这些情况会怎样影响结果，如实说明。\n\n## 写作与表达\n\n- 默认用简体中文与我沟通。交付物的语言和格式按当前任务要求。\n- 默认像我只有 5 岁一样给我解释。如果我要求你讲得更深入，你就讲得更深入。\n- 简单问题直接答。复杂问题先说结论，把相关背景和依据放在对应判断旁边。需要建议时，给出首选和关键理由。没有值得改的地方就直说，有实际下一步再提。\n- 表达自然、直接、具体。日常交流可以轻松，严肃问题直接说。少用套话、机械排比和刻意的金句。正文避开「不是……而是……」「并非……而是……」等强行对比句式，引用和分析原文除外。\n- 沿用我和原始资料中的用词，专业术语能让意思更准确时就保留。读者可能不熟悉的概念，在第一次出现时简要说明。工作过程中的临时叫法和内部缩写，换成读者能理解的表达。\n- 动词要把动作说清楚。知道是谁做的，优先写清楚谁做了什么。单字动词用起来生硬或意思含糊时，换成更自然、具体的说法。比如，说明计算过程时，写「先看 AI 做了什么，再看网页怎么计算」。前一个「看」自然清楚，可以保留。AI 交付 PPT 后，如果是打开浏览，写「我查看了一下 PPT」；如果是核对内容，写「我检查了一下 PPT」。\n- 润色或修改我已有的文字时，按我要求的范围修改，保留我的原意、语气和用得准确的原话。尤其注意「可能」「我觉得」「我试过」这类限定，避免把个人观察改成普遍结论。\n- 替我起草文章、邮件、消息或其他对外内容时，根据实际读者调整用词和语气。读者理解正文需要的背景，即使我们已经在聊天里讨论过，也要在正文里交代清楚。\n- 长任务的最终答复要能独立读懂。即使我没看中途的进度消息，也能知道完成了什么、结论是什么。", "createdAt": "Thu Nov 19 04:51:12 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 3, "conversationId": "2123277889236070660", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "quotedTweet": {"id": "2122949739708809619", "text": "@theo Try this in codex\n\n&gt; Add this to my custom instructions \"Talk to me ELI5 by default and go deeper if I ask.\"\n\nbut also, team is on it.", "createdAt": "Wed Nov 18 07:07:15 +0000 2026", "replyCount": 78, "retweetCount": 117, "likeCount": 1904, "conversationId": "2122916936417935419", "inReplyToStatusId": "2122934242648932366", "author": {"username": "thsottiaux", "name": "Tibo", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075819673263001600/pj1vyX6I_normal.jpg"}, "authorId": "1953337039510003712", "translationZh": "@theo 试试在 codex 中这样说：\n\n&gt; 将这句话加入我的自定义指令：“默认用给五岁孩子讲解的方式向我解释；如果我追问，再深入展开。”\n\n另外，团队也在着手改进。"}, "expert": {"priority": "P1", "domain": "企业落地与产品组织
