", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-11-19T04:51:12+00:00", "createdAtBeijing": "2026-11-19T12:51:12+08:00", "createdAtLocal": "11-19 12:51 北京", "url": "https://x.com/jinchenma_ai/status/2123277889236070660", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2123277889236070660", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Codex全局协作与表达提示词", "evidence": "放在系统级的 AGENTS.md 就可以了", "rationale": "提供完整可复用提示词及配置位置"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2123401656939291047", "track": "agent", "source": {"id": "2123401656939291047", "text": "让 AI 修一个网页按钮，它看完代码，改了几个文件，然后告诉你“已经修好了”。\n\n你打开浏览器，按钮还是没反应。\n\n接下来，你截图、复制控制台错误、打开 Network 面板，把接口响应贴回聊天框。AI 再猜一次，你再试一次。一个小问题，变成了人类不停搬运证据的过程。\n\nChrome DevTools MCP 想解决的，就是这段来回折腾。\n\n它把 Chrome 的调试与自动化能力接给 AI 编程助手，让助手能够打开页面、操作按钮、读取控制台、检查请求、录制性能数据，再根据这些实际反馈继续排查。\n\n接上支持 MCP 的编程助手后，AI 可以自己打开 Chrome、点击按钮、填写表单、查看控制台和网络请求，还能录制性能数据。\n\n以前是你告诉它“哪里坏了”，现在可以让它自己去看、去找证据，再继续修改。\n\n它特别适合前端开发：按钮点了没反应，让它看看请求到底有没有发出去；页面加载慢，让它分析哪里拖了后腿；改完样式，让它打开页面检查布局。\n\n安装也不复杂，准备好 Node.js 和 Chrome，在助手里添加 MCP 配置就能开始用。现在官方还提供了 CLI 和 Skills，方便接入不同工作流。", "createdAt": "Thu Nov 19 13:03:00 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 1, "conversationId": "2123401656939291047", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2120078508521095594", "text": "用 AI 写网页，有个很烦的地方：它说“改好了”，你打开一看，按钮点不动、表单提交失败，最后还是得自己测试、截图，再让它改。\n\nVercel Labs 的开源工具 agent-browser，就是想把这一步也交给 AI：让它打开真实网页，自己点击、输入、查看结果，而不只是对着代码说“应该没问题”。\n\n它的操作方式：先把网页上的按钮、链接、输入框整理成一份清单，给每个元素标上编号，AI 再根据编号执行操作。\n\n比如找到搜索框、输入关键词、点击搜索，然后检查页面有没有出现预期结果。需要看布局时，还能截图，配合文字信息一起判断。\n\n实用场景\n就是让 AI 编程助手写完页面后，顺手走一遍真实用户流程：搜索能不能用、表单有没有报错、提交后有没有跳转，再留下截图和验证结果。\n\n它也能用来操作后台、查询动态网页、复现 Bug。安装主要分两步：装工具、准备浏览器，再通过 Skill 或 MCP 接到支持相应能力的 AI 助手里。\n\n不过，也别把它理解成“装上以后，AI 就能稳定操作所有网站”。\n\n验证码、登录风控、复杂控件都可能卡住；页面变化后，也需要重新观察。", "createdAt": "Tue Nov 10 08:58:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 0, "conversationId": "2120078508521095594", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119992822048964608/vid/avc1/1920x1080/IhgKlY-9fyRUD-Fw.mp4?tag=29", "durationMs": 258766}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122586243255218176/img/tyegyasPmJTUpuSO.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122586243255218176/img/tyegyasPmJTUpuSO.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122586243255218176/vid/avc1/1920x1080/xHXhAJQ0qh16azOM.mp4?tag=29", "durationMs": 119866}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-19T13:03:00+00:00", "createdAtBeijing": "2026-11-19T21:03:00+08:00", "createdAtLocal": "11-19 21:03 北京", "url": "https://x.com/sitinme/status/2123401656939291047", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2123401656939291047", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Chrome DevTools MCP 前端调试工作流", "evidence": "读取控制台、检查请求、录制性能数据", "rationale": "说明工具能力、接入条件与具体排障场景"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2123435596681248992", "track": "creative", "source": {"id": "2123435596681248992", "text": "乔碧萝当年要是有这套技术，榜一大哥也不至于删号跑路。\n\n2019 年，乔碧萝靠甜美的声音和二次元头像圈粉，结果直播连麦时遮脸图片意外消失，成为全网名场面。\n\n但放到 2026 年，AI 不仅能实时换脸（评论区），连声音都能换。\n\n开源项目 RVC（Retrieval-based Voice Conversion），可以通过 AI 将你的声音实时转换成另一种音色。\n\n只需要准备目标声音的数据，训练出音色模型，再接入麦克风。\n\n你正常说话，AI 就能实时转换成另一种声线，连原本的说话节奏和语气也能部分保留。\n\n官方报告端到端延迟 170ms，使用 ASIO 音频设备甚至可以做到 90ms。\n\n把实时换脸和 RVC 结合起来：全部都换了\n\n仓库👉\nhttps://t.co/KkMXi7RuQI", "createdAt": "Thu Nov 19 15:17:52 +0000 2026", "replyCount": 3, "retweetCount": 1, "likeCount": 18, "conversationId": "2123435596681248992", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2123354388567912904", "text": "🔥起号焚诀：不拍不剪，新手如何批量产出高完播视频？（附模板 & 提示词）", "createdAt": "Thu Nov 19 09:55:10 +0000 2026", "replyCount": 55, "retweetCount": 32, "likeCount": 166, "conversationId": "2123354388567912904", "author": {"username": "FiniYang", "name": "Fini.Yang", "profileImageUrl": "https://pbs.twimg.com/profile_images/2052051895683084288/ZehEoMjv_normal.jpg"}, "authorId": "4004131634", "article": {"title": "🔥起号焚诀：不拍不剪，新手如何批量产出高完播视频？（附模板 & 提示词）", "previewText": "这篇把「借爆款节奏 + 拆件换角」的实操拆透，直接附上能填空复用的万能提示词，照着跑就能出片\n很多人做短视频卡在第一步，不是缺设备，而是从零憋脚本太慢、剪辑切镜又太折腾"}}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123435169692659712/img/zk80xqaI-V3hhAd8.jpg", "width": 1756, "height": 1000, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123435169692659712/img/zk80xqaI-V3hhAd8.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123435169692659712/vid/avc1/1756x1000/cDzNYE2EMnvomgZm.mp4?tag=29", "durationMs": 14616} Pinky手机Agent运行与安装方式", "evidence": "不开电脑也能让它直接在手机上干活", "rationale": "说明双端运行方式及系统安装条件，属作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, {"id": "2123470587259732200", "track": "research", "source": {"id": "2123470587259732200", "text": "Autonomous, uncut, 1x speed. This is GR00T 2 controlling real dexterous hands, end to end. https://t.co/0a6g27fnDq", "createdAt": "Thu Nov 19 17:36:54 +0000 2026", "replyCount": 59, "retweetCount": 39, "likeCount": 388, "conversationId": "2123470587259732200", "author": {"username": "DrJimFan", "name": "Jim Fan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1554922493101559808/SYSZhbcd_normal.jpg"}, "authorId": "1007413134", "quotedTweet": {"id": "2120186651741655428", "text": "Introducing GR00T 2: our most advanced, open System One model for robotics. It runs entirely on your robot’s onboard compute, fully untethered, and you own every weight of it. GR00T 2 features: \n\n1. Long-horizon tasks: dexterous manipulation and whole-body control chained over 20+ steps and 5+ minutes, such as performing chemistry lab experiments or assembling model airplanes end to end.\n2. X-Adapt: adapting from easy data sources (human wearables and simulation) and deploying zero-shot to diverse real robots.\n3. Unified Cognition: native integrations with frontier agents for advanced physical reasoning, robust error recovery, and safety monitoring.\n\nIt's an open-source buffet! We are releasing not only the model weights and X-Adapt recipes (coming December), but also our agentic framework, simulation engine, annotation engine, hardware design, and even training data (100K hours, that's ~11 yrs of experience), all available today! \n\nEverything that moves will be autonomous. Anyone can become a roboticist. \n\nLock in, build with us! \n\nDeep dive in thread:", "createdAt": "Tue Nov 10 16:07:43 +0000 2026", "replyCount": 195, "retweetCount": 265, "likeCount": 1947, "conversationId": "2120186651741655428", "author": {"username": "DrJimFan", "name": "Jim Fan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1554922493101559808/SYSZhbcd_normal.jpg"}, "authorId": "1007413134", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120178947035889664/img/RaYA0DTAiAgCHYpW.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120178947035889664/img/RaYA0DTAiAgCHYpW.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120178947035889664/vid/avc1/1920x1080/80g_VJCO3CcemdU7.mp4?tag=29", "durationMs": 90600}], "translationZh": "推出 GR00T 2，我们最先进的开放式机器人 System One 模型。它完全在机器人本机运行，无需外部计算设备，所有模型权重均由你掌握。GR00T 2 的主要能力包括：\n\n1. 长程任务：将灵巧操作与全身控制串联起来，完成超过 20 步、持续 5 分钟以上的任务，例如从头到尾做一次化学实验或组装一架模型飞机。\n2. X-Adapt：利用易获取的数据源（如人体穿戴设备和仿真数据）进行适配，并以零样本方式部署到多种实体机器人上。\n3. Unified Cognition：原生集成前沿智能体，支持高级物理推理、稳健的错误恢复和安全监控。\n\n我们将于 12 月开放模型权重和 X-Adapt 方案。智能体框架、仿真引擎、标注引擎、硬件设计和训练数据今天就已开放。训练数据共 10 万小时，相当于约 11 年的经验。\n\n一切能动的设备都将实现自主运行。人人都能参与机器人研发。\n\n动手加入，和我们一起开发！\n\n技术细节见下方帖子串："}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123470459631198208/img/y80snEOIoICgU4-V.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123470459631198208/img/y80snEOIoICgU4-V.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123470459631198208/vid/avc1/3840x2160/18bz-xJpnTkYMlga.mp4?tag=29", "durationMs": 83500}], "expert": {"priority": "P0", "domain": "多模态 / Agent", "name": "Jim Fan", "role": "NVIDIA / 研究员", "why": "具身 Agent、基础 Agent、机器人和仿真方向", "handle": "DrJimFan"}, "createdAtIso": "2026-11-19T17:36:54+00:00", "createdAtBeijing": "2026-11-20T01:36:54+08:00", "createdAtLocal": "11-20 01:36 北京", "url": "https://x.com/DrJimFan/status/2123470587259732200", "themeId": "editorial", "signalScore": 89, "editorial": {"id": "2123470587259732200", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "GR00T 2机器人模型发布与灵巧手演示", "evidence": "Autonomous, uncut, 1x speed.", "rationale": "提供实机演示与开放资源细节，权重尚待发布"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "自主操作、未经剪辑、原速播放。这是 GR00T 2 端到端控制真实灵巧手的演示。https://t.co/0a6g27fnDq"}, "avatar": "https://pbs.twimg.com/profile_images/1554922493101559808/SYSZhbcd_normal.jpg"}], "preview": false, "productionMonitored": 122};
const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
