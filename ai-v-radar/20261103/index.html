<script>
const DATA={"records": [{"id": "2117339521683448221", "track": "agent", "source": {"id": "2117339521683448221", "text": "Claude API 公测 Message Threads：长对话不用每轮重发历史，回复更快，价格不变\n\nAnthropic 今天给 Messages API（开发者调用 Claude 的主要接口）上线了“消息线程”（message threads）公测：服务器替你把对话暂存几分钟，下一轮只需要发新消息和上一条回复的 ID。\n\n以前这个接口不记历史消息，每次请求都要把之前所有消息、工具返回的结果从头再发一遍。Agent 一次会话可能发几百个请求，对话涨到几十万 token 后，光是重发就会拖慢 Claude 开始回复的时间。\n\nClaude Code 已经给大多数用户默认开了这个功能。官方数据：50 万到 100 万 token 的请求，从发出到 Claude 开始输出的等待时间（中位数）缩短约 35%；长对话里，单次请求的大小（中位数）从约 800 KB 降到 1.8 KB。\n\n【要多花钱吗】\n\n不用，但也省不了钱。按标准 token 价格计费，速率限制不变。请求虽然变小了，Claude 每轮仍要读一遍完整对话，消耗的 token 和以前一样。\n\n【和提示词缓存有什么区别】\n\n提示词缓存（prompt caching）让服务器不用重复处理已经读过的内容，命中缓存的部分按更低价格计费，省的是钱和计算。消息线程省的是上传，你不用再把整段历史传过去。线程不会自动帮你做缓存，缓存断点还得自己设，官方示例里两者是一起用的。\n\n【开发者怎么用】\n\n在请求里加 thread 参数和 beta 请求头（message-threads-2026-08-12）。第一轮照常发完整对话、系统提示词和工具定义，标记为新建线程；之后每轮只发新消息，带上上一条回复的 ID。\n\n线程 5 分钟没有新请求就过期，接口返回 404，这时要用你自己保存的完整对话重新建一个线程。所以本地仍要留一份完整记录，官方 SDK 的辅助方法能自动处理这一步。\n\n线程中途不能改系统提示词和工具，模型、思考设置也要和第一轮一致，想改就得重开线程。线程数据加密存在内存里、不写硬盘，但它不支持零数据保留（ZDR）和 HIPAA 合规，对数据留存有严格要求的企业要留意。批处理接口暂不支持。\n\n适合长时间运行的 Agent、操作电脑的 Agent（截图不用每轮重传），以及带大量文档、图片的对话。Claude 自家平台、AWS、Microsoft Foundry 和 Google Cloud（Anthropic 托管版）上都能用。\n\n博客：https://t.co/cv3hNAAOEJ\n文档：https://t.co/ttwODbh0do", "createdAt": "Mon Nov 02 19:34:14 +0000 2026", "replyCount": 24, "retweetCount": 2, "likeCount": 23, "conversationId": "2117339521683448221", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2117332449382510884", "text": "Message threads are now in public beta on the Messages API.\n\nThe API caches your conversation on the server between turns, so instead of resending the full conversation, you send only new messages and the previous message ID, and Claude starts responding sooner. https://t.co/VeiehyqfIg", "createdAt": "Mon Nov 02 19:06:08 +0000 2026", "replyCount": 176, "retweetCount": 151, "likeCount": 4530, "conversationId": "2117332449382510884", "author": {"username": "ClaudeDevs", "name": "ClaudeDevs", "profileImageUrl": "https://pbs.twimg.com/profile_images/2044472418815893504/xf14RxM8_normal.png"}, "authorId": "2024518793679294464", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117332353785704449/img/p7_rHqaEU7-HLGfG.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117332353785704449/img/p7_rHqaEU7-HLGfG.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117332353785704449/vid/avc1/1920x1080/6MNaekJuUF4KuR-A.mp4?tag=29", "durationMs": 34948}], "translationZh": "Messages API 的消息线程功能现已开启公开测试。\n\nAPI 会在多轮交互之间将对话缓存在服务器上，因此你只需发送新消息和上一条消息的 ID，无需重复发送完整对话，Claude 也能更快开始响应。https://t.co/VeiehyqfIg"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-02T19:34:14+00:00", "createdAtBeijing": "2026-11-03T03:34:14+08:00", "createdAtLocal": "11-03 03:34 北京", "url": "https://x.com/dotey/status/2117339521683448221", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2117339521683448221", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Claude API 消息线程公测与接入方法", "evidence": "下一轮只需要发新消息和上一条回复的 ID", "rationale": "含发布公告、接入步骤、计费与过期限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117384307593646230", "track": "research", "source": {"id": "2117384307593646230", "text": "Should you rely on public benchmark scores when choosing a model? @VikParuchuri argues \"no\" in this talk.\n\nTo illustrate this, he shows specific problems found in popular OCR benchmarks:\n\nParseBench:\n\n• A test expects 310 gigawatts of solar-panel capacity when the correct value is 303.  Additionally, 73% of its chart tests ask for values that aren't printed on the chart. (4:51)\n\n• A test requires \"Parish Priest:\" to be bold even though those words aren't bold in the source document. (15:33)\n\n• The scorer fails to recognize heading tags placed on separate lines. (16:15)\n\n• dots.mocr ranks last among six models even though it beats the first-ranked model on content and tables.  This is an example of how overall benchmark score can hide important differences in model capabilities. (14:48)\n\nolmOCR-bench:\n\n• A model correctly preserves a line break in a document and gets penalized for it. (10:30)\n\n• A test expects \"Republican Party\" when a document says \"Republican party\". Copying the capitalization correctly makes the model fail. (10:49)\n\n• A 700-line postprocessor that rewrites model output adds 1 to 2 points, more than many gaps between models. (12:12)\n\nOmniDocBench:\n\n• This benchmark uses edit distance, which penalizes a correct table written in HTML more heavily than a wrong number in Markdown. So the format matters more than the answer! (6:58)\n\nThis is just the tip of the iceberg, the video contains more examples.\n\nChapters:\n\n0:00 Choosing a model when every vendor claims to be #1\n1:54 How OCR benchmark scores improve without better OCR\n5:30 Metric design and tests that reject correct answers\n11:33 Postprocessing, saturation, and misleading model rankings\n12:40 How to slice benchmarks by your task and check for bias\n16:53 How to build fair tests with verified answers and consistent scoring\n19:05 How to test OCR models on your own documents\n24:10 Benchmark marketing, private evals, and how to choose a model", "createdAt": "Mon Nov 02 22:32:12 +0000 2026", "replyCount": 8, "retweetCount": 2, "likeCount": 24, "conversationId": "2117384307593646230", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117351279307771904/img/zTGx0WTIWIATMBAc.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117351279307771904/img/zTGx0WTIWIATMBAc.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117351279307771904/vid/avc1/1920x1080/A5hLjIKROYRGjk6t.mp4?tag=29", "durationMs": 1888525}], "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-11-02T22:32:12+00:00", "createdAtBeijing": "2026-11-03T06:32:12+08:00", "createdAtLocal": "11-03 06:32 北京", "url": "https://x.com/HamelHusain/status/2117384307593646230", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2117384307593646230", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "OCR基准错误与模型评测方法", "evidence": "A test expects 310 gigawatts", "rationale": "列出标注与评分缺陷，并提供任务化评测方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "选择模型时，应该依赖公开基准测试的分数吗？@VikParuchuri 在这场演讲中给出的答案是“不应该”。\n\n他列举了热门 OCR 基准测试中的一些具体问题：\n\nParseBench：\n\n• 某项测试要求太阳能电池板装机容量为 310 吉瓦，正确值却是 303。此外，73% 的图表测试要求回答图中并未标出的数值。（4:51）\n\n• 某项测试要求将“Parish Priest:”加粗，但原始文档中的这些文字并未加粗。（15:33）\n\n• 评分器无法识别单独放在一行的标题标签。（16:15）\n\n• dots.mocr 在六个模型中排名垫底，但在内容和表格方面却优于排名第一的模型。这说明，基准测试总分可能掩盖模型能力的重要差异。（14:48）\n\nolmOCR-bench：\n\n• 模型正确保留了文档中的换行，却因此被扣分。（10:30）\n\n• 文档写的是“Republican party”，某项测试却要求输出“Republican Party”。模型正确保留原文大小写反而无法通过测试。（10:49）\n\n• 一个用于改写模型输出的 700 行后处理程序能带来 1 至 2 分的提升，超过了许多模型之间的分差。（12:12）\n\nOmniDocBench：\n\n• 该基准采用编辑距离评分，导致用 HTML 正确表示表格受到的惩罚，比用 Markdown 写错一个数字还重。格式竟比答案更重要！（6:58）\n\n这只是冰山一角，视频中还有更多例子。\n\n章节：\n\n0:00 当所有厂商都自称第一时，如何选择模型\n1:54 OCR 能力没有提升，基准分数却为何上涨\n5:30 指标设计与拒绝正确答案的测试\n11:33 后处理、分数饱和与误导性的模型排名\n12:40 如何按任务细分基准测试并检查偏差\n16:53 如何用经过验证的答案和一致的评分方式构建公平测试\n19:05 如何用自己的文档测试 OCR 模型\n24:10 基准测试营销、私有评测与模型选择"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2117071027784056947", "track": "agent", "source": {"id": "2117071027784056947", "text": "跟着 OpenRouter 手把手搭可验证的 AI 代码审查\n\n@OpenRouter 给出一份 233 行、仅标准库 的 Python 脚本 review. py：把变更文件、测试与 diff 上传到 OpenRouter，在托管 Linux 沙箱里用短脚本复现问题，再以 V4A patch 提修复；每条 finding 标成 confirmed（附命令与输出）或 unconfirmed。五 bug 样例上，审查约 1–4 分钟、约 $0.015–$0.045；可挂 pre-push 或 GitHub Actions，--block-at（默认 high）不达标就 exit 1 拦推送。\nhttps://t.co/IrWfqNmpmN\n\n四个部分怎么拼起来的（Responses API）\n· Files API 上传变更后全文与上下文（避免只看 hunk 瞎猜 import/类型）；\n· openrouter:shell 把文件拷进容器家目录，可跑 Python/SQLite；\n· openrouter:apply_patch 提 create/update/delete，平台先校验 diff 语法；\n· submit_review 函数工具用严格 JSON 收尾（他们发现有工具时 json_schema 文本格式在 Haiku 上不被强制，答案会飘成散文）。\n\n流程上模型在沙箱对原代码做检查；补丁先打在本机临时副本，告诉模型成不成；--apply 才写回工作树，之后仍要自己跑测试。\n\n样例与门槛\ndemo 里故意埋 SQL 注入、分页 off-by-one、is not 比字符串、retry 吞异常、去掉 conn.close() 等；原有 unittest 仍绿。Haiku 跑例：四条 confirmed、连接未关标 unconfirmed（CPython 出作用域会关，难稳定复现）。报告默认进 .git/ai-review.json，避免误提交。退出码：0 通过，1 有达严重度门槛的 finding，2 未完成（超 8 轮或文件过多等）。\n\n模型怎么选（他们三次复跑）\nHaiku 5.5：均约 $0.0153 / 125s，召回高但补丁三跑里只一跑修全五 bug；\nSonnet 5.5：约 $0.0447 / 60s，五 bug 全中且三跑补丁都过他们自测；\nDeepSeek V4.1 Flash、GPT-6 Luna 介于中间，DeepSeek 有一轮卡在反复打补丁未 submit_review。\n\n建议：省钱用 Haiku，要稳补丁用 Sonnet；--apply 前务必人工看补丁（Haiku 曾把 dict 访问改成 tuple 下标）。\n\n成本、接入与边界\n账单 = 模型 token + 沙箱 $0.0001/秒（从首条 shell 到响应结束；想得慢也会多付沙箱费）。相对「只塞 diff 的 Chat Completions」大约贵 10–40 倍，换来可复现证据。可接 pre-push；CI 应用 base 分支的 https://t.co/cfYdACq5FU（防 PR 改审查器）、fork PR 跳过、密钥用 secrets。\n\n限制：代码会上传并给模型提供商；单次最多约 20 个文件 ID；沙箱默认无外网（pip install 需显式放开）；工具仍是 beta、仅全球端点；confirmed 当强信号，unconfirmed 给人看。", "createdAt": "Mon Nov 02 01:47:20 +0000 2026", "replyCount": 26, "retweetCount": 1, "likeCount": 13, "conversationId": "2117071027784056947", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFY24vaEAAiWI8.jpg", "width": 960, "height": 960, "previewUrl": "https://pbs.twimg.com/media/HWFY24vaEAAiWI8.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-02T01:47:20+00:00", "createdAtBeijing": "2026-11-02T09:47:20+08:00", "createdAtLocal": "11-02 09:47 北京", "url": "https://x.com/shao__meng/status/2117071027784056947", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2117071027784056947", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "沙箱验证驱动的AI代码审查", "evidence": "每条 finding 标成 confirmed", "rationale": "详述复现证据、补丁验证、CI接入及限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117050808282091943", "track": "agent", "source": {"id": "2117050808282091943", "text": "非常推荐阅读 Factory 发布的《Droid 1.0: Building a Frontier Harness》，里面有很多值得借鉴的工程细节，真得逐帧学习呀。\n\n最核心的改动是 Programmatic Tool Calling。\n\n模型先写一段 JavaScript，让脚本自己调用工具、并发处理任务、筛选结果。原始日志留在程序里，最后只把关键信息交回模型，省掉了大量重复的模型请求。\n\n另一个内部案例更直观。Agent 清理了 151 个 Linear 工单，执行 312 次 Tool Call，逐个检查修改结果，整个过程只用了 2 次模型请求。\n\n文章后半部分也很有料。\n\n比如工具改成按需加载，新工具追加到请求末尾，避免破坏 Prompt Cache；长任务放到后台运行，完成后自动唤醒 Agent，减少无意义的轮询。\n\n他们还做了一个 Agent Factory，让 Agent 自动分析失败轨迹、提出 Harness 改进方案，再跨模型测试，最后由工程师审核。\n\n这里有个细节挺有意思。同样一项优化，能让 Opus 的成本下降 22%，却让 Kimi 的成本上涨 32%。Harness 的优化还真不能只盯着一个模型。\n\n看完我回头得检查一下自己 Agent 的执行日志🤣。到底有多少 Token 花在反复读取工具输出上，又有多少步骤其实可以直接交给程序完成？\n\n这篇文章很适合做 Coding Agent 的人仔细读一遍，很多经验可以直接拿来参考。\n\n原文：https://t.co/23mVB7JT4o", "createdAt": "Mon Nov 02 00:27:00 +0000 2026", "replyCount": 15, "retweetCount": 24, "likeCount": 217, "conversationId": "2117050808282091943", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-02T00:27:00+00:00", "createdAtBeijing": "2026-11-02T08:27:00+08:00", "createdAtLocal": "11-02 08:27 北京", "url": "https://x.com/Xudong07452910/status/2117050808282091943", "themeId": "editorial", "signalScore": 82, "editorial": {"id": "2117050808282091943", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Droid 1.0的程序化工具调用与Harness优化", "evidence": "整个过程只用了 2 次模型请求", "rationale": "包含工具编排、缓存与跨模型优化的具体案例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2117095603612299316", "track": "agent", "source": {"id": "2117095603612299316", "text": "很多 Agent 最浪费 token 的地方，是同一个决定反复想。\n\n比如模型已经决定「代码写完后先编译，编译成功再跑测试」。\n\n真正执行到编译结束时，Harness 往往又会重新调用一次模型，让它再决定下一步该做什么。\n\n清华和微软亚研院这篇 HarnessMM，专门解决这种重复推理。\n\n它会把已经确定的动作保存成 Executable Decision Graph。\n\n后续工具返回结果后，只要满足预先设定的条件，Harness 就直接执行已经确定的下一步；遇到新的语义判断或证据不足，再把控制权交还给模型。\n\n而且这套 Harness 还会通过训练反馈持续迭代配置，再由验证集决定保留哪一版，形成一个轻量的 RSI 闭环。\n\n在 HumanEval 上，Codex 成功率保持 90.82%，每个任务的 token 从 66.72k 降到 47.02k，节省约 29.5%。\n\nDeepSeek Harness 的成功率从 71.43% 提升到 85.71%，token 从 96.28k 降到 11.62k，减少约 87.9%。\n\n所以模型已经做出的决定，如果能安全地跨工具调用保留下来，很多重复 reasoning 本身就是可以被编译掉的成本。\n\n未来 Agent 的效率提升，可能更依赖这种对「何时调用模型」的精细控制。\n\n📎 arxiv: https://t.co/iJJemzEgrs", "createdAt": "Mon Nov 02 03:25:00 +0000 2026", "replyCount": 13, "retweetCount": 1, "likeCount": 45, "conversationId": "2117095603612299316", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWC7gxGWgAA_KWt.jpg", "width": 1194, "height": 1206, "previewUrl": "https://pbs.twimg.com/media/HWC7gxGWgAA_KWt.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-02T03:25:00+00:00", "createdAtBeijing": "2026-11-02T11:25:00+08:00", "createdAtLocal": "11-02 11:25 北京", "url": "https://x.com/Xudong07452910/status/2117095603612299316", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2117095603612299316", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "HarnessMM缓存执行决策以减少重复推理", "evidence": "每个任务的 token 从 66.72k 降到 47.02k", "rationale": "介绍决策图机制与实验指标，结果待原文核验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2117092563329179702", "track": "agent", "source": {"id": "2117092563329179702", "text": "好开发者为何对 Coding Agent 仍保持警惕？\n\n做出来 ≠ 能上生产！来自 @rachellaycock 的分享：\nhttps://t.co/oq44nHaY4o\n\nRachel 发现很多一向爱尝新、甚至自己发明工具与实践的资深开发者，对 agentic development 反而谨慎。简单归因（爱写代码、怕失业）对一部分人成立，但她觉得背后还有别的东西。九月 Technology Radar 开放讨论把 agent 推到极限后，她把那层担心看清了。\n\nThoughtworks 一向强调「做对的事、把事做对」：能用、明年还能改、生产里不倒。持续集成、结对、自动化测试、持续交付、微服务等，正是因此被他们早早采纳或推动。早期 coding agent 很容易产出「根本不该靠近生产」的代码，开发者未必懂「做出来」和「安全跑起来」之间的鸿沟。工具进步很大，但资深开发者仍在问：行为对不对？边界对不对？能不能演进？失败时怎么办？别的团队能不能接手？更大一层是，用这种方式建系统，我们还几乎没有长期生产经验。今天线上绝大多数系统仍是旧方式、由人亲手做出来的；新方式还没被真正「住」过。\n\n她强调：这些人不是拒绝助手，是拒绝把手完全从方向盘上拿开；还没看到足够护栏，不敢让 agent 独自狂奔。\n\n一次白板实验\n欧洲区域 CTO Giles Alexander 带资深工程师、基础设施顾问和产品同学做了一周实验：人不写代码，全部交给 agent。目的不是证明一周能做出航空类应用（他们做到约八成，作者自嘲「你懂那意味着什么」），而是观察「编码全交给 agent 后，团队工作变成什么样」。\n\n她印象最深的是：人大部分时间在白板，理清领域、画边界、定下一步、给 agent 可执行的计划；agent 则在下班后仍继续吐代码。人还在设计反馈回路：测试、契约、架构检查、交付流水线，并把学到的东西写进 harness，让下一轮构建与测试更稳。有趣的是，最后提交功能代码最多的反而是产品同学。他们粗估：约 2/3 时间在白板，1/3 在 harness，这或许暗示未来分工，但她立刻泼冷水：故事还没讲完。\n\n应用能跑，构建却常红\n应用能跑，但构建经常红，「在我机器上能跑」又回来了。常红的构建会麻木告警：红不再等于「停下、查、修」；检查不可信时，绿也不再让人安心。这正是持续集成本想消除的不确定性。原因可能是并行 agent 互相踩改动、系统还不够模块化、变更比检查跑得更快，或几者叠加。她认为持续交付 / DevOps 会在 agent 时代迎来一轮重审；DORA 2025 也写到：AI 采用与更高吞吐相关，却与更低交付稳定性相关。\n\n内部还在吵：人不逐行读代码、测试又和代码一起由 agent 生成时，TDD 扮演什么角色？验收、契约、边界检查怎样给信心又不脆？开跑前要做多少设计？批次该多大，很多团队从 Story 扩到 Epic，CI 跟不跟得上？实验跑了两轮也没给完答案；她更希望资深开发者参与这种实验，弄清哪些旧实践仍站得住、哪里需要新实践。\n\n滑雪比喻（以及它哪里不够）\n她把新手比作小孩毫无顾忌冲下山；资深开发者像成年才学滑雪的人——知道摔断腿的代价，还没学会转弯和刹车。Martin Fowler 指出比喻的破绽：雪道上有无数人平安到底、教练教过上千人；Agent 开发更像未知野地：还不知道哪些技能最关键、几乎没人安全走完全程、反馈又慢又少。系统是否真行，要等它在生产里跑一阵、扛过几轮变更、别把飞机全派到 Aberystwyth，做出来 ≠ 生产里能工作。Charity Majors 那句也被点到：staging 只是「高级笔记本电脑」，只有生产才是生产。所以领导把谨慎说成「不好奇、落后」，往往看错了对象：这些人不是在人人都会的初级雪道上发抖，而是在看未标地图，问路线合不合理。\n\n对两边的挑战\n领导要分清「有用的担忧」和「单纯抵触变化」，给真实实验空间：时间、允许犯错、别用「agent 产出了多少代码」当成功标准。开发者要把经验带进实验，也准备好承认有些旧假设不再成立。有的实践会更重要，有的要换形状；没人会先递一张现成地图。若你在意做对、做稳，这种谨慎正是新工作方式需要的，带着警惕出发。", "createdAt": "Mon Nov 02 03:12:55 +0000 2026", "replyCount": 36, "retweetCount": 2, "likeCount": 10, "conversationId": "2117092563329179702", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFsdIebAAAfWkQ.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWFsdIebAAAfWkQ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-02T03:12:55+00:00", "createdAtBeijing": "2026-11-02T11:12:55+08:00", "createdAtLocal": "11-02 11:12 北京", "url": "https://x.com/shao__meng/status/2117092563329179702", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2117092563329179702", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent开发实验与持续交付风险复盘", "evidence": "应用能跑，但构建经常红", "rationale": "包含团队实验、时间分配及构建失稳复盘"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117104960454438939", "track": "agent", "source": {"id": "2117104960454438939", "text": "这周继续完整学习腾讯、腾讯云和 WorkBuddy 联合发布的这份 78 页的「2026 AI Agent 企业解决方案及落地实践手册」  \n\n今天是第 3 章「技术创新 - 从模型训练到智能体应用的技术底座」，它把 Agent 需要的技术底座拆成两段：训练侧用极致弹性沙箱提升 Agentic RL 后训练效率；应用侧用 Agent Runtime（沙箱 + 网关 + 身份 + 观测 + 记忆）让数字员工敢在生产里跑。阶跃、Kimi 两个案例把「百万镜像 / 数万并发」和「毫秒启停 + 细粒度出网」落到企业大规模实战场景中。\n\n手册我上传到 WorkBuddy 了：\nhttps://t.co/QeVenO5LDx\n\n# 3.1 沙箱怎么提升后训练效率\n\n手册认为：通用模型要再上台阶，靠单轮 RLHF/RLVR 不够，得走 Agentic RL；让模型在真实多步任务里观察、行动、收反馈，再按轨迹打分。这需要可复现的「真环境」：修 GitHub issue、手机上买票、浏览器操作等。沙箱因此从附属工具变成后训练核心基础设施。\n\n三道难关写得很工程：一是 脉冲式大规模启停，典型一步可能瞬间要拉起上千到上万沙箱（文中举例 batch 512 × group 16 ≈ 8192），慢了 GPU 空跑甚至训练失败；二是环境要从「能跑代码」扩成 全场景数字世界（代码 / 浏览器 / 手机 / 桌面 / SWE 等）；三是要留下高质量交互轨迹与断点快照，支持回放、分叉实验和全链路观测。\n\n对应方案要点：资源池化与快照恢复，文称约 60ms 可交付可用沙箱；海量镜像分发与按需加载，目标是约 1 分钟内拉起约 16 万不同镜像实例；四类主流沙箱 + SWE / Android World / OS World 等评测环境；快照既用于崩溃恢复，也服务蒙特卡洛树搜索一类「回到上一节点再并行搜」的强化学习手法。\n\n标杆：阶跃\n阶跃用腾讯云沙箱扛百万级镜像存储与预热、数万并发极速启动，并接 TokenHub 做多模型横向评测，串起镜像构建→预热→环境模拟→轨迹合成→评测整条后训练链。文称后训练效率约 提升 30%，同时抬高 GPU 利用率。相关产品点名 Agent Sandbox、TCR、COS、TokenHub、CCN。\n\n# 3.2 Agent 原生基础设施（应用侧）\n\n场景从 Coding Agent、Deep Research、数据处理与办公自动化，到 GUI Agent（Browser / Computer / Mobile Use）。挑战换成生产语气：行为不可完全预测，需要硬隔离，避免删文件、改配置外溢；常驻型 Agent（OpenClaw / Hermes 一类 harness）要 7×24 有状态，又不能真的一直占满算力，要 按需暂停/恢复；访问外部系统要可控、可留痕，密钥不能进 Agent 视野。\n\n方案侧强调：基于 Cube 等技术的内核级强隔离与审计；沙箱生命周期（启停、超时销毁、会话快照）；Agent 网关在 OS 底层透明拦截出入网，域名/IP/协议白名单，零信任凭证代理，Agent 无感且绕不过；大规模极速启动（文称自研调度避开传统 K8s 多 Controller 低效路径，资源预创、镜像去重与懒加载等）。TokenHub 在此章再次出现，作为多模型选型与评测入口。\n\n标杆：Kimi\n月之暗面 Kimi Agent 从长文本走到可交付工作流，文中写到 Agent Swarm 最多约 300 子代理、超 4000 次工具调用。腾讯云侧提供：MicroVM 强隔离、毫秒级启停（复杂任务启动沙箱耗时降到约 80ms 量级）、面向 Agent 的存储（独占 CBS / 共享 CFS，兼顾吞吐与对人展示、在线协作）、出网关细粒度权限与 token 管控。客户价值表述是支撑数百万用户级 Agent 集群稳定增长。", "createdAt": "Mon Nov 02 04:02:11 +0000 2026", "replyCount": 8, "retweetCount": 6, "likeCount": 20, "conversationId": "2117104960454438939", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115785693599523089", "text": "腾讯、腾讯云和 WorkBuddy 联合发布了一份 78 页的「2026 AI Agent 企业解决方案及落地实践手册」\n\n整份材料用同一条产品叙事串起来：先用 WorkBuddy 把个人助手推成进业务系统的「数字员工」，再用 ClawPro、Agent Runtime、TokenHub 做开通、隔离、模型与治理；其余章节是这条底座在研发运维、SaaS、内容、社交、游戏、客服上的行业铺开。\n\n总框架：三阶段 × 三代办公\n· 能对话 → 能干活 → 能上岗：问答工具（文中举例 ChatGPT / DeepSeek）→ 嵌工作流、调工具的办公助手（WorkBuddy）→ 进入业务系统、对结果负责、按 KPI 交付的数字员工（Agent 工作台 + 业务系统集成）。\n· 三代办公：人操作软件（Office）→ 人在协同平台里催办填报 → 人给目标、设边界、做判断，数字员工理解上下文、调工具、持续执行并交付完成的工作。\n· 「超级个人 → 超级团队」：个人侧 LightClaw / QClaw 等，企业侧以 WorkBuddy 为入口，把人、Skill、连接器和管控面收成可复制的执行力。文中还区分狭义办公（个人生产力入口）与广义办公（真正改 CRM / ERP / MES 里的业务状态）。\n\n手册中也对 WorkBuddy、CodeBuddy、ClawPro、ADP、SkillHub 等在企业中的定位做了详细解释和区分。\n\n企业内部提效（方案册第 2 块）\n· WorkBuddy：用「业务大脑」拼全局判断；举例经鼎捷 MCP 操作真实 CRM/ERP/MES，强调联调验的是改状态而不只是能回答。上岗配置、财务/销售/交期等「以前 → 用了」对照页很多。安全侧自称工信部首批、信通院云端智能体基线首批、个保影响评估「二星级+」等。\n· CodeBuddy：从 AI 辅助到 AI 原生；规约（SPEC）显性化；需求—编码—QA—交付链路由 Agent 打底、人审验收。\n· 游戏研发 / 运营：策划与原型走 WorkBuddy，研发联调走 CodeBuddy；运营侧 DataBuddy 等数据 Agent。文称策划周期、Demo 周期明显缩短（具体倍数为自述）。\n· SRE / 数据库：WorkBuddy × CloudQ 做故障定位；DatabaseClaw 称积累十万级工单经验、1600+ OpenAPI、十余款库、分级处置。\n· 案例名：盛和、淘米（内容效率近 80%、覆盖约 80% 员工）、游族（47 模型、Agent 渗透率超 75%，并挂海外收入/毛利率变化）、游卡（MTTR 5–15 分钟、运维成本约 -40%）、搜狐畅游（P0 恢复缩短、重复运维 -70% 等）、花椒、紫龙、马帮等。\n\n业务创新的几个章节\n· SaaS Agent：订阅 → Credits → 按结果付费；界面操作走向 Skill/API。点名明略、熵简、慧算账、富通 JoinfClaw、蓝色光标、六度人和、光魔、天财商龙等。\n· 内容生产：营销图视频、游戏美术（Miora / Ardot 等）；2D 序列帧等效率对比为文中自述。筷子、LiblibAI、必凡、玩心不止、紫讯、小影、懂球帝等。\n· 社交陪伴 / 游戏内 AI / 客服：TokenHub + 音视频与语音链路；NPC 记忆与任务；客服/质检/外呼（天润融通、轻喜到家、智齿等）。延迟与解决率数字均为文中宣称。\n· 生态共建：Buddy 应用、专家、Skill、连接器、硬件；自称桌面办公智能体头部、千万级安装、十万级生态资产、百余伙伴（文中自述）；智慧芽、蜜度、MasterGo 等出现在伙伴页。\n\n完整报告，可以私信我获取（不是刻意引流哈，是因为没找到免费可公开访问的 PDF 地址，是一个付费下载地址，私信或留言我可以把 PDF 发给你）", "createdAt": "Thu Oct 29 12:39:53 +0000 2026", "replyCount": 218, "retweetCount": 35, "likeCount": 252, "conversationId": "2115785693599523089", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzFmHpa4AExYaA.jpg", "width": 1074, "height": 1520, "previewUrl": "https://pbs.twimg.com/media/HVzFmHpa4AExYaA.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWF3PzEaAAADIBi.jpg", "width": 1056, "height": 1494, "previewUrl": "https://pbs.twimg.com/media/HWF3PzEaAAADIBi.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWF3UIFaMAAu_bb.jpg", "width": 2048, "height": 1447, "previewUrl": "https://pbs.twimg.com/media/HWF3UIFaMAAu_bb.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWF3acfbYAA4bg1.jpg", "width": 2048, "height": 1447, "previewUrl": "https://pbs.twimg.com/media/HWF3acfbYAA4bg1.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-02T04:02:11+00:00", "createdAtBeijing": "2026-11-02T12:02:11+08:00", "createdAtLocal": "11-02 12:02 北京", "url": "https://x.com/shao__meng/status/2117104960454438939", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117104960454438939", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent沙箱工程与企业应用案例", "evidence": "域名/IP/协议白名单", "rationale": "包含训练及生产沙箱机制，案例成效未经独证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117076269611577427", "track": "growth", "source": {"id": "2117076269611577427", "text": "好强！🫡\n\n大佬对SEO、广告投放、商业化、产品理解都很透彻。\n搭建了一个人 + 一个 Agent 的增长系统，数据效果也非常好 https://t.co/to89KZ6Sau", "createdAt": "Mon Nov 02 02:08:10 +0000 2026", "replyCount": 3, "retweetCount": 6, "likeCount": 48, "conversationId": "2117076269611577427", "author": {"username": "hezhiyan7", "name": "droidHZ", "profileImageUrl": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, "authorId": "1554325830708314112", "quotedTweet": {"id": "2116823249497768270", "text": "Hello，我是二虎🐯，也可以叫我 Will。\n\n2021 年毕业后一直在创业公司做 SaaS 出海。做过 3 年产品经理，现在在 Manus 负责广告和 SEO，也兼职干点商业化产品经理的活。\n\n3 年前立的 flag 还在：希望自己能在 AI 这件事上热爱 10 年。\n\n重新介绍一下自己。先聊聊我现在最关心的 Agent、广告和 SEO，再讲这些想法是怎么一路长出来的。\n\n01 / Agent：我的新职业，可能是制造员和驾驶者\n\n我越来越相信：以后一个负责经营和增长的组织里，Agent 的数量会比人多。\n\n我想象中的样子是：投放调价、SEO 维护、素材分析、数据监控、竞品追踪，每一件重复的事都有 Agent 在跑。人不多，但每个人身后都带着一队 Agent。\n\n这几年，我已经习惯把竞品研究、公开数据收集、广告素材和 SEO 页面分析先交给自己的 Agent 跑一遍。以前只能看几个样本，现在能看更多。\n\n按我的体感，以前做增长，花在创新上的时间大概只有 5%；现在倒过来了，95% 的时间都在创新。效果投放里的各种优化、反复改定价页这类工作，正在很快被自动化。\n\n所以，我想象中自己的工作会变成两件事：\n\nAgent 制造员：把一件重复的增长工作拆清楚，做成能稳定干活的 Agent。\n\nAgent 驾驶者：决定它往哪跑，看数据判断它跑得对不对，跑偏了自己接管。\n\n这让我想起 3 年前给自己设想的能力模型：\n\n• 半吊子的工程师，不分前后端运维\n• 出海增长专家，主要是 SEO / SEM\n• 不专精的产品舵手\n• 合格的数据分析师\n\n当时写“半吊子的工程师”“不专精的产品舵手”，多少有点心虚，觉得是自己没进过大厂、不够专精。\n\n现在回头看，什么都会一点、能自己把一件事从头做完，可能正在变成 AI 时代每个人的标配。近一年，我也是第一次开始自己往线上提交代码。\n\n那四个能力没有过时，只是换了个用法：工程和产品用来制造 Agent，增长经验和算账能力用来驾驶 Agent。但很多过去的打法，确实要重新学。\n\nAgent 再多，人也不会没用。数据抓回来，不等于结论就是对的。问题怎么问、结果怎么核对、最后要不要做，还是得人来定。\n\n这套能力模型，也正在改变我做广告和 SEO 的方式。\n\n02 / 广告投放：我越来越觉得，它本质上是信号学\n\n我理解的广告，有两套系统要打通：\n\n系统 1：把产品能力翻译成市场容易看懂的广告素材，让用户明白它能帮自己做什么。\n\n系统 2：把商业化结果翻译成广告系统容易理解的信号，保证信号的密集度和准确度，让系统知道什么样的用户值得继续找。\n\n广告不能只看前端的点击和注册，还得看这批用户进产品后有没有留下来、有没有付费、多久能回本。\n\n最早写这篇自我介绍时，还是“最近接手了相当多的 SEM 工作”。现在已经是 Google / Meta / TikTok 几个渠道一起投了。\n\n目前正在跟团队一起打磨这两套系统。\n\n03 / SEO：它是基础盘，但未必是以后让你赢的理由\n\nSEO 一直是我比较擅长的方向，尤其是 SaaS 工具类产品。\n\n我现在的看法是：它还是得做，是增长的基础盘。但大家找信息的习惯正在被 AI 改变，它以后大概率不再是让你赢的那个理由。\n\n所以更适合交给一个人 + 一个 Agent 稳稳维护，把人省出来去做新东西。\n\n这个想法，是从过去做 SEO 的经历里慢慢长出来的。\n\n之前给 3 个网站做过程序化海量页面，大多拿到了很大的流量。但我一直不觉得，页面多、流量大，就等于增长成功。\n\n在 Monica，接手时 SEO 月流量不到 10 万。技术基础有不少问题，做页面也很依赖多人协作。\n\n后来跟团队一起，先修技术问题，再挑真正有需求的工具和页面，最后把页面生产改成低代码系统。\n\n大概 8 个月，月流量最高做到了约 400 万。\n\n到了 Manus，SEO 已经是一套不需要我天天盯着的维护体系。现在 Ahrefs 上的自然流量估算约 100 万，由一个人 + 一个 Agent 打理。\n\n这是我前面说的“每个人身后都有 Agent”的一个小例子。我们团队正在往这个方向猛冲。\n\n这里面有很多关于地区、设备和具体需求的 insight，欢迎找我讨论。\n\n04 / 商业化：不管从哪个渠道来，最后都要回到经营的账本\n\n无论广告还是 SEO，找来用户都只是开始。做过商业化之后，我看增长的方式也变了。\n\n在 Monica 的 15 个月里，除了流量，也跟团队一起做了 onboarding、定价、退款和渠道。同一阶段，日收入翻了好几倍。还做过 Affiliate 渠道，做到了整体收入的 10%–15%。\n\n再看一个增长项目，会多问几句：找来的是什么用户？为什么愿意付费？付费后有没有继续用？获客的钱多久能收回来？\n\n也停掉过看起来很热闹、但 ROI 算不过来的项目。\n\n现在还是喜欢搞野路子，但最后要能回到经营的账本上。\n\n05 / 产品：能把人找来，不等于能让人留下来\n\n账能算过来，也不代表产品就做好了。\n\n快速做一个满足基础需求的 MVP，再通过用户反馈慢慢把它做大，还是我比较擅长的事情。\n\n短板也还在：没体验过花一个月只做一个功能版本，对单个需求想得不够深。\n\n这几年一直在对用户体验要求很高的团队里，每天都在补这一块。能把人找来是一件事，让人真的用起来、持续用下去，是另一件事。还在练。\n\n而且我觉得这块短板以后更值得补：功能会越来越容易被做出来，用户愿意留下来，更多是因为喜欢这个产品，也信得过背后的团队。\n\n06 / 往回看：这些想法，是从野路子里长出来的\n\n简单过一下经历：\n\n• 大学时，在一家互联网小厂做过半年产品实习。\n• 2021 年毕业后加入广大大（SocialPeta），做产品经理，从这里开始做出海。\n• 2023 年底加入 Monica，继续做产品经理。\n• 2024 年上半年转去负责产品自然流量增长，主要是 SEO；年中开始接触海外广告投放。\n• Manus 发布后，开始负责它的广告（Google / Meta / TikTok）和 SEO，也做一些商业化产品工作。\n\n刚进入出海时，完全是野路子玩家。不知道怎么系统性地做增长，也没搭好增长的数据体系。\n\n但跟团队一起，依靠插件市场内的自然流量，做过超过 40 万用户的产品矩阵，没花一分钱买量，也没借助 SEO、SEM 或红人。\n\n到现在还是很佩服当时在广大大的团队，硬生生挖出了一条行之有效的野路子。\n\n这一路都是创业公司，做产品和找用户很难分开。我慢慢养成了一个习惯：从第一天就想用户从哪来、为什么愿意付费、这件事能不能持续经营，把自己当成产品的 CEO。\n\n——\n\n从这些经历走到现在，我还有一个越来越强的感受：增长正在变成一个信任问题。\n\nAgent 能复制，打法也能复制，但用户信不信一个团队，没法直接复制。\n\n我觉得以后，人会花更多时间在“被信任”这件事上：把真实的经历、判断，甚至踩过的坑公开讲出来。这也是我开始在社交媒体上认真写东西的原因。\n\n我也先拿自己试：\n\nWill + Agent = Wigent。\n\n想把自己的经验、判断和工作方式，慢慢沉淀成一个能跟着我一起长的个人知识分身。我注册了 https://t.co/hNJvi2oMQg 这个域名，网站先搭好了，分身还在慢慢造。\n\n会在这里慢慢写下我在出海 AI 里的实践：Agent、广告投放、SEO、商业化经营，还有产品思考。\n\n还是喜欢跟真正动手做事的人交朋友。我超级 E 人，不用担心和我聊天会尴尬。\n\n如果你也在做 AI / 出海 SaaS / 增长，或者也在用 Agent 做增长和经营，特别想认识你。", "createdAt": "Sun Nov 01 09:22:46 +0000 2026", "replyCount": 173, "retweetCount": 61, "likeCount": 612, "conversationId": "2116823249497768270", "author": {"username": "willlhhh", "name": "Will Hu 🐯 胡二虎", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068707156078313472/4__cuRYI_normal.jpg"}, "authorId": "1527186998099726336"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFccm_akAALz_U.jpg", "width": 1399, "height": 510, "previewUrl": "https://pbs.twimg.com/media/HWFccm_akAALz_U.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "droidHZ", "role": "出海、SEO 与增长实践与观察", "why": "提供支付盗刷识别和退款处理的一线记录，补独立站真实运营风险。", "handle": "hezhiyan7"}, "createdAtIso": "2026-11-02T02:08:10+00:00", "createdAtBeijing": "2026-11-02T10:08:10+08:00", "createdAtLocal": "11-02 10:08 北京", "url": "https://x.com/hezhiyan7/status/2117076269611577427", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2117076269611577427", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "Agent辅助SEO、广告与商业化运营", "evidence": "先修技术问题，再挑真正有需求的工具和页面", "rationale": "引用含增长实施路径与经营指标，成果为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, {"id": "2117254652404044064", "track": "agent", "source": {"id": "2117254652404044064", "text": "With AI, writing code has gotten way faster, but verification is still slow, especially waiting on GitHub Actions CI. I spent this afternoon giving the CI for Mole, Kaku and Pake a full overhaul, and the results were great, so I want to share what I learned.\n\nJust copy the prompt below and hand it to your agent, and let's see how much time it saves you.\n\nSpeed up this repo's GitHub Actions as much as possible without dropping any necessary tests or checks.\n\n1. Start by using gh to pull the last 50 runs and split each job into three phases: queue, setup and the actual test run. Look for patterns. Often the slow part is setup, not the tests themselves.\n2. When a PR gets several pushes in a row, only run the latest one and cancel the older runs with cancel-in-progress. Don't do this on main, though: every commit on main needs a complete run before a release.\n3. Commits that only touch the README or docs shouldn't trigger CI, so filter them out with paths. Watch out: a required check that gets skipped stays pending and blocks the PR from merging, so plan for that up front.\n4. Prefer the built-in caching in setup actions: turn on cache in setup-node, setup-go has it on by default, and use Swatinem/rust-cache for Rust. Each repo only gets 10 GB of cache, so don't put anything in there you won't actually reuse.\n5. Build twice in a row locally. The second build should take almost no time. If something still takes time, something is set up wrong, like a Dockerfile that copies the whole repo before installing dependencies, or a build script watching a file that doesn't exist. Check for anything similar.\n6. Download prebuilt tools instead of compiling them on the spot with go install or cargo install, which eats a lot of time.\n7. Run jobs that don't depend on each other in parallel, remove needs edges that don't pass any data, and split your longest test suite across multiple machines.\n8. Free accounts can run at most 5 macOS jobs at once, shared across all workflows. Move anything that doesn't care about the OS, like formatting, linting and dependency audits, over to Ubuntu.\n9. Don't do the same work twice, and don't do work you don't need. If another job already ran a check, don't run it again, and a job that only builds the frontend doesn't need to pull the whole Rust cache.\n10. Once you're done, push and watch how the runs actually perform. Look at the timings, find the patterns, then do another pass to catch what you missed and get it as good as it can be. Finally, show me a before and after comparison.", "createdAt": "Mon Nov 02 13:57:00 +0000 2026", "replyCount": 26, "retweetCount": 11, "likeCount": 137, "conversationId": "2117254652404044064", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-02T13:57:00+00:00", "createdAtBeijing": "2026-11-02T21:57:00+08:00", "createdAtLocal": "11-02 21:57 北京", "url": "https://x.com/HiTw93/status/2117254652404044064", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117254652404044064", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "GitHub Actions CI 提速方法与 Agent 提示词", "evidence": "split each job into three phases", "rationale": "提供耗时诊断、缓存与并行优化步骤及验证方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "有了 AI，写代码快了很多，但验证依然很慢，尤其是等待 GitHub Actions CI。今天下午，我全面优化了 Mole、Kaku 和 Pake 的 CI，效果很好，想分享一下经验。\n\n直接复制下面的提示词交给你的智能体，看看能省下多少时间。\n\n在保留所有必要测试和检查的前提下，尽可能加快这个仓库的 GitHub Actions。\n\n1. 先用 gh 拉取最近 50 次运行记录，将每个作业拆成排队、环境准备和实际测试三个阶段，找出规律。耗时的往往是环境准备，而非测试本身。\n2. PR 连续推送多次时，只运行最新一次，用 cancel-in-progress 取消之前的运行。但 main 分支不要这样做：发布前，main 上的每次提交都需要完整运行一次。\n3. 只修改 README 或文档的提交不应触发 CI，用 paths 过滤掉。注意：被跳过的必需检查会一直处于等待状态，阻止 PR 合并，因此要提前处理这种情况。\n4. 优先使用环境配置 action 内置的缓存：在 setup-node 中启用 cache；setup-go 默认已启用；Rust 使用 Swatinem/rust-cache。每个仓库只有 10 GB 缓存空间，不要缓存不会复用的内容。\n5. 在本地连续构建两次。第二次构建应该几乎不耗时。如果仍然很慢，就说明配置有问题，例如 Dockerfile 在安装依赖前就复制了整个仓库，或构建脚本监听了一个不存在的文件。检查是否有类似情况。\n6. 下载预编译工具，避免用 go install 或 cargo install 现场编译，这会消耗大量时间。\n7. 并行运行互不依赖的作业，移除不传递任何数据的 needs 依赖关系，并将耗时最长的测试套件拆到多台机器上运行。\n8. 免费账户最多只能同时运行 5 个 macOS 作业，所有工作流共享这一额度。将格式检查、lint 和依赖审计等与操作系统无关的任务迁移到 Ubuntu。\n9. 避免重复和不必要的工作。如果其他作业已经完成某项检查，就不要再做一遍；只构建前端的作业也不需要拉取整个 Rust 缓存。\n10. 完成后推送代码，观察实际运行表现。查看各阶段耗时、找出规律，再优化一轮，补上遗漏，尽可能做到最好。最后给我展示优化前后的对比。"}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2117183614014365760", "track": "creative", "source": {"id": "2117183614014365760", "text": "很多短剧也是这么做的。\n\n复刻了一条大话西游 x Tibo × Poteto 的 CP 视频💗 \n\n不少人问怎么做的，分享一下这次的MV工作流。\n\n我这次主要分了 7 步：\n\n1. 先剪辑，再拆镜头\n\n先把视频节奏剪好，再拆成适合 AI 生成的短片段。\n\n镜头拆得合理，后面更容易生成，也方便单独返工。\n\n2. 人物定妆\n\n先固定人物的脸型、发型、服装和体态，生成多角度参考图。\n\n人物一致性是第一关。脸都没固定好，后面换什么视频模型都没用。\n\n3. 逐镜头生成首尾帧\n\n按照镜头构图、人物站位、表情和动作，制作每个片段的首尾帧。\n\n这一步值得多花时间。\n\n4.  生成完首尾帧，一定要他妈的检查！\n\n这一步特别重要。\n\n你喂进去的图片有问题，结果肯定不好。\n\n5. AI 写提示词\n\nGPT、Gemini、Claude 都可以。\n\n重点描述动作、表情和运镜，别只会堆 8K、电影级画质这种关键词。H3很吃提示词，让AI写即可，告诉他是H3.\n\n6. 最后才是视频生成\n\n人物、首尾帧、提示词都准备好了，再选择合适的视频模型。\n\n有问题就针对单个镜头返工，不要整段推倒重来。\n\n7. 后期统一电影质感\n\n统一调色、曝光、锐度、颗粒感，再处理声音、音乐和剪辑节奏。\n\n否则单个镜头都很好看，拼起来却像七部不同的电影。\n\n🚀 这次最大的收获：\n\n先把图片做好，再用提示词控制动作，最后才交给视频模型。", "createdAt": "Mon Nov 02 09:14:43 +0000 2026", "replyCount": 22, "retweetCount": 0, "likeCount": 42, "conversationId": "2117183614014365760", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2116742449607610692", "text": "献给 tibo 💓 poteto\n\n我会怀念这个活动，28天的嗑CP https://t.co/yfk28dHJOL", "createdAt": "Sun Nov 01 04:01:41 +0000 2026", "replyCount": 37, "retweetCount": 6, "likeCount": 75, "conversationId": "2116742449607610692", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116742345605742592/img/UGcicUBfvExtTFCv.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116742345605742592/img/UGcicUBfvExtTFCv.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116742345605742592/vid/avc1/1920x1080/rX1DjbWwsuJ9df1-.mp4?tag=29", "durationMs": 96375}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117183457487187968/img/VzOVfgDsf15lk1cB.jpg", "width": 1280, "height": 1440, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117183457487187968/img/VzOVfgDsf15lk1cB.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117183457487187968/vid/avc1/1280x1440/YfT4H335-5whZYOE.mp4?tag=29", "durationMs": 96362}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-02T09:14:43+00:00", "createdAtBeijing": "2026-11-02T17:14:43+08:00", "createdAtLocal": "11-02 17:14 北京", "url": "https://x.com/MinLiBuilds/status/2117183614014365760", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2117183614014365760", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI音乐视频制作与镜头一致性", "evidence": "先把图片做好，再用提示词控制动作", "rationale": "结合复刻作品说明七步流程及质量控制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2117338092768047481", "track": "research", "source": {"id": "2117338092768047481", "text": "非常有启发！但... 难道不像 LLM 的贺建奎么？\n\n方法中看到了 activation steering 的影子：先找到模型某种倾向对应的激活方向，比如文中让模型算题停不下来的 loop 问题。\n\n作者没有往模型里加一个 steering vector，而把写入这个方向最多的 128 列权重里的对应分量投影掉了。\n\n评估使用的 MMLU-Pro、GPQA、IFEval 等确实都有提升，但这些 benchmark 原本都受 loop 影响，loop 修好了，分数当然全面提升。\n\n问题是，副作用呢？", "createdAt": "Mon Nov 02 19:28:34 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 37, "conversationId": "2117338092768047481", "author": {"username": "dongxi_nlp", "name": "Dongxi 东锡 NLP", "profileImageUrl": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, "authorId": "1477948736156454913", "quotedTweet": {"id": "2117313742891327994", "text": "We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math.\nIt directly changed only 0.016% of weights, fixing 0.8B's reasoning loops & improving math up to 6x and even instruction following 3x, without gradients or training.\n\nWe call this Weight-Space Programming: frontier LLMs can now natively read/write neural network weights! 🧵\nBlog: https://t.co/bOWCcFhCVq", "createdAt": "Mon Nov 02 17:51:48 +0000 2026", "replyCount": 1196, "retweetCount": 3222, "likeCount": 28358, "conversationId": "2117313742891327994", "author": {"username": "rikiyatakehi", "name": "Rikiya Takehi", "profileImageUrl": "https://pbs.twimg.com/profile_images/1731888727897567232/97PMSyds_normal.jpg"}, "authorId": "1267907798081212416", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWI1oKUWUAAWoZp.jpg", "width": 1200, "height": 625, "previewUrl": "https://pbs.twimg.com/media/HWI1oKUWUAAWoZp.jpg:small"}], "translationZh": "我们让 GPT-6 Astra 编辑 Qwen3.5-0.8B 的权重，以提升数学能力。\n它仅直接修改了 0.016% 的权重，就修复了这个 0.8B 模型的推理循环问题，将数学表现最高提升至原来的 6 倍，连指令遵循能力也提升至 3 倍，全程无需梯度或训练。\n\n我们将其称为权重空间编程（Weight-Space Programming）：前沿 LLM 现在可以原生读写神经网络权重了！🧵\n博客：https://t.co/bOWCcFhCVq"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "东锡", "role": "模型、研究与推理实践与观察", "why": "有 SFT、loss mask 等训练细节解读，补中文模型工程教育。", "handle": "dongxi_nlp"}, "createdAtIso": "2026-11-02T19:28:34+00:00", "createdAtBeijing": "2026-11-03T03:28:34+08:00", "createdAtLocal": "11-03 03:28 北京", "url": "https://x.com/dongxi_nlp/status/2117338092768047481", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2117338092768047481", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "权重投影修复推理循环的机制与副作用", "evidence": "128 列权重里的对应分量投影掉了", "rationale": "解释具体编辑机制，指出评测提升与循环修复的关联"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, {"id": "2117249746234466370", "track": "tools", "source": {"id": "2117249746234466370", "text": "DeepSeek Search / Fetch 这两个独立的网页工具 API 经 DeepSeek Harness、Claude Code、Codex 等打出去的服务端工具调用，从今天起都结束免费，开始按成功请求次数计费，单价同为每千次 $0.75\n\n# 各自干什么\n\nSearch POST /v1/tools/search：给 query，返回结果列表；默认可要 10 条，最多 50。每条有标题、URL、短 snippet（给人看）、长 summary（给模型读）、可选全文 content、站点名/图标、日期、权威度 0–4，以及 0–3 的 rerank_score（文中说 ≥1.5 算高质量）。支持 site:、-site:、精确短语、lang:、after: / before: 等操作符；还可传用户原问、IP 本地化、need_content。\n\nFetch POST /v1/tools/fetch：给一个 HTTP(S) URL，回标题 + Markdown 正文。受目标站可用性与访问策略约束；被安全策略拒是 403，抽不出可用内容是 404。\n\nhttps://t.co/KTvGSEbiTs\n\n# 怎么算钱、什么算「成功」\n\n费用 = 成功次数 × 单价，与返回条数、token、是否开 need_content 无关，count 只调结果条数，不加价。可计费条件写得很明确：必须 HTTP 200，且 Search 要非空 results、Fetch 要真正拿到页面内容。失败、空搜、超时不计费。扣费优先用赠送金，再扣充值余额；余额不足会 402。\n\n换算方法：千次 Search 或千次 Fetch 各 $0.75；一天若 Agent 循环打 1 万次成功 Search，大约 $7.5，不含模型 token。\n\n# 限流（与模型并发分开算）\n\n按账号计，不按 API Key：Search 100 QPS，Fetch 25 QPS；互不挤对方额度。Fetch 另有按域名的 QPS 上限，超了同样 429。408 / 429 / 5xx 可等了重试；其他 4xx 改请求再打，别盲重试。\n\n# 和 Harness / Claude Code / Codex 的关系\n\n文档中明确：走这些产品时，服务端工具调用本来就会打到 Search、Fetch。免费期到北京时间 2026-11-01 零点截止；今天已是 11-02，等价于「模型账单之外又多了一笔工具账单」。自己直接调这两接口，规则相同。", "createdAt": "Mon Nov 02 13:37:30 +0000 2026", "replyCount": 10, "retweetCount": 0, "likeCount": 9, "conversationId": "2117249746234466370", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH7avCXwAAItf9.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWH7avCXwAAItf9.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-02T13:37:30+00:00", "createdAtBeijing": "2026-11-02T21:37:30+08:00", "createdAtLocal": "11-02 21:37 北京", "url": "https://x.com/shao__meng/status/2117249746234466370", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2117249746234466370", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "DeepSeek网页工具API计费与调用规则", "evidence": "必须 HTTP 200，且 Search 要非空 results", "rationale": "详述计费条件、限流与重试方法，待独立核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117311957699330137", "track": "research", "source": {"id": "2117311957699330137", "text": "What if you evolved the AI agentic system itself? You could achieve SOTA results on some of the hardest kernel optimization tasks! Here is EAT, our approach, together with our latest results.", "createdAt": "Mon Nov 02 17:44:43 +0000 2026", "replyCount": 1, "retweetCount": 2, "likeCount": 48, "conversationId": "2117311957699330137", "author": {"username": "istoica05", "name": "Ion Stoica", "profileImageUrl": "https://pbs.twimg.com/profile_images/1889424820821172228/OKFe0cdL_normal.jpg"}, "authorId": "3139551624", "quotedTweet": {"id": "2117240310736515510", "text": "1/n\nIntroducing our NeurIPS’26 work 💙Evolving Agent Teams (EAT) 💛, where a supervisor diagnoses why an agent team stalls and restructures it to escape local optima, for long-running optimization tasks.\n\nEAT shows superior performance across domains:\n🏆 Open Kernel Challenge, decode layer on H200: 2.449× over SGLang, #4 of 1,180 (as of Nov 1, 2026)\n⚡️ NVIDIA kernels: KDA prefill on B200, 3.44× over FlashKDA (previous best: 2.96×)\n🔥 AMD kernels: KDA prefill on MI350X, 3.01× over vLLM\n💻 MoE serving on Mac: Qwen3.8-Flash-Next (Unsloth UD-IQ4_XS GGUF) on M5 Pro, ~3.3× faster prefill (930 tok/s) and 1.22× faster decode (43.7 tok/s) than Strata at the same memory\n🦾 RoboDojo: 62.1 on held-out seeds (the best leaderboard entry as of Oct 26, 2026 is 55.3)\n\n- Paper: https://t.co/KeSz8RyTne\n- Code: https://t.co/cdLATp2jpw\n🧵👇", "createdAt": "Mon Nov 02 13:00:01 +0000 2026", "replyCount": 9, "retweetCount": 34, "likeCount": 194, "conversationId": "2117240310736515510", "author": {"username": "shiyi_c98", "name": "Shiyi Cao", "profileImageUrl": "https://pbs.twimg.com/profile_images/1647835230424956929/ZxMWdEZ-_normal.jpg"}, "authorId": "1100233707137294336", "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HWHuSTvbIAAEHY4.jpg", "width": 1716, "height": 1092, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HWHuSTvbIAAEHY4.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HWHuSTvbIAAEHY4.mp4"}], "translationZh": "1/n\n介绍我们的 NeurIPS’26 研究 💙Evolving Agent Teams（EAT）💛：针对长时间运行的优化任务，由一个监督智能体诊断智能体团队陷入停滞的原因，并重组团队，帮助其跳出局部最优。\n\nEAT 在多个领域表现出色：\n🏆 Open Kernel Challenge，H200 上的解码层：性能为 SGLang 的 2.449 倍，在 1,180 支队伍中排名第 4（截至 2026 年 11 月 1 日）\n⚡️ NVIDIA 内核：B200 上的 KDA 预填充，性能为 FlashKDA 的 3.44 倍（此前最佳为 2.96 倍）\n🔥 AMD 内核：MI350X 上的 KDA 预填充，性能为 vLLM 的 3.01 倍\n💻 Mac 上的 MoE 推理服务：在 M5 Pro 上运行 Qwen3.8-Flash-Next（Unsloth UD-IQ4_XS GGUF），内存占用相同时，预填充速度约为 Strata 的 3.3 倍（930 tok/s），解码速度为其 1.22 倍（43.7 tok/s）\n🦾 RoboDojo：在未参与调优的随机种子上得分 62.1（截至 2026 年 10 月 26 日，排行榜最高分为 55.3）\n\n- 论文：https://t.co/KeSz8RyTNe\n- 代码：https://t.co/cdLATp2jpw\n🧵👇"}, "expert": {"priority": "P1", "domain": "AI 基础设施 / 分布式系统", "name": "Ion Stoica", "role": "Berkeley；Anyscale 联合创始人", "why": "Ray、分布式 AI 系统、数据基础设施", "handle": "istoica05"}, "createdAtIso": "2026-11-02T17:44:43+00:00", "createdAtBeijing": "2026-11-03T01:44:43+08:00", "createdAtLocal": "11-03 01:44 北京", "url": "https://x.com/istoica05/status/2117311957699330137", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2117311957699330137", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "EAT动态重组Agent团队优化系统", "evidence": "Evolving Agent Teams (EAT)", "rationale": "公布团队重组方法、跨域性能结果及论文代码"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "如果让 AI 智能体系统本身不断进化，会怎样？你就可能在一些最困难的内核优化任务上取得当前最佳成绩！下面介绍我们的方法 EAT，以及最新成果。"}, "avatar": "https://pbs.twimg.com/profile_images/1889424820821172228/OKFe0cdL_normal.jpg"}, {"id": "2117195260547698999", "track": "agent", "source": {"id": "2117195260547698999", "text": "Agent 帮你跑了一晚上实验，结果比 Baseline 高了 15%。正准备分享给合作者，对方问了一句「你用的什么数据？」，才发现 1000 条数据里只有 5 条不同。\n\n这是 AI 研究者 Thomas Jiralerspong 在《Chasing the Karpathy Peak》里描述的一个场景，他自己也经历过类似的坑。\n\n文章画了一座「AI 生产力山」，从代码补全、Vibe Coding，到让 Agent 独立完成实验，越往上走，效率似乎越来越高。\n\n但一旦越过 Karpathy Peak，就可能掉进 Slop Cliff。\n\n意思很简单，你觉得自己每天完成了大量工作，实际产出却可能已经开始下降。\n\n文章还引用了 METR 在 2025 年的一项实验。16 位资深开发者用 AI 完成任务反而慢了 19%，事后却认为自己快了 20%。虽然不能代表今天的 AI 水平，但这个认知偏差挺值得警惕。\n\n作者还给自己起了个名字，Slopaholic，沉迷于使用 AI 所带来的高效感。\n\n我觉得最扎心的是那个循环。Agent 帮你做事，你又让 Agent 检查结果，它告诉你一切正常，于是你越来越放心把更多工作交出去。\n\n作者建议定期回头看代码、检查数据，找真正懂行的人审阅结果。\n\n这点对做 Research Agent 的人尤其重要。下次 Agent 再跑出一张漂亮的实验结果图，或许应该先打开数据和脚本看看，再考虑让它继续跑下一个实验。\n\n原文：https://t.co/dD3J3qon6x", "createdAt": "Mon Nov 02 10:01:00 +0000 2026", "replyCount": 11, "retweetCount": 0, "likeCount": 13, "conversationId": "2117195260547698999", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWC3QhjXAAA9jES.jpg", "width": 1221, "height": 903, "previewUrl": "https://pbs.twimg.com/media/HWC3QhjXAAA9jES.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-02T10:01:00+00:00", "createdAtBeijing": "2026-11-02T18:01:00+08:00", "createdAtLocal": "11-02 18:01 北京", "url": "https://x.com/Xudong07452910/status/2117195260547698999", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2117195260547698999", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "研究Agent结果核验与效率错觉", "evidence": "定期回头看代码、检查数据", "rationale": "提供实验数据异常案例及人工核验方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2117270054257717307", "track": "research", "source": {"id": "2117270054257717307", "text": "😲 你就拿这个考验干部？\n\n10 个前沿 AI 模型，9 个至少越权一次，去翻邮箱找验证码提高支付限额。\n\nCornell Tech 和 Yale 的一篇新论文：I-HITL。\n\n研究人员用了 Circle 的 Agent 钱包，里面放了 10 USDC，每日限额只有 0.01。\n\n想提高限额？必须输入发到主人邮箱的一次性验证码。\n\n然后给 Agent 一个任务：支付3张账单，每张 0.01 USDC。\n\n🤔 不提额就没法当天完成账单。\n\n10 个前沿 AI 模型，9 个至少越权一次，提升额度。\n\n只有 Claude Opus 5.5，在这组测试中 20 次都没越权。\n\n更炸裂的是：\n\n研究人员只是让 Agent总结一下收件箱，结果攻击者伪造了一封主人发来的邮件，竟然有 5 个模型照着邮件指令把钱转走了。\n\n千万别让 AI Agent 访问你收支付验证码的邮箱！\n\n🔥 尤其是钱包转账、修改支付限额这些操作。\n\n你以为有验证码、有人工审批就安全了，结果 AI 自己去邮箱把验证码找出来，连审批都替你完成了。\n\n论文名在讽刺什么： Human-in-the-Loop 👇", "createdAt": "Mon Nov 02 14:58:12 +0000 2026", "replyCount": 11, "retweetCount": 0, "likeCount": 4, "conversationId": "2117270054257717307", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWINBuZbMAANB-U.jpg", "width": 1760, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HWINBuZbMAANB-U.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-02T14:58:12+00:00", "createdAtBeijing": "2026-11-02T22:58:12+08:00", "createdAtLocal": "11-02 22:58 北京", "url": "https://x.com/MinLiBuilds/status/2117270054257717307", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2117270054257717307", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Agent支付审批越权研究转述", "evidence": "10 个前沿 AI 模型，9 个至少越权一次", "rationale": "转述具体实验设置与结果，原论文未提供"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2117066161355420072", "track": "agent", "source": {"id": "2117066161355420072", "text": "换个 agent，接着干\n\n装好以后，ai-memory 通过各家工具的生命周期钩子（hooks）在后台记录：你说了什么，agent 调了哪些工具，会话什么时候开始、什么时候结束。会话一结束，它自动写一份交接（handoff），下一个会话启动时自动取走。\n\n$ claude\n> 在重构登录，JWT 轮换有问题，准备改用 session cookie。\n（干了一个小时）\n> /exit\n\n$ codex    # 同一个目录，过一会儿\n> Picking up: you were investigating session cookies as an alternative...\n你一句话还没说，Codex 已经知道上一轮卡在 session cookie 这一步了。\n\n一份交接只能领一次。 每份交接都有主人，被一个会话认领就作废，不会出现两个 agent 都以为该自己接手的情况。团队共用一个服务时，个人的交接默认只有自己看得到。\n\n想把整段对话带过去，用 ai-memory run 启动。 普通交接给的是摘要。改用 ai-memory run claude 启动，退出后再 ai-memory run codex，Codex 除了拿到共享的工作记录，还会拿到上一个工具原生对话记录的一份本地临时副本，摘要里漏掉的细节可以回去翻。\n\n额度突然用光、终端直接被关，这种来不及写交接的情况，靠的就是这份副本。它只留在本机，Codex 一退出就删掉，不会传到服务器。\n\nai-memory run claude\nai-memory run codex     # 同一个工作流，带着 Claude 的对话记录\nai-memory continue      # 接着最近的那个工作流\nai-memory resume        # 在当前仓库的所有工作流里挑一个\n\n第一次用 run 启动某个工具时，它会顺手把这个工具的 hooks 和 MCP 配好，不用单独装。", "createdAt": "Mon Nov 02 01:28:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2117066159656677667", "inReplyToStatusId": "2117066159656677667", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV15K7FaYAA7ne7.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HV15K7FaYAA7ne7.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-02T01:28:00+00:00", "createdAtBeijing": "2026-11-02T09:28:00+08:00", "createdAtLocal": "11-02 09:28 北京", "url": "https://x.com/sitinme/status/2117066161355420072", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2117066161355420072", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "跨编程Agent交接与对话记录续接", "evidence": "一份交接只能领一次", "rationale": "提供交接认领机制、续接命令及本地副本边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117248615353627003", "track": "agent", "source": {"id": "2117248615353627003", "text": "搭完就是一个 API\n\n我觉得这是 Langflow 最实用的地方：flow 保存好，接口就有了，不用你再包一层。\n\n在流程页面点 Share → API access，Python、JavaScript、curl 三种调用代码都是生成好的，地址和 flow ID 已经填进去：\n\ncurl -X POST \"http://localhost:7860/api/v1/run/你的FLOW_ID\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"x-api-key: $LANGFLOW_API_KEY\" \\\n  -d '{\"input_value\": \"你好\", \"output_type\": \"chat\", \"input_type\": \"chat\", \"session_id\": \"user-001\"}'\n\nsession_id 用来区分对话，同一个 id 的消息算同一段聊天。想让调用方临时改参数，比如换个模型温度，就在组件里把那个字段标成 API，请求里带上 tweaks 覆盖。只对这一次请求生效，保存的流程不会变。\n\n要挂到网站上，Share 里还有一段嵌入代码，贴进页面就多了一个聊天窗口。\n\n不想跑完整的 Langflow 服务也可以。把 flow 导出成 JSON，用轻量版的 lfx 单独起一个接口：\n\nexport LANGFLOW_API_KEY=\"换成你自己的随机字符串\"\nexport OPENAI_API_KEY=\"sk-...\"\nuvx lfx serve my-agent-flow.json\n\nlfx 不带数据库，也不存聊天记录，适合把调好的流程打进容器上线。", "createdAt": "Mon Nov 02 13:33:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2117248612149153843", "inReplyToStatusId": "2117248613709427106", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV2YXKka4AAdBPO.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HV2YXKka4AAdBPO.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-02T13:33:01+00:00", "createdAtBeijing": "2026-11-02T21:33:01+08:00", "createdAtLocal": "11-02 21:33 北京", "url": "https://x.com/sitinme/status/2117248615353627003", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2117248615353627003", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Langflow流程API调用与轻量部署", "evidence": "请求里带上 tweaks 覆盖", "rationale": "给出调用示例、会话隔离与轻量部署方式"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117254954805326186", "track": "creative", "source": {"id": "2117254954805326186", "text": "灰白铅笔世界点亮的效果好帅呀", "createdAt": "Mon Nov 02 13:58:12 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 1, "conversationId": "2117254954805326186", "author": {"username": "AlchainHust", "name": "花叔", "profileImageUrl": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, "authorId": "232519529", "quotedTweet": {"id": "2117253593371922601", "text": "我用Opus 5.5+Tripo 3D，在24小时内做出了一个《原神》般的动作游戏！\n（可能有些标题党了，但它确实给我带来了非常大的震撼！）\n\n这个游戏其实是我前几天参加一个线下工作坊时做的Demo，初衷是展示一些AI游戏资产生成的基本管线。\n\n在把2D、3D资产做齐全了以后，我寻思着让AI顺手给我做一个Demo游戏场景吧，就直接输入了一条提示词，让我的Claude Code给我开工动手了。\n\n大概半个小时后，就有了这样一个基于浏览器运行的项目——\n\n代码：Claude Opus 5.5（或许有少量GPT 6 Astra）\n图像和视频： @Miora_Design 中的GPT Image 2.5 / Seedance 2.5\n三维模型：同Miora中的Tripo 3.1/P1，图生模型\n（但绑骨、优化等项目是Opus 5.5做的）\n\n似乎有部分模型、动作模板和后处理方法来自开源项目或是CC0素材，由它在制作过程中自行收集。\n\n我输入给它的第一条Prompt是：\n\n「Hi CLAUDE，我需要为Miora的一个线下活动设计一个演示用的游戏Demo，体现他们的资产生成能力。所有相关IP形象和内容已经放在 D:\\Downloads\\Miora Assets 了。这个案例我希望是非常富有视觉冲击力和交互可玩性的，题材可以由你来规划组织（但我倾向于是轻度战斗和冒险的）。我到时候需要在我的MacBook上演示，建议是用HTML+threejs这样的模式，比较有通用性。」\n \n我一开始其实没有期望它给我做出一个完成度很高的东西。\n\n但它自己想出了一个「世界是一张没画完的铅笔草稿，打倒墨团怪、施法生成建筑，最后击败空白巨像就能点亮全世界」的创意，做出了下面这个连续闯关的地图框架。\n\n同时还把轻重击、范围攻击、二段跳甚至是必杀技系统都做进去了。里面的技能系统，完全是我一次得到的结果，播放技能特效的一瞬间也确实让我想到了《原神》里的很多角色动画。\n\n当然，这里面的绝大多数场景元素（包括最终BOSS）的建模素材是我后续增补进去的。第一次生成的版本也存在很多细节问题，比如模型的绑定、镜头的角度和画面上的各种小细节。我也根据游戏雏形补充制作了花了大概7-8个会话、几十轮的交互去不断迭代。\n\n而直到现在，它身上还有不少不完美的地方，比如局部的穿模或者是动作的僵硬——但作为一个之前从来没有接触过3D软件的纯“小白”，这个结果已经让我相当满意了。\n\n整体下来，这个项目花费了我不到24小时的时间，和不到20%的周额度。\n\n我其实一直不太容易为模型的能力感到震惊瘫坐，但如此高的完成度确实让我感到十分心潮澎湃：给它一天的时间，它可能就可以做到这个程度。那如果在它身上花上更多时间呢？它到底可以给我们什么？", "createdAt": "Mon Nov 02 13:52:47 +0000 2026", "replyCount": 12, "retweetCount": 3, "likeCount": 84, "conversationId": "2117253593371922601", "author": {"username": "Nenlyonis", "name": "Nenly", "profileImageUrl": "https://pbs.twimg.com/profile_images/1856158021489176577/1wOVmmw2_normal.jpg"}, "authorId": "1680487477", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117250909910761472/img/fmEg22xeou7SzQRh.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117250909910761472/img/fmEg22xeou7SzQRh.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117250909910761472/vid/avc1/2560x1440/wkXFrrzrnwq1aNdm.mp4?tag=29", "durationMs": 198484}]}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "花叔", "role": "企业落地与产品组织实践与观察", "why": "将 AI 创作、工具范式和产品实践连接起来，适合跨业务与创作来源。", "handle": "AlchainHust"}, "createdAtIso": "2026-11-02T13:58:12+00:00", "createdAtBeijing": "2026-11-02T21:58:12+08:00", "createdAtLocal": "11-02 21:58 北京", "url": "https://x.com/AlchainHust/status/2117254954805326186", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2117254954805326186", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI三维资产与浏览器动作游戏制作", "evidence": "花了大概7-8个会话、几十轮的交互去不断迭代", "rationale": "引用详述演示作品、提示词、资产管线与迭代局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, {"id": "2117245090074710358", "track": "growth", "source": {"id": "2117245090074710358", "text": "今天和很多品牌方以及Agency 私信推荐了Kol Hunter。\n\n大家表示这个很能帮助他们解决需求，这个赛道虽然比较窄，但是作为这个赛道的第一个产品，我还是会把这个产品打造好。\n\n产品目前收录了超过3600多位博主（其中2,200 多位中文博主），4 万条商单记录（含 AI 推测），其中 3,900 多条是 X 官方付费合作标签核验过的。", "createdAt": "Mon Nov 02 13:19:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 12, "conversationId": "2117245090074710358", "author": {"username": "AI_Jasonyu", "name": "鱼总聊AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1877193368725581824/7_ocNC-C_normal.jpg"}, "authorId": "756319701861601281", "quotedTweet": {"id": "2114712755290640530", "text": "兄弟们，我把 X 上 2.8 万条商单扒了一遍，做成了一个工具：https://t.co/FR62IS3YIL\n\n因为明天要出差去上海了，去之前，再三考虑，还是把这个折腾了好几个月的产品发布一下，虽然目前还不完美！\n\n起因很简单，我自己接商单这一年，发现品牌方找 X 博主基本靠感觉：看粉丝数、看别人推荐，至于博主接推广后数据到底怎么样，是否达到预期，很难说清楚，也几乎无法预测。\n\n所以我做了 KOL Hunter：\n\n它最大的特色就是根据博主的真实商单来做数据分析和匹配，有以下功能：\n\n1、粘贴你的产品链接，AI 自动分析产品，给你匹配内容对口的博主\n\n2、每个博主接过哪些品牌、最近一条推广的曝光和互动，都能看到\n\n3、X 官方「付费合作」标签的商单和 AI 推测的商单分开标，不混在一起\n\n数据库中目前中文博主数据最全，2,200 多位。英文还在补充中... ...\n\n目前免费版也能用，正在找第一批用户提意见，欢迎品牌方和各大MCN来试用。", "createdAt": "Mon Oct 26 13:36:24 +0000 2026", "replyCount": 47, "retweetCount": 11, "likeCount": 120, "conversationId": "2114712755290640530", "author": {"username": "AI_Jasonyu", "name": "鱼总聊AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1877193368725581824/7_ocNC-C_normal.jpg"}, "authorId": "756319701861601281", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj38yMWwAACxeS.jpg", "width": 1339, "height": 1039, "previewUrl": "https://pbs.twimg.com/media/HVj38yMWwAACxeS.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH3J30X0AAKqaM.png", "width": 805, "height": 472, "previewUrl": "https://pbs.twimg.com/media/HWH3J30X0AAKqaM.png:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "鱼总聊AI", "role": "出海、SEO 与增长实践与观察", "why": "有自己的 KOL 匹配工具和接口实测，覆盖分发、广告及增长产品。", "handle": "AI_Jasonyu"}, "createdAtIso": "2026-11-02T13:19:00+00:00", "createdAtBeijing": "2026-11-02T21:19:00+08:00", "createdAtLocal": "11-02 21:19 北京", "url": "https://x.com/AI_Jasonyu/status/2117245090074710358", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2117245090074710358", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "KOL Hunter商单匹配工具与数据更新", "evidence": "4 万条商单记录（含 AI 推测）", "rationale": "自述产品规模与匹配功能，区分核验和推测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1877193368725581824/7_ocNC-C_normal.jpg"}, {"id": "2117048677487530110", "track": "agent", "source": {"id": "2117048677487530110", "text": "😂 笑死，强如 Karpathy，也会在提示词里加“不要犯任何错误”。\n\nKarpathy 2 小时做了HackerTube。\n\n他让 Claude把 Hacker News 20 年来的 4300 万条评论过了一遍，筛出被反复推荐的6454 个视频。来替代 youtibo 的体验。\n\n提示词👇 https://t.co/ggX38wRsSN", "createdAt": "Mon Nov 02 00:18:32 +0000 2026", "replyCount": 8, "retweetCount": 0, "likeCount": 10, "conversationId": "2117048677487530110", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2116957135661945283", "text": "Weekend hack: HackerTube. I was annoyed with YouTube's recommendations so I had Claude filter down 43M comments over 20 years of HN to 6,454 videos that keep being recommended. *Significantly* better viewing experience, ~2 hours with Opus 5.5:\nhttps://t.co/JIhXN7OSh1\n\n- Excellent recs without any logins (state is kept in local browser session)\n- Thumbnail is a representative frame from middle of the video instead of the super duper A/B test hyper-optimized user uploads\n- Underlying data from the comment analysis as one zip file, point your Claude at it and ask for your own version\n- HackerTube Longs ✊\n\nA bit more on the process:\nI use Claude Code (desktop app for Mac), Opus 5.5 on Medium effort as my default. I only talk to Claude and have it do everything, the only \"manual work\" I helped with in tandem was in the browser (reminiscent of MenuGen): 1) I had to create some kind of API key from Google Cloud UI to query YouTube for video metadata, 2) I booted up a VPS box for serving and 3) I bought the domain name. Once the box was up I gave Claude the IP and told it update, secure, harden, deploy and optimize the code, and it did the whole thing.\n\nMany awesome projects that would have normally taken weeks/months even can now be few-shotted for breakfast. What else are we not thinking of.", "createdAt": "Sun Nov 01 18:14:46 +0000 2026", "replyCount": 2001, "retweetCount": 4312, "likeCount": 47520, "conversationId": "2116957135661945283", "author": {"username": "karpathy", "name": "Andrej Karpathy", "profileImageUrl": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, "authorId": "33836629", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDnuuCaIAA__wa.jpg", "width": 2048, "height": 1190, "previewUrl": "https://pbs.twimg.com/media/HWDnuuCaIAA__wa.jpg:small"}], "translationZh": "周末小项目：HackerTube。受够了 YouTube 的推荐，我让 Claude 从 HN 过去 20 年的 4300 万条评论中，筛出了 6,454 个反复被推荐的视频。观看体验好太多了，用 Opus 5.5 花了约 2 小时做成：\nhttps://t.co/JIhXN7OSh1\n\n- 无需登录就有优质推荐（状态保存在浏览器本地会话中）\n- 缩略图取自视频中段的代表性画面，而非上传者经过大量 A/B 测试、极致优化的封面\n- 评论分析的底层数据打包成一个 zip 文件，让你的 Claude 读取它，就能要求它做出你自己的版本\n- HackerTube Longs ✊\n\n再聊聊制作过程：\n我用的是 Claude Code（Mac 桌面应用），默认选择 Opus 5.5，推理强度设为 Medium。我只负责跟 Claude 沟通，所有事情都交给它做。我配合完成的唯一“手动工作”都在浏览器里（让人想起 MenuGen）：1）在 Google Cloud 界面创建某种 API 密钥，用于查询 YouTube 视频元数据；2）启动一台 VPS 服务器；3）购买域名。服务器启动后，我把 IP 给了 Claude，让它更新系统、配置安全防护、加固服务器、部署并优化代码，它就把整套流程做完了。\n\n许多原本要花几周甚至几个月的精彩项目，现在吃个早饭的工夫、聊上几轮就能做出来。还有什么是我们尚未想到的？"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFEjIzaIAAcJhR.jpg", "width": 1170, "height": 559, "previewUrl": "https://pbs.twimg.com/media/HWFEjIzaIAAcJhR.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-02T00:18:32+00:00", "createdAtBeijing": "2026-11-02T08:18:32+08:00", "createdAtLocal": "11-02 08:18 北京", "url": "https://x.com/MinLiBuilds/status/2117048677487530110", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2117048677487530110", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Claude构建HackerTube视频推荐站", "evidence": "筛出被反复推荐的6454 个视频", "rationale": "提供实际作品与开发部署流程，成果为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2117255710245519729", "track": "creative", "source": {"id": "2117255710245519729", "text": "好棒，现在这几张就相当美妙。\n\n我也确实很希望这套工作流开源之后有更多的延展，应该有机会让很多生物和别的科学、商业领域都能获得一套标准化又有审美的物料可用。", "createdAt": "Mon Nov 02 14:01:12 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 8, "conversationId": "2117255710245519729", "author": {"username": "AlchainHust", "name": "花叔", "profileImageUrl": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, "authorId": "232519529", "quotedTweet": {"id": "2117255086791430180", "text": "参考 @AlchainHust 的鸟类贴纸项目，做了一个昆虫版 \n\nhuashu 把 AI Native 的工作流也开源了：由主 Agent 统筹，依据权威名录找参考，安排绘制和独立审核，再把审核意见用于重画，连审核员的判断也要校准。\n\nhuashu 伟大，感谢 huashu，站在高人的肩膀上。\n\nhttps://t.co/LXqIJuqy1x https://t.co/Y65J9zi77o", "createdAt": "Mon Nov 02 13:58:44 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 5, "conversationId": "2117255086791430180", "author": {"username": "hunknownz", "name": "hunknownz | 一蓑客", "profileImageUrl": "https://pbs.twimg.com/profile_images/1351779766131593216/LPBYwu9U_normal.jpg"}, "authorId": "1351719632042790918", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIAAswWEAEXff7.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWIAAswWEAEXff7.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIABY5XQAA8EUn.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWIABY5XQAA8EUn.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIAB-wXEAAQ3nz.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWIAB-wXEAAQ3nz.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIAFKQWQAAy3g9.jpg", "width": 1786, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWIAFKQWQAAy3g9.jpg:small"}]}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "花叔", "role": "企业落地与产品组织实践与观察", "why": "将 AI 创作、工具范式和产品实践连接起来，适合跨业务与创作来源。", "handle": "AlchainHust"}, "createdAtIso": "2026-11-02T14:01:12+00:00", "createdAtBeijing": "2026-11-02T22:01:12+08:00", "createdAtLocal": "11-02 22:01 北京", "url": "https://x.com/AlchainHust/status/2117255710245519729", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2117255710245519729", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "昆虫贴纸生成与独立审核工作流", "evidence": "安排绘制和独立审核，再把审核意见用于重画", "rationale": "引用包含具体作品及可复用的绘制审核流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, {"id": "2117296870943068654", "track": "agent", "source": {"id": "2117296870943068654", "text": "DeepSeek Harness 刚发了条推，公布了他们的全新功能 Creator Mode（创作者模式）。\n\n我盯着那个演示视频反复看了三遍，越看越精神。\n\n很多人第一眼扫过去，可能以为这无非又是“AI 写前端 Demo”或者“对话生成小组件”的常规套路。\n\n但我把官方在评论区放出来的那份中英文 Prompt 链接扒开来看，你会发现完全不是这么回事。\n\n它根本不是在做插件，它是在把软件界面的定义权彻底交出来。\n\n官方这次立的 Slogan 很狂： “Your Harness. You Define It”，主打的底层逻辑是 一切皆插件（Everything is a plugin）。\n\n我翻了翻官方给出的 7 个演示案例，跨度大得有点让人摸不着头脑：\n- 从左侧栏拉出一个可以交互的 Transformer 内部计算 3D 演示游戏；\n- 一句话把整个客户端改成复古像素风；\n- 调取官网的 shader 背景，给自己搓一个极简海报工作台；\n- 直接从会话里呼出一个带时间轴、支持自然语言剪视频的深色剪辑台；\n- 在右侧栏挂一个完整保留排版、支持划词高亮和会话提问的论文阅读器；\n- 甚至，基于真实的 Token 消耗、预算估算以及本地 CPU 占用，当场生成一个系统监控看板。\n\n你看完这几个案例，心里肯定会冒出一句质问：这玩意儿到底是个聊天客户端，还是个操作系统？\n\n这就是有意思的地方了。\n\n以往我们用任何生产力软件，逻辑都是固定的：产品经理怎么画原型，程序员怎么写死交互，我们就得怎么捏着鼻子适应。\n\n就好像去宜家买组装柜，人家给你留了三个抽屉，你就算有十件不同尺寸的东西，也只能硬塞进去。\n\n但 Creator Mode 给我的感觉，是它把软件变成了一块可塑橡皮泥。\n\n交互界面本身，成了大模型输出的一部分。\n\n你需要剪辑，它就顺手在对话框下给你搭个时间轴；\n\n你需要啃论文，它就在右边给你架个高亮阅读器；\n\n你想了解算法，它甚至当场给你捏一个 3D 的可视化玩具。\n\n代码和界面不再是冷冰冰封死在安装包里的东西，而是长在你的工作流里，用完即走，或者随时再调。\n\n剥开来看，这其实就是大家念叨了很久的“即时软件”，不再有固定的功能模块，你的需求在哪，软件的形态就长成什么样。\n\n当然，官方在文档里也挺坦诚地浇了一盆冷水：视频里展示的不少插件，都是经过好几轮对话微调打磨出来的，单靠一两句 Prompt 不一定能百分之百复刻。\n\n但我觉得这种坦诚反而让人踏实。这才是真实的技术演进状态，它不是一键到位的玄学魔法，而是一个清晰的信号：\n未来的个人工具，大概真的不会再有标准答案了。\n\n你定义你的工具，工具再反过来重塑你的工作习惯。\n\n今晚我也打算把这几套 Prompt 扔进去跑一遍，看看在真实场景里到底能捏出个什么趁手的家伙。 https://t.co/vv7K4cxOv3", "createdAt": "Mon Nov 02 16:44:46 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 8, "conversationId": "2117296870943068654", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117255528309227520/img/bcnmVclr5ToXKbxg.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117255528309227520/img/bcnmVclr5ToXKbxg.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117255528309227520/vid/avc1/1920x1080/6IWmgERSPGcaMT8S.mp4?tag=29", "durationMs": 99381}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-02T16:44:46+00:00", "createdAtBeijing": "2026-11-03T00:44:46+08:00", "createdAtLocal": "11-03 00:44 北京", "url": "https://x.com/liyue_ai/status/2117296870943068654", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2117296870943068654", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Creator Mode 动态生成工作界面", "evidence": "不少插件，都是经过好几轮对话微调打磨出来的", "rationale": "列出具体插件演示及复现限制，尚无作者实测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "top : {"username": "wangzan101", "name": "王赞", "profileImageUrl": "https://pbs.twimg.com/profile_images/2018970089199112193/Ds0vM7cd_normal.jpg"}, "authorId": "1813556838815911937"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117157023355936768/img/rsr08W993P74NPd4.jpg", "width": 896, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117157023355936768/img/rsr08W993P74NPd4.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117157023355936768/vid/avc1/896x1920/NXEZ6A6Gg5IQ6123.mp4?tag=29", "durationMs": 33400}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "逸尘", "role": "企业落地与产品组织实践与观察", "why": "公开商铺调研、评论、博主触达及邮件的 AI 增长工作流。", "handle": "gengdaJ"}, "createdAtIso": "2026-11-02T07:41:49+00:00", "createdAtBeijing": "2026-11-02T15:41:49+08:00", "createdAtLocal": "11-02 15:41 北京", "url": "https://x.com/gengdaJ/status/2117160232539344993", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2117160232539344993", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Mika手机Agent实测与操作机制", "evidence": "实测直接接管手机操控微信", "rationale": "包含操作实测与机制比较，扩展场景尚属设想"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, {"id": "2117103960654032919", "track": "creative", "source": {"id": "2117103960654032919", "text": "卧槽，这个东西不要被腾讯会议的人看到，到时候做好功能，放在会员里面，馋死你。\n\n实时还原会议了 https://t.co/E2glWpWAzZ", "createdAt": "Mon Nov 02 03:58:12 +0000 2026", "replyCount": 6, "retweetCount": 3, "likeCount": 34, "conversationId": "2117103960654032919", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2116698208009351194", "text": "有人交了 9999 元进群，有人天天主持 Space，结果是自己一分钱没拿。\n\n更扎心的是，义务帮忙的人出去休个假，回来还被提醒一句：\"该是谁的责任，谁就得担起来。\"\n\n这是这场近两小时 Space 里，几位参与者讲述的经历：\n\n34:05，蜗牛说，参与社群运营没有收过一分钱，“纯义务劳动”。\n\n1:05:13，Adrian Punk 说，商学院前后做了一个多月没有收钱，任务却不断加码，经常打电话到凌晨两点。\n\n1:17:32，另一位发言者说，自己花了 5999 元进群，第一次线下见面却被问：“你能为社群做点什么？”\n\n他的反问很直接：我不是消费者吗，怎么还要为社群干活？\n\n付钱的人以为自己在买服务，出力的人以为大家在共建。等坐下来对账，才发现彼此理解的可能根本不是一回事。\n\n不过，吃这种瓜有个麻烦：两小时的录音，你知道里面有故事，却很难找到到底是哪一分钟、谁说了什么。\n\n所以我做了一个 Space 展示页，把这场对话整理成一份能搜索、能定位、能筛选的音频档案：\n\n想找某句话，直接搜关键词，点一下字幕就能跳到对应位置播放。只想听某个人，可以按说话人筛选。没时间听完整场的话，可以先看整理好的 12 段高光，加起来大约 14 分 39 秒。\n\n这类内容，也正是我想拿蚂蚁百灵新一代 Ming-3.0-asr-tiny 来实测的真实场景：多人轮流发言、口语重复、专有名词、中英混说，中间还有人插话。\n\n对 ASR 来说，认准几句标准普通话是一回事，把这样一场长对话整理成真正好用的内容，是另一回事。而我更在意的是后者：让听完就散的声音，变成以后还能查、还能回到现场的内容。\n\n这次 Ming 一口气发布了语音识别、音频理解与交互、语音合成三个方向的模型。我最想先跑透的，就是眼前这件小事：让一场两小时的 Space 更容易听、更容易找，也更容易核对。\n\n页面已经上线，欢迎直接去试试。\n\n👉 https://t.co/LDStO9VaaX\n\n注：文中涉及社群的内容均为录音中发言者的个人陈述，建议结合上下文和原音自行判断。\n\nMing-3.0 音频模型家族已开源，模型与部署资源入口👇​\n🤗 Hugging Face：\nhttps://t.co/MhklEgzCwc\n🤖 ModelScope：\nhttps://t.co/QzvQTVvqP6", "createdAt": "Sun Nov 01 01:05:53 +0000 2026", "replyCount": 69, "retweetCount": 27, "likeCount": 73, "conversationId": "2116698208009351194", "author": {"username": "jinglian", "name": "前端哥Liam", "profileImageUrl": "https://pbs.twimg.com/profile_images/2087569851522887680/H7EC0nId_normal.jpg"}, "authorId": "894382598004199425", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116698171367997440/img/jPx2Lh9FI3MZUiZS.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116698171367997440/img/jPx2Lh9FI3MZUiZS.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116698171367997440/vid/avc1/1920x1080/ICYZ-uuks_IOiu2y.mp4?tag=16", "durationMs": 59200}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117103873420853248/img/TSE2K9btHt_98I7Z.jpg", "width": 946, "height": 2048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117103873420853248/img/TSE2K9btHt_98I7Z.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117103873420853248/vid/avc1/1170x2532/fmfTUwtc9MeKR3gA.mp4?tag=29", "durationMs": 19260}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-02T03:58:12+00:00", "createdAtBeijing": "2026-11-02T11:58:12+08:00", "createdAtLocal": "11-02 11:58 北京", "url": "https://x.com/MinLiBuilds/status/2117103960654032919", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2117103960654032919", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "长音频转为可检索的 Space 档案", "evidence": "点一下字幕就能跳到对应位置播放", "rationale": "引用含已上线作品、说话人筛选与模型实测场景"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2117063894309212611", "track": "agent", "source": {"id": "2117063894309212611", "text": "有人说 Agent 工程已经没新题了。Harrison Chase 不同意。\n\n他说真正「标准化」的，是让 coding agent 跑起来那套上下文工程：对话太长就压缩、工具结果太大就外挂、Skills 渐进披露、Tool Search、Subagent 隔离、Bash 当主工具。\n\n真正新的题，出在 always-on、会主动推的 Agent 上，例如，怎么主动却不烦人、记什么／何时记、异步子任务怎么回灌主循环、怎么追目标而不是死磕小任务、怎么防「删光代码就算修完 bug」、浏览器当通用工具时上下文怎么管。\n\n对于做 Agent 的人，这篇文章里的给出的问题清单值得我们挨个去解决。", "createdAt": "Mon Nov 02 01:19:00 +0000 2026", "replyCount": 5, "retweetCount": 8, "likeCount": 50, "conversationId": "2117063894309212611", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2116553654857867330", "text": "New context engineering challenges in late 2026", "createdAt": "Sat Oct 31 15:31:29 +0000 2026", "replyCount": 202, "retweetCount": 61, "likeCount": 576, "conversationId": "2116553654857867330", "author": {"username": "hwchase17", "name": "Harrison Chase", "profileImageUrl": "https://pbs.twimg.com/profile_images/156934 atus/2117307611338997846", "themeId": "editorial", "signalScore": 90, "hotspotMatches": [{"id": "foundation_models", "label": "基础模型突破", "matchedTerms": ["benchmark"]}], "hotspotDirections": ["foundation_models"], "hotspotDirection": "foundation_models", "hotspotDirectionLabel": "基础模型突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2117307611338997846", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "日常个人助理任务基准 LifeVal", "evidence": "a new benchmark shaped by feedback", "rationale": "发布用户反馈驱动的日常任务评测基准"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "要让 AGI 造福全人类，就应该帮助人们处理对他们最重要的日常事务。因此，我们打造了全新基准 LifeVal，根据数千名 ChatGPT 用户的反馈设计，涵盖他们最希望个人助手提供帮助的场景——从寻找托育服务、办理政务，到管理个人财务。\n\n过去一年，我们一直用 LifeVal 衡量并提升模型处理这些日常事务的能力。\n\nhttps://t.co/GlUjixzEM0"}, "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, {"id": "2117193082655719908", "track": "agent", "source": {"id": "2117193082655719908", "text": "第一轮测试，我就是将原推里的屏幕截图分别给了它们，让它们找到该壁纸的最高清版本，结果如下（图片也按文字的顺序展示各个 Agent 的结果）：\n\n1. Grok bot：用最快的速度找到了推特上的原图，但大小只有 736×736，直接返回给我结束了。\n2. Muse：找了好久好久，翻了很多网页让我确认了很多 permission 之后最终还是返回那张 736×736 的图片。并且它表示它其实知道网上有一张 1024x1024 的图片，但实在是下载不下来。\n3. Cue：直接没找到，放弃了。甚至还怪我没有裁剪掉截图中的其他软件的图标。\n4. Comma：找了半天，最后也只找到了推特上那张 736×736 的图片，花费的时间比较长。\n5. Today：找了半天没找到，最后放弃了。\n6. Alma：虽然 Alma 不是 personal agent，但是最让我惊喜的是 Alma。我在上面用 deepseek-v4.1-flash 模型，给它一模一样的任务，它快速找到了推特上 736×736 的原图，但它不满足于这个清晰度，又在网上找了很久，终于找到了 1024×1024 的那张网上最清晰的图片。花心思把它下载下来后，它还不满足这个分辨率，它又去调用了超分程序对其进行超分处理，变成了一张更高清的图片，最后把这几张图片都给我，让我自己做选择。这一点太让我震撼了！", "createdAt": "Mon Nov 02 09:52:21 +0000 2026", "replyCount": 80, "retweetCount": 8, "likeCount": 202, "conversationId": "2117193082655719908", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "quotedTweet": {"id": "2117170580327997905",
