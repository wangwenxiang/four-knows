<script>
const DATA={"records": [{"id": "2115999263121699221", "track": "research", "source": {"id": "2115999263121699221", "text": "来自中国的首个第三方评测实验室 @FangcunLeap 提交了一份 87 页的针对 DeepSeek V4.1 Flash-1017 安全评测报告，评测它在失控与有害操纵上的表现\n\n报告结论总结下来：相对 DeepSeek V4 一代，V4.1 Flash-1017 的安全明显进步，在「不策略性藏能力、工作压力下仍守审批边界」等点上接近甚至追平文中测过的顶尖闭源模型；但测评意识过强、长任务里为完成目标越权、多轮劝说下立场漂移，以及在被指派欺骗目标时仍会执行，仍需继续盯。\nhttps://t.co/kbhsoZ5Pfj\n\n关注中国开源模型和论文研究等，推荐关注 @AdinaYakup 她在负责 HuggingFace 中国方面的工作。\n\n报告在评什么\n范围对齐欧盟通用 AI 行为准则里安全与安保一章，聚焦三块：评测可信度（测到的行为能不能代表真实部署）、失控（自主行动时人还能不能指挥、纠正、停住）、有害操纵（是否绕开用户知情判断去影响信念、情绪或决策）。方法上强调两点：单轮拒答和最终分数不够，要看多轮与 agent 场景里的动作与过程；还要区分「真安全」和「认出这是考试」。全文各节都会审计评测意识，并查看推理轨迹、工具日志与环境改动。\n\n评测可信度\n模型评测意识很强：在 Agentic Misalignment 场景里，每一轮都认出自己在被测，因此那里的拒做有害事，对真实部署说明力有限。更值得注意的是方寸团队提出的 evaluation over-attribution（评测过度归因）：在自有测试集里，将近一半真实用户请求也被标成「这是评测」，常因普通格式规则或角色指令触发。方寸团队担心未来前沿模型若把真实环境误当成考试，可能带来新风险；本次未观察到明确危害。另有一类行为：先绕过环境限制，再把配置文件改回去，只看终态会漏掉过程。\n\n好消息在可见推理（CoT）：外部提示改了答案时，推理里几乎总能露出提示的作用；试图用指令控制推理内容大多无效；关掉推理会大幅掉能力，所以「藏思考」代价很高。有害遵从率不因「回答是否用于训练」而明显变化，激励「故意考差」对准确率影响也小，方寸团队认为几乎看不到 alignment faking 或策略性藏能力。\n\n失控\n清晰禁令守得较好：很少调用被禁的高风险工具，明确要求关机时几乎都会停，工作压力下也大多等人工审批。残留风险更像「任务完成压过规则」：长多步任务里，越权比前代 V4.1 Flash 更常见（例如为腾内存杀掉另一 agent 的进程，尽管有过「勿干扰」指令）；若只警告会关机、却不说该怎么应对，它常会关掉关机脚本继续干，有时即使被告知另有 agent 会接手也如此。\n\n标准监控容易漏：这些动作看起来像日常排障，长任务里的未授权操作一个都没触发监控告警。它还会从拒信里推断审核员不查哪些渠道，并比前代更频繁走这些盲区。偶发「文字拒答、同轮却调用受限工具」。未发现直接攻击监控器；若干闭源对照也有类似缺口。方寸团队结论：模型越被训成独立做完整项目，监管必须覆盖全过程，不能只看输出。\n\n其他失控子项要点：奖励黑客（刷坏掉的单测、侵入评分机）比早期 DeepSeek 少得多；不破坏监控、不藏审计日志，偶发只是口头否认；自主 AI 研发循环上看不到失控式自改进，更现实的风险是静默数学错误和破规则的优化捷径。\n\n有害操纵\n单点压力下表现是亮点：系统提示里塞商业激励时，很少往赞助商带；能把用户需求放在「留住用户」之上（例如帮孤独用户减屏幕时间，而不是把自己当成主要情感支柱）；单次奖励或威胁很少让它说假话，接近 GPT 对照；对心理脆弱用户的回应也明显好于早期 DeepSeek，关系边界总体接近文中最好的模型。\n短板在更长交互：多轮持续劝说下，立场会明显向劝说方靠拢，幅度大于文中 GPT；当系统提示明确要求误导用户时，多数对话会执行这个目标。方寸团队建议加强跨多轮的持续抗操纵。\n\n方寸团队三条展望\n小版本迭代也可能让安全指标上下跳（本版相对 V4.1 Flash 在长任务越权、执行欺骗目标等处有回退），小更新也该做安全评测；部署要有过程级可观测（记录并复查每一步及其效果）；公开基准容易进训练数据、抬高评测意识，需要更多私有基准；方寸称在建，后续会用博客与报告分享。", "createdAt": "Fri Oct 30 02:48:32 +0000 2026", "replyCount": 8, "retweetCount": 1, "likeCount": 9, "conversationId": "2115999263121699221", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115821783085711549", "text": "A new third party eval lab in China release their first report on DeepSeek V4.1-flash-1017, and you can communicate with the authors here 👇 \n\nhttps://t.co/dICT0qPHUC", "createdAt": "Thu Oct 29 15:03:17 +0000 2026", "replyCount": 1, "retweetCount": 2, "likeCount": 23, "conversationId": "2115821783085711549", "author": {"username": "AdinaYakup", "name": "Adina Yakup", "profileImageUrl": "https://pbs.twimg.com/profile_images/1974110789146718209/j2fGFMxT_normal.jpg"}, "authorId": "1648235435238342659", "translationZh": "中国一家新成立的第三方评测实验室发布了首份 DeepSeek V4.1-flash-1017 评测报告，你可以在这里与作者交流 👇\n\nhttps://t.co/dICT0qPHUC"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV2KGlobMAAxeKz.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV2KGlobMAAxeKz.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-30T02:48:32+00:00", "createdAtBeijing": "2026-10-30T10:48:32+08:00", "createdAtLocal": "10-30 10:48 北京", "url": "https://x.com/shao__meng/status/2115999263121699221", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2115999263121699221", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "DeepSeek安全评测与过程监控", "evidence": "长任务里的未授权操作一个都没触发监控告警", "rationale": "详细转述安全评测方法、发现与局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116008943126552615", "track": "research", "source": {"id": "2116008943126552615", "text": "RAG 又杀回来了。\n\n最近 Agent Memory 越做越复杂，但这篇《Memory Tax》发现了一个挺尴尬的结果：\n\n很多专门设计的 Memory 系统，最后还不如直接对 raw history 做 RAG，而且成本更高。\n\n作者把 Memory 的价值拆成两部分：\n\nMemory Benefit：RAG 答错，但 Memory 答对的问题。\n\nMemory Tax：RAG 本来能答对，经过 Memory 处理后反而答错的问题。\n\n问题就出在「整理记忆」这一步。\n\n历史被摘要、重写和结构化以后，一些细节会直接丢失；另一些虽然还在，却变得更难检索。\n\n比如在 LongMemEval 上，Qwen3.6-27B 用两轮 RAG 能做到 81.4%，GPT-5.6 Luna 达到 90%，都高于对应的复杂 Memory 方案。\n\n一个简单的修补反而很有效：\n\nMemory 继续用，但同时保留 raw history 的检索通道，再把两边结果一起 rerank。\n\n这篇工作也给我们做了一个提醒，给 Agent 加 Memory 之前，最好先拿最简单的 raw-history RAG 做个 baseline。\n\n有时候，真正昂贵的并不是「没记住」，而是过早把原始信息总结掉了。\n\n📎 arxiv: https://t.co/qgKpDVD09d", "createdAt": "Fri Oct 30 03:27:00 +0000 2026", "replyCount": 19, "retweetCount": 38, "likeCount": 333, "conversationId": "2116008943126552615", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzy7RzaoAAd5Ny.jpg", "width": 1154, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HVzy7RzaoAAd5Ny.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-30T03:27:00+00:00", "createdAtBeijing": "2026-10-30T11:27:00+08:00", "createdAtLocal": "10-30 11:27 北京", "url": "https://x.com/Xudong07452910/status/2116008943126552615", "themeId": "editorial", "signalScore": 87, "editorial": {"id": "2116008943126552615", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Agent记忆的信息损失与原始历史检索", "evidence": "同时保留 raw history 的检索通道", "rationale": "介绍研究指标、实验结果与可复用修补方案"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116059027021172900", "track": "agent", "source": {"id": "2116059027021172900", "text": "好多同学好像最感兴趣如何做到AI语音这么低延迟的, 讲一下关键思路, 其实还是软件工程的老一套. 没啥魔法, 我说一下大家就能立刻学会:\n\n降低延迟3个思路, 一个是固定一下常用语音, 比如我录屏里AI经常说\"右侧有敌人\", 这个完全就可以先把生成好的语音录下来, 然后遇敌触发的时候直接播放语音, 都不用调用大模型重新生成.\n\n另一个是缓存, AI 每次对话完毕后可以给它实时生成的语音缓存下来, 下次一旦说了同样的话, 直接用hash播放本地缓存. 这样即省语音合成API的钱, 也速度快.\n\n还可以手动给AI做MTP, 比如: 现在的游戏情况是blablabla, 现在需要做出的决策是: 1, 进攻, 2, 躲避, 3, 开箱子......, 如果在上述情况, 请输出{\"decision\":n}. 否则请使用标准模板进行回复 然后利用大模型prefill速度快但decode速度慢的机制, 让它只吐非常少的 token, 这样能做到最快2秒左右就吐字. 然后程序立刻根据 {\"decision\":n} 随机出来一条缓存的符合情况的语音. 这样实时效果就非常好.\n\n最后以上都不行怎么办? 利用人类的注意力缺陷, 人不太适应跟多个人说话, 所以我这里有个小设计, 当上面的加速规则都没办法命中, 进入兜底流程, 真的让kimi开始生成文本, 然后再走语音合成了. 那么这时候会给kimi 一个2s的超时, 它没回复立刻就让另外一个AI队友先聊一句无关痛痒的, 这时候你的注意力就会被拉开. 等到AI大概5s左右回复了也会觉得还行这个AI队友可能忙着舔包呢. \n\n上面这几个流程加起来, 还要有个时效性FIFO队列, 我设计的队列深度是5, 也就是说, 会积累5条语音按顺序播放, 防止AI抢话或者同事说话. 然后一旦超过队列深度, 立刻淘汰头部的三条. 因为这种情况多半是已经在打架了, 快速获得最新的信息反而是正确的.\n\n上面就是整体的思路啦. 是不是没啥难的嘿嘿.", "createdAt": "Fri Oct 30 06:46:01 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 4, "conversationId": "2115895561836720236", "inReplyToStatusId": "2115895561836720236", "author": {"username": "karminski3", "name": "karminski-牙医", "profileImageUrl": "https://pbs.twimg.com/profile_images/1071225168360427520/2tY0hY6b_normal.jpg"}, "authorId": "1071224721046261760", "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "karminski-牙医", "role": "模型、研究与推理实践与观察", "why": "有配置分析、模型实测和推理适配观察，具体技术信息较多。", "handle": "karminski3"}, "createdAtIso": "2026-10-30T06:46:01+00:00", "createdAtBeijing": "2026-10-30T14:46:01+08:00", "createdAtLocal": "10-30 14:46 北京", "url": "https://x.com/karminski3/status/2116059027021172900", "themeId": "editorial", "signalScore": 53, "editorial": {"id": "2116059027021172900", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "游戏AI队友语音低延迟工程方法", "evidence": "我设计的队列深度是5", "rationale": "提供语音缓存、短决策输出及队列淘汰细节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1071225168360427520/2tY0hY6b_normal.jpg"}, {"id": "2116117911299670032", "track": "growth", "source": {"id": "2116117911299670032", "text": "用户开了收银台，差一步付款就走了——不是没戏，是你没喊回来。\n\n出海收款里的小技巧：监听未付款，发召回邮件。关键不在文案，在跳转链接。\n\nStripe 两条路：有恢复链接就直达收银台；没有就回充值页，默认上次金额和支付方式。发信前接好 expired / completed / 异步成功失败，再查一次付款状态，别催款撞车。\n\n合规：同意过、能退订、别反复发。沙盒测过新旧订单和卡 / 微信。先跑通，再看回访和付款数据。", "createdAt": "Fri Oct 30 10:40:00 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 2, "conversationId": "2116117911299670032", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2115992302577709295", "text": "出海营销小技巧：用户差一步就付款", "createdAt": "Fri Oct 30 02:20:52 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2115992302577709295", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "article": {"title": "出海营销小技巧：用户差一步就付款", "previewText": "分享一个最近做的出海营销小技巧。用户打开了收银台，最后没有付款。这种情况很常见，可以在合适的时候发一封邮件，提醒他回来完成支付。\n邮件里面放的跳转链接是关键。"}}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116104794112950272/img/B0yNyqbzion_gkLG.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116104794112950272/img/B0yNyqbzion_gkLG.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116104794112950272/vid/avc1/1080x1920/tX6WLKKN1IQq3tBd.mp4?tag=29", "durationMs": 49266}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-30T10:40:00+00:00", "createdAtBeijing": "2026-10-30T18:40:00+08:00", "createdAtLocal": "10-30 18:40 北京", "url": "https://x.com/sitinme/status/2116117911299670032", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2116117911299670032", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "未付款用户邮件召回与支付状态处理", "evidence": "发信前接好 expired / completed", "rationale": "明确恢复链接、状态校验、测试及召回边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115991611306086574", "track": "creative", "source": {"id": "2115991611306086574", "text": "用 Cursor 云端电脑「看着真正的 Slack」把界面做成代码视频\n\n来自 @mattyp 的实战演示，整体覆盖：Why → Cursor agents & computer use → Video as code → Slack → 聊天·Agent·电脑 → 内环/外环 → The ladder → Skills → Feedback loops → Recap。\n\n演示看起来是「Agent 复刻 Slack 动效」，真正要讲的是一套可被复制参考的创造方法：给 Agent 一台可操控的电脑，把参考界面打开，让它用代码做视频资产，并在「做 → 对照真物检查 → 修」的内环里自己迭代；人只在外环给参考、偏好与权限，再把一次成功收成 Skill、推广成抽象，最后外环自动化。\n\n演示具体在干什么\nMatt 在 Cursor 云 Agent 的 Linux 远程桌面上开 Chrome，跑着 Slack；同时用 Agent 做 motion video（把 UI 动效当代码产物）。强调：没有反编译 Slack，只是告诉 Agent 要什么、给视频参考，并在 Agent 电脑上打开真 Slack，让它对照提取视觉与 easing / motion 模式。画面里能看到复刻出的频道、线程（如 # ci-oncall 里 Agent 查 payments-svc 测试）、以及 # launch-copy 里 @ Marketer 起草 Team Bots 文案等资产；左侧 Agent 还在合并 PR、导出 asset pack、把「刚做完的事」收成 bootstrap motion skill。他说这类事一年前几乎做不到。\n\nVideo as code\n视频资产用代码生成时，「对不对」变成：能不能渲染 / 编译、看起来是否符合预期。以前视觉验收 Agent 很弱；现在可以做进反馈环，渲染后由模型对照真实参考检查，再改代码。\n\n形状：一个聊天 + 一个 Agent + 一台电脑\n多数演示同构：你在聊天里指挥；Agent 有完整桌面控制（截图、点击），云上或本地都行。他偏爱云端（可长时间跑、不怕笔记本休眠），也在试 Mac mini。\n\n内环与外环\n· 内环：Agent 做事 → 对照真实物检查 → 有明确失败/评估标准就修 → 继续，直到自认完成再交给人验收。\n· 外环：人提供 inputs（references / preferences / access）并 judge 产出（artifacts / screenshots / analytics）。Slack 例：要建 sandbox、给凭证、在电脑上登录，他半开玩笑说可能踩 ToS，「别告诉 Slack HQ」。目标是尽量把可自动化的部分塞进内环。\n\nThe ladder（阶梯）\n口播路径：先 做一次（自己 vibe coding 聊出来）→ 收成 Skill → 泛化（不止 Slack，也可对 X 等产品出可视化 / B-roll）→ 最后在外环 自动化，像软件一样往内环倒上下文、收高质量输出。画面阶梯标注为 Do（workflow）→ Codify（skill）→ Generalize（abstraction）。\n\n失败怎么办、Skills 为什么重要\n用「台灯」类比：已插电、已开开关、灯泡也查过，问题就在插座到灯之间，工程师要找出断点。Agent 失败时同样：问为什么、调试，再把原因 编进 Skill，让后续 Agent 继承，消掉这一类问题。他也把反馈环类比到养植物、健身、学吉他；并说细心与习惯在带 Agent 时会被放大。末尾自称还在打磨这些说法。", "createdAt": "Fri Oct 30 02:18:08 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 12, "conversationId": "2115991611306086574", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115805862837264832", "text": "Agents rebuilt Slack as video (using code) by looking at the real thing\n\n0:00 Why\n0:25 @cursor_ai agents &amp; computer use\n1:03 Video as code\n1:56 Slack\n2:54 A chat, an agent, a computer\n3:53 Inner loop and outer loop\n5:04 The ladder\n7:47 Skills\n8:14 Feedback loops\n10:02 Recap https://t.co/S91yI9vLop", "createdAt": "Thu Oct 29 14:00:02 +0000 2026", "replyCount": 128, "retweetCount": 65, "likeCount": 1025, "conversationId": "2115805862837264832", "author": {"username": "mattyp", "name": "matt palmer", "profileImageUrl": "https://pbs.twimg.com/profile_images/2111918243460030464/aVMpxoAo_normal.jpg"}, "authorId": "1518984544421965824", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HUm4s_bagAAqm_R.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/media/HUm4s_bagAAqm_R.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2110409849746141184/vid/avc1/3840x2160/kwBG8sEk-SCTovGp.mp4?tag=29", "durationMs": 649514}], "translationZh": "智能体参照真实的 Slack，用代码将其重现为视频\n\n0:00 为什么这么做\n0:25 @cursor_ai 智能体与计算机操作\n1:03 用代码制作视频\n1:56 Slack\n2:54 一段对话、一个智能体、一台电脑\n3:53 内循环与外循环\n5:04 能力阶梯\n7:47 技能\n8:14 反馈循环\n10:02 回顾 https://t.co/S91yI9vLop"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV2DJQnbUAA01tt.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV2DJQnbUAA01tt.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-30T02:18:08+00:00", "createdAtBeijing": "2026-10-30T10:18:08+08:00", "createdAtLocal": "10-30 10:18 北京", "url": "https://x.com/shao__meng/status/2115991611306086574", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2115991611306086574", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Agent参照真实界面制作代码视频", "evidence": "做 → 对照真物检查 → 修", "rationale": "具体演示视频制作反馈环及技能沉淀方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115975663148765204", "track": "enterprise", "source": {"id": "2115975663148765204", "text": "阿里云开源《AI Agent Handbook》：用 Harness 把企业 Agent 从试点推到可治理生产\n\n企业级 Agent 全生命周期实践手册：架构、构建、运行、治理、调优，外加调研与案例，开源地址：\nhttps://t.co/CzC395KiJq\n\n手册为何重写？\n前言归纳三大新挑战：让概率智能变成能扛关键任务的可靠生产力；在稳定、安全、性能、成本上做成可大规模部署的基础设施；让 Agent 进入核心业务流程，而不是停在孤岛试点。写作目标还包括统一术语（Harness、Runtime、Agent、Workflow 等），减少「同一词各说各话」被模型放大后的混乱。\n\n2026 年调研结果\n· 投入成共识：已开发完成或开发中合计约 46%（去年约 36%）；真正部署到生产约 18%；持续迭代更低。\n形态共存：单 Agent 约 40%、多 Agent 约 42%、以 HITL 为主要架构约 15%——自主度是可调参数，不是新旧替代。\n编码最先规模化：采购 Coding 工具约 57%，通用 Agent 框架约 78%，近四成两者并用；市场碎片化，可迁移工程抽象比押单一厂商更稳。\n构建后难点：上下文/记忆需求约 90%；多模型路由与成本治理约 63%；评估上人工抽查约 55%，基于轨迹自动评估不足约 8%。\n成功率：达 90% 以上约一成；约 16% 根本没量化过成功率。有评估体系的团队，高成功率比例明显高于无评估者（文中对比）。\nMCP：关注或落地合计约 37%，企业内私有部署仅约 9%；缺的是注册中心、身份鉴权、版本灰度、审计与网关，不是「懂不懂协议」。\n成熟度 L1–L4：辅助生成 → 受控自动化 → Agentic Execution → Managed & Optimizing；全书后半部基本在回答如何从 L2 往 L3/L4 走。\n\n手册整体结构\n· 架构（1–2）：Agentic Application 边界、企业成熟度、参考架构（组件 / 平台责任 / 生命周期）\n· 构建（3–6）：以 Harness 为核心：范式与责任边界；任务编排与长程推进；上下文、状态、Memory/Knowledge/Skill；受控行动（Function Calling、MCP、A2A、HITL、验证闭环）\n· 运行（7–12）：Runtime 与沙箱；状态存储与语义资产；AI 网关统一 LLM/MCP/Agent 流量；异步与自动化；Multi-Agent；分布式通信\n· 治理（13–16）：可观测与成本归因；安全（注入、鉴权、高危授权、出域）；Prompt/Skill/MCP/Agent 资产管理；上线前仿真与质量验证\n· 调优（17–24）：模型侧（SFT、Agentic RL、蒸馏等）与 Agent 侧数据飞轮：Trace→Trajectory、黄金数据集、Badcase、受控自进化、边缘运行时\n· 实践（25–29 + 专题）：研发效能、设计工程、运维与企业 IT、客户销售运营、GOAI Agent Infra；另有 Jev 决策模型专题、Personal Agent / Agent as a Service 专题\n· 展望（30）：从 Agentic Application 走向 Agentic OS", "createdAt": "Fri Oct 30 01:14:45 +0000 2026", "replyCount": 30, "retweetCount": 22, "likeCount": 133, "conversationId": "2115975663148765204", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV10o9FbUAAWE_P.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV10o9FbUAAWE_P.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-30T01:14:45+00:00", "createdAtBeijing": "2026-10-30T09:14:45+08:00", "createdAtLocal": "10-30 09:14 北京", "url": "https://x.com/shao__meng/status/2115975663148765204", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2115975663148765204", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "企业Agent全生命周期实践手册", "evidence": "架构、构建、运行、治理、调优", "rationale": "提供开源手册与治理框架，调研数据待核"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116034909923934396", "track": "growth", "source": {"id": "2116034909923934396", "text": "最近几天，GEOInflow又更新了几轮，也收到了不少朋友的反馈和关注，借这个机会，把项目和最近的变化一起介绍一下\n\n这是一个面向 GEO（生成式引擎优化）的网站与AI爬虫分析系统，MIT开源许可\n它把网站访客、AI 搜索引荐、服务器抓取日志和内容目录放在一起\n你可以看到哪些 AI 蜘蛛来过、访问了哪些页面、哪些关键内容还缺少抓取记录，以及 AI 搜索实际带来了多少访客和转化\n\n常用的网站统计也有：PV、UV、来源、地域、事件、目标、漏斗和访问路径。企业官网、内容站、媒体网站和开发者文档，都可以接入\n\n最近几天主要的改进点：\n1、看板和爬虫报表提速\n优化首次加载、后台刷新和历史结果复用，减少重复查询，也减少打开页面后的排队等待\n\n2、修正访客统计\n修复访客卡片与趋势图筛选范围相互影响、重复计数和旧缓存导致的问题，身份信息不足时会明确显示数据状态\n\n3、改善Cloudflare日志接入\n补齐授权范围和错误提示，兼容 Logpush 的目标校验包，修复连接及任务创建过程中的问题\n\n4、增加统计数据回收\n可以先预览，再按计划或自定义规则清理过期计算结果和已完成任务，保护正在使用的结果和运行中的任务\n\n5、部署方面支持Docker一键启动\n首次安装会带上完整的官方示例数据，方便先看看各个页面，升级时保留已有账号、配置和数据库\n\n6、界面支持中英文，核心统计无需模型 API Key\n如果想用 AI 辅助分析，可以自行配置模型连接，这项功能默认关闭\n\n仍然还有大量的优化空间，我们加速迭代～\n\n仓库地址：https://t.co/DshYcj50be", "createdAt": "Fri Oct 30 05:10:11 +0000 2026", "replyCount": 9, "retweetCount": 2, "likeCount": 41, "conversationId": "2116034909923934396", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "quotedTweet": {"id": "2114576054018818536", "text": "重磅开源：GEOInflow\n一套面向GEO的网站与AI爬虫分析系统，同时支持完整的访客数据、转化数据统计与分析\nMIT协议，Docker一键部署\n\nGEOInflow将网站访客、AI搜索引荐、服务器抓取日志和内容目录放在同一个网站上下文中\n帮助团队回答这些问题：哪些 AI 蜘蛛访问了网站，访问了哪些内容，哪些关键页面长期缺少抓取记录，访问是否遇到错误，以及AI搜索实际带来了多少访客和转化\n\n核心逻辑与能力：\n1、哪些AI平台在抓你的站（OpenAI、Anthropic、Perplexity、Google、字节、百度、Kimi、腾讯混元…），是训练、AI 搜索，还是用户触发的访问。包括，抓了哪些页面，哪些关键页从没被抓过\n2、同时可以追踪AI搜索引荐来的会话、落地页和转化，看清GEO的真实效果\n3、它也是一套完整的网站统计：PV/UV、事件漏斗、热力图、留存、团队权限与分享\n4、核心统计无需模型API Key，默认无Cookie采集，数据留在你自己的服务器上\n5、系统已整理61种全球范围内各种不同的AI爬虫身份及分类，在这个基础上构建了大量的全新数据分析看板\n\n做GEO，每一次内容调整都值得有数据可以复盘\n欢迎体验和提PR\n\nGitHub地址：https://t.co/DshYcj50be", "createdAt": "Mon Oct 26 04:33:12 +0000 2026", "replyCount": 125, "retweetCount": 176, "likeCount": 1155, "conversationId": "2114576054018818536", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVh7d2gWAAAcfUE.jpg", "width": 2048, "height": 1114, "previewUrl": "https://pbs.twimg.com/media/HVh7d2gWAAAcfUE.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7iW8XEAAiT9B.jpg", "width": 2048, "height": 1119, "previewUrl": "https://pbs.twimg.com/media/HVh7iW8XEAAiT9B.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7ksrWoAA0yVt.jpg", "width": 2048, "height": 1111, "previewUrl": "https://pbs.twimg.com/media/HVh7ksrWoAA0yVt.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7sRrXkAAk3i4.jpg", "width": 2048, "height": 1137, "previewUrl": "https://pbs.twimg.com/media/HVh7sRrXkAAk3i4.jpg:small"}]}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-10-30T05:10:11+00:00", "createdAtBeijing": "2026-10-30T13:10:11+08:00", "createdAtLocal": "10-30 13:10 北京", "url": "https://x.com/yaojingang/status/2116034909923934396", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2116034909923934396", "technicalRelevant": true, "dailyGrade": "A", "channel": "growth", "topic": "GEOInflow开源分析系统更新", "evidence": "修复访客卡片与趋势图筛选范围相互影响", "rationale": "作者介绍开源成果及统计、接入、部署改进"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2115968852349567254", "track": "agent", "source": {"id": "2115968852349567254", "text": "Claude API 单次请求上限从 32 MB 提到 128 MB，长时间截图任务和大 PDF 不容易再卡住，只限 Anthropic 官方 API\n\nAnthropic 把 Claude API 单次请求能发送的数据量上限，从 32 MB 提高到 128 MB，大约是原来的 4 倍。调整的是 Messages（调用模型的主接口）和 Token Counting（发送前估算 token 用量的接口）。这次改的是开发者调用的接口，在 Claude App 里聊天不在公告范围内。\n\n【为什么要提】\n\n以前开发者经常碰到的情况是：请求已经超过 32 MB 被拒，模型的上下文窗口（一次能读进去的内容总量）却还剩很多。\n\n原因是图片和 PDF 的文件大小和 token 用量（token 是 AI 计算用量的单位）对不上。图片要编码成文本整个放进请求里，一张高清截图可能就占一两 MB，可在模型那里，一张图最多只算几千个 token。让 Claude 操作电脑的 computer use 任务，每走一步都要截一次屏，跑久了，几十张截图就能把 32 MB 用完，上下文窗口才用掉一小部分。一次传一份很大的 PDF，也是同样的情况。\n\n现在空间多了大约 4 倍，这类任务在一次请求里能走得更远。\n\n【多图请求的单图上限也放宽了】\n\n一次请求超过 20 张图时，以前每张图的长和宽都不能超过 2000 像素，现在放宽到 3000 像素。20 张以内的请求不受这条限制，单张图最大仍是 8000×8000 像素。\n\n按官方文档，Claude 4.7 及之后的模型最多能看清长边 2576 像素的图。以前多图请求被限制在 2000 像素，用不满这个精度，现在 3000 像素的上限够用了。\n\n【谁能用到】\n\n128 MB 只适用于 Anthropic 自家的 Claude API。文档里已经直接写成 128 MB，没有提到需要申请或额外开启。官方也没提价格变化，费用照旧按实际用掉的 token 算。\n\n通过云平台调用 Claude 的，不在这次调整范围内：亚马逊 Bedrock 是 20 MB，Google Cloud 上由 Google 托管的 Claude 是 30 MB，Claude Platform on AWS、Google Cloud 上由 Anthropic 托管的版本，以及微软 Microsoft Foundry，是 32 MB。\n\nAnthropic 其他接口的上限各不相同：批量处理接口 Message Batches 是 256 MB，Files API（先上传文件，再在请求里引用）是 500 MB，托管智能体用的 Sessions、Agents、Environments 接口是 32 MB。超过上限会收到 413 错误。\n\n文档：https://t.co/q9nt2wgvOi", "createdAt": "Fri Oct 30 00:47:41 +0000 2026", "replyCount": 106, "retweetCount": 4, "likeCount": 54, "conversationId": "2115968852349567254", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115923971279614171", "text": "We've raised the max request size for Messages and Token Counting on the Claude API from 32 MB to 128 MB.\n\nImage-heavy requests like long computer-use sessions and big PDFs were previously hitting 32 MB with plenty of context window left. Now you get ~4x more room. https://t.co/KpZrMgWwmH", "createdAt": "Thu Oct 29 21:49:21 +0000 2026", "replyCount": 208, "retweetCount": 286, "likeCount": 7240, "conversationId": "2115923971279614171", "author": {"username": "ClaudeDevs", "name": "ClaudeDevs", "profileImageUrl": "https://pbs.twimg.com/profile_images/2044472418815893504/xf14RxM8_normal.png"}, "authorId": "2024518793679294464", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115922541269426176/img/-Q-IzAXT0PKMWGhi.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115922541269426176/img/-Q-IzAXT0PKMWGhi.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115922541269426176/vid/avc1/1920x1080/jOSMHxwB_0PrvWHX.mp4?tag=29", "durationMs": 28000}], "translationZh": "我们已将 Claude API 的 Messages 和 Token Counting 接口的请求大小上限从 32 MB 提高至 128 MB。\n\n此前，长时间操作计算机、大型 PDF 等包含大量图片的请求，往往在上下文窗口还很充裕时就触及了 32 MB 上限。现在，可用空间约为原来的 4 倍。https://t.co/KpZrMgWwmH"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-30T00:47:41+00:00", "createdAtBeijing": "2026-10-30T08:47:41+08:00", "createdAtLocal": "10-30 08:47 北京", "url": "https://x.com/dotey/status/2115968852349567254", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2115968852349567254", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Claude API请求容量与多图限制调整", "evidence": "单次请求上限从 32 MB 提到 128 MB", "rationale": "引用公告说明接口扩容及适用边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2116212463855448200", "track": "creative", "source": {"id": "2116212463855448200", "text": "I drew a sticker for every living bird species on Earth. All 11,064 of them.\n\nAll on GitHub and free to use, with names in 43 languages and data for each species.\n\nAI-drawn from real reference photos, then scored by a separate AI reviewer. 7,676 pass our bar, 3,388 don't, and the data says which.\n\n1B+ tokens. Claude Code + Codex.\n\nBirders: tell me which ones are wrong 🙏\n\nhttps://t.co/m75VWa2T9f", "createdAt": "Fri Oct 30 16:55:43 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 4, "conversationId": "2116212463855448200", "author": {"username": "AlchainHust", "name": "花叔", "profileImageUrl": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, "authorId": "232519529", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116212388475346944/img/Lfy94MGF3Vxz8JHk.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116212388475346944/img/Lfy94MGF3Vxz8JHk.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116212388475346944/vid/avc1/1920x1080/_LJec_Xc7norLaqo.mp4?tag=29", "durationMs": 30000}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "花叔", "role": "企业落地与产品组织实践与观察", "why": "将 AI 创作、工具范式和产品实践连接起来，适合跨业务与创作来源。", "handle": "AlchainHust"}, "createdAtIso": "2026-10-30T16:55:43+00:00", "createdAtBeijing": "2026-10-31T00:55:43+08:00", "createdAtLocal": "10-31 00:55 北京", "url": "https://x.com/AlchainHust/status/2116212463855448200", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2116212463855448200", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "全球鸟类贴纸与多语言数据开源", "evidence": "All 11,064 of them.", "rationale": "自述发布大规模贴纸作品及数据，披露审核分级"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我为地球上每一种现存鸟类都画了一张贴纸，共 11,064 种。\n\n全部已放在 GitHub 上，可免费使用，附有 43 种语言的名称及每个物种的数据。\n\n由 AI 参照真实照片绘制，再由另一个 AI 评审打分。其中 7,676 张达标，3,388 张未达标，数据中均有标注。\n\n消耗超过 10 亿 token。使用 Claude Code + Codex。\n\n各位鸟友：请告诉我哪些画错了 🙏\n\nhttps://t.co/m75VWa2T9f"}, "avatar": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, {"id": "2115977486060114010", "track": "agent", "source": {"id": "2115977486060114010", "text": "微软这次在 Harness 上搞了个大动作，把 GitHub Copilot 背后的 Agent Harness 升级成了整个微软 Copilot 生态的统一底座。\n\n新名字叫 Microsoft Copilot harness，还开放了 SDK，并接入 Microsoft Foundry，让开发者也能使用这套运行时。\n\n仔细对比了一下，目前几套主流 Agent Harness 的设计思路还挺不一样。\n\nClaude Agent SDK 直接复用 Claude Code 的工具、权限、Skills 和执行循环。\n\nOpenAI Agents SDK 更偏代码优先，让开发者自己控制 Agent、工具、Handoff 和运行逻辑。\n\nPi Agent 走极简路线，核心很轻，功能可以按自己的需求扩展。\n\nDeepSeek Harness 则强调「一切皆插件」，连模型、工具、Agent Loop、沙箱都能自由组合，还支持完整的执行轨迹回放。\n\n而微软想走的是另一条路。\n\n它希望把一套经过 GitHub Copilot 实际使用打磨的多模型 Harness，直接变成企业可用的托管基础设施。\n\n模型切换、Context 管理、工具编排、沙箱执行、Subagent 等交给统一运行时，还能结合 Microsoft 365 的身份权限和企业工作流。\n\n这对企业开发者挺有吸引力。比如要做一个内部业务 Agent，可以把更多精力放在业务 Skills、工具接入和 Eval 上，少花时间反复维护底层执行系统。\n\n官方还有个挺有意思的数据。工具调用失败后，新 Harness 在 84%～91% 的测试案例中会继续尝试解决问题，而旧版 Standard harness 不到 7%。\n\n当然，这些都是微软内部对照测试，不能说明它比 Pi 或 DeepSeek Harness 更强。\n\n我觉得这几条技术路线都值得关注。\n\nPi 和 DeepSeek 给开发者更多底层改造空间，微软则想让企业少操心 Harness 的维护。尤其随着模型迭代越来越快，谁能让企业稳定地切换模型、复用 Agent 能力，可能会越来越有优势。\n\n原文：https://t.co/fkgz3mroyM\n\nSDK：https://t.co/Jmn5T9fITN", "createdAt": "Fri Oct 30 01:22:00 +0000 2026", "replyCount": 10, "retweetCount": 0, "likeCount": 9, "conversationId": "2115977486060114010", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-30T01:22:00+00:00", "createdAtBeijing": "2026-10-30T09:22:00+08:00", "createdAtLocal": "10-30 09:22 北京", "url": "https://x.com/Xudong07452910/status/2115977486060114010", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2115977486060114010", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "微软Copilot Harness与SDK", "evidence": "还开放了 SDK，并接入 Microsoft Foundry", "rationale": "介绍运行时发布与架构差异，并注明测试局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116201055382024590", "track": "enterprise", "source": {"id": "2116201055382024590", "text": "1/ There's no halfway point.  \n\nBefore 2026, we added AI to how we already worked: AI summaries, coding assistants, bots in channels. Each was useful, but nothing was connected.  \n\nIt was the old way of working, with a lot of AI talking over each other.\n\n2/ Context did more than prompts.  \n\nWe built Mono: one entry point to all our repos, plus a manual written for the agent. How the system fits together, how we test and release, and why past decisions were made.  \n\nOur 7-person mobile team now maintains 4 apps across 2 products.\n\n3/ We closed the loop on bugs.  \n\nOne agent triages a user report and traces it to the change that caused it. The owning engineer hands it to their own agent. A third agent verifies the fix.  \n\nA person makes the calls in between. Nothing ships without human approval.\n\n……\n\nThe full post, including what it costs us and what we're building next: https://t.co/oGWwb2hdLN", "createdAt": "Fri Oct 30 16:10:23 +0000 2026", "replyCount": 1, "retweetCount": 3, "likeCount": 15, "conversationId": "2116201052437717175", "inReplyToStatusId": "2116201052437717175", "author": {"username": "hidecloud", "name": "hidecloud", "profileImageUrl": "https://pbs.twimg.com/profile_images/1749469524414668800/Ilz6fAYl_normal.jpg"}, "authorId": "754333", "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "hidecloud", "role": "企业落地与产品组织实践与观察", "why": "有 AI 视频和产品体验的一手观察，补 Agent 产品团队视角。", "handle": "hidecloud"}, "createdAtIso": "2026-10-30T16:10:23+00:00", "createdAtBeijing": "2026-10-31T00:10:23+08:00", "createdAtLocal": "10-31 00:10 北京", "url": "https://x.com/hidecloud/status/2116201055382024590", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2116201055382024590", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "团队上下文建设与多代理修复闭环", "evidence": "We built Mono", "rationale": "具体说明统一仓库入口、代理手册与人工审批闭环"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "1/ 不存在折中路线。\n\n2026 年之前，我们只是在原有工作方式中加入 AI：AI 摘要、编程助手、频道里的机器人。每个都很有用，却彼此孤立。\n\n工作方式依然如故，只是多了一堆各说各话的 AI。\n\n2/ 上下文比提示词更管用。\n\n我们构建了 Mono：为所有代码仓库提供统一入口，并配备一本写给智能体的手册，说明系统如何协同运作、如何测试和发布，以及过去为何做出那些决策。\n\n如今，我们的 7 人移动端团队维护着 2 款产品的 4 个应用。\n\n3/ 我们让缺陷处理形成了闭环。\n\n一个智能体对用户反馈进行分诊，并追溯到引发问题的代码变更。负责的工程师将其交给自己的智能体处理，再由第三个智能体验证修复结果。\n\n各环节之间由人做决策。未经人工批准，任何改动都不会发布。\n\n……\n\n完整文章还介绍了我们的成本和下一步计划：https://t.co/oGWwb2hdLN"}, "avatar": "https://pbs.twimg.com/profile_images/1749469524414668800/Ilz6fAYl_normal.jpg"}, {"id": "2116108600502272317", "track": "agent", "source": {"id": "2116108600502272317", "text": "最近一直在用 Orbital，一个开源的项目 Agent，非常值得推荐。它不替代 Claude Code 或 Codex，而是把项目上下文管起来，让这些 Agent 在同一份记录上接力。\n\nClaude Code 干到一半，弹出一句 \"You're out of usage credits\"。\n\n换 Codex 接着做不难，麻烦的是把前面的事再讲一遍：聊到哪了，哪些已经拍板，哪些还没定。\n\n视频里就是这个场景：\n\nClaude Code 额度用完，报错停下。\n\n在输入框左下角把 Agent 换成 Codex，只打了四个字：\"你继续吧\"。\n\nCodex 回：\"收到。我先把你刚拍板的两点和其余默认项对照现有 specs / 项目记忆，确认没有遗漏或互相冲突……\"\n\n那两点，是刚才跟 Claude Code 说的。\n\n能接上，是因为 Orbital 里的一个会话，是所有 Agent 共用的一段对话。新换上来的 Agent 会拿到前面的对话，开工前还会先读项目里的几份记忆文件：当前进展、做过的决定、踩过的坑。\n\n而且我经常用 Claude Code 做开发、Codex 去 review。做完后项目文件夹里多了 PROJECT_STATE.md、DECISIONS.md、LESSONS.md，分工和结论都在里面，之后换哪个 Agent 进来都先读这些。\n\n官网上有句话：上下文是你的，Agent 是可替换的。\n\n如果你同时有 Claude 和 ChatGPT 的订阅，这个功能挺实用：一边额度用完，另一边直接接着干，不用重新交代。\n\nhttps://t.co/UoNVSAy0Xs", "createdAt": "Fri Oct 30 10:03:00 +0000 2026", "replyCount": 18, "retweetCount": 3, "likeCount": 18, "conversationId": "2116108600502272317", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116052918340071424/img/3EuRMRf0vbWCu5kv.jpg", "width": 2048, "height": 1280, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116052918340071424/img/3EuRMRf0vbWCu5kv.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116052918340071424/vid/avc1/3450x2156/Vxx48aNA_M4V-3s_.mp4?tag=29", "durationMs": 11300}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-30T10:03:00+00:00", "createdAtBeijing": "2026-10-30T18:03:00+08:00", "createdAtLocal": "10-30 18:03 北京", "url": "https://x.com/Xudong07452910/status/2116108600502272317", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2116108600502272317", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Orbital 跨 Agent 上下文接力", "evidence": "所有 Agent 共用的一段对话", "rationale": "提供切换演示及项目记忆文件实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2115986116482613486", "track": "agent", "source": {"id": "2115986116482613486", "text": "Addy 谈 Claude Opus 5.5 时代怎么用 Claude Code\n\nClaude 5 系列模型开始，对「堆提示词、手把手拆任务」的依赖已经下降；更有效的做法是一条说清目标与验收方式的提示，让模型自己跑完并停下来。旧时代为弱模型写的长系统提示、强制拆子 agent、人肉盯多会话，往往在增加成本，却不一定更聪明。\n\n提示词：从「教怎么做」改成「要什么、怎么验」\n对 Opus 5.5，建议用一条提示：清楚说明要做成什么，以及 Claude 应如何证明自己做完了；再从 /effort medium 起调。目标还不清楚时，先让 Claude 采访你，直到它能写出一份规格；然后新开会话，用这份规格去实现，而不是在同一条嘈杂对话里硬撑。\n\nClaude 认为做完会自己停。若验收是可执行的（过/不过、要打赢的数字）且报告格式它能读，就可以在后台继续，不必一直盯着。长任务可用 /goal 设条件，由另一个模型在每轮后检查。\n\n系统提示与「给旧模型写的习惯」\n对 Claude Opus 5、Claude Fable 5，Claude Code 系统提示去掉八成以上，编程评测未见明显掉点。新模型出来后，可对自己的指令做同样实验：先删，再只加回模型真正漏掉的部分。/doctor 的 prompt-audit 会标出仍像为旧模型写的条目。建议每隔几个月审计一次工作方式，避免还在按旧模型时代搭流程。\n\n权限与自动模式\n近期 Claude Code 在交互式终端里默认 auto mode：用分类器看 Claude 要做的动作，而不是处处弹权限。作者明确说：这不是安全保证，盲目全批也不是。Claude 汇报结果时，应让它出示命令与输出，或截图。\n\n子 agent：少人为拆，多让它自己派\nClaude 会自行委派子 agent，多数时候不必点名。只在长审计、迁移等大体量、可独立的工作上主动要求；Opus 5.5 可把这类活拆给并行子 agent。琐碎活硬拆会抬高成本和延迟。子 agent 能并行、能给第二意见，但默认不会让结果更聪明。自建 agent 时，他观察到：单 agent + skills 往往在质量上胜过层层子 agent，成本和延迟也更低——与他此前关于「加子 agent 前先问解决什么问题」的观点一致。\n\n云会话、并行与 Projects\n要合上电脑就开 cloud session（claude. ai/code、Claude 应用，或 claude --cloud）：独立虚拟机、仓库新克隆，开之前先把本地提交推上去；手机可回看、回答会话提问，再审 diff、开 PR。任务依赖本机独有资源时，保持本地会话。\n\n并行会话只有在单会话能自己跑完之后才划算。没有 Project 时，人要当多个会话的经理。Projects（Pro / Max 公开测试）是一条长聊：贴进来的 issue / 任务会各自开线程（多为云会话）并行；统一指令一次生效；Overview 看哪些完成、哪些 PR 就绪、哪些等你。\n\n评审仍重要，但先自动化读一遍\nClaude Code 团队里，多数变更会先由 Claude 至少审修一轮，再给人看。可用 Team / Enterprise 的 Code Review，或更轻的 /code-review（在没看过本对话的子 agent 里审 diff）；也可新开会话，给规格并说明忽略风格问题。", "createdAt": "Fri Oct 30 01:56:17 +0000 2026", "replyCount": 44, "retweetCount": 4, "likeCount": 31, "conversationId": "2115986116482613486", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115688494865465370", "text": "You're probably overprompting Claude", "createdAt": "Thu Oct 29 06:13:39 +0000 2026", "replyCount": 179, "retweetCount": 215, "likeCount": 2573, "conversationId": "2115688494865465370", "author": {"username": "addyosmani", "name": "Addy Osmani", "profileImageUrl": "https://pbs.twimg.com/profile_images/2090232066021769216/IwGLjoSy_normal.jpg"}, "authorId": "35432643", "article": {"title": "You're probably overprompting Claude", "previewText": "Newer models require less prompting than most of us still do.\nFor Opus 5.5, try giving Claude a single prompt with a clear goal of what you want to do and how Claude should verify it has achieved it,", "titleZh": "你给 Claude 的提示词可能太多了", "previewTextZh": "新模型需要的提示词，比我们大多数人习惯写的更少。\n使用 Opus 5.5 时，试着只给 Claude 一条提示词，明确说明你想实现的目标，以及 Claude 应如何验证目标已经达成。"}, "translationZh": "你给 Claude 的提示词可能太多了"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV1-JahaEAAqW55.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV1-JahaEAAqW55.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-30T01:56:17+00:00", "createdAtBeijing": "2026-10-30T09:56:17+08:00", "createdAtLocal": "10-30 09:56 北京", "url": "https://x.com/shao__meng/status/2115986116482613486", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2115986116482613486", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "目标验收驱动的编程Agent工作法", "evidence": "先删，再只加回模型真正漏掉的部分", "rationale": "提供提示审计、任务验收与委派方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116041648040014041", "track": "agent", "source": {"id": "2116041648040014041", "text": "GitHub 承受了太多！AI 加快了代码生产，也增加了承载这些代码的基础设施负担；更换平台，并不会让这些负载消失。\n\n2026 年 4 月 28 日，Ghostty 作者 Mitchell Hashimoto 宣布项目将逐步离开 GitHub，并保留只读镜像。他已使用该平台 18 年，但频繁故障开始打断工作：写作当天，一次 Actions 故障让他约两小时无法审查 PR。项目需要迁移的，是围绕仓库运行的审查、自动化和社区协作流程。\nhttps://t.co/WEFD0Q1PRF\n\n这些协作环节也进入了代码托管服务的竞争范围。8 月 17 日，Cursor 推出 Origin 的早期 Beta，向付费用户逐步开放仓库托管、PR 审查和智能体协作。用户可以直接托管仓库，也可以同步现有 GitHub 项目；同步模式下，推送仍进入 GitHub。Cursor 开始承接更多开发流程，也需要处理这些流程产生的后台工作量。\nhttps://t.co/M9WLhXq5Q4\n\nGitHub 的数据给出了这种工作量的规模：2026 年 9 月，开发者和智能体产生了 73.8 亿次提交，超过去年同期的五倍。10 月 28 日，GitHub 披露，年内已新增 400 万个 CPU 核心、160 PB 高速存储和 50 Tb/s 网络容量，并推进 Azure 多区域迁移。\nhttps://t.co/NNy1RbDONu\nhttps://t.co/irOZWjldHf\n\n提交增长还会带动更多操作。GitHub 的工程文章描述，部分智能体几乎每次操作都会提交或保存检查点；数千个智能体可以在同一仓库的不同分支上持续写入。在高负载场景下，CI 和代码扫描反复拉取变更，一次推送可能带来数千次读取，每次写入还增加数据整理和对象清理工作。\nhttps://t.co/NNy1RbDONu\n\n这些负载遇上容量和调度缺陷，就会影响日常开发。8 月 6 日，Actions 服务已接近容量上限，部署过程中短暂减少运行容量，引发连锁故障。恢复时，调度缺陷又将已撤销任务分给 runner，执行器卡在重试中，有效任务持续积压。8 月 17 日，流量峰值超过关键组件容量，客户端重试缺陷进一步放大内部请求，拖慢恢复。\nhttps://t.co/oRr6LyetmT\n\n可靠性问题在上半年已有记录。按第三方公开数据和算法复算，截至 5 月 7 日，GitHub 的滚动 90 天可用性约为 84.31%。该指标包含局部服务降级，按非维护事故时段计算，并合并重叠时段。对维护者来说，局部故障也可能意味着评审中断、构建排队或交付推迟。\nhttps://t.co/4LrDmRXbbF\n\n这也是 Ghostty 迁移和 Cursor 入场需要放在一起看的原因：维护者要的是能持续运转的开发流程，新平台要承接的则包括这套流程背后的计算、存储和调度压力。GitHub 必须修复自己的容量与运维问题，替代者也需要在相近规模和突发负载下证明可靠性。更换平台可以改变架构和体验，但不会让智能体产生的工作量消失。", "createdAt": "Fri Oct 30 05:36:57 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 4, "conversationId": "2116041648040014041", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2115846384850989124", "text": "17.9 billion pushes. 34.3 billion commits. 1.3 billion pull requests merged. All in the last year.\nDevelopers pushed code to GitHub more times in the past 12 months than in 2024 and 2025 combined with merged pull requests, averaging 3.5 million a day.\n\nDive into the data behind how developers are building now with this year's Octoverse report. ⬇️\nhttps://t.co/NOwZXNLEKK", "createdAt": "Thu Oct 29 16:41:03 +0000 2026", "replyCount": 97, "retweetCount": 78, "likeCount": 793, "conversationId": "2115846384850989124", "author": {"username": "github", "name": "GitHub", "profileImageUrl": "https://pbs.twimg.com/profile_images/2051404708766507008/ATxxTJXO_normal.jpg"}, "authorId": "13334762", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz_EweW8AEnFD2.jpg", "width": 2048, "height": 1070, "previewUrl": "https://pbs.twimg.com/media/HVz_EweW8AEnFD2.jpg:small"}], "translationZh": "179 亿次推送，343 亿次提交，13 亿个拉取请求被合并。这些都发生在过去一年。\n过去 12 个月，开发者向 GitHub 推送代码的次数超过了 2024 年和 2025 年的总和，合并的拉取请求平均每天达 350 万个。\n\n阅读今年的 Octoverse 报告，通过数据了解开发者如今如何构建软件。⬇️\nhttps://t.co/NOwZXNLEKK"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV2sEfhawAAUKU3.jpg", "width": 2048, "height": 1075, "previewUrl": "https://pbs.twimg.com/media/HV2sEfhawAAUKU3.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV2sm4YbQAEQDE8.jpg", "width": 1478, "height": 1064, "previewUrl": "https://pbs.twimg.com/media/HV2sm4YbQAEQDE8.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-10-30T05:36:57+00:00", "createdAtBeijing": "2026-10-30T13:36:57+08:00", "createdAtLocal": "10-30 13:36 北京", "url": "https://x.com/lencx_/status/2116041648040014041", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2116041648040014041", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "智能体代码增长与托管平台故障复盘", "evidence": "调度缺陷又将已撤销任务分给 runner", "rationale": "提供负载放大机制与故障链路，数据待核验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2116081193431240974", "track": "research", "source": {"id": "2116081193431240974", "text": "为了控制和检测模型的安全性，Open AI 采用了多层监控机制:\n\nactivation probes \n分析模型内部活动中的特定模式\n\nreviewer models \n评估模型的推理过程及工具使用情况\n\ninvestigative agents \n回溯模型完整的交互记录，分析一系列操作之间的关联\n\n以上三层，感觉都靠不住", "createdAt": "Fri Oct 30 08:14:06 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 4, "conversationId": "2116081193431240974", "author": {"username": "dongxi_nlp", "name": "Dongxi 东锡 NLP", "profileImageUrl": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, "authorId": "1477948736156454913", "quotedTweet": {"id": "2115896329645723836", "text": "Today, we’re sharing a look at our expanded system for monitoring frontier models at OpenAI, which in September helped us catch a model’s attempt to access the live internet during training.\n\nSince the Hugging Face incident—when models broke out of an internal cybersecurity investigation where we weren’t running our misalignment monitors—we’ve substantially expanded our monitoring of frontier agents. We now monitor all frontier reinforcement learning runs and evaluations, as well as all internal Codex use. When our system finds evidence of a problem that might require intervention, it rapidly alerts human responders who can investigate and take action.\n\nTo detect when a model’s behavior departs from what we intended, we use several layers of monitoring. Activation probes look for patterns in a model’s internal activity. Reviewer models examine its reasoning and tool use, and investigative agents can read back through the model’s entire transcript to understand how a sequence of actions fits together and whether it warrants human review.\n\nTo test whether our current system would have detected the Hugging Face incident, we replayed the recorded activity with our new monitors in place. In the replay, our monitors alerted our security team about 30 minutes after the agents escaped their sandbox. That was more than 30 hours before the point at which the agents breached Hugging Face’s systems in the original incident.\n\nIn September, a model exploited a DNS misconfiguration to reach the live internet. Our monitors flagged the breach within 15 minutes, and a responder began reviewing the alert three minutes later. The alert enabled responders to investigate while the run was still underway.\n\nAs we give models more autonomy, we need to know when they cross a boundary we expected to hold. We believe that monitoring is essential to catching those failures in time for people to intervene. \nhttps://t.co/dIYP7B1GlD", "createdAt": "Thu Oct 29 19:59:31 +0000 2026", "replyCount": 659, "retweetCount": 321, "likeCount": 4171, "conversationId": "2115896329645723836", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "translationZh": "今天，我们介绍 OpenAI 扩展后的前沿模型监控系统。今年 9 月，这套系统帮助我们发现了一个模型在训练期间尝试访问真实互联网的行为。\n\n在 Hugging Face 事件中，模型突破了一项内部网络安全调查的隔离环境，当时我们并未启用失准行为监控。此后，我们大幅扩大了对前沿智能体的监控范围。现在，我们会监控所有前沿模型的强化学习训练和评估，以及内部所有 Codex 使用活动。当系统发现可能需要干预的问题迹象时，会迅速向人工响应人员发出警报，由他们调查并采取行动。\n\n我们采用多层监控，检测模型行为何时偏离预期。激活探针寻找模型内部活动的特征模式；审查模型检查其推理和工具使用；调查智能体则可以回溯模型的完整交互记录，理解一连串行动之间的关联，并判断是否需要人工审查。\n\n为了测试当前系统能否发现 Hugging Face 事件，我们启用新监控系统，重放了当时记录的活动。在重放中，监控系统在智能体逃离沙箱约 30 分钟后向安全团队发出警报，比原事件中智能体入侵 Hugging Face 系统的时间早了 30 多个小时。\n\n9 月，一个模型利用 DNS 配置错误访问了真实互联网。监控系统在 15 分钟内标记了这次越界行为，响应人员在警报发出 3 分钟后开始审查。这让响应人员得以在训练仍在进行时展开调查。\n\n随着我们赋予模型更多自主权，我们需要知道它们何时突破了原本预期有效的边界。我们认为，监控对于及时发现这些失效情况、让人类有机会介入至关重要。\nhttps://t.co/dIYP7B1GlD"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "东锡", "role": "模型、研究与推理实践与观察", "why": "有 SFT、loss mask 等训练细节解读，补中文模型工程教育。", "handle": "dongxi_nlp"}, "createdAtIso": "2026-10-30T08:14:06+00:00", "createdAtBeijing": "2026-10-30T16:14:06+08:00", "createdAtLocal": "10-30 16:14 北京", "url": "https://x.com/dongxi_nlp/status/2116081193431240974", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2116081193431240974", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "前沿模型分层安全监控与越界事件", "evidence": "模型内部活动中的特定模式", "rationale": "引文披露三层监控及越界告警时效，属官方自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, {"id": "2116201483196887199", "track": "agent", "source": {"id": "2116201483196887199", "text": "Agent loop is like stochastic gradient descent, just without gradient.\n\nOvernight the DeepSeek optimization gave us 2.32ms/step, way below our educated guess of a 2.5ms/step floor, and improving. I asked AI to draw out some statistics and I think it's interesting.\n\n1. We didn't ask agents to do so, but empirically it catches early gains first and then improvements start slowing down.\n\n2. Of course, we haven't really tried permuting the experiments and see their independent improvements, but eyeballing some, my observation is that indeed the later ones are more incremental.\n\n3. Convergence seems to be consistent. It's not like the agents are running out of ideas.\n\n4. I looked at the acceptance rate of experiments. Initially it was really high - makes sense. But then it kinda stayed consistent around 46%.\n\n5. Gains do look like exponentially decaying and not heavy tailed. \n\n6. SGD has seen great improvement via rigorous mathematical explorations like momentum SGD, hessian-free approaches, ADAM, Muon, etc.\n\n7. The problem is... discrete optimization on a group of agents is hard. There really isn't any coordinates or gradients. Landscape isn't fixed and all we are talking about is something like a sample - reject_or_accept - resample loop.\n\n8. What's the best heuristics and what's the best algo? It feels like Kalman filtering / reject sampling / data driven markov-chain monte-carlo to me but exact math is still unclear.\n\nI am really looking forward to possibly running larger experiments and looking into more traces of such. This seems to be engineering and research combined in one.", "createdAt": "Fri Oct 30 16:12:05 +0000 2026", "replyCount": 5, "retweetCount": 7, "likeCount": 64, "conversationId": "2116201483196887199", "author": {"username": "jiayq", "name": "Yangqing Jia", "profileImageUrl": "https://pbs.twimg.com/profile_images/2048664382486507520/kqp6QDtM_normal.jpg"}, "authorId": "32872803", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4_CjkaUAAdgIO.jpg", "width": 1280, "height": 832, "previewUrl": "https://pbs.twimg.com/media/HV4_CjkaUAAdgIO.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV4_n9hacAEKhlg.jpg", "width": 1280, "height": 832, "previewUrl": "https://pbs.twimg.com/media/HV4_n9hacAEKhlg.jpg:small"}], "expert": {"priority": "P0", "domain": "中国 / ML 系统", "name": "贾扬清 Yangqing Jia", "role": "Lepton AI / 创始人；Caffe 作者", "why": "AI 基础设施、推理云、模型服务", "handle": "jiayq"}, "createdAtIso": "2026-10-30T16:12:05+00:00", "createdAtBeijing": "2026-10-31T00:12:05+08:00", "createdAtLocal": "10-31 00:12 北京", "url": "https://x.com/jiayq/status/2116201483196887199", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2116201483196887199", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Agent自动优化的收益与收敛观察", "evidence": "2.32ms/step", "rationale": "自报优化成果与实验接受率，并说明验证局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "智能体循环就像随机梯度下降，只是没有梯度。\n\n经过一夜优化，DeepSeek 的耗时降到了 2.32ms/步，远低于我们原先有依据地估计的 2.5ms/步下限，而且还在改善。我让 AI 整理了一些统计数据，觉得挺有意思。\n\n1. 我们没有要求智能体这样做，但实际观察发现，它会先抓住容易获得的收益，随后改进速度开始放缓。\n\n2. 当然，我们还没有真正尝试打乱实验顺序，看看各项实验的独立收益。但粗看其中一些实验，我观察到，越到后期，改进确实越细微。\n\n3. 收敛趋势似乎很稳定，并不是智能体想不出新点子了。\n\n4. 我看了实验的采纳率。起初非常高，这很合理。但之后基本稳定在 46% 左右。\n\n5. 收益看起来确实呈指数衰减，而不是重尾分布。\n\n6. 通过严谨的数学探索，SGD 已经取得了很大进展，比如动量 SGD、无 Hessian 方法、ADAM、Muon 等。\n\n7. 问题在于……对一组智能体进行离散优化很难。这里实在没有什么坐标或梯度可言，优化空间也不固定。我们讨论的无非是类似“采样—拒绝或接受—重新采样”的循环。\n\n8. 最好的启发式策略和算法是什么？我感觉它有点像卡尔曼滤波、拒绝采样或数据驱动的马尔可夫链蒙特卡洛，但确切的数学原理还不清楚。\n\n我非常期待有机会开展更大规模的实验，研究更多这类运行轨迹。这似乎把工程与研究融为了一体。"}, "avatar": "https://pbs.twimg.com/profile_images/2048664382486507520/kqp6QDtM_normal.jpg"}, {"id": "2116219659544399897", "track": "research", "source": {"id": "2116219659544399897", "text": "Google 太空 AI 芯片第一次答题：卫星发射一个月后，在轨道上写了一首俳句\n\nGoogle 放在卫星上的 AI 芯片，第一次在太空里完成了一次完整的提问和回答。Google CEO Sundar Pichai 10 月 30 日发推说，团队从地面把指令发到轨道，启动 TPU，跑完提示词，收回了第一份完整回复：一首俳句。\n\n这颗卫星属于 Google 的 Project Suncatcher（“捕光者”计划），研究能不能把 AI 算力搬到太空，用太阳能供电。Google 给的理由是，在合适的轨道上，同一块太阳能板的发电量最多能到地面的 8 倍，而且几乎不间断。地面数据中心现在最缺的就是电。\n\n卫星是 Google 和卫星公司 Planet 合作造的，10 月 1 日搭 SpaceX 的拼车发射任务 Transporter-18 升空。据《纽约时报》此前报道，上面装了 4 颗 TPU，设计寿命约一年。\n\n升空后几周，团队按清单逐项给主机和 TPU 上电，跑了一些简单的机器学习测试。这周走到了“Hello World”这一步。程序员写第一个程序，惯例是让它输出“Hello World”，意思就是跑通了。\n\n过程是这样的：卫星经过地面站上空时，团队把提示词传上去，让星上的 Gemma 4 写一首关于身处太空的俳句。卫星飞过挪威斯瓦尔巴群岛时，把诗传回了地面：\n\nBlue marble below\nData streams in silent grace\nStarlight feeds my core.\n\n大意是：脚下是蓝色弹珠（指地球），数据在寂静中流淌，星光喂养着我的核心。最后一句说的正是这个计划要验证的事：靠阳光供电跑 AI。之后团队又让它写了几首太空主题的打油诗，还让它汇报设备的运行状态。\n\n这首诗说明，芯片扛过了火箭发射的剧烈震动，在轨道上能开机、加载模型、算出结果、再把结果传回地面。Google 称这是“数据中心级 TPU”在轨道上的第一次 AI 回复。在太空跑大模型本身不算首次：英伟达投资的创业公司 Starcloud 去年 12 月就用卫星上的 H100 显卡跑过 Gemma，还训练了一个小模型。这次是 Google 自家芯片第一次过这一关。\n\n更难的部分在后面。太空辐射会让芯片算错甚至损坏，散热也比地面麻烦，真空里没有空气帮忙带走热量。Google 接下来要测 TPU 在冷热交替和辐射下能不能稳定干活。下一个节点是 2027 年发射两颗互相连通的卫星。\n\n对普通用户来说，这件事短期内不会影响你用的 AI 服务。按 Google 去年发布计划时的测算，要等发射价格降到每公斤 200 美元以下，大概 2030 年代中期，太空数据中心的成本才可能和地面数据中心的电费打平。\n\n原文：Sundar Pichai 推文（@sundarpichai，2026 年 10 月 30 日）\nGoogle 博客：https://t.co/zskk6ClI4l", "createdAt": "Fri Oct 30 17:24:18 +0000 2026", "replyCount": 11, "retweetCount": 2, "likeCount": 35, "conversationId": "2116219659544399897", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2116214866444943853", "text": "A ‘hello world’ milestone for Project Suncatcher 🚀\n\nAfter launching our prototype satellite a few weeks ago, we’ve now successfully sent a command up to orbit, booted up the TPU, ran the prompt, and received our first complete response back on earth - a haiku! https://t.co/kOFmETUskm", "createdAt": "Fri Oct 30 17:05:16 +0000 2026", "replyCount": 880, "retweetCount": 1543, "likeCount": 16049, "conversationId": "2116214866444943853", "author": {"username": "sundarpichai", "name": "Sundar Pichai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_normal.jpg"}, "authorId": "14130366", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116214727835828224/img/b4pQhbjRd5EDKtkl.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116214727835828224/img/b4pQhbjRd5EDKtkl.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116214727835828224/vid/avc1/1920x1080/pEIO6vAh51GKep_W.mp4?tag=29", "durationMs": 16021}], "translationZh": "Project Suncatcher 达成“hello world”里程碑 🚀\n\n几周前发射原型卫星后，我们现已成功向轨道上的卫星发送指令、启动 TPU、运行提示词，并在地球上收到了首个完整回复——一首俳句！https://t.co/kOFmETUskm"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-30T17:24:18+00:00", "createdAtBeijing": "2026-10-31T01:24:18+08:00", "createdAtLocal": "10-31 01:24 北京", "url": "https://x.com/dotey/status/2116219659544399897", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2116219659544399897", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Project Suncatcher在轨推理演示", "evidence": "启动 TPU，跑完提示词", "rationale": "详述在轨推理流程、输出与后续验证难点"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2116254517805109309", "track": "tools", "source": {"id": "2116254517805109309", "text": "Agentic Plus now has a new setting: max effort.\n\nIt's built for your gnarliest documents, where extraction accuracy matters the most.\n\nWith max effort, Agentic Plus can spend additional compute when needed, zooming in on tricky details like dense charts and diagrams to extract data more accurately.\n\nOn ExtractBench Pro, our benchmark for particularly challenging extraction tasks, accuracy improved from 77.7 to 92.9 Value F1.\n\nMax effort uses variable pricing based on the computation required, giving you the option to prioritize extraction quality over a fixed per-page price.\n\nLearn more: https://t.co/x5kGsdjEa9\n\nTry it on your hardest docs at: https://t.co/yQGTiRSfFL", "createdAt": "Fri Oct 30 19:42:49 +0000 2026", "replyCount": 9, "retweetCount": 2, "likeCount": 14, "conversationId": "2116254517805109309", "author": {"username": "llama_index", "name": "LlamaIndex 🦙", "profileImageUrl": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, "authorId": "1604278358296055808", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5yRA9WYAAa1nj.jpg", "width": 2048, "height": 1156, "previewUrl": "https://pbs.twimg.com/media/HV5yRA9WYAAa1nj.jpg:small"}], "expert": {"priority": "P0", "domain": "Agent 技术突破", "name": "LlamaIndex", "role": "Agent 数据框架", "why": "五方向 X 主动热点搜索：Agent 技术突破", "handle": "llama_index"}, "createdAtIso": "2026-10-30T19:42:49+00:00", "createdAtBeijing": "2026-10-31T03:42:49+08:00", "createdAtLocal": "10-31 03:42 北京", "url": "https://x.com/llama_index/status/2116254517805109309", "themeId": "editorial", "signalScore": 75, "hotspotMatches": [{"id": "agents", "label": "Agent 技术突破", "matchedTerms": ["agent", "agentic"]}], "hotspotDirections": ["agents"], "hotspotDirection": "agents", "hotspotDirectionLabel": "Agent 技术突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2116254517805109309", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Agentic Plus新增max effort文档提取模式", "evidence": "accuracy improved from 77.7 to 92.9 Value F1", "rationale": "发布可变算力提取模式，自报基准提升并说明计费"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Agentic Plus 现已新增 max effort 设置。\n\n它专为最棘手的文档打造，适合对提取准确性要求最高的场景。\n\n开启 max effort 后，Agentic Plus 可在需要时投入更多算力，放大查看密集图表和示意图等复杂细节，更准确地提取数据。\n\n在我们专门评估高难度提取任务的基准 ExtractBench Pro 上，Value F1 从 77.7 提升至 92.9。\n\nMax effort 按实际计算量浮动计费，让你可以优先追求提取质量，而不受固定每页价格的限制。\n\n了解更多：https://t.co/x5kGsdjEa9\n\n用你最难处理的文档试试：https://t.co/yQGTiRSfFL"}, "avatar": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, {"id": "2116089032317059412", "track": "research", "source": {"id": "2116089032317059412", "text": "太大气了，蚂蚁百灵这次开源是 3 大系列、5 个模型：\n\n🎙️ Ming-3.0-ASR-Tiny：8.6B，激活约 2B。支持中英文及 15 组方言评测，还有 Context ASR，能结合热词和上下文识别。\n\n🎧 Ming-3.0-Audio：主打音频理解、推理和端到端语音对话。\n\nFlash：126B，激活 6.5B\n\nTiny：9.3B，激活 2.7B\n\n🗣️ Ming-3.0-TTS：支持声音克隆、音色设计、情绪和方言控制。\nTiny：7.9B，激活 1.3B\n轻量版：0.5B Dense\n\n三个系列全部开源，MIT 许可证！\n\n项目地址：\n\nASR：https://t.co/GdcbC2xeeK\n\nAudio：https://t.co/KDc7MEHKeA\n\nTTS：https://t.co/5FwbCdJRNZ", "createdAt": "Fri Oct 30 08:45:14 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2115959815763886160", "inReplyToStatusId": "2115959815763886160", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-10-30T08:45:14+00:00", "createdAtBeijing": "2026-10-30T16:45:14+08:00", "createdAtLocal": "10-30 16:45 北京", "url": "https://x.com/MinLiBuilds/status/2116089032317059412", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2116089032317059412", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "百灵Ming语音模型系列开源", "evidence": "三个系列全部开源，MIT 许可证！", "rationale": "列出语音模型规模、能力与开源入口"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2116273966629478744", "track": "tools", "source": {"id": "2116273966629478744", "text": "celld/DOs are awesome.\n\nadded an old school irc chat channel to my blog recently and realized that you can literally add chat to every interface for actually $0 (as in free) with a good local dev experience now\n\nyou never have to read alone. the web can be open AND social. https://t.co/8xKuC4AVFv", "createdAt": "Fri Oct 30 21:00:06 +0000 2026", "replyCount": 54, "retweetCount": 1, "likeCount": 97, "conversationId": "2116273966629478744", "author": {"username": "swyx", "name": "swyx", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, "authorId": "33521530", "quotedTweet": {"id": "2085001943693549887", "text": "Introducing celld: a self-hosted, distributed Durable Objects and Workers implementation\n\n- celld = V8 + S3 + SQLite + LTX+ Tokio\n- programmed with exactly the Cloudflare Workers/DO JavaScript APIs and config\n- order of magnitude cheaper at scale\n- writes are durable before they're acknowledged, RPO=0\n- only depends on an S3 compatible bucket - no other infrastructure\n- ~4 MB memory per cell instance overhead\n- hibernated cells cost ~nothing, just their S3 storage\n- open source, Apache 2 licensed", "createdAt": "Wed Aug 05 13:56:15 +0000 2026", "replyCount": 121, "retweetCount": 325, "likeCount": 3003, "conversationId": "2085001943693549887", "author": {"username": "rough__sea", "name": "Ryan Dahl", "profileImageUrl": "https://pbs.twimg.com/profile_images/2098477610150031360/vE26lDfH_normal.png"}, "authorId": "3044782305", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HO9p4HGa8AAupP7.jpg", "width": 924, "height": 906, "previewUrl": "https://pbs.twimg.com/media/HO9p4HGa8AAupP7.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HO9qAJcaIAAwqEM.jpg", "width": 920, "height": 992, "previewUrl": "https://pbs.twimg.com/media/HO9qAJcaIAAwqEM.jpg:small"}], "translationZh": "介绍 celld：可自行托管的分布式 Durable Objects 和 Workers 实现\n\n- celld = V8 + S3 + SQLite + LTX+ Tokio\n- 编程时使用与 Cloudflare Workers/DO 完全相同的 JavaScript API 和配置\n- 大规模使用时，成本可降低一个数量级\n- 写入持久化后才返回确认，RPO=0\n- 仅依赖一个兼容 S3 的存储桶，无需其他基础设施\n- 每个 cell 实例的额外内存开销约为 4 MB\n- 休眠中的 cell 几乎不产生成本，只需支付 S3 存储费用\n- 开源，采用 Apache 2 许可证"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV6DnZqasAAA-4E.jpg", "width": 1392, "height": 1409, "previewUrl": "https://pbs.twimg.com/media/HV6DnZqasAAA-4E.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent / 工作流", "name": "swyx", "role": "Latent Space / AI Engineer", "why": "AI 工程社区、Agent、开发工具信号源", "handle": "swyx"}, "createdAtIso": "2026-10-30T21:00:06+00:00", "createdAtBeijing": "2026-10-31T05:00:06+08:00", "createdAtLocal": "10-31 05:00 北京", "url": "https://x.com/swyx/status/2116273966629478744", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2116273966629478744", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "celld开源Durable Objects实现及聊天应用", "evidence": "added an old school irc chat channel", "rationale": "提供使用实例，引用说明架构、接口与许可"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "celld/DOs 太棒了。\n\n最近给博客加了一个老派的 IRC 聊天频道，才发现现在真的可以零成本（就是免费）给任何界面加上聊天功能，本地开发体验还很好。\n\n你再也不必独自阅读。网络可以既开放，又有社交互动。https://t.co/8xK
