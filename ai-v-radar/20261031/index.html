topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2116185803433071061", "track": "agent", "source": {"id": "2116185803433071061", "text": "@amasad This was not an official Claude Code extension. It was a tampered copy of the Claude Code extension, which we didn’t build or publish. See here: https://t.co/VH3RAYdHG0", "createdAt": "Fri Oct 30 15:09:47 +0000 2026", "replyCount": 6, "retweetCount": 2, "likeCount": 140, "conversationId": "2116170090991484947", "inReplyToStatusId": "2116170090991484947", "author": {"username": "alexalbert__", "name": "Alex Albert", "profileImageUrl": "https://pbs.twimg.com/profile_images/1856486626072915968/JEQpB9CW_normal.jpg"}, "authorId": "1380719534970040322", "quotedTweet": {"id": "2116170451466543578", "text": "We’re working with Cursor on this incident, but it wasn’t a compromise of Anthropic’s systems or employee laptops. A malicious actor used access to Cursor’s marketplace to publish a tampered copy of the Claude Code extension, which we didn’t build or publish. The versions on our official channels are not affected and this only impacts Cursor users.", "createdAt": "Fri Oct 30 14:08:46 +0000 2026", "replyCount": 47, "retweetCount": 38, "likeCount": 669, "conversationId": "2116170451466543578", "author": {"username": "felixrieseberg", "name": "Felix Rieseberg", "profileImageUrl": "https://pbs.twimg.com/profile_images/1544558915819487233/qMrauBqx_normal.jpg"}, "authorId": "28576494", "translationZh": "我们正在与 Cursor 合作处理此次事件，但 Anthropic 的系统和员工笔记本电脑并未遭到入侵。攻击者利用对 Cursor 扩展市场的访问权限，发布了遭到篡改的 Claude Code 扩展副本，并非由我们开发或发布。官方渠道的版本不受影响，此事仅影响 Cursor 用户。"}, "expert": {"priority": "P0", "domain": "Claude / Anthropic KOL", "name": "Alex Albert", "role": "Anthropic / Claude 开发者关系与产品传播", "why": "Claude、MCP、开发者生态和模型使用方式的一线信号源", "handle": "alexalbert__"}, "createdAtIso": "2026-10-30T15:09:47+00:00", "createdAtBeijing": "2026-10-30T23:09:47+08:00", "createdAtLocal": "10-30 23:09 北京", "url": "https://x.com/alexalbert__/status/2116185803433071061", "themeId": "editorial", "signalScore": 89, "editorial": {"id": "2116185803433071061", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Cursor市场扩展篡改事件说明", "evidence": "publish a tampered copy", "rationale": "当事方说明攻击入口及影响范围，未经独立证实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "@amasad 这不是官方的 Claude Code 扩展，而是遭到篡改的 Claude Code 扩展副本，并非由我们开发或发布。详情见：https://t.co/VH3RAYdHG0"}, "avatar": "https://pbs.twimg.com/profile_images/1856486626072915968/JEQpB9CW_normal.jpg"}, {"id": "2116026448234332315", "track": "agent", "source": {"id": "2116026448234332315", "text": "如果我理解的没错的话，当前 Claude Code 在压缩后继续任务，会按需从历史会话中查找有用的信息加载到上下文。\n\n这和作者所说的新开一个会话再去从原来的会话加载有用信息不是一回事吗？唯一的差别就是多了一点摘要信息，但这多不了多少 Token。\n\n而且就算你新开一个会话，任务继续同样会很快填满上下文。", "createdAt": "Fri Oct 30 04:36:33 +0000 2026", "replyCount": 92, "retweetCount": 3, "likeCount": 69, "conversationId": "2116026448234332315", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115842962521509968", "text": "Compaction is a mistake.\n\nWhen an agent's context fills up, tools like Codex and Claude Code compact it:\n1. The model prefills the entire session again\n2. It writes a summary of everything so far\n3. A new session starts from that summary\n\nI measured this on a real ~400k-token session with Opus 5.5:\n→ 38 s and $1.99 when the prompt cache has expired\n→ 29 s and $0.17 when it hasn't\n\nAnd the summary is lossy. The exact error message, the file path, the one number you needed is often gone.\n\nSo I do something new for Mainplane\n\nContext retrieval works the other way around. Mainplane keeps the full record of every session as a file. When the context fills up, a new session starts right away with one instruction: \"You are continuing session X. Retrieve key context from it as you go.\"\n\nThe agent searches the old session and copies the exact lines it needs, when it needs them.\n\nSame session, same model: 15 s and $0.10 to get back to work. It does not depend on a cache hit, and nothing is paraphrased.\n\nThis is the bitter lesson applied to agent memory. Don't hand-design what the model should remember. Give it the full record and good tools, and let it decide.\n\nMainplane is open source (MIT). Link in the first comment.", "createdAt": "Thu Oct 29 16:27:27 +0000 2026", "replyCount": 248, "retweetCount": 107, "likeCount": 2697, "conversationId": "2115842962521509968", "author": {"username": "Alezander9", "name": "Alexander Yue", "profileImageUrl": "https://pbs.twimg.com/profile_images/2026482264926994432/EeLjqO3E_normal.png"}, "authorId": "885227214882562049", "translationZh": "上下文压缩是个错误。\n\n当智能体的上下文被填满时，Codex 和 Claude Code 等工具会对其进行压缩：\n1. 模型重新对整个会话进行预填充\n2. 为此前的所有内容撰写摘要\n3. 根据这份摘要开启新会话\n\n我用 Opus 5.5 在一个约 40 万 token 的真实会话中做了测量：\n→ 提示词缓存过期时，耗时 38 秒，费用 1.99 美元\n→ 缓存未过期时，耗时 29 秒，费用 0.17 美元\n\n而且摘要会丢失信息。确切的报错、文件路径，或你需要的那个数字，往往就这么没了。\n\n所以，我为 Mainplane 尝试了一种新做法。\n\n上下文检索的思路恰好相反。Mainplane 将每次会话的完整记录保存为文件。当上下文被填满时，立即开启新会话，只附上一条指令：“你正在继续会话 X。请在推进过程中，按需从中检索关键上下文。”\n\n智能体会搜索旧会话，在需要时复制所需的原文。\n\n同一个会话，同一个模型：只需 15 秒、0.10 美元，就能恢复工作。它不依赖缓存命中，也不会改写任何内容。\n\n这就是将“苦涩的教训”应用于智能体记忆。不要人为设计模型该记住什么。把完整记录和好用的工具交给它，让它自己决定。\n\nMainplane 已开源，采用 MIT 许可证。链接在第一条评论中。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-30T04:36:33+00:00", "createdAtBeijing": "2026-10-30T12:36:33+08:00", "createdAtLocal": "10-30 12:36 北京", "url": "https://x.com/dotey/status/2116026448234332315", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2116026448234332315", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "会话压缩与按需历史检索", "evidence": "Mainplane is open source (MIT).", "rationale": "含开源方案、作者自报对比测量及机制讨论"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2116132526725144604", "track": "agent", "source": {"id": "2116132526725144604", "text": "此外，context/memory 绝不仅仅是 retrieval based\n\n它应该是和 harness 非常紧密有机结合的，比如在适当的时机做一些特别的上下文注入\n\n这也是为什么我们很难用一个 retrieval based memory benchmark 反应真实世界 context/memory engineering 的好坏 https://t.co/Pr3pJrU07s", "createdAt": "Fri Oct 30 11:38:04 +0000 2026", "replyCount": 0, "retweetCount": 1, "likeCount": 10, "conversationId": "2116132526725144604", "author": {"username": "wey_gu", "name": "Wey Gu 古思为", "profileImageUrl": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}, "authorId": "24313912", "quotedTweet": {"id": "2116130815872753829", "text": "Nowledge Mem 从 day 1 就做 threads 的 bm25 索引\n\n在 Mem 内部，我们把把 raw context 叫做 trace，trace 蒸馏获得 memory unit，memory 会再做 extraction 和 crystalization\n\nraw context 被用来渐进式获取\n\nmemory unit 和之上的各种形式都是被小心处理维护的，使得某些主题被聚类、关联、维护，这些工作像是对 raw context 做智能参与的梳理和索引和缓存，让上下文在 fast path 被消费的时候有就有效的脉络和全貌，如果需要（agentic 或者 programic），我们可以随时回溯、渐进式去读取原始的上下文（不只有 threads，还有 artifacts/sources）", "createdAt": "Fri Oct 30 11:31:16 +0000 2026", "replyCount": 3, "retweetCount": 5, "likeCount": 42, "conversationId": "2116130815872753829", "author": {"username": "wey_gu", "name": "Wey Gu 古思为", "profileImageUrl": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}, "authorId": "24313912", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4Aio4a0AAKgN4.jpg", "width": 2048, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HV4Aio4a0AAKgN4.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4CuBFbYAAf0xi.jpg", "width": 2048, "height": 1147, "previewUrl": "https://pbs.twimg.com/media/HV4CuBFbYAAf0xi.jpg:small"}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "Wey Gu 古思为", "role": "模型、研究与推理实践与观察", "why": "Agent 跨机器会话、记忆及设备体验具有应用价值，可补当前覆盖。", "handle": "wey_gu"}, "createdAtIso": "2026-10-30T11:38:04+00:00", "createdAtBeijing": "2026-10-30T19:38:04+08:00", "createdAtLocal": "10-30 19:38 北京", "url": "https://x.com/wey_gu/status/2116132526725144604", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2116132526725144604", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "记忆分层与渐进式上下文读取", "evidence": "trace 蒸馏获得 memory unit", "rationale": "具体说明索引、蒸馏、聚类与原始上下文回溯机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}, {"id": "2116075904610787816", "track": "agent", "source": {"id": "2116075904610787816", "text": "非常实用，学习并推荐给大家👍", "createdAt": "Fri Oct 30 07:53:05 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 6, "conversationId": "2116075904610787816", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "quotedTweet": {"id": "2115366100221501540", "text": "假如把我的 AI Coding 经验沉淀成一些最佳实践规则，可以给到大伙复用，会是怎么样的，于是乎，今天一下午我就在琢磨这个事情，手写反复调整后给到大伙，可以让你和你的 Agent 一起去学习。\n\n需求\n1.  从技术实现细节编程转变成许愿式编程，现在模型能力已经住足够强大，你只需要大胆把自己想法说出来，给它提足够高的要求和任务，不要担心 AI 实现不了。\n2. 多给你的 Agent  讲做这件事情的背景和目标，少替他考虑技术细节，告诉它为什么要做，是给谁用的，做成什么样子你认为是最好的，具体的技术细节让它自己去判断，学会放手。\n3. 优先用业界最好的模型，用差模型浪费的时候，一来回让你很不高兴的干活，二来也浪费了很多时间。\n4. 要不要做一个新功能以及加一个新配置、开关的时候，让 Agent 来先问你找你确定，没有人用的功能、开关、文案都不要让他去加，慢慢把这一套你的产品规范让他沉淀起来。\n5. 你的想法可以很大，但是让 Agent 干活的时候，尽量让他每次拆分成最小的可用功能版本，不要一次写非常多的代码，即使提交，这样出问题了你可以随时撤回。\n\n规则                                                                                                                                                            \n6. 让你的 Agent 了解你的说话风格，比如说看看、分析一下这个问题的时候，它只需要去读代码分析问题不要去改代码，你说修复、修改的时候才去动手，每次提交、发布和删除的时候都找你确定。                                                                        \n7. Agent md、CLAUDE md 里面除去重点的项目型要求外，只写代码里面看不出来的那种规则，以及之前被否决过的方案也可以分流进去。对你而言密钥和 token 不要贴给 Agent，贴了就当已经泄露了，立马去更换一个。\n8. 对于Agent必须遵守的规则不要完全信 prompt，可能会拦不住，一定要用规则脚本去限制，让它真实跑一遍通过后才算完成了。\n\n编码\n9. 开始写代码之前，先让 Agent 讲清楚要改什么地方，会影响到什么功能和效果，这样是为了补充你的上下文，方便后面更好判断决策做什么。\n10. 一定要让 Agent 基于项目补充一个能够让自己验证各种结果的脚本，每次特定的时候需要去跑一下验证效果，完成功能后需要检查，让他输出结果给你看，并基于此逐步沉淀你的项目 Agent 测试功能集。\n11. 假如有多个 Agent 同时干活的时候，让他们各自用一份独立的 worktree 代码目录，同时提交的时候只提交自己改的代码，不要碰他人的代码，等到各自改完合到一起，再完整跑一遍测试。\n                                                                                                                                                                                                                                                                                                          \n排查\n12. 修 Bug 的时候先找到原因再去动手，假如两次都没有修好，就去加一些日志看真实的数据以及运行效果，不要盲目去猜问题在哪儿。\n13. 假如尝试修复了3次还不对，直接清空上下文重新写清楚你的问题、诉求，以及尝试过的解法让 Agent 重新开始。                                                        \n\n审查                                                                                                                                                     \n14. 让写代码的 Agent 和 Review 审查代码的 Agent 分开，保持解耦，这样一方不会被另一方带偏。\n15. Review 代码的时候最多让 Agent 跑 3轮，防止跑着停不下来，第二轮开始只看新改动的地方，不要再把之前 Review 的再看一遍。                                                                                                                   \n16. 对于你和 Agent 判断危险的改动，越危险让他查得越深，特别对于删除、付费、发布这种单向门改动你都需要自己去看一遍，点一下，看实际效果。                                                                                                                                                                           \n\n发布\n17. 每次提交的时候，让Agent 写清楚做了什么，怎么去验证这个改动，除了问题怎么来回滚，用于给到后面开发过程中 git 记录本身就是 Agent 的一个非常好的上下文。\n18. 需要对外的功能，可以先给自己用，或者给一批愿意尝鲜的用户使用，不要一上来就全量，可以在你的软件里面假如 beta 更新的开关，防止全量有问题，也是对用户负责。\n18. 先给自己和愿意尝鲜的人用，没问题再发给所有人。                                                                                                              \n\n复盘\n19.  Agent 需要对每一个线上 Bug 和用户反馈的问题都留一个测试案例，每次上线前都来跑一遍，防止继续踩坑，包括你换模型的时候也可以把这些旧问题全部都跑一遍，看看模型是否还行。\n20. 修复问题的时候，让 Agent 学会举一反三，把同类的问题一起修复掉。优化功能的功能，完善视觉的时候也是一样，防止只改一个地方，忘记了其他的地方。", "createdAt": "Wed Oct 28 08:52:34 +0000 2026", "replyCount": 115, "retweetCount": 185, "likeCount": 1482, "conversationId": "2115366100221501540", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVtKM1rboAA_Ztw.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVtKM1rboAA_Ztw.jpg:small"}]}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-10-30T07:53:05+00:00", "createdAtBeijing": "2026-10-30T15:53:05+08:00", "createdAtLocal": "10-30 15:53 北京", "url": "https://x.com/yaojingang/status/2116075904610787816", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2116075904610787816", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AI编程协作与验证规范", "evidence": "一定要用规则脚本去限制", "rationale": "引用提供需求拆分、验证、审查及回归方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2116190304839872897", "track": "tools", "source": {"id": "2116190304839872897", "text": "When you ingest a live firehose like Bluesky Jetstream, you rarely know every JSON field you'll want to group by ahead of time.\n\nIn one of ScopeDB's guides, we ingest the live stream with the Go SDK: promote 6 envelope fields and keep the full upstream JSON in the \"raw\" object column.\n\nAfter 340K+ live events, we wanted to see whether the most active accounts were real users or bots, while the relevant \"did\" attribute was never extracted into its own column (see the query picture below).\n\nThe top results immediately expose automation patterns in the firehose: one account emitted 1,619 follows and 0 posts; another emitted 1,295 likes and 0 follows; another did 600 unfollows in a single burst.\n\nNo schema migration, no backfill—just query the JSON path directly.", "createdAt": "Fri Oct 30 15:27:40 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2116190304839872897", "author": {"username": "tison1096", "name": "tison", "profileImageUrl": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, "authorId": "740784709878288384", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV42g45aEAATxb5.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HV42g45aEAATxb5.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV42idzbMAELuee.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HV42idzbMAELuee.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "tison（陈梓立）", "role": "Agent 与开发工具实践与观察", "why": "公开 Agent 参与版本变更确认、验收和测试治理，企业工程价值具体。", "handle": "tison1096"}, "createdAtIso": "2026-10-30T15:27:40+00:00", "createdAtBeijing": "2026-10-30T23:27:40+08:00", "createdAtLocal": "10-30 23:27 北京", "url": "https://x.com/tison1096/status/2116190304839872897", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2116190304839872897", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "保留原始 JSON 支持流数据事后分析", "evidence": "No schema migration, no backfill", "rationale": "结合采集结构与事件数据说明直接查询方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "接入 Bluesky Jetstream 这样的实时海量数据流时，你很难提前知道之后会按哪些 JSON 字段分组。\n\n在 ScopeDB 的一篇指南中，我们使用 Go SDK 接入实时数据流：将 6 个外层字段提取为独立列，并将上游的完整 JSON 保存在 \"raw\" 对象列中。\n\n接收了超过 34 万条实时事件后，我们想看看最活跃的账号是真实用户还是机器人，但相关的 \"did\" 属性从未被提取为独立列（见下方查询截图）。\n\n排名靠前的结果立刻暴露了数据流中的自动化行为：一个账号关注了 1,619 次，却没有发帖；另一个账号点赞了 1,295 次，却没有关注任何人；还有一个账号在短时间内集中取消了 600 次关注。\n\n无需迁移表结构，也无需回填数据，直接查询 JSON 路径即可。"}, "avatar": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, {"id": "2116050868982386996", "track": "growth", "source": {"id": "2116050868982386996", "text": "把信息意图变为交易意图，并且提供工具，满足了用户的制作需求。\n\n之前是： XXX PPT topic for xxx\n\n现在是：\n什么样场景适合什么样的PPT TOPIC，还嵌入了“直接导入对应PPT生成工具制作”\n\n把blog 变成了可以直接使用的工具，也增加了用户的使用时长。", "createdAt": "Fri Oct 30 06:13:36 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 15, "conversationId": "2116050868982386996", "author": {"username": "hezhiyan7", "name": "droidHZ", "profileImageUrl": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, "authorId": "1554325830708314112", "quotedTweet": {"id": "2116039009659244762", "text": "分享一个近期的优化心得，大家自行看图，有任何疑问，可以留言，我空的时候回答 https://t.co/5LU2hxaQxN", "createdAt": "Fri Oct 30 05:26:28 +0000 2026", "replyCount": 14, "retweetCount": 6, "likeCount": 99, "conversationId": "2116039009659244762", "author": {"username": "JokerMayCry_Jun", "name": "JokerMaycry", "profileImageUrl": "https://pbs.twimg.com/profile_images/1630090308225765376/tBO_L2EO_normal.jpg"}, "authorId": "791221728240209920", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV2uGHhagAA51yY.jpg", "width": 1542, "height": 667, "previewUrl": "https://pbs.twimg.com/media/HV2uGHhagAA51yY.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV2uHqaa4AAxn4X.jpg", "width": 943, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV2uHqaa4AAxn4X.jpg:small"}]}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "droidHZ", "role": "出海、SEO 与增长实践与观察", "why": "提供支付盗刷识别和退款处理的一线记录，补独立站真实运营风险。", "handle": "hezhiyan7"}, "createdAtIso": "2026-10-30T06:13:36+00:00", "createdAtBeijing": "2026-10-30T14:13:36+08:00", "createdAtLocal": "10-30 14:13 北京", "url": "https://x.com/hezhiyan7/status/2116050868982386996", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2116050868982386996", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "博客工具化与交易意图承接", "evidence": "直接导入对应PPT生成工具制作", "rationale": "给出场景内容连接制作工具的转化方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, {"id": "2116296588813553908", "track": "research", "source": {"id": "2116296588813553908", "text": "AI 已经能在不少专业任务上超过人类，为什么整个经济还没发生想象中那么大的变化？\n\nDeepMind Institute 刚发布了一篇《The Economics of Intelligence》，我觉得很值得读，尤其是做 Agent 的人。\n\n作者提出一个很有意思的观点：单个 AI 再强，也未必能打赢一支分工明确的人类团队。\n\n他们做了个 100 人的小实验，发现按能力互补配对，比随机配对表现高出 32%。团队能互相弥补短板，而复制多个相同的模型，往往连弱点也一起复制了。\n\n文章把 AI 能力分成两部分，做事能力（Competence）和协作能力（Coordination）。\n\n前者决定单个 Agent 能做多好，后者决定增加更多 Agent 后，整个团队能否继续高效运转。\n\n作者甚至推演，一旦协作能力突破某个门槛，企业规模和就业结构可能发生突然的变化。当然，这目前还是理论模型。\n\n这让我想到现在的 Multi-Agent，多个 Agent 一起干活，经常还会遇到重复工作、任务交接不顺畅，甚至互相拖后腿的问题。\n\n什么时候 Agent 真能像一支成熟的团队一样分工、协作、互相补位，可能才是 AI 生产力真正发生变化的时候。\n\n原文：https://t.co/x7goFBG1LD", "createdAt": "Fri Oct 30 22:30:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 3, "conversationId": "2116296588813553908", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-30T22:30:00+00:00", "createdAtBeijing": "2026-10-31T06:30:00+08:00", "createdAtLocal": "10-31 06:30 北京", "url": "https://x.com/Xudong07452910/status/2116296588813553908", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2116296588813553908", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "智能经济学中的能力互补与协作", "evidence": "按能力互补配对，比随机配对表现高出 32%", "rationale": "提供研究实验与协作框架，理论推演有区分"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116233564823974005", "track": "tools", "source": {"id": "2116233564823974005", "text": "Claude 200 美元档改名 Ultra，已验证账号取消 5 小时限额，价格和周额度不变\n\nAnthropic 10 月 30 日宣布给 Claude 的两档 Max 套餐改名：每月 100 美元的 Max 5x 改叫 Max，每月 200 美元的 Max 20x 改叫 Ultra。价格不变，现有订阅自动换成新名字，用户什么都不用做。\n\n同时，Ultra 的已验证账号不再有 5 小时限额，当天先对大部分现有订阅者生效。较新的账号在通过验证前保留一个临时限额，官方说这是为了防止欺诈和滥用，限额取消时会收到邮件。周限额不变。\n\n【取消 5 小时限额，对我有什么用】\n\nClaude 付费套餐原本有两道限额：一个每 5 小时重置一次的窗口，一个每周的总上限。重度用户，特别是用 Claude Code 长时间写代码的人，常遇到周额度还剩不少、却被 5 小时窗口卡住的情况，只能停下来等它重置。\n\nUltra 去掉这道限额后，一周能用的总量没变，但可以连着用，不用再每隔几小时停一次。每周本来就把额度用光的人，总量上不会多拿到什么。\n\n100 美元的 Max 还是两道限额都有，每 5 小时和每周的用量都是 Pro 的 5 倍。200 美元的 ChatGPT Pro 一直只有周限额，Ultra 现在在这一点上和它一样。\n\n【我的账号验证了吗】\n\n验证由 Anthropic 自动完成，依据账号和付款记录等因素，用户不需要提交任何东西。订阅时验证手机号是另一回事，不会取消这个限额。帮助页没说验证要多久。\n\n自己查的方法：打开 Claude 设置里的“用量”页面，如果看不到“当前会话”（Current session）这条进度条，账号就已经验证，5 小时限额已经取消。\n\n【名字里的“20x”去哪了】\n\n旧名字里的 20 倍，指的是每 5 小时窗口能用 Pro 的 20 倍。新的 Ultra 帮助页写的是，每周用量是 Pro 的 10 倍，另有一个单独的 Fable 周限额。SemiAnalysis 10 月初的实测也是这个比例：200 美元档每月可用量约是 100 美元档的两倍。\n\nAnthropic 没解释为什么改名。5 小时窗口取消后，按窗口算的“20 倍”对 Ultra 不再适用，新名字里也就不带倍数了。\n\n来源：Claude 官方 X 帖子（@claudeai，2026-10-30）\nhttps://t.co/5hZSlWWi62\nAnthropic 帮助中心《What is the Ultra plan?》\nhttps://t.co/JW8cTsXRlu\nAnthropic 帮助中心《What is the Max plan?》\nhttps://t.co/mfSYTfvBxv", "createdAt": "Fri Oct 30 18:19:34 +0000 2026", "replyCount": 13, "retweetCount": 2, "likeCount": 23, "conversationId": "2116233564823974005", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2116220869479428500", "text": "We’re renaming our Max plans: \n\nMax 5x → Max\nMax 20x → Ultra\n\nMax is still $100/month, and Ultra is still $200. If you’re a subscriber, there’s nothing you need to do.\n\nWe’re also removing the 5-hour limit for verified Ultra accounts, starting today with most existing subscribers. Newer accounts keep a temporary limit until they’re verified, which helps us prevent fraud and abuse. You'll get an email when it's removed.\n\nWeekly limits remain unchanged. View our plans here:  https://t.co/niRpyGF5Me", "createdAt": "Fri Oct 30 17:29:07 +0000 2026", "replyCount": 1834, "retweetCount": 1177, "likeCount": 22114, "conversationId": "2116220869479428500", "author": {"username": "claudeai", "name": "Claude", "profileImageUrl": "https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_normal.jpg"}, "authorId": "1943306828697550848", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5MwwNWAAA5hUI.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HV5MwwNWAAA5hUI.jpg:small"}], "translationZh": "我们将调整 Max 套餐的名称：\n\nMax 5x → Max\nMax 20x → Ultra\n\nMax 仍为每月 100 美元，Ultra 仍为每月 200 美元。现有订阅用户无需进行任何操作。\n\n我们还将取消已验证 Ultra 账号的 5 小时用量限制，今天起先向大多数现有订阅用户开放。较新的账号在完成验证前仍会暂时保留这一限制，以帮助我们防范欺诈和滥用。限制取消后，你会收到邮件通知。\n\n每周用量限制保持不变。在此查看套餐：https://t.co/niRpyGF5Me"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5fNR3X0AAS4tQ.jpg", "width": 962, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV5fNR3X0AAS4tQ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-30T18:19:34+00:00", "createdAtBeijing": "2026-10-31T02:19:34+08:00", "createdAtLocal": "10-31 02:19 北京", "url": "https://x.com/dotey/status/2116233564823974005", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2116233564823974005", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Claude 套餐更名与用量限制调整", "evidence": "Weekly limits remain unchanged.", "rationale": "包含套餐调整、限额差异及账号检查方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115976609148834301", "track": "tools", "source": {"id": "2115976609148834301", "text": "我去！\n\nOpenAI 把 Pro 会员的所有使用限额翻倍了！\n\n也就是说他们把之前去掉的那个额度加回来了，这下可以开极高推理爽用了", "createdAt": "Fri Oct 30 01:18:31 +0000 2026", "replyCount": 50, "retweetCount": 0, "likeCount": 36, "conversationId": "2115976609148834301", "author": {"username": "op7418", "name": "歸藏(guizang.ai)", "profileImageUrl": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, "authorId": "1669276256", "quotedTweet": {"id": "2115850175868727621", "text": "Day 25/\n\nWe are doubling all usage limits for all Pro 100/200/500 tiers and Business Premium, effective today.\n\nWe heard your kind feedback and won’t be reducing usage limits for Pro 200, so your Work and Codex usage will stay the same. We’re also going to continue offering extended limits for dots for now, and usage of your dot will still continue to be separate from your default usage.\n\nAnd we'll of course also keep shipping better models and other efficiency improvements that increase your effective usage over time.", "createdAt": "Thu Oct 29 16:56:07 +0000 2026", "replyCount": 7166, "retweetCount": 2624, "likeCount": 37843, "conversationId": "2115850175868727621", "author": {"username": "thsottiaux", "name": "Tibo", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075819673263001600/pj1vyX6I_normal.jpg"}, "authorId": "1953337039510003712", "translationZh": "第 25 天/\n\n即日起，所有 Pro 100/200/500 档位及 Business Premium 的各项使用限额均翻倍。\n\n我们听取了大家的反馈，不会下调 Pro 200 的使用限额，因此你的 Work 和 Codex 使用额度将保持不变。我们也会暂时继续为 dots 提供额外额度，你的 dot 用量仍将与默认用量分开计算。\n\n当然，我们也会持续推出更好的模型并提升效率，让你的额度能完成越来越多的工作。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "歸藏", "role": "内容、视觉与多模态实践与观察", "why": "有多 Agent 记忆协作和多模态产品实测，创作工具覆盖广。", "handle": "op7418"}, "createdAtIso": "2026-10-30T01:18:31+00:00", "createdAtBeijing": "2026-10-30T09:18:31+08:00", "createdAtLocal": "10-30 09:18 北京", "url": "https://x.com/op7418/status/2115976609148834301", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2115976609148834301", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "OpenAI 订阅使用限额调整", "evidence": "doubling all usage limits", "rationale": "引用具体套餐额度更新，影响工具使用安排"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, {"id": "2116059865466687680", "track": "agent", "source": {"id": "2116059865466687680", "text": "现在在我的安利下，很多朋友也用上了Grokbot。\n\n而且我发现一件事： 我们AI从业者和爱好者，更多的是把Grok bot放在工作中。 \n\n可是朋友们有几个场景是我没用上的：\n\n1.做股票模拟盘；\n2.定时让点外卖送到公司。到了公司就直接吃。", "createdAt": "Fri Oct 30 06:49:21 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2116059865466687680", "author": {"username": "situking", "name": "司徒K", "profileImageUrl": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, "authorId": "1518825568959176705", "quotedTweet": {"id": "2115718050389610891", "text": "Grok Bot 额度机制天机泄露😱\n\n1. Grok Bot 的额度不按消息条数扣，按 Bot 实际干的活扣：模型调用、上下文体积、工具调用全都算。每走一步都要把整段历史重读一遍，最忙的 Bot 每步要重读 8-9 万 token。\n\n2. 搜 X 走 Bot 自带的免费额度（每分钟 30 次、每天 1000 次），不扣周额度。但搜回来的大批推文要存文件，别贴进聊天。\n\n3. 最大的坑是看图看视频。截图、视频帧、扫描件直接丢进对话，上下文会迅速膨胀；有人一天发 4 张图、搜一次、处理两份扫描件，就吃掉顶档周额度的 11%。我自己用它剪视频，也是掉得最快的。先让命令行工具出文字摘要，Bot 只读摘要。\n\n4. 读网页别让它截图点点点。同一个网站，Computer use 约 21.3 万 token，浏览器里跑脚本约 5.1 万，纯脚本执行期间模型 0 token。能走 API 连接器就别开浏览器。\n\n5. Bot 当包工头，别当搬砖工。在它的云电脑上装 Grok Build、Codex、Claude Code、Pi + DeepSeek 这些 CLI，重活让 CLI 跑，Bot 只调度。有人把写代码交给 Grok Build，两天半 Bot 池用了 70%，开发池才用 6%。\n\n6. 但这里有个坑我天天踩：CLI 跑完没有明确提醒，Bot 派完活就睡了，经常忘了回来查，你就干等半天没结果；让它一直盯着，又费 token 效果还一般。目前看到的解法是 Webhook 叫醒：CLI 一跑完就把 Bot 叫起来验收，范凯和一泽都开源了现成的。\n\n7. 定时任务是隐形吸血鬼。每 15 分钟跑一次 = 一周 672 次唤醒，改成每小时 = 168 次，一天 3 次 = 21 次。没变化也照样扣。\n\n8. 盯数据的活改成\"有变化才叫醒\"：在云电脑里跑个脚本盯着，不过模型、不扣额度，有变动再用 Webhook 叫醒 Bot。注意 Webhook 实测约 1 小时 200 次上限，打满会中断。\n\n9. 同一个 Bot 别聊太久。聊长了它会自动压缩上下文，你根本不知道它压掉了什么，效果越来越差，每一步还要重读一大坨。一个任务开一个新对话，长资料存成文件，聊天里只回结论和路径。放着不聊的旧对话不扣额度，不用清。\n\n10. 别开 Bot 群聊。群里每条消息每个 Bot 都要读一遍，纯重复浪费；有个团队账号约三分之一的轮次是 Bot 在互相叫醒。让 Bot 之间单独对话，消耗反而可控。\n\n11. 同理，别让主 Bot 一次给所有 Bot 派活。我之前有个定期更新记忆、推送文件的任务，主 Bot 每次给所有 Bot 发一遍，它们就各自把文档重新总结一遍。可我平时就让它们日常总结了，这一轮纯属重复烧额度。\n\n12. 先小样本，再放量。复杂任务先跑 1-2 个样本，停下确认再继续；同一步失败 2 次就让它停下来问你。有人 2 小时试错就烧掉过半周额度。\n\n13. 两个无效技巧：想切轻量模型省额度——没有模型选择器，系统自动分配；多订几份想叠加——不叠加，只用额度高的那份。\n\n14. 现在是大一统订阅：Grok、Grok Bot、Cursor 共用一个每周池。Grok Bot 从 $30 的 Premium 起才有，Super $100 是它的近 4 倍，Ultra $200 是 12 倍多。第三方模型不在池子里，按 API 原价另算。\n\n15. 官方没公布每档多少 token。有人从 Cursor 后台反推：$30 周限额约 2.76 亿 token，$100 约 13.27 亿，$200 约 44 亿（个人实测反推，非官方）。\n\n----\n数字大多来自 个人实践 + 中推几位 Grok 大使和高玩的实测，官方至今没公布每档具体多少 token。 \n特别感谢 @cgnot996 铁柱的 12 招长文，一半以上的数字出自那篇🙏 \n也谢谢 @KinGao476942 @fankaishuoai @eze_is_1 @Michael_Fenech_ 的实测分享。", "createdAt": "Thu Oct 29 08:11:06 +0000 2026", "replyCount": 86, "retweetCount": 28, "likeCount": 485, "conversationId": "2115718050389610891", "author": {"username": "leaf_sanren", "name": "Leaf Yeah!", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075612818485792768/zgT9vETH_normal.jpg"}, "authorId": "1988444203224076288"}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "司徒K", "role": "企业落地与产品组织实践与观察", "why": "有 FDE 进场交付问答及企业服务方法，补足咨询和交付视角。", "handle": "situking"}, "createdAtIso": "2026-10-30T06:49:21+00:00", "createdAtBeijing": "2026-10-30T14:49:21+08:00", "createdAtLocal": "10-30 14:49 北京", "url": "https://x.com/situking/status/2116059865466687680", "themeId": "editorial", "signalScore": 53, "editorial": {"id": "2116059865466687680", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Grok Bot额度优化与任务调度实践", "evidence": "有变动再用 Webhook 叫醒 Bot", "rationale": "引用提供上下文与调度优化方法，数字属自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, {"id": "2116266362415075638", "track": "agent", "source": {"id": "2116266362415075638", "text": "更新一下，适配了 iPad，支持灵动岛，支持了 Codex 和 Pi https://t.co/07lHamkkI8", "createdAt": "Fri Oct 30 20:29:53 +0000 2026", "replyCount": 3, "retweetCount": 1, "likeCount": 33, "conversationId": "2116266362415075638", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "quotedTweet": {"id": "2115516478254624914", "text": "可能大家都知道，我平时都用 Herdr 进行 Vibe Coding，出门在外的话，会在手机上用 uu 远程控制家里的电脑。但是通过远程来控制电脑中的 Herdr，需要不停放大缩小，以及文字和图片输入和查看图片输出都颇痛苦，整个操作体验不够 mobile native，所以我一直想着做一个手机端的 Herdr 客户端，然后就做出来了（目前只适配了 Claude Code）\n\n但是出门在外要打通内网需要一个 relay server，我心想 Alma 一直以来都自带端到端加密的 relay server，那我就把这个功能合并到 Alma iOS App 内部了。\n\n也就是说，现在 Alma iOS App 内部其实集成了一个完整功能的 Herdr 客户端，甚至还有远程桌面的功能。甚至还会自动判断你是否在同一个局域网中，如果是的话自动切换到内网连接，速度更快更丝滑，另外 relay server 也是端到端加密的，以后有时间打算把这个 Alma relay server 开源出来让大家自己搭建自己的 relay server！\n\n反正我舒服了😌", "createdAt": "Wed Oct 28 18:50:07 +0000 2026", "replyCount": 211, "retweetCount": 79, "likeCount": 1135, "conversationId": "2115516478254624914", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115516174419247104/img/OA8UweLjBWiGyv2W.jpg", "width": 944, "height": 2048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115516174419247104/img/OA8UweLjBWiGyv2W.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115516174419247104/vid/avc1/1770x3840/OvcsKsx3-04vvjrF.mp4?tag=29", "durationMs": 53984}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116266232743890944/img/p1QqgwRkpC-ns_Gy.jpg", 迎社区里的同学自由参会，发言讨论。\n\n3. 我们团队内部已经完成一部分的 Benchmark 整理、RSI 算法复现工作，并取得了初步结论，我们预计会在下周二的双周会上进行首次发布，欢迎大家来一起交流讨论。\n\n社区仓库链接：https://t.co/GlQ6yFzmHE\nBenchmark 仓库链接：https://t.co/B5XurCcyxN\nPenguinHarness 框架主页：https://t.co/CvMVlaA6Kj", "createdAt": "Fri Oct 30 09:24:22 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 5, "conversationId": "2116098505530048521", "inReplyToStatusId": "2116098505530048521", "author": {"username": "code_hiyouga", "name": "Yaowei Zheng | LlamaFactory", "profileImageUrl": "https://pbs.twimg.com/profile_images/2066748499212087296/xmp83ygY_normal.jpg"}, "authorId": "1813077766981754881", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116098821235277824/img/WBCPddt3n9JTo6Ph.jpg", "width": 2048, "height": 1331, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116098821235277824/img/WBCPddt3n9JTo6Ph.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116098821235277824/vid/avc1/2618x1702/Nw9EfB4CiWGg_5GL.mp4?tag=29", "durationMs": 9615}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "郑耀威 Yaowei Zheng", "role": "模型、研究与推理实践与观察", "why": "有 PenguinHarness 发布、Trace 和 API 变化，训练与 Agent 框架均有价值。", "handle": "code_hiyouga"}, "createdAtIso": "2026-10-30T09:24:22+00:00", "createdAtBeijing": "2026-10-30T17:24:22+08:00", "createdAtLocal": "10-30 17:24 北京", "url": "https://x.com/code_hiyouga/status/2116098878546260415", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2116098878546260415", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "AwesomeRSI路线图与评测格式草案", "evidence": "我们发布了统一的 RSI Benchmark + Plugin 标准格式", "rationale": "发布评测与插件格式草案，支持实验复现比较"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2066748499212087296/xmp83ygY_normal.jpg"}, {"id": "2116121264108810623", "track": "tools", "source": {"id": "2116121264108810623", "text": "突然发现，用 AI 做投研，OKX 开源的 Agent Trade Kit 挺好用，装进 AI 后，实时行情直接变成 AI 能调用的工具\n\n它能查什么：\n1、上百个美股代币交易对，美股七巨头、AMD、ASML 都有\n2、黄金、白银、原油、天然气、铜，还有一个 H100 租卡价格指数\n3、BTC、ETH 这些币的 K 线、资金费率、持仓量\n4、70 多种技术指标，RSI、MACD、布林带、KDJ、一目均衡表，连 K 线形态识别都有\n5、一个选股器，按涨幅、成交额、资金费率、持仓量排序筛选\n\n而且这些全是免费的。单独买美股实时行情的 API，一个月几十到两百美元不等，黄金原油的实时数据也大多要付费\n\n但这里的美股是代币化美股，7×24 小时交易，美股休市的时候价格会和正股有些偏差，做研究够用\n\n读资料这块可以配 Anthropic 官方开源的 financial-services，/earnings 读财报、/dcf 做估值、/comps 拉同行对比\n\nTradingAgents 也不错，一只股票丢给它，基本面、情绪、新闻、技术几个分析师先各写一份，多空两边再讨论一轮，最后交易员和风控出结论\n\n想用 AI 做投研的，先把这个装上😋", "createdAt": "Fri Oct 30 10:53:19 +0000 2026", "replyCount": 4, "retweetCount": 4, "likeCount": 65, "conversationId": "2116121264108810623", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "quotedTweet": {"id": "2116118404180717981", "text": "交易这东西还是太高深了，算是搞懂了为啥 70% 胜率的策略还是会亏钱\n\n上次讲了我的赌徒式玩法，有人说拿赚钱的单复盘没意义，我就让 AI 把整套从头跑了一遍...\n\n确实细思鼻孔😅\n\n举例，每次 100U，不止损，赚到 30% 就卖，扛不住就爆仓\n\n数据用 OKX 过去一年的小时 K 线，BTC、ETH、SOL、DOGE、XRP、BNB、PEPE 每个币每小时多空各开一单，一个币就是 1.75 万单\n\n开 20 倍，7 个币的胜率全在 72% 到 76%，开 50 倍，全在 67% 到 70%\n\n胜率为什么这么高，还这么规整\n\n20 倍的时候，赚 30% 只要价格往你这边走 1.6%，爆仓要反着走 4.6% 左右\n\n价格先碰到近的那条线，本来就更容易，所以十单里能赢七单多\n\n我把止盈改成\"赚到翻倍才卖\"，7 个币的胜率一起掉到 47%，整整齐齐🤣\n\n那如果，赢七成的话，赚不赚\n\n赢一次赚 30U，爆一次亏 90 多 U，再扣掉手续费，20 倍下 7 个币基本都是小亏，最好的 BNB 也就打平\n\n本金 1000U 按这套玩，亏光的概率从两成到九成不等\n\n50 倍就没悬念了，一开一平的手续费就吃掉保证金的 5%，一年下来九成以上亏光\n\n所以说实话，我以前觉得自己\"挺会玩\"，其实就是把止盈设得离得近而已\n\n想测自己打法的，可以装上 Agent Trade Kit，把你的规则原样丢给 Claude Code：\n\n\"用 OKX 的公开行情接口，拉 BTC 永续过去一年的小时 K 线，模拟这个打法：每次 100U、20 倍，不止损，赚到 30% 平仓，爆仓算亏完，手续费按 0.05%。算出胜率、平均每单盈亏，以及 1000U 连续打下去多久会亏光。\"", "createdAt": "Fri Oct 30 10:41:57 +0000 2026", "replyCount": 8, "retweetCount": 1, "likeCount": 9, "conversationId": "2116118404180717981", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "medi const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
