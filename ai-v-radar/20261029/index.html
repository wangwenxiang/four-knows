<script>
const DATA={"records": [{"id": "2115490096049004765", "track": "agent", "source": {"id": "2115490096049004765", "text": "A hand-typed analysis for optimizing LLM inference with agent fleets. There has been a lot of recent news about that - but many are kinda vague, so I think a more technical post is in order.\n\nTo explain why this may claim credibility: I drew conclusion from our own DeepSeek 4.1 Flash optimization, which reached a per-step time of 2.41 ms, and a generation speed of up to 2300 tok/s (with Dspark) and reliably around 1800 tok/s for agent tasks. Agents ran ~230 optimization proposals and 94 of them were verified to be useful.\n\nMy 2 cents from those runs below:\n\n1. Lots of gains beyond \"kernel optimization\". More than 50% of the optimizations were shipped with no new kernel but configs / graphs / launch order and other strategies. Kernels have been a well beaten path but there is a lot to be gained in the other parts of the end to end system.\n\n2. MegaKernel might be a lie. On non-trivially large models, megakernel is trying to take to big a bite. Most of our experiment showed that glueing small ops into existing kernels, or fusing multiple small kernels into a medium one, is getting the biggest gain. This may only apply to NVIDIA GPUs where the underlying driver is very optimized, though, as @vllm recently showed good results with megakerkenl on TPU.\n\n3. KernelBench and real serving are different problems. Many kernels measured positive in isolated runs but turned out negative when combined in end-to-end. I've always wanted a good simulation like Accel-Sim, but so far simulation don't have a good accuracy when modeling complicated latency patterns with both compute and memory bounds.\n\n4. Verification becomes *really* important if you don't want to be glued to your desk. If you can define \"what is correct\", like numerical tests, end-to-end quality evaluations, then agents can run for a long time. We didn't interfere with the run other than (a) adding GPU machines, (b) ensure token limit aren't hit, and (c) increasing credit card spending limit.\n\n5. Don't worry, it'll converge - I think the community has consensus that once you set up the goal, agents will eventually converge. Convergence speed is gonna be key though, and 4(c) above is really real.\n\n6. At low concurrency settings, low level assembly writing such as SASS edits have less effect, mainly because waiting for memory (and cache?) becomes the main bottleneck.\n\n7. The hot paths are kinda solved, although much more is to be explored. I think the biggest gain in the next couple months will come from optimizing the wider distributed serving stack, in addition to the single serving engine itself. This would probably involve a lot of system and SRE insights: building proper telemetry, building proper A/B testing without disrupting production traffic, kinda similar to the good old recommendation systems do.\n\n8. Agents doing end to end optimization is a necessity. In our case agents diligently went through 230 experiments, each of which might take a person a week (or at least a couple days with manual experiments + claude code). The sheer volume and speed definitely allows us to explore all possible optimizations otherwise not possible due to human bandwidth.\n\nMy last thought is a bit contradictory: so far, it seems that agents are \"good engineers\", in the sense that they can massively carry out known insights. In a way, they are \"interpolating\" what we already know, but just way faster. I haven't seen agents design awesome algorithms like PagedAttention or Winograd, yet. But who knows, extrapolating from our existing knowledge base may well be very possible in the upcoming months.\n\nAnd man, I like typing on a keyboard, although it might look much worse than a well trained AI writer.", "createdAt": "Wed Oct 28 17:05:17 +0000 2026", "replyCount": 5, "retweetCount": 5, "likeCount": 40, "conversationId": "2115490096049004765", "author": {"username": "jiayq", "name": "Yangqing Jia", "profileImageUrl": "https://pbs.twimg.com/profile_images/2048664382486507520/kqp6QDtM_normal.jpg"}, "authorId": "32872803", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115490050297516032/img/ZYM5uBSN07dOQt0w.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115490050297516032/img/ZYM5uBSN07dOQt0w.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115490050297516032/vid/avc1/1920x1080/YzLZfykWP4dF3zlo.mp4?tag=29", "durationMs": 49233}], "expert": {"priority": "P0", "domain": "中国 / ML 系统", "name": "贾扬清 Yangqing Jia", "role": "Lepton AI / 创始人；Caffe 作者", "why": "AI 基础设施、推理云、模型服务", "handle": "jiayq"}, "createdAtIso": "2026-10-28T17:05:17+00:00", "createdAtBeijing": "2026-10-29T01:05:17+08:00", "createdAtLocal": "10-29 01:05 北京", "url": "https://x.com/jiayq/status/2115490096049004765", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2115490096049004765", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Agent 集群优化 LLM 推理的实验复盘", "evidence": "94 of them were verified", "rationale": "自述量化实验成果，并详述端到端验证与瓶颈"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "一篇手打的分析，聊聊如何用智能体集群优化 LLM 推理。最近这方面的消息很多，但不少都比较笼统，所以我觉得有必要写一篇更偏技术的文章。\n\n先说说这些观点的依据：结论来自我们对 DeepSeek 4.1 Flash 的优化。我们将单步耗时降至 2.41 毫秒，生成速度最高达到 2300 tok/s（使用 Dspark），在智能体任务中则稳定在约 1800 tok/s。智能体尝试了约 230 个优化方案，其中 94 个经验证有效。\n\n以下是我从这些实验中得到的一些看法：\n\n1. “内核优化”之外还有大量提升空间。超过 50% 的落地优化没有引入新内核，而是调整配置、计算图、启动顺序等策略。内核优化已经被深入探索过，但端到端系统的其他环节仍有很大的优化空间。\n\n2. MegaKernel 可能是个伪命题。对于规模较大的模型，MegaKernel 想一口吃下的东西太多。我们的大多数实验表明，将小算子并入现有内核，或将多个小内核融合成一个中等大小的内核，收益最大。不过，这可能仅适用于底层驱动已高度优化的 NVIDIA GPU，因为 @vllm 最近在 TPU 上使用 MegaKernel 取得了不错的效果。\n\n3. KernelBench 和真实推理服务是两回事。许多内核单独测试时有收益，放进端到端流程后却拖慢了整体性能。我一直希望能有像 Accel-Sim 这样的优秀模拟器，但目前的模拟器在刻画计算与内存瓶颈交织的复杂延迟模式时，准确性还不够好。\n\n4. 如果你不想一直守在电脑前，验证就真的非常重要。只要能定义“什么是正确的”，例如数值测试、端到端质量评估，智能体就能长时间自主运行。整个过程中，我们只干预了三件事：(a) 增加 GPU 机器，(b) 确保不触及 token 限额，(c) 提高信用卡消费额度。\n\n5. 别担心，它会收敛的。我觉得社区已经形成共识：只要设定好目标，智能体最终就会收敛。不过，收敛速度将是关键，而且上面第 4(c) 点真的非常现实。\n\n6. 在低并发场景下，修改 SASS 等底层汇编代码的效果较小，主要是因为等待内存（以及缓存？）成了主要瓶颈。\n\n7. 热点路径的优化已经取得了不少成果，但仍有很多值得探索的地方。我认为，未来几个月最大的收益，除了来自单个推理引擎的优化，还会来自更广泛的分布式推理服务栈。这可能需要大量系统工程和 SRE 经验：建立完善的遥测体系，在不干扰生产流量的前提下开展可靠的 A/B 测试，有点像传统推荐系统的做法。\n\n8. 让智能体做端到端优化是必要的。在我们的案例中，智能体认真完成了 230 次实验，每次实验如果由人来做，可能需要一周，哪怕结合手动实验和 claude code，也至少要几天。这样的实验规模和速度，让我们能探索受限于人力而原本无法尝试的各种优化。\n\n最后一个想法有点矛盾：到目前为止，智能体似乎是“优秀的工程师”，能够大规模落实已有思路。从某种意义上说，它们是在对已有知识做“插值”，只是速度快得多。我还没见过智能体设计出 PagedAttention 或 Winograd 这样出色的算法。但谁知道呢，未来几个月，它们或许真能从现有知识出发，实现向外推演。\n\n还有，我确实喜欢亲手敲键盘，虽然写出来的东西可能远不如训练有素的 AI 写手。"}, "avatar": "https://pbs.twimg.com/profile_images/2048664382486507520/kqp6QDtM_normal.jpg"}, {"id": "2115345069570212202", "track": "creative", "source": {"id": "2115345069570212202", "text": "把设计品味写进 Agent：LangChain 开源 Content Studio 的四个月实践\n\nLangChain 内部 GTM 工程与设计团队用四个月把 Content Studio（Slack 里的 Design Agent）从「丑、像千篇一律 AI 稿」做到可量产：把设计师的判断写进 skills / wiki / 代码门禁，给模型一台能跨轮次改项目的沙箱电脑，再用异步子 Agent + 多人对线程的协作 UX 撑住几小时任务；并开源整套 harness，可 fork 后挂上自家品牌，经 Managed Deep Agents 部署到团队 Slack。\n\n开源地址：\nhttps://t.co/wDwS1cTTF3\n\n项目背景和结果\n公司节奏快，launch、活动、博客都要图、片、片头、广告物料；设计人力被重复需求占满。Content Studio：在 Slack 里描述需求、挂 brief/素材，拿回合规成片。文称自 8 月起交付 3000+ 资产（含 80+ PPT）；带其素材的帖在 X 约 450 万 曝光；官号上这类帖相对其他帖约 2× 点赞、3.7× 收藏；约 3/4 请求来自营销外团队，75% 用户每周回访。单次请求模型花费中位数约从 9 月中的 $8 降到约 $0.50；迁到 Managed Deep Agents 后自有代码量约减 80%。\n\nAI 会不会设计？\n模型已经能写 HTML/CSS、图表规范和动画时间线，缺的是立场与上下文，容易「分布收敛」成好看但千人一面的稿（文里引 Anthropic 说法，以及 Stripe 设计负责人 Katie Dill 的「zombie UI」：没有观点，AI 会替你给一个）。结论不是「AI 不能设计」，是必须教它你们的品味。\n\n怎么教品味？\n· 基础：色板、字重、间距、对齐。\n· 更关键：设计原则（如每帧一个焦点）、反 AI 俗套的护栏、以及每次反馈背后的推理（不只「改一下」）。\n· 可度量的用代码门禁（如默认大小写）；主观判断（创意是否够强、信息是否清楚）由设计师拍板后写入 skill，供后续复用。\n· 早期动效例子：鸟拖着光带飞出，「不要尖角」被理解成硬切圆角；后来 Agent 会自己建逐帧检查，保证光带贴合运动。设计师角色更像创意总监：定方向、审稿，而不是每张都手搓。\n\n媒体 harness：设计师的电脑\n底层是 Deep Agents（规划、文件、子 Agent、上下文管理）；Managed Deep Agents 负责生产运行（Slack、LangSmith Sandbox、工具、记忆、调度）。环境侧重点：\n· 每条 Slack 线程一台沙箱：独立 Linux + 文件系统，项目跨轮次常驻；产出尽量是代码（幻灯片 HTML、动画时间线），改时间点就能重渲，不必整段重生。\n· 工具层：剪辑用 HeyGen 开源的 HyperFrames（把片子当网页 + GSAP 时间线）；原创动画用自研 motion-studio（按像素画帧、多时刻混合模拟快门模糊等）；音画同一时间线。\n· 知识四层：Skills（按任务路由，文称约 48 个 skill、近千文件；README 写约 35 个，以仓库现状为准）；Wiki（品牌、语调、产品、约 70 部参考片拆解等，技能只链过去不复制）；Gate（确定性检查）；Memory（团队层 + 个人层，AGENTS.md 索引有过膨胀到约 50 万 token 的教训，现约限 200 行）。\n· 规格驱动：贵的是成片，先故事板（约 50ms/帧量级探索）→ 分镜/animatic 对节奏 → 再量产；顺序由代码强制，判断留在 prompt。协作画布用 Paper（点选改，而不是全程「用自然语言描述坐标」）；Paper 桌面能力在常驻 Linux worker 上无头跑，经桥接给云端沙箱。\n\n主 Agent 负责统筹派活\n长任务里多人会边做边改 brief。同步子 Agent 会堵住主线程，所以子任务异步：主 Agent 拆工、派角色、选模型与力度，用 start_task / check_tasks / cancel_task / resume_task / report_progress / schedule_wakeup 协调；人消息可插入下一轮模型调用前。线程里持续更新计划、ETA、子任务状态、花费，公开前要审批。例子：隔夜改肤 52 页 PPT，主 Agent 约跑 1 小时，子 Agent 合计超过 6 小时，不堵对话。\n\nBitter Lesson\n早期给弱模型堆了约 115 个可复用 UI/动效组件和细则，品牌稳了但版式重复。等模型（文中写 Opus 5.5）跃升后，删掉大部分硬编码补丁，只留原则与高层指引，多样性反而上来。补偿模型短板的规则会过期；更长寿的是环境：工具、上下文、以及人如何中途干预。\n\n自改进\n快环：当场把规则写入记忆。慢环：learn_from_job 抽最多 5 条有证据的教训挂到对应 skill，后续任务打分，每周后台合入 skill/wiki。下一步方向：整条战役生命周期（经审批后经 Buffer 发帖、员工转发草稿、定时复盘等），人仍审仍批。\n\n开源与部署\ndesign-agent：fork 后加品牌 token、字体与 skills，用 Managed Deep Agents 部署到 Slack。README 强调本地可试、密钥不进沙箱；架构图把 Slack → 主 Agent → skills/wiki/记忆 → 沙箱（Chromium、ffmpeg、HyperFrames、motion-studio、异步子 Agent）串在一起。", "createdAt": "Wed Oct 28 07:29:00 +0000 2026", "replyCount": 10, "retweetCount": 0, "likeCount": 20, "conversationId": "2115345069570212202", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115124503093121121", "text": "How We Built Our Design Agent", "createdAt": "Tue Oct 27 16:52:33 +0000 2026", "replyCount": 28, "retweetCount": 37, "likeCount": 231, "conversationId": "2115124503093121121", "author": {"username": "LangChain", "name": "LangChain", "profileImageUrl": "https://pbs.twimg.com/profile_images/2028336270431453184/jRRpLAdG_normal.jpg"}, "authorId": "1589007443853340672", "article": {"title": "How We Built Our Design Agent", "previewText": "Key takeaways\nTaste comes from context. Models already write good code, but they need your designers’ principles, guardrails against AI slop, and the reasoning behind feedback to make work that looks", "titleZh": "我们如何构建设计智能体", "previewTextZh": "核心要点\n品味源于上下文。模型已经能写出优秀的代码，但要让作品在视觉上……它们还需要设计师的原则、避免 AI 粗制滥造的约束，以及反馈背后的理由"}, "translationZh": "我们如何构建设计智能体"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVs3GpWbwAAz2f3.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVs3GpWbwAAz2f3.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T07:29:00+00:00", "createdAtBeijing": "2026-10-28T15:29:00+08:00", "createdAtLocal": "10-28 15:29 北京", "url": "https://x.com/shao__meng/status/2115345069570212202", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2115345069570212202", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Content Studio设计Agent开源与实践", "evidence": "先故事板（约50ms/帧量级探索）", "rationale": "详述设计知识沉淀、沙箱与异步协作，成效为文中自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115516581925315034", "track": "tools", "source": {"id": "2115516581925315034", "text": "Introducing the Document Parsing Protocol (DPP) \n\nThere are hundreds of different OCR models and tools, but they might all parse a document in different ways. \n\nSome errors are very clear-cut (e.g. hallucinating text, or completely misaligning a table), but many errors are much more ambiguous (e.g. how to represent split tables sharing a header). It's an issue that plagues most parse benchmarks too, because they inherently reward a certain style even if other styles might be semantically correct. \n\nWe introduce a protocol that proposes a standard way of parsing these documents into a correct format. We've curated a list of 140 rules that cover literally every aspect of doc parsing, for instance:\n- tables: borderless whitespace tables, header-only tables, horizontal slicing, side-by-side mini tables\n- forms: key-value regions, checkboxes, checklists, ids and labels, fields outside the form, \n- charts: standardized chart output, multiple charts, gantt charts, line charts\n\nYou can use DPP as an evaluation rubric for LLMs when determining the quality of parsing a document. \n\nIt's not a full evaluation benchmark (yet), but an initial evaluation guide, and meant to encourage a discussion on what are the \"best\" ways to parse a document.\n\nCheck it out: https://t.co/HsLh6ma9bB\n\nBlog: https://t.co/0md2O2M2Mf", "createdAt": "Wed Oct 28 18:50:32 +0000 2026", "replyCount": 38, "retweetCount": 21, "likeCount": 270, "conversationId": "2115516581925315034", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2115466450534097158", "text": "Is that a table, or just text that happens to line up?\nIf a table has two header rows, should the output preserve both?\n\nParsers make these judgment calls differently. Those differences shape what your agent understands about a document.\n\nWe built the Document Parsing Protocol (DPP) to give those decisions a shared rulebook.\n\nDPP covers text, tables, forms, charts, and diagrams, and even includes chemical structures and music notation. Each rule comes with example pages and expected outputs to make it concrete.\n\nThe working draft is live, and we’d love your feedback :) Get the Claude skill or ChatGPT reference file, try it on your messiest page, and let us know what comes back.\n\nTry it here: https://t.co/i3vtFTzZtX\n\nRead more: https://t.co/iSI8zqjpzP", "createdAt": "Wed Oct 28 15:31:19 +0000 2026", "replyCount": 8, "retweetCount": 8, "likeCount": 46, "conversationId": "2115466450534097158", "author": {"username": "llama_index", "name": "LlamaIndex 🦙", "profileImageUrl": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, "authorId": "1604278358296055808", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVulhn5XgAAI0Uj.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HVulhn5XgAAI0Uj.jpg:small"}], "translationZh": "那是表格，还是恰好对齐的文字？\n如果表格有两行表头，输出时应该都保留吗？\n\n不同解析器会作出不同判断，而这些差异会影响智能体对文档的理解。\n\n我们构建了 Document Parsing Protocol（DPP，文档解析协议），为这些判断提供共同遵循的规则。\n\nDPP 涵盖文本、表格、表单、图表和示意图，甚至包括化学结构式和乐谱。每条规则都配有示例页面和预期输出，便于具体理解。\n\n工作草案现已上线，欢迎反馈 :) 获取 Claude 技能或 ChatGPT 参考文件，拿你最混乱的页面试一试，再告诉我们解析结果如何。\n\n在这里试用：https://t.co/i3vtFTzZtX\n\n了解更多：https://t.co/iSI8zqjpzP"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVvRMStbAAAy4UD.jpg", "width": 680, "height": 383, "previewUrl": "https://pbs.twimg.com/media/HVvRMStbAAAy4UD.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-10-28T18:50:32+00:00", "createdAtBeijing": "2026-10-29T02:50:32+08:00", "createdAtLocal": "10-29 02:50 北京", "url": "https://x.com/jerryjliu0/status/2115516581925315034", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2115516581925315034", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "DPP 文档解析规范与评估指南", "evidence": "140 rules", "rationale": "发布覆盖多类文档的解析规则与示例，可复用"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "介绍 Document Parsing Protocol（DPP，文档解析协议）\n\n市面上有数百种 OCR 模型和工具，但它们解析同一份文档的方式可能各不相同。\n\n有些错误很明确，例如凭空生成文字，或表格完全错位；但许多问题的判定要模糊得多，例如如何表示共享表头的拆分表格。大多数解析基准测试也深受这一问题困扰，因为它们天然偏好某一种表达方式，即使其他方式在语义上同样正确。\n\n我们提出了一套协议，为将这些文档解析为正确格式提供统一规范。我们整理了 140 条规则，涵盖文档解析的方方面面，例如：\n- 表格：以空白分隔的无边框表格、仅有表头的表格、横向拆分、并排的小表格\n- 表单：键值区域、复选框、核对清单、标识符与标签、表单外的字段\n- 图表：标准化图表输出、多图表、甘特图、折线图\n\n在用 LLM 判断文档解析质量时，你可以将 DPP 作为评估准则。\n\n它目前还不是完整的评测基准，而是一份初步评估指南，旨在推动大家讨论文档解析的“最佳”方式。\n\n查看协议：https://t.co/HsLh6ma9bB\n\n博客：https://t.co/0md2O2M2Mf"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2115249578882826742", "track": "research", "source": {"id": "2115249578882826742", "text": "工业界怎么训练 Agent：环境、评测与奖励比模型本身更难\n\nHuggingFace 官方发布的四场分享 + 圆桌 + 观众问答，是 HuggingFace 免费课 Training Agents（轨迹 SFT → 蒸馏 → GRPO → 搭 RL 环境）的线下延续，重点讲工业侧的实现。\n\nPPT 合集：\nhttps://t.co/mvOl6omthQ\n系列课程：\nhttps://t.co/jDCMFTlXGn\nYoutube 视频：\nhttps://t.co/NBRXbikmbL\n\nGobind（Microsoft / GitHub & Foundry）-- 企业 RL\n传统大企业（工业、制造、能源）买的是业务指标：延迟、准确、以及后训练的风险可控；关心整条链路（工具、数据、网络、harness、墙钟），不是某一个模型。真实 Agent 常挂几十到上百个工具，很多问题要当分布式系统来解。做法上：先快速定制现成 harness，用生产轨迹搭仿真，再故意扰动（过期数据、超时），配上功能正确与安全类校验器。后训练是 SFT / 蒸馏 / DPO / RL 混用；倾向模块化决策模型，而不是凡事一台前沿大模型。展望包括：以后更多手搓奖励与环境；GitHub 上会出现可发现的「gym」资源；物理 AI 与对齐、监管会跟上。\n\nVictor（Mercor，前 Sierra）-- 环境与基准的计量学\n核心区分：训练环境给的是奖励（好不好学、难不难作弊），评测环境给的是测量（稳不稳、能不能预测上线表现）。「像不像真实世界」问法太粗，要问相对什么像，风洞不必长得像天空，但要保住真正影响结果的关系。评的应是 Agent = 模型 + harness + 运维，不能只报裸模型分数。可靠度封顶了效度；除了平均分，还要过关项、红队、可预测部署。基准要当长期产品维护，不要当一次性题库。\n\nTao Lin（RadixArk / Miles，SGLang）-- 异步 Agent RL\nMiles 把多步环境轨迹当成训练样本；对接 OpenEnv 的 reset / step。案例：大 MoE 在 Terminal Bench 2 上，64×B300（推理与训练各半）、完全异步、每局新沙箱；约 100 步后奖励从约 0.44 到 0.56。实操踩坑并回馈上游：Agent 在沙箱里找到参考答案、改动评分逻辑假过；也有做对了却因基建/评分器不稳判错。结论：扩规模不只是吞吐，还要隔离和可靠奖励。\n\nXiangyi Li（BenchFlow）-- OpenEnv Arena\nOpenEnv Arena 用来筛可训环境。公开里大量「环境」不可用：约 9 万 可找到的 RL 环境，层层过滤后约剩 800 个较干净；竞赛里多数提交训不动或不如基线。约 1% 的作弊题会污染后面整轮训练。扩到约 320B 级模型时，步数不够就爬不动目标榜；小模型上好用的旧学术任务，有时只教会大模型「少用工具、少花 token」。安全/赛博类任务噪声大，部分前沿模型即便授权话术也拒绝执行，开放、不乱拒的模型在这里有独特价值。\n\n圆桌与问答\n阻力常被说成：缺经过筛查的开放环境；企业「模型疲劳」、结果压力与预算被 coding Agent 占满；大模型 API 时代之后，自建所需的数据与 MLOps 肌肉萎缩。Gobind 认为 coding 之后，运维/决策类模块更有产品空间。结尾一句很实在：不能指望「改一下数据库，模型就变聪明」。", "createdAt": "Wed Oct 28 01:09:33 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 12, "conversationId": "2115249578882826742", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115103476892234214", "text": "last week we closed the Training Agents series IRL at the GitHub offices in SF\n\n4 talks, a panel and audience Q&A. almost 2h on post-training agents with open models\n\n> Learnings from enterprise RL (@t2govind Microsoft)\n> Environments and benchmarks in industry (@VBarres86633  Mercor)\n> How to train your agents with Miles (@nblintao RadixArk)\n> Why we built OpenEnv Arena (@xdotli BenchFlow)\n\nfull recording + slides\n\nhttps://t.co/cIkm20wEdV", "createdAt": "Tue Oct 27 15:29:00 +0000 2026", "replyCount": 5, "retweetCount": 12, "likeCount": 86, "conversationId": "2115103476892234214", "author": {"username": "SergioPaniego", "name": "Sergio Paniego", "profileImageUrl": "https://pbs.twimg.com/profile_images/1697156955603673088/uoaqJ13T_normal.jpg"}, "authorId": "330572456", "translationZh": "上周，我们在旧金山的 GitHub 办公室举办了 Training Agents 系列的线下收官活动\n\n4 场演讲、1 场圆桌讨论和观众问答，近 2 小时探讨如何用开放模型对智能体进行后训练\n\n> 企业强化学习实践心得（@t2govind Microsoft）\n> 业界的环境与基准测试（@VBarres86633 Mercor）\n> 如何使用 Miles 训练你的智能体（@nblintao RadixArk）\n> 我们为什么构建 OpenEnv Arena（@xdotli BenchFlow）\n\n完整录像 + 幻灯片\n\nhttps://t.co/cIkm20wEdV"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrgRRBbMAAU1UL.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVrgRRBbMAAU1UL.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T01:09:33+00:00", "createdAtBeijing": "2026-10-28T09:09:33+08:00", "createdAtLocal": "10-28 09:09 北京", "url": "https://x.com/shao__meng/status/2115249578882826742", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2115249578882826742", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "工业界 Agent 强化学习环境与评测", "evidence": "先快速定制现成 harness，用生产轨迹搭仿真", "rationale": "汇总训练案例、奖励作弊与评测可靠性经验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115284922500108648", "track": "research", "source": {"id": "2115284922500108648", "text": "Anthropic 刚公布了一项很值得关注的实验：让 50 名专业分析师用 Claude Code 做研究，结果 86% 的关键分析选择，都跟着 Agent 的倾向走了。\n\n更有意思的是，很多人事后还觉得这些判断是自己做的。\n\n研究者让分析师评估一个农业项目是否值得推广，其中有很多没有标准答案的选择，比如该用每公顷产量，还是单位成本产出来衡量效果。\n\n他们悄悄给 Agent 随机设定立场，要求它在不编造数据的前提下，尽量为自己的选择提供合理解释。\n\n结果除了 86% 的方法选择与 Agent 倾向一致，事后还有 77% 的人复用了 Agent 给出的理由，只有 15% 明确提到这些理由来自 AI。\n\n我觉得这对现在的 Agent 设计挺有警示意义。\n\n很多 Human-in-the-loop 流程，最后都是让人 Review 一下、点个确认。但如果人已经被 Agent 的解释说服了，这种审核还能提供多少独立判断？\n\n尤其是 Research Agent，研究方法、实验设计、结果解释，很多时候本来就没有唯一正确答案。\n\n对于做 Agent Eval 的朋友，可能还得关注一个更隐蔽的问题：Agent 有没有在这些关键选择上，悄悄替人做了决定？\n\n当然，这次实验刻意强化了 Agent 的立场，不能直接推广到所有真实场景。但我觉得这个方向真的值得认真研究。\n\n原文：https://t.co/x7eYFGomFu", "createdAt": "Wed Oct 28 03:30:00 +0000 2026", "replyCount": 10, "retweetCount": 0, "likeCount": 18, "conversationId": "2115284922500108648", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-28T03:30:00+00:00", "createdAtBeijing": "2026-10-28T11:30:00+08:00", "createdAtLocal": "10-28 11:30 北京", "url": "https://x.com/Xudong07452910/status/2115284922500108648", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2115284922500108648", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Agent 对人类分析判断的影响实验", "evidence": "86% 的关键分析选择，都跟着 Agent 的倾向走了", "rationale": "转述具体实验设计、结果及适用局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2115431302845628429", "track": "research", "source": {"id": "2115431302845628429", "text": "CMU 11-768: AI Agents 课程最新发布了一堂客座讲座\n\n@ZhiruoW 主讲「AI Agents for Human Work」，侧重 future-of-work 与评测构建，把「榜上好看」和「真顶人类工作」拆开：任务与就业结构错位、人机协作榜与自动榜排名对不上、开环人类工作难用执行判分；能力之外还要协作模式、效率、安全与工作意义；未来不只是替代，还有增强、新任务与早期职业冲击。\n\n讲义：https://t.co/1uOj623DAo\n\n现实检验：能做什么、卡在哪\n开场用 Anthropic 内部「更多人用 Agent 干活」、METR「长软件任务能力约每 7 个月翻倍」铺势头，随即泼冷水：\n· 榜单高分、电脑操作演示流畅（如 GPT-6 Astra），但 Remote Labor Index 等显示真实远程活仍难。\n· 自研 How Well Does AI Agents Reflect Real-World Work?（2026）：主流 Agent 评测过度集中在 Computer and Mathematical，大约只对应约 5% 就业。\n· Humans Are Missing from AI Coding Agent Research + CollabSkill：自动榜与人机协作榜排名可对调（如 Claude Code / Gemini CLI / Codex 在两榜上的位次不同），「自己干」强 ≠ 「跟人一起干」强。\n· 难嵌进人类工作流（引 MIT NANDA State of AI in Business 2025）；即便会用 Agent，也往往只覆盖工作的一小块。另问：自动化「公平量尺」与「想要的成功率」该怎么定（再引 METR）。\n\n能力从哪来：环境 · 任务 · 评测（框架三件套）\n1. 任务怎么来\n· GDPval：雇平均约 14 年经验的业内人，覆盖贡献美 GDP 前九大板块的 44 岗、220 任务（相对 O*NET 上千岗仍是切片）。\n· Remote Labor Index：O*NET 不够覆盖远程长尾；雇 358 名自由职业者，240 项目、覆盖 Upwork 23/64 类目。\n· JobBench：对齐「人想做 / 不想做」（如润色立场文 vs 海量洗数）。\n· OpenCUA：自动采集人类活动约 2.25 万 轨迹（Win/Mac/Ubuntu），非侵入但意图难还原、隐私敏感。\n· 训练侧还可用 Agent 自探索合成（Bagel、NNetNav 等）。\n核心批评引自 Bean 等：建构效度，分数在多大程度上支撑「测到了目标现象」。多数榜测的不是「要紧的事」。\n\n2. 环境怎么建\n手工部署开源替身（TheAgentCompany）→ 自动部署 + GDP 导向选型（Gym-Anything）→ 灌真实或合成数据（要真实、多样、难、带干扰）→ 文件/终端中心（Terminal-Bench）。瓶颈仍是：可用软件源有限、真实数据难拿到。\n\n3. 评测怎么评\n人类工作是光谱：可验证（修 GitHub issue）→ 半模糊（洗数分析）→ 很模糊（室内设计）；多数人类工作在开环端。执行判分盖不住语义质量 → 专家量规 + LLM-as-a-Judge（GDPval）；也可用 LM 生成量规（CollabSkill，需多面提示与人工校验）；训练侧有演化量规（DR Tulu）、交互信号转量规（Wang 等 test-time adaptation）。挑战：裁判自偏好与偏见、视觉判断差、完美量规难、评测贵且漂移（SWE-bench Verified「不再量前沿」之议）、静态榜污染与饱和（LiveCodeBench 路线）。\n\n光有能力不够\n· 人机多种交互模式（Future of Work with AI Agents 审计自动化 vs 增强）。\n· 执行中可接管/纠偏（CowPilot）；训练 Agent 识别用户交互与自身自主度（Huq & Wang Modeling Distinct Human Interactions）。\n· 多 Agent 冗余、低效（开源科研题、OpenAI 相关讨论作例）。\n· 安全：静态安全榜不够，问题常要实证挖（OpenAgentSafety；良性输入也可诱发出严重 unintended 行为）。\n· 意义：有人在问是否在自动化掉工作里的乐趣（Are We Automating the Joy Out of Work?）。\n\n工作的未来\n约 80% 美国劳动力至少 10% 任务可能受影响，写作与编程最吃紧，偏高收入岗暴露可能更大。但自动化 ≠ 整岗替代：人对约 46% 职业任务表达过自动化意愿，且存在「想自动化、AI 却发展不足」的缺口。工作集合不固定（Acemoglu & Restrepo：技术既挤出也创造新任务）。技能会贬值，人要适应；动机与判断更值钱；早期职业在高 AI 暴露岗位上可能更吃亏（Brynjolfsson 等 Canaries in the Coal Mine）。工作本身也是训练与学习的一部分，自动化会改学习路径。", "createdAt": "Wed Oct 28 13:11:40 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 3, "conversationId": "2115431302845628429", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2101274875218608376", "text": "周末适合沉下心来系统性的学习基础知识\n\nCMU 秋季最新课程 11-768: AI Agents\n\n主讲：@dan_fried @gneubig\n课程：https://t.co/9VlmFdAsCd\n视频：https://t.co/KHZguasVoO", "createdAt": "Sat Sep 19 11:39:04 +0000 2026", "replyCount": 28, "retweetCount": 121, "likeCount": 522, "conversationId": "2101274875218608376", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuFi6taYAAfLM1.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVuFi6taYAAfLM1.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T13:11:40+00:00", "createdAtBeijing": "2026-10-28T21:11:40+08:00", "createdAtLocal": "10-28 21:11 北京", "url": "https://x.com/shao__meng/status/2115431302845628429", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2115431302845628429", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "面向真实人类工作的 Agent 评测课程", "evidence": "自动榜与人机协作榜排名可对调", "rationale": "系统梳理任务采集、环境构建及评测局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115428696672866729", "track": "agent", "source": {"id": "2115428696672866729", "text": "MiniMax Code @MiniMax_Code 团队把他们每天真正在用的 Agent 工作流和 Skills 开源出来了！\n\nMCode Stack 中包含了团队何时拆子 Agent、长命令等多久等、长会话怎么保证不降级、每轮上下文塞什么 token 等等；把这些都写成可安装的 SKILL.md / 清单，并可作为插件进 MiniMax Code 和任意支持 Skills 的 Agents。\n\n开源地址：https://t.co/tU3L7LxLF1\n\n仓库里有什么\n按人打包成 stack（每人一套插件）：\n· stacks/ronny/：最完整，15 个 skill\n· stacks/jiachen/：偏「跳出 Agent 循环、把笔记做成帖/视频」\n· notes/：配套专栏 MCode Engineering Notes（文章讲道理，技能可执行）\n· community/、templates/stack-template/：欢迎外人贡献日常用法\n· 三类物件：Skill（/技能名 或按描述自动加载）、Checklist（逐项过项目）、Workflow（WORKFLOW.md 描述日常怎么用）。Ronny 的 WORKFLOW.md 仍标 Coming soon，先以 skills 为准。\n\nRonny 那 15 个 Skills\n1. 规划与拆分：subagent-split-check、engineering-small-prs、engineering-change-descriptions；要不要派子 Agent；大改拆成可审小 PR；写清变更与原因\n2. 上下文与工具：tool-budget-audit、context-tax-audit；工具吃掉多少上下文；每轮注入了什么、对 prompt cache 的影响\n3. 长会话与长命令：long-session-check、handoff-doc、long-command-check；摘要/落盘/新开会话；交接文档；长 shell/后台任务十点审计\n4. 评审：independent-review、engineering-code-review 等；干净上下文只看 diff+需求+测试；代码健康评审；写/回评论\n5. 实验与热修复：harness-experiment、trajectory-review、engineering-emergency-changes；一次改一点、看翻盘用例；看轨迹不只看过没过；热修是否真紧急\n\n六条 engineering-* 改编自 Google Engineering Practices，改编部分仍属 CC-BY 3.0（见 stacks/ronny/NOTICE.md）；其余 MIT。\n\n配套观点（Notes 01 为例）\n子 Agent 首先是隔离上下文的工具，不是按「工种/问题类型」开分身；默认主循环 + 按需加载技能，只有量到上下文才是瓶颈再拆；代码评审给独立干净上下文。同系列还有工具过多吃上下文、compaction vs memory、bash 前台阻塞 vs 后台等（06-context-tax 标 upcoming）。", "createdAt": "Wed Oct 28 13:01:18 +0000 2026", "replyCount": 14, "retweetCount": 11, "likeCount": 38, "conversationId": "2115428696672866729", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115413492941652299", "text": "We just open-sourced MCode Stack: the actual workflows and skills the MiniMax Code team uses every day to build MiniMax Code. \n\nhttps://t.co/vREt7i8m2M", "createdAt": "Wed Oct 28 12:00:53 +0000 2026", "replyCount": 21, "retweetCount": 39, "likeCount": 424, "conversationId": "2115413492941652299", "author": {"username": "Ronny_MiniMax", "name": "RonnyHe", "profileImageUrl": "https://pbs.twimg.com/profile_images/2093325392853766144/D1eah2cM_normal.jpg"}, "authorId": "1902919415928328192", "translationZh": "我们刚刚开源了 MCode Stack：MiniMax Code 团队每天开发 MiniMax Code 时实际使用的工作流和技能。\n\nhttps://t.co/vREt7i8m2M"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuDJMVaAAA1NQh.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVuDJMVaAAA1NQh.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T13:01:18+00:00", "createdAtBeijing": "2026-10-28T21:01:18+08:00", "createdAtLocal": "10-28 21:01 北京", "url": "https://x.com/shao__meng/status/2115428696672866729", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2115428696672866729", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "MCode Stack 开源 Agent 工程技能", "evidence": "把这些都写成可安装的 SKILL.md", "rationale": "提供开源技能、上下文管理与独立评审方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115282464935473225", "track": "creative", "source": {"id": "2115282464935473225", "text": "Opus 5.5 发布之后，AI Agent 剪辑视频已经能替代初级剪辑师了。差不多就相当于 Claude Code 刚发布的时候一样，模型真的能自主完成复杂编程任务了，但这才刚开始，想想 Claude Code 发布才多久。\n\n当年 Anthropic 专注于训练 Coding，没想到能解决这么多问题，连视频剪辑都能用 HTML、JavaScript 剪视频、生成动画。\n\n在 Opus 5.5 之前我就在做剪辑的 Skill 和工具，但模型发布后发现绝大部分 Skill 都不需要了。\n\n我自己有做过实验，同一个视频，不用任何 Skill，只提供 ASR 和 TTS 工具，Opus 5.5 做的比没有用 Skill 效果更好，这点跟推文中的经验基本吻合。\n\n另外 Sabba 有一条建议跟我最近在做的事差不多，他建议：“不要重造专业剪辑软件的时间线，那个太难做，专心做好初剪，再方便地交给现有专业软件”。\n\n我最近也把 BaoCut 的时间线编辑器退居二线了，太过复杂，默认应该只需要一个简单的视频预览播放。\n\n如果你用 Agent 去生成、剪辑视频的话，编辑器越简单越好，只要能标记，方便的让 Agent 知道改哪就够了。\n\n这其实和之前 Tibo 改造 Codex 的经历类似，Codex 不需要一个 VSCode 的代码编辑器，视频剪辑 Agent 也不需要一个视频编辑器。\n\n转发的这两条推文有分享很多 AI Agent 剪辑的经验，有兴趣的可以看看。\n\n---\n\n我把引用的两条推文放在一起总结一下：\n\nAlex Cooper 管着一支剪辑团队，每天出大量广告，讲的是怎么用；Sabba Keynejad 是在线视频剪辑工具 VEED 的联合创始人，讲的是市场会怎么变。\n\n1. 视频剪辑在走编程走过的路\n\n两人都认为 AI 智能体剪辑已经能用，而且现在是它最差的时候。Alex 团队的资深剪辑师说，同等质量下，他一天的产出是以前的 5 倍。\n\nSabba 预计一年内基础剪辑的成本会从几美元降到几美分。Sabba 也拿编程做类比：资深工程师当初最抵触 AI 写的代码，理由是质量和可维护性，后来还是接受了。他认为最好的剪辑师会是最大的批评者，但最终也会转过来。\n\n2. 视频被当成代码问题解决了\n\nSabba 解释了为什么是现在：Anthropic 押注编程，模型会写代码，就能用 HTML/CSS、SVG、浏览器渲染、OpenCV 这些手段“写”出视频。之前有一批工具包专门给大模型补剪辑能力，Opus 5.5 出来后，很多用法就用不上了。他也承认，现在剪出来的东西还是更像网页，不太像视频。\n\nAlex 的经验和这一点基本一致：他试过各种方案，最后发现不装 MCP、不装插件，全在 Claude 里做效果最好。通用模型能力上去后，夹在中间的工具层会被吃掉一大块，编程领域已经发生过一次。\n\n3. 核心资产是 Skill，Alex 给了一套能照搬的做法\n\n这是两条帖子里最有实操价值的部分：\n\n按风格拆小 Skill：混剪、UGC（模仿普通用户自拍口吻的素材）、AI 动画各做一个，不做大而全的剪辑 Skill，这样每次加载的上下文都和当前任务相关。\n\n起步：给 Claude 4～5 条参考作品，让它总结成 Skill。\n训练：让 Skill 把资深剪辑师最近剪的 25 条广告重剪一遍，放进 Artifact，资深剪辑师逐条点评，反复做到 Skill 明白什么是好剪辑。\n\n把隐性知识录下来：让顶尖剪辑师边剪边录屏，用 Google Meet 或 Loom 口述为什么这样切、为什么这个节奏、为什么选这段空镜。这些理由就是 Skill 最缺的上下文。\n\n只让最强的剪辑师训练 Skill。\n\n结果是大部分片子第一版或第二版就能过，偶尔要到第三版。这套方法换到写作、设计、客服话术上也成立：用参考样本起底稿，用历史作品批量重做，专家逐条反馈，再把专家做判断时的理由录下来。\n\n4. 人的价值从操作转到品味\n\nAlex 认为技术趋势挡不住，但品味仍然很值钱，因为训练 AI、给 AI 反馈都靠它。有品味的剪辑师会更值钱，没有的会越来越难。\n\nSabba 从另一头说了同一件事：初剪做对 80%～90% 已经不错，要做到优秀，靠的是反复迭代，创作者怎么给反馈、怎么让片子带上自己的风格，才是这类工具真正的价值所在。\n\n5. 推广的分工：负责人搭框架，最强的人教 AI\n\nAlex 说，团队里推动 AI 的人搭好第一版就该让开。他说自己不是团队里最会剪的，他的工作是搭一套环境，让最会剪的人去训练 Skill。\n\n在我看来，这同时化解了 Sabba 说的抵触问题：最可能反对的资深剪辑师，变成了教 AI 的人。另外他提醒要给资深剪辑师留出专门的时间，前期会有一段效率下降的阶段，不留时间，做出来的 Skill 质量一般，也省不了多少时间。\n\n6. 两人的分歧，以及分歧背后的立场\n\nAlex 全程在 Claude 对话里完成；Sabba 认为视频涉及时间轴和画面上的空间位置，只靠聊天不够，需要更复杂的界面。\n\nSabba 还认为品牌一致性和可重复性没解决，比如 Casey Neistat（风格很鲜明的 YouTube 博主）的视频一看就是他的，品牌方也需要在几百条视频里保持这种一致。但 Alex 那套“按风格拆 Skill + 反馈循环”的做法，本身就是在用户这一侧解决可重复性。\n\n分歧有两个来源。Alex 做的是广告，时长短、套路固定、量大，最适合交给 AI。Sabba 是卖工具的，更好的界面正是他的生意。\n\n7. 瓶颈会转移\n\nSabba 判断，剪辑变得几乎不费力后，创作者数量会暴增，拍摄和录制可能成为最大的瓶颈。Alex 说，他原以为还要 3～6 个月才能做到的事，现在已经能做了。\n\n8. 给做工具的人的判断\n\nSabba 认为这个市场不会一家通吃，就像 Cursor 往大企业走、Lovable 服务不懂技术的用户。\n\n基础剪辑撑不起长期优势，Anthropic、Google、OpenAI 迟早都会做；差异化要靠更深的工作流、垂直场景和好用的手机端。\n\n他还建议不要重造专业剪辑软件的时间线，那个太难做，专心做好初剪，再方便地交给现有专业软件。", "createdAt": "Wed Oct 28 03:20:14 +0000 2026", "replyCount": 130, "retweetCount": 57, "likeCount": 396, "conversationId": "2115282464935473225", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115185432870662545", "text": "My thoughts on the agentic video editing wave:\n\n1. There won't be one winner in agentic video editing. Speed, use case and workflow will always matter. Just as Cursor moves upmarket while Lovable caters to non-technical users, specialised video tools will continue to serve different audiences, even as general-purpose agents improve.\n\n2. Every major AI leap unlocks new product categories. Since GPT-3.5, we've seen coding, 3D and presentations. Opus 5.5 and Google's vision-language models are now unlocking agentic video editing. The edits still look more like websites than videos, but this is the worst they'll ever be.\n\n3. Editing costs will collapse, and the number of creators will explode. Basic edits could go from dollars to cents within a year, with huge speed improvements. Frontier models will still command a premium. As editing becomes effortless, recording content might be the biggest bottleneck.\n\n4. The best editors might be the biggest critics of agentic editing. Just as experienced engineers initially resisted AI-generated code over quality and maintainability, I think professional editors will eventually come around as the tools improve.\n\n5. The real magic is in iteration. Getting 80–90% of an edit right on the first attempt is great, but making it excellent requires much more iteration. The way creators give feedback, refine edits and make videos feel distinctly theirs is where these tools will become truly magical\n\n6. Anthropic's focus on coding enabled agents to build videos using HTML/CSS, SVG, browser rendering and OpenCV. Packages like Hyperframes, Rebooshed and VEED's OpenEdit gave LLMs editing capabilities they previously lacked. Opus 5.5 now makes many of those use cases redundant.\n\n7. Chat alone won't be enough for video editing. Chat will be central, but video operates across time and X, Y and Z coordinates. More sophisticated UI will be needed to make great edits.\n\n8. Brand consistency and repeatability remain unsolved. A Casey Neistat video feels distinctly his because of intentional creative decisions. Creators and brands need that same predictability across hundreds of edits. Even vibe coding hasn't solved this well (yet).\n\n9. Basic editing won't be a long-term moat. Anthropic, Google and OpenAI will eventually offer it. Deeper workflows, specialised use cases and excellent mobile experiences will drive differentiation.\n\n10. Don't reinvent professional editing tools. Building non-linear timelines is incredibly hard. Agentic video tools should focus on creating great first cuts and making it easy to hand them off to existing professional editing tools.\n\nOverall, the next six months will be noisy!\n\nBut video editing has never been winner-take-all.\n\nAnd I do NOT think that will change.\n\nHope this helps.", "createdAt": "Tue Oct 27 20:54:40 +0000 2026", "replyCount": 34, "retweetCount": 14, "likeCount": 242, "conversationId": "2115185432870662545", "author": {"username": "sab8a", "name": "Sabba Keynejad", "profileImageUrl": "https://pbs.twimg.com/profile_images/2113640909849976833/5Fd1o17i_normal.jpg"}, "authorId": "557014525", "translationZh": "我对智能体视频剪辑浪潮的一些看法：\n\n1. 智能体视频剪辑不会只有一个赢家。速度、使用场景和工作流始终重要。就像 Cursor 向高端市场拓展，而 Lovable 服务于非技术用户一样，即使通用智能体不断进步，专业视频工具仍会服务于不同人群。\n\n2. 每一次 AI 的重大飞跃，都会催生新的产品类别。自 GPT-3.5 以来，我们已经看到了编程、3D 和演示文稿工具。如今，Opus 5.5 和 Google 的视觉语言模型正在开启智能体视频剪辑。现在剪出来的东西看着还更像网页，而不像视频，但这已经是它们最差的水平了。\n\n3. 剪辑成本会大幅下降，创作者数量会激增。一年之内，基础剪辑的成本可能从几美元降到几美分，速度也会大幅提升。前沿模型仍会保持较高定价。当剪辑变得轻而易举，录制内容可能反而成为最大的瓶颈。\n\n4. 最优秀的剪辑师，可能也是智能体剪辑最严厉的批评者。就像经验丰富的工程师起初因质量和可维护性问题抵触 AI 生成代码一样，我认为，随着工具完善，专业剪辑师最终也会接受它们。\n\n5. 真正的魔力在于迭代。第一次就完成 80%–90% 的剪辑固然很好，但要做到出色，还需要更多轮打磨。创作者如何提出反馈、细化剪辑，让视频呈现鲜明的个人风格，才是这些工具真正发挥魔力的地方。\n\n6. Anthropic 对编程的专注，让智能体能够利用 HTML/CSS、SVG、浏览器渲染和 OpenCV 制作视频。Hyperframes、Rebooshed 和 VEED 的 OpenEdit 等软件包，赋予了 LLM 过去不具备的剪辑能力。如今，Opus 5.5 已经让其中许多用途无需再依赖这些工具。\n\n7. 仅靠聊天不足以完成视频剪辑。聊天会是核心交互方式，但视频涉及时间以及 X、Y、Z 坐标。要剪出优秀的作品，还需要更完善的用户界面。\n\n8. 品牌一致性和可复现性仍未解决。Casey Neistat 的视频有鲜明的个人风格，源于他有意识的创作选择。创作者和品牌需要在数百次剪辑中保持同样的可预期性。即使是氛围编程，目前也还没很好地解决这个问题。\n\n9. 基础剪辑不会成为长期护城河。Anthropic、Google 和 OpenAI 最终都会提供这项能力。更深入的工作流、专业场景和出色的移动端体验，才会带来差异化。\n\n10. 不要重新打造专业剪辑工具。构建非线性时间线极其困难。智能体视频工具应该专注于生成优秀的初剪版本，并让用户能够轻松将其交接给现有的专业剪辑工具。\n\n总的来说，未来六个月会非常热闹！\n\n但视频剪辑从来都不是赢家通吃的市场。\n\n我也完全不认为这一点会改变。\n\n希望这些想法对你有帮助。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVr9C5nW4AAvB2y.jpg", "width": 2048, "height": 1190, "previewUrl": "https://pbs.twimg.com/media/HVr9C5nW4AAvB2y.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVr9o2XXgAAogwU.jpg", "width": 2048, "height": 1143, "previewUrl": "https://pbs.twimg.com/media/HVr9o2XXgAAogwU.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-28T03:20:14+00:00", "createdAtBeijing": "2026-10-28T11:20:14+08:00", "createdAtLocal": "10-28 11:20 北京", "url": "https://x.com/dotey/status/2115282464935473225", "themeId": "editorial", "signalScore": 83, "editorial": {"id": "2115282464935473225", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "视频剪辑Agent与专家反馈方法", "evidence": "让顶尖剪辑师边剪边录屏", "rationale": "包含自述实验、样本训练和专家反馈的可复用流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115508498607833290", "track": "research", "source": {"id": "2115508498607833290", "text": "Google 发布 Gemini 4 Carbon，综合榜排第一，本周只给网络安全防御团队用，普通用户和开发者还要等\n\nGoogle 10 月 28 日发布新模型 Gemini 4 Carbon，离上一个模型 Gemini 4 Argon 只隔了两周。在第三方评测机构 Artificial Analysis 的综合排行榜（v5.0 版）上，Carbon 59 分排第一，比 Claude Opus 5.5 高 1 分，比 GPT-6 Astra 高 2 分。\n\n这次你暂时用不上。Argon 发布当天，Google AI Pro、Ultra 订阅用户和付费 API 开发者就能用；Carbon 本周只给“一部分网络安全防御者”，之后通过 Fairwind 计划放给更多合作方，再往后才轮到开发者、企业和普通用户。哪天开放，官方没说，Sundar Pichai 在推文里只说“很快”。\n\nFairwind 是 Google 让网络安全防御方提前用新模型的计划，Argon 时就有。按官网说明，名额优先给国家网络安全机构、医疗电信能源金融等关键基础设施运营方和大型科技平台，要经 Google Cloud 客户团队申请、做背景审查，只能给内部安全团队用。普通人和一般公司进不去。\n\n【多少钱】\n\nAPI 价格和 Argon 一样：引入价每 100 万 token（模型处理文字的基本单位）输入 2 美元、输出 10 美元，引入期过后涨到 4 美元和 20 美元。Argon 的引入价到 11 月 30 日为止，Carbon 的引入期到哪天官方没说。会不会进 Gemini App、要哪档订阅，官方也没说。\n\n【比 Argon 和别家强在哪】\n\nGoogle 说 Carbon 能连续跑好几天，碰到死胡同会自己换路，适合在大型代码库里追查隐蔽 bug 再修好。按 Google 内部测试，它写出安全代码的成功率是 Argon 的两倍多，没有依据的说法少了约一半。\n\nGoogle 公布的对比表有 17 项测试，Carbon 拿了 15 项第一。没赢的两项：写代码的 FrontierSWE 2，GPT-6 Astra 65.5%，Carbon 61.2%；操作电脑的 OSWorld，Claude Opus 5.5 87.2%，Carbon 81.5%。表里别家的分数大多取自各家自己公布的数字或公开榜单，有几项是 Google 自己跑的。\n\n【安全分数高，是不是能帮人黑系统】\n\nPichai 推文里的三个分数，对应安全团队处理漏洞的三步。\n\n找漏洞：SEC-bench Pro 88.2%。题目是浏览器 JavaScript 引擎里真实出现过的漏洞，模型要自己找到，并写出一小段代码证明漏洞确实存在。这项是 Google 自己跑的，GPT-6 Astra 85.4%。\n\n确认漏洞能不能被利用：ExploitGym 54.8%。模型在断网的隔离环境里，针对已知漏洞写出能攻进测试程序的代码。安全团队靠这一步排优先级，能被利用的先修。GPT-6 Astra 42.4%，Claude Opus 5.5 34.5%。\n\n修漏洞：CWE-bench 71.0%。由第三方 Collinear 出题打分，模型要修好真实开源项目里的漏洞，修完攻击失效、原有测试全部通过才算对。\n\n同样的本事，落到坏人手里也能用来攻击。Google 写明这些分数是关掉安全防护后测的。它的做法是先只给审查过的防御方用，同时参加美国政府自愿的发布前模型测试，等调整好防护再向开发者和普通用户开放。\n\n官方博客：https://t.co/1rdUKZrzxV\n评测方法：https://t.co/uGewSKk8xe", "createdAt": "Wed Oct 28 18:18:24 +0000 2026", "replyCount": 8, "retweetCount": 2, "likeCount": 30, "conversationId": "2115508498607833290", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115489219804352921", "text": "I did say we'd be releasing our models periodically...introducing Gemini 4 Carbon, our next frontier model.\n\nFollowing Argon's release just two weeks ago, Carbon shows the pace at which we’re pushing the frontier, it ranks #1 on the recently updated v5.0 of @ArtificialAnlys Intelligence Index at 59. It also leads across key cybersecurity evaluations scoring 88.2% on SEC-bench Pro for finding vulnerabilities, 54.8% on ExploitGym for exploitation, and 71.0% on CWE-bench for patching.\n\nWe’re seeing significant improvements in long-horizon tasks even compared to Argon, and we’ve strengthened frontier safeguards.\n\nAs we did with Argon, we’re going to roll it out gradually + responsibly. Some trusted cyber defenders will get access starting this week. We'll be expanding it to more partners through our Fairwind Program, ahead of wider availability soon, so hang tight!", "createdAt": "Wed Oct 28 17:01:48 +0000 2026", "replyCount": 1453, "retweetCount": 1708, "likeCount": 22623, "conversationId": "2115489219804352921", "author": {"username": "sundarpichai", "name": "Sundar Pichai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_normal.jpg"}, "authorId": "14130366", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVu5GHmbUAAppsK.jpg", "width": 2048, "height": 1724, "previewUrl": "https://pbs.twimg.com/media/HVu5GHmbUAAppsK.jpg:small"}], "translationZh": "我确实说过，我们会定期发布模型……现在推出我们的下一款前沿模型 Gemini 4 Carbon。\n\n距离 Argon 发布仅两周，Carbon 就展现了我们推进前沿能力的速度：在近期更新的 @ArtificialAnlys Intelligence Index v5.0 中，它以 59 分排名第一。它在关键网络安全评测中也处于领先地位：漏洞发现评测 SEC-bench Pro 得分 88.2%，漏洞利用评测 ExploitGym 得分 54.8%，漏洞修复评测 CWE-bench 得分 71.0%。\n\n即使与 Argon 相比，它在长周期任务上的表现也有显著提升，我们还加强了前沿模型的安全防护。\n\n与 Argon 一样，我们将以负责任的方式逐步开放。本周起，部分受信任的网络防御人员将获得访问权限。我们将通过 Fairwind Program 向更多合作伙伴开放，并很快扩大开放范围，敬请期待！"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-28T18:18:24+00:00", "createdAtBeijing": "2026-10-29T02:18:24+08:00", "createdAtLocal": "10-29 02:18 北京", "url": "https://x.com/dotey/status/2115508498607833290", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2115508498607833290", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Gemini 4 Carbon发布与安全评测", "evidence": "Carbon 本周只给“一部分网络安全防御者”", "rationale": "提供模型发布、评测及开放范围，标明厂商口径"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115577135762919483", "track": "growth", "source": {"id": "2115577135762919483", "text": "红果日活 1.68 亿、人均每天两小时：秦朔说“字节时间”来了，程苓峰说这才刚开始\n\n同一份数据，两篇文章，两个结论。野村证券 9 月的报告援引 QuestMobile 数据：今年 7 月，在中国使用时长排前 50 的 App 里，抖音第一次超过微信，字节系合计占 40.9%，腾讯系占 29.1%。\n\n《第一财经日报》原总编辑秦朔据此写了《可怕的红果与中国互联网的字节时间》，担心红果这类算法机器正在吃掉人们的时间。\n\n公众号“神在吗”的作者程苓峰 10 月 28 日接着写了《肉鸡时间》，认为份额只是表面，AI 短剧才是真正的“核爆”。两篇文章都在传的“红果年入 400 亿”，红果官方已经声明不实。\n\n【红果有多能占时间】\n\n秦朔引用的报告显示，红果 7 月日活 1.68 亿，一年翻了一倍，超过腾讯视频、爱奇艺、优酷、芒果 TV 四家相加（约 1.55 亿，未去重）。按使用总时长，红果已是中国第四大 App，排在抖音、微信、抖音极速版之后；今年 2 月人均每天看 125 分钟，比抖音和微信还长。\n\n用户数上红果还差得远：微信日活 9 亿多，抖音 7 亿多。红果赢的是每个人花在上面的时间。\n\n【秦朔：红果是一台时间吸收器】\n\n秦朔把红果跑得快归结为四点。\n\n1. 算法：每集 1 到 3 分钟，集集结尾留悬念，手指一滑就是下一集。\n\n2. 供给：广电总局公布，今年前 8 个月全国上线微短剧 43 万部，是去年全年的 13 倍，其中 AI 剧超过九成。\n\n3. 生态：在抖音刷到剧情片段，一键跳到红果看全集；番茄小说提供原著，秦朔文中说，去年的爆款短剧六成以上改编自番茄小说。\n\n4. 免费：看剧不花钱，只看广告，平台拿广告收入给创作者分账。\n\n腾讯刚在微信小程序里推出“绿泡泡短剧”应战，秦朔不看好。\n\n秦朔打了个比方：字节所有 App 共用一套算法底座，像同一个酒瓶倒出不同的酒；腾讯靠社交起家，各个产品各用各的瓶子。秦朔还提到，在抖音和红果上看什么，朋友不知道，也就没有发朋友圈那种顾虑。\n\n秦朔最在意代价。每天 125 分钟，意味着读书、思考、陪家人的时间少了。\n\n秦朔预计短剧会分化成 K 型：底层是海量 AI 爽剧，顶层是少量真人精品，夹在中间的真人短剧最难过。秦朔也认为，时间多不等于价值高，腾讯在精品内容和中老年用户上仍有底盘。\n\n刹车已经出现。9 月 1 日起施行的《微短剧发展管理办法》要求 AI 内容逐集标注，禁止平台用诱导沉迷的算法。红果 10 月 21 日宣布下线“看剧赚金币”：11 月 1 日起新用户不再有这个功能，12 月 31 日前全部下线，已攒下的金币和余额不受影响。\n\n【抖音的反驳】\n\n抖音集团副总裁李亮两次在微博回应，说“字节时间”不严谨：数据只算前 50 个 App，没算长尾 App 和电脑端；字节系最新的 41.8% 也没过半；短剧和短视频是充分竞争的行业，没有谁能一直第一。\n\n秦朔 10 月 28 日回应说，“字节时间”是对注意力流向的概括，并非垄断认定。\n\n【程苓峰：要看速度，AI 短剧是另一种东西】\n\n程苓峰认为份额过没过半不重要。一年前字节系和腾讯系差不到 3 个点，现在差 13 个点，跑得快的一方会吸走所有新增的时间。\n\n程苓峰把红果的优势叫作“三低合一”：番茄小说的网文省了剧本成本，字节的视频生成模型 Seedance 省了拍摄和演员成本，抖音流量便宜还能先放片段试水，省了拉新成本。\n\n秦朔和程苓峰都看了穿越剧《持械入宋》。\n\n秦朔说它比以前的短剧多样，有内涵也有专业性，但耗时、容易陷进去。程苓峰在里面看出了一场创业：主角用现代知识造火炮、改弩机，为了拿到铁料去考科举，再一点点组织人手，按未来的地图改造旧世界。\n\n程苓峰还刷到讲急诊分诊、大闸蟹养殖、货车司机生活的剧，觉得这些短剧像一部百科全书。\n\n所以程苓峰主张把真人短剧和 AI 短剧分开看。抖音的内容是普通用户拍的，短而散，算法负责把内容送到你面前；AI 短剧是一个懂行的编剧加 AI 拍出来的，一季上百集，往一个行业越挖越深，AI 用在把内容做出来。\n\n程苓峰预计下一步 AI 两头都管：内容生成得比人看得快，每个人看到的剧情都不一样，广告直接编进情节。\n\n到那时会分成两条路：\n1. 免费的娱乐加广告，普通观众毫无招架之力，程苓峰称之为“肉鸡”；\n2. 收费的教育，因材施教，逼人往上走。\n\n【两人的分歧】\n\n秦朔认为监管和金币下线会让红果从狂奔回到常规，短剧也不会杀死长内容，就像方便面没有取代正餐。程苓峰认为这才是“核爆当夜”，引用朋友的话说“字节没有上限”。\n\n两人都担心沉迷。秦朔担心的是人的注意力和耐心被算法重塑；程苓峰担心的是社会更加 K 型，少数人借 AI 往上走，多数人被娱乐吞掉。\n\n【数字靠不靠得住】\n\n字节系、腾讯系的时长份额有出处，来自野村报告援引的 QuestMobile 数据，7 月是 40.9% 对 29.1%（秦朔引用），8 月是 41.8% 对 28.6%（程苓峰引用），统计范围只有前 50 个 App。\n\n红果“第四大 App”“人均 125 分钟”出自同一份第三方报告，红果官方没有确认。\n\n“前 8 个月 43 万部、AI 剧超九成”是广电总局网络视听司司长王小亮在国新办发布会上公布的。\n\n程苓峰文中“红果今年收入 400 亿”，红果 10 月 27 日晚已声明不实，并称网传的机构数据和专家预计都不是官方信息。\n\n拿来对比的“电影总票房 520 亿”是 2025 年全年数字，国家电影局公布为 518.32 亿元。\n\n秦朔原文：https://t.co/BmFxhLJmJF\n程苓峰原文：https://t.co/rHLhiUlGi5\n秦朔与李亮的争论：https://t.co/YovnaVNbSp\n红果辟谣 400 亿：https://t.co/6w4Lr3NUse\n红果下线金币：https://t.co/btpXOtoDYM\n43 万部微短剧：https://t.co/MvlHxlvAQU", "createdAt": "Wed Oct 28 22:51:09 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2115577135762919483", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVwJPwaW4AAWUTF.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVwJPwaW4AAWUTF.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-28T22:51:09+00:00", "createdAtBeijing": "2026-10-29T06:51:09+08:00", "createdAtLocal": "10-29 06:51 北京", "url": "https://x.com/dotey/status/2115577135762919483", "themeId": "editorial", "signalScore": 51, "editorial": {"id": "2115577135762919483", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "AI短剧的供给、获客与广告变现", "evidence": "先放片段试水，省了拉新成本", "rationale": "梳理短剧运营链路，区分第三方数据与辟谣"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115439137407009193", "track": "agent", "source": {"id": "2115439137407009193", "text": "Entire：专为「人和 Agent 一起写代码」做的新一代 Git 托管\n\n前 Github CEO 创办的 @GoEntire 不做另一个「像 GitHub 的网站」，是把代码托管、评审、CI 和 Agent 会话记忆，都按「人机协作写代码」重做：用 Trail 代替以 diff 为主的 PR 时间线，用分布式 Git 服务扛 Agent 高频推送，再用 Continuous Memory 把会话和决策写回仓库，让下一轮 Agent 不必从零重学。\nhttps://t.co/IztavEEbbc\n\n为什么说传统 PR 不够用了\nEntire 团队认为，现在编码 Agent 和评审 Agent 会在同一个 PR 里来回留长文、改代码、再审一轮。对人类来说，这条时间线越来越像「只有 Agent 在读的审计日志」，很难一眼判断：循环是否已经稳定、能不能放心合并。Trail 想把关键信息提到页面顶部（每次推送后由 Agent 打出的评估分数，以及尚未关闭的问题）让人先看「够不够稳」，再决定合不合。\n\nTrail：评审的三步\n1. 开一条 Trail：可以从 bug / 功能需求开，也可以像开 PR 一样，从 Agent 侧在动手前后直接开。一条 Trail 可以跨多个仓库，把本该一起合的改动绑在一起。\n\n2. 每次推送都跑评估：推代码后，评审 Agent 在云沙箱里各自打分并写理由，文中用花样滑冰评委作比。Entire 自用仓库里常见的例子包括 Security、Slop（废话 / 滥生成）、Human Review Required。每种评估会展示最近几次分数走势；分数偏橙时，可以继续让编码 Agent 按反馈改到变绿。文章强调：单次一梭子往往漏关键问题，多轮循环、分数稳住才靠谱。预置有代码质量、安全、Slop 等 Agent，可按仓库开关；也可用界面或仓库里的 .json 自定义。底层用 Claude Code、Codex 等，沙箱由 Daytona、E2B 提供。\n\n3. 关掉未解决问题再合并：Agent 还能返回具体 finding 和建议修复，并标严重级别。未关闭的会一直挂在 Trail 上，已解决的默认收起。人和 Agent 都可以处理或驳回。仓库可开门禁：例如必须人批、CI 通过、关键 finding 清完，才允许合。\n\nCI：先接 Buildkite 与 Depot\nEntire 团队强调：Agent 写得越快，CI 越要当「改动是否超出提示意图」的安全网。CI 配在 项目 级（同一项目下多仓库常共用一套基建）。Buildkite 接上后，每次推送在 Buildkite 或自有基建上构建，结果作为 Trail 上的检查项，失败可挡合并；Agent 也可走 Buildkite API / CLI / MCP 自己闭环。若原来用 GitHub Actions，可用 bk pipeline convert 迁移。Depot 兼容 GitHub Actions 工作流、中间不必再经 GitHub；depot ci migrate 可发现并迁工作流，并支持导入 secrets / variables。按秒计费，跑得快相对更省。\n\n分布式托管与推送速度\nEntire 自研兼容 Git 的源码服务，配分布式对象存储和事务性 ref 数据库。文章给出自家开源基准：推送最高约比 GitHub 快 89 倍、比 Cursor Origin 快约 6 倍；表里粗算吞吐是 Entire 约 418 次/秒，GitHub 约 4.7，Cursor 约 65，Pierre 约 15，GitLab 约 10。可在多区域复制或只留一地，满足驻留与扩展；当前已开 美国、欧盟、澳大利亚、印度。仓库挂在组织或个人账号下的 项目 里，建项目时选主区域再复制。\n\n用法分三种：在 Entire 原生建仓（网页或 CLI）；用 GitHub App 镜像，GitHub 仍可当真相源，Trail 也能叠在 PR 上；镜像时推送仍走 GitHub，GitHub 挂了时镜像还能继续 clone / fetch，Agent 可推到以 entire/unmirrored/ 为前缀的分支；或 迁移（美国镜像可 Detach，也可用 entire-migrate 插件，或本地 fetch 再 push）。\n\nContinuous Memory：把理解也写进仓库\nEntire 团队把 CI / CD 对代码的汇合与发布，类比到「理解」也要持续往前传：仓库应成为 Agent 真正需要的记忆。CLI 里两个开源、本地优先的插件配合工作：\n· entire-graph：用 tree-sitter 在本地解析，给出仓库的预计算地图（排序搜索、定义、调用方、类型、路由、改动影响，并带 文件:行号），文中称测试里可省最多约 71% token；不联网、不调模型、不查 API Key。\n· entire-brain：在 graph 之上索引过去的 Agent 会话（经 Entire CLI 记进 Git 历史），把「为什么这么改」绑到「改了什么」上。也可接到 Entire 后端，让团队记忆共享；每条 Trail 会展示 Agent 留下的记忆，方便评审看见当时决策。举例：修计费舍入 bug 时，graph 追调用链和测试，brain 则提供当初意图、已上线修复及上次改动踩过的坑。", "createdAt": "Wed Oct 28 13:42:47 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 13, "conversationId": "2115439137407009193", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuMqYdaYAAjQJ_.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVuMqYdaYAAjQJ_.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T13:42:47+00:00", "createdAtBeijing": "2026-10-28T21:42:47+08:00", "createdAtLocal": "10-28 21:42 北京", "url": "https://x.com/shao__meng/status/2115439137407009193", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2115439137407009193", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Entire 人机协作代码托管与持续记忆", "evidence": "用 Trail 代替以 diff 为主的 PR 时间线", "rationale": "详述评审、CI与记忆机制；性能属团队自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115247718608310389", "track": "growth", "source": {"id": "2115247718608310389", "text": "用 Coding Agent 按固定栈做出能赚钱的消费级 AI App\n\n@blakeandersonw 开源的「ai-app-playbook」，是一份给 coding agent 执行的操作规程：人机分工走完选品 → 搭建 → 上架 → 首月盈利；技术栈固定在 Cloudflare 全家桶，并明确列出一长串「别用」。\nhttps://t.co/G1zD5Yikef\n\n它是什么 - 两层结构：\n· 给人看的章节 playbook/00–13：从找 niche、用智能体写代码，到后端、库、登录、模型、客户端、付费、数据、设计、留存、分发、成本、合规。\n· 给 Agent 看的 AGENTS.md：Phase 0–14，每步标 [AGENT] / [HUMAN]；动手前有 Gate A（评分够、有需求信号、单位经济说得通才开工）。仓库还带 templates/（Worker、Better Auth、wrangler、应用级 AGENTS.app.md）。用法很直白：clone，空目录里把 Claude Code / OpenCode 指到 AGENTS.md。\n\n产品方向\n默认做「对人有用、人愿意付钱」的消费端：健身、专注、学习、平静等。一句模板：对 [谁]，[App] 把 [输入] 变成 [结果]，几秒内完成。 七维打分（痛感、频率、可演示、AI 是核心、愿付费、能触达、低风险），≥25/35 且无单项 1 分才考虑做。明确避开：泛聊天机器人、平台很快免费化的能力、以诊疗建议为核心、没供给的双边市场、靠应用商店硬啃企业销售。\n\n赚钱假设（作者写明是对照基准，不是目标）\n默认约 $30/年 + 试用。漏斗粗算：下载 × 30% 开试用 × 30% 付费 × $30 ≈ 每下载 $2.70（约 9% 下载变付费用户）。成本表标注 2026-10-26 牌价；作者称自家栈（Cloudflare + Superwall + Tinybird + DeepSeek 等）在各规模下约占收入 2.5%（不含商店抽成与投放）。对比表里把 Vercel、Supabase、Clerk、前沿大模型等标成「Popular」，倍数差很大。\n\n技术栈（强制）与反栈\n· 用：Workers（普通 fetch，不套框架）+ D1 纯 SQL（放大后 PlanetScale via Hyperdrive）+ R2/KV/DO/Queues 等；Better Auth；AI 默认 OpenRouter → DeepSeek（经 AI Gateway），量大可上 https://t.co/7pS44wKG7o / RunPod；支付 Superwall（端）+ Stripe（Web）；分析与错误 Tinybird；端：SwiftUI、RN 或 Kotlin、React + Vite；包管理 bun。\n· 不用：Vercel、Netlify、Lovable、Bolt、v0、Firebase/Supabase、Clerk/Auth0、Sentry/PostHog、Next.js、Hono、Drizzle/Prisma 等一长串。原则是：栈做不了就停下来问人，别偷偷加依赖。\n\n阶段节奏（摘要）\nGate A 过关后：Brief → 账号与仓库 → 后端与库 → 登录（匿名优先）→ AI（流式、超时兜底、成本记账、evals）→ Web / iOS / Android → 支付与权益校验 → 漏斗事件进 Tinybird → 引导打磨 → 留存（推送、连续打卡、邮件）→ 上架合规 → 冲首批约 1000 下载（短视频、创作者平台 SideShift/Trybe、私信）→ 每周一个漏斗实验 + 一个产品修补。人负责账号、真机签字、发版与生产；智能体不碰生产数据与生产部署。", "createdAt": "Wed Oct 28 01:02:10 +0000 2026", "replyCount": 14, "retweetCount": 3, "likeCount": 14, "conversationId": "2115247718608310389", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114760716301557847", "text": "Here's my current tech stack for scaling consumer apps in 2026.\n\nIt's by far the best &amp; cheapest stack for agent-native development ⬇️\nhttps://t.co/0yqdwDeCp5", "createdAt": "Mon Oct 26 16:46:59 +0000 2026", "replyCount": 67, "retweetCount": 52, "likeCount": 1318, "conversationId": "2114760716301557847", "author": {"username": "blakeandersonw", "name": "Blake Anderson", "profileImageUrl": "https://pbs.twimg.com/profile_images/1973883240776937476/uZNUKr-K_normal.jpg"}, "authorId": "1589334828704571394", "translationZh": "这是我在 2026 年用于规模化发展消费级应用的技术栈。\n\n对于智能体原生开发来说，这绝对是最好、最便宜的技术栈 ⬇️\nhttps://t.co/0yqdwDeCp5"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrelCobYAAsvsw.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVrelCobYAAsvsw.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T01:02:10+00:00", "createdAtBeijing": "2026-10-28T09:02:10+08:00", "createdAtLocal": "10-28 09:02 北京", "url": "https://x.com/shao__meng/status/2115247718608310389", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2115247718608310389", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "消费级 AI App 开发与盈利操作手册", "evidence": "每周一个漏斗实验 + 一个产品修补", "rationale": "提供选品评分、付费漏斗与分发流程，收益待验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115483616830517654", "track": "enterprise", "source": {"id": "2115483616830517654", "text": "Claude 上线法律工具库：查引文、审合同、追新法规，打开就能用\n\nAnthropic 10 月 28 日给 Claude for Legal（今年 5 月推出的法律版 Claude）加了一个工具库。库里是一批现成的 Artifacts，也就是在 Claude 里直接能用、能分享给同事的小工具，比如跟踪表和看板。\n\n每个工具打开先放一个示例，律师看明白了，再换成自己的文件。工具给出的每个结论都附原文出处链接，方便核对。\n\n【律师能拿它干什么】\n\nAnthropic 自己做了 6 个。官方的分工是：律师提供材料，Claude 出初稿，律师下判断。\n\n查引文：把文书和它引用的材料逐条对照，引文对不上、页码写错、出处撑不起论点，都标出来。\n\n合同偏差检查：拿合同和公司标准条款比，哪条不一样就标出来，转给有权批准例外的人。\n\n合同批量摘录：一堆合同里你关心的条款，比如遣散费、竞业限制，抽成一张表，每格都能点回原文。\n\n另外三个分别是：同一法律问题在各州、各国的规定对比表，把邮件和委托书汇成“谁负责、下一步、哪天截止”的案件看板，以及按公司业务排出即将生效的新法规时间线。\n\n律所和法律科技公司也往库里放了工具。比如普华永道用团队过去的案例和模板自动起草传票答复初稿；法律 AI 公司 Harvey 让业务部门在 Claude 里直接提法律问题，常规问题按法务部的指引自动答，其余转给律师。\n\n另有 9 个帮普通人获得法律帮助的公益工具，比如把移民文件翻成大白话、帮律师查房东租金账单的错，官方介绍的几个大多注明只适用美国某个州或地区的法律。\n\n【资料怎么接、能不能共享】\n\nClaude 现有 60 多个法律类连接器（让 Claude 直接读取外部系统的接口），包括 Bloomberg Law 等，律师不用手动上传文件。工具可以分享给公司其他部门、客户和合作方，官方说共享设置支持律所的“信息隔离墙”，也就是让代理利益冲突客户的不同团队互相看不到对方资料。\n\n【谁能用、要不要钱】\n\n官方文章归在 Claude Enterprise（企业版）类别下，入口在 Claude 的工具库页面。哪些套餐能用、要不要额外付费，官方没说。企业想大规模部署，官方建议找销售或德勤、毕马威等实施伙伴。\n\n工具库：https://t.co/lfqtlUJboy\n官方原文：https://t.co/wwQKg1pNRR", "createdAt": "Wed Oct 28 16:39:32 +0000 2026", "replyCount": 21, "retweetCount": 4, "likeCount": 26, "conversationId": "2115483616830517654", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115467192276025500", "text": "New in Claude for Legal: a gallery of ready-made artifacts for contract review, regulatory horizon scans, cite checks, and more.\n\nStart from the built-in example, add your own documents and connectors, and share it with anyone across the business. https://t.co/Wn2VK2HeMU", "createdAt": "Wed Oct 28 15:34:16 +0000 2026", "replyCount": 578, "retweetCount": 1089, "likeCount": 19385, "conversationId": "2115467192276025500", "author": {"username": "claudeai", "name": "Claude", "profileImageUrl": "https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_normal.jpg"}, "authorId": "1943306828697550848", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115463032663072768/img/tiCUaCcDwMwVRih8.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115463032663072768/img/tiCUaCcDwMwVRih8.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115463032663072768/vid/avc1/1920x1080/TT9SzYHp-Pbwafs4.mp4?tag=29", "durationMs": 73000}], "translationZh": "Claude for Legal 新增功能：预制 artifacts 模板库，涵盖合同审查、监管动态前瞻、引文核查等场景。\n\n从内置示例入手，添加你自己的文档和连接器，即可与企业内的任何人共享。https://t.co/Wn2VK2HeMU"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-28T16:39:32+00:00", "createdAtBeijing": "2026-10-29T00:39:32+08:00", "createdAtLocal": "10-29 00:39 北京", "url": "https://x.com/dotey/status/2115483616830517654", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2115483616830517654", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Claude 法律工具库与法务协作落地", "evidence": "每个结论都附原文出处链接", "rationale": "介绍具体发布、六类法务流程及共享部署边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115252887882539279", "track": "agent", "source": {"id": "2115252887882539279", "text": "多智能体时代，工程师要解的是基建、身份、隔离与急停\n\nAnthroic 平台负责人 @katelyn_lesse 认为：工程师的「身份危机」被看反了，模型再强，多智能体要做出可信结果，仍靠人把基础设施、身份与授权、安全隔离、可观测与急停做对；这些题大多还空着，正是未来一两年工程师的主战场。\n\n背景：从人机对话到成群持久智能体\n智能体从「人在环里的聊天」走到更长程、上云；再出现编排器拉子智能体、以及打分/顾问/「做梦」等非执行角色。下一步想象是成千上万个智能体长期协作，去做严肃研究、发现、硬件设计。能力边界外移时，一批软件工程问题已经冒出来。\n\n问题一：基础设施要换思路\nKubernetes 擅长无状态副本或稳定编号的有状态 Pod；智能体更像隔离、有状态、单实例的负载：可能长时间空闲，大量时间在等工具、推理、其他智能体或人。有的要冷启动快，有的要少浪费算力，有的要极端扩缩。作者点到 AI 基建公司在做新文件系统与沙箱，以及 Google 的 Agent Substrate 一类新运行时，空间还很大。\n\n问题二：身份与访问\n认证侧可借微服务积累：工作负载身份、短时证书代替静态密钥，开始往智能体上套。授权更开放：多数智能体「代表人」拿人的凭证做事，先要分清动作是人做的还是智能体做的；更难的是 on-behalf-of 下的同意：系统跑几周，人如何有意义地批准权限？平台里的「工具调用自动批准」不够，还要更深的权限模型。智能体自有身份、以及智能体之间如何互信，更不成熟。\n\n问题三：安全与隔离\n近月（尤其近几周）核心软件漏洞冒得比补丁快。其上若跑数千持久智能体、写不可信代码、读不可信内容，未修漏洞的危险被放大。作者呼吁在内核、浏览器、运行时、常用库上更有创意地加固。多智能体还有横向扩散：被攻破的智能体把注入指令传给同伴，指令进记忆后被后来者误信，爆炸半径是系统级的。因此动作应落在强隔离沙箱里（详见其沙箱架构博文）。\n\n问题四：监控与急停\n需要跨智能体的 OTel 追踪，且智能体不能改自己的或别人的轨迹；需要监控可触发的 kill switch，一次停住整系统并切断凭证。难点往往是判定「走偏」：善意的死磕（例如反复撞不在白名单的域名）和恶意很像。\n\n对工程师的态度\n结尾是动员而非悲观：觉得技能要贬值的人，恰恰可能是决定这些系统能否被信任、能否去治病而不是闯祸的人。题面大片空白，值得深挖、形成判断。", "createdAt": "Wed Oct 28 01:22:42 +0000 2026", "replyCount": 20, "retweetCount": 1, "likeCount": 22, "conversationId": "2115252887882539279", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114542280535318557", "text": "The new set of problems for engineers to solve", "createdAt": "Mon Oct 26 02:19:00 +0000 2026", "replyCount": 183, "retweetCount": 538, "likeCount": 4402, "conversationId": "2114542280535318557", "author": {"username": "katelyn_lesse", "name": "Katelyn Lesse", "profileImageUrl": "https://pbs.twimg.com/profile_images/1948503623769751556/U1BBp88H_normal.jpg"}, "authorId": "499018916", "article": {"title": "The new set of problems for engineers to solve", "previewText": "A lot of software engineers are going through what can only be described as an identity crisis. The job has changed a lot. Some are depressed, others are having the time of their lives. There's a", "titleZh": "工程师需要解决的一系列新问题", "previewTextZh": "许多软件工程师正在经历一场只能称为身份认同危机的变化。这份工作已经大不相同。有些人情绪低落，另一些人却乐在其中。还有一个……"}, "translationZh": "工程师需要解决的一系列新问题"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrjR7QaoAAtuNu.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVrjR7QaoAAtuNu.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T01:22:42+00:00", "createdAtBeijing": "2026-10-28T09:22:42+08:00", "createdAtLocal": "10-28 09:22 北京", "url": "https://x.com/shao__meng/status/2115252887882539279", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2115252887882539279", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "持久多智能体基础设施与安全设计", "evidence": "一次停住整系统并切断凭证", "rationale": "具体讨论身份授权、隔离、追踪与急停设计问题"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115247299941093408", "track": "research", "source": {"id": "2115247299941093408", "text": "if you work in RSI/autoresearch/curiosity-based system, this blog is a must read. super well-written, and its design imo is the best practice for such system (tho after42 today is for theoretical hardcore researchers) it also shows that most such autoresearch question proposed by frontier intelligence are compositional (97%), e.g. marrying existing ideas, real OOD questions are super rare.\nhttps://t.co/2rWE1c2eg1", "createdAt": "Wed Oct 28 01:00:30 +0000 2026", "replyCount": 15, "retweetCount": 41, "likeCount": 484, "conversationId": "2115247299941093408", "author": {"username": "hxiao", "name": "Han Xiao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, "authorId": "28969465", "quotedTweet": {"id": "2115113813620211818", "text": "AI is now taking on some of the hardest open problems that scientists have posed. But research is broader than solving problems. Can AI also propose research questions that experts find genuinely interesting?\n\nWe built After42 to find out. Experts judged 45 of its 135 final questions genuinely interesting, across mathematics, statistics, theoretical computer science, and physics, with wide variation across subfields.\n\nThe key idea: develop questions by trying to solve them.\n\nWe also asked whether AI can judge which questions are interesting. We find that model judges' top choices align with expert consensus but do not consistently capture individual experts' preferences.\n\nWe release the expert-assessed questions as an open resource for researchers to discuss, refine, and pursue, as a step toward integrating AI into the broader research enterprise.\n\nhttps://t.co/iOrs6L7E9Y", "createdAt": "Tue Oct 27 16:10:04 +0000 2026", "replyCount": 28, "retweetCount": 80, "likeCount": 340, "conversationId": "2115113813620211818", "author": {"username": "FanNie1208", "name": "Fan Nie", "profileImageUrl": "https://pbs.twimg.com/profile_images/1957557603745296386/uDAj48vV_normal.jpg"}, "authorId": "1765238885247066112", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115113545520283648/img/RcAYb8qVLXFSw0LB.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115113545520283648/img/RcAYb8qVLXFSw0LB.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115113545520283648/vid/avc1/1920x1080/eR-JBgWzWbFujIZ1.mp4?tag=29", "durationMs": 183200}], "translationZh": "AI 如今正在挑战科学家提出的一些最难的未解问题。但研究不只是解题。AI 能否也提出让专家真正感兴趣的研究问题？\n\n我们构建了 After42 来寻找答案。它最终提出的 135 个问题中，有 45 个被专家评为真正有趣，涵盖数学、统计学、理论计算机科学和物理学，各细分领域的结果差异很大。\n\n核心思路是：通过尝试解答来完善问题。\n\n我们还探究了 AI 能否判断哪些问题有趣。我们发现，模型评审最看好的问题与专家共识一致，但无法稳定捕捉个别专家的偏好。\n\n我们将这些经过专家评估的问题作为开放资源发布，供研究者讨论、完善和探索，以此推动 AI 融入更广泛的科研活动。\n\nhttps://t.co/iOrs6L7E9Y"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrbRSWWoAAAYhD.jpg", "width": 1524, "height": 1318, "previewUrl": "https://pbs.twimg.com/media/HVrbRSWWoAAAYhD.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVrclAiX0AAehcS.jpg", "width": 1508, "height": 648, "previewUrl": "https://pbs.twimg.com/media/HVrclAiX0AAehcS.jpg:small"}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "肖涵 Han Xiao", "role": "模型、研究与推理实践与观察", "why": "有端侧检索、ANE/GPU 对比与资源取舍，兼顾研究和真实产品。", "handle": "hxiao"}, "createdAtIso": "2026-10-28T01:00:30+00:00", "createdAtBeijing": "2026-10-28T09:00:30+08:00", "createdAtLocal": "10-28 09:00 北京", "url": "https://x.com/hxiao/status/2115247299941093408", "themeId": "editorial", "signalScore": 82, "editorial": {"id": "2115247299941093408", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "After42研究问题生成与专家评估", "evidence": "45 of its 135 final questions", "rationale": "提出边求解边发展问题的方法，报告专家评估并开放问题"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "如果你从事 RSI、自动研究或好奇心驱动系统的开发，这篇博客必读。文章写得非常好，我认为其中的设计是这类系统的最佳实践（不过，目前的 After42 面向的是硬核理论研究者）。它还表明，前沿智能提出的这类自动研究问题大多属于组合型（97%），例如结合已有想法，真正的分布外（OOD）问题极其罕见。\nhttps://t.co/2rWE1c2eg1"}, "avatar": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, {"id": "2115531348161028374", "track": "research", "source": {"id": "2115531348161028374", "text": "Super interesting result: H-Net learns to dynamically tokenize variable names in coding data as separate tokens, and it scales much better on code compared to BPE", "createdAt": "Wed Oct 28 19:49:12 +0000 2026", "replyCount": 8, "retweetCount": 8, "likeCount": 164, "conversationId": "2115531348161028374", "author": {"username": "tri_dao", "name": "Tri Dao", "profileImageUrl": "https://pbs.twimg.com/profile_images/1389486324516671496/owa9Z4AC_normal.jpg"}, "authorId": "568879807", "quotedTweet": {"id": "2115502110578290900", "text": "I've always believed that intelligence should come from simple, general building blocks that learn their own abstractions directly from raw data; in other words, the bitter lesson. I think we're finally seeing a real step towards AI that can learn from all data.\n\nLanguage modeling on raw bytes is a microcosm of this ideal, and to me it's a central problem in AI: if we can't build LLMs that learn end-to-end from bytes, how will we handle the rest of the world's data that we understand even less?\n\nLast year we introduced hierarchical networks (H-Nets) as a first step. Our new version finds up to 3-5x efficiency gains in controlled scaling law experiments, and at larger scale matches an open-source model trained on 11T tokens with ~10x less data and compute. The posts below walk through what we found and why we think it works.", "createdAt": "Wed Oct 28 17:53:01 +0000 2026", "replyCount": 101, "retweetCount": 271, "likeCount": 2613, "conversationId": "2115502110578290900", "author": {"username": "_albertgu", "name": "Albert Gu", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011884912593551360/voG84B15_normal.jpg"}, "authorId": "1076265378118959104", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HVvH33RaQAE6DlQ.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HVvH33RaQAE6DlQ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115501577012461568/vid/avc1/1920x1080/Yjs4MoGlnchqw209.mp4?tag=29", "durationMs": 78912}], "translationZh": "我一直相信，智能应当源于简单、通用的基础模块，由它们直接从原始数据中学习自己的抽象表示；换句话说，就是「苦涩的教训」。我认为，我们终于朝着能从所有数据中学习的 AI 迈出了实质性的一步。\n\n基于原始字节进行语言建模，是这一理想的缩影。在我看来，这也是 AI 的核心问题之一：如果我们连能从字节端到端学习的 LLM 都造不出来，又该如何处理世界上那些我们理解得更少的数据？\n\n去年，我们推出了分层网络（H-Nets），作为第一步。在受控的缩放定律实验中，新版本实现了最高 3–5 倍的效率提升；在更大规模下，仅用约十分之一的数据和计算量，就达到了一个使用 11 万亿 token 训练的开源模型的水平。下面的帖子会详细介绍我们的发现，以及我们认为它奏效的原因。"}, "expert": {"priority": "P0", "domain": "AI 基础设施 / 训练优化", "name": "Tri Dao", "role": "Together AI；FlashAttention 作者", "why": "训练/推理效率、Attention Kernel、底层性能优化", "handle": "tri_dao"}, "createdAtIso": "2026-10-28T19:49:12+00:00", "createdAtBeijing": "2026-10-29T03:49:12+08:00", "createdAtLocal": "10-29 03:49 北京", "url": "https://x.com/tri_dao/status/2115531348161028374", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2115531348161028374", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "H-Net动态分词与字节建模效率", "evidence": "H-Net learns to dynamically tokenize", "rationale": "报告代码动态分词与受控扩展实验，收益为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "一个非常有意思的结果：H-Net 学会了动态分词，将代码数据中的变量名单独划分为 token，而且随着规模扩大，它在代码上的表现提升远胜于 BPE。"}, "avatar": "https://pbs.twimg.com/profile_images/1389486324516671496/owa9Z4AC_normal.jpg"}, {"id": "2115367068120092697", "track": "research", "source": {"id": "2115367068120092697", "text": "AA的智能指数评分升级到了V5版本。这个调整挺好，我甚至觉得每次只有在benchmark题目变更的时候，跑出来的结果才是真正有效的。\n\n可以让之前针对跑分优化的模型无处遁形。", "createdAt": "Wed Oct 28 08:56:25 +0000 2026", "replyCount": 12, "retweetCount": 0, "likeCount": 8, "conversationId": "2115367068120092697", "author": {"username": "AlchainHust", "name": "花叔", "profileImageUrl": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, "authorId": "232519529", "quotedTweet": {"id": "2115265133467635877", "text": "Announcing Artificial Analysis Intelligence Index v5, featuring 2 new benchmarks and 3 upgrades. For the first time, the majority of the Index is built on private datasets\n\nThe Artificial Analysis Intelligence Index is our composite measure of model capabilities across tasks reflecting real-world usage today. v5 is our biggest upgrade since v4 launched in January. With v5, 60% of the Index is now based on evaluations with private test sets or held-out answers.\n\nAlongside Intelligence Index v5, we’re launching the Artificial Analysis Progress Index v1, which tracks model capability over time on one continuous scale.\n\nNew to the Intelligence Index:\n\n➤ FrontierCode 2.0: Cognition's newly-launched private benchmark of real-world coding tasks, graded on whether a repository maintainer would merge the agent's change\n\n➤ Terminal-Bench-Science: 70 agentic scientific research tasks, run in a terminal environment\n\nUpgraded:\n\n➤ HLE-Diamond (replacing Humanity's Last Exam): a refined 1,000-question version of Humanity's Last Exam, split evenly between reasoning and knowledge questions\n\n➤ AA-Omniscience v1.1: An updated dataset with saturated and public set questions removed, new questions added, and ambiguous or erroneous questions revised\n\n➤ CritPt v2: a private, 40-question hard subset of CritPt v2, revised by the CritPt authors and run with a code-execution tool\n\nStaying in the Index: AA-Briefcase, AutomationBench-AA, GDP.pdf and Terminal-Bench 4.0\n\nRemoved from the Index: GDPval-AA v2.1, SciCode, and AA-LCR v1.1\n\nKey results:\n\n➤ Claude Opus 5.5 (max) leads at 58, ahead of GPT-6 Astra (max, 57) and GPT-6.1 Sol (max, 55): Anthropic and OpenAI hold the top five models. Gemini 4 Argon (high) is next at 50\n\n➤ The open weights gap widens from 3 points to 12: Kimi K3.1 Pro (weights not yet released) is the top open weights model at 46. Among released weights, DeepSeek V4.1 Flash 1017 (max) and GLM-5.3 (max) lead at 32 - 26 points behind the leader and below Claude Haiku 5.5 (max, 36)\n\n➤ Cost per task varies by more than 13x among the leading models: of the 10 highest-scoring models shown, GPT-6.1 Terra (max) is the cheapest at $0.96 per Intelligence Index task and Claude Fable 5.1 (max) the most expensive at $13.04", "createdAt": "Wed Oct 28 02:11:22 +0000 2026", "replyCount": 553, "retweetCount": 419, "likeCount": 5130, "conversationId": "2115265133467635877", "author": {"username": "ArtificialAnlys", "name": "Artificial Analysis", "profileImageUrl": "https://pbs.twimg.com/profile_images/2042402069320290304/A8C1lP07_normal.jpg"}, "authorId": "1743487864934162432", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrubbmaoAA_Kry.jpg", "width": 1200, "height": 567, "previewUrl": "https://pbs.twimg.com/media/HVrubbmaoAA_Kry.jpg:small"}], "translationZh": "正式推出 Artificial Analysis Intelligence Index v5，新增 2 项基准测试，升级 3 项评测。该指数首次有超过一半的评测基于私有数据集。\n\nArtificial Analysis Intelligence Index 综合衡量模型在各类任务中的能力，反映当前的实际使用场景。v5 是自 1 月推出 v4 以来最大的一次升级。在 v5 中，60% 的指数得分基于使用私有测试集或未公开答案的评测。\n\n与 Intelligence Index v5 同时推出的还有 Artificial Analysis Progress Index v1，它以统一、连续的量表追踪模型能力随时间的变化。\n\nIntelligence Index 新增项目：\n\n➤ FrontierCode 2.0：Cognition 新推出的真实编程任务私有基准，以代码仓库维护者是否愿意合并智能体的修改作为评分标准。\n\n➤ Terminal-Bench-Science：在终端环境中执行的 70 项智能体科研任务。\n\n升级项目：\n\n➤ HLE-Diamond（替代 Humanity's Last Exam）：精炼后的 Humanity's Last Exam，共 1,000 道题，推理题与知识题各占一半。\n\n➤ AA-Omniscience v1.1：更新了数据集，移除模型表现已趋于饱和的题目及公开题集中的题目，新增题目，并修订有歧义或错误的题目。\n\n➤ CritPt v2：由 CritPt 作者修订的私有高难度子集，包含 40 道题，评测时配备代码执行工具。\n\n保留项目：AA-Briefcase、AutomationBench-AA、GDP.pdf 和 Terminal-Bench 4.0。\n\n移除项目：GDPval-AA v2.1、SciCode 和 AA-LCR v1.1。\n\n主要结果：\n\n➤ Claude Opus 5.5 (max) 以 58 分领先，其后是 GPT-6 Astra (max，57 分) 和 GPT-6.1 Sol (max，55 分)：前五名均来自 Anthropic 和 OpenAI。Gemini 4 Argon (high) 以 50 分紧随其后。\n\n➤ 开放权重模型与榜首的差距从 3 分扩大到 12 分：Kimi K3.1 Pro（权重尚未发布）以 46 分成为得分最高的开放权重模型。在已发布权重的模型中，DeepSeek V4.1 Flash 1017 (max) 和 GLM-5.3 (max) 以 32 分并列领先，落后榜首 26 分，也低于 Claude Haiku 5.5 (max，36 分)。\n\n➤ 领先模型之间的单任务成本相差超过 13 倍：在展示的得分最高的 10 个模型中，GPT-6.1 Terra (max) 最便宜，每项 Intelligence Index 任务成本为 0.96 美元；Claude Fable 5.1 (max) 最贵，为 13.04 美元。"}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "花叔", "role": "企业落地与产品组织实践与观察", "why": "将 AI 创作、工具范式和产品实践连接起来，适合跨业务与创作来源。", "handle": "AlchainHust"}, "createdAtIso": "2026-10-28T08:56:25+00:00", "createdAtBeijing": "2026-10-28T16:56:25+08:00", "createdAtLocal": "10-28 16:56 北京", "url": "https://x.com/AlchainHust/status/2115367068120092697", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2115367068120092697", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Artificial Analysis智能指数V5升级", "evidence": "60% of the Index is now based on evaluations", "rationale": "引文披露评测集重大升级及成绩成本对比"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2041105413505220608/Xgv1FKSS_normal.jpg"}, {"id": "2115512767394275550", "track": "agent", "source": {"id": "2115512767394275550", "text": "GitHub Copilot 来刷存在感了，感觉微软做的 AI 产品很多功能都不太实用。“Copilot”已经是个过时的概念，AI 不再是副驾驶，我们希望 AI 去自动驾驶。\n\n日常让 Copilot 审查代码，审查的结果有价值的不多，Office Copilot 也是个半成品，上次想加个定时任务都不行，整体功能和体验比起 Claude Code 和 Codex 差一个量级，即使它能用 Opus 5.5。\n\n--- 下面是这次 GitHub Copilot 更新的总结 ---\n\nGitHub Copilot 能自动挑模型了，免费版也能用；最仔细的新代码审查平均一次约 10 美元\n\nGitHub 在 10 月 28 日的年度大会 Universe 上发布了一批 Copilot 新功能。开发者每天会碰到的变化有两个：Copilot 会自己挑 AI 模型；提交代码后，Copilot 能审得更细，还能自动修好卡住合并的问题。\n\n先说计费：Copilot 按“AI 点数”扣费，1 点等于 1 美分，每个套餐每月送一笔，10 美元一个月的 Pro 送 1500 点。\n\n【Copilot 替你挑模型】\n\n以前要自己在菜单里选 GPT 还是 Claude，选强的贵，选便宜的怕搞不定。新功能 Fusion 按难度安排：简单活交给一个模型；难一点的先让便宜模型写草稿，不过关再换强模型；最难的让一个模型写、几个模型同时挑错。\n\nFusion 今天正式上线，VS Code、JetBrains、命令行和 Copilot 桌面应用都能用。所有套餐（含免费版）都有基础档，更深的 High、Max 档要 39 美元一个月的 Pro+ 或更高套餐。Fusion 不另收费，用了哪些模型就按原价扣点数，高档位一次可能叫好几个模型，扣得更多。11 月 30 日前付费用户打七折。\n\nGitHub 说，在 Artificial Analysis 的编程评测里，Fusion Max 只比 Claude Code 搭配 Opus 5.5 Max 低 2 分，成本约一半。这是 GitHub 自己公布的成绩。\n\n【代码审查和合并】\n\n开发者改完代码要提交“合并请求”（PR），审过才能并进正式代码。Copilot 代码审查新加了最仔细的 Max 档：几家公司的模型各审一遍，再汇总、剔除误报，适合改登录逻辑这类出错代价大的代码。\n\nMax 档还在公开测试，Pro 及以上套餐可用。它不便宜：官方估算平均每次约 10 美元，最多 25 美元，原有的快速档约 0.25 美元。按 Pro 每月 1500 点算，审一次 Max 就用掉三分之二。\n\nCopilot 现在还能正式“批准”PR，算进仓库要求的审批人数，但默认关闭，要管理员打开。PR 页面也多了“Watch and fix”按钮：自动测试没过或代码有冲突时，Copilot 在云端自己去修，付费套餐可用。\n\n【其他】\n\nGitHub Enterprise 企业客户今天起不用单独买 Copilot 座位，按实际用量付费，目前要找销售开通。Copilot 桌面应用新增“项目”功能（公开测试），给一个目标，就能跨多个代码仓库同时派多个 AI agent 干活。\n\n原文：https://t.co/vALjnrAmE8\nFusion：https://t.co/j0xeXGnWtR\n代码审查 Max 与批准：https://t.co/ojmdJuNRU3\n审查价格：https://t.co/nyEm0WAXQ3", "createdAt": "Wed Oct 28 18:35:22 +0000 2026", "replyCount": 15, "retweetCount": 0, "likeCount": 9, "conversationId": "2115512767394275550", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115490856685990244", "text": "We're redefining the SDLC for the agentic era.\n\nLots of GitHub updates this morning at Universe:\n\n• GitHub Copilot Fusion delivers frontier-level quality, 40% faster and at up to 77% lower cost\n\n• Our unified Copilot harness is now in Foundry, a managed service for building long-running agents that reason, use tools, and get work done\n\n• Copilot Projects gives you an orchestration loop to build with multiple agents across repos\n\nAnd we’re expanding capacity and strengthening GitHub’s architecture to make the home of agentic development more resilient.", "createdAt": "Wed Oct 28 17:08:18 +0000 2026", "replyCount": 102, "retweetCount": 107, "likeCount": 895, "conversationId": "2115490856685990244", "author": {"username": "satyanadella", "name": "Satya Nadella", "profileImageUrl": "https://pbs.twimg.com/profile_images/1221837516816306177/_Ld4un5A_normal.jpg"}, "authorId": "20571756", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115478616016560131/img/T63TCUUZgOrxBB31.jpg", "width": 2048, "height": 1075, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115478616016560131/img/T63TCUUZgOrxBB31.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115478616016560131/vid/avc1/2400x1260/LLQ4Mb98e3YvIbys.mp4?tag=29", "durationMs": 10033}], "translationZh": "我们正在为智能体时代重新定义软件开发生命周期（SDLC
