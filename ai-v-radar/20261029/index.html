）。\n\n今天上午的 Universe 大会上，GitHub 发布了多项更新：\n\n• GitHub Copilot Fusion 提供前沿水平的质量，速度提升 40%，成本最高降低 77%\n\n• 我们统一的 Copilot 智能体运行框架现已接入 Foundry。这项托管服务可用于构建长期运行、能够推理、使用工具并完成工作的智能体\n\n• Copilot Projects 提供编排循环，让你调用多个智能体跨代码仓库开展开发\n\n我们也在扩充容量、强化 GitHub 架构，让这个智能体开发平台更加稳健。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-28T18:35:22+00:00", "createdAtBeijing": "2026-10-29T02:35:22+08:00", "createdAtLocal": "10-29 02:35 北京", "url": "https://x.com/dotey/status/2115512767394275550", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2115512767394275550", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Copilot模型路由与代码审查更新", "evidence": "Copilot 现在还能正式“批准”PR", "rationale": "包含模型路由、审查及自动修复的发布细节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115344818230489539", "track": "enterprise", "source": {"id": "2115344818230489539", "text": "跟我之前分享的帖子有点异曲同工👇\n\n比如我现在这套「早报 / 热点 / 素材→推文草稿」本身就是岗位级 Shared Bot 思路，把规则沉淀成可共享、可一次更新的技能，而不是散在各人聊天里。\n\n重点在于：\n\n1.给每个 Bot 四样东西（缺一就容易胡说）\n\nContext：手册、政策、品牌语气、字段定义、禁止事项（放飞书/Notion/技能里）\nPlugins：CRM、邮件、Slack、工单、仓库、浏览器等它真正要碰的系统\n规则技能：何时更新字段、何时只能起草、对外必须人批\n权限：用操作者本人权限；敏感动作（发客户信、改价、退款、删数据）加白名单或专岗 Bot\n\n2.上线顺序固定：爬 → 走 → 跑\n\n只读 + 只内部笔记：能理解、能建议，不碰客户、不写生产。\n起草 + 人闸：改系统前预览确认；对外邮件/回复点发送前必须人过。\n窄场景自动写：规则极清晰的动作（如固定字段更新、已知工单类型）再放开；每次失败回写规则。\n定时/主动：会前简报、早间队列、夜间扫素材——确认稳定后再开 routine。\n\n3.岗位之间要「交棒」，不要一个 Bot 包打\n前一个产出标准化交给下一个：情报 → 报价 → 例外审批；或素材选定 → 写稿 → 人审 → 定时发。例外只进「审批岗」Bot，普通人 Bot 碰不到批折扣/批退款那类权限。\n\n4.留痕迹，方便复盘\n每次自动写系统或建议通过：记结论、理由、是谁（或哪个 DRI）在兜底。一周看一次：哪类总要人改 → 补进技能；哪类几乎零改 → 才考虑减少人闸。\n\nhttps://t.co/qNoYIgWsbc", "createdAt": "Wed Oct 28 07:28:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2115344817114812615", "inReplyToStatusId": "2115344817114812615", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2109814883688796459", "text": "我养了十几个 Grok机器人，起飞！", "createdAt": "Tue Oct 13 01:14:01 +0000 2026", "replyCount": 13, "retweetCount": 44, "likeCount": 293, "conversationId": "2109814883688796459", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "article": {"title": "我养了十几个 Grok机器人，起飞！", "previewText": "大家好。\n还记得年初的龙虾 openclaw 么？最近个人 agent 来了新的大哥，grok bot 简直不要太好用。这几天我又开始废寝忘食了。"}}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-28T07:28:00+00:00", "createdAtBeijing": "2026-10-28T15:28:00+08:00", "createdAtLocal": "10-28 15:28 北京", "url": "https://x.com/sitinme/status/2115344818230489539", "themeId": "editorial", "signalScore": 53, "editorial": {"id": "2115344818230489539", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "岗位共享 Bot 的权限与渐进上线方法", "evidence": "上线顺序固定：爬 → 走 → 跑", "rationale": "提供上下文、权限、人审和复盘的可复用流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115367292200722674", "track": "tools", "source": {"id": "2115367292200722674", "text": "花几个月做的东西，就这么免费开源了！？\n\n真是活菩萨，先点一个star\n\n然后再好好研究👇🏻\nhttps://t.co/6gTWBMOA0s", "createdAt": "Wed Oct 28 08:57:18 +0000 2026", "replyCount": 2, "retweetCount": 19, "likeCount": 144, "conversationId": "2115367292200722674", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2115311202876453351", "text": "我决定将我做了几个月的3d互动教育课程开源，每个月就那么零散的几个订阅单子，太浪费了。\n由于我之前做的AI Saas是北美版，所以在陆续改成国内的版本，目前已经可以开源55门。\n\n🔗 在线用：https://t.co/O4Pm54GHsc\n🔗 GitHub：https://t.co/jwidnvL5ny\n\n覆盖物理、化学、生物、地理四科，按中国高中课标和人教版教材做：合成氨、接触法制硫酸、氯碱工业、高炉炼铁、电流的磁场、光电效应、有丝分裂、神经冲动、三圈环流、厄尔尼诺……\n\n每门课是什么样：\n· 一个 3D 世界，能拖、能转、能剖开看塔里面\n· 右边一台中控台，滑杆和开关每一步都能动，读数和曲线实时变\n· 一条步骤线，老师一路按「下一步」就能讲完一节课，学生没动手的步骤会自动演示\n· 最后一步是考核，有目标值\n\n几个我比较在意的点：\n1. 每门课就是一个 HTML 文件，约 1 MB。拷进 U 盘，双击就能打开，断网、投影、电子白板都能用。\n2. 数字可追溯。每门课先写事实表：教材里的数值带页码，为了教学设的数值单独标「课件设定」并写明理由。课件上出现的每个数都要能在事实表里找到。\n3. 可以下载、可以嵌入学校网站，课程页一键复制嵌入代码。\n\n怎么做出来的：\n为了节约token，我大量使用了DeepSeek，所以效果也没有我做的Sass站那么好，但是整体还可以的。\n\n· DeepSeek 批量查教材、写事实表、搭课件\n· Claude 设计统一的课件外壳和视觉规范，负责审核\n· 图像模型出参考图和封面\n· 每门课在三种屏幕尺寸下逐步跑自动检查（数字、遮挡、对比度、标注有没有压在一起），再由人一步一步看截图，过了才上线\n\nAI 能把速度拉上来，但「讲得对、看得懂」还是要靠一遍遍地审。即便这样，55 门里肯定还有错。如果你是老师或学生，发现科学错误或者画面看不懂的地方，请直接在课程页点「报告错误」，或者在 GitHub 提 Issue，我会一条条修，如果有其他的课程需求，我也会慢慢开发，反正也是Agent在做，我做好了sop，工作量也不大。\n\n接下来：\n· 四科继续往上做，目标全部做完，之后做初中和小学\n· 出英文和其他语言版本\n· 把完整的制作方法写成长文\n\n如果觉得有用，帮忙转给身边的老师，或者给仓库点个 ⭐。也欢迎关注我，我会在这个线程持续分享课程。", "createdAt": "Wed Oct 28 05:14:26 +0000 2026", "replyCount": 156, "retweetCount": 218, "likeCount": 1355, "conversationId": "2115311202876453351", "author": {"username": "CopperForgeAI", "name": "铜匠・十点睡觉", "profileImageUrl": "https://pbs.twimg.com/profile_images/1997218796172611584/gudsBQXU_normal.jpg"}, "authorId": "1207258810512838656", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVsYTzYaIAAwdkp.jpg", "width": 1292, "height": 1067, "previewUrl": "https://pbs.twimg.com/media/HVsYTzYaIAAwdkp.jpg:small"}]}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-10-28T08:57:18+00:00", "createdAtBeijing": "2026-10-28T16:57:18+08:00", "createdAtLocal": "10-28 16:57 北京", "url": "https://x.com/servasyy_ai/status/2115367292200722674", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2115367292200722674", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "55门开源3D互动课程与制作流程", "evidence": "目前已经可以开源55门", "rationale": "自述发布具体资源，并披露核验与制作方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2115253467186954507", "track": "creative", "source": {"id": "2115253467186954507", "text": "先理逻辑，再画页面\n\n不少 AI PPT 工具一上来就排版。PPT Master 的第一步是读材料、搭结构。\n\n流程里有个 Strategist（策略师）角色，先读素材、定核心信息，再从五种讲法里挑一种，比如 pyramid 结论先行，briefing 平铺事实。同一份季度报告，用 pyramid 是先抛结论再一层层给证据，用 briefing 就不预设立场。讲法一换，整份 deck 的骨架都跟着变。\n\n开工前它会停下来跟你确认一次用途、受众、页数和风格。视觉风格内置 18 种，跟讲法可以随便搭。\n\n为什么它出来的 PPT 改得动\n\n我觉得这个项目最聪明的地方在中间这一步：AI 不直接写 PPTX，先写 SVG。\n\nSVG 和 PowerPoint 底层的 DrawingML 其实是一类东西，都用绝对坐标描述 2D 矢量图形，矩形、路径、渐变、阴影基本能一一对上。大模型写 SVG 又很熟练。所以分工是 AI 把每一页画成受约束的 SVG，脚本再把 SVG 编译成 DrawingML，相当于两种方言之间互译。\n\n翻过去的东西都是原生对象：\n\n形状。 箭头、标注框、流程节点用的是 Office 自带的预设形状，调节手柄能拖，连接线也是真的连接线。\n\n图表和表格。 默认导出成可以逐个编辑的形状，在 PowerPoint、WPS、Keynote 里显示一致。导出时加上 --native-charts-and-tables，就换成带数据表的原生图表，右键能编辑数据。\n\n公式和母版。 LaTeX 公式编译成 PowerPoint 的原生公式，不是贴一张图。走模板路线时，生成的是真正的母版和版式，不是在每一页上贴同一个框。\n\nSmartArt 是故意不做的。它的对象模型封闭又脆弱，用普通形状重建反而更稳。", "createdAt": "Wed Oct 28 01:25:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2115253465463021845", "inReplyToStatusId": "2115253465463021845", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVigOlTbYAAU_wh.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HVigOlTbYAAU_wh.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-28T01:25:00+00:00", "createdAtBeijing": "2026-10-28T09:25:00+08:00", "createdAtLocal": "10-28 09:25 北京", "url": "https://x.com/sitinme/status/2115253467186954507", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2115253467186954507", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "PPT Master 叙事规划与可编辑矢量转换", "evidence": "AI 不直接写 PPTX，先写 SVG", "rationale": "解释叙事结构选择及原生可编辑对象生成机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115436497029730538", "track": "creative", "source": {"id": "2115436497029730538", "text": "Apple Creator Studio 大更新：剪辑、图像、音乐、办公一起加上 AI，办公还能被外部 Agent 操作\n\nApple 这次更新大致三个路线：\n1. 把 MotionVFX、Content Hub 里的视频素材、Logic 里更完整的声音浏览等专业内容，收进订阅权益里\n2. 在 Pixelmator、Logic，以及 Keynote、Pages、Numbers 里加入自然语言助手和生成式编辑（多为测试版，且依赖支持 Apple Intelligence 的机型，目前只有美式英语）\n3. 办公三件套支持 MCP，Keynote 还推出面向外部工具和 Agent 的交换格式 .keyx，文档开始按「能被外界读写」来设计\n\n详细内容：https://t.co/2BAjZvAvHk\n\n视频与动效\nFinal Cut Pro（Mac）内置 MotionVFX，模板、转场、跟踪、抠像、调色等元素可达数千种。编辑可在应用里打开 Content Hub，使用苹果整理过的视频、图片和背景，不必离开剪辑流程。时间线上的图片可以直接在 Pixelmator Pro 里打开，改完自动写回工程，不用再导入。项目内也支持按文字生成图片并调整风格。工作流上，关键帧缓动选项更多；片段可以从主故事线断开，放到时间线任意位置；转录语言再增加 23 种。\n\nMotion 也内置 MotionVFX 相关插件（电影感调色、三维相机跟踪、一键选区等），支持按文字生成和修改图片、与 Pixelmator 来回传图、更细的关键帧缓动，以及新的 Displacement 滤镜。Compressor 开始支持编码 iPhone 18 Pro 和 iPhone Duo 拍下的电影效果模式视频。\n\n图像\nPixelmator Pro 新增 Generate Fill：在画面上圈出一块，或用自由选区、快速选区、磁性选区等工具，再用自然语言说明想怎么改。生成结果会尽量贴近周围的光线、透视和纹理；内置超分辨率，放大后仍尽量保持清晰。生成内容可以并进现有图层，也可以作为新图层插入，并带智能蒙版，方便继续微调。\n\n音乐\nLogic Pro 界面改用 Liquid Glass。Mac 上新增智能助手（测试版，苹果自研模型与第三方模型一起用）：可以从一句话开始写歌、搭人声轨，或继续打磨当前工程。浏览器重做，把 loop、乐器、效果等集中到一处；设备端的 music understanding 会自动分析、分类并给声音打标签，也可以拖入一段声音去找相近素材；同时还接入了 Splice 曲库。Stem Splitter 能更细地拆出、替换或平衡鼓组，不必依赖原始分轨。另有 Sergio George 的 Producer Pack；部分 iPhone 上的备忘录录音可用 Studio Sound 降低环境声和底噪，再进 Logic 细调。\n\n办公与自动化\nKeynote、Pages、Numbers 为订阅用户加入应用内助手（苹果模型与 OpenAI），能结合当前文档上下文工作：Keynote 帮忙设计、加动画、改片子；Pages 起草和改写；Numbers 计算、做可视化、整理数据，一键预览合适图表，也能借世界知识建自定义表格。新增 MCP 支持后，外部的 AI Agent 和工具可以直接读取内容、改稿并执行自动化操作。Content Hub 增加股票视频和新的模板主题。Keynote 支持 .keyx：一种基于 JSON 的开放包格式，方便外部工具、开发流程和 Agent 读取。Freeform 增加文本样式与背景色；12 月起还能在 Pixelmator 里改图，并按文字描述生成可编辑的形状。", "createdAt": "Wed Oct 28 13:32:18 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 3, "conversationId": "2115436497029730538", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuKRGybAAARrYq.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVuKRGybAAARrYq.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T13:32:18+00:00", "createdAtBeijing": "2026-10-28T21:32:18+08:00", "createdAtLocal": "10-28 21:32 北京", "url": "https://x.com/shao__meng/status/2115436497029730538", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2115436497029730538", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Apple 创作套件 AI 与自动化更新", "evidence": "Pixelmator Pro 新增 Generate Fill", "rationale": "具体介绍多模态创作功能及限制，发布信息待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115277375487553588", "track": "enterprise", "source": {"id": "2115277375487553588", "text": "这几天有两个开淘宝店的朋友找我，请教我一些 AI 问题。\n\n大概需求是说，他们想让 AI 帮忙对账，把订单、退货、物流、库存和收款都串起来。\n\n我的建议是，用 AI 的时候，先别想着一次性让 AI 全给你替了。里面有哪些环节，咱一步步来，这个事情你要拆解。\n\n比如第一步，你先手动。每天把店里的订单搂出来，放到一个固定的文件夹里。可以只搂当天的，也可以用滚动窗口，每次都拿过去一个月的。关键是数据的变化你能感知到，比如用户三天前买的一笔订单今天退了，你得能搂出来。\n\n然后把这些数据丢给 AI，让它分析今天卖了多少、退了多少、哪些还在路上，再让它把所有经营数据都维护到一个统一的表格里。\n\n你是最了解自己业务的。你想要个什么样的结果，直接告诉 AI，让它自己想方案。再跟它说一句：缺什么数据你管我要，不要猜。这样你就知道 AI 要什么数据了，定时给它喂好就行。\n\n中间它肯定会有算错的地方。那就继续跟它探讨，你为啥这么算？把你算的逻辑公式给我。几轮排查下来，让它把这些计算逻辑都记下来，下次再聊，就能在这个基础上不断迭代了。\n\n这个流程跑通了，才是第二步：能不能让它每天自己去千牛上把数据弄下来，再给我发个微信，告诉我当天的经营情况。\n\n为啥要先亲自手动？前期可能耗费点人力，但这个流程如果你自己没跑通过，其实你根本就描述不清楚你想要啥，AI 也没辙呀。\n\n你不可能一句话就让它帮你运营。业务你自己不清楚的情况下，它给你的东西对还是不对，你也判断不了。", "createdAt": "Wed Oct 28 03:00:00 +0000 2026", "replyCount": 10, "retweetCount": 3, "likeCount": 21, "conversationId": "2115277375487553588", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-10-28T03:00:00+00:00", "createdAtBeijing": "2026-10-28T11:00:00+08:00", "createdAtLocal": "10-28 11:00 北京", "url": "https://x.com/jinchenma_ai/status/2115277375487553588", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2115277375487553588", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "电商AI对账的分步落地方法", "evidence": "缺什么数据你管我要，不要猜", "rationale": "明确数据采集、退货追踪、公式核查到自动化的实施顺序"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2115470840611721424", "track": "agent", "source": {"id": "2115470840611721424", "text": "本文是我和 @raft_hq 的 Joint Channel 里的 Agent Tison 来回 Battle 数轮的成果 😇\n\n不得不说，Joint Channel 确实是杀手级特性 🥵\n\nhttps://t.co/SUGWGFD06S 用 PG 承载核心业务状态，RisingWave 维护收件箱与未读数等实时视图，Redis 负责服务间协同。如果把随 Agent 数量激增的运行 Trace 和长周期产品事件也塞进同一个 PG 库里，PG 基本是扛不住。\n\n接入 ScopeDB 后，服务端、Daemon 和端侧的 Trace 与产品事件直接写进同一套基于对象存储的列式底座，固定列和动态 JSON 属性共存于一张表里。即使事件字段变化也不需要频繁改表，更没有维护 ETL Pipeline 的负担。\n\n实际跑起来以后，我们发现 Agent 写 ScopeDB 的查询语言 ScopeQL 也比传统 SQL 稳得多。\n\n因为 Agent 排查问题的推理过程是线性的：先圈定生产环境与时间窗 → 按 span_id 或 uuid 去重 → 按版本和错误原因进行聚合对比。\n\n传统 SQL 要写“先去重、再做两阶段漏斗聚合”，往往要套多层 CTE 或子查询，Agent 生成查询时很容易搞丢字段作用域；而在 ScopeQL 里，它就是一条从上到下顺着写的线性管道：\n\nFROM -> WHERE -> DISTINCT ON -> GROUP BY -> AGGREGATE\n\n下条链接到全文，包含完整的架构拆解、交互式故障排查过程，以及实际的 ScopeQL 查询示例。", "createdAt": "Wed Oct 28 15:48:46 +0000 2026", "replyCount": 4, "retweetCount": 2, "likeCount": 31, "conversationId": "2115470840611721424", "author": {"username": "tison1096", "name": "tison", "profileImageUrl": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, "authorId": "740784709878288384", "quotedTweet": {"id": "2115469629795832118", "text": "How does @raft_hq scale agent logs and product analytics with ScopeDB?\n\nWhile PostgreSQL, RisingWave, and Redis run live workflows, ScopeDB gives Raft's engineers and observability agents a shared source of evidence for release checks and product funnels 👇 https://t.co/KOv8N5onLa", "createdAt": "Wed Oct 28 15:43:57 +0000 2026", "replyCount": 1, "retweetCount": 1, "likeCount": 8, "conversationId": "2115469629795832118", "author": {"username": "scopedbio", "name": "ScopeDB", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952366949192925184/XIAANiVa_normal.jpg"}, "authorId": "1918079432730001413", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVulMoCbIAAqAyO.jpg", "width": 1602, "height": 1282, "previewUrl": "https://pbs.twimg.com/media/HVulMoCbIAAqAyO.jpg:small"}], "translationZh": "@raft_hq 如何借助 ScopeDB 扩展智能体日志和产品分析能力？\n\nPostgreSQL、RisingWave 和 Redis 支撑实时工作流，ScopeDB 则为 Raft 的工程师和可观测性智能体提供共享的数据依据，用于发布检查和产品漏斗分析 👇 https://t.co/KOv8N5onLa"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "tison（陈梓立）", "role": "Agent 与开发工具实践与观察", "why": "公开 Agent 参与版本变更确认、验收和测试治理，企业工程价值具体。", "handle": "tison1096"}, "createdAtIso": "2026-10-28T15:48:46+00:00", "createdAtBeijing": "2026-10-28T23:48:46+08:00", "createdAtLocal": "10-28 23:48 北京", "url": "https://x.com/tison1096/status/2115470840611721424", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2115470840611721424", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent 日志架构与线性查询实践", "evidence": "固定列和动态 JSON 属性共存于一张表里", "rationale": "含架构分工和查询步骤，性能比较尚属自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, {"id": "2115432646155387283", "track": "growth", "source": {"id": "2115432646155387283", "text": "把网站体检、内容诊断和 AI 搜索优化搬进 Claude Code\n\n做网站的人，往往不是不知道 SEO 重要，而是不知道从哪里下手。\n\n打开 Search Console，看见曝光和点击；打开测速工具，看见一串性能指标；再换一个工具查结构化数据、死链、站点地图。数据有了，新的问题又来了：到底哪些值得先修？改哪个模板？修好以后怎么知道有效？\n\nClaude SEO它把这些原本分散的检查组织成 Claude Code 里的一套工作流：给它一个网站，调用不同方向的技能和代理，收集问题，再输出带优先级的行动计划。\n\n作为 Claude Code 插件运行。仓库中的核心构成包括：\n\n·Skills：用 Markdown 写成的任务说明、检查流程与判断规则。\n·专门代理：分别处理技术、内容、Schema、性能、AI 搜索等任务。\n·Python 脚本与浏览器工具：负责抓取、渲染、解析、调用 API、存储快照和生成报告。\n·参考文件：按需读取的检查清单、行业模板和方法说明。\n·可选扩展：连接外部 SEO 数据、抓取服务、分析系统和图片生成服务。\n\n因此，把它说成“一个 SEO 提示词”太简单了；把它说成“内置全球关键词、排名和外链数据库的平台”，又会高估它的数据能力。更准确的定位，是一套运行在编程代理里的 SEO 审计与分析工作流。", "createdAt": "Wed Oct 28 13:17:00 +0000 2026", "replyCount": 5, "retweetCount": 1, "likeCount": 6, "conversationId": "2115432646155387283", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2085543157140464016", "text": "出海SEO实战：我给网站搭了一套页面监控流水线", "createdAt": "Fri Aug 07 01:46:50 +0000 2026", "replyCount": 2, "retweetCount": 1, "likeCount": 6, "conversationId": "2085543157140464016", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "article": {"title": "出海SEO实战：我给网站搭了一套页面监控流水线", "previewText": "页面怎么进入监控\n这套流程用了两个页面来源，一个是 Git 代码变更，一个是 Sitemap。\nGit 变更负责告诉系统“发生了什么”。系统每天读取网站主分支的变化，识别新增、修改和删除的公开页面，同时记录提交人和"}}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVnqP7vaYAABzJ6.png", "width": 711, "height": 756, "previewUrl": "https://pbs.twimg.com/media/HVnqP7vaYAABzJ6.png:small"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HVnqv0vbEAA8iuK.jpg", "width": 800, "height": 450, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HVnqv0vbEAA8iuK.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HVnqv0vbEAA8iuK.mp4"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HVnqv7abEAAB1qX.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HVnqv7abEAAB1qX.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HVnqv7abEAAB1qX.mp4"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVnqzQDbUAAzkJk.jpg", "width": 1200, "height": 751, "previewUrl": "https://pbs.twimg.com/media/HVnqzQDbUAAzkJk.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-28T13:17:00+00:00", "createdAtBeijing": "2026-10-28T21:17:00+08:00", "createdAtLocal": "10-28 21:17 北京", "url": "https://x.com/sitinme/status/2115432646155387283", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2115432646155387283", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "Claude Code网站SEO审计工作流", "evidence": "收集问题，再输出带优先级的行动计划", "rationale": "具体介绍插件组成、任务流程及数据能力边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115465921439707215", "track": "growth", "source": {"id": "2115465921439707215", "text": "wok，原来邮箱有这么多的skill在github！！这十个完全可以做成工作流！！！真的太值得做跨境相关业务的老板们去用了，以及如果说你想要去做FDE，你可以把这几个Skill去融入到你的工作台里面去交付给你的客户，以及我发现真的有人和我一样，因为不看邮件错过太多事情了\n\n查客户、写开发信、跟进回信、整理询价表，再到准备报价和出货单据，我这次整理了 10 个相关项目，都是能够让你的效率翻100倍的！！！\n\n这些东西真的离生意很近！！！你拿进去的是客户资料和邮件，想拿出来的是能继续推进这笔业务的东西\n\n1、先拿开发一个海外客户来说，手里还没有名单，可以先看 market-intel\n\n把自己的公司和产品资料准备好，它从公开网页找海外企业客户，整理成带来源的线索表，使用前需要配置网页检索工具\n\nhttps://t.co/5zh2dudVT0\n\n2、名单已经有了，但资料东一份西一份，就看 trade-lead-screening\n\n它把客户资料统一整理，标出缺失信息、匹配依据和待核对项，方便你逐个判断哪些值得继续查\n\nhttps://t.co/4jwPMdFVlc\n\n3、你手里有一家公司的官网，想把自己的产品卖给它，总得先知道对方做什么、自己的产品和它有什么关系\n\ntrade-customer-intel 就是做这件事的，按公开资料整理公司情况，再找有依据的销售切入点\n\nhttps://t.co/PXhIyl8goi\n\n4、这份资料确认完，再交给 trade-outreach-email，把你的产品信息一起放进去，就能围绕这个客户准备英文开发信草稿\n\n对方回了什么、前面承诺过什么，再把真实往来接着给它，继续准备下一封信\n\nhttps://t.co/niBL3YzoUi\n\n5、如果你主要卡在第一封信怎么开口，也可以看 cold-email，专门打磨第一次联系陌生企业客户时的邮件主题、正文和后续跟进\n\n产品和客户资料给具体，它才有东西可以围绕着写\n\nhttps://t.co/0cQTA1hGi7\n\n6、第一封发完，后面还要继续联系，可以看 laifaxin-outreach\n\n它把首轮开发信、多轮跟进、客户回信后的回复思路整理成一套流程，配合来发信使用，发送安排自己确认\n\nhttps://t.co/YUHOapwOhw\n\n7、再往后看，连询价附件都有很具体的项目\n\nrfq-to-quotation 专门把英文、俄文的紧固件询价 Excel，整理成内部中文报价表，报价员再填单价\n\nhttps://t.co/ZMZD1CYCj8\n\n8、trade-pipeline-run 则按询价单和买卖方资料，准备报价单、形式发票、商业发票、装箱单\n\n这个需要安装整个项目、配置资料，价格和正式单据仍要自己核对\n\nhttps://t.co/B2m45N6YTp\n\n9、做相关品类的，直接拿一份旧询价表去试，和自己原来的处理结果对一下，就知道它有没有帮上忙\n\n客户买过一次，后面怎么保持联系，也有对应的 emails\n\n欢迎邮件、购买后沟通、老客户唤回，可以先把这一组邮件的内容规划好，自动发送还需要接邮件平台\n\nhttps://t.co/TMiHC0mgEN\n\n10、还有一种情况，邮箱里已经聊了很多事，但今天先回谁、哪件事还在等对方，得重新翻一遍\n\ncowork-inbox-triage 会把邮件分成待决定、待回复、等待对方等状态，再准备回复草稿，面向 Cowork，需要连接 Gmail 或 Microsoft 365 邮箱\n\nhttps://t.co/NPt3wjStP4\n\n11、另外实测过的是网易邮箱大师 Mail Agent，让它把平台收益、品牌合作、联盟推广相关的邮件整理出来，效果也是很不错\n\n入口都放在对应位置了，先收藏，按你现在卡住的那一步选", "createdAt": "Wed Oct 28 15:29:13 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 9, "conversationId": "2115465921439707215", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "quotedTweet": {"id": "2115424897761493302", "text": "沃日了····为什么上学的时候没人教我要用Email，我损失了至少有10000块！！真的，我建议所有出海的人，不管是做自媒体出海，还是建站出海，真的该时不时翻一下自己的邮箱，用下网易邮箱 mail agent ，里面真的会有金矿，出海绝对是一条被低估的路！！\n\n我八百年不用一次邮箱，结果发现·，我竟然错过了这么多的合作！有线上分享的，有已经打款让我赶紧领取的，真的太有必要有一个邮箱管理的Agent了，找了半天，终于找到了本来就做邮箱业务很牛逼的网易，果然还是得是懂业务的品牌，能把这玩意做的好，有了网易邮箱大师的mail agent能省很多事儿\n\n以前从来不相信做自媒体能赚钱，把我正在用的东西分享出去能赚钱时候就只能想到我赚的是流量分成，后来自己做下来才发现，你把真正用过的好东西分享出去，后面可以接上不同的变现方式的，都能赚钱，平台分成是一条，品牌合作是一条，联盟推广又是一条\n\n但我有个很现实的问题：中国人就是懒得查邮箱，我今天让Mail Agent看了一下，真的是吓了一跳，我选了“所有邮件”，直接用中文给它安排任务：“把9月26日到10月26日，与平台收益、品牌合作、联盟推广有关的邮件整理出来，按项目去重，列出最新进展、下一步建议和截止日期，没有的信息不要猜”有的邮件说稿件过了，有的提醒可以领取奖励，有的只是邀请加入推广计划，而这些东西支撑了我每个月大部分的的收入，但我不知道他们竟然都给我发了邮件，因为我真的不喜欢看邮件，真的没有这个习惯\n\n等了大概两分钟，网易邮箱的 Mail Agent它真的把所有的进度都给我整理好了，甚至我让它生成一张表格的时候，它能直接把表格的文件发给我。这就已经是一个不是简单的Chatbot了，这点真的太爽了，而这个东西后面也可以截图下来做成一个我的待办壁纸\n\n到今天我才知道，原来有一个合作的消息，并且想要和我长期合作，我没有看到。原来一些佣金都已经给我了提现提醒，结果我没有看到，都已经过期没有领取，这些加起来至少有1000刀的收入，而且这些东西基本上都是我随手分享出去的，我觉得有用，我就分享给大家了\n\n我真的觉得大家应该赶紧出海，应该赶紧从自媒体开始去做，，因为你会发现，只要你开始做了，那你的内容里面就一定会吸引来合作，还有能够为你变现的线索，然后赶紧把你的网易邮箱用起来，一定要把Mail Agent用起来，不然的话，真的会错过很多很多机会呜呜🥹，都是我的血泪教训", "createdAt": "Wed Oct 28 12:46:12 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 12, "conversationId": "2115424897761493302", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVt_mGTbQAAiCav.jpg", "width": 945, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVt_mGTbQAAiCav.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVt_m-LbMAAZe4y.jpg", "width": 945, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVt_m-LbMAAZe4y.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVt_o6abcAEk5H0.jpg", "width": 870, "height": 1016, "previewUrl": "https://pbs.twimg.com/media/HVt_o6abcAEk5H0.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuX_mRbcAAZWb4.jpg", "width": 1298, "height": 1730, "previewUrl": "https://pbs.twimg.com/media/HVuX_mRbcAAZWb4.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVuZnFTbsAA5wLB.png", "width": 554, "height": 838, "previewUrl": "https://pbs.twimg.com/media/HVuZnFTbsAA5wLB.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVufmcnaYAA11UJ.jpg", "width": 1730, "height": 1604, "previewUrl": "https://pbs.twimg.com/media/HVufmcnaYAA11UJ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "叫我阿杭", "role": "内容、视觉与多模态实践与观察", "why": "公开 Obsidian、录音与自媒体制作流程，直接贴合内容生产需求。", "handle": "Astronaut_1216"}, "createdAtIso": "2026-10-28T15:29:13+00:00", "createdAtBeijing": "2026-10-28T23:29:13+08:00", "createdAtLocal": "10-28 23:29 北京", "url": "https://x.com/Astronaut_1216/status/2115465921439707215", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2115465921439707215", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "跨境获客与邮件跟进技能工作流", "evidence": "整理成带来源的线索表", "rationale": "逐项说明工具用途、配置条件及人工核对环节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, {"id": "2115386342570123756", "track": "creative", "source": {"id": "2115386342570123756", "text": "ArtCraft 怎么用更高效？分享几个实用经验。\n\nArtCraft 最大的优势，就是让我们不用完全依赖提示词，而是通过 2D、3D 场景直接控制画面。不过想用好它，有几个地方值得注意。\n\n1.先搭结构，再生成细节。 不用一开始就追求精美画面，简单几何体就能确定人物位置、构图和镜头。做海报用 2D 就够了，需要多角度、多镜头时再上 3D，没必要把简单事情复杂化。\n\n2.场景负责位置，提示词负责风格。 人物怎么站、镜头怎么拍，直接在场景里调整。提示词主要描述光线、材质和视觉风格，效率会高不少。\n\n3.多镜头尽量复用素材。 人物、服装、道具和场景保持一致，每次只调整一个主要变量。先确定构图，再调整光线和风格，出了问题也更容易排查。\n\n4.先修图片，再生成视频。 静帧没做好就直接转视频，只会浪费更多生成成本。建议先尝试轻微运镜、人物转头这些简单动作，别一上来就做复杂镜头。\n\n当然，ArtCraft 目前也有一些问题，比如生成结果不一定严格遵循场景、部分功能还不稳定、云端模型需要消耗积分，也不能完全离线运行。\n\n但我觉得它的方向非常值得关注：把 AI 从一个只会根据提示词抽卡的工具，变成一个真正可以控制构图、场景和镜头的创作工作台。\n\n现阶段更适合拿来做 AI 短片分镜、广告预演和创意探索，复杂的商业项目还是建议先小规模验证，再正式投入。\n\n🔗：https://t.co/zvx492ZKqW", "createdAt": "Wed Oct 28 10:13:00 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2115386341165003216", "inReplyToStatusId": "2115386341165003216", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-28T10:13:00+00:00", "createdAtBeijing": "2026-10-28T18:13:00+08:00", "createdAtLocal": "10-28 18:13 北京", "url": "https://x.com/sitinme/status/2115386342570123756", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2115386342570123756", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "ArtCraft场景搭建与视频生成实践", "evidence": "场景负责位置，提示词负责风格", "rationale": "提供构图、变量控制和生成成本管理方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115332272152826248", "track": "agent", "source": {"id": "2115332272152826248", "text": "逆向任意顶级 iOS App 设计 ？\n\nReverse Engineer Anything 有 iOS 版本了？哦，原来是三个 Agent Skills：先对照头部 App 学设计、再按 Expo 官方最佳实践搭工程、最后用动效/UI 品味规则做动画，来实现对顶级 iOS App 的复刻。\n\n1. Appllama Skills  设计研究 + 原生感建造标准\nAppllama 是高收入移动 App 的设计库（真实界面、流程、营收/下载语境）。技能两件套：appllama-usage 教智能体怎么当设计总监用 Appllama MCP；appllama-app-design-skill 定 Expo/RN 的建造门槛：HIG、语义色、原生控件、反 slop、导航（push/replace/sheet）、动效是否该有、弹簧跟手速、动画不进 JS 线程、模拟器整段流程逐帧过关。MCP（https://t.co/dSePCKjzuU）属 Pro 计费；设计技能可单独装。\nhttps://t.co/c0OnKxrGxv\n\n2. Expo Skills  官方「怎么把 Expo 做对」\nExpo 团队出品：框架侧含项目结构、Router、动画、原生 UI、设计系统、数据拉取、Web→Native、升级等；服务侧含 EAS 上架、托管、工作流、Update、云模拟器等（标清付费边界）。文档/CLI 仍是权威，技能是帮智能体少走歪路。Claude Code / Codex 可用官方插件；其他 Agent 用 skills CLI。另有 Expo MCP 做装依赖、触发构建、模拟器截图等活活。\nhttps://t.co/s9RgdS6Xiw\n\n3. Emil Kowalski Skills  动效与界面品味\n开源作者有 Vercel、Linear 背景；核心论点是 Agent 缺品味（进场用错 ease-in、实色边框代替半透明阴影等），技能把易错点写成可执行规则。含：总技能 emil-design-eng、animate / animate-expo、严格评审与改进计划、找该不该动的机会、性能、动画词汇、Apple 设计原则、Swift、选 UI 库、原型多版本、移动端「像原生」修补、用极端数据压 UI、Sonner toast 指南等。星标远高于另两个，偏跨 Web/移动的通用动效方法论。\nhttps://t.co/LP5XimFPwx\n\n三个 Skills 怎么配合\nAppllama 回答「学谁、长什么样」；Expo 回答「工程与分发怎么按官方做」；Emil 回答「动效与细节怎样不廉价」。共同载体是 skills. sh / Agent Skills，不是传统「逆向 IPA」工具链。", "createdAt": "Wed Oct 28 06:38:09 +0000 2026", "replyCount": 8, "retweetCount": 5, "likeCount": 33, "conversationId": "2115332272152826248", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114759962044060131", "text": "reverse engineer any ios app.\n\napp design → https://t.co/rhCq0WZIve\nbest practices → https://t.co/BaQpMSbiAt\nanimations → https://t.co/YZVV8SagDO https://t.co/OzB1WoaIu7", "createdAt": "Mon Oct 26 16:43:59 +0000 2026", "replyCount": 26, "retweetCount": 248, "likeCount": 2384, "conversationId": "2114759962044060131", "author": {"username": "jaimintf", "name": "jaimin", "profileImageUrl": "https://pbs.twimg.com/profile_images/2090476714908680202/iA4V5MvL_normal.jpg"}, "authorId": "2082859096542519296", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114759278041198592/img/6L2PQJcilOr-njbf.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114759278041198592/img/6L2PQJcilOr-njbf.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114759278041198592/vid/avc1/3840x2160/AjcSW9mgudXgBwdT.mp4?tag=29", "durationMs": 11532}], "translationZh": "逆向分析任意 iOS 应用。\n\n应用设计 → https://t.co/rhCq0WZIve\n最佳实践 → https://t.co/BaQpMSbiAt\n动画 → https://t.co/YZVV8SagDO https://t.co/OzB1WoaIu7"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVsrd-AacAA4so2.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVsrd-AacAA4so2.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T06:38:09+00:00", "createdAtBeijing": "2026-10-28T14:38:09+08:00", "createdAtLocal": "10-28 14:38 北京", "url": "https://x.com/shao__meng/status/2115332272152826248", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2115332272152826248", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "移动应用设计与工程技能组合", "evidence": "Appllama 回答「学谁、长什么样」", "rationale": "梳理三套技能分工、工程约束与付费边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115366100221501540", "track": "agent", "source": {"id": "2115366100221501540", "text": "假如把我的 AI Coding 经验沉淀成一些最佳实践规则，可以给到大伙复用，会是怎么样的，于是乎，今天一下午我就在琢磨这个事情，手写反复调整后给到大伙，可以让你和你的 Agent 一起去学习。\n\n需求\n1.  从技术实现细节编程转变成许愿式编程，现在模型能力已经住足够强大，你只需要大胆把自己想法说出来，给它提足够高的要求和任务，不要担心 AI 实现不了。\n2. 多给你的 Agent  讲做这件事情的背景和目标，少替他考虑技术细节，告诉它为什么要做，是给谁用的，做成什么样子你认为是最好的，具体的技术细节让它自己去判断，学会放手。\n3. 优先用业界最好的模型，用差模型浪费的时候，一来回让你很不高兴的干活，二来也浪费了很多时间。\n4. 要不要做一个新功能以及加一个新配置、开关的时候，让 Agent 来先问你找你确定，没有人用的功能、开关、文案都不要让他去加，慢慢把这一套你的产品规范让他沉淀起来。\n5. 你的想法可以很大，但是让 Agent 干活的时候，尽量让他每次拆分成最小的可用功能版本，不要一次写非常多的代码，即使提交，这样出问题了你可以随时撤回。\n\n规则                                                                                                                                                            \n6. 让你的 Agent 了解你的说话风格，比如说看看、分析一下这个问题的时候，它只需要去读代码分析问题不要去改代码，你说修复、修改的时候才去动手，每次提交、发布和删除的时候都找你确定。                                                                        \n7. Agent md、CLAUDE md 里面除去重点的项目型要求外，只写代码里面看不出来的那种规则，以及之前被否决过的方案也可以分流进去。对你而言密钥和 token 不要贴给 Agent，贴了就当已经泄露了，立马去更换一个。\n8. 对于Agent必须遵守的规则不要完全信 prompt，可能会拦不住，一定要用规则脚本去限制，让它真实跑一遍通过后才算完成了。\n\n编码\n9. 开始写代码之前，先让 Agent 讲清楚要改什么地方，会影响到什么功能和效果，这样是为了补充你的上下文，方便后面更好判断决策做什么。\n10. 一定要让 Agent 基于项目补充一个能够让自己验证各种结果的脚本，每次特定的时候需要去跑一下验证效果，完成功能后需要检查，让他输出结果给你看，并基于此逐步沉淀你的项目 Agent 测试功能集。\n11. 假如有多个 Agent 同时干活的时候，让他们各自用一份独立的 worktree 代码目录，同时提交的时候只提交自己改的代码，不要碰他人的代码，等到各自改完合到一起，再完整跑一遍测试。\n                                                                                                                                                                                                                                                                                                          \n排查\n12. 修 Bug 的时候先找到原因再去动手，假如两次都没有修好，就去加一些日志看真实的数据以及运行效果，不要盲目去猜问题在哪儿。\n13. 假如尝试修复了3次还不对，直接清空上下文重新写清楚你的问题、诉求，以及尝试过的解法让 Agent 重新开始。                                                        \n\n审查                                                                                                                                                     \n14. 让写代码的 Agent 和 Review 审查代码的 Agent 分开，保持解耦，这样一方不会被另一方带偏。\n15. Review 代码的时候最多让 Agent 跑 3轮，防止跑着停不下来，第二轮开始只看新改动的地方，不要再把之前 Review 的再看一遍。                                                                                                                   \n16. 对于你和 Agent 判断危险的改动，越危险让他查得越深，特别对于删除、付费、发布这种单向门改动你都需要自己去看一遍，点一下，看实际效果。                                                                                                                                                                           \n\n发布\n17. 每次提交的时候，让Agent 写清楚做了什么，怎么去验证这个改动，除了问题怎么来回滚，用于给到后面开发过程中 git 记录本身就是 Agent 的一个非常好的上下文。\n18. 需要对外的功能，可以先给自己用，或者给一批愿意尝鲜的用户使用，不要一上来就全量，可以在你的软件里面假如 beta 更新的开关，防止全量有问题，也是对用户负责。\n18. 先给自己和愿意尝鲜的人用，没问题再发给所有人。                                                                                                              \n\n复盘\n19.  Agent 需要对每一个线上 Bug 和用户反馈的问题都留一个测试案例，每次上线前都来跑一遍，防止继续踩坑，包括你换模型的时候也可以把这些旧问题全部都跑一遍，看看模型是否还行。\n20. 修复问题的时候，让 Agent 学会举一反三，把同类的问题一起修复掉。优化功能的功能，完善视觉的时候也是一样，防止只改一个地方，忘记了其他的地方。", "createdAt": "Wed Oct 28 08:52:34 +0000 2026", "replyCount": 89, "retweetCount": 124, "likeCount": 1051, "conversationId": "2115366100221501540", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVtKM1rboAA_Ztw.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVtKM1rboAA_Ztw.jpg:small"}], "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-10-28T08:52:34+00:00", "createdAtBeijing": "2026-10-28T16:52:34+08:00", "createdAtLocal": "10-28 16:52 北京", "url": "https://x.com/HiTw93/status/2115366100221501540", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2115366100221501540", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AI编程全流程实践规则", "evidence": "一定要用规则脚本去限制", "rationale": "覆盖需求拆分、规则校验、故障定位、独立审查与回归测试"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2115565321201520994", "track": "research", "source": {"id": "2115565321201520994", "text": "https://t.co/sdzxN6UTWO", "createdAt": "Wed Oct 28 22:04:12 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 1, "conversationId": "2115565072734888447", "inReplyToStatusId": "2115565072734888447", "author": {"username": "amasad", "name": "Amjad Masad", "profileImageUrl": "https://pbs.twimg.com/profile_images/1897858917507776512/TRVTyKFk_normal.jpg"}, "authorId": "166138615", "quotedTweet": {"id": "2115553116942975013", "text": "Today we're releasing ViBench 2.0, a benchmark for long-horizon software building. Agents start from an empty project and build a whole product, one feature at a time, without seeing what comes next.\n\nEven the best models (GPT-6.1 Sol, GPT-6 Astra, Opus 5.5) pass every check in only 49-65% of builds.\n\nViBench 2.0 is now part of @FireworksAI_HQ’s Specialized Intelligence Index, with official results from Fireworks’ runs.\n\nRead more: https://t.co/WDbfapcWhC", "createdAt": "Wed Oct 28 21:15:42 +0000 2026", "replyCount": 6, "retweetCount": 5, "likeCount": 35, "conversationId": "2115553116942975013", "author": {"username": "Replit", "name": "Replit ⠕", "profileImageUrl": "https://pbs.twimg.com/profile_images/2031733558952464384/ERrHv3jK_normal.jpg"}, "authorId": "366289783", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVv0ADebwAEHhsr.png", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HVv0ADebwAEHhsr.png:small"}], "translationZh": "今天，我们发布了 ViBench 2.0，这是一项面向长程软件构建任务的基准测试。智能体从空项目起步，逐个功能构建完整产品，且无法提前看到后续任务。\n\n即使是最强的模型（GPT-6.1 Sol、GPT-6 Astra、Opus 5.5），也只有 49–65% 的构建能通过全部检查。\n\nViBench 2.0 现已纳入 @FireworksAI_HQ 的 Specialized Intelligence Index，官方结果来自 Fireworks 的测试运行。\n\n了解更多：https://t.co/WDbfapcWhC"}, "expert": {"priority": "P0", "domain": "AI 编程 / 开发者平台", "name": "Amjad Masad", "role": "Replit / CEO", "why": "AI 应用生成、编码 Agent、开发者平台战略的重要信号源", "handle": "amasad"}, "createdAtIso": "2026-10-28T22:04:12+00:00", "createdAtBeijing": "2026-10-29T06:04:12+08:00", "createdAtLocal": "10-29 06:04 北京", "url": "https://x.com/amasad/status/2115565321201520994", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2115565321201520994", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ViBench 2.0长程软件构建基准", "evidence": "a benchmark for long-horizon software building", "rationale": "引用宣布新版基准，交代任务设计与通过率"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "https://t.co/sdzxN6UTWO"}, "avatar": "https://pbs.twimg.com/profile_images/1897858917507776512/TRVTyKFk_normal.jpg"}, {"id": "2115443720371814478", "track": "agent", "source": {"id": "2115443720371814478", "text": "Today, we’re introducing the Responses API in public preview, made for building agents on Mistral. \n\nEach response returns the model’s answer, its reasoning and its tool calls as separate items, so your app can handle every step more easily than with Chat Completions. \n\nIt works with all chat models hosted by Mistral, including Large 4.", "createdAt": "Wed Oct 28 14:01:00 +0000 2026", "replyCount": 104, "retweetCount": 74, "likeCount": 675, "conversationId": "2115443720371814478", "author": {"username": "MistralAI", "name": "Mistral AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1996905418065375232/mzwynOLB_normal.jpg"}, "authorId": "1667249535519805451", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVtfR8WXEAAXYbh.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HVtfR8WXEAAXYbh.jpg:small"}], "expert": {"priority": "P0", "domain": "基础模型突破", "name": "Mistral AI", "role": "基础模型机构", "why": "五方向 X 主动热点搜索：基础模型突破", "handle": "MistralAI"}, "createdAtIso": "2026-10-28T14:01:00+00:00", "createdAtBeijing": "2026-10-28T22:01:00+08:00", "createdAtLocal": "10-28 22:01 北京", "url": "https://x.com/MistralAI/status/2115443720371814478", "themeId": "editorial", "signalScore": 90, "hotspotMatches": [{"id": "foundation_models", "label": "基础模型突破", "matchedTerms": ["reasoning"]}], "hotspotDirections": ["foundation_models"], "hotspotDirection": "foundation_models", "hotspotDirectionLabel": "基础模型突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2115443720371814478", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Mistral Responses API 公开预览", "evidence": "Responses API in public preview", "rationale": "新接口分离回答、推理和工具调用，便于构建代理"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "今天，我们推出 Responses API 公开预览版，专为在 Mistral 上构建智能体而设计。\n\n每次响应都会将模型的回答、推理和工具调用作为独立条目返回，让你的应用比使用 Chat Completions 更轻松地处理每个步骤。\n\n它支持 Mistral 托管的所有聊天模型，包括 Large 4。"}, "avatar": "https://pbs.twimg.com/profile_images/1996905418065375232/mzwynOLB_normal.jpg"}, {"id": "2115292868713803894", "track": "research", "source": {"id": "2115292868713803894", "text": "39%提升！！prefill 1950 tok/s！\n越来越夸张了！单卡5090这个成绩 https://t.co/5ElAHaaWAs", "createdAt": "Wed Oct 28 04:01:34 +0000 2026", "replyCount": 5, "retweetCount": 2, "likeCount": 33, "conversationId": "2115292868713803894", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2115192611656855639", "text": "DeepSeek-V4.1-Flash prefill on a single RTX 5090: 1,400 → 1,950 t/s (+39%) 🚀\n\nOne idea: stop re-decoding busy experts' weights 3–6× per chunk -decode once to FP16, let cuBLAS do the math.\n\nShipped it upstream to the Strata repo → PR #4366, keen to hear what you think @coldniko https://t.co/PhRQlkwgqf", "createdAt": "Tue Oct 27 21:23:11 +0000 2026", "replyCount": 8, "retweetCount": 5, "likeCount": 111, "conversationId": "2115192611656855639", "author": {"username": "lyesbahi", "name": "Lyes Sbahi", "profileImageUrl": "https://pbs.twimg.com/profile_images/1334115103189454849/MZVzf2zM_normal.jpg"}, "authorId": "154487157", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqrAFPXYAEbC4D.jpg", "width": 992, "height": 510, "previewUrl": "https://pbs.twimg.com/media/HVqrAFPXYAEbC4D.jpg:small"}], "translationZh": "DeepSeek-V4.1-Flash 在单张 RTX 5090 上的预填充速度：1,400 → 1,950 token/秒（+39%）🚀\n\n思路很简单：别再对繁忙专家的权重在每个数据块中重复解码 3–6 次了——只解码一次为 FP16，再交给 cuBLAS 计算。\n\n已向 Strata 上游仓库提交 → PR #4366，很想听听你的看法 @coldniko https://t.co/PhRQlkwgqf"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVsHerja0AAugIh.jpg", "width": 992, "height": 510, "previewUrl": "https://pbs.twimg.com/media/HVsHerja0AAugIh.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-10-28T04:01:34+00:00", "createdAtBeijing": "2026-10-28T12:01:34+08:00", "createdAtLocal": "10-28 12:01 北京", "url": "https://x.com/servasyy_ai/status/2115292868713803894", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2115292868713803894", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "单卡推理预填充优化", "evidence": "decode once to FP16", "rationale": "引用给出权重解码优化、性能自报及PR编号"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2115246437764350161", "track": "research", "source": {"id": "2115246437764350161", "text": "GPT 6.1 Terra is a strong frontier model baseline for document parsing.\n\n✅ It spikes at table parsing, coming in 5th on our overall leaderboard, ahead of 6 Sol and behind Opus 5.5 / Astra\n✅ It is decent at content faithfulness and reading order\n✅ It struggles on layout, charts, and formatting\n\nComing in at ~1c per page, it's not a bad option for table-heavy pages! You can use these alongside specialized OCR solutions (like LlamaParse) that will give more consistent performance across a variety of dimensions. \n\nCheck it out on ParseBench: https://t.co/PWczfhp0OX", "createdAt": "Wed Oct 28 00:57:04 +0000 2026", "replyCount": 51, "retweetCount": 9, "likeCount": 121, "conversationId": "2115246437764350161", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrdZmpacAATP3c.jpg", "width": 2048, "height": 1569, "previewUrl": "https://pbs.twimg.com/media/HVrdZmpacAATP3c.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-10-28T00:57:04+00:00", "createdAtBeijing": "2026-10-28T08:57:04+08:00", "createdAtLocal": "10-28 08:57 北京", "url": "https://x.com/jerryjliu0/status/2115246437764350161", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2115246437764350161", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "文档解析模型基准表现", "evidence": "It struggles on layout, charts, and formatting", "rationale": "提供榜单表现、解析短板及单页成本自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "GPT 6.1 Terra 是文档解析领域表现强劲的前沿模型基线。\n\n✅ 表格解析表现突出，在我们的总榜中排名第 5，领先于 6 Sol，落后于 Opus 5.5 / Astra\n✅ 内容保真度和阅读顺序处理尚可\n✅ 在版面布局、图表和格式处理上表现欠佳\n\n每页成本约 1 美分，对于表格密集的页面来说，是个不错的选择！也可以搭配 LlamaParse 等专用 OCR 方案使用，后者在多个维度上的表现更稳定。\n\n在 ParseBench 上查看：https://t.co/PWczfhp0OX"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2115241876680999405", "track": "research", "source": {"id": "2115241876680999405", "text": "不可思议，2B的模型，能力超过 Qwen3.5 9B 和 Google Gemma3 12B。\n\n端侧模型的春天来了，随便一张游戏卡都能进行微调。\n\n这个精心准备的帖子，我就不赘述了。\n\n找一下他的帕累托斩杀线。\n\n👇 https://t.co/fft7wGqF2i", "createdAt": "Wed Oct 28 00:38:57 +0000 2026", "replyCount": 11, "retweetCount": 19, "likeCount": 182, "conversationId": "2115241876680999405", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2115128329003303107", "text": "Introducing 𝙻𝙵𝙼𝟹: our new generation of Liquid Foundation Models. With a new tri-hybrid architecture and new multimodal encoders, the LFM3 family is the ideal model suite for specialized intelligence.\n\n> 6 model instances, across text, audio, vision, and omni modalities, generative and decision models.\n> 𝙻𝙵𝙼𝟹-𝟷.𝟽𝙱: text, 256k context window.\n> 𝙻𝙵𝙼𝟹-𝚅𝙻-𝟸𝙱: vision-language model with video-input support for spatial understanding\n> 𝙻𝙵𝙼𝟹-𝙰𝚞𝚍𝚒𝚘-𝟸𝙱: tool calls, voice chat, reasoning in 18 languages.\n> 𝙻𝙵𝙼𝟹-𝙾𝚖𝚗𝚒-𝟸𝙱: an omni model combines vision, audio, and language.\n> 𝚍𝟷-𝟸𝙱 and 𝚍𝟷-𝙾𝚖𝚗𝚒-𝟸𝙱: decision models with typed outputs and calibrated probabilities in a single pass. Omni adds audio input.\n> fine-tune on 1 GPU.\n> a new tri-hybrid architecture\n> architecture optimized for 14 processor classes across GPUs, CPUs, and NPUs.\n> 𝙻𝙵𝙼𝟹-𝚅𝙻-𝟸𝙱 is a beast. It performs competitively with Gemma 4 12B (6x larger), and Gemini 3.5 Flash Lite, and GPT-5.6 Luna, with 1.9B parameters.\n> 𝙻𝙵𝙼𝟹-𝟷.𝟽𝙱 is #1 on the Pareto frontier of device intelligence 𝚙𝚒𝚙𝚎𝚝𝚝𝚎.𝚕𝚒𝚚𝚞𝚒𝚍.𝚊𝚒\n\nEvery modality for specialized intelligence. Pick the one that fits your use case, customize it, and run it on-device.\n\n1/ 🧵", "createdAt": "Tue Oct 27 17:07:45 +0000 2026", "replyCount": 475, "retweetCount": 1152, "likeCount": 8380, "conversationId": "2115128329003303107", "author": {"username": "liquidai", "name": "Liquid AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1702611993327251456/PUUuOA4W_normal.jpg"}, "authorId": "1635809139808141320", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115125357439557633/img/X_jB63rlX-TyinU4.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115125357439557633/img/X_jB63rlX-TyinU4.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115125357439557633/vid/avc1/3840x2160/MGX33ddyGxppZZvZ.mp4?tag=29", "durationMs": 137109}], "translationZh": "正式推出 𝙻𝙵𝙼𝟹：新一代 Liquid Foundation Models。凭借全新的三重混合架构和多模态编码器，LFM3 系列成为面向专用智能的理想模型套件。\n\n> 6 款模型，覆盖文本、音频、视觉和全模态，包括生成模型和决策模型。\n> 𝙻𝙵𝙼𝟹-𝟷.𝟽𝙱：文本模型，支持 256k 上下文窗口。\n> 𝙻𝙵𝙼𝟹-𝚅𝙻-𝟸𝙱：视觉语言模型，支持视频输入，实现空间理解。\n> 𝙻𝙵𝙼𝟹-𝙰𝚞𝚍𝚒𝚘-𝟸𝙱：支持工具调用、语音聊天，以及 18 种语言的推理。\n> 𝙻𝙵𝙼𝟹-𝙾𝚖𝚗𝚒-𝟸𝙱：融合视觉、音频和语言的全模态模型。\n> 𝚍𝟷-𝟸𝙱 和 𝚍𝟷-𝙾𝚖𝚗𝚒-𝟸𝙱：决策模型，单次前向计算即可输出指定类型的结果和经过校准的概率。Omni 版本额外支持音频输入。\n> 单张 GPU 即可微调。\n> 全新的三重混合架构。\n> 针对涵盖 GPU、CPU 和 NPU 的 14 类处理器优化架构。\n> 𝙻𝙵𝙼𝟹-𝚅𝙻-𝟸𝙱 实力惊人。仅凭 19 亿参数，就能与 Gemma 4 12B（规模为其 6 倍）、Gemini 3.5 Flash Lite 和 GPT-5.6 Luna 展开竞争。\n> 𝙻𝙵𝙼𝟹-𝟷.𝟽𝙱 在端侧智能评测 𝚙𝚒𝚙𝚎𝚝𝚝𝚎.𝚕𝚒𝚚𝚞𝚒𝚍.𝚊𝚒 的帕累托前沿排名第一。\n\n覆盖专用智能所需的各种模态。选择适合你使用场景的模型，按需定制，并在设备端运行。\n\n1/ 🧵"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrZReObEAAQZbT.jpg", "width": 937, "height": 697, "previewUrl": "https://pbs.twimg.com/media/HVrZReObEAAQZbT.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-10-28T00:38:57+00:00", "createdAtBeijing": "2026-10-28T08:38:57+08:00", "createdAtLocal": "10-28 08:38 北京", "url": "https://x.com/MinLiBuilds/status/2115241876680999405", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2115241876680999405", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "LFM3端侧多模态模型系列发布", "evidence": "a new tri-hybrid architecture", "rationale": "发布材料列明架构、模态与规格，性能属发布方宣称"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2115505947187585302", "track": "agent", "source": {"id": "2115505947187585302", "text": "如果你在用 Claude Code 的话，再推荐下记得运行下 /autocompact 300k \n（原推是400k，我自己用下来300k就足够了，当然选哪个你可以自己决定）\n\n自动压缩（Auto-compact）的作用是将整段长对话精简为简短的摘要，而不是一直保留上百万的完整历史记录。在 1M 上下文模型中，系统默认要到约 967K Token 时才会触发压缩。\n\n由于你发送的每一条消息都会带上之前的全部对话历史，等到 967K 再压缩，意味着后期的每一次交互都在重复消耗海量 Token。虽然在缓存有效（warm cache）的情况下，大部分历史内容走的都是廉价的缓存读取，且压缩本身也只相当于一次普通请求，但这些庞大的读取量依然会实打实地计入你的使用额度，积少成多。\n\n使用 /autocompact 300k 可以将触发压缩的阈值提前到 300K。这样既能让对话历史始终保持精简，又能避免单次请求的上下文无限膨胀，从而大幅节省长对话的 Token 消耗。", "createdAt": "Wed Oct 28 18:08:16 +0000 2026", "replyCount": 14, "retweetCount": 14, "likeCount": 81, "conversationId": "2115505947187585302", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2108624109538291901", "text": "Just to avoid some confusion: auto-compact does summarize. When it runs, your whole conversation is replaced by a short summary. It doesn't keep the last 1M tokens around.\n\nThe ~967K is only when it runs on 1M models. Compacting itself is just one request that reads about as many tokens as the message you sent right before it, and it's mostly cache reads if your cache is still warm. \n\nWhat @rohit3a found is that waiting until 967K means every message before that point uses a lot of tokens, because each one includes your whole conversation so far. Most of it is read from the cache, which is much cheaper (so this is usually fine as long as your cache is warm), but it still counts toward your usage and adds up as your conversation grows.\n\n/autocompact 400k makes it summarize at 400K instead, so your messages never get that big.", "createdAt": "Fri Oct 09 18:22:18 +0000 2026", "replyCount": 212, "retweetCount": 117, "likeCount": 3147, "conversationId": "2108624109538291901", "author": {"username": "lydiahallie", "name": "Lydia Hallie ✨", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994238936345137154/exEBW2UI_normal.jpg"}, "authorId": "879696238953865217", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108623848971366400/img/iFt7ILA8L3bYIl3p.jpg", "width": 1920, "height": 660, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2108623848971366400/img/iFt7ILA8L3bYIl3p.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2108623848971366400/vid/avc1/1920x660/v6tK9K5GeS2gwKGn.mp4?tag=29", "durationMs": 7000}], "translationZh": "澄清一下，避免误解：自动压缩确实会生成摘要。运行时，整个对话会被一段简短摘要替换，并不会保留最近的 100 万 token。\n\n约 96.7 万 token 这个数字，只是它在上下文窗口为 100 万 token 的模型上的触发点。压缩本身只发起一次请求，读取的 token 数量与压缩前你刚发送的那条消息所涉及的数量大致相同；如果缓存仍然有效，其中大部分都是缓存读取。\n\n@rohit3a 发现，等到 96.7 万 token 才压缩，意味着此前的每条消息都会消耗大量 token，因为每次请求都包含截至当时的完整对话。其中大部分会从缓存读取，成本低得多（所以只要缓存仍然有效，通常就没问题），但这些 token 仍会计入用量，并随着对话增长不断累积。\n\n/autocompact 400k 会改为在 40 万 token 时生成摘要，这样每次请求的消息量就不会涨到那么大。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-28T18:08:16+00:00", "createdAtBeijing": "2026-10-29T02:08:16+08:00", "createdAtLocal": "10-29 02:08 北京", "url": "https://x.com/dotey/status/2115505947187585302", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2115505947187585302", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Claude Code 自动压缩阈值与额度优化", "evidence": "使用 /autocompact 300k", "rationale": "提供具体配置与长对话消耗解释，效果属作者经验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115435917708296406", "track": "creative", "source": {"id": "2115435917708296406", "text": "Fun project on Perplexity Computer: Asked it to design a GTA V mission where you vibecode GTA VI from an in-game phone while the devs call the cops on you for shipping GTA VI before them.\n\nIt went through the FiveM docs (natives, ped models, server convars, the limits of the in-game browser) and built the mission as a FiveM resource in Lua. Then it built an MCP bridge, a small local Node service that signs in to the Perplexity Computer MCP server with OAuth and turns your in-game prompt into a real Computer task.\n\nThe phone streams Computer's steps live during the chase, you answer its questions and approvals while driving, and you ship the build by losing the cops at the airport hangars.\n\nFor the voices, Computer rented a cloud GPU and ran Qwen3-TTS locally on it, with no TTS API, to voice every line of dialogue.", "createdAt": "Wed Oct 28 13:30:00 +0000 2026", "replyCount": 113, "retweetCount": 33, "likeCount": 724, "conversationId": "2115435917708296406", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115340017359036416/img/AM_645MjNXbRwXH4.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115340017359036416/img/AM_645MjNXbRwXH4.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115340017359036416/vid/avc1/1920x1080/jnM21G3Kti16minm.mp4?tag=29", "durationMs": 121990}], "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-10-28T13:30:00+00:00", "createdAtBeijing": "2026-10-28T21:30:00+08:00", "createdAtLocal": "10-28 21:30 北京", "url": "https://x.com/AravSrinivas/status/2115435917708296406", "themeId": "editorial", "signalScore": 90, "editorial": {"id": "2115435917708296406", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "FiveM游戏任务接入Computer与语音生成", "evidence": "built the mission as a FiveM resource", "rationale": "自述完整作品，披露Lua、MCP桥接及配音实现"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "用 Perplexity Computer 做了个有趣的项目：让它设计一个 GTA V 任务，玩家通过游戏内的手机，用自然语言编程开发 GTA VI，而开发者因为你抢先发布 GTA VI，报警来抓你。\n\n它查阅了 FiveM 文档，包括原生函数、角色模型、服务器配置变量和游戏内浏览器的限制，然后用 Lua 将任务做成了一个 FiveM 资源包。接着，它搭建了一个 MCP 桥接服务：一个小型本地 Node 服务，通过 OAuth 登录 Perplexity Computer MCP 服务器，把你在游戏中输入的提示词转化为真正的 Computer 任务。\n\n追逐过程中，手机会实时展示 Computer 的操作步骤。你一边开车，一边回答它的问题、批准操作，最后在机场机库甩掉警察，完成版本发布。\n\n配音方面，Computer 租用了一块云端 GPU，在上面本地运行 Qwen3-TTS，为每句对白配音，全程没有调用 TTS API。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2115459253561589928", "track": "creative", "source": {"id": "2115459253561589928", "text": "https://t.co/NYM0q71pwS", "createdAt": "Wed Oct 28 15:02:44 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 4, "conversationId": "2115408503133307157", "inReplyToStatusId": "2115408503133307157", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "quotedTweet": {"id": "2114923036516471083", "text": "蛙趣，刚用 Opus5.5 + Hi3D 跑一个通宵搓的游戏，这个精细度，真的很哇塞！\n\nOpus5.5编排 + Image-2.5 出图 + Hi3D MCP 做模 + Three.js 装配\n\n整套做法分享给大家：\n1、概念与多视角参考图：GPT-Image-2.5\n先让 GPT-Image-2.5 出多视角的概念图和参考图（正面、侧面、背面），把材质纹理和结构确定。\n\n2、高精 3D 资产建模：Hi3D MCP\n把 Hi3D 的 MCP 接进 AI工具，需要时会把参考图喂给 Hi3D MCP，秒级生成带完整 PBR 材质的高精 3D Mesh。\n\n3、Web 端性能优化：自动减面与 Draco 压缩（关键避坑点）\nAI 生成的原生模型动辄几十万面，直接丢进网页必卡，让 AI 调用 MCP 时加入 LOD 网格简化并压成 Draco 格式的 glb。\n\n4、逻辑与场景组装：Three.js / WebGL\n模型就绪后，AI 自动编写 Loader 异步加载，补齐物理碰撞体、海水着色器、光影和粒子特效，拼成完整可交互的世界。\n\n5、音效和配乐：WebAudio 实时合成\n\n另外，@Hi3D_AI 刚把 V1.0 开源了，由 200 万真实生产资产训出，细节还原和多视角保真都很顶，堪称目前最扎实的工业级开源 3D 模型，摆明就是奔着 3D 赛道的 AI Infra 去的。", "createdAt": "Tue Oct 27 03:31:59 +0000 2026", "replyCount": 48, "retweetCount": 14, "likeCount": 147, "conversationId": "2114923036516471083", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114917822858252288/vid/avc1/1920x1080/6uJU__VlRQkqz-hc.mp4?tag=29", "durationMs": 65400}]}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "余温", "role": "内容、视觉与多模态实践与观察", "why": "公开生图、建模和 Three.js 装配的完整链路，跨多模态工具价值明显。", "handle": "gkxspace"}, "createdAtIso": "2026-10-28T15:02:44+00:00", "createdAtBeijing": "2026-10-28T23:02:44+08:00", "createdAtLocal": "10-28 23:02 北京", "url": "https://x.com/gkxspace/status/2115459253561589928", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2115459253561589928", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI 生成网页3D游戏工作流", "evidence": "加入 LOD 网格简化并压成 Draco 格式的 glb", "rationale": "提供建模到交互组装步骤及网页性能避坑"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "https://t.co/NYM0q71pwS"}, "avatar": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, {"id": "2115311903505256940", "track": "creative", "source": {"id": "2115311903505256940", "text": "阿杭的推文很长，但是非常让人看得下去，而且浏览量也不低。这是为什么呢？\n\n仔细研究了一下，我觉得有几个点是值得学习的：\n\n1. 文字内容保留了语气、语气词以及带有情绪的标点符号。\n\n这些都是用文字传达情绪的一种方式。\n\n2. 他的很多推文都有数字编号。\n\n虽然是一连串讲的完整内容，但他还是做了分段，能让读者快速抓到重点，有一种看清单的感觉，帮读者理清内容框架。这一步就是代替读者省事儿。\n\n3. 他的很多内容是有重点的。\n\n很多人可能不知道，短推虽然不能加花里胡哨的格式，但是是可以设置加粗的。这也是他表达情绪以及帮读者提炼重点的一种方式。\n\n用这几种方式，就让他的推文特别有“活人感”，特别有渲染力。\n\n所以，推文的流量不在于它长还是短，关键是要把你的干货表达出来，同时一定要配合能让人看得下去的情绪，以及良好的文章结构。\n\n以上，非常值得学习。", "createdAt": "Wed Oct 28 05:17:13 +0000 2026", "replyCount": 2, "retweetCount": 1, "likeCount": 4, "conversationId": "2115311903505256940", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "quotedTweet": {"id": "2114614448069730508", "text": "我真的服了哇，我被蜗牛学长坑死了 @woniuxuezhang  前几天跟蜗牛学长一起聊天，我说我自媒体口播全都是跟你学的，你天天怎么发我就怎么发，你说受不了了我就也说受不了了\n\n结果我才知道，你拍了3000多条，我以为你只拍了500条，你有这个秘诀，你怎么不早说？？？\n\n顺便聊一下我到底是怎么样用AI做自媒体的吧，以及我到底用到哪些工具，今天直接分享给大家\n\n1. 先用Obsidian、录音豆，把我自己的东西存下来\n我自己的经历、跟别人聊出来的想法、咨询里反复被问的问题，还有刷到的好内容，我会往Obsidian里面放\n它就是一个笔记工具，我拿它当自己的素材仓库，而且录音豆里的所有内容基本上都是我会每天晚上留个5~10分钟，然后把我自己想的事情，然后还有我觉得要记下来的东西，我都放在录音豆里\n\n比如我今天想讲「普通人怎么用AI」，我以前做项目踩过的坑、别人找我咨询时遇到的问题，都能拿出来用\n\n我还会让AI帮我把长篇材料拆开，哪些是观点，哪些是案例，哪些是能复用的方法，再把相关的内容连起来，这些一个个都是AI时代的各个原子，你也可以把它理解成一个向量\n\n那在这样的情况下，AI就可以直接把我想要输出的东西直接表达出来了，不用我去办法要去做整理，然后我只需要对输出的内容来进行微调就行。就像你现在看到这篇帖子，其实90%都是AI生成的，但我敢保证没有任何一个人AI能够有这样懂我\n\n2. 一篇稿子，我会拆成几步跟AI一起做\n第一步其实挺随意的，先把想法说出来\n有时候用录音豆记下来，有时候直接跟AI聊，就像我现在这篇，开头就是一段吐槽，想到哪里说到哪里\n\n然后让AI帮我看，这一堆话里面，我到底最想讲什么，读者为什么要看，然后我再用monid @MonidHQ全网去搜集我有可能会用到的案例，可能会用到的论文信息，还有让它来直接帮我生成视频,直接作为素材放进我的视频里，你会发现能极大程度地提高你自己内容的创作效率\n\n甚至包括复盘的时候，我都会看我的评论区里面，到底大家担心的是什么，然后以及我同类型的选题，那评论区里面又都在聊什么，它都能给我抓回来之后，以供我下一次去做系列性的内容\n\n至于对标的问题，其实我觉得就是一种学习，我会看别人怎么开头，在哪里举例，为什么这一段能接到下一段\n\n接下来才是列大纲、写初稿，写完了之后，我一般都会自己过一遍\n\n有些地方AI给我总结得特别顺，但把我真正想表达的那点东西给总结没了，也得改\n\n所以我的经历、态度和最后怎么表达，还是得我自己来\n这一步省不了，尤其是口播，你自己都说不顺，怎么对着镜头讲\n\n3. 工具我确实用了不少，但每个都有具体的用处\n\n录音豆和飞书，我拿来留口述、聊天和复盘的材料\nObsidian负责把素材、稿件和项目记录放在一起\nCodex、Claude、这些工具，我会按任务来用，让它们结合已有材料整理内容、改稿，或者执行一些重复的步骤\n\n至少现在剪辑这一块基本上都不怎么用我干预了，我可能只需要花5分钟来微调一下，然后发布一下就结束了\n\n比如之前在抖音上跑到30万以上的浏览的那条视频，我们试过让AI辅助对齐口播和录屏、处理重复表达、生成字幕，再做成能继续编辑的剪映工程\n\n但生成了工程，后面还是要打开检查、播放、调整，我觉得正是因为有了这步，他才能够跑到30万，所以大多数人都对AI过于依赖了\n\n4. 你所做的所有内容都可以迭代成Skill，每一次的对话框里面的所有内容都可以沉淀\n\n比如口播稿怎么处理，封面标题怎么写，拆对标的时候要看哪些地方，我会分别整理，那同类型的其实是可以做合并同类项的\n\n以上把我用AI做自媒体的完整方法论都公开分享出来了，同时，今天我要拍一条视频，用我的skill自动化的整理b-roll分享出来！\n\n5.一定一定一定要高频地和线下的人去产生链接，你会发现很多有意思的东西\n\n这个月我彻底搬来了杭州，见了很多我在南京以前见不到的人，然后更多的是我学习到了很多的东西。从7月份我和小晚老师高频的交流，她会给我去做一定的内容的策划，去跟我讲IP的各个方法论与原理。到9月份我们在线下见面，然后以及住的非常的近，就经常的交流，也就有了今天的视频\n\n所以说，干，一定要干！就应该学小晚老师做IP做自媒体，就应该学蜗牛老师用AI搞AI，把自己的内容写作的整体流程都做成skill，再开源出来拿个7000+star，总之，用AI做自媒体，做AI自媒体就对了，干就完了！！", "createdAt": "Mon Oct 26 07:05:46 +0000 2026", "replyCount": 20, "retweetCount": 8, "likeCount": 97, "conversationId": "2114614448069730508", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HViPO4TbsAAM7gu.jpg", "width": 1186, "height": 846, "previewUrl": "https://pbs.twimg.com/media/HViPO4TbsAAM7gu.jpg:small"}]}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-10-28T05:17:13+00:00", "createdAtBeijing": "2026-10-28T13:17:13+08:00", "createdAtLocal": "10-28 13:17 北京", "url": "https://x.com/jinchenma_ai/status/2115311903505256940", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2115311903505256940", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "推文表达结构与AI自媒体创作流程", "evidence": "文字内容保留了语气、语气词以及带有情绪的标点符号", "rationale": "提供写作结构分析及素材、改稿、剪辑的具体流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2115392731333951528", "track": "growth", "source": {"id": "2115392731333951528", "text": "poteto 把自己用来管 X 账号的 Grok Bot tibot 分享成模板了：盯提及与关键词、按日程给短摘要、滤噪音、翻非英文，可选自动拉黑骚扰号。绝不代发帖；本人仍手写所有帖文与长文。\n\n模板安装：\nhttps://t.co/Z8PREMX2Y6\n\ntibot 能做什么\n1. 找所有关于你或指定关键词的帖（不必被 @）\n2. 每天（或按你设的小时级）给一份短、已排序的摘要\n3. 跳过垃圾与噪音\n4. 翻译非英文帖\n5. 可自动屏蔽针对你的喷子/辱骂（需你自己接 X API 应用）\n6. 从不替你发帖\n\n模板页补充：日程默认定日；没事时保持安静。自动拉黑依赖「连接你自己的 X API app」。她在回复里也说：接了 X API 才能做这类动作，而且会消耗 API credits。\n\npoteto 怎么用它？\n分享模板的原因是很多人问她「怎么用 Grok Bot 管 X」。她的分工很清楚：写作仍自己来，tibot 负责让她不漏听、少看噪音。定位是情报与防护助理，不是内容生产。", "createdAt": "Wed Oct 28 10:38:23 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 4, "conversationId": "2115392731333951528", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115205951649423585", "text": "i've gotten a lot of questions about how i manage my X account with grok bot, so i'm sharing my bot tibot today! he watches your mentions and:\n\n• finds every post about you or any keywords, tagged or not\n• gives one short, sorted digest a day (or hourly, your call)\n• skips spam and noise\n• translates non-English posts\n• can auto block trolls and abuse\n• never posts for you\n\ni still write all my posts and articles by hand but tibot has been very helpful with keeping me in the loop.\n\nhire tibot today!\n\nhttps://t.co/OaEAunGL8Y", "createdAt": "Tue Oct 27 22:16:12 +0000 2026", "replyCount": 490, "retweetCount": 298, "likeCount": 6274, "conversationId": "2115205951649423585", "author": {"username": "poteto", "name": "lauren", "profileImageUrl": "https://pbs.twimg.com/profile_images/2049256514091929600/Qu4030T2_normal.jpg"}, "authorId": "2832427459", "translationZh": "很多人问我如何用 grok 机器人管理 X 账号，所以今天把我的机器人 tibot 分享出来！它会关注别人对你的提及，并且：\n\n• 找出所有提到你或指定关键词的帖子，无论是否带有 @提及\n• 每天提供一份简短、整理好的摘要（也可以每小时一次，由你决定）\n• 过滤垃圾信息和无关内容\n• 翻译非英语帖子\n• 可自动屏蔽恶意挑衅和辱骂者\n• 绝不会代你发帖\n\n我的帖子和文章仍然都是自己手写的，但 tibot 帮我及时掌握了很多动态。\n\n今天就雇用 tibot 吧！\n\nhttps://t.co/OaEAunGL8Y"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVtieK6aAAAhOdI.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVtieK6aAAAhOdI.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-28T10:38:23+00:00", "createdAtBeijing": "2026-10-28T18:38:23+08:00", "createdAtLocal": "10-28 18:38 北京", "url": "https://x.com/shao__meng/status/2115392731333951528", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2115392731333951528", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "tibot 账号监听与信息过滤模板", "evidence": "每天给一份短、已排序的摘要", "rationale": "提供监听模板、功能分工及 API 成本限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115516478254624914", "track": "agent", "source": {"id": "2115516478254624914", "text": "可能大家都知道，我平时都用 Herdr 进行 Vibe Coding，出门在外的话，会在手机上用 uu 远程控制家里的电脑。但是通过远程来控制电脑中的 Herdr，需要不停放大缩小，以及文字和图片输入和查看图片输出都颇痛苦，整个操作体验不够 mobile native，所以我一直想着做一个手机端的 Herdr 客户端，然后就做出来了（目前只适配了 Claude Code）\n\n但是出门在外要打通内网需要一个 relay server，我心想 Alma 一直以来都自带端到端加密的 relay server，那我就把这个功能合并到 Alma iOS App 内部了。\n\n也就是说，现在 Alma iOS App 内部其实集成了一个完整功能的 Herdr 客户端，甚至还有远程桌面的功能。甚至还会自动判断你是否在同一个局域网中，如果是的话自动切换到内网连接，速度更快更丝滑，另外 relay server 也是端到端加密的，以后有时间打算把这个 Alma relay server 开源出来让大家自己搭建自己的 relay server！\n\n反正我舒服了😌", "createdAt": "Wed Oct 28 18:50:07 +0000 2026", "replyCount": 32, "retweetCount": 9, "likeCount": 191, "conversationId": "2115516478254624914", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115516174419247104/img/OA8UweLjBWiGyv2W.jpg", "width": 944, "height": 2048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115516174419247104/img/OA8UweLjBWiGyv2W.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115516174419247104/vid/avc1/1770x3840/OvcsKsx3-04vvjrF.mp4?tag=29", "durationMs": 53984}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "yetone", "role": "Agent 与开发工具实践与观察", "why": "magpie 故障复盘交代锁、I/O、冷启动和修复，属于可学习的真实工程。", "handle": "yetone"}, "createdAtIso": "2026-10-28T18:50:07+00:00", "createdAtBeijing": "2026-10-29T02:50:07+08:00", "createdAtLocal": "10-29 02:50 北京", "url": "https://x.com/yetone/status/2115516478254624914", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2115516478254624914", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Herdr 移动客户端与加密中继实践", "evidence": "如果是的话自动切换到内网连接", "rationale": "作者自述已实现客户端，说明连接与交互设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, {"id": "2115447796098912414", "track": "tools", "source": {"id": "2115447796098912414", "text": "看一下我新的小产品 TinyOwl https://t.co/YLiY2MwcAR 的主界面设计，复古的配色，点阵和进度条，最近很喜欢这种风格，就带入到这个应用当中了。\n\n可以随意组合的 workflow，基于 Rust 的压缩，benchmark 测试还是很快的，可以只压缩，也可以压缩以后上传到多个 provider，还可以裁剪缩放以后在做后面的处理，还有多个快捷入口可以快速操作。", "createdAt": "Wed Oct 28 14:17:12 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 7, "conversationId": "2115447796098912414", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2112515852230934839", "text": "我的又一个新产品 TinyOwl 上线了  https://t.co/YLiY2MwcAR\n\n一个 Mac 上的本地图片压缩工具 起因是写博客 做静态网站 发论坛经常要传图，我需要先压缩完还要传到自己的图床 不想再把原图丢到网上的压缩站\n\n市面上压缩工具已经很多了，但我不想重复造轮子。它的特点是基于工作流：缩放、居中裁剪、压缩、上传这几步，你可以按需组合，分步走。\n\n还有一些其他特点：\n\n1 每一步都可选，缩放、居中裁剪、压缩、上传随意组合，存成工作流以后一键执行\n2 压缩引擎是 Rust 写的，缩放和压缩都在本地跑，不传图，也不用注册账号\n3 上传只传压好的成品，直接到你自己的 R2 / S3 / OSS / COS 等等\n4 内置对 Agent 友好的 CLI， 没有窗口也能跑，还有多入口：菜单栏拖动、直接 ⌘V 粘贴、Finder 右键同样能直接用存好的工作流\n5 界面按复古简约做的，点阵和复古进度条自己抠了挺久\n6 一次买断不订阅，早鸟 ¥49，7 天全功能试用\n\n算是一个小作品，也是第一次做单机软件，欢迎大家试用并且提意见", "createdAt": "Tue Oct 20 12:06:42 +0000 2026", "replyCount": 13, "retweetCount": 2, "likeCount": 45, "conversationId": "2112515852230934839", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2112514696217870336/img/MT8JafcPh-9EHpEg.jpg", "width": 1660, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2112514696217870336/img/MT8JafcPh-9EHpEg.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2112514696217870336/vid/avc1/1660x1080/AbhFgrtKDOK0TbK8.mp4?tag=29", "durationMs": 11400}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115446507843604480/img/aMP2a-lckP rId": "28969465", "quotedTweet": {"id": "2115111877558898931", "text": "Introducing the Parallel Decisions API: the first web-grounded decisions engine.\n\nDecision models like Jev can answer in an instant, but they lack the recency of current news. Now you can get both in a single call.\n\nDecisions API is live today at $0.001 per request.\n\nTry it with 5,000 free requests: https://t.co/tu4CidUdxV\n\nHere are some examples we've been experimenting with:\n\n- Fact-check content (@Grok is this true?)\n- Refresh stale banking records\n- Classify companies and leads with fresh signals\n- Backtest trading strategies\n- Track competitor e-commerce inventory", "createdAt": "Tue Oct 27 16:02:23 +0000 2026", "replyCount": 131, "retweetCount": 93, "likeCount": 1189, "conversationId": "2115111877558898931", "author": {"username": "p0", "name": "Parallel Web Systems", "profileImageUrl": "https://pbs.twimg.com/profile_images/2078555755373068288/6MNS8r7X_normal.png"}, "authorId": "364724969", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115111814765969408/img/XnHeXPBChhpJQ4yy.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115111814765969408/img/XnHeXPBChhpJQ4yy.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115111814765969408/vid/avc1/1280x720/hLnf0Bh3D2qRCu18.mp4?tag=16", "durationMs": 35300}], "translationZh": "推出 Parallel Decisions API：首个以网络信息为依据的决策引擎。\n\nJev 等决策模型能即时给出答案，却缺乏最新资讯。现在，只需一次调用，就能兼得速度与时效性。\n\nDecisions API 今日正式上线，每次请求 0.001 美元。\n\n免费试用 5,000 次请求：https://t.co/tu4CidUdxV\n\n以下是我们正在尝试的一些用例：\n\n- 核查内容真实性（@Grok 这是真的吗？）\n- 更新过时的银行记录\n- 根据最新信号对公司和潜在客户进行分类\n- 回测交易策略\n- 跟踪竞争对手的电商库存"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "肖涵 Han Xiao", "role": "模型、研究与推理实践与观察", "why": "有端侧检索、ANE/GPU 对比与资源取舍，兼顾研究和真实产品。", "handle": "hxiao"}, "createdAtIso": "2026-10-28T02:28:37+00:00", "createdAtBeijing": "2026-10-28T10:28:37+08:00", "createdAtLocal": "10-28 10:28 北京", "url "id": "2115378895394591174", "text": "提示词：\n---\n【人物替换】\n将视频@视频1 0-2秒中的白模完整替换为@图片2 中的角色，\n视频@视频1 3-7秒中的白膜完整替换为@图片1 中的角色，\n包括头部、五官、发型、身体、服装、配饰和鞋子。人物外观、身体比例及画风严格按照角色图。不残留白模的光头、面部和白色模型材质。\n白膜视频的空间位置全程不得更改，0-2秒@图片2 在离镜头比较远的地方，本来是想扶电线杆，结果没扶住身体往前不自觉的前倾跑出画面，要求参考@视频1 的运动规矩。\n3-7秒@图片1 参考@视频1 的动作规矩出现在镜头，面向镜头微笑，这是一个持续的慢镜头，人物是腰部以上构图，没有跌倒。\n\n全程的镜头是固定的，没有拉远也没有推进，保持镜头不变。\n\n【背景和柱子替换】\n用@图片3 替换视频中的背景与地面，同时将白模柱子替换为与新场景相匹配的完整柱子或路灯杆。\n\n柱子不需要单独的参考图：根据@图片3 的建筑风格、环境用途、画风和光照，为柱子生成合理的颜色、材质及表面细节。例如城市街道使用带正常涂装的金属路灯杆，其他环境使用符合场景的柱体材质。整根柱子的底座、杆身和顶部结构都要完成材质替换，不得残留无贴图的白模表面，也不要做成纯白发光柱。\n\n如果@图片3 中没有柱子，就在动作参考视频@视频1 对应的位置补建一根；如果场景图@图片3 中的柱子位置与动作不匹配，以动作参考视频@视频1 中的位置和接触关系为准，调整环境衔接，避免出现重复柱子。\n\n保留参考视频中柱子的位置、高度、粗细、主要轮廓和透视，确保人物仍能在相同位置扶靠。替换的是柱子的外观材质，不改变其动作支撑作用。柱子全程固定，颜色、纹理和结构保持一致，不移动、不变形、不突然变回白模。", "createdAt": "Wed Oct 28 09:43:25 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 3, "conversationId": "2115378725563035803", "inReplyToStatusId": "2115378725563035803", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-10-28T09:43:25+00:00", "createdAtBeijing": "2026-10-28T17:43:25+08:00", "createdAtLocal": "10-28 17:43 北京", "url": "https://x.com/liyue_ai/status/2115378895394591174", "themeId": "editorial", "signalScore": 53, "editorial": {"id": "2115378895394591174", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "视频角色及场景替换提示词", "evidence": "保留参考视频中柱子的位置、高度、粗细", "rationale": "明确分段替换、固定机位及动作支撑一致性"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2115424309112164580", "track": "creative", "source": {"id": "211542430 const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
