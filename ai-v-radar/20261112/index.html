<script>
const DATA={"records": [{"id": "2120335490524365241", "track": "agent", "source": {"id": "2120335490524365241", "text": "30 名工程师 12 周重建 Shopify 商家 App：Agent 写了大部分代码，团队把功夫花在验证上\n\n来自 @ShopifyEng 分享，团队把面向商家的 Shopify App 从 React Native 重建为 iOS（Swift）和 Android（Kotlin）原生应用，覆盖 300 多个页面。Agent 写了大部分代码，但这不是让模型一次性写完。真正费功夫的，是围绕“怎样快速、可靠地检查代码对不对”，重新设计了架构、工具和流程。\nhttps://t.co/Q5hvVTMRRg\n\n为什么重建，以及动手前先准备什么\n\nShopify 在系列前文里说，回到原生开发不是因为 React Native 不够快，是 Coding Agent 降低了同一功能做 iOS、Android 两套代码的成本，平台原生能力和第一方工具的价值重新变得更重要。\n\n动手前，一小批工程师先为 Agent 准备了开发环境：一套让两端结构保持一致的内部架构 Reflex；一个不用开手机或模拟器、就能运行业务逻辑的命令行工具；以及偏离规范就会报错的仓库规则。过去 Agent 每改一次，都要编译、开模拟器、看截图，一轮要几分钟；现在多数页面能在终端里直接做确定性检查，几乎立刻得到反馈。为了让两端保持一致，团队接受了一部分代码不那么符合各平台的惯用写法。\n\n他们也试过先写详细规格再交给 Agent，但规格很快就过时了。最后的做法是把正在运行的旧版 App 当作参照：内部工具 Helix 读取旧实现，把迁移拆成一个个便于审查的小步骤，再拿新页面和原应用对照验收。\n\n人怎么把关，结果怎样\n\n约 30 人按两人一组负责不同产品区域，每人同时指挥多个 Agent，Agent 晚上和周末也继续工作。每个 PR 都必须由人审查，但工程师不用逐行读完整个页面的大改动：Agent 先按架构规范互相挑错，工作也拆成双端同时修改的小步骤，人最后判断意图、行为和是否合入。每天结束时，Agent 会把当天的审查意见写回团队的技能说明和架构文档。崩溃监测每 15 分钟运行一次，Slack 里的内部 Agent 可以复现问题并直接提交修复 PR。\n\n按 Shopify 自己公布的数据，用户升级时登录状态和偏好设置都会保留。Android 启动时间中位数从 1.71 秒降到 0.87 秒，安装包从 80.4MB 减到 47.6MB，内存中位数从 470MB 降到 200MB；iOS 峰值内存中位数从 730MB 降到 190MB。Android 无崩溃会话比例从 99.66% 升到 99.98%。", "createdAt": "Wed Nov 11 01:59:09 +0000 2026", "replyCount": 25, "retweetCount": 0, "likeCount": 19, "conversationId": "2120335490524365241", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2120194571313279263", "text": "What becomes the bottleneck when agents write most of your code?\n\nThirty engineers rebuilt Shopify’s 300+ screen app in Swift and Kotlin in 12 weeks. This meant changing the way we review, compute, merge, and coordinate. \n\nHere’s what it took to keep shipping:\nhttps://t.co/DKfIOKznQL", "createdAt": "Tue Nov 10 16:39:11 +0000 2026", "replyCount": 12, "retweetCount": 36, "likeCount": 301, "conversationId": "2120194571313279263", "author": {"username": "ShopifyEng", "name": "Shopify Engineering", "profileImageUrl": "https://pbs.twimg.com/profile_images/1135963802258890754/8wt-ffSB_normal.png"}, "authorId": "732393381444255744", "translationZh": "当智能体写了大部分代码，瓶颈会出在哪里？\n\n30 名工程师用 Swift 和 Kotlin，在 12 周内重写了 Shopify 拥有 300 多个界面的应用。为此，我们调整了代码审查、算力使用、代码合并和团队协作的方式。\n\n我们是这样保持交付节奏的：\nhttps://t.co/DKfIOKznQL"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWzx3bLbkAA6Lyp.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWzx3bLbkAA6Lyp.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-11T01:59:09+00:00", "createdAtBeijing": "2026-11-11T09:59:09+08:00", "createdAtLocal": "11-11 09:59 北京", "url": "https://x.com/shao__meng/status/2120335490524365241", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2120335490524365241", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Shopify 用 Agent 重建双端原生商家应用", "evidence": "再拿新页面和原应用对照验收", "rationale": "Shopify 披露双端迁移的验证流程及自报性能数据"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120388990616433083", "track": "tools", "source": {"id": "2120388990616433083", "text": "斯坦福 CS329Z 课程资料公开：讲座每天上 YouTube，两份作业开源，第一份教你花几美元从零写个“Claude Code”\n\n斯坦福新课 CS329Z“AI agent 工程”（Engineering AI Agents）开始对外公开全部课程资料。授课老师之一 Michael Ryan 11 月 10 日发帖说，讲座视频每天在 Stanford Online 的 YouTube 频道上一讲，两份作业的代码仓库也放到了 GitHub，都用 MIT 协议，别的学校注明出处就能拿去上课。\n\n开课时情况不一样。课程页写的是录像只放在斯坦福内部的 Canvas 平台给选课学生看，校外的人只能下载课件。现在官方频道已经上了第 1 讲《什么是 agent 系统》和第 2 讲《写给 agent 开发者的大模型知识》，第 1 讲播放量过了 9 万。课程主页的课表也开始在每节课旁边挂视频链接。\n\n【第一份作业：自己写一个 agent harness】\n\nharness 是包在模型外面的那层程序：告诉模型有哪些工具、解析它的回复、替它执行命令、管理上下文。Claude Code、Codex 都可以看成一个模型加一个 harness。\n\n作业不许用任何 agent 框架，课程只给一个最原始的接口：传进一串消息，返回一段文字，没有工具调用，也没有结构化输出，其余全靠自己写。\n\n前半部分做几条固定流程：给邮件判断优先级、生成每日摘要、手写 BM25 检索（一种按关键词打分的经典搜索算法），再在一份真实企业的邮件档案里做多跳问答。后半部分给一家虚构的能源公司做内部助理：自己设计工具调用格式，接入文档检索，给它一个带沙盒限制的终端，对话太长时压缩上下文，跨会话记住用户的事，执行操作前让用户批准或否决。最后由大模型扮演的“模拟用户”跟你的 agent 多轮对话，再由另一个模型打分。\n\n对自学的人来说，最有用的是全套测试都在仓库里。一开始所有测试都失败，你的任务就是让它们一个个通过。88 分自动评分里有 48 分来自不调用模型的测试，跑多少遍都不花钱。另有几处判断题作业不给标准答案，比如一条命令输出太长时给模型看多少、压缩上下文时必须留下什么、哪些操作可以不问用户，要求你写一份设计说明讲清楚自己的选择。\n\nMichael Ryan 说不到 5 美元的 API 额度就能做完。讲义里的数字更低：用参考答案跑一遍全部线上测试花了 0.05 美元，最后的模拟用户评测再花 0.18 美元。自己调试要反复跑，花得会比这多，好在每次调用都缓存在本地，同样的请求第二次不收钱。选课学生用课程发的 OpenRouter 密钥，校外的人得自己准备一个，默认模型是 openai/gpt-6-luna。\n\n【第二份作业：给 agent 出一道考题】\n\n第二份作业由 John Yang 设计。他是 SWE-bench 的共同作者，这套测试用真实的 GitHub 问题考 AI 会不会修 bug，各家发编程模型常拿它报成绩。\n\n作业教的是怎么出一道 Terminal-Bench 风格的题：给 agent 一段问题描述，让它在命令行环境里动手，最后用测试脚本判断做没做对。用的工具 Harbor 出自 Terminal-Bench 团队，它规定一道题怎么打包（题面、Docker 环境、验证脚本），并负责启动 agent、跑验证、保存结果。\n\n作业先带你用 Harbor 跑 SWE-bench Verified、Terminal-Bench 2.1 里的现成题目。占 70% 分数的部分是自己出一道题，用 mini-SWE-agent（一个只带 bash 工具的极简编程 agent）配 Gemini 3.8 Flash 跑五次，分析这道题是否有效、贴近真实、能复现、有难度。需要装 Docker，准备 Gemini 或 OpenRouter 的密钥。\n\n两份作业的说明文件末尾都写了致谢：第一份是在 Claude Fable 5.1 的大量帮助下做出来的，第二份用了 Claude Opus 5.5。\n\n【后面还有什么】\n\n课程由斯坦福计算机系的 Diyi Yang 和两位博士生 Michael Ryan、John Yang 共同讲授，第一届有 100 多名学生。这学期的课表里还有 Andrew Ng 的炉边对谈，还有 SWE-bench 两位作者 Carlos Jimenez、Alexander Wettig（现在在 Anthropic）的客座讲座。Michael Ryan 说之后还会公开学生做的作品。主要资助方是 Laude Institute，Thinking Machines、Google Cloud、AWS 和 Harbor 给学生提供了 API 额度。\n\n照着第二份作业讲义克隆仓库时注意，讲义里写的仓库名是 assignment2-harness，实际地址是 assignment2-evals。\n\n课程主页：https://t.co/y7KbVMdU2r\n第 1 讲视频：https://t.co/Ls8MuXXJNH\n第 2 讲视频：https://t.co/gs46i1u5FX\n作业一仓库：https://t.co/BzYDnPsmsN\n作业二仓库：https://t.co/dbAzZW2Zkt\n原帖：https://t.co/1tVnCAIpHY", "createdAt": "Wed Nov 11 05:31:44 +0000 2026", "replyCount": 138, "retweetCount": 184, "likeCount": 898, "conversationId": "2120388990616433083", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2120216178371260589", "text": "🔊 Big Update!\n\nAll materials are now being released publicly for our NEW Stanford course CS329Z: Engineering AI Agents!\n\nStarting with the lectures, which are going live daily on the Stanford Online YouTube channel!\n\nLecture 1: https://t.co/Gpjxoyi5UM\n\n🧵 (1/5) https://t.co/Xd8oPV3ccb", "createdAt": "Tue Nov 10 18:05:03 +0000 2026", "replyCount": 27, "retweetCount": 166, "likeCount": 1191, "conversationId": "2120216178371260589", "author": {"username": "michaelryan207", "name": "Michael Ryan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1679004211088879616/oZ8HviGc_normal.jpg"}, "authorId": "1203401350446379008", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyFYN0aIAEP-CX.jpg", "width": 1200, "height": 913, "previewUrl": "https://pbs.twimg.com/media/HWyFYN0aIAEP-CX.jpg:small"}], "translationZh": "🔊 重磅更新！\n\n我们的斯坦福新课 CS329Z: Engineering AI Agents 开始公开发布全部课程资料！\n\n课程视频率先上线，将在 Stanford Online 的 YouTube 频道每天更新一讲！\n\n第 1 讲：https://t.co/Gpjxoyi5UM\n\n🧵 (1/5) https://t.co/Xd8oPV3ccb"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-11T05:31:44+00:00", "createdAtBeijing": "2026-11-11T13:31:44+08:00", "createdAtLocal": "11-11 13:31 北京", "url": "https://x.com/dotey/status/2120388990616433083", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2120388990616433083", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "斯坦福 AI Agent 工程课程公开", "evidence": "讲座每天上 YouTube，两份作业开源", "rationale": "公开讲座与两套作业，覆盖执行框架实现和评测设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2120336655093735868", "track": "tools", "source": {"id": "2120336655093735868", "text": "Airbnb 开源内部使用的工作流引擎 Skipper：把可恢复的工作流嵌进服务，不必另建编排集群；面向 Java、Kotlin 服务，解决多步业务中常见的问题：执行到一半进程崩溃、下游暂时失败，流程怎样继续，而不是从头盲目重做。\n\n开源地址：https://t.co/HKoafGCTVF\n\n核心机制：执行在服务里，进度存进数据库\n\nSkipper 作为库嵌入现有服务，运行时和调度器随服务一起部署，不需要独立的工作流编排集群。多个服务副本共享数据库，用租约协调任务；某个副本失败后，其他副本可以接管。\n\n恢复时，它会从头重放工作流方法，但已持久化的动作直接返回保存结果，不必重新执行。流程也能暂停等待信号或定时器，不持续占用线程。因此，它不只是串联函数的工具，而是具备持久化与故障恢复能力的执行引擎。\n\n最重要的边界：可恢复，不等于绝不重复\n\nSkipper 不能保证下游操作只发生一次。 默认情况下，部分检查点会批量写入；落盘前崩溃，已经完成的动作可能再次执行。即使立即保存，下游调用与检查点也不是一个原子事务。因此，支付、发券等操作仍需开发者保证幂等，避免重复调用产生重复结果。\n\n开源版目前提供 MySQL、SQLite 适配器，多实例生产部署建议用 MySQL；Postgres、DynamoDB 仍在规划。Airbnb 此前自报，内部已覆盖 15 个以上用例，峰值达到每秒 1 万个工作流，但该峰值使用 DynamoDB，不能直接视为当前开源版的性能指标。", "createdAt": "Wed Nov 11 02:03:47 +0000 2026", "replyCount": 10, "retweetCount": 1, "likeCount": 11, "conversationId": "2120336655093735868", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2120252477799063649", "text": "Skipper is now open source! 🎉 \n\nExplore Airbnb’s embedded workflow engine, now available to developers under the Apache 2.0 license on GitHub. \n\nhttps://t.co/VECN7S6hag", "createdAt": "Tue Nov 10 20:29:17 +0000 2026", "replyCount": 0, "retweetCount": 11, "likeCount": 128, "conversationId": "2120252477799063649", "author": {"username": "AirbnbEng", "name": "Airbnb Engineering", "profileImageUrl": "https://pbs.twimg.com/profile_images/1922409174929211392/bVosVBme_normal.png"}, "authorId": "838673862", "translationZh": "Skipper 开源了！🎉\n\nAirbnb 的嵌入式工作流引擎现已在 GitHub 上以 Apache 2.0 许可证向开发者开放。\n\nhttps://t.co/VECN7S6hag"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWzy7KPbwAAsy4u.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWzy7KPbwAAsy4u.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-11T02:03:47+00:00", "createdAtBeijing": "2026-11-11T10:03:47+08:00", "createdAtLocal": "11-11 10:03 北京", "url": "https://x.com/shao__meng/status/2120336655093735868", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2120336655093735868", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Airbnb 开源嵌入式工作流引擎 Skipper", "evidence": "Airbnb 开源内部使用的工作流引擎 Skipper", "rationale": "开源发布交代了持久化恢复机制和下游幂等要求"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120647659388031454", "track": "agent", "source": {"id": "2120647659388031454", "text": "Google 推出 Gemini Decisions API：不写回答只做判断，一次最多问 1000 个问题，输入每百万 Token 0.1 美元、输出不收钱\n\nGoogle 今天在 Gemini API 里上线了 Decisions API，配套新模型 Gemini Decision 1。它不生成文字，只答题：给它一份输入和一组问题，它直接返回每道题的答案，外加一个“有多大把握”的置信度。\n\n【它解决什么问题】\n\n做 AI 应用时，很多调用其实只要一个判断：这条客服消息转给哪个组？这个问题交给便宜模型还是推理模型？这张图违不违规？以前只能让大模型写一段话，再从里面解析答案，慢，容易解析失败，还要为输出 Token 付钱。\n\nDecisions API 只有三种题型：是非题，返回“是”的概率；单选题，2 到 255 个选项，返回选中项和每个选项的概率；打分题，按你写的档位打分。每个答案带 0 到 1 的置信度，代码可以设门槛，比如高于 0.7 自动执行，低于就转人工。官方说这些概率是校准过的，意思是模型说 90% 的时候，大约十次里真对九次，所以置信度能直接拿来当门槛。\n\nGoogle 博客的例子：上传一张茶水间台面的照片，同时问三个问题。“有没有洒了的液体”答 0.95；“怎么处理”选“用抹布擦”，置信度 0.98；“脏乱程度按 0 到 2 打分”给 1.19，置信度 0.77。\n\n【多快、多便宜】\n\n一次请求的输入最多 256K Token，文字、JSON、图片、音频、视频、PDF 可以混着放，比如一段客服通话录音加账户信息。同一份输入上最多挂 1000 个问题，彼此互不影响。输入只计一次费，每多一个问题只多算这道题本身的字数。\n\nGoogle 称输入在 1.6 万 Token 以内时，端到端延迟 150 到 250 毫秒，问 1 个和问 100 个问题耗时差不多；同一批评测下，比用 Gemini 3.5 Flash-Lite 生成答案便宜近 5 倍。Gemini Notebook 已经用它给每个提问挑模型，日常问题延迟最多降了 40%。\n\n【谁能用】\n\n在 Google AI Studio 拿个 API Key 就能调，模型名 gemini-decision-1，走 v1beta 接口。有免费层，每分钟 200 次、每天 1 万次，免费层的数据会被 Google 用来改进产品，付费层不会。OpenRouter、LangChain、Vercel 等正在接入，Google Cloud 上的 Gemini 要稍后才支持。\n\n不支持上下文缓存和 Batch API，同一份大文档反复问，每次都按全价算输入；不能直接传 YouTube 链接；问题本身只能写文字。\n\n【跟 OpenAI 的同名产品比】\n\nOpenAI 早一个月做了同样的东西，名字也叫 Decisions API：10 月 6 日出测试版，10 月 22 日正式开放，用 GPT-6 Luna，同样每百万输入 Token 0.1 美元、输出不收费。区别是 OpenAI 一次最多 400 个问题，只收文字、图片和 JSON，不收音视频和 PDF；但它支持缓存，重复输入能打折，还能直接塞进对话历史和工具调用记录。\n\n创业公司 TypeSafe 的 Jev 1.14 也专做这类判断，在 OpenRouter 上每百万输入 Token 0.042 美元，只收文字和图片。\n\nGoogle 博客附的对比表里，Gemini Decision 1 在 9 项测试中 7 项第一（其中音频、视频两项只有它和 Flash-Lite 参测），校准误差 0.025，GPT-6 Luna 是 0.072；网页操作和“该不该调用工具”两项输给了 Jev 1.14。7 项共同评测的总花费，Jev 最低，0.68 美元，Gemini Decision 1 是 0.88 美元，GPT-6 Luna 0.93 美元。以上跑分都是 Google 自己测的。\n\nGoogle 博客：https://t.co/P5hlLj7fXN\n官方文档：https://t.co/WphCUZv5oT\nOpenAI Decisions API 文档：https://t.co/MGgS32OuNy", "createdAt": "Wed Nov 11 22:39:36 +0000 2026", "replyCount": 8, "retweetCount": 2, "likeCount": 8, "conversationId": "2120647659388031454", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2120581155078729728", "text": "Today we’re launching the Gemini Decisions API, powered by our new Gemini Decision 1 model in @GoogleAIStudio.\n\nInstead of generating text token by token, it’s built for closed-set choices scoring up to 1,000 questions across text, images, audio, video + PDFs in a single pass. A few details:\n\n- 3 decision types: yes/no, multiple choice (up to 255 options) + rubric scoring\n- $0.10 / 1M input tokens with $0 billed for output tokens (~5x cheaper than Flash-Lite)\n- leads on several benchmark evals with lowest calibration error\n\nGoogle teams are already building with it, below is a look at Stitch Rapid designing a full product flow in seconds (1x speed)", "createdAt": "Wed Nov 11 18:15:20 +0000 2026", "replyCount": 279, "retweetCount": 331, "likeCount": 4339, "conversationId": "2120581155078729728", "author": {"username": "sundarpichai", "name": "Sundar Pichai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_normal.jpg"}, "authorId": "14130366", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120574108635455488/img/oulKz9YqtupyRljq.jpg", "width": 1798, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120574108635455488/img/oulKz9YqtupyRljq.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120574108635455488/vid/avc1/1798x1080/SNR8gkld9RnhwiUk.mp4?tag=29", "durationMs": 13028}], "translationZh": "今天，我们在 @GoogleAIStudio 推出 Gemini Decisions API，由全新的 Gemini Decision 1 模型驱动。\n\n它专为在给定选项内做决策而设计，无需逐个生成 token，一次最多可处理 1,000 道题，支持文本、图片、音频、视频和 PDF。\n\n- 支持 3 类决策：是非题、选择题（最多 255 个选项）和按评分标准打分\n- 每百万输入 token 收费 0.10 美元，输出 token 免费，价格约为 Flash-Lite 的五分之一\n- 在多项基准评测中领先，校准误差最低\n\nGoogle 的团队已经在用它开发产品。下面是 Stitch Rapid 在几秒内设计出完整产品流程的演示（1 倍速）。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-11T22:39:36+00:00", "createdAtBeijing": "2026-11-12T06:39:36+08:00", "createdAtLocal": "11-12 06:39 北京", "url": "https://x.com/dotey/status/2120647659388031454", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2120647659388031454", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Gemini Decisions API 规格与用法", "evidence": "高于 0.7 自动执行，低于就转人工", "rationale": "详述三种题型、置信度分流和接口限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2120356591157620907", "track": "research", "source": {"id": "2120356591157620907", "text": "让 Agent 自己优化大模型训练，可能会出现性能报告写着「提速 2 倍」，实际却只是减少了计算量，甚至改了计时规则。\n\n如果连这种「假进步」都识别不出来，Agent 迭代得越多，反而可能偏离真正的优化目标。\n\n最近一篇论文《InfraRSI: Harnessing Recursive Self-Improvement for Training Infrastructure》，探索了如何让 Agent 真正具备持续优化训练系统的能力。\n\n研究团队开发了 InfraRSI，一套面向分布式大模型训练的 Agent Harness。\n\n它的核心思路是让 Agent 形成一个持续自我改进的实验闭环。\n\nAgent 会分析性能瓶颈，尝试修改训练配置和底层代码，通过 Verifier 检查优化是否真实有效，再把成功经验和失败原因保存下来，用于指导下一轮优化。\n\n这里有两个关键设计：一是通过 16 项约束检查，防止 Agent 通过减少计算量或修改计时规则来「刷分」；二是让失败成为下一轮搜索的依据，比如遇到 OOM 后，尝试组合其他节省显存的方案，而不是直接放弃。\n\n实验结果还是很有说服力的。\n\n在四组 Dense 和 MoE 训练任务中，作者报告 InfraRSI 实现了 1.83 倍的几何平均加速，高于 RE-Bench 的 1.37 倍和 Auto-Research 的 1.34 倍。\n\n其中，在 Gemma-4-26B-A4B 的 8×H200 训练任务上，Agent 通过组合多种优化方案，实现了 2.75 倍加速。不过，目前的结果仍集中在特定模型和硬件环境中。\n\n这篇论文至少提醒我们需要关注 Agent 自我改进背后的 Harness 设计。\n\nAgent 要实现持续改进，需要一套可靠的验证与反馈机制，知道哪些改动真的有效，为什么失败，以及下一次应该往哪里探索。\n\nAgent 的持续自我改进能力，很大程度上取决于它能否从一次次经过验证的实验中积累经验。\n📎 arXiv: https://t.co/iDsA1n7lRq\n\n💻 GitHub: https://t.co/X7RqXGNluN", "createdAt": "Wed Nov 11 03:23:00 +0000 2026", "replyCount": 9, "retweetCount": 11, "likeCount": 67, "conversationId": "2120356591157620907", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxc57MXQAAoaVJ.jpg", "width": 1149, "height": 1206, "previewUrl": "https://pbs.twimg.com/media/HWxc57MXQAAoaVJ.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-11T03:23:00+00:00", "createdAtBeijing": "2026-11-11T11:23:00+08:00", "createdAtLocal": "11-11 11:23 北京", "url": "https://x.com/Xudong07452910/status/2120356591157620907", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2120356591157620907", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "InfraRSI 分布式训练优化", "evidence": "实现了 1.83 倍的几何平均加速", "rationale": "论文报告四组训练加速，披露防刷分约束"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120358856148549656", "track": "enterprise", "source": {"id": "2120358856148549656", "text": "Anthropic 官方介绍：把看板、表格和数据工作直接放进 Claude，不用先把结果拷到别的工具里。\n\n上线 Claude Whiteboards、Claude Sheets（都还在 beta），以及原先的 Claude Dashboards 正式更名为 Claude Data 并全面开放。\n\n三个都在付费方案里可用，网页、桌面和手机都能用。\n\n核心变化是：以前跟 Claude 做完项目，往往要把产出挪到别的软件，Claude 就跟不上后续改动。\n\n现在文档、白板、表格和仪表盘可以留在 Claude 里，团队一起改；准备好了，再导出或接到合作方工具里继续做。\n\nWhiteboards 是一块共享板：你把还很乱的计划说给它听，它整理成带时间线、负责人和日期的看板，大家实时一起改。\n\n复盘时也可以先丢笔记，它按主题归类并起草待办。框选某一块还能单独追问，讨论完可以变成文档、演示稿，或接到 Lucid、Miro、Zoho 的 Vani。\n\nSheets 是它和你一起建、一起改的表格。一句话常常就能生成带多表、公式、格式和下拉菜单的表，改动会逐条标出。目前功能还比较基础，要用完整 Excel 能力，可以导出 .xlsx 或 CSV，或改用 Claude for Excel。\n\nClaude Data 可以连 Redshift、BigQuery、ClickHouse 这类数仓问公司里的数。\n\n实用的两件事：\n数据团队能认证指标口径，图表会带 “certified” 标记，减少数字对不上；\n以及实时分享后，没有连接器权限的同事也能看到最新数字，但只能看你已批准的查询，不能借你的权限乱跑。\n\n认证查询和实时分享都还在 beta，用之前要先接上数仓或 CRM。", "createdAt": "Wed Nov 11 03:32:00 +0000 2026", "replyCount": 4, "retweetCount": 1, "likeCount": 3, "conversationId": "2120358856148549656", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWz4wyTakAAloJm.jpg", "width": 1431, "height": 808, "previewUrl": "https://pbs.twimg.com/media/HWz4wyTakAAloJm.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWz430PboAAa4ME.jpg", "width": 1438, "height": 802, "previewUrl": "https://pbs.twimg.com/media/HWz430PboAAa4ME.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWz5JCAagAAgyeE.jpg", "width": 1438, "height": 808, "previewUrl": "https://pbs.twimg.com/media/HWz5JCAagAAgyeE.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-11T03:32:00+00:00", "createdAtBeijing": "2026-11-11T11:32:00+08:00", "createdAtLocal": "11-11 11:32 北京", "url": "https://x.com/sitinme/status/2120358856148549656", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2120358856148549656", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Claude 发布协作白板、表格与数据工具", "evidence": "数据团队能认证指标口径", "rationale": "报道三项产品更新，具体说明协作、指标认证和查询权限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2120338335877181579", "track": "agent", "source": {"id": "2120338335877181579", "text": "Meta 如何用 AI 构建 Forum：让 Agent 不只写代码，还能验证自己是否做完\n\nForum 是 Meta 面向 Facebook 小组推出的独立应用，不是工程平台。@Meta_Engineers 这篇博客复盘了一个小团队如何借助 Agent 从零开发产品。核心不再是生成更多代码，是让规划、实现、测试和修正持续运转，人负责目标、关键判断与上线批准。\nhttps://t.co/MFJNNgAHk1\n\n从逐步指挥，转向监督完整执行过程\n\n团队追求的是：Agent 自己完成多轮开发，工程师在偏离目标时介入，而不是每一步都下指令。但作者明确说，这仍是推进中的方向，并非所有阶段都已实现。\n\n关键是把“做完”的标准接进执行过程：需求写成精确、机器可读的规格；构建结果、单元测试和界面对照检查持续反馈给 Agent；导航 Agent 操作正在运行的应用，执行回归验证。提交审查时，还要附上构建、测试结果和验证录像。能编译并不代表完成，每项上线仍需工程师批准。\n\n收益不只来自模型，更来自代码和工具改造\n\n团队把反复出现的纠正写进 Rules，用 Skills 固化操作，通过 Commands 串联复现、修复和审查，再用 Hooks 自动触发检查。\n\n更值得注意的是，他们认为最大收益来自改造代码和工具，而非反复调整提示词：让模块结构更清楚，必要时减少复用；让 Agent 直接读取模拟器的实时界面层级，而不是依赖文字描述。\n\n团队用八周实现了与 Facebook Groups 的核心功能对等；开发阶段的压力测试还帮助发现内存问题，修复后内存占用和缺页次数约减半。但文章未披露团队人数、完整功能范围及测试口径，也没有宣布这套工程系统开源。", "createdAt": "Wed Nov 11 02:10:27 +0000 2026", "replyCount": 16, "retweetCount": 0, "likeCount": 11, "conversationId": "2120338335877181579", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2120184714711482617", "text": "🧠Forum, Meta’s new standalone Groups app, was built by a small team that brought an AI agent into the development cycle as a participant — planning, building, testing, and verifying.\n\nBuilding Forum we moved from human-in-the-loop — engineer drives, AI assists inside each step — to human-on-the-loop, where the agent runs the iteration (plan, implement, build, test, correct, repeat) and the engineer sets the goal, watches the run, and owns the outcome.\n\nThe key decision: success wasn’t measured in code volume. It was measured in changes that build, pass tests, and survive review.\n\n✅ Reached core feature parity with Facebook Groups in eight weeks\n\n📈 An autonomous stress-testing loop caught a memory issue during development, roughly halving memory use and page faults\n\n🔗 Read how our engineers went AI-native to build Forum: https://t.co/y0gN0GfQxZ\n\n#AI #SoftwareEngineering #DeveloperTools #MobileEngineering #Engineering", "createdAt": "Tue Nov 10 16:00:01 +0000 2026", "replyCount": 26, "retweetCount": 29, "likeCount": 326, "conversationId": "2120184714711482617", "author": {"username": "Meta_Engineers", "name": "Engineering at Meta", "profileImageUrl": "https://pbs.twimg.com/profile_images/1453866309851049989/Iq6B3KjP_normal.png"}, "authorId": "68639853", "translationZh": "🧠 Forum 是 Meta 新推出的独立群组应用。一个小团队打造了它，让 AI 智能体参与规划、开发、测试和验证的全过程。\n\n开发 Forum 时，我们从人工主导转向人工监督。以前由工程师推动每一步，AI 在各环节提供辅助。现在由智能体自主迭代，反复规划、实现、构建、测试和修正，工程师负责设定目标、监督执行并对结果负责。\n\n我们用能否成功构建、通过测试并经得起审查来衡量每项改动的成效。\n\n✅ 八周内实现了与 Facebook Groups 的核心功能对齐\n\n📈 自动化压力测试在开发阶段发现了一个内存问题，修复后内存占用和缺页次数都减少了约一半\n\n🔗 了解我们的工程师如何将 AI 融入 Forum 的整个开发流程：https://t.co/y0gN0GfQxZ\n\n#AI #SoftwareEngineering #DeveloperTools #MobileEngineering #Engineering"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWz0dcSacAA9_rm.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWz0dcSacAA9_rm.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-11T02:10:27+00:00", "createdAtBeijing": "2026-11-11T10:10:27+08:00", "createdAtLocal": "11-11 10:10 北京", "url": "https://x.com/shao__meng/status/2120338335877181579", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2120338335877181579", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Meta Forum 的 Agent 开发与验证闭环", "evidence": "团队用八周实现了与 Facebook Groups 的核心功能对等", "rationale": "Meta 自报交付成果，并披露机器可读规格和回归验证做法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120480407242375466", "track": "agent", "source": {"id": "2120480407242375466", "text": "同样一个 GitHub 查询任务，MCP 消耗的输入 Token 居然是 CLI 的 42 倍。\n\nOpenRouter 做了个实验对比 MCP、CLI 和 Skills 三种工具接入方式。\n\n在 Claude Sonnet 5.5 上，三种方式都成功完成任务，但 CLI 只用了约 1,400 Tokens，Skill 约 3,300，而默认加载 46 个工具的 MCP 接近 6 万。\n\n差距主要出在 Context 开销。MCP 的工具定义和冗长的返回内容占用了大量空间，光是一次 GitHub Release 查询就消耗了约 2 万 Tokens。\n\n作者还测试了 Tool Search 和精简工具返回内容，发现能明显降低开销，但不同模型的表现并不一致。\n\n当然，这只是单个任务的小规模实验，还不能说明 CLI 在所有场景下都更好。\n\n不过确实有必要给自己的 Agent 工具链做一次 Context 审计。我们都在给 Agent 加工具，但每多加一个工具，究竟增加了多少能力，又带来了多少额外成本，确实值得算清楚。\n\n原文：https://t.co/xI0XwFI0E0", "createdAt": "Wed Nov 11 11:35:00 +0000 2026", "replyCount": 2, "retweetCount": 3, "likeCount": 24, "conversationId": "2120480407242375466", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-11T11:35:00+00:00", "createdAtBeijing": "2026-11-11T19:35:00+08:00", "createdAtLocal": "11-11 19:35 北京", "url": "https://x.com/Xudong07452910/status/2120480407242375466", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2120480407242375466", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "MCP、CLI 与 Skills 的输入 Token 开销对比", "evidence": "MCP 消耗的输入 Token 居然是 CLI 的 42 倍", "rationale": "转述单任务实测，并指出工具定义和返回内容的开销"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120414121334063289", "track": "research", "source": {"id": "2120414121334063289", "text": "Scale AI 这个 GRPO vs PPO 的研究提供了一个很好的 insight。\n\n现在的 Agent 任务越来越长、Rollout 成本越来越高，Critic 的价值可能被低估了。实验发现，小 Batch 下 PPO 更有优势，而 GRPO 通常需要更大的 Batch 才能追上。\n\n我记得之前智谱发布 GLM-5.2 时，就已经明确转向 Critic-based PPO，后续的 SAO 论文也进一步验证了这条路线的可行性。\n\n感觉随着 Agent RL 向长时任务发展，如何提高单条 Rollout 的学习效率，会变得越来越重要。", "createdAt": "Wed Nov 11 07:11:36 +0000 2026", "replyCount": 10, "retweetCount": 22, "likeCount": 152, "conversationId": "2120414121334063289", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2120256839665188900", "text": "1/ As agentic tasks grow longer and rollouts become more expensive, the choice between critic-based PPO and critic-free GRPO becomes increasingly important.\n\nCritics can reduce gradient variance, allowing models to learn from fewer trajectories, but they also introduce additional compute costs and potential bias from bootstrapping.\n\nOur new research @ScaleAILabs  compares PPO and GRPO under a shared actor objective across 1,200+ training runs in control tasks, short-horizon math, and long-horizon terminal agents. We studied how three factors influence this tradeoff: batch size, critic reliance, and task complexity. 🧵", "createdAt": "Tue Nov 10 20:46:37 +0000 2026", "replyCount": 23, "retweetCount": 58, "likeCount": 388, "conversationId": "2120256839665188900", "author": {"username": "jaswwei", "name": "Jason Wei", "profileImageUrl": "https://pbs.twimg.com/profile_images/1968772965685665792/M6aOGLb1_normal.jpg"}, "authorId": "1870543195932667904", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyoWqrXsAA730P.png", "width": 1672, "height": 1194, "previewUrl": "https://pbs.twimg.com/media/HWyoWqrXsAA730P.png:small"}], "translationZh": "1/ 随着智能体任务耗时越来越长、轨迹采样成本越来越高，如何在有评论器（critic）的 PPO 和无评论器的 GRPO 之间取舍，变得越来越重要。\n\n评论器能降低梯度方差，让模型用更少的轨迹学习，但也会增加计算开销，并可能因自举估计引入偏差。\n\n我们在 @ScaleAILabs 的新研究中，采用相同的策略网络（actor）优化目标，对 PPO 和 GRPO 进行了 1,200 多次训练对比，覆盖控制任务、短程数学任务和长程终端智能体任务。我们考察了三个影响取舍的因素：批量大小、对评论器的依赖程度和任务复杂度。🧵"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-11T07:11:36+00:00", "createdAtBeijing": "2026-11-11T15:11:36+08:00", "createdAtLocal": "11-11 15:11 北京", "url": "https://x.com/Xudong07452910/status/2120414121334063289", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2120414121334063289", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "长时任务强化学习中的 PPO 与 GRPO", "evidence": "小 Batch 下 PPO 更有优势", "rationale": "逾千次训练比较两种算法，报告小批量差异"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120313054856688114", "track": "agent", "source": {"id": "2120313054856688114", "text": "之前推荐过几篇 Agent Eval 相关的文章，今天再推荐一篇 LangChain 最新的《What Is Eval-Driven Development》，这篇讲得挺实用，很适合正在做 Agent 和 Harness 的朋友。\n\n文章主要介绍 Eval-Driven Development（EDD），核心思路是把 Eval 融入 Agent 的日常开发。\n\n先定义什么算成功，写好 Eval、跑 Baseline，再修改 Prompt、Tool 或 Harness，通过相同的任务对比效果。\n\n文中有个挺有意思的例子。\n\n给知识库 Agent 新增 create_ticket 工具后，整体 Eval 分数提高了，结果它连「VPN 怎么连接」这种普通咨询都开始创建故障工单。\n\n通过 Trace 排查才发现，工具描述太宽泛，导致 Agent 错误调用了工具。\n\n这也说明不能只看 Eval 平均分。一次改动可能让新任务表现更好，却破坏原本正常的功能。除了最终结果，还需要检查执行轨迹，并保留独立测试集，避免反复优化导致过拟合。\n\n这套思路很值得借鉴，尤其是现在大家都在不断调整 Skill、Prompt 和 Harness。\n\n新增一个 Skill、修改一段 Workflow，甚至删掉旧 Harness，都应该通过 Eval 判断是否真的有效。\n\n感觉 Eval-Driven Development 很值得成为 Agent 开发中的常规习惯，每次迭代都能有据可依。\n\n原文：https://t.co/yAxHHtStaT", "createdAt": "Wed Nov 11 00:30:00 +0000 2026", "replyCount": 12, "retweetCount": 52, "likeCount": 362, "conversationId": "2120313054856688114", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-11T00:30:00+00:00", "createdAtBeijing": "2026-11-11T08:30:00+08:00", "createdAtLocal": "11-11 08:30 北京", "url": "https://x.com/Xudong07452910/status/2120313054856688114", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2120313054856688114", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "评测驱动的 Agent 开发", "evidence": "工具描述太宽泛，导致 Agent 错误调用了工具", "rationale": "用基线对比和执行轨迹定位误建工单的回归"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120311979768467465", "track": "research", "source": {"id": "2120311979768467465", "text": "⑤ Artificial Analysis 智能指数。\n\nFable 5.2 拿 65 分排第一，Carbon 60 分，Opus 5.5 59 分。\n\n综合智力 Fable 领先，但 Carbon 在部分 Agent 项目上反超。\n\nhttps://t.co/u6mvThFgKU", "createdAt": "Wed Nov 11 00:25:44 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2120311940451049946", "inReplyToStatusId": "2120311971564425626", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2119878995386982508", "text": "Anthropic has released Claude Fable 5.2, taking the #1 spot on the Artificial Analysis Intelligence Index v5 at 65, led by gains in science, knowledge, and coding\n\nAt max effort it scores 65, 5 points ahead of Gemini 4 Carbon (high, 60) and 6 ahead of Claude Opus 5.5 (max, 59). Gains are driven by scientific reasoning, knowledge and FrontierCode 2.0, and roughly matching Opus 5.5 on AA-Briefcase and Terminal-Bench 4.0.\n\nPriced at $8/$40 per 1M input/output tokens, a 20% reduction from Fable 5.1, Claude Fable 5.2 averages a Cost per Task of $26.5 with max effort, a ~2.6x increase compared to Opus 5.5 (max, $10.0) and ~2x compared to Fable 5.1 (max, $12.99)\n\nKey takeaways:\n\n➤ Claude Fable 5.2 leads 5 of the 9 evaluations in the Intelligence Index: At max effort, Fable 5.2 scores 65, ahead of Gemini 4 Carbon (high, 60), Claude Opus 5.5 (max, 59) and GPT-6 Astra (max, 57), and ~15 points above Claude Fable 5.1 (max, 49). It sets the highest scores on HLE-Diamond (80%, previous best 69% from Gemini 4 Carbon), AA-Omniscience v1.1 (67, previous best 54 from Gemini 4 Carbon), Terminal-Bench-Science (73%, previous best 65% from Gemini 4 Carbon), CritPt v2 hard subset (77%, previous best 72% from GPT-6 Astra) and FrontierCode 2.0 (49%, previous best 46% from Claude Opus 5.5)\n\n➤ Less progress in agentic knowledge work and terminal coding: Claude Fable 5.2 improves on Fable 5.1 across capabilities, but sometimes only to Opus 5.5 levels. It reaches 1785 Elo on AA-Briefcase, within the confidence interval of Opus 5.5 (1800) and just behind Claude Sonnet 5.5 (1813). On GDP.pdf it reaches 24% all-pass against 26% for Opus 5.5. On Terminal-Bench 4.0 it scores 60%, level with Opus 5.5 and behind Kimi K3.1 Pro (67%), Gemini 4 Carbon (65%) and Sonnet 5.5 (64%). AutomationBench-AA is an exception, at 76% against 70% for Opus 5.5, narrowly behind Gemini 4 Carbon, 78%\n\n➤ Lower efforts still take leading positions: With high and xhigh effort, Claude Fable 5.2 scores 62, ahead of every other model at any effort, using 98k output tokens per task against 173k for Opus 5.5 (max). At max effort Fable 5.2 costs ~2.6x more than Opus 5.5, but at lower effort settings it can outperform Opus 5.5 at lower cost per task\n\nOther model details:\n\n➤ Context window: 1 million tokens with image and text input\n\n➤ Pricing: $8/$40 per 1M input/output tokens; cache writes $10 with 5-minute TTL, $16 with 1-hour TTL, and cache reads $0.20\n\n➤ Effort settings: five (low, medium, high, xhigh, max). Intelligence Index evaluations were run at all five with Anthropic's default fallback enabled\n\nCongratulations to @AnthropicAI on this impressive release!", "createdAt": "Mon Nov 09 19:45:12 +0000 2026", "replyCount": 123, "retweetCount": 220, "likeCount": 2874, "conversationId": "2119878995386982508", "author": {"username": "ArtificialAnlys", "name": "Artificial Analysis", "profileImageUrl": "https://pbs.twimg.com/profile_images/2042402069320290304/A8C1lP07_normal.jpg"}, "authorId": "1743487864934162432", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtSH-LbUAAa8Im.jpg", "width": 2048, "height": 1840, "previewUrl": "https://pbs.twimg.com/media/HWtSH-LbUAAa8Im.jpg:small"}], "translationZh": "Anthropic 发布了 Claude Fable 5.2，以 65 分登顶 Artificial Analysis Intelligence Index v5，提升主要来自科学推理、知识和编程能力。\n\n在 max 推理档位下，它拿到 65 分，领先 Gemini 4 Carbon（high，60 分）5 分，领先 Claude Opus 5.5（max，59 分）6 分。增幅主要来自科学推理、知识和 FrontierCode 2.0，在 AA-Briefcase 和 Terminal-Bench 4.0 上则与 Opus 5.5 大致持平。\n\n每百万输入和输出 token 分别收费 8 美元和 40 美元，较 Fable 5.1 下调 20%。在 max 档位下，Claude Fable 5.2 的平均单任务成本为 26.5 美元，约为 Opus 5.5（max，10.0 美元）的 2.6 倍、Fable 5.1（max，12.99 美元）的 2 倍。\n\n主要结果：\n\n➤ Claude Fable 5.2 在 Intelligence Index 的 9 项评测中领跑 5 项。max 档位下得分为 65，超过 Gemini 4 Carbon（high，60 分）、Claude Opus 5.5（max，59 分）和 GPT-6 Astra（max，57 分），比 Claude Fable 5.1（max，49 分）高约 15 分。它刷新了 HLE-Diamond（80%，此前最高为 Gemini 4 Carbon 的 69%）、AA-Omniscience v1.1（67 分，此前最高为 Gemini 4 Carbon 的 54 分）、Terminal-Bench-Science（73%，此前最高为 Gemini 4 Carbon 的 65%）、CritPt v2 高难度子集（77%，此前最高为 GPT-6 Astra 的 72%）和 FrontierCode 2.0（49%，此前最高为 Claude Opus 5.5 的 46%）的纪录。\n\n➤ 智能体知识工作和终端编程的进步较小。Claude Fable 5.2 的各项能力较 Fable 5.1 有所提升，但部分表现仅达到 Opus 5.5 的水平。它在 AA-Briefcase 上拿到 1785 Elo，落在 Opus 5.5（1800）的置信区间内，略低于 Claude Sonnet 5.5（1813）。在 GDP.pdf 上，它的全通过率为 24%，Opus 5.5 为 26%。在 Terminal-Bench 4.0 上，它拿到 60%，与 Opus 5.5 持平，落后于 Kimi K3.1 Pro（67%）、Gemini 4 Carbon（65%）和 Sonnet 5.5（64%）。AutomationBench-AA 是个例外，它拿到 76%，高于 Opus 5.5 的 70%，略低于 Gemini 4 Carbon 的 78%。\n\n➤ 较低推理档位依然领先。Claude Fable 5.2 在 high 和 xhigh 档位均拿到 62 分，超过其他所有模型在任意档位的得分。它每项任务消耗 9.8 万输出 token，Opus 5.5 在 max 档位下则为 17.3 万。Fable 5.2 在 max 档位下的单任务成本约为 Opus 5.5 的 2.6 倍，但调低档位后，可以用更低的单任务成本取得更好的成绩。\n\n其他模型参数：\n\n➤ 上下文窗口：100 万 token，支持图片和文本输入。\n\n➤ 价格：每百万输入和输出 token 分别为 8 美元和 40 美元。缓存写入按每百万 token 计费，5 分钟 TTL 为 10 美元，1 小时 TTL 为 16 美元；缓存读取为 0.20 美元。\n\n➤ 推理档位：共五档（low、medium、high、xhigh、max）。Intelligence Index 在全部五档下都进行了评测，并启用了 Anthropic 的默认回退机制。\n\n祝贺 @AnthropicAI 带来这次亮眼的发布！"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-11T00:25:44+00:00", "createdAtBeijing": "2026-11-11T08:25:44+08:00", "createdAtLocal": "11-11 08:25 北京", "url": "https://x.com/MinLiBuilds/status/2120311979768467465", "themeId": "editorial", "signalScore": 50, "editorial": {"id": "2120311979768467465", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Claude Fable 5.2 发布与分项评测", "evidence": "Fable 5.2 拿 65 分排第一", "rationale": "发布评测涵盖分项能力、推理档位与任务成本。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2120426914338984322", "track": "agent", "source": {"id": "2120426914338984322", "text": "这就是大神在 Superlogical 的开发方式，团队不大，但是非常符合现代 Agent 的开发方式：\n\n1 直接 push main，采用 agent pre-push review + 人工 + agent post-push  审查的方式，几乎不开 PR\n\n2 谁都可以发新的 release，启动发布 release 会触发 Slack 通知并开始 15 分钟倒计时，任何人都可以在这 15 分钟内暂停。（让大家都有机会去最后 review 一次这个版本的修改，主动权交给所有人）\n\n3 服务器和各平台做到快速上线，事后用人工加假期 review的方式来识别不同平台的差异度，并且做到快速补齐，不通过浪费时间的会议来完成功能对齐。（应该说的就是说各干各的，完成就上线，别的平台来对齐最新的功能就好）", "createdAt": "Wed Nov 11 08:02:26 +0000 2026", "replyCount": 17, "retweetCount": 14, "likeCount": 138, "conversationId": "2120426914338984322", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2120221244478083249", "text": "We're still so small but I'm loving the team we've got at Superlogical. They're so talented and kind and love their craft. It's a different era of software development and our expectations and practices reflect that. I want to share a bit about how we work.\n\nFirst, everyone is trusted to push to main. We do machine-aided code review pre-push and human plus more machine-aided code review post-push. Limited to no PRs.\n\nCulturally, we've all agreed that if we ever hire someone who we DON'T trust to push directly to main, then they probably aren't the right fit for the team (so far, not an issue).\n\nSome common sense here: if someone is stepping outside their lane or comfort zone, we'll open PRs. For example, I'm pretty trash at macOS/iOS UI, so I'll open PRs for UI-affecting functionality and ask for eyeballs/help. But for business logic and internals, I push to main.\n\nSecond, everyone can cut a release. Our release process is fully automated and when you start a release (for any platform) it triggers a Slack notification and a 15 minute countdown.\n\nThe 15 minute warning is a final gate that allows people to review plus collaborate on a changelog. During that 15 minutes, anyone in the company can pause the release rollout. After 15 minutes, the train leaves the station. You can't override the 15 minutes (except to pause). It gives everyone a chance to step in.\n\nThird, we avoid synchronization through fast remediation rather than through planning. The server and clients on various platforms ship features as fast as they can. We use post-hoc human review and AI-assistance to identify feature mismatches across products (\"Windows has support for X and Mac doesn't.\" or \"Mac and Windows differ in their behaviors for Y in this way.\").\n\nThis avoids expensive \"sync\" meetings and coordination. We trust that producers of features are mindful of what they're producing and we trust that adjacent product lines will self-synchronize quickly. In practice, we see feature parity across platforms within 24 to 48 hours.\n\nAll of this works on mutual trust. It ONLY works with mutual trust. \n\nEveryone at all times has to trust that they've got each others back:\n\n1. Push to main only works if you fix your mess, or if you don't, that someone else will quickly but that you'd do the same (and generally in equal amounts). \n\n2. Anyone can deploy only works if you trust everyone to cut at the right time, with the right changelog, and that people will respect the 15 minute timer.\n\n3. Sync through fast remediation only works if you trust other teams will pick up and integrate your work quickly, which only works if you would too. It also only works if you are fairly producing mismatches (e.g. not constantly).\n\nWe've got a great team. I know we're still small and that these practices will change in many ways as we scale. But this is already a markedly different practice than what I would've done 15 years ago. \n\nIn general, we are building from day 1 on a foundation of mutual respect, excellence, and trust. And it's been awesome.", "createdAt": "Tue Nov 10 18:25:11 +0000 2026", "replyCount": 166, "retweetCount": 171, "likeCount": 4263, "conversationId": "2120221244478083249", "author": {"username": "mitchellh", "name": "Mitchell Hashimoto", "profileImageUrl": "https://pbs.twimg.com/profile_images/2082830624415698944/bRo7PB2S_normal.jpg"}, "authorId": "12819682", "translationZh": "Superlogical 还是个很小的团队，但我很喜欢和大家共事。他们有才华、待人友善，也热爱自己的专业。软件开发已经进入一个不同的时代，我们对彼此的期待和做事方式也在变。我想分享一下我们的工作方式。\n\n第一，我们信任每个人都能直接推送到 main。推送前做机器辅助代码审查，推送后再做人工审查和进一步的机器辅助审查。我们很少开 PR，有时完全不开。\n\n团队有个共识：如果我们连直接推送到 main 都不放心交给某位新同事，那这个人可能就不适合团队。目前还没遇到过这种情况。\n\n具体怎么做也看情况。谁要是改到自己职责之外或不熟悉的领域，就开 PR。比如我做 macOS/iOS 界面不太行，涉及界面的功能我会开 PR，请同事帮忙看看。业务逻辑和内部实现的改动，我就直接推送到 main。\n\n第二，每个人都可以发版。发布流程完全自动化，任何平台一旦启动发布，就会触发 Slack 通知，并开始 15 分钟倒计时。\n\n这 15 分钟是发布前的最后一道关，大家可以做最后一轮审查，一起完善更新日志。期间公司任何人都能暂停发布。倒计时结束后，发布就会继续。除了暂停，谁也不能跳过这 15 分钟，每个人都有机会介入。\n\n第三，我们通过快速补齐差异来减少事前协调。服务端和各平台客户端按各自能达到的速度发布功能。事后我们通过人工审查和 AI 辅助找出产品间的差异，比如「Windows 支持 X，Mac 还不支持」或「Mac 和 Windows 在 Y 上的行为有这些差别」。\n\n这样可以省去耗时的同步会议和协调。我们相信做功能的人会考虑改动的影响，也相信相关产品线会迅速跟进。实际运行下来，各平台通常能在 24 到 48 小时内补齐功能差异。\n\n这一切都建立在相互信任上，只有彼此信任才行得通。\n\n每个人都得相信，遇到问题时，大家随时都会互相兜底：\n\n1. 直接推送到 main 的前提是，出了问题你会自己修。如果你没来得及修，也有人会迅速补上，而你同样会帮别人兜底，大家的付出大致相当。\n\n2. 人人都能发布的前提是，你相信每个人都会选对发布时间、写好更新日志，并遵守 15 分钟的倒计时。\n\n3. 靠快速修正来对齐的前提是，你相信其他团队会迅速接手并集成你的改动，你自己也会同样跟进。这还要求大家把功能差异控制在合理范围内，比如别频繁造成不一致。\n\n我们的团队很棒。我知道我们现在规模还小，随着团队壮大，这些做法会有很多变化。但和 15 年前我会采用的方式相比，现在的做法已经明显不同。\n\n从第一天起，我们就把相互尊重、追求卓越和彼此信任作为团队的基础。到目前为止，这段经历很棒。"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-11T08:02:26+00:00", "createdAtBeijing": "2026-11-11T16:02:26+08:00", "createdAtLocal": "11-11 16:02 北京", "url": "https://x.com/vikingmute/status/2120426914338984322", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2120426914338984322", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "小团队的 AI 辅助审查与发布流程", "evidence": "任何人都可以在这 15 分钟内暂停", "rationale": "分享推送前后审查、发布暂停机制和跨平台补齐做法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2120390857350353015", "track": "research", "source": {"id": "2120390857350353015", "text": "😲 这就是开源的魅力！MiniMax H3 生成比播放还快，无限月读。\n\npi-H3，单张 NVIDIA B200，生成 10 秒 768p 带音频视频，仅需 9.16 秒。\n\n怎么做到的？主要是两个措施：\n\n1. 去噪步数大幅压缩\n\n通过 π-Flow v2 蒸馏，把原本多步去噪压缩到 2～4 步，大幅减少模型调用次数。\n\n2. 连视频 VAE Decoder 都省了\n\n通过 DWD 技术，让模型在最后一步直接预测 RGB 像素，不再需要独立的视频 VAE 解码器。\n\nMiniMax 开放模型的进化厉害了，这么多研究者直接站在它的肩膀上继续优化。\n\n一家公司的成果，变成整个社区的起点。", "createdAt": "Wed Nov 11 05:39:10 +0000 2026", "replyCount": 5, "retweetCount": 1, "likeCount": 16, "conversationId": "2120390857350353015", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2120186218176491876", "text": "Introducing pi-H3⚡, the fastest MiniMax H3 yet. 10 s of 768p video with audio generated in 9.2 s on a single B200.\n\nHow we did it:\nDirect pixel output in 2 or 4 steps, no video VAE decoder.\n\nBlog: https://t.co/z9LJ7cWW7t\nApp: https://t.co/haaESsn6nN\n\n@StanfordAILab @LumaLabsAI https://t.co/VljlSRnflB", "createdAt": "Tue Nov 10 16:06:00 +0000 2026", "replyCount": 34, "retweetCount": 47, "likeCount": 629, "conversationId": "2120186218176491876", "author": {"username": "HanshengCh", "name": "Hansheng Chen", "profileImageUrl": "https://pbs.twimg.com/profile_images/1923067732779479040/c20JJJ0D_normal.jpg"}, "authorId": "1697609121938489344", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120185922881015808/img/T3foNsx7o_33oN2t.jpg", "width": 1080, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120185922881015808/img/T3foNsx7o_33oN2t.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120185922881015808/vid/avc1/1080x1080/ErqoO_D_zTFQAlFz.mp4?tag=29", "durationMs": 98517}], "translationZh": "推出 pi-H3⚡，迄今最快的 MiniMax H3。单张 B200 仅需 9.2 秒即可生成 10 秒的 768p 带音频视频。\n\n实现方法：\n用 2 步或 4 步直接输出像素，无需视频 VAE 解码器。\n\n博客：https://t.co/z9LJ7cWW7t\n应用：https://t.co/haaESsn6nN\n\n@StanfordAILab @LumaLabsAI https://t.co/VljlSRnflB"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW0kGhWaoAAfL3z.jpg", "width": 2048, "height": 852, "previewUrl": "https://pbs.twimg.com/media/HW0kGhWaoAAfL3z.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-11T05:39:10+00:00", "createdAtBeijing": "2026-11-11T13:39:10+08:00", "createdAtLocal": "11-11 13:39 北京", "url": "https://x.com/MinLiBuilds/status/2120390857350353015", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2120390857350353015", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "pi-H3 实时视频生成", "evidence": "把原本多步去噪压缩到 2～4 步", "rationale": "发布方报告单卡实时生成带音频视频，并披露两项提速方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2120503085478895753", "track": "growth", "source": {"id": "2120503085478895753", "text": "GEOFlow 3.2.1完成更新，已推送到GitHub仓库\n\n持续把 GEO 项目里的真实需求，做进这套面向AI时代的企业官网的开源 GEO 智能运营系统\n\n近期主要更新了六个方面：\n\n1、专题内容生产\n把已有文章重新组织成专题，支持 AI 生成、选文分组、审核发布和定期维护，并接入首页、导航和文章回链。让分散的文章形成有结构的内容资产\n\n2、链接池与推荐投放\n按分类、关键词和活动规则配置文章推荐，支持站内文章与经过健康检查的外部链接，并查看推荐展示、读者可见和点击数据。\n\n3、提示词实时测试\n提示词草稿无需保存，就能结合知识库和选题试跑，查看流式生成结果与带原文定位的 AI 诊断，缩短调试反馈周期。\n\n4、知识导入与智能配图\n新增 PDF、PPTX 文本导入，AI 可以根据图片库的备注和标签选择正文配图，让企业已有资料更方便地参与内容生产\n\n5、平台辅助发布\n头条号、搜狐号、网易号接入人工工单和 Chrome 运营助手，串起任务领取、辅助操作、人工确认发布、结果回执与异常对账\n\n6、AI 可见性分析\n增加专题归类、竞品与信源证据、词云清洗，标记近 7 天成功采集的关键词，支持手动重采，让日常监测与复盘更顺手\n\n同时，完善了文章审核与自动发布、3.x 模板兼容、火山方舟向量接入、数据持久化和部署升级\n\nGitHub：https://t.co/UHwRimsmDr", "createdAt": "Wed Nov 11 13:05:07 +0000 2026", "replyCount": 3, "retweetCount": 8, "likeCount": 91, "conversationId": "2120503085478895753", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW2KTIrW4AAX2RB.jpg", "width": 1672, "height": 941, "previewUrl": "https://pbs.twimg.com/media/HW2KTIrW4AAX2RB.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-11-11T13:05:07+00:00", "createdAtBeijing": "2026-11-11T21:05:07+08:00", "createdAtLocal": "11-11 21:05 北京", "url": "https://x.com/yaojingang/status/2120503085478895753", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2120503085478895753", "technicalRelevant": true, "dailyGrade": "A", "channel": "growth", "topic": "GEOFlow 3.2.1发布", "evidence": "GEOFlow 3.2.1完成更新", "rationale": "作者公布开源版本更新，详列专题运营、分发和AI可见性监测功能"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2120426468367032362", "track": "creative", "source": {"id": "2120426468367032362", "text": "MiniMax 最新放出的 H3 Image 图像模型\n大家最想知道的 NSFW🔞：原生支持，为所欲为！\n\n玩笑归玩笑，但“不阉割”背后，真正值钱的是他们把完整的开源控制权交给了开发者。\n\n为了测它的底图精度，我们对照官方宣传片自己动手复刻了一支 66 秒的片子。\n\n画面很简单：一只红顶白身的纸鹤，穿过云海、城市夜景、线稿和水墨卷轴。出图全靠 H3 Image，再顺手扔进现成的 H3 Video 跑动态，全程自动。\n\n重点在图像模型本身：\n换了五六个截然不同的画风场景，纸鹤的折痕和红顶比例全程咬死，没有漂移变形成另一只鸟，结构底子相当扎实。\n\n夸一下 MiniMax 的开源格局，继H3视频后，继续开源！\n  \n把模型拖到本地卡上，意味着你能随便调参、魔改流水线，失败几十次推倒重来也不用看厂商脸色。\n  \n虽然光 DiT 权重就 68 GB，整套拉满奔着 135 GB 去，门槛极高，跑起来也吃力。\n\n但“硬件门槛高”和“愿不愿给真家伙”，完全是两码事。\n  \n在满大街都是安全锁和 API 玩具的当下，这种开源态度值得单独给一掌声！", "createdAt": "Wed Nov 11 08:00:40 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 14, "conversationId": "2120426468367032362", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2120389130848960708", "text": "MiniMax H3-Image 来了，而且已经开源，ComfyUI 首日支持。\n\n这是一款衍生自 @MiniMax_AI  H3的图像生成模型，其具备文本生成图像、图像参考和图像编辑能力。它能够在10秒内生成一长4096 x4096 像素、约16MP(4K)的高分辨率图像\n\n具体强在哪：\n\n① 快。10 秒出一张 4K 图，1600 万像素。\n② 真。画面写实，皮肤、绒毛、纸张纹理都很细。\n③ 听话。提示词写什么就给什么，连图纸上的标题栏、零件表文字都清晰可读。\n④ 改图准。只动指定的部分，其余构图和标注原地不变。\n⑤ 参考图多。一次最多 16 张。\n⑥ 懂工业设计。一张参考图就能转成多视图 CAD 工程线稿，也能出机械爆炸图，各个视图的结构对得上。\n⑦ 风格广。游戏主视觉、3D 场景、角色设定，油画、超现实、东方美学都能出。\n⑧ 权重开放。可以下载到本地，接进自己的工作流。\n\n我们就是冲着 CAD 这一条去的：\n用它加 H3 视频模型，做了一条\"工程图纸上的翼龙活过来、破纸飞出\"的短片，全片没有特效合成。\n\n现已上线 API、MiniMax Code 和海螺 AI，首周 1600 万像素以上生成五折。\n\n权重下载：https://t.co/Fxxjfvxw85\nAPI：https://t.co/PLhSLqih4j\n\n#H3Image", "createdAt": "Wed Nov 11 05:32:18 +0000 2026", "replyCount": 35, "retweetCount": 10, "likeCount": 110, "conversationId": "2120389130848960708", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120388983482175489/img/jR0Chl9F9crsbTzq.jpg", "width": 2048, "height": 995, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120388983482175489/img/jR0Chl9F9crsbTzq.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120388983482175489/vid/avc1/2560x1244/AYc3IM80PKIonhTw.mp4?tag=29", "durationMs": 16250}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120425257425375232/img/CsEk-Q2paMFqpaTe.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120425257425375232/img/CsEk-Q2paMFqpaTe.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120425257425375232/vid/avc1/3840x2160/B4gWSRO1dpA6mMBn.mp4?tag=29", "durationMs": 66330}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-11T08:00:40+00:00", "createdAtBeijing": "2026-11-11T16:00:40+08:00", "createdAtLocal": "11-11 16:00 北京", "url": "https://x.com/servasyy_ai/status/2120426468367032362", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2120426468367032362", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "MiniMax H3 Image 权重开放与纸鹤短片实测", "evidence": "自己动手复刻了一支 66 秒的片子", "rationale": "介绍权重发布，并报告跨画风一致性与本地运行门槛"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2120514407331709139", "track": "research", "source": {"id": "2120514407331709139", "text": "我其实有点好奇，为什么几乎所有的模型都是这样的一个右括号曲线，有什么合理的解释吗？", "createdAt": "Wed Nov 11 13:50:06 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 5, "conversationId": "2120514407331709139", "author": {"username": "xuanwo", "name": "Xuanwo", "profileImageUrl": "https://pbs.twimg.com/profile_images/1710192299588964352/WY_GNo3r_normal.jpg"}, "authorId": "3399124639", "quotedTweet": {"id": "2120268980778668036", "text": "Gemini 4 Carbon from @Google on ARC-AGI (Verified):\n\n- ARC-AGI-3: 99.1%, $4.6K (provider adapter), 65.1%, $7.2K (standard harness)\n- ARC-AGI-2: 94.2%, $0.38/task\n- ARC-AGI-1: 98.5%, $0.16/task\n\nCarbon beat its predecessor Argon by 18% points on ARC-AGI-3 in the standard harness. https://t.co/HK4aHhySuH", "createdAt": "Tue Nov 10 21:34:52 +0000 2026", "replyCount": 23, "retweetCount": 51, "likeCount": 647, "conversationId": "2120268980778668036", "author": {"username": "arcprize", "name": "ARC Prize", "profileImageUrl": "https://pbs.twimg.com/profile_images/1800565057493078016/XigYRdTo_normal.jpg"}, "authorId": "1773935160192647168", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWy1ZsmXAAAxFY3.jpg", "width": 1966, "height": 1168, "previewUrl": "https://pbs.twimg.com/media/HWy1ZsmXAAAxFY3.jpg:small"}], "translationZh": "@Google 的 Gemini 4 Carbon 在 ARC-AGI 上的成绩（已验证）：\n\n- ARC-AGI-3：99.1%，4,600 美元（供应商适配器）；65.1%，7,200 美元（标准评测框架）\n- ARC-AGI-2：94.2%，每项任务 0.38 美元\n- ARC-AGI-1：98.5%，每项任务 0.16 美元\n\n在标准评测框架下，Carbon 的 ARC-AGI-3 得分比上一代 Argon 高 18 个百分点。https://t.co/HK4aHhySuH"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Xuanwo", "role": "Agent 与开发工具实践与观察", "why": "能指出实际 Agent 请求参数和输出上限问题，补底层使用与维护经验。", "handle": "Xuanwo"}, "createdAtIso": "2026-11-11T13:50:06+00:00", "createdAtBeijing": "2026-11-11T21:50:06+08:00", "createdAtLocal": "11-11 21:50 北京", "url": "https://x.com/xuanwo/status/2120514407331709139", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2120514407331709139", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Gemini 4 Carbon 的 ARC-AGI 成绩与曲线形态", "evidence": "65.1%, $7.2K", "rationale": "引文给出多项基准成绩、成本及前代对比"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1710192299588964352/WY_GNo3r_normal.jpg"}, {"id": "2120561164249928125", "track": "creative", "source": {"id": "2120561164249928125", "text": "You can have Perplexity Teammates run your marketing studio that does end to end video creation for your product", "createdAt": "Wed Nov 11 16:55:54 +0000 2026", "replyCount": 37, "retweetCount": 8, "likeCount": 83, "conversationId": "2120561164249928125", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2120549261955956873", "text": "This commercial studio turns a few product photos and a one-line goal into a finished video ad.\n\nMy Product Builder teammate created this app that researches a brand, writes a brief, pitches three directions with their own hooks, generates voiceover lines and sound design, and draws a six-shot storyboard for each.\n\nStills are lower-cost vs. video, so you approve the whole commercial as a storyboard, and only the chosen direction gets rendered as final video.\n\nComputer sends the frames and the product photos to Seedance 2.5 with a time-coded shot list and sound notes, and outputs a 1080p vertical ad with native audio.", "createdAt": "Wed Nov 11 16:08:36 +0000 2026", "replyCount": 4, "retweetCount": 2, "likeCount": 17, "conversationId": "2120549261955956873", "author": {"username": "jeffgrimes9", "name": "Jeff Grimes", "profileImageUrl": "https://pbs.twimg.com/profile_images/1615440606456864769/FgBZT7uE_normal.jpg"}, "authorId": "308045348", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120548840248098816/img/JUd-Tn6Tp0uGCvat.jpg", "width": 1818, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120548840248098816/img/JUd-Tn6Tp0uGCvat.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120548840248098816/vid/avc1/1818x1080/oO5CsGuiciPP0JWk.mp4?tag=29", "durationMs": 50133}], "translationZh": "这个广告工作室只需几张产品照片和一句目标描述，就能制作出完整的视频广告。\n\n我的 Product Builder 队友做了这个应用。它会调研品牌、撰写创意简报，提出三个各有吸睛点的创意方向，并为每个方向撰写旁白、设计声音、绘制六镜头分镜。\n\n静帧的制作成本低于视频，所以你可以先看完整分镜来审核广告，选定一个方向后再渲染成片。\n\nComputer 将分镜画面、产品照片、带时间码的镜头清单和声音说明一并发给 Seedance 2.5，生成一条带原生音频的 1080p 竖屏广告。"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-11T16:55:54+00:00", "createdAtBeijing": "2026-11-12T00:55:54+08:00", "createdAtLocal": "11-12 00:55 北京", "url": "https://x.com/AravSrinivas/status/2120561164249928125", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2120561164249928125", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "从商品图到竖屏广告的制作流程", "evidence": "six-shot storyboard", "rationale": "演示先审六镜头分镜，再将选定方案渲染成片"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "你可以让 Perplexity Teammates 运营你的营销工作室，全程负责产品视频制作。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2120442377215324246", "track": "creative", "source": {"id": "2120442377215324246", "text": "Seedance 2.5提示词：\n16:9横版，30秒，黑白老式安防监控录像。三台固定广角监控摄像头记录东汉建安十三年冬，曹操赤壁兵败后在华容道叫网约车，却发现司机竟然是关羽的荒诞事件。\n\n真实三国历史电影人物与场景，融合现代科技造成强烈反差。所有人物严肃自然，不刻意搞笑。\n\n【监控机位与时间】\n\n全片由3个固定监控镜头组成，仅在第8秒、第19秒切换画面。每个镜头内部完全固定，零运镜、零变焦。\n\n三台监控使用统一录像时钟：\n\nCAM01：07:18:00—07:18:07\nCAM02：07:18:08—07:18:18\nCAM03：07:18:19—07:18:29\n\n切换时画面短暂出现模拟信号干扰，随后切入下一台监控，时间必须连续，不重复、不倒退、不跳秒。\n\n所有监控画面必须从头到尾显示以下三组信息：\n\n左上角：白色点阵像素时间戳「建安十三年 冬 07:18:00」，逐秒更新。\n\n左下角：白色点阵像素CAM编号与地点，随监控切换而变化。\n\n右上角：白色「● REC」，圆点轻微闪烁。\n\n三组信息为直接叠加在录像最上层的监控系统文字，从第一帧到最后一帧始终存在，不被任何人物或物体遮挡，不随镜头变化而消失。\n\n历史时辰为虚构的监控记录时间。\n\n【监控画质】\n\n黑白低分辨率VHS录像，明显颗粒噪点、轻微拖影、水平扫描线、边缘模糊、四角暗角、模拟信号干扰。\n\n画面高反差，暗部接近纯黑，清晨光线呈灰白色。具有真实老式安防监控录像的模糊感，不使用电影摄影镜头语言。\n\n【统一场景与空间】\n\n公元208年冬，赤壁之战后，华容道山间古道。\n\n冬日清晨，潮湿山雾、泥泞道路、密集枯树、苔藓岩壁、落叶和马蹄印。\n\n山路宽约4.5米，从西北方向延伸至东南方向，沿途有一处缓弯。\n\n道路东北侧为树林与路肩，西南侧为浅沟及岩壁。\n\n曹操最终停在东北侧路肩。\n\n网约车始终从西北方向驶向东南方向，停在曹操身旁，左侧驾驶员车窗朝向曹操。\n\n三台摄像头均布置在道路东北侧，确保画面方向一致。\n\n【人物与车辆】\n\n曹操：53岁左右，成熟威严的东方男性，短须略有灰白，身穿东汉深色将领铠甲、暗金护肩、厚重黑色披风，头戴战盔。甲胄与披风沾满泥水，神情疲惫、狼狈而警惕。\n\n身边两名穿破旧魏军甲胄的护卫，各牵一匹疲惫战马。\n\n关羽：高大魁梧的成年东方男性，宽阔面庞、浓眉、丹凤眼、面如重枣，极长而浓密的黑色美髯，头戴青色头巾，身穿绿色古代战袍、内搭甲胄。黑白画面中脸呈深灰色，衣袍呈中灰色，神情威严平静。\n\n车辆：一辆银白色现代四驱网约车SUV，四门、左舵驾驶、无品牌车标、车身带有少量泥点。\n\n关羽始终坐在左侧驾驶座。\n\n【镜头一｜0—8秒｜CAM01 山路全景】\n\n监控位置：华容道东北侧一棵古松树顶部，高约9米，朝西南方向40度俯拍，120度固定广角。\n\n画面左上方为远处西北方向山路，中央为泥泞道路，右下方为曹操最终停留的路肩。\n\n左上角显示「建安十三年 冬 07:18:00」并逐秒递增。\n\n左下角显示「CAM01 华容道·山路全景」。\n\n右上角显示「● REC」。\n\n0—4秒：\n\n曹操带两名护卫和两匹战马从画面左上方向右下方缓慢走来。\n\n众人甲胄凌乱、神情疲惫，曹操一边走一边回头张望，生怕后方出现追兵。\n\n4—8秒：\n\n曹操走到画面右下方路肩，突然停下，扶腰喘气。\n\n两名护卫牵马停在后面。\n\n曹操抬头看看前方空荡荡的山路，随后低头摸索宽大的衣袖。\n\n第8秒，监控短暂出现雪花干扰，切换CAM02。\n\n【镜头二｜8—19秒｜CAM02 曹操叫车】\n\n监控位置：道路东北侧另一棵古树，高约3.5米，距离曹操约3米，向西南方向30度俯拍。\n\n固定广角镜头同时覆盖曹操上半身、双手及其左侧延伸向西北的山路。\n\n左上角时间从07:18:08连续递增至07:18:18。\n\n左下角显示「CAM02 华容道·路肩」。\n\n右上角持续显示「● REC」。\n\n8—11秒：\n\n曹操从古代战袍的宽大袖口里掏出一部现代智能手机。\n\n他低头认真看手机屏幕，笨拙地用手指滑动。\n\n11—14秒：\n\n曹操点击网约车叫车图标，手机屏幕出现简单清晰的汽车接单标志。\n\n曹操松了一口气，收起手机，整理凌乱的披风。\n\n旁边两名护卫疑惑地看着他。\n\n14—17秒：\n\n远处传来汽车发动机声。\n\n曹操抬头看向西北方向，露出期待神情。\n\n一辆银白色SUV从远处山路弯道驶出，沿原本道路方向靠近。\n\n17—19秒：\n\nSUV逐渐减速，进入画面左侧近处。\n\n曹操向路肩边缘迈出两步，准备迎接车辆。\n\n两名护卫牵马后退让路。\n\n第19秒切换CAM03。\n\n【镜头三｜19—30秒｜CAM03 司机身份揭晓】\n\n监控位置：道路东北侧一块约3米高的岩石上，摄像头向西南方向25度俯拍，距离车辆最终停车点约4米。\n\n固定广角视野完整覆盖SUV左侧驾驶员车窗、车门、曹操和后方两名护卫。\n\n摄像头位于驾驶员车窗一侧，能够拍到车内人物面容。\n\n左上角时间从07:18:19连续递增至07:18:29。\n\n左下角显示「CAM03 华容道·停车点」。\n\n右上角持续显示「● REC」。\n\n19—22秒：\n\n银白色SUV缓缓停在曹操身旁。\n\n车头始终朝向东南方向，左侧驾驶员车窗正对曹操与监控摄像头。\n\n车辆停止，发动机保持运转。\n\n曹操满怀希望地靠近驾驶位，微微弯腰准备询问。\n\n22—25秒：\n\n驾驶员车窗缓缓下降。\n\n车内逐渐露出一位头戴古代青色头巾、身穿绿色战袍、留着极长黑色美髯的男子。\n\n曹操起初没有看清，继续向车窗靠近。\n\n25—27秒：\n\n车窗完全降下。\n\n司机赫然是关羽！\n\n关羽稳稳坐在驾驶座，面容威严，缓缓抚摸长须，然后转头看向曹操。\n\n曹操看清关羽面容，笑容瞬间消失，身体猛然僵住，双眼睁大。\n\n27—30秒：\n\n曹操下意识连续后退两步，赶紧双手抱拳，尴尬地向关羽作揖。\n\n关羽面无表情，轻轻抬手，示意曹操上车。\n\n曹操僵在原地不敢动。\n\n后方两名护卫也愣住。\n\n最后一秒画面出现轻微「滋滋」闪烁与水平信号撕裂。\n\n录像在07:18:29结束。\n\n【环境音】\n\n无BGM、无旁白、无搞笑配乐。\n\n只有山风声、树叶摩擦声、战马喘息与蹄声、泥地脚步声、手机点击声、远处逐渐接近的汽车发动机声、轮胎碾过水坑声、汽车减速声、电动车窗下降声、甲胄碰撞声。\n\n音效具有老式监控麦克风的压缩底噪。\n\n【严格约束】\n\n全片30秒，严格3个固定监控镜头，只在8秒和19秒切换。\n\n每个监控镜头自身完全固定，禁止推拉、摇移、变焦、慢动作。\n\n三台监控均安装在道路东北侧，视线与空间方向保持一致。\n\n曹操始终在东北侧路肩，车辆始终从西北驶向东南。\n\nSUV左侧驾驶员车窗必须面向曹操和CAM03。\n\n关羽始终坐在左侧驾驶座，不能出现在副驾驶或后排。\n\n车辆必须沿道路真实驶来、减速、停车，不得瞬移。\n\n曹操只携带一部手机，汽车只有一辆。\n\n所有人物五官、服装、发型保持一致。\n\n最后镜头必须在同一画面内完整呈现关羽坐在车内、曹操站在车外的空间关系。\n\n不出现其他现代建筑或科技设备。\n\n全程保持黑白老式安防监控画质。\n\n最高优先级：每个镜头左上角必须显示连续递增的时间戳，左下角必须显示对应的CAM编号和具体地点，右上角必须显示「● REC」。三组信息从第一帧到最后一帧始终可见，不得省略。", "createdAt": "Wed Nov 11 09:03:53 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 2, "conversationId": "2120442373549555802", "inReplyToStatusId": "2120442373549555802", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-11T09:03:53+00:00", "createdAtBeijing": "2026-11-11T17:03:53+08:00", "createdAtLocal": "11-11 17:03 北京", "url": "https://x.com/liyue_ai/status/2120442377215324246", "themeId": "editorial", "signalScore": 50, "editorial": {"id": "2120442377215324246", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Seedance 2.5监控风短片提示词", "evidence": "严格3个固定监控镜头，只在8秒和19秒切换", "rationale": "完整提示词可复用，细化机位、时间戳与环境音"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2120653551131402399", "track": "research", "source": {"id": "2120653551131402399", "text": "Great performance improvements for attention with almost no downside: matching the FP32 baseline using 8-bit or even 4-bit quantization! Check out our latest work.", "createdAt": "Wed Nov 11 23:03:01 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2120653551131402399", "author": {"username": "istoica05", "name": "Ion Stoica", "profileImageUrl": "https://pbs.twimg.com/profile_images/1889424820821172228/OKFe0cdL_normal.jpg"}, "authorId": "3139551624", "quotedTweet": {"id": "2120643704792989972", "text": "🚀 Qwen, Kimi, GLM are all betting on linear attention. But it's still slow: the recurrent state is read & rewritten every token.\n\nMeet LeapQuant: the first training-free method to make 8-bit or 4-bit recurrent states work.\n\n📈 Across Qwen, Kimi, and GLM models:\n• Matches FP32 accuracy\n• 4.25× faster linear attention kernels\n• Up to 2× higher inference throughput\n• Cuts memory by up to 56%", "createdAt": "Wed Nov 11 22:23:53 +0000 2026", "replyCount": 1, "retweetCount": 10, "likeCount": 22, "conversationId": "2120643704792989972", "author": {"username": "conlesspan", "name": "Yi Pan", "profileImageUrl": "https://pbs.twimg.com/profile_images/2081442097757138944/_ZDufd55_normal.jpg"}, "authorId": "1162259408878882816", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120643470440452096/img/79mZX48TH8U9HZn_.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120643470440452096/img/79mZX48TH8U9HZn_.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120643470440452096/vid/avc1/1920x1080/tmP9gaWnf_5QIZIG.mp4?tag=29", "durationMs": 33766}], "translationZh": "🚀 Qwen、Kimi 和 GLM 都在押注线性注意力，但它依然很慢：每处理一个 token，都要读取并重写循环状态。\n\n推出 LeapQuant：首个无需训练即可使用 8 位或 4 位循环状态的方法。\n\n📈 在 Qwen、Kimi 和 GLM 模型上的表现：\n• 精度与 FP32 持平\n• 线性注意力算子速度达到原来的 4.25 倍\n• 推理吞吐量最高达到原来的 2 倍\n• 内存占用最多降低 56%"}, "expert": {"priority": "P1", "domain": "AI 基础设施 / 分布式系统", "name": "Ion Stoica", "role": "Berkeley；Anyscale 联合创始人", "why": "Ray、分布式 AI 系统、数据基础设施", "handle": "istoica05"}, "createdAtIso": "2026-11-11T23:03:01+00:00", "createdAtBeijing": "2026-11-12T07:03:01+08:00", "createdAtLocal": "11-12 07:03 北京", "url": "https://x.com/istoica05/status/2120653551131402399", "themeId": "editorial", "signalScore": 46, "editorial": {"id": "2120653551131402399", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "LeapQuant 线性注意力量化", "evidence": "Up to 2× higher inference throughput", "rationale": "团队报告免训练量化及跨模型推理结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "注意力机制的性能大幅提升，几乎没有代价：用 8 位甚至 4 位量化也能达到 FP32 基线的精度！欢迎看看我们的最新研究。"}, "avatar": "https://pbs.twimg.com/profile_images/1889424820821172228/OKFe0cdL_normal.jpg"}, {"id": "2120307701872029825", "track": "growth", "source": {"id": "2120307701872029825", "text": "前几天大家就在讨论， ChatGPT 版的 Google Search Console 要来了。\n今天 OpenAI 正式发布了 Business In ChatGPT，核心是通过 Business Hub 让认证的商家知道自己的产品被 GPT 提及的情况。\n并且还支持创建 Business Agents 让用户直接与商家对话，不过这个暂时只支持美国的电商和在线服务商家使用。\n\n具体看官方博客 https://t.co/MQf61XqjLp", "createdAt": "Wed Nov 11 00:08:44 +0000 2026", "replyCount": 18, "retweetCount": 6, "likeCount": 44, "conversationId": "2120307701872029825", "author": {"username": "gefei55", "name": "哥飞", "profileImageUrl": "https://pbs.twimg.com/profile_images/1600285780555202560/TE8ad_yJ_normal.jpg"}, "authorId": "362252075", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "哥飞", "role": "出海、SEO 与增长实践与观察", "why": "展示不同规模网站的 SEO 策略与点击数据，贴合出海增长需求。", "handle": "gefei55"}, "createdAtIso": "2026-11-11T00:08:44+00:00", "createdAtBeijing": "2026-11-11T08:08:44+08:00", "createdAtLocal": "11-11 08:08 北京", "url": "https://x.com/gefei55/status/2120307701872029825", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2120307701872029825", "technicalRelevant": true, "dailyGrade": "A", "channel": "growth", "topic": "ChatGPT 商家曝光与对话", "evidence": "让认证的商家知道自己的产品被 GPT 提及的情况", "rationale": "帖文给出商家曝光能力、对话功能和开放范围"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1600285780555202560/TE8ad_yJ_normal.jpg"}, {"id": "2120345202804101583", "track": "agent", "source": {"id": "2120345202804101583", "text": "即使是让 Agent 操作软件，但人还是要看结果的，所以现在软件设计重心变成了怎么让人更好的验收。\n\n举几个 Claude Artifacts 设计的好的地方：\n\n1. 多人协作 -> 人和 Agent 协作\n\n以前的软件比如 Google Docs、Figma 会强调人和人之间的协作，你也可以很方便的看到谁在操作、操作的历史。\n\n而在 Artifacts 里面，你能看到 Agent 正在做的操作，也能看到 Agent 所有的操作历史。你可以在设计稿里面添加评论告诉 Agent 怎么改，Agent 改完还会回复你的评论让你再看看。\n\n2. 人直接操作 -> 标记和评论\n\n以前软件是人操作为主，所以要考虑人怎么用，但是很多操作是真的很复杂，UI 操作也只能设计的很复杂。\n\n举个例子来说，传统视频剪辑软件，我要把某一个时间段静音的视频剪掉，我就只能通过有一个 Timeline，有专门的带 Waveform（波形）的音频 track，然后用户通过放大 Timeline 的波形去甄别出来哪里是没声音的，然后手动打上标记，最后再点击删除把标记的一段删除掉。\n\n这个场景换到 Claude Motion，它只有一个很简单的代表时间和场景的 Timeline，需要剪辑其中一段，只要大致框线一个时间段出来，然后写一条评论发给 Claude：帮我把这一段视频中静音的部分剪掉，然后 Claude 就会自己去找出来静音部分去删除，完全不需要你去放大 Timeline 去标记这些繁琐的操作。\n\n3. 人主导 -> Agent 采访人之后实施\n\n传统软件都是你自己想清楚了再去软件上实施，就像写 PPT/Slides，得你自己有想法才能写的出来，遥想当年要写一个 PPT 打开 PowerPoint 半天不知道写点啥好。\n\n现在你使用 Claude Design 或者 Claude Slides，只要大致的描述一个想法，甚至很模糊，然后 Claude 会想你提一些问题，你只要做几个选择题，然后就能把你的想法猜的一个差不多，接下来就是按照你的想法生成，甚至于还会出几个版本让你选择。\n\n当你看到已经设计出来的结果，会把自己原本模糊的想法具像化，可以更容易的知道是不是自己想要的结果，再做出调整，不得不说比起以前要容易了很多。", "createdAt": "Wed Nov 11 02:37:45 +0000 2026", "replyCount": 67, "retweetCount": 9, "likeCount": 85, "conversationId": "2120345202804101583", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2120334267289129408", "text": "@dotey 那以后 UI 设计师是不是得改行写 API 文档了 按钮做得再好看，Agent 也不看", "createdAt": "Wed Nov 11 01:54:17 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 2, "conversationId": "2120312745543315897", "inReplyToStatusId": "2120312745543315897", "author": {"username": "DieselAI24", "name": "Diesel AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/2113881170983460864/C2aHad0k_normal.jpg"}, "authorId": "1998058202584514561"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-11T02:37:45+00:00", "createdAtBeijing": "2026-11-11T10:37:45+08:00", "createdAtLocal": "11-11 10:37 北京", "url": "https://x.com/dotey/status/2120345202804101583", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2120345202804101583", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "面向人工验收的 Agent 软件交互", "evidence": "帮我把这一段视频中静音的部分剪掉", "rationale": "用操作历史、评论剪辑和问答生成说明可复用的交互设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2120325133738836447", "track": "research", "source": {"id": "2120325133738836447", "text": "很明显中国 AI 公司都开始谈 RSI（递归自我改进）了，但大家对「自我改进」的理解可能还不太一样。\n\n很推荐阅读 Asterisk 写的这篇《How Chinese companies talk about recursive self-improvement》。\n\n两位 GovAI 研究员梳理了阿里、DeepSeek、MiniMax、智谱、小米等八家中国 AI 公司的公开资料，发现大家以前更多谈「自进化」「自学习」，直到今年 7 月才开始使用 RSI 这个词。\n\n但实际的技术探索已经挺有意思了。\n\n比如 MiniMax 让 M2.7 在内部 Harness 上迭代超过 100 轮，自己分析失败轨迹、修改 Harness 代码、重新运行 Eval，再决定是否保留改动，最终在内部评测中提升了约 30%。\n\n智谱则让 Agent 参与推理基础设施的分析、代码修改和实验优化。小米的 CodeMidas 甚至尝试从现有代码库自动构建 RL 训练环境。\n\n文章还提到一个有意思的差异。\n\n相比硅谷经常把 RSI 与「智能爆炸」联系起来，中国公司的讨论更多落在实际研发和应用上，背后也有算力成本、商业竞争等现实因素。\n\n我个人挺希望以后相关的技术发布，能多展示一些完整的实验过程。\n\n比如 Agent 自己发现了什么问题，尝试过哪些失败方案，最终保留了什么改动，以及人在哪些环节参与决策。\n\n感觉这些真实的研发过程，比一句「实现了自我进化」更能让人感受到技术究竟走到了哪一步。\n\n原文：https://t.co/aNE7VMaUcD", "createdAt": "Wed Nov 11 01:18:00 +0000 2026", "replyCount": 12, "retweetCount": 34, "likeCount": 207, "conversationId": "2120325133738836447", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWwTw_FXkAAjZtE.jpg", "width": 1274, "height": 1254, "previewUrl": "https://pbs.twimg.com/media/HWwTw_FXkAAjZtE.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-11T01:18:00+00:00", "createdAtBeijing": "2026-11-11T09:18:00+08:00", "createdAtLocal": "11-11 09:18 北京", "url": "https://x.com/Xudong07452910/status/2120325133738836447", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2120325133738836447", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "中国 AI 公司的递归自我改进实践", "evidence": "自己分析失败轨迹、修改 Harness 代码", "rationale": "梳理多家公司实践，交代迭代步骤与内部评测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120587855114432837", "track": "research", "source": {"id": "2120587855114432837", "text": "New research on red teaming our sandbox platform SPACE: \n\n1. CTF red-teaming should prompt explicitly to break the host-guest isolation. \n\n2. Non-cyber models are actually better than cyber models at red teaming and finding exploits (eg GPT 5.6 Sol vs GPT 5.6 Sol Cyber)\n\n3. Our sandbox platform SPACE was robust to sandbox isolation exploits \n\n4. Network bypassing with DNS spoofing was something we discovered and addressed \n\n5. Our platform is open-source and we want to keep sharing our findings openly for the agent sandbox and security community.", "createdAt": "Wed Nov 11 18:41:57 +0000 2026", "replyCount": 36, "retweetCount": 3, "likeCount": 57, "conversationId": "2120587855114432837", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2120582674549203004", "text": "We are publishing new research on our findings from red-teaming SPACE, our VM sandbox for Computer agents.\n\nWe gave 12 models two tasks: escape the VM to take a credential from the host, and bypass SPACE's network policy to reach a blocked URL.\n\nWe found that the standard Capture the Flag setup used in red-teaming can steer agents away from the security boundary being tested, and that security-specialized models don't guarantee better results.\n\nhttps://t.co/Egh3x3uX4c", "createdAt": "Wed Nov 11 18:21:22 +0000 2026", "replyCount": 41, "retweetCount": 10, "likeCount": 109, "conversationId": "2120582674549203004", "author": {"username": "perplexity_ai", "name": "Perplexity", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009310641165660160/XArF3_Ib_normal.jpg"}, "authorId": "1599587232175849472", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3StEBaIAAKK1W.png", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HW3StEBaIAAKK1W.png:small"}], "translationZh": "我们发布了对 SPACE 的红队测试研究。SPACE 是为 Computer 智能体设计的虚拟机沙箱。\n\n我们给 12 个模型布置了两项任务：逃出虚拟机并从宿主机获取一份凭据，以及绕过 SPACE 的网络策略访问被封锁的 URL。\n\n我们发现，红队测试常用的标准夺旗（CTF）设置可能让智能体偏离待测的安全边界，而使用安全专用模型也未必能取得更好的结果。\n\nhttps://t.co/Egh3x3uX4c"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-11T18:41:57+00:00", "createdAtBeijing": "2026-11-12T02:41:57+08:00", "createdAtLocal": "11-12 02:41 北京", "url": "https://x.com/AravSrinivas/status/2120587855114432837", "themeId": "editorial", "signalScore": 82, "editorial": {"id": "2120587855114432837", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "SPACE 沙箱红队评估", "evidence": "We gave 12 models two tasks", "rationale": "发布十二模型评估，指出任务设计影响测试结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们对沙箱平台 SPACE 开展红队测试的新研究：\n\n1. 在 CTF 红队测试中，应在提示词中明确要求突破宿主机与虚拟机之间的隔离。\n\n2. 在红队测试和发现可利用漏洞方面，通用模型的表现实际上优于网络安全专用模型，例如 GPT 5.6 Sol 优于 GPT 5.6 Sol Cyber。\n\n3. 我们的沙箱平台 SPACE 在针对隔离机制的攻击测试中表现稳健。\n\n4. 我们发现并修复了一个可通过 DNS 欺骗绕过网络限制的问题。\n\n5. 我们的平台已经开源，也希望继续向智能体沙箱和安全社区公开分享研究发现。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2120540201994846253", "track": "research", "source": {"id": "2120540201994846253", "text": "Autonomous, uncut, 1x speed. This is GR00T 2 controlling real dexterous hands to perform a chemistry lab experiment (and clean up after itself) end to end.\n\nEpisode 1 of a new series! I’ll keep dropping real-time robot videos, with none of the “4x” or “8x” labels you usually see in the corner. No one can speed up reality, except Dr. Strange ;)", "createdAt": "Wed Nov 11 15:32:36 +0000 2026", "replyCount": 90, "retweetCount": 65, "likeCount": 516, "conversationId": "2120540201994846253", "author": {"username": "DrJimFan", "name": "Jim Fan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1554922493101559808/SYSZhbcd_normal.jpg"}, "authorId": "1007413134", "quotedTweet": {"id": "2120186651741655428", "text": "Introducing GR00T 2: our most advanced, open System One model for robotics. It runs entirely on your robot’s onboard compute, fully untethered, and you own every weight of it. GR00T 2 features: \n\n1. Long-horizon tasks: dexterous manipulation and whole-body control chained over 20+ steps and 5+ minutes, such as performing chemistry lab experiments or assembling model airplanes end to end.\n2. X-Adapt: adapting from easy data sources (human wearables and simulation) and deploying zero-shot to diverse real robots.\n3. Unified Cognition: native integrations with frontier agents for advanced physical reasoning, robust error recovery, and safety monitoring.\n\nIt's an open-source buffet! We are releasing not only the model weights and X-Adapt recipes (coming December), but also our agentic framework, simulation engine, annotation engine, hardware design, and even training data (100K hours, that's ~11 yrs of experience), all available today! \n\nEverything that moves will be autonomous. Anyone can become a roboticist. \n\nLock in, build with us! \n\nDeep dive in thread:", "createdAt": "Tue Nov 10 16:07:43 +0000 2026", "replyCount": 143, "retweetCount": 225, "likeCount": 1710, "conversationId": "2120186651741655428", "author": {"username": "DrJimFan", "name": "Jim Fan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1554922493101559808/SYSZhbcd_normal.jpg"}, "authorId": "1007413134", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120178947035889664/img/RaYA0DTAiAgCHYpW.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120178947035889664/img/RaYA0DTAiAgCHYpW.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120178947035889664/vid/avc1/1920x1080/80g_VJCO3CcemdU7.mp
