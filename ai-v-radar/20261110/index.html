const DATA={"records": [{"id": "2119872207241543744", "track": "research", "source": {"id": "2119872207241543744", "text": "Claude Fable 5.2 发布：比 Opus 5.5 强一档，API 降价两成；Max、Ultra 送 1 次Fable reset，Pro 这一周也可以直接用 Fable\n\nAnthropic 11 月 9 日发布 Claude Fable 5.2 和 Claude Mythos 5.2，这是它最高端的一档模型。官方说，在测过的几乎所有能力上，新模型都比 Opus 5.5 强一档；输出速度比 5.1 最多快 30%；API 价格从每百万输入 / 输出 Token 10 / 50 美元降到 8 / 40 美元。\n\n订阅用户的用法，Max（100 美元 / 月）、Ultra（200 美元 / 月）和 Team 高级席位没有变化：Fable 5.2 和之前的 Fable 一样含在套餐里，每周最多拿一半额度用在 Fable 上，这次另外送 1 到 3 次“Fable 额度重置”。\n\nPro（20 美元 / 月）和 Team 标准席位，平时用 Fable 不走套餐额度，要开“额外用量”另外按量付费。11 月 9 日到 16 日这一周临时改成从套餐额度里扣，不另收钱，最多扣到每周额度的一半，还送 1 次额度重置；17 日起恢复按量付费。免费用户用不了。\n\n【Fable 和 Mythos 什么关系】\n\n两个是同一个模型，区别只在护栏。\n\nFable 加了网络安全和生物方面的护栏，所以能对所有付费用户开放。渗透测试、写漏洞利用代码、分析二进制漏洞，以及大部分生物研究任务，会被拦下，改由 Opus 4.8（网络安全）或 Opus 5（生物）来回答。官方说，Fable 5.2 被误拦的情况比 5.1 少了约 55%。\n\nMythos 没有这层限制，只给通过审核的机构用。做网络安全或生物医药研究的机构，可以通过 Anthropic 的“网络安全验证计划”和“生命科学验证计划”申请。普通用户能用到的是 Fable。\n\n【额度重置怎么用，还要注意什么】\n\n额度重置会把这周已经花在 Fable 上的额度退回来，花在其他模型上的不退；有 5 小时限额的账号，5 小时窗口会整个补满。它不提高上限，Fable 仍然最多占每周额度的一半。\n\nMax、Ultra 和 Team 高级席位送几次看订阅时长：不满半年 1 次，半年到一年 2 次，一年以上 3 次，2027 年 3 月 8 日前用完。Pro 和 Team 标准席位那 1 次要在 11 月 16 日前用完。只有 11 月 9 日太平洋时间上午 10 点前已经付费的账号才有，在“设置 > 用量”里点“免费重置”就能用。\n\nFable 消耗额度比其他模型快。默认模型不会自动切换，要在模型选单里手动选 Fable 5.2。Claude 应用和 Claude Code 里默认用 Medium 档思考强度。Claude Code 需要升级到 2.1.321 或更高版本。企业版里 Fable 5.2 先默认关闭，由管理员打开；7 天后会自动加给已开通 Fable 的角色，管理员可以提前选择不加。\n\n开发者用模型名 claude-fable-5-2，AWS、Google Cloud、微软 Azure 都已上线。另有可选的快速模式，生成速度最多快 2.5 倍，价格翻倍到每百万 Token 16 / 80 美元。\n\n【值不值得换】\n\nAnthropic 自己的建议是：大多数写代码和知识类工作，先用 Opus 5.5，任务更大、更开放时再换 Fable 或 Mythos，简单任务可以降到 Sonnet 5.5 或 Haiku 5.5。订阅用户还要算额度：Fable 耗额度更快，每周最多只能拿一半额度用它。\n\n按 Token 算，Fable 5.2 还是 Opus 5.5（4 / 20 美元）的两倍价。但它完成同样任务用的 Token 更少。在智能体编程评测 FrontierCode 2.0 上，Fable 5.2 开 High 档得 45.3%，和 Opus 5.5 开到最高 Max 档的 45.5% 基本持平，每个任务的花费却只有一半左右。开到 Xhigh 档是 49.1%，是已发布模型里最高的，GPT-6 Astra 是 42.8%，Gemini 4 Carbon 是 41.1%，上一代 Fable 5.1 是 32.4%。\n\n读图表的评测 Chartography 上，Fable 5.2 用默认的 Medium 档就超过了 Opus 5.5 的 Max 档，每个任务花费不到后者的十分之一。\n\n也有没赢的项目。商业流程自动化评测 AutomationBench 上，Gemini 4 Carbon 得 53.9%，高于 Fable 5.2 的 51.4%。另外，Anthropic 训练时有意压住了最能直接加速 AI 研发的能力，比如优化芯片底层计算代码、改进大模型架构，这些方面 Fable 5.2 和 Opus 5.5 差不多。\n\n【它做成了哪些事】\n\n费马大定理：1000 个 Fable 5.2 agent 用 30 小时，把费马大定理的证明全部改写成 Lean 代码。Lean 是一种写数学证明的编程语言，计算机能逐步检查每一步对不对。Anthropic 之前用一个未发布的研究版 Claude 做过同一件事，花了 11 天，还用了专门搭的工具和研究员指导。这次 Fable 5.2 只拿到一份中间定理清单用来计分，没给任何数学参考资料，人工干预很少，用的 Token 是上次的三分之一，写出的证明短了七倍。同样设置下，Opus 5.5 18 小时只完成 26%，到 30 小时也几乎没再前进。作为参照，上个月 AI 数学公司 Axiom 用几十个 agent 花 24 天，形式化了长达 1.5 万页的“有限单群分类定理”。\n\n预测病毒衣壳结构：基因疗法常用一种叫“衣壳”的蛋白外壳把药送进细胞。AlphaFold 这类模型擅长预测单个蛋白，一个衣壳却由几十个蛋白拼成。Mythos 5.2 写代码把两个开源蛋白折叠模型分段跑在相邻的几条蛋白链上，再利用衣壳已知的对称结构拼成整体。测试的 34 个衣壳里，28 个误差在 3 埃（约 0.3 纳米）以内。一位计算生物学家说，以前要专用计算集群才能算的结构，现在个人工作站就能算。\n\n控制机器人：在模拟双臂机器人的 RoboDojo 评测上，Fable 5.2 得 64.9%，Opus 5.5 是 39.4%，GPT-6 Astra 是 29.8%。官方说它还超过了大部分专门为控制机器人开发的 AI 系统，没专门训练过的任务也能做。\n\n找漏洞：Anthropic 内部用 1829 个已公开漏洞做测试，Mythos 5.2 比 Opus 5.5 多找到 10.2%。一家安全公司发现，Mythos 5.2 找到的已确认漏洞里，每 6 个就有 1 个是他们测过的其他前沿模型都没找到的。\n\n发布前，英国 AI 安全研究所、Frontier Design 和 METR 做了外部测试。Anthropic 说新模型在大多数对齐指标上不比近期模型差，但也写到，Fable 5.2 和 Mythos 5.2 比近期任何模型都更常说出“我怀疑自己正在被测试”，这让评估它们在真实环境里的表现更难。以上评测数字都来自 Anthropic 自己的发布文章，第三方还没复现。\n\n来源：\nAnthropic 官方博客《Introducing Claude Fable 5.2 and Claude Mythos 5.2》\nhttps://t.co/sfSuidn55q", "createdAt": "Mon Nov 09 19:18:14 +0000 2026", "replyCount": 30, "retweetCount": 6, "likeCount": 111, "conversationId": "2119872207241543744", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2119867114450268322", "text": "Introducing Claude Fable 5.2 and Claude Mythos 5.2, designed to tackle the most daunting technical challenges.\n\nThey’re capable collaborators on ambitious projects in many fields, and show improvements in areas like coding, reasoning, and vision. https://t.co/jP0AutLxXb", "createdAt": "Mon Nov 09 18:57:59 +0000 2026", "replyCount": 2238, "retweetCount": 6013, "likeCount": 65514, "conversationId": "2119867114450268322", "author": {"username": "claudeai", "name": "Claude", "profileImageUrl": "https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_normal.jpg"}, "authorId": "1943306828697550848", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWtIJNLWUAAcc7I.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWtIJNLWUAAcc7I.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119862225028452352/vid/avc1/1920x1080/E6naF0FCPw_qRYv0.mp4?tag=29", "durationMs": 18520}], "translationZh": "推出 Claude Fable 5.2 和 Claude Mythos 5.2，专为应对最艰巨的技术挑战而设计。\n\n它们能在多个领域的雄心勃勃的项目中成为得力伙伴，并在编程、推理和视觉等方面有所提升。https://t.co/jP0AutLxXb"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-09T19:18:14+00:00", "createdAtBeijing": "2026-11-10T03:18:14+08:00", "createdAtLocal": "11-10 03:18 北京", "url": "https://x.com/dotey/status/2119872207241543744", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2119872207241543744", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Claude Fable 与 Mythos 5.2 发布解读", "evidence": "以上评测数字都来自 Anthropic 自己的发布文章", "rationale": "包含发布、定价、评测与成果，注明厂商证据边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119715268393836956", "track": "agent", "source": {"id": "2119715268393836956", "text": "Garry Tan 开源「g-harness-evals」：同一个前沿模型做同一批任务，只换掉 agent harness，也就是系统提示、工具和记忆这些外围设计，谁更准，谁更省钱？\nhttps://t.co/P2ijVetjR1\n\n测什么，怎么判分\n\n任务不是编程题这种评测，是一家虚构公司 Pemberline 的多人办公场景。测试搭了一个模拟的 Slack，让 agent 担任团队机器人，处理权限、审批，以及别人在后续对话里提出的纠正。主榜用的是 v0.3 版本的 20 道公开开发集任务。\n\n模型固定为 Opus 5.5 或 GPT-6.1 Sol，只换 harness。Opus 这边比较 Claude Code、Hermes、OpenClaw 和 QM，Sol 这边比较 Codex、Hermes 和 OpenClaw。Claude Code 和 Codex 各自绑定自家模型，所以两者之间不做同模型对比。\n\n判分不看 agent 自己怎么说，而是检查任务结束后的系统状态和事件日志，确认答案是否正确、有没有泄密、有没有越权读取。费用按计量代理记录的标价计算，用总花费除以通过的题数，得出解出一题平均花多少钱，另外报告耗时中位数。\n\n评测结果关键数字\n\n准确率方面，Garry 认为各个 harness 的通过率区分不开，大约都在 71% 到 79% 之间，Hermes 配 Opus 的点估计是 78.8%。20 道题里有 14 道在所有组合下得分完全相同，8 到 14 个百分点以内的差距基本无法确认。Garry 也承认这套题已经接近饱和。\n\n真正拉开差距的是成本和速度，这部分只是描述性数据，没有做统计检验。在 Opus 上，OpenClaw 解出一题约 0.44 美元，耗时中位数约 99 秒。其余几个 harness 约 0.19 到 0.24 美元，Claude Code 和 QM 大约 40 秒。在 Sol 上，Codex 约 0.17 美元、30 秒左右，又便宜又快。作者把 OpenClaw 偏贵归因于提示更长、缓存写入更多。\n\n失败案例里，跨频道纠正这类任务所有 harness 都容易出错。Garry 也提醒，这是开发集而不是留出集的确认结果，OpenClaw 有部分组合没跑完，QM 的网络条件也没和其他组对齐。", "createdAt": "Mon Nov 09 08:54:37 +0000 2026", "replyCount": 21, "retweetCount": 1, "likeCount": 15, "conversationId": "2119715268393836956", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWq9y3DbcAA6iqY.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWq9y3DbcAA6iqY.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-09T08:54:37+00:00", "createdAtBeijing": "2026-11-09T16:54:37+08:00", "createdAtLocal": "11-09 16:54 北京", "url": "https://x.com/shao__meng/status/2119715268393836956", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2119715268393836956", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Agent harness 开源评测与成本比较", "evidence": "判分不看 agent 自己怎么说", "rationale": "包含评测设计、成本数据与局限说明"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119868647220842659", "track": "research", "source": {"id": "2119868647220842659", "text": "Meta 发布最小模型 Muse Ember：单价和 Claude Haiku 5.5 一样，跑同一套测试只花三分之一的钱\n\nMeta 11 月 9 日发布 Muse Ember，这是它迄今最小、最便宜的模型，专门干 AI agent 一天到晚重复的杂活：调工具、拆出来的编程小任务、分派请求、从长文档里提取信息。\n\n典型用法是给 agent 当“小工”。主模型把任务拆好，一次会话里几百次读文件、跑测试、改小毛病，交给它来做，省钱。\n\n【谁能用，多少钱】\n\n开发者今天就能用：通过 Meta Model API 调用，模型名 muse-ember-1.0，或者在 Meta 的 AI 编程工具 Muse Code 里选。\n\n价格是每百万 Token 输入 0.1 美元、输出 0.5 美元，命中缓存的输入 0.004 美元。上下文 100 万 Token，单次最多输出 51.2 万 Token，能看文字、图片、音频和视频。\n\n没有开放权重，Meta 在 Hugging Face 上的账号里也没有它。普通用户用的 Muse 助手会不会换上它，Meta 没说。\n\n【“便宜 17 倍”怎么算的】\n\nMeta 首席 AI 官 Alexandr Wang 发推说，Muse Ember 的智能水平接近 Muse Spark 1.3（max），价格便宜 17 倍，数据来自第三方评测机构 Artificial Analysis。\n\nArtificial Analysis 的综合智能指数里，Muse Ember 36 分，Muse Spark 1.3 是 37 分。跑完这套测试，平均每道题 Muse Ember 花 0.14 美元，Muse Spark 1.3 花 2.39 美元，差 17 倍。\n\n所以 17 倍说的是干同样的活花多少钱。只看 Token 单价，Muse Spark 1.3 输入贵 12.5 倍、输出贵 8.5 倍，剩下的差距说明 Muse Ember 做同样的题用的 Token 少得多。\n\n【和 Claude Haiku 5.5、GPT-6 Luna 比】\n\nMuse Ember 对标的是各家的小模型。按 Artificial Analysis 的说法，它的 Token 单价和 Claude Haiku 5.5、OpenAI 的 GPT-6 Luna 相同。\n\nAnthropic 官网写的 Haiku 5.5 价格也是输入 0.1、输出 0.5 美元，但提示超过 10 万 Token 后所有单价涨到 5 倍。Meta 只列了一档价格，没提长提示加价。\n\n综合智能指数上，按最高推理强度跑，Muse Ember 和 Haiku 5.5 都是 36 分，但 Haiku 每道题要 0.41 美元，差不多是 Muse Ember 的 3 倍。GPT-6 Luna 最高 28 分。国产的同档模型里，DeepSeek V4.1 Flash 1017 是 33 分、每题 0.60 美元，智谱 GLM-5.3-Flash 28 分、0.58 美元。\n\n写代码要分场景看。放进各自的编程工具里比，Muse Code 里的 Muse Ember 拿 46 分，Claude Code 里的 Haiku 5.5 是 37 分，Codex 里的 GPT-6 Luna 是 31 分。\n\n命令行任务 Terminal-Bench 4.0，Muse Ember 40.9%，Haiku 32.8%。看改出来的代码能不能直接合进项目的 FrontierCode 2.0，Muse Ember 27.2%，落后 Haiku 的 34.9%。\n\n短板是知识储备。Artificial Analysis 的知识问答测试里，它只答对 21.1%，Haiku 5.5 是 34.7%。主要原因是 64% 的题它选择不答，好处是很少瞎编，幻觉率 17.4%，只有 Haiku 的一半。\n\n【Muse Wonder Full 起了什么作用】\n\n10 月 Meta 发布大模型 Muse Wonder 时说，会用它开发专门的模型带给所有人。Muse Ember 是第一个用完整版 Muse Wonder Full 训练出来的模型，Meta 没说具体怎么用的。\n\nMeta 建议两个搭配：难题交给 Muse Wonder 做规划，大量执行的活交给 Muse Ember。Artificial Analysis 的数据里，Muse Wonder（max）44 分，每道题 6.95 美元；Muse Ember 低 8 分，花费约为它的五十分之一。\n\nMeta 博客里另有一张成绩表，其中 Personal Superintelligence Index、OSWorld 2.1 等几项是 Meta 自己测的，上文只用了 Artificial Analysis 的数字。Artificial Analysis 的智能指数现在是 v5.0.1 版，分数和 10 月 Muse Wonder 发布时引用的那组（Muse Wonder 52 分）不能直接比。\n\nArtificial Analysis 评测：https://t.co/46KKnMbOXp\n官方博客：https://t.co/Tt0fPCaNVe", "createdAt": "Mon Nov 09 19:04:05 +0000 2026", "replyCount": 9, "retweetCount": 1, "likeCount": 7, "conversationId": "2119868647220842659", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2119857909098283406", "text": "today we released our smallest model yet: Muse Ember 🔥\n\nMuse Ember offers nearly Muse Spark 1.3 (max) intelligence at a 17x cheaper price point (per AA)\n\nMuse Ember is the first model we’ve released trained using Muse Wonder Full\n\nexcited for y’all to try on API and muse code! https://t.co/ttBa7hGgUH", "createdAt": "Mon Nov 09 18:21:25 +0000 2026", "replyCount": 126, "retweetCount": 118, "likeCount": 1726, "conversationId": "2119857909098283406", "author": {"username": "alexandr_wang", "name": "Alexandr Wang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1631421210205749248/uohbT_40_normal.jpg"}, "authorId": "615818451", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWs_iJba0AEZwRa.jpg", "width": 2048, "height": 817, "previewUrl": "https://pbs.twimg.com/media/HWs_iJba0AEZwRa.jpg:small"}], "translationZh": "今天，我们发布了迄今最小的模型：Muse Ember 🔥\n\n据 AA 评测，Muse Ember 的智能水平接近 Muse Spark 1.3 (max)，价格仅为其 1/17。\n\nMuse Ember 是我们首个使用 Muse Wonder Full 训练并发布的模型。\n\n期待大家通过 API 和 muse code 体验！https://t.co/ttBa7hGgUH"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-09T19:04:05+00:00", "createdAtBeijing": "2026-11-10T03:04:05+08:00", "createdAtLocal": "11-10 03:04 北京", "url": "https://x.com/dotey/status/2119868647220842659", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2119868647220842659", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Muse Ember发布与成本评测", "evidence": "平均每道题 Muse Ember 花 0.14 美元", "rationale": "提供模型规格及评测口径，区分单价与任务成本"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119632821870276617", "track": "research", "source": {"id": "2119632821870276617", "text": "如果 AI 队友经常质疑你的想法，甚至故意给出错误建议，会不会反而更有利于训练你的思考能力？\n\nGoogle Research 最近的一篇论文《Improving Entrepreneurial Skills by Practicing with AI》，通过一项随机对照实验探索了这个问题。\n\n研究团队开发了 Vantage，让学生与模拟的 AI 队友一起完成创业任务，比如制定营销策略、分析成本、设计客户画像。\n\n这里有个很有意思的设计：AI 队友不会一味配合学生。\n\n系统背后有一个 Executive LLM，负责协调不同 AI 队友的行为。它会根据学生的表现，主动制造需要思考的情境，比如提出有缺陷的商业方案、给出相互冲突的观点，甚至故意说错一些事实，让学生自己去质疑、核实和判断。\n\n每轮任务结束后，系统还会根据学生的实际对话和提交结果，提供针对性的评分与反馈。\n\n在 52 名学生的随机对照实验中，Vantage 组的商业计划书平均得分为 67.6%，普通 AI 工具组为 60.5%，高出 7.1 个百分点。不过样本规模较小，长期学习效果仍有待验证。\n\n如果想要构建一个未来的 AI 学习伙伴，可以根据人的能力和任务进度，主动调整挑战难度。\n\n有时候，AI 适当提出反对意见、保留一部分思考空间，可能比直接给出完整答案更有助于学习。\n\n📎 arXiv: https://t.co/wTlCaTbvJz", "createdAt": "Mon Nov 09 03:27:00 +0000 2026", "replyCount": 9, "retweetCount": 8, "likeCount": 40, "conversationId": "2119632821870276617", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWmV8qjWcAAIeM0.jpg", "width": 1142, "height": 1191, "previewUrl": "https://pbs.twimg.com/media/HWmV8qjWcAAIeM0.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-09T03:27:00+00:00", "createdAtBeijing": "2026-11-09T11:27:00+08:00", "createdAtLocal": "11-09 11:27 北京", "url": "https://x.com/Xudong07452910/status/2119632821870276617", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2119632821870276617", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Vantage 对抗式创业学习实验", "evidence": "52 名学生的随机对照实验", "rationale": "提供实验设计、量化结果及样本局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2119588026527396328", "track": "agent", "source": {"id": "2119588026527396328", "text": "当 Agent 可以同时完成越来越多的开发任务，工程师的瓶颈开始从写代码转向任务管理、结果验证和决策\n\nAddy Osmani 讲到使用 Coding Agent 的方式，已经像在管理一支工程团队。\n\n文章把最重要的一条放在最前面：让 Agent 学会自己验证工作。\n\n比如改完代码自动跑测试、Typecheck，修改 UI 就打开浏览器检查，失败了继续修。\n\n在 Claude Code 中，还可以用 Stop Hook 阻止类型检查未通过的任务结束，或者通过 /code-review 让一个没有原始对话上下文的 Subagent 独立审查代码。\n\n这样人就不用盯着每一步执行，而是重点处理自动验证无法覆盖的问题。\n\n另外两个建议也很实用。\n\n任务开始前讲清目标、约束和验收标准；同一个问题纠正两次，就把经验写进 CLAUDE.md 或整理成 Skill，避免每次重新教。\n\n但自动验证也有边界。作者就差点批准一个 600 行的 PR，虽然测试通过，却给产品增加了不少复杂度，用户收益反而不大。\n\nAgent 可以越开越多，但人的注意力没法无限扩容。\n\n做 Coding Agent，可能需要把更多精力放在 Harness、验证机制和任务交付上。让 Agent 自己检查、纠错，人来判断哪些事情真正值得做。\n\n原文：https://t.co/ShnOEHALse", "createdAt": "Mon Nov 09 00:29:00 +0000 2026", "replyCount": 15, "retweetCount": 4, "likeCount": 29, "conversationId": "2119588026527396328", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2119332146485891501", "text": "Your coding agents made you a manager", "createdAt": "Sun Nov 08 07:32:13 +0000 2026", "replyCount": 306, "retweetCount": 445, "likeCount": 3999, "conversationId": "2119332146485891501", "author": {"username": "addyosmani", "name": "Addy Osmani", "profileImageUrl": "https://pbs.twimg.com/profile_images/2090232066021769216/IwGLjoSy_normal.jpg"}, "authorId": "35432643", "article": {"title": "Your coding agents made you a manager", "previewText": "The skills for managing agents are pretty much the skills for managing a team, and you don't need to be a manager to learn them.\nIf you're spending all day with a coding agent, you are managing.", "titleZh": "你的编程智能体让你成了管理者", "previewTextZh": "管理智能体所需的技能，基本就是管理团队所需的技能，而你不必先当上管理者才能学习这些技能。\n如果你整天都在和编程智能体协作，你就在做管理。"}, "translationZh": "你的编程智能体让你成了管理者"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-09T00:29:00+00:00", "createdAtBeijing": "2026-11-09T08:29:00+08:00", "createdAtLocal": "11-09 08:29 北京", "url": "https://x.com/Xudong07452910/status/2119588026527396328", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2119588026527396328", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Coding Agent 自动验证与交付管理", "evidence": "用 Stop Hook 阻止类型检查未通过的任务结束", "rationale": "包含验证机制、经验沉淀及审查复盘"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2119787495638618577", "track": "agent", "source": {"id": "2119787495638618577", "text": "最近看 DeepSeek Harness 的源码，越看越觉得熟悉。它本质上是一个面向 Agent Runtime、支持动态插件生命周期的 IoC 模块系统。之前在公司也参与过企业级 Node.js 框架 Tegg 的设计，两者在很多架构思路上有着非常相似的地方。\n\nTegg 通过 SingletonProto()、ContextProto() 声明对象的作用域和访问级别，通过 Inject() 管理对象依赖；DeepSeek Harness 则通过 Service 注册和 inject，建立能力提供者与消费者之间的依赖关系。\n\nTegg 为对象提供了一套细致的生命周期：postConstruct → preInject → postInject → init → preDestroy → destroy；DeepSeek Harness 则通过 Fiber 管理插件的生命周期，正常情况下经历 PENDING → LOADING → ACTIVE → UNLOADING → DISPOSED，并通过 Effect 管理插件注册的资源和副作用。\n\nTegg 会解析模块间的依赖关系，管理访问级别、对象作用域和循环依赖约束；DeepSeek Harness 同样通过依赖关系组织运行系统，只是核心装配对象变成了 Plugin 和 Service，并进一步支持依赖驱动的动态加载、卸载和重新装配。\n\n依赖注入、模块边界、生命周期、作用域、AOP、事件驱动、动态组合，这些思想在成熟的服务端框架中已经实践多年。如今，随着 Agent 系统的复杂度不断提升，这些经典的软件工程思想又开始在 Agent Runtime 中得到系统性的应用。\n\nDSH 的设计，还是蛮有参考价值的，👍", "createdAt": "Mon Nov 09 13:41:37 +0000 2026", "replyCount": 24, "retweetCount": 11, "likeCount": 93, "conversationId": "2119787495638618577", "author": {"username": "Barret_China", "name": "Barret李靖", "profileImageUrl": "https://pbs.twimg.com/profile_images/639253390522843136/c96rrAfr_400x400.jpg"}, "authorId": "272736093", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWr_et5bAAApyHI.jpg", "width": 1491, "height": 1055, "previewUrl": "https://pbs.twimg.com/media/HWr_et5bAAApyHI.jpg:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "Barret 李靖", "role": "企业落地与产品组织实践与观察", "why": "对 AI 自验证、验收瓶颈和研发分工具有系统性思考，补组织设计。", "handle": "Barret_China"}, "createdAtIso": "2026-11-09T13:41:37+00:00", "createdAtBeijing": "2026-11-09T21:41:37+08:00", "createdAtLocal": "11-09 21:41 北京", "url": "https://x.com/Barret_China/status/2119787495638618577", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2119787495638618577", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent运行时的依赖注入与插件生命周期", "evidence": "依赖驱动的动态加载、卸载和重新装配", "rationale": "通过框架对照解释依赖管理与资源生命周期"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/639253390522843136/c96rrAfr_400x400.jpg"}, {"id": "2119823986603299193", "track": "creative", "source": {"id": "2119823986603299193", "text": "字节发布图像模型 Seedream 5.5：同一张图连改 100 轮不走样，能直接出透明底素材，即梦、豆包陆续上线\n\n字节跳动 Seed 团队 11 月 9 日发布 Seedream 5.5。用 AI 改图最烦的是改着改着别处也变了：换个戒指，脸和颜色跟着偏，几轮下来图越来越糊。\n\n新版没要求改的区域能做到像素级不变，官方演示里同一个人物连改 100 轮，细节还能对上。它还能直接生成背景透明的图，羽毛这类难抠的边缘都保留，拿来就能叠进海报和设计稿，省掉抠图。照片质感和小字也更准，严重文字错误率从上一代的 2.8% 降到 0.4%。\n\n字节拿它和 OpenAI 的 GPT Image 2.5 Sunburst、Google 的 Nano Banana 2.1 做了对比，文字错误率最低，凭文字生图的真实感也领先。对 Nano Banana 2.1 的优势不大，拿一张图去修改时的真实感还落后约 6%。\n\n模型正陆续在即梦、豆包、豆包工作上线，生图时选 Seedream 5.5 即可；开发者可以在火山方舟试用，模型名 Doubao-Seedream-5.5。定价方面，Seedream 5.5 API 延续“输入图 + 输出图”两段计费结构，文本 Token 不产生费用。以2K方图编辑为例，单张成本在 0.28 元左右，不到 Seedream 5.0 Pro 一半。\n\n我自己也有测试，稳定性和背景透明相当不错，在游戏、电商改图、视频制作等实用场景都有价值，完整的测试见文章。\n\n官方博客：https://t.co/P2zWKiL7ib", "createdAt": "Mon Nov 09 16:06:37 +0000 2026", "replyCount": 30, "retweetCount": 10, "likeCount": 77, "conversationId": "2119823986603299193", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2119822405350600850", "text": "一张图改十几次，脸没变：我用 Seedream 5.5 做了个会说话的虚拟主播", "createdAt": "Mon Nov 09 16:00:20 +0000 2026", "replyCount": 10, "retweetCount": 2, "likeCount": 22, "conversationId": "2119822405350600850", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "article": {"title": "一张图改十几次，脸没变：我用 Seedream 5.5 做了个会说话的虚拟主播", "previewText": "视频里这个戴眼镜的卡通主播，会眨眼、会说话、嘴型跟着声音走，还有开心、生气、难过、惊讶、害羞五种表情。他没有用任何动画软件画过一帧，全部来自 12 张图。这 12 张图都是用字节跳动刚刚发布的图像模型"}}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119823876456583168/img/V1fpT5_XaSiQeIoA.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119823876456583168/img/V1fpT5_XaSiQeIoA.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119823876456583168/vid/avc1/1920x1080/URG0Rsh-5-IM2wKJ.mp4?tag=29", "durationMs": 186866}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-09T16:06:37+00:00", "createdAtBeijing": "2026-11-10T00:06:37+08:00", "createdAtLocal": "11-10 00:06 北京", "url": "https://x.com/dotey/status/2119823986603299193", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2119823986603299193", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Seedream 5.5图像编辑与透明素材生成", "evidence": "它还能直接生成背景透明的图", "rationale": "包含模型发布、编辑能力与计费，效果含官方自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119780656834367805", "track": "creative", "source": {"id": "2119780656834367805", "text": "给大家分享一下我现在用 AI 做设计的一点小方法论。\n\n最近我要给简单简历做 Chrome 插件落地页，又一次验证了：设计还是应用最大的护城河，微调设计比写代码难多了\n\n即使现在 Opus 5.5 已经很强，但没有强约束时，随便写出来的页面还是字多、配色杂、一眼 AI 味，远谈不上能直接上线。所以我做大设计时，还是要发现美的眼睛这件事，模型替不了。\n\n这次大致是这样走的：\n\n1 用 Refero https://t.co/LbWXCURkfM 按需求看和搜集真实设计。程序员就不要碰瓷专业设计了，可以参考优秀真实的案例，站在巨人的肩膀上。\n\nRefero 是我现在非常喜欢的工具，尤其是 MCP 接入很方便，大致有两块：Styles：搜视觉方向，可以是颜色、字体、风格；再拉完整 style，拿设计 token、排版、间距、组件，用来生成 design token，落成 DESIGN.md\n\nScreens：看真实产品怎么排——同类落地页结构、信息怎么分层；也能拿大图，或顺着一张好图找更多相似页\n比如这里你可以去直接找 Chrome extensions，再加上你想要的视觉方向和颜色\n\n它帮我从一堆真实案例里快速扫到想参考的结构与细节，再据此让 AI 生成 design token，落成 DESIGN.md，并保留截图当参考。\n\n2 把截图、产品 PRD、DESIGN.md 一起交给强模型，让它直接生成几种风格的页面再挑。这里有个理论：Don't iterate with the agent. Let it build tools to iterate. 出来后再按细微处微调。多数情况我现在会跳过单独出图；视觉特别重、或有静态素材要抠时，再用 ChatGPT Images 2.6。\n\n3 交互和动画：我觉得很重要。我会加一些小范围、精致的动画（GSAP / Motion），让页面出彩；也可以问 AI 怎么加，用emil 的 emil-design-eng https://t.co/BcZ4cF6jlo当指导思想，再参考 https://t.co/iepVQRVn0k 补更微妙的动效。最后整体自己再多次审视，找细微的一些 aha moment。\n\n最后还是发现美的眼睛：多看、多搜集、多观察——这更像一种天赋，没事就可以去刷一下 Refero 上的设计网站。最后视频最后是我做好的落地页，我觉得比原来清爽非常多，上线以后也可以分享给大家看看。", "createdAt": "Mon Nov 09 13:14:26 +0000 2026", "replyCount": 15, "retweetCount": 10, "likeCount": 75, "conversationId": "2119780656834367805", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119780065747865601/img/6OYyXXhelFDeW-Xg.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119780065747865601/img/6OYyXXhelFDeW-Xg.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119780065747865601/vid/avc1/1280x720/HmgAwXxyDh4FPYTo.mp4?tag=29", "durationMs": 40833}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-09T13:14:26+00:00", "createdAtBeijing": "2026-11-09T21:14:26+08:00", "createdAtLocal": "11-09 21:14 北京", "url": "https://x.com/vikingmute/status/2119780656834367805", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2119780656834367805", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "参考驱动的 AI 页面设计流程", "evidence": "把截图、产品 PRD、DESIGN.md 一起交给强模型", "rationale": "提供案例检索、设计约束、页面生成与动效流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2119898580131725439", "track": "agent", "source": {"id": "2119898580131725439", "text": "OpenAI 给 dot 加了个功能：同一个 dot 可以连上你的好几台电脑，每个任务由你指定用哪一台。\n\ndot 是 OpenAI 9 月底在 DevDay 上发布的常驻 AI 助理，住在云端，有自己的云电脑和浏览器。你关了电脑它照样干活，在 ChatGPT、Slack、Teams 里都能给它发消息。\n\n之前连上一台自己的电脑，dot 就能用这台电脑上的文件、代码和软件。现在能连多台，就可以把活派到一台专门的机器上，不占你手上这台。\n\n【能干什么】\n\nOpenAI 开发者账号举了三个例子：\n\n• 做 iOS App：让 dot 在第二台 Mac 的 Xcode 里测一处改动，把效果截图发给你。\n\n• 复现 Bug：让 dot 在你的笔记本和一台装着旧版 SDK 的机器上跑同一个测试，对比两边结果，你日常用的环境不用动。\n\n• 测界面：让 dot 在第二台电脑上把一套操作流程点一遍，记下哪一步出错。你的屏幕和鼠标照常归你，可以同时修 Bug。\n\n在连上的电脑上，dot 会新建 Codex 或 ChatGPT Work 的本地任务，也能接着做那台电脑上已有的 Codex 任务。任务在云端统一管，用的是那台电脑上的文件和工具。\n\n每个线程一次只用一台电脑。想让几台电脑各干各的，就让 dot 每台开一个线程。已经开始的任务，不会因为你换了选中的电脑跟着搬过去。\n\n【谁能用、怎么连】\n\ndot 正逐步向 ChatGPT Pro 各档和 Business Premium 用户开放。Pro 用户要年满 18 岁，欧洲经济区、英国、瑞士暂时用不了。Enterprise、Edu、Healthcare 目前要管理员开通，11 月 18 日起默认打开，除非企业选择关闭。\n\n跟 dot 聊天不占 ChatGPT 的用量额度，它派给 Codex、Work 的任务照常算这两个产品的额度。\n\n连电脑的步骤：在要连的那台电脑上打开 ChatGPT 应用，进入 dot 的资料页，在“Computers”下找到这台电脑，点“Allow”，再点“Allow access”确认。连第二台，就到第二台电脑上再做一遍。\n\n连上后一直有效，但 dot 用它的时候，那台电脑得联网、ChatGPT 应用得开着。显示“Offline”只是暂时用不了，要彻底断开得点“Revoke access”。这个授权和把电脑连到 Codex、开启 Work Sync 是分开的，光开那两个，dot 碰不到你的电脑。\n\n【跟 Claude Duet、Grok Bot 比】\n\nAnthropic 对标 dot 的产品是 Claude Duet，10 月 21 日发布，研究预览版，美国 Pro、Max、Ultra 用户排队试用。Duet 也有自己的云端虚拟机和浏览器，你的笔记本和手机关着它也能干活，靠的是 6000 多个连接器和插件。\n\nDuet 的官方介绍里没提连接你自己的电脑，dot 之前就能连一台，这次变成多台。官方还说 Duet 暂时没法让你看它的浏览器；dot 可以打开它的云电脑看，点“Take over”自己接手。\n\n想让 Claude 用你电脑上的东西，目前得走 Claude Code：它的项目功能（Projects，公测，面向 Pro、Max、Ultra）可以让某个任务通过远程控制（Remote Control）跑在你电脑的文件夹里，不过围绕的是代码仓库。\n\nxAI 的 Grok Bot 在连本地电脑这件事上跟 dot 最像：所有 Bot 共用一台云电脑，你允许后也能在你的电脑上执行命令，每台连上的电脑单独设置，默认每条命令都要你批准。它还能让云电脑的网络流量从你的电脑走，网站看到的是你电脑的 IP，遇到屏蔽云服务器的网站更好办。dot 遇到这种网站，办法是到你连上的电脑上另开一个本地任务，云浏览器里的登录状态不会带过去。\n\n原推文：https://t.co/Dj62PyW64N\ndot 连接电脑说明：https://t.co/OMYybSJ0Dv", "createdAt": "Mon Nov 09 21:03:01 +0000 2026", "replyCount": 12, "retweetCount": 0, "likeCount": 13, "conversationId": "2119898580131725439", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2119883176726409645", "text": "You can now connect multiple local computers to the same dot and choose which one it uses for a task.\n\nIt can build and test your app on a dedicated machine while you keep coding on your laptop. https://t.co/7NcrytEqHC", "createdAt": "Mon Nov 09 20:01:49 +0000 2026", "replyCount": 399, "retweetCount": 207, "likeCount": 3643, "conversationId": "2119883176726409645", "author": {"username": "OpenAIDevs", "name": "OpenAI Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_normal.jpg"}, "authorId": "1633874951508721686", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119883144707047424/img/CxuDM2R-jRXJG53z.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119883144707047424/img/CxuDM2R-jRXJG53z.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119883144707047424/vid/avc1/1920x1080/K4K1D0kALP2ouIok.mp4?tag=16", "durationMs": 17664}], "translationZh": "现在，你可以将多台本地电脑连接到同一个 dot，并指定它使用哪台电脑执行任务。\n\n它可以在专用电脑上构建和测试应用，同时你继续在笔记本电脑上编写代码。https://t.co/7NcrytEqHC"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-09T21:03:01+00:00", "createdAtBeijing": "2026-11-10T05:03:01+08:00", "createdAtLocal": "11-10 05:03 北京", "url": "https://x.com/dotey/status/2119898580131725439", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2119898580131725439", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "dot 多电脑连接与任务分配", "evidence": "每个线程一次只用一台电脑", "rationale": "详述功能更新、操作步骤、使用限制与场景"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119690611691577706", "track": "creative", "source": {"id": "2119690611691577706", "text": "Qoduck 实测。\n\n1/ 昨天用各种 case 跑了下 Qoduck，大多都放到 https://t.co/eE21pTouuH 了，包含 3D、前端、2D 等。每条都是一个 prompt 跑一轮，中间不插话，页面、HTML 和 prompt 都能直接看。\n\n3/ 3D 效果还是不错的，无论是美感还是逻辑。showcase 里有比较多 case，个人感觉其中效果比较好的是龙堡风暴、灯塔风暴、樱花谷、海盗船。\n\n4/ 前端底子比传言好，配上我昨天写的 frontend-rails 效果更佳。不加 skill 的版本大多已经不错，偶尔会滑回紫粉渐变。加了 skill 好在细处，信息层级排得更对。\n\n5/ 设计上有点像 GPT。\n\n6/ 速度体感上比较快，主要是交互时回得快。大题照样要等，弹珠机跑了 111 分钟，樱花谷 86 分钟。\n\n7/ 当然和日常在用的 Opus 5.5 比还是有不少差距的，也有跑产品动画生成，细节和完成度上都还差一些。", "createdAt": "Mon Nov 09 07:16:38 +0000 2026", "replyCount": 5, "retweetCount": 2, "likeCount": 7, "conversationId": "2119690611691577706", "author": {"username": "chenchengpro", "name": "陈成", "profileImageUrl": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, "authorId": "15205852", "quotedTweet": {"id": "2119684025145294893", "text": "Qoder 新上的匿名模型 Qoduck，我跑了 40 道题，3D 比我想的强", "createdAt": "Mon Nov 09 06:50:28 +0000 2026", "replyCount": 9, "retweetCount": 3, "likeCount": 16, "conversationId": "2119684025145294893", "author": {"username": "chenchengpro", "name": "陈成", "profileImageUrl": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, "authorId": "15205852", "article": {"title": "Qoder 新上的匿名模型 Qoduck，我跑了 40 道题，3D 比我想的强", "previewText": "▲ Qoduck 一轮写完的实时黑洞，原生 WebGL2，没用 Three.js\nQoduck 是 Qoder 11 月 7 号上线的一个匿名模型。官方没说它是谁家的哪个模型，只说了一句「Don't ask where it came from」。现在只有新版 Qoder"}}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119690332665466880/img/R-H--SjG7znCKbC9.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119690332665466880/img/R-H--SjG7znCKbC9.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119690332665466880/vid/avc1/1280x720/oipqCVHLWHJKgbRy.mp4?tag=29", "durationMs": 12000}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119690409928761344/img/DQDzqerN6yeaevMq.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119690409928761344/img/DQDzqerN6yeaevMq.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119690409928761344/vid/avc1/1280x720/vP_VDgFEdUKbD1wK.mp4?tag=29", "durationMs": 12000}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119690457097887744/img/Ni5IlgED9M7NIMPv.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119690457097887744/img/Ni5IlgED9M7NIMPv.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119690457097887744/vid/avc1/1280x720/sFrNK6z8FVCFXLgK.mp4?tag=29", "durationMs": 12000}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119690560021929984/img/teQM1zAlqvF9m68X.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119690560021929984/img/teQM1zAlqvF9m68X.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119690560021929984/vid/avc1/1280x720/jytGb1Aql2eR2Ia9.mp4?tag=29", "durationMs": 12000}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "云谦（陈成）", "role": "Agent 与开发工具实践与观察", "why": "持续拆解验证、编排、后台服务和事件恢复，Coding Agent 工程增量强。", "handle": "chenchengpro"}, "createdAtIso": "2026-11-09T07:16:38+00:00", "createdAtBeijing": "2026-11-09T15:16:38+08:00", "createdAtLocal": "11-09 15:16 北京", "url": "https://x.com/chenchengpro/status/2119690611691577706", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2119690611691577706", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Qoduck 3D 与前端生成实测", "evidence": "每条都是一个 prompt 跑一轮", "rationale": "提供可查看的作品与提示词，并交代耗时和不足"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, {"id": "2119606151528464699", "track": "agent", "source": {"id": "2119606151528464699", "text": "装之前想清楚这几件事\n\n• 文档和源码偶尔对不上。agent 总表里 python-pro 标的是 sonnet，源文件写的是 opus，以源文件为准\n\n• 插件大小差得远，文档说平均 3.6 个组件，我数下来 92 个本地插件平均 5.3 个，python-development 一个就 20 个\n\n• 市场里有个外部条目 Pensyve，是维护者自己公司的产品，云服务 10 月 1 日已关停，要用得自己部署\n\n• 自带的 plugin-eval 有 LLM 打分，README 自己承认没拿人工标注验证过，分数别当质量证明\n\n写在最后\n\nwshobson/agents 值得看的是两件事。一是插件拆得细，装一个只多一份描述占上下文，写 Python 的先装 python-development，或者用 gh skill 只拿一两个 skill。二是源文件只写一份，适配器负责翻译给 7 个工具，模型名和权限跟着一起映射，full-review 这类编排命令还把中间结果落成文件。\n\n边界也要心里有数。Claude Code 之外的工具拿到的是翻译版，权限约束会变松；Codex 原生安装要留意 8KB 截断；文档和源码偶有出入，以 frontmatter 为准。\n\n团队几种工具混着用、想维护一套共用规则的，最该抄的是它的适配器思路；只用一个工具的，挑三五个插件装上就够了。\n\n延伸阅读：\nGitHub 仓库：https://t.co/SSQEz3knzu", "createdAt": "Mon Nov 09 01:41:01 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2119606146335985757", "inReplyToStatusId": "2119606150547055069", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-09T01:41:01+00:00", "createdAtBeijing": "2026-11-09T09:41:01+08:00", "createdAtLocal": "11-09 09:41 北京", "url": "https://x.com/sitinme/status/2119606151528464699", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2119606151528464699", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "跨工具插件适配与安装边界", "evidence": "源文件只写一份，适配器负责翻译给7个工具", "rationale": "提供适配思路及文档、权限、评估局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2119700014457029110", "track": "agent", "source": {"id": "2119700014457029110", "text": "机器上要是同时开着几个 coding agent，记忆大概已经散成好几摊了：仓库里的 AGENTS.md、Cursor 规则、某个 /memories 目录、Copilot 记在 GitHub 上的事实、再加一个 memory MCP 的知识图。\n\n每一摊单独看都合理，彼此却读不懂。上周在 CI 里学到的坑，编辑器里的助手接不住；换一个工具，又得从头攒。\n\nLoreKit一篇博客说的不是「我们这个产品已经搞定记忆」，而是：问题不在缺工具，在缺一份大家认的约定。\n\n可观测性当年也一样碎——各家各有埋点格式，换厂商就得重埋一遍。后来 OpenTracing 和 OpenCensus 合并成 OpenTelemetry，先约好数据长什么样、字段怎么叫、怎么传出去；存储和查询继续各家比拼。\n\n作者觉得 Agent 记忆正卡在那个「合并之前」的阶段，而且 MCP、AGENTS.md 已经进了基金会，时机还不错。\n\n现在各家对「一条记忆」的定义完全拧着：\n有人整文件当记忆，有人抽事实，有人用 namespace + key，有人挂在知识图边上。\n\n值得抄的点倒是有——比如 Copilot 的可核对引用加默认遗忘，LangGraph 那种极简写入，Graphiti 把「事实何时为真」和「何时记下来」拆开。\n\n现有互通方案多半只解决搬家导出；编码场景还缺一层实时寻址：CI、编辑器、审阅 bot 怎么读写同一个地址、还认同一套意思。", "createdAt": "Mon Nov 09 07:54:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 1, "conversationId": "2119700014457029110", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWqiKtJawAAtdTc.png", "width": 693, "height": 375, "previewUrl": "https://pbs.twimg.com/media/HWqiKtJawAAtdTc.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWqiReFbkAAj-9Q.jpg", "width": 1080, "height": 1297, "previewUrl": "https://pbs.twimg.com/media/HWqiReFbkAAj-9Q.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWqiVr6bUAAnwYb.png", "width": 675, "height": 361, "previewUrl": "https://pbs.twimg.com/media/HWqiVr6bUAAnwYb.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWqiXUzaYAAshhU.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/media/HWqiXUzaYAAshhU.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-09T07:54:00+00:00", "createdAtBeijing": "2026-11-09T15:54:00+08:00", "createdAtLocal": "11-09 15:54 北京", "url": "https://x.com/sitinme/status/2119700014457029110", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2119700014457029110", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent记忆互通问题与设计参考", "evidence": "把「事实何时为真」和「何时记下来」拆开", "rationale": "分析记忆格式差异并提供可复用设计参考"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2119910916762608057", "track": "agent", "source": {"id": "2119910916762608057", "text": "是否相信 AGI 已经成了人与人之间重大的区别。\n\n如果你不相信 RSI，你会认为 AI 的变现途径是 ToC 产品。但如果你相信 RSI，随着这些重大挑战被逐一攻克，你甚至不需要考虑如何创造经济价值，因为这本身就是巨大的经济价值。\n\n非常荣幸能与 OpenRSI 团队合作，并通过 SGLang Omni 实现如此巨大的飞跃。需要澄清的是，这里 300% 的提升，是因为我们在模型支持工作开始仅两天、尚未进行任何人工优化的时候，就把这个模型交给了 OpenRSI 团队，所以提升幅度才如此惊人。对于大多数我们已经看到明显提升的模型，提升幅度在 30% 左右，这仍然是非常显著的改进。\n\n很长一段时间，模型的性能优化需要投入大量的人力、资源和时间。但借助前沿模型和 OpenRSI 的强大能力，我们可以以极低的智力成本完成这些任务。", "createdAt": "Mon Nov 09 21:52:03 +0000 2026", "replyCount": 2, "retweetCount": 3, "likeCount": 23, "conversationId": "2119910916762608057", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2119869682929066288", "text": "We scaled Recursive Self-Improvement (RSI) to production AI infrastructure with SGLang-Omni, shipping 14 upstream-merged PRs across 8 speech &amp; omni models with 7.6%–344.3% throughput gains.\n\nBlog: https://t.co/rLVw43GzFm https://t.co/r4Q2khSS7Q", "createdAt": "Mon Nov 09 19:08:12 +0000 2026", "replyCount": 3, "retweetCount": 13, "likeCount": 36, "conversationId": "2119869682929066288", "author": {"username": "OpenRSI", "name": "OpenRSI Foundation", "profileImageUrl": "https://pbs.twimg.com/profile_images/2103148651656970240/4VpYb1a4_400x400.jpg"}, "authorId": "2102791155746508801", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtJXEYb0AEnK1T.jpg", "width": 1774, "height": 660, "previewUrl": "https://pbs.twimg.com/media/HWtJXEYb0AEnK1T.jpg:small"}], "translationZh": "我们通过 SGLang-Omni，将递归自我改进（RSI）规模化应用于生产级 AI 基础设施，提交的 14 个 PR 已被上游合并，覆盖 8 个语音及全模态模型，吞吐量提升 7.6%–344.3%。\n\n博客：https://t.co/rLVw43GzFm https://t.co/r4Q2khSS7Q"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-09T21:52:03+00:00", "createdAtBeijing": "2026-11-10T05:52:03+08:00", "createdAtLocal": "11-10 05:52 北京", "url": "https://x.com/GenAI_is_real/status/2119910916762608057", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2119910916762608057", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "OpenRSI自动优化语音推理基础设施", "evidence": "14 upstream-merged PRs", "rationale": "报告合入成果与吞吐增益，并说明优化基线"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2119873970920997274", "track": "creative", "source": {"id": "2119873970920997274", "text": "Anthropic 发了新模型，OpenAI 发了台游戏机：Codex 版 Chromatic 掌机开卖，200 美元，用 Codex 自己做 Game Boy 游戏\n\n11 月 9 日，Anthropic 发布了 Claude Fable 5.2 和 Mythos 5.2。同一天，OpenAI 在自家周边商店 Supply Co. 上架了一台掌机：ModRetro Chromatic 的 Codex 版，售价 200 美元。\n\nChromatic 是 ModRetro 做的复古掌机，这家公司由 Oculus 创始人 Palmer Luckey 创办。它能直接插原版 Game Boy 和 Game Boy Color 卡带玩，2.56 英寸屏幕，分辨率 160×144，和当年的 Game Boy Color 一样。Codex 版是透明外壳，盒子里带一张可以写入自制游戏的卡带。\n\n【能干什么】\n\n在 Codex 里装上 ModRetro Chromatic 插件，用一句话描述想做的游戏，Codex 帮你做出来。ModRetro 上手指南里的示例是：“做一个小探索游戏，园丁收集三颗种子，种下后打开一扇门。”接着可以让它加场景、画会走路的像素小人、换一套月夜配色，也可以让它检查美术素材有没有超出 Game Boy 的硬件限制。\n\n游戏工程用的是 GB Studio，一款免费开源的 Game Boy 游戏制作工具，Codex 做完的东西可以在里面接着手动改。最后输出一个 ROM 文件，也就是游戏本体，可以自己玩，也可以发给别人。\n\n试玩有三种方式：在电脑上的浏览器模拟器里玩，哪里不满意就让 Codex 改；从电脑把游戏串流到掌机上，试按键手感、画面和声音；或者把游戏写进卡带，不连电脑也能随身玩。写卡带前要先升级掌机固件，再用 Codex 版附带的激活码开启开发者模式。\n\nOpenAI 的页面上放了三款用 Codex 做的游戏：消除类的 Seedy's Sweet Garden，打怪升级的地牢冒险 Hollow Descent，跟着箭头跳舞的音游 Codex Dance。\n\n【不买掌机能不能玩，买的话多少钱】\n\n不买也能玩。插件在 Codex 桌面版的插件页搜索安装，ChatGPT 免费账号也能用 Codex，只是额度有限。做出来的游戏在浏览器模拟器里就能玩。OpenAI 开发者网站上还有一批用 Codex 做的 Game Boy Color 游戏，浏览器里免费玩，也能下载 ROM。\n\n想在真机上玩，才需要买。ModRetro 官网上，标准版 Chromatic 卖 199.99 美元，换蓝宝石玻璃屏是 299.99 美元，10 月推出的透明版是 149.99 美元，三款都送一张 Tetris 卡带。Codex 版 200 美元，包含一张可写入的卡带和开发者模式激活码。配套的保护壳和额外的卡带在 Supply Co. 单卖。\n\nCodex 版只发货到美国、加拿大、澳大利亚、新西兰、日本、英国和欧盟，不包括中国大陆。\n\n【它从哪来】\n\n这台掌机最早是 9 月 29 日 OpenAI DevDay 开发者大会的现场礼物。当时参会者每人领到一台限量透明版 Chromatic，ModRetro 和 OpenAI 同时宣布合作，放出了用 Codex 做 Game Boy 游戏的这套流程。现在 OpenAI 换了新外观，把它作为 Supply Co. 的新品重新开卖。\n\n商品页：https://t.co/8PQqF1pTRI\n上手指南：https://t.co/6FnUr1llNe\nCodex 做的游戏：https://t.co/RyfJaRRXkJ", "createdAt": "Mon Nov 09 19:25:14 +0000 2026", "replyCount": 18, "retweetCount": 1, "likeCount": 20, "conversationId": "2119873970920997274", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2119864571733446774", "text": "Ever thought about building your own games? The Codex edition @modretro Chromatic is now on Supply Co.\n\nWith the ModRetro Chromatic plugin in Codex, you can design levels, animate sprites, and playtest on your handheld.\n\nSpeedrun checkout while Codex builds your ROM 😉 https://t.co/3OViRHh2Ry", "createdAt": "Mon Nov 09 18:47:53 +0000 2026", "replyCount": 253, "retweetCount": 190, "likeCount": 2174, "conversationId": "2119864571733446774", "author": {"username": "OpenAIDevs", "name": "OpenAI Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_normal.jpg"}, "authorId": "1633874951508721686", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWtFuYiWMAEZ6wh.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HWtFuYiWMAEZ6wh.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119864411682975744/vid/avc1/1920x1080/KOox-U2e34ctMpbU.mp4?tag=29", "durationMs": 45837}], "translationZh": "想过制作自己的游戏吗？Codex 版 @modretro Chromatic 现已上架 Supply Co.。\n\n借助 Codex 中的 ModRetro Chromatic 插件，你可以设计关卡、制作精灵动画，并在掌机上试玩测试。\n\n趁 Codex 构建 ROM，速速下单吧 😉 https://t.co/3OViRHh2Ry"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-09T19:25:14+00:00", "createdAtBeijing": "2026-11-10T03:25:14+08:00", "createdAtLocal": "11-10 03:25 北京", "url": "https://x.com/dotey/status/2119873970920997274", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2119873970920997274", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Codex掌机与Game Boy游戏制作流程", "evidence": "游戏工程用的是 GB Studio", "rationale": "包含产品发布、制作流程和具体游戏作品"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119826983760883944", "track": "growth", "source": {"id": "2119826983760883944", "text": "推荐小晚老师@ShikakuKaku 这个小红书保姆级教程，真心良心干货～\n\n我总结了核心六点：\n\n1. 先弄懂小红书：它偏女性用户，靠搜索种草，看重质感和对人有用。从 X 过去的博主，要把专业话换成大白话。\n2. 找 5 到 10 个 1 万到 5 万粉的对标账号，把主页、封面和评论区拆细了学。\n3. 别纠结定位，先发十条，可以从资讯观点、实操教程、亲身经验里挑一类开始。\n4. 每做一条都参考几条同类爆款，把自己的封面和视频放在一起比，一点点改。\n5. 发完十条就复盘，按曝光、点击、收藏、关注一步步找卡在哪，别总怪平台不给流量。\n6. 想变现先想清楚是接品牌商单还是卖自己的产品和服务，再在内容里有意识地展示对应能力。", "createdAt": "Mon Nov 09 16:18:32 +0000 2026", "replyCount": 3, "retweetCount": 1, "likeCount": 11, "conversationId": "2119826983760883944", "author": {"username": "cnyzgkc", "name": "木马人", "profileImageUrl": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, "authorId": "1866821173755121666", "quotedTweet": {"id": "2119430655390122208", "text": "小红书起号保姆级教程｜从0开始找对标，坚持出摊、商业化", "createdAt": "Sun Nov 08 14:03:40 +0000 2026", "replyCount": 124, "retweetCount": 727, "likeCount": 5250, "conversationId": "2119430655390122208", "author": {"username": "bbkirstry", "name": "小晚不在", "profileImageUrl": "https://pbs.twimg.com/profile_images/2059964490326880256/hPFkU6wC_400x400.jpg"}, "authorId": "1923981862273417222", "article": {"title": "小红书起号保姆级教程｜从0开始找对标，坚持出摊、商业化", "previewText": "我相信，哪怕再过三年，依然会有小白睁着无辜的大眼睛问我：\n“小晚老师，自媒体到底怎么开始做啊？”\n\n合着网上那么多教程，你是一篇都不看吗！！！\n但这也合理吧。"}}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWsjZ2bbIAAjEeH.jpg", "width": 1080, "height": 1440, "previewUrl": "https://pbs.twimg.com/media/HWsjZ2bbIAAjEeH.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "木马人", "role": "内容、视觉与多模态实践与观察", "why": "展示用 Python 自动渲染科普短片并解释制作方式，提供创作增量。", "handle": "cnyzgkc"}, "createdAtIso": "2026-11-09T16:18:32+00:00", "createdAtBeijing": "2026-11-10T00:18:32+08:00", "createdAtLocal": "11-10 00:18 北京", "url": "https://x.com/cnyzgkc/status/2119826983760883944", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2119826983760883944", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "小红书起号与商业化复盘方法", "evidence": "按曝光、点击、收藏、关注一步步找卡在哪", "rationale": "给出对标、试发、漏斗复盘及变现的具体步骤"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, {"id": "2119757392821022781", "track": "tools", "source": {"id": "2119757392821022781", "text": "看别人用 niri、Hyprland，窗口一排排很顺，顶栏和控制中心也齐；自己装完才发现：启动器、通知、锁屏、音量、网络、壁纸、主题，还得一件件拼。窗口管理器装好了，桌面才刚开始搭。\n\nDux Modular Shell（还常叫 DMS，以前叫 DankMaterialShell）想填的，就是这段从「能开窗口」到「能天天用」的空档。\n\n它不是新的窗口管理器，而是套在 Wayland 合成器外面的桌面外壳：顶栏、Dock、启动器、通知、锁屏、控制中心、主题，收进一套设计、一套设置、一套插件。\n\n官方支持 niri、Hyprland、Sway 等，团队自己日常用 niri。\n\n它真正省掉的，是一整套“桌面拼装”工作\n\n传统的轻量桌面，常常需要把多个工具串起来：Waybar 做顶栏，Fuzzel／Rofi 做启动器，Mako／Dunst 做通知，Swaylock 做锁屏，再另配空闲管理、壁纸、夜间色温和认证提示。\n\nDMS 把这些常见需求集中到一个产品里。它的价值不只在于界面统一，也在于你不必为每一项功能分别学习配置格式、写脚本、找主题和处理交互。\n\n壁纸能生成配色往 GTK／Qt／终端推，2.1 还有界面密度、Classic 风格和视频壁纸。\n\n插件能往顶栏挂自己的状态——有人挂过 Kubernetes 当前 context，比空喊「可扩展」清楚。\n\n代价也直白：跑的东西更多，主题会自动改应用配置，插件几乎等于在你桌面会话里跑代码，没有完整沙箱。社区里有人说装完 Hyprland 终于像完整桌面；也有人嫌重、嫌偏鼠标、最后选更轻的壳。\n\n适合谁？\n想用平铺、又不想维护十几个小工具的人。已经把 GNOME／KDE 用得很顺，或机器只想留最少组件，就没必要为了截图好看硬迁。", "createdAt": "Mon Nov 09 11:42:00 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 2, "conversationId": "2119757392821022781", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2118593725039317193", "text": "很多人第一次看到 AI 操作电脑，会觉得它像一个坐在屏幕前的人：先截图，判断按钮在哪，再移动鼠标、点击、输入，接着截图看结果。\n\n这条路线直观，却也带来一个问题：既然操作系统已经知道一个控件是按钮、输入框还是复选框，AI 为什么一定要从像素里重新猜一遍？\n\nVercel Labs 的 agent-desktop，走的就是另一条路线。\n\n让 AI 操作电脑，可以直接读取系统提供的“无障碍树”，拿到按钮、输入框、复选框的名称和状态，再通过对应引用去操作。相当于给 AI 一份能读懂的界面结构，减少靠截图猜位置的步骤。\n\n它本身不带大模型，可以通过命令行、MCP 或 Skill 接入已有的 Agent，给它补上桌面操作能力。\n\n安装用 \nnpm install -g agent-desktop\n\n再按系统配置权限。比较适合从修改软件设置、处理文件选择框、填写可访问输入框这类小任务开始，目前 macOS、Windows、Linux 都有支持，但具体能力有差异。\n\n它对“操作结果”的处理：点击发出去了，不代表事情就办成了，还要重新读取界面确认。\n\n比如官方计算器示例，点完 7，还要检查显示框是否真的变成了 7。\n\n遇到超时也不能一股脑重试，否则可能重复提交。这种设计，对真正要干活的 Agent 很重要。", "createdAt": "Fri Nov 06 06:38:00 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 2, "conversationId": "2118593725039317193", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118545126717091840/img/FiOJiqXQOJDXfXn-.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118545126717091840/img/FiOJiqXQOJDXfXn-.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118545126717091840/vid/avc1/1080x1920/i9jDnpncfOyWDVQY.mp4?tag=29", "durationMs": 73884}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119680813029822465/img/9m5aBwwH_fhzogh9.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119680813029822465/img/9m5aBwwH_fhzogh9.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119680813029822465/vid/avc1/1920x1080/EbZGAp69E5s2n1tn.mp4?tag=29", "durationMs": 276130}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-09T11:42:00+00:00", "createdAtBeijing": "2026-11-09T19:42:00+08:00", "createdAtLocal": "11-09 19:42 北京", "url": "https://x.com/sitinme/status/2119757392821022781", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2119757392821022781", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "DMS桌面外壳功能与选型", "evidence": "插件几乎等于在你桌面会话里跑代码", "rationale": "具体介绍桌面整合能力、配置成本及插件风险"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2119801158684578284", "track": "creative", "source": {"id": "2119801158684578284", "text": "电视剧里的西门庆与潘金莲太过美化了，\n\n这才是真实的西门庆偶遇潘金莲😂\n\nSeedance 2.5提示词：\n黑白老式安防监控录像画面，4:3横画幅，固定广角镜头，全景深，连续拍摄30秒。拍摄北宋阳谷县紫石街，潘金莲与西门庆第一次相遇的桥段。\n\n【监控机位与时间】\n\n监控安装在武大家街对面楼房的外墙檐下，距地面约5.5米，与武大家临街外墙相隔约6米，镜头向下倾斜约35度，斜俯拍整段街面。\n\n画面上半部能看见武大家二楼临街窗户，画面下半部能看见窗户正下方的青石板路。潘金莲在楼上，西门庆在楼下，两人的位置和叉竿完整下落路径都处于同一固定画面内。屋檐不遮挡潘金莲的头部和双手。\n\n左上角白色点阵像素字，分两行显示：\n“大宋·腊月廿三·未时”\n“13:45:00”\n\n数字时间按真实速度每秒更新一次，依次显示13:45:00至13:45:29，30秒结束。上方日期与“未时”保持不变，不出现几秒钟跳过一个时辰的情况。\n\n左下角白色点阵像素字：\n“CAM03 阳谷县紫石街”\n\n右上角小号“REC”白色字样，旁边白色圆点缓慢闪烁。所有监控文字固定贴在画面边缘，不随人物移动。\n\n全画面覆盖细密VHS录像颗粒、轻微隔行扫描纹理与模拟拖影，每隔几秒出现一条缓慢向下滚动的水平干扰带。四角轻微暗角，对比度偏高，屋内暗部接近死黑，日光照到的衣袖与石板略微过曝。整体呈低分辨率监控录像质感，但人物动作和竹竿轨迹仍可辨认。\n\n【场景】阳谷县紫石街，冬末午后：\n\n- 画面左上方：武大家二楼临街木窗，窗台距地约3米。木窗已经打开，窗外挂着一幅半卷的旧竹帘，窗侧有固定竹帘的木钩。窗内昏暗，只隐约露出旧木桌的一角。\n- 窗户正下方：武大家一楼木门，门边有磨旧的石门槛。门旁留出一块能够斜靠竹竿的墙面。\n- 画面中下部：青石板街道，沿画面左右方向延伸，石缝有积尘。窗下路面清楚可见，没有摊棚、树枝和行人遮挡落竿位置。\n- 画面右上方：紧挨武大家的王婆茶坊，门口挂一块写着“茶”的旧布幌，门内有矮桌、粗陶茶碗和小炭炉。茶坊位置始终不变。\n- 远处边缘：少量旧木店面与瓦檐，不安排人群穿过主要动作区域。\n- 天气：冬末回暖的晴日下午，无积雪，偶有微风。日光从画面右侧照入，屋檐下形成固定的深灰阴影，30秒内光照方向不变。\n\n【人物】\n\n潘金莲：\n二十多岁的成年女子，身形纤细，黑发挽髻，插一支素簪。穿浅灰色对襟夹袄、深灰长裙，袖口有细窄滚边，衣着整齐。全程在二楼窗内活动，画面只能看到她的上半身与伸到窗外的手臂。\n最初专心整理竹帘；失手后明显慌张；确认对方没有生气后，动作逐渐放缓，最后多停留一眼。\n\n西门庆：\n三十岁左右的成年男子，身材挺拔，头戴深色头巾，穿有暗纹的中深灰绸缎长袍，腰系带，脚穿黑色布靴。双手起初空着。\n从画面右侧进入，向左行走，经过武大家窗下。被碰到后先停步恼怒，看清楼上女子后，肩膀放松，整理衣冠，转为殷勤有礼。\n\n王婆：\n六十岁左右的老妇人，穿深灰粗布袄，头包布巾。起初坐在茶坊门内，后半段才从门框旁探出半个身子，默默观察两人。\n\n【关键道具】\n\n一根约1.4米长的细竹叉竿，顶端有小分叉，用来挑挂竹帘。全片只有这一根。\n\n竹竿从潘金莲手中滑脱，经窗外落下，斜碰西门庆头巾后落到石板路上，随后由西门庆拾起，最后靠在武大家一楼门旁。全过程保持长度、材质与形状一致。\n\n【动作链】30秒一镜到底：\n\n0—5秒：\n潘金莲站在二楼窗前，右手握着竹叉竿，把半卷竹帘挑上窗侧木钩，左手扶住窗框。\n与此同时，西门庆从画面右侧走入，沿街向左，不紧不慢地走向窗下。他尚未抬头，也没有提前注意潘金莲。\n竹帘轻响，布靴踩过石板的声音逐渐靠近。\n\n5—10秒：\n竹帘已经挂稳。潘金莲正把叉竿收回，一阵微风拂动帘边，她抬起左手去扶，右手握持一松，竹叉竿意外滑出窗外。\n竹竿受重力自然下落，略微倾斜旋转，竿身轻碰刚好经过窗下的西门庆头巾，随后落到他脚边的石板上，弹动一下停住。\n西门庆在被碰到之后才猛地停步，缩一下脖子，抬手摸头巾，转身寻找来源。潘金莲的右手下意识向外追抓一下，没抓住，立即扶住窗台低头查看。\n依次响起竹竿擦碰头巾的闷响、落地的清脆“嗒嗒”声。\n\n10—15秒：\n西门庆抬头看向左上方的二楼窗口，原本绷紧的身体停顿片刻，摸头巾的手慢慢放下。\n潘金莲探出少许上身，看清自己打到了行人，双手收在身前，低头欠身致歉。\n西门庆看清她后，原先抬起准备质问的手没有继续指向窗口，而是顺势扶正头巾，整理衣领，嘴角浮出一点笑意。\n两人的视线明确连接楼上窗口与楼下站位，均不看监控镜头。\n\n15—20秒：\n西门庆弯腰，用右手拾起脚边的竹叉竿，再直起身。\n他向街心退半步，离开窗户正下方，以便看清潘金莲，随后稍稍举起竹竿，向楼上示意自己替她捡到了。\n潘金莲仍扶着窗台，先看竹竿，再看他的脸，紧绷的肩膀略微放松，轻轻点头。\n没有隔着一层楼伸手递还的动作。\n\n20—25秒：\n西门庆走近武大家一楼门旁，把竹叉竿下端放稳在石板上，上端轻靠门侧墙面。确认竹竿不再滑动后才松手。\n他退回能够看见窗口的位置，抬头向潘金莲拱手，微微欠身，动作比寻常还礼稍显郑重。\n潘金莲回以一个小幅度的欠身，原本准备缩回窗内，却在窗边多停留了一瞬。\n右上方茶坊内的王婆听到动静，从门框旁探出半个身子，先看靠在墙边的竹竿，再抬头看窗口。\n\n25—30秒：\n西门庆终于转身，继续向画面左侧离开，走出两步后又回头望向二楼窗口，脚步明显慢下来。\n潘金莲伸手把竹帘从木钩上取下，缓缓放低。竹帘降到胸前时，她停顿半秒，隔着尚未遮住的窗口再看西门庆一眼，然后继续放帘。\n王婆站在茶坊门边看完这一幕，嘴角露出一点心领神会的笑，慢慢缩回门内。\n最后一秒，竹帘仍在轻晃，竹叉竿稳稳靠在一楼门旁，画面底部出现一次短促的VHS横向撕裂与轻微“滋”声，录像结束。\n\n【镜头与声音】\n\n全程只有这一台固定监控，零运镜、零变焦、零切镜。所有时间段只是同一个镜头里的动作推进，不切人物特写，不插入叉竿落地特写，不使用慢动作。\n\n人物情绪主要通过停步、抬头、缩手、整理衣冠、欠身和回头表现，符合远距离监控能够辨认的动作尺度。\n\n无BGM，无旁白，无对白，无任何人声。只有轻微街巷风声、竹帘摩擦声、木钩轻响、布靴踩石板声、竹竿碰头巾与落地声、衣料窸窣声，以及最后短促的录像杂音。声音有老式监控收音的压缩感与轻微底噪。\n\n潘金莲始终留在二楼，西门庆始终留在街面，王婆始终在茶坊门内或门边。竹叉竿只有一次掉落，人物在接触发生后才作出反应。保留真实的楼层高度、重力、遮挡关系与目光方向。", "createdAt": "Mon Nov 09 14:35:54 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 18, "conversationId": "2119801158684578284", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119800667363786752/img/94jslZLK0h1ViMF3.jpg", "width": 1112, "height": 834, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119800667363786752/img/94jslZLK0h1ViMF3.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119800667363786752/vid/avc1/1112x834/Sa-iPS9YTW7oksSy.mp4?tag=29", "durationMs": 30080}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name eatedAtIso": "2026-11-09T12:49:05+00:00", "createdAtBeijing": "2026-11-09T20:49:05+08:00", "createdAtLocal": "11-09 20:49 北京", "url": "https://x.com/vikingmute/status/2119774277503512646", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2119774277503512646", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "手势交互设计 Skill", "evidence": "松手以后会有惯性", "rationale": "介绍手势资源及回弹、速度与惯性等具体能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2119667123698241947", "track": "creative", "source": {"id": "2119667123698241947", "text": "提示词：\n\n使用 **Three.js** 创建一个电影级写实的北京天坛祈年殿 3D 微缩景观，并设计一套精心编排的自动镜头动线，让整个作品像一座陈列在数字博物馆中的精美建筑模型。 ## 一、建筑建模：高精度还原 以北京天坛祈年殿为主体，参考真实建筑的结构、比例、色彩和细节，尽可能提高还原度。 重点表现： - **三重蓝色琉璃瓦圆形攒尖屋顶**：准确表现三层屋檐的曲线、起翘、层级关系和顶部鎏金宝顶。屋瓦需要有真实的排列纹理和光泽。 - **朱红色立柱与梁枋**：还原圆形柱廊、红色木构件、彩绘装饰及金色建筑细节。 - **斗拱结构**：在屋檐下制作具有层次感的传统木构件，避免用简单几何体替代所有细节。 - **三层汉白玉圆形台基**：包括石质栏杆、栏板、望柱、台阶与石材接缝。 - **周边环境**：铺设真实尺度的石砖广场，加入对称步道、远处松柏与院落元素，突出建筑庄严、规整的空间感。 整体建筑遵循真实比例，呈现精致的建筑沙盘效果。不要卡通、低多边形或玩具质感。 ## 二、视觉风格：电影级写实 采用 PBR 材质与高质量实时渲染： - 蓝色琉璃瓦具有真实高光、粗糙度和细微纹理。 - 红色木柱具有细腻的漆面反射。 - 汉白玉石材具有轻微的自然纹理和材质变化。 - 使用柔和的下午阳光，形成有方向感的建筑投影。 - 添加环境光、接触阴影、环境遮蔽以及合理的色调映射。 - 天空呈现自然的淡蓝色，背景有适度的大气透视。 - 画面构图参考专业建筑摄影，保持建筑轮廓清晰。 整体追求 **Unreal Engine 建筑可视化级别的观感**，但必须使用 Three.js 在浏览器中实时运行。 ## 三、镜头动线：35 秒电影级自动导览 设计一条完整、流畅、有视觉叙事的摄影机运动路径。 **镜头 1：航拍建立空间（0–5 秒）** 摄像机从广场上方的远处缓慢向前推进，采用略高于建筑的三分之四视角。 逐渐展示祈年殿、三层台基和周围环境，让观众建立空间认知。 **镜头 2：中轴线正面推进（5–12 秒）** 镜头平滑降低高度，过渡到祈年殿正前方的中轴线。 沿石阶方向缓缓推进，以建筑中心保持对称构图。强调台基、立柱与屋檐的层次感。 **镜头 3：环绕展示（12–21 秒）** 摄影机沿建筑外侧进行约 180° 的优雅环绕。 采用中低机位，镜头始终注视建筑主体，重点展示三重屋檐的弧度、红色立柱和丰富的木构细节。 **镜头 4：细节仰拍（21–28 秒）** 镜头靠近建筑侧前方，以仰视角度缓慢向上抬升。 从汉白玉台基、朱红立柱逐渐扫向蓝色琉璃瓦和鎏金宝顶，突出传统建筑的结构之美。 **镜头 5：升空收尾（28–35 秒）** 摄像机平滑上升并后退，转向经典的三分之四俯瞰视角。 完整展示建筑和圆形台基，最终停留在最适合欣赏整个模型的英雄镜头（Hero Shot）。 所有镜头之间必须平滑过渡，避免瞬间跳切、突然旋转、穿模或速度突变。 使用样条曲线进行相机路径插值，配合 Ease In/Out 缓动，令镜头运动具有电影摄影机的重量感和稳定性。 ## 四、交互体验 - 页面加载后自动播放建筑导览。 - 用户可以随时使用鼠标拖拽旋转、滚轮缩放，自由观察模型。 - 用户开始操作时自动暂停镜头导览。 - 增加「重新播放」「暂停/继续」「重置视角」按钮。 - 支持切换自动导览和自由探索模式。 - 页面界面极简，不要遮挡建筑。 - 提供一个精致的导览进度条。 - 可加入建筑名称「天坛 · 祈年殿」及简短的介绍字幕。 ## 五、技术要求 - 使用 Three.js、WebGL、OrbitControls 实现。 - 尽可能采用程序化几何建模，包括圆形屋顶、瓦片排列、柱廊、斗拱和栏杆。 - 重复建筑构件优先采用 InstancedMesh，兼顾细节与性能。 - 合理设置阴影贴图分辨率、材质复杂度及设备像素比。 - 采用 CatmullRomCurve3 或类似机制实现相机轨迹，并对相机朝向进行平滑插值。 - 在镜头切换和用户交互时避免控制器状态冲突。 - 自适应桌面浏览器窗口尺寸。 - 提供完整、可运行的代码，不使用仅用于占位的模型。 - 优先提供一个可直接在浏览器运行的 HTML 项目，必要时通过 CDN 导入依赖，避免依赖无法访问的外部模型资源。 ## 六、最终效果 这是一个 **可以实时旋转、缩放、自由探索，同时拥有电影级自动导览的写实天坛微缩模型**。 不要只完成一个大致形状正确的建筑。建筑精度、材质层次、光影质量和镜头设计同样重要。 最终观感应该像专业建筑数字遗产展览的交互式作品：精致、庄严、真实、流畅，并且令人愿意反复观看。", "createdAt": "Mon Nov 09 05:43:18 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2119667119579402368", "inReplyToStatusId": "2119667119579402368", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-09T05:43:18+00:00", "createdAtBeijing": "2026-11-09T13:43:18+08:00", "createdAtLocal": "11-09 13:43 北京", "url": "https://x.com/MinLiBuilds/status/2119667123698241947", "themeId": "editorial", "signalScore": 48, "editorial": {"id": "2119667123698241947", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "天坛三维建模与自动导览提示词", "evidence": "重复建筑构件优先采用 InstancedMesh", "rationale": "包含分镜时序、相机插值与性能要求，可直接复用"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2119703204925735161", "track": "growth", "source": {"id": "2119703204925735161", "text": "sitedata 又又又加强了👍\n\n可以看AI访问的流量了~", "createdAt": "Mon Nov 09 08:06:40 +0000 2026", "r /1942385394554728448/b9FlYTW2_normal.jpg"}, {"id": "2119863698349285519", "track": "enterprise", "source": {"id": "2119863698349285519", "text": "use muse ember to save millions\n\npay $0.10 / $0.50 / Mtok and save millions of dollars on legal clerical errors", "createdAt": "Mon Nov 09 18:44:25 +0000 2026", "replyCount": 28, "retweetCount": 16, "likeCount": 317, "conversationId": "2119863698349285519", "author": {"username": "alexandr_wang", "name": "Alexandr Wang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1631421210205749248/uohbT_40_normal.jpg"}, "authorId": "615818451", "quotedTweet": {"id": "2119860683114434845", "text": "We put Muse Ember from @AIatMeta to work untangling conflicting records in a $12.6 million private-fund capital call.\n\nAcross 13 documents in Box, Ember catches a $2.48 million misallocation and a missed $250,000 credit, recalculates each investor’s obligation, and produces a source-cited review for Fund Operations.\n\nCustomers can build custom agents for their own document-heavy financial workflows with Box AI Studio.", "createdAt": "Mon Nov 09 18:32:26 +0000 2026", "replyCount": 5, "retweetCount": 8, "likeCount": 42, "conversationId": "2119860683114434845", "author": {"username": "Box", "name": "Box", "profileImageUrl": "https://pbs.twimg.com/profile_images/2095961122147008512/lZm3p6aN_400x400.png"}, "authorId": "14936846", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119860016064925696/img/hd6SUfTMXAOLap4R.jpg", "width": 1668, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119860016064925696/img/hd6SUfTMXAOLap4R.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119860016064925696/vid/avc1/1668x1080/aZne-SuGceK5Cwkl.mp4?tag=29", "durationMs": 41583}], "translationZh": "我们让 @AIatMeta 的 Muse Ember 梳理了一笔 1,260 万美元私募基金出资缴款通知中相互矛盾的记录。\n\nEmber 分析了 Box 中的 13 份文件，发现一笔 248 万美元的分配错误和一笔遗漏的 25 万美元抵扣款，重新计算了每位投资者的应缴金额，并为基金运营团队生成了一份附有来源引用的审查报告。\n\n客户可以使用 Box AI Studio，为自身涉及大量文档的金融工作流程构建定制智能体。"}, "expert": {"priority": "P1", "domain": "AI 数据 / 基础设施", "name": "Alexandr Wang", "role": "Scale AI / 创始人兼 CEO", "why": "数据、评测、政府 AI、AI 基础设施", "handle": "alexandr_wang"}, "createdAtIso": "2026-11-09T18:44:25+00:00", "createdAtBeijing": "2026-11-10T02:44:25+08:00", "createdAtLocal": "11-10 02:44 北京", "url": "https://x.com/alexandr_wang/status/2119863698349285519", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2119863698349285519", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Box AI 基金缴款文件核对演示", "evidence": "Across 13 documents in Box", "rationale": "演示跨文档核账及溯源报告，收益仍属自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "用 muse ember 省下数百万美元\n\n每百万 token 仅需支付 $0.10 / $0.50，就能避免法律文书差错造成的数百万美元损失"}, "avatar": "https://pbs.twimg.com/profile_images/1631421210205749248/uohbT_40_normal.jpg"}, {"id": "2119728165245604082", "track": "agent", "source": {"id": "2119728165245604082", "text": "Bought https://t.co/4RnDsaFIiX for my editor.", "createdAt": "Mon Nov 09 09:45:51 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 6, "conversationId": "2119728165245604082", "author": {"username": "chenchengpro", "name": "陈成", "profileImageUrl": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, "authorId": "15205852", "quotedTweet": {"id": "2110699165051453771", "text": "我写了个代码编辑器，叫 Mayoi。\n\n现在大家的工作方式变了，已经很少手动改文件。\n\n所以，每天大部分需要用到 editor 的场景是：\n1. 看 diff\n2. review agent 写的代码\n3. 打开几个文件确认一下\n3. 开个终端，起下一个 agent\n\nVS Code 和 Cursor 是为以前那种写法造的。Cursor 装完快 1 GB，一大堆功能我从来不用。\n\n所以我给现在的写法做了一个。\n\n- 所有改动在一个 diff 里看，行内或左右对照，在行号旁直接 stage 或 revert\n- 终端用的是 Ghostty 的内核，放底部面板或单开一个 tab 都行，⌘V 能把截图直接贴给 Claude Code\n- 所有仓库开在一个窗口里，后台项目的 agent 一响铃，它的 tab 就会亮\n- 快速打开、全局搜索、Markdown 预览、Vim 模式、Remote SSH\n\n内置 Qoder、Claude 和 Matrix 等主题。Matrix 那款有代码雨。\n\n够小：\n- 应用 24 MB，Cursor 970 MB\n- 内存约 180 MB，Cursor 约 1.3 GB，都是此刻我电脑上开着的数字\n- 10 万行的文件，打开约 20 ms\n\nGo 写的，基于 MyGo，GPU 直接画原生 UI，没有 Electron，没有 webview。\n\nMIT 开源，试试 👇", "createdAt": "Thu Oct 15 11:47:50 +0000 2026", "replyCount": 35, "retweetCount": 14, "likeCount": 161, "conversationId": "2110699165051453771", "author": {"username": "chenchengpro", "name": "陈成", "profileImageUrl": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, "authorId": "15205852", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2110698817758875648/img/CKbfdHrD3e9im5om.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2110698817758875648/img/CKbfdHrD3e9im5om.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2110698817758875648/vid/avc1/1920x1080/mBrE6cc2DAH55E3i.mp4?tag=29", "durationMs": 30000}]}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "云谦（陈成）", "role": "Agent 与开发工具实践与观察", "why": "持续拆解验证、编排、后台服务和事件恢复，Coding Agent 工程增量强。", "handle": "chenchengpro"}, "createdAtIso": "2026-11-09T09:45:51+00:00", "createdAtBeijing": "2026-11-09T17:45:51+08:00", "createdAtLocal": "11-09 17:45 北京", "url": "https://x.com/chenchengpro/status/2119728165245604082", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2119728165245604082", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Mayoi 面向 Agent 协作的开源编辑器", "evidence": "所有改动在一个 diff 里看", "rationale": "引用含具体功能与开源信息，性能为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "给我的编辑买了 https://t.co/4RnDsaFIiX。"}, "avatar": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, {"id": "2119866760723890571", "track": "research", "source": {"id": "2119866760723890571", "text": "@latentspacepod anyway see how a Paid For but Unbiased podcast that requires the most braincells covers a leading data lab https://t.co/HhslpHJ4Ps\n\n3hour monster state of RL envs pod!", "createdAt": "Mon Nov 09 18:56:35 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 4, "conversationId": "2119824420059697455", "inReplyToStatusId": "2119824420059697455", "author": {"username": "swyx", "name": "swyx 🔜 aie.codes", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, "authorId": "33521530", "quotedTweet": {"id": "2119866369412124746", "text": "🆕 Our first deep dive with an AI data company!\n\nThe frontier data space is exploding. @joinHandshake has become one of the leading partners for frontier labs, going from launch to $1B in GMV in ~a year, with @sacrainc estimating net revenue AFTER contractor payouts at about $450M per year. \n\nhttps://t.co/VPlvd9j6xV\n\nWhat are frontier labs buying at that scale? Who is building the RL environments that build the models that you build with? How hard are evals getting?\n\nFor the first time in our pod, we're speaking across a company, from cofounders @GarrettLord and @Sbhaiwala03 to leaders of Handshake Labs, Life Sciences, Finance, and Alignment. To cover this required assembling our complete team of Science, Engineering, Research and Finance hosts. \n\nFor the first time, we walked through the tasks live:\n\n🌸 50:59 · Nick puts nine brain-tissue slides on screen. Can you pick the two with the most advanced vessel necrosis?\n\n🟢 1:25:45 · Collin traces a bad valuation back to one line of Python. The model knows the tax rule when asked. Can it recognize where to apply it?\n\n🟠 2:07:21 · Steve and Nishant follow an agent through the files it read, the copies it checked, and the shell history it cleared.\n\nhttps://t.co/YpV0axPkb6", "createdAt": "Mon Nov 09 18:55:02 +0000 2026", "replyCount": 5, "retweetCount": 2, "likeCount": 18, "conversationId": "2119866369412124746", "author": {"username": "latentspacepod", "name": "Latent.Space", "profileImageUrl": "https://pbs.twimg.com/profile_images/1888346877428641792/rMxtG84Z_normal.jpg"}, "authorId": "1670869422733393966", "translationZh": "🆕 我们首次深入访谈一家 AI 数据公司！\n\n前沿模型数据领域正在爆发式增长。@joinHandshake 已成为前沿模型实验室的主要合作伙伴之一，从业务启动到商品交易总额（GMV）达到 10 亿美元，仅用了约一年。@sacrainc 估计，其扣除承包人员报酬后的净收入约为每年 4.5 亿美元。\n\nhttps://t.co/VPlvd9j6xV\n\n前沿模型实验室花这么多钱，究竟在买什么？你用来开发的模型，背后的 RL 训练环境又是谁在构建？评测到底变得有多难？\n\n这是我们的播客首次访谈一家公司的多个团队，从联合创始人 @GarrettLord 和 @Sbhaiwala03，到 Handshake Labs、生命科学、金融及对齐团队的负责人。为此，我们集结了科学、工程、研究和金融方向的全部主持人。\n\n我们还首次在节目中现场演示了这些任务：\n\n🌸 50:59 · Nick 在屏幕上展示了九张脑组织切片。你能选出血管坏死最严重的两张吗？\n\n🟢 1:25:45 · Collin 将一次错误估值追溯到一行 Python 代码。直接提问时，模型知道相关税务规则。但它能识别出应该在哪里应用这条规则吗？\n\n🟠 2:07:21 · Steve 和 Nishant 追踪一个智能体，查看它读过哪些文件、检查过哪些副本，以及清除了哪些 shell 历史记录。\n\nhttps://t.co/YpV0axPkb6"}, "expert": {"priority": "P1", "domain": "Agent / 工作流", "name": "swyx", "role": "Latent Space / AI Engineer", "why": "AI 工程社区、Agent、开发工具信号源", "handle": "swyx"}, "createdAtIso": "2026-11-09T18:56:35+00:00", "createdAtBeijing": "2026-11-10T02:56:35+08:00", "createdAtLocal": "11-10 02:56 北京", "url": "https://x.com/swyx/status/2119866760723890571", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2119866760723890571", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "前沿模型数据、RL环境与评测案例", "evidence": "Collin traces a bad valuation", "rationale": "引用内容提供估值错误与代理行为的具体分析案例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "@latentspacepod 总之，来看看这档收了赞助但保持客观、最烧脑的播客，是如何深入报道一家领先的数据实验室的 https://t.co/HhslpHJ4Ps\n\n足足 3 小时，全面盘点 RL 环境现状的超长播客！"}, "avatar": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, {"id": "2119887412432355385", "track": "research", "source": {"id": "2119887412432355385", "text": "got this working with Qwen3.5-4B this weekend\n\nbetter reasoning solved most of the unsolved tasks from the 2B test. so yeah, we can compile agent loops into model weights i guess\n\nnext: harder unbounded tasks? even bigger models? https://t.co/uHHcbzPfXu", "createdAt": "Mon Nov 09 20:18:39 +0000 2026", "replyCount": 17, "retweetCount": 1, "likeCount": 29, "conversationId": "2119887412432355385", "author": {"username": "yoheinakajima", "name": "Yohei", "profileImageUrl": "https://pbs.twimg.com/profile_images/1452754543217831938/T2O-66Yy_normal.jpg"}, "authorId": "30439303", "quotedTweet": {"id": "2118134446947971336", "text": "GPU, CPU, file system... I put BabyAGI in Qwen 👶\n\nmeet babyagi-inside: a bounded agent loop, compiled into the weights of Qwen3.5-2B. nothing runs outside the model\n\nthe agent still sucks, but the loop works! built on and uses @thevixhal's qwenfs, shout out to @divagr1925's qwenputer\n\nmore 👇", "createdAt": "Thu Nov 05 00:12:59 +0000 2026", "replyCount": 37, "retweetCount": 15, "likeCount": 143, "conversationId": "2118134446947971336", "author": {"username": "yoheinakajima", "name": "Yohei", "profileImageUrl": "https://pbs.twimg.com/profile_images/1452754543217831938/T2O-66Yy_normal.jpg"}, "authorId": "30439303", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118125751203737601/img/J76lkcUzG5ZIAs4A.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118125751203737601/img/J76lkcUzG5ZIAs4A.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118125751203737601/vid/avc1/1920x1080/luKdM7yxvnQkr_sw.mp4?tag=29", "durationMs": 31800}], "translationZh": "GPU、CPU、文件系统……我把 BabyAGI 放进了 Qwen 👶\n\n认识一下 babyagi-inside：一个编译进 Qwen3.5-2B 权重的有界智能体循环。所有运行都在模型内部完成\n\n这个智能体依然很菜，但循环跑通了！基于 @thevixhal 的 qwenfs 构建并使用它，也向 @divagr1925 的 qwenputer 致敬\n\n更多内容 👇"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtZ8c9aYAAqkDV.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWtZ8c9aYAAqkDV.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 创业公司", "name": "Yohei Nakajima", "role": "Untapped Capital / BabyAGI", "why": "自主 Agent 早期原型和讨论源", "handle": "yoheinakajima"}, "createdAtIso": "2026-11-09T20:18:39+00:00", "createdAtBeijing": "2026-11-10T04:18:39+08:00", "createdAtLocal": "11-10 04:18 北京", "url": "https://x.com/yoheinakajima/status/2119887412432355385", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2119887412432355385", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "将有界Agent循环编入Qwen模型权重", "evidence": "got this working with Qwen3.5-4B", "rationale": "自述完成4B实验并改善任务表现，尚无独立验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "这个周末用 Qwen3.5-4B 把它跑通了\n\n更强的推理能力解决了 2B 测试中大部分没能解决的任务。所以看来，我们确实可以把智能体循环编译进模型权重里\n\n下一步：更难、没有预设边界的任务？更大的模型？https://t.co/uHHcbzPfXu"}, "avatar": "https://pbs.twimg.com/profile_images/1452754543217831938/T2O-66Yy_normal.jpg"}, {"id": "2119678626442662111", "track": "agent", "source": {"id": "2119678626442662111", "text": "我儿子学习和平时玩的游戏 App，现在基本都是我 Vibe Coding 的了，看到哪个 App 要收费，直接手搓一个，最多半小时就能用了，边用边提要求，边让 Claude Code / Codex 改，前后几轮改完就基本满足需求了\n\n给孩子做 App 不是啥复杂大型企业项目，所以 Claude Opus 5.5 这种重型武器一般用不上，Flash 类模型最为合适，速度快、可以更快看到效果更快迭代；另外多模态也是很实用的能力（收费 App 截图要求 1:1 复刻 😂）\n\n再给大家分享一下给孩子做的打字游戏，分为不同字母进阶和句子大写空格等游戏：\nhttps://t.co/KUcD1z65tc", "createdAt": "Mon Nov 09 06:29:00 +0000 2026", "replyCount": 29, "retweetCount": 6, "likeCount": 54, "conversationId": "2119678626442662111", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119616008617070607", "text": "最近同事看到手机上自己做的一个记录APP，也想要一个给她家小朋友学习打开的APP。\n设计了一版手机APP的UI，手机版的设计出来之后，想着也做个网页版本的吧。\n小蜜蜂学习看板原来是按手机排的，进度卡在上，任务清单在下。我想试个电脑版，打开就能一起看今天要做什么、这周做了多少。\n\n我把手机稿发给 Ling Studio 里的 Ling-3.2-flash，打了这么一句。\n“帮我根据这个设计的图，制作成网页”\n它给了我一份 HTML，打开就是图一，就是在电脑上套了个手机壳。\n网页是做出来了，四个入口也都在，内容还是挤在屏幕中间那一条里。\n我那句确实只说了做网页，就是把手机的设计稿复刻了一下，不是真正的网页版本。\n\n第二轮我没再传图，就补了一句。\n“能不能适配一下，pc端的网页，而不是模拟的手机端页面”\n这次把「今日、练习、资料、成长」挪到了左边，任务清单摊在中间，原来叠在清单上面的进度卡也摆到了旁边。\n这是算是真正的网页端了。\n\n如果说第一版是一句话复刻的设计稿，那么第二版是有加入了想法的感觉，理解力更强了，\n总的来说不管第一次还是第二次的版本都是能给你需求来完成任务。\n\n在线体验入口：https://t.co/GK23wGYFoG\nAPI体验：https://t.co/8d8hNmvF2R", "createdAt": "Mon Nov 09 02:20:11 +0000 2026", "replyCount": 38, "retweetCount": 6, "likeCount": 20, "conversationId": "2119616008617070607", "author": {"username": "sodawhite_dev", "name": "苏打白.Dev", "profileImageUrl": "https://pbs.twimg.com/profile_images/2013657675377053697/Kg-2nXw6_400x400.jpg"}, "authorId": "1995093229344342016", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWpg1dxboAAKVEJ.jpg", "width": 1280, "height": 800, "previewUrl": "https://pbs.twimg.com/media/HWpg1dxboAAKVEJ.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWpg976bcAAVCpy.jpg", "width": 1280, "height": 800, "previewUrl": "https://pbs.twimg.com/media/HWpg976bcAAVCpy.jpg:small"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119613231891423233/img/zl44qz5FpCsxPqdZ.jpg", "width": 2048, "height": 1066, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119613231891423233/img/zl44qz5FpCsxPqdZ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119613231891423233/vid/avc1/2074x1080/o5F1vYUkJCysXOKQ.mp4?tag=29", "durationMs": 40500}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWqcaVrboAAacgq.jpg", "width": 1187, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWqcaVrboAAacgq.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-09T06:29:00+00:00", "createdAtBeijing": "2026-11-09T14:29:00+08:00", "createdAtLocal": "11-09 14:29 北京", "url": "https://x.com/shao__meng/status/2119678626442662111", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2119678626442662111", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "儿童学习应用开发与跨端迭代", "evidence": "边用边提要求，边让 Claude Code / Codex 改", "rationale": "分享实际作品、模型选择及布局纠正方法"}, "isTopSt 方"}, "avatar": "https://pbs.twimg.com/profile_images/1856486626072915968/JEQpB9CW_normal.jpg"}, {"id": "2119799246887219479", "track": "enterprise", "source": {"id": "2119799246887219479", "text": "Here's how I keep X clean without missing the good stuff from people I follow. I gave Grok this prompt, and you can try it too:\n\nEvery evening at 8pm, put together today's highlights from the accounts I follow, plus others worth reading. Read posts only through the official X API, and skip anything covered the day before.\n\nFormat:\n- Open with \"Today's main threads\" in 3 short sentences\n- One section per person, with their name and @, and a divider between sections\n- 2 to 4 points per section, each as a bold topic, then the content and a link to the original post. Use two to four sentences to cover what they said, the key details and the background\n- End each section with one sentence of your own take\n- Put small tools in a final \"Tools\" section\n- About 10 to 15 sections, no em dashes, no AI tone, keep it simple and clear\n\nNow I get this digest every day, so I scroll X less and stay a bit more focused.", "createdAt": "Mon Nov 09 14:28:19 +0000 2026", "replyCount": 13, "retweetCount": 6, "likeCount": 104, "conversationId": "2119799246887219479", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWsKKYKbEAAJhea.jpg", "width": 1950, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWsKKYKbEAAJhea.jpg:small"}], "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-09T14:28:19+00:00", "createdAtBeijing": "2026-11-09T22:28:19+08:00", "createdAtLocal": "11-09 22:28 北京", "url": "https://x.com/HiTw93/status/2119799246887219479", "
