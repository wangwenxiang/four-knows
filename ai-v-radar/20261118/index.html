u.mp4?tag=29", "durationMs": 20400}], "translationZh": "我把 Shader Lab 开源了！:)\n\n为了庆祝，现在你可以切换不同类型的窗户，改变雨水的方向。\n\nGitHub 仓库中附有说明，教你如何在自己的 HomeView 虚拟机上运行。\n\nhttps://t.co/VyWXx9c8E9\n\n玩得开心！https://t.co/H5vcRz4QEK"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-17T12:34:26+00:00", "createdAtBeijing": "2026-11-17T20:34:26+08:00", "createdAtLocal": "11-17 20:34 北京", "url": "https://x.com/lencx_/status/2122669692678729995", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2122669692678729995", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Shader Lab开源着色器实验台", "evidence": "内置 15 种效果", "rationale": "介绍开源工具、实时调参及壁纸导出功能"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2122631475707400452", "track": "creative", "source": {"id": "2122631475707400452", "text": "GPT Image 2.5东方美学禅意海报：自在如风。\n\n提示词：\n9:16竖版，东方禅意极简女性海报，清透明快型，现代东方插画与高精度人物写真融合，明亮、通透、舒展、有呼吸感。\n\n一位24–27岁的成年东方女性，近全身构图，站在清浅湖水中，身体自然舒展，一手轻扶被风吹起的长发，另一只手自然下垂，衣摆、长袖与发丝随风向同一方向轻轻扬起。人物微微抬头，神情安静、自由、清醒，五官柔美耐看，姿态优雅自然。\n\n人物穿珍珠白与浅米白古风长裙，轻薄宽袖与层叠纱裙具有自然透光感，局部点缀极少珊瑚橙花枝刺绣和浅青绿细节。\n\n场景为开阔浅水面，湖蓝色集中在水面，远处只有极淡山线，水面保留少量细小波纹、阳光反光和人物倒影。画面边缘点缀少量珊瑚橙小花与飘落花瓣，不形成花海。\n\n人物位于画面中央偏下，占画面高度约65%，作为第一视觉中心；远景保持极简，上方和右侧保留大面积自然留白。\n\n色彩控制：珍珠白为人物与高明度空间基底，湖蓝只用于水面，珊瑚橙只用于少量花朵与反光点睛，浅青绿只用于极少服饰细节；禁止整图蓝橙滤镜化。\n\n明亮自然日光，水面清亮，人物轮廓清晰，发丝、薄纱和衣摆有轻柔逆光，整体干净轻盈。\n\n留白处加入东方艺术标题：\n「自在如风」\n副文案：\n「心向旷野，自在而生。」\n搭配一枚小型朱红印章「东方美学」。\n\n负面约束：不要人物比例异常，不要手臂反转，不要多手多指，不要头发和衣摆风向冲突，不要灰雾，不要脏蓝，不要过曝，不要复杂山水，不要水面抢主体。", "createdAt": "Tue Nov 17 10:02:35 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 18, "conversationId": "2122631475707400452", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "quotedTweet": {"id": "2122230873345101904", "text": "GPT Image 2.5东方美学禅意海报：静好时光\n\nPrompt：\n9:16竖版，东方禅意极简女性封面海报，现代新中式审美，明亮、通透、柔和、精致，高颜值女性向封面。\n\n一位24–27岁的成年东方女性，精致柔和的鹅蛋脸，清亮杏眼，淡妆，白皙自然肤质。深棕黑色长发半盘发，少量白花与浅金发簪点缀。\n\n人物坐在暖白墙边，身体轻微侧转，双腿自然收拢，一只手自然搭在膝盖上，另一只手轻放前方，微微抬头望向右上方，神情安静、松弛、温柔。肩颈、手臂、手腕和手指结构自然协调。\n\n人物穿珍珠白与浅杏色古风襦裙，外罩轻薄宽袖纱衣，局部带少量桃粉花枝与浅绿叶片刺绣，服装轻盈精致但不过度华丽。\n\n背景为大面积暖白墙面，左侧少量竹枝与竹影，少量桃粉花瓣飘落。人物位于中下部偏左，占画面高度约60%，右上方保留大面积连续留白用于标题。\n\n色彩控制：暖白为主基底，青竹绿只用于竹叶与少量服饰细节，桃粉只用于花瓣点睛，浅金只用于发饰；颜色各自归位，禁止整图粉绿化、发灰、发黄。\n\n明亮自然侧光，竹影清晰，人物面部柔亮，发丝和薄纱有轻微轮廓光，整体干净、通透、有呼吸感。\n\n留白处加入东方艺术标题：\n「静好时光」\n副文案：\n「心有清欢，日子自安。」\n搭配一枚小型朱红印章。\n\n负面约束：不要人物比例异常，不要肩臂反转，不要多手多指，不要手指畸形，不要网红脸，不要灰雾，不要脏黄，不要复杂背景，不要满屏花朵。", "createdAt": "Mon Nov 16 07:30:44 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 11, "conversationId": "2122230873345101904", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXOtuEdaUAATZI_.jpg", "width": 942, "height": 1670, "previewUrl": "https://pbs.twimg.com/media/HXOtuEdaUAATZI_.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXUaEU0a8AAxPp4.jpg", "width": 941, "height": 1672, "previewUrl": "https://pbs.twimg.com/media/HXUaEU0a8AAxPp4.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-17T10:02:35+00:00", "createdAtBeijing": "2026-11-17T18:02:35+08:00", "createdAtLocal": "11-17 18:02 北京", "url": "https://x.com/liyue_ai/status/2122631475707400452", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2122631475707400452", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "东方禅意女性海报提示词", "evidence": "湖蓝只用于水面", "rationale": "完整提供构图、配色、光线与负面约束，可复用"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2122713268636782610", "track": "creative", "source": {"id": "2122713268636782610", "text": "Qwen4-Max这次杀疯了！！\n作为一个天天用Opus 5.5和Fable 5.2做3D建模的开发者，这次我抱着试试的心态用了Qwen4-Max，没想到效果竟然不虚其他海外顶尖大模型！！\n\n从网上调研和数据开始，Qwen4-Max用three.js帮我构建了整个杭州西湖核心区的3D场景。\n\n这个杭州城的3D场景，不仅有树，有车，有NPC行人，还有昼夜交互，湖中还有行驶的轮渡，雷峰塔在夜晚金光闪闪，你甚至可以在城市中自由探索。\n\n我的 超级3D城市库有 44 座城市，唯独没有杭州。这次把杭州整个交给 Qwen4-Max，我只负责给口喷和出任务：\n\n1️⃣ 导数据：它先读完我 700 多行的项目规范和西湖方案，自己把范围扩到 5.6×4.2 公里，一次导入 6651 栋楼，评分全过\n\n2️⃣ 看实拍还原：地图里大部分楼没有层数。我扔给它几张湖滨实拍，它看出前低后高、校了楼高，沿苏堤白堤种上柳树。我说岸边有栋楼泡在湖里，它查出是地图岸线偏了 70 米，加规则挪回岸上\n\n3️⃣ 建地标：雷峰塔只给了一张照片。它认出八角五层、逐层回廊，用项目里现成的塔生成器补上回廊和夜里的金色泛光\n\n同一道题让 High 和 xhigh 各跑一遍：xhigh 多想一分多钟、输出多三成，方案更全。\n\n整个过程我没写一行代码，只负责口述指挥。它一直照着我项目的规范干，三个任务前后跑了几个小时。\n\nQwen4-Max 已正式上线，千问 AI 平台 API、Token Plan、Qoder 都能用 👇", "createdAt": "Tue Nov 17 15:27:36 +0000 2026", "replyCount": 32, "retweetCount": 0, "likeCount": 33, "conversationId": "2122713268636782610", "author": {"username": "rionaifantasy", "name": "Rion Wu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1996577388478844928/WkPc65TY_normal.jpg"}, "authorId": "1451831560991170569", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122712398150967296/img/SNLBIijzGjNy5Xfw.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122712398150967296/img/SNLBIijzGjNy5Xfw.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122712398150967296/vid/avc1/1920x1080/wrnYstGJfS1xjl1Q.mp4?tag=29", "durationMs": 81514}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "Rion Wu", "role": "内容、视觉与多模态实践与观察", "why": "具体展示跨工具生图与精修方法，能补视觉生产的实际操作。", "handle": "rionaifantasy"}, "createdAtIso": "2026-11-17T15:27:36+00:00", "createdAtBeijing": "2026-11-17T23:27:36+08:00", "createdAtLocal": "11-17 23:27 北京", "url": "https://x.com/rionaifantasy/status/2122713268636782610", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2122713268636782610", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Qwen4-Max辅助西湖3D场景制作", "evidence": "一次导入 6651 栋楼", "rationale": "自述具体建模成果及地图纠偏方法，缺独立验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1996577388478844928/WkPc65TY_normal.jpg"}, {"id": "2122746401482592549", "track": "agent", "source": {"id": "2122746401482592549", "text": "devin bots are multi-agent teams done right:\n- always on, proactive (but tuned for ROI)\n- own outcomes not tasks (but can collab w others)\n- manages teams of subagents (and reviews itself)\n- available everywhere (call text slack whatever hello @interaction)\n- consistent reporting thru interactive artifacts aka devinapps not long chats (HTML is all you need™ @trq212)\n\nthis is the preview that @walden_yan gave at AIE. i've been trialing them for a week and i've been able to hand over my AEO, QA, cross-platform app porting, personal admin automation, and video editing work (also simultaneously moving from local agent worktree hell to cloud because ofc this is all cloud based thank god)\n\nhyped concepts this replaces:\n- /goal\n- \"ultracode\" / \"ultra mode\"\n- \"loop engineering\"\n- \"agent to agent\"\n- \"agent swarms\"\n- AI employees (see below)\n\nmy main aha moment is that you don't want \"AI Employees\", we do not have agi yet and you will just fail if you overpromise/overexpect. what you want is the \"just\" the next level of abstraction above single tasks, and the overwhelming consensus I've had talking to everyone at the frontier of agents (yes incl cog competitors) is agent managers that own outcomes. \n\nincidentally, as an employer of humans it's also how i distinguish between someone who \"has agency\" (owns a problem area, finds issues and researches/brings solutions not problems) and who doesn't (only does precisely what i asked, not proactive, doesn't come up with suggestions i didn't think about). guess which one i value more lol.\n\nif youre a startup, reminder that Devin for Startups offers 65k in credits. apply via clanker", "createdAt": "Tue Nov 17 17:39:15 +0000 2026", "replyCount": 92, "retweetCount": 14, "likeCount": 221, "conversationId": "2122746401482592549", "author": {"username": "swyx", "name": "swyx", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, "authorId": "33521530", "quotedTweet": {"id": "2122737511684587551", "text": "Meet Devin Bots.\n\nFrom writing firmware to merging thousands of PRs a week, a Devin Bot leads a team of agents to get the job done.", "createdAt": "Tue Nov 17 17:03:55 +0000 2026", "replyCount": 223, "retweetCount": 244, "likeCount": 2328, "conversationId": "2122737511684587551", "author": {"username": "cognition", "name": "Cognition", "profileImageUrl": "https://pbs.twimg.com/profile_images/1765909640364068865/MvH-m0gd_normal.jpg"}, "authorId": "1751810001751183361", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122736117183344641/img/603VwLm95_w6iiBa.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122736117183344641/img/603VwLm95_w6iiBa.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122736117183344641/vid/avc1/1920x1080/Y8kw49IJltU9CXei.mp4?tag=29", "durationMs": 93051}], "translationZh": "认识一下 Devin Bots。\n\n从编写固件到每周合并数千个 PR，Devin Bot 都能带领智能体团队完成任务。"}, "expert": {"priority": "P1", "domain": "Agent / 工作流", "name": "swyx", "role": "Latent Space / AI Engineer", "why": "AI 工程社区、Agent、开发工具信号源", "handle": "swyx"}, "createdAtIso": "2026-11-17T17:39:15+00:00", "createdAtBeijing": "2026-11-18T01:39:15+08:00", "createdAtLocal": "11-18 01:39 北京", "url": "https://x.com/swyx/status/2122746401482592549", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2122746401482592549", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Devin Bots 发布与多任务试用", "evidence": "Meet Devin Bots.", "rationale": "包含产品发布、协作机制及一周试用场景自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "devin bots 把多智能体团队做对了：\n- 全天候在线、主动行动（同时兼顾投入产出比）\n- 对结果负责，而不只是执行任务（也能与他人协作）\n- 管理子智能体团队（还会自我审查）\n- 随处可用（电话、短信、Slack，什么渠道都行，哈喽 @interaction）\n- 通过交互式产物，也就是 devinapps，持续汇报，而不是冗长聊天（HTML 就够了™ @trq212）\n\n这是 @walden_yan 在 AIE 上展示的预览。我已经试用了一周，把 AEO、QA、跨平台应用移植、个人事务自动化和视频剪辑工作都交给了它们（同时也终于从本地智能体 worktree 的折腾中转向云端，因为这些当然全都在云上运行，谢天谢地）。\n\n它取代了这些被热炒的概念：\n- /goal\n- “ultracode” / “ultra mode”\n- “循环工程”\n- “智能体间协作”\n- “智能体群”\n- AI 员工（见下文）\n\n我最大的顿悟是：你想要的并不是“AI 员工”。我们还没有 AGI，承诺过头或期望过高，只会失败。你需要的“只是”比单个任务高一层的抽象。我和智能体领域前沿的从业者聊过，绝大多数人的共识都是：需要对结果负责的智能体管理者（对，也包括 cog 的竞争对手）。\n\n顺便说一句，作为雇主，我也是这样区分一个人是否“有主观能动性”的：有的人会负责一个问题领域，主动发现问题、研究并带来解决方案，而不是只抛出问题；有的人只会严格按我的要求做事，不主动，也提不出我没想到的建议。猜猜我更看重哪一种，哈哈。\n\n如果你在创业，提醒一下：Devin for Startups 提供 6.5 万美元的使用额度。可通过 clanker 申请。"}, "avatar": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, {"id": "2122767521925230896", "track": "tools", "source": {"id": "2122767521925230896", "text": "Teaching robots new tasks just got a lot faster. 🤖\n\nWith Gemini 4 Hydrogen and the new robotics plugin for Google @Antigravity, you can connect a supported arm, practice in @MuJoCo simulation, and run tasks in the real world using plain conversation.", "createdAt": "Tue Nov 17 19:03:10 +0000 2026", "replyCount": 90, "retweetCount": 54, "likeCount": 610, "conversationId": "2122767521925230896", "author": {"username": "GoogleDeepMind", "name": "Google DeepMind", "profileImageUrl": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_normal.jpg"}, "authorId": "4783690002", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122766777495027712/img/txiZKq1vSg1HeE5I.jpg 802", "text": "1/ We rebuilt macOS virtual machines for agents. It's called Hoy, and it's out today.\n\nOn the same Mac, a Hoy VM boots 20% faster and restores from a snapshot 2.5x faster than with Apple's Virtualization framework, and it runs local models with GPU acceleration.\n\nBuilt for agents, CI and RL. Free, including commercial use.", "createdAt": "Tue Nov 17 17:22:55 +0000 2026", "replyCount": 40, "retweetCount": 51, "likeCount": 579, "conversationId": "2122742292330987802", "author": {"username": "trycua", "name": "Cua", "profileImageUrl": "https://pbs.twimg.com/profile_images/2106056584929361920/XJWz9bZS_normal.jpg"}, "authorId": "1883205292596359168", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122739750947758080/img/G4RNcrcoWThvT4jl.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122739750947758080/img/G4RNcrcoWThvT4jl.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122739750947758080/vid/avc1/1920x1080/nfFvVjnlodCKs-7V.mp4?tag=29", "durationMs": 69800}], "translationZh": "1/ 我们为智能体重新打造了 macOS 虚拟机。它叫 Hoy，今天正式推出。\n\n在同一台 Mac 上，Hoy 虚拟机的启动速度比使用 Apple Virtualization 框架快 20%，快照恢复速度达到其 2.5 倍，还支持通过 GPU 加速运行本地模型。\n\n专为智能体、CI 和 RL 打造。免费，商用也免费。"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "Wey Gu 古思为", "role": "模型、研究与推理实践与观察", "why": "Agent 跨机器会话、记忆及设备体验具有应用价值，可补当前覆盖。", "handle": "wey_gu"}, "createdAtIso": "2026-11-17T17:49:45+00:00", "createdAtBeijing": "2026-11-18T01:49:45+08:00", "createdAtLocal": "11-18 01:49 北京", "url": "https://x.com/wey_gu/status/2122749044900696238", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2122749044900696238", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "面向Agent的Hoy macOS虚拟机", "evidence": "a Hoy VM boots 20% faster", "rationale": "发布Agent虚拟机，提供性能自述及使用条件"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}], "preview": false, "productionMonitored": 122};
const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
