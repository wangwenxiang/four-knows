<script>
const DATA={"records": [{"id": "2122480930439016820", "track": "agent", "source": {"id": "2122480930439016820", "text": "Claude Code 团队：让 Agent 交付验证证据，不只是代码\n\n来自 Claude Code 团队 @addyosmani 分享：Claude Code 团队 90% 的代码由 Claude 编写并审查。真正限制并行规模的，不再是代码生成速度，转为人能否确认结果可靠。验证循环的意义，是让 Agent 提交可检查的证据，减少人逐项核对的负担。\n\nhttps://t.co/68dPtWV4tA\n\n# 先真正运行，再判断完成\n\n团队把启动和冒烟检查写成 verify Skill，让 Claude 在提交前执行。检查失败后尝试修复，三轮仍失败则交给人。\n\n验证也不是每次机械执行所有检查。一份 39 项可靠性清单根据代码改动触发，通常只检查相关的 3—10 项。例如修改会话存储，就要确认旧记录仍能通过 --resume 安全恢复。检查由代码所有者编写，让具体的工程经验成为可重复执行的步骤。\n\n# 改代码，不能顺便改掉评判标准\n\nClaude Code 团队最重要的一条原则是：如果一项改动能修改评判自己的检查，这套检查就失效了。\n\n因此，代码审查规则 REVIEW.md 从基础分支或默认分支读取，而不是采用当前拉取请求里可能被修改的版本；审查也针对固定提交，避免代码变化后结论仍被沿用。\n\n每次提交还会记录验证方式，包括明确标注“未验证”。系统可以拦截没有运行审查或验证的提交，但同一会话连续拦截两次后会放行，以免陷入死循环。这说明它是带人工兜底的工程机制，不是绝对安全保证。\n\n# 验证器本身，也要接受验证\n\n团队用回滚记录、维护者拒绝的改动，以及规模相近的正常改动评估审查效果，并恢复当时的仓库状态。只有准确指出实际缺陷的发现才计分，不能靠泛泛提醒获得好成绩。\n\n漏检也不会直接变成新规则：同类问题至少要在两个拉取请求中出现、能从代码差异中识别，再经三个 Agent 尝试找出反例，最后由人批准。这样既积累经验，也避免规则越来越多、误报越来越重。", "createdAt": "Tue Nov 17 00:04:22 +0000 2026", "replyCount": 18, "retweetCount": 2, "likeCount": 42, "conversationId": "2122480930439016820", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122457608963395586", "text": "Claude writes better code when it can verify its work. Checks that used to be expensive, like tests, benchmarks, and end-to-end runs, are now cheap.\n\nHere’s how the Claude Code team thinks about verification:\nhttps://t.co/kPeRO0eCkJ", "createdAt": "Mon Nov 16 22:31:41 +0000 2026", "replyCount": 343, "retweetCount": 823, "likeCount": 13911, "conversationId": "2122457608963395586", "author": {"username": "ClaudeDevs", "name": "ClaudeDevs", "profileImageUrl": "https://pbs.twimg.com/profile_images/2044472418815893504/xf14RxM8_normal.png"}, "authorId": "2024518793679294464", "translationZh": "能验证自己的工作成果时，Claude 就能写出更好的代码。过去成本高昂的测试、基准测试和端到端运行，如今都已变得低成本。\n\nClaude Code 团队是这样看待验证的：\nhttps://t.co/kPeRO0eCkJ"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXSRJe_bQAAfGdi.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXSRJe_bQAAfGdi.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-17T00:04:22+00:00", "createdAtBeijing": "2026-11-17T08:04:22+08:00", "createdAtLocal": "11-17 08:04 北京", "url": "https://x.com/shao__meng/status/2122480930439016820", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2122480930439016820", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent 交付验证与审查规则治理", "evidence": "审查也针对固定提交", "rationale": "提供验证流程、规则隔离及误报治理方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122507586541166850", "track": "research", "source": {"id": "2122507586541166850", "text": "微软研究院开源 TokenEconomizer：不改模型，从仓库经验里给 Coding Agent 省 token\n\n@MSFTResearch 研究并开源了一套外部控制器「TokenEconomizer」：不改 Coding Agent 和底层模型，从同一仓库的历史会话里学习，减少重复摸索和无效调用。\n\n博客地址：https://t.co/52tQqqnO9j\n开源地址：https://t.co/8ASN2BSyfV\n\n# 浪费主要出在反复从零开始\n\n开发者常在同一仓库多次调用 Coding Agent，但 Agent 往往每次重新摸索测试命令、加载用不到的工具，并在失败路径上打转。团队对 Claude Code 在 SWE-Bench 上 60 个任务的剖析显示：同一仓库累计至少 5 个任务后，约 30% 的工具调用在重复更早任务；跨仓库对照只有约 7%。每轮会加载 23 个工具说明，其中 16 个从未被调用。失败任务只占 17%，却占支出约 32%。固定的省钱插件在有的仓库能省，在有的仓库反而更贵，说明控制策略需要按仓库适应。\n\n# 三种机制都作用在 Agent 外围\n\nTokenEconomizer 由加州大学伯克利分校、微软研究院和 Microsoft Security 开源。它读取会话日志、更新仓库状态，再通过已有接口起作用：把微技能写入起始上下文、裁剪工具列表，并在卡住时干预。控制器自己的模型调用也计入成本。\n\n微技能从多轮轨迹里提炼一行级的仓库操作知识，例如在 SymPy 中直接用原生测试，而不必先找 pytest。这类知识要在多项任务、且改动文件不重叠的情况下被确认后才会注入；出现矛盾证据则永久退役。\n\n工具裁剪会去掉长期不用的工具，同时保留核心的命令行和文件读写，并定期全量回放，以免误删。文中 Django 的例子显示，首次请求的提示 token 可从约 4.2 万至 4.6 万降到约 1.5 万至 1.6 万。\n\n卡住时的干预则根据历史成功轮次设置预算。论文实验里，判定卡住后可先改方向，二次卡住后终止任务；开源插件在二次卡住后是提醒开发者，不会自行停掉任务。\n\n# 省钱随经验积累，成功率大体稳住\n\n在 SWE-Bench 的 277 个任务、6 个仓库、5 组 Agent 与模型组合上，相对默认的较强推理设置，平均费用下降 18.4% 至 30.9%，30 个「仓库×组合」全部变便宜。一次尝试成功率（Pass@1）有四组上升，Opus 4.8 仅下降约 1.0 个百分点。如果只是调低推理强度，也能省钱，但成功率会下降 1.8 至 10.3 个百分点。\n\n节省是逐渐显现的：多数仓库前几项任务可能更贵，到第 6 个任务起，累计费用才转便宜。拆开来看，工具裁剪贡献最大，微技能次之，卡住干预更小。Web-Bench 上费用约降 16.0% 至 21.2%；跨新仓库的安全审计约降 6.4% 至 19.6%。没有仓库连续性时，微技能会被关掉。", "createdAt": "Tue Nov 17 01:50:17 +0000 2026", "replyCount": 13, "retweetCount": 1, "likeCount": 10, "conversationId": "2122507586541166850", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122435510463242401", "text": "AI coding agents can waste time and tokens relearning the same lessons. TokenEconomizer builds on past sessions to cut costs while maintaining task success. It’s a path toward coding agents that learn not only how to solve tasks, but also how to spend computation more effectively. \n\nThe open-source plugin is available now on @github. https://t.co/52jMrEw11J", "createdAt": "Mon Nov 16 21:03:53 +0000 2026", "replyCount": 37, "retweetCount": 85, "likeCount": 852, "conversationId": "2122435510463242401", "author": {"username": "MSFTResearch", "name": "Microsoft Research", "profileImageUrl": "https://pbs.twimg.com/profile_images/1603123064140890112/bSq-JVnp_normal.png"}, "authorId": "21457289", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXRn103WMAA7143.png", "width": 720, "height": 377, "previewUrl": "https://pbs.twimg.com/media/HXRn103WMAA7143.png:small", "videoUrl": "https://video.twimg.com/amplify_video/2122435475117871106/vid/avc1/1200x628/tiCWqAO7D3gCSIl9.mp4?tag=16", "durationMs": 8033}], "translationZh": "AI 编程智能体可能会浪费时间和 token，反复学习同样的经验。TokenEconomizer 利用历史会话，在保持任务成功率的同时降低成本。这为编程智能体指明了一个方向：不仅学会如何完成任务，也学会如何更有效地使用算力。\n\n这款开源插件现已在 @github 上发布。https://t.co/52jMrEw11J"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXSpYiWbIAAbwNi.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXSpYiWbIAAbwNi.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-17T01:50:17+00:00", "createdAtBeijing": "2026-11-17T09:50:17+08:00", "createdAtLocal": "11-17 09:50 北京", "url": "https://x.com/shao__meng/status/2122507586541166850", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2122507586541166850", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "TokenEconomizer 仓库经验降本研究", "evidence": "平均费用下降 18.4% 至 30.9%", "rationale": "有开源控制器、机制拆解和量化实验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122673947409858730", "track": "agent", "source": {"id": "2122673947409858730", "text": "Our PyBot chatbot went viral yesterday but the story behind it is even more interesting imo: what happened when we decided to run 1,000 agents (!) together\n\nWe wanted to see if agent swarms could be scaled outside of closed-lab setups and to investigate it in a more transparent and reproducible manner.\n\nTo explore the question, we built a rather fun and simple benchmark: ELIZA-2026. Full circle in AI time. The agents are tasked to build a chatbot made of if-then rules like ELIZA, but said agents are 2026 frontier open-source models. By design it’s almost embarrassingly parallel, which keeps the coordination problem as simple as it gets.\n\nFirst surprise: it turns out you can scale a swarm of DeepSeek V4.1 Flash agents on a relatively small setup: a couple of GPU nodes (B200 in our case) are enough to scale to over 1,000 agents.\n\nOur second surprise was how bottlenecks started to emerge everywhere except in the GPUs.\n\nAgents quickly end up spending their time waiting for git merges (we had to move to a centralized merge setup, like Anthropic did), waiting for tests to pass, re-reading context from other agents and tools (we estimated ~130 tokens read for every token written per agent). In some of our runs, at any given moment, only 40-60 of the 1,000 agents were actually calling the model.\n\nOnce (some of) these issues were solved, we hit the harder part: coordination itself.\n\nFred Brooks once said at IBM “adding manpower to a late software project only makes it later”. Communication costs naturally grow with n² in an organization (that’s why small startups move faster :).\n\nWe explored various ways of organizing the swarm, setting up dedicated channels (a stewards channel, a leadership channel) and giving agents specific roles (a moonshot agent to fight groupthink). It helped, up to a point. But the quality of coordination itself remains hard to measure.\n\nAlong the way, we saw good and bad emergent behaviors. Some good, with agents stepping in, unprompted, to protect other agents’ running experiments. Some bad, with agents gaming the rules when stuck, from hammering a rate limit to probing the infrastructure around them.\n\nIn the coming days we will open-source the swarm tooling (flock + msgboard) and share our learnings in more detail.\n\nOverall this was one of the most fun experiments of the fall, and multi-agent systems increasingly look like the next phase for AI. But I also came out of this project with the feeling that several bottlenecks in scaling AI are moving from intelligence to coordination and the supporting infrastructure.\n\nLuckily this seems to be in large part an engineering problem.", "createdAt": "Tue Nov 17 12:51:21 +0000 2026", "replyCount": 45, "retweetCount": 21, "likeCount": 131, "conversationId": "2122673947409858730", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "quotedTweet": {"id": "2122335119750975925", "text": "PyBot: No weights. No training.\n\nA chatbot built with only simple rules and no AI, entirely written in 600k lines of Python code. PyBot matches Smollm with 360M parameters!\n\nHow? A swarm of 1,000 DeepSeek Flash agents wrote the whole code in just a week.\n\nhttps://t.co/Du5GVvvLb5 https://t.co/dtL78EtdPC", "createdAt": "Mon Nov 16 14:24:58 +0000 2026", "replyCount": 90, "retweetCount": 305, "likeCount": 2567, "conversationId": "2122335119750975925", "author": {"username": "lvwerra", "name": "Leandro von Werra", "profileImageUrl": "https://pbs.twimg.com/profile_images/1664932984196145153/UDYifACN_normal.jpg"}, "authorId": "1105171148382326789", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122329989467000832/img/G0dP2K9dOh7_gh6L.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122329989467000832/img/G0dP2K9dOh7_gh6L.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122329989467000832/vid/avc1/1920x1080/T0BD7hIqYIzwPJHL.mp4?tag=29", "durationMs": 101517}], "translationZh": "PyBot：无需权重，无需训练。\n\n一个仅靠简单规则、不使用 AI 的聊天机器人，完全由 60 万行 Python 代码构成。PyBot 的表现可媲美拥有 3.6 亿参数的 Smollm！\n\n怎么做到的？由 1,000 个 DeepSeek Flash 智能体组成的集群，仅用一周就写完了全部代码。\n\nhttps://t.co/Du5GVvvLb5 https://t.co/dtL78EtdPC"}, "expert": {"priority": "P0", "domain": "开源模型 / Hugging Face", "name": "Thomas Wolf", "role": "Hugging Face / 联合创始人兼 CSO", "why": "Transformers 生态和开源模型讨论的重要人物", "handle": "Thom_Wolf"}, "createdAtIso": "2026-11-17T12:51:21+00:00", "createdAtBeijing": "2026-11-17T20:51:21+08:00", "createdAtLocal": "11-17 20:51 北京", "url": "https://x.com/Thom_Wolf/status/2122673947409858730", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2122673947409858730", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "千智能体编程实验与协调瓶颈复盘", "evidence": "only 40-60 of the 1,000 agents", "rationale": "自述提供实验设计、资源用量及协调故障细节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们的 PyBot 聊天机器人昨天火了，但我觉得背后的故事更有意思：当我们决定让 1,000 个智能体（！）一起运行时，发生了什么？\n\n我们想看看，智能体集群能否在封闭实验室之外实现规模化，并以更透明、可复现的方式开展研究。\n\n为此，我们设计了一个有趣又简单的基准测试：ELIZA-2026。AI 发展至今，仿佛又回到了起点。任务是让智能体构建一个像 ELIZA 那样、由 if-then 规则组成的聊天机器人，而执行任务的是 2026 年的前沿开源模型。这个任务在设计上几乎可以完全并行处理，因此协调问题被简化到了极致。\n\n第一个意外发现是：只需相对精简的硬件配置，就能扩展 DeepSeek V4.1 Flash 智能体集群。几个 GPU 节点（我们用的是 B200）就足以支撑超过 1,000 个智能体。\n\n第二个意外发现是，瓶颈开始出现在 GPU 之外的各个环节。\n\n智能体很快就把时间花在了等待 git 合并、等待测试通过，以及反复读取其他智能体和工具提供的上下文上。我们不得不像 Anthropic 一样改用集中式合并机制。据估算，每个智能体每写入 1 个 token，就要读取约 130 个 token。在部分运行中，任意时刻真正调用模型的智能体只有 40 至 60 个，总数却有 1,000 个。\n\n解决了其中一些问题后，我们遇到了更难的部分：协调本身。\n\nFred Brooks 在 IBM 时曾说：“给延期的软件项目增加人手，只会让它更晚交付。”组织中的沟通成本自然会随人数的平方增长，这也是小型初创公司行动更快的原因 :)\n\n我们探索了多种集群组织方式，设立专门频道（如协调员频道、领导层频道），并为智能体分配特定角色（例如，安排一个大胆探索的智能体来打破群体思维）。这些做法起到了一定作用，但协调本身的质量仍然难以衡量。\n\n过程中，我们观察到了好坏两类自发行为。好的方面，有些智能体会主动介入，保护其他智能体正在运行的实验。坏的方面，有些智能体遇到困难时会钻规则的空子，从反复冲击请求频率限制，到探查周边基础设施。\n\n未来几天，我们将开源集群工具（flock + msgboard），并更详细地分享经验。\n\n总的来说，这是今年秋天最有趣的实验之一，多智能体系统也越来越像是 AI 的下一阶段。但这个项目也让我感到，AI 规模化过程中的一些瓶颈，正从智能水平转向协调能力和配套基础设施。\n\n好在，这在很大程度上似乎是个工程问题。"}, "avatar": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, {"id": "2122488136269738343", "track": "research", "source": {"id": "2122488136269738343", "text": "一群 Agent 一起干活，结果还不如一个 Agent 单独协调？\n\n推荐阅读 Anthropic 新发布的《Worse Together》，专门研究多个用户各自带着 Agent，共享资源时会发生什么。\n\n研究者设计了四类场景，包括共享 Token 预算、医院预约、集体订餐和代码合并。在测试的两款 Claude 模型上，多 Agent 团队的整体表现全部落后于单个协调 Agent。\n\n在集体订餐这个实验中，用户明确提出了无麸质需求。虽然 94%～99% 的情况下，消息已经发给负责下单的 Agent，但真正提交订单时，只有 47%～67% 的情况下，这条信息进入了它的 Context。\n\n很多失败就发生在这种消息同步问题上。\n\n作者后来加了一条简单的 Harness 约束：下单前必须读完所有待处理消息，结果挽回了 62%～73% 的失败案例。\n\n还有个挺值得思考的发现。部分 Agent 会擅自取消其他用户的任务，反而让整体评分更高，暴露了现有 Eval 对协作行为的盲区。\n\n这项研究是非常有价值的。之后多个 Agent 共同工作越来越普遍，消息同步、共享资源管理、权限边界这些问题，都值得单独研究和评测。\n\n作者还开源了 MAMUBench，包含 74 个多用户协作测试场景。做 Multi-Agent 和 Agent Eval 的朋友很推荐阅读和收藏！\n\n文章：https://t.co/Wz8qGAFkHM\n\nGitHub：https://t.co/li1YJJV0dO", "createdAt": "Tue Nov 17 00:33:00 +0000 2026", "replyCount": 17, "retweetCount": 13, "likeCount": 72, "conversationId": "2122488136269738343", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQNmvPXMAAZIDy.jpg", "width": 1236, "height": 1107, "previewUrl": "https://pbs.twimg.com/media/HXQNmvPXMAAZIDy.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-17T00:33:00+00:00", "createdAtBeijing": "2026-11-17T08:33:00+08:00", "createdAtLocal": "11-17 08:33 北京", "url": "https://x.com/Xudong07452910/status/2122488136269738343", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2122488136269738343", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "多用户Agent协作失败研究", "evidence": "下单前必须读完所有待处理消息", "rationale": "转述协作实验、失败比例与修复约束，附基准"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122486376981795286", "track": "agent", "source": {"id": "2122486376981795286", "text": "Together 团队分享 Agent 评测实践：失败的不只是模型，还有文档和 Skills\n\n@togethercompute 团队 @nutlope 分享了团队里的实际做法：用 Coding Agent 测试自家 SDK、命令行和文档，再根据失败记录改产品。\n\nhttps://t.co/twv0g8DM5W\n\n# 评测的对象，是 Agent 使用产品的全过程\n\n团队把真实开发需求写成任务，例如查询 GPU 集群的可用区域、找到最便宜机型，再生成预订命令，但明确禁止真正下单。\n\n同一任务比较三种配置：只给提示词、接入文档 MCP，以及提供 Skills。Agent 在沙箱里运行，由 GitHub Actions 编排，同时记录 API 调用，再由模型裁判判断通过、未完成或失败。\n\n他们不仅看失败记录，也复查成功轨迹：最终做成了，不代表文档清楚、路径合理，Agent 可能只是反复绕路后碰巧完成。\n\n# 两句话，能比换模型更值得先做\n\n早期一项 GPU 集群任务中，Sonnet 4.6 即使使用 Skills，也只成功了 15 次中的 4 次；同配置下，Opus 4.8 成功了 14 次中的 13 次。\n\n原因不全在模型：Agent 把命令行示例输出当成实时库存，Skill 又把它引向营销页，而非价格表。团队补充两句话，明确指向实时区域接口和价格表后，该任务在 Skills 配置下对所测模型全部通过。\n\n评测还发现，错误信息指向不存在的接口，以及重试请求异常返回 404。只测最强模型，反而可能掩盖这些产品问题。\n\n# Skills 整合，也可能越改越差\n\n团队将 14 个分散的 Skill 合并为统一入口，首次结果却退步：72 次运行仅通过 54 次，未完成次数从 7 次升至 18 次，单次费用翻倍。\n\n压缩入口说明、更新过时模型并修复示例后，72 次运行通过 70 次，约为 97.2%；平均耗时下降约 20%，费用回到原先水平。\n\n这说明，统一入口并不天然降低使用难度。Agent 能否找到正确说明、示例是否有效，都需要实际运行验证。", "createdAt": "Tue Nov 17 00:26:00 +0000 2026", "replyCount": 4, "retweetCount": 3, "likeCount": 19, "conversationId": "2122486376981795286", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122378712649748694", "text": "How we do agent evals at Together", "createdAt": "Mon Nov 16 17:18:11 +0000 2026", "replyCount": 13, "retweetCount": 38, "likeCount": 429, "conversationId": "2122378712649748694", "author": {"username": "nutlope", "name": "Hassan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1727415759859552256/9rqaxXUR_normal.jpg"}, "authorId": "3246815913", "article": {"title": "How we do agent evals at Together", "previewText": "TLDR: I go over how we made Together easier for agents to use, improving agent task success rates from 67% to 96% by building our own agent evals. We'll walk through how we built the evals & how you", "titleZh": "我们在 Together 如何开展智能体评测", "previewTextZh": "概要：我会介绍我们如何通过自建智能体评测，让 Together 更易于智能体使用，将任务成功率从 67% 提升到 96%。我们将逐步讲解评测的构建过程，以及你如何……"}, "translationZh": "我们在 Together 如何开展智能体评测"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXSWGegbAAAfovK.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXSWGegbAAAfovK.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-17T00:26:00+00:00", "createdAtBeijing": "2026-11-17T08:26:00+08:00", "createdAtLocal": "11-17 08:26 北京", "url": "https://x.com/shao__meng/status/2122486376981795286", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2122486376981795286", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Together Agent 产品评测复盘", "evidence": "72 次运行通过 70 次", "rationale": "展示文档和 Skills 缺陷及修复评测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122530748213411950", "track": "agent", "source": {"id": "2122530748213411950", "text": "Simon Willison 介绍外部沙箱：Agent 留在 Mac 上，命令进入隔离环境\n\nSimon Willison 在「External sandboxes for coding agents」中分享：让 Claude Code、Codex 或 Pi 继续在本机上运行，但它们要执行的代码进入由 WebAssembly、QEMU 或 Apple Container 搭建的隔离 Linux 环境。\n\nhttps://t.co/Qohv2E7FNC\n\n# 沙箱在 Agent 之外，不必把 Agent 一起关进去\n\n他们比较过两种办法：一种是把 Agent 放进沙箱里跑，例如 Fly 的 Sprites；另一种是让 Agent 留在外面，只把命令送到独立沙箱。他们选择后者，以免 Agent 改动自身或所在环境，也让边界更容易审查。这里所说的「外部」，是相对于 Agent，不是相对于电脑，二者可以同在一台 Mac 上。\n\n这样做的动机也很直接：Coding Agent 会出错，凡是它能读能改的内容都可能被破坏或泄露。逐条人工批准既慢，也容易让人习惯性同意。Claude Code 的自动模式和 Codex 的自动审查，会再用模型判断是否继续，这仍然取决于模型判断是否正确。沙箱则是一套不依赖模型判断的保护，对更便宜、可本地运行、也更容易出错和遭受提示注入的小模型尤其重要。\n\n# 三种实现共用协议，但各家接入深度不同\n\n团队开源了三套 Apache-2.0 许可的原型：用 Node.js 在 WebAssembly 里模拟 Alpine Linux 的 v86，默认端口 8686，需要 Node.js 22.19 或更新版本；封装 Apple Containers 的实现走 8687；搭配 QEMU 的 Microsoft Quicksand 走 8688。后两者需要 Apple 芯片的 Mac。\n\n接入程度并不相同。Codex 会把进程和文件系统操作，包括应用补丁，送到沙箱；团队自报自动化测试通过了 Codex CLI 0.164.0，但用的是模拟模型，且该执行协议仍属实验性质。Pi 1.5 及以上可通过扩展替换命令行、读写和搜索等工具；若扩展未能加载，内置工具会被关闭，而不是退回本机执行。Claude Code 则只有 Bash 进入沙箱，原生的读取和编辑仍在本机直接进行，这是文中明确写出的限制。\n\n默认没有外网。加上代理后，可按主机和 HTTP 方法放行，并做凭证替换：沙箱里只有占位符，真正的密钥留在主机代理中，对 Agent 不可见。作者提醒，若放行的服务在响应里回显密钥，仍可能泄露，因此只应用于受信任、范围收窄的接口。网页界面可改规则，并查看放行或拒绝记录。", "createdAt": "Tue Nov 17 03:22:19 +0000 2026", "replyCount": 10, "retweetCount": 0, "likeCount": 7, "conversationId": "2122530748213411950", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122500307557265651", "text": "I've been exploring new ways to sandbox code written by coding agents - here's a description of the external sandbox pattern, where agents run on your Mac but execute code in a WebAssembly or QEMU or Apple Container sandbox - with demos for Claude Code, Codex and Pi https://t.co/0XIhs4XYvQ", "createdAt": "Tue Nov 17 01:21:22 +0000 2026", "replyCount": 342, "retweetCount": 94, "likeCount": 1106, "conversationId": "2122500307557265651", "author": {"username": "simonw", "name": "Simon Willison", "profileImageUrl": "https://pbs.twimg.com/profile_images/378800000261649705/be9cc55e64014e6d7663c50d7cb9fc75_normal.jpeg"}, "authorId": "12497", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXSiyAmbIAAgeUI.jpg", "width": 1200, "height": 732, "previewUrl": "https://pbs.twimg.com/media/HXSiyAmbIAAgeUI.jpg:small"}], "translationZh": "我一直在探索如何以新的方式，在沙箱中运行编程智能体编写的代码。这里介绍一种外部沙箱模式：智能体在你的 Mac 上运行，代码则在 WebAssembly、QEMU 或 Apple Container 沙箱中执行，并附有 Claude Code、Codex 和 Pi 的演示。https://t.co/0XIhs4XYvQ"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXS-dWSaEAAUQ6a.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXS-dWSaEAAUQ6a.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-17T03:22:19+00:00", "createdAtBeijing": "2026-11-17T11:22:19+08:00", "createdAtLocal": "11-17 11:22 北京", "url": "https://x.com/shao__meng/status/2122530748213411950", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2122530748213411950", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Coding Agent 外部沙箱方案", "evidence": "只有 Bash 进入沙箱", "rationale": "介绍三种开源实现及隔离边界与限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122755808689549335", "track": "research", "source": {"id": "2122755808689549335", "text": "OpenAI 发布 GPT-6.2 Astra 和 Sol：Plus 及以上订阅直接能用，Astra API 降价 20%\n\nOpenAI 11 月 17 日发布 GPT-6.2 的两款模型。Astra 是它最强的旗舰，接替 GPT-6 Astra，主要拿来和 Anthropic 的 Claude Fable 5.2 比；Sol 是日常干活的主力，接替 GPT-6.1 Sol。中间档的 GPT-6.1 Terra 和最便宜的 GPT-6 Luna 这次没更新。\n\nOpenAI 这次主打同样的活用更少的 Token：订阅额度更耐用，API 每个任务花得更少。\n\n【我能不能用，要不要另付钱】\n\n不用另付钱。OpenAI 博客说，Plus、Pro、企业版和教育版用户从今天起就能在 ChatGPT Work 和 Codex 里选这两个模型，帮助文档的名单里还多了 Business。普通聊天界面里没有，要进 Work 用；企业版和教育版要管理员先打开。\n\n额度比上一代略宽。按 OpenAI 文档的估算，Plus 用户每 5 小时大约能给 Astra 发 6 到 50 条消息（GPT-6 Astra 是 5 到 45 条），Sol 是 17 到 180 条（GPT-6.1 Sol 是 15 到 160 条）。Pro 目前没有 5 小时限制。\n\n放到三家一起看：Claude Fable 5.2 在 Claude 的 Pro 套餐里要按量另付费，Max、Ultra 这些更贵的套餐才含在额度里；Gemini 4 Carbon 在 Gemini App 里只给每月 99.99 美元起的 Ultra 用户。每月 20 美元的 Plus 就能用 OpenAI 的旗舰，是三家里门槛最低的。\n\n嫌慢可以开 Ultrafast 模式。官方文档说它的生成速度最高是标准模式的 4.5 倍，但要消耗 6 倍额度。每月 500 美元的 Pro 两个模型都能开，200 美元的 Pro 目前只能在 Sol 上开。\n\n【API 多少钱】\n\nAstra 每百万 Token 输入 8 美元、输出 40 美元，比 GPT-6 Astra 的 10 美元和 50 美元便宜 20%；缓存命中的输入从 1 美元降到 0.4 美元。Sol 维持 GPT-6.1 Sol 的 2 美元和 10 美元。\n\n单价上，Astra 和 Fable 5.2 一样，是 Claude Opus 5.5（4 美元和 20 美元）的两倍；Sol 和 Gemini 4 Carbon 现在的引入价持平，Carbon 12 月 1 日起涨到 4 美元和 20 美元。\n\n【比上一代和对手强在哪】\n\n最有代表性的是 Agents' Last Exam，测多步骤的职业工作。OpenAI 说 Astra 比 GPT-6 Astra 高 5.2 分，花费不到三分之一；比 Fable 5.2 高 5.5 分，花费只有 5%。两者单价相同，这个差距主要来自 Astra 完成任务用的 Token 少得多。\n\nOpenAI 还说 Astra 是“对科学家来说全世界最好的模型”：在终端里做科研任务的测试 Terminal-Bench-Science 上，它比 GPT-6 Astra 高 9 个百分点，花费不到三分之一。\n\n法律测试 Harvey LAB-AA 上，Astra 的通过率是 Fable 5.2 的两倍多，花费约六分之一。Artificial Analysis 组织的 3D 网页盲测里，Astra 以 1318 分排第一，Fable 5.2 是 1271 分，Sol 是 1259 分。\n\n做幻灯片是这次的重点：给 Astra 一份模板文件，甚至只给一张截图，它能照着原来的排版、配色、字号做新页面。\n\nSol 的卖点是性价比。在 Cognition 的写代码测试 FrontierCode 2.0 里，Sol 只比 Astra 低 0.5 分，花费约五分之一。在日常任务测试 LifeVal 上（比如搬家后筛幼儿园、按预算和通勤找房子），Sol 的分数超过 GPT-6 Astra，花费约七分之一。\n\n【安全上的变化】\n\nOpenAI 说这两款的网络安全能力达到它风险评估框架里最高的 Critical 档，所以上了更严的防护，代价是一部分正当的漏洞研究和安全测试也会被拒。经过审核的安全人员目前只能在 Daybreak 计划里用 GPT-6 系列的放宽版本，OpenAI 说会把 6.2 也加进去。\n\n用 Codex 的人要留意一个问题：在两项测试里，这两款模型比 GPT-6 Astra 更容易不提它被什么卡住了，比如要改的文件不见了、搜索工具用不了。OpenAI 说已经在 Codex 里加了指令，大幅减少这种情况，还在继续查原因。\n\n文中跑分都出自 OpenAI 的发布博客。其中 Fable 5.2 的 Agents' Last Exam 成绩去掉了 9 道用了备用模型的题；Terminal-Bench-Science 上，OpenAI 引用的是第三方测试框架里的 Fable 成绩，Anthropic 自己在 Claude Code 里测的是 74.6%。截至发稿，Artificial Analysis 官网榜单还没列出 GPT-6.2。\n\n原文：https://t.co/81ZFwwB0Uo", "createdAt": "Tue Nov 17 18:16:38 +0000 2026", "replyCount": 36, "retweetCount": 5, "likeCount": 98, "conversationId": "2122755808689549335", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2122750124543926515", "text": "Some of you have been asking very politely. Some of you have just been asking.\n\nGPT-6.2 Astra and Sol are now available.\n\nSuper efficient and built to perform where it counts—the real world.\n\nhttps://t.co/qr2iP0GpfX https://t.co/jLCyVIws2Y", "createdAt": "Tue Nov 17 17:54:03 +0000 2026", "replyCount": 1676, "retweetCount": 2838, "likeCount": 27436, "conversationId": "2122750124543926515", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122746240823943168/img/osC4AgQC_BfZl2EH.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122746240823943168/img/osC4AgQC_BfZl2EH.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122746240823943168/vid/avc1/1920x1080/u9FA7vr_eObv2kjx.mp4?tag=29", "durationMs": 118660}], "translationZh": "有些人一直很客气地催更，也有些人就是一直催。\n\nGPT-6.2 Astra 和 Sol 现已上线。\n\n高效出众，专为在真正重要的现实场景中发挥实力而打造。\n\nhttps://t.co/qr2iP0GpfX https://t.co/jLCyVIws2Y"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122755647766753280/img/pI_QucPpfAYuaSB4.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122755647766753280/img/pI_QucPpfAYuaSB4.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122755647766753280/vid/avc1/1920x1080/GGP6_VTBTyDVafsO.mp4?tag=29", "durationMs": 118633}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-17T18:16:38+00:00", "createdAtBeijing": "2026-11-18T02:16:38+08:00", "createdAtLocal": "11-18 02:16 北京", "url": "https://x.com/dotey/status/2122755808689549335", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2122755808689549335", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "GPT-6.2价格、能力与使用限制解读", "evidence": "Astra 每百万 Token 输入 8 美元、输出 40 美元", "rationale": "详列价格、评测与限制，并标注厂商数据边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2122533686541439161", "track": "agent", "source": {"id": "2122533686541439161", "text": "六套 Agent Harness 的整体评测，第一名和第二名只差 0.3 个百分点。可一旦按底层模型拆开，几乎每个模型的第一名都不一样\n\nEvoMap 的新论文《EvoX》讨论的就是这件事：Harness 和模型合不合得来，可能比 Harness 的整体排名更重要。\n\n论文提出「The Second Policy」，把 Harness 看成 Agent 的第二套策略。模型负责理解任务、规划行动，Harness 负责把决策落地，包括修正工具调用、执行中断后接着跑、核验结果是否真的完成。\n\n团队用自建的评测框架 Contrast，在 6 个模型、6 种 Harness、5 个 Benchmark 上统一测了一遍。整体成功率 EvoX 56.2%，Pi 55.9%，几乎打平。\n\n拆到单个模型就很分散了。Opus 5 上 Claude Code 第一，GPT-6 Astra 上 Codex 第一，Sonnet 5 上 Pi 第一，DeepSeek 上 Hermes 第一。EvoX 在 GLM-5.3 和 Kimi K3 上领先最明显，比其他五种 Harness 的平均值分别高 10.7 和 7.9 个百分点。\n\n对于 Harness Engineering 来说，关注模型与运行时策略之间的适配是非常重要的。\n\n单独评估模型或 Harness 的平均表现，可能都会遗漏重要信息。真正值得研究的是，不同模型究竟需要什么样的执行策略，以及能否根据模型特性动态调整 Harness。\n\n📎 arXiv: https://t.co/Nm9cQ91yUJ", "createdAt": "Tue Nov 17 03:34:00 +0000 2026", "replyCount": 10, "retweetCount": 8, "likeCount": 56, "conversationId": "2122533686541439161", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQWO7OXsAETmCK.jpg", "width": 1110, "height": 1056, "previewUrl": "https://pbs.twimg.com/media/HXQWO7OXsAETmCK.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-17T03:34:00+00:00", "createdAtBeijing": "2026-11-17T11:34:00+08:00", "createdAtLocal": "11-17 11:34 北京", "url": "https://x.com/Xudong07452910/status/2122533686541439161", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2122533686541439161", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "EvoX 研究模型与 Harness 的适配差异", "evidence": "整体成功率 EvoX 56.2%，Pi 55.9%", "rationale": "提供评测规模、成功率及模型差异，属于具体研究成果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122492826172952734", "track": "tools", "source": {"id": "2122492826172952734", "text": "We launched ParseBench-2 last week as a comprehensive benchmark to evaluate all dimensions of document parsing: reading order, formatting, tables, charts, forms, and visual grounding.\n\nWhile we strive to create some standardization, it's very clear that not everyone weights the same errors equally:\n- If you're dealing with backoffice paperwork, you probably don't care about charts, and mostly care about tables and forms\n- If you're not dealing with legal documents, you likely don't care about precise formatting.\n\nAlso, you may care about different severities differently. By default we penalize \"severe\" errors by 10 points out of 100, but for instance if getting dollar values wrong is catastrophic, you can turn the slider way up. \n\nIntroducing the ParseBench-2 Metric Lab: it's a simple interface where you can define how much you care about different evaluation metrics, and how you weigh different severities. Once you've settled on a dimension, you can export the policy JSON, so that you can use it on evaluations over your own documents! \n\nCome check the Metric Lab out: https://t.co/MI8CyrGZhy\n\nFor more information on the benchmark itself and overall methodology, come check it out here: https://t.co/xtgxfln8Wc", "createdAt": "Tue Nov 17 00:51:38 +0000 2026", "replyCount": 8, "retweetCount": 3, "likeCount": 26, "conversationId": "2122492826172952734", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2122422794361377268", "text": "The best parser depends on your documents.\n\nA team parsing insurance claim forms and a team parsing earnings decks need different things. One relies on forms and tables, while the other relies on charts.\n\nMetric Lab in ParseBench lets you rank parsers by what matters to your team:\n\n→ Weight the categories you care about: tables, charts, forms, text\n\n→ Set how much a critical, major or minor error costs\n\n→ Watch all 19 parsers re-rank live in your browser\n\nStart from a default profile or build your own.", "createdAt": "Mon Nov 16 20:13:21 +0000 2026", "replyCount": 8, "retweetCount": 4, "likeCount": 15, "conversationId": "2122422794361377268", "author": {"username": "llama_index", "name": "LlamaIndex 🦙", "profileImageUrl": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, "authorId": "1604278358296055808", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122421762566823938/img/emIITnSb8Y16XbYe.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122421762566823938/img/emIITnSb8Y16XbYe.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122421762566823938/vid/avc1/3840x2160/XPHbye7yTrFQKIhI.mp4?tag=29", "durationMs": 98000}], "translationZh": "最适合你的解析器，取决于你的文档。\n\n解析保险理赔表单的团队，与解析财报演示文稿的团队，需求并不相同。前者依赖表单和表格，后者则依赖图表。\n\nParseBench 中的 Metric Lab 可以根据团队关注的重点，为解析器排名：\n\n→ 为你关心的类别设置权重：表格、图表、表单、文本\n\n→ 设置致命、重大或轻微错误的扣分幅度\n\n→ 在浏览器中实时查看全部 19 款解析器的排名变化\n\n你可以从默认配置开始，也可以自行创建配置。"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122492725421600768/img/7w_z12VisLQHvLQH.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122492725421600768/img/7w_z12VisLQHvLQH.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122492725421600768/vid/avc1/1920x1080/POnc39LT89Rg_V3B.mp4?tag=29", "durationMs": 98048}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-17T00:51:38+00:00", "createdAtBeijing": "2026-11-17T08:51:38+08:00", "createdAtLocal": "11-17 08:51 北京", "url": "https://x.com/jerryjliu0/status/2122492826172952734", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2122492826172952734", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "ParseBench-2 Metric Lab发布", "evidence": "export the policy JSON", "rationale": "发布可调整解析评测权重并导出策略的工具"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "上周，我们推出了 ParseBench-2，这是一套全面评估文档解析各个维度的基准，涵盖阅读顺序、格式、表格、图表、表单和视觉定位。\n\n虽然我们希望建立一定的统一标准，但显然，不同人对同类错误的重视程度并不相同：\n- 如果你处理的是后台事务文书，可能不太关心图表，而更关注表格和表单。\n- 如果你不处理法律文件，可能就不太在意格式是否完全精确。\n\n此外，你对不同严重程度错误的容忍度也可能不同。默认情况下，我们会对“严重”错误扣除 100 分中的 10 分。但如果金额出错会造成灾难性后果，你就可以大幅调高对应滑块。\n\n现在推出 ParseBench-2 Metric Lab：通过这个简单的界面，你可以设置不同评估指标的重要性，以及不同错误严重程度的权重。确定各项设置后，即可导出策略 JSON，用于评估你自己的文档！\n\n来试试 Metric Lab：https://t.co/MI8CyrGZhy\n\n有关基准本身和整体方法的更多信息，请查看：https://t.co/xtgxfln8Wc"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2122757020801814613", "track": "research", "source": {"id": "2122757020801814613", "text": "One of the hardest parts about building any benchmark that measures high-dimensional output is making it granular, while also being aligned with human preferences. This especially holds true for document parsing.\n\nGranularity is helpful because it lets you more precisely encode human preferences. Within document parsing, there are many categories of errors across various document dimensions: chart errors, table errors, form errors, layout errors, and more.\n\nGranularity also enables customization - it lets you better choose the dimensions you care about the most and weigh them more heavily.\n\nYou can have a granular benchmark using either deterministic metrics or LLM as a judge; they’re not mutually exclusive:\n1️⃣ Deterministic: ParseBench-2 splits parsing into 6 dimensions and 330 test scenarios. Each dimension is weighed by human-defined severity (a wrong digit should cost 10+ pts, extra HTML markup costs 0).\n2️⃣ LLM as a judge: You can also define granular metrics where each one is measured by LLM as a judge. Our Document Parsing Protocol (DPP) has a comprehensive taxonomy of 140 rules / 516 written checks, each codified by a judge prompt!\n\nBuilding a benchmark that is granular but aligned is challenging. There’s no free lunch; neither ParseBench-2 nor DPP are ‘perfect’, but they do make an honest effort in advancing every criteria.\n\nWe’re shipping a lot more iterations here. Keep your eyes peeled!\n\nParseBench-2: https://t.co/PWczfhp0OX\nDocument Parsing Protocol: https://t.co/UQ4PeskH78", "createdAt": "Tue Nov 17 18:21:27 +0000 2026", "replyCount": 9, "retweetCount": 2, "likeCount": 22, "conversationId": "2122757020801814613", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122756863712428032/img/pUWRdUFwUPF9kiPn.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122756863712428032/img/pUWRdUFwUPF9kiPn.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122756863712428032/vid/avc1/1920x1080/XhPUVU1jLnaHKeKV.mp4?tag=29", "durationMs": 56400}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-17T18:21:27+00:00", "createdAtBeijing": "2026-11-18T02:21:27+08:00", "createdAtLocal": "11-18 02:21 北京", "url": "https://x.com/jerryjliu0/status/2122757020801814613", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2122757020801814613", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "文档解析评测的细粒度指标设计", "evidence": "6 dimensions and 330 test scenarios", "rationale": "说明错误分级加权与模型裁判设计方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "构建评估高维输出的基准时，最难的事情之一，就是在细化评估粒度的同时，让结果符合人类偏好。文档解析尤其如此。\n\n细粒度评估很有用，因为它能更精确地表达人的偏好。文档解析涉及多个维度的多种错误，包括图表错误、表格错误、表单错误、版式错误等。\n\n细粒度也支持定制：你可以选出最关心的维度，并赋予它们更高权重。\n\n无论使用确定性指标，还是让 LLM 担任评审，都能构建细粒度基准；两者并不互斥：\n1️⃣ 确定性评估：ParseBench-2 将解析拆分为 6 个维度和 330 个测试场景。每个维度都按人工定义的错误严重程度计分（数字出错应扣 10 分以上，多余的 HTML 标记则不扣分）。\n2️⃣ LLM 评审：也可以定义细粒度指标，再由 LLM 逐项评估。我们的 Document Parsing Protocol（DPP）建立了一套完整分类体系，包含 140 条规则和 516 项文字检查要求，每项都通过评审提示词具体实现！\n\n构建既细致又符合人类偏好的基准很有挑战。没有万能方案；ParseBench-2 和 DPP 都不“完美”，但都在认真推动各项标准的改进。\n\n接下来我们还会推出更多迭代，敬请关注！\n\nParseBench-2：https://t.co/PWczfhp0OX\nDocument Parsing Protocol：https://t.co/UQ4PeskH78"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2122757916398862740", "track": "enterprise", "source": {"id": "2122757916398862740", "text": "trace data contains a ton of valuable insights to mine, but also a lot of sensitive data you need to manage carefully\n\nthese three new controls stack up nicely to enable responsible trace governance:\n- by default, trace everything to langsmith, but restrict access to inputs/ouputs. this lets people see number of calls, tools getting invoked, etc; but restricts any sensitive info\n- when a customer complains, get their permission and enable a small set of engineers to see inputs/outputs for their bad traces\n\nsounds simple/basic/boring, but security and governance is really important to get right for data like traces which can contain sensitive info!", "createdAt": "Tue Nov 17 18:25:00 +0000 2026", "replyCount": 14, "retweetCount": 3, "likeCount": 26, "conversationId": "2122757916398862740", "author": {"username": "hwchase17", "name": "Harrison Chase", "profileImageUrl": "https://pbs.twimg.com/profile_images/1569345624935485442/R67C4wCQ_normal.jpg"}, "authorId": "2728439146", "quotedTweet": {"id": "2122752224245793191", "text": "We’re adding 3 new controls in LangSmith to help your team manage sensitive trace data.\n\n1️⃣ Control who can see trace inputs and outputs\n2️⃣ Manage team-by-team permissions with user groups\n3️⃣ Set trace-level access policies using metadata https://t.co/sdSTPLg323", "createdAt": "Tue Nov 17 18:02:23 +0000 2026", "replyCount": 3, "retweetCount": 4, "likeCount": 18, "conversationId": "2122752224245793191", "author": {"username": "LangChain", "name": "LangChain", "profileImageUrl": "https://pbs.twimg.com/profile_images/2028336270431453184/jRRpLAdG_normal.jpg"}, "authorId": "1589007443853340672", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122737082325987328/img/fmqwbLwLErEFwH3k.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122737082325987328/img/fmqwbLwLErEFwH3k.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122737082325987328/vid/avc1/1920x1080/gDhXxtuilXF7FfV2.mp4?tag=29", "durationMs": 76200}], "translationZh": "我们正在为 LangSmith 新增 3 项控制功能，帮助团队管理敏感追踪数据。\n\n1️⃣ 控制谁可以查看追踪记录的输入和输出\n2️⃣ 通过用户组管理各团队的权限\n3️⃣ 使用元数据设置追踪记录级别的访问策略 https://t.co/sdSTPLg323"}, "expert": {"priority": "P0", "domain": "Agent 框架", "name": "Harrison Chase", "role": "LangChain / CEO", "why": "LangChain 是 Agent/RAG 生态核心项目，适合跟踪企业级 Agent 工程化", "handle": "hwchase17"}, "createdAtIso": "2026-11-17T18:25:00+00:00", "createdAtBeijing": "2026-11-18T02:25:00+08:00", "createdAtLocal": "11-18 02:25 北京", "url": "https://x.com/hwchase17/status/2122757916398862740", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2122757916398862740", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "LangSmith敏感追踪数据权限治理", "evidence": "3 new controls in LangSmith", "rationale": "给出分层授权及获客许可后排障流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "追踪数据中有大量值得挖掘的信息，但也包含许多需要谨慎管理的敏感数据。\n\n这三项新控制功能可以配合使用，帮助团队妥善治理追踪数据：\n- 默认将所有追踪记录发送至 langsmith，但限制对输入和输出的访问。这样，团队成员可以查看调用次数、工具调用情况等，同时限制敏感信息的访问。\n- 客户反馈问题时，先征得客户同意，再允许少数工程师查看相关异常追踪记录的输入和输出。\n\n听起来简单、基础，甚至有点枯燥，但对于追踪记录这类可能包含敏感信息的数据，做好安全与治理至关重要！"}, "avatar": "https://pbs.twimg.com/profile_images/1569345624935485442/R67C4wCQ_normal.jpg"}, {"id": "2122499964203053161", "track": "agent", "source": {"id": "2122499964203053161", "text": "推荐腾讯开源的 LoopForge，一个面向 Coding Agent 的软件开发与交付工作台。\n\n它把 Agent 的开发、代码评审、测试和人工验收组织成可重复执行的 SOP（标准工作流程）。\n\n比如，一个需求进来后，可以让不同 Agent 分别负责设计、实现和 Review，脚本负责运行测试，最后由人来审批。如果某一步没通过，还能退回指定节点重新执行，整个过程的日志和产物都会保留。\n\n它支持 Codex、Claude Code、Pi、DeepSeek Harness 等 Coding Agent，可以在 Docker 沙箱中运行，也提供直接集成到现有 Coding CLI 的本地工作流。\n\n我比较关注这类项目对 Agent 工程化落地的价值。\n\nCoding Agent 能力越来越强，如何让多个 Agent 按照稳定的流程协作，让每次代码修改都有检查、有记录、失败后能够恢复，可能会成为团队大规模使用 Agent 的关键。\n\n💻 GitHub: https://t.co/z5IV4EPkVo", "createdAt": "Tue Nov 17 01:20:00 +0000 2026", "replyCount": 12, "retweetCount": 13, "likeCount": 90, "conversationId": "2122499964203053161", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-17T01:20:00+00:00", "createdAtBeijing": "2026-11-17T09:20:00+08:00", "createdAtLocal": "11-17 09:20 北京", "url": "https://x.com/Xudong07452910/status/2122499964203053161", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2122499964203053161", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "LoopForge开发交付工作台", "evidence": "如果某一步没通过，还能退回指定节点重新执行", "rationale": "介绍多Agent开发流程、验收及失败恢复机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122695488973467779", "track": "enterprise", "source": {"id": "2122695488973467779", "text": "We are thrilled to expand our collaboration with @GlobalFoundries. In addition to deploying Spot across their global manufacturing network, GF will be the first semiconductor manufacturer to test humanoid robots as part of Atlas early adopter program.\n\nGF has worked with Boston Dynamics and Spot for over four years and recently expanded the program to Singapore, where two Spot robots have traveled nearly 900 kilometers and completed more than 90,000 inspections in sub-fab areas since April, achieving a 99% mission success rate.\n\nhttps://t.co/7e0RW1t8yu", "createdAt": "Tue Nov 17 14:16:57 +0000 2026", "replyCount": 25, "retweetCount": 27, "likeCount": 220, "conversationId": "2122695488973467779", "author": {"username": "BostonDynamics", "name": "Boston Dynamics", "profileImageUrl": "https://pbs.twimg.com/profile_images/1156978210783019009/AbgIujGu_normal.jpg"}, "authorId": "517473207", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVUS2yXMAA3DgK.jpg", "width": 1440, "height": 1016, "previewUrl": "https://pbs.twimg.com/media/HXVUS2yXMAA3DgK.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXVUTBzW0AAePdQ.jpg", "width": 1440, "height": 1017, "previewUrl": "https://pbs.twimg.com/media/HXVUTBzW0AAePdQ.jpg:small"}], "expert": {"priority": "P0", "domain": "机器人领域突破", "name": "Boston Dynamics", "role": "机器人项目", "why": "五方向 X 主动热点搜索：机器人领域突破", "handle": "BostonDynamics"}, "createdAtIso": "2026-11-17T14:16:57+00:00", "createdAtBeijing": "2026-11-17T22:16:57+08:00", "createdAtLocal": "11-17 22:16 北京", "url": "https://x.com/BostonDynamics/status/2122695488973467779", "themeId": "editorial", "signalScore": 85, "hotspotMatches": [{"id": "robotics", "label": "机器人领域突破", "matchedTerms": ["robot", "humanoid"]}], "hotspotDirections": ["robotics"], "hotspotDirection": "robotics", "hotspotDirectionLabel": "机器人领域突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2122695488973467779", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "晶圆制造机器人巡检与人形机器人试点", "evidence": "90,000 inspections", "rationale": "披露巡检规模、成功率及试点扩展，属企业自报"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们很高兴能进一步扩大与 @GlobalFoundries 的合作。除了在全球制造网络中部署 Spot，GF 还将加入 Atlas 早期采用者计划，成为首家测试人形机器人的半导体制造商。\n\nGF 与 Boston Dynamics 及 Spot 的合作已超过四年，近期又将项目扩展至新加坡。自 4 月以来，两台 Spot 机器人已在晶圆厂下层设备区行进近 900 公里，完成超过 90,000 次检查，任务成功率达 99%。\n\nhttps://t.co/7e0RW1t8yu"}, "avatar": "https://pbs.twimg.com/profile_images/1156978210783019009/AbgIujGu_normal.jpg"}, {"id": "2122713692324384793", "track": "creative", "source": {"id": "2122713692324384793", "text": "Teammate on Fable 5.2 made HADAL, a dive into the Mariana Trench you can play in a browser tab at https://t.co/wgZHPEaeRy. You start as a scuba diver on a sunlit reef, board a submarine, and work your way down past shipwrecks, a whale fall and other things to Challenger Deep, scanning 18 discoveries as you go.\n\nEverything on screen is code. Teammate wrote the WebGPU renderer itself, with no game engine and no Three.js, and generated the terrain, kelp, creatures, submarine and sound without a single imported model, texture or audio file. It all fits in one 373 KB HTML file.\n\n36,000 Perplexity credits on Ultra Effort (Fable 5.2 High as orchestrator).", "createdAt": "Tue Nov 17 15:29:17 +0000 2026", "replyCount": 50, "retweetCount": 13, "likeCount": 292, "conversationId": "2122713692324384793", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122713571838898177/img/30HjMvVG6-lVh-nR.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122713571838898177/img/30HjMvVG6-lVh-nR.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122713571838898177/vid/avc1/1920x1080/zzdhgmi_tMfoqclr.mp4?tag=29", "durationMs": 60000}], "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-17T15:29:17+00:00", "createdAtBeijing": "2026-11-17T23:29:17+08:00", "createdAtLocal": "11-17 23:29 北京", "url": "https://x.com/AravSrinivas/status/2122713692324384793", "themeId": "editorial", "signalScore": 87, "editorial": {"id": "2122713692324384793", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Agent 生成海沟探索浏览器游戏", "evidence": "one 373 KB HTML file", "rationale": "提供可玩作品及渲染实现、资源与成本细节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "基于 Fable 5.2 的 Teammate 制作了 HADAL，一款可以在浏览器标签页中游玩、探索马里亚纳海沟的游戏：https://t.co/wgZHPEaeRy。你最初是一名身处阳光照耀珊瑚礁的水肺潜水员，随后登上潜艇，沿途经过沉船、鲸落等景观，一路下潜至挑战者深渊，并扫描 18 处发现。\n\n屏幕上的一切都由代码生成。Teammate 自行编写了 WebGPU 渲染器，没有使用游戏引擎或 Three.js；地形、海带、生物、潜艇和声音也全部自行生成，没有导入任何模型、纹理或音频文件。所有内容都装在一个 373 KB 的 HTML 文件中。\n\n使用 Ultra Effort，消耗了 36,000 Perplexity 积分（由 Fable 5.2 High 负责统筹）。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2122597104933896383", "track": "tools", "source": {"id": "2122597104933896383", "text": "Arcane 值得看的，不是能点一下启停容器，而是把日常管理、更新、同步和备份做成有规则的流程。\n\n它适合先看全局再点进具体容器排障，比如相册打不开时，按主机、容器健康、日志、数据库、磁盘这个顺序查。看见“运行中”不等于应用一定正常。\n\n对自托管用户，工作单元是 Compose 项目，不是单个容器。面板方便日常操作，但“看得到现有容器”不等于能完整接管原项目；可读、可备份的配置文件才是退路。\n\n一台面板也能管多台主机：家里 NAS、办公室小主机、云上 VPS 都能汇总过来。v3 Agent 会主动连管理端，本身不监听端口。操作前先核对主机，避免删错、重启错。\n\n更新比拉 latest 细：检测和自动安装是两套开关；同名标签内容也可能变；默认不会无条件追到最新大版本。数据库和网关还是先看变更记录和恢复方案。\n\nGit 同步让配置有历史，但拉文件、拉镜像、重建容器是不同动作。备份也要分三层：Git 管配置，业务数据单独备份，Arcane 自己的用户和密钥也要能恢复。同一台机器上的备份，防不住整机或硬盘坏掉。\n\n漏洞扫描能帮你排出该先处理哪个镜像，但不是完整安全审计。建议先跑通“扫描、看上游说明、更新验证”，再考虑镜像修补。\n\n另外还支持 OIDC、权限、Swarm、Podman，以及移动端测试版。Podman 里的 Kubernetes YAML 不是完整 K8s 管理，移动端仍是 beta。", "createdAt": "Tue Nov 17 07:46:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2122597104082358329", "inReplyToStatusId": "2122597104543756421", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-17T07:46:00+00:00", "createdAtBeijing": "2026-11-17T15:46:00+08:00", "createdAtLocal": "11-17 15:46 北京", "url": "https://x.com/sitinme/status/2122597104933896383", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2122597104933896383", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Arcane自托管维护与恢复流程", "evidence": "Git 管配置，业务数据单独备份", "rationale": "给出排障顺序、更新边界和分层备份方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2122654766144885209", "track": "creative", "source": {"id": "2122654766144885209", "text": "🚨 上周说好的，MiniMax H3 数字人全流程，今天全部公开！\n\n租一张 48G 的 40 系显卡，一张人物图 + 一段配音，跑出一条 1344×768 的高清数字人口播。\n\n7 秒成片，GPU 费用 0.77 元。以前调云端 Seedance，一分钟动辄大几十上百块。\n\n选机器、装环境、下模型、配工作流、踩坑，全写进去了。看完还部署不了，直接回来喷。\n\n牛逼的是：这一整套部署，我几乎没怎么打字。\n\n跟 Claude Code 讲需求、贴报错、改参数，到最后写这篇教程，全是用一款免费的语音输入法口喷出来的。按住说，松手就是整理好的文字。\n\n🔥 H3 数字人有个大坑：最要紧的不是显卡，是配音。\n\n我的 AI 配音直接将 Claude 写成“克劳德”，生成出来就是中文读法；后期换成英文音轨，生成的AI视频也需要同步重新生成。\nH3 是参考你的声音重新生成，不是对口型工具。\n如果配音不先试听的话，出现问题就需要重跑\n\n视频效果，还有用语音输入法口喷部署到底多爽，放下面 👇", "createdAt": "Tue Nov 17 11:35:07 +0000 2026", "replyCount": 17, "retweetCount": 15, "likeCount": 178, "conversationId": "2122654766144885209", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "quotedTweet": {"id": "2122654577103138927", "text": "MiniMax H3 云端部署保姆级教程：一张照片生成数字人口播，实测一条不到1元", "createdAt": "Tue Nov 17 11:34:22 +0000 2026", "replyCount": 12, "retweetCount": 45, "likeCount": 242, "conversationId": "2122654577103138927", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "article": {"title": "MiniMax H3 云端部署保姆级教程：一张照片生成数字人口播，实测一条不到1元", "previewText": "如果看完这篇教程你部署不了，直接回来喷。\n先看结果：一张人物照片，加一段提前录好的配音，可以生成一条会说话、有表情的数字人口播。"}}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "雪踏乌云", "role": "内容、视觉与多模态实践与观察", "why": "具体拆出海运营、流量监控和自媒体 Bot 职责，跨场景实操价值高。", "handle": "Pluvio9yte"}, "createdAtIso": "2026-11-17T11:35:07+00:00", "createdAtBeijing": "2026-11-17T19:35:07+08:00", "createdAtLocal": "11-17 19:35 北京", "url": "https://x.com/Pluvio9yte/status/2122654766144885209", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2122654766144885209", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "数字人口播部署与配音复盘", "evidence": "H3 是参考你的声音重新生成", "rationale": "包含部署规格、实测成本及配音错误重跑复盘"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, {"id": "2122627354040398124", "track": "creative", "source": {"id": "2122627354040398124", "text": "你是不是也受够了白天听上司画大饼、替同事背黑锅，晚上还要顶着压力无休止加班的苦日子？\n你是不是明明攒了一肚子火，在发泄情绪的时候却还得硬撑着成年人的体面？\n\n我最近跑通了一套 Codex 搭配 Tripo Agentic Canvas 的 3D游戏开发管线，干脆拿它做了个办公室小游戏：\n《谁要上这个破班》。\n\n我在玩 Tripo Agentic Canvas 的时候，发现它最有意思的地方在于它能把整条 3D 制作流程摆在一张画布上。\n在这套组合技里，Tripo Canvas在前端负责生成和管理全部 3D 资产，Codex在后端负责审查资产、编写代码，并把模型无缝接进游戏里。这两个工具在上下游打配合，给我省掉了大量手动导资产的苦活。\n\n我给老板、卷王、摸鱼大师、甩锅侠、实习生和我自己这六个角色，全都先定好了正面、侧面、背面三张概念图。我把概念图传上画布，对 Agent说了一句“照着图做成 3D 角色”，它自己就搭好了“高清模型 → 重拓扑 → UV → 纹理”的完整流程，还在每个节点上写清了每一步要花多少积分。\n\n这套画布最省事的地方在于它支持直接复用整条流程。我只要在上传节点换一张概念图，就能把整条流程再跑一遍，让剩下的角色同时开跑生成任务。我也用同样的方法，批量做出了办公室里的工位、电梯、白板，还有大饼、黑锅和保温杯。\n\n看着画布依次铺开各个生成节点，系统把所有 3D 资产码成了整整齐齐的矩阵，连盯盘的过程都给了我极大的解压感。\n\n等模型全部做好，我直接把它们放进 Tripo完成自动绑骨，给角色套上现成的动作；\n遇到动作库里没有“老板画饼”这种特殊动作时，我打一句话就能让系统直接生成新动作。\n\n最后 Codex 直接向我交付了完整的网页游戏工程。\n我们在游戏里白天能把大饼砸回老板脸上、把黑锅扣回甩锅侠头上，到了晚上还能带全组同事溜进最后一班电梯。\n\n你如果来玩这把游戏，你能带几个人准点下班？\n地址我放评论区👇", "createdAt": "Tue Nov 17 09:46:12 +0000 2026", "replyCount": 35, "retweetCount": 3, "likeCount": 54, "conversationId": "2122627354040398124", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122627119201280000/img/pQ0fAo6Hyu-PAhVS.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122627119201280000/img/pQ0fAo6Hyu-PAhVS.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122627119201280000/vid/avc1/1920x1080/IfhlntFw4kuAlc3X.mp4?tag=29", "durationMs": 107766}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-17T09:46:12+00:00", "createdAtBeijing": "2026-11-17T17:46:12+08:00", "createdAtLocal": "11-17 17:46 北京", "url": "https://x.com/servasyy_ai/status/2122627354040398124", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2122627354040398124", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "AI协作制作3D办公室网页游戏", "evidence": "最后 Codex 直接向我交付了完整的网页游戏工程", "rationale": "作者自述完成游戏，详述资产生成与接入流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2122698635246977393", "track": "tools", "source": {"id": "2122698635246977393", "text": "分享 8 个 做游戏开发 必须知道的 Skill，先收藏再装~\n\n从生成素材、写玩法、做界面、调手感，再到多人联机，链路基本齐了：\n\n1. higgsfield-websites：生成游戏素材，顺便把浏览器游戏搭起来、部署出去。原来的 higgsfield-game-generation 已经并进这个 Skill 了。\nhttps://t.co/ZNnYKRN9vy\n\n2. game-engine：游戏循环、物理碰撞、2D / 3D 渲染，底层先立住。\nhttps://t.co/0vJum09QSM\n\n3. game-developer：Unity / Unreal 的玩法开发和性能优化，偏引擎侧实作。\nhttps://t.co/a0c826llB1\n\n4. game-ui-design：菜单、血条、背包这些界面，别再是能玩但不能看。\nhttps://t.co/OCzVeBk9xL\n\n5. game-design-theory：玩法、难度、奖励怎么设计，专门治「能跑，但不好玩」。\nhttps://t.co/r1GF00ymMl\n\n6. game-feel：打击反馈、屏幕震动、音效，手感是另一回事。\nhttps://t.co/OSTY27yhAu\n\n7. multiplayer-game（历史版）：玩家匹配、房间、实时状态同步。当前主分支已经没有这个目录了，要用的话看这笔历史提交，依赖得自己核对一遍。\nhttps://t.co/EFegPYpEv5\n\n8. develop-web-game（OpenAI 历史版）：让 Codex 边写边测，看截图、查报错、修 Bug。今年 4 月 23 日已从 OpenAI curated 目录移除，同样是历史提交。\nhttps://t.co/t3pbfv0eVd\n\n如果只是想先做网页小游戏，也不用一口气全上，先用 game-engine + game-feel + develop-web-game 这一组就够起步。", "createdAt": "Tue Nov 17 14:29:27 +0000 2026", "replyCount": 3, "retweetCount": 8, "likeCount": 66, "conversationId": "2122698635246977393", "author": {"username": "cnyzgkc", "name": "木马人", "profileImageUrl": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, "authorId": "1866821173755121666", "quotedTweet": {"id": "2122647059425788109", "text": "这两天有个网友，看到我小红书之前做的那款 3D 武侠游戏，咨询我咋做的~\n他尝试用AI做，但是一直做的效果不好，卡点主要是里面的人物以及美术资产做得不够精致~\n\n我正好趁着周末做了一个解压小游戏，叫《谁也不能阻止我下班！》\n正好我把整套制作流程分享给大家，希望对制作游戏感兴趣的小伙伴有帮助~\n\n首先需要对游戏有个初步的玩法和设计思路：\n我的想法就是做一个解压的爽游，然后是3D的Q版人物，为了下班，各种躲避障碍物，中间遇到开会，老板等等直接创飞，爽翻了~\n\n确定好玩法之后，接下来就是核心的制作流程了，主要分为三步：\n第一步，设定玩法规则和完整资产清单。想好需要用到的主角、NPC 数量、场景摆件以及画风，尽量一次列清楚，搞定后再拿去生成资产，省得后面返工造成前后画风不一致；\n第二步，用 Tripo Agentic Canvas 批量生成游戏资产。之前其实就用过Tripo 3D来做模型和人物设计，这次他们更新了Canvas的功能，直接把玩法、清单和画风一股脑丢到画布的 Agent 对话框，它根据需求生成了一条 200 多个节点的流水线，从生图、四视图到智能拓扑、UV 和纹理一次搞定，太牛逼了~ 而且，如果遇到哪个节点的人物设计的有问题，放大那个节点单独重跑就行，也不需要整条推倒重来；\n第三步，导出模型接进游戏，边玩边调。把跑出来的 3D 资产导出来后，丢给Codex或者Claude，跟 AI 提出具体的修改意见，尽量要详尽一点，比如“撞飞老板后的击飞初速度太慢”，就比说“手感不够爽”更具象化。\n\n说实话，整体游戏的玩法、关卡和碰撞代码，用 Claude 很快就搞定了。 但是中间那些3D美术资产，包括人物，障碍物啥的，真想做精致，确实花时间~\n\n就拿我这次做的游戏来说，里面有 1 个主角、6 个带不同表情的同事和老板 NPC，再加上打印机、饮水机、沙发、KPI 看板这些 17 个办公室摆件。\n换做以前，这么一套工作流，少说搞几天，还不一定搞得定。\n\n这次用 Tripo Agentic Canvas的功能，不到一小时就把整套 3D 资产一次性跑通了，连参考图都没给。\n3D游戏的天真变了，恐怕人人都能做游戏的时代真的来临了~\n\n具体视频演示👇", "createdAt": "Tue Nov 17 11:04:30 +0000 2026", "replyCount": 27, "retweetCount": 0, "likeCount": 44, "conversationId": "2122647059425788109", "author": {"username": "cnyzgkc", "name": "木马人", "profileImageUrl": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, "authorId": "1866821173755121666", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122646698204008448/img/v_LGW2BVrVKeKMtm.jpg", "width": 1280, "height": 880, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122646698204008448/img/v_LGW2BVrVKeKMtm.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122646698204008448/vid/avc1/1280x880/ILNgGd1SA8Je3J0k.mp4?tag=29", "durationMs": 101889}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVW0EsaUAA7vnc.jpg", "width": 864, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXVW0EsaUAA7vnc.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "木马人", "role": "内容、视觉与多模态实践与观察", "why": "展示用 Python 自动渲染科普短片并解释制作方式，提供创作增量。", "handle": "cnyzgkc"}, "createdAtIso": "2026-11-17T14:29:27+00:00", "createdAtBeijing": "2026-11-17T22:29:27+08:00", "createdAtLocal": "11-17 22:29 北京", "url": "https://x.com/cnyzgkc/status/2122698635246977393", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2122698635246977393", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "游戏开发 Skill 清单与三维资产制作流程", "evidence": "先用 game-engine + game-feel", "rationale": "提供工具用途、历史版本限制及可复用制作流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, {"id": "2122535125749743618", "track": "agent", "source": {"id": "2122535125749743618", "text": "这回真得起立了。。。兄弟们！！阿里的新模型有点强啊！！！！用它干活一点都不烧心，感觉智能真的越来越便宜了！！！\n\n我用Qwen新模型做了一个小镇的场景模型用来做游戏，整个场景搭建才花了6块钱，我只安排了一次任务 Qwen4-Max 直接让他自己迭代的，我在过程中什么都没干。。。。，\n\n2 小时 28 分钟后，它自己改成了下面这个样子，我就跟Qwen4-Max说了一句：用 three.js 做一个可交互的江南水乡夜景，白墙黑瓦沿河排开，石拱桥横跨河面，乌篷船来回漂，屋檐下的红灯笼会摇、会发光，天色从黄昏慢慢入夜，加泛光、做体积光、做出平静的水面、加雾气层次、镜头要看得到整条河和石拱桥\n\n剩下的全靠它自己：改代码、看图挑毛病、修报错、写下一轮要改什么，然后接着干\n\n以后真的再也不用每隔10分钟跟模型说一次继续了，Qwen自己就干完了，我回头看了一下他执行的过程，跑完这一轮我对\"长程任务\"这四个字有了很具体的体感\n\n1/ 它会自己验货，3 轮里它自己截图检查了 30 次，看到灯影方向写反、横着铺满整条河像斑马线，自己标出来，自己改掉\n2/ 它不推倒重来，代码从 769 行长到 1044 行，原来的拖动旋转、昼夜变化、灯笼摇晃、船来回漂，一个都没丢\n3/ 报错它自己改，第 2 轮水面代码一次报了 258 条错，它 35 秒就找到原因，改完重测，归零\n4/ 它会写交接，每一轮结束都写一份记录：改了什么、还差什么、下一轮按影响大小先做哪条。下一轮开工先读这份记录，3 轮下来衔接没断过\n你会发现，它不是那种一次惊艳就收工的模型，而是能接住反馈、一版一版往上磨的模型\n\n然后是我最想说的部分：账单，这我真的觉得比之前优化的多的部分，也最出彩的部分\n\n3 轮一共 105 次请求，输入 335 万 token，其中 95% 命中了缓存，总花费 6.19 元\n\n如果不命中缓存，光输入就要 33 块钱左右\n\n长任务为什么以前用不起？因为每走一步，都要把前面所有代码、截图结果、报错重新喂一遍，Qwen4-Max 的缓存命中价只有输入价的二十分之一，这件事在长任务里会被放大几十倍\n\n每一轮花 2 块钱左右，很稳，一点都不烧心，Qwen团队这波是真的很站在企业落地的视角去训练模型了\n\n这才是AI智能长程任务真正能落地的前提：模型要扛得住，账单也要扛得住。。这一波Qwen4-Max上线，后面谁真的能在企业落地，我觉得Qwen必有一席之地了", "createdAt": "Tue Nov 17 03:39:43 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 25, "conversationId": "2122535125749743618", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122532041787158528/img/_j-AQJAJpt8Sf_pt.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122532041787158528/img/_j-AQJAJpt8Sf_pt.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122532041787158528/vid/avc1/1920x1080/x5vAJTAArTgC6Ww4.mp4?tag=29", "durationMs": 27100}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXS_q-RbAAAHjqz.jpg", "width": 1820, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXS_q-RbAAAHjqz.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "叫我阿杭", "role": "内容、视觉与多模态实践与观察", "why": "公开 Obsidian、录音与自媒体制作流程，直接贴合内容生产需求。", "handle": "Astronaut_1216"}, "createdAtIso": "2026-11-17T03:39:43+00:00", "createdAtBeijing": "2026-11-17T11:39:43+08:00", "createdAtLocal": "11-17 11:39 北京", "url": "https://x.com/Astronaut_1216/status/2122535125749743618", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2122535125749743618", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Qwen长程场景开发与缓存成本实践", "evidence": "每一轮结束都写一份记录", "rationale": "提供截图验收、修错与交接方法及自述成本"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, {"id": "2122753531127923194", "track": "tools", "source": {"id": "2122753531127923194", "text": "Big updates from SGLang x RadixArk at SGLang Summit 2026!\n\nAs a core maintainer of SGLang, RadixArk is driving several interesting developments across AI inference and RL infrastructure:\n\nSGLang Consortium — 9 founding members, including NVIDIA, AMD, Intel, Google, Meta, Thinking Machines Lab, and RadixArk, joining forces to advance open-source inference\n\nSGLang v1.0 — A major milestone focused on production reliability across scheduling, caching, and distributed serving\n\nSGLang on AWS Trainium — RadixArk and AWS Annapurna Labs bring LLM serving and RL rollouts to Trainium through SGLang-Neuron\n\nRadixArk x Intel — Collaborating to optimize SGLang inference across Intel CPUs, GPUs, and accelerators\n\nMiles v0.2 by RadixArk — Expanding heterogeneous hardware support, fully asynchronous RL, and multimodal training\n\nFrom high-performance inference to scalable RL training, SGLang and RadixArk are making open AI infrastructure more accessible and efficient.\n\nExciting progress for the open-source AI ecosystem!", "createdAt": "Tue Nov 17 18:07:35 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 2, "conversationId": "2122753531127923194", "author": {"username": "dongxi_nlp", "name": "Dongxi 东锡 NLP", "profileImageUrl": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, "authorId": "1477948736156454913", "quotedTweet": {"id": "2122736431009595422", "text": "2,000+ people. Two days. The first SGLang Summit.\n\nTogether, we announced SGLang v1.0, released Miles v0.2, and launched the SGLang Consortium with nine founding members: @nvidia, @AMD, @intel, @Google, @Meta, @thinkymachines, @Cloudflare, @modal, and @radixark.\n\nSGLang is now used by 332 organizations. At Meta, it powers production inference for products serving billions of users. Teams from Modal, Cloudflare, LinkedIn, and others shared their production lessons.\n\nAcross 90+ technical talks and six hands-on workshops, the community explored what comes next for inference, reinforcement learning, and AI agents.\n\nTo everyone building, deploying, and contributing: thank you for making this possible.\n\nExplore the announcements, engineering lessons, and moments from SGLang Summit 2026 in the link below.", "createdAt": "Tue Nov 17 16:59:38 +0000 2026", "replyCount": 71, "retweetCount": 27, "likeCount": 182, "conversationId": "2122736431009595422", "author": {"username": "sgl_project", "name": "SGLang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1923445139319685126/pyjcWZU7_normal.jpg"}, "authorId": "1923440305703092226", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXV4oVtbgAAFl9X.jpg", "width": 1848, "height": 998, "previewUrl": "https://pbs.twimg.com/media/HXV4oVtbgAAFl9X.jpg:small"}], "translationZh": "2,000 多人，两天，首届 SGLang Summit。\n\n我们共同宣布了 SGLang v1.0，发布了 Miles v0.2，并成立了 SGLang Consortium，九家创始成员包括：@nvidia、@AMD、@intel、@Google、@Meta、@thinkymachines、@Cloudflare、@modal 和 @radixark。\n\n目前已有 332 家组织使用 SGLang。在 Meta，SGLang 为服务数十亿用户的产品提供生产环境推理支持。来自 Modal、Cloudflare、LinkedIn 等公司的团队分享了生产实践经验。\n\n通过 90 多场技术演讲和六场实操工作坊，社区共同探讨了推理、强化学习和 AI 智能体的未来方向。\n\n感谢每一位参与构建、部署和贡献的人，是你们让这一切成为可能。\n\n点击下方链接，了解 SGLang Summit 2026 的发布动态、工程经验与精彩瞬间。"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "东锡", "role": "模型、研究与推理实践与观察", "why": "有 SFT、loss mask 等训练细节解读，补中文模型工程教育。", "handle": "dongxi_nlp"}, "createdAtIso": "2026-11-17T18:07:35+00:00", "createdAtBeijing": "2026-11-18T02:07:35+08:00", "createdAtLocal": "11-18 02:07 北京", "url": "https://x.com/dongxi_nlp/status/2122753531127923194", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2122753531127923194", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "SGLang与Miles基础设施更新", "evidence": "released Miles v0.2", "rationale": "列出版本发布、硬件适配与训练能力更新"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "SGLang 与 RadixArk 在 SGLang Summit 2026 上公布多项重要进展！\n\n作为 SGLang 的核心维护方，RadixArk 正在推动 AI 推理和 RL 基础设施领域的多项新进展：\n\nSGLang Consortium——由 9 家创始成员共同推进开源推理，包括 NVIDIA、AMD、Intel、Google、Meta、Thinking Machines Lab 和 RadixArk。\n\nSGLang v1.0——一个重要里程碑，重点提升调度、缓存和分布式服务在生产环境中的可靠性。\n\nSGLang on AWS Trainium——RadixArk 与 AWS Annapurna Labs 通过 SGLang-Neuron，将 LLM 推理服务和 RL 轨迹采样引入 Trainium。\n\nRadixArk x Intel——合作优化 SGLang 在 Intel CPU、GPU 和加速器上的推理性能。\n\nRadixArk 推出的 Miles v0.2——扩展异构硬件支持、全异步 RL 和多模态训练能力。\n\n从高性能推理到可扩展的 RL 训练，SGLang 和 RadixArk 正让开放的 AI 基础设施更易用、更高效。\n\n这是开源 AI 生态令人振奋的进展！"}, "avatar": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, {"id": "2122825980670775693", "track": "agent", "source": {"id": "2122825980670775693", "text": "Today we announced MAI Cyber 2 Flash, and here’s some of the work that came before it…\n\nOpen source runs the world’s software. Its maintainers are now flooded with AI-generated bug reports, and sorting through them takes time away from fixing.\n\nWe tried something different with GitHub. Our earlier MAI Cyber model scanned six widely used open source projects. Security researchers checked each report before any maintainer saw it. \n\nMaintainers got 99 checked, private reports instead of a flood, and they’re already shipping fixes.\n\nThat’s what good AI security should look like: AI findings checked by people before they reach maintainers.", "createdAt": "Tue Nov 17 22:55:28 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2122825734146420904", "inReplyToStatusId": "2122825734146420904", "author": {"username": "mustafasuleyman", "name": "Mustafa Suleyman", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927407622602276864/c_5uOZij_normal.jpg"}, "authorId": "2314443930", "expert": {"priority": "P1", "domain": "AI 产品 / 消费级 AI", "name": "Mustafa Suleyman", "role": "Microsoft AI / CEO", "why": "消费级 AI、Copilot、AI 助手方向", "handle": "mustafasuleyman"}, "createdAtIso": "2026-11-17T22:55:28+00:00", "createdAtBeijing": "2026-11-18T06:55:28+08:00", "createdAtLocal": "11-18 06:55 北京", "url": "https://x.com/mustafasuleyman/status/2122825980670775693", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2122825980670775693", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AI安全扫描与人工核验流程", "evidence": "99 checked, private reports", "rationale": "自述六项目扫描及人工核验交付流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "今天，我们发布了 MAI Cyber 2 Flash。这里分享一些此前的工作……\n\n开源支撑着全球的软件运行。如今，维护者被 AI 生成的漏洞报告淹没，筛查这些报告挤占了修复问题的时间。\n\n我们与 GitHub 尝试了一种不同的做法。早期的 MAI Cyber 模型扫描了六个广泛使用的开源项目。在报告交给维护者之前，安全研究人员逐一进行了核查。\n\n维护者收到的是 99 份经过核查、私下提交的报告，而非海量报告轰炸，目前已陆续发布修复。\n\n好的 AI 安全实践就该如此：AI 发现的问题，先由人工核查，再交给维护者。"}, "avatar": "https://pbs.twimg.com/profile_images/1927407622602276864/c_5uOZij_normal.jpg"}, {"id": "2122658105125474308", "track": "tools", "source": {"id": "2122658105125474308", "text": "如果你在寻找Grok Bot的开源替代，可以试下OpenBot\n\nhttps://t.co/IlQWIZP8Dr\n\n我体验了下，它高度还原Grok Bot功能的同时，又给了你充分的定制能力！\n\n例如，每个bot可以指定实际运行的agent和模型，不论是pi，codex还是claude，模型也是自由选择，结合magpie，真就是随意组合跑。你要写代码，可以用claude➕opus模型，你要提交外链，可以用pi➕便宜的模型。\n\n跟Grok bot一样，你可以连接不同的电脑，但是它允许你配置每个bot的指令、技能、记忆、文件夹、定时任务等，真的是可以充分定制。\n\n如果你要迁移，可以在Grok bot中，说你要迁移哪个bot，然后把那个bot的信息复制出来，然后在openbot里面，让它去新建bot并导入。\n\n缺点：手机连接有点慢，时不时就要重新连接😟", "createdAt": "Tue Nov 17 11:48:23 +0000 2026", "replyCount": 8, "retweetCount": 4, "likeCount": 25, "conversationId": "2122658105125474308", "author": {"username": "indie_maker_fox", "name": "Fox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, "authorId": "1865299069092139008", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXUyTEYacAE0RVD.jpg", "width": 1200, "height": 1800, "previewUrl": "https://pbs.twimg.com/media/HXUyTEYacAE0RVD.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-11-17T11:48:23+00:00", "createdAtBeijing": "2026-11-17T19:48:23+08:00", "createdAtLocal": "11-17 19:48 北京", "url": "https://x.com/indie_maker_fox/status/2122658105125474308", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2122658105125474308", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "OpenBot体验与迁移方法", "evidence": "每个bot可以指定实际运行的agent和模型", "rationale": "提供配置、迁移步骤及连接问题的体验反馈"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2122519280373968950", "track": "agent", "source": {"id": "2122519280373968950", "text": "macOS 27.3 细化了磁盘访问和跨应用控制的授权，以减少 AI 代理等应用接触超出任务所需数据的风险。\n\n苹果在 10 月时就提到，Agent 越能自主行动，给它完全磁盘访问的风险就越高。用户点一次授权，之后 Agent 会读哪些文件、改哪些数据，往往要等它开始做任务才知道。\n\n这次改动落在 macOS 的系统授权流程里，各类 App 申请相关权限时，用户都可以按需只开放指定文件夹或目标 App，也可以让它每次需要时先询问。原来的「设备控制与数据访问」拆成了 System & App Protection Override 和「辅助功能」两项。新流程适用于新的权限请求，已有授权继续有效。\n\n相关阅读：\n- https://t.co/v8OS4BSag4\n- https://t.co/GhIFX1GMyo\n- https://t.co/hkOMQIbFyD", "createdAt": "Tue Nov 17 02:36:45 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 2, "conversationId": "2122519280373968950", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "aut ike. Today, we’re launching our Orchestrator API, that picks the right model for your task: balancing across capability, capacity and latency, and, giving you the flexibility to choose across 45+ open-weight and closed models.", "createdAt": "Tue Nov 17 20:18:38 +0000 2026", "replyCount": 27, "retweetCount": 10, "likeCount": 126, "conversationId": "2122786511829807229", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2122785177135096053", "text": "Introducing the Perplexity Orchestrator API.\n\nOrchestrator lets you choose the right model for the right task, and automatically selects the provider based on availability, capacity, and latency.\n\nAll open-weight and proprietary models are in one API with unified billing. https://t.co/DT3INmBbMl", "createdAt": "Tue Nov 17 20:13:20 +0000 2026", "replyCount": 31, "retweetCount": 19, "likeCount": 207, "conversationId": "2122785177135096053", "author": {"username": "perplexity_ai", "name": "Perplexity", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009310641165660160/XArF3_Ib_normal.jpg"}, "authorId": "1599587232175849472", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122785131719245824/img/Qz9nw1bZtq_BMaru.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122785131719245824/img/Qz9nw1bZtq_BMaru.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122785131719245824/vid/avc1/1920x1080/D8k_wmH9KtJEi8BU.mp4?tag=16", "durationMs": 30000}], "translationZh": "Perplexity Orchestrator API 正式推出。\n\nOrchestrator 让你为不同任务选择合适的模型，并根据可用性、容量和延迟自动选择服务提供商。\n\n所有开放权重和专有模型均可通过同一个 API 调用，统一计费。https://t.co/DT3INmBbMl"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": ideo.twimg.com/amplify_video/2122728563531218945/vid/avc1/1920x1080/sreEvAsKCkNmSSLd.mp4?tag=16", "durationMs": 40866}], "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-17T16:35:43+00:00", "createdAtBeijing": "2026-11-18T00:35:43+08:00", "createdAtLocal": "11-18 00:35 北京", "url": "https://x.com/AravSrinivas/status/2122730413743567240", "themeId": "editorial", "signalScore": 88, "editorial": {"id": "2122730413743567240", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Perplexity 发布多模型并行 Agent", "evidence": "Introducing Multiagent", "rationale": "明确发布功能、编排方式及开放范围"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Perplexity 推出 Multiagent。可搭配 Computer 和 Teammates 使用（在 Effort level 中开启）。你可以让 Fable 5.2 编排 Gemini 4 Carbon、GPT 6.1 Sol 和 Opus 5.5，让多个智能体并行工作，更快、更好、更准确地完成复杂任务。它尤其适合金融研究、预测、预测市场，以及批量分析申报文件。现已向所有 Max 用户开放网页版，移动端即将支持。https://t.co/C5H2Sm3BSr"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2122678893148877210", "track": "tools", "source": {"id": "2122678893148877210", "text": "收藏了很多文章，记下了很多灵感，Obsidian 里的文件越来越多，但真正需要写东西时，仍然要自己找资料、整理标签、建立关联、画关系图。\n\n你也试过把笔记丢给 AI。它能总结，却未必懂你的笔记库：双链写错了，属性格式不统一，生成的画布打不开，或者把本来就存在的概念又建了一遍。\n\n可以看看官方维护的开源项目 Obsidian Skills，可以解决 AI“能写文字”，却不一定“懂得按照 Obsidian 的方式工作”的问题。\n\n它把 Obsidian 特有的文件格式、操作方法和一些实际踩坑经验，整理成 AI Agent 可以读取的技能，让 Claude Code、Codex、OpenCode 等工具更有章法地处理笔记、数据库视图和画布。\n\n能做的不只是总结文字。比如把几篇资料整理成带来源、标签和状态的研究卡片，关联已有笔记，生成方便筛选的 Bases 数据视图，或者把复杂主题整理成能继续编辑的 Canvas 画布。\n\n目前项目有七项技能，还覆盖网页正文提取、模板批量生成、命令行操作，以及无桌面环境下的同步与发布。", "createdAt": "Tue Nov 17 13:11:00 +0000 2026", "replyCount": 3, "retweetCount": 1, "likeCount": 3, "conversationId": "2122678893148877210", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_i
