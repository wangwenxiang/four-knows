<script>
const DATA={"records": [{"id": "2118944612299805088", "track": "enterprise", "source": {"id": "2118944612299805088", "text": "Airbnb 实测：专用小模型如何以约 1% 推理成本，达到前沿模型的分类水平\n\n来自 @AirbnbEng 分享：在一个高频、实时的内容审核任务上，Airbnb 微调的小模型取得了接近前沿模型的分类效果，延迟不到 100 毫秒，高流量下推理服务成本约为前沿 API 的 1%。关键条件是任务明确、数据充足、调用量大，而不是小模型全面追上了大模型。\nhttps://t.co/aelLPySNqA\n\n比的是什么任务\n\n任务是判断用户内容是否违反价格与付款透明政策，每分钟处理数千次请求，要求在 200 毫秒内返回分数。误拦会阻止正常内容发布，因此精确率尤其重要。\n\n评测使用 1 万条留出样本，并通过权重校正抽样与生产流量的差异。部分模型还在 18.4 万条样本上复核，F1 差异不到 0.01。主要指标是综合精确率与召回率的 F1；能够输出分数的模型，会扫描阈值取最佳结果。\n\n小模型靠什么追上\n\nAirbnb 用数十万条去标识化的领域样本，微调了约 20 亿有效参数的 Gemma4-E2B。微调后，F1 从 0.563 提升至 0.902，与最好的专有模型相当；延迟中位数为 35 毫秒，p99 约 85 毫秒。相比之下，前沿 API 在低思考模式下，中位延迟约为 900 毫秒。\n\n它还能输出概率，让业务方调整阈值，在漏检与误拦之间取舍。文章也给前沿模型使用了更详细的提示词，质量提升约 1—3 个百分点、大致追平微调模型，但延迟和费用进一步增加。这里使用的是领域微调，文章没有说采用了蒸馏。\n\n「约 1% 成本」有条件\n\n比较的是高流量下，一张自托管 GPU 的公开租用费，与前沿 API 按公开标价计算的 token 费用。API 侧还计入了缓存折扣。\n\n这不是完整总成本：训练、标注、开发、运维和冗余备份都没有计入。流量不足时，专用 GPU 闲着也要付费；每分钟低于约 15—30 次请求时，文中比较的部分前沿 API 反而更便宜。", "createdAt": "Sat Nov 07 05:52:18 +0000 2026", "replyCount": 5, "retweetCount": 1, "likeCount": 6, "conversationId": "2118944612299805088", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWgA4wmbUAAdV9X.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWgA4wmbUAAdV9X.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-07T05:52:18+00:00", "createdAtBeijing": "2026-11-07T13:52:18+08:00", "createdAtLocal": "11-07 13:52 北京", "url": "https://x.com/shao__meng/status/2118944612299805088", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2118944612299805088", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Airbnb 小模型内容审核降本实践", "evidence": "F1 从 0.563 提升至 0.902", "rationale": "提供业务评测、延迟及成本适用边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2118877430320418999", "track": "research", "source": {"id": "2118877430320418999", "text": "Anthropic 最新研究：Agent 的记忆不是越多越好，Anthropic 如何把记录整理成可用经验\n\n来自 Anthropic 团队 @RLanceMartin 分享，通过多组实验说明：Agent 需要的不只是保存历史，还要回查证据、纠正笔记、整理经验，并在需要时找到它们。后台整理能够改善部分任务，但不是检索的替代品，也未必总能抵消维护成本。\n\nhttps://t.co/H1FFfA8rkh\n\n# 记忆不等于聊天记录\n\n这里的记忆是跨会话保存、以后可以读取的上下文，不涉及更新模型权重，也不只是压缩当前对话。\n\n文章讨论了几个配合使用的环节：保留原始记录供追溯；执行任务时写下目标、计划和已验证的经验；后台回看记录，纠错、去重、补链接，必要时建立知识库；读取时只提前加载少量重要内容，其余按需检索。\n\n作者把后台整理称为 dreaming。它并不是让模型“睡觉”，而是把整理经验与眼前任务分开，给模型专门的时间处理已有信息。\n\n# 好记忆要保存什么\n\n在 CL-Bench 数据库任务中，每道题开启新会话，只有记忆目录保留。模型作答后会收到正确答案，再整理经验。较强模型开始保存经过验证的规则和依据，而不只是记录错题；限定“只记失败”，反而削弱了收益。\n\n这说明有价值的记忆不只是“上次做错了什么”，还包括什么规则成立、为什么可信、以后何时适用。能随时重新读取的状态，则不必反复抄进笔记。\n\n# 实验显示：整理与搜索互补\n\n在约 35 万份文件、4.2 亿 token、25 个评测问题的内部语料实验中，单靠搜索的评分标准覆盖率为 53%；知识库结合搜索，随着整理轮次增加，从 54% 提升到 61%，每题少用约 2 万 token。\n\n这里的 61% 不是“答对了 61% 的问题”，节省的 token 也没有扣除后台建库成本。跨文档整合任务收益更明显，部分以单文件检索为主的任务则没有改善，知识库甚至比原文更大。\n\n另一个合同案例中，多代理共写一张表导致覆盖。改成每份合同单独一页、一个代理负责，并逐字引用条款后，最终报告的关键事实覆盖从 41/57 提升到 57/57。改善来自组织和写入规则，不只是增加思考时间。", "createdAt": "Sat Nov 07 01:25:20 +0000 2026", "replyCount": 23, "retweetCount": 2, "likeCount": 23, "conversationId": "2118877430320418999", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2118814753154064501", "text": "Memory is what allows Claude to learn from experience. In a new Engineering Blog post, we share how “dreaming” helps Claude organize what it’s learned, correct its mistakes, and find what it needs more easily the next time. https://t.co/uUEN4bNkr9", "createdAt": "Fri Nov 06 21:16:17 +0000 2026", "replyCount": 861, "retweetCount": 1062, "likeCount": 12027, "conversationId": "2118814753154064501", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "translationZh": "记忆让 Claude 能够从经验中学习。在最新的工程博客文章中，我们分享了“做梦”如何帮助 Claude 整理所学、纠正错误，并在下次更轻松地找到所需信息。https://t.co/uUEN4bNkr9"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWfDyRSWgAAJq91.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWfDyRSWgAAJq91.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-07T01:25:20+00:00", "createdAtBeijing": "2026-11-07T09:25:20+08:00", "createdAtLocal": "11-07 09:25 北京", "url": "https://x.com/shao__meng/status/2118877430320418999", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2118877430320418999", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Agent记忆整理与检索实验", "evidence": "从54%提升到61%", "rationale": "提供实验指标、成本局限及记忆组织方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2118863053001531676", "track": "agent", "source": {"id": "2118863053001531676", "text": "same open model, different harness =&gt; very different results\n\nJoël set out to find which harness actually gets the most out of open models in November 2026", "createdAt": "Sat Nov 07 00:28:13 +0000 2026", "replyCount": 15, "retweetCount": 11, "likeCount": 131, "conversationId": "2118863053001531676", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "quotedTweet": {"id": "2118373808692437403", "text": "I burned a shitload of compute so you don't have to. Releasing the Harness Leaderboard.\n\nWhich harness should you run your open model in? I ran 28,849 trials to find out.\n\nThe leaderboard compares nine coding-agent harnesses on open models. In each comparison only the harness changes: the model, provider and reasoning effort stay fixed, and every task gets three attempts.\n\nThe trials ran GLM-5.3-Flash, DeepSeek-V4.1-Flash and Flint on Terminal-Bench 2.1 and DeepSWE, for $4,746 of inference.\n\nAveraged over the three models, mini-swe-agent (@KLieret), a bash-only agent, solves 51.4% of tasks and @openclaw 27.3%. Four others are statistically tied with mini-swe-agent.\n\nOne of them is Pi (@pidotdev), at 49.4% for $0.29 per solved task, about 45% less than mini-swe-agent's $0.53.\n\nThe best harness depends on the model: mini-swe-agent on GLM-5.3-Flash, Hermes Agent (@NousResearch) on DeepSeek-V4.1-Flash and Kimi Code (@Kimi_Moonshot) on Flint.\n\n@opencode costs $3.35 per solved task, 11.7 times as much as Pi.\n\nSee Harness Hub's Harness Lens for what the nine harnesses do differently. It documents the prompts, tools and compaction of 34 coding-agent harnesses and links every claim to its source.\n\nLeaderboard: https://t.co/AiWiQtBOz5\nHarness Lens: https://t.co/I8jbcWa9JH", "createdAt": "Thu Nov 05 16:04:08 +0000 2026", "replyCount": 255, "retweetCount": 253, "likeCount": 2457, "conversationId": "2118373808692437403", "author": {"username": "joelniklaus", "name": "Joël Niklaus", "profileImageUrl": "https://pbs.twimg.com/profile_images/1468993727926620161/I1lBhFJM_normal.jpg"}, "authorId": "390741977", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118373780292874240/img/XlN2NzAPDJpW299Q.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118373780292874240/img/XlN2NzAPDJpW299Q.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118373780292874240/vid/avc1/1920x1080/wQA81GN6E0eWLY51.mp4?tag=16", "durationMs": 29100}], "translationZh": "我烧了海量算力，替你们把测试做了。现在发布 Harness Leaderboard。\n\n你的开放模型该用哪个运行框架？我跑了 28,849 次试验来找答案。\n\n这份榜单比较了九款编程智能体运行框架在开放模型上的表现。每组对比只更换框架：模型、服务提供商和推理强度保持不变，每项任务都尝试三次。\n\n测试使用 GLM-5.3-Flash、DeepSeek-V4.1-Flash 和 Flint，在 Terminal-Bench 2.1 和 DeepSWE 上运行，共花费 4,746 美元推理费用。\n\n三个模型的平均结果显示，仅使用 bash 的智能体 mini-swe-agent（@KLieret）解决了 51.4% 的任务，@openclaw 则为 27.3%。另有四款框架与 mini-swe-agent 的成绩在统计上无显著差异。\n\n其中之一是 Pi（@pidotdev），任务解决率为 49.4%，每解决一项任务花费 0.29 美元，比 mini-swe-agent 的 0.53 美元低约 45%。\n\n最佳框架因模型而异：GLM-5.3-Flash 搭配 mini-swe-agent，DeepSeek-V4.1-Flash 搭配 Hermes Agent（@NousResearch），Flint 搭配 Kimi Code（@Kimi_Moonshot）。\n\n@opencode 每解决一项任务花费 3.35 美元，是 Pi 的 11.7 倍。\n\n想了解这九款框架有哪些不同，可以查看 Harness Hub 的 Harness Lens。它记录了 34 款编程智能体运行框架的提示词、工具和上下文压缩机制，每项说明都附有来源链接。\n\n榜单：https://t.co/AiWiQtBOz5\nHarness Lens：https://t.co/I8jbcWa9JH"}, "expert": {"priority": "P0", "domain": "开源模型 / Hugging Face", "name": "Thomas Wolf", "role": "Hugging Face / 联合创始人兼 CSO", "why": "Transformers 生态和开源模型讨论的重要人物", "handle": "Thom_Wolf"}, "createdAtIso": "2026-11-07T00:28:13+00:00", "createdAtBeijing": "2026-11-07T08:28:13+08:00", "createdAtLocal": "11-07 08:28 北京", "url": "https://x.com/Thom_Wolf/status/2118863053001531676", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2118863053001531676", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "编码Agent框架对照评测与榜单发布", "evidence": "I ran 28,849 trials to find out.", "rationale": "引文报告受控评测、解题率与成本并发布榜单"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "同一个开放模型，换个智能体运行框架 =&gt; 结果大不相同\n\nJoël 着手研究：在 2026 年 11 月，哪个运行框架最能发挥开放模型的能力"}, "avatar": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, {"id": "2118936056548688090", "track": "agent", "source": {"id": "2118936056548688090", "text": "Uber 的 Agent 安全实践：有权限执行，不代表符合用户本意\n\n来自 @UberEng 一如既往的优质分享：Uber 的内部安全体系 Secure AI，不只检查智能体有没有权限，还检查具体动作是否符合用户请求。它把上线前审查、运行时约束和持续测试结合起来，但没有公布量化防护效果。\nhttps://t.co/iyVjrkQAge\n\n为什么传统权限不够\n\n智能体会读取网页、文档、工具结果，再自行决定下一步。即使账号、工具和接口调用都合法，它仍可能被外部内容里的恶意指令带偏，执行用户根本没有要求的操作。\n\n因此，身份认证和授权之外，还需要回答：这个动作为什么发生，依据来自用户，还是来自不可信内容？\n\n三层防护怎么配合\n\n1. 上线前明确边界。 AI Registry 登记智能体的用途、负责人、允许的行为和风险等级；Argus 分析代码、提示词与工具调用路径，对照申报用途和实际能力。第三方工具、MCP 服务器和模型也要接受安全检查。\n\n2. 运行时核对动作。 AI Guard 结合用户请求、角色、会话上下文和智能体用途作判断，再由运行时组件执行。关键设计是把高权限动作追溯到用户实际提出的请求，防止网页或文档中的指令冒充授权。为控制延迟，Uber 使用本地小型专用模型，并行执行多项检查。\n\n3. 上线后持续校准。 系统追踪动作、工具调用和防护判断，通过历史交互回放测试新规则，再结合红队测试调整策略。提示词和回复仅在必要时保存，并采取敏感信息处理、访问限制和到期删除措施。\n\n难点不是检测，是取舍\n\n规则过严会拦住正常工作，过松又会漏掉攻击。Uber 采用先观察、不拦截的影子模式，并按不同智能体逐个校准，而不是依赖统一阈值。\n\n团队也承认：防护只能降低风险、提高攻击成本，对新型提示词注入的效果仍较难预测。全文没有公开拦截率、误拦率或延迟数据，因此应把它看作部署经验，不能当成有效性的完整证明。", "createdAt": "Sat Nov 07 05:18:18 +0000 2026", "replyCount": 14, "retweetCount": 0, "likeCount": 7, "conversationId": "2118936056548688090", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2118769501332463762", "text": "Securing AI Agents: Lessons From Real-World Deployment", "createdAt": "Fri Nov 06 18:16:28 +0000 2026", "replyCount": 23, "retweetCount": 91, "likeCount": 733, "conversationId": "2118769501332463762", "author": {"username": "UberEng", "name": "Uber Engineering", "profileImageUrl": "https://pbs.twimg.com/profile_images/1192909783856103427/6A4s8gW2_normal.png"}, "authorId": "2573880420", "article": {"title": "Securing AI Agents: Lessons From Real-World Deployment", "previewText": "Introduction\nAgentic AI introduces a fundamentally different security model from traditional software. Unlike conventional services that execute predefined logic, agents dynamically reason over", "titleZh": "保障 AI 智能体安全：来自实际部署的经验", "previewTextZh": "引言\n智能体 AI 引入了一种与传统软件截然不同的安全模型。传统服务执行预定义逻辑，而智能体会动态地进行推理，所依据的是……"}, "translationZh": "保障 AI 智能体安全：来自实际部署的经验"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWf5G3RbAAEuMfU.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWf5G3RbAAEuMfU.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-07T05:18:18+00:00", "createdAtBeijing": "2026-11-07T13:18:18+08:00", "createdAtLocal": "11-07 13:18 北京", "url": "https://x.com/shao__meng/status/2118936056548688090", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2118936056548688090", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Uber Agent 授权溯源与运行时防护", "evidence": "先观察、不拦截的影子模式", "rationale": "给出三层防护与校准方法，效果尚未量化"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119051833872466407", "track": "research", "source": {"id": "2119051833872466407", "text": "Google Research 发布「SLEEP」框架，和 Anthropic Dreaming 有明显区别：让模型在处理新任务之外，专门进行记忆巩固，把临时学到的信息写进长期参数，再通过自己生成的练习强化能力，同时减少对旧知识的覆盖。\n\nhttps://t.co/flh4ZTpotq\n\n不只延长上下文，要把知识留下来\n\n上下文学习能让模型临时掌握新信息，却不等于永久学会；直接持续微调，又容易学了新的、忘了旧的。\n\nSLEEP 因此让模型交替“清醒”和“睡眠”：清醒时处理输入、积累短期信息；睡眠时暂停接收新输入，把这些信息巩固到更稳定的参数中。这里确实涉及训练和权重更新，不只是保存聊天记录。\n\n怎样巩固，又不覆盖旧知识\n\n论文把巩固过程称为“知识播种”：启用预留的低秩专家参数，通过蒸馏等训练，把短期记忆迁移进去，再清空短期部分，为下一轮学习腾出空间。\n\n关键设计是给新知识安排新增参数，而不是直接改写承载旧知识的参数。 随后的“做梦”阶段，模型生成合成练习，筛选有价值的样本，再通过训练强化所学。它不仅复习已有输入，也尝试为自己构造练习。\n\n效果如何，与 Anthropic Dreaming 有何不同\n\n在依次学习满语、卡拉芒语的实验中，Google 报告 SLEEP 较好地保留了先前所学。以 Qwen3-8B 为基座，AIME 2024 的 avg@16 得分为 79.2%，对照的在线策略自蒸馏为 76.6%。\n\n代价是额外训练：同等训练步数下，计算开销约为普通监督微调的 4 倍。这些仍是特定模型与任务上的研究结果。\n\n与刚才的 Anthropic Dreaming 相比，区别很清楚：Anthropic 整理外部笔记和知识库；Google SLEEP 则尝试把所学写进模型参数。", "createdAt": "Sat Nov 07 12:58:21 +0000 2026", "replyCount": 10, "retweetCount": 2, "likeCount": 22, "conversationId": "2119051833872466407", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhiaEUbAAAuQMs.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWhiaEUbAAAuQMs.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-07T12:58:21+00:00", "createdAtBeijing": "2026-11-07T20:58:21+08:00", "createdAtLocal": "11-07 20:58 北京", "url": "https://x.com/shao__meng/status/2119051833872466407", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2119051833872466407", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "SLEEP模型记忆巩固与持续学习框架", "evidence": "启用预留的低秩专家参数", "rationale": "包含训练机制、实验对照、计算成本及适用限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2118857079427649699", "track": "agent", "source": {"id": "2118857079427649699", "text": "给技术文档检查时效性：从 PDF 提取关键说法，再用实时网页逐条核对\n\n来自 @Sumanth_077 的分享：先找出 PDF 里容易过期的接口、版本和模型信息，再联网核对，标记为「仍有效」「已过时」或「需复核」，并提供来源供人工判断。\nhttps://t.co/6H3lK3rrvc\n\n它解决什么问题\n\n技术文档不一定整篇失效，往往只是某个 API 路径、模型名称、价格或依赖版本已经变了。作者没有让 AI 直接重写全文，而是先定位这些容易变化的说法，再逐项检查，缩小人工审查范围。\n\n核心流程\n\n上传 PDF 后，LandingAI 的文档提取服务 ADE 将其转为保留结构的 Markdown，并抽取版本、API、配置、弃用提示和依赖等信息。\n\n程序去重后，把每条说法连同原句和上下文，分别交给 Parallel Decisions API。这个接口结合实时网页检索，在预设选项中作出判断，返回结论、概率和引用来源。证据不足或互相矛盾时，归入「需复核」，而不是强行判定。\n\n按项目说明，Parallel 收到的是抽取后的说法及简短上下文，不是整份 PDF；但 PDF 本身仍需交给 ADE 解析。\n\n演示结果\n\nSumanth 用一份旧 OpenAI API Beta 文档测试，抽出 12 条说法：7 条过时、1 条仍有效、4 条需复核。过时项包括旧的 Engines 路由、davinci 示例和历史价格。", "createdAt": "Sat Nov 07 00:04:28 +0000 2026", "replyCount": 11, "retweetCount": 0, "likeCount": 8, "conversationId": "2118857079427649699", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2118733680080457881", "text": "I built a document agent with a live web-grounded decision engine!\n\nDecision models like Jev are powerful, but they don’t have live context by default. They can only reason over what they learned during training and the context you give them at inference time.\n\nThat becomes a problem when you’re working with documents containing information that can change over time.\n\nAn API referenced in a document could have been deprecated, a package or model recommendation could be outdated, or an instruction that was correct when the document was written may no longer work today.\n\nSo I built an agent that checks these time-sensitive claims against the live web.\n\nI first use Agentic Document Extraction to parse the uploaded document while preserving its structure and content.\n\nFrom that extracted content, the agent identifies claims that are actually freshness-sensitive rather than sending every sentence for verification.\n\nFor each claim, it keeps the original statement and the surrounding document context, then turns the verification into a decision task for Parallel’s Decisions API.\n\nParallel searches the live web for evidence relevant to that specific claim and returns a grounded decision with supporting sources.\n\nThe agent then maps the result into one of three states:\n\n- VALID: current evidence still supports the claim\n- OUTDATED: newer evidence contradicts or supersedes it\n- NEEDS REVIEW: the available evidence is not strong enough to make a reliable call\n\nFor example, if an older document says:\n\n“Use API v1 for this integration.”\n\nthe verification request includes that claim and its document context. Parallel can search the current API docs, check whether v1 is still supported, and ground the decision in the latest sources it finds.\n\nThe final output keeps both sides together: the claim extracted from the original document and the current web evidence used to evaluate it.\n\nSo instead of treating a document as static context, the agent can reason about which parts of it may have drifted since it was written.\n\nGithub Repo: https://t.co/imsEHeUKdX\n\nThis can be useful across technical docs, research reports, internal knowledge bases, implementation guides, product documentation, policies, and other documents where some claims remain stable while others age quickly.", "createdAt": "Fri Nov 06 15:54:08 +0000 2026", "replyCount": 13, "retweetCount": 17, "likeCount": 68, "conversationId": "2118733680080457881", "author": {"username": "Sumanth_077", "name": "Sumanth", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777698745108606976/NH-IIitW_normal.jpg"}, "authorId": "1420290522728394757", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdAx7zaMAEAm-p.jpg", "width": 1450, "height": 1980, "previewUrl": "https://pbs.twimg.com/media/HWdAx7zaMAEAm-p.jpg:small"}], "translationZh": "我构建了一个文档智能体，搭载以实时网络信息为依据的决策引擎！\n\nJev 这样的决策模型很强大，但默认不具备实时上下文。它们只能依据训练时学到的知识，以及你在推理时提供的上下文进行推理。\n\n当文档包含可能随时间变化的信息时，这就成了问题。\n\n文档中提到的 API 可能已被弃用，推荐的软件包或模型可能已过时，写作时正确的操作说明，如今也可能不再适用。\n\n因此，我构建了一个智能体，通过实时网络信息核验这些有时效性的说法。\n\n首先，我使用 Agentic Document Extraction 解析上传的文档，同时保留其结构和内容。\n\n智能体从提取的内容中找出真正有时效性的说法，而不是把每句话都送去核验。\n\n对于每条说法，它会保留原文及周边文档上下文，再将核验转化为一项决策任务，交给 Parallel 的 Decisions API。\n\nParallel 会在实时网络上搜索与该说法相关的证据，并返回有据可依的判断及支持来源。\n\n随后，智能体将结果归为三种状态之一：\n\n- VALID：当前证据仍支持该说法\n- OUTDATED：更新的证据与其矛盾，或已取代原有信息\n- NEEDS REVIEW：现有证据不足以作出可靠判断\n\n例如，一份旧文档写道：\n\n“此集成请使用 API v1。”\n\n核验请求会包含这条说法及其文档上下文。Parallel 可以搜索当前的 API 文档，检查 v1 是否仍受支持，并根据找到的最新来源作出判断。\n\n最终输出会将两部分放在一起：从原始文档提取的说法，以及用于评估它的当前网络证据。\n\n这样，智能体就不再只是把文档当作静态上下文，而是能够判断哪些内容可能已随着时间推移而发生变化。\n\nGitHub 仓库：https://t.co/imsEHeUKdX\n\n这适用于技术文档、研究报告、内部知识库、实施指南、产品文档、政策等场景：这些文档中的一些说法长期有效，另一些则很快就会过时。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWexR4qbEAA-3Q3.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWexR4qbEAA-3Q3.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-07T00:04:28+00:00", "createdAtBeijing": "2026-11-07T08:04:28+08:00", "createdAtLocal": "11-07 08:04 北京", "url": "https://x.com/shao__meng/status/2118857079427649699", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2118857079427649699", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "文档时效性核查Agent", "evidence": "7条过时、1条仍有效、4条需复核", "rationale": "给出提取、联网核验、证据分级流程及演示"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119008378022461910", "track": "creative", "source": {"id": "2119008378022461910", "text": "深扒了《持械入宋》，我自己看了 6 季，非常好看。成功绝非偶然，也不是一句“AI 平权”就能说完的。我深入发现了几个细节。\n\n1. 主创张汉生 54 岁，2025 年 3 月才开始学 AI，之前多次创业失败，零影视经验。\n2. 前面近一年他靠接承制订单练手，团队做了近 40 部剧，流水剧时期一个月最多约 20 部，直到 2026 年 3–4 月自己做的两部剧分别破千万、破亿，才算真正打出来。\n3. 从这时候起他开始组建团队，队伍从 1 个人慢慢变成 3 个人，做第四部剧的时候变成 5 个人，思路也变了：不做流水剧了，做精品剧。\n4. 精品剧是怎么做出来的？先花半个月通读原著、多轮改剧本、打磨人设，先做 10 集内部确认方向对了，才大面积铺开。\n5. 考证下得非常细：官服什么品色、配饰、鞋履、户籍和路引、礼仪位次，还有剧里的医学知识、宋朝背景，全都查过。\n6. 他们还取消了穿越剧标配的“系统”，没有金手指，一个无穿帮的片段内部可能只有 60 分，没情绪就是废卡，第六季一场送葬戏，总导演做的时候自己哭了。\n7. 每做完一季，他们先看评论区、粉丝群和原著粉群的反馈，再决定下一季往哪里调。\n8. 团队 30 多人分散在广东、安徽、湖北、江西、福建、河北，全靠微信群加网盘协作，没办公室，没固定工资。\n9. 自 8 月上线走红以来，全员一次都没成功聚过，几个月前就想找个山清水秀的地方吃顿饭，一直没成行。\n10. 火了之后主创最怕被当成神话，张汉生说 AI 平权只是模型使用机会的平等，不会自动拉平故事判断，更不会替人完成长期练习。", "createdAt": "Sat Nov 07 10:05:41 +0000 2026", "replyCount": 137, "retweetCount": 101, "likeCount": 677, "conversationId": "2119008378022461910", "author": {"username": "FuSheng_0306", "name": "傅盛", "profileImageUrl": "https://pbs.twimg.com/profile_images/1990679395246485506/obc0Ox8O_normal.jpg"}, "authorId": "1858777028688039936", "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "傅盛", "role": "企业落地与产品组织实践与观察", "why": "连续记录购物、邮件、审批等真实 Agent 使用场景，业务覆盖有增量。", "handle": "FuSheng_0306"}, "createdAtIso": "2026-11-07T10:05:41+00:00", "createdAtBeijing": "2026-11-07T18:05:41+08:00", "createdAtLocal": "11-07 18:05 北京", "url": "https://x.com/FuSheng_0306/status/2119008378022461910", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2119008378022461910", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI短剧精品化制作与反馈迭代", "evidence": "先做10集内部确认方向对了，才大面积铺开", "rationale": "提供剧本打磨、考证、试制及观众反馈方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1990679395246485506/obc0Ox8O_normal.jpg"}, {"id": "2119060282752504023", "track": "creative", "source": {"id": "2119060282752504023", "text": "People often ask me how to use AI to design products that look good and don't feel like AI slop. It's not an easy question, since I'm not a professional designer, so I can only share it from a product engineer's point of view: how to make products that aren't ugly and are easy to use.\n\nFirst, one premise. A good-looking design can't save a product that doesn't solve a problem. Design is the icing on the cake, not what decides whether a product succeeds. If I had to rank priorities, it would be: solves a problem > easy to use > looks good. It's like food: first don't go hungry, then get enough to eat, then eat well.\n\nI won't say much about solving the problem, since that depends on the product itself. It solves a concrete need: someone needs it, there's a real scenario for it, and your product happens to offer a way for a person or an agent to get it done. Some problems are just bigger than others.\n\nSo how do you make a product that's easy to use and not ugly? Ha, you can walk through the list below yourself, or hand the whole thing to your agent and have it review your product's codebase.\n\n1. Pretend you're an ordinary user who knows nothing about tech. Can they get through the main flow and come out with what they need? Find every place where they get stuck, where something isn't explained, or where one step doesn't lead naturally into the next, and fix all of it, so people can use the product without a manual. Only where that's truly impossible, add a short hint.\n\n2. Every piece of copy should read the way native speakers of that language actually talk. Choose your words carefully instead of translating flatly. Look at how Apple, Windows and well-known websites word the same thing, and aim for copy that feels simple, clear and natural to a local.\n\n3. Where the product itself already makes something clear, don't add text to explain it. Don't over-explain. Check every line of helper text for whether it says what it means without padding, and if the interaction or the visuals already say it, don't say it again in words.\n\n4. When you show a number, make sure people know what it refers to, and make it easy to read for what it means. Money, metrics, distance and other units each have their own best practices. Accuracy matters a lot, so don't skip validating the data to save effort.\n\n5. Don't keep asking users to confirm something they already chose. Ask a second time only when an action can't be undone, so the screen isn't full of confirmation dialogs. Don't splash big red areas over dangerous actions either. Think about how pleasant the product feels to use. Users aren't stupid, so don't worry too much about them making mistakes.\n\n6. Visually, keep one accent color per page. Try to avoid orange, terracotta, and the bright corporate blue of old admin dashboards. Make every gray a warm gray, never a cold blue-gray. If you can't find a good color, look through traditional Chinese colors.\n\n7. Use as few font sizes as possible, at most four on a page. Think about the reading rhythm of the whole page, its clarity and text contrast, and make sure it meets accessibility standards. Line height, letter spacing and paragraph spacing all need repeated tuning, while the whole system stays consistent.\n\n8. Use italics, monospace and all caps sparingly, and only with a clear reason. No italics for helper text, monospace only for code, paths and metrics, and no all-caps text in buttons or labels. Go easy on joining things with a middle dot (·). Use one verb for one action across the whole product, and avoid verbs that push people to act, like the marketing-style \"Buy now\".\n\n9. Keep buttons, spacing, corner radius, dividers, dialogs, animation and shadows consistent and restrained, so they don't get in the user's way. Nested rounded corners should be concentric: the inner radius equals the outer radius minus the padding between them, and it looks better. Pages are flat by default: no stacked shadows, no glow, no frosted glass. Shadows are only for dialogs that really float above the page, and no cards inside cards.\n\n10. In a multilingual product, lay things out for the longest translation first, and put meaning before looks rather than changing what the text says to make it fit. You can rewrite the copy, but don't change the font size or truncate it. Check that everything displays well at different sizes on the devices your users actually use, test them all, and fix everything that looks off.\n\n11. For a design you keep tweaking without getting it right, or one that still looks off after many rounds, ask your agent for the three options it thinks are best and pick one, then tell it to keep refining until you're happy. I like having AI put before-and-after images into one PDF, which makes comparing them much easier for me.\n\nThat's about it. One more thing matters a lot, though: your own patience and willingness to keep iterating. I'm a bit of a perfectionist, and I often go a dozen rounds with AI over a single line of copy, a color or a design until I'm happy with it. AI is smart, but you often need to ask more of it, and put in more time and patience to get a result you like. Or put another way, spend more time and look at more good design, and you can build products that are easy to use and not ugly.", "createdAt": "Sat Nov 07 13:31:56 +0000 2026", "replyCount": 6, "retweetCount": 6, "likeCount": 108, "conversationId": "2119060282752504023", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-07T13:31:56+00:00", "createdAtBeijing": "2026-11-07T21:31:56+08:00", "createdAtLocal": "11-07 21:31 北京", "url": "https://x.com/HiTw93/status/2119060282752504023", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2119060282752504023", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI辅助产品设计检查清单", "evidence": "at most four on a page", "rationale": "提供交互、文案、视觉与多语言迭代方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "经常有人问我，如何用 AI 设计出好看、又没有廉价 AI 感的产品。这个问题不容易回答，因为我不是专业设计师，只能从产品工程师的角度分享：怎样做出不难看、又好用的产品。\n\n先说一个前提。好看的设计救不了一个无法解决问题的产品。设计是锦上添花，不是决定产品成败的关键。如果让我排优先级，那就是：解决问题 > 好用 > 好看。就像吃饭，先别挨饿，再吃饱，最后吃好。\n\n解决问题这点就不展开了，因为它取决于产品本身。产品要满足一个具体需求：有人需要，有真实场景，而你的产品恰好提供了一种方式，让人或智能体把事情办成。只是有些问题比另一些更重要。\n\n那么，怎样才能把产品做得好用又不难看？哈，你可以自己逐项检查下面这份清单，也可以把它全部交给智能体，让它审查你的产品代码库。\n\n1. 假装自己是一个完全不懂技术的普通用户，看看能否走完主要流程，得到需要的结果。找出所有卡住的地方、没有解释清楚的地方，以及步骤之间衔接不自然的地方，并一一修好，让用户不用看说明书也能使用产品。只有实在做不到时，才加一句简短提示。\n\n2. 所有文案都应该符合该语言母语者的日常表达。仔细斟酌用词，不要生硬直译。看看 Apple、Windows 和知名网站如何表达同样的意思，让文案在本地用户看来简单、清楚、自然。\n\n3. 产品本身已经表达清楚的事情，就不要再加文字解释。别过度说明。检查每一句辅助文案，看看是否准确直接、没有赘述；如果交互或视觉已经传达了意思，就不要再用文字重复。\n\n4. 展示数字时，要让用户知道它指什么，并根据其含义选择易读的呈现方式。金额、指标、距离等不同单位，各有适合的表达规范。准确性非常重要，不要为了省事而跳过数据校验。\n\n5. 不要反复让用户确认已经作出的选择。只有操作无法撤销时，才进行二次确认，别让界面充斥确认弹窗。危险操作也不必铺上大块红色。多考虑使用体验是否舒适。用户并不笨，不必过分担心他们会出错。\n\n6. 视觉上，每页只保留一种强调色。尽量避开橙色、陶土色，以及老式后台常见的鲜亮企业蓝。所有灰色都用暖灰，不用偏冷的蓝灰。找不到合适的颜色，可以看看中国传统色。\n\n7. 尽量减少字号种类，一页最多四种。考虑整页的阅读节奏、清晰度和文字对比度，并确保符合无障碍标准。行高、字距和段间距都需要反复调整，同时保持整个系统一致。\n\n8. 少用斜体、等宽字体和全大写，使用时要有明确理由。辅助文案不用斜体，等宽字体只用于代码、路径和指标，按钮和标签不用全大写。少用间隔号（·）连接内容。整个产品中，同一个操作统一使用同一个动词，避免使用“立即购买”这类催促用户行动的营销措辞。\n\n9. 按钮、间距、圆角、分隔线、对话框、动画和阴影都要一致、克制，不要妨碍用户。嵌套圆角应保持同心：内层圆角半径等于外层圆角半径减去两者之间的内边距，这样更好看。页面默认采用扁平设计：不叠加阴影、不发光、不用毛玻璃。只有确实悬浮在页面上方的对话框才使用阴影，也不要在卡片里再套卡片。\n\n10. 多语言产品先按最长的译文设计布局，优先保证含义完整，不要为了好看或塞进空间而改变原意。可以改写文案，但不要缩小字号或截断文字。在用户实际使用的设备上，检查不同尺寸下的显示效果，逐一测试，修好所有不协调的地方。\n\n11. 如果一个设计怎么调都不对，或者改了很多轮还是别扭，就让智能体给出它认为最好的三个方案，从中选一个，再让它继续打磨，直到你满意。我喜欢让 AI 把修改前后的图片放进同一份 PDF，这样比较起来方便得多。\n\n大致就是这些。不过，还有一点很重要：你自己的耐心，以及持续迭代的意愿。我有点完美主义，经常为了某一句文案、某个颜色或某个设计，和 AI 来回改十几轮，直到满意。AI 很聪明，但要得到喜欢的结果，往往需要你提出更高要求，投入更多时间和耐心。换句话说，多花时间，多看好设计，你也能做出好用又不难看的产品。"}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2119080693233754506", "track": "agent", "source": {"id": "2119080693233754506", "text": "全体起立，Vercel推出的agent-desktop现在才是Agent操控电脑的真神。\n\n它是 Vercel Labs 的开源项目，Apache-2.0 协议，GitHub 已经有 1.8 万 star，仓库地址在下面\n\n它是一个命令行工具，让 Claude Code、Codex 这类 Agent 直接操作你电脑上的 App：点按钮、填表单、打字、切菜单、读界面。\n\n之前大部分 Computer Use 的做法是截图，再让模型猜该点哪个坐标。慢，还容易点歪。\n\nagent-desktop 不截图。它直接读系统的无障碍树（就是读屏软件用的那套接口），给界面上每个按钮、输入框编一个号，Agent 按编号去点、去输入。\n\n最关键的一点：它默认不动你的鼠标，也不把窗口切到前台。\n\nAgent 在后台操作电脑的时候，你可以照常刷微信、写东西，两边互不干扰。真要用物理鼠标键盘时，再加 --headed。\n\n我在自己的 Mac 上实测了一轮：\n\n- 打开系统设置，读完整个界面 0.3 秒左右\n- 点击「蓝牙」0.17 秒，页面切过去了，设备列表也读出来了\n- 给不在前台的文本编辑输入一段中英文加数字，0.15 秒，读回来一字不差\n- Electron 写的 App 也能读，侧栏、对话列表的文字都拿得到\n- 整个过程我一直在用微信，前台一次都没被抢\n\n我原来用 LCU，它要借 ChatGPT 桌面端里面的运行时，ChatGPT 一更新就可能坏，也卡过。今天卸了，换成 agent-desktop。\n\n几个让我决定换的点：\n\n1. 不依赖任何 App，npm 一装就能用\n2. macOS（Intel 和 M 芯片）、Windows、Linux 都支持\n3. 自己不带模型，任何能跑命令的 Agent 都能用，也可以当 MCP 服务接进去\n4. 60 个命令，窗口管理、剪贴板、通知、菜单栏都包了\n\n安装就两步：\n\nnpm install -g agent-desktop\nagent-desktop permissions --guide\n\n第二条在 Mac 上会一步步引导你打开辅助功能权限。\n\n然后在 AGENTS.md 或 CLAUDE.md 里加一句：\n\nUse `agent-desktop` to see and operate desktop apps. Before the first use, run\n`agent-desktop skills get desktop` and `agent-desktop skills get platform`, and follow them.\n\n你的 Agent 就会用了。\n\n仓库：https://t.co/LqimXMvIZ6\n\n实测截图👇", "createdAt": "Sat Nov 07 14:53:02 +0000 2026", "replyCount": 35, "retweetCount": 68, "likeCount": 524, "conversationId": "2119080693233754506", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWh8H09bgAEtMMv.jpg", "width": 2048, "height": 842, "previewUrl": "https://pbs.twimg.com/media/HWh8H09bgAEtMMv.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "雪踏乌云", "role": "内容、视觉与多模态实践与观察", "why": "具体拆出海运营、流量监控和自媒体 Bot 职责，跨场景实操价值高。", "handle": "Pluvio9yte"}, "createdAtIso": "2026-11-07T14:53:02+00:00", "createdAtBeijing": "2026-11-07T22:53:02+08:00", "createdAtLocal": "11-07 22:53 北京", "url": "https://x.com/Pluvio9yte/status/2119080693233754506", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2119080693233754506", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "agent-desktop桌面操作工具实测与接入", "evidence": "给不在前台的文本编辑输入一段中英文加数字", "rationale": "提供安装接入方法及作者自述的后台操作实测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, {"id": "2118973728902283468", "track": "agent", "source": {"id": "2118973728902283468", "text": "Claude 正在改登录，另一个任务要修分页，自己又想拉下同事的 PR 看一眼。\n\n如果都在同一个目录里操作，切分支会打断上下文，未提交的修改可能混在一起，开发服务器也不知道该跑哪一份代码。\n\nGit 其实早有一个适合解决这类问题的功能：worktree。\n\n它基于 Git 自带的 worktree 功能，给每个开发任务创建独立的工作目录。\n\n比如一个目录交给 Claude Code 写功能，另一个交给 Codex 修 Bug，两个 Agent 可以同时干活，互不覆盖对方的文件。\n\n操作也很简单，输入 wt switch -c -x claude feature-auth，就能创建一个新的工作区并启动 Claude Code。\n\n通过 wt list，还能统一查看各个分支的修改状态、提交情况，配置插件后甚至能看到 Agent 正在工作还是等待输入。\n\n我觉得比较实用的还有它的 Hooks 机制。可以提前配置好环境变量复制、依赖安装、开发服务器启动、合并前测试等操作。\n\n以后新建一个工作区，环境就能按规则自动准备好，不用每次手动折腾。任务完成后，还可以通过 Worktrunk 管理合并和清理流程。\n\n当然，它不是一个多 Agent 调度平台，也不会自动隔离数据库和端口，这些还需要自己配置。\n\n但对于经常同时开几个 AI 编程任务的人来说，确实能省掉不少管理工作区的麻烦。", "createdAt": "Sat Nov 07 07:48:00 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 1, "conversationId": "2118973728902283468", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2080546263301571004", "text": "用 Codex、Claude Code 写代码，发现很多人都会遇到一个问题：\n同时开了几个 AI Agent，效率没提高多少，代码倒先打起来了。\n\n这个 Agent 在改登录，另一个在修支付，还有一个刚执行完格式化。几个人同时操作一个目录，文件、分支和未提交代码很容易互相影响。\n\n其实 Git 里早就有一个功能，特别适合 AI 编程：Git Worktree。\n\n简单理解：Branch 是不同的任务路线，Worktree 是每条路线对应的独立工位。\n\n普通开发时，我们只有一个代码目录。想切换任务，需要提交代码、stash、切分支，然后再切回来。\n\n用了 Worktree 之后，同一个 Git 仓库可以同时拥有多个独立目录：\n一个目录开发支付功能；\n一个目录修线上 Bug；\n一个目录交给 Codex 重构代码；\n一个目录用来测试其他人的 PR。\n\n它们共享 Git 提交记录，但拥有各自的分支、文件和暂存区，互相不会覆盖。", "createdAt": "Fri Jul 24 06:50:58 +0000 2026", "replyCount": 45, "retweetCount": 1, "likeCount": 9, "conversationId": "2080546263301571004", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN-VyqraMAAAeyH.jpg", "width": 1199, "height": 675, "previewUrl": "https://pbs.twimg.com/media/HN-VyqraMAAAeyH.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN-Vykoa0AA5RMN.jpg", "width": 1199, "height": 675, "previewUrl": "https://pbs.twimg.com/media/HN-Vykoa0AA5RMN.jpg:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118233408828764160/img/MqYL5e9vE1zTVv7v.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118233408828764160/img/MqYL5e9vE1zTVv7v.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118233408828764160/vid/avc1/1920x1080/V76A1gaJhqfIP2jH.mp4?tag=29", "durationMs": 223533}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-07T07:48:00+00:00", "createdAtBeijing": "2026-11-07T15:48:00+08:00", "createdAtLocal": "11-07 15:48 北京", "url": "https://x.com/sitinme/status/2118973728902283468", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2118973728902283468", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "用 Worktrunk 和 Git worktree 隔离并行开发任务", "evidence": "通过 wt list，还能统一查看各个分支的修改状态", "rationale": "给出工作区命令、自动化配置与隔离边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118900054526447905", "track": "agent", "source": {"id": "2118900054526447905", "text": "为了能让Skill能在真实任务中不断自我迭代，我在几个月前就在Agent.md和Claude.md中加入了这段专属于Skill的提示词：\n\n## Skill 使用复盘\n\n- 在完成整个任务后，简短复盘本次实际使用的 Skill。\n- 只有发现可归因于 Skill 的实际阻碍、重复补救或明确缺失时，才在最终答复中说明涉及的 Skill、具体问题、本次证据和改进建议，最多三项，并询问用户是否需要优化。\n- 没有明确问题时无需反馈；不得为了复盘打断或延迟任务；未经用户授权不得修改 Skill。\n\n好处就是：\n1、不需要隔一段时间做一次大的复盘，每次对话结束都会自动触发“优化机制”。\n\n2、所有Skill进化的依据都是真实任务中猜到的坑，和自己的工作任务适配更加丝滑。\n\n3、如果是开源的Skill，还可以加上自动提交Github，这样子每天的GitHub都能打卡成功✌️", "createdAt": "Sat Nov 07 02:55:14 +0000 2026", "replyCount": 31, "retweetCount": 22, "likeCount": 217, "conversationId": "2118900054526447905", "author": {"username": "gengdaJ", "name": "逸尘", "profileImageUrl": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, "authorId": "1897545708770840576", "quotedTweet": {"id": "2118496604391178314", "text": "Skill 自迭代能力改造指南\n\n【使用方式】\n将本指南完整复制给能够访问、编辑你的 Skill 文件的 Agent（如 Claude Code、Codex），并告诉它需要改造的 Skill 路径。\nAgent 应先阅读现有文件并提供简要诊断，再与用户确认标准，最后实施改造。\n\n【改造目标】\n请帮我检查并改造现有 Skill，让它从一份依赖 AI 理解和执行的操作说明，逐渐变成一套：\n\n• 结构清晰\n• 工具可靠\n• 结果可验证\n• 能够根据反馈持续改进的工作系统。\n\n请遵循以下步骤。\n\n【第一步：理解现有 Skill】\n\n先阅读 Skill 及其关联文件、脚本和参考样例，梳理：\n\n1. 工作地图（参考 Feature Map）\n   任务目标、执行步骤、输入输出、依赖关系、关键分支。\n\n2. 工具能力（参考 CLI）\n   哪些操作已经有工具支持？哪些重复、确定性的步骤值得封装成工具？\n\n3. 验证机制\n   目前如何判断任务完成、结果正确？哪些要求只有文字说明，没有实际检查？\n\n4. 反馈机制\n   用户指出错误后，如何修正？能否避免同类问题再次发生？\n\n尽量保留已有的有效设计，不要为了重构而重构。\n\n【第二步：与用户确认验收标准】\n\n先根据现有 Skill 提出你理解的标准，再向用户确认。重点询问：\n\n1. 好结果是什么样的？\n   哪些要求必须满足，哪些只是偏好？\n\n2. 最不能接受什么错误？\n   过去有哪些反复出现的问题？\n\n3. 哪些环节必须人工确认？\n   哪些可以放心交给 Agent 自动执行？\n\n交互要求：\n• 优先从现有文档、历史反馈和样例中寻找答案。\n• 只问缺失或模糊的关键问题，每轮最多 3 个。\n• 不要让用户重新解释已有的信息。\n\n【第三步：实施改造】\n\n根据诊断结果，按需实施：\n\n1. 结构化\n   建立简洁的工作地图，让 Agent 理解任务、步骤、依赖和验收条件。\n\n2. 工具化\n   把重复、确定性的操作封装成可复用工具。需要时提供统一 CLI 入口，不强制所有 Skill 都开发 CLI。\n\n3. 可验证\n   把明确要求转化成自动检查，记录检查对象、结果和证据。内容变化后，相关验证应重新执行；语义、审美等主观判断保留人工复核。\n\n4. 可改进\n   建立反馈记录，优先把错误转化为认可样例、程序检查或工具修复，必要时再更新 Skill 说明。区分单次要求与长期规则，避免规则无限膨胀。\n\n【第四步：测试与交付】\n\n• 使用已有样例进行回归测试，条件允许时再增加真实任务测试。\n• 对比改造前后的结果，确保原有重要功能没有退化。\n• 未经用户确认，不覆盖重要原始文件或正式交付结果。\n• 明确区分四类状态：\n   1. 自动验证通过\n   2. AI 评估通过\n   3. 人工确认通过\n   4. 尚未验证\n\n最后简要说明：\n\n1. 改造了什么，为什么？\n2. 哪些问题现在可以自动检查？\n3. 哪些问题仍然需要人工判断？\n4. 以后用户提出反馈时，如何进入下一轮改进？\n\n【核心原则】\n\n• 优先解决真实问题，不追求复杂架构。\n• 优先修改工具、检查和好样例，而不是不断增加提示词。\n• 没有证据，不宣称验证通过。\n\n【开始执行】\n请先阅读现有 Skill，给出简要诊断；不要立即大规模重构。", "createdAt": "Fri Nov 06 00:12:04 +0000 2026", "replyCount": 80, "retweetCount": 71, "likeCount": 561, "conversationId": "2118496604391178314", "author": {"username": "xiaohuiyuan", "name": "晓辉博士", "profileImageUrl": "https://pbs.twimg.com/profile_images/2104730034305126400/Z6AEYMq9_normal.jpg"}, "authorId": "1323768907"}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "逸尘", "role": "企业落地与产品组织实践与观察", "why": "公开商铺调研、评论、博主触达及邮件的 AI 增长工作流。", "handle": "gengdaJ"}, "createdAtIso": "2026-11-07T02:55:14+00:00", "createdAtBeijing": "2026-11-07T10:55:14+08:00", "createdAtLocal": "11-07 10:55 北京", "url": "https://x.com/gengdaJ/status/2118900054526447905", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2118900054526447905", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "基于真实任务反馈迭代 Skill", "evidence": "只有发现可归因于 Skill 的实际阻碍", "rationale": "提供可复用复盘提示词、改造步骤与验证原则"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, {"id": "2118921505841303752", "track": "creative", "source": {"id": "2118921505841303752", "text": "全场起立，超级强烈推荐这个超分项目！\n\n同一组视频做超分，原来得苦等将近 18 分钟，换成 FlashVSR+ Turbo（TC2）不到 8 分钟就跑完了，速度是原来的 2.3倍，头发、胡须和衣服纹理居然还更清楚！\n\n我刚拿同一张 4090 测了我们当前流程里的三段 10.3 秒H3 视频，统一从 720p 放大到 2560×1440（1440p），实测结果让我一下惊呆了：\n\n     1、耗时直接减少约 57%：排除排队时间（Turbo 模型加载另计），SeedVR2 7B INT8 跑完用了 17 分 58 秒，换成 FlashVSR+ Turbo（TC2）只用了 7 分 48\n      秒，省下一半多时间。\n\n     2、人物近景质感更分明：看视频里的人物近景，原先偏柔和的胡须、发丝和衣服纹理，换成 Turbo 之后更清晰利落。Base 版我也对比了，要多花约 20%的时间，画质差距却不大，这部片子后续我直接选了 Turbo。\n\n     3、单卡 4090 就能跑 4K，且全开源：它底层用局部和稀疏全局注意力减少计算，再用奖励引导蒸馏改善画质。代码、权重全部开放，官方展示单张 24GB 4090 就能直接处理 4K。\n\n底下是我们当前流程的三段四画面实测，拼成四宫格后单格缩到了 1280×720，细节提升不如 2560×1440\n \n地址我放评论区，另外超分新增的纹理如何，大家可以直接看视频对比👇", "createdAt": "Sat Nov 07 04:20:29 +0000 2026", "replyCount": 17, "retweetCount": 6, "likeCount": 81, "conversationId": "2118921505841303752", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2118790678532833739", "text": "卧槽，ARTEX 这个 AI 渗透框架，已经被黑客拿来批量攻击了！\n一个控制端，11 天，对 14 个国家、200 多家机构下手。\n\n谷歌/Mandiant、CrowdStrike、微软接连披露同一款工具：ARTEX，一个本来给白帽做渗透测试的 AI 框架，现在被黑客拿来当武器。\n\n· 谷歌：它 23 秒内连发 27 次操作，逐个摸清 AWS 权限\n· CrowdStrike：一个控制端，11 天，同时
