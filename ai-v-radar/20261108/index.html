vant": true, "dailyGrade": "B", "channel": "creative", "topic": "视频超分模型同卡对比实测", "evidence": "只用了 7 分 48", "rationale": "提供硬件、样本与耗时对比，属作者自测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2119056100565946630", "track": "tools", "source": {"id": "2119056100565946630", "text": "还记得那个开源完 Photoshop 又去开源 Office 全家桶的 @get_artcraft 吗？他们把看家的逆向开源本事开源了！\n\nCraft Anything：先研究，再构建，让 AI 仿写有依据、能检查\nhttps://t.co/nKgS8B6bN0\n\n不只描述需求，还给 Agent 提供依据\n\n用户指定目标后，工具先收集外观、布局和行为等信息，再交给编码 Agent 构建自己的版本。网页检查会覆盖三种屏幕宽度，帮助发现成品与参考对象的差异，而不是写完代码就结束。\n\n项目提供 300 多个工具，同时支持命令行和 MCP 接口，因此也可以作为其他 Agent 的研究工具箱，而不必只通过它的界面使用。\n\n两种研究模式，区分外观参考与内部分析\n\n默认的“净室模式”只使用外部可见信息，例如截图、可见文字和布局。代码中设有工具白名单，限制读取目标内部实现。\n\n“深度模式”则可以分析代码、文件和网页脚本。两种模式的区别，是把“参考产品表现”和“研究内部实现”分开；不过，这种技术划分不等于自动解决版权或授权问题。\n\n构建依赖什么，成熟到哪一步\n\n目前明确的构建路径，是调用本机已登录的 Claude Code，费用由用户自行承担；图片和 3D 生成另需 @fal 密钥。项目采用 MIT / Apache-2.0 双许可。\n\nCodex 等其他 Agent 虽有适配代码，项目文档仍注明尚未完成真实环境验证，大家可以自行尝试。", "createdAt": "Sat Nov 07 13:15:19 +0000 2026", "replyCount": 11, "retweetCount": 0, "likeCount": 12, "conversationId": "2119056100565946630", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhmP_WacAEEhMP.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWhmP_WacAEEhMP.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-07T13:15:19+00:00", "createdAtBeijing": "2026-11-07T21:15:19+08:00", "createdAtLocal": "11-07 21:15 北京", "url": "https://x.com/shao__meng/status/2119056100565946630", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2119056100565946630", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Craft Anything开源研究与仿写工具", "evidence": "项目提供 300 多个工具", "rationale": "介绍开源工具、研究模式、构建依赖及验证限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119200761460719835", "track": "agent", "source": {"id": "2119200761460719835", "text": "some takes on DeepSeek Harness (dsh): i've been using it for a few days, and i'm also a heavy user of pi and cc:\n- a clean install of dsh gives better results than a clean install of pi, because dsh ships with many built-in plugins already and set them on by default.\n- the \"agent teams\" plugin is a must-have (it's off by default); it's something pi lacks and is similar to what ultra mode does in cc.\n- i'd call dsh an IDE or even OS, especially with its creator mode. you can really turn dsh into a superapp that becomes your go-to place for productivity, entertainment, and management. the default dsh looks super dry and minimal but i see people customize its look & features to make it theirs. i like the recent trend toward highly customizable UIs; in fact, that's what i've been doing with pi and similar tools over the last few months — building a daily IDE that fits my habits and tastes. opinionated UI is not dying, but struggling in 2026 i say.\n- dsh's best UX is in the GUI, not the terminal (unlike pi), and you can also access dsh remotely from mobile — something pi doesn't offer out of the box. if you use cc's /remote-control a lot on mobile and web, dsh is comfortable enough to switch to.\n- pi is still useful for research purposes: if you want to study model/harness behavior in a strictly controlled environment and toolset, dsh also has a minimal mode, but it doesn't feel minimal enough to me. pi's interface is also faster and leaner if you want to manage multiple sessions yourself.\n- dsh doesn't have an official or verified plugin store, which could be a security issue when people eagerly search for and install 3p plugins and bring malicious prompts into the host, especially given the hype around it these days.", "createdAt": "Sat Nov 07 22:50:09 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 2, "conversationId": "2119200761460719835", "author": {"username": "hxiao", "name": "Han Xiao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, "authorId": "28969465", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWjiqTAa0AA0tCv.jpg", "width": 2048, "height": 1305, "previewUrl": "https://pbs.twimg.com/media/HWjiqTAa0AA0tCv.jpg:small"}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "肖涵 Han Xiao", "role": "模型、研究与推理实践与观察", "why": "有端侧检索、ANE/GPU 对比与资源取舍，兼顾研究和真实产品。", "handle": "hxiao"}, "createdAtIso": "2026-11-07T22:50:09+00:00", "createdAtBeijing": "2026-11-08T06:50:09+08:00", "createdAtLocal": "11-08 06:50 北京", "url": "https://x.com/hxiao/status/2119200761460719835", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2119200761460719835", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "DeepSeek Harness 使用比较与插件风险", "evidence": "the \"agent teams\" plugin is a must-have", "rationale": "自述实测比较插件、界面与研究适用性"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "关于 DeepSeek Harness（dsh）的一些看法：我用了几天，同时也是 pi 和 cc 的重度用户：\n- 全新安装的 dsh 比全新安装的 pi 效果更好，因为 dsh 自带许多内置插件，而且默认启用。\n- “agent teams”插件必装（默认关闭）；pi 缺少这项能力，它类似于 cc 的 ultra 模式。\n- 我会把 dsh 称为 IDE，甚至是操作系统，尤其是有了它的创作者模式之后。你确实可以把 dsh 打造成一个超级应用，让它成为你处理生产力、娱乐和管理事务的首选入口。默认的 dsh 看起来非常朴素、极简，但我看到不少人通过定制外观和功能，把它变成自己的工具。我喜欢最近这种高度可定制界面的趋势；事实上，过去几个月我一直在用 pi 等工具做这件事——打造一个符合自己习惯和审美的日常 IDE。我觉得，预设设计理念的 UI 在 2026 年还没消亡，但日子并不好过。\n- dsh 的最佳体验在 GUI，而非终端（这点与 pi 不同），而且还能从手机远程访问——pi 开箱即用时并不提供这项功能。如果你经常在手机和网页上使用 cc 的 /remote-control，切换到 dsh 应该也会很顺手。\n- pi 在研究用途上仍然很有价值：如果你想在严格受控的环境和工具集中研究模型或运行框架的行为，虽然 dsh 也有极简模式，但我觉得还不够精简。如果你想自己管理多个会话，pi 的界面也更快、更轻便。\n- dsh 没有官方或经过验证的插件商店。考虑到它最近的热度，用户争相搜索、安装第三方插件，可能将恶意提示词带入宿主环境，这会带来安全隐患。"}, "avatar": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, {"id": "2119108669392720336", "track": "agent", "source": {"id": "2119108669392720336", "text": "如果你打算用 GPUI 之前可以看看这篇", "createdAt": "Sat Nov 07 16:44:12 +0000 2026", "replyCount": 17, "retweetCount": 3, "likeCount": 24, "conversationId": "2119108669392720336", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2112552063640997984", "text": "感谢分享，我说一下我在上一个版本 baocut 用 GPUI 踩的坑。\n\nGPUI 挺好的，性能好，跨平台，AI 友好，但也有坑：\n1. UI 复杂一点的话大概率你要 fork 一份改一下，有些功能原生支持不了，但也不是大问题\n\n2. Accessibility 支持不太好，要支持一些键盘操作会比较麻烦（也可能我用法不对）\n\n3. Rust 编译资源消耗很大\n每次编译，无论是 CPU 占用还是磁盘占用，都巨大，对于我这样用 Mac Mini M4 16G + 1T 硬盘的来说简直太痛苦了，不敢并行多开编译任务，磁盘空间永远不够用（后来我把编译结果默认放到移动硬盘缓解了一点）\n\n4. 编译时间很长，不支持热更新。\n这点很要命，这意味着你如果改一点 UI 代码，要重新编译，然后要等少则几分钟多则十几分钟，这时间无论对于 agent 还是对于人来说都是很大的时间成本，加上不能随便多任务，会拖慢你的开发速度\n\n5. agent 验证 UI 不算太友好\ncodex、claude code 都可以借助 computer use 去验证 GPUI 的结果，但一个是慢，另一个相对成本也不低。\n\n---\n\n后来我之所以换回 Electron，就是因为 Electron App 对于 Agent 相对友好，编译快、热更新，UI 改动很快看到效果，然后 Electron App 还能跑到 agent 内置的浏览器中，agent 验证起来很快，都不需要用 computer use 去打开 electron app。\n\n至于网页渲染性能不够好的问题，我把原来一些需要复杂渲染的部分，都用 rust 编译成了 wasm，这样在浏览器运行也可以保证高性能。\n\n以前 rust 做的转录、tts 模块也都以 worker 进程的形式保留下来了，electron 需要用到的时候可以直接起 rust 编译出来的进程（Codex 也是类似），和这些进程通信，后台的性能也比纯 TypeScript + Node 要好不少。\n\n有兴趣的话可以看代码库：https://t.co/aON4AditbU", "createdAt": "Tue Oct 20 14:30:35 +0000 2026", "replyCount": 26, "retweetCount": 9, "likeCount": 119, "conversationId": "2112552063640997984", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-07T16:44:12+00:00", "createdAtBeijing": "2026-11-08T00:44:12+08:00", "createdAtLocal": "11-08 00:44 北京", "url": "https://x.com/dotey/status/2119108669392720336", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2119108669392720336", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "GPUI迁移Electron的工程复盘", "evidence": "把原来一些需要复杂渲染的部分，都用rust编译成了wasm", "rationale": "引用完整踩坑复盘，包含架构取舍与迁移方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2118871055360303354", "track": "agent", "source": {"id": "2118871055360303354", "text": "DeepSeek 刚提出 Super-agent，LangChain 又发布了《Agents Are Going Async》，两篇文章放在一起看，感觉 Agent 的架构正在发生一个很重要的变化。\n\n现在 Agent 越来越能干，但执行一个长任务时，人经常还得盯着 Session，等它跑完才能继续安排工作。\n\nLangChain 在 Deep Agents 中引入了 Async Subagents，给出了一套很具体的解决方案。\n\n主 Agent（Orchestrator）负责和用户交互，耗时任务交给后台 Subagent，每个任务都有独立的 Thread，启动后立即返回，不会一直阻塞主 Agent。\n\n更实用的是，任务跑起来后依然可以控制。\n\n比如 Coding Agent 正在修改代码，你突然想换个技术方案，主 Agent 可以把新指令发给后台任务，选择中断重跑，或者等当前工作完成后再执行。\n\n还有个我挺喜欢的工程细节。\n\nLangChain 把后台任务状态单独保存，避免 Context 压缩后丢失任务记录。任务完成后还能主动通知主 Agent，即使主 Agent 正在处理其他工作，或者等待人工审批，也有对应的处理机制。\n\n这和 DeepSeek 的 Super-agent 思路很接近。区别在于，LangChain 更关注任务执行过程中的异步调度与控制，DeepSeek 则进一步探索通过 GitHub、飞书等事件主动发现和推进工作。\n\n我觉得两者都指向一个趋势：Agent 正在从单个 Session 的执行循环，走向能够持续处理多项任务的工作系统。\n\n以后 Agent 好不好用，可能很大程度上取决于你能不能放心把任务交出去，又能在需要时随时介入。\n\nLangChain 原文：https://t.co/llbVEAk0kb", "createdAt": "Sat Nov 07 01:00:00 +0000 2026", "replyCount": 35, "retweetCount": 43, "likeCount": 252, "conversationId": "2118871055360303354", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-07T01:00:00+00:00", "createdAtBeijing": "2026-11-07T09:00:00+08:00", "createdAtLocal": "11-07 09:00 北京", "url": "https://x.com/Xudong07452910/status/2118871055360303354", "themeId": "editorial", "signalScore": 84, "editorial": {"id": "2118871055360303354", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "异步子Agent调度与任务状态管理", "evidence": "LangChain 把后台任务状态单独保存", "rationale": "具体解释异步执行、任务干预和压缩后状态保留"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2119012484258664514", "track": "tools", "source": {"id": "2119012484258664514", "text": "不用顶级显卡，也能在普通电脑上跑超大模型？先看清它用什么换来了可能\n\n看到 Colibri，很容易被一个数字吸引：约 25GB 内存，也能让一个 744B 参数的模型生成回答。\n\n这不是把数百 GB 权重凭空压进了几十 GB 内存。它做的是另一件事：利用混合专家模型的稀疏激活特性，把必须常驻的部分留在内存，把大量专家权重放在磁盘，推理时按需读取，再通过缓存、预取和 CPU/GPU 协同减少等待。\n\n相当于桌子放不下所有书，就把常用的放手边，剩下的随用随取。\n\n代价也很明确：内存门槛降下来了，但存储容量、磁盘带宽、等待时间和配置复杂度不会消失。\n\n项目早期在约 25GB 可用内存的电脑上跑起了 744B 模型，但冷态速度只有每秒 0.05～0.1 个 token，生成一段回答可能要等很久。\n\n而且权重依然可能占几百 GB 磁盘，“能跑起来”和“用起来舒服”确实是两回事。\n\n现在它已经有安装向导、聊天界面和兼容 API，也支持 GPU 加速。\n\nWindows 用户可以下载仓库、解压，运行 START-HERE.bat，让向导检测硬件并推荐模型。\n\n真想试试的话，建议先从小模型开始，把安装、对话和客户端接入跑通，再看有没有必要挑战更大的。", "createdAt": "Sat Nov 07 10:22:00 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 0, "conversationId": "2119012484258664514", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118166871073792000/img/Rn0MQjdxqcNCduLY.jpg", "width": 720, "height": 1280, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118166871073792000/img/Rn0MQjdxqcNCduLY.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118166871073792000/vid/avc1/720x1280/VzHl-nURw5JPjwI0.mp4?tag=29", "durationMs": 57733}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-07T10:22:00+00:00", "createdAtBeijing": "2026-11-07T18:22:00+08:00", "createdAtLocal": "11-07 18:22 北京", "url": "https://x.com/sitinme/status/2119012484258664514", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2119012484258664514", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Colibri 按需加载专家权重与本地部署方法", "evidence": "冷态速度只有每秒 0.05～0.1 个 token", "rationale": "包含机制、性能代价和安装入口，数据未独立核验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118949769221677120", "track": "agent", "source": {"id": "2118949769221677120", "text": "TanStack AI 推出了官方 Effect 适配器，面向 Effect 4.1 及以上版本，将聊天和其他 AI 调用接入 Effect 的编程模型。聊天默认返回 Effect Stream，也支持非流式结果和基于 Schema 的结构化输出；通过 serverTool 定义的服务端工具可以声明服务依赖，再由 Layer 提供具体实现，方便替换数据来源和编写测试。任务中断时，适配器会取消模型请求，并中断正在执行的 Effect 工具，运行相应的清理逻辑。适配范围还包括摘要、嵌入、重排以及图片、音频、视频生成等能力，让已有 Effect 项目减少手动衔接异步流、依赖和资源清理的代码。\n\n文档：https://t.co/PiyppndKoQ", "createdAt": "Sat Nov 07 06:12:47 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 13, "conversationId": "2118949769221677120", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2118772095140368631", "text": "TanStack AI 🤝 Effect 4\n\nTanStack AI now ships a first-party Effect adapter for your AI apps, you no longer have to choose to use one or the other!\n\nThe whole toolset in 30 seconds 👇 https://t.co/qFiWY5Jxym", "createdAt": "Fri Nov 06 18:26:47 +0000 2026", "replyCount": 30, "retweetCount": 60, "likeCount": 852, "conversationId": "2118772095140368631", "author": {"username": "tan_stack", "name": "TANSTACK", "profileImageUrl": "https://pbs.twimg.com/profile_images/2084450215965446144/isy6AChR_normal.jpg"}, "authorId": "1474104747871256576", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118771251975950336/img/VU0uTCEITtuLbwzz.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118771251975950336/img/VU0uTCEITtuLbwzz.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118771251975950336/vid/avc1/1920x1080/AMWAE7KhiCeEuhew.mp4?tag=29", "durationMs": 30000}], "translationZh": "TanStack AI 🤝 Effect 4\n\nTanStack AI 现已为 AI 应用提供官方 Effect 适配器，你再也不用二选一了！\n\n30 秒看完整套工具 👇 https://t.co/qFiWY5Jxym"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-07T06:12:47+00:00", "createdAtBeijing": "2026-11-07T14:12:47+08:00", "createdAtLocal": "11-07 14:12 北京", "url": "https://x.com/lencx_/status/2118949769221677120", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2118949769221677120", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "TanStack AI 官方 Effect 适配器发布", "evidence": "TanStack AI 推出了官方 Effect 适配器", "rationale": "具体发布涵盖流式调用、工具依赖与中断清理"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2118898231291597254", "track": "creative", "source": {"id": "2118898231291597254", "text": "让编程 Agent 开始拍动画，离好用还有多远？\n\n以前用 AI 做视频，基本都是输入提示词生成一段画面，效果不满意就重新生成。\n\nhuashu-art-motion有意思的地方，是把“用 AI 做动画”变成了一套可以反复修改、逐帧渲染和检查的代码工作流：\n\nAI 负责理解题材、设计分镜和写代码，程序负责画场景、组织运动，再把画面导出成视频。需要复杂人物时，还可以接入生成图片或已有角色帧。\n\n项目目前整理了 53 张艺术风格配方卡，其中 36 种是已有实做风格，另外 17 种还处于研究阶段。梵高、莫奈、水墨、像素风这些都有。官方还展示了名画穿越、超级玛丽、Clawd 博物馆奇妙夜等动画案例，效果挺有想象力。\n\n提供的 9 种解说动画语法，包括白板动画、动态图表、数学公式演示、产品发布会动效、动态文字等。\n\n对经常做科技解说、产品介绍、知识视频的人来说，值得关注的也不只是名画穿越。白板推导、财经图表、截图拼贴、发布会动效，可能才是更容易反复用上的部分。\n\n但它也有明确门槛：需要支持 Skill 的编程 Agent、本地渲染环境，以及你对画面和节奏的持续判断。装上一条命令，不等于每种风格都能自动产出成熟成片。", "createdAt": "Sat Nov 07 02:48:00 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 3, "conversationId": "2118898231291597254", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2091702657400676618", "text": "一个可以把时间线文件转换成动画旅行视频的工具：Google Timeline Visualizer\n\n它可以把 Google 地图导出的 Timeline.json，直接做成一段“旅行电影”：\n\n地图上会动态显示你去过的地方、移动路线、日期，最后再拉远展示完整旅程。\n\n相比看一堆 JSON 或静态地图，这种方式直观很多，特别适合做年度旅行回顾。\n\n目前支持三种玩法：\nAndroid 可以直接装 APK 生成视频；\niPhone/iPad 用 Safari 网页版，不需要安装 App；\n开发者还可以用 Python + FFmpeg 在电脑上批量处理。\n\n日期范围、视频时长、镜头方式、长途路线压缩、横屏竖屏这些都能自己调。\n\n它对隐私处理得还不错。Timeline 数据和生成的视频主要都在本地处理，不需要登录 Google，也不会把完整轨迹上传给开发者。 不过地图底图还是要从 CARTO 请求，所以严格来说并不是完全离线。\n\n不过一些细节还在快速迭代，比如隐藏家庭/工作地点、交通方式区分、极端跨洲航线和部分设备的视频导出兼容性。\n\n所以如果要公开分享，最好先 Preview 一遍，确认住址、公司、医院、学校这些敏感地点没有暴露。", "createdAt": "Mon Aug 24 01:42:30 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 2, "conversationId": "2091702657400676618", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQc4ed6bUAAZSwu.jpg", "width": 675, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HQc4ed6bUAAZSwu.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HQc4edxasAAFRfq.png", "width": 1199, "height": 502, "previewUrl": "https://pbs.twimg.com/media/HQc4edxasAAFRfq.png:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118539682711851008/img/6cNvKzxbu2m7jagy.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118539682711851008/img/6cNvKzxbu2m7jagy.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118539682711851008/vid/avc1/1920x1080/EDB_XA6vlieCNx8a.mp4?tag=29", "durationMs": 184634}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-07T02:48:00+00:00", "createdAtBeijing": "2026-11-07T10:48:00+08:00", "createdAtLocal": "11-07 10:48 北京", "url": "https://x.com/sitinme/status/2118898231291597254", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2118898231291597254", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "编程 Agent 驱动的可迭代动画工作流", "evidence": "可以反复修改、逐帧渲染和检查的代码工作流", "rationale": "具体介绍动画流程、应用场景与成熟度限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2119014498321502283", "track": "research", "source": {"id": "2119014498321502283", "text": "AI 玩「狼人杀」已经会主动卖队友了，甚至能借此把自己洗成全场最受信任的人。\n\nDwarkesh 最近花了约 2 万美元，做了个挺有意思的 Agent Benchmark，叫 Clocktower Bench。\n\n让 10–12 个 AI 分成好人和邪恶阵营，互相私聊、交换线索、编造谎言、公开投票，最后用 386 场比赛评估不同模型的表现。\n\n有一局 GPT-6 Astra 假扮调查员，主动指认自己的邪恶队友。队友被处决后，身份得到验证，其他玩家反而更信任它，最后成功获胜。\n\n但看完文章，我更关注另一个发现。\n\n在这个 Benchmark 中，OpenAI 较新模型的领先优势主要体现在识破骗局上。它们会不断对照前后的证据，重新判断谁更可疑，而部分 Claude 模型更容易过早相信某条线索。\n\n这让我想到平时做 Agent Eval，面对错误信息或相互矛盾的工具结果，Agent 能不能及时发现问题、修正之前的判断，其实很值得单独测试。\n\n作者还开源了完整的评测 Harness 和对局记录，可以自己复现、分析，甚至和 AI 直接对战。挺推荐做 Agent 研究的朋友看看。\n\n文章：https://t.co/7a0oEYknV6", "createdAt": "Sat Nov 07 10:30:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 4, "conversationId": "2119014498321502283", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-07T10:30:00+00:00", "createdAtBeijing": "2026-11-07T18:30:00+08:00", "createdAtLocal": "11-07 18:30 北京", "url": "https://x.com/Xudong07452910/status/2119014498321502283", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2119014498321502283", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "Clocktower Bench多智能体欺骗与纠错评测", "evidence": "面对错误信息或相互矛盾的工具结果", "rationale": "转述具体评测与对局案例，并提出纠错评估方向"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2119114537442189652", "track": "agent", "source": {"id": "2119114537442189652", "text": "Earlier this week Tristan published his top YouTube channels:\nhttps://t.co/NZ3UCNo6cT\nWhich looked excellent so clearly I had to turn it into TristanTube:\nhttps://t.co/l0KyW1WdNH\n47K super nerdy videos +TV mode for laid back watching. (One-shotted with Claude Code in 3 minutes)", "createdAt": "Sat Nov 07 17:07:31 +0000 2026", "replyCount": 367, "retweetCount": 331, "likeCount": 4615, "conversationId": "2119114537442189652", "author": {"username": "karpathy", "name": "Andrej Karpathy", "profileImageUrl": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, "authorId": "33836629", "quotedTweet": {"id": "2116957135661945283", "text": "Weekend hack: HackerTube. I was annoyed with YouTube's recommendations so I had Claude filter down 43M comments over 20 years of HN to 6,454 videos that keep being recommended. *Significantly* better viewing experience, ~2 hours with Opus 5.5:\nhttps://t.co/JIhXN7OSh1\n\n- Excellent recs without any logins (state is kept in local browser session)\n- Thumbnail is a representative frame from middle of the video instead of the super duper A/B test hyper-optimized user uploads\n- Underlying data from the comment analysis as one zip file, point your Claude at it and ask for your own version\n- HackerTube Longs ✊\n\nA bit more on the process:\nI use Claude Code (desktop app for Mac), Opus 5.5 on Medium effort as my default. I only talk to Claude and have it do everything, the only \"manual work\" I helped with in tandem was in the browser (reminiscent of MenuGen): 1) I had to create some kind of API key from Google Cloud UI to query YouTube for video metadata, 2) I booted up a VPS box for serving and 3) I bought the domain name. Once the box was up I gave Claude the IP and told it update, secure, harden, deploy and optimize the code, and it did the whole thing.\n\nMany awesome projects that would have normally taken weeks/months even can now be few-shotted for breakfast. What else are we not thinking of.", "createdAt": "Sun Nov 01 18:14:46 +0000 2026", "replyCount": 2333, "retweetCount": 4762, "likeCount": 51799, "conversationId": "2116957135661945283", "author": {"username": "karpathy", "name": "Andrej Karpathy", "profileImageUrl": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, "authorId": "33836629", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDnuuCaIAA__wa.jpg", "width": 2048, "height": 1190, "previewUrl": "https://pbs.twimg.com/media/HWDnuuCaIAA__wa.jpg:small"}], "translationZh": "周末小项目：HackerTube。受够了 YouTube 的推荐，我让 Claude 从 HN 过去 20 年的 4300 万条评论中，筛出了 6,454 个反复被推荐的视频。观看体验好太多了，用 Opus 5.5 花了约 2 小时做成：\nhttps://t.co/JIhXN7OSh1\n\n- 无需登录就有优质推荐（状态保存在浏览器本地会话中）\n- 缩略图取自视频中段的代表性画面，而非上传者经过大量 A/B 测试、极致优化的封面\n- 评论分析的底层数据打包成一个 zip 文件，让你的 Claude 读取它，就能要求它做出你自己的版本\n- HackerTube Longs ✊\n\n再聊聊制作过程：\n我用的是 Claude Code（Mac 桌面应用），默认选择 Opus 5.5，推理强度设为 Medium。我只负责跟 Claude 沟通，所有事情都交给它做。我配合完成的唯一“手动工作”都在浏览器里（让人想起 MenuGen）：1）在 Google Cloud 界面创建某种 API 密钥，用于查询 YouTube 视频元数据；2）启动一台 VPS 服务器；3）购买域名。服务器启动后，我把 IP 给了 Claude，让它更新系统、配置安全防护、加固服务器、部署并优化代码，它就把整套流程做完了。\n\n许多原本要花几周甚至几个月的精彩项目，现在吃个早饭的工夫、聊上几轮就能做出来。还有什么是我们尚未想到的？"}, "expert": {"priority": "P0", "domain": "AI 编程 / 通用 AI", "name": "Andrej Karpathy", "role": "Eureka Labs；前 OpenAI/Tesla", "why": "高信号 AI 教育者和产品思想者，长期影响 Software 2.0、AI Coding、Vibe Coding 等叙事", "handle": "karpathy"}, "createdAtIso": "2026-11-07T17:07:31+00:00", "createdAtBeijing": "2026-11-08T01:07:31+08:00", "createdAtLocal": "11-08 01:07 北京", "url": "https://x.com/karpathy/status/2119114537442189652", "themeId": "editorial", "signalScore": 91, "editorial": {"id": "2119114537442189652", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "使用Claude Code构建视频聚合网站", "evidence": "One-shotted with Claude Code", "rationale": "展示实际作品与开发部署流程，耗时为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "本周早些时候，Tristan 分享了他最推荐的 YouTube 频道：\nhttps://t.co/NZ3UCNo6cT\n看起来相当棒，我当然得把它做成 TristanTube：\nhttps://t.co/l0KyW1WdNH\n4.7 万个极客向视频，还支持 TV 模式，方便轻松观看。（用 Claude Code 一次生成，耗时 3 分钟）"}, "avatar": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, {"id": "2118951459165446156", "track": "creative", "source": {"id": "2118951459165446156", "text": "X 创作者官方指南：让 Grok Bot 参与视频全流程，不只是代写脚本\n\n原作者 @Ethan_Ng_13 的核心思路：先让 Bot 理解你的创作方式，再让它参与灵感整理、脚本反馈、剪辑和数据复盘，让每次创作的经验能用于下一次。\n\n先建立背景，再交任务\n\nEthan 建议提供过往作品、喜欢的内容、创作方法和平台数据，而不是只说“帮我做个视频”。Bot 可以据此拆解参考内容的开头、节奏和配乐，提出适合你的改编方向。\n\n脚本环节的建议尤其值得注意：不要只让它代写，而要让它帮助你写得更好。 例如指出观众可能失去兴趣的位置，再给出修改理由。\n\n剪辑是协作，不是一键完成\n\nEthan 描述的流程是：学习风格、接收素材、提出剪辑方案，由创作者确认后制作，再根据审看意见修改。\n\n他分享了一次经历：10 个原始视频约两小时剪完，包含动画、叠加图层和配乐；自己手工剪一条通常也要约两小时。这个数字是个人案例，不是普遍效率保证，也包含几轮人工反馈。\n\n真正值得关注的是复盘\n\n按 Ethan 介绍，连接账号和数据后，Bot 还可以协助跨平台发布，分析观众流失、跳过率和分享率，把经验用于后续创作。它不只是指出“18 秒处流失”，还会尝试结合脚本和画面解释原因；这些解释仍需创作者验证。", "createdAt": "Sat Nov 07 06:19:30 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 6, "conversationId": "2118951459165446156", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2118843705327026400", "text": "The ultimate guide to Grok Bot for creators", "createdAt": "Fri Nov 06 23:11:20 +0000 2026", "replyCount": 265, "retweetCount": 262, "likeCount": 2662, "conversationId": "2118843705327026400", "author": {"username": "XCreators", "name": "Creators", "profileImageUrl": "https://pbs.twimg.com/profile_images/1683364393323577345/uUWH_TiG_normal.jpg"}, "authorId": "3282859598", "article": {"title": "The ultimate guide to Grok Bot for creators", "previewText": "By @Ethan_Ng_13 \nBeing a creator is way more than filming and posting a video.\nA single 60-second short can take days. There's the idea, the research, the script, the shoot, the edit, the post, the", "titleZh": "创作者的 Grok Bot 终极指南", "previewTextZh": "作者：@Ethan_Ng_13\n做创作者，远不只是拍摄并发布视频。\n一条 60 秒的短视频就可能花上好几天。构思、调研、写脚本、拍摄、剪辑、发布，还有……"}, "translationZh": "创作者的 Grok Bot 终极指南"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWgHHbvaYAAJUT_.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWgHHbvaYAAJUT_.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-07T06:19:30+00:00", "createdAtBeijing": "2026-11-07T14:19:30+08:00", "createdAtLocal": "11-07 14:19 北京", "url": "https://x.com/shao__meng/status/2118951459165446156", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2118951459165446156", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Grok Bot视频创作与数据复盘方法", "evidence": "指出观众可能失去兴趣的位置", "rationale": "提供背景输入、剪辑协作和复盘的具体流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119100251453997213", "track": "creative", "source": {"id": "2119100251453997213", "text": "最近 ChatGPT Images 2.6 不是推出了一个 GIF 模式嘛？目前在网页端可以体验。\n\n但实际用下来，有个场景我没搞定，就是给它一个已有的 GIF，让它去复刻。\n\n本来我想用朋友的照片，给他做一个鸡你太美的铁山靠。但直接在网页版上把素材丢给 GPT，它没理解我的需求，做出来的东西也驴唇不对马嘴。\n\n后来我找到了一个比较好的解法，用 Codex 就可以，也用不到网页版的 GIF 功能。\n\n其实很简单，把你想要复刻的 GIF 给到 Codex，再给它你想替换的人物照片，直接让它用这张照片去复刻原有的 GIF 就行了。\n\n我看了一下，效果很不错。它的实现方式是先逐帧分析原 GIF 里的图片，再用生图做出一张 4×4 的十六宫格图片，然后由 Codex 把这 16 张图片切割出来，组装成最终的 GIF。\n\n拿我们最亲爱的马斯克试了一下，老马的铁山靠别有一番风味啊。", "createdAt": "Sat Nov 07 16:10:45 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 5, "conversationId": "2119100251453997213", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HWiM2jWaMAAIbLu.jpg", "width": 640, "height": 358, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HWiM2jWaMAAIbLu.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HWiM2jWaMAAIbLu.mp4"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HWiM3AFasAEDetw.jpg", "width": 400, "height": 224, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HWiM3AFasAEDetw.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HWiM3AFasAEDetw.mp4"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWiOTkLaAAAAN8-.jpg", "width": 1284, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWiOTkLaAAAAN8-.jpg:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-11-07T16:10:45+00:00", "createdAtBeijing": "2026-11-08T00:10:45+08:00", "createdAtLocal": "11-08 00:10 北京", "url": "https://x.com/jinchenma_ai/status/2119100251453997213", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2119100251453997213", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "使用 Codex 替换人物复刻 GIF", "evidence": "切割出来，组装成最终的 GIF", "rationale": "自述逐帧分析、十六宫格生成与拼接方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2118875764066222117", "track": "tools", "source": {"id": "2118875764066222117", "text": "The world needs two types of document OCR:\n\n1. Extremely fast/cheap OCR tools: Each organization might have trillions of documents, and this is oftentimes helpful as a 'first pass' to digitalize each document so that it's accessible to AI agents. Accuracy might not be the highest, but it's 'good enough' for agentic retrieval and a deeper second pass.\n\nThis includes free/OSS tools like pypdf, pymupdf. Over the past year, we've invested heavy efforts in this area through `liteparse` - the fastest/most accurate free/OSS parser. It integrates with 5 other open-weight OCR tools, most recently with MiniCPM-OCR from @OpenBMB \n\nhttps://t.co/JNER0mVcB8\n\nWe're also doing a lot more in this space - stay tuned! \n\n2. Accurate VLM-based OCR: This includes the subset of documents that are a) complex, and b) the organization must parse accurately. The data needs to be accurate because this data is used in business critical workflows across finance, insurance, healthcare, and more. \n\nAt the same time, even if the tool is not free, any VLM needs to be able to scale to billions of pages in a cost-effective manner.\n\nTwo weeks ago we launched OCRia-1, the best general purpose model for document parsing. It not only parsers complex text layouts, complex tables, but also visual diagrams and charts. \n\nhttps://t.co/PRxvOFmTLf\n\nIt powers all our modes within LlamaParse; see the most recent benchmarks on ParseBench: https://t.co/PWczfhp0OX\n\n-------\n\nBoth of these document OCR types require rigorous benchmarks, data+training pipelines, and an ambitious/talent-dense team pushing the pareto frontier of accuracy and cost. \n\nIf you're looking to solve document understanding across either frontier, come talk to us!", "createdAt": "Sat Nov 07 01:18:43 +0000 2026", "replyCount": 59, "retweetCount": 42, "likeCount": 341, "conversationId": "2118875764066222117", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWfCJx5bEAAfTd1.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWfCJx5bEAAfTd1.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-07T01:18:43+00:00", "createdAtBeijing": "2026-11-07T09:18:43+08:00", "createdAtLocal": "11-07 09:18 北京", "url": "https://x.com/jerryjliu0/status/2118875764066222117", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2118875764066222117", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "文档OCR分层方案与解析工具发布", "evidence": "Two weeks ago we launched", "rationale": "介绍工具发布、模型集成与分层方案，性能为自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "世界需要两类文档 OCR：\n\n1. 极快、极便宜的 OCR 工具：每家机构都可能有数万亿份文档，这类工具通常适合用于“初步处理”，将每份文档数字化，让 AI 智能体能够访问。准确率或许不是最高，但对于智能体检索和后续更深入的二次处理而言，已经“够用”。\n\n这类工具包括 pypdf、pymupdf 等免费开源工具。过去一年，我们通过 `liteparse` 在这个方向投入了大量精力——它是速度最快、准确率最高的免费开源解析器。它集成了另外 5 款开放权重的 OCR 工具，最近接入的是 @OpenBMB 的 MiniCPM-OCR。\n\nhttps://t.co/JNER0mVcB8\n\n我们在这个领域还有更多动作，敬请期待！\n\n2. 基于 VLM 的高精度 OCR：适用于那些既复杂、又必须被机构准确解析的文档。数据必须准确，因为它们会用于金融、保险、医疗等领域的关键业务流程。\n\n同时，即使工具并非免费，任何 VLM 也都需要能以经济高效的方式扩展到数十亿页的处理规模。\n\n两周前，我们推出了 OCRia-1，这是最出色的通用文档解析模型。它不仅能解析复杂的文字排版和表格，还能解析示意图与图表。\n\nhttps://t.co/PRxvOFmTLf\n\nLlamaParse 的所有模式均由它驱动；最新基准测试结果见 ParseBench：https://t.co/PWczfhp0OX\n\n-------\n\n这两类文档 OCR 都需要严格的基准测试、数据与训练流水线，以及一支志向远大、人才密集的团队，不断推进准确率与成本的帕累托前沿。\n\n如果你想在其中任一方向攻克文档理解难题，来和我们聊聊！"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2119102098910609797", "track": "enterprise", "source": {"id": "2119102098910609797", "text": "分享一个观察到的现象，大家用 AI 的时候，一定要分清楚：AI 本身是带智能的，但你用 AI 做出来的工具，不一定是带智能的。\n\n为什么这么说呢？这几天去一家企业交流，遇到一个做财务的老师。她说，自己已经让 WorkBuddy 帮她做了一个处理财务报表的工具，是一个网页。前两个月对账的时候都好好的，这个月就出问题了。\n\n后来一了解，发现她这个月财务表格的字段发生了一点变化，那个工具就不好用了。老师有点抱怨，觉得这个 AI 没那么好用。\n\n这就是好多人可能会有的一个误区。AI 本身是智能的，但是你用 AI 开发的那个工具，如果本身没有 AI 能力，运行时也没有 Agent 去判断和处理，它就是个死工具。\n\n什么是死工具呢？就是说它会要求你上传的这些表格数据，里面的字段是固定的。如果字段、结构跟你做工具的时候不一样了，大概率这个工具就不好用了。\n\n所以解决这个问题，有两种思路。\n\n一种是，如果想继续用这个工具，那就把原始数据格式修改好，或者去修改工具。\n\n另一种是，把工作逻辑、审核要求、异常处理的守则和校验标准写进 Skill，每次让 Agent 按这个 Skill 去处理。\n\n这就是很多不懂技术的人，在使用 AI 时遇到的一些非常实际的问题。\n\n理解这些问题，其实需要一些工程化思维，或者说技术思维。你得知道这个工具为什么好用，为什么有时候不好用，问题出在哪，应该以什么思路去解。\n\n所以我觉得，这也是企业想让员工都学会使用 AI 工具的一个难点。一般用户真的不了解这些细节，但往往就是这些细节没处理好，导致他最后拿不到想要的结果。\n\n而在用户视角里，他会认为，这就是 AI 整体的问题。", "createdAt": "Sat Nov 07 16:18:06 +0000 2026", "replyCount": 8, "retweetCount": 0, "likeCount": 3, "conversationId": "2119102098910609797", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-11-07T16:18:06+00:00", "createdAtBeijing": "2026-11-08T00:18:06+08:00", "createdAtLocal": "11-08 00:18 北京", "url": "https://x.com/jinchenma_ai/status/2119102098910609797", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2119102098910609797", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "财务工具字段变更故障与工作流改进", "evidence": "这个月财务表格的字段发生了一点变化", "rationale": "提供具体故障案例及格式修正、Skill两类解法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2118917198660124680", "track": "creative", "source": {"id": "2118917198660124680", "text": "⑤ 分镜设计：决定视频有没有电影感\n\n别把所有动作塞进一个镜头。\n\n我之前的 Malfoy 对决视频，就把30秒拆成了9个独立分镜。\n\n每个镜头只需要明确：\n\n时间：第几秒到第几秒\n\n景别：全景、中景还是特写\n\n运镜：推近、跟拍、环绕还是固定\n\n内容：人物正在做什么\n\n比如：\n\n“镜头3｜4.5–6.6秒\n85mm波特近景｜轻微调侃\n波特看着马尔福。\n先看她举起的魔杖@图片6 ，再看她的脸。\n嘴角轻轻扬起一点，带着明知故问的轻微调侃：\nHarry:\n“Still angry about yesterday?”\n语气轻，不用故意夸张。\n表情重点：\n波特：轻松、淡淡调侃。\n这句不是激怒她，而是自然指出她挑战的真正原因。”\n\n分镜清楚，视频节奏才更容易控制。", "createdAt": "Sat Nov 07 04:03:22 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 1, "conversationId": "2118917181148934409", "inReplyToStatusId": "2118917194948214948", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWfjyF0bsAArInv.jpg", "width": 1918, "height": 1073, "previewUrl": "https://pbs.twimg.com/media/HWfjyF0bsAArInv.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-07T04:03:22+00:00", "createdAtBeijing": "2026-11-07T12:03:22+08:00", "createdAtLocal": "11-07 12:03 北京", "url": "https://x.com/liyue_ai/status/2118917198660124680", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2118917198660124680", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI视频分镜拆解与节奏控制", "evidence": "把30秒拆成了9个独立分镜", "rationale": "自述分镜实践，附时段、景别和表演提示实例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2119138141793841376", "track": "agent", "source": {"id": "2119138141793841376", "text": "The industrial-benchmark complex is on thin ice", "createdAt": "Sat Nov 07 18:41:19 +0000 2026", "replyCount": 22, "retweetCount": 2, "likeCount": 86, "conversationId": "2119138141793841376", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "quotedTweet": {"id": "2118880329490637049", "text": "Nice DeepSWE score! Does it survive a lowercase filename?\n\nIntroducing MaxxBench: 89 DeepSWE tasks with small changes to the instructions or starting code. Same engineering problem, slightly different requirement.\n\nModels clustered around 74% on DeepSWE end up 23 pp apart.\n\nGood at coding, or good at DeepSWE? 🧵", "createdAt": "Sat Nov 07 01:36:52 +0000 2026", "replyCount": 126, "retweetCount": 253, "likeCount": 3471, "conversationId": "2118880329490637049", "author": {"username": "loresjpg", "name": "Justin Lo", "profileImageUrl": "https://pbs.twimg.com/profile_images/2117764091595075584/gso3afey_normal.jpg"}, "authorId": "2108710501056491520", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWfGLoKaUAAi2sL.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWfGLoKaUAAi2sL.jpg:small"}], "translationZh": "DeepSWE 分数不错！把文件名改成小写，还能保持吗？\n\n介绍一下 MaxxBench：基于 89 个 DeepSWE 任务，对指令或初始代码做了小幅修改。工程问题相同，要求略有不同。\n\n在 DeepSWE 上得分都集中在 74% 左右的模型，在这里却拉开了 23 个百分点的差距。\n\n究竟是擅长编程，还是擅长 DeepSWE？🧵"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-11-07T18:41:19+00:00", "createdAtBeijing": "2026-11-08T02:41:19+08:00", "createdAtLocal": "11-08 02:41 北京", "url": "https://x.com/HamelHusain/status/2119138141793841376", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2119138141793841376", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "MaxxBench检验编程评测稳健性", "evidence": "89 DeepSWE tasks", "rationale": "发布任务变体评测，报告模型差距达23个百分点"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "产业与基准测试的利益共同体正如履薄冰"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2119108285316153572", "track": "agent", "source": {"id": "2119108285316153572", "text": "@chunxiangai 其实坑挺多的，不是适合所有场景\nhttps://t.co/67BXn0bkQB", "createdAt": "Sat Nov 07 16:42:41 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 4, "conversationId": "2119056820467896372", "inReplyToStatusId": "2119056820467896372", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2112552063640997984", "text": "感谢分享，我说一下我在上一个版本 baocut 用 GPUI 踩的坑。\n\nGPUI 挺好的，性能好，跨平台，AI 友好，但也有坑：\n1. UI 复杂一点的话大概率你要 fork 一份改一下，有些功能原生支持不了，但也不是大问题\n\n2. Accessibility 支持不太好，要支持一些键盘操作会比较麻烦（也可能我用法不对）\n\n3. Rust 编译资源消耗很大\n每次编译，无论是 CPU 占用还是磁盘占用，都巨大，对于我这样用 Mac Mini M4 16G + 1T 硬盘的来说简直太痛苦了，不敢并行多开编译任务，磁盘空间永远不够用（后来我把编译结果默认放到移动硬盘缓解了一点）\n\n4. 编译时间很长，不支持热更新。\n这点很要命，这意味着你如果改一点 UI 代码，要重新编译，然后要等少则几分钟多则十几分钟，这时间无论对于 agent 还是对于人来说都是很大的时间成本，加上不能随便多任务，会拖慢你的开发速度\n\n5. agent 验证 UI 不算太友好\ncodex、claude code 都可以借助 computer use 去验证 GPUI 的结果，但一个是慢，另一个相对成本也不低。\n\n---\n\n后来我之所以换回 Electron，就是因为 Electron App 对于 Agent 相对友好，编译快、热更新，UI 改动很快看到效果，然后 Electron App 还能跑到 agent 内置的浏览器中，agent 验证起来很快，都不需要用 computer use 去打开 electron app。\n\n至于网页渲染性能不够好的问题，我把原来一些需要复杂渲染的部分，都用 rust 编译成了 wasm，这样在浏览器运行也可以保证高性能。\n\n以前 rust 做的转录、tts 模块也都以 worker 进程的形式保留下来了，electron 需要用到的时候可以直接起 rust 编译出来的进程（Codex 也是类似），和这些进程通信，后台的性能也比纯 TypeScript + Node 要好不少。\n\n有兴趣的话可以看代码库：https://t.co/aON4AditbU", "createdAt": "Tue Oct 20 14:30:35 +0000 2026", "replyCount": 26, "retweetCount": 9, "likeCount": 119, "conversationId": "2112552063640997984", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-07T16:42:41+00:00", "createdAtBeijing": "2026-11-08T00:42:41+08:00", "createdAtLocal": "11-08 00:42 北京", "url": "https://x.com/dotey/status/2119108285316153572", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2119108285316153572", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "GPUI开发成本与Agent验证限制", "evidence": "编译时间很长，不支持热更新", "rationale": "包含编译资源、验证成本及替代架构的具体经验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}], "preview": false, "productionMonitored": 122};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
