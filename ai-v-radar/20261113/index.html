<script>
const DATA={"records": [{"id": "2120945309714919886", "track": "research", "source": {"id": "2120945309714919886", "text": "Google 发布 Gemini 4 Hydrogen：对标 Claude Sonnet 5.5 和 GPT-6.1 Terra 的主力模型，Gemini App 付费用户可选，开发者免费层就能用\n\nGoogle 11 月 12 日发布 Gemini 4 Hydrogen。它是 Gemini 4 系列里主打快和省的一档，接替 Gemini 3.8 Flash，Google 发布时拿来对比的是 Anthropic 的 Claude Sonnet 5.5 和 OpenAI 的 GPT-6.1 Terra。\n\nGemini 4 现在三个模型的分工：\nCarbon 最强，留给最难、最长的任务；\nArgon 处理大多数复杂任务，比 Carbon 省 Token；\nHydrogen 负责日常写代码、跑 agent，也可以给 Carbon 打下手。\n\nGoogle 公布的 Artificial Analysis 综合指数里，Hydrogen 默认档 51 分，略高于 Argon 的 50 分，开到最高档 54 分；Carbon 在 Artificial Analysis 官网是 60 分。\n\n一天前，Business Insider 报道 Google 员工正在内部开发平台 Jetski 上测试代号 Hydrogen 的模型，一位工程师在内部消息里说它“非常强，又快又省”。和 Carbon 一样，内部代号直接成了正式名。\n\n【跟 Sonnet 5.5、GPT-6.1 Terra 比】\n\nAPI 单价，每百万 Token 输入 / 输出：Hydrogen 1.5 / 7.5 美元，Claude Sonnet 5.5 2 / 10 美元，GPT-6.1 Terra 1 / 5 美元。Hydrogen 是 Sonnet 5.5 的四分之三，比 Terra 贵一半。\n\nGoogle 公布的 10 项评测里，Hydrogen 7 项第一。差距最大的是 SWE-sweep，要求找到并修好 bug、又不弄坏原有代码：Hydrogen 13.5%，Sonnet 5.5 3.1%，Terra 5.8%。Sonnet 5.5 赢了另外 3 项：命令行编程 Terminal-Bench 4.1（63.9% 对 57.0%）、操作电脑 OSWorld（83.9% 对 77.6%）和科学任务。\n\n算上每个任务的花费，结论更细一些。按 Google 自己的图，三家都开到最高档时，Hydrogen 54 分、每个任务约 3 美元；Sonnet 5.5 也是 54 分左右，每个任务约 10 美元；Terra 51 分，每个任务不到 1 美元。拿同样的 51 分比，Terra 比 Hydrogen 默认档便宜一半，但 Hydrogen 只用了 Terra 不到一半的时间。\n\n【谁能用，要不要钱】\n\nGemini App：Plus（每月 4.99 美元）、Pro 和 Ultra 用户能在模型菜单里手动选 Hydrogen。免费用户选不了，只能开着“自动选择模型”，碰到需要多想一点的问题，系统可能交给 Hydrogen，大多数问题还是用最轻的 Flash-Lite。关掉自动选择，全部用 Flash-Lite。\n\nGoogle 搜索换上了 Hydrogen，所有用户都能用到。Google 的 AI 编程工具 Antigravity 里，付费的 Pro 和 Ultra 用户能用。\n\n开发者：AI Studio 和 Gemini API 的免费层就有 Hydrogen，按调用频率限量；Argon 和 Carbon 都不在免费层。付费层就是上面的 1.5 / 7.5 美元，没有引入期优惠，批量和 Flex 档再打五折。\n\n跟自家比，Argon、Carbon 的引入价 2 / 10 美元到 11 月 30 日，12 月 1 日起涨到 4 / 20 美元，到时 Hydrogen 的单价不到它们的四成。3.8 Flash 现在的优惠价 0.75 / 3.75 美元到年底，今天从 3.8 Flash 换过来，单价会先翻倍，明年 1 月起两者持平。\n\n【能干什么】\n\nGoogle 说，比 3.8 Flash，Hydrogen 完成任务快 2.5 倍，Terminal-Bench 4.1 从 18.2% 提到 57%，编造内容的情况少了八成以上，读文件、搜索这类操作能一次并行发出好几个。\n\nGoogle 建议把 Hydrogen 和 Carbon 搭配用：Carbon 做规划、啃难题，改代码、跑测试交给 Hydrogen。Antigravity 新加了 Orchestrator，在同一个会话里自动在两个模型间切换。Google 测的结果是，成功率接近全程用 Carbon，额度少用 24%，速度快 19%。\n\n思考档在 low、medium、high 之外新增 xhigh，默认是 high；上下文 100 万 Token，输入、思考和输出共用。\n\n以上评测成绩和花费都是 Google 自己公布的，Artificial Analysis 官网目前列了 Hydrogen，还没有它的分数；Sonnet 5.5（最高档 54.5 分）和 Terra（51.3 分）的分数能在官网核对。\n\n来源：\nGoogle 官方博客《Introducing Gemini 4 Hydrogen》（Koray Kavukcuoglu，2026-11-12）\nhttps://t.co/qw5fI9wOWk\nGemini App 帮助中心：各套餐可用模型\nhttps://t.co/g5WuqYtJVG\n开发者文档《What's new in Gemini 4 Hydrogen》与价格页\nhttps://t.co/RJdnixAYNc\nhttps://t.co/GHFYP92VzS\nBusiness Insider 内测报道（Hugh Langley，2026-11-11）\nhttps://t.co/dPEQG5cJwP\nArtificial Analysis 综合指数\nhttps://t.co/65sNFzb9NV", "createdAt": "Thu Nov 12 18:22:21 +0000 2026", "replyCount": 22, "retweetCount": 4, "likeCount": 43, "conversationId": "2120945309714919886", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2120940236805169182", "text": "Following Carbon + Argon, Gemini 4 Hydrogen brings cutting-edge intelligence to everyone. Built for speed and efficiency for everyday tasks, coding and agentic workflows.\n\nCompared to 3.8 Flash, it finishes tasks 2.5x faster. Also has 4 thinking levels, so you only wait and pay for the reasoning depth a task requires.\n\nRolling out today to all tiers of @GoogleAIStudio, the Gemini API, @GeminiApp, Search and paid Google AI Pro and Ultra subscribers in Google @Antigravity.", "createdAt": "Thu Nov 12 18:02:12 +0000 2026", "replyCount": 425, "retweetCount": 332, "likeCount": 5967, "conversationId": "2120940236805169182", "author": {"username": "sundarpichai", "name": "Sundar Pichai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_normal.jpg"}, "authorId": "14130366", "translationZh": "继 Carbon 和 Argon 之后，Gemini 4 Hydrogen 将前沿智能带给每个人。它专为日常任务、编程和智能体工作流打造，兼顾速度与效率。\n\n相比 3.8 Flash，它完成任务的速度提升至 2.5 倍。同时提供 4 档思考级别，让你只需为任务所需的推理深度付费和等待。\n\n今天起陆续向 @GoogleAIStudio 所有层级用户、Gemini API、@GeminiApp、Search，以及 Google @Antigravity 中的 Google AI Pro 和 Ultra 付费订阅用户开放。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-12T18:22:21+00:00", "createdAtBeijing": "2026-11-13T02:22:21+08:00", "createdAtLocal": "11-13 02:22 北京", "url": "https://x.com/dotey/status/2120945309714919886", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2120945309714919886", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Gemini 4 Hydrogen发布与模型成本比较", "evidence": "以上评测成绩和花费都是 Google 自己公布的", "rationale": "包含模型发布、价格及评测细节，属来源自报"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2120979951599931793", "track": "enterprise", "source": {"id": "2120979951599931793", "text": "Claude 能进 Google Meet 开会了：边开会边写文档、画白板，Team 和 Enterprise 测试期内会议纪要不另收费\n\nAnthropic 推出 Claude Meetings 测试版：把 Claude 拉进团队的视频会议，它以参会者身份出现在画面里，一边听大家讨论，一边写会议纪要、回答问题，还能当场起草文档、画白板，同事可以跟着一起改。\n\n目前只支持 Google Meet，其他会议平台官方说“即将支持”。正在向 Claude 的 Team 和 Enterprise 套餐逐步开放，个人的 Pro、Max、Ultra 用户暂时用不了。\n\n【开会时它能干什么】\n\n官方举的例子是策划一场客户活动。有人说一句“Claude，给这个计划起个文档”，Claude 就把前面讨论的内容整理成文档，受邀的同事可以边开会边改。\n\n聊到预算时，有人问“去年这个活动花了多少”，Claude 征得同意后去公司系统里查，把结果贴在会议聊天区，再和今年的方案对比。聊到排期，又有人让它画到白板上。\n\n提问可以开口说“Claude”加问题，也可以在 Meet 聊天框里打字。它默认用文字回答，答案贴在会议聊天区，所有参会者都看得到。\n\n会议结束后，纪要（摘要加待办事项）、完整转录稿，以及会上做的文档、白板，都放在 https://t.co/vefasn3rYt 里这场会议的专属页面上，参会的本公司同事会收到一封带链接的回顾邮件。之后还能在普通对话里问 Claude 过去某场会说了什么。\n\nGoogle 自己的 Meet 里已经有 Gemini：“帮我记笔记”能自动出纪要，“问 Gemini”能让迟到的人补上前面错过的内容，Business Standard 及以上的 Workspace 套餐可用。\n\nZoom 付费套餐自带会议摘要，另卖一个叫 ZoomMate 的附加产品，能根据会议内容生成文档、幻灯片、安排后续会议。Otter 的会议助手也能语音唤醒、回答问题、起草邮件。\n\n微软 Teams 的 Facilitator 助手能在会上用网络搜索回答没人接的问题，但要有 Microsoft 365 Copilot（Premium）许可证的人手动开启，这个功能今天又被推迟到 2027 年 2 月。\n\nClaude 的区别在两点：\n一是文档和白板在会议进行中就出现，大家看着它成形、当场纠正，不用等会后；\n二是它能动用你在 Claude 里已经连好的工具，比如查数据、发 Slack 消息。\n\n另外 Anthropic 说正在和 Gong、Granola、https://t.co/d9RdSTd8D4、Otter 等纪要工具合作，之后可以把转录稿直接发到团队原来用的纪要工具里。\n\n【要不要额外付钱】\n\n测试期内，纪要、转录稿和会上的普通问答都包含在 Team 和 Enterprise 套餐里，不另收费。会上做的文档、白板等产物，免费到 2027 年 2 月 10 日。\n\n例外是 Claude 在会上动用你连接的工具（比如去查公司数据），这部分会算进你自己的用量，可能产生费用。\n\n怎么用：在 Claude 里打开“Meetings”页面，连上 Google 日历，选一场会点“Add Claude”。也可以在设置里打开“自动加入”，让它参加你所有的会，或者除一对一以外的所有会。自动加入只能自己开，管理员替你开不了。Claude 单场最多待 8 小时，可以让它暂停监听或离开。\n\n【隐私：会不会录音，客户在场怎么办】\n\nClaude 进会时会作为一个参会者出现，并在会议聊天区发一条提示。它保存转录稿、摘要和屏幕内容的文字描述，不保存音频。官方提醒，添加 Claude 或打开自动加入前，先确认所有参会者同意被转录。\n\n有外部人员的会，管理员可以设成 Claude 不进；会开到一半有外部的人进来（包括别家公司的纪要机器人），它会自动离开。如果允许它参加这类会，Claude 只听和记，不在聊天区回答问题，外部嘉宾说的话会写进纪要和转录稿，但嘉宾看不到会议页面，也收不到回顾邮件。\n\n用别人的工具要经过本人同意。每个人第一次被调用时 Claude 会问一次，同意后以后不再问。口头提问时，Claude 目前每次都会确认说话的是谁。\n\n管理员开关在“组织设置 > 产品 > Claude Meetings（测试版）”：Team 套餐默认开启，所有者可以关掉；Enterprise 默认关闭，要所有者给全公司或部分角色开。开了零数据留存（ZDR）、HIPAA 合规配置或客户自管加密密钥（CMEK）的组织，测试期内用不了。\n\n有一处官方说法不一致：Anthropic 的发布文章说 Claude 默认不进有外部人员的会，帮助中心的管理员设置表却写着 Team 套餐默认“允许”、Enterprise 默认“仅限内部会议”。Team 管理员如果在意客户会议被转录，最好自己去设置里确认一下。\n\n原文：https://t.co/3D6Uyilbz9\n帮助中心：https://t.co/VFfHT36bsq\n官方推文：https://t.co/s2mKX9dMxU", "createdAt": "Thu Nov 12 20:40:01 +0000 2026", "replyCount": 17, "retweetCount": 1, "likeCount": 28, "conversationId": "2120979951599931793", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2120973994191094179", "text": "Introducing Claude Meetings: add Claude to your team’s video call and it builds docs, whiteboards, and other artifacts with you while you’re still talking.\n\nStarting to roll out in beta on Team and Enterprise plans. https://t.co/qlZYTcXBsC", "createdAt": "Thu Nov 12 20:16:20 +0000 2026", "replyCount": 962, "retweetCount": 1771, "likeCount": 32685, "conversationId": "2120973994191094179", "author": {"username": "claudeai", "name": "Claude", "profileImageUrl": "https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_normal.jpg"}, "authorId": "1943306828697550848", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HW82tOPWUAAsEFY.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HW82tOPWUAAsEFY.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120970641876586497/vid/avc1/1920x1080/GSxy8WyJp7bII_Zl.mp4?tag=29", "durationMs": 62541}], "translationZh": "推出 Claude Meetings：将 Claude 加入团队视频会议，它就能在你们讨论的同时，与你们一起创建文档、白板及其他成果。\n\n现已开始向 Team 和 Enterprise 套餐用户逐步推出测试版。https://t.co/qlZYTcXBsC"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-12T20:40:01+00:00", "createdAtBeijing": "2026-11-13T04:40:01+08:00", "createdAtLocal": "11-13 04:40 北京", "url": "https://x.com/dotey/status/2120979951599931793", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2120979951599931793", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Claude Meetings测试版与会议协作流程", "evidence": "Starting to roll out in beta on Team and Enterprise plans.", "rationale": "含发布引文，详述功能、费用、权限及文档分歧"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2120725359561736213", "track": "research", "source": {"id": "2120725359561736213", "text": "Amazing work！\n\nEigent AI 新发布的 AgenticRL-Bench，探讨 Agent 能否逐步接手 RL 研究人员的工作，甚至参与训练下一代 Agent？\n\n他们直接拿真实 RL 研发中遇到的问题来测试。目前 Agent 已经能自己调整训练策略、跑出实际收益，不过很多时候连自己的工作是否真正完成还是判断不准。\n\n但是未来真的走向 AI 的 Recursive Self-Improvement，验证能力会变得非常重要。\n\n顺便说个小插曲，当时 Guohao 老师团队还在伦敦的时候，我还私信老师问团队招不招线下实习🙃，一晃眼两年过去了。", "createdAt": "Thu Nov 12 03:48:21 +0000 2026", "replyCount": 0, "retweetCount": 8, "likeCount": 28, "conversationId": "2120725359561736213", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2120593905502785600", "text": "Can agents perform agentic RL? If RSI happens, agents will need to take over researchers' work on agentic RL\n\nIntroducing AgenticRL-Bench: the first release from The Environment Lab @env_lab_ai effort at Eigent AI \n\n22 tasks rebuilt from real-world RL incidents on production-grade agentic RL systems, including Miles, Slime, Verl, SGLang, and Harbor, spanning 8 areas of the stack: training data, harnesses, algorithms, RL infrastructure, recipes, evaluation, monitoring, and capability transfer\n\nWe ran 6 agents with 3 attempts per task. On the 19 verifiable tasks, no agent passes more than 14.0% of its attempts\n\nAcross the three open-ended tasks, agents improved real policies or training steps using 4×H200 GPUs over 10–16 hours. On one of these tasks, Zero Signal Hill Climb, where the base model fails to solve any of the 38 tasks, the best attempt developed its own method: the agent first used hinted text feedback to generate successful rollouts, then removed the feedback from the trajectories and blended these successful rollouts with regular GRPO rollouts to form mixed training groups. It monitored the training process and adjusted KL loss weight to prevent training collapse. This improved pass@1 from 0 to 0.186 (12 out of 38 tasks)", "createdAt": "Wed Nov 11 19:06:00 +0000 2026", "replyCount": 23, "retweetCount": 36, "likeCount": 213, "conversationId": "2120593905502785600", "author": {"username": "guohao_li", "name": "Guohao Li 🐫", "profileImageUrl": "https://pbs.twimg.com/profile_images/1237407213502816256/P2FgBNP1_normal.jpg"}, "authorId": "1029465843393024005", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3c6v-bcAAVNRS.jpg", "width": 1200, "height": 675, "previewUrl": "https://pbs.twimg.com/media/HW3c6v-bcAAVNRS.jpg:small"}], "translationZh": "智能体能开展智能体强化学习研究吗？如果递归自我改进（RSI）成为现实，智能体就需要接手研究人员在智能体强化学习方面的工作。\n\n推出 AgenticRL-Bench：这是 Eigent AI 旗下 The Environment Lab @env_lab_ai 的首项成果。\n\n基于 Miles、Slime、Verl、SGLang 和 Harbor 等生产级智能体强化学习系统中的真实问题，重构了 22 项任务，覆盖技术栈的 8 个领域：训练数据、运行框架、算法、强化学习基础设施、训练方案、评估、监控和能力迁移。\n\n我们测试了 6 个智能体，每项任务各尝试 3 次。在 19 项可验证任务中，没有任何智能体的尝试通过率超过 14.0%。\n\n在另外 3 项开放式任务中，智能体使用 4 张 H200 GPU，历时 10–16 小时，改进了实际策略或训练步骤。其中一项任务名为 Zero Signal Hill Climb，基础模型无法解决其中任何一道题，共 38 道。表现最好的一次尝试自行设计了方法：智能体先利用带提示的文本反馈生成成功轨迹，再从轨迹中移除反馈，并将这些成功轨迹与常规 GRPO 轨迹混合，组成混合训练组。它持续监控训练过程，调整 KL 损失权重以防训练崩溃。这使 pass@1 从 0 提升至 0.186（解出 38 道题中的 12 道）。"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-12T03:48:21+00:00", "createdAtBeijing": "2026-11-12T11:48:21+08:00", "createdAtLocal": "11-12 11:48 北京", "url": "https://x.com/Xudong07452910/status/2120725359561736213", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2120725359561736213", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "AgenticRL-Bench 研究能力评测", "evidence": "22 tasks rebuilt from real-world RL incidents", "rationale": "介绍真实RL研发评测、通过率及训练改进方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120673680384823391", "track": "agent", "source": {"id": "2120673680384823391", "text": "Agent 只有 7% 的模型调用使用了顶级模型，却花掉了 68% 的费用。\n\nLangChain 几个月前的一篇实验文章还是有参考价值，值得一看。\n\n他们用 NVIDIA 开源的 Switchyard，在 145 个多步 Agent 任务上测试动态模型路由。\n\n思路是先让便宜的 30B 模型执行任务，每轮由一个 Judge 判断有没有跑偏，连续两次判断不佳，就将后续执行升级到 Claude Opus。\n\n结果 93% 的模型调用都由小模型完成，总成本降低了 74%，但准确率也从 86% 降到了 80%。\n\n还有个容易忽略的细节，单独使用小模型就能达到 77.7%，路由带来的提升甚至没超过实验波动，而 Judge 自己也消耗了 21% 的路由预算。\n\n感觉它的评测思路蛮值得借鉴的。\n\n当我们设计 Agent 的模型路由，应该先在真实任务上对比强模型、小模型和动态路由，算清准确率、延迟和成本，再决定是否值得增加这一层 Harness。\n\n原文：https://t.co/P1pQncQ6rO", "createdAt": "Thu Nov 12 00:23:00 +0000 2026", "replyCount": 10, "retweetCount": 2, "likeCount": 19, "conversationId": "2120673680384823391", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-12T00:23:00+00:00", "createdAtBeijing": "2026-11-12T08:23:00+08:00", "createdAtLocal": "11-12 08:23 北京", "url": "https://x.com/Xudong07452910/status/2120673680384823391", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2120673680384823391", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent动态模型路由成本与准确率评测", "evidence": "总成本降低了74%，但准确率也从86%降到了80%", "rationale": "提供路由机制、评测数据与真实任务对照方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120906636609065396", "track": "agent", "source": {"id": "2120906636609065396", "text": "good notes https://t.co/kEyQa0j6r1\n\nbtw one of the beautiful reasons why we love the smaller Summit format rather than the 10,000 person worlds fairs is that we can actually meet everyone and offer a higher quality experience. check out this morning spread!! https://t.co/SLvGYBsmPh", "createdAt": "Thu Nov 12 15:48:41 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 3, "conversationId": "2120582147107078356", "inReplyToStatusId": "2120582147107078356", "author": {"username": "swyx", "name": "swyx @aiDotEngineer CODE", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, "authorId": "33521530", "quotedTweet": {"id": "2120607968408531110", "text": "How to turn slop into gold. Super concrete steps from awesome @poteto on making coding agents trustworthy:\n\n1. Clean up the code your agents learn from.\nYour codebase is one of their biggest inputs. Agents copy whatever looks like an established pattern, including workarounds, deprecated code, and yesterday’s questionable decisions. Clean those up, or watch them reproduce.\n\n2. Turn corrections into enforceable checks.\nEvery time you correct an agent, ask: can this become a lint rule, a type constraint, a test, or a better API? Put the correction somewhere the system can enforce it. A growing AGENTS.md still requires the agent to follow every instruction.\n\n3. Remove opportunities for predictable mistakes.\nHer team @SpaceXSI restricts React’s useEffect to framework internals because agents repeatedly misuse it in product code. They also enforce import boundaries between application processes. These constraints eliminate whole categories of mistakes that would otherwise keep coming back in review.\n\n4. Give agents a reliable way to run and inspect the product.\nProvide debugging tools, reusable CLIs, and a “feature map” describing the application from the user’s perspective. Now “that thing in the left sidebar” has a shared meaning, and each agent can reuse the tools for checking it.\n\n5. Review evidence of behavior.\nHave agents produce screenshots, videos, and state diagrams. These help you check what the product actually does and how closely that matches your intent. A convincing explanation of a fix is easy to generate; seeing the fix work is considerably more useful.\n\n6. Spend serious effort on verification.\nHer team uses runtime verification and is experimenting with property-based UI testing and formal methods, including TLA+ model checking. Lauren says most of her token usage goes toward verification. Agents make some previously expensive testing work much more practical.\n\n7. Automate once that loop is reliable.\nHer team now has agents exercise new releases, find bugs, open fixes, and merge them automatically. Getting to that level of trust took her about six months of investing in the environment.\n\nThe results she reports: 11,000 pull requests shipped by her team in a month, a revert rate around 0.5%, and improvements in startup, typing, and switching chats.\n\nAnd what about infamous “software factory”? \n\nif your coding loop produces slop, automating it produces more slop, faster, with a larger token bill.\n\nStart by making good code the easiest thing for an agent to produce. Then scale it.\nAs always, content at @aiDotEngineer is gold 🏆", "createdAt": "Wed Nov 11 20:01:53 +0000 2026", "replyCount": 40, "retweetCount": 141, "likeCount": 2009, "conversationId": "2120607968408531110", "author": {"username": "TheTuringPost", "name": "Turing Post (Ksenia Se)", "profileImageUrl": "https://pbs.twimg.com/profile_images/2104587300675915778/wfNu1EOr_normal.jpg"}, "authorId": "1271482878958940160", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3pcrmaQAAxfNa.jpg", "width": 2048, "height": 1536, "previewUrl": "https://pbs.twimg.com/media/HW3pcrmaQAAxfNa.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW3pcrpbQAE2klY.jpg", "width": 2048, "height": 1536, "previewUrl": "https://pbs.twimg.com/media/HW3pcrpbQAE2klY.jpg:small"}], "translationZh": "如何把低质产出变成黄金。出色的 @poteto 分享了让编程智能体值得信赖的具体做法：\n\n1. 清理智能体学习的代码。\n代码库是它们最重要的输入之一。智能体会模仿一切看起来像既有模式的代码，包括变通方案、废弃代码，以及昨天那些欠妥的决定。要么清理掉，要么看着它们被反复复制。\n\n2. 将纠正意见变成可强制执行的检查。\n每次纠正智能体时，都问问：这能否变成一条 lint 规则、一个类型约束、一项测试，或一个更好的 API？把纠正意见落实到系统能强制执行的地方。不断加长 AGENTS.md，仍然需要智能体逐条遵守指令。\n\n3. 消除可预见的犯错机会。\n她所在的 @SpaceXSI 团队只允许在框架内部使用 React 的 useEffect，因为智能体反复在产品代码中误用它。他们还强制约束应用进程之间的导入边界。这些限制消除了整类错误，否则它们会在代码审查中反复出现。\n\n4. 为智能体提供可靠的产品运行与检查方式。\n提供调试工具、可复用的 CLI，以及从用户视角描述应用的“功能地图”。这样，“左侧边栏里的那个东西”就有了共同含义，每个智能体也都能复用工具来检查它。\n\n5. 审查实际行为的证据。\n让智能体提供截图、视频和状态图。这些能帮助你确认产品实际做了什么，以及与预期有多接近。生成一段令人信服的修复说明很容易；亲眼看到修复生效，要有用得多。\n\n6. 在验证上投入足够精力。\n她的团队使用运行时验证，并正在尝试基于属性的 UI 测试和形式化方法，包括 TLA+ 模型检查。Lauren 表示，她的大部分 token 用量都花在验证上。智能体让一些过去成本高昂的测试工作变得切实可行。\n\n7. 等这套循环可靠后，再实现自动化。\n如今，她的团队已让智能体自动测试新版本、发现缺陷、提交修复并合并。为了建立这种程度的信任，她花了大约六个月完善开发环境。\n\n据她介绍，团队一个月交付了 11,000 个拉取请求，回滚率约为 0.5%，启动、输入和聊天切换体验也都有改善。\n\n那么，那个声名狼藉的“软件工厂”呢？\n\n如果你的编程循环产出的是低质代码，自动化只会让它以更快的速度产出更多低质代码，并带来更高的 token 账单。\n\n先让优质代码成为智能体最容易产出的结果，再扩大规模。\n@aiDotEngineer 的内容一如既往地含金量十足 🏆"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120906611195813888/img/kaog4M-o8pwM77r0.jpg", "width": 720, "height": 1280, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120906611195813888/img/kaog4M-o8pwM77r0.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120906611195813888/vid/avc1/720x1280/7vRHT7x3h104OnhR.mp4?tag=29", "durationMs": 11938}], "expert": {"priority": "P1", "domain": "Agent / 工作流", "name": "swyx", "role": "Latent Space / AI Engineer", "why": "AI 工程社区、Agent、开发工具信号源", "handle": "swyx"}, "createdAtIso": "2026-11-12T15:48:41+00:00", "createdAtBeijing": "2026-11-12T23:48:41+08:00", "createdAtLocal": "11-12 23:48 北京", "url": "https://x.com/swyx/status/2120906636609065396", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2120906636609065396", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "提高编码Agent可靠性的工程实践", "evidence": "Turn corrections into enforceable checks.", "rationale": "包含约束、调试和验证方法，成效为讲者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "笔记很棒 https://t.co/kEyQa0j6r1\n\n顺便说一句，我们喜欢小规模 Summit，而不是万人博览会，一个很好的原因就是：我们确实能与每个人见面，并提供更高质量的体验。看看今天早上这丰盛的一桌！！https://t.co/SLvGYBsmPh"}, "avatar": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, {"id": "2120921239619612921", "track": "research", "source": {"id": "2120921239619612921", "text": "Today we’re introducing ParseBench-2 - our most ambitious document parsing benchmark to date.\n\nIt is the only benchmark that provides both extreme granularity into every single type of production parsing error, while also making sure that metric scores are highly aligned with human judgment. We do this by painstakingly assigning severity scores to 330+ error types, and tuning each metric to match the severity scores. \nExisting benchmarks either use brittle deterministic metrics (e.g. OmniDocBench) or LLM-as-a-judge (ParseArena), which can help recognize equivalent representations but are coarse/stochastic/subject to bias by the prompt+model.\n\nParseBench-2 also contains:\n✅ 4.3k+ document pages (double from ParseBench-1).\n✅ An extra dimension (forms)\n✅ Much better ground-truth across all dimensions compared to ParseBench-1.\n\nThis is the next evolution of ParseBench, our hugely popular benchmark that has 50k+ monthly downloads, over 150+ OCR solutions benchmarked, and has been adopted by companies like NVIDIA, Cohere, Aleph Alpha, Perplexity, and others.\n\nAlongside ParseBench-2, we are also releasing OCRia-1.5 - a new family of document parsing models that powers all our modes in LlamaParse. They represent a massive step up in capabilities from our latest release, and are state of the art in parsing complex tables, forms, charts, formatting, and assigning bounding boxes to complex layouts.\n\nCome check out our blog post, technical report, and website.\n\nBlog: https://t.co/TKbfCyTjht\nTechnical Report: https://t.co/eAu0s6ttA1\nWebsite: https://t.co/PWczfhp0OX\n\nIf you’re interested in trying out our OCRia-1.5 capabilities, come sign up for LlamaParse: https://t.co/XYZmx5TFz8", "createdAt": "Thu Nov 12 16:46:42 +0000 2026", "replyCount": 71, "retweetCount": 22, "likeCount": 123, "conversationId": "2120921239619612921", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120918905564934150/img/aNxe4MZD-e4CRt3L.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120918905564934150/img/aNxe4MZD-e4CRt3L.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120918905564934150/vid/avc1/3840x2160/1zMkM_LouY39o-de.mp4?tag=29", "durationMs": 167042}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-12T16:46:42+00:00", "createdAtBeijing": "2026-11-13T00:46:42+08:00", "createdAtLocal": "11-13 00:46 北京", "url": "https://x.com/jerryjliu0/status/2120921239619612921", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2120921239619612921", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ParseBench-2 与 OCRia-1.5 发布", "evidence": "severity scores to 330+ error types", "rationale": "发布解析基准及模型，详述错误分级与数据规模"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "今天，我们推出 ParseBench-2——迄今为止我们最具雄心的文档解析基准。\n\n它是唯一既能极细致地分析生产环境中各类解析错误，又能确保指标评分与人类判断高度一致的基准。为此，我们逐一为 330 多种错误类型评定严重程度，并调整各项指标，使其与这些评分相匹配。\n现有基准要么采用脆弱的确定性指标（如 OmniDocBench），要么采用 LLM 评审（ParseArena）。后者有助于识别等价的表达形式，但评估较粗、具有随机性，也容易受到提示词和模型的偏差影响。\n\nParseBench-2 还包含：\n✅ 4,300 多页文档（是 ParseBench-1 的两倍）。\n✅ 新增一个评估维度：表单。\n✅ 相比 ParseBench-1，所有维度的标准答案质量都大幅提升。\n\n这是 ParseBench 的新一代版本。这个广受欢迎的基准每月下载量超过 5 万次，已评测 150 多种 OCR 方案，并被 NVIDIA、Cohere、Aleph Alpha、Perplexity 等公司采用。\n\n与 ParseBench-2 一同发布的还有 OCRia-1.5——一个全新的文档解析模型系列，为 LlamaParse 的所有模式提供支持。相比上一版本，其能力大幅提升，在复杂表格、表单、图表、格式解析，以及为复杂版面标注边界框方面达到领先水平。\n\n欢迎查看我们的博客、技术报告和网站。\n\n博客：https://t.co/TKbfCyTjht\n技术报告：https://t.co/eAu0s6ttA1\n网站：https://t.co/PWczfhp0OX\n\n如果你想体验 OCRia-1.5 的能力，欢迎注册 LlamaParse：https://t.co/XYZmx5TFz8"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2120671238570045609", "track": "research", "source": {"id": "2120671238570045609", "text": "Google 推出 Gemini Decision 1 模型\n\n从名字就能看出，是又一个决策模型。在 Jet 推出后，各大 LLM API 和独立 LLM 模型团队都推出了自己的 Jet，这对 Google 确实也是很有必要的组合部分。如果你正在使用 Google AI Studio API，可以看：\nhttps://t.co/TFBJjtcGYl \n\nDecisions API 使用模型 gemini-decision-1，把同一份输入和最多 1,000 道彼此独立的问题一起送进去，在一次推理中完成打分，返回校准后的概率和置信度，不生成任何文本，输出 token 恒为 0。\n\n问题只有三类：判断是或否（给出「是」的概率）、在固定选项中选一个、按有顺序的等级打分。程序用这些数字去做路由、过滤，或决定是否交给人工处理，而不是等待一段解释。如果需要摘要、理由或自定义 JSON，文档明确建议改用普通生成接口。\n\n每 1M 输入 token 0.10 美元，不另收输出费；同一份共享输入只计一次，各问题只追加自己的说明。免费档输入免费，但官方配额为每分钟 200 次请求、5 万 token，每天 1 万次；免费档内容会用于改进产品，付费档不会。", "createdAt": "Thu Nov 12 00:13:18 +0000 2026", "replyCount": 15, "retweetCount": 0, "likeCount": 7, "conversationId": "2120671238570045609", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2120581433639198885", "text": "Introducing Gemini Decision 1, our new frontier decision  model in the Gemini API.\n\nIt is $0.10 per 1M input tokens with no additional cost. With support for image, audio, video, and PDF natively, 256K context window, &amp; 1K questions.\n\nYou can try it for free in the API! https://t.co/Pa6pIaQyoy", "createdAt": "Wed Nov 11 18:16:26 +0000 2026", "replyCount": 584, "retweetCount": 609, "likeCount": 10318, "conversationId": "2120581433639198885", "author": {"username": "OfficialLoganK", "name": "Logan Kilpatrick", "profileImageUrl": "https://pbs.twimg.com/profile_images/1943787288955084800/QOl7OJMc_normal.jpg"}, "authorId": "284333988", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3Mvh9aoAAmICR.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HW3Mvh9aoAAmICR.jpg:small"}], "translationZh": "推出 Gemini Decision 1：Gemini API 中全新的前沿决策模型。\n\n每 100 万输入 token 仅需 0.10 美元，无额外费用。原生支持图像、音频、视频和 PDF，提供 256K 上下文窗口，并支持 1,000 个问题。\n\n你可以通过 API 免费试用！https://t.co/Pa6pIaQyoy"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4jPdsacAABRN_.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW4jPdsacAABRN_.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-12T00:13:18+00:00", "createdAtBeijing": "2026-11-12T08:13:18+08:00", "createdAtLocal": "11-12 08:13 北京", "url": "https://x.com/shao__meng/status/2120671238570045609", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2120671238570045609", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Gemini Decision 1 决策模型与接口发布", "evidence": "返回校准后的概率和置信度", "rationale": "材料列出决策任务、接口限制与计费细节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120724047139115370", "track": "research", "source": {"id": "2120724047139115370", "text": "谷歌 DeepMind 11 月 11 日发布了 AlphaGenome 2。给它 DNA 上的一个变异，它能预测这个变异会在哪种细胞里起作用，把哪个基因调高还是调低。\n\n1. 能看到具体哪种细胞了。我们每个细胞的 DNA 都一样，但心肌细胞、免疫细胞打开的基因不一样，很多致病变异只在某一种细胞里起作用。上一代只能看一整块组织的平均值，这种信号一平均就没了。这一代用 1 亿多个单细胞的数据训练，覆盖 68 种组织。\n\n2. 30 分钟复现了一年半的实验。2024 年，英国克里克研究所的团队用基因编辑等实验，找到炎症性肠病的一个致病变异：它让肠道巨噬细胞里的 ETS2 基因开得过高。AlphaGenome 2 在电脑上挑出了同一个变异，也指出了同一种细胞。团队负责人对 Nature 说，他们 30 分钟算出来的，自己做实验花了一年半。\n\n3. 找致病变异的能力多了将近一倍。在 28 种免疫细胞的数据上，找出致病变异的比例从 16% 提到 30%，判断基因调高还是调低从 23% 提到 43%。这是 DeepMind 自己测的。\n\n4. 新数据不用重新训练。放进几十个细胞的测序结果，就能预测病人、打完疫苗这类新的细胞状态。\n\n5. 目前只供研究用。官方写明没有经过临床或诊断验证。非商业研究可以通过 API 使用，商业研究在小范围预览。\n\n再说癌症和糖尿病。原文里 2 型糖尿病是作为例子出现的：DeepMind 提前给一批和疾病相关的变异算好了打分，从身高到 2 型糖尿病，帮研究者找出最可能起作用的变异和细胞。癌症这次原文没有直接写，但上一代 AlphaGenome 发布时，官方演示的就是一种白血病的致病突变。这一代能精确到细胞类型，用在癌症研究上是很自然的方向。\n\n简单来说，AlphaGenome 2 把\"哪个变异、哪个基因、在哪种细胞里\"这一步先放到电脑上筛一遍，实验室再去验证。离治病还远，但研究肯定会快很多。", "createdAt": "Thu Nov 12 03:43:08 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2120724047139115370", "author": {"username": "situking", "name": "司徒K", "profileImageUrl": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, "authorId": "1518825568959176705", "quotedTweet": {"id": "2120558700054102372", "text": "BREAKING: Google DeepMind announces breakthrough in AI-powered genetics, unveiling a model that can potentially accelerate discoveries in cancer, diabetes, &amp; other diseases.", "createdAt": "Wed Nov 11 16:46:06 +0000 2026", "replyCount": 122, "retweetCount": 538, "likeCount": 6093, "conversationId": "2120558700054102372", "author": {"username": "Polymarket", "name": "Polymarket", "profileImageUrl": "https://pbs.twimg.com/profile_images/2005664281002491904/bz2ZO_nU_normal.jpg"}, "authorId": "1261335549215989760", "translationZh": "突发：Google DeepMind 宣布在 AI 驱动的遗传学研究中取得突破，推出一款有望加速癌症、糖尿病及其他疾病相关发现的模型。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW5SLuRbcAAD15N.jpg", "width": 2048, "height": 1372, "previewUrl": "https://pbs.twimg.com/media/HW5SLuRbcAAD15N.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW5SR61bgAAEU1-.jpg", "width": 1671, "height": 1131, "previewUrl": "https://pbs.twimg.com/media/HW5SR61bgAAEU1-.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW5SW25bMAAtKIQ.jpg", "width": 1209, "height": 768, "previewUrl": "https://pbs.twimg.com/media/HW5SW25bMAAtKIQ.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW5SiHPbcAA3FUY.jpg", "width": 1269, "height": 981, "previewUrl": "https://pbs.twimg.com/media/HW5SiHPbcAA3FUY.jpg:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "司徒K", "role": "企业落地与产品组织实践与观察", "why": "有 FDE 进场交付问答及企业服务方法，补足咨询和交付视角。", "handle": "situking"}, "createdAtIso": "2026-11-12T03:43:08+00:00", "createdAtBeijing": "2026-11-12T11:43:08+08:00", "createdAtLocal": "11-12 11:43 北京", "url": "https://x.com/situking/status/2120724047139115370", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2120724047139115370", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "AlphaGenome 2细胞类型变异预测", "evidence": "这一代用1亿多个单细胞的数据训练", "rationale": "包含具体能力、实验案例及使用边界，待核验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, {"id": "2120884831223775320", "track": "tools", "source": {"id": "2120884831223775320", "text": "Just published a post on the @ApacheOpenDAL blog sharing two years of lessons learned from building ScopeDB's storage layer in Rust:\n\n\"Skipping Cloud Vendor SDKs: How ScopeDB Accesses Object Storage with Apache OpenDAL\"\n\nAt first glance, object storage looks like simple GET, PUT, LIST, and DELETE calls. Once a database relies on it for live queries and compaction, though, the real work lives in the details: merging sparse columnar byte ranges on cache misses and keeping CPU-heavy query execution from starving async storage I/O. OpenDAL handles these patterns cleanly and efficiently.\n\nOpenDAL's composable Layer design also saved us from reinventing middleware. Pairing TimeoutLayer and RetryLayer lets foreground reads cut off a stalled chunk early instead of hanging, while OtelMetricsLayer tracks request latency and retries.\n\nCloud authentication was just as clean. Moving from encrypted static keys to Pod Identity, IMDS, and OIDC required very little code thanks to Apache Reqsign, which started as an OpenDAL subproject and is now an ASF Top-Level Project, where I currently serve as PMC Chair. Notably, uv, the Python package manager, also authenticates to cloud object storage with Reqsign.\n\nSince I also mentored OpenDAL and serve on its PMC, the catch with betting your own database on projects you mentor and chair is that when S3-compatible services misbehave under load, you can't just file an issue and complain. You end up sending the fixes upstream yourself :D\n\nFull post in the first comment.", "createdAt": "Thu Nov 12 14:22:02 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 3, "conversationId": "2120884831223775320", "author": {"username": "tison1096", "name": "tison", "profileImageUrl": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, "authorId": "740784709878288384", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7ld07aEAEFmmG.jpg", "width": 2048, "height": 1236, "previewUrl": "https://pbs.twimg.com/media/HW7ld07aEAEFmmG.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "tison（陈梓立）", "role": "Agent 与开发工具实践与观察", "why": "公开 Agent 参与版本变更确认、验收和测试治理，企业工程价值具体。", "handle": "tison1096"}, "createdAtIso": "2026-11-12T14:22:02+00:00", "createdAtBeijing": "2026-11-12T22:22:02+08:00", "createdAtLocal": "11-12 22:22 北京", "url": "https://x.com/tison1096/status/2120884831223775320", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2120884831223775320", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "ScopeDB 使用 OpenDAL 的存储工程经验", "evidence": "TimeoutLayer and RetryLayer", "rationale": "具体分享范围读取、异步隔离、重试与认证实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "刚在 @ApacheOpenDAL 博客发表了一篇文章，分享过去两年用 Rust 构建 ScopeDB 存储层的经验：\n\n《绕过云厂商 SDK：ScopeDB 如何通过 Apache OpenDAL 访问对象存储》\n\n乍看之下，对象存储无非是 GET、PUT、LIST 和 DELETE 调用。但当数据库依赖它进行实时查询和数据合并时，真正的难点都藏在细节里：缓存未命中时合并列式数据中稀疏分布的字节区间，以及避免 CPU 密集型查询执行挤占异步存储 I/O 的执行机会。OpenDAL 能简洁、高效地处理这些场景。\n\nOpenDAL 可组合的 Layer 设计也让我们免去了重复开发中间件的工作。搭配 TimeoutLayer 和 RetryLayer，前台读取就能及早中断停滞的数据块请求，避免一直等待；OtelMetricsLayer 则负责跟踪请求延迟和重试情况。\n\n云端身份认证同样简洁。得益于 Apache Reqsign，从加密存储的静态密钥迁移到 Pod Identity、IMDS 和 OIDC，只需改动很少的代码。Reqsign 最初是 OpenDAL 的子项目，如今已成为 ASF 顶级项目，我目前担任其 PMC 主席。值得一提的是，Python 包管理器 uv 也通过 Reqsign 完成云对象存储的身份认证。\n\n我也曾担任 OpenDAL 的孵化导师，目前仍是其 PMC 成员。让自己的数据库依赖自己指导和主持的项目，有个小问题：当兼容 S3 的服务在高负载下出状况时，你没法只提个 issue 抱怨，最后还是得自己把修复贡献给上游 :D\n\n全文见第一条评论。"}, "avatar": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, {"id": "2120913548284936306", "track": "research", "source": {"id": "2120913548284936306", "text": "Can robots approach human-speed manipulation?\n\nTeleop yields slower data, while UMI tracking degrades with higher speeds.\n\nFlash ALOHA has people directly guide the robot, yielding fast data with accurate tracking.\n\nPaper, code, hardware: https://t.co/ZWqWYKJUdB", "createdAt": "Thu Nov 12 16:16:09 +0000 2026", "replyCount": 11, "retweetCount": 7, "likeCount": 215, "conversationId": "2120913548284936306", "author": {"username": "chelseabfinn", "name": "Chelsea Finn", "profileImageUrl": "https://pbs.twimg.com/profile_images/1531702062487965698/a6iO2pRx_normal.jpg"}, "authorId": "2577596593", "quotedTweet": {"id": "2120719263992565828", "text": "Introducing ⚡️Flash ALOHA: Learning Fast and Precise Manipulation!\n\nWith just 50 demonstrations, Flash ALOHA learns to autonomously complete dynamic and precise tasks at near human speed.\n\nEverything open sourced!\n\n(1/11)\n\nTeam:\n@Qi_Wu577 @YihuaiGao @chelseabfinn @zipengfu", "createdAt": "Thu Nov 12 03:24:08 +0000 2026", "replyCount": 31, "retweetCount": 77, "likeCount": 609, "conversationId": "2120719263992565828", "author": {"username": "JohnHYao", "name": "John Yao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099615854975725568/AgyDXWsN_normal.jpg"}, "authorId": "1575483949442551811", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120713443468865536/img/nnB-az2MLFGBaILy.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120713443468865536/img/nnB-az2MLFGBaILy.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120713443468865536/vid/avc1/1920x1080/qEBqDb6sgLKP-sOC.mp4?tag=29", "durationMs": 74164}], "translationZh": "推出 ⚡️Flash ALOHA：学习快速、精准的操作！\n\n仅需 50 次示范，Flash ALOHA 就能学会以接近人类的速度，自主完成动态且精细的任务。\n\n全部开源！\n\n(1/11)\n\n团队：\n@Qi_Wu577 @YihuaiGao @chelseabfinn @zipengfu"}, "expert": {"priority": "P1", "domain": "机器人 / AI", "name": "Chelsea Finn", "role": "Stanford", "why": "机器人学习、元学习、具身 AI", "handle": "chelseabfinn"}, "createdAtIso": "2026-11-12T16:16:09+00:00", "createdAtBeijing": "2026-11-13T00:16:09+08:00", "createdAtLocal": "11-13 00:16 北京", "url": "https://x.com/chelseabfinn/status/2120913548284936306", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2120913548284936306", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Flash ALOHA高速精确机器人操作", "evidence": "With just 50 demonstrations", "rationale": "发布论文代码硬件，报告少量演示学习成果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "机器人的操作速度能接近人类吗？\n\n遥操作采集的数据速度偏慢，而 UMI 的跟踪精度会随着速度提升而下降。\n\nFlash ALOHA 让人直接引导机器人，既能采集高速操作数据，又能保持准确跟踪。\n\n论文、代码、硬件：https://t.co/ZWqWYKJUdB"}, "avatar": "https://pbs.twimg.com/profile_images/1531702062487965698/a6iO2pRx_normal.jpg"}, {"id": "2120736292938170538", "track": "growth", "source": {"id": "2120736292938170538", "text": "这里话题里说的 UGC，是从平台方角度考虑，利用用户在平台使用过程中留下来的内容去谷歌等搜索引擎获取流量。\n\n截图中拿 gamma 来举例的，gamma 允许这些 ugc 页面被搜索引擎抓取，想要多拿各种关键词的流量。\n\n然后就被搞黑灰产的 SEOer 盯上了，用 gamma 的这个机制，去生成一些页面，利用 gamma 的高权重拿流量。\n一般都是各种色情、赌博、骗局等才会有这么敏锐的嗅觉。\n\n现在 gamma 没有做好内容把关，把这些内容都直接放出来了，就可能被坏人提交的这些内容搞坏域名。", "createdAt": "Thu Nov 12 04:31:48 +0000 2026", "replyCount": 8, "retweetCount": 1, "likeCount": 7, "conversationId": "2120736292938170538", "author": {"username": "gefei55", "name": "哥飞", "profileImageUrl": "https://pbs.twimg.com/profile_images/1600285780555202560/TE8ad_yJ_normal.jpg"}, "authorId": "362252075", "quotedTweet": {"id": "2120684816115134835", "text": "@GammaApp 的 /docs/ 下的页面成为了 parasite SEO的目标。\n\n当这个网站的UGC内容开始排 P, NSFW，和过多的AIGC的spam内容之后，应该过不了多久，这些页面都被被谷歌给K掉吧。\n\nK完以后整个网站都有可能有问题。\n\n大型网站想要通过UGC的内容去做自然流量，一定要做 Quality 和 Spam的阀门。\n\n我第一次知道 UGC 质量阀门的概念，是听 @kimuyan 在去年Google Search Central Live 上讲的。他管理的Ameblo就上了一套类似的Filter 系统来管控 UGC的内容是否可以Index。\n\n上次在深圳和他聊这个事儿的时候，我记得他说他们是好几年前就做这个了。", "createdAt": "Thu Nov 12 01:07:15 +0000 2026", "replyCount": 7, "retweetCount": 2, "likeCount": 14, "conversationId": "2120684816115134835", "author": {"username": "loki_yan_seo", "name": "Loki Yan SEO", "profileImageUrl": "https://pbs.twimg.com/profile_images/1951567332691869696/5c6s4IyU_normal.jpg"}, "authorId": "629403016", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4silMaYAAUtRU.jpg", "width": 2048, "height": 1601, "previewUrl": "https://pbs.twimg.com/media/HW4silMaYAAUtRU.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW4tKvRacAAr6ZJ.jpg", "width": 2048, "height": 1362, "previewUrl": "https://pbs.twimg.com/media/HW4tKvRacAAr6ZJ.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW4tStDbMAA9uKG.jpg", "width": 2048, "height": 1454, "previewUrl": "https://pbs.twimg.com/media/HW4tStDbMAA9uKG.jpg:small"}]}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "哥飞", "role": "出海、SEO 与增长实践与观察", "why": "展示不同规模网站的 SEO 策略与点击数据，贴合出海增长需求。", "handle": "gefei55"}, "createdAtIso": "2026-11-12T04:31:48+00:00", "createdAtBeijing": "2026-11-12T12:31:48+08:00", "createdAtLocal": "11-12 12:31 北京", "url": "https://x.com/gefei55/status/2120736292938170538", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2120736292938170538", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "UGC寄生SEO风险与索引质量控制", "evidence": "管控 UGC的内容是否可以Index", "rationale": "结合案例说明垃圾内容风险与索引过滤方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1600285780555202560/TE8ad_yJ_normal.jpg"}, {"id": "2120842794881433647", "track": "agent", "source": {"id": "2120842794881433647", "text": "Artificial Analysis 这张对比图挺能说明问题的。在现在的 Claude 阵容里，直接升一档模型，有时比把低一档模型的推理强度拉满还划算。\n\n比如 Opus 5.5 开 xhigh 拿到 57 分，超过 Sonnet 5.5 开 max 的 55 分，每个任务的成本反而低了 40%，耗时也差不多减半。\n\nFable 5.2 更夸张。high 档就能超过 Opus 5.5 的 max，得分高 3 分，成本低约 10%，耗时减少 34%；甚至 Fable 5.2 的 low 也能超过 Opus 5.5 的 high。\n\n不过在最便宜的 Haiku 档，这个规律就不成立了。而且这是综合 Benchmark 的结果，具体任务还得单独验证。\n\n感觉以后给 Agent 配模型，真得重新算算账了。模型档位、推理强度、成本和延迟放在一起比较，可能会发现不少意外的最优组合。", "createdAt": "Thu Nov 12 11:35:00 +0000 2026", "replyCount": 0, "retweetCount": 1, "likeCount": 9, "conversationId": "2120842794881433647", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2120672485167497335", "text": "With the current Claude lineup, moving up a model tier beats maxing out effort to achieve the highest intelligence per dollar\n\nAt nearly every Cost per Task, we see the largest model sits on the performance vs. cost Pareto frontier for @AnthropicAI models:\n\n➤ Claude Opus 5.5 (xhigh, 57) outscores Claude Sonnet 5.5 (max, 55) with 40% lower Cost per Task and about half the Time per Task\n➤ Claude Fable 5.2 (high) beats Opus 5.5 (max), with smaller cost and time savings, and Fable 5.2 (low) beats Opus 5.5 (high)\n➤ This pattern doesn’t hold at the cheapest tier, where every step up from Claude Haiku 5.5 (max) costs more", "createdAt": "Thu Nov 12 00:18:15 +0000 2026", "replyCount": 62, "retweetCount": 25, "likeCount": 487, "conversationId": "2120672485167497335", "author": {"username": "ArtificialAnlys", "name": "Artificial Analysis", "profileImageUrl": "https://pbs.twimg.com/profile_images/2042402069320290304/A8C1lP07_normal.jpg"}, "authorId": "1743487864934162432", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4jSb3b0AAxO4Q.jpg", "width": 2048, "height": 1604, "previewUrl": "https://pbs.twimg.com/media/HW4jSb3b0AAxO4Q.jpg:small"}], "translationZh": "在当前 Claude 模型阵容中，要获得最高的单位成本智能水平，升级模型档位比把推理强度拉满更划算。\n\n在几乎所有单任务成本水平下，@AnthropicAI 规模最大的模型都处于性能与成本的帕累托前沿：\n\n➤ Claude Opus 5.5（xhigh，57 分）的得分高于 Claude Sonnet 5.5（max，55 分），单任务成本低 40%，耗时约为一半。\n➤ Claude Fable 5.2（high）优于 Opus 5.5（max），成本和耗时也略有降低；Fable 5.2（low）则优于 Opus 5.5（high）。\n➤ 这一规律不适用于最低价档位：从 Claude Haiku 5.5（max）往上升级，每一档的成本都会增加。"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-12T11:35:00+00:00", "createdAtBeijing": "2026-11-12T19:35:00+08:00", "createdAtLocal": "11-12 19:35 北京", "url": "https://x.com/Xudong07452910/status/2120842794881433647", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2120842794881433647", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent模型档位与推理强度的成本权衡", "evidence": "每个任务的成本反而低了 40%", "rationale": "引用基准比较成本与延迟，并提示按任务验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120688864948081113", "track": "creative", "source": {"id": "2120688864948081113", "text": "给大家带来 minimax-h3-image+comfyUI实测, 直接说结论, 它的生成速度非常快, 我测试的设备是 MacStudio M2 Ultra 128GB,  140s就可以生成四百万像素的图片, 而 QwenImage2.1则需要15分钟.\n但是细节上还是有差距的, 毕竟是 6step VS 20step, 所以我更推荐用它生成矢量图风格的图片, 比如卡通, 海报等大量色块的图片(涂抹感不会很明显). 而特写, 模特图, 人像等还是建议用QwenImage2.1或者FLUX.2这种模型来生成.\n\n(声明: 本视频中生成的人像图片仅为大模型测试之用途, 视频中的人物使用提示词生成, 未输入任何人物照片或者参考图片, 不涉及到侵权)\n\n#minimaxh3image #minimaxh3 #qwenimage #qwenimage21", "createdAt": "Thu Nov 12 01:23:20 +0000 2026", "replyCount": 13, "retweetCount": 3, "likeCount": 42, "conversationId": "2120688864948081113", "author": {"username": "karminski3", "name": "karminski-牙医", "profileImageUrl": "https://pbs.twimg.com/profile_images/1071225168360427520/2tY0hY6b_normal.jpg"}, "authorId": "1071224721046261760", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120688089299562496/img/Vo9Zm3G8jxJ8w-C-.jpg", "width": 1820, "height": 2048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120688089299562496/img/Vo9Zm3G8jxJ8w-C-.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120688089299562496/vid/avc1/1920x2160/ConC494aYbVm2hgT.mp4?tag=29", "durationMs": 65735}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "karminski-牙医", "role": "模型、研究与推理实践与观察", "why": "有配置分析、模型实测和推理适配观察，具体技术信息较多。", "handle": "karminski3"}, "createdAtIso": "2026-11-12T01:23:20+00:00", "createdAtBeijing": "2026-11-12T09:23:20+08:00", "createdAtLocal": "11-12 09:23 北京", "url": "https://x.com/karminski3/status/2120688864948081113", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2120688864948081113", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "MiniMax-H3-Image与QwenImage生成实测", "evidence": "140s就可以生成四百万像素的图片", "rationale": "自述硬件、耗时与步数，给出创作选型建议"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1071225168360427520/2tY0hY6b_normal.jpg"}, {"id": "2120805046858428515", "track": "tools", "source": {"id": "2120805046858428515", "text": "写技术文章、做项目介绍的时候，画架构图真的挺磨人：找 Logo、排版、拉线，好不容易画完，换个深色背景又得调整。\n\nstack-diagram 想解决的，就是这段从“我知道系统怎么工作”到“我有一张能拿出去讲的图”的距离。\n\n装进 Claude Code、Codex、Cursor 这类支持 Skills 的工具后，就能用自然语言描述自己的系统。\n\n比如“Next.js 和 Hono 部署在 Vercel，数据库用 Neon，认证用 Clerk，支付用 Stripe”，让助手帮你整理节点、分组和连线，再生成带品牌 Logo 的架构图。\n\n它会从图标库或厂商资源中获取标识，还要求助手在交付前渲染检查，尽量避免箭头压字、图标看不清这些问题。\n\n输出也挺实用：\n默认是一个内联图标和字体的 HTML 文件，可以离线打开、继续修改；\n需要放进公众号或 PPT，也能导出浅色、深色两套 PNG，还支持整理成 React 组件。\n\n除了常见的 Web 技术栈，AI 应用、开发工具链，以及 AWS、Google Cloud、Azure 架构也都能画。\n\n不过，想让图画得准确，最好把“谁调用谁、服务放在哪里”说清楚，只给一串工具名，模型还是可能猜错。复杂系统也建议拆成几张图，再逐一核对。", "createdAt": "Thu Nov 12 09:05:00 +0000 2026", "replyCount": 8, "retweetCount": 1, "likeCount": 2, "conversationId": "2120805046858428515", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2100474427490398353", "text": "如果以前让 Claude Code、Codex 画过架构图，应该见过那种很典型的“AI 味”：\n\n一堆差不多大小的圆角框、满屏箭头、颜色都差不多，信息是对的，但放进文章、PPT 或产品文档里，总感觉差点意思。\n\nDiagram Design 想解决的就是这个问题。它不是让 AI “随便画漂亮一点”，而是直接把一套设计规则交给 Agent：\n\n该选什么图、信息放多少、颜色怎么用、哪些内容应该删、不同受众应该看到什么，最后生成 HTML、SVG 或 PNG。\n\n目前它已经支持架构图、流程图、时序图、数据流、ER 图、甘特图、Sankey、Treemap 等 39 种视觉类型。\n\n比较有意思的是，它还可以把现有 Mermaid 或 https://t.co/IHSOkdKBF9 图重新排版。\n\n不是简单换个皮肤，而是先理解原来的节点和关系，再按照新的尺寸、受众和信息密度重新画一遍。\n\n如果你需要拖拽编辑、多人协作、像素级控制，还是传统工具更合适。\n\n但如果你平时已经大量用 Claude Code、Codex 写技术文章、做产品文档或者 PPT，这个项目也够用。", "createdAt": "Thu Sep 17 06:38:23 +0000 2026", "replyCount": 3, "retweetCount": 63, "likeCount": 394, "conversationId": "2100474427490398353", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSZiWneaQAAioch.jpg", "width": 704, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HSZiWneaQAAioch.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HSZiWnqasAAu3ez.jpg", "width": 356, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HSZiWnqasAAu3ez.jpg:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120789138995847168/img/bZ1k_KNWTyeBEVLK.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120789138995847168/img/bZ1k_KNWTyeBEVLK.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120789138995847168/vid/avc1/1920x1080/yIyp2dw0nt8-QMGQ.mp4?tag=29", "durationMs": 297282}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-12T09:05:00+00:00", "createdAtBeijing": "2026-11-12T17:05:00+08:00", "createdAtLocal": "11-12 17:05 北京", "url": "https://x.com/sitinme/status/2120805046858428515", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2120805046858428515", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "stack-diagram 架构图生成技能", "evidence": "默认是一个内联图标和字体的 HTML 文件", "rationale": "说明输入、输出、渲染检查与复杂系统拆图方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2120789791113654765", "track": "agent", "source": {"id": "2120789791113654765", "text": "这个风险确实有，我没法保证不会封号。Pinky 是在你自己的手机上按你的指令点按：安卓走 USB 调试和无障碍服务，iPhone 走苹果的开发者服务。它不改 App，也不调 App 的接口，付款、发送这类步骤会先停下来等你点允许。不过有些 App 会检测 USB 调试、无障碍服务或者自动化操作，银行类 App 开着无障碍服务就不让用，所以 Pinky 默认不让 agent 碰它们。有的平台规则也不允许自动化操作账号。稳妥点的话，重要账号先别用，频率别太高，先拿不怕出问题的 App 试。", "createdAt": "Thu Nov 12 08:04:23 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 2, "conversationId": "2120484685503762711", "inReplyToStatusId": "2120484685503762711", "author": {"username": "DIYgod", "name": "DIŸgöd ☀️", "profileImageUrl": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, "authorId": "1553713718", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "DIYgod", "role": "开源产品与工程实践实践与观察", "why": "把 Agent 大规模用于 RSSHub 审查和测试，有真实维护对象。", "handle": "DIYgod"}, "createdAtIso": "2026-11-12T08:04:23+00:00", "createdAtBeijing": "2026-11-12T16:04:23+08:00", "createdAtLocal": "11-12 16:04 北京", "url": "https://x.com/DIYgod/status/2120789791113654765", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2120789791113654765", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "手机Agent自动化机制与账号风险", "evidence": "付款、发送这类步骤会先停下来等你点允许", "rationale": "说明实现方式、授权边界及平台风险，属于作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, {"id": "2120690544825250061", "track": "creative", "source": {"id": "2120690544825250061", "text": "我去真的后悔没早点用上啊，@chatcutapp帮我打开了全新的剪辑思路——直接用手机版Grok bot实现了云剪辑，爽飞啊！出门在外，再也不用背电脑，一部手机，随时随地剪辑。\n\n之前一直没意识到Grok Bot的应用场景，这两天做数字人的时候，刚好用iPhone录制了几段很长的原始口播素材，但感觉上传到Mac再剪辑太麻烦了，我就在想，能不能用手机就把视频给剪辑了？云Agent似乎可以操作？🤔\n\n所以我直接掏出Grok Bot，结果发现这家伙只支持196MB以下的视频。。。\n\n最后神级解决方案就是用ChatCut生成一个上传链接，然后打开链接就能上传视频到ChatCut的云上，再操控Grok Bot来剪辑。\n\nChatCut真的是不用不知道，绝对的宝藏工具，用上剪辑（认知）水平都能提升一大截。\n\n有个“素材库”，里面包含了MG动画、音效、转场、特效、缩放、LUT、音频效果。对于没有一点剪辑实力的我来说，真的太友好了。。。直接挑选模板就能一键应用，傻瓜式永远是最牛逼（摩擦最小）的产品🤪\n\n而且口播剪辑、MG动画、加字幕、调色这些基础功能，全部都是免费的，所以手机云剪辑基本没啥成本。添加MG动画的时候，用Grok Bot还能给我几个模板让我挑选，如果是Claude Code，可能一口气干完了然后再返工。。。\n\n如果还需要进阶剪电商类或者财经类的精品视频，chatcut内置的也有图片生成、视频生成、音乐生成、音效生成、数字人克隆这些功能。\n\nGrok Bot手机云剪辑的应用场景还有很多：\n1、把手机相册里面的照片和各种视频片段，剪辑成Vlog直接发抖音、小红书。\n2、比如我开发的Glimdo App，我接下来打算在小红书再卖一波，所以大概率就用iPhone内录，Grok Bot+ChatCut手机上就剪辑完了。\n3、为啥我感觉Grok Bot剪辑很好？真的是随时随地都可以剪辑，打车的时候很无聊，没法集中精神工作，就适合personal agent这种碎片化工作，对ADHD真的很友好。\n使用方法也很简单：\n\n1、新建一个“视频剪辑”Bot。\n2、发送指令：Read https://t.co/ecbc3EojiG to connect the ChatCut app。\n3、Bot 会读取安装指南，引导用户在对话内给连接器授权，同时安装好skill。\n4、然后发送指令：生成一个ChatCut上传链接，把想要剪辑的视频在打开的网页里面上传。\n5、正常和Grok Bot对话（语音输入法），畅享vibe editing。", "createdAt": "Thu Nov 12 01:30:01 +0000 2026", "replyCount": 31, "retweetCount": 20, "likeCount": 168, "conversationId": "2120690544825250061", "author": {"username": "gengdaJ", "name": "逸尘", "profileImageUrl": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, "authorId": "1897545708770840576", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3JBrAaIAAv-Se.jpg", "width": 943, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW3JBrAaIAAv-Se.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW3JCOhaMAMk5H2.jpg", "width": 942, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW3JCOhaMAMk5H2.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW3JDmZasAAGRAM.jpg", "width": 943, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW3JDmZasAAGRAM.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW3JEbabkAAjlpH.jpg", "width": 943, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW3JEbabkAAjlpH.jpg:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "逸尘", "role": "企业落地与产品组织实践与观察", "why": "公开商铺调研、评论、博主触达及邮件的 AI 增长工作流。", "handle": "gengdaJ"}, "createdAtIso": "2026-11-12T01:30:01+00:00", "createdAtBeijing": "2026-11-12T09:30:01+08:00", "createdAtLocal": "11-12 09:30 北京", "url": "https://x.com/gengdaJ/status/2120690544825250061", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2120690544825250061", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Grok Bot与ChatCut手机云剪辑实践", "evidence": "只支持196MB以下的视频", "rationale": "记录实际限制，并给出云上传与对话剪辑方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, {"id": "2120761167786525072", "track": "creative", "source": {"id": "2120761167786525072", "text": "给儿子做的打字游戏，代码写完了也开源了，但想介绍给有孩子的朋友们时遇到一个新问题：怎么用一个演示视频，让家长朋友们快速看懂它？毕竟不是每个人都能看懂开源项目。。。\n\nREADME 虽然能写清功能，但非开发背景的朋友们更想直接看到：打开以后怎么玩，孩子跟着什么提示按键，按错了怎么办。到底有没有用？能不能真的学会打字？！\n\n这次我用 YouArt Desktop 给「键盘小岛」做介绍视频。选「教程视频」，把 GitHub 链接交过去，在应用内通过 connector 连接 GitHub 后，它就开始读项目、打开在线游戏、实际操作和录屏，再组织分镜，连 pr 历史也能自动提取出来，这样版本更新就更方便了。\n\n作为经常制作教程视频、自己还做过 Video Agent 的老程序员，这一点意外的打动我：不是让我先准备好所有截图，再把素材拼起来，而是 Agent 自己进入项目，找出该展示的内容。过程中连中文字体缺失、画面可能出现方块字的问题，它也发现并处理了。\n\n键盘小岛没有倒计时，按错可以继续，从 F、J 开始，跟着大字母和手指提示熟悉键盘。做介绍演示视频，我也不需要多炫的转场，能把这些真实体验讲清楚最重要！\n\nCoding Agent 帮我把游戏做出来，创作 Agent 再帮我把它介绍出去。对自己动手做项目的人，这才是我想用上的分工。\n\nYouArt Desktop 下载：https://t.co/F39G73ZmDm \n键盘小岛开源项目：https://t.co/KUcD1z65tc", "createdAt": "Thu Nov 12 06:10:38 +0000 2026", "replyCount": 23, "retweetCount": 3, "likeCount": 18, "conversationId": "2120761167786525072", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120761034457935872/img/5B27BlJTFI2PnZxi.jpg", "width": 1444, "height": 1644, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120761034457935872/img/5B27BlJTFI2PnZxi.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120761034457935872/vid/avc1/1444x1644/WPqAWN30DFTdO6Be.mp4?tag=29", "durationMs": 55100}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW51Bc0bIAEUQV4.jpg", "width": 2048, "height": 1236, "previewUrl": "https://pbs.twimg.com/media/HW51Bc0bIAEUQV4.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW51COxaMAAgjea.jpg", "width": 2048, "height": 1236, "previewUrl": "https://pbs.twimg.com/media/HW51COxaMAAgjea.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-12T06:10:38+00:00", "createdAtBeijing": "2026-11-12T14:10:38+08:00", "createdAtLocal": "11-12 14:10 北京", "url": "https://x.com/shao__meng/status/2120761167786525072", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2120761167786525072", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "用创作 Agent 自动制作开源游戏教程", "evidence": "实际操作和录屏，再组织分镜", "rationale": "展示项目读取、操作录屏和字体修复流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120668252456247316", "track": "enterprise", "source": {"id": "2120668252456247316", "text": "一直在用 Grok Bot，都没注意到它已经 v1.0 了，而且是 10 天前，这有点灯下黑了 😄 \n\n看看作为 v1.0 的 Grok Bot 和 v0.x 时有啥不同？\n\n1. 多人协作：可以把 Bot 分享给团队，带到 Slack、Microsoft Teams 和视频通话里；同一套 Team Bot 可由团队共用，也可只分享给特定的人或群组。Bot 能在多人对话中跟上讨论，并在工作中积累对团队知识和偏好的理解。\n\n2. 主动接手：可以识别待办并提出由它来做，跟进未完成事项，预估团队下一步需要什么，并在需要判断时把相关的人拉进来。\n\n3. 能力提升：浏览网页更稳定，写文档和做演示更快、更可靠，并减少完成任务所需资源。\n\n其他改进还包括：登录和浏览网站时更少中断；可以制作能共同编辑、也可持续更新的交互式页面；与 Gmail、Google Calendar、GitHub 等工具的连接有所加强；已授权的动作少打断，敏感操作仍会询问。共享空间也有明确约束：遵守各人权限，并检查信息是否适合发到公开频道。\n\n个人可以创建自己的 Bot，也可以分享给团队。Team Bot 面向 Team 和 Enterprise 套餐；会议功能面向 Team、Enterprise 和 Ultra，企业套餐需由管理员打开。官方文档补充，Bot 可加入 Google Meet、Zoom 或 Microsoft Teams，在会议中回答，结束后发送摘要和待办。\n\nhttps://t.co/KQvtLf47UD https://t.co/pBzFcvcet7", "createdAt": "Thu Nov 12 00:01:26 +0000 2026", "replyCount": 7, "retweetCount": 1, "likeCount": 4, "conversationId": "2120668252456247316", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4ghnfa0AAS2jP.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW4ghnfa0AAS2jP.jpg:small"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120584648887603200/img/7fJTC0_ehG0tmNNk.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120584648887603200/img/7fJTC0_ehG0tmNNk.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120584648887603200/vid/avc1/1920x1080/_5-Mr3wCmHhH2dyV.mp4?tag=29", "durationMs": 79100}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-12T00:01:26+00:00", "createdAtBeijing": "2026-11-12T08:01:26+08:00", "createdAtLocal": "11-12 08:01 北京", "url": "https://x.com/shao__meng/status/2120668252456247316", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2120668252456247316", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Grok Bot v1.0 团队协作与会议能力", "evidence": "会议中回答，结束后发送摘要和待办", "rationale": "提供团队共享、会议协作及权限适用范围"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120755217390264702", "track": "tools", "source": {"id": "2120755217390264702", "text": "Google Labs 推出的一项实验产品，叫 Tabletop，和桌游没有直接关系。\n\n它要解决的是一群人一起做计划时，材料散落在群聊、表格、投票工具里，很难在同一个地方边聊边改、一起做决定。\n\n用法是：\n·先把链接、文件和想法放进一个共享空间，\n·再在聊天里 @tabletop，或选一个起始模板，生成可一起·用的互动工具，比如行程、聚餐投票、分账、比赛对阵表。\n·空间准备好后，把邀请链接丢进现有群聊，大家就能同时进来用，官方比喻成像在 Google 文档里一起编辑。\n\n每个空间更像一个项目，比如朋友出游、办活动、室友分工、学习小组或共同爱好。空间由三块组成：\n\n·Chat：实时聊天，可以发语音、开专注线程，并和 @tabletop 协作\n·Tabs：AI 生成的、跑在空间里的小型网页应用，所有人看到的都是实时更新；任何人都可以为这个空间建 tab\n·Space Context：共享资料库，包括文件、链接，以及 Tabletop AI 在这个空间里的记忆，用来让大家和 AI 对齐目标和细节", "createdAt": "Thu Nov 12 05:47:00 +0000 2026", "replyCount": 3, "retweetCount": 1, "likeCount": 1, "conversationId": "2120755217390264702", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120724586421796864/img/bCaBKeOd2w_kOg9u.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120724586421796864/img/bCaBKeOd2w_kOg9u.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120724586421796864/vid/avc1/1920x1080/bTdZXHcsrqwEFvM6.mp4?tag=29", "durationMs": 215002}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-12T05:47:00+00:00", "createdAtBeijing": "2026-11-12T13:47:00+08:00", "createdAtLocal": "11-12 13:47 北京", "url": "https://x.com/sitinme/status/2120755217390264702", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2120755217390264702", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Tabletop 共享空间与实时应用", "evidence": "Tabs：AI 生成的、跑在空间里的小型网页应用", "rationale": "介绍实验产品的使用步骤、组成及协作场景"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2120863431439876358", "track": "agent", "source": {"id": "2120863431439876358", "text": "让 AI 帮你搭建和维护智能家居，究竟能做到哪一步？\n\n玩智能家居，最折腾的往往是配置。比如想实现“晚上有人经过走廊就开灯，没人了自动关”，看着挺简单，真到 Home Assistant 里，还得找设备、设条件、调规则，出问题又要翻日志。 HA-MCP，就是让 AI 来帮你处理这些事。\n\n把它接到支持 MCP 的 AI 助手后，你就可以用大白话提需求：帮我建个夜灯自动化、调整一下浇水脚本、看看这条规则为什么没触发。\n\n它能读取你实际的设备和配置，再调用工具进行操作，还支持修改仪表盘、查询历史记录、整理辅助实体等。\n\n实用场景：维护已经用了好几年的智能家居系统。\n\nReddit 上有用户分享，用它检查日志、整理重复自动化、清理旧配置，还把平板仪表盘改成更适合手机的版本。\n\n这类事情单独做都不难，但到处找配置、查关联特别耗时间，有个能读懂现场信息的助手，确实能省不少来回折腾。\n\n当然，接入之后 AI 就有可能真的修改你家的配置，建议先从只读查询开始，每次只改一个小目标，改完再检查。\n\n门锁、报警、供暖这些操作，最好保留人工确认。另外，服务跑在本地，也不代表数据不会进入云模型，还是要看你连接的客户端和模型。", "createdAt": "Thu Nov 12 12:57:00 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 6, "conversationId": "2120863431439876358", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120778245901881344/img/VaeKVndEoM_xcZ3S.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120778245901881344/img/VaeKVndEoM_xcZ3S.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120778245901881344/vid/avc1/1920x1080/7akNwAIS6kW6VUdH.mp4?tag=29", "durationMs": 198977}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析
