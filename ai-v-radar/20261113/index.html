-11-12T09:06:00+08:00", "createdAtLocal": "11-12 09:06 北京", "url": "https://x.com/Xudong07452910/status/2120684501659513225", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2120684501659513225", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "斯坦福 CS329Z Agent 工程课程资料", "evidence": "两份作业以 MIT 协议开源", "rationale": "提供公开课程与手写Agent、构建评测题的作业信息"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120737349655253340", "track": "tools", "source": {"id": "2120737349655253340", "text": "推荐一份很适合收藏的开放教程《An Open Field Guide to Inference Engineering》，专门面向想系统学习大模型推理部署的开发者。\n\n内容从模型如何在 GPU 上运行、KV Cache 显存怎么算、Prefill/Decode 的性能瓶颈，一直讲到 vLLM、SGLang、推理优化、线上监控和 Eval，最后还附有完整的上线检查清单。\n\n从基础原理到实际生产部署都覆盖到了，可以当成一份系统的推理工程课程资料，挺适合跟着学习。\n\nhttps://t.co/n2TJxNihz5", "createdAt": "Thu Nov 12 04:36:00 +0000 2026", "replyCount": 4, "retweetCount": 13, "likeCount": 76, "conversationId": "2120737349655253340", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-12T04:36:00+00:00", "createdAtBeijing": "2026-11-12T12:36:00+08:00", "createdAtLocal": "11-12 12:36 北京", "url": "https://x.com/Xudong07452910/status/2120737349655253340", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2120737349655253340", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "大模型推理工程开放教程", "evidence": "最后还附有完整的上线检查清单", "rationale": "介绍覆盖推理原理、部署优化与监控的学习资源"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120854530447524231", "track": "agent", "source": {"id": "2120854530447524231", "text": "关注这种模式的，matt 新写了一篇长文可以看下：https://t.co/KnwDLt9DwB\n叫 home-repo-pattern，文章中提供了一长串的提示词同时可以配合 grill me，问答以后可以根据自身的情况进行接入和改进。 https://t.co/HIkjYGMPbz", "createdAt": "Thu Nov 12 12:21:38 +0000 2026", "replyCount": 7, "retweetCount": 6, "likeCount": 87, "conversationId": "2120854530447524231", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2120488589750579646", "text": "我最近的做法居然和 Matt 不谋而合，现在启动 agent 已经不是在各个项目 repo 中了，而是有一个叫做 start repo 的统一入口，里面存放了所有的 steering 文件，比如 agents.md  skills design.md  wiki 配置等等，不用重复在各 repo 中配置，然后通过一个简单的 md 文档告诉 agent 其他项目的路径，可以从那里直达。\n\n这样 Agent 就知道其他项目在哪 可以直接操作它们，同时所有的 skills、steering 文件、规则都集中在主仓库统一管理，这样统一入口，可以一次性统一调整一些全局的规则，假如几个项目有联系的话，agent 也可以很轻松的一块进行管理或者修改，很方便，效率更高。", "createdAt": "Wed Nov 11 12:07:31 +0000 2026", "replyCount": 71, "retweetCount": 77, "likeCount": 687, "conversationId": "2120488589750579646", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7J1qMbMAA3y_7.jpg", "width": 966, "height": 843, "previewUrl": "https://pbs.twimg.com/media/HW7J1qMbMAA3y_7.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-12T12:21:38+00:00", "createdAtBeijing": "2026-11-12T20:21:38+08:00", "createdAtLocal": "11-12 20:21 北京", "url": "https://x.com/vikingmute/status/2120854530447524231", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2120854530447524231", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "统一入口仓库管理Agent规则", "evidence": "所有的 skills、steering 文件、规则", "rationale": "说明集中管理规则及跨项目路径的具体做法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2120822738650550744", "track": "research", "source": {"id": "2120822738650550744", "text": "很酷！但是 sparse rewiring 又跟所谓的 weight space progmming 有什么分别。\n\n可以确定的，做可解释性 LLM 的研究员，春天来了。\n\n依然推荐阅读！感兴趣的，把 post 直接扔给 agent 解读！", "createdAt": "Thu Nov 12 10:15:18 +0000 2026", "replyCount": 2, "retweetCount": 1, "likeCount": 17, "conversationId": "2120822738650550744", "author": {"username": "dongxi_nlp", "name": "Dongxi 东锡 NLP", "profileImageUrl": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, "authorId": "1477948736156454913", "quotedTweet": {"id": "2120545170873823742", "text": "Finetuning changes all model weights, even when learning a simple behavior. Can we make that change interpretable?\n\nYes! Sparse Rewiring learns new triggers for neurons, not new outputs. Training just 89 of Qwen3-8B's 442,368 neurons makes an owl persona that matches full SFT! https://t.co/dhf0CYyjbQ", "createdAt": "Wed Nov 11 15:52:21 +0000 2026", "replyCount": 17, "retweetCount": 29, "likeCount": 277, "conversationId": "2120545170873823742", "author": {"username": "maxsloef", "name": "max!", "profileImageUrl": "https://pbs.twimg.com/profile_images/2076364689605640192/0YnsIDt0_normal.jpg"}, "authorId": "1708265603604336640", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW2uEr1bYAEpxzU.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW2uEr1bYAEpxzU.jpg:small"}], "translationZh": "微调会改变模型的所有权重，即使只是学习一种简单行为。我们能让这种变化具有可解释性吗？\n\n可以！Sparse Rewiring 学习的是神经元的新触发条件，而非新的输出。只需训练 Qwen3-8B 的 442,368 个神经元中的 89 个，就能塑造出媲美全量 SFT 效果的猫头鹰人格！https://t.co/dhf0CYyjbQ"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "东锡", "role": "模型、研究与推理实践与观察", "why": "有 SFT、loss mask 等训练细节解读，补中文模型工程教育。", "handle": "dongxi_nlp"}, "createdAtIso": "2026-11-12T10:15:18+00:00", "createdAtBeijing": "2026-11-12T18:15:18+08:00", "createdAtLocal": "11-12 18:15 北京", "url": "https://x.com/dongxi_nlp/status/2120822738650550744", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2120822738650550744", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Sparse Rewiring稀疏神经元微调", "evidence": "89 of Qwen3-8B's 442,368 neurons", "rationale": "引文报告稀疏训练方法及对比全量微调的成果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, {"id": "2120810839456600433", "track": "tools", "source": {"id": "2120810839456600433", "text": "百度创始人李彦宏在百度世界 2026 开幕式上，宣布正式推出「Token Exchange - 词元所 - 模型的交易所」\n\n看了词元所网站，应该就是百度的模型 + 国内开源模型（文本、图像和音视频），其实没看懂，这和普通的「Token 中转站」的具体区别是什么？！\n\n区别在于「可信」吗？再去翻文档，确实把可信作为主要卖点，包含：真实性、稳定达成、性能容量达成和能力达成。可这是不明着掺水的中转站的基础吧。\nhttps://t.co/XSMwPnzKDu\n\n再看模型托管方，也是一个聚合站逻辑，展示价格、近 7 天调用和成功率数据等。\n\n看来看去，感觉还是中转站换了一个更高大上的名字而已，没看到有本质区别。接下来可能就看百度的营销能力了，现在不太看好。", "createdAt": "Thu Nov 12 09:28:01 +0000 2026", "replyCount": 19, "retweetCount": 0, "likeCount": 9, "conversationId": "2120810839456600433", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2120773996698546653", "text": "Introducing Token Exchange, a neutral, transparent and trusted marketplace connecting AI model service providers with customers.\n\nIt gives customers one place to compare models side by side, review clear pricing and performance data, and start using them. For quality providers, it opens a new channel to reach more customers.\n\nBefore listing, we check provider credentials and compare model fingerprints to help detect model swapping and inflated specs. After listing, we conduct regular spot checks and ongoing monitoring, and maintain a public credit record for each provider.\n\nOne month in, the platform has more than 100 model resources, averaging over 50M calls and 700B tokens a day.", "createdAt": "Thu Nov 12 07:01:37 +0000 2026", "replyCount": 27, "retweetCount": 6, "likeCount": 62, "conversationId": "2120773996698546653", "author": {"username": "Baidu_Inc", "name": "Baidu Inc.", "profileImageUrl": "https://pbs.twimg.com/profile_images/1373867336021598212/vZ2nWy8M_normal.jpg"}, "authorId": "820440736336228352", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW5xIKRbUAAdf3J.jpg", "width": 2048, "height": 1366, "previewUrl": "https://pbs.twimg.com/media/HW5xIKRbUAAdf3J.jpg:small"}], "translationZh": "Token Exchange 正式推出，这是一个中立、透明、可信的交易平台，连接 AI 模型服务商与客户。\n\n客户可以在这里并排比较模型，查看清晰的定价和性能数据，并直接开始使用。对优质服务商而言，平台则提供了触达更多客户的新渠道。\n\n上架前，我们会核查服务商资质，并比对模型指纹，帮助识别模型调包和参数虚标。上架后，我们会定期抽查、持续监测，并为每家服务商维护公开的信用记录。\n\n上线一个月，平台已拥有超过 100 项模型资源，日均调用量超过 5,000 万次，日均 token 用量超过 7,000 亿。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW6iNYOa4AA628P.jpg", "width": 1200, "height": 800, "previewUrl": "https://pbs.twimg.com/media/HW6iNYOa4AA628P.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-12T09:28:01+00:00", "createdAtBeijing": "2026-11-12T17:28:01+08:00", "createdAtLocal": "11-12 17:28 北京", "url": "https://x.com/shao__meng/status/2120810839456600433", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2120810839456600433", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "百度词元所发布与模型服务可信机制", "evidence": "compare model fingerprints", "rationale": "包含平台发布、模型验真及持续监测机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120805960205865178", "track": "enterprise", "source": {"id": "2120805960205865178", "text": "豆包工作今天Logo悄悄换回了大家熟悉的“豆姐”，同时把之前只在企业版开放的第三方模型，正式向所有用户放开了。\n\n现在除了自研的豆包 2.1 Lite 和 Pro，列表里直接多了 Kimi K3.1 Pro、GLM 5.3、DeepSeek V4.1 Flash，PC 和手机端同步同一套模型和消耗倍率，也可以直接开 Auto 模式让系统按任务匹配。\n\n跳出“多几个模型可用”的表层更新，聊三点我自己的观察：\n\n1. Agent 正在经历“应用层与基座层的解耦”\nChatbot 是单轮问答，一个主力模型就能撑全场；但办公 Agent 是横跨检索、写码、推理到交付的长链路。基座迭代这么快，强绑单一模型等于用短板限制 Agent 的上限。你看海外，Claude Cowork、Codex 都早就放开了多模型，Tibo 之前也亲自提醒过 Codex 可以搭配任意开源模型跑。放下面子、把选择权交还给具体任务，是一线玩家验证过的务实解法。\n\n2. 模型越来越像“标准件”，真正的壁垒是转起 Harness 飞轮\n当主流模型大家都能接，办公 Agent 拼的就是底层的 Harness。只跑自家模型能见到的 corner case 很有限，把外部模型全接进来，不同模型在长上下文、工具调用里的脾气各不相同，每次调用沉淀的消耗、报错恢复和运行轨迹，都在反哺路由调度和上下文管理快速进化。这不再是纯算法题，而是字节最擅长的系统工程与基建迭代。\n\n3. 消除用户的“算账焦虑”，用补贴换高频入口才是真阳谋\n很多人不敢高频用 Agent，是怕杀鸡用牛刀把额度烧光。这次豆包工作直接把各模型的消耗倍率标在明面上，叠加小额任务免费、工作日/节假日指定时段打折，还专门把高频干活用的豆包 2.1 Lite 和 DeepSeek V4.1 Flash 倍率下调了一档。既放开外部竞品模型，又掏真金白银压低日常使用成本，说明字节不想只做个展示自研模型的橱窗，而是下了决心要把真实工作流入口先抢下来。\n\n说到底，未来的办公 Agent 赢家，大概率不是“只有一个最贵模型的公司”，而是能用最扎实的 Harness 底座，帮用户把好钢精准用在刀刃上的平台。", "createdAt": "Thu Nov 12 09:08:38 +0000 2026", "replyCount": 12, "retweetCount": 1, "likeCount": 15, "conversationId": "2120805960205865178", "author": {"username": "yanhua1010", "name": "Yanhua", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998302113592713216/jbKruapM_normal.jpg"}, "authorId": "1932935705711513600", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW6dx-9agAA0UI8.jpg", "width": 2048, "height": 1370, "previewUrl": "https://pbs.twimg.com/media/HW6dx-9agAA0UI8.jpg:small"}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "Yanhua", "role": "模型、研究与推理实践与观察", "why": "对模型成本、能力和选型作具体比较，补应用侧解释。", "handle": "yanhua1010"}, "createdAtIso": "2026-11-12T09:08:38+00:00", "createdAtBeijing": "2026-11-12T17:08:38+08:00", "createdAtLocal": "11-12 17:08 北京", "url": "https://x.com/yanhua1010/status/2120805960205865178", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2120805960205865178", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "办公Agent多模型接入与调度", "evidence": "第三方模型，正式向所有用户放开了", "rationale": "包含模型开放和计费变化，调度观点缺少实证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998302113592713216/jbKruapM_normal.jpg"}, {"id": "2120896139381911711", "track": "creative", "source": {"id": "2120896139381911711", "text": "今天用这个YouArt复刻了一个抖音爆款视频，惊喜过后突然感到一阵恐惧🤯\n\n我这个账号最开始是分享生图生视频做起来的，非常清楚提示词对于AI生图生视频的重要性。\n\n但是用了这个Agent之后，感觉提示词在未来可能也不再那么重要了。\n\n特别是最近Fable 5.2接连复刻了一些端游的网页版，更加觉得你所擅长的，只需要AI的一次版本升级就彻底抹平了。\n\n而将来要拼的应该只有创意了，而如果哪天AI连创意都能抹平，那将是非常恐怖的一件事。", "createdAt": "Thu Nov 12 15:06:58 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2120896139381911711", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "quotedTweet": {"id": "2120758499009311063", "text": "兄弟们，我要吹爆这个AI工具，太好用了。\n\n刚用YouArt Desktop做了一个抖音爆款视频的复刻，简直就是1:1完整复刻的。\n\n这个视频之前一直想用我的原创角色Malfoy来复刻一下，但效果都不太好。\n\nYouArt Desktop上自带这个「爆款复刻」模板简直就是为这个视频量身定做的。\n\n这次我只提供了一个原视频和Malfoy的人物三视图，然后输入了下面这段提示词：\n\n参考上传的视频，将视频中的人物替换成图片里的角色，同时要求将视频里人物的服装换成不同款式，具有英伦风的百褶裙，替换后人物的表情要求与参考视频里的一致，场景也更换成英伦风的街头场景。然后输出视频\n\n从指令可以看到，我只是替换了一下人物和背景，过了几分钟它就直接给了我一个复刻好可以直接发布的视频。\n\n后来才发现它这个功能是接入了一整套Agent工作流。\n\n- 用目前最强模型Fable 5.2 根据上传的视频抽帧对比，\n\n- 用GPT Image 2.5根据我上传的Malfoy三视图生成参考图和场景\n\n- 根据上传的参考视频和生成的参考图作为Seedance 2.5的参考素材，加上对应的提示词再成片。\n\n整个过程全部由这个Agent自动完成，我只需要检查是否合格就行。\n\n除了做爆款复刻，YouArt Desktop还可以自动剪辑长视频，制作教程视频或动效，甚至还可以连上你的社交账号帮你找选题，做视频替你发布。\n\n想做AI视频的兄弟不妨下载YouArt Desktop体验一下。\n地址：https://t.co/2yYxTFxsBf\n\nSeedance 2.5完整提示词见评论区：\n#Malfoy", "createdAt": "Thu Nov 12 06:00:02 +0000 2026", "replyCount": 56, "retweetCount": 8, "likeCount": 125, "conversationId": "2120758499009311063", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120745487817199616/img/oFI1pCmNkPrNlJ26.jpg", "width": 1152, "height": 2048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120745487817199616/img/oFI1pCmNkPrNlJ26.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120745487817199616/vid/avc1/1440x2560/LAAF8j2Hha9xGDCg.mp4?tag=29", "durationMs": 11075}]}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-12T15:06:58+00:00", "createdAtBeijing": "2026-11-12T23:06:58+08:00", "createdAtLocal": "11-12 23:06 北京", "url": "https://x.com/liyue_ai/status/2120896139381911711", "themeId": "editorial", "signalScore": 53, "editorial": {"id": "2120896139381911711", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "YouArt视频角色替换工作流", "evidence": "我只提供了一个原视频和Malfoy的人物三视图", "rationale": "自述复刻实践，附提示词与分步工作流"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2120852106961957304", "track": "creative", "source": {"id": "2120852106961957304", "text": "今晚 MkImage 新收录 10 个生图提示词 🎨\n\n每条都附原帖，直接复制提示词或在线使用👇\n\n1. 来自 @Naiknelofar788\n\n富士山等地标的极简线描旅行海报（可换地标模板）\n\n提示词：https://t.co/tGrL2zpaz1", "createdAt": "Thu Nov 12 12:12:00 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 3, "conversationId": "2120852106961957304", "author": {"username": "indie_maker_fox", "name": "Fox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, "authorId": "1865299069092139008", "quotedTweet": {"id": "2120728394036105371", "text": "GPT image 2.6\n\nprompt:\nCreate an elegant, minimalist architectural travel poster featuring [LANDMARK NAME], [CITY], [COUNTRY].\n\n1. MAIN ARCHITECTURAL ILLUSTRATION\n\nFeature the selected landmark as the central subject, illustrated entirely with delicate, continuous-looking hand-drawn outline strokes.\n\nPreserve the landmark’s distinctive architectural silhouette and recognisable proportions.\nUse clean, thin, slightly imperfect hand-drawn lines.\nAvoid solid fills, heavy shading and excessive details.\nMake the architecture look like a beautiful architectural sketch.\n\n2. COLOUR PALETTE\n\nUse a sophisticated combination of 3–4 soft pastel colours for the outlines.\n\nChoose colours that complement the destination’s identity, architecture and cultural character.\n\nExamples:\n\nParis: Dusty rose, lavender, soft blue and muted coral.\nLondon: Navy, muted red, sage and pale gold.\nTokyo: Vermilion, jade, blush pink and warm grey.\nItaly: Terracotta, olive, dusty blue and ochre.\nGreece: Aegean blue, turquoise, muted coral and lavender.\n\nEvery destination must have its own unique colour combination.\n\n3. FLOATING TRAVEL DETAILS\n\nAdd a few delicate decorative elements around the landmark:\n\nA small flying aeroplane with a dotted curved flight trail.\nTiny birds, clouds or stars.\nMinimal geographical coordinates.\nA small travel stamp or destination symbol.\nSubtle architectural decorative details.\n\nKeep everything light, delicate and uncluttered.\n\n4. TYPOGRAPHIC ELEMENTS\n\nAdd the landmark’s name in elegant, refined typography.\n\nInclude:\n[LANDMARK NAME]\n[CITY, COUNTRY]\n\nPlace the destination name in a beautiful decorative ribbon banner near the bottom, leaving sufficient space for the illustration.\n\nUse sophisticated serif or handwritten typography.\n\n5. BACKGROUND & COMPOSITION\n\nUse a beautiful warm ivory or soft cream background with subtle handmade-paper texture.\n\nMaintain generous negative space around the central illustration.\n\nCreate a balanced composition with the landmark as the visual focus and small decorative elements positioned naturally around it.\n\n6. ARTISTIC DIRECTION\n\nMinimalist architectural line art, Scandinavian poster design, delicate pastel illustrations, elegant travel stationery, vintage sketchbook aesthetics and contemporary gallery-style graphic design.\n\n7. FINAL FINISH\n\nA timeless, sophisticated collectible travel poster that feels delicate, artistic and beautifully handcrafted.\n\nVertical 4:5 composition, crisp fine-line artwork, premium print quality, clean spacing and refined visual hierarchy.\n\nAvoid photorealism, 3D effects, heavy colours, thick outlines, crowded compositions and unnecessary decorative elements.", "createdAt": "Thu Nov 12 04:00:25 +0000 2026", "replyCount": 45, "retweetCount": 9, "likeCount": 102, "conversationId": "2120728394036105371", "author": {"username": "Naiknelofar788", "name": "simeon-sanai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2014919869259735040/MbBiQ58q_normal.jpg"}, "authorId": "923953886754308096", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW5XN5MaoAAGtV6.jpg", "width": 1122, "height": 1402, "previewUrl": "https://pbs.twimg.com/media/HW5XN5MaoAAGtV6.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW5XN5PboAAfUm2.jpg", "width": 1122, "height": 1402, "previewUrl": "https://pbs.twimg.com/media/HW5XN5PboAAfUm2.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW5XN5NaMAAgNC0.jpg", "width": 1122, "height": 1402, "previewUrl": "https://pbs.twimg.com/media/HW5XN5NaMAAgNC0.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW5XN5NaYAAn8m5.jpg", "width": 1122, "height": 1402, "previewUrl": "https://pbs.twimg.com/media/HW5XN5NaYAAn8m5.jpg:small"}], "translationZh": "GPT image 2.6\n\n提示词：\n创作一张优雅、极简的建筑旅行海报，主题为 [LANDMARK NAME]、[CITY]、[COUNTRY]。\n\n1. 主体建筑插画\n\n以选定的地标为画面中心，完全使用纤细、仿佛一笔连成的手绘轮廓线描绘。\n\n保留地标独特的建筑轮廓和易于辨识的比例。\n使用干净、纤细、略带不规则感的手绘线条。\n避免实色填充、厚重阴影和过多细节。\n让建筑呈现精美建筑速写的质感。\n\n2. 配色\n\n使用 3 至 4 种柔和淡彩，组成雅致的轮廓线配色。\n\n选择契合目的地特色、建筑风格和文化气质的颜色。\n\n示例：\n\n巴黎：灰玫瑰色、薰衣草紫、柔蓝色和低饱和珊瑚色。\n伦敦：海军蓝、低饱和红、鼠尾草绿和淡金色。\n东京：朱红、玉绿、浅粉和暖灰。\n意大利：陶土色、橄榄绿、灰蓝和赭黄。\n希腊：爱琴海蓝、绿松石色、低饱和珊瑚色和薰衣草紫。\n\n每个目的地都必须拥有独特的配色组合。\n\n3. 点缀的旅行元素\n\n在地标周围添加少量精致的装饰元素：\n\n一架飞行中的小飞机，身后拖着点状弧形航迹。\n小巧的鸟、云或星星。\n简洁的地理坐标。\n一枚小旅行印章或目的地符号。\n精巧的建筑装饰细节。\n\n所有元素都应轻盈、细腻、疏朗。\n\n4. 文字排版\n\n以优雅、精致的字体写出地标名称。\n\n包含：\n[LANDMARK NAME]\n[CITY, COUNTRY]\n\n将目的地名称置于靠近底部的精美装饰飘带中，为插画留出充足空间。\n\n使用雅致的衬线字体或手写字体。\n\n5. 背景与构图\n\n使用温暖的象牙白或柔和的奶油色背景，带有细微的手工纸纹理。\n\n在中心插画周围保留充足留白。\n\n构图均衡，以地标为视觉焦点，小型装饰元素自然分布在周围。\n\n6. 艺术风格\n\n极简建筑线描、斯堪的纳维亚海报设计、细腻的淡彩插画、优雅的旅行文具、复古速写本美学，以及当代画廊风格的平面设计。\n\n7. 最终效果\n\n打造一张经典、雅致、值得收藏的旅行海报，呈现细腻、艺术化的精美手工质感。\n\n竖版 4:5 构图，细线清晰，具备高品质印刷效果，间距干净疏朗，视觉层级精致分明。\n\n避免照片写实风格、3D 效果、厚重色彩、粗轮廓、拥挤构图和多余装饰。"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-11-12T12:12:00+00:00", "createdAtBeijing": "2026-11-12T20:12:00+08:00", "createdAtLocal": "11-12 20:12 北京", "url": "https://x.com/indie_maker_fox/status/2120852106961957304", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2120852106961957304", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "可替换地标的极简旅行海报模板", "evidence": "富士山等地标的极简线描旅行海报（可换地标模板）", "rationale": "参数化地标模板包含地域配色、线描及排版规则"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2120856942835060966", "track": "creative", "source": {"id": "2120856942835060966", "text": "subject_definitions:\n\u003cSubject 1> is the female warrior whose facial identity, porcelain skin, silver-white long hair with straight bangs, and ethereal yet lethal demeanor come from the visual description. Her attire consists o angle with a high-altitude rising crane shot. \u003cSubject 1> launches off the beast's shoulder into the stormy sky in one fluid motion, no lingering in mid-air. Her body flips crisply, and the Tachi cuts an extremely sharp scarlet arc. She releases a cone-shaped crimson sword qi storm that bombards the beast's head and back from above. Chain explosions burst across its armor, chunks of shadow plating tear off and fall, the ground below cracks open again, high-frequency camera shake, intense and violent impact, rapid rhythm without drag.\n\n[Shot 4] At 00:07.000, the camera orbits 360 degrees rapidly around \u003cSubject 1> in mid-air, then instantly cuts to a facial close-up. Cold close-up locking on her face, eyes fixed on the beast's glowing core in its chest. The beast roars and swipes at her; she pivots in mid-air, kicks off its swinging claw for leverage and transitions into a supersonic thrust, piercing straight toward its chest like a crimson arrow. Mystical runes unfold around her blade, a spiritual impact wave blasts the violet smoke away from the battlefield, and red sword-light afterimages streak across the frame.\n\n[Shot 5] At 00:10.000, the camera cuts to a vertical rapid falling shot, freezing at the moment of impact. \u003cSubject 1> drives her Tachi deep into the beast's glowing core; a blinding crimson burst explodes outward through cracks spreading across its whole body. She twists the blade, rips it free and spins away as the beast's armor shatters piece by piece, shards of black plating and violet embers raining down, the shockwave flattening the remaining broken pillars in a ring around them.\n\n[Shot 6] At 00:12.000, the camera cuts to a slow pull-back wide establishing shot, stable framing. \u003cSubject 1> lands heavily in a crouch, dust and debris scattering in a circle around her. Behind her the colossal beast collapses and dissolves into drifting black smoke, its violet eyes fading out. She rises with her Tachi hanging by her side in a const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;

const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
