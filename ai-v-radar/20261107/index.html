elopment and cultural transformation to get to this point. It will be fascinating what the world looks like when all businesses reach this level of automation and beyond.", "createdAt": "Fri Nov 06 05:07:24 +0000 2026", "replyCount": 8, "retweetCount": 5, "likeCount": 59, "conversationId": "2118570924085834072", "author": {"username": "randomjohnnyh", "name": "Johnny Ho", "profileImageUrl": "https://pbs.twimg.com/profile_images/1784680407792779264/ddkiBgsI_normal.jpg"}, "authorId": "449094976", "translationZh": "在 Perplexity，智能体的提示词已不再由人类手动输入：越来越多的智能体同事开始相互下达指令、接收自动化流程的消息，并随时留意人类的反馈。Perplexity 打通了大量云端工具和软件服务之间的上下文，搜索和处理的信息远超人类手动追踪的能力。当然，艰难的决策、必要的克制以及上线前的判断，仍由人类把关。\n\nPerplexity 一项尤为重要的价值观是始终追求真相。在当今的技术体系中，这意味着回答业务问题时，应以 git 仓库和数据仓库中集中存储的权威数据为准，而不是依赖那些往往不准确或已过时的中间产物。这正是 Perplexity 这类企业云端智能体的强项：串联组织内的各类信息，全天候追踪事实。\n\n即使作为一家 AI 原生公司，我们也经历了数月的开发和文化转型，才走到这一步。当所有企业都达到甚至超越这样的自动化水平时，世界会是什么样子，令人期待。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWaufpuaEAAg2Bl.jpg", "width": 1827, "height": 951, "previewUrl": "https://pbs.twimg.com/media/HWaufpuaEAAg2Bl.jpg:small"}], "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-06T05:13:48+00:00", "createdAtBeijing": "2026-11-06T13:13:48+08:00", "createdAtLocal": "11-06 13:13 北京", "url": "https://x.com/AravSrinivas/status/2118572536300699764", "themeId": "editorial", "signalScore": 88, "editorial": {"id": "2118572536300699764", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "以 Git 和数据仓库支撑企业 Agent 协作", "evidence": "centralizing the ground truth", "rationale": "给出事实源集中、轨迹版本管理与人工决策方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "智能体将越来越多地被其他智能体调用。原因很简单：这样更容易编排，而且可以围绕一个能持续积累价值的统一记录系统 git 来组织一切。当智能体以 code-mode 运行，执行轨迹也纳入版本控制时，就能形成真正的递归循环，而衡量这一循环成效的指标，就是所需的人工介入越来越少。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2118515211359383829", "track": "agent", "source": {"id": "2118515211359383829", "text": "一：重页面别等「全部加载完」\n\nGitHub、Search Console 这种页面很重，默认要等页面全部加载完才往下走，很容易超时。\n\n让它只等页面主体出来就继续，这句加进去就好了：\n\nawait page.goto(url, { waitUntil: \"domcontentloaded\", timeout: 45000 });\n我直接把这条写进了给 AI 的规则里，后来没再遇到。\n\n二：别让它死等某一个元素\n\n读推文那次，第一回其实失败了。\n\nAI 写的脚本是「等推文正文那个元素出现再读」，结果 4 条全部等了 20 秒超时，白跑了 80 秒。\n\n页面其实早就打开了，登录也是好的，只是它等的那个元素没按它想的方式出现。\n\n改成「打开后等几秒，直接读整块正文」，第二回 25 秒全读到了。\n\n所以 AI 卡住的时候，先让它看一眼页面现在长什么样，再决定怎么读，别让它对着一个元素干等。\n\n三：撤不回的操作，还是得你点头\n\nego lite 不弹授权，不代表什么都能放手。我给自己定了两条：\n\n·删除、提交、发布、付款这种点了就撤不回的，AI 必须先问我；\n\n·网站条款写明禁止自动化的，不让 AI 去跑。登录态是你的，号被封也是你的。\n\n遇到验证码、必须本人点的地方，AI 可以把页面交还给你，你处理完它再接着干。", "createdAt": "Fri Nov 06 01:26:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2118515207370596675", "inReplyToStatusId": "2118515210428232147", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-06T01:26:01+00:00", "createdAtBeijing": "2026-11-06T09:26:01+08:00", "createdAtLocal": "11-06 09:26 北京", "url": "https://x.com/sitinme/status/2118515211359383829", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2118515211359383829", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "浏览器自动化超时复盘与权限边界", "evidence": "结果 4 条全部等了 20 秒超时", "rationale": "给出加载等待配置、读取修正及操作边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118515210428232147", "track": "agent", "source": {"id": "2118515210428232147", "text": "03　我这两天拿它干了什么\n\n场景一：查要登录的后台\n\n导入完，我让 Claude Code 挨个打开 GitHub、飞书文档、Google Search Console。\n\n三个都是登录状态，一个授权弹窗都没有。\n\n以前每个新网站都得先去插件里点一次允许，现在说完就可以去干别的。\n\n场景二：一口气读几条推文，连数据一起拿回来\n\n我在研究同圈的人怎么找选题，手上有一串 X 的帖子链接。\n\n跟 Claude Code 说：把这 4 条帖子打开，正文和回复、转帖、喜欢、书签、观看数都记下来。\n\n它写了一段脚本，在自己的空间里一条一条打开，25 秒读完 4 条，每条拿回来的是这样：\n\n36 回复、21 次转帖、70 喜欢、74 书签、33617 次观看\nX 要登录才能看全，用的就是我自己的账号。我这边该刷什么刷什么。\n\n场景三：给文章截图\n\n开头那张 GitHub 截图就是这么来的。一句话，18 秒，它把页面打开、确认登录状态、截图、存到本地，一次跑完。\n\n这也是 ego lite 跟一般浏览器工具不太一样的地方。\n\n一般的工具是「点一下，看一眼，再点一下」，一步一个来回。ego lite 是让 AI 直接写一段 JavaScript，把打开、等待、读内容、截图写在一个脚本里，一次跑完。\n\nego lite 的 README 里也放了一组对比：用 Real-World Bench 的 31 个复杂任务，在真实线上网站上跑，把 ego-browser 和另外四款给 AI Agent 用的浏览器工具放在一起比。\n\n所有工具用同一个 Agent、同一个模型，由同一个评审按每个任务的评分细则打分。\n\n官方的结论是 ego-browser 在速度、成功率和成本上都领先：", "createdAt": "Fri Nov 06 01:26:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 1, "conversationId": "2118515207370596675", "inReplyToStatusId": "2118515209874645022", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWVS2pqaUAAOxw0.jpg", "width": 1080, "height": 685, "previewUrl": "https://pbs.twimg.com/media/HWVS2pqaUAAOxw0.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-06T01:26:00+00:00", "createdAtBeijing": "2026-11-06T09:26:00+08:00", "createdAtLocal": "11-06 09:26 北京", "url": "https://x.com/sitinme/status/2118515210428232147", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2118515210428232147", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "ego lite登录后台读取与截图实践", "evidence": "25 秒读完 4 条", "rationale": "自述批量读取与截图流程，官方跑分未独证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118694439606718909", "track": "agent", "source": {"id": "2118694439606718909", "text": "谁懂啊家人们？？？作为一名AI native，我日常干活的原则是：能用AI干的就用AI干，能偷懒的事情就偷懒，所以用Agent操控浏览器的功能是我每天必跑的项目。\n\n最近在重新充了100美刀的Claude Max后，我高强度使用了Claude的浏览器功能。\n\nClaude Code 和 Codex 的浏览器功能我两边都实测了很多遍，结论很直接：\n\nClaude 能做的 Codex 都能做，Codex 能做的 Claude 未必能做！！！👇\n\n两家都分三层：\n内置浏览器：Browser 面板 / @Browser\nChrome浏览器：Claude in Chrome / @Chrome\n整台电脑：Computer Use / @Computer\n\n一样的是：两家的内置浏览器都能导入登录态，读网页、看数据、找资料都没问题。\n\n差距最大的几个点：\n1、Codex 的内置浏览器能直接上传图片、传视频，自动化发帖一个浏览器即可搞定。\n\n2、Claude 的内置浏览器传不了，必须再开 Chrome 扩展，单次上传最多 只有10MB。\n\n3、另外 Codex 文档写的是 Chrome 扩展能在后台多标签并行，不抢你的浏览器；Claude 则是在你看得见的标签组里操作。\n\nClaude 占优的地方我只找到一个：Claude in Chrome 在命令行里也能用，Codex 的浏览器得开桌面 App。\n\n还有个使用过程中卡了我1小时的大坑！！！\n大家一定要注意👇\n\n如果你用的是苹果电脑，想用Claude操控Chorme浏览器，务必要打开\n\nChorme浏览器在屏幕最顶上的菜单栏：\n查看 → 开发者 → 允许 Apple 事件中的 JavaScript。", "createdAt": "Fri Nov 06 13:18:12 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 14, "conversationId": "2118694439606718909", "author": {"username": "rionaifantasy", "name": "Rion Wu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1996577388478844928/WkPc65TY_normal.jpg"}, "authorId": "1451831560991170569", "quotedTweet": {"id": "2114705129643667847", "text": "安全第一！！每次我的IP和网络故障之前，都会先用codex做好检查，一切准备就绪后再放心地去使用claude code，确保万无一失。\n\ncodex现在对我来说最大的三个用处：\n1、使用claude code之前检查IP和网络，配置VPN\n2、调用GPT image 2.5生图，交给claude code使用\n3、内置浏览器和computer use依然是无敌，claude code干不了的事情交给codex来干。\n\n其他的写作、代码、构建的事情，基本都交给Claude\ncode。\n\n总之，codex当前的任务就是帮我做好下限兜底，把基建搞好，保证我能稳定使用claude code，同时，claude干不了的事情也可以交给codex补齐。\n\n而主要工作：写稿、做视频、代码、架构，都有claude code来完成。", "createdAt": "Mon Oct 26 13:06:06 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 5, "conversationId": "2114705129643667847", "author": {"username": "rionaifantasy", "name": "Rion Wu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1996577388478844928/WkPc65TY_normal.jpg"}, "authorId": "1451831560991170569", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVjvsBzbwAAEpfN.jpg", "width": 1006, "height": 976, "previewUrl": "https://pbs.twimg.com/media/HVjvsBzbwAAEpfN.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVjv9-fbEAA5nlN.jpg", "width": 1432, "height": 892, "previewUrl": "https://pbs.twimg.com/media/HVjv9-fbEAA5nlN.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWcdJ9uaAAACVVk.jpg", "width": 1878, "height": 1180, "previewUrl": "https://pbs.twimg.com/media/HWcdJ9uaAAACVVk.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "Rion Wu", "role": "内容、视觉与多模态实践与观察", "why": "具体展示跨工具生图与精修方法，能补视觉生产的实际操作。", "handle": "rionaifantasy"}, "createdAtIso": "2026-11-06T13:18:12+00:00", "createdAtBeijing": "2026-11-06T21:18:12+08:00", "createdAtLocal": "11-06 21:18 北京", "url": "https://x.com/rionaifantasy/status/2118694439606718909", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2118694439606718909", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Claude与Codex浏览器使用比较", "evidence": "单次上传最多 只有10MB", "rationale": "提供上传限制与设置排障经验，尚属个人实测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1996577388478844928/WkPc65TY_normal.jpg"}, {"id": "2118763511295967314", "track": "research", "source": {"id": "2118763511295967314", "text": "Now that (I think) the decision model hype has settled a bit, let me give you my take. Decision models address a market inefficiency. Workloads are vastly different (eg fraction of prefill-dominating operations; prefix reuse; intelligence needed), yet the pricing model is typically the same. Your prefill subsidized my decode and cost you a lot of time and money. Now there is a cheaper and faster endpoint for your prefill-only workloads.", "createdAt": "Fri Nov 06 17:52:40 +0000 2026", "replyCount": 7, "retweetCount": 2, "likeCount": 73, "conversationId": "2118763511295967314", "author": {"username": "sh_reya", "name": "Shreya Shankar", "profileImageUrl": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, "authorId": "2286218053", "quotedTweet": {"id": "2118508404192981040", "text": "Why don't we at TypeSafe call Jev a decision model?\n\nIf you think of Jev's questions as making *decisions*, I believe you'll use it at the wrong layer of abstraction and your reliability will suffer.\n\nI wrote all about this on our site 🧵👇 https://t.co/CfY5W84NqA", "createdAt": "Fri Nov 06 00:58:58 +0000 2026", "replyCount": 29, "retweetCount": 27, "likeCount": 354, "conversationId": "2118508404192981040", "author": {"username": "allietheicon", "name": "Allie the Icon", "profileImageUrl": "https://pbs.twimg.com/profile_images/2102564142884528128/1XCuubge_normal.jpg"}, "authorId": "1929990996324167685", "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HWZ0FelbYAEPHz1.jpg", "width": 960, "height": 702, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HWZ0FelbYAEPHz1.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HWZ0FelbYAEPHz1.mp4"}], "translationZh": "为什么我们 TypeSafe 不把 Jev 称为决策模型？\n\n如果你把 Jev 回答问题理解为“做决策”，我认为你就会在错误的抽象层级上使用它，可靠性也会因此受损。\n\n我在我们的网站上详细讨论了这个问题 🧵👇 https://t.co/CfY5W84NqA"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Shreya Shankar", "role": "UC Berkeley / AI 工程研究员", "why": "评测、LLM Pipeline、AI 工程学科化", "handle": "sh_reya"}, "createdAtIso": "2026-11-06T17:52:40+00:00", "createdAtBeijing": "2026-11-07T01:52:40+08:00", "createdAtLocal": "11-07 01:52 北京", "url": "https://x.com/sh_reya/status/2118763511295967314", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2118763511295967314", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "决策模型的推理负载与定价分析", "evidence": "Your prefill subsidized my decode", "rationale": "解释负载差异与统一定价错配，提供选型视角"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "现在，围绕决策模型的热潮似乎稍稍平息了，我来谈谈自己的看法。决策模型解决的是市场效率问题。不同工作负载差异极大，例如以预填充为主的操作占比、前缀复用程度、所需智能水平等，但定价方式通常相同。你的预填充在补贴我的解码，让你耗费大量时间和金钱。现在，你那些只需预填充的工作负载有了更便宜、更快的接口。"}, "avatar": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, {"id": "2118693633226612833", "track": "tools", "source": {"id": "2118693633226612833", "text": "支持了，v0.1.3170 起同一个网关密钥可以按模型或按服务商单独设额度。打开这个密钥的额度编辑，在模型那一栏选比如「OpenAI 的全部模型」，再填每月 $20；命令行：magpie gateway-key limit \u003cid> add month --cost 20 --model openai/* 。额度用完只拦这些模型，同一个 key 的其他模型照常可用，路由组会跳到还有额度的成员。", "createdAt": "Fri Nov 06 13:15:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2118636433619767599", "inReplyToStatusId": "2118636433619767599", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "yetone", "role": "Agent 与开发工具实践与观察", "why": "magpie 故障复盘交代锁、I/O、冷启动和修复，属于可学习的真实工程。", "handle": "yetone"}, "createdAtIso": "2026-11-06T13:15:00+00:00", "createdAtBeijing": "2026-11-06T21:15:00+08:00", "createdAtLocal": "11-06 21:15 北京", "url": "https://x.com/yetone/status/2118693633226612833", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2118693633226612833", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Magpie 网关密钥按模型设置额度", "evidence": "同一个网关密钥可以按模型或按服务商单独设额度", "rationale": "提供版本、操作命令及额度耗尽后的行为"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, {"id": "2118736396638904375", "track": "creative", "source": {"id": "2118736396638904375", "text": "录了个视频，分享下我用 AI 做 PPT 的提示词。\n\n依旧 AI 剪辑口播，\n\n多平台封面图 + 字幕 + 动效 + 音效 + bgm 一条龙，这套 Skill 越来越成熟了。 https://t.co/cUagCuj2ms", "createdAt": "Fri Nov 06 16:04:55 +0000 2026", "replyCount": 7, "retweetCount": 2, "likeCount": 12, "conversationId": "2118736396638904375", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "quotedTweet": {"id": "2118349904343146721", "text": "我发现，2026 年 11 月份的现在，用 AI 做 PPT 其实不太需要用到一些 Skill 了，要用的话也是要用最新的 skill。\n\n因为现在市面上好多开源的 PPT Skill 实际上已经过时了，尤其是看它们的提交记录，最后一次提交都是几个月前的那种。\n\n为什么这么说呢？随着模型能力的提升，其实好多优秀的设计模型自己已经学会了这些优秀的审美设计。\n\n如果用一些过时的 PPT Skill 去做，反而可能会限制模型更强的审美能力。而且那些 Skill 用的人多了，也会导致大家的样式趋同。\n\n所以我现在做 PPT 一般是这样的，先分享一个我日常使用的一个非常舒服的流程：\n\n当你的大纲内容都写完之后，我会跟 AI 说：\n\n“请用你最天才的设计，先做 5 个 PPT Demo 让我先看一下。”\n\n虽然听起来有点蠢，但确实好用！！！\n\n然后，你就会得到 5 份可能都还不错的样式。我亲测，用这个方法，目前 Claude Opus 5.5 的效果是最好的。\n\n如果你不满意的话，再让它出 5 个不一样的就可以了。基本上从这 5 个 Demo 里面，我都能够选到我想要的。\n\n选定 Demo 之后，一些细节可以在 Demo 阶段再调一调，然后就可以全部执行了。\n\n如果你没有那么多审美好的模型的额度，还有一个办法：\n\n让它们出完 Demo 之后，你选定一个，再让 AI 把这个风格蒸馏出来，比如把它弄成一个 Skill，然后让其他模型去执行这个 Skill，做出来的效果也是差不多的。", "createdAt": "Thu Nov 05 14:29:08 +0000 2026", "replyCount": 10, "retweetCount": 1, "likeCount": 21, "conversationId": "2118349904343146721", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXhGwab0AA9aP_.jpg", "width": 832, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWXhGwab0AA9aP_.jpg:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118735941707915264/img/PNam6g1__M4AbBoI.jpg", "width": 1080, "height": 1440, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118735941707915264/img/PNam6g1__M4AbBoI.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118735941707915264/vid/avc1/1080x1440/BkwBVwVxJBavnRfX.mp4?tag=29", "durationMs": 254100}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-11-06T16:04:55+00:00", "createdAtBeijing": "2026-11-07T00:04:55+08:00", "createdAtLocal": "11-07 00:04 北京", "url": "https://x.com/jinchenma_ai/status/2118736396638904375", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2118736396638904375", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI制作PPT的多方案选型与风格复用", "evidence": "先做 5 个 PPT Demo 让我先看一下", "rationale": "提供选样、微调与风格蒸馏流程，并自述视频实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2118636003564880233", "track": "creative", "source": {"id": "2118636003564880233", "text": "用一个 Skill 做可发布的食物广告，关键不是提示词多花哨。\n\n·先填 brief：产品、渠道、必须有的、不能出现的；没确认的写待定。\n·再让 Skill 摊三个方向，选一个写死约束。\n·然后多模型出图，盯 Logo，不行就只修那一块。\n·最后人看一眼能不能发——Skill 是工作单，发布键还是你按。 https://t.co/HVlwi72DBO", "createdAt": "Fri Nov 06 09:26:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 2, "conversationId": "2118636003564880233", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2089602192135123092", "text": "这两天在研究 Codex，找到一个还不错的中文网站：CodexGuide。\n\n从安装、登录、基础操作，到 CLI、IDE、权限配置和真实项目实战都有，内容整理得很清楚，对刚接触 Codex 的人尤其友好。\n\n不用注册，打开就能看：  \nhttps://t.co/2nEotr2o24 https://t.co/q0s8NIU5ID", "createdAt": "Tue Aug 18 06:36:00 +0000 2026", "replyCount": 64, "retweetCount": 155, "likeCount": 457, "conversationId": "2089602192135123092", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2089574831364911104/img/czy0nNolfyM0LKSb.jpg", "width": 2048, "height": 1297, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2089574831364911104/img/czy0nNolfyM0LKSb.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2089574831364911104/vid/avc1/3412x2160/irYc5T-QK07fqLWS.mp4?tag=29", "durationMs": 44442}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118631012666376192/img/rErAMQyJzb0J5awu.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118631012666376192/img/rErAMQyJzb0J5awu.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118631012666376192/vid/avc1/1080x1920/6pY-CW8xi8tJUoCi.mp4?tag=29", "durationMs": 51066}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-06T09:26:00+00:00", "createdAtBeijing": "2026-11-06T17:26:00+08:00", "createdAtLocal": "11-06 17:26 北京", "url": "https://x.com/sitinme/status/2118636003564880233", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2118636003564880233", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "用 Skill 制作食物广告的工作流程", "evidence": "先填 brief：产品、渠道、必须有的、不能出现的", "rationale": "给出需求确认、方向约束、局部修图与人工审核方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118663496305201554", "track": "growth", "source": {"id": "2118663496305201554", "text": "建站首选 TanStarter和 MkSaaS 模板", "createdAt": "Fri Nov 06 11:15:15 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 2, "conversationId": "2118663496305201554", "author": {"username": "indie_maker_fox", "name": "Fox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, "authorId": "1865299069092139008", "quotedTweet": {"id": "2118525597257494941", "text": "副业探索记录 01｜AI 工具站出海，先跑通最小 MVP\n\n最近开始尝试一些副业方向，主要关注 AI 工具站出海，看了gefei师傅大概三十多篇内容，通过 Google SEO 获取自然流量，再尝试商业化变现。\n\n这周做了一些简单的验证。\n\n1. 第一次验证 SEO 自然流量\n\n通过 Cloudflare 搭了一个很简单的网站，选了一个非常小众的下载工具相关长尾关键词。\n\n没做太多复杂的 SEO 操作，页面就排到了 Google 首页第 3～4 位，也确实获得了来自 Google 搜索的真实用户点击。\n\n虽然关键词搜索量很小，但至少验证了一件事：从关键词选取、建站、收录、排名到获取真实流量，这条链路是能跑通的。\n\n当然，有排名不代表有商业价值，这只是第一步。\n\n2. 逆向研究了 100 多个同行网站\n\n前段时间看到有朋友在 X 上公开了自己的出海网站，顺着相关关键词继续挖掘，也是歌飞师傅他们组织的一次内部比赛。\n\n于是顺着关键词找到了一批同类型网站，再通过域名反查各个网站布局的关键词，前后大概整理了 100 多个站。\n\n挨个看了一圈，有两个比较明显的发现：\n\n大多数网站都围绕 AI 展开，比我预想中更集中。我原本以为会看到更多垂直的小工具站。\n建站技术栈相对集中，比较常见的是 MkSaaS 和 ShipAny 这类模板。\n\n当然，样本本身有一定局限，不能代表整个出海工具站市场。\n\n3. 下一步：先跑通商业闭环\n\n对我来说，建站本身不是太大的技术门槛。\n\n目前更想做的是把整套流程跑通：\n\n选词 → 建站 → 部署 → SEO → 获取用户 → 支付 → 收益验证\n\n接下来准备先上线一个具备完整支付能力的商业站，把部署、支付接入等重复性工作尽可能脚本化，降低后续批量验证想法的成本。\n\n4. 我认为开始阶段真正的难点还是选词\n\n这几天最大的感受是：\n\n写代码、搭网站、接支付，本身算是接近自己专业，都可以借助 AI 快速完成，相对来说更简单一些。\n\n但找到一个有真实需求、竞争相对可控、同时具备付费可能性的关键词，反而没那么容易。\n\n后续准备专门研究新词挖掘和热点监控，尝试通过脚本提高发现机会的效率。\n\n现阶段不打算把事情搞得太复杂。\n\n先跑通一个真正有人用、有人愿意付费的最小 MVP，再考虑。\n\n持续记录，可能会失败，哈哈哈哈，后边有师傅做的时候可以参考一下。", "createdAt": "Fri Nov 06 02:07:17 +0000 2026", "replyCount": 1, "retweetCount": 1, "likeCount": 1, "conversationId": "2118525597257494941", "author": {"username": "j1ang9527", "name": "齐文", "profileImageUrl": "https://pbs.twimg.com/profile_images/2115440930002284544/8z-2H1bu_normal.jpg"}, "authorId": "2054452773954174976"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-11-06T11:15:15+00:00", "createdAtBeijing": "2026-11-06T19:15:15+08:00", "createdAtLocal": "11-06 19:15 北京", "url": "https://x.com/indie_maker_fox/status/2118663496305201554", "themeId": "editorial", "signalScore": 51, "editorial": {"id": "2118663496305201554", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "工具站SEO与最小商业闭环验证", "evidence": "页面就排到了 Google 首页第 3～4 位", "rationale": "引用含选词获客实测与同行研究，结果为自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2118765701158826470", "track": "agent", "source": {"id": "2118765701158826470", "text": "@Teamily_AI just launched Voice Agent. Every agent now has a call button, and it starts working on the task while you’re still talking.\n\nFor us, voice is one of the most important parts of how people will interact with AI. On SGLang Omni we build the serving runtime for interactive models, and the hard problems are rarely the voice itself. When should the system speak, wait, or stop? Was that “mm-hm” an interruption or just a backchannel? And after you cut in, what did you actually hear?\n\nTeamily works on the other half: an agent that remembers your other chats and hands back real work, a landing page, a poster, a weekly schedule, in whatever language you speak.\n\nIf you’re curious about the infra side of full-duplex interaction, here’s our write-up: \n\nhttps://t.co/ZjVBAzy4pb\n\nAnd!\n\nTry Voice Agent: https://t.co/uTWlOCy3C6", "createdAt": "Fri Nov 06 18:01:22 +0000 2026", "replyCount": 6, "retweetCount": 12, "likeCount": 58, "conversationId": "2118765701158826470", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2118750261476811251", "text": "🎙️ Teamily Voice Agent: Communicate Naturally. Get Things Done as You Talk. Moving towards The Future of Multi-Human, Multi-Agent Voice Collaboration.\n\n🗣️ 𝗠𝗼𝗿𝗲 𝗧𝗵𝗮𝗻 𝗩𝗼𝗶𝗰𝗲 𝗖𝗵𝗮𝘁. 𝗧𝘂𝗿𝗻 𝗖𝗼𝗻𝘃𝗲𝗿𝘀𝗮𝘁𝗶𝗼𝗻𝘀 editorial": {"id": "2118765701158826470", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Teamily语音Agent发布与全双工交互", "evidence": "just launched Voice Agent", "rationale": "自述发布边说边执行功能，并列出交互难点"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "@Teamily_AI 刚刚推出了 Voice Agent。现在，每个智能体都有一个通话按钮，你还在说话时，它就已经开始处理任务了。\n\n我们认为，语音是未来人们与 AI 交互最重要的方式之一。在 SGLang Omni，我们为交互式模型构建推理服务运行时，而难题往往不在语音本身。系统什么时候该说话、等待或停下？那声“嗯嗯”是在打断，还是仅仅表示在听？而在你插话后，你实际上听到了哪些内容？\n\nTeamily 则负责另一半：让智能体记住你的其他聊天内容，并用你所说的语言交付实际成果，比如落地页、海报或每周日程。\n\n如果你对全双工交互背后的基础设施感兴趣，可以看看我们的文章：\n\nhttps://t.co/ZjVBAzy4pb\n\n还有！\n\n试用 Voice Agent：https://t.co/uTWlOCy3C6"}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2118514804189233568", "track": "research", "source": {"id": "2118514804189233568", "text": "Honestly quite impressed with the methodology on this benchmark. @dwarkesh_sp want a job designing evals at @OpenAI? https://t.co/cnfu0gcNtu", "createdAt": "Fri Nov 06 01:24:24 +0000 2026", "replyCount": 72, "retweetCount": 56, "likeCount": 2220, "conversationId": "2118514804189233568", "author": {"username": "polynoamial", "name": "Noam Brown", "profileImageUrl": "https://pbs.twimg.com/profile_images/1872883170292457472/8ywVGO5M_normal.jpg"}, "authorId": "825088493764407298", "quotedTweet": {"id": "2118449808402681911", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "createdAt": "Thu Nov 05 21:06:07 +0000 2026", "replyCount": 169, "retweetCount": 151, "likeCount": 2714, "conversationId": "2118449808402681911", "author": {"username": "dwarkesh_sp", "name": "Dwarkesh Patel", "profileImageUrl": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg"}, "authorId": "1209960539390201864", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWZY5oDWIAAiAi4.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HWZY5oDWIAAiAi4.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118447221465100289/vid/avc1/1920x1080/F4XOvVzCanOvIe0S.mp4?tag=29", "durationMs": 1093674}], "translationZh": "我花了 2 万美元的 API 额度，让不同的 AI 模型在 Blood on the Clocktower（一款类似杀人游戏或狼人杀的社交推理游戏）中相互对战。\n\n结果非常有意思。今年以来，模型在临场设计计谋、虚张声势，以及通过团队推理识破这些暗中阴谋方面，都进步了很多。\n\n我在这段视频中回顾了 AI 玩出的几场最精彩的对局。新模型已经相当厉害了。如果我的朋友在游戏中打出其中一些操作，我一定会和他们碰拳庆祝。\n\n顺带一提，OpenAI 的较新模型在这款游戏中的表现远胜于 Anthropic 的模型。\n\n你可以在网站上查看完整的基准测试，我也开放了功能，让你和朋友能与这些 AI 对战：https://t.co/IF4d0EMSD8"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZ5_MjbsAAi6FN.jpg", "width": 987, "height": 625, "previewUrl": "https://pbs.twimg.com/media/HWZ5_MjbsAAi6FN.jpg:small"}], "expert": {"priority": "P0", "domain": "推理模型 / OpenAI", "name": "Noam Brown", "role": "OpenAI / 推理研究", "why": "推理模型、自博弈、o 系列能力方向的重要信号源", "handle": "polynoamial"}, "createdAtIso": "2026-11-06T01:24:24+00:00", "createdAtBeijing": "2026-11-06T09:24:24+08:00", "createdAtLocal": "11-06 09:24 北京", "url": "https://x.com/polynoamial/status/2118514804189233568", "themeId": "editorial", "signalScore": 99, "editorial": {"id": "2118514804189233568", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "社交推理游戏模型评测 let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
