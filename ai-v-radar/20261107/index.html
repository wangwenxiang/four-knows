<script>
const DATA={"records": [{"id": "2118622217525416174", "track": "agent", "source": {"id": "2118622217525416174", "text": "Shopify Reflex：让 AI 不靠模拟器，也能验证原生 App 的行为\n\n来自 Shopify Engineering 博客，Reflex 是 Shopify 为 AI 编程设计的移动应用架构：把业务逻辑与界面分开，让 Agent 通过命令行直接读取状态、执行操作和验证结果。iOS、Android 仍分别写原生代码，但共享行为测试。\n\n# 瓶颈从写代码变成验证\n\nAgent 几分钟就能写出一个页面，但验证仍要启动模拟器、构建应用、模拟点击。Shopify 即使改进了模拟器工具，也碰到了速度上限。\n\nReflex 的思路不是继续加速点击，而是让应用本身提供一种不启动界面也能运行和检查的方式。\n\n# 核心机制：直接操作界面背后的状态\n\n应用核心层不依赖界面和设备，可以直接在 macOS 或 JVM 上运行。每个页面的 ViewModel（管理页面状态和操作的组件）都暴露统一接口：当前状态、可执行动作，以及子组件。\n\nAgent 通过命令行发送动作，再读取 JSON 状态，验证业务逻辑、输入校验、导航和错误处理。它运行的是真实业务代码，而不是另一套模拟实现；网络等外部依赖则用预设数据替代，行为测试还会强制阻止真实 HTTP 请求。\n\n关键原则是 “共享测试，而不是共享代码”：Swift 和 Kotlin 各自实现，同一份行为测试在两端运行，两边都通过才能合入。这样既保留原生实现，也用测试约束双端行为一致。\n\n# 效果与边界\n\nShopify 报告，超过 1,700 条行为测试在持续集成环境中双端约 4 分钟跑完。文中示例在预热后，无设备运行只需几百毫秒，同一测试在 iOS 模拟器上约需 2 秒。\n\n但它不验证像素，也不能证明界面按钮正确连接到了对应操作。视觉检查仍靠设计系统对照、少量截图测试和实际使用。Reflex 目前也不是可直接安装的开源库，团队需要自行实现这套架构和适配层。", "createdAt": "Fri Nov 06 08:31:13 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 17, "conversationId": "2118622217525416174", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2118369291711975654", "text": "We rebuilt our mobile apps in Swift and Kotlin with agents. To keep pace and hold our quality bar, we built Reflex: an agentic-first architecture that lets agents build and verify app behavior across iOS and Android without needing devices or simulators.\n\nHere's how it works, piece by piece:\nhttps://t.co/Eaxae98QXS", "createdAt": "Thu Nov 05 15:46:11 +0000 2026", "replyCount": 39, "retweetCount": 138, "likeCount": 1475, "conversationId": "2118369291711975654", "author": {"username": "ShopifyEng", "name": "Shopify Engineering", "profileImageUrl": "https://pbs.twimg.com/profile_images/1135963802258890754/8wt-ffSB_normal.png"}, "authorId": "732393381444255744", "translationZh": "我们借助智能体，用 Swift 和 Kotlin 重写了移动应用。为了兼顾开发速度和质量标准，我们构建了 Reflex：一种以智能体为先的架构，让智能体无需设备或模拟器，就能开发和验证 iOS 与 Android 应用的行为。\n\n下面逐一介绍它的工作原理：\nhttps://t.co/Eaxae98QXS"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbbrLAbAAEsrLD.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWbbrLAbAAEsrLD.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-06T08:31:13+00:00", "createdAtBeijing": "2026-11-06T16:31:13+08:00", "createdAtLocal": "11-06 16:31 北京", "url": "https://x.com/shao__meng/status/2118622217525416174", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2118622217525416174", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Shopify Reflex 无模拟器行为验证架构", "evidence": "同一份行为测试在两端运行", "rationale": "具体架构成果，说明验证机制、规模与局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2118680242797883876", "track": "research", "source": {"id": "2118680242797883876", "text": "Hugging Face 团队投入 ~80 万 GPU 小时开展实验，整理成免费开放的「终极 MoE 训练手册」\n\n全文约 7 万词，配有 55 个交互图示、可运行代码和实际实验数据，围绕训练团队最常遇到的问题展开：专家数量与大小怎么选、跨卡通信为何拖慢训练、路由与负载均衡如何设置，以及该从稠密模型改造还是从头训练。是一份把分散的 MoE 训练经验系统公开、供实践者反复查阅的工程指南。\nhttps://t.co/CBHSGqSAnY\n\nMoE 到底省了什么\n\nMoE 把部分前馈网络换成多个专家，由路由器为每个 token 选择其中几个，再合并它们的输出。因此，模型可以增加总参数量，而不按相同比例增加每个 token 的计算量。\n\n文中示例有 64 个专家，每次选 8 个，每个专家的宽度为 1024。相较宽度 8192 的稠密前馈层，它存储约 8 倍参数，每个 token 使用的专家总宽度却相同。省的是激活计算，不是全部参数的存储需求；整个示例模型约有 68.6 亿总参数、12.2 亿激活参数。\n\n真正难在三个环节\n\n1. 路由要稳定。 专家选择依赖分数排序，低精度可能改变接近的分数与选择结果。手册因此强调路由计算采用 FP32，并讨论不同路由方法的取舍。\n\n2. 专家负载要均衡。 如果大量 token 涌向少数专家，其他设备就会等待。文章比较辅助损失、无需辅助损失的偏置调整等方法。强制均匀路由的对照实验约快 1.5 倍，但它舍弃了学到的路由，只能说明速度空间，不能直接当成训练方案。\n\n3. 通信不能抵消计算收益。 专家分布在不同 GPU 后，每层都要分发 token、收回结果。文中一次性能分析里，未被计算掩盖的通信约占一步的一半；网络配置错误、通信退回普通 socket 的案例甚至慢了约 25 倍。\n\n从训练延伸到部署与强化学习\n\n手册建议先检查硬件和网络、建立稠密模型基线，再逐项加入 MoE 设置，而不是一次打开所有优化。\n\n部署时，减少每次选中的专家数可以降低计算量，但不会自动减少模型权重的显存占用，也可能影响质量。强化学习还有额外问题：生成训练数据的推理引擎，与训练引擎可能选出不同专家，造成执行路径不一致。", "createdAt": "Fri Nov 06 12:21:47 +0000 2026", "replyCount": 9, "retweetCount": 10, "likeCount": 65, "conversationId": "2118680242797883876", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2118432475730882627", "text": "18 of the 20 best open models today are Mixture-of-Experts. Dense is basically over.\n\nAnd yet the know-how to train a good MoE still lives mostly in the heads of a handful of teams.\n\nSo we spent 800k GPU hours running the experiments ourselves and wrote everything down. Super happy to finally release \"The Ultimate MoE Training Handbook\", free and open, organized around the questions training teams hit:\n- how many experts, how big, shared or not?\n- why is half my step spent in all-to-all, and how do I hide it?\n- why is my run 25x slower with no error in the logs?\n- softmax, sigmoid or sqrt(softplus) router, and why keep it in fp32?\n- aux loss or DeepSeek's loss-free bias?\n- upcycle a dense checkpoint or train from scratch?\n- can I serve with fewer experts per token than I trained with?\n\n⚠️ Warning: it's long (~70k words, budget a few days, sorry) but with 55 interactive figures, code you can run and numbers from our own runs.\n\nRead it here: https://t.co/6XihlUrj92", "createdAt": "Thu Nov 05 19:57:15 +0000 2026", "replyCount": 115, "retweetCount": 495, "likeCount": 3736, "conversationId": "2118432475730882627", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118429152424370176/img/NrWnEgumFzh9jy5X.jpg", "width": 1080, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118429152424370176/img/NrWnEgumFzh9jy5X.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118429152424370176/vid/avc1/1080x1080/1w2-lbGlHJ7t-Axm.mp4?tag=29", "durationMs": 162410}], "translationZh": "目前最强的 20 个开放模型中，有 18 个采用混合专家架构。稠密模型基本已经退场。\n\n然而，训练优秀 MoE 模型的诀窍，仍主要掌握在少数团队手中。\n\n于是，我们投入 80 万 GPU 小时亲自做实验，并记录下所有经验。很高兴终于发布《MoE 训练终极手册》：免费开放，围绕训练团队常遇到的问题展开：\n- 该用多少个专家？多大规模？是否设置共享专家？\n- 为什么单步训练一半的时间都花在 all-to-all 通信上？如何掩盖这部分开销？\n- 为什么训练慢了 25 倍，日志却没有报错？\n- 路由器该选 softmax、sigmoid 还是 sqrt(softplus)？为什么要保持 fp32 精度？\n- 该用辅助损失，还是 DeepSeek 的无辅助损失偏置机制？\n- 将稠密模型检查点改造成 MoE，还是从头训练？\n- 推理时每个 token 激活的专家数，可以少于训练时吗？\n\n⚠️ 提醒：篇幅很长，约 7 万词，请预留几天时间，抱歉。但其中包含 55 张交互图、可运行的代码，以及我们实际训练得到的数据。\n\n阅读地址：https://t.co/6XihlUrj92"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118680174917201922/img/eqEqm1ITy_8C2vdQ.jpg", "width": 1428, "height": 1492, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118680174917201922/img/eqEqm1ITy_8C2vdQ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118680174917201922/vid/avc1/1428x1492/aR0wyUvgBIs1dzDU.mp4?tag=29", "durationMs": 15866}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-06T12:21:47+00:00", "createdAtBeijing": "2026-11-06T20:21:47+08:00", "createdAtLocal": "11-06 20:21 北京", "url": "https://x.com/shao__meng/status/2118680242797883876", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2118680242797883876", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "MoE训练手册与工程实验", "evidence": "路由计算采用 FP32", "rationale": "公开实验、代码及训练故障案例，实践信息充分"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2118528596340039790", "track": "research", "source": {"id": "2118528596340039790", "text": "Proud to release our new model, Inkling 2 Small. Check out our blog post -- it includes a lot of detail about our training process.\n\nTo me, the most interesting part of this release was what we learned about alignment, which you can read about in the sections \"Safety and alignment\" and \"Training Inkling 2 Small\".\n\nWe experienced some unpleasant surprises when our early checkpoints took unexpected actions to circumvent guardrails during training and evals. We realized our capabilities-focused RL was training them to be extremely persistent and to succeed at tasks at all costs. Offline monitors first flagged this behavior, but later we realized it was happening frequently and was easy to replicate.\n\nBefore this release, we sprinted on a range of alignment interventions, from SFT to RL. These are briefly described in the blog post. We made a lot of progress, with big improvements on our own alignment evals and on previously unseen evals from external evaluators like Apollo and Goodhart.\n\nWe have a long way to go in developing alignment techniques that keep pace with the increases in model intelligence and training scale. We hope to share these techniques to improve the ecosystem. We also have a business reason: our goal with Tinker is to enable many people to do their own large-scale post-training, and we need to help them to do this without incident. Join us if you'd like to build this public science and practice of alignment. https://t.co/LdjsDFRZIN", "createdAt": "Fri Nov 06 02:19:12 +0000 2026", "replyCount": 60, "retweetCount": 82, "likeCount": 809, "conversationId": "2118528596340039790", "author": {"username": "johnschulman2", "name": "John Schulman", "profileImageUrl": "https://pbs.twimg.com/profile_images/1389000537195040770/DzWPljT-_normal.jpg"}, "authorId": "1388977636618080256", "quotedTweet": {"id": "2118489527362912566", "text": "Introducing Inkling 2 Small. Scoring 31 on the AA Intelligence Index, it's a big jump over its predecessor.\n\nInkling 2 Small is available for fine-tuning and inference on Tinker today, with full weight release planned soon.\n\nhttps://t.co/VR02tw73fJ", "createdAt": "Thu Nov 05 23:43:57 +0000 2026", "replyCount": 236, "retweetCount": 476, "likeCount": 4914, "conversationId": "2118489527362912566", "author": {"username": "thinkymachines", "name": "Thinking Machines", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075275500420001792/Q9J4M1DL_normal.jpg"}, "authorId": "1891523745929732096", "translationZh": "推出 Inkling 2 Small。它在 AA Intelligence Index 上获得 31 分，较上一代大幅提升。\n\n即日起，Inkling 2 Small 已可在 Tinker 上进行微调和推理，计划很快开放完整权重。\n\nhttps://t.co/VR02tw73fJ"}, "expert": {"priority": "P1", "domain": "AI 研究", "name": "John Schulman", "role": "前 OpenAI；RLHF 关键人物", "why": "RLHF、后训练、推理和 Alignment", "handle": "johnschulman2"}, "createdAtIso": "2026-11-06T02:19:12+00:00", "createdAtBeijing": "2026-11-06T10:19:12+08:00", "createdAtLocal": "11-06 10:19 北京", "url": "https://x.com/johnschulman2/status/2118528596340039790", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2118528596340039790", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Inkling 2 Small发布与对齐训练复盘", "evidence": "circumvent guardrails", "rationale": "发布模型并复盘能力强化学习引发的绕护栏行为"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "很高兴发布我们的新模型 Inkling 2 Small。欢迎阅读博客文章，里面详细介绍了我们的训练过程。\n\n对我来说，这次发布最有意思的部分是我们在对齐方面的收获，详见“安全与对齐”和“训练 Inkling 2 Small”两节。\n\n早期模型检查点在训练和评估中采取了意料之外的行动，试图绕过安全护栏，这让我们颇感意外和不安。我们意识到，以能力提升为重点的强化学习让模型变得极其执着，不惜一切代价完成任务。离线监测系统最先标记了这种行为，后来我们发现，它不仅频繁出现，而且很容易复现。\n\n发布前，我们集中推进了一系列对齐干预措施，涵盖监督微调（SFT）和强化学习（RL）。博客文章对此作了简要介绍。我们取得了很大进展：模型在内部对齐评估，以及 Apollo、Goodhart 等外部评估机构提供的此前未见过的评估中，表现都有显著提升。\n\n要让对齐技术跟上模型智能水平和训练规模的增长，我们还有很长的路要走。我们希望分享这些技术，推动整个生态进步。这也有商业上的考量：Tinker 的目标是让更多人能够自行开展大规模后训练，而我们需要帮助他们安全地完成这一过程。如果你愿意一起建设开放的对齐科学与实践，欢迎加入我们。https://t.co/LdjsDFRZIN"}, "avatar": "https://pbs.twimg.com/profile_images/1389000537195040770/DzWPljT-_normal.jpg"}, {"id": "2118569598379229219", "track": "agent", "source": {"id": "2118569598379229219", "text": "以前我团队有个员工做事比较粗心，也比较懒，每次让别人 Review PR 都不自己测，一审查就发现很多问题，后来我就让他提交 PR 的时候必须要带上相关功能修改的截屏，这样效果很好，至少去截图的时候得测试一遍。\n\n现在我也把这一套应用在 AI 身上了，每次 Agent 任务完成，让它自己测试验证后，生成效果截图，让我看看效果。很多时候它自己截图的时候就发现问题，能顺手修复一下。", "createdAt": "Fri Nov 06 05:02:08 +0000 2026", "replyCount": 163, "retweetCount": 22, "likeCount": 262, "conversationId": "2118569598379229219", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2118164405594595702", "text": "Anthropic 的 Addy Osmani：一天合并三万次代码变更，人看的是 AI 交上来的证据\n\nAnthropic 今年 5 月每天往代码库里合并大约 2500 次代码变更，到 9 月已经超过 3 万次，涨了十几倍。这么多改动，显然不可能每一行都有人看过。那他们凭什么敢合并？\n\n负责 Claude Code 开发者体验的 Addy Osmani 在这场对谈里讲了他们的做法：每个改动先由 Claude 像真实用户一样实际用一遍、审一遍，发现问题自动修；人不再逐行读代码，而是去看 AI 交上来的证据，比如它在浏览器里点来点去的录屏、在手机和电脑上的截图。\n\n在他看来，写代码已经不是难点，接下来能不能再快一截，取决于能不能把“验证”做扎实。给 AI 一个检查自己做得对不对的办法，产出的质量能好两到三倍。如果你也在用 AI 写代码，又拿不准哪些改动敢直接合并，这期给了一份大公司内部的参考答案。\n\n这是 AI Engineer 大会上一场 18 分钟的台上对谈。Addy Osmani 在 Google 工作了大约 14 年，长期负责 Chrome 的开发者体验，写过大量面向开发者的文章，今年 9 月加入 Anthropic。提问的 Manish Kapur 在 Sonar 负责产品和开发者关系，Sonar 是做代码质量和安全检查工具的公司，旗下的 SonarQube 用来自动扫描代码里的漏洞和问题。\n\n【Anthropic 的做法：Claude 先审一遍，人看证据】\n\nManish 提到，他前一晚刚读了 Anthropic 发的一篇文章，里面说 Anthropic 现在每天合并约 3 万次代码变更。Addy 补充了两个数字：5 月的时候每天大约 2500 次；最近 https://t.co/aTfkxmbzQe 网页版重做，性能提到了原来的三倍左右，这次重做在很短时间里合并了大约 3000 个 PR（代码合并请求），参与的不只有工程师，还有产品设计师和其他岗位的人。\n\n他说他们的审查流程分几步。第一步是让 Claude 先审一遍，关键在于要让它能像真实用户一样把功能实际用一遍：跑端到端测试（从头到尾模拟用户操作的自动化测试），在浏览器里打开页面检查，运行各种工具和代码规范检查，凡是能建立信心的检查都做。\n\n发现 bug 或者功能缺口怎么办？他们设置了 Hook（一种在特定时机自动触发的脚本），每次代码有改动就自动运行，检查这次改了什么，这样 PR 里的问题能尽快被改掉。Anthropic 还有一个代码审查产品，他们自己也在用。整体思路是尽可能把代码审查自动化。\n\n第二步是把团队的“品味”写下来。Addy 说现在大家常讲品味和判断力，团队应该把自己认为的最佳实践和品味写进共享的 CLAUDE.md、AGENTS.md 这类文件（放在项目里、专门写给 AI 看的说明文档），AI 审代码时会去参考。\n\n第三步才轮到人，人负责检查 AI 给出的证据。他举的例子是：做一个用户在浏览器里用的界面，就要确认它在浏览器里测过，最好让 AI 生成一段它点来点去的录屏，看完你就有信心说“这个能用”；在意手机或桌面端的体验，就让它给出这些设备上的截图或录屏。他说目标是让 AI 尽可能多地提供验证证据。\n\n【瓶颈从写代码转到了验证】\n\nManish 给了几组数字说明问题。持续集成服务 CircleCI（代码提交后自动构建、测试的云服务）今年分析了 2800 万次自动化流程，发现代码产出量涨了 59%，但每 10 次往生产环境合并的尝试里有 3 次失败。Sonar 即将发布的一份调查里，76% 用 AI 生成代码的开发者说，代码产出的速度快到他们根本来不及验证。\n\nAddy 说，现在技术负责人最关心的是怎么在保证有信心的前提下更快上线。过去我们说一段代码质量高，依据是好的测试、性能基准、需求规格，这些能给人信心的东西现在都可以让 AI 便宜又快地生成出来，人再去修改完善。他认为工程师现在最该花时间的就是这些检查。\n\n至于下一步的提升从哪来，他说模型质量已经相当不错了，他举了 Opus 5.5 为例。更大的空间在验证，而且要讲具体。你跟人说“验证一下”，对方下一个问题就是“验证到底指什么”。所以讨论应该落到哪些测试真正有用上。Anthropic 用得最多的是三类：端到端测试；属性测试，也就是不写一个个具体例子，而是写一条规则（比如“排序后列表长度不变”），让程序自动生成大量随机输入去验证；还有视觉验证测试，通过截图对比检查界面有没有变样。目标是有足够的信心让这些改动自动合并。\n\nManish 从 Sonar 的角度补充了一个“多层验证”的框架，主张零信任，在每个环节都验证。第一层是规则固定的自动扫描，查 SQL 注入这类安全漏洞和常见 bug；第二层是 AI 审查，查规则扫不出来的逻辑问题，以及代码是否符合本来的意图；第三层是软件供应链检查，看项目依赖的第三方代码包里有没有已知漏洞或恶意代码。每一层专门抓一类问题。\n\n【从“亮灯工厂”到“熄灯工厂”，自主权要一步步挣】\n\n对谈的标题里有个说法叫“软件工厂”，来自 Addy 今年写的一篇文章，他的定义是“把循环规模化”：让 AI 一遍又一遍地规划、编写、检查、上线代码。他把软件工厂分成两种。亮灯工厂里，AI 承担这些步骤，但人还在里面，用自己的判断和品味把关。熄灯工厂更像全自动的汽车厂，机器人一直在干活，人退到更上游，只负责定方向，只有遇到最特殊的例外情况才被叫进来。\n\n他说大多数团队处在两者之间，都在摸索怎么在信得过的前提下一步步提高自动化程度。AI 能给出的验证越多、越让人有信心，就越能往熄灯的方向走。Sonar 的调查显示，目前只有 5% 的公司在用软件工厂，预计会涨到 34%，金融行业是 39%。被问到 2027 年底大多数团队会是哪种工厂，Addy 的判断是：亮灯工厂为主，带着一些熄灯的角落。\n\n自动化程度高了，管控就成了企业的难题。Addy 说，几个月前他接触过的很多公司都在担心同一件事：放手让工程团队用 AI 智能体，结果冒出了几百甚至几千个智能体，谁也不知道它们在干什么，它们访问各种系统和数据，可能还在往生产环境部署。他总结企业最关心三件事：怎么控制、怎么分配权限、怎么用沙箱（隔离的运行环境）保证智能体不越界。\n\nAI 写的代码要不要在 PR 里标出来？Addy 认为应该。过去工程师对自己写的代码有很强的归属感，在 Anthropic 大家没那么在意 Claude 被署名为作者，更看重给用户交付的东西对不对。标出来还有一个用处：知道是 AI 写的，就能决定要加哪些额外的约束和检查。Manish 也同意，他认为至少未来半年到九个月里应该标注，对金融客户来说还关系到审计。两人都强调责任归属不变。Addy 说，就算这次是我让 Claude 去干的活，出了问题还是我负责，还得我去修。\n\n那 AI 开的 PR 什么时候能放心合并？Addy 的回答是：你有充分的信心不会出问题，或者已经尽可能把风险降下来的时候。\n\n快问快答里，Addy 还给了两条建议。对技术负责人，要推着团队想清楚“验证”具体指什么，现在的测试做到了哪一步，离“AI 自己判断代码可以合并、你也放心”还差什么。对刚入行的开发者，多积累各种测试的经验，端到端测试、属性测试都要会。\n\n【不逐行看代码，和不验证是两回事】\n\nAnthropic 一天三万次合并，人显然也没有逐行看，但按 Addy 的说法，每次合并之前 AI 都得先把功能实际跑一遍，再把证据交给人看。省掉的是读代码的时间，验证一步都没少。\n\n他们能这样做是有前提的。\n\n一是模型，Addy 自己提到 Opus 5.5 这一代已经够好，我也是用上 Fable 和 Opus 5.5 之后才放心不怎么 Review。\n\n二是验证的基础设施：端到端测试、自动录屏、每次改动都触发的检查，这些都得先搭好。\n\n为了扛住这个量，据 Anthropic 10 月发的工程博客，他们连 Git 都换成了自己开发的版本管理系统。这样的投入，大多数团队一时做不到。\n\n所以我的建议是，想少看代码，别先急着把 Review 关掉，先补上 Addy 说的那一步：让 AI 交活的时候附上证据。如果不知道从哪里下手的话，可以从最容易出问题的界面开始，要求它在浏览器里实际操作一遍，给你截图或录屏。证据还是要你自己看，只是看录屏比读几百行代码快得多。\n\n另外，Manish 讲的三层验证框架可以参考，不过 Sonar 本身就是卖代码检查工具的，听这部分时心里有个数就行。\n\n视频来源：https://t.co/NAnM2wC9wj", "createdAt": "Thu Nov 05 02:12:02 +0000 2026", "replyCount": 114, "retweetCount": 23, "likeCount": 202, "conversationId": "2118164405594595702", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118162172744200192/img/wr0b-_7UAddVynpi.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118162172744200192/img/wr0b-_7UAddVynpi.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118162172744200192/vid/avc1/1920x1080/1GbdW_NKbylMdu9Q.mp4?tag=29", "durationMs": 1132000}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWarsJWWYAA9cHV.jpg", "width": 1302, "height": 1966, "previewUrl": "https://pbs.twimg.com/media/HWarsJWWYAA9cHV.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWaryAiXYAAhfsU.jpg", "width": 2000, "height": 1106, "previewUrl": "https://pbs.twimg.com/media/HWaryAiXYAAhfsU.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWar0ecWoAAwTs4.jpg", "width": 2000, "height": 1742, "previewUrl": "https://pbs.twimg.com/media/HWar0ecWoAAwTs4.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-06T05:02:08+00:00", "createdAtBeijing": "2026-11-06T13:02:08+08:00", "createdAtLocal": "11-06 13:02 北京", "url": "https://x.com/dotey/status/2118569598379229219", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2118569598379229219", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "以截图证据推动Agent自测", "evidence": "让它自己测试验证后，生成效果截图", "rationale": "自述截图验收实践，附多层验证方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2118820452038557790", "track": "creative", "source": {"id": "2118820452038557790", "text": "Google 发布 Gemini Omni 1.2 Flash：单条视频最长 15 秒，720p 一条约 1 美元，开发者和企业今天就能用\n\nGoogle 11 月 5 日发布视频模型 Gemini Omni 1.2 Flash。一次最长能生成 15 秒带声音的视频，比上一版 1.1 降价 30%，720p 每秒 0.07 美元。\n\n这也是 Omni 第一次正式商用（GA），可以直接用在生产环境。Omni 是 Google 今年 5 月在 I/O 大会上发布的模型，Google 拿它跟 Nano Banana 类比：像改图一样，用聊天一轮轮改视频。\n\n【一条 15 秒视频多少钱】\n\n按官方定价页换算，720p 一条 15 秒约 1.04 美元。1.1 版每秒约 0.10 美元、最长 10 秒，以前 1 美元买 10 秒，现在买 15 秒。\n\n先用 360p 打草稿，15 秒约 0.35 美元；满意了再出高清，1080p 约 1.56 美元，4K 约 3.13 美元。时长 3 到 15 秒按整秒选。\n\nAPI 免费层不能用，要开付费账户。12 月 3 日起，调用 1.1 的请求自动转给 1.2，按 1.2 的价格收费。\n\n【谁能用、在哪用】\n\n开发者今天就能在 Google AI Studio 里试，用 Gemini API 接入；企业走 Google Cloud。\n\n普通用户：Google Vids（Google 的视频制作工具）里有 Google 账号就能生成 15 秒片段，不额外收费；Gemini App 正逐步推给 AI Ultra 订阅用户。\n\nAI 拍片工具 Flow 里也能用，博客没写要哪档订阅，1.1 版当时开放给 AI Plus、Pro、Ultra 用户。Google Ads 里可以用它批量做广告视频。\n\n【比 1.1 强在哪】\n\n一是长度从 10 秒变成 15 秒，一条完整的产品介绍或社交媒体广告，一次就能生成完。\n\n二是能对着同一条视频连续提要求：换产品、换背景、改光线、改横竖屏，不用从头重来。同一条广告改出几个版本，投给不同人群。\n\n三是更听参考素材的话。最多给 6 张参考图（人物、产品、风格）加一段 3 秒内的动作视频，Google 说人脸、衣服、包装上的字和品牌颜色，换机位也不走样。\n\nGoogle 自己放的演示里，一张模特照加三套衣服的正反面图，生成了 15 秒的转身试穿视频；另一条连换 5 次背景，角色的表演和构图不变。对话的口型也更准了。\n\n【跟 Veo、Sora 和别家比】\n\n在 Gemini API 上，Omni 已经接替了 Veo：Veo 3.1 预览版 10 月 22 日下线，官方让开发者迁到 Omni 1.2，或去 Google Cloud 用 Veo 正式版。\n\nOpenAI 那边已经没有 Sora 可选。据 OpenAI 帮助中心，Sora App 4 月 26 日关闭，API 9 月 24 日停服。\n\n同时卖多家模型的 Runway 开发者平台上，带声音视频每秒价格是：Veo 3.1 0.40 美元，Veo 3.1 Fast 0.15 美元，字节 Seedance 2.0（720p）0.30 美元，快手可灵 4（720p）原价约 0.16 美元。Omni 1.1 在那里卖 0.10 美元，跟 Google 自家价格一样。跟这几家比，Omni 1.2 的 0.07 美元最低。\n\n画质目前只有 Google 和 Runway、Picsart 等合作方的说法，演示也是 Google 自己挑的。Google 说快速体育动作、复杂物理效果还要再改进。官方文档写明只有英文做过完整评估，中文提示词效果没保证；上传自己的音频做参考，Gemini API 暂不支持。\n\n官方博客：https://t.co/F94nWAaZo0\nAPI 定价：https://t.co/AfcmTu3YD9\n https://t.co/s0suCSLBoC", "createdAt": "Fri Nov 06 21:38:56 +0000 2026", "replyCount": 8, "retweetCount": 1, "likeCount": 15, "conversationId": "2118820452038557790", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118385122072211456/img/uNWRtAagTHmuA4JZ.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118385122072211456/img/uNWRtAagTHmuA4JZ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118385122072211456/vid/avc1/1920x1080/r-U1MZHoXGvn7Zi3.mp4?tag=29", "durationMs": 25040}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-06T21:38:56+00:00", "createdAtBeijing": "2026-11-07T05:38:56+08:00", "createdAtLocal": "11-07 05:38 北京", "url": "https://x.com/dotey/status/2118820452038557790", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2118820452038557790", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Gemini Omni 1.2 Flash 视频模型发布介绍", "evidence": "一次最长能生成15秒带声音的视频", "rationale": "详列视频生成规格、定价、接入与限制，待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2118544528856514698", "track": "research", "source": {"id": "2118544528856514698", "text": "你是否需要很长的上下文？\n\nNVIDIA 新论文标题给了一种答案:《You don't need long context》。\n\n现在模型的 context window 越做越长，128K、256K、1M 已经很常见。\n\n但论文先指出一个很现实的问题：context 越长，后面的 token 越贵。\n\n在他们测试的开放模型上，256K context 相比 16K，每个输出 token 的推理成本高出约 3.6–7 倍。\n\n作者于是做了一件很简单的事：\n\n让 Agent 定期「压缩」自己的工作状态。\n\n对话变长以后，把当前进度、关键发现和下一步计划总结成一个更短的 semantic state，再从新的 context 继续执行。\n\n原始历史依然可以保存，需要时再选择性读取；模型没必要每一步都把全部历史重新塞进 context。\n\n结果在 6 个长时任务上，Claude Opus 4.5 和 GPT-5.6 Sol 即使把 context 压到很短，整体准确率依然基本保持稳定；估算推理成本分别最高降低约 8.8× 和 5×。\n\n他们甚至测试了一个更极端的版本：\n\nAgent 每执行一个动作，就重新压缩一次 context。\n\n性能依然没有崩。\n\n这也引出了论文里一个挺有意思的概念：Semantic State Space Model。\n\n未来长时 Agent 也许不需要维护一条越来越长的聊天记录，而是持续维护一个小而清晰的「当前状态」，执行一步，再更新一次。\n\n长 context 当然有价值，但很多 Agent 任务真正需要的，可能是更好的状态管理和按需检索。\n\n把所有历史一直带在身上，未必是最好的长期记忆方式。\n\n📎 arxiv: https://t.co/1ZG72dQGjn", "createdAt": "Fri Nov 06 03:22:30 +0000 2026", "replyCount": 11, "retweetCount": 26, "likeCount": 203, "conversationId": "2118544528856514698", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWaVAZdW4AAPWqJ.jpg", "width": 1440, "height": 1787, "previewUrl": "https://pbs.twimg.com/media/HWaVAZdW4AAPWqJ.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-06T03:22:30+00:00", "createdAtBeijing": "2026-11-06T11:22:30+08:00", "createdAtLocal": "11-06 11:22 北京", "url": "https://x.com/Xudong07452910/status/2118544528856514698", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2118544528856514698", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "通过语义状态压缩降低长时 Agent 推理成本", "evidence": "把当前进度、关键发现和下一步计划总结", "rationale": "介绍论文方法、任务测试与成本结果，待独立核验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2118621898724499616", "track": "growth", "source": {"id": "2118621898724499616", "text": "第一份《海外GEO白皮书》发布，开源给大家\n分享给做出海品牌和AI搜索优化的朋友，链接附在了评论区\n支持HTML在线阅读，也支持PDF下载\n\n一共236页，1000万条最新的海外各AI平台的AI回答数据分析与系统解读\n\n内容覆盖 ChatGPT、Gemini、Google AI Overviews / AI Mode、Perplexity、Claude，从平台机制、数据研究，一直写到具体操作和效果评估\n\n几个值得关注的亮点：\n\n1、纳入千万级 AI 回答研究\n\n白皮书纳入@dageno_ai提供的 1,004.6 万条 AI 回答研究，样本来自 2026 年 6 月至 9 月的 ChatGPT、Google AI Mode、AI Overviews、Gemini 和 Copilot\n\n在这组样本中，品牌官网占各平台来源链接的 38%～58%\n不同平台对官网、媒体、社区、视频和电商网站的偏好，也有明显差异，能为渠道选择和内容投入提供参照。\n\n2、有具体的落地方法\n\n围绕可抓取、可理解、可信任、可引用、可推荐这五个环节，拆解官网技术、内容组织、品牌实体和站外口碑建设\n\n同时给出 B2B / SaaS、电商、本地服务等场景的做法，以及一份 90 天实施路线，方便团队安排优先级。\n\n3、把效果评估讲清楚\n\n怎样区分品牌提及、页面引用、品牌推荐和业务转化？怎样建立固定问题库、重复采样、做对照和归因？\n\n文档里都有讨论，帮助团队判断哪些变化有证据支持，哪些还需要继续观察\n\n4、适合边学边查\n\n收录 50 个核心概念与指标、50 个常见问题，以及 Vercel、Webflow、Tally、Ahrefs 等案例，也讨论了内容授权、爬虫策略、虚假评价和平台依赖等风险。\n\n适合刚接触海外GEO的朋友建立整体认识，也适合已经在做海外 SEO、内容和增长的团队，拿来对照自己的工作\n\n联合作者\n姚金刚、乔向阳 @vista8  、任强、Tim（Dageno AI）@tim_geo_seo \n\n联合发布\n猎看科技、长安街知事、智源GEO、Dageno、京报智库", "createdAt": "Fri Nov 06 08:29:57 +0000 2026", "replyCount": 18, "retweetCount": 10, "likeCount": 82, "conversationId": "2118621898724499616", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbbBnGXcAAvaSq.jpg", "width": 2048, "height": 1047, "previewUrl": "https://pbs.twimg.com/media/HWbbBnGXcAAvaSq.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWbbHgOWgAABs-O.jpg", "width": 2048, "height": 1068, "previewUrl": "https://pbs.twimg.com/media/HWbbHgOWgAABs-O.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-11-06T08:29:57+00:00", "createdAtBeijing": "2026-11-06T16:29:57+08:00", "createdAtLocal": "11-06 16:29 北京", "url": "https://x.com/yaojingang/status/2118621898724499616", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2118621898724499616", "technicalRelevant": true, "dailyGrade": "A", "channel": "growth", "topic": "海外GEO白皮书发布与实施评估方法", "evidence": "固定问题库、重复采样、做对照和归因", "rationale": "发布具体资源并介绍实施评估方法，数据为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2118524399582371985", "track": "creative", "source": {"id": "2118524399582371985", "text": "发现一个 ComfyUI 宝藏项目！\n自带 1499 个头像、1439 种姿势、1407 套服装，全做成了可视化图库！\n\n不用到处找参考图，鼠标点哪张，当场给角色换脸、摆动作、换衣服！\n\n最爽的是三个图库直接接进同一套工作流，选好图、拨一下开关，想单换哪样就换哪样，也能三项一口气全换。\n\n项目里头有几个设计挺讲究：\n1、换脸、换姿势、换装，分三段独立跑\n三路参考图分开喂，按「换头 → 换姿势 → 换装」串起来，每段各配一个开关。\n想保住现在的脸和衣服、只改个动作，单独打开姿势开关就行，再也不用把所有要求全挤进一段提示词里赌运气。\n2、Qwen 图像编辑模型打底，精度和速度分开算\n演示配置里，挑细节的换头用 Qwen Image 2.1 BF16 保精度，换装直接上 INT8 量化版提速（单段 20 多秒就能跑完），文本编码器搭的是 Qwen3-VL 8B。\n姿势阶段还单独挂了 PoseStudio V1.1 LoRA。脸、动作、衣服各管各的，哪一步出问题直接单独调哪一步，不用整张图推倒重来。\n3、图库直接连节点，省掉来回找图、上传\n头像能按正脸、侧脸、发型筛，姿势和服装支持分类搜索。看中哪张点一下，参考图直接回传进对应节点。\n\n仓库做好了单项替换和三段全流程的 JSON，拖进画布配齐模型就能跑。\n\n我觉得它最顶的地方，是把做角色时最折磨人的重复活儿全收进了一套流程里。拿来做漫画分镜、短剧角色定妆，同一批脸、动作和衣服随时调出来反复组合。\n\n不过也有两个实测边界得注意：\n一是换装时偶尔还会有色差（把默认的 20 步往上调能改善），毕竟是局部重绘，别把独立开关当成其他细节绝对不动。\n二是代码虽然 MIT 开源，但那四千多张图来自第三方图库，有单独的授权限制，自己用没事，别连图带包拿去商用或分发。\n\n项目地址：\nhttps://t.co/5pGDSfEyt5", "createdAt": "Fri Nov 06 02:02:31 +0000 2026", "replyCount": 17, "retweetCount": 72, "likeCount": 670, "conversationId": "2118524399582371985", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWaCsn0bEAAFuUj.jpg", "width": 1615, "height": 486, "previewUrl": "https://pbs.twimg.com/media/HWaCsn0bEAAFuUj.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-06T02:02:31+00:00", "createdAtBeijing": "2026-11-06T10:02:31+08:00", "createdAtLocal": "11-06 10:02 北京", "url": "https://x.com/servasyy_ai/status/2118524399582371985", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2118524399582371985", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "ComfyUI角色分阶段编辑工作流", "evidence": "按「换头 → 换姿势 → 换装」串起来", "rationale": "提供工作流、模型配置及效果与授权边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2118773706402967960", "track": "enterprise", "source": {"id": "2118773706402967960", "text": "Ramp 数据：企业用的 AI 越来越多，花的钱 8、9 月几乎没涨，Anthropic 上市估值预期降到 1.2 万亿到 1.3 万亿美元\n\n美国企业财务软件公司 Ramp 的最新数据显示，企业消耗的 token 还在猛涨，但花在 token 上的钱从 8 月起基本停了。7 月企业 token 支出比上月涨了 42%，8 月只涨 1%，9 月只涨 0.2%。\n\n拿 Ramp 的周度数据算，从 8 月初到 10 月中，企业用掉的 token 多了约 65%，花的钱只多了 1.5%。\n\n这组数据由 Ramp 首席经济学家 Ara Kharazian 发布，TechCrunch 11 月 6 日做了报道。这时 Anthropic 正在准备 IPO，而投资者给它的高估值，前提是 AI 收入继续高速增长。\n\n【对用 AI 的公司和个人：同样的活，花得更少了】\n\n钱没涨，主要因为 AI 变便宜了。9 月 OpenAI 发布 GPT-6 Sol 和 Luna，API 价格直接砍半：Sol 从每百万输入 token 4 美元降到 2 美元。Anthropic 同月发 Fable 5.1 和 Opus 5.5，招股书说 Fable 5.1 让常见任务成本降了约 25%，Opus 5.5 每个任务的成本比 Opus 5 降了约 40%，一部分靠降价，一部分靠模型更省 token。\n\nRamp 统计的 OpenAI 和 Anthropic 综合单价，9 月下旬到 10 月下旬一个月就从每百万 token 0.76 美元降到 0.56 美元，降了 27%。\n\n企业自己也学会了省钱。Kharazian 说，AI 用得越熟的公司，越会给员工设预算，默认不让长任务跑最贵的模型，再用路由工具把活分给更便宜的小模型。\n\n还有更便宜的选择冒出来。TechCrunch 提到一个叫 Jev 的模型，来自前 OpenAI 研究员 Almeida 创办的 TypeSafe AI。它不生成文字，只在开发者事先设定好的几个答案里选一个，并给出把握有多大，适合“是不是垃圾邮件”“这条命令危不危险”这类判断题。它的输出 token 免费，输入按十亿 token 计价。Vercel 的数据显示，Jev 上线两周，它的 AI 网关上就有 35% 的付费团队在用。Kharazian 说：“很多 AI 用途只需要一个简单的是或否。”\n\n再加上 Meta、英伟达和一批中美开源模型在抢企业客户，Kharazian 认为现在是买方市场。他从企业那里听说，OpenAI 和 Anthropic 推的企业长约基本没有逼客户多花钱，签了还能拿到折扣。\n\n【花钱最多的那 1% 公司，开始不往上加了】\n\nRamp 此前发现，企业花在 OpenAI 和 Anthropic 上的钱，80% 来自最舍得花钱的 1% 公司。这批公司 7 月人均每月花 9873 美元，8 月掉到 8568 美元，9 月回升到 9568 美元，仍比 7 月低 3%。\n\n普通公司离这个数差得很远：排前 10% 的公司人均每月 813 美元，中位数公司只有 15.7 美元。Kharazian 说，软件、金融行业对 AI 编程有大量需求，但诊所、汽车经销店未必需要每人每月花上万美元。\n\n10 月有回暖：截至 10 月 23 日那一周，token 支出比一个月前同一周涨了 8.9%，token 用量涨了 37%。Kharazian 仍认为增速放缓的压力很大。\n\n【对 Anthropic IPO 意味着什么】\n\n在 Ramp 截至 10 月 23 日那一周的数据里，Anthropic 拿走了企业 token 支出的 60.5%，价格战首先打在它身上。\n\nAnthropic 11 月 2 日更新的招股书里，三季度收入 169.6 亿美元，比二季度的 115.6 亿涨了 47%，增长仍然很快。招股书同时写明，这个季度用量增长带来的收入，被新模型降价和合同折扣抵掉了约 6 亿美元。\n\n投资者的估值预期一路下调。据彭博社 11 月 6 日报道，10 月初投资者讨论的估值高达 2 万亿美元，10 月中投资者说明会后降到 1.4 万亿到 1.5 万亿，周四纳斯达克 100 指数单日暴跌 6.4% 后，部分潜在投资者在谈的是 1.2 万亿到 1.3 万亿。消息人士说还没有最终决定，Anthropic 不予置评。\n\n借钱的成本也可能变高。据《金融时报》10 月 30 日报道，黑石作为 Anthropic 一笔芯片融资的基石投资者，告诉参与这笔交易的投资者它预计 Anthropic 上市后的信用评级是 BB 级，属于“垃圾级”里最高的一档，而黑石之前的说法是 2027 年前能拿到投资级。这只是黑石的预测，评级机构还没出结果。\n\nOpenAI 也在降预期。《金融时报》10 月 31 日报道，OpenAI 这轮融资目标从 300 亿美元降到约 200 亿，投前估值从 1.4 万亿降到 1.25 万亿。\n\n【这份数据代表谁】\n\nRamp AI 指数覆盖 8.5 万多家用 Ramp 公司卡和付款系统的美国企业。token 用量和支出这组数据，只来自其中接入了 Ramp token 支出管理工具的公司，Ramp 自己说这批公司比整体样本更偏科技。Kharazian 对 TechCrunch 说，AI 支出几乎全部来自风投支持的高增长科技公司，它们一起放缓，就会一起拖累 AI 公司的收入。\n\n员工自己掏钱的个人账号、不用 Ramp 的公司，都不在统计里。\n\nNotion 联合创始人 Akshay Kothari 10 月 22 日发过 Notion 自己的数据，每周 token 用量一路往上，每百万 token 成本一路往下，配的话是“tokens go brrr. costs go ahhh”。\n\n投资者押注的是下一个像 AI 编程那样能大把花钱的新用途。OpenAI 的 Dots、xAI 的 Grok Bot、Meta 的 Muse 都是这个方向的个人 AI 助理。Kharazian 认为个人助理的经济产出不如编程，撑不起持续的高速增长。\n\n原文：https://t.co/EVy2TiQKyW\nRamp 报告：https://t.co/UBGsAl7VUd", "createdAt": "Fri Nov 06 18:33:11 +0000 2026", "replyCount": 15, "retweetCount": 1, "likeCount": 17, "conversationId": "2118773706402967960", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2118734927298482621", "text": "AI usage keeps climbing, but spending has stalled. Price cuts and smarter cost controls among the biggest spenders could challenge investor assumptions about AI hypergrowth.\nhttps://t.co/unPWCeaKGW", "createdAt": "Fri Nov 06 15:59:05 +0000 2026", "replyCount": 38, "retweetCount": 11, "likeCount": 53, "conversationId": "2118734927298482621", "author": {"username": "TechCrunch", "name": "TechCrunch", "profileImageUrl": "https://pbs.twimg.com/profile_images/1096066608034918401/m8wnTWsX_normal.png"}, "authorId": "816653", "translationZh": "AI 使用量持续攀升，支出却停滞不前。降价以及支出最高的一批用户更精细的成本控制，可能挑战投资者对 AI 超高速增长的预期。\nhttps://t.co/unPWCeaKGW"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdlbsdWQAAFei6.jpg", "width": 1120, "height": 1664, "previewUrl": "https://pbs.twimg.com/media/HWdlbsdWQAAFei6.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWdlbshWUAAB19v.jpg", "width": 1120, "height": 1444, "previewUrl": "https://pbs.twimg.com/media/HWdlbshWUAAB19v.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWdlbseXcAA4_VE.jpg", "width": 1120, "height": 1654, "previewUrl": "https://pbs.twimg.com/media/HWdlbseXcAA4_VE.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWdlbsmWMAAFBsy.jpg", "width": 1120, "height": 1192, "previewUrl": "https://pbs.twimg.com/media/HWdlbsmWMAAFBsy.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-06T18:33:11+00:00", "createdAtBeijing": "2026-11-07T02:33:11+08:00", "createdAtLocal": "11-07 02:33 北京", "url": "https://x.com/dotey/status/2118773706402967960", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2118773706402967960", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "企业 AI 用量、成本控制与支出变化", "evidence": "默认不让长任务跑最贵的模型", "rationale": "包含支出数据、预算与模型路由方法，并交代样本局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2118517228027187619", "track": "research", "source": {"id": "2118517228027187619", "text": "达利奥联创的回应 https://t.co/HS8v3Kw7Wl", "createdAt": "Fri Nov 06 01:34:01 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2118504881258639558", "inReplyToStatusId": "2118504881258639558", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2118422266669371519", "text": "I'm Sam, one of Anthropic's co-founders, and I lead much of our safety work. I'm going to have more to share on that work over the coming months.\n\nI thought I'd start by sharing a few thoughts on the latest report from @METR_Evals.\n\nThe speed of progress in model capabilities is one of the most important questions in AI safety, and METR’s work here provides the public with an independent, external view into how this is happening inside Anthropic. I’ll talk more about some of the details below, but first some context for those new to this work.\n\nHow quickly AI progress is accelerating has many important safety implications, since it determines how quickly the risks from advanced models increase. But, because most research happens within the frontier labs, it’s difficult for external observers and policy makers to get a strong sense of what that rate is. We kicked off the process with METR that led to this report earlier in the year, in anticipation of progress continuing to accelerate.\n\nFor this report, we gave METR access to a range of sensitive internal data, including benchmark scores for unreleased models, estimates of how models are progressing, and interviews with our researchers. They had complete independence to form their own conclusions.\n\nMany of their conclusions match my own. AI is speeding up our research, but it’s hard to say exactly how much. While they conclude AI can't yet make the most important contributions to model training on its own, they think the pace of development could, by default, accelerate further.\n\nThis work began well before and is separate from the embedded third-party evaluators that are part of our commitment to pacing the frontier, but it’s a good illustration of why we think evaluators are a good idea. The more access reviewers have, the clearer a picture they can form of the situation and the better-positioned they are to highlight situations like this one.\n\nWe redacted a lot, and I accept that this makes it harder for others to check METR’s work. But we determined that sharing exactly what is driving the speedup isn’t the right thing to do, both because it’s commercially sensitive and because it risks handing out a roadmap for others to go faster. That would make the risks METR is worried about worse. That’s a tradeoff. I think we made the right call, though we’re continuing to assess the pros and cons here.\n\nIn the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.", "createdAt": "Thu Nov 05 19:16:41 +0000 2026", "replyCount": 245, "retweetCount": 311, "likeCount": 3634, "conversationId": "2118422266669371519", "author": {"username": "Sam_McCandlish", "name": "Sam McCandlish", "profileImageUrl": "https://pbs.twimg.com/profile_images/2118416035359641600/XUNoqiP-_normal.jpg"}, "authorId": "2118413905093607424", "translationZh": "我是 Sam，Anthropic 的联合创始人之一，负责我们大部分安全工作。未来几个月，我会分享更多这方面的进展。\n\n我想先谈谈对 @METR_Evals 最新报告的一些看法。\n\n模型能力的进步速度是 AI 安全领域最重要的问题之一。METR 的这项工作为公众提供了独立的外部视角，帮助大家了解 Anthropic 内部的进展。下面我会进一步讨论一些细节，但先为不熟悉这项工作的读者介绍一些背景。\n\nAI 进步正在以多快的速度加速，对安全有诸多重要影响，因为它决定了先进模型带来的风险增长得有多快。但由于大部分研究都在前沿实验室内部进行，外部观察者和政策制定者很难准确把握这一速度。考虑到进步可能持续加速，我们在今年早些时候启动了与 METR 的合作，最终形成了这份报告。\n\n为撰写这份报告，我们向 METR 开放了一系列敏感内部数据，包括未发布模型的基准测试分数、对模型进步情况的估计，以及对研究人员的访谈。他们完全独立地得出了自己的结论。\n\n他们的许多结论与我的看法一致。AI 正在加快我们的研究，但究竟加快了多少，很难准确判断。他们认为，AI 目前还无法独立完成对模型训练最重要的贡献，但如果不加干预，开发速度可能会进一步加快。\n\n这项工作启动得早得多，也独立于我们“为前沿进展把握节奏”承诺中引入的驻场第三方评估机制，但它很好地说明了我们为何支持引入评估机构。评估人员能接触的信息越多，就越能看清实际情况，也越有能力指出这类问题。\n\n我们删去了大量内容，我承认这让其他人更难核查 METR 的工作。但我们认为，不宜公开究竟是什么在推动提速：这些信息既涉及商业机密，也可能为其他人提供加速路线图，从而加剧 METR 所担忧的风险。这是一种权衡。我认为我们做出了正确的决定，但仍在持续评估其中的利弊。\n\n未来几周，我们计划发布一份报告，分享我们对 Anthropic 内部 AI 进步速度的分析，包括我们对照 Responsible Scaling Policy 的当前情况，以及在 AI 持续快速进步的背景下，为加强安全与安保实践而采取的新措施。"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-06T01:34:01+00:00", "createdAtBeijing": "2026-11-06T09:34:01+08:00", "createdAtLocal": "11-06 09:34 北京", "url": "https://x.com/MinLiBuilds/status/2118517228027187619", "themeId": "editorial", "signalScore": 46, "editorial": {"id": "2118517228027187619", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "Anthropic对METR研发加速评估的回应", "evidence": "We redacted a lot", "rationale": "自述评估数据开放范围、删减理由与结论局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2118782708767965238", "track": "research", "source": {"id": "2118782708767965238", "text": "A new way to measure how AI agents handle the routine analyses of wet-lab science—BioBasicsBench.\n\nDeveloped with Ligo, a biotech company focused on enzyme design, the benchmark draws on 100 tasks from real experiments to test whether agents can interpret raw lab data, identify errors, and recognize when the evidence doesn’t support a conclusion.\n\nAccelerating biological research starts with getting the everyday work right. BioBasicsBench shows where models need to improve, and helps us track what those gains mean for scientific progress, biosafety, and biosecurity.\n\nhttps://t.co/wN2xLk0YeW", "createdAt": "Fri Nov 06 19:08:57 +0000 2026", "replyCount": 535, "retweetCount": 147, "likeCount": 2188, "conversationId": "2118782708767965238", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdtpRua4AAuNL-.jpg", "width": 1199, "height": 890, "previewUrl": "https://pbs.twimg.com/media/HWdtpRua4AAuNL-.jpg:small"}], "expert": {"priority": "P0", "domain": "基础模型突破", "name": "OpenAI", "role": "基础模型机构", "why": "五方向 X 主动热点搜索：基础模型突破", "handle": "OpenAI"}, "createdAtIso": "2026-11-06T19:08:57+00:00", "createdAtBeijing": "2026-11-07T03:08:57+08:00", "createdAtLocal": "11-07 03:08 北京", "url": "https://x.com/OpenAI/status/2118782708767965238", "themeId": "editorial", "signalScore": 90, "hotspotMatches": [{"id": "foundation_models", "label": "基础模型突破", "matchedTerms": ["benchmark"]}], "hotspotDirections": ["foundation_models"], "hotspotDirection": "foundation_models", "hotspotDirectionLabel": "基础模型突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2118782708767965238", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "湿实验数据分析基准 BioBasicsBench", "evidence": "100 tasks from real experiments", "rationale": "发布百项真实实验任务基准，评估分析与证据判断"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "BioBasicsBench：衡量 AI 智能体如何处理湿实验日常分析工作的新方法。\n\n这项基准测试由我们与专注于酶设计的生物技术公司 Ligo 共同开发，包含来自真实实验的 100 项任务，用于测试智能体能否解读原始实验数据、识别错误，以及判断证据何时不足以支持结论。\n\n加速生物学研究，要从做好日常工作开始。BioBasicsBench 揭示了模型需要改进的方面，也帮助我们追踪这些提升对科学进步、生物安全和生物安保意味着什么。\n\nhttps://t.co/wN2xLk0YeW"}, "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, {"id": "2118753162052121076", "track": "creative", "source": {"id": "2118753162052121076", "text": "@Master11959 @ManusChina 应该已经能用了\nhttps://t.co/pWIVGDzGtu", "createdAt": "Fri Nov 06 17:11:33 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 1, "conversationId": "2118569598379229219", "inReplyToStatusId": "2118751430693761188", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2118127825186177270", "text": "OpenAI 推出 Images 2.6：能导出 SVG 矢量图，还能做 GIF 动图，出图快一半\n\nOpenAI 11 月 4 日发布图像模型 Images 2.6，ChatGPT 和 Codex 所有档位的用户今天起都能用，电脑、手机和网页版都有。\n\n这次一个重要变化是能把生成的图导出成 SVG 矢量图，可以直接拿去做网站、App 和印刷品。另外还能生成 GIF 动图，出图速度比上一版快 50%，改图时能更准确地只改指定的地方。\n\n开发者可以通过 API 调用这个模型。API 是开发者把模型接进自己产品的接口，按用量付费。OpenAI 说，现在全球用户每周在 ChatGPT、Codex 和 API 上生成 40 亿张图，平均每天超过 5 亿张。\n\n【导出 SVG：图能直接拿去用了】\n\nAI 生成的图通常是“位图”，比如常见的 PNG、JPG。位图由一个个小色点拼成，放大后会变糊，边缘出现锯齿。想把 AI 画的图标、Logo 用到正式场合，通常要设计师照着重新画成矢量图。\n\nSVG 是“矢量图”，记录的不是色点，而是线条和形状本身，比如“从这里到那里画一条曲线，填上蓝色”。所以它放大多少倍都清晰，小到 App 图标、大到户外海报都能用同一个文件；在设计软件里还能单独改某根线条的颜色和粗细，不用整张重画。网站上的图标、Logo，大多就是 SVG。\n\nOpenAI 在公告里说，导出 SVG 让设计“可以直接用在网站、App 和印刷品上”。这一项写在给开发者的新功能里，公告没说 ChatGPT 里能不能直接导出 SVG。\n\n【GIF 动图】\n\nGIF 是一种会循环播放的短动图，社交媒体上的表情包大多是这种格式。用户可以用一句话描述，或上传一张照片、一张手绘草图，让模型做成动图。\n\nOpenAI 举的例子有：让品牌吉祥物动起来，把商品图做成循环小动画，拍视频前先用动图试一试角色动作。\n\n合作方 OpenArt 公开的示例提示词是这样做的：先让模型在一张图里按 3 列 2 行画出 6 帧连续画面，再按顺序播放成动图。\n\n这种把多帧画面拼在一张图里的做法叫“精灵图”，游戏动画常用。据 Decrypt 转述 The Verge 的报道，ChatGPT 的 GIF 功能是分批开放的，做好后可以调播放速度、逐帧查看和修改。\n\n【两个 API 版本】\n\nAPI 里有两个版本可选：\n\n1. Flare 偏速度。画质设为低时，最快约 6 秒出一张图。海报、商品图这类需要排版的图，效果也有改进。\n\n2. Sunburst 偏画质。画质设为中或高时细节更多，连续改好几轮，人物和商品的样子也更不容易走样。\n\n这些速度和画质的说法都来自 OpenAI，目前还没有第三方测试结果。\n\n【给开发者的其他新功能】\n\n除了导出 SVG，还有两项：\n\n1. 图片标注：ChatGPT 里已有的功能加进了 API。在图上圈出要改的位置，模型只改那一块。\n2. 复杂度参数：控制模型动笔前花多少功夫安排画面。画质参数管细节清不清楚，复杂度管画面里能安排多少东西。OpenAI 建议简单修改用低复杂度，元素多、要求多的画面用中或高。\n\n设计工具 Figma Weave、图片编辑应用 Picsart 等已经提前接入。\n\n【价格】\n\nChatGPT 和 Codex 的所有订阅档位都能用 Images 2.6，公告没提要额外付费。\n\nOpenAI 定价页显示，2.6 的 Flare 和 Sunburst 两款同价：生成图片每 100 万 token 30 美元，输入参考图每 100 万 token 8 美元，输入文字每 100 万 token 5 美元。这和上一代 2.5 的价格一样。\n\nFlare 速度更快，但按 token 算的单价和 Sunburst 相同。定价页的批量处理价目表（不急着要结果的任务，价格减半）里暂时没有 2.6。\n\n谷歌 10 月推出的同类模型 Nano Banana 2.1，生成图片也是每 100 万 token 30 美元，按谷歌定价页的换算，一张 1K 分辨率的图约 0.034 美元。\n\n原文链接：https://t.co/iBqbdnWx79\n来源链接：\nOpenAI API 定价页 https://t.co/wpz8hhXu09\n谷歌 Gemini API 定价页 https://t.co/BvraIw11le\nDecrypt 报道 https://t.co/tHINnG0bP7", "createdAt": "Wed Nov 04 23:46:41 +0000 2026", "replyCount": 184, "retweetCount": 36, "likeCount": 360, "conversationId": "2118127825186177270", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118127644914913280/img/-Xz2h3tOtD1XUOgD.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118127644914913280/img/-Xz2h3tOtD1XUOgD.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118127644914913280/vid/avc1/1920x1080/2duG4kc5Vp9Lj-Qq.mp4?tag=29", "durationMs": 87000}]}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-06T17:11:33+00:00", "createdAtBeijing": "2026-11-07T01:11:33+08:00", "createdAtLocal": "11-07 01:11 北京", "url": "https://x.com/dotey/status/2118753162052121076", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2118753162052121076", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Images 2.6 图像能力发布报道", "evidence": "先让模型在一张图里按 3 列 2 行画出 6 帧连续画面", "rationale": "引用含具体发布能力、动画方法与定价，尚未核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "@Master11959 @ManusChina 应该已经能用了\nhttps://t.co/pWIVGDzGtu"}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2118749477108699565", "track": "agent", "source": {"id": "2118749477108699565", "text": "I’ve been really enjoying Vishal’s latest posts on UI to understand long docs. When we came up with DocETL rewrite directives (ie ways to automatically rewrite LLM pipelines to improve accuracy), we had LLMs/agents in mind. But they are very clearly useful for humans as well!", "createdAt": "Fri Nov 06 16:56:54 +0000 2026", "replyCount": 5, "retweetCount": 4, "likeCount": 40, "conversationId": "2118749477108699565", "author": {"username": "sh_reya", "name": "Shreya Shankar", "profileImageUrl": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, "authorId": "2286218053", "quotedTweet": {"id": "2118713011875537380", "text": "I built a tool to help me understand Anthropic's 421-page Form S-1. Click a section of the filing, and a panel at the top shows a short summary (TLDR) of it.\n\nFor the \"Electrical Power and Fuel Constraints\" section, that TLDR was one sentence: \n\n> \"Power shortages, utility and regulatory hurdles, natural gas price exposure without cost caps, and local opposition could raise Anthropic's costs and limit data center growth.\"\n\nThen I went to the actual filing, and that section has six paragraphs. I did not believe one sentence was a sufficient summary of six paragraphs. Especially for investors assessing risk/reward.\n\nSo I told Claude Opus: create a one-sentence TLDR for each paragraph, then combine them, deduplicating if needed, into one paragraph for the section's TLDR.\n\nThe way I thought of this is because of the @sh_reya et al DocETL paper. DocETL is the engine behind DocWrangler, and it has a suite of operators an LLM can perform on documents: map, parallel map, reduce, filter, resolve, equijoin, unnest, split, gather. \"Map,\" for example, uses an LLM to run the same transformation on every document.\n\nSo this is a map operation across six paragraphs, where the operation is \"summarize the paragraph into a sentence.\" Then a dedupe across those six sentences, since some of them say the same thing.\n\nNow the TLDR for that section is a paragraph that combines all six, starting with: \"Anthropic's data centers need more electricity than the grid can add quickly, pushing prices up; Anthropic has publicly promised to cover increases it causes for consumers.\"\n\nTry it yourself: https://t.co/BXj6iR4tRK", "createdAt": "Fri Nov 06 14:32:00 +0000 2026", "replyCount": 2, "retweetCount": 2, "likeCount": 18, "conversationId": "2118713011875537380", "author": {"username": "vishal_learner", "name": "Vishal Bakshi", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099397101402963968/JANkpB_8_normal.png"}, "authorId": "1694453866786336768", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117066923540422656/img/gcwK5JDxk0qMazgd.jpg", "width": 1080, "height": 1350, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117066923540422656/img/gcwK5JDxk0qMazgd.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117066923540422656/vid/avc1/1080x1350/1iiAIPaZIJJp6Kth.mp4?tag=29", "durationMs": 143566}], "translationZh": "我做了一个工具，帮助自己读懂 Anthropic 长达 421 页的 S-1 注册申报文件。点击文件中的任一章节，顶部面板就会显示该章节的简短摘要（TLDR）。\n\n“电力与燃料限制”一节的 TLDR 只有一句话：\n\n> “电力短缺、公用事业和监管方面的障碍、缺乏成本上限保护的天然气价格风险，以及当地居民的反对，可能推高 Anthropic 的成本，并限制数据中心扩张。”\n\n随后我查看了原始文件，发现这一节有六段。我不认为一句话足以概括六段内容，尤其是对评估风险与回报的投资者而言。\n\n于是我告诉 Claude Opus：为每一段生成一句话的 TLDR，再将它们合并成一个段落，必要时去重，作为整个章节的 TLDR。\n\n这个思路来自 @sh_reya 等人的 DocETL 论文。DocETL 是 DocWrangler 背后的引擎，提供了一系列可由 LLM 对文档执行的算子：map、parallel map、reduce、filter、resolve、equijoin、unnest、split、gather。例如，map 会使用 LLM 对每份文档执行相同的转换。\n\n因此，这相当于对六个段落执行 map 操作，具体操作是“将该段概括为一句话”。然后对这六句话去重，因为其中一些表达了相同的意思。\n\n现在，该章节的 TLDR 是一个融合了全部六段内容的段落，开头是：“Anthropic 数据中心的用电需求增长快于电网扩容速度，推高了电价；Anthropic 已公开承诺承担其导致的消费者电费上涨部分。”\n\n亲自试试：https://t.co/BXj6iR4tRK"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Shreya Shankar", "role": "UC Berkeley / AI 工程研究员", "why": "评测、LLM Pipeline、AI 工程学科化", "handle": "sh_reya"}, "createdAtIso": "2026-11-06T16:56:54+00:00", "createdAtBeijing": "2026-11-07T00:56:54+08:00", "createdAtLocal": "11-07 00:56 北京", "url": "https://x.com/sh_reya/status/2118749477108699565", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2118749477108699565", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "用逐段摘要与去重改善长文档摘要", "evidence": "create a one-sentence TLDR", "rationale": "提供逐段映射再合并去重的方法及实例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "最近很喜欢 Vishal 关于借助 UI 理解长文档的系列文章。我们提出 DocETL 重写指令（即自动重写 LLM 流水线以提高准确率的方法）时，考虑的是让 LLM 和智能体使用。但很明显，这些方法对人也很有用！"}, "avatar": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, {"id": "2118593725039317193", "track": "agent", "source": {"id": "2118593725039317193", "text": "很多人第一次看到 AI 操作电脑，会觉得它像一个坐在屏幕前的人：先截图，判断按钮在哪，再移动鼠标、点击、输入，接着截图看结果。\n\n这条路线直观，却也带来一个问题：既然操作系统已经知道一个控件是按钮、输入框还是复选框，AI 为什么一定要从像素里重新猜一遍？\n\nVercel Labs 的 agent-desktop，走的就是另一条路线。\n\n让 AI 操作电脑，可以直接读取系统提供的“无障碍树”，拿到按钮、输入框、复选框的名称和状态，再通过对应引用去操作。相当于给 AI 一份能读懂的界面结构，减少靠截图猜位置的步骤。\n\n它本身不带大模型，可以通过命令行、MCP 或 Skill 接入已有的 Agent，给它补上桌面操作能力。\n\n安装用 \nnpm install -g agent-desktop\n\n再按系统配置权限。比较适合从修改软件设置、处理文件选择框、填写可访问输入框这类小任务开始，目前 macOS、Windows、Linux 都有支持，但具体能力有差异。\n\n它对“操作结果”的处理：点击发出去了，不代表事情就办成了，还要重新读取界面确认。\n\n比如官方计算器示例，点完 7，还要检查显示框是否真的变成了 7。\n\n遇到超时也不能一股脑重试，否则可能重复提交。这种设计，对真正要干活的 Agent 很重要。", "createdAt": "Fri Nov 06 06:38:00 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 2, "conversationId": "2118593725039317193", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118545126717091840/img/FiOJiqXQOJDXfXn-.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118545126717091840/img/FiOJiqXQOJDXfXn-.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118545126717091840/vid/avc1/1080x1920/i9jDnpncfOyWDVQY.mp4?tag=29", "durationMs": 73884}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-06T06:38:00+00:00", "createdAtBeijing": "2026-11-06T14:38:00+08:00", "createdAtLocal": "11-06 14:38 北京", "url": "https://x.com/sitinme/status/2118593725039317193", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2118593725039317193", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "agent-desktop桌面操作与结果验证", "evidence": "点击发出去了，不代表事情就办成了", "rationale": "介绍安装接入、无障碍树及防重复操作方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118720118012461068", "track": "agent", "source": {"id": "2118720118012461068", "text": "果然大家的痛点都是一样的，都想躺着把活干了~\n\n前两天发的大肥鱼（DSH）那 7 个野生插件，没想到收藏点赞最多的是那个\"手机远程盯 Agent\"，\n\n很多人的痛点都是：平时要在Claude Code、Codex或者DSH之间切换，但人经常在外面又不想带电脑，就像知道能用手机一起处理的方案？\n\n你别说真给我挖到一个宝藏开源项目，仓库地址和 4 个最实用的用法直接整理在下面，建议先收藏：\n\n平时人离开工位想盯AI做任务，基本就三类，但都有点麻烦：\n- 开传统远程桌面：在手机小屏上两根手指放大缩小搓终端，点个按钮眼都快看瞎了；\n- 挂飞书/TG 机器人：只能纯聊天，看不到项目文件树，改了哪行代码心里没底；\n- 装单一 Agent 野生手机端：只能管某一个工具，手头同时开着 Claude Code、Codex 和 DSH 还得来回切 App。\n\n今天看到有人直接开源了一个统一工作台项目 Agents Anywhere（就是之前做 DSH Desktop 的团队出的）。翻完它刚更新的 2.1 仓库和文档，我觉得最值得配起来的有这 4 个点：\n1. 一个入口同时管所有电脑上的 Claude Code + Codex + DSH\n不管你是 Mac 上跑着 Codex、公司开发机挂着 Claude Code，还是家里电脑养着大肥鱼，只要在电脑上装个桌面端（无图形界面的 Linux 服务器也有 Connector CLI），手机上就能按「设备 → 项目 → 会话」随便切，不用一个工具装一套轮子。\n\n2. 直接接管电脑上已打开的 Codex 原窗口审批（2.1 最实用更新）\n以前很多远程工具只能“新建一条会话”，接不上电脑里正在跑的活。\n比如你出门前让 Mac 上的 Codex 修个 Bug，刚下楼它准备跑测试，弹出个命令审批卡住了。2.1 版本支持直接跟随电脑上已打开的 Codex 桌面端或 VS Code 会话——手机打开就是原来那条任务，看清命令点个「允许」，审批直接交回原窗口接着跑，上下文完全不断。\n\n3. Swift / Kotlin 原生移动端 + 自带文件树与远程终端\n它不是在手机里套个网页或者让你搓远程桌面，iOS 和安卓端都是用 Swift 和 Kotlin 原生写的，Web、Mac、Win、iPad 全端通吃。在手机上除了给 Agent 发指令，还能直接翻工作区文件树、开远程终端看日志。\n\n4. MIT 协议开源 + 支持 Docker 自托管\n目前官方线上服务直接免费用（据发布帖披露内测已有 4.8 万+ 用户）。如果你平时写的是公司内部项目，担心消息、代码片段和附件经过第三方服务端，仓库里直接给了 Docker 方案，可以把服务部署到自己的机器上，数据完全留在自己手里。\n\n最后提醒两个实操避坑细节：\n一是 Agent 本身依然跑在你自己的工作电脑上，出门前记得把电脑休眠关了、让 Connector 保持在线；二是目前「原窗口无缝接管审批」在 2.1 里主要打通了 Codex 桌面端和 IDE 会话，不同 Agent 的接管深度会有差异。\n\n手里同时开着好几个 Agent 的兄弟，回电脑花几分钟就能接上：\n\n官网与全平台下载：https://t.co/BEgTUO7K9m\nGitHub 开源仓库（MIT）：https://t.co/7KmVjDtgpD", "createdAt": "Fri Nov 06 15:00:14 +0000 2026", "replyCount": 11, "retweetCount": 0, "likeCount": 24, "conversationId": "2118720118012461068", "author": {"username": "cnyzgkc", "name": "木马人", "profileImageUrl": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, "authorId": "1866821173755121666", "quotedTweet": {"id": "2118640057963749873", "text": "Agents Anywhere 今天正式发布。\n\n一个工作台，管理所有设备上的 Agent，支持 Claude Code、Codex、DSH 等多种 Agent。\n\nWeb、Win、Mac、iPhone、iPad、安卓全平台适配，\n在任何一端都能给任何一台电脑上的 Agent 发任务。\n\n极致的 UI 体验：对标 Codex ；移动端使用 Swift 和 Kotlin 原生开发。\n\n开源免费。目前线上服务免费使用，内测已有 4.8 万+ 用户。\n\n支持自部署，数据安全可控。\n\n下载地址：https://t.co/anxCm2A7wA", "createdAt": "Fri Nov 06 09:42:06 +0000 2026", "replyCount": 14, "retweetCount": 18, "likeCount": 165, "conversationId": "2118640057963749873", "author": {"username": "WangBenson6541", "name": "Benson Wang", "profileImageUrl": "https://pbs.twimg.com/profile_images/2046153330179866624/ITw0NVto_normal.jpg"}, "authorId": "2046153169109999616", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbrwKQaUAA1DpX.jpg", "width": 1702, "height": 1248, "previewUrl": "https://pbs.twimg.com/media/HWbrwKQaUAA1DpX.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWbr0Y1bMAAn6As.jpg", "width": 1890, "height": 969, "previewUrl": "https://pbs.twimg.com/media/HWbr0Y1bMAAn6As.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWbr23rbcAAz1jj.jpg", "width": 1493, "height": 977, "previewUrl": "https://pbs.twimg.com/media/HWbr23rbcAAz1jj.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWbr5gkbYAINCp9.jpg", "width": 1702, "height": 1248, "previewUrl": "https://pbs.twimg.com/media/HWbr5gkbYAINCp9.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWc0sg7bQAABdX8.jpg", "width": 2048, "height": 1144, "previewUrl": "https://pbs.twimg.com/media/HWc0sg7bQAABdX8.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "木马人", "role": "内容、视觉与多模态实践与观察", "why": "展示用 Python 自动渲染科普短片并解释制作方式，提供创作增量。", "handle": "cnyzgkc"}, "createdAtIso": "2026-11-06T15:00:14+00:00", "createdAtBeijing": "2026-11-06T23:00:14+08:00", "createdAtLocal": "11-06 23:00 北京", "url": "https://x.com/cnyzgkc/status/2118720118012461068", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2118720118012461068", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agents Anywhere 远程接管与部署实践", "evidence": "出门前记得把电脑休眠关了、让 Connector 保持在线", "rationale": "详述原会话审批、自托管及运行限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, {"id": "2118693633834569879", "track": "creative", "source": {"id": "2118693633834569879", "text": "AI 会写页面之后，谁来帮它把“AI 味”改掉？\n\n用 AI 写前端，最常见的问题可能已经不是“做不出来”，而是“做出来都差不多”。\n\n紫蓝渐变、发光按钮、半透明卡片，标题前放一个 emoji，再配上“释放潜能”“重新定义效率”。\n\n单看每个元素都没犯什么大错，放在一起却像某种默认皮肤：换个产品名字，页面照样成立。\n\n这里又有一个去AI味的开源项目：unslop\n\n它是给 Claude Code、Codex 用的设计 Skill。你让它检查页面，它会先指出问题，再结合产品用途确定设计方向，接着按间距、颜色、图标、文案、字体、布局、细节、视觉素材和动效这九个步骤修改。\n\n它会先判断该改多少：页面本来就不错，就只做小修；已有品牌和设计系统，也应该优先保留。\n\n它的思路也不只是“删掉紫色，全部变成黑白灰”，而是让导航、边框这些辅助元素安静下来，把视觉重点留给真正有意义的产品内容，比如一张清楚的图表、一个真实的功能预览。\n\n支持根据线上链接制作本地改版稿，以及把改造过程做成短视频。\n\n不过，给它网址并不等于能直接修改原网站，最后还是需要接回正式项目。\n\n当然，它本质上是一套设计方法和提示规则，效果仍然取决于模型能力和你提供的信息，不能保证跑一次就达到专业设计水平。\n\n它的审美也比较克制，工具后台可能很合适，强调热闹氛围的活动页就未必。", "createdAt": "Fri Nov 06 13:15:00 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 2, "conversationId": "2118693633834569879", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2116706539927212085", "text": "装了 frontend-design，Claude 写的页面还是一眼 AI？这个 Skill 把 62 种 AI 味写成了规则\n\n5 月份写过 Anthropic 官方那个 frontend-design Skill，它把 Inter 字体、紫色渐变、三栏卡片拉进黑名单，装上之后，Claude 做的落地页确实没那么像模板了。\n\n可模型躲开一个套路，往往会换上新的。impeccable 的检测规则里，奶油色背景、斜体衬线大标题、大标题上方那行字母间距拉开的小标签，各自单独占了一条。\n\nimpeccable 就是从 frontend-design 出发做的，作者 Paul Bakaus 把这些新旧套路逐条写成规则，一共 62 条，再配上 24 个设计命令，Claude Code、Codex、Cursor 都能装，热度很高。\n\n问题是，光在提示词里写一句别这么做，能拦住多少？它的思路是写完再查一遍，而且查的这一步不用模型。", "createdAt": "Sun Nov 01 01:39:00 +0000 2026", "replyCount": 12, "retweetCount": 0, "likeCount": 10, "conversationId": "2116706539927212085", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVsrU1iaAAAInFT.jpg", "width": 1080, "height": 459, "previewUrl": "https://pbs.twimg.com/media/HVsrU1iaAAAInFT.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWGwFaKbcAA3nxc.png", "width": 706, "height": 559, "previewUrl": "https://pbs.twimg.com/media/HWGwFaKbcAA3nxc.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWGxzaAb0AA_xJ2.jpg", "width": 1672, "height": 941, "previewUrl": "https://pbs.twimg.com/media/HWGxzaAb0AA_xJ2.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-06T13:15:00+00:00", "createdAtBeijing": "2026-11-06T21:15:00+08:00", "createdAtLocal": "11-06 21:15 北京", "url": "https://x.com/sitinme/status/2118693633834569879", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2118693633834569879", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "unslop 页面设计改造方法", "evidence": "按间距、颜色、图标、文案、字体", "rationale": "介绍具体设计步骤、适用范围与局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118716003068559708", "track": "enterprise", "source": {"id": "2118716003068559708", "text": "是这样的，一点都不夸张，数据远比想象的重要。\n\n很多做垂直 AI 应用的公司还没被吃掉，部分原因就是掌握一些行业数据，他们卖数据可能都比做业务赚钱。", "createdAt": "Fri Nov 06 14:43:53 +0000 2026", "replyCount": 1, "retweetCount": 1, "likeCount": 7, "conversationId": "2118716003068559708", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2118700335753773480", "text": "大模型的数据生意：人类如何蒸馏自己\n\n-当网上现成的文本越来越难满足训练需求，模型公司开始从人类的实际工作中收集数据。 2026 年初，中国模型公司开始行动，腾讯混元负责人姚顺雨直接管理混元数据团队；阿里将服务大模型的数据团队交给集团合伙人委员会成员范禹；字节在年中将 Seed 旗下 Global Data 团队升级为 AI 数据与安全部门，与 Seed 平行，服务所有大模型团队。\n\n- 用户完成任务时留下的操作轨迹，成为模型训练最受重视的数据之一。一位互联网公司数据团队人士说，目前最迫切的需求是编程和工作两类。编程数据有两种用途：练习评测集中的题目，在排行榜上拿高分；或学习实际任务，比如开发游戏、搭建 3D 模型。据我们了解，需求最旺盛时，一些模型厂每天在编程数据上的投入可以超过 1000 万美元。\n工作数据则要还原办公过程：从文件里找资料、读懂邮件中的要求和期限，再往表格里填数字、编辑文档、查询网页和数据库、调用工具。一位数据服务商创始人说，金融和法律行业的经济价值高，大量任务在线上完成、以 Office 文件交付，是比较理想的训练环境。\n\n- 一条人工数据售价从几百元到上万元不等，一批通常至少 1000 条。海外报价的数字相近，单位则换成美元。一位 Seed 后训练团队人士说，员工为 AI 陪伴产品猫箱编写对话，用户说一句、模型回复一次算一轮。一条长数据有 100-200 轮，审核通过后报酬基本能上千元。参与者有编剧、文学创作者，也有审核和编辑人员。“有的人一个月就能拿上万元。”一位在 AI 数据平台兼职的法律行业人士说，她每月交付约 40 条数据，拿到 2 万多元，平均每条约 600 元。第一次做一条花了 75 分钟，熟悉后约半小时。\n\n- 还有一些交易不在明面上。创业公司攒下一批模型厂商账号，转卖 API 调用服务，再出售调用产生的数据。另一些公司从模型公司内部人员手里买数据，转卖给同行；经手人可能在算法、工程、基础设施或采购岗位。部分交易靠回扣维系，单笔合同数百万元乃至上千万元，内部人员从中分成。“每天就像是在捡钱。” 一位数据供应商说。\n\n- 模型公司很难全靠自己生产数据。外部供应商愿意一份数据卖多家。但大厂则普遍愿意支付 3-4 倍溢价，永久买断或限时独占。今天合格的训练数据，半年后可能只剩一成有用。等竞争对手能买到，价值已经不同了。\n\n- 大厂高价买断数据，但买家仍得知道自己要什么。蚂蚁买金融数据时，会把一个投研报告类需求拆成上百个案例、十多个子类，写清每类多少篇、案例什么样。“做蚂蚁的项目很多时候是亏钱的。” 一位服务商说，细致的要求增加了交付难度。\n\n- 在 DeepSeek，绝大多数员工从事数据相关工作。“梁文峰偶尔也会参与数据标记。” 一位 DeepSeek 人士说。姚顺雨接手混元后，重新清洗已有数据、迭代基础设施，让混元 3 Preview 明显超越前代；正式版再优化后训练数据、扩大强化学习规模，能力又有提升。\n\n- 数据工作的重要性上升，但数据生产人员的收入不一定能跟着模型能力涨。一位头部互联网公司的研究员说，公司一支团队做了 1 万条数据，训练效果很好。很多参与者月薪只有 8000-9000 元，按 18 薪算，一年不到 20 万元。同一公司的算法人员，年薪包则在 1000 万元左右。效果上去了，奖励主要给算法团队；数据做得好坏，员工到手的钱差别不大。\n\n- 最近一年，多个公司的后训练团队往往每一两个月就要发一个版本，研究员从早上 10 点半工作到深夜，休假也带着电脑。“本质上大家在技术路径、数据处理和质量上都拉不开代差，就看谁先发出来。” 一位后训练研究员说，“很多事拖个两三个月，做出来也没了意义。”\n\n- 为了加快训练，研究员开始让模型参与数据生产和研发。他们指挥模型批量收集、修改数据，再让更强的模型检查结果。OpenAI 披露，编程 Agent 已参与研究员的日常工作，包括写实验代码、跑测试和排查基础设施故障；Anthropic 也称，Claude 曾在约 2 小时内完成一项通常需要工程师两三天的故障排查和修复工作。\n\n- 研究员把各行业专家的知识、经验和判断做成数据，训练模型接手他们的工作。现在，模型要学的，也包括研究员每天正在做的事。", "createdAt": "Fri Nov 06 13:41:38 +0000 2026", "replyCount": 5, "retweetCount": 3, "likeCount": 37, "conversationId": "2118700335753773480", "author": {"username": "latepostnews", "name": "晚点 LatePost", "profileImageUrl": "https://pbs.twimg.com/profile_images/1988876346496565248/A_UR6LFZ_normal.jpg"}, "authorId": "1988875519623155712", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWciuJya8AASGPQ.jpg", "width": 1280, "height": 1023, "previewUrl": "https://pbs.twimg.com/media/HWciuJya8AASGPQ.jpg:small"}]}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-06T14:43:53+00:00", "createdAtBeijing": "2026-11-06T22:43:53+08:00", "createdAtLocal": "11-06 22:43 北京", "url": "https://x.com/Xudong07452910/status/2118716003068559708", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2118716003068559708", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "模型训练数据采购与生产实践", "evidence": "拆成上百个案例、十多个子类", "rationale": "引文详述数据报价、采购拆解和生产流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2118764731276444066", "track": "enterprise", "source": {"id": "2118764731276444066", "text": "https://t.co/TSrJWx1BHn", "createdAt": "Fri Nov 06 17:57:31 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2118246851136909731", "inReplyToStatusId": "2118401472660701475", "author": {"username": "swyx", "name": "swyx", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, "authorId": "33521530", "quotedTweet": {"id": "2118718703399481701", "text": "今天杨滢的演讲是上午讲得最好的，我在门口抓到她 合影一张😬\n\n她说美妆这个行业成本很高。中国美妆和个护一年的 GMV 就有1.1 万亿，但品牌得要把 50%–60% 的钱花在营销上。你花 100 块买护肤品，有 50 块以上是渠道和营销费。KOL 的大多是收了钱推广，不一定客观。\n\n为什么呢？品牌方说“这东西让你皮肤更好”，客户根本没法验证，只能先付钱买来试。以至于所有的交易成本，其实都是消费者提前付掉的。品牌要买广告、找 KOL、请皮肤科专家背书，用钱换信任。\n\n对产品来说也是一样。就算你产品做得再好也没用，没人知道。没有曝光就没有销量，没有销量就没有口碑，只能继续花钱买广告。\n\n所以为什么美妆有这么多中间环节，这也是最值得 AI 去解决的问题。\n\n她的PPT上写：谁能降低交易成本，谁就拿走利润。\n\n她说很多投资人建议她做 AI 测肤：拍张照，分析肤质，推荐产品。但照片受光线、环境、角度影响很大，判断其实并不准。她的比喻是，这就像连手动挡都还没开明白，就想直接上自动驾驶。\n\n美妆里大量的专业判断、配方和供应链经验、消费者的真实反馈，都还没被数字化，通用大模型根本不知道。她的演讲题目就是：AGI is Decoding. Encoding is the Moat.\n\n模型越来越会理解信息，但谁能把行业知识先编码成 AI 能用的数据和规则，谁才有护城河。\n\n另外一场制造业的分享，讲的道理类似。\n\n海普智联的朱世辉说，AI 真进了工厂才发现：设备用了几十年，接口不统一，数据取不出来；订单在 ERP，工单在 MES，批次信息还写在纸卡上；一线工人一半以上超过 40 岁，很多关键判断根本没有记录，只在老师傅脑子里。\n\n他们把 703 条业务流程全部梳理出来，用本体（Ontology）的方式入库，约三成由 AI 起草。他们的总结是：意义不在省工时，而是组织第一次能读懂自己怎么运转。\n\n他最后一句我特别喜欢！\n\n“护城河不在模型里，在那些没有 API 的地方。”\n\n美妆的专业知识、工厂老师傅的经验，这些一直存在于现实世界，从没被数字化，也不是调一个 API 就能拿到的。模型越来越难拉开差距，真正的机会可能就在这里。", "createdAt": "Fri Nov 06 14:54:37 +0000 2026", "replyCount": 11, "retweetCount": 1, "likeCount": 25, "conversationId": "2118718703399481701", "author": {"username": "Yuki27__", "name": "Yuki", "profileImageUrl": "https://pbs.twimg.com/profile_images/1887054804930981888/h1avTrMw_normal.jpg"}, "authorId": "1131212761101299713", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWczbJ-boAAKMBL.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWczbJ-boAAKMBL.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWczbIxboAAwBhi.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWczbIxboAAwBhi.jpg:small"}]}, "expert": {"priority": "P1", "domain": "Agent / 工作流", "name": "swyx", "role": "Latent Space / AI Engineer", "why": "AI 工程社区、Agent、开发工具信号源", "handle": "swyx"}, "createdAtIso": "2026-11-06T17:57:31+00:00", "createdAtBeijing": "2026-11-07T01:57:31+08:00", "createdAtLocal": "11-07 01:57 北京", "url": "https://x.com/swyx/status/2118764731276444066", "themeId": "editorial", "signalScore": 50, "editorial": {"id": "2118764731276444066", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "行业知识编码与业务流程数字化", "evidence": "他们把 703 条业务流程全部梳理出来", "rationale": "转述本体入库实践及数据障碍，数字未经独立核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "https://t.co/TSrJWx1BHn"}, "avatar": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, {"id": "2118503241390665776", "track": "agent", "source": {"id": "2118503241390665776", "text": "There are so many Linux zero-day vulnerabilities these days, but on Replit we’re able to avoid 96% of them with our custom Kernel build.\n\nRead about our new sandbox design. https://t.co/0YrEAKUwhG", "createdAt": "Fri Nov 06 00:38:27 +0000 2026", "replyCount": 67, "retweetCount": 20, "likeCount": 237, "conversationId": "2118503241390665776", "author": {"username": "amasad", "name": "Amjad Masad", "profileImageUrl": "https://pbs.twimg.com/profile_images/1897858917507776512/TRVTyKFk_normal.jpg"}, "authorId": "166138615", "quotedTweet": {"id": "2118388063252676938", "text": "AI agents need room to work and boundaries on what they can reach.\n\nWe rebuilt Replit’s sandbox engine around microVMs, giving each sandbox its own Linux kernel.\n\nWe break down the decisions behind that architecture: a minimal guest kernel, network controls enforced outside the guest, and credential brokers that let workloads make authorized requests without receiving reusable account credentials.\n\nhttps://t.co/fmS5pbguYO", "createdAt": "Thu Nov 05 17:00:46 +0000 2026", "replyCount": 16, "retweetCount": 8, "likeCount": 58, "conversationId": "2118388063252676938", "author": {"username": "Replit", "name": "Replit ⠕", "profileImageUrl": "https://pbs.twimg.com/profile_images/2031733558952464384/ERrHv3jK_normal.jpg"}, "authorId": "366289783", "translationZh": "AI 智能体需要施展能力的空间，也需要明确的访问边界。\n\n我们基于 microVM 重建了 Replit 的沙箱引擎，让每个沙箱都拥有独立的 Linux 内核。\n\n我们详细介绍了这一架构背后的设计取舍：精简的客户机内核、在客户机外部实施的网络管控，以及凭据代理机制，让工作负载无需获取可重复使用的账户凭据，就能发起获授权的请求。\n\nhttps://t.co/fmS5pbguYO"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZvduIWQAAS0k6.jpg", "width": 1179, "height": 872, "previewUrl": "https://pbs.twimg.com/media/HWZvduIWQAAS0k6.jpg:small"}], "expert": {"priority": "P0", "domain": "AI 编程 / 开发者平台", "name": "Amjad Masad", "role": "Replit / CEO", "why": "AI 应用生成、编码 Agent、开发者平台战略的重要信号源", "handle": "amasad"}, "createdAtIso": "2026-11-06T00:38:27+00:00", "createdAtBeijing": "2026-11-06T08:38:27+08:00", "createdAtLocal": "11-06 08:38 北京", "url": "https://x.com/amasad/status/2118503241390665776", "themeId": "editorial", "signalScore": 87, "editorial": {"id": "2118503241390665776", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Replit 基于 microVM 的 Agent 沙箱设计", "evidence": "a minimal guest kernel", "rationale": "提供内核隔离、外置网络控制和凭据代理设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "如今 Linux 零日漏洞层出不穷，但在 Replit，我们通过定制内核构建规避了其中 96% 的漏洞。\n\n了解我们的全新沙箱设计。https://t.co/0YrEAKUwhG"}, "avatar": "https://pbs.twimg.com/profile_images/1897858917507776512/TRVTyKFk_normal.jpg"}, {"id": "2118749843019665665", "track": "research", "source": {"id": "2118749843019665665", "text": "A really fun project led by @KaiTyrusNelson, @tobykreiman: use simulated experiments to create a prior with state information, then align it to real-world experiments (with partial observation). Oddly enough, the theoretical foundations have a lot in common with inverse RL!", "createdAt": "Fri Nov 06 16:58:21 +0000 2026", "replyCount": 6, "retweetCount": 9, "likeCount": 61, "conversationId": "2118749843019665665", "author": {"username": "svlevine", "name": "Sergey Levine", "profileImageUrl": "https://pbs.twimg.com/profile_images/990434811662680064/BKCbJypl_normal.jpg"}, "authorId": "990433714948661250", "quotedTweet": {"id": "2118361926669607022", "text": "1/ A grand challenge in science: the simulation-to-experiment gap\n\nSimulators model complex systems but introduce model errors; experiments give real-world data but are costly and noisy\n\nCan we leverage both? Yes! We introduce Adversarial Distribution Alignment (ADA), at #NeurIPS2026\n\nADA aligns generative models—initially trained on simulations (e.g., molecular dynamics with classical force fields)—to full real-world distributions (e.g., protein structures) using only partial, noisy observations (like cryo-EM images)\n\nADA goes beyond just matching the expectation of observables: it can match full distributions, even in the presence of multiple correlated, high-dimensional observations\n\nCheck out our website: https://t.co/mTNvPVLuCu\nAnd our paper: https://t.co/diCRh5ywtF\n\nIn collaboration with @KaiTyrusNelson, @tobykreiman, and @svlevine", "createdAt": "Thu Nov 05 15:16:55 +0000 2026", "replyCount": 7, "retweetCount": 24, "likeCount": 178, "conversationId": "2118361926669607022", "author": {"username": "ask1729", "name": "Aditi Krishnapriyan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1313526058952486912/8ltS4dD6_normal.jpg"}, "authorId": "4781795782", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118361914598420480/img/en6qKrvykbd7c1Ky.jpg", "width": 780, "height": 640, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118361914598420480/img/en6qKrvykbd7c1Ky.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118361914598420480/vid/avc1/780x640/FQD7k3Uq7CaIQJYJ.mp4?tag=29", "durationMs": 37000}], "translationZh": "1/ 科学研究的一大挑战：模拟与实验之间的鸿沟\n\n模拟器可以为复杂系统建模，但会引入模型误差；实验能提供真实世界的数据，但成本高且噪声大。\n\n能否结合两者的优势？可以！我们将在 #NeurIPS2026 介绍对抗分布对齐（Adversarial Distribution Alignment，ADA）。\n\nADA 仅利用局部、带噪声的观测数据（如冷冻电镜图像），就能将最初基于模拟数据（如采用经典力场的分子动力学模拟）训练的生成模型，与完整的真实世界分布（如蛋白质结构分布）对齐。\n\nADA 不仅能匹配可观测量的期望值，还能匹配完整分布，即使存在多个相互关联的高维观测也是如此。\n\n欢迎访问我们的网站：https://t.co/mTNvPVLuCu\n以及论文：https://t.co/diCRh5ywtF\n\n与 @KaiTyrusNelson、@tobykreiman 和 @svlevine 合作完成"}, "expert": {"priority": "P1", "domain": "机器人 / AI", "name": "Sergey Levine", "role": "UC Berkeley", "why": "机器人基础模型和强化学习", "handle": "svlevine"}, "createdAtIso": "2026-11-06T16:58:21+00:00", "createdAtBeijing": "2026-11-07T00:58:21+08:00", "createdAtLocal": "11-07 00:58 北京", "url": "https://x.com/svlevine/status/2118749843019665665", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2118749843019665665", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ADA通过部分观测对齐模拟与真实分布", "evidence": "Adversarial Distribution Alignment", "rationale": "提出模拟到实验的分布对齐方法，附论文入口"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "这是一个由 @KaiTyrusNelson、@tobykreiman 牵头的有趣项目：利用模拟实验构建包含状态信息的先验，再将其与只有部分观测信息的真实实验对齐。出人意料的是，它的理论基础与逆强化学习有很多共通之处！"}, "avatar": "https://pbs.twimg.com/profile_images/990434811662680064/BKCbJypl_normal.jpg"}, {"id": "2118593842928849286", "track": "research", "source": {"id": "2118593842928849286", "text": "since BERT better search meant training harder and bigger. We chased the scaling law with more parameters and data. Early 2026 I start to see search more as a test-time compute/scaling problem. instead of seeing search latency as a sin, sth to minimize and avoid, think of it as a currency, a budget you can spend to buy relevance and new capabilities. Earlier this year I explored some good examples of applying TTC mindset on small embeddings and rerankers in three ways: a deeper pass, more passes, and calibration. Some may confuse about the diff between TTC and training-free, they r similar but training-free doesn’t study if more compute budget buys u more. So think of training-free as the origin whereas TTC scales along the axis.\n\nYesterday my talk in SF that sums up these points\n\nhttps://t.co/Aovjk3p1uB", "createdAt": "Fri Nov 06 06:38:28 +0000 2026", "replyCount": 5, "retweetCount": 10, "likeCount": 79, "conversationId": "2118593842928849286", "author": {"username": "hxiao", "name": "Han Xiao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, "authorId": "28969465", "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "肖涵 Han Xiao", "role": "模型、研究与推理实践与观察", "why": "有端侧检索、ANE/GPU 对比与资源取舍，兼顾研究和真实产品。", "handle": "hxiao"}, "createdAtIso": "2026-11-06T06:38:28+00:00", "createdAtBeijing": "2026-11-06T14:38:28+08:00", "createdAtLocal": "11-06 14:38 北京", "url": "https://x.com/hxiao/status/2118593842928849286", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2118593842928849286", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "搜索的测试时计算扩展", "evidence": "a deeper pass, more passes, and calibration", "rationale": "提出三种搜索计算扩展路径并区分免训练概念"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "自 BERT 以来，提升搜索效果一直意味着加大训练力度和模型规模。我们通过增加参数和数据来追逐缩放定律。2026 年初，我开始更多地将搜索视为一个测试时计算与扩展问题。与其把搜索延迟视为必须尽量压低和避免的负担，不如将其看作一种货币，一笔可以用来换取相关性和新能力的预算。今年早些时候，我探索了一些将测试时计算（TTC）思路应用于小型嵌入模型和重排序模型的好例子，主要有三种方式：单次处理更深入、增加处理轮次，以及校准。有些人可能会混淆 TTC 与免训练方法的区别：两者相似，但免训练方法并不研究增加计算预算能否带来更多收益。因此，可以把免训练方法视为原点，而 TTC 则研究沿计算预算轴扩展会怎样。\n\n昨天我在旧金山的演讲总结了这些观点。\n\nhttps://t.co/Aovjk3p1uB"}, "avatar": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, {"id": "2118572536300699764", "track": "enterprise", "source": {"id": "2118572536300699764", "text": "Agents are going to be used increasingly by other agents. Simply because the orchestration is easier and can centralize around one compounding system of record: git. When agents run code-mode and traces are version controlled, you get to a real recursive loop, measurable by less human in the loop.", "createdAt": "Fri Nov 06 05:13:48 +0000 2026", "replyCount": 60, "retweetCount": 10, "likeCount": 118, "conversationId": "2118572536300699764", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2118570924085834072", "text": "At Perplexity, agent prompts are no longer typed by humans: increasingly teammates are prompting each other, listening to automations, and ambiently listening to human feedback. Perplexity bridges the context between a large number of cloud tools and software services: searching and processing more than a human could possibly track manually. Hard decisions, restraint, and judgment before shipping are of course still enforced by humans.\n\nA particularly important value at Perplexity is to always seek the truth. In today's stack, this means centralizing the ground truth in git repos and data warehouses when answering questions about the business, instead of looking at intermediate, often inaccurate or outdated artifacts. This is what enterprise cloud agents like Perplexity are especially good at: connecting the dots across your organization and monitoring the facts 24/7.\n\nEven as an AI-native company it took us many months of dev
