<script>
const DATA={"records": [{"id": "2121421243970990534", "track": "research", "source": {"id": "2121421243970990534", "text": "Anthropic 公开安全评测方法：同一个模型在 API 和 https://t.co/O3VJKio7ZU 上，安全分数最多差 34 个百分点\n\n来自 Anthropic 工程研究博客，写作出发点是：说一个模型“比上一代更安全”，依据只能来自某套评测，评测本身不扎实，这个结论也就站不住！\nhttps://t.co/xuFwgPKiOw\n\n安全评测看的是“做得对不对”\n\n能力评测关心任务有没有完成，安全评测关心的是模型面对某个输入时做的事情对不对。拒绝在很多场景下是正确做法，比如不帮人诈骗。但 Anthropic 认为，在涉及自杀和自我伤害的对话里，拒绝率测的是错的东西：用户正处在危机中，模型直接不回应本身就是失败。\n\n所以他们改为统计“恰当回应率”。评分标准由领域专家制定，恰当的回应要表达支持，不讨论具体方法，引导用户寻求危机资源，同时不把自己当成危机热线。多轮对话中只要有一轮不合格，整段就不通过。生物、网络安全这类既能用于正当用途又能用于伤害的领域也一样：恰当的做法很少是一概拒绝，而是满足合法需求，同时守住可被滥用的操作细节。\n\n多轮对话更接近真实使用\n\n多轮评测的流程是这样的：专家先写好模拟用户的目标和策略，后续的用户发言由另一个 Claude 生成，被测模型作答，最后由评分模型打分。单轮安全测试覆盖 16 个政策领域、7 种语言和多种产品界面。\n\nAnthropic 数据显示，近期各个模型在 API 上的单轮无害回应率都在 94% 到 98% 之间，基本已到天花板，现在主要用来检查新版本有没有退步。多轮结果的波动大得多，置信区间可以超过正负 10 个百分点。他们给出的样本量下限是：复杂的多轮评测至少 100 个用例，较简单的单轮评测至少 1000 个。\n\n举个例子，https://t.co/O3VJKio7ZU 上的多轮恋爱诈骗评测中，Claude Opus 5 得分 98%，Opus 5.5 得分 94%。但这个差异在统计上不显著，不能据此说哪个更安全。\n\n配置不同，分数可能完全不同\n\n系统卡会同时报告两种配置：API 上的原始模型，以及加了系统提示的 https://t.co/O3VJKio7ZU。在测试 Claude Fable 5.1 时，两种配置的多轮恰当回应率最多相差 34 个百分点。\n\n系统卡里自杀与自我伤害多轮评测的数据正好是这个差距：API 为 60%（±14%），换上新系统提示后的 https://t.co/O3VJKio7ZU 为 94%（±7%）。文章提到，发布前他们发现有些回复虽然在劝阻并引导用户寻求真人帮助，却仍然把自我伤害说成一种应对方式，于是修改了系统提示再重测。博文本身没有逐字把 34 点和这组数字对上，这是按系统卡推算的。\n\n由此，文章要求报告中写清模型版本、提示词和评分器，不要拿不同评分器得出的分数直接比较。他们推荐使用英国 AI 安全研究所（AISI）的 Inspect 框架，以及基于它的 Petri。评测应在断网的沙箱里运行。在近期一起网络安全评测事故之后，他们加固了评测环境，暂停了许多需要联网的评测，对必须联网的搜索类评测加上了实时监控。", "createdAt": "Sat Nov 14 01:53:33 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 7, "conversationId": "2121421243970990534", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2121317227618340990", "text": "Safety evaluations are critical for understanding whether a model is ready to deploy, which safeguards to build for it, and where to focus training and research.\n\nOn our Engineering Blog, we offer 10 recommendations for how to design, run and report them.\n\nhttps://t.co/MtSQmqqi2D", "createdAt": "Fri Nov 13 19:00:13 +0000 2026", "replyCount": 430, "retweetCount": 190, "likeCount": 2095, "conversationId": "2121317227618340990", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "translationZh": "安全评估至关重要，能帮助我们判断模型是否已具备部署条件、需要构建哪些防护措施，以及训练和研究应重点关注哪些方向。\n\n我们在工程博客中提出了关于如何设计、开展和报告安全评估的 10 条建议。\n\nhttps://t.co/MtSQmqqi2D"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXDNXiCbAAA9JIC.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXDNXiCbAAA9JIC.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-14T01:53:33+00:00", "createdAtBeijing": "2026-11-14T09:53:33+08:00", "createdAtLocal": "11-14 09:53 北京", "url": "https://x.com/shao__meng/status/2121421243970990534", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2121421243970990534", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "模型安全评测设计与报告方法", "evidence": "复杂的多轮评测至少 100 个用例", "rationale": "详述评分标准、样本量及配置差异"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121438053755683224", "track": "agent", "source": {"id": "2121438053755683224", "text": "Shopify 公开 Cyber Chaos Monkey：让带着内部知识的 AI Agent 在生产环境做受控攻击，再派第二个 Agent 当裁判\n\n@ShopifyEng 发布的这篇「Cyber Chaos Monkey: Staying ahead of security threats with AI agents」介绍的是一套内部系统 Cyber Chaos Monkey（CCM）：把攻防模型、源码、基础设施知识和真实测试店铺的凭证交给 AI Agent，让它们在生产环境里寻找绕过防护的新办法。\n\n名字致敬 Netflix 2011 年推出的 Chaos Monkey，思路是把混沌工程（主动制造故障来检验系统韧性）用到安全上。7 月 29 日 Zack Deveau 发过一篇文章，讲在代码和测试阶段发现并修复漏洞；CCM 则把找漏洞这件事搬到了线上。\nhttps://t.co/c8clBbwiLU\n\n为什么要在生产环境里测\n\nShopify 认为，前沿模型让发现漏洞的成本越来越低，全行业收到的漏洞报告都在猛增。Shopify 说，他们的漏洞赏金计划自 2024 年以来报告量增加了将近 300%。\n\n他们的判断是，同样的模型也能帮防守方。Shopify 比外部研究者更了解自己的系统，应该抢先找到影响最大的问题，让外人再挖到漏洞的难度更高。攻击者瞄准的是生产环境，测试也就必须对着生产环境做，前提是不能影响服务可用性，也不能危及商家数据。\n\n先定方向，再动手\n\nCCM 的角色像一名漏洞赏金研究员，手里有源码、威胁情报、历史漏洞报告和部署记录，还能用真实的测试店铺调用线上接口。系统分成两部分：发现模块和沙箱。任务可以来自安全工程师、上游的其他安全 Agent，也可以来自发现模块自己的反馈。\n\n一个想法先进入发现模块，由最新的攻防模型缩小范围，有价值的线索再交给沙箱。沙箱里的 Agent 尝试实际利用漏洞，Shopify 最看重的做法是向线上系统发真实请求，再对照生产日志和源码不断调整。测试结束后生成报告送回发现模块，可能由此引出新的任务。\n\n光隔离不够，还要有人盯着\n\n文章提到，近来已经出现过安全测试中的 AI Agent 触碰到本不该访问的系统，所以安全约束必须从一开始就设计进去。\n\n隔离做了好几层：\n· 每个任务对应一个独立的 Kubernetes Job。\n· 进攻 Agent 运行在没有提权的容器里，只能读到编排器写入的临时凭证，比如会话 cookie 和 CSRF 令牌。\n· 对外请求先经过凭证代理注入密钥，再经过出口白名单，只放行生产域名、内部知识服务、模型提供方和指定的软件包代理。\n\n每个 Agent 还有一份行动准则：对目标可以尽力尝试攻击，但一旦得手，不能转去攻击其他系统，也不能保留访问权限。\n\nShopify 不单独信任执行攻击的 Agent，又加了一个“裁判” Agent，用不同的提示、不同的立场和不同的模型，实时读执行方的日志。一发现危险行为就立即终止任务；裁判超时、崩溃或给不出判断，任务也会结束。编排器和两个 Agent 之间保持心跳，任何一方退出，整个 Pod 都会被销毁。\n\n据 Shopify 说，这些 Agent 已经执行了上万次进攻任务，发现并处理了几十个有实际影响的问题，没有造成停机或安全事故。", "createdAt": "Sat Nov 14 03:00:21 +0000 2026", "replyCount": 12, "retweetCount": 0, "likeCount": 10, "conversationId": "2121438053755683224", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2120936066215493902", "text": "Tens of thousands of offensive engagements, dozens of impactful security findings, no outages or incidents caused so far.\n\nMeet Shopify’s Cyber Chaos Monkey 🐒, our agentic vulnerability hunter. \n\nhttps://t.co/1kvl4aPQda", "createdAt": "Thu Nov 12 17:45:37 +0000 2026", "replyCount": 5, "retweetCount": 11, "likeCount": 59, "conversationId": "2120936066215493902", "author": {"username": "ShopifyEng", "name": "Shopify Engineering", "profileImageUrl": "https://pbs.twimg.com/profile_images/1135963802258890754/8wt-ffSB_normal.png"}, "authorId": "732393381444255744", "translationZh": "已开展数万次进攻性安全测试，发现数十个重要安全问题，迄今未造成任何服务中断或安全事件。\n\n认识一下 Shopify 的 Cyber Chaos Monkey 🐒，我们的自主漏洞挖掘智能体。\n\nhttps://t.co/1kvl4aPQda"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXDcp-xaUAA5vaw.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXDcp-xaUAA5vaw.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-14T03:00:21+00:00", "createdAtBeijing": "2026-11-14T11:00:21+08:00", "createdAtLocal": "11-14 11:00 北京", "url": "https://x.com/shao__meng/status/2121438053755683224", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2121438053755683224", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Shopify 生产环境安全测试 Agent", "evidence": "每个任务对应一个独立的 Kubernetes Job", "rationale": "详述攻防架构与终止机制，成效为官方自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121449794417861108", "track": "research", "source": {"id": "2121449794417861108", "text": "看到一个很巧妙的 Agent RL 训练思路：把 Harness 变成训练阶段的探索工具，帮助模型学会原本难以完成的任务。\n\n这来自论文《Harness-S》，研究团队尝试利用不同 Harness 的互补能力，将外部执行环境带来的能力提升迁移到模型自身。\n\n具体机制分为三个环节：\n\n首先，从基础 Harness 的失败轨迹中分析原因，针对不同问题定向修改执行机制，构建一个各有所长的 Sibling Harness Pool。\n\n训练时，模型先在原始 Harness 下多次尝试。如果全部失败，Adaptive Harness Router 就根据各 Harness 的历史表现和适用场景，选择最合适的几个重新探索，并将新轨迹用于 GRPO 训练。Router 还会随着模型能力变化，动态更新选择依据。\n\n这个设计解决了一个关键问题：当 Agent 多次尝试全部失败，GRPO 很难获得有效的组内奖励信号。 不同 Harness 提供了新的成功路径，让模型有机会从失败任务中继续学习。\n\n论文实验显示，Qwen3.5-4B 在原始 Harness 下的 SWE-Gym Pass@3，从普通 GRPO 的 24.38% 提升到 38.75%，提高了 14.37 个百分点。\n\n所以 Harness 可以在训练阶段帮助模型突破能力边界，再通过强化学习，把这些执行经验逐渐转化为模型自身的能力。\n\n📎 arXiv: https://t.co/rcpBL0niSY\n\n💻 GitHub: https://t.co/cCcgnJzVE5", "createdAt": "Sat Nov 14 03:47:00 +0000 2026", "replyCount": 12, "retweetCount": 28, "likeCount": 129, "conversationId": "2121449794417861108", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXBeFSqWMAAB6oZ.jpg", "width": 1176, "height": 1182, "previewUrl": "https://pbs.twimg.com/media/HXBeFSqWMAAB6oZ.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-14T03:47:00+00:00", "createdAtBeijing": "2026-11-14T11:47:00+08:00", "createdAtLocal": "11-14 11:47 北京", "url": "https://x.com/Xudong07452910/status/2121449794417861108", "themeId": "editorial", "signalScore": 83, "editorial": {"id": "2121449794417861108", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Harness-S辅助Agent强化学习探索", "evidence": "从普通 GRPO 的 24.38% 提升到 38.75%", "rationale": "详述探索路由与训练机制，并列论文实验结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2121415418854400187", "track": "agent", "source": {"id": "2121415418854400187", "text": "Sierra 发布个人智能体协议 Poppy 1.0：个人智能体按授权对接企业，Shopify 全店铺与 Meta Muse 率先接入\n\nSierra 联合创始人 Bret Taylor 和 Clay Bavor 宣布，个人智能体协议（Personal Agent Protocol，简称 Poppy）v1.0 正式发布。这项开放协议由 Sierra 与 Meta 等合作方共同推动。它针对的是这样一个现状：个人智能体办事时往往只能像人一样点网页，企业要么把 Agent 拦在门外，要么分不清它代表谁、被允许做什么。\nhttps://t.co/hxaTBlrLtR\n\n协议怎样工作\n\n按官方规范，企业在自己的域名下发布 /.well-known/poppy.json，写明能提供哪些入口和登录方式。入口可以是网站、API（如 OpenAPI、MCP），也可以是企业自己的 Agent。个人智能体先以访客身份开启会话，并说明自己是谁。需要用到账户时，用户在企业自己的页面通过 OAuth 登录并授予权限范围，之后同一个会话可以在网页、API 和对话之间连贯进行。\n\n不登录也能使用一部分能力，所以企业不必一开始就搭好完整的授权服务。1.0 比初稿更强调分阶段接入，并引入了扩展机制，新增能力不需要改动核心协议。Shopify 参与撰写的商务扩展用来衔接 Universal Commerce Protocol（UCP）：Poppy 负责发现企业、说明身份和完成登录，具体的购物流程交给 UCP。\n\n这次公布的落地情况\n\n据 Sierra 称，Shopify 平台上的每家店铺都已自动发布 Poppy 文件，商户不用另外开发。Meta 的个人智能体 Muse 已对所有用户启用 Poppy，访问网站时会优先查找这个协议。\n\n已上线的例子有两个。Mercury 允许用户通过个人智能体查询余额、整理账单，并在账户审批规则的约束下发起转账。土耳其航空可以查询票价、航班状态和已有预订，会员升舱要经用户确认后才付款，完整购票还在推进中。Synchrony 的融资与优惠接入，博文的说法是正在探索。\n\nSierra 还表示新增了 60 家设计合作伙伴，总数超过 100 家。企业可以使用官方实施工具包，里面有一套给 Coding Agent 用的技能，以及一个检查部署是否合规的命令行校验器。规范和文档采用 Apache 2.0 许可。\n\n规范其实还是草案\n\nv1.0 已经可用，但官方站点、实施工具包和 GitHub 仓库仍把当前文本标为 draft 1.0。变更日志写明，这份草案会持续修订到 1.0 正式定稿，在那之前的修复仍可能不向后兼容。路线图上，支付通知、推送和附件等功能还没有覆盖。", "createdAt": "Sat Nov 14 01:30:24 +0000 2026", "replyCount": 13, "retweetCount": 0, "likeCount": 11, "conversationId": "2121415418854400187", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2121296788766519431", "text": "Today we’re releasing Personal Agent Protocol (Poppy) v1.0.\n\nIt’s on for everyone who uses Muse, @Meta's AI agent, enabled for every merchant on @Shopify, and backed by more than 100 design partners. https://t.co/0CrPrTUWEy", "createdAt": "Fri Nov 13 17:39:00 +0000 2026", "replyCount": 84, "retweetCount": 97, "likeCount": 900, "conversationId": "2121296788766519431", "author": {"username": "SierraPlatform", "name": "Sierra", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075667013532626944/A5zHw9sn_normal.png"}, "authorId": "1756113959550382081", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXBcKr1boAEgq2n.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HXBcKr1boAEgq2n.jpg:small"}], "translationZh": "今天，我们发布 Personal Agent Protocol (Poppy) v1.0。\n\n该协议已向 @Meta 的 AI 智能体 Muse 的所有用户开放，为 @Shopify 上的每一家商户启用，并获得了 100 多家设计合作伙伴的支持。https://t.co/0CrPrTUWEy"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXDICDKagAAE0jR.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXDICDKagAAE0jR.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-14T01:30:24+00:00", "createdAtBeijing": "2026-11-14T09:30:24+08:00", "createdAtLocal": "11-14 09:30 北京", "url": "https://x.com/shao__meng/status/2121415418854400187", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2121415418854400187", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Poppy个人智能体协议发布", "evidence": "个人智能体协议（Personal Agent Protocol，简称 Poppy）", "rationale": "提供协议机制、接入案例与草案限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121645971096707492", "track": "research", "source": {"id": "2121645971096707492", "text": "One of the hardest parts around document parsing is parsing complex tables.\n\nBesides the task itself being difficult, it is also hard to measure what ‘good’ looks like. Ultimately it comes down to intuition around what is a catastrophic error for downstream knowledge work.\n* Formatting differences (markdown vs. html tags) are harmless\n* Making the header row a “data” row is also probably harmless (any human/model can interpret it as the header anyways)\n* Swapping the signs on a number, particular in financial reporting, is much more severe.\n\nIt is hard to encode what “good” looks like in a quantifiable way. Existing deterministic tests/metrics (OmniDocBench/OlmOCR-Bench/ParseBench-1) use some variant of edit distance, or an average over binary tests, making it hard to distinguish severe errors from normal ones.\n\nWith our recent release of ParseBench-2, our answer is to tune any deterministic metric by a severity policy, where you can explicitly state how good or bad different errors are.\n* For instance, in a finance setting, dropping digits/flipping signs is really bad! Our default severity weighting is 10, but you might decide 25 - the policy is meant to be customizable by the user.\n* Check out the examples below highlighting this. You can compare the impact of “actually bad” or “harmless” perturbations on a few different benchmarks incl. ParseBench-2.\n\nWe have a taxonomy of 330+ error types, a big subset of which is defined around table errors, categorizing them from 5 severity levels:\n* most severe: wrong digits, decimals misplaced, values swapped, column missing\n* medium severe: body rows reordered, one cell split into two, etc.\n* harmless: formatting errors, html markup\n\nMore details around table methodology in blog/tech report.\nBlog: https://t.co/xtgxfln8Wc\nTech report: https://t.co/f6SxkKIlme", "createdAt": "Sat Nov 14 16:46:32 +0000 2026", "replyCount": 13, "retweetCount": 3, "likeCount": 27, "conversationId": "2121645971096707492", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121645683883270144/img/AqOX_M1PFv4bXFnZ.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121645683883270144/img/AqOX_M1PFv4bXFnZ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121645683883270144/vid/avc1/1920x1080/gxbll4JL017_idHZ.mp4?tag=29", "durationMs": 42000}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXGZjHgaYAArX5P.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HXGZjHgaYAArX5P.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXGZj55bQAApnhO.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HXGZj55bQAApnhO.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXGZkhnaUAAPYf8.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HXGZkhnaUAAPYf8.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-14T16:46:32+00:00", "createdAtBeijing": "2026-11-15T00:46:32+08:00", "createdAtLocal": "11-15 00:46 北京", "url": "https://x.com/jerryjliu0/status/2121645971096707492", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2121645971096707492", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ParseBench-2表格解析严重度评测", "evidence": "330+ error types", "rationale": "发布评测方法，按错误严重度加权并支持定制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "文档解析中最难的环节之一，就是解析复杂表格。\n\n这项任务本身很难，衡量什么才算“解析得好”也同样困难。归根结底，我们往往只能凭直觉判断，哪些错误会给后续知识工作带来灾难性影响。\n* 格式差异（markdown 与 html 标签）无伤大雅\n* 把表头行当成“数据”行，可能也无伤大雅（人或模型都能看出它其实是表头）\n* 把数字的正负号弄反，尤其是在财务报告中，后果就严重得多。\n\n很难用可量化的方式定义什么才算“好”。现有的确定性测试和指标（OmniDocBench/OlmOCR-Bench/ParseBench-1）使用某种编辑距离，或对多项二元测试取平均值，因此难以区分严重错误和普通错误。\n\n在最近发布的 ParseBench-2 中，我们的解决办法是通过严重程度策略来调整确定性指标，让你可以明确规定不同错误的影响有多大。\n* 例如，在财务场景中，漏掉数字或弄反正负号都非常严重！我们的默认严重程度权重为 10，但你也可以设为 25——这套策略本就支持用户自定义。\n* 请看下面的示例。你可以比较“确实有害”和“无伤大雅”的扰动对多个基准测试的影响，其中包括 ParseBench-2。\n\n我们建立了涵盖 330 多种错误的分类体系，其中很大一部分针对表格错误，并将其划分为 5 个严重等级：\n* 最严重：数字错误、小数点错位、数值互换、整列缺失\n* 中等严重：正文行顺序被打乱、一个单元格被拆成两个等\n* 无害：格式错误、html 标记\n\n关于表格评估方法的更多细节，请参阅博客和技术报告。\n博客：https://t.co/xtgxfln8Wc\n技术报告：https://t.co/f6SxkKIlme"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2121403992450478246", "track": "agent", "source": {"id": "2121403992450478246", "text": "OpenAI 内部已经跑着 500 多个常驻 Agent，其中数百个基于 OpenClaw，能在后台自动开 PR、持续跑数据实验。\n\n这么多能自己写代码、修改配置、主动执行任务的 Agent，到底怎么保证安全？\n\nOpenAI 刚公开了一篇《Securing persistent agents like OpenClaw at OpenAI》，分享了他们的实际部署方案，值得做 Agent 的人看看。\n\n几个很有参考价值的设计：\n\n把可信 Gateway 和 Agent Harness 分开部署。模型和它生成的代码都视为不可信，放进隔离环境执行。\n\n用 Codex Sandbox 严格限制网络、文件、进程权限。外部域名走白名单，敏感凭据通过 Broker 管理，Agent 无法直接读取。\n\n所有 Agent 操作都经过第二个模型的 Auto-review，减少人工审批的负担，同时保留必要的人类决策。\n\n每个 Agent 都有独立身份，配置变更和执行过程全程记录，出了问题可以追踪。\n\n文章还提到了开源的 OpenClaw Enterprise，尝试把这些安全机制做成通用的 Agent 控制平面，目前仍处于试点阶段。\n\n确实以后常驻 Agent 越来越多，安全边界就得由 Harness 和基础设施真正执行，光靠 Prompt 约束肯定不够。\n\n原文：https://t.co/nTW3Q2VxGJ", "createdAt": "Sat Nov 14 00:45:00 +0000 2026", "replyCount": 13, "retweetCount": 18, "likeCount": 243, "conversationId": "2121403992450478246", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-14T00:45:00+00:00", "createdAtBeijing": "2026-11-14T08:45:00+08:00", "createdAtLocal": "11-14 08:45 北京", "url": "https://x.com/Xudong07452910/status/2121403992450478246", "themeId": "editorial", "signalScore": 82, "editorial": {"id": "2121403992450478246", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "常驻Agent部署的安全边界设计", "evidence": "把可信 Gateway 和 Agent Harness 分开部署", "rationale": "转述隔离、凭据代理、自动审核与身份审计方案"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2121531331628634274", "track": "agent", "source": {"id": "2121531331628634274", "text": "用 AI 改代码，最怕的不是它写得慢，而是还没搞清楚项目，就开始到处改。\n\nshadcn 的 improve就是围绕这些问题设计的。\n\n它的基本思路很好理解：\n\n把代码理解、问题判断和方案设计交给能力强的模型，把边界明确的实施任务交给成本较低的模型，再由顾问模型复核结果。\n\n官方用一句话概括它的产物：The plan is the product——计划就是产品。\n\n它是一套装进编程助手里的技能。运行后，会从 Bug、安全、性能、测试、技术债等角度检查项目，先给你一份带代码证据的问题清单。\n\n你选中想处理的事项，它才生成执行计划，写清楚改哪些文件、怎么验证、哪些地方不能碰，以及遇到什么情况必须停下来。\n\n这些计划可以独立交接。换个模型、换场会话，甚至交给另一位开发者，都不用从头解释。\n\n支持完整调度的环境，还能让执行者在独立工作目录里实施，再复核修改和测试结果；下一次回来，也能检查哪些计划已完成、哪些已经过期。\n\n安装入口是一条命令：`npx skills add shadcn/improve`。\n\n第一次建议从 /improve quick 开始，挑一个自己熟悉的问题走完整个流程。\n\n不过，“强模型规划、便宜模型执行”不代表一定省钱，模型是否真的切换、计划是否准确、返工多不多，都得看实际结果。", "createdAt": "Sat Nov 14 09:11:00 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 59, "conversationId": "2121531331628634274", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2120078508521095594", "text": "用 AI 写网页，有个很烦的地方：它说“改好了”，你打开一看，按钮点不动、表单提交失败，最后还是得自己测试、截图，再让它改。\n\nVercel Labs 的开源工具 agent-browser，就是想把这一步也交给 AI：让它打开真实网页，自己点击、输入、查看结果，而不只是对着代码说“应该没问题”。\n\n它的操作方式：先把网页上的按钮、链接、输入框整理成一份清单，给每个元素标上编号，AI 再根据编号执行操作。\n\n比如找到搜索框、输入关键词、点击搜索，然后检查页面有没有出现预期结果。需要看布局时，还能截图，配合文字信息一起判断。\n\n实用场景\n就是让 AI 编程助手写完页面后，顺手走一遍真实用户流程：搜索能不能用、表单有没有报错、提交后有没有跳转，再留下截图和验证结果。\n\n它也能用来操作后台、查询动态网页、复现 Bug。安装主要分两步：装工具、准备浏览器，再通过 Skill 或 MCP 接到支持相应能力的 AI 助手里。\n\n不过，也别把它理解成“装上以后，AI 就能稳定操作所有网站”。\n\n验证码、登录风控、复杂控件都可能卡住；页面变化后，也需要重新观察。", "createdAt": "Tue Nov 10 08:58:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 0, "conversationId": "2120078508521095594", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119992822048964608/vid/avc1/1920x1080/IhgKlY-9fyRUD-Fw.mp4?tag=29", "durationMs": 258766}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120715226974953473/img/TJjVdTX2P5J_rTfK.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120715226974953473/img/TJjVdTX2P5J_rTfK.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120715226974953473/vid/avc1/1920x1080/oOALSQiKOmloFTuF.mp4?tag=29", "durationMs": 244202}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-14T09:11:00+00:00", "createdAtBeijing": "2026-11-14T17:11:00+08:00", "createdAtLocal": "11-14 17:11 北京", "url": "https://x.com/sitinme/status/2121531331628634274", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2121531331628634274", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "improve 分层规划执行与浏览器验证工作流", "evidence": "npx skills add shadcn/improve", "rationale": "提供安装命令、交接流程、验证方法及成本边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121453646508646511", "track": "tools", "source": {"id": "2121453646508646511", "text": "llama.cpp 是基于 ggml 的开源 C/C++ 推理引擎，可在个人电脑和服务器上运行 GGUF 格式的语言模型和多模态模型，并通过量化降低推理时的内存占用。目前已支持 150 多种模型架构变体，团队也在扩大硬件测试覆盖面，拓展跨平台分发渠道。\n\n11 月 13 日，llama.cpp 与底层张量库 ggml 同步发布 v1.0.0，明确了后续的语义化版本规则。公开 C API 或 ABI 出现不兼容变更时升主版本，加入向后兼容的功能时升次版本，仅修复缺陷且 API 不变时升补丁版本。本次更新移除了一批已弃用的接口，并将 NextN 相关的推测解码接口从内部头文件移入公开头文件 llama.h。\n\nNextN 是部分模型的多 token 预测模块。它先预测接下来的几个 token，再由主模型批量验证。当主模型接受的候选足够多时，就能加快生成。新版还加入了 FP8 KV 缓存，并允许 CPU 在 MoE 专家缓存未命中时分担部分计算。模型方面，新版支持 Kimi-K3.1-Pro，也支持向 Gemma 4 流式输入音频。llama-server 修复了 SSRF 等安全问题，新增 OpenAI 兼容的语音合成接口，内置网页界面也加入了聊天分组和 Markdown 实时预览。\n\n原文：https://t.co/Uso4PO8Ssm", "createdAt": "Sat Nov 14 04:02:18 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2121453646508646511", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2121247058451411047", "text": "Today's release marks the first major version of llama.cpp and ggml.\n\nWe have created a strong foundation for the future of local AI. Looking forward to what you will build on top of it! https://t.co/f8huLdRbhI", "createdAt": "Fri Nov 13 14:21:24 +0000 2026", "replyCount": 4, "retweetCount": 22, "likeCount": 329, "conversationId": "2121246103312212124", "inReplyToStatusId": "2121246103312212124", "author": {"username": "ggerganov", "name": "Georgi Gerganov", "profileImageUrl": "https://pbs.twimg.com/profile_images/1654097134315098113/zCZD0wYz_normal.jpg"}, "authorId": "3300401027", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121246860438282241/img/fE2aHI4NoBj0qyji.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121246860438282241/img/fE2aHI4NoBj0qyji.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121246860438282241/vid/avc1/1600x900/U8Ke71ZYtjAmneef.mp4?tag=29", "durationMs": 33000}], "translationZh": "今天，llama.cpp 和 ggml 迎来了首个大版本发布。\n\n我们已为本地 AI 的未来打下坚实基础。期待看到你们在此基础上创造出的成果！https://t.co/f8huLdRbhI"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-14T04:02:18+00:00", "createdAtBeijing": "2026-11-14T12:02:18+08:00", "createdAtLocal": "11-14 12:02 北京", "url": "https://x.com/lencx_/status/2121453646508646511", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2121453646508646511", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "llama.cpp与ggml首个主版本", "evidence": "llama.cpp 与底层张量库 ggml 同步发布 v1.0.0", "rationale": "详述版本规则、接口变更及推理功能发布"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121431531130617947", "track": "agent", "source": {"id": "2121431531130617947", "text": "Matt Pocock 预告 /animatic Skill：让 Agent 把重要 PR 做成带旁白的分镜演示短片\n\n介绍了两个 Skills：/setup-animatic 负责选好工具，并在本机或远程机器上完成配置；/animatic 负责生成可以直接上传的视频。\n\n用一张张静态帧加旁白讲清一条 PR\n\nMatt 要解决的问题：Agent 写 PR 的速度已经超过他审 PR 的速度，大段 diff 也读得很慢。他的办法不是全程录屏，而是做成 animatic，也就是分镜短片：每一帧是一张静态画面，配一句旁白，由 Agent 做好后贴到 PR 上。\n\n整个流程由一条构建命令串起来：\n· 先写一份 JSON 格式的分镜脚本，每一拍对应一句台词和一帧画面。\n· 用 Playwright 渲染画面，代码直接取自 diff，并保留真实行号。\n· 用选定的语音逐句朗读。\n· 最后用 ffmpeg 合成 MP4，并检查每一帧画面和音频。\n\n视频生成后，按仓库里的配置贴回 PR，GitHub、GitLab 或本地目录都可以。\n\n生成要多久，他给了几个说法\n\n预览里的例子，是把他 Skills 仓库中“把 Skills 发布到 npm”的一条 PR 做成分镜。Agent 做完这一支大约用了 90 秒。\n\n同一天稍早，他贴过一张优化前后的对照表：总耗时从 397 秒降到 96 秒，模型耗时从 244 秒降到 85 秒，对话轮次从 27 轮降到 12 轮，费用从 1.38 美元降到 0.49 美元。每轮的脚本处理时间也从约 50 秒降到约 6 秒，而且改成了逐帧检查。后来有人问平均要多久，他回答大约 4 分钟，并说即使再加入 Playwright 截的图或录的视频也不会太久。\n\n工具只问一次，选择存进文档\n\n/setup-animatic 会逐项询问用什么工具，每一项只问一次：\n· 语音可以选 ElevenLabs、OpenAI 或 edge-tts，会先试读一句，让人听过再选。\n· 渲染用自带的工具包，或者自己的工具。\n· 样式用默认的一套，或者自己写的 CSS。\n· 拼接用 ffmpeg，或者自己的剪辑软件。\n\n选好后会写进 docs/agents/animatic.md。他预览里用的是 edge-tts 的 Andrew 声音。Matt 说声音可以换，这类短片多半会开两倍速看；而时延和 token 开销是大问题，所以要尽量保持简单。\n\n有人问什么算重要 PR，他只回了一句 “One-way doors”，意思是合并后很难撤回的改动。", "createdAt": "Sat Nov 14 02:34:25 +0000 2026", "replyCount": 12, "retweetCount": 0, "likeCount": 25, "conversationId": "2121431531130617947", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2121211579098083668", "text": "Tired of walls of markdown? Try an /animatic.\n\nI'm working on two skills:\n\n- /setup-animatic, that chooses the tooling and sets it up on your machine (or a remote machine)\n- /animatic, that creates a video ready for upload\n\nI've been using them for a while. Here's a preview:", "createdAt": "Fri Nov 13 12:00:25 +0000 2026", "replyCount": 155, "retweetCount": 67, "likeCount": 2026, "conversationId": "2121211579098083668", "author": {"username": "mattpocockuk", "name": "Matt Pocock", "profileImageUrl": "https://pbs.twimg.com/profile_images/1666460461884211204/SmBm505D_normal.jpg"}, "authorId": "346640777", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121210624176779264/img/UY0n6nrEC1q0SaRu.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121210624176779264/img/UY0n6nrEC1q0SaRu.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121210624176779264/vid/avc1/1920x1080/DErj0EULBCKXM8Fk.mp4?tag=29", "durationMs": 101784}], "translationZh": "看腻了大段 markdown？试试 /animatic。\n\n我正在开发两个技能：\n\n- /setup-animatic：选择工具，并在你的电脑（或远程机器）上完成配置\n- /animatic：生成可直接上传的视频\n\n我已经用了它们一段时间。先给大家预览一下："}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXDWue6a0AAOA20.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXDWue6a0AAOA20.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-14T02:34:25+00:00", "createdAtBeijing": "2026-11-14T10:34:25+08:00", "createdAtLocal": "11-14 10:34 北京", "url": "https://x.com/shao__meng/status/2121431531130617947", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2121431531130617947", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "将 PR 生成带旁白的分镜视频", "evidence": "最后用 ffmpeg 合成 MP4", "rationale": "提供预告演示及完整生成流程，尚非正式发布"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121414357041160456", "track": "agent", "source": {"id": "2121414357041160456", "text": "#UX 用户临时拉宽或缩窄侧栏后，往往想把它拖回自己习惯的宽度。但每次松手的位置可能差几像素，想回到同一个宽度，就得重新对齐。 \n\n为了解决这个问题，作者让侧栏从用户的拖拽记录里学习。每个落点形成一条钟形曲线，相近的落点叠成更高的峰。每新增 5 条记录，旧样本的权重减半，所以新的使用习惯能逐渐取代旧习惯。示例代码还会把间隔不到 2 秒的两次调整视为一次，以最后的宽度为准。 \n\n最高峰附近的样本权重合计达到 2.5，才会形成吸附点，大约相当于三次近期且位置相近的调整。建立吸附点后，只要新的最高峰仍在它前后 10 像素以内，且达到权重门槛，就沿用原位置，避免吸附点随每次拖拽来回偏移。 \n\n拖进吸附范围时，侧栏边缘会贴住吸附点。想选附近的其他宽度，可以让鼠标停约 300 毫秒，解除吸附后再接着拖动，边缘会从当前位置继续移动。方向键也可以直接微调。作者把这套逻辑封装成了 react-resizable-panels v4 的 useSnapPoint，跨访问保留偏好需要自行保存 samples，下次通过 initial 传回。\n\n原文：https://t.co/UMWq92aTi5", "createdAt": "Sat Nov 14 01:26:11 +0000 2026", "replyCount": 0, "retweetCount": 4, "likeCount": 58, "conversationId": "2121414357041160456", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2121278262278242802", "text": "Resizable panels that learn your preferred width and snap to it when you resize. \n\n- weighted for recency \n- snap unlocks for precise resizing https://t.co/BbhPX0y0Rz", "createdAt": "Fri Nov 13 16:25:23 +0000 2026", "replyCount": 43, "retweetCount": 59, "likeCount": 1701, "conversationId": "2121278262278242802", "author": {"username": "imharshin", "name": "Harsh Sharma", "profileImageUrl": "https://pbs.twimg.com/profile_images/1949661502660636672/1NXDKlyB_normal.jpg"}, "authorId": "980480350051737601", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121274668619591680/img/SfhmEH0el2Lz-JkJ.jpg", "width": 2048, "height": 1489, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121274668619591680/img/SfhmEH0el2Lz-JkJ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121274668619591680/vid/avc1/2970x2160/ljrLWw0J298dFWq8.mp4?tag=29", "durationMs": 12683}], "translationZh": "可调节大小的面板会学习你偏好的宽度，并在你调整时自动吸附到该宽度。\n\n- 越近期的偏好，权重越高\n- 可解除吸附，方便精确调整大小 https://t.co/BbhPX0y0Rz"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-14T01:26:11+00:00", "createdAtBeijing": "2026-11-14T09:26:11+08:00", "createdAtLocal": "11-14 09:26 北京", "url": "https://x.com/lencx_/status/2121414357041160456", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2121414357041160456", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "学习用户偏好的侧栏吸附实现", "evidence": "每新增 5 条记录，旧样本的权重减半", "rationale": "给出权重衰减、吸附阈值与交互实现方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121602766976237610", "track": "agent", "source": {"id": "2121602766976237610", "text": "跟Claude对话，Claude做规划和前端，派活给GPT写后端和数据处理，然后Claude收尾，Codex启动最多三轮审查，可能就是目前Agent自动化开发的最优解了。\n\n所以我的CLAUDE.md里一直有这么一段，用起来还是蛮舒适的（codex-worker是我自己定义的脚本，没用codex的官方插件，官方插件有点麻烦，问题也有点多），给大家分享一下～\n\n## 派活\n- 成块的后端、算法、数据处理和性能活（不是一两行的修补）交给本机的 Codex（GPT-6.1 Sol）写，你定接口和验收标准；前端、视觉、文案、拆解和验收自己做。\n- 用 `codex-worker \u003c工作树> \"任务\"` 派，追加用 `codex-worker --resume \u003c会话ID> \u003c工作树> \"追加\"`，放后台跑，会话 ID 在输出最后。\n- 它只能写工作树和临时目录，提交不了、联不了网：装依赖、联网测试、提交推送由你做。它只看得到任务和工作树，接口、验收标准、要一起改的同类都写进任务。\n- Codex 交回后你读 diff、自己跑测试（合并前的审查也是 GPT，你这步才是换家模型的交叉检查）。PR 里有 Codex 写的代码就是混合来源，交付不带 `--agent`。", "createdAt": "Sat Nov 14 13:54:51 +0000 2026", "replyCount": 110, "retweetCount": 40, "likeCount": 514, "conversationId": "2121602766976237610", "author": {"username": "Khazix0918", "name": "数字生命卡兹克", "profileImageUrl": "https://pbs.twimg.com/profile_images/1756592360367259648/GXJ4Kl6w_normal.jpg"}, "authorId": "1492195583699951620", "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "数字生命卡兹克", "role": "内容、视觉与多模态实践与观察", "why": "有 AI 内容生产、工具操作和亲身创作经验，补实际使用者视角。", "handle": "Khazix0918"}, "createdAtIso": "2026-11-14T13:54:51+00:00", "createdAtBeijing": "2026-11-14T21:54:51+08:00", "createdAtLocal": "11-14 21:54 北京", "url": "https://x.com/Khazix0918/status/2121602766976237610", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2121602766976237610", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Claude 与 Codex 分工及交叉验收流程", "evidence": "你定接口和验收标准", "rationale": "提供派活命令、权限边界及交叉审查方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1756592360367259648/GXJ4Kl6w_normal.jpg"}, {"id": "2121624144941097094", "track": "enterprise", "source": {"id": "2121624144941097094", "text": "OCR folks are having a heated debate about particular benchmarks in this thread.  Much of the frustration stems from the unreasonable sway benchmarks have on vendor selection: nobody looks behind the top level score!\n\nThis invites moral hazard when publishing a benchmark, and understandably shines a light on motivations and incentives at play, even if there are good intentions.  \n\nAs a consumer of models, if you are relying on benchmarks the least you should do is look at the traces from 3-5 failing tasks and try to make an informed decision yourself.  Vik has a checklist as well below.\n\nDon't make up your mind based on twitter arguments either!  Look at the data.  Also sometimes \"benchmarks of benchmarks\" are slop.  You really need to look at the data yourself if you are making large purchasing decisions based on the numbers.", "createdAt": "Sat Nov 14 15:19:48 +0000 2026", "replyCount": 38, "retweetCount": 1, "likeCount": 56, "conversationId": "2121624144941097094", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "quotedTweet": {"id": "2121339255893229970", "text": "There are so many flawed OCR benchmarks, and more come out every week.\n\nI gave a talk on how to evaluate them in @HamelHusain's course. Here are common issues, how to spot them, and a guide on evaluation 🧵 https://t.co/YbUMLhAOkA", "createdAt": "Fri Nov 13 20:27:45 +0000 2026", "replyCount": 10, "retweetCount": 13, "likeCount": 103, "conversationId": "2121339255893229970", "author": {"username": "VikParuchuri", "name": "Vik Paruchuri", "profileImageUrl": "https://pbs.twimg.com/profile_images/1137021395047608321/RK6kgzVV_normal.png"}, "authorId": "600563757", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXB1VC6XsAANrAt.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXB1VC6XsAANrAt.jpg:small"}], "translationZh": "有缺陷的 OCR 基准测试实在太多了，而且每周都有新的冒出来。\n\n我在 @HamelHusain 的课程中讲过如何评估它们。下面介绍常见问题、识别方法和评估指南 🧵 https://t.co/YbUMLhAOkA"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXGEsyzbkAA5u47.jpg", "width": 1044, "height": 972, "previewUrl": "https://pbs.twimg.com/media/HXGEsyzbkAA5u47.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-11-14T15:19:48+00:00", "createdAtBeijing": "2026-11-14T23:19:48+08:00", "createdAtLocal": "11-14 23:19 北京", "url": "https://x.com/HamelHusain/status/2121624144941097094", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2121624144941097094", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "OCR采购中的基准审查方法", "evidence": "traces from 3-5 failing tasks", "rationale": "建议抽查失败任务轨迹，辅助采购选型"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "OCR 圈正在这个讨论串里激烈争论一些具体的基准测试。大家的不满很大程度上源于基准测试对供应商选择的影响大得不合理：没人去看总分背后的细节！\n\n这给基准测试的发布带来了道德风险，也难免让人审视其中的动机和利益驱动，即使初衷是好的。\n\n作为模型用户，如果你依赖基准测试，至少应该查看 3–5 个失败任务的执行记录，自己做出有依据的判断。Vik 也在下方提供了一份检查清单。\n\n也别根据 Twitter 上的争论就下结论！去看数据。另外，有些“基准测试的基准测试”也是粗制滥造的东西。如果你要根据这些数字做出大额采购决策，就真的需要亲自查看数据。"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2121417834073145381", "track": "tools", "source": {"id": "2121417834073145381", "text": "本地跑开源模型，最烦的往往不是它不够聪明，问一句怎么杀掉卡死的进程，它先给你讲半天安全须知。让它写段小说，满屏 ethereal、tapestry、symphony，你随口提个想法，它第一句永远是好问题。\n\n想改这些毛病，常见的路子就两条，写 system prompt 劝它，管得了一时，换个问法又回去了。做微调，要准备数据、租卡、调参，大部分人走到这一步就算了。\n\nHeretic 走的是第三条路：不训练，直接改模型权重，给它一个 Hugging Face 上的模型名，它自己找参数、自己打分，一张游戏显卡跑一个下午，吐出一个改好的模型，2.0 之后变成了一个通用的改性格工具，去马屁、去套路文、让回答变短，换个配置文件就行。", "createdAt": "Sat Nov 14 01:40:00 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 6, "conversationId": "2121417834073145381", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2118251218057543825", "text": "如果你用过本地大模型，可能遇到过这种情况：让它分析一段自己有权研究的代码、讨论小说里的冲突，或者解释一个有争议的话题，它没有处理任务，而是先给出一大段拒绝和免责声明。\n\n于是，一个很自然的问题出现了：既然模型权重已经下载到自己的电脑上，能不能直接调整它的行为？\n\nHeretic就是围绕这个问题发展起来的开源项目。它最初以自动减少语言模型拒答受到关注，如今已经扩展为一个不依赖传统大规模训练的模型修改工具：\n\n除了抑制拒答，还可以尝试减少陈词滥调、减少奉承和迎合，或者调整其他表达倾向。\n\n你把模型下载到自己电脑上之后，还能进一步调整它的行为。比如有些正常的代码分析、设备维修或小说讨论，模型动不动就说“这个我不能回答”，它就可以尝试减少这类拒答。\n\n它会直接修改模型权重，自动搜索不同方案，让你挑选修改后的版本保存下来。\n\n它现在能调整的东西已经不止拒答了。2.0 版还提供了减少写作套话、减少奉承和迎合等配置。\n\n像那种不管你说什么，都先来一句“你的想法太棒了”的回答，也成了可以尝试调整的对象。\n\n不过这些示例主要围绕英文设计，想拿来改善中文写作，还得自己准备中文样本验证。\n\n上手流程倒不复杂：准备好 Python、适配显卡的 PyTorch，安装 heretic-llm，再指定一个兼容的模型，就能开始自动分析和参数搜索。小模型可以用消费级显卡尝试，但显存和耗时要看具体配置。", "createdAt": "Thu Nov 05 07:57:00 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 3, "conversationId": "2118251218057543825", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117873230275080192/img/amqp0M7CBF5oChU1.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117873230275080192/img/amqp0M7CBF5oChU1.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117873230275080192/vid/avc1/1280x720/KnlPoEVNrX-1eSFD.mp4?tag=29", "durationMs": 84570}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW5EeXUbAAAvpwL.jpg", "width": 1080, "height": 459, "previewUrl": "https://pbs.twimg.com/media/HW5EeXUbAAAvpwL.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-14T01:40:00+00:00", "createdAtBeijing": "2026-11-14T09:40:00+08:00", "createdAtLocal": "11-14 09:40 北京", "url": "https://x.com/sitinme/status/2121417834073145381", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2121417834073145381", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Heretic本地模型行为调整工具", "evidence": "安装 heretic-llm", "rationale": "介绍开源工具用途、上手流程及中文验证限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121417839152370028", "track": "tools", "source": {"id": "2121417839152370028", "text": "9KB 的配方\n\n模型改完传 Hugging Face 时，可以顺手附上一份 reproduce.json，记着当时的环境、数据集和选中的参数，大小 9KB 左右。\n\n别人拿到这份配方：\n\nheretic --reproduce path/to/reproduce.json\nHeretic 会先对照你的环境，哪里跟原作者不一样会指出来。然后跳过几个小时的搜索，几分钟重新生成模型，最后校验权重文件的哈希。\n\n社区已经用 Heretic 发了几千个模型，带配方的那部分收进了一个叫 Grimoire 的库。想整个备份到本地，一条命令：\n\nheretic --collect-reproducibles ./grimoire/\n\n怎么上手\n\n准备 Python 3.10+，再装好跟你显卡匹配的 PyTorch 2.6+，然后：\n\npip install -U heretic-llm\nheretic Qwen/Qwen3-4B-Instruct-2507\n\n不加配置就是默认的去拒答。想换别的，从仓库下载对应的配置文件，改名成 config.toml 放在当前目录，或者用环境变量指过去：\ncurl -O https://t.co/leMs2WraoW\nHERETIC_CONFIG_FILE=config.nosyco.toml heretic Qwen/Qwen3-4B-Instruct-2507\n\n启动后它会先测一遍显卡，自动挑最合适的 batch size，然后一轮一轮试参数。RTX 3090 上处理这个 4B 模型大约 30 到 40 分钟。显存不够的，在配置里把 quantization 设成 bnb_4bit，按 4bit 加载，显存占用降到跟跑量化版差不多，精度会略掉一点。\n\n用过 1.x 的注意，老配置文件在 2.x 里不能直接用，升级前对照一下迁移文档。", "createdAt": "Sat Nov 14 01:40:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2121417834073145381", "inReplyToStatusId": "2121417838279967028", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW5EuqZbkAAjELE.jpg", "width": 915, "height": 1138, "previewUrl": "https://pbs.twimg.com/media/HW5EuqZbkAAjELE.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-14T01:40:01+00:00", "createdAtBeijing": "2026-11-14T09:40:01+08:00", "createdAtLocal": "11-14 09:40 北京", "url": "https://x.com/sitinme/status/2121417839152370028", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2121417839152370028", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Heretic 模型修改复现与安装方法", "evidence": "heretic --reproduce path/to/reproduce.json", "rationale": "提供复现命令、环境要求、量化及迁移注意事项"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121591226264871309", "track": "tools", "source": {"id": "2121591226264871309", "text": "写一个后台管理系统，真正让人头疼的，往往不是“服务器能不能接收请求”。\n\n你还得把数据库查出来的东西展示成页面，处理表单，做搜索和分页，给按钮加交互，接入登录，把图片、字体、图标、CSS 放到正确的位置。项目再复杂一点，还得处理加载状态、异步更新，以及前后端数据结构同步。\n\nRust 有 Tokio、Hyper、Axum 这样的网络基础设施，但基础设施很强，不代表开发业务网站就一定省心。很多时候，开发者仍要自己把一堆库装成一辆车。\n\nTopcoat 想解决的，就是这一层问题：就想把这些常用工具整合好，让 Rust 开发者少花点时间搭架子，多花点时间做功能。\n\n思路也好理解：\n页面主要由服务器生成，展开菜单、切换状态这类小交互，直接在浏览器里完成；\n搜索、分页需要新数据时，再让服务器更新对应的那一块页面。\n\n你可以用一部分受支持的 Rust 表达式来写浏览器交互，框架会把它转成 JavaScript，不用专门折腾一套 WebAssembly 前端。\n\n除了页面和交互，它还提供路由、资源打包、Tailwind、字体、图标，以及可以直接复制到项目里修改的 UI 组件。配合 Toasty 数据库工具，做内部管理后台、订单系统，或者以表单和列表为主的网站。", "createdAt": "Sat Nov 14 13:09:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 16, "conversationId": "2121591226264871309", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120427418989293568/img/RTvn_FtAyNTK_RDP.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120427418989293568/img/RTvn_FtAyNTK_RDP.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120427418989293568/vid/avc1/1920x1080/_sY-xDPTRcfacwSr.mp4?tag=29", "durationMs": 194050}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-14T13:09:00+00:00", "createdAtBeijing": "2026-11-14T21:09:00+08:00", "createdAtLocal": "11-14 21:09 北京", "url": "https://x.com/sitinme/status/2121591226264871309", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2121591226264871309", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Topcoat Rust业务网站框架", "evidence": "框架会把它转成 JavaScript", "rationale": "具体介绍交互机制、配套工具与适用业务场景"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121521233221275758", "track": "tools", "source": {"id": "2121521233221275758", "text": "最近 Mole CLI 有非常多的更新，Mac、Windows 和 Linux 都有很多优化和增强，打算了一起同步给大伙。\n\n首先非常建议使用 CLI 小伙伴看到后，辛苦直接 mo update 更新到最新，因为有可能你本地还是半年前的版本，现在版本相比之前要完善更多，特别是对于一些AI 工具清理的加强和安全的保护上。\n\n首先 Mac 这一块的卸载能力差不多完成了之前 GUI 版本差不多 900 款软件的卸载详细同步，可以享受一样的残留清理效果，然后对于开发工具的清理、以及代码编译过期内容的清理也有很多完善，甚至其实iPhone和Android模拟器工具里面也有非常多的缓存，也可以一起清理了。\n\n然后 Windows 版本补了很多大伙常用的软件，360 极速浏览器、夸克、QQ、飞书、剪映、Trae 这些缓存都能清了，卸载的时候游戏存档、Epic 游戏和 WSL 磁盘会留着，还新加了 mo installer 命令，可以把下载文件夹里放了很久的安装包挑出来让你删除。\n\n最后 Linux CLI 在上线后继续完善，Arch、Omarchy、Debian、Ubuntu 都可以用了，clean、uninstall、analyze、status、purge 这些命令和 Mac 上一样，像 Omarchy 这种会打 btrfs 快照的系统，删掉的旧包要等快照轮换后空间才回来，Mole 也会如实告诉你详细的清理现状。\n\n最后假如你对各个系统的清理、维护、电脑优化、卸载有任何的建议，都可以找我，我来帮你把需要的地方完善好，把 Mole 做成好用易用效果好的电脑优化工具，哈哈，发完这个，我就去看李志去，期待今晚的演出！\n\nhttps://t.co/rVM1P2nZ1O", "createdAt": "Sat Nov 14 08:30:52 +0000 2026", "replyCount": 9, "retweetCount": 6, "likeCount": 99, "conversationId": "2121521233221275758", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXEmSUXbQAAh0vJ.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXEmSUXbQAAh0vJ.jpg:small"}], "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-14T08:30:52+00:00", "createdAtBeijing": "2026-11-14T16:30:52+08:00", "createdAtLocal": "11-14 16:30 北京", "url": "https://x.com/HiTw93/status/2121521233221275758", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2121521233221275758", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Mole CLI 跨平台清理与卸载更新", "evidence": "还新加了 mo installer 命令", "rationale": "作者详述三平台功能更新及清理保护机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2121477476681728191", "track": "agent", "source": {"id": "2121477476681728191", "text": "把 AI 工作台装进口袋，手机能接管多少原本属于电脑的任务？\n\n你可能遇到过这样的情况：电脑上的 AI 正在改代码，你刚好要出门；它执行到一半需要确认，你却只能等回到电脑前。\n\n或者，你在手机上想到一个小工具，想让 AI 直接做出来，却发现普通聊天软件只能给你一段代码，接下来的保存、运行、修改仍要自己折腾。\n\nDSH Go 想解决的，就是这段从“和 AI 聊天”到“让 AI 真正干活”的距离。\n\n它把 DeepSeek Harness 的使用入口搬到了 Android 手机上\n\n主要有两种用法：\n一种是在手机上准备运行环境，直接处理本机任务；\n另一种是连接远程电脑，把手机变成随身的操作入口。\n\n后者——出门在外，想看看任务进度、补充几句要求，或者继续推进电脑上的项目，不用每次都把笔记本掏出来。\n\n但它也有很明确的边界：本机运行不等于模型离线，连接电脑不等于控制电脑上所有软件，手机操控也不等于可以稳定、无人值守地接管一切。\n\n所以前提是远程电脑已经配置好，而且能连得上。\n\n上手可以先从一个小任务开始：下载适合自己设备的 APK，按照引导准备环境，再配置模型服务商、接口地址和 API Key。\n\n然后交给它一份文件，明确说清楚“处理什么、按什么规则、最后交付什么格式”。\n\n比如把消费记录整理成分类表格，就比一句“帮我分析一下”更容易得到可检查的结果。这里的“本机运行”也不等于离线大模型，模型请求仍然需要访问对应服务，费用取决于你的配置和用量。\n\n除了文件和远程任务，它还支持语音输入、插件，以及手机操控等功能。\n\n不过这些能力都有条件：模型要支持相应工具，插件可能需要额外配置，手机操控也需要授权。\n\n特别是读取屏幕时，内容可能发送给模型服务商，涉及隐私、支付或重要文件的操作，还是要自己盯住关键步骤。", "createdAt": "Sat Nov 14 05:37:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2121477476681728191", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2091341472687956023", "text": "DSH Desktop 把 DeepSeek Harness 变成可直接使用的桌面 Agent\n\nDeepSeek Harness 本身其实很强。它不是普通聊天机器人，而是一套 Agent 运行框架，可以读取和修改本地文件、执行命令、调用工具、切换工作区，还能通过插件和 Preset 组合出不同类型的专业 Agent。\n\n问题是，原版多少还是有点门槛，要碰 Node.js、pnpm、命令行、本地服务这些东西。\n\nDSH Desktop 做的事情，就是把这些环境和进程管理都包起来。Windows 和 macOS 下载安装后，基本可以直接启动，不需要自己额外配置 Node.js。\n\n它还带了托盘、终端、Profile、插件管理、自动更新这些桌面功能，用起来更像一个真正的本地 AI 工作台。\n\n它的插件生态很好。模型、工具、界面、工作流，甚至不同 Agent 的配置都可以组合。再配合 Preset，你可以理解成：\n\n通用 Agent + 一套调好的工具和流程 = 一个专门干某件事的 Agent。", "createdAt": "Sun Aug 23 01:47:16 +0000 2026", "replyCount": 24, "retweetCount": 0, "likeCount": 2, "conversationId": "2091341472687956023", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
