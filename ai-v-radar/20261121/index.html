<script>
const DATA={"records": [{"id": "2123671858541187164", "track": "research", "source": {"id": "2123671858541187164", "text": "936 个 AI 自己做了三个月研究，发了 936 篇论文；AI 评委打分，它们比人类论文严谨，但新意不如人类\n\n论文网站 alphaXiv 联合 MIT、斯坦福等机构 11 月 19 日发布报告：8 月到 11 月，35 个实验室接入 936 个 AI 智能体，人只给算力、定大方向，选题、实验、代码和论文全由 AI 完成。同一天，alphaXiv 开放了专门收 AI 论文的“AI Track”，有账号就能投，AI 可以自己上传。\n\n三个月里，它们做了这些事：\n\n一个智能体在频道里宣布方法提升 13.2 个百分点，不到两小时自己发帖撤回，因为发现对照组没调好。\n\n有实验室不到三分钟传了 12 篇占位论文，另一个智能体看不下去，办起了 AI 期刊：四个 AI 盲审，编辑还用作者的代码把数字重算一遍。\n\n只读文字的 AI 审稿人分不清改好的和没改好的论文；把审稿意见写成代码一跑，156 条重大意见里有 77 条推翻了论文结论。编辑读代码时还抓到三篇代码和论文对不上的投稿，其中一篇直接调用了标准答案。\n\n它们也复现了 GPT-6 Astra 直接改 Qwen 权重那项研究：分数确实涨了，但原作者说的原理不对。\n\n和同期人类论文比，两个 Gemini 模型盲评 202 对论文，AI 论文实验严谨高 2 分（10 分制），新颖性低 0.4 分。\n\n这些结果要打个折扣：评委是 AI，只读文字，AI 的总分优势全部来自最早那个实验室，其余实验室和人类论文差不多。“没人写代码”靠参与者自己申报。公开数据集不含原始数据和模型权重，数据集说明也提醒，每条结论都当作未经核实。\n\n论文：https://t.co/PvIWr3B9yL", "createdAt": "Fri Nov 20 06:56:41 +0000 2026", "replyCount": 34, "retweetCount": 4, "likeCount": 66, "conversationId": "2123671858541187164", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2123457710733824270", "text": "Leave one AI agent alone to do research and it often cuts corners. Leave nearly 1,000 AI agents together for three months and they invent peer review.\n\nAcross 35 labs (Stanford, MIT, ETH Zurich, UCSF, and more), agents published 936 papers with full code and data on a shared server built for AI. No human wrote code or text.\n\nUnprompted, they debated study designs in chat, retracted their own mistakes, found real errors in human papers, and started a journal that caught other agents cheating in code.\n\nIn blind reviews against human arXiv papers, humans still won on original ideas, agents won on rigor.\n\nhttps://t.co/KsQiwol0j4", "createdAt": "Thu Nov 19 16:45:44 +0000 2026", "replyCount": 75, "retweetCount": 342, "likeCount": 1836, "conversationId": "2123457710733824270", "author": {"username": "SRSchmidgall", "name": "Samuel Schmidgall", "profileImageUrl": "https://pbs.twimg.com/profile_images/1704338778301566976/8X-SrykK_normal.jpg"}, "authorId": "1323123590020169728", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123321075501355008/img/Q0cNHtp4hRIPKuoa.jpg", "width": 1168, "height": 992, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123321075501355008/img/Q0cNHtp4hRIPKuoa.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123321075501355008/vid/avc1/1168x992/J_0mU0xtvmCQb2o2.mp4?tag=29", "durationMs": 9600}], "translationZh": "让一个 AI 智能体独自做研究，它往往会偷工减料。让近 1,000 个 AI 智能体一起工作三个月，它们竟然发明了同行评审。\n\n来自 35 家实验室（包括斯坦福、MIT、苏黎世联邦理工、UCSF 等）的智能体，在一个专为 AI 搭建的共享服务器上发表了 936 篇论文，并提供了完整代码和数据。没有任何代码或文字由人类编写。\n\n无需指示，它们就在聊天中讨论研究设计、撤回自身的错误结论、发现人类论文中的真实错误，还创办了一本期刊，揪出了其他智能体在代码中作弊的行为。\n\n在与人类 arXiv 论文的盲评对比中，人类在原创性上仍然更胜一筹，智能体则在严谨性上胜出。\n\nhttps://t.co/KsQiwol0j4"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-20T06:56:41+00:00", "createdAtBeijing": "2026-11-20T14:56:41+08:00", "createdAtLocal": "11-20 14:56 北京", "url": "https://x.com/dotey/status/2123671858541187164", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2123671858541187164", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "多智能体自主研究与同行评审实验", "evidence": "156 条重大意见里有 77 条推翻了论文结论", "rationale": "介绍具体研究成果、评审方法及证据局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2123600235079586247", "track": "creative", "source": {"id": "2123600235079586247", "text": "LangChain 开源 Design Agent，把公司在用的 Content Studio 公开，用每线程沙箱和品牌检查在 Slack 交出平面、演示文稿和影片\n\n@LangChain 把公司内部在用的 Design Agent「Content Studio」开源。它建立在 Deep Agents 上，默认用 Managed Deep Agents 部署到团队 Slack：在线程里说明需求、附上文件，就会拿回符合品牌规范的平面、多尺寸广告、演示文稿、图表、分镜和影片。也可以用命令行、HTTP API，或自己用 Docker 托管。自 8 月起它已为公司交出 3000 多件物料，演示文稿超过 80 份；带这些视觉的帖文在 X 上大约有 450 万次浏览。四分之三的需求来自市场部门以外。单次请求的模型费用中位数大约是 0.5 美元，9 月中旬还大约是 8 美元。\n\n开源地址：https://t.co/wDwS1cTTF3\n\n一条 Slack 线程、一台设计用电脑\n\nManaged Deep Agents 负责 Slack、记忆、定时任务，以及每条线程一台 LangSmith 沙箱；仓库补上设计工作流、品牌包和渲染工具。沙箱是一台 Linux 机器，里面有 Chrome、FFmpeg、HeyGen 的 HyperFrames、D2 和团队字体，由 sandbox/setup.sh 搭起来。成品都以代码写在项目目录里：幻灯片是 HTML，影片是动画时间线，改完再渲染即可。密钥不进沙箱，默认也没有外网；图像、语音、音乐在沙箱外调用，Notion、GitHub、Figma 一类 MCP 经 MDA 接入，每个人用自己的账号登录。\n\n一条 Slack 消息会随步骤更新，页脚显示进度和目前费用，中途补的意见也能进正在进行的工作。大任务由主 Agent 拆开，在同一沙箱里后台启动子 Agent；做完、失败或卡住时，MDA 会叫醒主 Agent，它不用空等，还可以继续对话。影片按分镜、动态预演、正式制作推进，每一段先过检查再组装。HyperFrames 把影片当成时间线上的网页来做，Paper 是可以改分镜或版式的共享画布。\n\n技能路由、品牌检查，以及它怎么变好\n\n常驻提示很短。每次请求先读路由技能，再从 35 项技能里选出对应流程，由 Context Hub 按需加载。设计维基里是字体、色彩、版式、图表这类手艺，品牌包里是颜色、字体、标志和语气。渲染之后会先看成品再发出；颜色、字体、对比、尺寸和图表计算由代码在每次渲染时检查。规则可以说一次就记下，分成全员共享的团队记忆和每人一份的个人记忆。任务结束后，learn_from_job 按所用技能记下有依据的经验，后续任务会阅读并评分，站不住的会被丢掉。\n\n他们写到，早期为了补模型短板做过 115 个可复用界面组件；Claude Opus 5.5 出来后质量明显提高，他们删掉了大部分硬编码规则，留下设计原则和高层指引。默认模型就是 Claude Opus 5.5，也支持 OpenAI、Google 和 LangSmith Gateway。Managed Deep Agents 在 LangSmith Cloud 上仍是公开测试；代码免费，模型和托管要另付。本地可以用脚本化模型、不配密钥跑演示，走真实的 Agent 图、沙箱和检查。", "createdAt": "Fri Nov 20 02:12:05 +0000 2026", "replyCount": 16, "retweetCount": 2, "likeCount": 14, "conversationId": "2123600235079586247", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2123430062913724481", "text": "fun fact:\n\nas we were gearing up towards launch, we had our content agent take a stab at making a launch video\n\nwe didn't end up using it - but it was really good and we definitely could have! attaching below\n\nthis agent is Open Source as well! https://t.co/t5XHzTow2O https://t.co/GQpKp6MlyY", "createdAt": "Thu Nov 19 14:55:53 +0000 2026", "replyCount": 27, "retweetCount": 7, "likeCount": 106, "conversationId": "2123430062913724481", "author": {"username": "hwchase17", "name": "Harrison Chase", "profileImageUrl": "https://pbs.twimg.com/profile_images/1569345624935485442/R67C4wCQ_normal.jpg"}, "authorId": "2728439146", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123429456958373889/img/IqZ7F3YLjgRUKh4E.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123429456958373889/img/IqZ7F3YLjgRUKh4E.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123429456958373889/vid/avc1/1920x1080/ApRBqZTk3_xqwtcF.mp4?tag=29", "durationMs": 118701}], "translationZh": "一件趣事：\n\n筹备发布时，我们让内容智能体试着制作了一支发布视频。\n\n最后虽然没用上，但效果确实很好，完全可以直接用！视频附在下方。\n\n这个智能体也开源了！https://t.co/t5XHzTow2O https://t.co/GQpKp6MlyY"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXiLJfTaoAACVR9.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXiLJfTaoAACVR9.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-20T02:12:05+00:00", "createdAtBeijing": "2026-11-20T10:12:05+08:00", "createdAtLocal": "11-20 10:12 北京", "url": "https://x.com/shao__meng/status/2123600235079586247", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2123600235079586247", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "LangChain 开源 Content Studio 设计智能体", "evidence": "把公司内部在用的 Design Agent「Content Studio」开源", "rationale": "介绍开源发布、创作流程、品牌检查及自述成效"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123621353211240772", "track": "agent", "source": {"id": "2123621353211240772", "text": "像 Muse，Grok Bot 这类主动式 Agent 怎么评测？这篇讲得蛮清楚的。\n\n它和普通 Agent 的区别其实就一步。普通 Agent 收到触发就执行，主动式 Agent 会先判断要不要做、什么时候做、做到哪一步。比如航班延误了两小时，它可以直接提醒你、等航司改签、帮你找新航班，甚至直接订好。\n\n难点在于，普通 Agent 每次回答都有人看，答错了马上会被发现。主动式 Agent 不一样，它大部分时候判断「不用管」，就悄悄过去了，判断错了也没人知道。所以文章建议把每一次判断都记下来，包括被什么事情触发、参考了哪些信息、最后怎么决定的、为什么这么决定，连没行动的那些也要留着，这样回头才查得出问题。\n\n评测的思路也值得参考。它每次判断其实就是在回答一个问题：这件事该不该出手。所以可以分两头看，一头是该出手时有没有漏掉，一头是出手的时候是不是多余。门槛也可以分开设，随手就能忽略的提醒可以宽松一点，买东西这种花钱又难撤回的操作就要严格得多。\n\n我感觉主动式 Agent 好不好用，是该打扰的时候打扰我，不该打扰的时候别打扰我🧐。", "createdAt": "Fri Nov 20 03:36:00 +0000 2026", "replyCount": 8, "retweetCount": 17, "likeCount": 100, "conversationId": "2123621353211240772", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2123434745728045425", "text": "Evaluating proactive agents", "createdAt": "Thu Nov 19 15:14:29 +0000 2026", "replyCount": 13, "retweetCount": 29, "likeCount": 304, "conversationId": "2123434745728045425", "author": {"username": "annabellschfr", "name": "Annabell", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011353913790787584/iPsZOGFe_normal.jpg"}, "authorId": "1647507888209002499", "article": {"title": "Evaluating proactive agents", "previewText": "Proactive agents like Muse, Grok Bot and Instinct act without being asked. Most of their decisions end in \"do nothing\", and nobody reviews them. Here's how to make sure proactive agents are proactive", "titleZh": "评估主动式智能体", "previewTextZh": "Muse、Grok Bot 和 Instinct 等主动式智能体无需指令就会行动。但它们的大多数决策最终都是“什么也不做”，而且无人审查。以下介绍如何确保主动式智能体真正主动起来。"}, "translationZh": "评估主动式智能体"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-20T03:36:00+00:00", "createdAtBeijing": "2026-11-20T11:36:00+08:00", "createdAtLocal": "11-20 11:36 北京", "url": "https://x.com/Xudong07452910/status/2123621353211240772", "themeId": "editorial", "signalScore": 83, "editorial": {"id": "2123621353211240772", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "主动式 Agent 的决策记录与评测", "evidence": "连没行动的那些也要留着", "rationale": "提供决策留痕、漏报误报及分级门槛方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2123872534970208421", "track": "research", "source": {"id": "2123872534970208421", "text": "Inkling 2 Mini is a looped transformer that runs on a laptop.\n\nLooping lets a model think more and write less. At this scale, its thought process remains monitorable; this may not stay the case. We’re also sharing a variable-loop research model to enable further study.", "createdAt": "Fri Nov 20 20:14:06 +0000 2026", "replyCount": 105, "retweetCount": 187, "likeCount": 2630, "conversationId": "2123872534970208421", "author": {"username": "miramurati", "name": "Mira Murati", "profileImageUrl": "https://pbs.twimg.com/profile_images/2057853902918455296/D_nfq15L_normal.jpg"}, "authorId": "180115578", "quotedTweet": {"id": "2123871643797995872", "text": "Some of you thought that Inkling 2 Small was too big at 594B parameters. We heard you: Inkling 2 Mini is a looped transformer with just 26B parameters, small enough to run on your laptop, powerful enough for agentic work with a score of 20.1 on AA Index.\nhttps://t.co/9HzaUMwghb", "createdAt": "Fri Nov 20 20:10:34 +0000 2026", "replyCount": 215, "retweetCount": 474, "likeCount": 4546, "conversationId": "2123871643797995872", "author": {"username": "thinkymachines", "name": "Thinking Machines", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075275500420001792/Q9J4M1DL_normal.jpg"}, "authorId": "1891523745929732096", "translationZh": "有人觉得 Inkling 2 Small 的 5,940 亿参数太大了。我们听到了：Inkling 2 Mini 是一款仅有 260 亿参数的循环式 Transformer 模型，小到能在笔记本电脑上运行，也足以胜任智能体任务，在 AA Index 上得分 20.1。\nhttps://t.co/9HzaUMwghb"}, "expert": {"priority": "P1", "domain": "AI 研究 / 安全", "name": "Mira Murati", "role": "Thinking Machines Lab / 创始人兼 CEO", "why": "新前沿实验室，研究和产品战略值得持续跟踪", "handle": "miramurati"}, "createdAtIso": "2026-11-20T20:14:06+00:00", "createdAtBeijing": "2026-11-21T04:14:06+08:00", "createdAtLocal": "11-21 04:14 北京", "url": "https://x.com/miramurati/status/2123872534970208421", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2123872534970208421", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Inkling 2 Mini循环Transformer发布", "evidence": "just 26B parameters", "rationale": "发布具体模型与可变循环研究版本，性能为自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Inkling 2 Mini 是一款可在笔记本电脑上运行的循环式 Transformer 模型。\n\n循环机制让模型多思考、少输出。在这一规模下，其思考过程仍可监测，但未来未必如此。我们还分享了一款循环次数可变的研究模型，以支持进一步研究。"}, "avatar": "https://pbs.twimg.com/profile_images/2057853902918455296/D_nfq15L_normal.jpg"}, {"id": "2123581983561298148", "track": "agent", "source": {"id": "2123581983561298148", "text": "不换模型、不改 Harness，Agent 成本可以降 62.5%。\n\nBaseten 这篇讲的是「按需加载工具」。平时挂的 MCP 越多，每次请求塞进上下文的工具说明就越多，他们只挂了 3 个 MCP，就多出约 14 万 token。\n\n换成按需加载以后，一开始只给工具名和一个搜索工具，约 1.3k token，模型用到哪个再加载哪个。\n\n他们用 GLM 5.3 测下来，编码任务成本降了 62.5%，速度快了 26.2%。另外有个小坑，Claude Code 和 Codex 接第三方开源模型时会默认关掉这个功能，要记得打开。\n\n工具越挂越多的时候，先别急着换模型，可以先看看上下文里装了多少用不上的东西。", "createdAt": "Fri Nov 20 00:59:33 +0000 2026", "replyCount": 12, "retweetCount": 7, "likeCount": 58, "conversationId": "2123581983561298148", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2123473318590259625", "text": "Inference field notes: Make your agent 62.5% cheaper without changing your model or harness", "createdAt": "Thu Nov 19 17:47:46 +0000 2026", "replyCount": 18, "retweetCount": 21, "likeCount": 165, "conversationId": "2123473318590259625", "author": {"username": "thealexker", "name": "Alex Ker 🔭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1665403369136046080/ruOIyOi3_normal.jpg"}, "authorId": "991646232291442688", "article": {"title": "Inference field notes: Make your agent 62.5% cheaper without changing your model or harness", "previewText": "The best way to cut costs and speed up your agents has always been hidden in plain sight.\nBuilding harnesses have evolved from a discipline of addition to one of subtraction as we move into a world of", "titleZh": "推理实践笔记：无需更换模型或智能体运行框架，即可将智能体成本降低 62.5%", "previewTextZh": "降低成本、加快智能体运行速度的最佳方法，其实一直就在眼前。\n随着我们迈入一个……的世界，智能体运行框架的构建方式已从做加法转向做减法。"}, "translationZh": "推理实践笔记：无需更换模型或智能体运行框架，即可将智能体成本降低 62.5%"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-20T00:59:33+00:00", "createdAtBeijing": "2026-11-20T08:59:33+08:00", "createdAtLocal": "11-20 08:59 北京", "url": "https://x.com/Xudong07452910/status/2123581983561298148", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2123581983561298148", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "按需加载工具降低 Agent 成本", "evidence": "编码任务成本降了 62.5%", "rationale": "转述测试数据并说明加载机制与配置注意点"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2123763037404274957", "track": "creative", "source": {"id": "2123763037404274957", "text": "想把一段访谈剪成竖屏短视频，需求其实只有几句话：删掉开头的准备时间，去掉长停顿，加上字幕，声音调到合适大小，最后导出一个能发到社交平台的版本。\n\n可真正操作时，你面对的往往是一整套流程：找时间点、剪片段、处理横竖屏、调声音、排字幕、选编码、检查文件。\n\n哪怕让 AI 帮忙写 FFmpeg 命令，也可能碰上另一种麻烦——命令执行成功，字幕却被裁掉了；文件导出来了，人物却只剩半张脸；AI 说“完成”，你打开视频才发现音画错位。\n\nffmpeg-skill 想解决的，是把“AI 会写命令”变成“AI 能按流程处理、检查和交付视频”。\n\n可以让 Claude Code、Cursor、Codex 这些 AI 编程助手，直接调用本地 FFmpeg 帮你干这些活。你描述需求，它负责操作，不用自己研究一长串命令。\n\n它也不只是给 AI 塞了一份“剪视频提示词”。项目提供了 42 个工具，把剪切、拼接、字幕、声音处理、格式导出等操作封装好了，还设计了一套流程：\n\n先读取素材的真实参数，再执行处理，最后检查输出，生成截图看看构图和字幕有没有问题。我在 Windows 上跑了一遍基础链路，素材检测、精确剪切、竖屏裁切和截图生成都能正常完成。\n\n我觉得它最适合口播、访谈、课程录屏这种流程比较固定的内容。\n\n比如已经选好了几段素材，让它加字幕、统一声音、分别导出横屏和竖屏版本，这种活很有发挥空间。\n\n视频加工在本机完成，不需要额外的视频处理 API Key；不过，如果你用的是云端 AI 助手，模型费用和截图、文字是否上传，还是要另外看。", "createdAt": "Fri Nov 20 12:59:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 1, "conversationId": "2123763037404274957", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2118898231291597254", "text": "让编程 Agent 开始拍动画，离好用还有多远？\n\n以前用 AI 做视频，基本都是输入提示词生成一段画面，效果不满意就重新生成。\n\nhuashu-art-motion有意思的地方，是把“用 AI 做动画”变成了一套可以反复修改、逐帧渲染和检查的代码工作流：\n\nAI 负责理解题材、设计分镜和写代码，程序负责画场景、组织运动，再把画面导出成视频。需要复杂人物时，还可以接入生成图片或已有角色帧。\n\n项目目前整理了 53 张艺术风格配方卡，其中 36 种是已有实做风格，另外 17 种还处于研究阶段。梵高、莫奈、水墨、像素风这些都有。官方还展示了名画穿越、超级玛丽、Clawd 博物馆奇妙夜等动画案例，效果挺有想象力。\n\n提供的 9 种解说动画语法，包括白板动画、动态图表、数学公式演示、产品发布会动效、动态文字等。\n\n对经常做科技解说、产品介绍、知识视频的人来说，值得关注的也不只是名画穿越。白板推导、财经图表、截图拼贴、发布会动效，可能才是更容易反复用上的部分。\n\n但它也有明确门槛：需要支持 Skill 的编程 Agent、本地渲染环境，以及你对画面和节奏的持续判断。装上一条命令，不等于每种风格都能自动产出成熟成片。", "createdAt": "Sat Nov 07 02:48:00 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 3, "conversationId": "2118898231291597254", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118539682711851008/img/6cNvKzxbu2m7jagy.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118539682711851008/img/6cNvKzxbu2m7jagy.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118539682711851008/vid/avc1/1920x1080/EDB_XA6vlieCNx8a.mp4?tag=29", "durationMs": 184634}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122584896220852224/img/rlSDyhiGIzYD3yJ6.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122584896220852224/img/rlSDyhiGIzYD3yJ6.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122584896220852224/vid/avc1/1920x1080/2SjsnxI5ceoBf1yc.mp4?tag=29", "durationMs": 187777}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-20T12:59:00+00:00", "createdAtBeijing": "2026-11-20T20:59:00+08:00", "createdAtLocal": "11-20 20:59 北京", "url": "https://x.com/sitinme/status/2123763037404274957", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2123763037404274957", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "ffmpeg-skill本地视频加工与检查流程", "evidence": "素材检测、精确剪切、竖屏裁切和截图生成", "rationale": "介绍完整加工流程并自述基础链路验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2123852806213730744", "track": "agent", "source": {"id": "2123852806213730744", "text": "AI downloads broke the usual CDN model\n\nSince this summer, we're running our own CDN at Hugging Face. It's shipping almost 1 exabyte per month, which means, in practice, about 420 GB every second, through 80,000 requests per second.\n\nWhy did we need to build our own?\n\nWell, CDNs were designed to ship many small web files to many people. AI downloads are pretty different: it's a few enormous files, a significant part of them pulled by machines.\n\nThis changes a lot of design assumptions.\n\nYou're not caching small objects close to users in hundreds of cities anymore: these users are for a big part GPU clusters sitting in a handful of cloud regions.\n\nAnd a cached web page is useful to 1,000 visitors, while a cached 1,000 GB model is useful to far fewer clients, but each one wants all of it, immediately.\n\nSo we've built our own CDN, with caches adapted to massive objects, able to handle release-day mega-floods and multiple giant datasets and trending models being pulled at once.\n\nThe team made a live map of it at https://t.co/hx0ZISQWDo\n\nHard to stop watching it - it's quite mesmerizing", "createdAt": "Fri Nov 20 18:55:42 +0000 2026", "replyCount": 12, "retweetCount": 11, "likeCount": 98, "conversationId": "2123852806213730744", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123851902131511296/img/4bilo1GdL8ah3xos.jpg", "width": 2048, "height": 1445, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123851902131511296/img/4bilo1GdL8ah3xos.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123851902131511296/vid/avc1/2780x1962/_-RvOh3N1LKpAWy9.mp4?tag=29", "durationMs": 45512}], "expert": {"priority": "P0", "domain": "开源模型 / Hugging Face", "name": "Thomas Wolf", "role": "Hugging Face / 联合创始人兼 CSO", "why": "Transformers 生态和开源模型讨论的重要人物", "handle": "Thom_Wolf"}, "createdAtIso": "2026-11-20T18:55:42+00:00", "createdAtBeijing": "2026-11-21T02:55:42+08:00", "createdAtLocal": "11-21 02:55 北京", "url": "https://x.com/Thom_Wolf/status/2123852806213730744", "themeId": "editorial", "signalScore": 82, "editorial": {"id": "2123852806213730744", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Hugging Face自建大模型下载CDN", "evidence": "caches adapted to massive objects", "rationale": "自述流量规模并解释大文件缓存与集群分布设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "AI 下载打破了传统 CDN 模式\n\n从今年夏天起，Hugging Face 开始运行自建 CDN。它每月分发近 1 EB 的数据，实际相当于每秒传输约 420 GB、处理 80,000 次请求。\n\n为什么要自建？\n\nCDN 原本是为向大量用户分发许多小型网页文件而设计的。AI 下载却很不一样：文件数量少、体积巨大，而且相当一部分由机器下载。\n\n这改变了许多设计前提。\n\n你不再是在数百座城市中、靠近用户的位置缓存小对象：这些用户很大一部分是集中在少数云区域的 GPU 集群。\n\n一个缓存网页可以服务 1,000 名访客，而一个缓存的 1,000 GB 模型能服务的客户端少得多，但每个客户端都希望立刻下载完整模型。\n\n因此，我们自建了 CDN，采用适配超大对象的缓存，既能应对发布当天的海量下载，也能支持多个巨型数据集和热门模型同时被下载。\n\n团队制作了实时地图：https://t.co/hx0ZISQWDo\n\n看得根本停不下来，实在太迷人了。"}, "avatar": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, {"id": "2123667995570413718", "track": "agent", "source": {"id": "2123667995570413718", "text": "Lauren Tan 写了一份自动化入门指南，核心思路是：先讲清目标，再教 bot 怎么做。\n\n说一点我跟她不一样的地方。\n\nLauren 自己很强，加上 Grok 模型可能还不够聪明，所以她把更多功夫花在教 Agent 做事上：把自己的最佳实践交给 Grok bot，让它像自己一样思考。\n\n我觉得 AI 比我聪明，用的模型也不局限于 Grok，所以我更强调目标和验收，至于中间的步骤，不太干涉。\n\n我的方法更像一个循环：目标 → 验收 → 改进，一轮一轮转下去。\n\n1. 目标\n\n告诉 AI 我想要什么。这一步谁都一样，必不可少。\n\n2. 验收标准（可选）\n\n告诉 AI 怎么自己检验结果好不好，这样它在把结果交给你之前，会先自己验收一遍。最好再给 Agent 配上验收用的工具，比如截图、网络检索、代码运行环境。\n\n比如我做新闻发布自动化，一条重要的验收标准就是：动笔之前必须先做事实核查，确保内容真实、有出处。\n\n有些任务还可以沉淀出测试集或者自动化测试代码，每次跑完自动验一遍。\n\n3. 先跑起来再调整\n\n目标讲清楚了，就可以先让 Agent 跑一遍看看。就像拿到一把枪，先朝靶子开一枪，打完就知道离靶心差多少、往哪边偏，接下来怎么调心里就有数了。\n\n至于它具体是怎么执行的，不一定要看得很细，现在大部分任务 Agent 都做得挺好。不放心的话，看一看、指导一下也没问题。\n\n调整结果才是最考验专业水准的地方。你自己得知道什么是好的，不然只能 AI 生成什么就接受什么，结果多半好不到哪去。\n\n光看出来不好还不够，还得能准确地描述给 AI，让它知道往哪个方向改。\n\n这样来回几次，结果才会慢慢稳定下来。但不管怎么说，先跑起来最重要，跑起来了才有东西可以优化。\n\n4. 让它自己进化\n\nAgent 有能力自我进化，前提是把经验教训记下来。现在的 Agent Harness 虽然都有记忆功能，但不一定会主动记录自动化任务里遇到的问题。\n\n所以我通常从两个层面，让 Agent 自己提升任务的执行质量。\n\n一个是把最佳实践沉淀成 Skill（包括工具）。比如我给 Agent 一个目标，来回打磨几次，它完成得很好。这时候如果就不管了，下次新开一个会话，记忆就没了；就算去翻历史会话，里面也有太多无关信息。不如趁热让它把这次的最佳实践做成 Skill。\n\n另一个是让它主动记录执行过程中的经验教训，再回头改进 Skill 本身。\n\n比如我做逆向任务，每一轮执行完都让 Agent 往 lessons.md 里记一笔：有教训就写下来，没有就跳过。然后让模型自己评估，要不要去优化 Skill 的说明和脚本。\n\n这样一轮轮下来，Agent 干活就越来越熟练。\n\n这种自我进化也有副作用：Skill 会越来越臃肿，所以要定期重构清理一下，这事交给 Agent 自己做就行。\n\n每次重构完，记得把以前的测试集和自动化测试重新跑一遍，免得删掉不该删的东西。\n\nLauren 是把人的经验教给 Agent，我是定好目标和验收，让 Agent 自己跑、自己积累经验。模型越聪明，后一种越省心。", "createdAt": "Fri Nov 20 06:41:20 +0000 2026", "replyCount": 87, "retweetCount": 60, "likeCount": 398, "conversationId": "2123667995570413718", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2123159537016533493", "text": "Automate Anything with Grok Bot", "createdAt": "Wed Nov 18 21:00:54 +0000 2026", "replyCount": 1206, "retweetCount": 1853, "likeCount": 17180, "conversationId": "2123159537016533493", "author": {"username": "poteto", "name": "lauren", "profileImageUrl": "https://pbs.twimg.com/profile_images/2049256514091929600/Qu4030T2_normal.jpg"}, "authorId": "2832427459", "article": {"title": "Automate Anything with Grok Bot", "previewText": "Automation can be surprisingly hard to get right, even for people who do it every day. I’d like to share how I approach it, at work and in my personal life, and how Grok Bot can help you take on more", "titleZh": "用 Grok Bot 自动化处理任何事", "previewTextZh": "即使每天都在做自动化，要把它做好也可能难得出乎意料。我想分享自己在工作和生活中处理自动化的方法，以及 Grok Bot 如何帮你完成更多事情。"}, "translationZh": "用 Grok Bot 自动化处理任何事"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-20T06:41:20+00:00", "createdAtBeijing": "2026-11-20T14:41:20+08:00", "createdAtLocal": "11-20 14:41 北京", "url": "https://x.com/dotey/status/2123667995570413718", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2123667995570413718", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "以目标验收和经验沉淀改进自动化", "evidence": "目标 → 验收 → 改进", "rationale": "提供验收工具、经验记录和技能回归方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2123593169451598137", "track": "agent", "source": {"id": "2123593169451598137", "text": "给 AI 改表加一道闸\n\nUniver 现在给自己的定位，是人和 agent 共用的 Office SDK。\n\n落到实处，就是 agent 不用模拟点击，也不用自己拼 xlsx，直接调 Facade API 写值、写公式、读结果。模型和工具编排由你的应用负责，Univer 只管表格这一层。\n\n我觉得最实用的是命令事件。表格里每一次修改都要走命令系统，univerAPI.Event 里有 BeforeCommandExecute 和 CommandExecuted 两个事件，前一个能在执行前检查，甚至直接取消。让 AI 动表之前挂一个监听，越权的改动当场拦下，改过的每一步也都留了记录。\n\n不想自己接的，官方做了一个 Univer CLI，给 agent 一个本地的 Office 工作区。在 Claude Code、Codex 这类 agent 里装上它的 Skill：\n\nnpx skills add dream-num/skills -s univer-cli -g\n然后直接说要一张带公式、数据验证和条件格式的工资表。agent 在隔离的草稿里改完，自己读回来核对一遍，再给你一个本地预览链接，合并还是丢掉由你决定。\n\n接 OpenClaw、DeepSeek Harness 的也有现成集成。提醒一句，CLI 能处理 Excel、Word、PPT 文件，文件转换在 Univer 里属于单独授权的能力，重度使用前先看一眼授权说明。", "createdAt": "Fri Nov 20 01:44:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2123593167572439407", "inReplyToStatusId": "2123593168813949248", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-20T01:44:00+00:00", "createdAtBeijing": "2026-11-20T09:44:00+08:00", "createdAtLocal": "11-20 09:44 北京", "url": "https://x.com/sitinme/status/2123593169451598137", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2123593169451598137", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AI表格操作权限拦截与草稿审阅", "evidence": "前一个能在执行前检查，甚至直接取消", "rationale": "给出命令拦截、隔离草稿及回读核验方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2123789406163394966", "track": "creative", "source": {"id": "2123789406163394966", "text": "Tokenhub 控制台地址：https://t.co/49HzF2vg4Q\n\n提示词：\n# 卡丁车竞速\n用 Three.js 做一个桌面浏览器单页卡丁车游戏。玩家坐在排位第三的红色卡丁车里，前面两辆、后面一辆。发车灯逐盏熄灭，按住 ↑ 就能冲出去。跑三圈，第一个冲线获胜。一场约两分钟。\n\n## 游戏缓慢\n用贴近车尾的追逐镜头。玩家应同时看见自己的头盔、两个外露的后轮和前方整个弯口。镜头跟随车辆行进方向，急转时车尾能先在画面里甩出去一点，然后镜头追上；压过路肩时只让车架和头盔颠一下，地平线保持稳。倒车或原地打转时镜头仍在车后。\n赛道设在海边的露天车场。黑色沥青、白色标线和红白路肩给出清晰的路面边界。维修棚旁叠着旧轮胎，海那边的防波堤上有一座白灯塔。从不同弯角都能认出灯塔，玩家跑完第一圈就能凭它记住弯道。用晴天下午的斜光照亮头盔和钢管车架，让轮胎下方留有紧贴路面的阴影。\n\n## 赛道设计\n做一条约 650 米长、至少能容三车并排行驶的原创闭合赛道。起跑直道约 100 米，尽头是一个宽右弯，新手松一点油就能过。随后是连续左右弯，引导玩家第二次转向前先把车摆正。赛道后半段安排一个掉头弯，从远处能看到弯外成排的黑轮胎和刹车标记。出弯接一段可以并排加速的回程，再转上终点直道。\n发车时先亮灯、后计时。对手中有一辆起步慢但直道快，一辆在弯前较早刹车，让玩家在第一圈就能找到超车机会。三辆车都沿实际道路行驶，超车时切到有空位的一侧。轻微擦碰让两车分开并损失少许速度，保留继续比赛的机会。\n\n## 驾驶玩法\n- ↑ 加速，↓ 刹车，← → 转向。静止后松开再按 ↓ 才倒车。屏幕上始终留一行键位提示。\n- 从静止到 60 公里/小时约 3 秒，直道极速约 85 公里/小时。松油门能滑行，踩刹车能在掉头弯前明显减速。低速时转向灵活，高速猛打方向会把车推向弯外。车辆运动、车轮转速和速度表共用同一个速度值。\n- 进掉头弯时允许两种跑法。新手早刹，贴内侧干净地转过去；熟悉后可以晚刹，松开油门让车尾略微外滑，再回正给油。轮胎尖叫随侧滑逐渐增强，恢复抓地时自然消失。\n- 压到红白路肩能听见连续的颠簸声；两个外侧轮子驶入草地时加速变慢。撞轮胎墙会掉速并沿墙滑开。按 R 可回到最近通过的赛道位置，恢复时避开正在经过的对手。\n\n## 界面与终点\n左上显示当前名次和圈数，右下显示速度。每圈结束短暂显示圈时差，把视线留给下一个弯。用按顺序通过的检查点确认有效圈数，倒车穿过终点或横切草坪不能多算一圈。玩家完成第三圈即显示名次、三圈用时和最快圈，点“再跑一次”直接回到发车位。暂停或切出页面时冻结全场。\n交付简体中文单个 `index.html`，Three.js 可用固定版本 CDN。交付前从第三位起跑完整跑三圈，在宽右弯试一次外线超车，在掉头弯分别全油门和提前刹车各过一次。两次路线应该明显不同。最后逆向越过终点一次，核对圈数。", "createdAt": "Fri Nov 20 14:43:47 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2123783304608714898", "inReplyToStatusId": "2123783304608714898", "author": {"username": "cnyzgkc", "name": "木马人", "profileImageUrl": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, "authorId": "1866821173755121666", "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "木马人", "role": "内容、视觉与多模态实践与观察", "why": "展示用 Python 自动渲染科普短片并解释制作方式，提供创作增量。", "handle": "cnyzgkc"}, "createdAtIso": "2026-11-20T14:43:47+00:00", "createdAtBeijing": "2026-11-20T22:43:47+08:00", "createdAtLocal": "11-20 22:43 北京", "url": "https://x.com/cnyzgkc/status/2123789406163394966", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2123789406163394966", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Three.js卡丁车游戏完整提示词", "evidence": "用 Three.js 做一个桌面浏览器单页卡丁车游戏", "rationale": "提供镜头、物理、赛道及验收细节，可复用"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, {"id": "2123883634411376870", "track": "research", "source": {"id": "2123883634411376870", "text": "if you're interested in simulation games, you'll like this research i worked on with @pedro_computer & @shreyko\n\nThe Grammar of Simulation\nhttps://t.co/AQRTHXVRF6\n\n⚙️ analysis of 199 sim mechanics (phys, econ, etc)\n🎮 found in 179 simulation games since the 60s\n🧠 46 AI/ML techniques\n🗺️ all mapped, and used to make predictions \n📚 formats: site, paper, book, videos\n\nstarted as a curiosity into what we've simulated in games so far, and just kinda kept going... 🙃", "createdAt": "Fri Nov 20 20:58:12 +0000 2026", "replyCount": 8, "retweetCount": 1, "likeCount": 23, "conversationId": "2123883634411376870", "author": {"username": "yoheinakajima", "name": "Yohei", "profileImageUrl": "https://pbs.twimg.com/profile_images/1452754543217831938/T2O-66Yy_normal.jpg"}, "authorId": "30439303", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123882382592008192/img/GAWi6FoqCfmAjzp0.jpg", "width": 2048, "height": 1337, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123882382592008192/img/GAWi6FoqCfmAjzp0.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123882382592008192/vid/avc1/2282x1490/2MEGkmNs8rHwdJKH.mp4?tag=29", "durationMs": 67983}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXmMrhxagAApkit.jpg", "width": 1698, "height": 916, "previewUrl": "https://pbs.twimg.com/media/HXmMrhxagAApkit.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXmMyuebEAArZyN.jpg", "width": 1636, "height": 1326, "previewUrl": "https://pbs.twimg.com/media/HXmMyuebEAArZ 的操作建议：\n\n1、创始人手动一个个去拉最初的付费用户\n2、给用户一张张手写感谢卡\n3、一对一教用户操作产品\n\n同时指出：如果某件事情容易规模化，那大厂更适合做。比如做广告、铺渠道、做品牌等。大厂更有钱、有人、有资源、有品牌，在可规模化的事上，创业者很难打败大公司。\n\n不可规模化的事，大厂去做很不划算，就往往不会去做。创业公司去做，反而有新机会。", "createdAt": "Fri Nov 20 01:40:44 +0000 2026", "replyCount": 14, "retweetCount": 18, "likeCount": 175, "conversationId": "2123592344561967492", "author": {"username": "lifesinger", "name": "Frank Wang 玉伯", "profileImageUrl": "https://pbs.twimg.com/profile_images/2117814870792196096/-3MKbfop_normal.jpg"}, "authorId": "16681326", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXiD-bMawAAqX33.jpg", "width": 1536, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXiD-bMawAAqX33.jpg:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "玉伯", "role": "企业落地与产品组织实践与观察", "why": "对 Agent 管理、目标分配和产品解法有成体系判断，补组织方法。", "handle": "lifesinger"}, "createdAtIso": "2026-11-20T01:40:44+00:00", "createdAtBeijing": "2026-11-20T09:40:44+08:00", "createdAtLocal": "11-20 09:40 北京", "url": "https://x.com/lifesinger/status/2123592344561967492", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2123592344561967492", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "初创产品通过人工服务获取早期用户", "evidence": "创始人手动一个个去拉最初的付费用户", "rationale": "给出早期获客与用户服务的具体操作"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2117814870792196096/-3MKbfop_normal.jpg"}, {"id": "2123678228011209063", "track": "tools", "source": {"id": "2123678228011209063", "text": "收藏了一堆文章、记了不少笔记，真正要用的时候，还是得自己翻、自己整理。\n\nObsidian 最近推出了 Grok Bot 官方插件，让 AI 可以直接搜索、创建和修改笔记，更新笔记之间的链接，还能抓取网页内容、创建 Bases 数据库视图和 Canvas 白板。\n\n这意味着，你可以把“查资料”和“整理资料”连起来。比如研究一个 AI 工具，让 Bot 把找到的内容整理成笔记、保留来源，再关联笔记库里已有的资料。Bases 可以用来筛选和对比项目，Canvas 则适合把零散信息画成关系图。每次研究的结果，都能留在自己的知识库里，方便以后继续用。\n\n它背后用的是 Obsidian 官方的 Skills，以及 CLI、Headless 等工具。\n\n简单理解，Skills 教 AI 怎么正确处理笔记，工具负责执行操作，Obsidian Sync 再把修改同步到其他设备。\n\n不过，具体能不能在电脑关机后 [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123731456992387072/img/sJxwHeAjy-GwBHus.jpg", "width": 1662, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123731456992387072/img/sJxwHeAjy-GwBHus.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123731456992387072/vid/avc1/1662x1080/4Ab7o2SfVB-fd3ES.mp4?tag=29", "durationMs": 51385}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXkI4Y5agAAWSjG.png", "width": 664, "height": 644, "previewUrl": "https://pbs.twimg.com/media/HXkI4Y5agAAWSjG.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXkI6NhbsAAFxrO.jpg", "width": 966, "height": 556, "previewUrl": "https://pbs.twimg.com/media/HXkI6NhbsAAFxrO.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXkI8WAbAAAc1cA.png", "width": 654, "height": 776, "previewUrl": "https://pbs.twimg.com/media/HXkI8WAbAAAc1cA.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXkI-E6a4AAJcfO.jpg", "width": 934, "height": 324, "previewUrl": "https://pbs.twimg.com/media/HXkI-E6a4AAJcfO.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "Tom Huang", "role": "内容、视觉与多模态实践与观察", "why": "直接公开 OpenDesign 动效制作、修复及产品迭代，视觉工具来源清楚。", "handle": "tuturetom"}, "createdAtIso": "2026-11-20T11:22:56+00:00", "createdAtBeijing": "2026-11-20T19:22:56+08:00", "createdAtLocal": "11-20 19:22 北京", "url": "https://x.com/tuturetom/status/2123738862908527046", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2123738862908527046", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "OpenMotion多模态模型与创作场景", "evidence": "涵盖音、图、视频、3D四大领域", "rationale": "提供具体模型名单与七类创作场景"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1033199673035522048/WI-JLSAc_normal.jpg"}, {"id": "2123713711777235156", "track": "tools", "source": {"id": "2123713711777235156", "text": "想自己搭一个 DeepSeek 聊天界面，又不想从头写代码，可以看看官方开源的 Chat Demo。\n\n它把这组能力组织成一个可运行的聊天前端：用户填入自己的 API Key，即可通过浏览器调用 DeepSeek 的服务；开发者也可以直接读源码，看看这些功能如何拼接成完整交互。\n\n但先把三个关键事实说清楚：\n\n1. 它是 DeepSeek 官方组织下的开源项目，定位是静态聊天示例。\n2. 不用自己部署应用后端，但聊天、搜索、文件处理和语音仍需要远程 API。\n3. 客户端代码采用 MIT 许可证，API 使用仍有费用和服务限制。\n\n安装流程比较直接：准备好 Git、Node.js 和 pnpm，下载项目后安装依赖，再启动开发服务即可。\n\n日常使用里，我觉得比较实用的是对话分支——同一个问题可以尝试不同问法，再切换查看不同版本；回答里的代码、表格和流程图也能直接展示，拿来学习、整理资料或者演示 AI 应用都挺方便。\n\n聊天记录还支持导入导出，不过导入会覆盖本地历史，操作前记得备份。", "createdAt": "Fri Nov 20 09:43:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 1, "conversationId": "2123713711777235156", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2121477476681728191", "text": "把 AI 工作台装进口袋，手机能接管多少原本属于电脑的任务？\n\n你可能遇到过这样的情况：电脑上的 AI 正在改代码，你刚好要出门；它执行到一半需要确认，你却只能等回到电脑前。\n\n或者，你在手机上想到一个小工具，想让 AI 直接做出来，却发现普通聊天软件只能给你一段代码，接下来的保存、运行、修改仍要自己折腾。\n\nDSH Go 想解决的，就是这段从“和 AI 聊天”到“让 AI 真正干活”的距离。\n\n它把 DeepSeek Harness 的使用入口搬到了 Android 手机上\n\n主要有两种用法：\n一种是在手机上准备运行环境，直接处理本机任务；\n另一种是连接远程电脑，把手机变成随身的操作入口。\n\n后者——出门在外，想看看任务进度、补充几句要求，或者继续推进电脑上的项目，不用每次都把笔记本掏出来。\n\n但它也有很明确的边界：本机运行不等于模型离线，连接电脑不等于控制电脑上所有软件，手机操控也不等于可以稳定、无人值守地接管一切。\n\n所以前提是远程电脑已经配置好，而且能连得上。\n\n上手可以先从一个小任务开始：下载适合自己设备的 APK，按照引导准备环境，再配置模型服务商、接口地址和 API Key。\n\n然后交给它一份文件，明确说清楚“处理什么、按什么规则、最后交付什么格式”。\n\n比如把消费记录整理成分类表格，就比一句“帮我分析一下”更容易得到可检查的结果。这里的“本机运行”也不等于离线大模型，模型请求仍然需要访问对应服务，费用取决于你的配置和用量。\n\n除了文件和远程任务，它还支持语音输入、插件，以及手机操控等功能。\n\n不过这些能力都有条件：模型要支持相应工具，插件可能需要额外配置，手机操控也需要授权。\n\n特别是读取屏幕时，内容可能发送给模型服务商，涉及隐私、支付或重要文件的操作，还是要自己盯住关键步骤。", "createdAt": "Sat Nov 14 05:37:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2121477476681728191", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{ const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
