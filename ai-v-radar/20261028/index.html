const DATA={"records": [{"id": "2115145479222665228", "track": "research", "source": {"id": "2115145479222665228", "text": "AI 用 24 天让计算机核对完数学史上最长的证明：定理成立，但其中一篇论文的证法有漏洞，AI 换了一种证法补上\n\n一个证明长达 1.5 万页，散落在 500 多篇论文里，几十年来没有一个人从头到尾读完过，它到底对不对？AI 数学公司 Axiom 10 月 26 日宣布，他们用几十个 AI agent 花了 24 天，把这个证明全部改写成计算机能逐步检查的代码，Axiom 说检查已经全部通过。\n\n这个证明对应的是“有限单群分类定理”，外号“巨大定理”，约 100 位数学家花了几十年才完成。\n\n【这个定理讲什么】\n\n先说“群”。一个立方体，你能找到 24 种转法，转完它看起来跟没动过一样。数学家把这样一组“转完看起来不变的操作”叫做一个群，它是研究对称的工具。\n\n整数可以拆成质数相乘，质数再也拆不动。群也一样，可以拆成一些拆不动的基本单位，叫“单群”。有限单群分类定理给出了一张完整清单：所有基本单位，要么属于几个有固定规律的大家族，要么是 26 个不属于任何家族的特例。最大的特例叫“魔群”，元素个数是 8 后面跟 53 个零。\n\n找到这些单群不算最难，难的是证明清单里没有漏掉任何一个。\n\n【为什么要计算机来查】\n\n证明太长，人查不过来，出过错也不奇怪。1983 年，牵头的数学家宣布证明完成，后来发现其中一块根本没写完，直到 2004 年才用一本 1221 页的书补上。\n\nAxiom 用的检查工具叫 Lean。把证明翻译成 Lean 能读的代码后，它会一步一步核对：每一步是不是真的能从前面推出来。人读论文时会默认“这步显然成立”，Lean 不接受，必须写出来。2012 年有团队用类似工具，花了约 6 年才查完这个定理里一篇 255 页的论文。\n\n【查出了什么】\n\n先说结论：定理本身没错，清单还是那张清单。\n\n问题出在中间一篇论文的证法上。整个证明要用到一个叫“不平衡群定理”的中间结论，Axiom 照着数学家 John Walter 1986 年给出的证明来翻译，AI 发现这个证明里引用的一个说法是错的，并举出了具体的反例。好比一道几何题，答案是对的，但书上的解法中间用了一个不成立的条件，解法得换。\n\nAxiom 请教了当年参与原始证明的数学家 Richard Lyons 和 Ronald Solomon，借用 Solomon 1976 年的一套思路，由 Axiom 的 AI 写出一个新证法，绕开了出错的那一步，也通过了 Lean 的检查。新证法已经整理成一篇 35 页的论文。\n\n除此之外，查出来的大多是笔误、表格写错、少写了前提这类小毛病。Axiom 博客说其中 34 处值得专门处理，完整清单还没公布。Axiom 的推文说法更重，称修了“几百处重大勘误”。\n\n【AI 怎么干的】\n\n几十个 AI agent 分工：有的把大的论证拆成小定理，有的去找已有结果，有的写 Lean 代码。人类数学家处理 AI 卡住的数学难题，工程师维护系统。最后写出约 4310 万行代码（推文说约 5000 万行，博客和官网都是 4310 万），其中约 120 万行来自清华大学求真书院团队此前开源的同类项目。\n\nAI 有时会把还没证明的东西直接当成已知条件用，Axiom 发现后删掉了几万行代码重来。用的是哪些 AI 模型，Axiom 没说。\n\n【能全信吗】\n\nLean 能保证推导的每一步都对，但它判断不了代码开头写的那句“定理”是不是真的就是有限单群分类定理。如果这句话翻译走了样，后面证得再对，证的也是另一件事。这部分只能靠人读。Axiom 邀请群论学家和 Lean 社区自己重跑检查、核对这句话。目前这还是 Axiom 自己的发布，还没有外部独立核查的结果。\n\nAxiom 博客：https://t.co/pDcLp6CnWc\n项目网站：https://t.co/3ArK3yFvEt\nAxiom 推文：https://t.co/BPNOxbaIqH", "createdAt": "Tue Oct 27 18:15:54 +0000 2026", "replyCount": 20, "retweetCount": 6, "likeCount": 32, "conversationId": "2115145479222665228", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115089794867040584", "text": "The largest math proof in human history is now computer-verified.\n\nToday, Axiom announces a complete Lean auto-formalization of the Classification of Finite Simple Groups, the \"periodic table of symmetry.\"\n\nAbout 15,000 pages, built by over 100 mathematicians across generations. https://t.co/Y1P26abyPQ", "createdAt": "Tue Oct 27 14:34:38 +0000 2026", "replyCount": 314, "retweetCount": 3393, "likeCount": 4661, "conversationId": "2115089794867040584", "author": {"username": "axiommathai", "name": "Axiom", "profileImageUrl": "https://pbs.twimg.com/profile_images/2020254827117432832/Yad4149b_normal.jpg"}, "authorId": "1972828074908749824", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HVpOm-eaUAAZZVL.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HVpOm-eaUAAZZVL.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115089406541680640/vid/avc1/1920x1080/61wlbcovVJMf4Smo.mp4?tag=29", "durationMs": 363821}], "translationZh": "人类历史上规模最大的数学证明，如今已通过计算机验证。\n\n今天，Axiom 宣布，已用 Lean 完成有限单群分类定理的自动形式化。这一定理被誉为“对称性的元素周期表”。\n\n整套证明约 15,000 页，由跨越数代的 100 多位数学家共同完成。https://t.co/Y1P26abyPQ"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-27T18:15:54+00:00", "createdAtBeijing": "2026-10-28T02:15:54+08:00", "createdAtLocal": "10-28 02:15 北京", "url": "https://x.com/dotey/status/2115145479222665228", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2115145479222665228", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Axiom宣布有限单群分类证明Lean形式化", "evidence": "目前这还是 Axiom 自己的发布", "rationale": "详述形式化成果、证明修补与待独立核查限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115183164905906513", "track": "research", "source": {"id": "2115183164905906513", "text": "Anthropic 公布 Claude 参与新药研发的进展：设计、实验、写申报材料都在做，最快 2028 年底进入人体临床试验\n\nAnthropic 10 月 27 日发文，介绍过去几个月 Claude 在新药研发里做了什么：和 6 家药企、生物技术公司深度合作，还收购了一家只有一个人的药物公司。先说结论：这些项目基本还在实验室和动物实验阶段，没有一种药在人身上试过。Anthropic 说，进度最快的一款，最早 2028 年底才可能开始人体临床试验。\n\n一款新药从想法到上市通常要十年以上，要找目标、设计分子、反复改良、解决量产、写申报材料、做临床试验。常听说的“AI 设计分子”只是其中一环，Anthropic 想让 Claude 每个环节都参与。\n\n【Claude 在各家公司干了什么】\n\n抗癌疗法 CAR-T 是给病人的免疫细胞装上一段识别癌细胞的“基因说明书”。Generate Biomedicines 的科学家用 Claude Code 把说明书里的一段缩短了约 70%，腾出地方加别的指令，好让它将来也能治实体肿瘤。实验室里新版本效果反而更好，免疫细胞表面认癌细胞的“探头”多了约 10 倍。\n\nDivergence Labs 在做食物过敏药，需要一种分子把引发过敏的 IgE 从免疫细胞上撬下来。Claude 基本自己干，一个月出了约 3.5 万个设计，筛出来的候选里有 3 个撬得比现有药还多。\n\nBigHat Biosciences 让 Claude 给两个候选药提修改建议，10 周做出并测了约 1010 个变体。最好的版本抓目标的牢固程度提高 10 倍以上，其中一个结块速度慢了 100 多倍，更容易生产和保存。\n\nEnveda 的生产化学家最多 75% 的时间花在文书上。Claude 审 1061 页生产文件，人工发现的 11 处问题全找到了，还多找出 7 处人漏掉的，审查时间从 25 小时以上降到 3 小时以内。一份重要申报文件，Claude 4 小时写出初稿，人工大约要 3 个月。\n\n此外，百时美施贵宝（BMS）在用 Claude 评估早期药物的临床试验方案，投资机构 The Column Group 正成立一家用 Claude 运转、让小团队同时推进很多药物项目的新公司。\n\n【一个人的药物公司】\n\nCody Tranbarger 一个人开了家药物公司 Mithril Medicine，研究罕见的儿童肌营养不良。合同、物流、和 11 家外部实验室的实验安排都交给 Claude 打理，不到 18 个月，就把一种病的治疗思路从想法做到在小鼠身上见效。Anthropic 收购了这家公司，金额没公布，Cody 加入 Anthropic 继续做。\n\n这种病叫 LAMA2 先天性肌营养不良。病孩天生缺一种把肌肉纤维固定住的蛋白，肌肉从出生起就开始坏死，据技术报告引用的研究，42 个完全缺这种蛋白的孩子里只有 1 个能自己走路，目前没有能改变病程的疗法。Mithril 设计了一种两头的抗体，把肌肉里残存的另一种相近蛋白重新“钉”到肌肉上。小鼠实验里，用药组前腿的力量和握力大约是没用药组的两倍。\n\n【这些成果能信几分】\n\n成果都来自合作方和 Anthropic 自己发布的技术报告和预印本，文章没提有外部独立核查。Mithril 的报告标明未经同行评审，小鼠实验是预实验，用药组 7 只、对照组 4 只，按窝比较后差异在统计上还差一点达到通常的显著标准，报告自己也说要做严格的重复实验才能确认。\n\n报告还写了 Claude 的失误：作者检查了 Claude 一周工作里的 6 处错误，5 处是 Claude 自己发现的，但至少 3 处已经随人审改过的邮件发了出去，其中两处过了 4 天多才被发现。Claude 只起草邮件，发送都由人决定。\n\n原文：https://t.co/P5Bw0mYzJ5\nMithril 技术报告：https://t.co/CtBsbz4vAi", "createdAt": "Tue Oct 27 20:45:39 +0000 2026", "replyCount": 14, "retweetCount": 5, "likeCount": 33, "conversationId": "2115183164905906513", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115178675050307942", "text": "Over the past few months, Anthropic scientists have engaged in deep research partnerships with six organizations developing new medicines. We've also begun drug discovery efforts of our own.\n\nIn doing so, we’ve learned much more about how Claude can support the many stages of drug development.\n\nIn this blog post, we share some early results from these efforts, and describe how this work fits in with our wider ambitions in the life sciences.\n\nhttps://t.co/EVbxkdDTgJ", "createdAt": "Tue Oct 27 20:27:48 +0000 2026", "replyCount": 316, "retweetCount": 367, "likeCount": 4119, "conversationId": "2115178675050307942", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "translationZh": "过去几个月，Anthropic 的科学家与六家新药研发机构开展了深入的科研合作。我们也启动了自己的药物发现工作。\n\n在此过程中，我们进一步了解了 Claude 如何为药物研发的多个阶段提供支持。\n\n这篇博文分享了这些工作的部分早期成果，并介绍了它们如何融入我们在生命科学领域的整体愿景。\n\nhttps://t.co/EVbxkdDTgJ"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-27T20:45:39+00:00", "createdAtBeijing": "2026-10-28T04:45:39+08:00", "createdAtLocal": "10-28 04:45 北京", "url": "https://x.com/dotey/status/2115183164905906513", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2115183164905906513", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Claude参与药物研发的早期成果与局限", "evidence": "没有一种药在人身上试过", "rationale": "详述研发成果、实验规模与错误，明确未经独立核查"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2114909091101573476", "track": "agent", "source": {"id": "2114909091101573476", "text": "CS 329Z: Engineering AI Agents\nStanford / Fall 2026 @stanfordnlp\nhttps://t.co/Ko6UarsQff\n\n来到了第 10 课「Evaluating Agents — Terminal-Bench and Harbor」， @alexgshaw @ryan_marten 来分享Terminal-Bench 与 Harbor 怎么把 Agent 当成可迭代工程。\nhttps://t.co/OCrE9ETWQX\n\n软件世界正从「规则是真相」（手写代码）转向「评测是真相」（agent 靠 eval 开发、软件再由 agent 生成）。Terminal-Bench 用终端任务把这套做成可跑的社区基准；Harbor 把同一套任务格式与基础设施产品化，让你自己造百万级 eval，不是只消费某一个榜。\n\n从演绎到归纳：为什么 Evaluator 成了新角色\n讲义先用软件史铺垫：机器码 → 汇编 → 高级语言（Hoare：程序性质原则上可从文本演绎出来）→ ML 的「输入+输出 → 规则」→ LLM → Agents。Shannon 的「真能思考、学习、操纵环境」那句话被用来收束：数字技术开发整体在变归纳。三层递进：模型从数据学；agent 靠评测养；软件由 agent 生成。于是 Specifier 仍是软件工程师，但 Evaluator 成为缺失的工种；规格的落点从「写规则」变成「写 evaluation」。\n\nTerminal-Bench：bash 当「万能工具」的基准\n核心洞察：终端里几乎什么都能干（对比一长串 AWS CLI）。社区数字（讲义页）：64 张 model card、171 贡献者、1k+ GitHub 参与、5k+ Discord、7M+ 次 benchmark run；首 commit 约 2025-01，Claude Code 约 2025-02 发布，时间线对应 coding agent 爆发与终端基准同窗。\n\n任务解剖示例：把 /app/schematic.png 的 2D 示意图变成 /app/out.step，verifier 不是「看起来像」，而是一串几何断言（合法 STEP、水密、体积/表面积/惯性矩/凸包/拓扑/平均曲率等）。结构拆成：INSTRUCTION.MD + ENVIRONMENT/DOCKERFILE + TEST/…。\n\n共用词汇（任务怎么长什么样）\nTask / Trial / Benchmark / Verifier(Grader) / Trajectory(Trace) / Evaluation harness / Agent harness。任务目录约定为 agent 无关、易定义、可移植：\ninstruction.md · task.toml · environment/Dockerfile · solution/solve.sh · tests/test.sh\n\n写任务要问：你在测什么、测对了吗？三条硬约束：指令与 verifier 对齐、防 reward hacking、真实/公平/有趣。指令要充分指定，同时尽量短、尽量像真人说话。环境尽量贴近 prod：真软件/多容器优于 mock；「开放世界/联网」有 tradeoff；能 bake 进镜像的网络依赖就 bake，减 flakiness。Verifier 是对环境状态的 outcome 分类器：看混淆矩阵；与 instruction 需求 1–1；程序化检查 + LLM judge 并用。\n\nReward hacking 与隔离\nAgent 环境锁定、verifier 环境隔离、agent 代码执行隔离；产物从 agent env 交到 verifier env 再跑测试，避免 agent 改测试或摸到打分器。Oracle solution/ 用来调试 verifier/环境，动作应像 agent 会走的路径，忌 hardcoded 捷径。\n\nInfra、QA、版本、结果\nEval infra：容错、可复现、可并行、本地/云 sandbox 可移植；rollout 覆盖 test/train/prod。Task QA：任务会以很微妙的方式坏掉；静态检查 + agentic 检查（agent judge、oracle agent、frontier agents、cheat agents，并对轨迹做 judge）。CI/CD 视角：任务就是软件，软件有 bug，用量带来 bug 报告、flakiness、infra 噪声、新模型新行为、假阴性、reward hacking；https://t.co/l8GwCDbhH1 上有版本与 issue 流。\n\n版本语义（讲义三列）很实用：\n· 主版本 (x+1)：改 agent 环境 → 整测重跑（新任务、欠/过指定 prompt、数据工具、资源）\n· 次版本 (y+1)：改 verifier → 可 regrade（过严、清 hack、调 judge、减 flakiness、改奖励）\n· 补丁 (z+1)：元数据 → 可 reuse（文档、钉依赖、修笔误、oracle 偶发）\n结果要求：每一行都有完整收据，每 trial 的轨迹、日志、产物、奖励。", "createdAt": "Tue Oct 27 02:36:35 +0000 2026", "replyCount": 2, "retweetCount": 1, "likeCount": 12, "conversationId": "2114909091101573476", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2095330467000328632", "text": "CS 329Z: Engineering AI Agents\nStanford / Fall 2026 @stanfordnlp \nhttps://t.co/ynvpE8PKFE\n\n课程定位：从\"模型\"到\"系统\"的工程学\n覆盖：简单 LLM 流水线 → 复合 AI 系统 → 自主 Agent。三位讲师的背景也高度互补：\n@Diyi_Yang（斯坦福 NLP 教授，人机交互与社会计算方向）\n@michaelryan207（DSPy 核心贡献者，自动评估 AutoMetrics 作者）\n@jyangballin（SWE-agent / SWE-bench / SWE-smith 作者，软件工程 Agent 领域最重要的研究者之一）\n\n# 课程主线：三大工程挑战\n贯穿全课的三个核心问题——分解（decomposition）、数据（data）、评估（evaluation）。11 周的内容基本围绕这三条线展开，可以分为五个模块：\n\n模块 1：构建基元（Week 2–3）\n· LLM 作为构建材料：API/SDK（litellm）、结构化输出、约束生成、解码策略、test-time compute、上下文工程、模型选型与成本/延迟权衡\n· RAG：embedding、向量库、分块策略、混合检索、cross-encoder 与 ColBERT 后期交互\n· 工具调用：函数调用 API、MCP（Model Context Protocol）、工具设计、代码沙箱、错误处理与重试\n\n模块 2：框架与设计模式（Week 3–5）\n· 框架层：DSPy（signature / module / optimizer）、LangChain/LangGraph、LlamaIndex，重点是\"框架抽象了什么 vs. 你手写了什么\"\n· 设计模式：workflow vs. agent 的分类学，五种可组合 workflow 模式，ReAct / plan-and-execute / reflection，\"scaffold（脚手架）本身就是设计决策\"\n· 记忆架构：短期/长期记忆、记忆作为工具动作、文件系统作为外化记忆、跨 Agent 记忆（MemGPT、Mem0、Generative Agents）\n· 多 Agent 系统：编排模式、handoff 与状态传递，以及一个很有态度的对照阅读——既读 AutoGen，也读《Why Do Multi-Agent LLM Systems Fail?》和 Neubig 的《Don't Sleep on Single-agent Systems》\n\n模块 3：优化（Week 5）\n· 从提示词到微调的全景：GEPA、MIPROv2、OPRO、TextGrad（提示优化）；LoRA/QLoRA、蒸馏、RLHF/DPO（权重优化）；test-time scaling（推理算力）\n· 核心问题是决策框架：什么时候优化 prompt、什么时候优化 weights、什么时候堆推理算力\n\n模块 4：数据与评估（Week 6–8）——最有分量的部分\n· 数据：trace、demonstration、feedback 三类数据；训练数据 vs. 评估数据；数据飞轮；合成数据；从 Agent 轨迹构建数据集（SWE-smith）\n· 评估基础：为什么 eval 难；4 元组框架（request / environment / stopping criteria / scorer）；好 benchmark 的性质；tinyBenchmarks\n· 评估基础设施：三类 grader、LLM-as-judge 的 prompt 设计与已知偏差、pairwise vs. pointwise、非确定性指标 pass@k vs. pass^k、harness 设计\n\n模块 5：安全与前沿（Week 8–11）\n· 安全：工具访问的隐私风险、prompt injection（含间接注入）、红队、沙箱与权限模型、输出护栏、human-in-the-loop\n· Coding Agent：SWE-agent、Claude Code、OpenHands 的端到端架构对比\n· 主动式 Agent：从 reactive 到 proactive，General User Models（GUM）、Next Action Prediction，以及\"Agent 何时应主动、何时应等待\"的 mixed-initiative 问题\n· 开放问题：多模态/web/计算机使用 Agent、科学 Agent、长时运行架构、生产可观测性（tracing、monitoring、成本管理）\n\n# 作业设计：一手建、一手评\n\nHW1：从零构建 Agent 系统（10%） 给定论文库，构建能检索并推理回答科学问题的 Agent。\n· Part A：只用 litellm 手写 RAG + 工具调用 + ReAct 式 Agent 循环\n· Part B：用 DSPy 重建关键组件，并反思框架抽象了什么\n\nHW2：评估一个 Agent（10%） 给定一个预构建 Agent，设计完整评估套件：代码型 grader、至少一个 LLM-as-judge、用 4 元组框架构建 benchmark 任务、错误分析。", "createdAt": "Thu Sep 03 01:58:07 +0000 2026", "replyCount": 23, "retweetCount": 35, "likeCount": 170, "conversationId": "2095330467000328632", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRQb8aZbgAAJQh7.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HRQb8aZbgAAJQh7.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmqmWAbAAAM5mT.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVmqmWAbAAAM5mT.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T02:36:35+00:00", "createdAtBeijing": "2026-10-27T10:36:35+08:00", "createdAtLocal": "10-27 10:36 北京", "url": "https://x.com/shao__meng/status/2114909091101573476", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2114909091101573476", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Terminal-Bench 与 Harbor 的 Agent 评测工程", "evidence": "产物从 agent env 交到 verifier env 再跑测试", "rationale": "提供任务设计、验证隔离与评测版本管理方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115075291588817241", "track": "agent", "source": {"id": "2115075291588817241", "text": "总结一下这篇文几个点：\n\n1. AI 写得越快，验证就越重要。\nClaude 已经编写了 Claude Code 约 90% 的代码。从 6 月到 9 月，Claude Code 代码库合并的 PR 数量翻了一倍多，需要回滚的 PR 占比却下降了超过 40%。这是团队自报的数据，背后靠的是一整套验证和回滚机制。\n\n2. 审查提前到写代码的过程中。\n提交 PR 前，就让 AI 跑测试、构建项目、对比界面截图，再让一个没有参与编写、拥有全新上下文的子代理检查改动。关键要求是：别只说“做完了”，要拿出能验证的结果。\n\n3. 用多层检查，把人的注意力留给高风险问题。\n每个 PR 都经过 AI 审查、安全审查和 CI 检查，再按风险决定人工审批要求，合并后还有内部试用、灰度发布和快速回滚。人主要判断：这个功能该不该做、架构是否合理，以及计费、更新器、CI 等敏感代码是否安全。需要人工批准的地方，AI 的批准不能代替人。\n\n4. AI 互相审查，也可能陷入死循环。\n一个 PR：写代码的代理和审查代理，一夜来回修改超过 50 轮。后来发现，审查不断翻出旧问题，让范围越改越大。团队因此限制审查轮数，三轮后要求重新评估方案，后续重点检查新增改动，避免反复报告同一个问题。\n\n5. 真正要优化的是“人的总投入”。\n少花时间审代码，却多花时间修线上事故，并没有省事。所以他们同时看人工审批次数、等待时间、回滚率和事故率，还把真实事故整理成评测集，每次调整审查系统，都检查它能不能发现过去漏掉的错误。\n\n6. AI 可以写代码，但责任始终落在人身上。\n“谁合并，谁负责”。改动尽量小、出问题能快速撤回，事故发生后再补检查、规则或文档。团队也承认，大部分代码由机器阅读之后，如何保持团队对代码库的共同理解，仍没有正式解决机制；目前主要靠按需让 Claude 解释具体模块。", "createdAt": "Tue Oct 27 13:37:00 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2115075291085492285", "inReplyToStatusId": "2115075291085492285", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-27T13:37:00+00:00", "createdAtBeijing": "2026-10-27T21:37:00+08:00", "createdAtLocal": "10-27 21:37 北京", "url": "https://x.com/sitinme/status/2115075291588817241", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2115075291588817241", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AI编程的分层验证与审查闭环", "evidence": "三轮后要求重新评估方案", "rationale": "包含验证、限轮审查及事故评测方法，数据注明自报"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2114907304374194222", "track": "enterprise", "source": {"id": "2114907304374194222", "text": "Anthropic提交IPO了。看了下招股书：\n\n1. 前沿模型已经出现营业盈利。\n\n2026年第二季度，Anthropic营业利润9.74亿美元，营业利润率约8.4%。\n\n2. AI收入开始突破员工人数的上限。\n\n上半年约80%的收入按量计费。员工不增加，智能体处理的任务、运行时间和调用量照样可以增加。\n\n3. AI产品要设计客户加钱的理由。\n\n900%的净收入留存率，反映特定老客户群的季度总收入变成约九倍，排除Pro和Max，并非每个客户预算都翻九倍。\n\n4. 收入规模做大了，客户也未必被锁住。\n\n前五大客户占单季收入比例，从一季度36%降到三季度21%，收入正在分散。但许多大客户仍可以减少用量，缺少长期合同约束。\n\n5. 前沿模型的高毛利，要交昂贵的研发费。\n\n上半年按附注计算的毛利率约85.4%，研发费用却有97.41亿美元，研发和渠道费用都在这条毛利线外。\n\n6. 模型领先要一轮轮花钱续。\n\n第三季度超过80%的收入，来自过去六个月发布的模型版本。当季收入高度依赖近期版本，单季构成尚不足以判断旧模型的商业寿命。\n\n7. 企业采购路径，本身就有商业价值。\n\n约48%的上半年收入经过云市场。产品进入企业已有的预算、安全和采购体系，采用阻力会小一些。\n\n8. 技术领先，也得向掌握入口的人分账。\n\n上半年渠道伙伴费用仅同比增量就约27亿美元。云伙伴又可能同时供算力、投股权、卖产品、做竞争模型。\n\n9. 高人效背后，可能站着一整套重资产体系。\n\n截至9月底，过去十二个月人均收入超过660万美元。这个员工分母没有包含云、芯片和机房供应商的人员与资本。\n\n10. 预测错需求，算力优势就可能变成付款压力。\n\n6月底尚未起租的租赁义务，未折现金额约3214亿美元，部分附条件。客户可以更快地减少消费，多年合同却不会自动同比缩水。\n\n11. 融资能力已经影响模型公司的生产能力。\n\n上半年融资活动净现金流入约1107.74亿美元。资本让公司能提前锁机器、建容量，承担交付与收款之间的时间差。\n\n12. 模型降本之后，要找新增任务。\n\n公司称Opus 5.5每项任务的客户成本较Opus 5下降约40%。原有任务可能变便宜，过去因成本太高而做不成的任务，也可能开始值得付费。\n\n13. 能产生收入的需求，还要经得起政策执行。\n\n公司估计，前九个月约5%至7%的收入来自后来被判断违反使用政策或商业条款的客户。执行收紧可能影响收入。\n\n14. 上游的使命选择，也会进入你的商业风险。\n\n按拟定上市结构，创始人实体将拥有一般股东事项50.1%的投票权；长期利益信托通常掌握多数董事任免权。安全限制和发布延迟可能影响收入。\n\n15. 原厂已经下场，AI落地不会自动给第三方让座。\n\n2026年7月推出的Ode with Anthropic，明确面向中型企业做AI部署。通用接入和功能包装，会面对第一方应用及原厂交付的竞争。\n\n第三方的收费理由，要落到数据维护、系统连接、验收、迁移和持续运维这些具体工作上。\n\n16. 创业者要盯住高价值任务，别拿调用量冒充客户价值。\n\n第三季度，使用Code的企业用户中消费最高的5%，月支出约为非Code企业用户均值的20倍。这是消费差异，不能证明Code让所有人多花20倍，更不能直接当作客户收益。", "createdAt": "Tue Oct 27 02:29:29 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 5, "conversationId": "2114907304374194222", "author": {"username": "situking", "name": "司徒K", "profileImageUrl": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, "authorId": "1518825568959176705", "quotedTweet": {"id": "2114705042817110293", "text": "Anthropic has filed an S-1 registration statement with the SEC related to its proposed IPO.\n\nRead more: https://t.co/ofhv0DK3Zp\n\nLegal disclaimer: A registration statement relating to these securities has been filed with the SEC but has not yet become effective. These securities may not be sold, nor may offers to buy be accepted, prior to the time the registration statement becomes effective. This post does not constitute an offer to sell or the solicitation of an offer to buy these securities, nor shall there be any sale of these securities in any state or jurisdiction in which such offer, solicitation or sale would be unlawful prior to registration or qualification under the securities laws of any such state or jurisdiction.", "createdAt": "Mon Oct 26 13:05:46 +0000 2026", "replyCount": 1274, "retweetCount": 2329, "likeCount": 17892, "conversationId": "2114705042817110293", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "translationZh": "Anthropic 已向美国证券交易委员会（SEC）提交与拟议首次公开募股（IPO）相关的 S-1 注册声明。\n\n了解更多：https://t.co/ofhv0DK3Zp\n\n法律免责声明：与上述证券相关的注册声明已提交至 SEC，但尚未生效。在注册声明生效之前，不得出售这些证券，也不得接受购买要约。本帖不构成出售这些证券的要约或购买要约邀请；在任何州或司法管辖区，若未依据当地证券法完成注册或取得资格前进行此类要约、邀请或销售属于违法行为，则不得在该州或司法管辖区出售这些证券。"}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "司徒K", "role": "企业落地与产品组织实践与观察", "why": "有 FDE 进场交付问答及企业服务方法，补足咨询和交付视角。", "handle": "situking"}, "createdAtIso": "2026-10-27T02:29:29+00:00", "createdAtBeijing": "2026-10-27T10:29:29+08:00", "createdAtLocal": "10-27 10:29 北京", "url": "https://x.com/situking/status/2114907304374194222", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2114907304374194222", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "模型公司商业结构与企业落地价值", "evidence": "第三方的收费理由，要落到数据维护", "rationale": "提供采购与交付分析，财务数据待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, {"id": "2114912866709168259", "track": "research", "source": {"id": "2114912866709168259", "text": "阿里千问最新研究：Agent 也会「巴别塔」！\n\n团队发布一个新的 BabelArena 来测试：同一条 agent 工作流换语言后，工具调用、环境状态、检索与打分会不会一起走样，通关仍可能掩盖 8 倍级的工具调用膨胀。\n\n论文：https://t.co/69FHQUbK0R\n\n千问帖子里的例子\n同一购物任务、同一模型（Qwen-3.8-Max），英语与泰卢固语（Telugu）都拿到同样四个商品、都算通过；但工具调用是 25 vs 201，泰卢固一侧对本地化目录反复空搜。作者的判断：即便 pass，上线前也该看见这条差距。\n\nBabelArena / BabelFlow 是什么\n· BabelArena：大规模多语言 LLM agent 基准，约 699 个规范任务 × 23 种语言 → 约 1.6 万 任务实例（论文/README 数字在 699–702、16077–16146 间有小幅表述差，以当日仓库与 arXiv 为准）。覆盖 13 个领域、15 种文字；语言分高/中/低资源三档（泰卢固在低资源列）。\n· 四套源基准家族：VitaBench（交互服务）、DeepPlanning（长程规划）、τ³-Bench text（模拟用户 + 工具 + 政策）、ClawEval（编排 / 多模态 / 专业对话）。\n· BabelFlow：通用适配流水线，沿运行时数据流找出可安全翻译的文本，在任务、工具描述、数据库、模拟用户与 grader 上保持结构一致，多层校验 + 人工复核后再接纳变体。重点是 component-complete localization，不是只翻 prompt。\n\n论文里更广的发现\n没有单一模型通吃四个家族；跨语言差距不止成功率。低资源语言更多是 tool-use / control-flow 类失败，而不仅是「答案质量差」；同任务输入 token 可到英语约 2×；结构化输出时语言一致性更差，切换几乎一边倒指向英语。", "createdAt": "Tue Oct 27 02:51:35 +0000 2026", "replyCount": 16, "retweetCount": 0, "likeCount": 5, "conversationId": "2114912866709168259", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114696710173921589", "text": "Our latest open-source research has a pretty interesting name, inspired by the story of the Tower of Babel. What interests us about that story is how language barriers can get in the way of people working toward the same goal\n\nAnd when it comes to agents, there are a few more places for that understanding to break, like tool arguments, database entries, and search queries\n\nOne example from BabelArena (yes that's the name, surprise) stuck with me: Qwen-3.8-Max completed the same shopping task in English and Telugu, getting the same four products. But it took 25 tool calls in English and 201 in Telugu, with repeated empty searches against the localized catalog.\n\nEven though both runs passed, we’d still want to see that difference before shipping.\n\nSorry for the long story, hope you guys are still here. What I want to share is that we’ve open-sourced BabelArena to study these workflows across 23 languages. Code, datasets, and paper in the comment", "createdAt": "Mon Oct 26 12:32:39 +0000 2026", "replyCount": 98, "retweetCount": 75, "likeCount": 1757, "conversationId": "2114696710173921589", "author": {"username": "QwenDevs", "name": "Qwen Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/2079037454556987392/zGNYEiMo_normal.jpg"}, "authorId": "2077014085598941184", "translationZh": "我们最新的开源研究有个挺有意思的名字，灵感来自巴别塔的故事。这个故事吸引我们的地方在于，语言障碍会如何阻碍人们朝着共同目标协作。\n\n而对智能体来说，理解还可能在更多环节出错，比如工具参数、数据库条目和搜索查询。\n\nBabelArena（没错，这就是名字，惊喜吧）中的一个例子让我印象深刻：Qwen-3.8-Max 分别用英语和泰卢固语完成同一个购物任务，买到了相同的四件商品。但英语版本调用了 25 次工具，泰卢固语版本却调用了 201 次，并在本地化商品目录中反复搜索无果。\n\n虽然两次运行都通过了评测，但我们仍希望在上线前看到这种差异。\n\n说得有点长，希望大家还在。其实我想分享的是，我们已开源 BabelArena，用于研究 23 种语言下的这些工作流。代码、数据集和论文见评论。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmuCKLa8AAzxvC.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVmuCKLa8AAzxvC.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T02:51:35+00:00", "createdAtBeijing": "2026-10-27T10:51:35+08:00", "createdAtLocal": "10-27 10:51 北京", "url": "https://x.com/shao__meng/status/2114912866709168259", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2114912866709168259", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "BabelArena 多语言 Agent 工作流评测", "evidence": "工具调用是 25 vs 201", "rationale": "新基准结合具体案例揭示跨语言执行成本差异"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115020426514469165", "track": "agent", "source": {"id": "2115020426514469165", "text": "[开源 Skills 推荐] skill-diet 给 Skill 减重：用评测保证「更瘦但不更差」\n\nskill-diet 是一个管其他 skill 的 meta-skill：一边把臃肿 SKILL.md 压薄并校对工具是否过时，一边给后续每次改 skill 立规矩；瘦身版只有在「旧 skill / 新 skill / 无 skill」同任务评测里至少不输才会留下。作者 @nicopreme 测试在真实 skill 上可砍 70–80% token，且测出文档里已失效的命令。\nhttps://t.co/wRktTWUfGg\n\nAgent 每次用 skill 都会读完整 SKILL.md。常见冗余是：多数任务用不到的细节、模型本就会的常识、写给人看的说明、可用一条原则代替的长列表；教 CLI/API/SDK/MCP 的 skill 还会抄一份工具手册，工具一变就过期。让 agent「更新一下 skill」通常只会越写越长。\n\n它做了两件事\n· Put on a diet：重写、修与工具不符之处；只有评测过关才保留瘦版。\n· Keep lean：之后每次增补都先过一套门槛，避免教训和代码变更把体积又养回来；相对上次 diet 大约涨 10% 就要再做一轮。\n\n可以直接说：put the deploy skill on a diet / is this skill still accurate for the current CLI? / add this lesson to …。\n\n分层：事实放在「刚好够用」的最低层\n· skill description：每个场景一条触发，几乎每个会话\n· SKILL.md：几乎每任务都要的规则，启用该 skill 时\n· references/：少数任务才要的细节，点到该场景时\n· 工具自带 help：flag、合法值、示例，选到那条命令时\n· 工具回复 / 报错 / checker：正确名、修法、下一步，调用出错或猜错时\n\n教工具的 skill 还多两步：精确字段名留在工具侧；机械错误优先靠更清晰报错、测试或 linter，而不是再写一段 prose。只用人工触发的 skill 可标 user-only，避免 description 每会话白占配额。\n\n一次 diet 在做什么\n测体积与典型任务加载量 →（若教工具）用运行或源码行证明 skill↔工具不一致；从 session log 找高频调用、只把高频写全；看 agent 是否真打开 skill，少打开则把规则下沉到工具报错；必要时裁自家工具 schema（schema 每请求都带）→ 砍模型已知与仅人类需要的文字 → 同任务跑旧 / 新 / 无 skill，瘦版不优于「随机波动可解释」就失败。命令优先写成 agent 会敲的 usage lines（作者给的相对代价：表 1.5×、TS 类型 1.6×、JSON Schema 2.8×、OpenAPI 4.7×）。\n\n之后每次改 skill：停在第一个能处理的步骤\n· 先修工具（报错 / check），别堆文。\n· 新会话不写也会对，就别加。\n· 改已有那一行，别另起一段。\n· 放到仍「来得及」的最低层。\n· 写规则不写故事（故事进 commit）。代码改了 skill 依赖的名字或行为，同一次变更里改 skill；commit 记前后体积。", "createdAt": "Tue Oct 27 09:58:59 +0000 2026", "replyCount": 12, "retweetCount": 2, "likeCount": 23, "conversationId": "2115020426514469165", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114975730471997613", "text": "I've been dogfooding \"skill-diet\", a skill for slimming down agent skills and keeping them correct.\n\nmost skills load far more text than a task needs, and some parts often go stale. it also gets worse over time as AI updates skills.\n\nskill-diet cuts what the model already does without being told, moves rarely needed detail into files it only reads when needed, and fixes what no longer matches the tool. then it runs the same tasks with the old skill, the new one and no skill, and keeps the new one only if agents do at least as well.\n\non my own skills: 70–80% fewer tokens, same results.\n\nhttps://t.co/h1BnVt7NjD", "createdAt": "Tue Oct 27 07:01:23 +0000 2026", "replyCount": 40, "retweetCount": 17, "likeCount": 480, "conversationId": "2114975730471997613", "author": {"username": "nicopreme", "name": "Nico Bailon", "profileImageUrl": "https://pbs.twimg.com/profile_images/1732784014933798912/NYfTJGk-_normal.jpg"}, "authorId": "2355053348", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114975644673265664/img/gWAlgFipd5ORpEbV.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114975644673265664/img/gWAlgFipd5ORpEbV.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114975644673265664/vid/avc1/1920x1080/x-_GaGifHQfO_Iog.mp4?tag=29", "durationMs": 29700}], "translationZh": "我最近一直在亲自试用“skill-diet”，这是一个用于精简智能体技能并确保其内容正确的技能。\n\n大多数技能加载的文本远超任务所需，其中一些内容还经常过时。随着 AI 不断更新技能，这个问题会越来越严重。\n\nskill-diet 会删除模型无需指示就会做的内容，将不常用的细节移到按需读取的文件中，并修正与工具现状不符的内容。然后，分别使用旧技能、新技能和不使用技能来执行相同任务，只有智能体表现至少不变差，才会保留新版本。\n\n在我自己的技能上：token 用量减少了 70–80%，效果不变。\n\nhttps://t.co/h1BnVt7NjD"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoP2a3awAAl6u0.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVoP2a3awAAl6u0.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T09:58:59+00:00", "createdAtBeijing": "2026-10-27T17:58:59+08:00", "createdAtLocal": "10-27 17:58 北京", "url": "https://x.com/shao__meng/status/2115020426514469165", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2115020426514469165", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "skill-diet技能精简与对照评测", "evidence": "同任务跑旧 / 新 / 无 skill", "rationale": "提供开源工具及分层精简、校验和评测方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114919123281117195", "track": "tools", "source": {"id": "2114919123281117195", "text": "MiniMax 开源了自托管的 OpenAI Agents API「OpenAgentCore」：一套 Core，多种 Harness；官方 SDK 只改 OPENAI_BASE_URL，Session 里原生跑 Codex / Claude Code / MiniMax Code，模型与沙箱按协议可换\n\n开源地址：\nhttps://t.co/EMQtUxhyBN\n\n主要想解决的问题\n1. 同款 API：官方 OpenAI SDK 或裸 HTTP，指向你的 Core /v1。\n2. 你的 Agent + 你的模型：每个 Session 选 harness（如 extra_body.agent.x_agents_core.harness = \"codex\"），模型走你配置的 provider。\n3. 计算可休眠、工作区可留：microsandbox 上空闲释放算力、文件随独立存储在兼容节点恢复；E2B 可就地 pause；也支持 Docker 与本机 Linux/macOS/Windows。\n4. 边界可替换：Sandbox Provider、工作区文件系统、Harness、模型提供商都走既定协议（见 AGENTS.md）。\n\n项目架构\n· Core + PG：鉴权、冻结配置、调度 Turn、取消/交互、持久化执行事实\n· Sandbox Provider / Node：申请与回收算力；节点跑 Docker 或 microsandbox\n· Workspace FS：环境持久存储（与算力生命周期分开）\n· Runtime：准备环境与能力快照，跑 Session Executor，上报事件与收据\n· Harness adapter：调上游 SDK/协议，翻译事件；原生 agent 循环与上下文归 Harness\n· Model provider：Responses / Anthropic / chat_completions 等协议\n· Web：运维控制台（走 /core/v1）", "createdAt": "Tue Oct 27 03:16:26 +0000 2026", "replyCount": 24, "retweetCount": 3, "likeCount": 29, "conversationId": "2114919123281117195", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114613174620061856", "text": "[1/n] 以前大家调 API 是 Tokens as a Service，现在慢慢变成了 Agents as a Service。\n\n但做这层存在一个很现实的问题：现在模型和harness基本几个月就迭代一轮，如果把业务直接绑死在某套实现上，后面换起来会非常痛苦。所以底层的 Agent Infra 尽可能需要做到对外的接口足够稳定，但是对内得能够随时换上最 frontier 的组件。\n\n这就是我们做 OpenAgentCore 的初衷，一个开源的 Agent Infra：对外只提供一套标准的 API，对内不管是 harness、model、sandbox 还是 Filesystem 全部协议化，都可以随意更换，不会被绑在某一家上。\n\nhttps://t.co/V0xdSK4UPr", "createdAt": "Mon Oct 26 07:00:43 +0000 2026", "replyCount": 13, "retweetCount": 10, "likeCount": 49, "conversationId": "2114613174620061856", "author": {"username": "saladday", "name": "SaladDay", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287706755242160129/_8GHeF8U_normal.jpg"}, "authorId": "1287701603999313920", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVidZrPa0AAE3wu.jpg", "width": 1672, "height": 941, "previewUrl": "https://pbs.twimg.com/media/HVidZrPa0AAE3wu.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmztjJawAAkkym.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVmztjJawAAkkym.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T03:16:26+00:00", "createdAtBeijing": "2026-10-27T11:16:26+08:00", "createdAtLocal": "10-27 11:16 北京", "url": "https://x.com/shao__meng/status/2114919123281117195", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2114919123281117195", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "OpenAgentCore 开源 Agent 基础设施", "evidence": "Sandbox Provider、工作区文件系统、Harness", "rationale": "具体开源发布，交代接口、架构与替换边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114876984304263464", "track": "enterprise", "source": {"id": "2114876984304263464", "text": "最近 LangChain 分享了内部销售、研发和内容团队的 Agent Harness 架构，里面有不少值得借鉴的工程细节。\n\n他们发现，最棘手的问题之一是「Agent 到底以谁的身份干活」。\n\n比如销售 Agent 查询 Salesforce 可以用公司统一账号，但发邮件必须使用用户自己的授权，而且只能在私聊中操作。\n\nCoding Agent 也一样。帮你提交 PR 时，用你的 GitHub 身份；在后台自动审查代码时，则切换成独立的 GitHub App。\n\n内容 Agent 发公司 Twitter，用的是公司账号，但只有白名单用户能真正发帖。\n\n除此之外，还有几项关键设计：\n\n1. Agent 直接接入 Slack，不用员工换平台；需要时还能从工讨论里「拆」出独立线程\n2. Memory 分全局和个人两层，由 Agent 自己决定一条事实记到哪一层\n3. 代码在沙箱里执行，经安全代理访问外部服务\n4. 大量任务是定时或事件触发的，不一定等人开口。比如新 PR 自动 Review，或者你跟它说一声，它自己挂上每天销售简报\n\nDemo 阶段跑得通的 Agent，一进公司就会撞上身份和权限边界。这些细节平时讨论不多，但真落地一个都绕不过去。\n\n这些细节平时讨论得不算多，但真到落地时，一个都绕不过去。推荐做企业 Agent 的朋友读读。\n\n原文：https://t.co/4nUIFAJkzG", "createdAt": "Tue Oct 27 00:29:00 +0000 2026", "replyCount": 10, "retweetCount": 10, "likeCount": 77, "conversationId": "2114876984304263464", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-27T00:29:00+00:00", "createdAtBeijing": "2026-10-27T08:29:00+08:00", "createdAtLocal": "10-27 08:29 北京", "url": "https://x.com/Xudong07452910/status/2114876984304263464", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2114876984304263464", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "企业Agent身份授权与Harness架构", "evidence": "发邮件必须使用用户自己的授权", "rationale": "提供身份切换、权限隔离及事件触发等具体设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2115039161308852364", "track": "research", "source": {"id": "2115039161308852364", "text": "百度开源 Unlimited OCR 2：超长文档解析，注意力开销尽量不随页数涨\n\nUnlimited OCR 2 是面向「几十到几百页」文档的开源 OCR / 版面解析模型，3B/A0.5B 的 MoE 模型架构：用 SR-SWA 把文本–视觉注意力压到固定大小的工作参考集，再配合按页分块解码，让超长文档能在有限上下文里跑完，并声称逐步解码的延迟和显存几乎不随文档变长而涨。\n\n开源模型：https://t.co/Z8uP95MZ1Y\n\n相对 v1 改了什么\nv1（R-SWA）已能做多页端到端解析，但论文写明输入大约卡在 40 页，也因此没上 MarathonDocBench。v2 把解码器注意力升到 SR-SWA（Sparse Reference Sliding Window Attention），并加上 Unlimited-Horizon Decoding；骨干仍是 DeepEncoder + MoE 解码器一路，从 v1 权重再训。口号从「长程」推到「不限程」。\n\nSR-SWA 在做什么（技术报告口径）\n长文档会让文本–视觉注意力很贵。R-SWA 管住了局部交互，但远端视觉 token 仍会随页数涨。SR-SWA 的做法是：把交互压进固定容量的工作参考（README 举例 512 tokens）。大致两步：Page Gate 先按页收窄候选；Token Sieve 再对块做摘要打分，用 α-entmax 稀疏路由，只保留 top-k 远端块加局部窗口。解码侧按页切块，页边界重叠 1 页并复用 KV 尾部，避免超长时显存爆掉。作者称百页量级上，逐步速度相对 Full Attention 约 7.0×、相对 R-SWA 约 5.6×。", "createdAt": "Tue Oct 27 11:13:26 +0000 2026", "replyCount": 2, "retweetCount": 1, "likeCount": 9, "conversationId": "2115039161308852364", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114910381311512987", "text": "Unlimited OCR 2 is here, and it's open source. 📖 ✨\n\nLonger documents can mean a lot more attention computation. Our new SR-SWA mechanism keeps that in check by condensing text-visual attention interactions into a fixed-size set of working references.\n\nHere's what it delivers:\n- Document parsing at virtually any length, within a finite context window\n- Nearly constant per-step decoding latency and memory footprint as documents grow longer\n- State-of-the-art performance on MPDocBench and MarathonDocBench, covering documents from dozens to hundreds of pages\n\nCheck out the model here ↓", "createdAt": "Tue Oct 27 02:41:42 +0000 2026", "replyCount": 56, "retweetCount": 107, "likeCount": 980, "conversationId": "2114910381311512987", "author": {"username": "Baidu_Inc", "name": "Baidu Inc.", "profileImageUrl": "https://pbs.twimg.com/profile_images/1373867336021598212/vZ2nWy8M_normal.jpg"}, "authorId": "820440736336228352", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmbZoiakAAtEgn.jpg", "width": 1807, "height": 961, "previewUrl": "https://pbs.twimg.com/media/HVmbZoiakAAtEgn.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVmbZptagAAcnGm.jpg", "width": 1920, "height": 1440, "previewUrl": "https://pbs.twimg.com/media/HVmbZptagAAcnGm.jpg:small"}], "translationZh": "Unlimited OCR 2 来了，而且已开源。📖 ✨\n\n文档越长，注意力计算量可能越大。我们全新的 SR-SWA 机制将文本与视觉之间的注意力交互压缩为一组固定大小的工作参考信息，从而控制计算开销。\n\n它能实现：\n- 在有限的上下文窗口内，解析几乎任意长度的文档\n- 随着文档变长，每步解码延迟和内存占用几乎保持不变\n- 在 MPDocBench 和 MarathonDocBench 上达到当前最佳水平，覆盖数十页至数百页的文档\n\n点击下方查看模型 ↓"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVog5WtaQAAa5of.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVog5WtaQAAa5of.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T11:13:26+00:00", "createdAtBeijing": "2026-10-27T19:13:26+08:00", "createdAtLocal": "10-27 19:13 北京", "url": "https://x.com/shao__meng/status/2115039161308852364", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2115039161308852364", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Unlimited OCR 2超长文档解析", "evidence": "把交互压进固定容量的工作参考", "rationale": "提供开源模型与注意力机制细节，性能为作者声称"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114935968604299552", "track": "research", "source": {"id": "2114935968604299552", "text": "I've seen a lot of pushback to this, with the following complaints:\n\n1. \"The benchmark owners already know about the flaws, and are working on it.\"\n2. \"Why are they spending time critiquing and not contributing to the benchmark\" OR \"critiquing known issues are not helpful\".\n3. \"The flawed verdict is too binary\"\n\nI find this pushback to be misguided.  These benchmarks are used to move millions of dollars of token spend, and many people blindly trust how well these benchmarks generalize to their own products, and don't look any further than the headline numbers.\n\nFor example, whenever a new model drops, you'll find thousands of youtube videos analyzing the pareto frontier using one of these benchmarks as the primary quality metric without questioning the benchmark.\n\nI think we would all be better served by inviting skepticism and encouraging people to develop an independent opinion of how well these benchmarks represent the tasks they care about.  Concretely:\n\n- For the failing tasks within the benchmark, are they: realistic, have a proper harness, graded properly, sufficiently disambiguated user intent?\n- Are models and API calls configured properly (ex: inconsistent context windows, reasoning levels). \n- Are the models equipped with a modern harness and minimal retrieval that is sufficiently realistic?\n- Does the score even make sense ex: is it just a LLM judge committee that produces a score on a 0-100 scale that isn't aligned with ground truth?\n\nIt's often the case you'll see many of these issues while looking at traces of a failing benchmark tasks, and it doesn't take long! Often the **very first trace you look at** has a serious issue.\n\nI also don't think there is an issue with verified vs. flawed verdict.  It's good to have opinions.  If you look through enough of what's behind their opinions and you find that you usually agree with their verdict, then they have earned your trust, the same way that a benchmark can lose your trust.  \n\nI think this eval of benchmarks is a red pill that motivates investing in your own private evals.", "createdAt": "Tue Oct 27 04:23:23 +0000 2026", "replyCount": 74, "retweetCount": 8, "likeCount": 150, "conversationId": "2114935968604299552", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "quotedTweet": {"id": "2100704765332394255", "text": "Introducing Benchmark Reviews: our new initiative to audit AI benchmarks. We are launching with 15 benchmarks: 4 Verified, 9 Flawed, and 2 with not enough information for a review. https://t.co/xU43tv32gH", "createdAt": "Thu Sep 17 21:53:39 +0000 2026", "replyCount": 116, "retweetCount": 199, "likeCount": 1964, "conversationId": "2100704765332394255", "author": {"username": "EpochAIResearch", "name": "Epoch AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg"}, "authorId": "1529761561170124800", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HScz2hmaoAAjCzX.jpg", "width": 1026, "height": 1283, "previewUrl": "https://pbs.twimg.com/media/HScz2hmaoAAjCzX.jpg:small"}], "translationZh": "推出 Benchmark Reviews：我们审查 AI 基准测试的新项目。首批涵盖 15 个基准测试：4 个已验证，9 个存在缺陷，2 个因信息不足而无法评审。https://t.co/xU43tv32gH"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-10-27T04:23:23+00:00", "createdAtBeijing": "2026-10-27T12:23:23+08:00", "createdAtLocal": "10-27 12:23 北京", "url": "https://x.com/HamelHusain/status/2114935968604299552", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2114935968604299552", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "基准审计与私有评测方法", "evidence": "looking at traces", "rationale": "列出任务、配置、评判与运行框架审计要点"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我看到不少人对此提出反对，主要有以下几种意见：\n\n1. “基准测试的负责人已经知道这些缺陷，也正在修复。”\n2. “为什么他们花时间批评，却不参与改进基准测试？”或者“批评已知问题没有帮助”。\n3. “‘存在缺陷’的判定过于非黑即白。”\n\n我认为这些反对意见偏离了重点。这些基准测试影响着数百万美元的 token 支出，而许多人盲目相信它们的结果适用于自己的产品，只看醒目的分数，不再深究。\n\n例如，每当新模型发布，你都会看到成千上万条 YouTube 视频，以其中某个基准测试为主要质量指标来分析帕累托前沿，却不质疑基准测试本身。\n\n我认为，欢迎质疑，鼓励大家独立判断这些基准测试能在多大程度上反映自己关心的任务，对所有人都有益。具体来说：\n\n- 基准测试中失败的任务是否真实？测试框架是否合理？评分是否正确？用户意图是否足够明确？\n- 模型和 API 调用的配置是否正确，例如上下文窗口、推理强度是否一致？\n- 是否为模型配备了现代化的运行框架，以及足够贴近实际使用的基本检索能力？\n- 分数本身是否有意义？例如，是否只是由一组 LLM 评审给出一个与真实标准不符的 0–100 分？\n\n查看基准测试中失败任务的执行轨迹时，往往很快就能发现许多这类问题！很多时候，你看的第一条执行轨迹就存在严重问题。\n\n我也不认为“已验证”和“存在缺陷”这样的判定有什么问题。有观点是好事。如果你充分了解了这些观点背后的依据，并发现自己通常认同他们的判定，那么他们就赢得了你的信任；同样，基准测试也可能失去你的信任。\n\n我认为，这种对基准测试的评估能让人看清现实，促使大家投入资源建立自己的私有评测。"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2114929079975563269", "track": "enterprise", "source": {"id": "2114929079975563269", "text": "推荐阅读：《用 Manus 改造 Manus，AI Native 组织改造的实践和思考》https://t.co/0MEN86K7ow 来自 Manus 很好的 AI Native 组织改造一手实践分享。\n\n基于我的理解提炼一下要点：\n\n【1】团队的工程基建，从对人友好，变成了向 AI 暴露接口\n\n过去我们做工程基建，核心是提升开发者体验，怎么让工程师写代码更爽；但 AI 原生的第一性原理，是如何让 Agent 能接触到真实世界，自己能获得充足的上下文。\n\n比如 Manus 把分散的仓库串成统一入口、让 AI 能在几秒钟内跑通端到端测试、给 AI 权限去读线上日志、看报警、发邮件、控制 Feature Flag，他们做的这些，都是在把整个软件开发生命周期和业务流彻底暴露给 Agent。\n\n人能看到什么、操作什么，Agent 就必须能看到、能操作。当 Agent 能够自己可以验证结果，形成“修改-验证-排查”的闭环时，它才真正从副驾驶变成了司机。\n\n【2】人和 AI 的交互，从过程控制微管理，变成了只给目标，要证据\n\n在传统的模式里，人跟 AI 是结对的方式，AI 写一段人来修改，人还要操心上下文有没有超、代码写得优不优雅，是不是有垃圾代码。但实际上这种过程工程是低效的，就好比你作为一个管理者去微管理你的员工。\n\n- 直接给结果\nManus 工程师把 Slack 里的需求原文一字不改丢给 Agent，老板要什么就告诉 Agent 要什么，不需要告诉 Agent 怎么做，Agent 自己会想办法完成任务。\n\n- 要证据\n\n当人不再一行行看代码时，怎么相信 AI 的结果是否靠谱呢？\n\nManus 用最好的模型做代码审核机器人，让 AI 自己证明自己做对了。Manus 让 Agent 用测试账号走完注册、支付流程并逐步录屏，产品经理看录屏就能指出哪里不对。\n\n【3】AI 工作流，从人等 Agent，变成 Agent 等人\n\n真正的 AI 原生工作流是高度异步、大规模并发的。如果你只有一个 Agent 在干活，你就得等着它干活，但如果你安排了很多 Agent 同时干活，那么你就不需要等，只需要频繁的在不同的 Agent 之间切换，要么在分配任务，要么验证下结果，效率可以很高。\n\nManus 的工程师一个人同时开着十几二十个 Session 处理需求；领导层把 20 多个待办丢给一个主控 Session，让它自己去拉取 Slack、Gmail 和 Notion 做背景调研并分发任务；市场部的数字 Agent 更是学会了只在一个工作台接收任务，把任务拆给后台的多个子 Session 并行跑，甚至通过定时唤醒在收到系统信号时自动干活，遇到工具不好用还能自己提需求改系统。\n\n【4】组织极致扁平与敏捷，从以前明确的工种，到现在每个人都能身兼多职\n\n传统软件工程里最大的损耗是在人和人之间。 前后端联调的扯皮、产品设计研发对文档理解的偏差、跨部门的排期与优先级错位，毕竟人类无法低成本地共享上下文，所以才不得不靠精细的分工来凑。\n\n而当 AI 抹平了技术栈的鸿沟，分工就不再必要了。在 Manus，一个人可以写完前后端和移动端，7 个人维护 4 个 App；所有产品经理都提交过代码，甚至一半能独立上线功能。\n\n当然这样做不是没有代价的，Manus 人均每月 1 万美元的夸张 Token 消耗，当然hidecloud 在文章中解释了：买的是时间和注意力。\n\n买的是“消除人际沟通损耗”和“保护人类的注意力”。当很多事情不再需要找人问，不需要临时打断别人时，组织才真正实现了极致的扁平与敏捷。\n\n【5】Agent 对话 Session 正在成为公司的新一代资产\n\n对话流（Session / Thread）正在取代传统的文档和看板，成为组织的核心工作对象与记忆载体。组织的知识已经不依赖人和文档，还依赖于 Agent 是否能读得到。\n\nManus 的运维同事嫌总被找去帮忙发版，就把发版流程写进 Agents.md，之后谁都能让 AI 来发；同一项目的成员能看到彼此的 Session，不用再追着人问进度。\n\n【6】当 AI 做了 90% 的事，人还剩下什么？\n\n引用下 hidecloud 的话：\n> 在 AI Native 组织里，人的角色没有变小，而是更集中了。定义问题，判断质量，决定什么值得做，并为结果负责。还有很重要的一点：与 AI 共同成长。\n\n人的位置一直在往上移，从亲手做，到定规则、看证据、做决定。往上移的时候，要小心把判断也一起交出去。\n\n执行可以交给 AI，思考要留给自己。\n\n---\n\n补充一个有意思的点，他们产品经理把需求用 AI 做成视频，然后把视频当需求文档提交，看了下他们的那个视频，确实这个功能要描述清楚不容易，配合视频会简单很多，这确实是一种降低人和人之间沟通损耗的办法。\n\n其实可以试试 Claude Design，这种交互都也能描述清楚，绝大部分功能直接做成高精度原型比视频效果直观多了。\n\n---\n\n虽然现在各个团队都在喊 AI 原生转型，但要做好是真不容易，如果只是在传统流程上加上一点 AI，那很难真正做到 AI 原生。\n\n真想要做好，可以学学 Manus 那样，一切围绕 Agent 重新建立分工和流程，还得舍得砸钱用最好的模型，现在这些模型虽然贵，但是一两年后 Fable 这样的模型成本可能也跟 DeepSeek Flash 差不多了。", "createdAt": "Tue Oct 27 03:56:00 +0000 2026", "replyCount": 96, "retweetCount": 49, "likeCount": 245, "conversationId": "2114929079975563269", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVm8yHjWEAAAn_u.jpg", "width": 1346, "height": 752, "previewUrl": "https://pbs.twimg.com/media/HVm8yHjWEAAAn_u.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-27T03:56:00+00:00", "createdAtBeijing": "2026-10-27T11:56:00+08:00", "createdAtLocal": "10-27 11:56 北京", "url": "https://x.com/dotey/status/2114929079975563269", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2114929079975563269", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Manus 的 AI 原生组织与工作流改造", "evidence": "把发版流程写进 Agents.md", "rationale": "提供接口开放、证据验收与异步协作实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2114907009350774901", "track": "creative", "source": {"id": "2114907009350774901", "text": "哈佛大学图书馆的馆藏里有一盘拉德克利夫研究所研讨会的录音，可以公开收听。演讲人是张爱玲，用英文讲中文翻译，主持人报的题目是「一种文化影响的载体」。目录没有标日期，从录音里提到的日期和二手资料推断是 1969 年前后。\n\n这一版先用 3 分钟讲背景。她 1920 年生在上海，去香港读过书，1940 年代在上海成名。1952 年她离开上海，1955 年到美国，第二年嫁给美国作家赖雅。1967 年她到了拉德克利夫研究所，同年赖雅病逝，她在剑桥把《海上花列传》译成英文。接着讲这场讲座讲什么、为什么值得听。片头用的是她当时的照片、书影、她寄给夏志清的信封和地图，开头先放她在讲座里的一句原话。\n\n然后是完整的录音原声，约 72 分钟，包括主持人开场、讲座和听众问答，配中英双语字幕，分 10 章。她讲了这些事：\n\n- 晚清严复译西学，林纾不懂外文，靠别人口述译了一大批小说，哈葛德、狄更斯都在其中。\n- 五四以后白话文学兴起，西方思想和短篇小说成批译进来；毛姆《在中国屏风上》里的辜鸿铭和宋春舫。\n- 《小说月报》、俄国文学和《飘》的中译；科举、排外，林语堂的意译与左翼的直译。\n- 古典诗和小说怎样译成西方语言，五四文学为什么遭冷落，西方读者眼里的中国。\n- 问答：中文版《读者文摘》和扫盲、《红楼梦》后三分之一的疑点、人名为什么难记、汉字与罗马字拼音。\n\n章节：\n\n00:00 背景：她是谁，这场讲座讲什么\n03:05 主持人开场\n05:28 晚清：严复与林纾\n11:44 五四：白话与西学涌入\n16:28 毛姆笔下的中国人\n23:02 译进来的西方\n34:05 排外、科举与直译\n37:35 中国文学走向西方\n42:57 问答一：《读者文摘》与扫盲\n48:30 问答二：《红楼梦》与旧小说\n1:05:35 问答三：汉字与拼音\n\n----\n\n制作这期视频主要还是为了探索音频转成视频的表现形式。\n\n提示词（需要配合 baocut skill 和 app： https://t.co/wldDX9MSVR ，理论上来说只用 Skill 也可以，但要配合 TTS）：\n\n> 基于张爱玲 1969 年那场英文讲座（视频库里的 eileen-chang-1969-radcliffe-zh-en）出一期视频：前面用几分钟讲清她是谁、那时她在哪里做什么、这场讲座讲的是什么、为什么值得听，封面要有她当时的照片，一看就知道是谁。表现形式要丰富，别做成幻灯片，有影像就用影像，可以配 TTS 解说，可以用 AI 画没有人物的示意图。简报写好按你的建议直接做，不用等我确认；先别烘焙导出，做好给我审片链接。", "createdAt": "Tue Oct 27 02:28:18 +0000 2026", "replyCount": 39, "retweetCount": 47, "likeCount": 196, "conversationId": "2114907009350774901", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2114375050971296135", "text": "使用 BaoCut Skill 即可做这种排版的视频（需要安装 BaoCut App 配合转录和对齐翻译）：\nhttps://t.co/lU5E1qFsNe\n\n> 帮我做成一条有设计感的版面视频，像档案馆、纪录片那种风格：演讲画面只放在局部，配双语字幕，有章节的话把章节做成副标题，再根据他讲到的内容搜一些相关的历史图片放进去，整体要美观大方、浑然一体。横版", "createdAt": "Sun Oct 25 15:14:29 +0000 2026", "replyCount": 46, "retweetCount": 32, "likeCount": 242, "conversationId": "2114375050971296135", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114374879923273728/img/F1s7sYl2ye_xOVLU.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114374879923273728/img/F1s7sYl2ye_xOVLU.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114374879923273728/vid/avc1/1920x1080/PjDdQP0rRp4GXg9V.mp4?tag=29", "durationMs": 54612}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114904600159346688/img/gI3uY2HLr_B8-s_2.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114904600159346688/img/gI3uY2HLr_B8-s_2.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114904600159346688/vid/avc1/1920x1080/eb1MlrgJV_QqemgE.mp4?tag=29", "durationMs": 4553466}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-27T02:28:18+00:00", "createdAtBeijing": "2026-10-27T10:28:18+08:00", "createdAtLocal": "10-27 10:28 北京", "url": "https://x.com/dotey/status/2114907009350774901", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2114907009350774901", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "张爱玲讲座音频转双语档案风视频", "evidence": "制作这期视频主要还是为了探索音频转成视频", "rationale": "展示具体作品结构，并提供可复用制作提示词"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2114928887499288842", "track": "growth", "source": {"id": "2114928887499288842", "text": "早上收到一个关于GEOInflow的好评，已经有朋友开始陆续用起来了👍 https://t.co/eTwO3EuHoh", "createdAt": "Tue Oct 27 03:55:14 +0000 2026", "replyCount": 5, "retweetCount": 1, "likeCount": 19, "conversationId": "2114928887499288842", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "quotedTweet": {"id": "2114576054018818536", "text": "重磅开源：GEOInflow\n一套面向GEO的网站与AI爬虫分析系统，同时支持完整的访客数据、转化数据统计与分析\nMIT协议，Docker一键部署\n\nGEOInflow将网站访客、AI搜索引荐、服务器抓取日志和内容目录放在同一个网站上下文中\n帮助团队回答这些问题：哪些 AI 蜘蛛访问了网站，访问了哪些内容，哪些关键页面长期缺少抓取记录，访问是否遇到错误，以及AI搜索实际带来了多少访客和转化\n\n核心逻辑与能力：\n1、哪些AI平台在抓你的站（OpenAI、Anthropic、Perplexity、Google、字节、百度、Kimi、腾讯混元…），是训练、AI 搜索，还是用户触发的访问。包括，抓了哪些页面，哪些关键页从没被抓过\n2、同时可以追踪AI搜索引荐来的会话、落地页和转化，看清GEO的真实效果\n3、它也是一套完整的网站统计：PV/UV、事件漏斗、热力图、留存、团队权限与分享\n4、核心统计无需模型API Key，默认无Cookie采集，数据留在你自己的服务器上\n5、系统已整理61种全球范围内各种不同的AI爬虫身份及分类，在这个基础上构建了大量的全新数据分析看板\n\n做GEO，每一次内容调整都值得有数据可以复盘\n欢迎体验和提PR\n\nGitHub地址：https://t.co/DshYcj50be", "createdAt": "Mon Oct 26 04:33:12 +0000 2026", "replyCount": 118, "retweetCount": 154, "likeCount": 1043, "conversationId": "2114576054018818536", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVh7d2gWAAAcfUE.jpg", "width": 2048, "height": 1114, "previewUrl": "https://pbs.twimg.com/media/HVh7d2gWAAAcfUE.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7iW8XEAAiT9B.jpg", "width": 2048, "height": 1119, "previewUrl": "https://pbs.twimg.com/media/HVh7iW8XEAAiT9B.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7ksrWoAA0yVt.jpg", "width": 2048, "height": 1111, "previewUrl": "https://pbs.twimg.com/media/HVh7ksrWoAA0yVt.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7sRrXkAAk3i4.jpg", "width": 2048, "height": 1137, "previewUrl": "https://pbs.twimg.com/media/HVh7sRrXkAAk3i4.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVm8nBQaYAA8EFk.jpg", "width": 870, "height": 238, "previewUrl": "https://pbs.twimg.com/media/HVm8nBQaYAA8EFk.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-10-27T03:55:14+00:00", "createdAtBeijing": "2026-10-27T11:55:14+08:00", "createdAtLocal": "10-27 11:55 北京", "url": "https://x.com/yaojingang/status/2114928887499288842", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2114928887499288842", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "GEOInflow开源网站与AI爬虫分析", "evidence": "MIT协议，Docker一键部署", "rationale": "引用含具体开源工具能力及GEO转化分析用途"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2114900392731357309", "track": "enterprise", "source": {"id": "2114900392731357309", "text": "给 Codex 的那段话\n\n脚本不用自己敲，交代给 Codex 就行。我会写成这样：\n\n用 $exploratory-data-analysis 分析 data/orders.csv。\n先跑 capability_manifest 确认格式，再出 EDA 报告。\n缺失值标记是 NA 和 -，按 user_id 检查 train/test 重叠。\n不许删行、不许填补、不许改原文件，派生文件全部写到 output/。\nEDA 做完，用 $statistical-analysis 比较 app 和 web 两个渠道的客单价，\n图用 $scientific-visualization 出，柱状图从 0 开始，误差线注明是 SD 还是 CI。\n\n后半段交给另外两个技能。\n\nstatistical-analysis 的流程是先定问题再碰数据：比较两组独立样本，默认用 Welch t 检验，不先假定方差相等；它还明确要求不能因为某个诊断检验的 p 值过线，就自动换一种检验方法。前提检查用它自带的 assumption_checks.py，组内异常值、正态性、方差齐性一起看，还会出诊断图。p 值和效应量一起报，最后按 APA 格式写结果。\n\n说白了，p 值看的是这点差异像不像碰巧，效应量看的是差了多少。假如两个渠道客单价只差 3 块钱，样本量一大，p 值照样能很小，可为这 3 块钱调整投放值不值，得看效应量，也得看业务。\n\nscientific-visualization 第一条护栏是不许修改、隐藏、编造数据来让图更好看。柱状图默认从 0 开始，误差线要写清是 SD、SE 还是置信区间，并标上 n。", "createdAt": "Tue Oct 27 02:02:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2114900388935520652", "inReplyToStatusId": "2114900391808635201", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmhdkwacAA7EUt.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HVmhdkwacAA7EUt.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-27T02:02:01+00:00", "createdAtBeijing": "2026-10-27T10:02:01+08:00", "createdAtLocal": "10-27 10:02 北京", "url": "https://x.com/sitinme/status/2114900392731357309", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2114900392731357309", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "业务 CSV 分析提示词与统计护栏", "evidence": "不许删行、不许填补、不许改原文件", "rationale": "提供可复用提示词、检验流程与制图规范"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115204529943896141", "track": "tools", "source": {"id": "2115204529943896141", "text": "大家好，今天我们发布了 SGLang Omni v0.2.0。本版本共合入 134 个 PR，迎来 15 位新贡献者，首次贡献者共合入 17 个 PR。新增腾讯混元 Hy-SimulMT 中英实时语音翻译、Qwen3-Omni Speculative Decoding 和 PersonaPlex 原生全双工，持续优化核心模型推理性能、流式播放与打断体验，并扩展硬件支持、Runtime 资源管理和 Voxt 语音输入能力。\n\n1.交互式智能基建：PersonaPlex 新增原生全双工，Nemotron VoiceChat 支持可配置多会话容量；Session Graph 完善语音打断、播放进度确认、历史截断与逐词字幕同步，Qwen3-ASR 支持级联系统中的增量转写。\n\n2. 实时语音翻译：新增腾讯混元 Hy-SimulMT-30B-A3B，支持中文 ↔ 英文双向语音翻译，实现流式音频输入与增量译文输出，已在单张 H200 上验证 BF16 推理与实时接口。\n\n3. Speculative Decoding：Qwen3-Omni Thinker 新增 DFlash／EAGLE3，复用共享 draft worker 与多模态输入接口。\n\n4. 性能上持续优化 Qwen3-ASR／TTS／Omni、CosyVoice3、MOSS-TTS、PersonaPlex 和 Nemotron，覆盖 prefill／decode 重叠、CUDA Graph、PackedDiT、reference encoding、采样与 kernel fusion。\n\n5. 硬件上 MiniCPM-o 扩展至 Ascend NPU，覆盖图像、视频、语音与全双工；Intel XPU 新增 ARK-ASR Encoder Graph 和 Qwen3-TTS attention backend 自动选择；MOSS-TTS 在支持的 SM120 配置上启用 FlashAttention 4，并完善 Qwen3-ASR／TTS 的 NPU 执行路径。\n\n6. Runtime 通过 warmup 后 GC freeze 和固定 compute 线程池，减少堆扫描开销与线程相关显存增长，完善 stage 故障上报、通信失败追踪、大 chunk 分片、会话超时与取消资源回收。\n\n7. 原生 MLX 与 Voxt：原生 C++ runtime 新增 Voxtral TTS 和 MiniMax Music3，Music3 支持可选的串行 stage offload；Voxt 将本地识别、VAD 和说话人分离统一至 Native HTTP／WebSocket runtime，完善模型文件生命周期管理、应用内自动更新与 Homebrew 发布流程。", "createdAt": "Tue Oct 27 22:10:33 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 4, "conversationId": "2115204529943896141", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115204439024017408/img/bAqHntn3eJk-rn2M.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115204439024017408/img/bAqHntn3eJk-rn2M.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115204439024017408/vid/avc1/3840x2160/ge3DAYC-DY93_RmK.mp4?tag=29", "durationMs": 86400}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-10-27T22:10:33+00:00", "createdAtBeijing": "2026-10-28T06:10:33+08:00", "createdAtLocal": "10-28 06:10 北京", "url": "https://x.com/GenAI_is_real/status/2115204529943896141", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2115204529943896141", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "SGLang Omni发布及硬件验证", "evidence": "已在单张 H200 上验证 BF16 推理与实时接口", "rationale": "提供具体发布成果、硬件验证和资源管理改进"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2115025880322035759", "track": "creative", "source": {"id": "2115025880322035759", "text": "AI 还是太牛逼了，我刚搓个 3D 游戏，并配了宣传片，建模、绑骨、配乐、剪辑，全是一把梭哈，前后几个小时…...\n\n随便丢一张图进去，杯子、涂鸦，几分钟就能变成 3D 角色，而且可以操作战斗⚔️，精细度非常高😋\n\n整个录制、剪辑也都是 AI 自己做的，我只是让它做个宣传片，着实很逆天…\n\n整个游戏执行流程：\n1、Claude 先看图：判断它该用人形、四足、蛇还是蜘蛛的骨架，起名字、定属性和配色，再从特效库里给它挑招式。\n\n2、GPT-Image 把原图重画成标准姿势的设定图，人形就画成 T-pose，四足就四条腿站直，姿势跟骨架对齐，然后再去绑骨。\n\n3、设定图丢给 Hi3D 生成 3D 模型，带 PBR 贴图，大概 5 分钟一个。全程是 Claude 直接调 Hi3D 的 MCP。\n\n4、模型出来以后自动标骨骼点、自动蒙皮，再套上 Mesh2Motion 的开源动作库，走、跑、出拳、放大招全有了。\n\n5、打斗是 three.js 在浏览器里实时跑的，AI 自己出招，镜头自己切，打完一键剪出 15 秒高光。\n\n连这条宣传片都是脚本剪的，配乐也是代码生成的。", "createdAt": "Tue Oct 27 10:20:39 +0000 2026", "replyCount": 18, "retweetCount": 9, "likeCount": 35, "conversationId": "2115025880322035759", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "quotedTweet": {"id": "2114923036516471083", "text": "蛙趣，刚用 Opus5.5 + Hi3D 跑一个通宵搓的游戏，这个精细度，真的很哇塞！\n\nOpus5.5编排 + Image-2.5 出图 + Hi3D MCP 做模 + Three.js 装配\n\n整套做法分享给大家：\n1、概念与多视角参考图：GPT-Image-2.5\n先让 GPT-Image-2.5 出多视角的概念图和参考图（正面、侧面、背面），把材质纹理和结构确定。\n\n2、高精 3D 资产建模：Hi3D MCP\n把 Hi3D 的 MCP 接进 AI工具，需要时会把参考图喂给 Hi3D MCP，秒级生成带完整 PBR 材质的高精 3D Mesh。\n\n3、Web 端性能优化：自动减面与 Draco 压缩（关键避坑点）\nAI 生成的原生模型动辄几十万面，直接丢进网页必卡，让 AI 调用 MCP 时加入 LOD 网格简化并压成 Draco 格式的 glb。\n\n4、逻辑与场景组装：Three.js / WebGL\n模型就绪后，AI 自动编写 Loader 异步加载，补齐物理碰撞体、海水着色器、光影和粒子特效，拼成完整可交互的世界。\n\n5、音效和配乐：WebAudio 实时合成\n\n另外，@Hi3D_AI 刚把 V1.0 开源了，由 200 万真实生产资产训出，细节还原和多视角保真都很顶，堪称目前最扎实的工业级开源 3D 模型，摆明就是奔着 3D 赛道的 AI Infra 去的。", "createdAt": "Tue Oct 27 03:31:59 +0000 2026", "replyCount": 47, "retweetCount": 11, "likeCount": 125, "conversationId": "2114923036516471083", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114917822858252288/vid/avc1/1920x1080/6uJU__VlRQkqz-hc.mp4?tag=29", "durationMs": 65400}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115024838473781248/img/JFjXfiUryfOUuB-i.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115024838473781248/img/JFjXfiUryfOUuB-i.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115024838473781248/vid/avc1/1920x1080/JQHxtMsj6dYEb-fL.mp4?tag=29", "durationMs": 56791}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "余温", "role": "内容、视觉与多模态实践与观察", "why": "公开生图、建模和 Three.js 装配的完整链路，跨多模态工具价值明显。", "handle": "gkxspace"}, "createdAtIso": "2026-10-27T10:20:39+00:00", "createdAtBeijing": "2026-10-27T18:20:39+08:00", "createdAtLocal": "10-27 18:20 北京", "url": "https://x.com/gkxspace/status/2115025880322035759", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2115025880322035759", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "图片生成可战斗的 3D 角色与游戏宣传片", "evidence": "自动标骨骼点、自动蒙皮", "rationale": "自述完整游戏成果，详列建模动画与剪辑流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, {"id": "2115050711566471675", "track": "tools", "source": {"id": "2115050711566471675", "text": "👍", "createdAt": "Tue Oct 27 11:59:20 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2115050711566471675", "author": {"username": "wey_gu", "name": "Wey Gu 古思为", "profileImageUrl": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}, "authorId": "24313912", "quotedTweet": {"id": "2115044871845105975", "text": "Multi-hop traversal on Lance, without a join per hop 🧭\n\nIn lance-graph, every relationship hop is a join between edge and node tables. A multi-hop query repeats that join at each step, building a hash table and materializing every intermediate path each time.\n\nlance-csr takes another route. Neighbours are stored together in a compressed sparse row (CSR) adjacency index, so a hop becomes an array lookup instead of a join. Hops the CSR can’t express fall back to a join.\n\nHDC Labs now maintain the project as an Apache 2 fork of lance-graph, written in Rust on Apache DataFusion, with Python bindings. It is a research test bed asking how far DataFusion can be pushed for multi-hop graph traversal over a columnar format.\n\nHow it runs\n- Multimodal data and graph stay on disk in LanceDB\n- Tables are read lazily or held in memory\n- Queries see a consistent snapshot, and refresh() picks up committed changes\n- The CSR updates incrementally, with a full rebuild when needed\n\nWhat the fork adds\n- Cypher broad enough for all 14 GDC (formerly LDBC) Interactive complex queries, including OPTIONAL MATCH, EXISTS and shortestPath\n- Planning that starts each pattern at its most selective node\n- Correctness fixes to inherited behavior, each backed by a regression test\n- Prebuilt Python wheels for Apple Silicon macOS and x86-64 Linux\n\nIn the project’s own unaudited benchmarks (SF1, Apple M5), the 14 queries run 3.9× faster than Neo4j with tables in memory and 1.8× faster with Lance on disk (geometric mean).\n\nThe scope is deliberate: lightweight, embeddable, single machine, Lance only. Other Rust projects cover fast graph traversal, and distributed execution is out of scope here.\n\nCredit goes to Beinan Wang, Chunxu Tang and the lance-graph contributors for the Cypher parser, semantic analysis, DataFusion planner and Python bindings, and to the DataFusion community. Contributions from people and their coding agents are welcome. ⭐\n\nBy HDC Labs\n\nhttps://t.co/m9eZEgvLru\n\n#Cypher #DataFusion #LanceDB #Rust #OpenSource #Python #DataScience\n\n--\n\n📩 The Year of the Graph Autumn 2026 newsletter issue is out!\n\nMeaning, Traversal, Reasoning, Action: The Graph Stack for Agentic AI. 👇\n\nhttps://t.co/YfrPw2nFzS\n\nAll things #KnowledgeGraph, #GraphDB, Graph #Analytics / #DataScience / #AI and #SemTech.\n\nSubscribe and follow to be in the know. Reach out if you’d like to be featured", "createdAt": "Tue Oct 27 11:36:07 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 6, "conversationId": "2115044871845105975", "author": {"username": "TheYotg", "name": "The Year of the Graph", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327510937616723969/JvU6bp_a_normal.jpg"}, "authorId": "1327510514549858305", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVomGduX0AASjGT.jpg", "width": 1411, "height": 300, "previewUrl": "https://pbs.twimg.com/media/HVomGduX0AASjGT.jpg:small"}], "translationZh": "在 Lance 上进行多跳遍历，无需每一跳都做连接 🧭\n\n在 lance-graph 中，每次沿关系跳转都要对边表和节点表进行连接。多跳查询在每一步都会重复这一连接，每次都要构建哈希表，并将所有中间路径物化。\n\nlance-csr 采用了另一种方式。相邻节点集中存储在压缩稀疏行（CSR）邻接索引中，因此每一跳只需查询数组，无需连接。CSR 无法表达的跳转则回退到连接操作。\n\nHDC Labs 目前维护着这个项目。它是 lance-graph 的一个分支，采用 Apache 2 许可证，基于 Apache DataFusion 以 Rust 编写，并提供 Python 绑定。作为研究试验平台，它探索的是：在列式格式上执行多跳图遍历时，DataFusion 的能力能推到什么程度。\n\n运行方式\n- 多模态数据和图均存储在 LanceDB 的磁盘上\n- 表采用延迟读取，或驻留内存\n- 查询使用一致性快照，refresh() 用于获取已提交的变更\n- CSR 以增量方式更新，必要时完整重建\n\n该分支新增的能力\n- Cypher 支持范围足以覆盖全部 14 个 GDC（原 LDBC）交互式复杂查询，包括 OPTIONAL MATCH、EXISTS 和 shortestPath\n- 查询规划从每个模式中筛选能力最强的节点开始\n- 修复继承实现中的正确性问题，每项修复均有回归测试支持\n- 为 Apple Silicon macOS 和 x86-64 Linux 提供预构建的 Python wheel 包\n\n在项目自行开展、未经独立审计的基准测试中（SF1，Apple M5），这 14 个查询在表驻留内存时的运行速度为 Neo4j 的 3.9 倍，使用磁盘上的 Lance 时为 1.8 倍（几何平均值）。\n\n项目有意限定了范围：轻量、可嵌入、单机运行，仅支持 Lance。其他 Rust 项目也提供快速图遍历能力，分布式执行不在本项目范围内。\n\n感谢 Beinan Wang、Chunxu Tang 及 lance-graph 贡献者提供的 Cypher 解析器、语义分析、DataFusion 规划器和 Python 绑定，也感谢 DataFusion 社区。欢迎大家和各自的编程智能体参与贡献。⭐\n\n作者：HDC Labs\n\nhttps://t.co/m9eZEgvLru\n\n#Cypher #DataFusion #LanceDB #Rust #OpenSource #Python #DataScience\n\n--\n\n📩 The Year of the Graph 2026 年秋季通讯已发布！\n\n语义、遍历、推理、行动：面向智能体 AI 的图技术栈。👇\n\nhttps://t.co/YfrPw2nFzS\n\n涵盖 #KnowledgeGraph、#GraphDB、图 #Analytics / #DataScience / #AI 和 #SemTech 的各类资讯。\n\n欢迎订阅并关注，及时获取动态。如希望获得专题介绍，欢迎联系。"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "Wey Gu 古思为", "role": "模型、研究与推理实践与观察", "why": "Agent 跨机器会话、记忆及设备体验具有应用价值，可补当前覆盖。", "handle": "wey_gu"}, "createdAtIso": "2026-10-27T11:59:20+00:00", "createdAtBeijing": "2026-10-27T19:59:20+08:00", "createdAtLocal": "10-27 19:59 北京", "url": "https://x.com/wey_gu/status/2115050711566471675", "themeId": "editorial", "signalScore": 46, "editorial": {"id": "2115050711566471675", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "lance-csr 图遍历开源工具", "evidence": "a hop becomes an array lookup", "rationale": "提供开源实现与具体机制，性能为项目自测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}, {"id": "2115148262772715682", "track": "agent", "source": {"id": "2115148262772715682", "text": "The evals book is here. Hamel is the evals 🐐 and I’m lucky he wanted to write this book with me!! We are grateful for our reviewers, editors, illustrators and readers. Order it on Amazon; or come to our book signing to get a copy (link in replies).", "createdAt": "Tue Oct 27 18:26:58 +0000 2026", "replyCount": 18, "retweetCount": 23, "likeCount": 239, "conversationId": "2115148262772715682", "author": {"username": "sh_reya", "name": "Shreya Shankar", "profileImageUrl": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, "authorId": "2286218053", "quotedTweet": {"id": "2115139454268539260", "text": "I read the error analysis chapter of Evals for AI Engineers by @HamelHusain and @sh_reya and realised I already had the dataset.\n\nSome backstory. I work with coding agents all day: Claude Code, Codex, Hermes, Antigravity. Every session is a trace. What I typed, every tool call, what came back, what it said. Hundreds of them, sitting on disk, never read.\n\nThe chapter says: don't start with metrics. Read traces end to end. Mark the first step where it went wrong and write one short note in your own words. Yes or no verdict per trace, no scores out of 5. Only after 20 marked traces do you group them into failure types. And don't let a model invent the categories, it will hand you \"hallucination\" and miss the ones specific to your system.\n\nSo I built it into the dashboard I use to watch my agents. Last 14 days, up to 200 sessions per app, 431 when I took the screenshot. Each step has one button: mark this as the failure. Every mark lands in a Failures list with the note and a CSV download.\n\nThe first failure it found was in the list itself. 193 of the 200 newest Claude rows were \"Untitled\". My own usage check had been running every 10 minutes and left 1,893 throwaway sessions that pushed the real ones out. Filtered, 117 real sessions named. If the sample is wrong, the reading is wrong before it starts.\n\nFirst real mark: an agent said a metronome app was done before it had looked at it. A stop hook had to force the screenshot. No category yet. Just the note.\n\nThe agent's answer is not the data. The trace is the data.", "createdAt": "Tue Oct 27 17:51:57 +0000 2026", "replyCount": 6, "retweetCount": 2, "likeCount": 33, "conversationId": "2115139454268539260", "author": {"username": "Dandiggastech", "name": "Daniel Adekugbe", "profileImageUrl": "https://pbs.twimg.com/profile_images/2070996119618777088/x7oRGA0s_normal.jpg"}, "authorId": "2070972618371448832", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVp8HfXXoAAclsc.jpg", "width": 2048, "height": 1280, "previewUrl": "https://pbs.twimg.com/media/HVp8HfXXoAAclsc.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVp8Hw7XMAEK2Jj.jpg", "width": 1560, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVp8Hw7XMAEK2Jj.jpg:small"}], "translationZh": "读完 @HamelHusain 和 @sh_reya 合著的《Evals for AI Engineers》中关于错误分析的章节，我意识到，自己已经有了所需的数据集。\n\n先交代一下背景。我每天都在使用编程智能体：Claude Code、Codex、Hermes、Antigravity。每次会话都是一份执行轨迹，记录着我的输入、每次工具调用、返回结果，以及智能体说过的话。几百份记录躺在磁盘里，从未有人读过。\n\n书里说：不要从指标入手。先从头到尾读完执行轨迹，标出第一个出错的步骤，再用自己的话写一条简短备注。每份轨迹只判定成功或失败，不打五分制评分。标注完 20 份轨迹后，再按失败类型归类。也不要让模型凭空编分类，否则它只会给出“幻觉”之类的标签，却漏掉你这个系统特有的问题。\n\n于是，我把这套流程做进了平时监看智能体的仪表盘：查看最近 14 天的记录，每个应用最多 200 次会话，截图时共有 431 次。每一步都有一个按钮：将此步标记为失败点。所有标记都会进入 Failures 列表，附有备注，还能下载 CSV。\n\n发现的第一个问题就在列表本身。最新的 200 条 Claude 记录中，193 条都叫“Untitled”。原来，我自己的用量检查每 10 分钟运行一次，留下了 1,893 个临时会话，把真正的会话挤出了列表。过滤后，找到了 117 个有标题的真实会话。样本错了，分析还没开始就已经错了。\n\n第一个真正的失败标记：智能体还没查看节拍器应用，就宣称已经完成。最后得靠停止钩子强制它截图。暂时不归类，只记下这条备注。\n\n智能体的回答不是数据，执行轨迹才是数据。"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Shreya Shankar", "role": "UC Berkeley / AI 工程研究员", "why": "评测、LLM Pipeline、AI 工程学科化", "handle": "sh_reya"}, "createdAtIso": "2026-10-27T18:26:58+00:00", "createdAtBeijing": "2026-10-28T02:26:58+08:00", "createdAtLocal": "10-28 02:26 北京", "url": "https://x.com/sh_reya/status/2115148262772715682", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2115148262772715682", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "基于完整轨迹的 Agent 错误分析", "evidence": "Read traces end to end.", "rationale": "引用包含失败标注方法、样本污染复盘及工具实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "AI 评估这本书终于出版了。Hamel 是评估领域的大神 🐐，很幸运他愿意和我合著这本书！！感谢所有审稿人、编辑、插画师和读者。可以在 Amazon 下单，也可以来我们的签售会购买（链接见回复）。"}, "avatar": "https://pbs.twimg.com/profile_images/1342529111839944705/hzr44mb5_normal.jpg"}, {"id": "2115036397799428313", "track": "agent", "source": {"id": "2115036397799428313", "text": "Matt Pocock：AI 时代最该练的，是说清你在乎什么，并让代码库配得上 Agent\n\n来自 @nateherk 对 @mattpocockuk 44 分钟的访谈，Pocock 认为：最值钱的肯定不是追最新模型，是两件事：把你在乎什么说清楚，以及把测试、代码质量和流程做到 agent 能靠得住；他自己试了几个月 Spec 驱动开发，代码反而越来越差。\n\nYoutube 视频：\nhttps://t.co/jqPorXoisJ\n\nPocock 什么时候开始改主意\n自学约十年、职业约八年，对 coding agent 一直偏怀疑。大约 2025 年 12 月 Opus 4.5 出来后，他觉得门槛过了：自己不再手写一行代码。他本来就爱改善同事的工作环境和教学；agent 够用以后，同样的本事转向「怎么让 agent 工作得更好」。\n\n核心：告诉 agent 你在乎什么\n人和 agent 之间有一道常被低估的沟通鸿沟。它不知道你到底要什么，也不知道你在乎什么，所以要反复说清楚。代码库没人维护、全是随便拼出来的，agent 也只能交出垃圾，还是 garbage in, garbage out。正确做法像给最差的人类同事兜底：测试、检查、挡住一类错误。经典软件工程因此又有用了。Agent 也能教你，但要保持怀疑，优先读一手材料。他的 /teach 会找可信来源并标注出处，用 AI 当导读，再读原文。\n\n机会在哪\n变化大，机会也多：教人、做嵌 AI 的产品、帮公司改系统。咨询或内部晋升都一样，押可带走的能力。模型再强，仍要学：怎么信任、怎么组织多个 agent、给它什么信息、怎么把公司流程翻成 agent 能跑的工作流。代码和数学容易验；真实知识工作更难，把这类流程打包给组织，是一块大机会。\n\n未知的未知与 Grill Me\n「Pragmatic Programmer」说：没人一开始就知道自己要什么。他的高频 skill grill me 让 agent 不停追问，挖出你真正在乎的上下文；Grill with Docs 再帮你建领域用语（DDD 里的 ubiquitous language：代码、库表、界面、客户、用户说同一套词）。关键能力是意识到「还有自己不知道的空白」，设计在落成代码之前都不算完成。\n\n怎么显得靠谱\n「周末堆作品集」很难建立信任。客户要的是懂他们在乎什么的人。用 agent 快速做出能证明你懂业务的原型就够。真正跑得好的人，往往是最会沟通的人，想清楚了，PR、产品和给 agent 的指令都会清楚。\n\nSpec 驱动为什么踩坑（26:03）\n受 AI Engineer 上 OpenAI 一侧「specs are the new code」启发，他在个人类 Descript 的视频编辑仓库里试了几个月：规格越写越细，再让 agent 生成代码。结果代码质量一路下滑，agent 也越做越差。他后来认定：代码本身就是 agent 的工作环境；能安全改动的可维护代码，比一直活在规格里更管用。模型不会读心，skills 和流程会长期需要；大家也低估了 harness（Claude Code、Codex 这类），别只看模型牌子。\n\n模型、Harness、Effort\n他现在常用 Claude Code + Opus 5.5。一个鲜明看法是：多数人把 effort 开太高。他自己用 medium，还考虑再降，换更快回复和更省 token，因为测试已经把底线抬起来了。让 agent 能开浏览器、看截图，往往比换更新的模型更赚；环境好的旧 Opus 4.5，可以压过环境差的新模型。Harness 选 Claude Code、Codex 或 Copilot 都行，别纠结太久。\n\n怎么开始\n先装一个主流 harness，要不要用他的 skills 随意。他提到 Lauren Tan（Twitter 上的 Potato，做 Grok Bot）说的 trust ladder：先学会刹车，再踩油门。空文件夹、一个真想法，盯着看；再扩到多 agent、自定义 skill、接 Slack 和邮件。别一上来就丢最难的活，先给琐碎、无聊、能衡量、改错成本低的事（比如回信草稿），再谈野心。\n\n他接下来兴奋什么\n自认是老师，不是评论家。他在想 software factories：怎么稳定地把想法变成工作和长期改库；多 agent 怎么组织，现在还没答案。也期待开源模型接近 Opus 5.5，以及更省 token、说话更直白、能干活的模型。", "createdAt": "Tue Oct 27 11:02:27 +0000 2026", "replyCount": 26, "retweetCount": 13, "likeCount": 76, "conversationId": "2115036397799428313", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoeXxrbsAA_4Mn.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVoeXxrbsAA_4Mn.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T11:02:27+00:00", "createdAtBeijing": "2026-10-27T19:02:27+08:00", "createdAtLocal": "10-27 19:02 北京", "url": "https://x.com/shao__meng/status/2115036397799428313", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2115036397799428313", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent代码库治理与规格驱动复盘", "evidence": "规格越写越细，再让 agent 生成代码", "rationale": "包含规格驱动失败复盘及测试、沟通和环境方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115033908748161207", "track": "agent", "source": {"id": "2115033908748161207", "text": "推荐一个 Infini-AI-Lab 最近开源的项目 Hermit，专门做 Agent Harness 的持续学习与自进化，我觉得它的设计思路很值得关注。\n\n现在想让 Agent 从任务经验中持续改进，其实有两个很现实的问题。\n\n一是成熟的 Harness 往往很复杂，甚至是闭源的。直接修改内部的工具调度、上下文管理和执行逻辑，成本高，还容易破坏原有系统。\n\n二是现在 Agent 自进化算法越来越多，但每套方法都有自己的执行、反馈和评估流程。想换一种算法，或者接入自己的任务，经常需要重新适配一遍。\n\nHermit 提出的解决方案是 Harness Adapter。\n\n简单理解，就是给现有 Agent 外挂一层可训练的 Harness Adapter，里面可以包含 Prompt、Skills、Memory、工具甚至多 Agent 协作逻辑。通过任务执行轨迹和反馈不断优化这层 Adapter，原来的模型和 Harness 都不需要修改。\n\n而且它并不局限于 Codex、Claude Code，也支持通过 Python 接口和自定义 Pipeline 接入自己开发的 Agent。\n\n更值得关注的是，它把 Agent 自进化的训练流程统一了起来，任务执行、反馈收集、Adapter 更新、检查、版本管理和评估都可以复用同一套框架。\n\n目前已经集成了 GEPA、SkillOpt、MWM、Harness²、Continual Harness 等多种方法，研究者可以在此基础上实现和比较自己的进化算法。\n\n这种思路还是比较看好。现在 Agent 自进化的研究很多，但如果每提出一种新方法，都要重新搭建一套训练和评估系统，研究和工程成本都会很高。\n\nHermit 的价值就在于尝试为 Harness Evolution 建立一套通用的基础设施。\n\n但做 Agent Memory、Harness、自进化和持续学习的朋友，可以重点关注一下。\n\nGitHub：https://t.co/XDz1c9QVdK", "createdAt": "Tue Oct 27 10:52:33 +0000 2026", "replyCount": 9, "retweetCount": 19, "likeCount": 100, "conversationId": "2115033908748161207", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-27T10:52:33+00:00", "createdAtBeijing": "2026-10-27T18:52:33+08:00", "createdAtLocal": "10-27 18:52 北京", "url": "https://x.com/Xudong07452910/status/2115033908748161207", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2115033908748161207", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Hermit Agent Harness持续进化框架", "evidence": "原来的模型和 Harness 都不需要修改", "rationale": "介绍开源框架架构、算法集成及训练评估流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2114922786606944490", "track": "research", "source": {"id": "2114922786606944490", "text": "只看成功案例，也能找出 Agent 到底在哪一步开始犯错。\n\nNeurIPS 2026 这篇 OAT 做了一个挺反常识的设定：\n\n训练阶段完全不看失败轨迹，也不需要人工标注「第几步错了」。\n\n它只学习不到 100 条成功轨迹，建立一条「正常 Agent 行为应该怎么演化」的路径。\n\n等真正遇到失败轨迹时，再检查每一步偏离这条成功路径有多远。偏离越明显，就越可能是导致失败的关键步骤。\n\n这样做的好处很直接。\n\n在域内评测上，OAT 的 F1 比 GPT-5 等 prompting 方法高约 20%；换到完全不同的多 Agent 数据集，依然高约 7%。\n\n速度差距更夸张：推理阶段不需要再调用 LLM，延迟只有几到十几毫秒，比 prompting-based 方法快 200–5000 倍。\n\n标题「Tracing Failure from the Flow of Success」已经可以很好提现论文的方法了。\n\n以后调试长时 Agent，可能未必要让另一个大模型从头读完整条失败轨迹。\n\n先学会「正常执行是什么样」，再去找哪里开始偏航，有可能更轻、更快，也更容易规模化。\n\n📎 arxiv: https://t.co/glygr43xds", "createdAt": "Tue Oct 27 03:31:00 +0000 2026", "replyCount": 8, "retweetCount": 7, "likeCount": 87, "conversationId": "2114922786606944490", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkgHMNX0AAe8Nv.jpg", "width": 1146, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HVkgHMNX0AAe8Nv.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-27T03:31:00+00:00", "createdAtBeijing": "2026-10-27T11:31:00+08:00", "createdAtLocal": "10-27 11:31 北京", "url": "https://x.com/Xudong07452910/status/2114922786606944490", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2114922786606944490", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "OAT通过成功轨迹定位Agent故障", "evidence": "它只学习不到 100 条成功轨迹", "rationale": "介绍研究方法及
