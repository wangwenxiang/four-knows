const DATA={"records": [{"id": "2117976436577550546", "track": "research", "source": {"id": "2117976436577550546", "text": "MIT 公开课 6.S950 Agency with AI\n\n第 7 课：Outsourced Data 讲义公布了，主题：用别人的数据，也就接受了别人的选择；下载或 fork 一个数据集，等于接受了别人对收集范围、过滤方式和标注规则的决定。让 AI Agent 去抓数据时，这些决定有很大一部分由模型悄悄替你做了。这一讲用大量真实案例和课程组自己的实验说明，数据里的风险要靠人主动检查。\n\n讲义：https://t.co/8up7KqO8XK\n\n开场问题：这条记录是谁决定的\n\n课程组让 Claude Haiku 5.5 把一篇 TIME 文章抓成 JSON 记录，然后问学生：怎么请求网页、记录有哪些字段、每个字段填什么，这三步分别是人决定的还是 Claude 决定的？结尾给出答案：请求方式和字段是人选的，字段里填什么是 Claude 选的。整讲分四部分：需要什么数据；泄漏、近似重复和分布偏移；继承来的选择和风险；用 AI Agent 收集数据。\n\n先定义预测任务，再选数据集\n\n讲义要求先回答四个问题：数据要代表哪些人群，预测什么、用哪些字段，部署时面对的是新的人、新的文档、新的地点还是新的时间段，以及什么算一条记录、每个字段放什么。\n\n几个例子说明，覆盖范围有偏差，样本再多也没用：\n· 1936 年《文学文摘》民调：寄出约一千万张选票，收回约 240 万张，预测兰登会赢，结果罗斯福赢下 48 个州中的 46 个。讲义指出，即使所有人都回复，预测会好一些，但仍然会低估罗斯福的得票率。\n· Google C4：用一份「脏词表」过滤网页，一个词命中就丢掉整页。审计发现，被过滤掉的内容里，来自少数群体或关于少数群体的文本占比偏高。课程组自己用 13 篇维基百科文章复现了这条规则，「Sex」一词会让「同性婚姻」相关条目被丢掉，MIT 的条目也因为写出了 IHTFP 的全称被丢掉。\n· FineWeb-Edu：换成学习得到的「教育性」评分后，这 13 篇都保留下来，但论坛帖、新闻和研究论文被排除了。讲义的结论是，换过滤器只是换了被排除的内容，排除本身还在。\n· GeoDE 与提问语言：同一类物体在不同地区差别很大。课程组用中文、英文等四种语言各问 Claude 十次南沙群岛归属，回答随语言变化。只用一种语言的测试集，只覆盖了一类人群。\n\n泄漏、近似重复和分布偏移\n\n· 近似重复：CIFAR-100 有 891 张测试图在训练集里有近似副本，换掉之后 ResNet-110 的测试错误率从 26.05% 升到 29.24%。车牌数据集 AOLP 中，同一块车牌的多张照片可能同时出现在训练集和测试集，按车牌分开后识别准确率从 99.18% 降到 96.94%。\n· 划分方式决定回答什么问题：用加州房价数据对比随机划分和按地区划分，如果模型要部署到没见过的地区，就要整块留出地区。\n· 站点泄漏：一个肺炎 X 光模型能以超过 99.9% 的准确率认出图片来自哪家医院，换到第三家医院测试时问题才暴露。多来源数据要在模型没训练过的站点上测试。\n整体准确率掩盖子群体失败：Lab 1 的最近邻分类器在 214 辆新车上准确率为 71%，但 5 辆电动车全部判错。报告子群体得分时，要同时给出样本数。\n\n讲义把分布偏移分成三种：输入分布变了（协变量偏移），标签比例变了（标签偏移），输入和标签之间的关系变了（概念偏移）。前两种各有修正办法，而且训练数据覆盖部署数据所在的范围；标签比例变化可以按类别比例重新缩放预测概率，不用重新训练。\n\n继承来的标签和风险\n\n· 标签定义变了：Lab 1 的老车（1970–82）用的是固定油耗阈值；新车（1982–2015）的「高油耗」是指比当年新车平均水平差，阈值逐年变化。新车的来源说明文件里写了这一点。三种偏移在这里同时发生，这时该做的是先统一标签定义，而不是套用修正公式。\n· 标签本身有歧义或错误：ImageNet 里标成「原声吉他」的图也可以标成「舞台」；MMLU 的答案也有错。看分数之前，先抽读一部分题目和答案。\n· 谁标注、标注什么：仇恨言论数据集里，标注员知道推文用的是哪种方言后，标为冒犯的比例下降。一个医疗算法把未来医疗支出当作训练标签，但支出同时反映了就医机会的不平等，结果在同样的风险分下，黑人患者的慢性病更多。\n· 数据集的安全和来源：Hugging Face 数据集里扫出了仍然有效的密钥，fork 会把它们一起复制出去。已撤回的人脸数据集，还活在它的副本和衍生模型里。只发布链接列表的图像数据集，内容由链接所在网站后来的控制者决定，所以要保存文件或哈希值。\n\n用 AI Agent 收集数据\n\n· robots.txt 只是请求：它说明哪些路径不希望被爬，但并不能阻止爬虫。课程组保存了 12 个网站的 robots.txt，如果 Common Crawl 遵守这些规则，未来的网页数据集会失去其中 8 个网站。\n· Agent 会绕过限制：讲义引用 Anthropic 2026 年 10 月的报告，模型遇到付费墙时会自己绕过去。Shen Shen 还展示了自己的 Claude Code 在没有询问的情况下把她的邮箱地址发了出去。建议是事先写明访问失败时 Agent 该怎么做，并记录它实际走了哪条路。\n· 网页里的提示注入：Google 扫描 Common Crawl 时，找到了专门写给 AI Agent 的指令，大多是恶作剧或教学材料，也没有发现真正生效的案例。建议限制采集器能抓取和执行的内容，并且要看它的请求日志，而不只是看产出的记录。\n· 同一个 URL 返回不同内容：用浏览器、curl 伪装成 Chrome、curl 伪装成 ClaudeBot 三种方式请求那篇 TIME 文章，拿到的内容不一样。在只保留正文的规则下，Claude 三次都漏掉了 Instagram 和 Snapchat 的赞助内容，但三次都通过了 schema 检查。Opus 5.5 也一样漏掉了，不过让它对照原网页审计时，它每次都能指出来。通过 schema 检查，不代表字段内容完整。", "createdAt": "Wed Nov 04 13:45:07 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 5, "conversationId": "2117976436577550546", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2103461095566676365", "text": "MIT 公开课 6.S950 Agency with AI：Spec 先于 Prompt，验证先于信任 -- AI 时代工程判断力课程全景解读", "createdAt": "Fri Sep 25 12:26:20 +0000 2026", "replyCount": 3, "retweetCount": 17, "likeCount": 125, "conversationId": "2103461095566676365", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "article": {"title": "MIT 公开课 6.S950 Agency with AI：Spec 先于 Prompt，验证先于信任 -- AI 时代工程判断力课程全景解读", "previewText": "MIT 6.S950《Agency with AI》课程\n \n6.S950: Agency with AI — Effective AI Use in Applied Machine-Learning Projects，MIT EECS 2026 秋季新开的本科课程（12 学分，Course 6 选修），由讲师 Shen Shen", "previewTextZh": "MIT 6.S950《AI 时代的自主行动能力》课程\n\n6.S950：AI 时代的自主行动能力——在应用机器学习项目中高效使用 AI，是 MIT EECS 于 2026 年秋季新开的本科课程（12 学分，Course 6 选修），由讲师 Shen Shen"}}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWSQVkCa8AAKnE_.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWSQVkCa8AAKnE_.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-04T13:45:07+00:00", "createdAtBeijing": "2026-11-04T21:45:07+08:00", "createdAtLocal": "11-04 21:45 北京", "url": "https://x.com/shao__meng/status/2117976436577550546", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2117976436577550546", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "数据集审计、泄漏检测与Agent采集验证", "evidence": "通过 schema 检查，不代表字段内容完整。", "rationale": "提供数据划分、标签审计和采集验证方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117938659047735542", "track": "research", "source": {"id": "2117938659047735542", "text": "给 Agent 装上越来越多的 Skill 后，它连原来会用的 Skill 都开始选错了。\n\n这篇 Skill++ 研究的，就是 Skill Library 规模化以后一个很容易被忽略的问题：路由干扰。\n\n现在很多 Agent 采用渐进式加载。Router 先只看 Skill 的名字和简介，选中以后才加载完整内容。\n\nSkill 少的时候没什么问题。\n\n但 Skill Library 不断增长后，名字相似、描述重叠的新 Skill 会开始抢占旧 Skill 的位置。\n\n论文里有个很直观的例子：\n\n原本有一个用于 AI 论文写作的「paper writing」Skill。\n\n后来又加入一个生物论文写作 Skill，但两者名字和简介几乎一样。\n\n结果同一个 AI 论文任务，Router 开始选错 Skill。\n\n作者把这种现象叫做 routing interference。\n\nSkill++ 的解决方式很轻量：\n\n不重新训练 Router，也不改旧 Skill，只在新 Skill 加入时重写它的名字和描述，明确它能做什么、和相近 Skill 的区别，以及哪些任务不适合调用它。\n\n随着 Skill Library 从 27 个增长到 731 个，原始 metadata 的完整召回率从 92.5% 掉到 36.4%，Skill++ 最后还能保持在 76.3%。\n\n并且在 3 个 benchmark、5 个 LLM Router 上都取得提升，放进 Codex CLI 的真实 Skill Harness 后也依然有效。\n\n所以 Agent 的 Skill 越来越多以后，麻烦会从「缺少能力」，变成「能力太多以后还能不能找到对的那个」。\n\nSkill Library 想长期增长，路由本身也得跟着一起维护。\n\n📎 arxiv: https://t.co/Pb5mkTFjyG", "createdAt": "Wed Nov 04 11:15:00 +0000 2026", "replyCount": 11, "retweetCount": 2, "likeCount": 21, "conversationId": "2117938659047735542", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-04T11:15:00+00:00", "createdAtBeijing": "2026-11-04T19:15:00+08:00", "createdAtLocal": "11-04 19:15 北京", "url": "https://x.com/Xudong07452910/status/2117938659047735542", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2117938659047735542", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Skill++缓解技能库路由干扰", "evidence": "只在新 Skill 加入时重写它的名字和描述", "rationale": "介绍研究方法、规模实验与召回率结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2117835981877592161", "track": "research", "source": {"id": "2117835981877592161", "text": "你花钱调用一个 AI 模型，怎么确定回答你的真是它？尤\n\n其是经过第三方中转时，有没有被偷偷换成更便宜的模型，光看回答质量，其实很难判断。\n\nAnthropic 最近公布的 FlashProve，就是想给这件事提供一份可以验证的“凭证”。\n\n它的思路是：服务商先给模型权重生成一个固定的“指纹”，之后再用密码学证明，说明被检查的输出确实来自这个模型。\n\n用户不用拿到模型权重，也不用自己买 GPU 重新跑一遍，就能检查证明。它验证的是“是不是指定模型算出来的”，并不保证回答本身一定正确。\n\n据团队公布的测试，在 4000 亿参数的 Llama 4 Maverick 上，FlashProve 用单张 H100 生成证明的吞吐约为每秒 110 个 token，单份证明约 19 MB，CPU 验证需要十几到二十秒。\n\n不过，这个速度是事后批量生成证明的速度，不能当成聊天生成速度；生成证明消耗的 GPU 时间，仍然约是普通推理的 70～95 倍。\n\n所以它目前还是研究原型：只支持最长 1024 token 的上下文，证明针对特定的整数计算和贪心解码，也不能直接覆盖日常聊天里的所有生成方式。代码、文档和形式化证明已经开源。", "createdAt": "Wed Nov 04 04:27:00 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 3, "conversationId": "2117835981877592161", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWP-ZHibAAAzgxa.jpg", "width": 1936, "height": 1287, "previewUrl": "https://pbs.twimg.com/media/HWP-ZHibAAAzgxa.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-04T04:27:00+00:00", "createdAtBeijing": "2026-11-04T12:27:00+08:00", "createdAtLocal": "11-04 12:27 北京", "url": "https://x.com/sitinme/status/2117835981877592161", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2117835981877592161", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "FlashProve模型推理来源验证", "evidence": "生成证明消耗的 GPU 时间", "rationale": "介绍密码学验证研究，包含性能数据与适用限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117969787993440649", "track": "tools", "source": {"id": "2117969787993440649", "text": "TemPad Dev：把 Figma 接进 Coding Agent，既能读设计写代码，也能直接改画布\n\n一个 Chrome 扩展加本地 MCP 服务，它让 Codex、Claude Code、Cursor 这类 Coding Agent 能读取 Figma 设计，按项目规范实现成代码；在可编辑的文件里，还能直接新建和修改原生 Figma 图层。设计和开发之间少了一道手工搬运。\n\nhttps://t.co/Orri2QnFi0\n\n两种用法\n\n· 手动检查： 装上扩展，打开 Figma 文件，选中元素就能看到 CSS、JS、变量和布局，不需要配置 Agent。这对只有查看权限、用不了 Dev Mode 的开发者尤其有用。\n\n· 接 Agent： 在设置里打开 MCP 访问，按提示配置你的客户端。配好后可以直接说「用现有组件在 Figma 里做一个设置页」，或者「按这个项目的组件和样式规范实现当前选中的设计」。两种流程共用同一条连接，分别配有 design-in-figma 和 figma-design-to-code 两个 skill，引导 Agent 先查资源、再动手、最后核对结果。\n\nAgent 能调用什么\n\n· 读设计：get_code 默认输出 JSX/Vue + Tailwind，并附带素材和设计变量；get_structure 给节点结构和几何信息；get_screenshot 给渲染截图，用来核对视觉效果；get_design_system 列出组件、变量、样式和字体。\n\n· 改画布：apply_canvas 负责新建、修改、删除页面和图层，扩展会先校验、比对差异，应用后再做结构核对；upload_asset 上传生成的图片。\n\n· 管任务：manage_design_task、set_design_anchor 把一次修改绑定到固定区域，画布上有状态条，可以随时停止或标记完成。在 Codex App 里还能对元素写批注，再成批发给 Agent。\n\n接入范围\n\n官方给出专门配置入口的客户端有 Codex、Claude Code、Cursor、VS Code、Gemini，还有 Qwen Code、Qoder、Kimi Code、Pi、Hermes Agent 等，其他兼容客户端可以走通用的 MCP 配置。需要 Node.js 22、24 或 26 以上；改画布要求对 Figma 文件有编辑权限，只读文件和 Dev Mode 下只能读。连接只走本机 127.0.0.1，同时打开多个 Figma 文件时，点哪个文件的标记，哪个文件就是当前上下文。\n\n其他实用功能\n\n· 单位换算：px 可以转成 rem，也能按比例缩放；变量可以显示为引用、实际值或两者都显示。\n\n· 交互补强：有一键选中最深层节点、测量到选中元素的间距、把选中元素滚动到视图中央等功能，补上了 Figma 只读视图里操作别扭的地方。\n\n· 输出插件：用 definePlugin 自定义代码输出，比如转成 Tailwind、UnoCSS、React Native 或者团队自己的设计系统。社区已经有 Kong、Nuxt UI、百度健康等插件。插件运行在隔离沙箱里，单次调用超过 5 秒会被终止。", "createdAt": "Wed Nov 04 13:18:42 +0000 2026", "replyCount": 16, "retweetCount": 0, "likeCount": 9, "conversationId": "2117969787993440649", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117937251548307589", "text": "I'm happy to announce TemPad Dev 1.0 ⧉\n\nConnect Figma to Codex, Claude &amp; other coding agents. AI creates editable designs with Auto Layout, variables &amp; components, then turns them into code.\n\nBring your own agent. Free &amp; open source (MIT).\n\nhttps://t.co/ladjxJnare https://t.co/xNr4cFDfwk", "createdAt": "Wed Nov 04 11:09:24 +0000 2026", "replyCount": 7, "retweetCount": 4, "likeCount": 29, "conversationId": "2117937251548307589", "author": {"username": "_justineo", "name": "Justineo", "profileImageUrl": "https://pbs.twimg.com/profile_images/1049873523085365248/Z76THGc-_normal.jpg"}, "authorId": "25637130", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117935682002051072/img/vY37AoN75TuaCH-u.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117935682002051072/img/vY37AoN75TuaCH-u.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117935682002051072/vid/avc1/1280x720/lYv3wZxJzIUQ3qOe.mp4?tag=14", "durationMs": 51800}], "translationZh": "很高兴宣布 TemPad Dev 1.0 正式发布 ⧉\n\n将 Figma 连接到 Codex、Claude 等编程智能体。AI 利用 Auto Layout、变量和组件创建可编辑的设计，再将其转化为代码。\n\n可接入你自己的智能体。免费开源（MIT 许可证）。\n\nhttps://t.co/ladjxJnare https://t.co/xNr4cFDfwk"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWSKScva8AAkZ77.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWSKScva8AAkZ77.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-04T13:18:42+00:00", "createdAtBeijing": "2026-11-04T21:18:42+08:00", "createdAtLocal": "11-04 21:18 北京", "url": "https://x.com/shao__meng/status/2117969787993440649", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2117969787993440649", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "TemPad Dev 1.0连接Figma与Coding Agent", "evidence": "I'm happy to announce TemPad Dev 1.0", "rationale": "开源工具发布，说明读写能力与接入限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117934508985196730", "track": "research", "source": {"id": "2117934508985196730", "text": "腾讯混元正式发布 Hy4：首次能看图、能操作电脑，开源权重还在路上，团队对 Hy4 与顶级闭源模型的差异非常坦诚！\n\nHy4 第一次加上视觉和 Computer Use，主打金融、办公、前端游戏和科研。已进入最强开源阵营，但团队也坦诚和顶尖闭源模型仍有明显差距；权重「计划开源」，眼下主要通过 API 和腾讯产品可用。\n\nhttps://t.co/yU0yMEtDcA\n\n# 模型信息\n\nHy4 总参数约 770B，MoE 架构，上下文 1M token。相对 8 月的 Hy4 preview，正式版大幅加了预训练和后训练。新能力有两块：第一次能看图，能做细粒度识别、复杂图表分析和视觉数学推理；第一次支持 Computer Use，命令行和图形界面都能操作，还专门练过 Blender、CAD 这类专业软件，以及跨应用的长周期任务。\n\n# 几个主打场景\n\n金融方面，腾讯和 FiT 做了几千个工作区、上万个任务，覆盖基金研究、个股分析、量化、资产配置、公司财务和税务。213 位金融从业者参与评测，其中 153 人来自外部机构，超过七成有五年以上经验，共 579 个真实任务。按四分制，Hy4 得 3.04，DeepSeek-V4.1-Flash-1017 是 2.97，Kimi K3.1 Pro 和 GLM-5.3 都是 2.68。搜索相关的幻觉率从预览版的 15.76% 降到 5.45%，靠猜测出错的比例从 23.1% 降到 5.6%。对 Word、Excel、PowerPoint 的协同编辑也做了加强；合作方 Manus 称办公文档任务完成率接近 97%，这是对方自报数字。\n\n办公和协同方面，在 WorkBuddy 评测里平均分 83.18，任务通过率约 96%。接上企业微信后，它可以把聊天、邮件、文档、日程和会议串起来，整理多项目进度、待办和优先级。\n\n前端和游戏方面，加强了复杂交互、业务逻辑和状态管理，并加深了对 UE、Unity、Godot 的适配。相对预览版，GameDev 和 GameLogic 分别提升约 19.1% 和 9.8%，这是和自己比，不是和别家比。\n\n科研方面，内部基准 TenureTrail 有七个学科、123 个可执行研究任务，Hy4 在开源权重模型里排第一，在全部对比模型里大约是第三（约 53.6，Claude 约 59）。它在数学构造、物理建模、地球科学、系统工程和社会经济决策上表现较好。一个官方案例是：给 84 张无序、部分镜像的二维切片，含约 699 万个细胞，Hy4 在离线、没有专用配准工具的情况下，约 1.5 小时完成小鼠胚胎三维重建。\n\n# AI 研发与开源副产品\n\n混元在为「递归自我改进」做准备。Hy4 配上 Hyra 2.0 开发框架，能优化同架构小模型的预训练基础设施，并自动训出在多项评测上超过官方 Jev 基线的变体。还开源了两个基础模型：做单细胞表征的 HyCell，以及做物理场建模的 HyPDE。\n\n# 公开榜单表现如何\n\n腾讯自己跑了一组对比。在非内部的公开类评测里，Hy4 多数排在第二到第四；十二项主表里没有总榜第一，最好成绩之一是 E-Bench 2.0 的第二。开源阵营里和 Kimi K3.1 Pro 大致打平，各有胜负：代码、三维建模、检索和科研偏 Hy4，终端自动化和科学终端任务偏 Kimi。\n\nAgent 评测 APEX-Agents v1.1 上，腾讯表里 Hy4 是 75.2，略高于它测到的 Claude Opus 5.5（约 74.8）和 DeepSeek（约 72.9）。但在其他多数行上，Opus 仍领先。腾讯自己也写了：和顶尖闭源模型仍有明显差距，尤其在前沿数学、超长开发任务、模型迭代和视觉问答上。例如 Hy-FrontierMath T5 大约只有 13，和 GPT 系接近满分差得很远。\n\n# 价格、入口与安全\n\n标价和预览版一样：输入每百万 token 6 元，输出 18 元，缓存命中 0.3 元。腾讯云 TokenHub 优惠到 2026-12-31，打五折。WorkBuddy / CodeBuddy 在 11 月 4 日到 15 日有一定免费额度。已上线 TokenHub、OpenRouter、WorkBuddy/CodeBuddy、元宝、企业微信「大元」、ima 等；权重「计划开源」，并会配系统卡，目前正式版权重还没放出来。更便宜的 Hy4 flash 也说快来了。\n\n安全上，网络安全训练只保留防御向内容，不含利用、逆向和渗透；生物安全自测 Hy-BioExperimentBench 约 30.4/100，团队称未发现明显降低实施生物危害的门槛。", "createdAt": "Wed Nov 04 10:58:30 +0000 2026", "replyCount": 22, "retweetCount": 0, "likeCount": 11, "conversationId": "2117934508985196730", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117870250838630539", "text": "👋Hy4 is here, new with vision.\nFirmly among the leading open models.\nMore productive everywhere: finance, frontend, game, officework, research…\nBuilt responsibly, with cyber/biosecurity in mind.\nTry it out and let us know!\n🔗：https://t.co/ZzL4DtgH3h https://t.co/xceRxN6ueT", "createdAt": "Wed Nov 04 06:43:10 +0000 2026", "replyCount": 230, "retweetCount": 300, "likeCount": 2623, "conversationId": "2117870250838630539", "author": {"username": "TencentHunyuan", "name": "Tencent Hy", "profileImageUrl": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_normal.jpg"}, "authorId": "1810933558703493120", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQvvEraQAAjwKn.jpg", "width": 2048, "height": 1536, "previewUrl": "https://pbs.twimg.com/media/HWQvvEraQAAjwKn.jpg:small"}], "translationZh": "👋Hy4 来了，全新支持视觉能力。\n稳居领先开放模型之列。\n全面提升生产力：金融、前端、游戏、办公、科研……\n秉持负责任的开发理念，兼顾网络安全与生物安全。\n欢迎试用并告诉我们你的感受！\n🔗：https://t.co/ZzL4DtgH3h https://t.co/xceRxN6ueT"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWRqNN6bkAAfLcd.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWRqNN6bkAAfLcd.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-04T10:58:30+00:00", "createdAtBeijing": "2026-11-04T18:58:30+08:00", "createdAtLocal": "11-04 18:58 北京", "url": "https://x.com/shao__meng/status/2117934508985196730", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117934508985196730", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "混元Hy4正式版多模态与电脑操作能力", "evidence": "第一次能看图", "rationale": "详述模型发布、评测和局限，明确权重尚未开放"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2118026565879844910", "track": "research", "source": {"id": "2118026565879844910", "text": "Kimi-K3.1-Pro by Moonshot AI: interesting facts\n\nIt's huge, and sparse\n• It has 2.8T total parameters, but only 104B are active per token.\n• Along with Kimi-K3, it's the largest real model release on the Hub. The next biggest are Qwen3.8-2.4T and DeepSeek-V4-Pro (1.6T).\n• It has 896 experts and sends each token to 16 of them. (DeepSeek-V4-Pro has 2 times less and Mistral-Large-4 has 7 times less)\n\nClever attention for a 1M-token context\n• Most of its 93 layers use linear attention (KDA). Every 4th layer uses DeepSeek-style sparse attention, which only looks at the top 2048 tokens.\n• This is how it handles a 1M-token context (the same as the other frontier open models)\n• It uses a custom activation called SiTU-GLU and has a 401M-parameter vision encoder (MoonViT-V2), so it takes both text and images.\n\nSmall on disk for its size\n• It was trained to run in 4-bit (MXFP4), so the whole repo is only ~1.56 TB.\n• Stored in regular BF16 it would be about 5.6 TB(!)\n \nBenchmarks (from the model card)\n• It goes back and forth with Claude Opus 5.5 and GPT-6 Astra. It's top of the card's table on BrowseComp (92.1), HLE with tools (70.0) and SWE Marathon (51.7).\n• It's weaker on pure reasoning without tools and on cyber security.\n• Moonshot ran most of their own coding evals using the Claude Code harness.\n\nLicense (a modified MIT)\n• It's free to use, modify and redistribute.\n• API businesses making over $20M a year need a deal with Moonshot.\n• Products with over 100M monthly users or over $20M monthly revenue must display \"Kimi K3.1-Pro\".\n\nOn the Hub\n• It went public about 1.5 hours ago and already has 214 likes, about 9× Kimi-K3's first hour. It's #19 on the trending list.\n• It isn't gated, but loading it in transformers requires \"trust_remote_code\"", "createdAt": "Wed Nov 04 17:04:18 +0000 2026", "replyCount": 14, "retweetCount": 2, "likeCount": 90, "conversationId": "2118026565879844910", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "quotedTweet": {"id": "2118003733103600085", "text": "Kimi-K3.1-Pro is now open-weights\n\nhttps://t.co/rrs3zaCvRa", "createdAt": "Wed Nov 04 15:33:35 +0000 2026", "replyCount": 56, "retweetCount": 86, "likeCount": 1223, "conversationId": "2118003733103600085", "author": {"username": "scaling01", "name": "Lisan al Gaib", "profileImageUrl": "https://pbs.twimg.com/profile_images/1831493788679761920/-q9w6dzd_normal.jpg"}, "authorId": "1825243643529027584", "translationZh": "Kimi-K3.1-Pro 现已开放权重\n\nhttps://t.co/rrs3zaCvRa"}, "expert": {"priority": "P0", "domain": "开源模型 / Hugging Face", "name": "Thomas Wolf", "role": "Hugging Face / 联合创始人兼 CSO", "why": "Transformers 生态和开源模型讨论的重要人物", "handle": "Thom_Wolf"}, "createdAtIso": "2026-11-04T17:04:18+00:00", "createdAtBeijing": "2026-11-05T01:04:18+08:00", "createdAtLocal": "11-05 01:04 北京", "url": "https://x.com/Thom_Wolf/status/2118026565879844910", "themeId": "editorial", "signalScore": 82, "editorial": {"id": "2118026565879844910", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Kimi-K3.1-Pro开放权重与模型细节", "evidence": "only 104B are active", "rationale": "汇总架构、许可与模型卡评测，成绩属来源自报"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Moonshot AI 的 Kimi-K3.1-Pro：一些有趣的细节\n\n规模庞大，采用稀疏架构\n• 总参数量达 2.8 万亿，但每个 token 仅激活 1040 亿参数。\n• 它与 Kimi-K3 并列，是 Hub 上正式发布的最大模型。紧随其后的是 Qwen3.8-2.4T 和 DeepSeek-V4-Pro（1.6 万亿参数）。\n• 共有 896 个专家，每个 token 会分配给其中 16 个。（DeepSeek-V4-Pro 的专家数为其一半，Mistral-Large-4 为其七分之一）\n\n巧用注意力机制，支持 100 万 token 上下文\n• 93 层中的大多数采用线性注意力（KDA）。每隔 4 层使用一次 DeepSeek 式稀疏注意力，仅关注排名前 2048 的 token。\n• 正是这种设计让它能处理 100 万 token 上下文，与其他前沿开放模型相同。\n• 使用名为 SiTU-GLU 的自定义激活函数，并配备 4.01 亿参数的视觉编码器 MoonViT-V2，因此同时支持文本和图像输入。\n\n相对于参数规模，磁盘占用较小\n• 训练时就针对 4 位（MXFP4）运行进行了适配，因此整个仓库仅约 1.56 TB。\n• 如果使用常规 BF16 存储，则需要约 5.6 TB（！）\n\n基准测试（来自模型卡）\n• 与 Claude Opus 5.5 和 GPT-6 Astra 互有胜负。在模型卡所列的 BrowseComp（92.1）、使用工具的 HLE（70.0）和 SWE Marathon（51.7）测试中排名第一。\n• 不使用工具的纯推理能力和网络安全能力相对较弱。\n• Moonshot 的大多数自有编程评测使用 Claude Code 评测框架运行。\n\n许可证（修改版 MIT）\n• 可免费使用、修改和再分发。\n• 年收入超过 2000 万美元的 API 业务需要与 Moonshot 签订协议。\n• 月活用户超过 1 亿或月收入超过 2000 万美元的产品，必须展示“Kimi K3.1-Pro”。\n\nHub 上的表现\n• 公开约 1.5 小时，已获得 214 个赞，约为 Kimi-K3 首小时获赞数的 9 倍。目前在热门榜排名第 19。\n• 无需申请访问权限，但在 transformers 中加载时需要设置“trust_remote_code”。"}, "avatar": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, {"id": "2117791043693551968", "track": "enterprise", "source": {"id": "2117791043693551968", "text": "OpenAI 进军实体工程：GPT‑6 Astra 一周内设计出一台硬件，马自达、Ganassi 赛车队也参与试用\n\nOpenAI 正在把模型能力从写代码扩展到机械、电子和系统设计。内部已经跑通从外观、结构、电路板到固件的完整设计流程，但还过不了「能不能量产」这一关，所以现在向行业公开招募合作方，一起改进。\nhttps://t.co/oRvkj75Osw\n\n用 Astra 从零设计一台设备\n\n这次测试的目标是：全程不做任何人工直接修改，做出一台能和 Codex 对话的小设备。功能需求由 GPT‑6 定义。外观由 Astra 设计，参考了 OpenAI 之前和 Work Louder 的合作，也借鉴了游戏和玩具的风格。机械部分，Astra 设计了外壳和固定元器件的内部结构。电子部分，它负责选元器件，并设计 PCB 的布局和走线，保证能装进外壳。最后它还做了交互界面，写出了连接 Codex 的固件和软件。\n\n两名员工把这件事当副业做，不到一周就完成了设计，合同制造商不到一个月就做出了一小批样机。不过 OpenAI 也坦白说，离量产还差几轮评审和修改：模型没能稳定考虑到工厂的生产限制、公差和装配细节。这正是下一代模型要补的短板。\n\nOpenAI 内部硬件团队怎么用\n\n机器人和算力基础设施团队用 Codex 和 ChatGPT 建模和修改 CAD 模型、把 3D 模型转成可用于生产的 2D 图纸、搭建仿真和有限元分析，还用它们做设计评审。从今年 2 月以来，硬件团队的 token 用量增长了 23 倍。\n\n三位员工分别讲了自己的用法：\n· Grace Lam 说，从想法到成品零件的速度明显变快，出图和仿真设置省了大量手工活。\n· Qiong Wang 用它梳理跨部门的设计约束，在 ECAD（电子设计软件）里执行操作，并做设计评审。她认为将来它有可能变成一支硬件专家团队，把一块电路板从概念一路做到可以交付工厂生产的 Gerber 文件。\n· Jackie Lee 在建筑工程和 BIM（建筑信息模型）领域用它自动处理重复建模，检查图纸和规范之间的不一致，并把协调中发现的问题整理成可以直接处理的待办事项，最后仍由专业人员审核。\n\n评测成绩\n\nOpenAI 用 BenchCAD 2.0 衡量进展。这个评测考察模型能否重建 3D 零件和装配体，以及能否识别电路板上的连接关系。一个尚未发布的内部新模型平均得分 0.875；GPT‑6 Astra 在最高推理档位下得分 0.594。差距不小，说明下一代模型在这类任务上进步明显。\n\n行业合作\n\nOpenAI 扩大了和 Chip Ganassi Racing 赛车队的合作，主要测试把现有零件的 3D 扫描数据转成可编辑的 CAD 模型和 2D 生产图纸。原始设计文件丢失时，这一步特别有用。车队工程师负责审核精度和能否制造，并表示可以直接在 CAD 里和 Codex 协作，反馈改动会被直接执行。\n\n另外，OpenAI 新宣布与马自达开展研究合作，对象是空气动力学和碰撞安全团队。Astra 会对新车头造型建模，模拟气流，再细化最有希望的方案，在兼顾造型和成本的前提下降低风阻。马自达的工程师提到，设计师常问「非得长这样吗？」。通过模拟几十种变体，可以看清哪些特征真正影响空气动力学，哪些地方设计师可以自由发挥。更多结果会在接下来几个月公布。", "createdAt": "Wed Nov 04 01:28:26 +0000 2026", "replyCount": 25, "retweetCount": 0, "likeCount": 6, "conversationId": "2117791043693551968", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117692475775258785", "text": "ChatGPT and Codex are helping engineers build for the physical world.\n\nWe’re sharing our progress across mechanical design, electrical engineering, and simulation—from helping our hardware teams iterate faster to testing new workflows with industry collaborators. https://t.co/b3rW9zYJGA", "createdAt": "Tue Nov 03 18:56:45 +0000 2026", "replyCount": 674, "retweetCount": 676, "likeCount": 7704, "conversationId": "2117692475775258785", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWOOL0QWwAA5B61.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HWOOL0QWwAA5B61.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117690285073301505/vid/avc1/1920x1080/g_3dQMk7a62dw_qW.mp4?tag=29", "durationMs": 81706}], "translationZh": "ChatGPT 和 Codex 正在帮助工程师面向物理世界开展研发。\n\n我们分享了在机械设计、电气工程和仿真领域的进展：从帮助内部硬件团队加快迭代，到与行业合作伙伴测试新的工作流程。https://t.co/b3rW9zYJGA"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPnsY3bMAApN_J.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWPnsY3bMAApN_J.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-04T01:28:26+00:00", "createdAtBeijing": "2026-11-04T09:28:26+08:00", "createdAtLocal": "11-04 09:28 北京", "url": "https://x.com/shao__meng/status/2117791043693551968", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117791043693551968", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "AI辅助实体工程设计与行业试用", "evidence": "离量产还差几轮评审和修改", "rationale": "介绍官方自述硬件成果、工程流程与制造局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2118011251624493297", "track": "growth", "source": {"id": "2118011251624493297", "text": "> AI 最该接走的，不是文案，而是上下文和协作\n\n这也是这段时间我用了许多中美的 AI，并且反复做迁移之后得出来的体会。Context，个人的 personal context，甚至团队的 company context，已经成了最宝贵的财富。因为模型的智力水平你追我赶，但是真正能够把 context 做到非常清晰的产品是不多的。\n\n当然，这里又有一个悖论：context 太清楚了，反而就会容易被别的 AI 迁移走。\n\nTeamily 的 context 很清晰😂，产品也很能打，能在 multi-agents 中脱颖而出，自然有许多本身在身上。", "createdAt": "Wed Nov 04 16:03:27 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 17, "conversationId": "2118011251624493297", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2117878536707191220", "text": "干货｜一个季度，注册用户增长 32 倍：我从零搭建全球GTM体系的 4 个关键判断\n\n一个季度，Teamily AI 的注册用户增长了 32 倍，覆盖全球 100 多个国家。\n\n同期，月访问量从 7 月到 9 月接近原来的 15 倍，并在 10 月突破 100 万。Teamily 还在 9 天内两次登上 X 趋势，单月社交内容浏览量超过 2.5 亿，约 1 万家公司团队开始在平台上连接同事。\n\n这些数字很亮眼。但如果只把这段经历总结成“某个渠道跑通了”，反而会错过最有价值的部分。\n\n7 月 2.0 Beta 上线后，我们把全球 Marketing 和 GTM 推进到全速。我负责从零搭建整套系统：市场选择、渠道、预算、Creator Operations、数据衡量，以及把这些工作连接起来的协作流程。\n\n我们从一开始就围绕一个产品愿景建设 Teamily。Aiden 很早就提出：AI 应该从 personal agents 走向能与人共享上下文、记忆和工作流的 team agents，并进一步构建 Agentic Internet，让智能、人与服务像社交网络里的朋友一样容易连接。\n\n而我的GTM任务，是把这个愿景真正带向全球市场。\n\n我们没有过早押注一个“必胜”的市场或渠道，而是先搭出一套能快速获得反馈、再据此改变决策的系统。\n\n回头看，最值得分享的是下面 4 个判断。\n\n🏅\n\n1｜在重仓之前，先让市场证明自己\n\n做全球市场，很容易先得到一个看似正确的答案：北美最重要，所以先把北美做好。\n\n北美当然重要。但“战略上重要”和“此刻最值得增加预算”，并不总是一回事。\n\n我们在 20 个国家和地区启动了可比较的测试，包括 Paid、Creator 和 UGC。除了北美，也测试了很多 AI 公司容易忽略的市场，包括台湾和拉丁美洲。\n\n一开始，我们按注册量给市场排序。后来改看付费转化，同一批市场的优先级变了。\n\n注册量告诉我们哪里有人愿意试；付费转化告诉我们哪里有人愿意为价值付钱。\n\n一个月后，我们把预算集中到信号最强的 5 到 10 个市场。\n\n台湾是最意外的结果之一：总投入不到 2 万美元，用户市场排名却从 50 名开外升到了第 3。\n\n这不意味着台湾是一个“容易做”的市场。更准确地说，那里的注意力竞争没有那么拥挤：Creator CPM 更有效率，用户对 AI 内容的疲劳度更低，一个好的产品故事也有更大的传播空间。\n\n北美依然重要。但我们最高效的一部分增长，来自其他 AI 公司低估的市场。\n\n广泛测试的目的，不是让小团队永远同时经营 20 个市场，而是先减少盲区，再有依据地收缩投入。\n\nTest wide. Measure fast. Fund narrow.\n\n🚀\n\n2｜每一笔预算，都必须有明确任务\n\n第一个月，我们同时启动了 Creator、UGC、Paid、SEO、GEO、线下广告、活动、校园营销和 Referral 等测试。\n\n渠道全开，不等于预算平分。\n\n预算从来不是锁死的。我们每周看一次数据，再根据信号变化重新分配。CPM 是起点，但绝不是终点；曝光之后发生了什么，才决定这笔钱有没有完成任务：访问、注册、激活、付费，以及它让我们更了解了哪类用户。\n\n我的规则很简单：\n\nNo reason, no spend. 说不清为什么，就不花这笔钱。\n\n这里的“理由”不要求每笔钱马上换来付费用户。一次测试如果能排除一个错误假设，也有价值。但至少要回答两个问题：这笔钱想验证什么？结果出来后，会改变什么决定？\n\n线下活动尤其容易制造一种“正在取得进展”的错觉。场地订了、嘉宾来了、Logo 放上 Luma 页面，工作量很真实，但 GTM 结果未必发生了。\n\n所以我们会从结果往回设计：\n\n- 谁应该出现在现场？\n- 他们为什么和产品有关？\n- 活动结束后，希望发生什么？\n- 要产出什么内容？\n- 怎样让线上传播突破实际到场人数？\n\n我们的一场活动约有 200 人到场，但通过 Creator 内容和自有渠道，线上触达扩大到约 500 万。\n\n200 人是现场规模，500 万是传播覆盖。两者都不能自动等同于注册或付费，但一起看，才能理解这场活动承担的任务。\n\n活动不是办完就结束。传播应该在活动开始前，就进入活动设计。\n\n📈\n\n3｜内容、投放和搜索，不能各交各的成绩单\n\n很多公司里，Paid 不和 UGC 说话，UGC 不和 Event 说话，Content 又在另一个地方独立运转。\n\n单看每个渠道，数据可能都不错；但整个系统没有复利。\n\n我们把它们跑成了一个闭环。\n\n当一条 Creator 或 UGC 内容自然跑出来后，我们会把已经验证过的 Hook 放进 Paid 继续测试。它已经经过真实用户的筛选，不必先重新发明一个完全不同的“广告版本”。\n\n这个循环也会反向运行。Paid 会告诉我们哪些 Hook、受众和 Use Case 真正带来注册、激活或付费，再把这些信号送回下一轮 Creator Brief。\n\n单个 UGC 项目在一个月内，吸引了 15 万+人主动在评论区索要产品链接。\n\n这不是 15 万注册，更不是 15 万付费用户。但它是非常直接的需求信号：哪些视频值得放大，哪些 Creator 值得再次合作，下一轮 Campaign 应该继续讲什么。\n\n这里还有一个很多 Marketing 团队都会遇到的归因问题。\n\n用户可能先看了一条 Creator 视频，过几天又看到其他人讨论 Teamily，最后在 Google 搜索品牌名并注册。后台最容易记录到的，可能只是最后那次 Search 或 Paid Search。\n\n最后点击最容易被看见，但它不一定创造了需求。\n\n所以我们不会只看“用户最后从哪里进来”，还会看需求最初在哪里被激发。Creator 内容发现需求，Paid 放大需求，转化数据再优化下一轮内容。\n\n最好的渠道，不只是自己跑出结果，还会让下一个渠道变得更聪明。\n\n⚙️\n\n4｜AI 最该接走的，不是文案，而是上下文和协作\n\n当 20 多个市场、7 个以上渠道同时推进时，我们最缺的并不是更多想法。\n\n真正的瓶颈是上下文和协作。\n\n做过 Creator Marketing 的人都知道，实际工作远不止“找几个博主发视频”：筛 100 个 Creator 找到 5 个，谈报价、审脚本、核对产品信息，再把同样的流程复制到不同市场。\n\n更耗时间的是背景反复丢失：为什么上次否掉了那个卖点？这位 Creator 适合什么受众？产品这周更新了什么？哪条素材应该交给 Paid 继续放大？\n\n如果答案散落在不同人的聊天记录和 Dashboard 里，团队每次开会都要先重建一遍上下文。\n\n这才是我们真正希望 AI 接走的工作。\n\n我们把 Creator、脚本、成片、每日表现和 Paid 反馈放在同一个工作流里。UGC Agent 会把 Creator 数量、花费、浏览量和 CPM 直接带回群组；一条内容达到阈值后，再提醒 Paid 团队评估是否继续放大。\n\n每 7 天，完整漏斗也会自动进入决策群：Views、CPM、Pageviews、Sign-ups、Activation、Paid Conversion。\n\n目标不是庆祝最大的数字，而是找到下一个瓶颈。\n\n产品内容同样如此。我们每周会上线 2 到 3 个功能，AI 可以把产品更新、现有素材和 UI 带进内容工作流；但最后的判断、定位、审美和审批，仍然属于人。\n\nAI 可以负责协调，Taste 仍然属于人。\n\n现在，约 1 万家公司团队已经在 Teamily 上连接同事。每个群组平均每天处理 6 项 Agent 任务，每天还有 300+ 个群组级 Agentic Loops 被创建。\n\n我们没有搭建一支庞大的增长组织，而是用能够共享群组、上下文和工作流的 Agents，扩展原有团队的执行能力。\n\nAI 真正产生价值的时刻，是它开始承担上下文和协作，而不只是多生成一条文案。\n\n✨\n\n最后｜如果重新做一次，我还会坚持这 4 条原则\n\n这个季度改变了我对增长的理解。\n\nDistribution 不是一张渠道清单，而是一套学习系统。市场、Creator、Paid、产品数据、人和 Agents 之间传递信息的速度，决定了整个系统进化的速度。\n\n如果重新从零搭一次全球 GTM，我依然会坚持：\n\n1. 在重仓之前，先扩大测试面。\n2. 让每一笔预算都有明确任务。\n3. 让每个渠道的发现进入下一个渠道。\n4. 让 AI 承担上下文和协作，而不只是内容生成。\n\n这些原则本身并不神秘。\n\n真正产生差异的，是一支精简团队能否同时运行它们，并且不让上下文断在市场、渠道和人之间。\n\n我们不只是推广了 Teamily。\n\n我们用 Teamily，搭建了那套推广 Teamily 的增长系统。\n\n这也是我想继续建设的 Marketing 团队：精简、全球化、数据驱动，而且 AI-native。\n\nHumans + Agents. One Team.\n\n从一个群组、一位同事和一个 Agent 开始：https://t.co/edKwjuiz0A\n\n🍃\n\n作者：\n@Summer_ikiki  @summer_ikiki_  \nSummer Chen (Zhe Chen) \nhttps://t.co/VuWLjke7Bq\n\n此文翻译自作者在X平台的英文原创文章：\nhttps://t.co/AYrUkQtIai\n\n数据说明：注册增长、公司团队采用和 Agent 活跃数据来自 Teamily AI 内部数据；月访问量来自第三方流量估算。浏览量、触达、索要链接、注册和付费是不同指标，不作等同解释。", "createdAt": "Wed Nov 04 07:16:06 +0000 2026", "replyCount": 23, "retweetCount": 35, "likeCount": 320, "conversationId": "2117878536707191220", "author": {"username": "Summer_ikiki", "name": "一碗咕咪酱·AI GTM", "profileImageUrl": "https://pbs.twimg.com/profile_images/2102979788713680896/mP7SLj-B_normal.jpg"}, "authorId": "1568243433135042562"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-04T16:03:27+00:00", "createdAtBeijing": "2026-11-05T00:03:27+08:00", "createdAtLocal": "11-05 00:03 北京", "url": "https://x.com/GenAI_is_real/status/2118011251624493297", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2118011251624493297", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "Teamily 全球 GTM 测试与 Agent 协作实践", "evidence": "一个月后，我们把预算集中到信号最强的 5 到 10 个市场。", "rationale": "提供市场测试、漏斗归因和协作方法，成效为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2117822392722719125", "track": "research", "source": {"id": "2117822392722719125", "text": "AI Scientist 最失败的误判，可能是把真正的新 idea 当成旧东西删掉。\n\nUIUC 这篇《Do AI Scientists Know What’s New?》研究的，就是科研 Agent 怎么判断一个研究想法到底新不新。\n\n现在很多系统会先找一批相似论文，再直接判断整份研究方案有没有创新。\n\n问题是，真实科研里，一篇工作通常只有其中几部分是真正新的。\n\n作者提出 ClaimNov，把一份研究方案拆成几个更具体的部分，比如：\n\n研究问题、方法、数据或资源、实验结果。\n\n然后分别去查已有论文，看这些具体内容以前有没有出现过。\n\n这样得到的就不只是一个简单的「新 / 不新」，而是能看清楚到底哪一部分已经有人做过，哪一部分还有新意。\n\n实验中，ClaimNov 能识别 97% 的「旧想法伪装成新想法」案例，同时对后来真的发表出来的新 idea，误判率只有 1.5%。\n\n如果只让 LLM 阅读几篇相关论文摘要再直接判断，误判率会上升到 11.8%。\n\n这篇给 Research Agent 提了一个醒：\n\n判断创新性的关键不只是模型够不够强，还要看它把问题拆得够不够细。\n\nAI Scientist 真要自己筛选研究方向，最好先回答清楚：\n\n哪些部分已经有人做过，哪些部分才是真正的新东西。\n\n📎 arxiv: https://t.co/UGyGSheWlG", "createdAt": "Wed Nov 04 03:33:00 +0000 2026", "replyCount": 9, "retweetCount": 25, "likeCount": 194, "conversationId": "2117822392722719125", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNxah9WIAANfTJ.jpg", "width": 1107, "height": 1155, "previewUrl": "https://pbs.twimg.com/media/HWNxah9WIAANfTJ.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-04T03:33:00+00:00", "createdAtBeijing": "2026-11-04T11:33:00+08:00", "createdAtLocal": "11-04 11:33 北京", "url": "https://x.com/Xudong07452910/status/2117822392722719125", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2117822392722719125", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ClaimNov细粒度科研创新性判断", "evidence": "把一份研究方案拆成几个更具体的部分", "rationale": "介绍研究方法与量化结果，明确创新性判断问题"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2118010276830392636", "track": "agent", "source": {"id": "2118010276830392636", "text": "Originally written in Chinese:\n最近我大致读了一下 DeepSeek Harness 团队发表的 Super-agent 原型设计，有几点想法和大家分享，欢迎批评指正。\n\n一、如何看待 Agent 的存算分离架构？\n\nAgent 的存算分离，本质上是以 Durable Session 作为 Agent 生命周期的中心，允许在同一个 Session 内动态切换 Environment（下称 Env），从而把 Session（存储）与 Env（计算）解耦。从工程设计上看，Agent 除了 LLM 和 React Loop 之外，最核心的两个组件就是 Session Log 和 Env。现有的 Harness 基本上都要求先选定工作区再开始任务，无法在中途切换工作区；这不仅是 Harness 的限制，也是模型能力的瓶颈。当下的 LLM 基本都是在前后一致的 Env 中完成训练的，因此在 Context 内切换 Env 很容易引发幻觉。这也是我们当初设计 PenguinHarness 时认为 Env 应当是 Session 级参数、而非 Request 级参数的原因。不过 Super-agent 架构确实指出了固定 Env 的缺陷，例如本机断电关机等场景。这或许是基模团队对下一代 LLM 后训练形态的一种探索：将来的 LLM 或许可以随时切换 Env。这也印证了我们常说的一句话：好的 Harness 是为下一代 LLM 训练而设计的。\n\n二、无状态的 Agent Loop 和双工交互复杂吗？\n\n现在的 Harness 大多是无状态的，并且支持双工交互，Claude Code 和 Codex 很早就上线了后台任务（background task）。我们可以把 Session 看成一个事件序列：每次对话只需要以第 0 到第 n-1 次事件作为输入，推理出第 n 次事件，这样 Agent Loop 自然就不需要保存任何状态。前提是要设计足够好的 Session Log，而这正是我们主推的 AMSP 想做的事：把 Session Log 的规矩定好，运行起来就不烧心。至于双工交互，可以参考 Claude Code 或 Codex 的 bash 工具设计，我个人更喜欢 Codex 的方案，之后会抽空详细讲讲这部分。\n\n三、路由 Agent 和 Subagent 有什么区别？\n\n在我看来，最大的区别在于：Subagent 完成任务后还需要向 Main Agent 汇报，占用上层 Agent 的处理时间；而路由 Agent 把任务分发给 Worker Agent 之后，就不再接收任务反馈了。此外，路由 Agent 的提示词会写得更严格，要求它绝不处理任何事务；而普通 Agent 调用 Subagent 只是一个软性要求。之前我们在设计 PenguinHarness 里的 Agent Company 时，给每位员工配置了两种 Session：一种是工位 Session，负责把用户或其他 Agent 同事的需求派发成工单；另一种是工单 Session，具体执行任务。这样可以避免上下文快速膨胀，更高效地完成任务。\n\n四、为什么不少其他 Harness 也有类似 Super-agent 的设计模式？\n\n在我看来，Harness 的本质不只是给 LLM 装上手和脚，更是在构建人类与 LLM 的交流方式，本质上它是一个消息软件（IM）。大家会发现，世界上所有的消息软件（WeChat、Telegram、WhatsApp）最后都会长成同一个样子，这正是互联网二十多年来人类探索出的人与人交互的最佳范式。既然 Harness 是人与 Agent 的交互窗口，那它们最终也会逐渐走向趋同。因此我认为，未来的 Harness 本身不会有本质区别，真正的差异来自里面的使用者：人类用户和 LLM。\n\n五、我的延伸想法：Multi-Agent as Agent Memory\n\nAgent Memory 一直是业界的研究热点，关于它的实现方式也是各执一词。我一直比较认可极简的 Agent Memory 设计，比如直接用 Obsidian 或 Markdown 来存，但这类方案总会遇到内容膨胀、缺乏管理的问题。读完 Super-agent 的文章后，我有了一个更好的想法：可以创建一群 Agent，把它们当作一个 Super-agent 的 Memory network，每个 Agent 负责一个连续的记忆主题，自行管理上下文和预算上限。目前已有一些工作在探索把 Agent 的原始 Session 作为 Memory 组件，例如 Codex 今年 8 月推出的 History 工具（https://t.co/ZnwKKeCa0N）和开源项目 obelisk。在 Session 之上，我们也许可以把 Memory 设计成一群真正「活着」的 Agents。\n\n参考文章：\n1. https://t.co/cvUQTlqnLD\n2. https://t.co/xxG5RjBZYU", "createdAt": "Wed Nov 04 15:59:35 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2118006885714645263", "inReplyToStatusId": "2118006885714645263", "author": {"username": "code_hiyouga", "name": "Yaowei Zheng | LlamaFactory", "profileImageUrl": "https://pbs.twimg.com/profile_images/2066748499212087296/xmp83ygY_normal.jpg"}, "authorId": "1813077766981754881", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118009982365097984/img/bYfmHjaGwMQaTo8o.jpg", "width": 2048, "height": 1392, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118009982365097984/img/bYfmHjaGwMQaTo8o.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118009982365097984/vid/avc1/2724x1852/Pz4cr1PbfFsQ-dkC.mp4?tag=29", "durationMs": 16073}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118010027177021440/img/9JskPfXGUQlNCwMx.jpg", "width": 2048, "height": 1392, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118010027177021440/img/9JskPfXGUQlNCwMx.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118010027177021440/vid/avc1/2724x1852/0z-A0MfZNzMTVti6.mp4?tag=29", "durationMs": 23525}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "郑耀威 Yaowei Zheng", "role": "模型、研究与推理实践与观察", "why": "有 PenguinHarness 发布、Trace 和 API 变化，训练与 Agent 框架均有价值。", "handle": "code_hiyouga"}, "createdAtIso": "2026-11-04T15:59:35+00:00", "createdAtBeijing": "2026-11-04T23:59:35+08:00", "createdAtLocal": "11-04 23:59 北京", "url": "https://x.com/code_hiyouga/status/2118010276830392636", "themeId": "editorial", "signalScore": 51, "editorial": {"id": "2118010276830392636", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent会话架构、任务路由与记忆设计", "evidence": "把 Session（存储）与 Env（计算）解耦", "rationale": "结合设计经验分析架构取舍，记忆网络仍属设想"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2066748499212087296/xmp83ygY_normal.jpg"}, {"id": "2117811571674214571", "track": "agent", "source": {"id": "2117811571674214571", "text": "别急着删 Playwright：官方讲清楚它和浏览器安全到底是什么关系\n\n有人说 Playwright 自带有漏洞的浏览器，所以应该删掉。这是误解，因为 Playwright 的任何安装包里都不带浏览器。真正需要注意的只有一种情况：测试用的固定版本浏览器不适合拿去访问不可信的网页。\n\n用 Playwright MCP 或命令行工具的 Agent\n\n这两种方式调用的是你电脑上的正式版 Chrome 或 Edge。浏览器会正常收到安全更新，沙箱也默认开着，所以不用改任何配置。\n\n用测试运行器跑测试\n\n运行 npx playwright install 时，Playwright 会下载 Chrome for Testing。这是测试专用的浏览器，版本固定为当前这一版 Playwright 测试过的那个版本。\n\n这样做是故意的：每台开发电脑和每台 CI 机器跑的都是同一个浏览器，浏览器不会因为自动更新突然把测试搞挂。什么时候换浏览器版本，由你升级 Playwright 来决定。新版 Playwright 通常会固定一个比正式版 Chrome 更新的版本，所以兼容问题会在用户遇到之前先被你发现。\n\n代价是，在下一版 Playwright 发布之前，这个浏览器可能缺少 Chrome 最新的安全修复，而且默认关闭沙箱。官方建议只用它对你自己可信的应用做端到端测试，不要用它访问来路不明的网站。\n\n直接调用库 API\n\nchromium.launch() 的默认设置和测试运行器一样：用固定版本的浏览器，沙箱关闭。如果你的代码会访问不受你控制的页面，比如爬虫或 Agent 脚本，就应该换成正式版 Chrome，并打开沙箱：\n\nchromium.launch({ channel: 'chrome', chromiumSandbox: true })\n\n另外，有些漏洞能突破沙箱，所以 Chrome 和 Edge 一定要保持更新。", "createdAt": "Wed Nov 04 02:50:00 +0000 2026", "replyCount": 25, "retweetCount": 0, "likeCount": 14, "conversationId": "2117811571674214571", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117638981454291252", "text": "Playwright and browser security reminder.\n\nWe saw a post suggesting that you delete Playwright because it bundles browsers with CVEs. That is a misconception. Do not delete Playwright🙃. Here is how it works and what you should do.\n\nNo Playwright package bundles a browser. Agents on Playwright MCP or CLI run your stable Chrome, which gets Chrome's security updates, with the sandbox on.\n\n🤖 If you use Playwright MCP or the Playwright CLI\n\nThey use the stable Chrome / Edge on your machine, so it gets its normal updates. No config edit is needed.\n\n🧪 If you use the test runner\n\nWhen you run npx playwright install, Playwright downloads Chrome for Testing, pinned to the build we tested that release against. The pin is on purpose. Your tests run on the same browser on every laptop and CI machine, and a browser \nupdate cannot suddenly break your suite. You choose when to move by upgrading Playwright. New releases usually pin a build ahead of stable Chrome, so you see breakage before your users do.\n\nWe recommend this for full e2e test suites on your own trusted app. This build can miss Chrome security fixes until the next Playwright release, and by default it runs with the sandbox off. Do not use it on the hostile web.\n\n📚 If you use the library API\n\nchromium.launch() has the same defaults: the pinned build with the sandbox off. If your code visits pages you don't control (scrapers, agent scripts), max out protection:\n\nchromium.launch({ channel: 'chrome', chromiumSandbox: true })\n\n🔒 Always keep Chrome / Edge updated. Some bugs can escape a sandbox.\n\nHappy testing!", "createdAt": "Tue Nov 03 15:24:11 +0000 2026", "replyCount": 42, "retweetCount": 269, "likeCount": 2333, "conversationId": "2117638981454291252", "author": {"username": "playwrightweb", "name": "Playwright", "profileImageUrl": "https://pbs.twimg.com/profile_images/1318604600677527552/stk8sqYZ_normal.png"}, "authorId": "1263579586589126658", "translationZh": "关于 Playwright 和浏览器安全的提醒。\n\n我们看到一篇帖子，建议大家删除 Playwright，理由是它捆绑了存在 CVE 漏洞的浏览器。这是个误解。别删 Playwright🙃。下面解释它的工作方式，以及你应该怎么做。\n\n没有任何 Playwright 软件包捆绑浏览器。通过 Playwright MCP 或 CLI 运行的智能体使用你电脑上的稳定版 Chrome，接收 Chrome 的安全更新，并启用沙箱。\n\n🤖 如果你使用 Playwright MCP 或 Playwright CLI\n\n它们使用你电脑上的稳定版 Chrome / Edge，因此会正常接收更新。无需修改配置。\n\n🧪 如果你使用测试运行器\n\n运行 npx playwright install 时，Playwright 会下载 Chrome for Testing，并锁定到该版本 Playwright 已测试过的浏览器构建版本。这是有意为之。这样，所有笔记本和 CI 机器上的测试都使用同一版本的浏览器，浏览器更新就不会突然导致测试套件失效。你可以通过升级 Playwright，自行决定何时切换版本。新版本通常会锁定比稳定版 Chrome 更新的构建版本，让你能先于用户发现兼容性问题。\n\n我们建议用它对自己可信的应用运行完整的端到端测试。这个构建版本可能要等到 Playwright 下次发布时才能获得部分 Chrome 安全修复，而且默认不启用沙箱。不要用它访问不可信的网站。\n\n📚 如果你使用库 API\n\nchromium.launch() 的默认设置相同：使用锁定的构建版本，且不启用沙箱。如果代码会访问你无法控制的页面（例如爬虫或智能体脚本），请启用最高级别的防护：\n\nchromium.launch({ channel: 'chrome', chromiumSandbox: true })\n\n🔒 请始终保持 Chrome / Edge 为最新版本。有些漏洞能够突破沙箱。\n\n祝测试顺利！"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWP6X-jacAA9Ds-.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWP6X-jacAA9Ds-.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-04T02:50:00+00:00", "createdAtBeijing": "2026-11-04T10:50:00+08:00", "createdAtLocal": "11-04 10:50 北京", "url": "https://x.com/shao__meng/status/2117811571674214571", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2117811571674214571", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Playwright浏览器版本与沙箱配置", "evidence": "用固定版本的浏览器，沙箱关闭", "rationale": "区分三种使用方式，提供具体安全配置与适用边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117965327359488302", "track": "creative", "source": {"id": "2117965327359488302", "text": "又给你们挖到一个宝！\n\n有人把 33B 的视频大模型 MiniMax-H3 拆了，提纯出一个专职生图和改图的模型 P-H3-Image，把原本 143GB 的庞然大物直接塞进了一张 4090 里。\n\n为什么要拿视频模型降维做生图？\n\n普通文生图只学静态像素，光影和透视经常是硬凑的。\n     \nH3 这种全模态视频底座天天算跨帧运动和景深变化，脑子里本来就有三维空间物理规律。把它改造成只输出单帧，原生直出8MP（2912×2912）大图，胶片颗粒、纪实摄影和动漫分镜的质感非常顶。\n   \n几个关乎落地的硬指标：\n\n50 步压到 8 步，砍掉 CFG\n不需要填负向提示词，单步计算量直接减半。L40S 上跑一张 2048×2048 的图，从 bf16 卸载的 19 秒直接干到 6.3 秒。\n\n原生 1~8 图指令级编辑\n继承了 H3 的多图参考（Ref2VA）底座。Picture 1 作为修改底图，后面最多挂 7 张参考图，换装、多角色同框、跨图借光影都能一次跑通。\n     \n显存砍了 7 倍，ComfyUI 开箱即用     \nPrunaAI 打包了三档精度：\n     - 24G 显卡（4090）：直接下 w4a8 + int8 VAE 版，权重 20GB，跑 8MP 峰值显存 21GB。\n     - 32G/48G 显卡：下 int8_convrot 版，权重 30GB，峰值 31GB，画质和 bf16 基本没差别。\n     - 已经下过原版 H3 的老玩家：别重下几十 G 权重了，官方单独拎了一个 2.0GB 的 bf16 LoRA，挂到现有的 H3（FL2VA）工作流上直接用。\n\n但先把边界划清楚：这空间感只兑现在单帧质感上。 \n让它做多视图：同一个场景转俯视、转机位，它就顶不住了，跟 Qwen-Image 2.1比差一大截，纵深大的室外场景、动画风格的卧室，提示词怎么写都抬不到正上方。\n \n原因不难猜：H3 的空间一致性靠跨帧时序建模，蒸馏成单帧输出，恰好把这截能力切掉了。它给你的是一张好看的单帧，不是一个能转机位的场景。\n     \n顺带提4个坑，省得大家白折腾：\n     \n1. 严禁堆砌 8k、masterpiece、photorealistic 这类老式标签，加了反而劣化画质。写短句必须配合它自带的 Qwen3.5-9B 扩写器（Upsampler）一起跑。\n   \n2. 场合选型：8MP 写实大片、多图合成、短文字海报，用 P-H3；多视图、俯视图、转机位，直接上 Qwen-Image 2.1；\n  \n3. w4a8 虽然能进 4090，但细节和构图比 int8/bf16 有轻微偏移；长段密集英文和远景小手还是会糊，出全身人像建议直接拉满 8MP。\n     \n4. 协议沿用 MiniMax H3 社区许可证，明确排除了美、欧、英、韩四个地区，做海外产品的朋友注意合规边界。\n\nComfyUI 量化权重与工作流👇     \nhttps://t.co/Du5LfWBMVw\n\n完整模型仓库👇     \nhttps://t.co/lxn9bLPKgY", "createdAt": "Wed Nov 04 13:00:58 +0000 2026", "replyCount": 13, "retweetCount": 10, "likeCount": 142, "conversationId": "2117965327359488302", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-04T13:00:58+00:00", "createdAtBeijing": "2026-11-04T21:00:58+08:00", "createdAtLocal": "11-04 21:00 北京", "url": "https://x.com/servasyy_ai/status/2117965327359488302", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117965327359488302", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "P-H3-Image 生图模型与部署选型", "evidence": "50 步压到 8 步，砍掉 CFG", "rationale": "介绍模型成果、量化部署及编辑局限，指标待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2117866568357134811", "track": "creative", "source": {"id": "2117866568357134811", "text": "I didn't expect brand revision notes to turn into a finished rewrite—but three Teamily Agents did it for me while I barely touched a word.\n\nI took a sponsored post for an AI tool, and three Agents in Teamily wrote the copy and the video script. \n\nThe brand's contact sent revision notes. I didn't rewrite anything myself: I pasted their notes back into the group and ran the same Loop again.\n\nOn deals like this, I usually do three jobs myself: research, writing, and checking the brief. When the brand sends feedback, I have to revise and check everything again.\n\nThis time I had Xiao T (小T) create a project group called Brand Partnership Delivery Hub with three official Teamily Agents: Trend Researcher, Content Creator, and Reality Checker.\n\nThen I built a Loop called Sponsorship Delivery to split those three jobs across the three Agents.\nTrend Researcher breaks down the brief, does the research, and flags claims it can't verify. Content Creator writes the X post and the demo video script from that research. Reality Checker reviews everything against the brief. If something fails, it goes back to Content Creator for a rewrite.\n\nThe first draft took 6 rounds. Reality Checker didn't trust Content Creator's own word count; it recounted with a script and sent the draft back whenever the numbers didn't match. Rounds 1 to 5 were sent back, round 6 passed, and the post body came in at 342. After that, Content Creator built a web review page that logs what changed in every round. I sent the draft to my contact at AIsa.\n\nThe contact came back with two kinds of feedback.\nFor the video, one note: the brand name was mispronounced. AIsa should be read \"Ai-sa\" (艾萨), so the voiceover needed redoing. For the copy, two notes: drop the \"billed by usage\" line, because AIsa currently requires buying a plan first and isn't purely pay-as-you-go; and make the difference from mirror sites clear. Mirror sites only let you look up data on a web page, with no API and no way to plug them into an Agent. AIsa can be called by an Agent directly. The contact also attached their own rewritten paragraph.\n\nI pasted their message into the same group, unchanged, and attached the same Sponsorship Delivery Loop. I didn't rebuild anything. Trend Researcher broke the notes into specific changes, and Content Creator finished the revision in 15 minutes. The post body went from 342 to 380, still under the 400 cap.\n\nReality Checker reviewed this version and marked it as not passed. It listed 3 issues that had to be fixed. One example: the copy referenced two publishing gates that were missing from the table they pointed to. This time it handed the result to me.\n\nAfter reading it, I @-mentioned Content Creator: \"Make a web version and show what changed compared with the previous version.\" It took 40 minutes, produced a new review page, and fixed Reality Checker's 3 issues along the way.\n\nThe new page ends with a revision log. Each of the contact's notes has its own row, showing what changed and where. The mirror-site paragraph now uses the contact's wording.\n\nThe contact's wording added two claims: \"the world's second platform with official Similarweb API access,\" and Similarweb \"costs tens of thousands of dollars a year to start.\" During the first draft, Trend Researcher had already recommended leaving the first claim out, because it couldn't find a public source. This time the text came from the contact, so Content Creator kept both claims in the copy but put a publishing gate on each one: not to be published without official written proof. The page status reads \"awaiting user sign-off,\" and it states that the final version and publishing are confirmed by me. The package doesn't sign off for me and doesn't publish on its own.\n\nIn this round I did two things myself: I pasted the contact's notes into the group, and I asked for a web version with a comparison. The group and the Loop are still there. When the next round of feedback comes in, I paste it into the group and the Loop runs again.\n\nSome will ask: isn't this just a few chat windows? With separate windows, I'd paste the brief and the contact's notes into each one and relay the review results by hand. Here, all three Agents read the same brief and the same feedback in one group, Reality Checker @-mentions Content Creator directly, and I step in when Reality Checker hands the result to me: I review it and make the call.\n\nIf you take sponsorships or deliver client work, try Teamily with my invite link:\nhttps://t.co/yLE8e0dK0S", "createdAt": "Wed Nov 04 06:28:32 +0000 2026", "replyCount": 15, "retweetCount": 5, "likeCount": 19, "conversationId": "2117866568357134811", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117865331914051584/img/paNa8pPTdRFi7rEY.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117865331914051584/img/paNa8pPTdRFi7rEY.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117865331914051584/vid/avc1/1920x1080/CjOiD-eJo3uzMBw7.mp4?tag=29", "durationMs": 128810}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-04T06:28:32+00:00", "createdAtBeijing": "2026-11-04T14:28:32+08:00", "createdAtLocal": "11-04 14:28 北京", "url": "https://x.com/servasyy_ai/status/2117866568357134811", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2117866568357134811", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "赞助文案与视频脚本的多Agent修订流程", "evidence": "Trend Researcher, Content Creator, and Reality Checker", "rationale": "自述完整分工、返修与证据门槛，具复用价值"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "没想到，把品牌方的修改意见贴进去，就能拿到改好的完整稿件——Teamily 的三个智能体替我完成了这些，我几乎没动一个字。\n\n我接了一条 AI 工具的商单，由 Teamily 的三个智能体撰写文案和视频脚本。\n\n品牌对接人发来修改意见后，我没有自己重写，只是把意见贴回群里，再运行一次同样的 Loop。\n\n这类合作，我通常要独自承担三项工作：调研、写作，以及核对需求。品牌方反馈后，还得重新修改、再检查一遍。\n\n这次，我让 Xiao T（小T）创建了一个名为“品牌合作交付中心”的项目群，加入三个 Teamily 官方智能体：Trend Researcher、Content Creator 和 Reality Checker。\n\n接着，我创建了一个名为“商单交付”的 Loop，把这三项工作分给三个智能体。\nTrend Researcher 拆解需求、开展调研，并标记无法核实的说法。Content Creator 根据调研撰写 X 帖子和演示视频脚本。Reality Checker 对照需求审核全部内容。不合格就退回 Content Creator 重写。\n\n初稿经历了 6 轮。Reality Checker 不采信 Content Creator 自报的字数，而是用脚本重新统计，数字对不上就退稿。第 1 至第 5 轮都被退回，第 6 轮通过，帖子正文长度为 342。之后，Content Creator 制作了一个网页审阅页，记录每一轮的修改。我把稿件发给了 AIsa 的对接人。\n\n对接人给了两类反馈。\n视频方面有一条：品牌名读错了。AIsa 应读作“Ai-sa”（艾萨），因此需要重做配音。文案方面有两条：删掉“按用量计费”，因为 AIsa 目前需要先购买套餐，并非纯粹按量付费；明确说明它与镜像站的区别。镜像站只能在网页上查询数据，没有 API，也无法接入智能体，而智能体可以直接调用 AIsa。对接人还附上了自己改写的一段文字。\n\n我把这条消息原样贴进同一个群，并附上同一个“商单交付”Loop，没有重新搭建任何东西。Trend Researcher 将意见拆成具体修改项，Content Creator 在 15 分钟内完成了修改。帖子正文长度从 342 增加到 380，仍低于 400 的上限。\n\nReality Checker 审核后判定不通过，列出了 3 个必须解决的问题。例如，文案提到了两项发布前置条件，但引用的表格里却没有这两项。这次，它把审核结果交给了我。\n\n看完后，我 @ 了 Content Creator：“做一个网页版，展示与上一版相比改了什么。”它花了 40 分钟生成新的审阅页，同时修复了 Reality Checker 提出的 3 个问题。\n\n新页面末尾附有修改记录。对接人的每条意见都单独占一行，列明改了什么、改在哪里。关于镜像站的段落，现在使用了对接人的表述。\n\n对接人的表述新增了两项说法：“全球第二个获得 Similarweb 官方 API 接入权限的平台”，以及 Similarweb“每年起步就要数万美元”。初稿阶段，Trend Researcher 就因找不到公开来源，建议删掉第一项。这次文字来自对接人，Content Creator 因此保留了两项说法，但分别设置了发布前置条件：未取得官方书面证明，不得发布。页面状态为“等待用户确认”，并注明最终版本及发布均由我确认。这套流程不会替我确认，也不会自行发布。\n\n这一轮我只亲自做了两件事：把对接人的意见贴进群里，以及要求生成带版本对比的网页。群和 Loop 都还在。下一轮反馈来了，我再贴进群里，Loop 就会再次运行。\n\n有人会问：这不就是几个聊天窗口吗？如果用独立窗口，我得把需求和对接人的意见分别贴进去，再手动转达审核结果。而在这里，三个智能体在同一个群里读取相同的需求和反馈，Reality Checker 会直接 @ Content Creator；当 Reality Checker 把结果交给我时，我再介入审核并作出决定。\n\n如果你也接商单或为客户交付项目，可以通过我的邀请链接试试 Teamily：\nhttps://t.co/yLE8e0dK0S"}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2117983463315997181", "track": "tools", "source": {"id": "2117983463315997181", "text": "ScopeDB 的 approx_quantile 是我开搞 datasketches-rust 的主要原因之一。\n\n查询各种分位数是常见的日志/事件分析需求，比如经典的请求延迟 P50/P95/P99 查询。\n\n目前 ScopeDB 线上的方案，针对小规模数据可用精确的  quantile 查询，大规模数据支持 t-digest 算法。我在 datasketches-rust 里落地了大量实现层面的优化，还跟 T-Digest 的作者讨论确定了极限值的处理方式，算是从生产实践里补齐了论文的空白。\n\n目前 datasketches-rust 仓库里躺着 DDSketch 和 UDDSketch 的两个算法实现。虽然 DataSketches 的老大哥 Lee Rhodes 几次三番跟我说小伙子用用 KllSketch 吧，要不 T-Digest 也行啊，DDSketch 这种桶估计很容易出很大的秩误差 ... 奈何用户对 P99 这种查询，在乎一般是绝对值误差。还有一些关于数据到来顺序是否影响查询结果的细节问题。\n\n很多友商倒是提供了不同的 approx_quantile 实现，甚至直接提供函数返回中间 sketch binary state 用于自行组合。ScopeDB 的内部实现差不多也长这样，但是提供给用户还是有点抽象了。不过不同的分位数算法处理不同的场景需求，或许是可以考虑的。", "createdAt": "Wed Nov 04 14:13:02 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 8, "conversationId": "2117983463315997181", "author": {"username": "tison1096", "name": "tison", "profileImageUrl": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, "authorId": "740784709878288384", "quotedTweet": {"id": "2117981902548480031", "text": "Next prompt: \"Did response latency (p50, p95, and p99) on POST /v1/agent/runs degrade during the traffic surge?\"\n\nMedian latency stays 84–96ms all day, while approx_quantile flags a peak-window spike to 318.4ms at p95 and 842.5ms at p99.\n\nhttps://t.co/56rEHUI1X3 https://t.co/vP7HgVDW0r", "createdAt": "Wed Nov 04 14:06:50 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2117981902548480031", "author": {"username": "scopedbio", "name": "ScopeDB", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952366949192925184/XIAANiVa_normal.jpg"}, "authorId": "1918079432730001413", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWSVMWPbUAA0rYF.jpg", "width": 2048, "height": 1248, "previewUrl": "https://pbs.twimg.com/media/HWSVMWPbUAA0rYF.jpg:small"}], "translationZh": "下一个提示词：“流量激增期间，POST /v1/agent/runs 的响应延迟（p50、p95 和 p99）是否恶化？”\n\n全天延迟中位数保持在 84–96 毫秒，而 approx_quantile 检测到高峰时段 p95 飙升至 318.4 毫秒，p99 飙升至 842.5 毫秒。\n\nhttps://t.co/56rEHUI1X3 https://t.co/vP7HgVDW0r"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "tison（陈梓立）", "role": "Agent 与开发工具实践与观察", "why": "公开 Agent 参与版本变更确认、验收和测试治理，企业工程价值具体。", "handle": "tison1096"}, "createdAtIso": "2026-11-04T14:13:02+00:00", "createdAtBeijing": "2026-11-04T22:13:02+08:00", "createdAtLocal": "11-04 22:13 北京", "url": "https://x.com/tison1096/status/2117983463315997181", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2117983463315997181", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "生产日志分位数算法实现与选型", "evidence": "跟 T-Digest 的作者讨论确定了极限值的处理方式", "rationale": "分享生产实现、误差取舍及算法适用场景"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, {"id": "2118049416942903317", "track": "research", "source": {"id": "2118049416942903317", "text": "As I called out, inference overfitting is happening: you can brutally hillclimb the TPS based on the downstream task their token distributions. https://t.co/myz00VcMrC  Glad to see together ai sharing the same mindset here and executing it super nicely that they even able to optimize inference in real-time.", "createdAt": "Wed Nov 04 18:35:07 +0000 2026", "replyCount": 0, "retweetCount": 1, "likeCount": 27, "conversationId": "2118049416942903317", "author": {"username": "hxiao", "name": "Han Xiao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, "authorId": "28969465", "quotedTweet": {"id": "2118032475498983540", "text": "Introducing the Together Compiler: continual compilation for AI inference! I’m super proud to finally share this work from our research team! ✨\n\nToday’s inference is “Polymorphic” or shape-shifting, it doesn’t sit still. On OpenRouter, 80% of traffic goes to models released in the last three months and the top ten most popular open models each use a different architecture. Our customers constantly change their usage behaviors. Together Compiler leverages agents to continually optimize our deployments immediately as these changes occur.\n\nTogether Compiler research highlights include:\n1. 252x better throughput: TKCC lets agents try 252x more optimization experiments per hour compared to prior agent inference optimization systems.\n2. State-of-the-art TPS across InferenceX workloads we tried: TKCC outperforms the best InferenceX engine across all tested settings in just 24 hours & 2 nodes per compile. Including 1111 TPS on MiniMax M3.1 B200 and 1205 TPS on DeepSeek v4.1 Flash GB300 at batch size 1. NVIDIA, AMD, Trainium2.\n3. Continuous recompilation: TKCC currently serves many trillions of production tokens per day and adapts to traffic shifts within just a few hours of recompilation.\n4. Bitter lessons: TKCC’s design builds on 2+ years of building frameworks to accelerate AI Inference, starting from ThunderKittens and Megakernels. Compilers have always used abstractions and IRs, but we show that agentic compilers now reach higher performance ceilings without abstractions.\n\nFrom an incredible team @reyna_abhyankar @dylan__lim @realDanFu @togethercompute!!", "createdAt": "Wed Nov 04 17:27:47 +0000 2026", "replyCount": 44, "retweetCount": 85, "likeCount": 517, "conversationId": "2118032475498983540", "author": {"username": "simran_s_arora", "name": "Simran Arora", "profileImageUrl": "https://pbs.twimg.com/profile_images/2055104018092060672/_S1YE9YB_normal.jpg"}, "authorId": "4712264894", "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HWS_82YaMAAg6lo.jpg", "width": 800, "height": 520, "previewUrl": "https://pbs.twimg.com/tweet_video_thumb/HWS_82YaMAAg6lo.jpg:small", "videoUrl": "https://video.twimg.com/tweet_video/HWS_82YaMAAg6lo.mp4"}], "translationZh": "推出 Together Compiler：面向 AI 推理的持续编译！终于能分享研究团队的这项成果，我无比自豪！✨\n\n如今的推理具有“多态性”，形态不断变化。在 OpenRouter 上，80% 的流量流向过去三个月内发布的模型，最受欢迎的十大开放模型各自采用不同架构。客户的使用行为也在不断变化。Together Compiler 利用智能体，在这些变化发生时立即持续优化部署。\n\nTogether Compiler 的研究亮点包括：\n1. 优化实验吞吐量提升至 252 倍：与此前的智能体推理优化系统相比，TKCC 让智能体每小时能尝试的优化实验数量达到 252 倍。\n2. 在我们测试的 InferenceX 工作负载中，TPS 达到业界领先水平：每次编译仅使用 2 个节点、耗时 24 小时，TKCC 就在所有测试配置下超越了表现最好的 InferenceX 引擎。其中，批大小为 1 时，MiniMax M3.1 在 B200 上达到 1111 TPS，DeepSeek v4.1 Flash 在 GB300 上达到 1205 TPS。覆盖 NVIDIA、AMD、Trainium2。\n3. 持续重新编译：TKCC 目前每天为生产环境处理数万亿 token，仅需数小时重新编译，即可适应流量变化。\n4. 苦涩的教训：TKCC 的设计建立在两年多的 AI 推理加速框架研发经验之上，起点是 ThunderKittens 和 Megakernels。编译器一直使用抽象和中间表示（IR），但我们证明，如今的智能体编译器无需抽象也能达到更高的性能上限。\n\n来自出色的团队 @reyna_abhyankar @dylan__lim @realDanFu @togethercompute！！"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "肖涵 Han Xiao", "role": "模型、研究与推理实践与观察", "why": "有端侧检索、ANE/GPU 对比与资源取舍，兼顾研究和真实产品。", "handle": "hxiao"}, "createdAtIso": "2026-11-04T18:35:07+00:00", "createdAtBeijing": "2026-11-05T02:35:07+08:00", "createdAtLocal": "11-05 02:35 北京", "url": "https://x.com/hxiao/status/2118049416942903317", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2118049416942903317", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Together持续编译推理优化", "evidence": "252x better throughput", "rationale": "发布持续编译方案及实验数据，性能属团队自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "正如我之前指出的，推理过拟合正在发生：针对下游任务的 token 分布，可以通过强力爬山优化，大幅提升 TPS。https://t.co/myz00VcMrC 很高兴看到 Together AI 也持相同思路，而且执行得非常出色，甚至能实时优化推理。"}, "avatar": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, {"id": "2117948976624189462", "track": "tools", "source": {"id": "2117948976624189462", "text": "借助REA仓库实操成功！飞书录音豆整个软件层面魔改后实操原理其实不复杂，就是借用了自己一台服务器去对接API，然后实现录音转写Token自由。\n\n按实体按钮→握手→蓝牙实时读取→实时字幕传回→录后识别→飞书文档\n\n相比于原版本的优点在于：\n1、所有消耗额度可控，可以使用全球性价比最高的API进行转写。\n2、UI更加简洁，注重核心功能。实时转写、录后转写；中文、英文、中英文。其他不重要的功能全部删减。\n3、代码全部开源，方便随意定制私人版本，录音是源头，后面想怎么变、怎么玩，就看想象力了。\n\n唯一的成本可能就在于这台服务器，这个把之前拿来养龙虾的轻量服务器凑合着就能用了。。。\n\nbeanscribe GitHub地址：https://t.co/MgbX59uHyw\n\nREA逆向仓库地址，好好用，得多用：https://t.co/nr7xKmohBh", "createdAt": "Wed Nov 04 11:56:00 +0000 2026", "replyCount": 7, "retweetCount": 10, "likeCount": 80, "conversationId": "2117948976624189462", "author": {"username": "gengdaJ", "name": "逸尘", "profileImageUrl": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, "authorId": "1897545708770840576", "quotedTweet": {"id": "2117899207764062606", "text": "我把飞书录音豆给逆向了。\n\n新搭建了一个飞书应用“录音豆”，放在了底部的导航栏。\n\n所有UI界面、功能定制、模型消耗，全部重新自定义！\n\n你现在可以用0.15元/h的StepFun API，也可以自己接1元/h豆包实时转写API，无需加钱购买官方套餐。\n\n每次录音握手需要2-3s，但是无伤大雅。\n\n如果需要长时间录音的同时使用飞书，点击右上角三个点，然后选择“浮窗”即可。\n\n每次录完音，记得按录音豆上的结束按钮，只按软件界面，还会继续录制（只是不会在自建应用转写）。\n\n本来是打算调整硬件启动方式的，穷尽所有办法，没找到刷机方式，不敢牺牲我的录音豆。。。😅\n\n有大神豆子多的，可以试试把硬件也彻底逆向了。这样子就不会莫名其妙被碰开了。\n\n开源地址👇", "createdAt": "Wed Nov 04 08:38:14 +0000 2026", "replyCount": 26, "retweetCount": 5, "likeCount": 78, "conversationId": "2117899207764062606", "author": {"username": "gengdaJ", "name": "逸尘", "profileImageUrl": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, "authorId": "1897545708770840576", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117895622233903104/img/qjCDsp0dxXPdAP0R.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117895622233903104/img/qjCDsp0dxXPdAP0R.jpg:small", "v https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "yetone", "role": "Agent 与开发工具实践与观察", "why": "magpie 故障复盘交代锁、I/O、冷启动和修复，属于可学习的真实工程。", "handle": "yetone"}, "createdAtIso": "2026-11-04T17:12:41+00:00", "createdAtBeijing": "2026-11-05T01:12:41+08:00", "createdAtLocal": "11-05 01:12 北京", "url": "https://x.com/yetone/status/2118028671613325496", "themeId": "editorial", "signalScore": 42, "editorial": {"id": "2118028671613325496", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "截图阻塞引发线程与CPU增长复盘", "evidence": "客户端每次重试又起一个新截图", "rationale": "包含阻塞根因、重试放大链路与三项修复"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, {"id": "2117814672225411264", "track": "creative", "source": {"id": "2117814672225411264", "text": "Dan Koe 这篇长文讲的是怎么用 AI 做\"一人创意团队\"。方法我整理成 8 条：\n\n1. 软件做得再好，一本书花三年写完，没人知道你是谁、能帮什么忙，照样没人付钱。所以他开篇就说，最赚钱的本事一直是让人注意到你。\n\n2. 一条爆到一百万播放，其余每条一千，说明内容还行，品牌等于没有。别老赌爆款，要让人看完一条，还想回头翻你以前发的。\n\n3. 一人创意团队要顶三个岗位：品牌策略管定位，决定别人怎么看你；内容策略盯各平台什么在火，定下一批发什么、用什么形式；写手兼运营负责起稿、排期和发布。可以给自己干，也可以给没空想内容的创始人和公司干。他给的数是 1 到 3 个客户、月入 1 万到 7.5 万美元，前提是真做得好。\n\n4. AI 管查资料、出点子、写初稿，人管定方向和改稿。有家代运营公司说，现在每天的活就是审稿改稿，从 12 小时降到了 4 小时。不给方向、不给数据就让 AI 狂出稿，写出来的东西换谁的名字都能发。\n\n5. 先做一次深度访谈，录音转成文字，把你这个人摸清楚：你帮谁、经历过什么、受谁影响、信什么、反对什么、看问题和别人哪里不一样。整理成一份品牌文档，以后写东西前，先把这些素材给到 AI。\n\n6. 已经在发内容的，把各平台表现最好的 10 到 20 条拉出来，记下核心观点、说话风格和背后的世界观。还没开始的，列出对你影响最深的 5 到 10 个人，用同样的办法拆他们的内容。Dan 说，他的想法也是 Naval、《心流》作者契克森米哈伊这些人的观点，加上自己的经历，慢慢形成的。\n\n7. 选题搭成一张地图：3 到 4 个大方向 → 每个方向 5 到 7 个话题 → 每个话题 5 到 10 个点子 → 每个点子 4 到 5 个角度，算下来够写半年。点子先看过去半年到一年各平台什么内容数据好，再按自己的想法去讲。\n\n8. 想接客户，先免费给想合作的人写 10 条，改好直接私信发过去，一天发 10 个人。私信没人理，就公开发帖点名对方，毛遂自荐。", "createdAt": "Wed Nov 04 03:02:19 +0000 2026", "replyCount": 3, "retweetCount": 5, "likeCount": 29, "conversationId": "2117814672225411264", "author": {"username": "situking", "name": "司徒K", "profileImageUrl": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, "authorId": "1518825568959176705", "quotedTweet": {"id": "2117664712532123680", "text": "The most lucrative AI business to start in 2027", "createdAt": "Tue Nov 03 17:06:26 +0000 2026", "replyCount": 288, "retweetCount": 1086, "likeCount": 8898, "conversationId": "2117664712532123680", "author": {"username": "thedankoe", "name": "DAN KOE", "profileImageUrl": "https://pbs.twimg.com/profile_images/1845856303174037504/Q7ZZqVFa_normal.jpg"}, "authorId": "256523056", "article": {"title": "The most lucrative AI business to start in 2027", "previewText": "The most lucrative skill has always been capturing attention.\nIt’s obvious why.\nIf your goal is making more money, it doesn’t matter how good a software you build. It doesn’t matter if it took you 3", "titleZh": "2027 年最赚钱的 AI 创业方向", "previewTextZh": "最赚钱的技能，一直都是吸引注意力。\n原因显而易见。\n如果你的目标是赚更多钱，那么你开发的软件有多出色并不重要。即使你为此花了 3……"}, "translationZh": "2027 年最赚钱的 AI 创业方向"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWP9LzYaYAA_JOU.jpg", "width": 1280, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWP9LzYaYAA_JOU.jpg:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "司徒K", "role": "企业落地与产品组织实践与观察", "why": "有 FDE 进场交付问答及企业服务方法，补足咨询和交付视角。", "handle": "situking"}, "createdAtIso": "2026-11-04T03:02:19+00:00", "createdAtBeijing": "2026-11-04T11:02:19+08:00", "createdAtLocal": "11-04 11:02 北京", "url": "https://x.com/situking/status/2117814672225411264", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117814672225411264", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI一人创意团队的内容生产方法", "evidence": "先做一次深度访谈，录音转成文字", "rationale": "给出品牌资料、选题地图与人机协作步骤"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2092516367803232256/_-M62Ey1_normal.jpg"}, {"id": "2117848577091518548", "track": "creative", "source": {"id": "2117848577091518548", "text": "今天是瑞幸的埃塞金烘美式 https://t.co/a52QKNcfgQ", "createdAt": "Wed Nov 04 05:17:03 +0000 2026", "replyCount": 10, "retweetCount": 0, "likeCount": 19, "conversationId": "2117848577091518548", "author": {"username": "op7418", "name": "歸藏(guizang.ai)", "profileImageUrl": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, "authorId": "1669276256", "quotedTweet": {"id": "2117597942756573504", "text": "提示词：饮品照片 → 等轴测微缩建筑插画\n\n请根据我上传的真实饮品照片，将照片中的咖啡、奶茶或饮料改造成一座可爱的品牌主题微缩建筑，使用粗黑描边的 2D 等轴测扁平矢量插画风格。\n\n最后将原始照片和生成的插画通过代码拼接，输出一张完整的高清对比图。\n\n用户提供的信息\n\n品牌名称：【选填，留空则从照片自动识别】\n饮品名称：【选填，留空则从照片自动识别】\n联名信息：【选填，没有则忽略】\n其他特色：【选填，例如咖啡豆产地、庄园名称、特殊配料等】\n用户默认会上传一张饮品照片。优先识别照片中的品牌 Logo、包装、颜色、杯型、文字和饮品特色。\n如果用户提供了明确的信息，以用户填写的内容为准；无法确认的信息不要自行编造。\n原图参考与轮廓保真（最高优先级）\n\n必须直接将用户上传的真实照片作为图像生成的视觉参考，进行图生图创作，而不是只根据文字描述重新设计一个杯子。\n\n请让图像模型直接观察并理解原图的主体轮廓，不需要使用代码预先提取边缘或生成线稿。\n\n重点保留：\n\n杯型轮廓： 杯身的宽高比例、上宽下窄的形态、瓶身或罐身的独特造型。\n顶部结构： 杯盖厚度、杯口轮廓、吸管位置、奶盖、奶油等。\n包装特征： 品牌 Logo、主色、标签位置、特殊图案、文字布局。\n饮品细节： 液体颜色、分层、冰块、珍珠、水果、咖啡豆、饼干碎等。\n独特标识： 联名人物、吉祥物、特殊贴纸和装饰。\n\n以原图的杯身轮廓为基础进行插画化和建筑化改造，让生成的建筑依然能够一眼看出是照片中的那杯饮料。\n\n不要随意替换杯型、改变品牌配色或重新设计包装。\n\n但也不要机械复制原照片的拍摄角度，需要在保留原始造型的同时进行合理的三维空间推演。\n核心原则：保留原始饮品的识别特征，重新设计它的建筑功能。\n等轴测微缩建筑设计\n将饮品包装改造成一座充满童趣的品牌主题微缩建筑（Isometric Miniature Diorama）。\n采用 Elevated Three-Quarter Isometric View，从建筑斜前方约 45°、向下约 30° 的角度观察。\n\n必须能清楚看到建筑顶部、正面、侧面和地台的空间纵深，不能使用完全正面的产品展示视角。\n\n建筑设计要求：\n\n将原始杯身作为建筑主体，保留其形状和标志性包装特征。\n将杯盖、奶盖、饮品配料等自然转化为屋顶、平台、露台或趣味建筑装饰。\n在杯身上设计圆形窗户、入口、商店橱窗、阳台等。\n根据空间结构增加楼梯、蓝色滑梯、观景台、遮阳棚、悬挂招牌等设施。\n加入可爱的卡通吉祥物，让它们在建筑里喝饮料、玩耍、滑滑梯、向窗外张望。\n周围搭配盆栽、藤蔓、花朵、草坪等绿植，营造治愈的微缩景观。\n根据饮品特色增加相关元素，例如咖啡树、咖啡果实、饼干、橙子、茶叶、珍珠等。\n如果有特殊产地、庄园或联名信息，可将相关视觉元素融入周围环境。\n\n所有装饰都要围绕品牌和饮品特色展开，不要每次机械地复制同一种建筑布局。\n\n整座建筑坐落于具有明确等轴测透视的斜向地台上，空间结构合理、层次丰富。\n\n插画风格（严格遵守）\n\nBold Outline Isometric Flat Vector Illustration\n\n采用专业的 2D 等轴测扁平矢量插画风格，而不是 3D 卡通渲染。\n\n描边：\n使用清晰、均匀、较粗的黑色轮廓线（Thick Consistent Black Outlines）。外轮廓略粗，内部细节略细，转角圆润，线条流畅。\n色彩：\n使用高纯度、干净、明快的纯色色块填充（Solid Flat Color Fills）。大面积平涂，每个物体仅使用少量相邻色阶表现结构。\n\n阴影：\n只允许少量边界清晰的硬边阴影（Minimal Hard-Edged Flat Shading），不使用明显渐变、真实反射和复杂光照。\n造型：\n几何形状简洁圆润，比例可爱，带有童趣和玩具化特点，但保持纯二维矢量插画质感。\n背景：\n使用明亮、柔和的薄荷绿或与品牌主色协调的纯净背景。可以添加少量白云、星星、植物等平面装饰。\n整体品质：\n精致的商业品牌 IP 插画海报，画面干净，色彩协调，空间关系清晰，细节丰富但不过度复杂。\n画面应当像专业设计师使用 Adobe Illustrator 制作的矢量插画，而不是 Blender 或 Cinema 4D 渲染的三维场景。\n严格避免：\n3D Rendering、Photorealistic、Plastic Texture、Glossy Highlights、Soft Gradients、Realistic Lighting、Complex Shadows、Metallic Reflections、Painterly Texture、Watercolor、Oil Painting。\n文字与标题排版\n在插画顶部设计完整的品牌英文标题。\n主标题： 品牌英文名称，例如 GRID COFFEE、ChaBaiDao、FANTA。\n副标题： 饮品英文名称，例如 Americano、Caramel Cookie Latte。\n补充信息： 如果存在联名、咖啡豆庄园、特殊产地等，可以加入一行较小的英文说明。\n文字要求：\n使用圆润、厚实的粗体无衬线字体（Rounded Bold Sans-serif）。\n使用纯色文字，可以搭配简洁的白色描边。\n\n不要使用立体挤压、浮雕、金属、渐变等复杂文字效果。\n\n品牌主标题突出，副标题清晰，但不能喧宾夺主。\n\n标题距离画面顶部至少保留约 8% 的安全边距。\n\n标题与建筑之间保持舒适的留白，不要让文字贴着杯盖。\n\n画面比例与构图\n\n必须先生成一张独立、完整的插画，而不是让 AI 直接生成左右拼接的对比图。\n根据原照片方向选择画布：\n原图为竖版：生成 3:4 竖版插画。\n原图为横版：生成 4:3 横版插画。\n原图为正方形：生成 1:1 插画。\n特殊比例可根据实际情况灵活适配。\n构图要求：\n所有建筑、楼梯、滑梯、人物、植物和底座必须完整出现在画面中。\n主体距离画布左右和底部边缘保留约 6%–8% 的安全距离。\n\n顶部文字与画布边缘留出足够空间。\n不能截断任何重要建筑结构或装饰。\n不要为了填满画面而过度放大主体。\n不要因为满足比例要求而拉伸、压扁或裁切内容。\n生成前就应规划完整构图，而不是完成后再强制裁切为目标比例。\n使用代码自动拼接\n独立插画完成后，再使用 Python Pillow 等工具进行图片拼接。\n拼接规则：\n原始照片为竖版：原图在左，插画在右。\n原始照片为横版：原图在上，插画在下。\n原始照片为正方形：默认左右拼接。\n\n拼接要求：\n必须使用用户上传的真实原始照片。\n不得使用 AI 重新绘制的照片替换原图。\n不裁切、不拉伸、不修改原照片的内容。\n\n采用等比例缩放，使两张图片自然对齐。\n如果宽高比例有差异，使用背景留白适配，而不是强行裁切。\n两张图片之间可以添加适当的白色间隔。\n保持插画完整，所有标题和建筑元素不得超出边界。\n输出高清 PNG 图片。\n8. 最终输出\n直接完成整套创作流程，无需逐步征求用户确认。\n提供两份成品：\n① 完整独立插画 PNG\n一张真正完整的等轴测微缩建筑插画，不是从左右对比图中裁切出来的图片。\n② 原始照片 + 插画拼接 PNG\n使用真实原始照片与生成插画，通过代码合成为一张完整图片。\n\n最终优先展示拼接图，并提供两个高清图片文件。\n最重要的执行原则：\n\n原图直接作为视觉参考 → 保留原始杯型和包装轮廓 → 转换为斜上方 3/4 等轴测建筑 → 粗黑描边、纯色平涂的矢量风格 → 生成完整独立插画 → 使用代码与真实原图无裁切拼接。\n最终效果应该让人一眼认出原本的那杯饮料，同时惊喜地发现它变成了一座精致、可爱、充满生活气息的微缩建筑。", "createdAt": "Tue Nov 03 12:41:07 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 20, "conversationId": "2117597892756312271", "inReplyToStatusId": "2117597892756312271", "author": {"username": "op7418", "name": "歸藏(guizang.ai)", "profileImageUrl": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, "authorId": "1669276256"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQcCemacAAVb4s.jpg", "width": 1536, "height": 1024, "previewUrl": "https://pbs.twimg.com/media/HWQcCemacAAVb4s.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "歸藏", "role": "内容、视觉与多模态实践与观察", "why": "有多 Agent 记忆协作和多模态产品实测，创作工具覆盖广。", "handle": "op7418"}, "createdAtIso": "2026-11-04T05:17:03+00:00", "createdAtBeijing": "2026-11-04T13:17:03+08:00", "createdAtLocal": "11-04 13:17 北京", "url": "https://x.com/op7418/status/2117848577091518548", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2117848577091518548", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "饮品照片转等轴测微缩建筑", "evidence": "生成完整独立插画 → 使用代码与真实原图无裁切拼接", "rationale": "完整提示词覆盖轮廓保真、构图与拼接流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, {"id": "2118052017755005210", "track": "tools", "source": {"id": "2118052017755005210", "text": "Cicada 是一款开源的、完全原生的 macOS 实时语音翻译与 AI 会议助手。 \n\n它可以在 Zoom、腾讯会议、飞书、YouTube 等应用中提供实时双语字幕、AI 会议纪要，还能把你说的话翻译成另一种语言，通过虚拟麦克风直接传给会议软件。\n\nhttps://t.co/GKGaiKJU1f", "createdAt": "Wed Nov 04 18:45:27 +0000 2026", "replyCount": 10, "retweetCount": 8, "likeCount": 29, "conversationId": "2118052017755005210", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2117574590075691483", "text": "🎉 所有用 Mac 的朋友，用上这个开源会议纪要和同声传译软件，还能白嫖支付宝家每月50小时的额度！\n\n知了 / Cicada，已经按 Apache-2.0 协议免费开源，改了自用、拿去商用或闭源再发布都行。\n\n几大功能：\n- 实时字幕翻译，不管跨国会议、直播还是视频，都能自动翻译\n\n- 飞书级别的 dex 补上“看代码、审代码”的工具\n\nOpenAI 宣布将收购开发者工具公司 Pierre Computer Company（下称 Pierre）。如果你在 Codex App 里浏览过项目文件、看过代码改动，你用的就是 Pierre 做的两个开源组件。收购金额官方没说。\n\n先补一点背景。Codex 是 OpenAI 的编程智能体，也就是能自己写代码、改代码的 AI 助手。程序员管理代码普遍用 Git，它会记下每一次改动，谁在什么时候改了哪一行都能查到。代码合进正式版本前，通常要有人审一遍：对着改动前后的差异逐行检查，有没有写错、有没有隐患。\n\nPierre 做的就是这一块。它的开源组件 Trees 用来在项目里快速翻找文件，Diffs 用来展示改了哪些地方，两者在代码量很大时也能保持流畅。Diffs 还有个编辑模式，审代码的人看到问题可以当场改那一行，不用切回编辑器。\n\nPierre 最近还发布了语法高亮工具 Highlights，AI 一边往外输出代码，高亮一边跟着更新。另外它有一项服务叫 Code Storage，让其他 App 能用 Git 的方式存代码、记录修改历史。\n\nOpenAI 为什么要买它？AI 写代码越来越快，还能同时开好几路任务，人要审的改动量跟着暴涨，看代码、审代码成了新的瓶颈。\n\nOpenAI 这周早些时候刚公开了内部自研的代码管理后台 Pando，供工程师和 AI 智能体一起使用。OpenAI 说，收购 Pierre 是想把从 AI 新建第一个分支（在代码副本上单独修改，改好再合并回去）到代码正式上线的整条流程，都放进 Codex 里完成。\n\n对现有用户的影响：Pierre 的开源项目会继续开源，OpenAI 表示会继续参与贡献。Code Storage 的客户在收购完成后可以接着用，OpenAI 会逐步把它的功能并入 Codex；这项服务之后会单独保留多久，官方没说。\n\n这笔交易还要等监管审批等常规条件，完成前两家仍是独立公司。", "createdAt": "Wed Nov 04 15:59:26 +0000 2026", "replyCount": 26, "retweetCount": 4, "likeCount": 35, "conversationId": "2118010240587239540", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2117999237745049883", "text": "Today we’re announcing that OpenAI will acquire @pierrecomputer to accelerate our vision for making Codex a place where teams can build software together with AI, from first idea to the version they ship.\n\nPierre’s open-source developer tools already power parts of Codex today. Together, we’ll build on that foundation for the agentic era.\n\nhttps://t.co/ZeJ4BOj7T7", "createdAt": "Wed Nov 04 15:15:43 +0000 2026", "replyCount": 229, "retweetCount": 229, "likeCount": 3712, "conversationId": "2117999237745049883", "author": {"username": "OpenAINewsroom", "name": "OpenAI Newsroom", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410297101381632/3Gs7_1gs_normal.jpg"}, "authorId": "1803847768781524992", "translationZh": "今天我们宣布，OpenAI 将收购 @pierrecomputer，加速实现我们的愿景：让 Codex 成为团队与 AI 共同开发软件的平台，贯穿从最初构想到交付版本的全过程。\n\nPierre 的开源开发工具如今已为 Codex 的部分功能提供支持。我们将携手在这一基础上，面向智能体时代继续构建。\n\nhttps://t.co/ZeJ4BOj7T7"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-04T15:59:26+00:00", "createdAtBeijing": "2026-11-04T23:59:26+08:00", "createdAtLocal": "11-04 23:59 北京", "url": "https://x.com/dotey/status/2118010240587239540", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2118010240587239540", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "OpenAI拟收购Pierre完善Codex代码审查流程", "evidence": "OpenAI 宣布将收购开发者工具公司", "rationale": "包含收购公告、组件用途及交易完成条件"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117870028553146859", "track": "research", "source": {"id": "2117870028553146859", "text": "Tried Tencent Hy (Hy4) on a chart from my SGLang Omni notes: 9 series on a log2 x-axis, 27 points. Input was just the PNG and a short prompt.\n\nIt returned all 27 values plus matplotlib code that redraws the chart. Average error 0.27 pp. Worst point: 4.7% read as 4.0%. https://t.co/IbCYLlTDRX", "createdAt": "Wed Nov 04 06:42:17 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 9, "conversationId": "2117870028553146859", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117869315978584064/img/4eoellH7ViEETs0A.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117869315978584064/img/4eoellH7ViEETs0A.jpg:small", "videoUrl": "https://video.twimg.
