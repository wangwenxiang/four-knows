"Zihua", "role": "开源产品与工程实践实践与观察", "why": "PNGDeer 有开源、在线测试和同质量压缩比较，连接 AI 工程与视觉交付。", "handle": "luinlee"}, "createdAtIso": "2026-11-04T07:01:43+00:00", "createdAtBeijing": "2026-11-04T15:01:43+08:00", "createdAtLocal": "11-04 15:01 北京", "url": "https://x.com/luinlee/status/2117874917433839803", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2117874917433839803", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "slimdeer 开源图片压缩与格式转换工具发布", "evidence": "支持 png, jpg, webp, avif", "rationale": "发布具体开源工具，压缩率优势仅为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2111297667779432448/O7iHassM_normal.jpg"}, {"id": "2117874922018234430", "track": "tools", "source": {"id": "2117874922018234430", "text": "为什么 slimdeer 压缩率更好：不用一个固定的质量参数，而是每张图都搜一遍，用感知指标 SSIMULACRA2 打分，留下仍然达标的最小文件。\n\n和 TinyPNG 同等画质时，中位文件小：PNG 8–12%，JPEG 12%，WebP 5%，AVIF 23%。\n\n测试图和脚本都在仓库里。", "createdAt": "Wed Nov 04 07:01:44 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2117874917433839803", "inReplyToStatusId": "2117874920030179388", "author": {"username": "luinlee", "name": "Zihua", "profileImageUrl": "https://pbs.twimg.com/profile_images/2111297667779432448/O7iHassM_normal.jpg"}, "authorId": "69492059", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Zihua", "role": "开源产品与工程实践实践与观察", "why": "PNGDeer 有开源、在线测试和同质量压缩比较，连接 AI 工程与视觉交付。", "handle": "luinlee"}, "createdAtIso": "2026-11-04T07:01:44+00:00", "createdAtBeijing": "2026-11-04T15:01:44+08:00", "createdAtLocal": "11-04 15:01 北京", "url": "https://x.com/luinlee/status/2117874922018234430", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2117874922018234430", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "slimdeer 感知质量驱动图片压缩", "evidence": "用感知指标 SSIMULACRA2 打分", "rationale": "提供逐图搜索方法及自述对比数据与复现线索"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2111297667779432448/O7iHassM_normal.jpg"}, {"id": "2117938659169386640", "track": "tools", "source": {"id": "2117938659169386640", "text": "兄弟们，这两天把 DeepSeek Harness（大肥鱼）现有的野生插件全翻了一遍，挑了 7 类最实用的出来，仓库地址也都附在下面了，建议先收藏后看。\n\n很多人刚装完 DSH，最大的感觉就是像个毛坯房：换个窗口就失忆，跑起任务来怕账单炸，人离开电脑还没法盯着。\n\n其实去小破站评论区淘一圈，这些坑基本都有现成轮子补上了👇\n\n1. DSH-Go & DSH Pal（UP主：黑鸦Heya / 评论区开源）\n不想一直守在电脑前就装这两个：DSH-Go 是 B站AI创造公开赛上的非官方手机端，躺床上就能拿手机操控电脑里的 DSH；官宣评论区还有人开源了 DSH Pal，也能用手机远程派活、看进度。\nDSH-Go：https://t.co/KlOwrfNk99\nDSH Pal：https://t.co/OltLeBFv6B\n\n2. dsh-bili-scroll（UP主：凌羽clover）\n让 DSH 每天自己去刷一轮小破站，读完字幕把有干货的视频整理成日报，觉得真值得看才会主动喊你。\n仓库：https://t.co/refxLIMDA4\n\n3. dsh-bili-humanism  让大肥鱼理解世界（UP主：苌萌萌）\n前阵子不少人的 Agent 到处乱发评论闹出“鱼灾”。这个插件直接把评论接口关了，不刷屏、不扰民，只让大肥鱼定时刷视频记笔记。\n仓库：https://t.co/jev15owbxT\n\n4. dsh-cost-meter（UP主：程序员阿江-Relakkes 评论区高赞）\n评论区好几拨人都在推的看账单工具。Agent 跑大任务万一卡进死循环，Token 掉得极快，装上它就能在底下实时看着当前会话花了多少钱、还剩多少余额。\n仓库：https://t.co/Jk2nCI7mpL\n\n5. dsh-g-memory & universal-plugin-hub（官宣评论区开发者自荐）\n一个给 DSH 加上本地跨会话记忆，换窗口不用从头交代背景；另一个用来统一管 MCP、Skills 和第三方插件源，装多了也不乱。\n插件管理 universal-plugin-hub：https://t.co/BBmypsNEME\n本地记忆 dsh-memory-palace：https://t.co/UutSDsimVc\n\n6. dsh-context + dsh-reasoning-only-guard（写代码防崩组合）\n重度写代码建议装。dsh-context 用来看上下文占了多少、顺手做压缩防降智；dsh-reasoning-only-guard 专门治模型“光在那思考、不吐正文”的卡死毛病。\ndsh-context：https://t.co/tJssyynkq7\ndsh-reasoning-only-guard：https://t.co/jahY2E4083\n\n7. dsh-nekowhale-stickers（UP主：可以叫我云大人）\n小破站上的整活之王，UP 主硬烧了 32 万 Token，把大肥鱼表情包做成了一套能直接调用的 DSH 知识库插件。\n仓库：https://t.co/cAFiZKv9ju\n\n说真的，能一口气掏出这么多轮子，全靠这两天 DSH 小破站官号的评论区。\n官号刚入驻阿B，第一条视频 12 小时就破了百万播放、涨粉 30 多万。别人家官宣底下都在排队打卡，这边的评论区直接被野生开发者干成了大型 AI 作品展和插件集市。\n\n要是你刚听说“大肥鱼”还没装过，小破站上已经有 UP 主做好了《50分钟吃透DSH超详细教程》和《什么是“鱼灾”？附安全养鱼指南》，直接去搜来看就行。", "createdAt": "Wed Nov 04 11:15:00 +0000 2026", "replyCount": 35, "retweetCount": 39, "likeCount": 199, "conversationId": "2117938659169386640", "author": {"username": "cnyzgkc", "name": "木马人", "profileImageUrl": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, "authorId": "1866821173755121666", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWRQb8VaQAARIjG.jpg", "width": 1920, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWRQb8VaQAARIjG.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "木马人", "role": "内容、视觉与多模态实践与观察", "why": "展示用 Python 自动渲染科普短片并解释制作方式，提供创作增量。", "handle": "cnyzgkc"}, "createdAtIso": "2026-11-04T11:15:00+00:00", "createdAtBeijing": "2026-11-04T19:15:00+08:00", "createdAtLocal": "11-04 19:15 北京", "url": "https://x.com/cnyzgkc/status/2117938659169386640", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2117938659169386640", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "DeepSeek Harness插件资源整理", "evidence": "挑了 7 类最实用的出来", "rationale": "提供插件仓库及远控、记忆、费用监控用途"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1963499609017495553/kuzkS82V_normal.jpg"}, {"id": "2117964832183848969", "track": "agent", "source": {"id": "2117964832183848969", "text": "Agent Reach 有个挺实用的设计，就是自动切换工具。\n\n简单来说，同一个任务可以配置多个工具。如果第一个工具失败了，它会在条件允许的情况下自动尝试备用方案。\n\n比如读取网页，优先用 Jina，不行再试 Exa；读取 GitHub 内容，可以先用 gh，失败后尝试 REST API。这样 Agent 不用自己折腾不同工具的调用方式。\n\n不过也不是所有平台都能自动切换。比如 X 和小红书，目前主要依赖 OpenCLI，如果底层工具出了问题，就没有那么容易自动恢复。而且遇到限流、账号风控或需要登录时，它也不会无限重试。\n\n另外，Agent Reach 还有一套独立浏览器和登录态管理机制。\n\n它使用独立的浏览器环境，不影响日常 Chrome。如果 Chrome 已经登录某个平台，在满足条件时可以复用对应网站的 Cookie，不用每次重新登录。浏览器默认后台运行，闲置 10 分钟自动关闭，需要时再启动。\n\n整体来看，Agent Reach 不只是把多个工具打包到一起，还帮 AI Agent 管理工具切换、浏览器环境和登录状态。\n\n它最大的价值，就是减少 AI Agent 获取互联网信息时的配置和维护成本。 不过涉及账号、Cookie 和平台风控，还是需要注意安全与使用限制。", "createdAt": "Wed Nov 04 12:59:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2117964831240204616", "inReplyToStatusId": "2117964831240204616", "author": {"username": "sitinme", "name": " alse, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2117794212288594175", "track": "tools", "source": {"id": "2117794212288594175", "text": "怎么装\n\n装好 Docker，下载官方的 compose 文件：\n\nmkdir open-notebook && cd open-notebook\ncurl -o docker-compose.yml https://t.co/EetJL50UPC\n\n打开 docker-compose.yml，把 OPEN_NOTEBOOK_ENCRYPTION_KEY 的值换成你自己生成的随机串，用 openssl rand -hex 32 就行。它负责加密你存进去的 API key，要保管好。然后启动：\ndocker compose up -d\n\n等半分钟，打开 http://localhost:8502。在侧边栏的 Models 里加一家模型服务，至少配一个对话模型和一个 embedding 模型，点 Auto-assign Defaults，就能建笔记本开聊了。\n\n两个坑先说。默认没有登录密码，端口对所有网卡开放，装在服务器或者公司网络里的，启动前把端口绑到 127.0.0.1，或者加一行 OPEN_NOTEBOOK_PASSWORD。想全本地跑，再加一个 Ollama 容器，拉 qwen3 和 nomic-embed-text 两个模型，内存 8G 起步。", "createdAt": "Wed Nov 04 01:41:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 1, "conversationId": "2117794206739583367", "inReplyToStatusId": "2117794211122573534", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-04T01:41:01+00:00", "createdAtBeijing": "2026-11-04T09:41:01+08:00", "createdAtLocal": "11-04 09:41 北京", "url": "https://x.com/sitinme/status/2117794212288594175", "themeId": "editorial", "signalScore": 51, "editorial": {"id": "2117794212288594175", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Open Notebook 部署与安全配置", "evidence": "默认没有登录密码，端口对所有网卡开放", "rationale": "提供部署步骤、密钥配置与网络暴露防护方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117794208488546663", "track": "tools", "source": {"id": "2117794208488546663", "text": "喂给 AI 多少，你说了算\n\n用过 RAG 工具的应该都碰到过：资料一多，要么 AI 抓不到重点，要么 token 烧得心疼。\n\nOpen Notebook 给每份资料配了一个上下文开关，点一下切一档。\n\n不发送。 跟当前问题无关的，直接排除。\n\n只发 insight。 只带标题和 AI 提炼过的要点，体积小得多，适合当背景资料。\n\n发全文。 正在精读、要引用原话的那几份才开这一档。\n\n聊天框上方会实时显示这轮带了几份资料、估算多少 token，花多少心里有数。上下文超过大约 10 万 token，它会自动切到你指定的长上下文模型。\n\ninsight 从哪来？靠 Transformation。它其实就是一段存好的 prompt，对一份资料跑一遍，结果存成这份资料的 insight。\n\n内置了论文分析、要点提炼、精简摘要、目录、思考题等六个，也能自己写，比如专门抽合同里的付款条款。新写的先在 Playground 里试，满意了再设成新资料的默认处理。", "createdAt": "Wed Nov 04 01:41:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2117794206739583367", "inReplyToStatusId": "2117794207733555424", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPpP_caEAABKwg.jpg", "width": 1080, "height": 645, "previewUrl": "https://pbs.twimg.com/media/HWPpP_caEAABKwg.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-04T01:41:00+00:00", "createdAtBeijing": "2026-11-04T09:41:00+08:00", "createdAtLocal": "11-04 09:41 北京", "url": "https://x.com/sitinme/status/2117794208488546663", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2117794208488546663", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "资料上下文分档与提示词转换", "evidence": "结果存成这份资料的 insight", "rationale": "提供上下文成本控制与可复用资料处理方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2118040410706911267", "track": "creative", "source": {"id": "2118040410706911267", "text": "这道理不只是适用于出版图书，很多领域都适用呀：\n\n未来会有三种书，\n\n第一种，是用2H铅笔写在纸上的书，以便证明没用AI，只有那些买了也不会读的超级富豪会买。（很多人会死守这个立场。） \n\n第二种，作者用AI创作、读者仍然想读的书。（传统出版会走这条路。） \n\n第三种，读者告诉AI自己想读什么书，AI就生成给他们。（这才是Amazon正在走的方向。）", "createdAt": "Wed Nov 04 17:59:19 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 1, "conversationId": "2118040410706911267", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2117971877721505866", "text": "就很离谱，一个南非女作家Coral Hart在一年半的时间里用AI出版了371本书，总体算下来赚了差不多100万美金。\n\n在拿AI写书之前，她就是一个专门创作言情水文的高产作家，平均每个月能出版1本书，不是那种能登上畅销榜的品质，主要靠量赚钱。\n\n去年，出版社和她解约了，因为觉得反正都是水文，不如用AI代替这种水平的作家，Coral Hart倒是很快接受了现实，既然打不过，那就加入吧，她也开始工业化的训练AI写书，通过亚马逊的自出版和订阅模式，实现了比过去更高的收入。\n\n从结果来看，这很像是一个因为AI而失业的人使用AI「报复社会」的逆转剧情，不就是往互联网上堆屎吗，谁怕谁啊，我不但能堆，还能赚得盆满钵满，气不气？\n\n根据Coral Hart的说法，今年开始模型进步巨大，去年需要一段段的生成文本，而且需要花大力气雕琢提示词，但现在基本上已经可以一次性生成整本书的初稿了，「语法、结构、情感都有了飞跃提升」。\n\n她说，如果你只会给模型下任务「给我写本xx主题的书」，那么得到的也一定是垃圾，作家在这个流程里必须介入确定故事改编、写作风格、人物细节和章节大纲，「ChatGPT擅长对话，但散文能力很差，Claude善于设计故事骨架，却完全不知道怎么写肉戏，Gork经常不遵循指令，不过很懂怎么表达情欲」。\n\n我看看了这老姐在Reddit的AMA（问答马拉松），部分内容还算坦诚，我贴过来你们看看吧：\n\n问：\n怎么去AI化？你那个产量太夸张了，靠自己来改写根本不可能吧。还有，你是把写作当成生意，还是一门手艺？\n\n答：\nAI会偏离方向、胡编乱造，所以我会用一套流程，用AI去监管AI，用得最多的模型是Opus系列。\n读者买的是感受，而不只是书，我根据市场需求写好书。从「会出书的作家」转变成「会写作的出版人」，这种思维变化很重要，因为它让我能够作出明智的商业选择，同时不牺牲创作思维。\n\n问：\n你为自己的书感到自豪吗？你自己会欣赏或者购买它们吗？\n\n答：\n在开始生成正文以前，我会做很多工作：文风规范、写作技法手册、设定资料库、人物设定表、世界构建、情节节拍表、节奏图，最后才是大纲。\n在AI出现之前我就写得很快——不用AI，我一天也能写1万字，因此我的工作流程本来就很快。AI只是让我能更快，没有降低质量。\n我是个讲故事的人，脑子里总会冒出另一个人物、世界或反派。现在我终于能跟上自己的想法，让它们都有机会被写出来。\n以前没有AI时，只有商业上可行的书才会被写出来，因为没有时间浪费在那些「只是好玩」的作品上……\n\n问：\n细说一下你的百万级收入构成吧？\n\n答：\n每写完一本书后，先做小规模邮件推送，只有那些每天能卖出100美金的书，才会追投引流广告。\n广告卖不动烂书，所以我会先测试这些书，之后再加入 BookBub广告，只有数据表现最好的，才投AMS和Facebook广告。\n清水文，80%的收入来自直接付费，20%来自订阅付费，肉文，43的收入来自直接付费，57%来自订阅付费。\n整体而言，63%的收入是由9大语种版本贡献的，美国是最大的市场，其次是英国、澳大利亚、加拿大和法国。\n对我来说，成功的书每天都会有销量，失败的书要么表现平平，要么始终没能与读者建立联系。\n而我从失败中学到的是：哪里误判了市场，哪里没有听见读者的需要，我把每次表现不佳都视为学习或修好那本书的机会。\n\n问：\n谢谢你的回答，这确实让我更理解你的模式了，你已经建立了自己的读者群，并不依赖Amazon，令人羡慕。\n\n答：\n如果你依靠广告或社交平台，你其实是在租用那个读者——没办法直接互动，没办法把他们带回来、吸引他们继续购买。\n租用永远是一项成本，我的邮件名单归我自己所有，是一项资产，具有实实在在的价值。\n\n问：\n我有一个朋友，是一个曾经反对AI的作家，但他现在也改变主意了，想要学会用AI写作，你觉得他能追上你吗？这样的人会为自己以前的坚持付出怎样的代价？\n\n答：\n你说的这个朋友是不是……\n我觉得学习的机会窗口正在迅速关闭……即使你反对AI，也应该学会怎么使用它，这样才能具备相应的能力。\n我觉得反AI的作者会付出沉重代价吗？我觉得他们会在这个立场上死磕到底，除非他们有计划，而且已经理解AI如何运作、变化又有多快。\n我认为，现在对任何作者的职业生涯来说，最危险的事情就是害怕学习。你可以先学，再决定怎样运用这些知识……不能等海啸已经发生了才去报游泳课。\n\n问：\n那些「真正」的作家、不用AI也能写进畅销榜的作家，他们以后会屈从于AI吗？\n\n答：\n请站在出版商的立场，用商业头脑来问这个问题——如果我可以利用手头的市场数据，不断制造畅销书，又不用支付六位数的预付款或版税，怎样选择才是聪明的商业决策？如果我可以买一个工具，再用以前价格的10%买下你的创意，你真觉得他们不会这么做吗？\nAI会影响每一位作者。认识到我们提供的实际上是创意、扮演的是创意总监，而现在出售的东西就是创意，这将是大多数人最难完成的思维转变。\n我认识的畅销书作家都在学AI了，只不过他们一时半会不会告诉你们罢了。\n\n问：\n如果Amazon以后决定清除用AI出版的书了，怎么办？\n\n答：\n未来会有三种书，第一种，是用2H铅笔写在纸上的书，以便证明没用AI，只有那些买了也不会读的超级富豪会买。（很多人会死守这个立场。）\n第二种，作者用AI创作、读者仍然想读的书。（传统出版会走这条路。）\n第三种，读者告诉AI自己想读什么书，AI就生成给他们。（这才是Amazon正在走的方向。）\n\n问：\n所以对于一个作家而言，自己实际上是在用AI写书这件事情，是必须承认还是可以隐瞒的？\n\n答：\n我公开了自己使用AI这件事……结果我被开盒，收到死亡威胁（数以千计），有人叫我去死，他们还跑到我孩子的社交媒体上骚扰他们，给我的书集中刷差评。\n如果你能承受这种仇恨，那就公开你用了AI。\n如果你的心理状态应付不了这种程度的暴力，那就别公开。\n有人在YouTube上发了一个小时的视频骂我，但她之前给我的6本AI小说打过5星好评，如果你需要一个「AI」标签才会讨厌一个故事，那你讨厌的究竟是故事，还是AI？\n\n问：\n你怎么看那些批评AI本质上是一个窃贼、而且是在源源不断的制造垃圾的声音？\n\n答：\n嗯——你不能一边哭喊AI偷了你的作品，一边又骂它生成的是垃圾，还指望自己看起来不蠢。（如果生成的是垃圾，那它就是从你那里学来的垃圾，那么……嗯。）\n不过，我还遵循这样的原则：\n有没有被影响，得由你自己接下才成立。我不能把它强加给你，你也不能把它强加给我——我选择不接。\n我的态度就是「我才他妈不在乎」，黑子总会继续黑……随他们去。", "createdAt": "Wed Nov 04 13:27:00 +0000 2026", "replyCount": 7, "retweetCount": 42, "likeCount": 299, "conversationId": "2117971877721505866", "author": {"username": "foxshuo", "name": "阑夕", "profileImageUrl": "https://pbs.twimg.com/profile_images/1550395556685819910/qnbrCfBf_normal.jpg"}, "authorId": "64662332"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-04T17:59:19+00:00", "createdAtBeijing": "2026-11-05T01:59:19+08:00", "createdAtLocal": "11-05 01:59 北京", "url": "https://x.com/dotey/status/2118040410706911267", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2118040410706911267", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI小说生产流程与出版经营", "evidence": "文风规范、写作技法手册、设定资料库", "rationale": "引述提供创作准备与广告测试方法，收入属自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117803129848635797", "track": "tools", "source": {"id": "2117803129848635797", "text": "开源一个在线文档分享系统\n\n这是我们自己一直在用的文档分享系统\n方便将各种文件分享给同事、客户、合作伙伴\n\n支持HTML、PDF、Word、PPT等文件的上传和短链接分享，支持多种分享模式\n同时有简易版的数据统计和分析看板\nHTML可在线编辑、替换文件，保存后立即更新，原链接和权限保留，历史版本可恢复\n\nMIT协议，支持Docker自部署\n欢迎使用，GitHub仓库地址：https://t.co/vkeo3jWkgL", "createdAt": "Wed Nov 04 02:16:27 +0000 2026", "replyCount": 3, "retweetCount": 10, "likeCount": 87, "conversationId": "2117803129848635797", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPyrkJXQAA0N1s.jpg", "width": 2048, "height": 1070, "previewUrl": "https://pbs.twimg.com/media/HWPyrkJXQAA0N1s.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWPystxWEAAsOIL.jpg", "width": 2048, "height": 1046, "previewUrl": "https://pbs.twimg.com/media/HWPystxWEAAsOIL.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-11-04T02:16:27+00:00", "createdAtBeijing": "2026-11-04T10:16:27+08:00", "createdAtLocal": "11-04 10:16 北京", "url": "https://x.com/yaojingang/status/2117803129848635797", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2117803129848635797", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "开源在线文档分享系统", "evidence": "MIT协议，支持Docker自部署", "rationale": "自述开源工具，明确分享、版本恢复与部署能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2117950159363719332", "track": "agent", "source": {"id": "2117950159363719332", "text": "好家伙，90K star 的开源神器，直接把“啃陌生代码库”这件苦差事干没了？？？\n\n  平时不管是接手别人的老项目，还是去 Github 扒一个几万行的大项目，光理清“哪个文件调了哪个函数”就得看半天……\n\n  刚试了下开源的 Understand-Anything，装进 Claude Code 或 Codex 里，直接把整个代码库变成一张能聊天的交互式知识图谱！\n\n  装好直接敲命令就行：\n  /understand --language zh 全自动扫描项目，连节点说明带新手导览全给你出成中文\n  /understand-dashboard 起一个本地网页看板，API、服务、数据、UI 分层标色，点哪看哪\n  /understand-domain 把底层代码直接映射成业务流程图，产品经理都能看懂\n  /understand-chat 哪里看不明白直接问，比如“支付流程是怎么跑的？”\n  /understand-diff 提交代码前跑一下，直接看这次改动会波及哪些模块\n  /understand-knowledge 连日常攒的 Markdown 知识库和笔记也能喂进去生成关系图谱\n\n  最良心的是，它底层先用 Tree-sitter 把真实的调用关系扒出来，再让大模型补业务逻辑，不会瞎编幻觉……\n\n  而且只要一个人跑完把 .ua/ 目录提交上去，团队其他人连 Claude Code 和 API Key 都不用配，一行 npx 就能在本地白嫖看板，省下一大笔 Token\n\n  除了 Claude Code，Cursor、Codex、OpenCode、Gemini CLI 等 17 个主流工具都能直接装，经常看代码的先把这个装上👇\n\n  开源地址：https://t.co/51dBTYTSFN", "createdAt": "Wed Nov 04 12:00:42 +0000 2026", "replyCount": 24, "retweetCount": 20, "likeCount": 105, "conversationId": "2117950159363719332", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-04T12:00:42+00:00", "createdAtBeijing": "2026-11-04T20:00:42+08:00", "createdAtLocal": "11-04 20:00 北京", "url": "https://x.com/servasyy_ai/status/2117950159363719332", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117950159363719332", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Understand-Anything 代码库知识图谱与变更分析", "evidence": "/understand-diff 提交代码前跑一下", "rationale": "提供具体命令与团队复用方法，效果为作者自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2117903730494591205", "track": "tools", "source": {"id": "2117903730494591205", "text": "都有 AI 了，还手写文档的小伙伴应该不多了，有一种邪不压正里面这年头“正经人谁写日记啊” 这种味道，后面可预计真正不借助 AI 写文章的场景会越来越少了。\n\n其实我在 7 年前就开始想一个好用的 Markdown 笔记应用应该是怎么样的？我认为首先是完全 md 语法规范，也支持社区的增强语法规范，但必须是规范的，这样 md 就可以在任何支持渲染的容器去使用，不需要绑定任何一个特定的软件，这也是 Markdown 和 Word 我认为最本质的区别。\n\n同时应该是原生的、纯本地的、高性能的，不是套壳的，也应该是漂亮的，但不应该做成所见即所得，因为会很容易破坏原有 md 的纯净格式，当时用过为知笔记、有道笔记、Quiver、Bear、Obsidian 各种工具没有太顺手的，于是乎，当时就边学 Swift，在一个 2020 年初春节长假写下来了这个原生的 Swift Markdown 笔记应用，居然一直迭代到了现在，因为自己每天在使用，想到了一些东西，顺手的东西就全部给加上去了，这样越用越顺手。甚至后面为了防止笔记被改坏不好回去，写了一个类 git 的简单能力，可以帮你记录每次编辑改动，可以很好回到之前的版本，同时是一个本地功能，完全不上传任何云端。\n\n终于在今年有空，把 iPhone 和 iPad 版本也支持了，当时为了搞通 Apple 开发者账号的付款居然最后写信给库克才解决，拿到证书后第一件事就去写这个啦，也因为有了它，我的所有开源的 Mac 相关的软件终于不弹危险未认证了，也给后来的 Mole Mac 版本创造了可能。\n\n一直认为移动端的 Markdown 应用，重点应该是预览，我自己比较难在移动端上写一些长文，最多用于备忘记录，所以移动端的版本我更多做好渲染，以及阅读效果，尽可能做轻量一点，自己用了半年多，慢慢稳定了，可以推给大伙玩玩了。\n\n到了 AI 年代，其实在妙言上的所有内容我都是手写的，想到啥写啥，特别是一些技术文章，包括最近的一些推特长文碎碎念，打字的顺畅感非常重要，不允许任何卡顿，预览也需要很舒服，排版需要更多是便于阅读，而非炫酷。\n\n但以后用 AI 写文档的人会越来越多，所以我给妙言加上了 CLI 的功能，直接 miao open、miao new、miao search、miao list、miao cat 基本上可以覆盖笔记的新建、查找和读取，现在也够用了。\n\n后面我想着 AI 时代的笔记应用应该是怎么样的？我想应该是阅读预览为主，继续轻量、美观、高性能，同时是 AI 友好的，以及是可以很方便的版本回滚的，最好是原生支持 git 的，这样 AI 用起来会很方便。\n\n不过 AI 写出来的东西，其实有个 md 文件就够了，但最终还是给人看的，给人看的应该是成品，那还是需要人去读、去改，这样又回到了 Markdown 编辑器的范畴，只不过用的人会越来越少，我自己还是不想放弃独立琢磨写东西的能力，当然可以借助 AI，但不想把脑子全交给它，不然就没有创作的乐趣了。  \n\n假如小伙伴还有写东西的兴趣，可以去玩玩妙言 https://t.co/49VMEdZdiM", "createdAt": "Wed Nov 04 08:56:12 +0000 2026", "replyCount": 31, "retweetCount": 13, "likeCount": 133, "conversationId": "2117903730494591205", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWRFgStawAAqnuK.jpg", "width": 2048, "height": 1280, "previewUrl": "https://pbs.twimg.com/media/HWRFgStawAAqnuK.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWRFmVjaUAEMaH7.jpg", "width": 2048, "height": 1280, "previewUrl": "https://pbs.twimg.com/media/HWRFmVjaUAEMaH7.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWRFoo1bgAAe2gY.jpg", "width": 2048, "height": 1280, "previewUrl": "https://pbs.twimg.com/media/HWRFoo1bgAAe2gY.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWRFrLuboAAShBb.jpg", "width": 2048, "height": 1280, "previewUrl": "https://pbs.twimg.com/media/HWRFrLuboAAShBb.jpg:small"}], "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-04T08:56:12+00:00", "createdAtBeijing": "2026-11-04T16:56:12+08:00", "createdAtLocal": "11-04 16:56 北京", "url": "https://x.com/HiTw93/status/2117903730494591205", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2117903730494591205", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "妙言移动端与 CLI 实践", "evidence": "直接 miao open、miao new", "rationale": "介绍移动端、命令行及本地版本回滚能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2118080885094556149", "track": "enterprise", "source": {"id": "2118080885094556149", "text": "helping banks adopt agents safely", "createdAt": "Wed Nov 04 20:40:09 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 5, "conversationId": "2118080885094556149", "author": {"username": "yoheinakajima", "name": "Yohei", "profileImageUrl": "https://pbs.twimg.com/profile_images/1452754543217831938/T2O-66Yy_normal.jpg"}, "authorId": "30439303", "quotedTweet": {"id": "2118078179084521496", "text": "Today I’m excited to introduce our @PaymanAI Gateway product. The secure and safe way for your customers to interact with your bank using AI Agents. This has been our most in demand product since we’ve launched, and rightfully so!\n\nBanks are asking the question, how do we prevent this from happening, or how do we make it safe? We have the solution.\n\nThe idea is fairly simple. Your bank gets its own AI Agent and it’s able to then talk to the other AI Agents your customers are using.\n\nAnytime a request for anything comes in, your bank’s agent is the one that is actually executing within your firewall on behalf of an authenticated user. The data stays with you, the relationship stays with you, and more importantly your customer is safe!\n\nWhen a user asks Muse “What’s my balance and how much have I made in interest?” Muse has to go to your bank and ask the bank’s agent on behalf of the user. The Payman Gateway authenticates the user, makes sure the AI Agent is on its approved list for asking, and allows the question to then go through to the bank’s agent on behalf of the authenticated customer.\n\nThe questions that your customers are asking other AI Agents now get back to you. The data doesn’t leave your systems as your banking AI Agent controls what it’s allowed to respond to or not, and your customer relationship only gets strengthened.\n\nWe’ve had a tremendous response from banks already and it has quickly become THE topic of conversation when speaking about Agentic Banking.\n\nOur systems have been built for this future for years now. All around the one question, how do you trust AI with money? Well the time has come and we’re excited to be a helpful partner, as many bank boardrooms are quickly asking “What do we do about Muse & Instinct”.", "createdAt": "Wed Nov 04 20:29:24 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 20, "conversationId": "2118078179084521496", "author": {"username": "0xTyllen", "name": "tyllen", "profileImageUrl": "https://pbs.twimg.com/profile_images/2022382401897549824/lFBThvq4_normal.jpg"}, "authorId": "1409700164068069377", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118078108758577152/img/bZ8WoK_qKRUX1qa3.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118078108758577152/img/bZ8WoK_qKRUX1qa3.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118078108758577152/vid/avc1/1920x1080/ekGntXmJkD1NNVhl.mp4?tag=29", "durationMs": 66000}], "translationZh": "今天很高兴向大家介绍我们的 @PaymanAI Gateway 产品。它让客户能够通过 AI 智能体安全地与银行交互。这是我们自推出以来需求最旺盛的产品，原因不言而喻！\n\n银行都在问：如何防止这类情况发生，或者怎样确保安全？我们有解决方案。\n\n思路很简单：让银行拥有自己的 AI 智能体，再由它与客户使用的其他 AI 智能体沟通。\n\n无论收到什么请求，实际执行操作的都是银行自己的智能体，它在防火墙内代表经过身份验证的用户操作。数据仍由你掌握，客户关系仍由你维系，更重要的是，客户的安全有保障！\n\n当用户问 Muse“我的余额是多少，赚了多少利息？”时，Muse 必须代表用户向银行的智能体询问。Payman Gateway 会验证用户身份，确认发起询问的 AI 智能体在批准名单中，然后才允许它代表这位已通过身份验证的客户，将问题提交给银行的智能体。\n\n客户向其他 AI 智能体提出的问题，如今都会回到银行这里。银行的 AI 智能体掌控着哪些内容可以回答、哪些不能回答，因此数据不会离开你的系统，客户关系也会更加牢固。\n\n银行已经给予我们热烈反馈，这也迅速成为讨论智能体银行业务时的核心话题。\n\n多年来，我们一直在为这样的未来构建系统，始终围绕一个问题：如何放心让 AI 处理资金？如今，这一刻已经到来。越来越多银行的董事会开始急切地问：“我们该如何应对 Muse 和 Instinct？”我们很高兴能成为助力银行的合作伙伴。"}, "expert": {"priority": "P1", "domain": "Agent 创业公司", "name": "Yohei Nakajima", "role": "Untapped Capital / BabyAGI", "why": "自主 Agent 早期原型和讨论源", "handle": "yoheinakajima"}, "createdAtIso": "2026-11-04T20:40:09+00:00", "createdAtBeijing": "2026-11-05T04:40:09+08:00", "createdAtLocal": "11-05 04:40 北京", "url": "https://x.com/yoheinakajima/status/2118080885094556149", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2118080885094556149", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "银行 Agent 网关与鉴权架构", "evidence": "on behalf of an authenticated user", "rationale": "介绍产品及用户鉴权、白名单与行内执行机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "帮助银行安全采用智能体"}, "avatar": "https://pbs.twimg.com/profile_images/1452754543217831938/T2O-66Yy_normal.jpg"}, {"id": "2117872197108937115", "track": "enterprise", "source": {"id": "2117872197108937115", "text": "https://t.co/vnUT0bUiJ7", "createdAt": "Wed Nov 04 06:50:54 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2117850488343564777", "inReplyToStatusId": "2117850488343564777", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2117856016192962761", "text": "\"Over an hour again. Third time.\"\n\nThat's not a review problem. It's a kitchen problem nobody was assigned to fix.\n\nA friend runs Lane 8 Kitchen. About 24 reviews come in every week across Google Maps and Uber Eats. They'd read them, feel bad about the 1-stars, and Monday would start like any other Monday. The same complaints kept coming back.\n\nSo I set up one Loop for their team in @Teamily_AI 2.0.\n\nThe manager drops the week's reviews into a group chat. One agent sorts every review by problem and severity. A second turns the worst problems into fixes, each with a named owner and a way to check it's done. A third builds a page the staff open on their phones. Nothing goes out until the manager signs off.\n\nThe first week took about 9 minutes, from pasting 24 reviews to a page the whole team could open. Six fixes, six owners, and a drafted reply to every bad review.\n\nThe manager wanted delivery packaging as this week's #1. They said it in the chat, and the same page came back with packaging on top.\n\nThe next week, 20 new reviews went through. I didn't touch the setup.\n\nTry Teamily with my invite link: https://t.co/CptH7rQ6BH", "createdAt": "Wed Nov 04 05:46:36 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 10, "conversationId": "2117856016192962761", "author": {"username": "alin_zone", "name": "阿蔺A-Lin", "profileImageUrl": "https://pbs.twimg.com/profile_images/2018018848356925440/tFuD-zag_normal.jpg"}, "authorId": "1680532920413609987", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117855867278340096/img/jgMYo4WR_JTG5FR0.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117855867278340096/img/jgMYo4WR_JTG5FR0.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117855867278340096/vid/avc1/1920x1080/ZEA0KTIkyhtZ0f16.mp4?tag=29", "durationMs": 107562}], "translationZh": "“又等了一个多小时。第三次了。”\n\n这不是评价管理的问题，而是厨房出了问题，却没人被指派去解决。\n\n一位朋友经营着 Lane 8 Kitchen，每周在 Google Maps 和 Uber Eats 上收到约 24 条评价。他们会逐条阅读，看到一星评价时也很难受，但到了周一，一切照旧。同样的投诉反复出现。\n\n于是，我在 @Teamily_AI 2.0 中为他们的团队搭建了一个 Loop。\n\n经理把当周评价发进群聊。第一个智能体按问题类型和严重程度整理所有评价；第二个将最严重的问题转化为整改任务，每项都明确负责人和验收方式；第三个生成一个员工可以用手机打开的页面。所有内容都要经经理批准后才会发出。\n\n第一周，从粘贴 24 条评价到生成全体员工都能打开的页面，大约只用了 9 分钟。六项整改、六位负责人，每条差评也都拟好了回复。\n\n经理希望把外卖包装列为本周的头等事项。在群里说了一句，页面就更新了，包装问题排到了最前面。\n\n第二周，又处理了 20 条新评价。我完全没动过配置。\n\n通过我的邀请链接试用 Teamily：https://t.co/CptH7rQ6BH"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-04T06:50:54+00:00", "createdAtBeijing": "2026-11-04T14:50:54+08:00", "createdAtLocal": "11-04 14:50 北京", "url": "https://x.com/MinLiBuilds/status/2117872197108937115", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2117872197108937115", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "餐饮差评转整改的多Agent工作流", "evidence": "Six fixes, six owners", "rationale": "自述分类、整改分责及经理审核闭环，可复用"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "https://t.co/vnUT0bUiJ7"}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2117824001565479007", "track": "research", "source": {"id": "2117824001565479007", "text": "Distributional flow RL where we enforce Bellman consistency not just on the values, but on every step of the value-generation flow process. Turns out it works better, and produces nice value distributions that better capture distribution of values, leading to better policies.", "createdAt": "Wed Nov 04 03:39:23 +0000 2026", "replyCount": 10, "retweetCount": 24, "likeCount": 334, "conversationId": "2117824001565479007", "author": {"username": "svlevine", "name": "Sergey Levine", "profileImageUrl": "https://pbs.twimg.com/profile_images/990434811662680064/BKCbJypl_normal.jpg"}, "authorId": "990433714948661250", "quotedTweet": {"id": "2117668963786322017", "text": "1/ Flow matching has been very successful for robotics and RL policies. Can we use the same recipe for value functions?\nPrior methods have tried, but they unfortunately produce biased, collapsed predictions. We find that the key to accurate value estimation is to enforce Bellman consistency at every noise level.\n\nIntroducing Value Forcing, an accurate value function estimator even with very small amounts of data.\n\n🧵", "createdAt": "Tue Nov 03 17:23:20 +0000 2026", "replyCount": 4, "retweetCount": 51, "likeCount": 370, "conversationId": "2117668963786322017", "author": {"username": "chongyiz1", "name": "Chongyi Zheng", "profileImageUrl": "https://pbs.twimg.com/profile_images/1769675459434786816/N-qYp02J_normal.jpg"}, "authorId": "1468793850139639809", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117668942206345216/img/mtauUj5_B931Mq7f.jpg", "width": 2048, "height": 721, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117668942206345216/img/mtauUj5_B931Mq7f.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117668942206345216/vid/avc1/3840x1352/QVf7pqScQRtnkucy.mp4?tag=29", "durationMs": 6000}], "translationZh": "1/ 流匹配在机器人和强化学习策略中取得了很大成功。同样的方法能用于价值函数吗？\n此前已有方法尝试过，但遗憾的是，它们的预测存在偏差和坍缩。我们发现，准确估计价值的关键，是在每个噪声水平上都施加贝尔曼一致性约束。\n\n现在介绍 Value Forcing：即使数据量很少，也能准确估计价值函数。\n\n🧵"}, "expert": {"priority": "P1", "domain": "机器人 / AI", "name": "Sergey Levine", "role": "UC Berkeley", "why": "机器人基础模型和强化学习", "handle": "svlevine"}, "createdAtIso": "2026-11-04T03:39:23+00:00", "createdAtBeijing": "2026-11-04T11:39:23+08:00", "createdAtLocal": "11-04 11:39 北京", "url": "https://x.com/svlevine/status/2117824001565479007", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2117824001565479007", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Value Forcing 价值函数估计", "evidence": "enforce Bellman consistency", "rationale": "提出逐噪声层级一致性方法并报告效果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "基于流模型的分布式强化学习：我们不仅对价值施加贝尔曼一致性约束，还将这一约束应用于价值生成流过程的每一步。结果表明，这样效果更好，生成的价值分布也更理想，能更准确地刻画价值的分布，从而得到更好的策略。"}, "avatar": "https://pbs.twimg.com/profile_images/990434811662680064/BKCbJypl_normal.jpg"}, {"id": "2118093720243560711", "track": "tools", "source": {"id": "2118093720243560711", "text": "We're integrating Perplexity's Fast Search into the Perplexity Decisions API. This allows for batch-mode decisions to be made with factual grounding from the web. State-of-the-art and the fastest API out there. Search costs $0.001 per request, and the Decisions API costs $0.02 per 1M input tokens.", "createdAt": "Wed Nov 04 21:31:09 +0000 2026", "replyCount": 34, "retweetCount": 3, "likeCount": 63, "conversationId": "2118093720243560711", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2118086413854150890", "text": "The Decisions API can now search the web before it answers.\n\nA decision model returns a probability, but only knows what it saw in training, and your state. Add \"mode\": \"web_grounding\" and Fast Search runs one query per question, so pplx-decider-v1.2 answers from today's web. https://t.co/oDLLdqB0Yb", "createdAt": "Wed Nov 04 21:02:07 +0000 2026", "replyCount": 6, "retweetCount": 7, "likeCount": 96, "conversationId": "2118086413854150890", "author": {"username": "perplexitydevs", "name": "Perplexity Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/1902407947008819200/oNj7Lt2O_normal.png"}, "authorId": "1902403003887284224", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT0Xj6bwAAZF55.jpg", "width": 2048, "height": 1075, "previewUrl": "https://pbs.twimg.com/media/HWT0Xj6bwAAZF55.jpg:small"}], "translationZh": "Decisions API 现在可以先搜索网络，再作答。\n\n决策模型会返回一个概率，但它掌握的信息仅限于训练时见过的内容，以及你提供的状态信息。添加 \"mode\": \"web_grounding\" 后，Fast Search 就会针对每个问题执行一次搜索，让 pplx-decider-v1.2 根据最新网络信息作答。https://t.co/oDLLdqB0Yb"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6oWXasAEJqb8.jpg", "width": 2048, "height": 1045, "previewUrl": "https://pbs.twimg.com/media/HWT6oWXasAEJqb8.jpg:small"}], "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-04T21:31:09+00:00", "createdAtBeijing": "2026-11-05T05:31:09+08:00", "createdAtLocal": "11-05 05:31 北京", "url": "https://x.com/AravSrinivas/status/2118093720243560711", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2118093720243560711", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Decisions API接入网页检索", "evidence": "\"mode\": \"web_grounding\"", "rationale": "发布检索接入方式与价格，性能主张未获验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们正在将 Perplexity 的 Fast Search 集成到 Perplexity Decisions API 中，让批量决策能够以网络事实为依据。它具备业界顶尖水平，也是目前速度最快的 API。搜索费用为每次请求 0.001 美元，Decisions API 的费用为每百万输入 token 0.02 美元。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2117968432616681650", "track": "agent", "source": {"id": "2117968432616681650", "text": "@ArvinCharl @grok v0.1.2950 已上线：Claude Code、Codex、Pi 之外的 Agent，如果勾选的 MCP 工具超过 10 个，magpie 只给它 find_tools 和 call_tool 两个工具，模型需要时再查某个工具的参数并调用，不再每次请求带上全部定义。资源库 → MCP 里的「按需提供工具」可以关掉。更新后重启 Agent 生效。", "createdAt": "Wed Nov 04 13:13:18 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 6, "conversationId": "2117900356629979241", "inReplyToStatusId": "2117900356629979241", "author": {"username": "yetone", "name": "yetone", "profileImageUrl": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, "authorId": "147786784", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "yetone", "role": "Agent 与开发工具实践与观察", "why": "magpie 故障复盘交代锁、I/O、冷启动和修复，属于可学习的真实工程。", "handle": "yetone"}, "createdAtIso": "2026-11-04T13:13:18+00:00", "createdAtBeijing": "2026-11-04T21:13:18+08:00", "createdAtLocal": "11-04 21:13 北京", "url": "https://x.com/yetone/status/2117968432616681650", "themeId": "editorial", "signalScore": 53, "editorial": {"id": "2117968432616681650", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "magpie 发布 MCP 工具按需加载", "evidence": "模型需要时再查某个工具的参数并调用", "rationale": "给出适用条件、调用机制及设置生效方式"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1458663772017491971/h1-KC--K_normal.jpg"}, {"id": "2117927336414699865", "track": "tools", "source": {"id": "2117927336414699865", "text": "欢迎关注我们的最近正在做 Benchmark Radar，\n\nAgent Evaluation 领域发展很快，每天都会release很多Agent Benchmark 相关工作，所以我们做了Benchmark Radar 工具，每天自动收集和整理 Agent Benchmark 相关工作，累计收录了 42,331+ 条记录。  \n\n除了可以直接在网站上查看每日的 Agent Benchmark 报告，也可以安装 CLI，让 Claude Code、Codex 等 Agent 直接检索与你领域相关 Benchmark。  \n\n如果你也在做 Agent Evaluation、Benchmark 等相关的研究，非常建议大家试用！👇\n\nhttps://t.co/rUBhyMRBPU", "createdAt": "Wed Nov 04 10:30:00 +0000 2026", "replyCount": 4, "retweetCount": 6, "likeCount": 44, "conversationId": "2117927336414699865", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2117862360031371307", "text": "最近在做 Agent Benchmark 的时候，发现一个挺头疼的问题：\n\nAgent Evaluation 领域发展太快了，几乎每天都有新的 Benchmark 和相关工作出来，信息又分散在 arXiv、GitHub、各类论文会议和社区里。光是追踪 Related Work 就要花不少时间，更麻烦的是，辛辛苦苦设计出来的 Benchmark，可能别人已经做过类似的了🤣\n\n后来想了想，与其每天手动搜论文、翻 GitHub，不如干脆做个工具，让 Agent 帮我持续追踪这个领域。\n\n于是就有了 Benchmark Radar。\n\n目前已经接入 37 个信息来源，每天自动收集和整理 Agent Benchmark 相关工作，累计收录了 42,331+ 条记录。\n\n除了可以直接在网站上查看每日报告，也支持安装 CLI，让 Claude Code、Codex 等 Agent 直接搜索和检索相关 Benchmark，方便在做研究的时候随时查询已有工作。\n\n最初只是想解决自己做研究时遇到的问题，没想到开源之后已经收获了 310+ GitHub Stars。\n\n感觉现在做 AI Research，除了研究模型和方法本身，也越来越离不开自己动手搭建一些工具和 Agent Workflow 了。某种程度上，也是在一边做研究，一边做产品🤣\n\n如果你也在做 Agent Evaluation、Benchmark 或相关研究，欢迎试用、提 Issue 或 PR，也很希望听听大家在追踪 Related Work 时遇到的问题！\n\nGitHub：https://t.co/ldlRicCLVT", "createdAt": "Wed Nov 04 06:11:49 +0000 2026", "replyCount": 2, "retweetCount": 6, "likeCount": 30, "conversationId": "2117862360031371307", "author": {"username": "ktwu01", "name": "Koutian (KT) Wu @ NeurIPS 2026", "profileImageUrl": "https://pbs.twimg.com/profile_images/2117824951516274688/y83SMgwW_normal.jpg"}, "authorId": "1689015305664856064"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-04T10:30:00+00:00", "createdAtBeijing": "2026-11-04T18:30:00+08:00", "createdAtLocal": "11-04 18:30 北京", "url": "https://x.com/Xudong07452910/status/2117927336414699865", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2117927336414699865", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Benchmark Radar研究追踪工具", "evidence": "目前已经接入 37 个信息来源", "rationale": "自述开源工具，提供每日报告与CLI检索"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2117931784872808513", "track": "creative", "source": {"id": "2117931784872808513", "text": "OpenDesign 现在也支持自定义插件了🔥🚀\n看到 @DeepSeekHarness 也在探索让用户自定义插件自己造工具，真的很开心，我们又多了一位同行者🤝\n\n今年 5 月我们做 OpenDesign「Everything is a plugin」版本的时候，就希望大家能按自己的需求定义设计工具。模板、Skills、设计系统，都可以做成插件交给 Agent 用。\n\n现在可以直接说需求让 Agent 帮你做，也能从 GitHub 导入或本地上传，现成的插件也有很多可以免费用。\n\n另外DeepSeek Harness 还能通过 MCP 接进来，欢迎大家带着自己的 Agent 来一起玩出更多可能性\nhttps://t.co/hGXKx5lZ3D", "createdAt": "Wed Nov 04 10:47:41 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 13, "conversationId": "2117931784872808513", "author": {"username": "tuturetom", "name": "Tom Huang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1033199673035522048/WI-JLSAc_normal.jpg"}, "authorId": "806464682823282688", "quotedTweet": {"id": "2117256196227019194", "text": "Your Harness. You Define It.\n\nMeet Creator Mode in DeepSeek Harness. \n\nTurn ideas into plugins that you can use, from a design workspace to a sandbox game or a 3D LLM visualizer. \n\nWhat will you create? https://t.co/MlXHIyyA1o", "createdAt": "Mon Nov 02 14:03:08 +0000 2026", "replyCount": 719, "retweetCount": 2088, "likeCount": 25009, "conversationId": "2117256196227019194", "author": {"username": "DeepSeekHarness", "name": "DeepSeek Harness", "profileImageUrl": "https://pbs.twimg.com/profile_images/2105141374123495424/_om7PZyR_normal.jpg"}, "authorId": "2067518374469640193", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117255528309227520/img/bcnmVclr5ToXKbxg.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117255528309227520/img/bcnmVclr5ToXKbxg.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117255528309227520/vid/avc1/1920x1080/6IWmgE editor compatible with Feishu (Lark) docs. Beta for macOS and Windows.\n\n- Native speed: Rust + GPUI, no WebView. Typing in a 1,000,000-character doc takes ~5ms per frame.\n- Local files: no account, and it stays offline by default. Notes are plain XML files that agents like Claude Code can read and edit.\n- Feishu-compatible: most blocks and interactions, minus the cloud features.\n\nhttps://t.co/4nh13cMaY5\nhttps://t.co/jGN4VUvQ7L", "createdAt": "Wed Nov 04 11:53:04 +0000 2026", "replyCount": 27, "retweetCount": 17, "likeCount": 486, "conversationId": "2117948239349534937", "author": {"username": "s1dashu", "name": "sida", "profileImageUrl": "https://pbs.twimg.com/profile_images/2115110079280349184/R7MAv-hC_normal.jpg"}, "authorId": "1704894035767484416", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWR2SDrW4AEZHCn.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWR2SDrW4AEZHCn.jpg:small"}], "translationZh": "quiet.md 现已开源！\n\n一款快速、本地优先的富文本编辑器，兼容飞书（Lark）文档。macOS 和 Windows 测试版现已推出。\n\n- 原生速度：基于 Rust + GPUI，不使用 WebView。在包含 100 万字符的文档中输入时，每帧耗时约 5 毫秒。\n- 本地文件：无需账号，默认离线运行。笔记以纯 XML 文件保存，Claude Code 等智能体可直接读取和编辑。\n- 兼容飞书：支持大多数内容块和交互，不含云端功能。\n\nhttps://t.co/4nh13cMaY5\nhttps://t.co/jGN4VUvQ7L"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-04T17:38:31+00:00", "createdAtBeijing": "2026-11-05T01:38:31+08:00", "createdAtLocal": "11-05 01:38 北京", "url": "https://x.com/dotey/status/2118035176081015047", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2118035176081015047", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "quiet.md本地文档编辑器开源", "evidence": "quiet.md is now open source!", "rationale": "明确开源发布，提供架构、兼容性和存储细节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117996574584574130", "track": "research", "source": {"id": "2117996574584574130", "text": "Excited to support RoboColosseum, one of the largest in-the-wild real-world robotics benchmark project!  Great to see Unitree G1s being used as the primary embodiment used in the humanoid benchmark category on RoboColosseum.", "createdAt": "Wed Nov 04 15:05:08 +0000 2026", "replyCount": 22, "retweetCount": 21, "likeCount": 150, "conversationId": "2117996574584574130", "author": {"username": "UnitreeRobotics", "name": "Unitree", "profileImageUrl": "https://pbs.twimg.com/profile_images/1844926705389142016/nIEbH8rV_normal.jpg"}, "authorId": "907134826137788416", "quotedTweet": {"id": "2117982605274710483", "text": "Introducing RoboColosseum\n\nAn open robot eval initiative by @huggingface @BitRobotNetwork @eaic_sg @DJiafei\n\nAccess:\n- 100+ robots (@UnitreeRobotics G1s, @LeRobotHF SO-101s, YAMs, Franka and more)\n- 140+ in-the-wild scenes\n- Open rollout data\n- 10,000 FREE eval hrs\n\nThread ↓ https://t.co/fHPHRe6bX6", "createdAt": "Wed Nov 04 14:09:37 +0000 2026", "replyCount": 32, "retweetCount": 55, "likeCount": 313, "conversationId": "2117982605274710483", "author": {"username": "RoboColosseum", "name": "RoboColosseum", "profileImageUrl": "https://pbs.twimg.com/profile_images/2116166946194423808/PWjN8w52_normal.jpg"}, "authorId": "2108009743390527488", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117982429378183168/img/DjApkl_pHAxFMp_B.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117982429378183168/img/DjApkl_pHAxFMp_B.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117982429378183168/vid/avc1/1920x1080/FFSjp1e_0lli7U7l.mp4?tag=16", "durationMs": 87422}], "translationZh": "介绍 RoboColosseum\n\n由 @huggingface @BitRobotNetwork @eaic_sg @DJiafei 发起的开放机器人评测计划\n\n提供：\n- 100 多台机器人（@UnitreeRobotics G1、@LeRobotHF SO-101、YAM、Franka 等）\n- 140 多个真实开放场景\n- 开放的任务执行轨迹数据\n- 10,000 小时免费评测时长\n\n系列帖 ↓ https://t.co/fHPHRe6bX6"}, "expert": {"priority": "P0", "domain": "机器人领域突破", "name": "Unitree", "role": "人形与四足机器人项目", "why": "五方向 X 主动热点搜索：机器人领域突破", "handle": "UnitreeRobotics"}, "createdAtIso": "2026-11-04T15:05:08+00:00", "createdAtBeijing": "2026-11-04T23:05:08+08:00", "createdAtLocal": "11-04 23:05 北京", "url": "https://x.com/UnitreeRobotics/status/2117996574584574130", "themeId": "editorial", "signalScore": 82, "hotspotMatches": [{"id": "robotics", "label": "机器人领域突破", "matchedTerms": ["robot", "robotics", "humanoid"]}], "hotspotDirections": ["robotics"], "hotspotDirection": "robotics", "hotspotDirectionLabel": "机器人领域突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2117996574584574130", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "RoboColosseum 开放机器人评测计划", "evidence": "140+ in-the-wild scenes", "rationale": "引文公布机器人评测规模、开放数据与免费时数"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "很高兴支持 RoboColosseum——规模最大的真实开放环境机器人基准评测项目之一！很高兴看到 Unitree G1 成为 RoboColosseum 人形机器人基准评测类别的主要机器人平台。"}, "avatar": "https://pbs.twimg.com/profile_images/1844926705389142016/nIEbH8rV_normal.jpg"}, {"id": "2117823012468646029", "track": "enterprise", "source": {"id": "2117823012468646029", "text": "读到 1991 年 March 的这篇论文《Exploration and Exploitation in Organizational Learning》，讨论组织中的 EE 问题：\n\n任何组织都面对一个问题：应该如何分配资源？\n\n- Exploitation: 把资源花在改进已有做法上\n- Exploration：把资源花在尝试新东西上\n\n论文中的互相学习模型非常有意思：\n\n每人对现实有自己的信念，还有一个「组织代码」（code），可以理解为组织的共识知识库或者集体常识。\n\n个体会向code学习，新人进来之后慢慢被组织同化，这叫社会化。同时，code也向那些知识得比自己多的个体学习，这叫多样化。社会化太快的组织，code还来不及从个体身上学到东西，个体就被同化了，快速社会化杀死了多样性。\n\n在读这篇论文的过程中，不断联想到现在AI与人的关系。\n\n人就像论文中的个体，AI就像是论文中的组织code。\n\n面对一个个「问题」，我们快速滑向了「AI」先思考，我们再「点头」称赞的「快速社会化」境地。\n\n以前身边的一些朋友，认知结构和表达风格十分鲜明，最近在针对一些问题在线讨论时，明显感觉到对方返回的消息是「AI」，对方那个鲜明的「个体」不见了，他被AI同化了。\n\n反观自身，我也陷入了同样的境地。\n\n这种情况，非常不对劲。论文对EE问题的解法是制造「慢」：慢速社会化让个体在被同化之前有时间贡献多样性；人员流动引入新的差异来源；容忍暂时的无知和低效，为长期的改进保留素材。\n\n两个结构的类比，虽有不同（我们不是为了提升AI「Code」而努力），但这种被「同化」的境地，值得警醒。", "createdAt": "Wed Nov 04 03:35:28 +0000 2026", "replyCount": 17, "retweetCount": 5, "likeCount": 64, "conversationId": "2117823012468646029", "author": {"username": "lijigang", "name": "李继刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/599778700943446016/N-a6Jbep_normal.jpg"}, "authorId": "1474067654", "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李继刚", "role": "内容、视觉与多模态实践与观察", "why": "对 AI 语言、阅读与提示设计作结构化解释，补内容方法。", "handle": "lijigang"}, "createdAtIso": "2026-11-04T03:35:28+00:00", "createdAtBeijing": "2026-11-04T11:35:28+08:00", "createdAtLocal": "11-04 11:35 北京", "url": "https://x.com/lijigang/status/2117823012468646029", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2117823012468646029", "technicalRelevant": true, "dailyGrade": "C", "channel": "enterprise", "topic": "借组织学习模型反思AI同化", "evidence": "慢速社会化让个体在被同化之前有时间贡献多样性", "rationale": "提供组织学习机制与反思方法，AI类比未验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/599778700943446016/N-a6Jbep_normal.jpg"}, {"id": "2118048337018712423", "track": "research", "source": {"id": "2118048337018712423", "text": "There are a few notable counter-examples (e.g. HAL) but this is basically right for a lot of pre-2000 sci-fi.\n\nI think getting AI right from e.g. somewhere in the ~1970s would require a fairly complicated set of inferences, probably the biggest things would be:\n\nImage the world in 50 years.\n1. \"Digital knowledge work / computing\". The vast majority of knowledge work (which makes up a very large fraction of the economy) goes digital. As computers get cheaper, much of society’s work happens on screens, over billions of machines in homes and offices.\n2. \"Internet\". Similar to ARPANET (and see Licklider’s “Intergalactic Computer Network” (1963)), this creates demand for a global network of computers where people work, argue, teach, joke, and socialize.\n3. \"Big data\". This creates a very large, compounding repository of digital information, with traces of how people reason, how they create, what they know etc.\n4. \"Statistical learning\". Trying to program intelligence by hand is extremely difficult. But Shannon's n-gram approximations of English (1948) show examples of how language has statistical structure that can be \"learned\". You could imagine doing so over extensions of cybernetic computing (e.g. in the style of Rosenblatt's Perceptron 1958). So instead of programming thought, we could fit a statistical model to the record.\n5. \"LLMs\". This might lead to something along the lines of ELIZA (1966), but with enough data (per 1-3), and enough compute (see Moore's law 1965), the imitation might become of extreme hight fidelity to the point that it's economically extremely useful.\n6. \"Scaling laws\". These networks may demand a huge amount of data / computing resources and expertise to train. It's plausible that the more of each you have, the better your ELIZA gets. The economics concentrate, where a few organizations build a few minds and then deploy copies of them digitally.\n\nSomething like that. Basically, it's a lot of leaps. You have to start with computers, to internet, to big data, to big compute (Moore's law), which then allow large-scale statistical learning approach based on neural networks, and then posit scaling laws, and then imagine the form factor of language models as a lot more sophisticated ELIZA. And you'd have to short everything else, most predominantly I think the idea that we'd figure out how to program robots by hand.", "createdAt": "Wed Nov 04 18:30:49 +0000 2026", "replyCount": 65, "retweetCount": 89, "likeCount": 1191, "conversationId": "2117925080831283333", "inReplyToStatusId": "2117925080831283333", "author": {"username": "karpathy", "name": "Andrej Karpathy", "profileImageUrl": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, "authorId": "33836629", "expert": {"priority": "P0", "domain": "AI 编程 / 通用 AI", "name": "Andrej Karpathy", "role": "Eureka Labs；前 OpenAI/Tesla", "why": "高信号 AI 教育者和产品思想者，长期影响 Software 2.0、AI Coding、Vibe Coding 等叙事", "handle": "karpathy"}, "createdAtIso": "2026-11-04T18:30:49+00:00", "createdAtBeijing": "2026-11-05T02:30:49+08:00", "createdAtLocal": "11-05 02:30 北京", "url": "https://x.com/karpathy/status/2118048337018712423", "themeId": "editorial", "signalScore": 87, "editorial": {"id": "2118048337018712423", "technicalRelevant": true, "dailyGrade": "C", "channel": "research", "topic": "从历史技术线索解释语言模型发展路径", "evidence": "fit a statistical model", "rationale": "串联数字化、数据与统计学习，属概念分析而非新研究"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "有几个显著的反例（比如 HAL），但对许多 2000 年以前的科幻作品来说，这个判断基本正确。\n\n我认为，如果要在 20 世纪 70 年代左右准确预见 AI 的发展，就需要进行一系列相当复杂的推断，其中最关键的可能是：\n\n想象一下 50 年后的世界。\n1. “数字化知识工作／计算”。绝大多数知识工作（占经济活动的很大一部分）都将数字化。随着计算机越来越便宜，社会上的大量工作将在家庭和办公室的数十亿台计算机屏幕上完成。\n2. “互联网”。类似于 ARPANET（也可参考 Licklider 于 1963 年提出的“星际计算机网络”），这将催生对全球计算机网络的需求，人们在其中工作、争论、教学、开玩笑和社交。\n3. “大数据”。这将形成一个规模庞大、持续累积的数字信息库，记录人们如何推理、如何创造，以及掌握哪些知识等。\n4. “统计学习”。靠手工编程实现智能极其困难。但 Shannon 在 1948 年对英语进行的 n-gram 近似建模，展示了语言具有可被“学习”的统计结构。可以设想，在控制论计算方法的扩展基础上（例如 Rosenblatt 于 1958 年提出的 Perceptron）实现这种学习。因此，我们可以用这些记录拟合统计模型，而不是直接为思维编程。\n5. “LLM”。这可能催生类似 ELIZA（1966 年）的系统，但有了足够的数据（见第 1—3 点）和算力（参见 1965 年提出的摩尔定律），这种模仿可能达到极高的逼真度，从而产生巨大的经济实用价值。\n6. “缩放定律”。训练这些网络可能需要海量数据、计算资源和专业知识。可以合理推测，这些要素越充足，你的 ELIZA 就越出色。由此形成的经济格局将趋于集中：少数机构构建少数几个智能体，再以数字形式部署它们的副本。\n\n大致如此。总之，这需要跨越许多推理环节。你得从计算机想到互联网、大数据、大规模算力（摩尔定律），再想到这些条件如何支持基于神经网络的大规模统计学习，接着提出缩放定律，最后设想语言模型会以远比 ELIZA 复杂的形态出现。同时，你还得看空其他所有路线，尤其是我认为最主要的那种想法：我们终将找到手工编程让机器人具备智能的方法。"}, "avatar": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}], "preview": false, "productionMonitored": 122};
const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
