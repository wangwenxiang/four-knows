, "previewText": "Back in the day, critical thinking was taught as approaching new info with humble curiosity and a healthy dose of skepticism - take in different views, form your own opinion. Still true, but", "titleZh": "当智能体代劳时，如何保持批判性思维", "previewTextZh": "过去，我们学到的批判性思维，是以谦逊、好奇和适度怀疑的态度看待新信息——听取不同观点，形成自己的判断。这依然适用，但"}, "translationZh": "当智能体代劳时，如何保持批判性思维"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWL6JYcaoAAysqb.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWL6JYcaoAAysqb.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-03T08:10:27+00:00", "createdAtBeijing": "2026-11-03T16:10:27+08:00", "createdAtLocal": "11-03 16:10 北京", "url": "https://x.com/shao__meng/status/2117529828765356500", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2117529828765356500", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent协作中的判断与核验方法", "evidence": "先看它跑了什么命令、输出是什么，再看摘要", "rationale": "提供假设建立、证据核验和审查决策的具体方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117550297375752206", "track": "growth", "source": {"id": "2117550297375752206", "text": "完整的14个能够解决了之后让你年入百万🔥的产品方案，因为众所周知，你们这帮做自媒体的实在是赚钱🤣🤣，所以说你像我们这些不赚钱的人，就可以去赚那些做自媒体的人的钱\n\n1. 新人接商单不知道怎么报价，报高怕丢单，报低又吃亏\n2. 粗剪最耗时间，精力常在创作开始前就被耗光\n3. 商单、排期和回款分散各处，漏掉一步就可能少赚钱\n4. 很多人流量上不去，又找不到人帮忙诊断账号\n5. 粉丝涨了也不等于有广告，主动找到品牌同样困难\n6. 拆对标和扒文案太费时间，这些重复工作适合交给工具\n7. 选题枯竭时最容易断更，靠灵感很难长期稳定产出。\n8. 新人听不懂 PR 行话，容易在沟通中显得不专业\n9. 后台数据看得到结果，却很难告诉你下一条该做什么\n10. 找 B-roll、配图和音乐很耗时，常常拖慢整条视频的进度\n11. 交片后被拖款很伤现金流，先收款还是先交付难以平衡\n12. 多平台发布和工具堆叠，容易让管理工具比创作更费时间\n13. 口水音和杂音清理繁琐，音频问题常让后期多花时间\n14. AI 写得越快越容易没人味，保留个人风格才难", "createdAt": "Tue Nov 03 09:31:47 +0000 2026", "replyCount": 0, "retweetCount": 1, "likeCount": 7, "conversationId": "2117550297375752206", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "quotedTweet": {"id": "2117531727140909344", "text": "其实我真的觉得AI时代就是有很大的机会的🚀\n\n当你能够用上很好的模型的时候，你能用上OPuS 5.5，你能够用上GPT 6 Astra，就是会有很多的可能性，现在去调研的门槛完全就是0了，做产品也都很轻松，都可以把温总做产品的整个思路给你掰开了看\n\n就是可以用monid这类能够抓全网数据的MCP工具去全网看做自媒体的人到底在烦什么\n\n让它去 Reddit、X、小红书、抖音的帖子和评论区里抓\n25 次调用，累计花费0.135🔪\n\n很简单的就是给AI一个评价标准，让他来自己筛选。这一块，如果你用Jev的话也可以更高效的实现\n\n1、痛感：有多少人在真实讨论\n2、付费：跟收入挂不挂钩，有没有人已经在花钱\n3、AI 能不能解决：AI 做不到的，再痛也不算机会\n4、竞争空位：免费和开源方案越多，分越低\n5、证据：是不是多个平台都有，是不是真用户说的，不是卖工具的人说的\n\n我不说，你们都不敢相信，99%的AI变现，自媒体问题，都是很深的痛点，小红书一篇新人报价指南就有 2567 赞、3117 收藏\n\n同类型的选题就是多了很多，总共我这次就找到了14个需求，后面可能会一一实现，或者打包在一个产品里面\n\n14 个的完整需求放评论区啦！", "createdAt": "Tue Nov 03 08:18:00 +0000 2026", "replyCount": 10, "retweetCount": 1, "likeCount": 20, "conversationId": "2117531727140909344", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWKqAnEaQAAHCZr.png", "width": 1832, "height": 1464, "previewUrl": "https://pbs.twimg.com/media/HWKqAnEaQAAHCZr.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWKqElGbUAAcnRg.jpg", "width": 1926, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HWKqElGbUAAcnRg.jpg:small"}]}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "叫我阿杭", "role": "内容、视觉与多模态实践与观察", "why": "公开 Obsidian、录音与自媒体制作流程，直接贴合内容生产需求。", "handle": "Astronaut_1216"}, "createdAtIso": "2026-11-03T09:31:47+00:00", "createdAtBeijing": "2026-11-03T17:31:47+08:00", "createdAtLocal": "11-03 17:31 北京", "url": "https://x.com/Astronaut_1216/status/2117550297375752206", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2117550297375752206", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "自媒体产品需求调研与筛选", "evidence": "痛感：有多少人在真实讨论", "rationale": "提供跨平台需求采集与五维筛选方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, {"id": "2117562681448186009", "track": "tools", "source": {"id": "2117562681448186009", "text": "想在家里或者几个人的小团队里搭一个 AI 助手，麻烦很快就冒出来，大家共用一个账号，你让它记住的事和孩子问的作业题全搅在一起。\n\n想在微信群、飞书群里直接喊它，还得自己写机器人去对接，聊天记录和一堆 API key，也都放在别人的服务器上。\n\nOctop 想把这些一起解决。它是腾讯云开源的自托管 AI 助手，Python 写的，MIT 协议。\n\n装在你自己的电脑、NAS 或者云服务器上，一个进程同时跑起网页控制台、命令行、IM 机器人和定时任务，数据都放在本机的 ~/.octop/ 目录里。", "createdAt": "Tue Nov 03 10:21:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 1, "conversationId": "2117562681448186009", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2111812041929359452", "text": "如果你想把 AI 助手长期用起来，可能很快就会遇到一个问题：写作、查资料、改代码都能做，但工具太分散，换个窗口又得重新交代背景。\n\n腾讯云开源的 Octop 就在尝试把这些能力放到一起，搭一个可以部署在自己电脑或服务器上的 AI 工作环境。\n\n把 AI 助手真正部署到自己的电脑、服务器或者 NAS 上，然后让它长期跑起来。\n\n你可以给不同任务配置不同的 Agent，比如一个负责写作，一个负责研究，一个负责代码，再给它们接上记忆、知识库、浏览器、终端和各种工具。\n\n它不只是让你在网页里聊天。飞书、QQ、企业微信、Telegram 等入口都可以接进来，你在聊天软件里直接丢一句任务，背后的 Agent 就可以开始干活。\n\n除了浏览器、终端和远程桌面，还能通过 MCP 接外部服务，通过 ACP 把编码任务交给 Claude Code、Codex、OpenCode 等工具。\n\n这样就不用每次打开专门的 AI 页面，从平时用的聊天工具里也能发任务。", "createdAt": "Sun Oct 18 13:30:01 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 3, "conversationId": "2111812041929359452", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUtyrgbasAANPs_.jpg", "width": 1071, "height": 496, "previewUrl": "https://pbs.twimg.com/media/HUtyrgbasAANPs_.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUtyrgcawAAnG3h.jpg", "width": 1199, "height": 675, "previewUrl": "https://pbs.twimg.com/media/HUtyrgcawAAnG3h.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWF1APHbkAAIKIB.jpg", "width": 1080, "height": 459, "previewUrl": "https://pbs.twimg.com/media/HWF1APHbkAAIKIB.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-03T10:21:00+00:00", "createdAtBeijing": "2026-11-03T18:21:00+08:00", "createdAtLocal": "11-03 18:21 北京", "url": "https://x.com/sitinme/status/2117562681448186009", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2117562681448186009", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Octop 自托管 AI 助手", "evidence": "一个进程同时跑起网页控制台、命令行、IM 机器人和定时任务", "rationale": "介绍开源助手部署方式、数据存储与多入口能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117562686686797864", "track": "agent", "source": {"id": "2117562686686797864", "text": "写代码的活，转给 Claude Code\n\nOctop 支持 ACP（Agent Client Protocol），两个方向都通。\n\n往外派。 在控制台的 ACP 页面配好 runner，OpenCode、CodeBuddy、Claude Code、Codex、Kimi Code、Cursor CLI 都是内置的，再给某个专家打开 acp_runner 工具。聊天里说一句，它就把编码任务交给外部的编程 Agent。对方要改文件、跑命令时的权限确认，会弹回聊天里让你选。\n\n往里接。 反过来，Zed 这类支持 ACP 的编辑器，也能把你的 Octop 专家当编程 Agent 用。这个命令会单独起一个进程，不用先跑 octop run：\n\noctop acp --agent main\n\n然后在 Zed 的配置文件里加一段：\n\n// ~/.config/zed/settings.json\n{\n  \"agent_servers\": {\n    \"Octop\": {\n      \"command\": \"octop\",\n      \"args\": [\"acp\", \"--agent\", \"main\"],\n      \"env\": {}\n    }\n  }\n}\n\n能动 Shell、能调外部 Agent，安全就得跟上。Octop 有一套 Shell 命令的允许和拒绝规则，放在 ~/.octop/security/tool_guard/ 下面，自己能改；有风险的工具要你点头才执行；敏感信息离开工作区之前会先脱敏。", "createdAt": "Tue Nov 03 10:21:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2117562681448186009", "inReplyToStatusId": "2117562685059395619", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWF1APKakAAYce1.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HWF1APKakAAYce1.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-03T10:21:01+00:00", "createdAtBeijing": "2026-11-03T18:21:01+08:00", "createdAtLocal": "11-03 18:21 北京", "url": "https://x.com/sitinme/status/2117562686686797864", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2117562686686797864", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Octop 双向 ACP 集成与权限控制", "evidence": "octop acp --agent main", "rationale": "给出外部编码代理委派、编辑器接入及安全配置"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117619911208091877", "track": "agent", "source": {"id": "2117619911208091877", "text": "普通 AI 对话是单打独斗，但 @Teamily_AI 做的 Team Agents 彻底改变了逻辑：人和多个 Agent 在同一个群里协作，共享同一份上下文。\n\n看到 CEO Aiden 晒出的数据：一个季度注册用户从 10K → 320K（32×），现在每天有 300+ 个新 Loop 被搭建，我立刻上手实测了 Teamily AI。\n\n我在群里搭了一条早报流水线：\nResearch → Fact-check → Writer → 我\n最惊喜的是两个细节：\n① Agent 能感知团队上下文\n\n创建第三个 Writer 时，我完全没提另外两个 Agent，但它配置完后主动提示：“流水线已经齐了。”\n\n② Agent 会自主判断研究质量\n在群里让 Research 开工，它第一轮搜索后自己判断“结果较杂”，于是主动去 OpenAI、Anthropic 官网和 arXiv 核对发布时间，跑了 4 分多钟。最终交出 5 条早报，每条都带官方原文链接，并标明了“官方页面标注 November 2, 2026”这样的发布时间。\n\n目前流水线架子搭好了，但 Research 交完后 Fact-check 和 Writer 还没自动接上，接力环节还在调。\n\n既然 team agents 的核心是 Agent 服务整个群、而不只是一个人，我干脆把「AI 早报编辑部」这个群开放出来：\n\n大家可以带上自己的 Agent 进群，一起 co-create 这条早报 Loop（比如加一个垂直领域的 Research Agent 或翻译 Agent），群里的人可以互相 @ 对方的 Agent 干活，各用各的额度。\n\n欢迎来大家一起把这条流水线调通。群链接放在评论区。", "createdAt": "Tue Nov 03 14:08:24 +0000 2026", "replyCount": 20, "retweetCount": 13, "likeCount": 73, "conversationId": "2117619911208091877", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117619622186979329/img/DGONu1Q_XqFWgOla.jpg", "width": 2048, "height": 1097, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117619622186979329/img/DGONu1Q_XqFWgOla.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117619622186979329/vid/avc1/3840x2056/87FoLt282H2ToHaZ.mp4?tag=29", "durationMs": 46783}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "雪踏乌云", "role": "内容、视觉与多模态实践与观察", "why": "具体拆出海运营、流量监控和自媒体 Bot 职责，跨场景实操价值高。", "handle": "Pluvio9yte"}, "createdAtIso": "2026-11-03T14:08:24+00:00", "createdAtBeijing": "2026-11-03T22:08:24+08:00", "createdAtLocal": "11-03 22:08 北京", "url": "https://x.com/Pluvio9yte/status/2117619911208091877", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2117619911208091877", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Teamily 多 Agent 早报流水线实测", "evidence": "Research 交完后 Fact-check 和 Writer 还没自动接上", "rationale": "描述角色分工、检索核验和未解决的自动接力问题"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, {"id": "2117576076960621032", "track": "creative", "source": {"id": "2117576076960621032", "text": "3、改片也只是一句话\n\n第一版公仔盖章时手里是个红方块，挡住了眼睛；击掌像敬礼，手没碰上。我只回了「修 45 秒印章红方块、76 秒击掌没碰上」，它就算出两只手掌 const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
