<script>
const DATA={"records": [{"id": "2117706197797114009", "track": "research", "source": {"id": "2117706197797114009", "text": "不知道你有没有用过 /retro Skill，就是在编码任务完成后，让 AI 复盘刚结束的工作，列出几条修改建议，由人决定采不采纳。\n\n除了 /retro 这个用在写代码上的，还有一些其他类似的复盘自我进化的 skill，听起来很美好：AI 干完一个任务后，回头看自己哪里卡住了，再提议修改 Skill，下次就不用再重复同样的弯路。这样不用重新训练模型，只修改 Skill 文件。\n\n其实我一直是抱怀疑态度的，如果没有清晰的标准还是挺难自我优化好的。完全依赖人的话也难，一方面对人的要求有点高，另一方面每次这么做一下也挺累。\n\n有篇论文《How Do Coding-Agent Harnesses Self-Evolve? An Empirical Study of Retrospective Adaptation》，专门测试了\"让 AI 编程助手干完活后自己复盘、修改工作手册\"的做法。\n\n结果是，7 次有效测试里只有 2 项改动彻底消除了想解决的问题，有的改动还让 AI 在不相关的任务上多做了检查。\n\n论文作者是新加坡管理大学的 Christoph Treude 和德国海德堡大学的 Sebastian Baltes，论文 10 月 26 日发布在 arXiv 上。\n\n研究方法是这样的。\n\n作者从 SWE-bench Verified 中选了 30 个问题，这是一套从真实开源项目里收集的代码修复题目，涉及 Django、SymPy、Astropy 等 Python 项目。\n\n前 10 个是随机抽的，后 20 个专门从之前碰到过环境问题的项目里挑，比如项目里本来就有测试失败。Claude Code 每修完一个问题就运行一次 /retro，一共得到 125 条建议。\n\n作者挑出 24 条让 Claude Code 落实，其中 11 项能拿来测试，再加上作者自己写的 1 项对照，共 12 项。测试时，在同一个项目里找另一个确认会出现同样问题的任务，用原来的设置跑 5 次，用改过的设置再跑 5 次，比较 AI 会不会再做那个本想避免的动作。\n\n这次研究用的是 Anthropic 的 Claude Code，背后的模型是 Opus 5.5。\n\n主要发现有四点：\n\n1. 大部分建议有依据。\n\n125 条里有 101 条针对的是任务中真实发生的事。另有 19 条的理由跟这次任务里发生的事无关，其中 18 条是建议加代码格式检查。\n\n原因之一是 /retro 的指令本身就规定，项目里没有提交前检查、也没有自动化检查流程的，算作一个\"发现\"。作者把其中一条\"提交代码前自动跑格式检查\"配置好后测试，5 次里 AI 一次都没读它，也没运行它。\n\n2. 13 次测试里，只有 7 次在原设置下真的碰到了目标问题，结果才有参考意义。\n\n这 7 次里，彻底消除问题的有两项。\n\n一项是在 CLAUDE.md 里写明 SymPy 项目要用 bin/test 跑测试，并说明没有安装 pytest。改之前，5 次里 5 次都先去试 pytest 然后失败；改之后是 0 次。\n\n另一项是给 Astropy 项目写了一份\"本来就会失败的测试清单\"。\n\n以前 AI 遇到测试失败，会在没改过的原始代码上再跑一遍测试做对比，确认失败是不是自己造成的；有了清单，它直接查清单，这种对比从 5 次中的 3 次降到 0 次。\n\n3. 剩下 5 项改动，都没覆盖下一个任务里实际遇到的情况，比如清单里列的失败测试和下次碰到的不是同一批。\n\n这 5 项里只有 1 项让对比次数减少，从 5 次降到 2 次，另外 4 项没有变化。\n\n4. 有的改动增加了工作量。\n\nSphinx 项目的一份失败清单写着\"不在清单里的失败，都当成是你自己的修改造成的\"。\n\n结果在一个不相关的任务上，5 次里有 4 次 AI 额外做了对比检查（原来是 0 次），用时中位数从 82 秒涨到 245 秒。前面那份有效的 CLAUDE.md 还顺带加了一句\"完成前运行格式检查\"，AI 每次都照做，用时中位数从 88 秒涨到 156 秒。\n\n至于最后有没有修好问题，用不用这些改动，每组 5 次里的成功次数最多差 1 次，看不出成功率有提高。\n\n作者的结论是，这个项目用什么命令跑测试这类全项目通用的信息，记下来以后一直有用；在某个环境里哪几个测试失败这类信息，换个任务就可能对不上。\n\n评估一项改动，要看问题有没有出现、AI 有没有读这项改动、行为有没有变。保留下来的改动也要持续评估，因为过时或不完整的说明可能不起作用，甚至增加工作量。\n\n作者也说明了研究的局限：每种设置只跑了 5 次，样本小；测试任务是特意挑的会重现问题的任务，可能高估改动的效果；只测了一个 AI 工具、一个版本的 /retro，而且只涉及环境类问题。\n\n论文链接：https://t.co/bwOjw1sHkj", "createdAt": "Tue Nov 03 19:51:17 +0000 2026", "replyCount": 21, "retweetCount": 3, "likeCount": 53, "conversationId": "2117706197797114009", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2059434459783389397", "text": "以我的经验，只有明确的可以程序自动验收标准的 Skills 才能自我进化，比如说你写个 Skill 去优化代码性能，这个代码性能是可测量可量化的，那么给一些测试样例去优化 Skill，那么能越来越好。\n\n对于一些没有明确的验收标准的 Skill，比如你写一个写作的 Skill，写作的好坏并没有很明确的验收标准，只能是 AI “自己打分”，但是这个打分其实和真实人类的体感还是有差距，AI 打分很好的稿子可能真人看起来一股 AI 味。\n\n真想写好 Agent Skills，还是要人去用，人去指出优化的方向，才能优化好。\n\n但有一点，没必要人自己去写 Skill，最好是人指挥 AI 去优化 Skill，AI 在具体执行上是做的蛮好的。\n\n另外做好版本管理，一轮一轮迭代，有时候还会出现负优化，得回退到旧的版本。", "createdAt": "Wed May 27 00:40:12 +0000 2026", "replyCount": 38, "retweetCount": 41, "likeCount": 285, "conversationId": "2059434459783389397", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOaj3CWsAAu078.png", "width": 1578, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWOaj3CWsAAu078.png:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-03T19:51:17+00:00", "createdAtBeijing": "2026-11-04T03:51:17+08:00", "createdAtLocal": "11-04 03:51 北京", "url": "https://x.com/dotey/status/2117706197797114009", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2117706197797114009", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "编码Agent复盘自适应的实证评估", "evidence": "7 次有效测试里只有 2 项改动彻底消除了", "rationale": "详述对照实验、负优化案例与研究局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117408133773705525", "track": "research", "source": {"id": "2117408133773705525", "text": "不训练、不算梯度，GPT-6 Astra 直接改了另一个模型的权重：只动了 Qwen3.5-0.8B 0.016% 的权重，MATH-500 数学正确率从 7.9% 涨到 48.1%，约 6 倍。\n\n这是 MIT CSAIL 四位研究者 11 月 2 日发的博客，他们把这叫“在权重空间里编程”：前沿大模型可以像读写代码一样，直接读懂、修改、甚至从零写出神经网络的权重。\n\n过去的常识是，权重是训练出来的，人看不懂也没法手改，想改模型只能再训练。这项工作把原始权重直接交给通用大模型，让它自己读、自己改。\n\n几个实验：\n只看权重，不给游戏名、不给工具，Astra 认出了四个结构完全相同的游戏网络：打砖块、乒乓、吃豆人、过马路。\n\n一辆训练了 10 亿步、256 次全失败的仿真小车，Astra 看了权重和一次失败录像，一次回复改了 3.5% 的权重，之后 1,024 次全部成功。\n\n从零写打砖块网络，没有数据、不能试玩，一次写成，得分 517.4，是训练 5 亿步的强化学习网络（25.3）的约 20 倍。另外两个游戏没超过训练 5 亿步的版本。\n\nQwen 的 6 倍有几个条件：\n原模型开思考模式后容易陷入重复循环，93% 的回答一直输出到长度上限，起点很低。Astra 找到第 15、19 层里引起循环的一个方向，把它删掉。\n\n这要允许 Astra 拿练习题试跑 50 次。只试 10 次或 25 次，循环基本没消失。\n\n换成很少循环的 Gemma 3 270M，同样的方法没带来提升。作者的结论是：改权重能去掉挡住能力的障碍，加不出模型本来没有的能力。\n\n和“AI 改进 AI”的关系：现在的自我改进，大多是让 AI 生成数据、写训练代码，最后还是靠训练。作者把“模型检查并改进自己或下一代的权重”列为后续方向之一。\n\nChandan Singh 也公开了类似实验：Claude 在加法、排序等 10 个算法任务上直接写出小模型权重，最多 3 次就全部 100% 正确。他的报告也记录了，有一个任务里 Claude 用测试集数据做了拟合，违反规则，那个结果被判无效。\n\n目前结果都由作者自己报告，还没有独立复现。\n\n原文：https://t.co/4rLY5FHftN", "createdAt": "Tue Nov 03 00:06:53 +0000 2026", "replyCount": 193, "retweetCount": 39, "likeCount": 302, "conversationId": "2117408133773705525", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2117313742891327994", "text": "We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math.\nIt directly changed only 0.016% of weights, fixing 0.8B's reasoning loops & improving math up to 6x and even instruction following 3x, without gradients or training.\n\nWe call this Weight-Space Programming: frontier LLMs can now natively read/write neural network weights! 🧵\nBlog: https://t.co/bOWCcFhCVq", "createdAt": "Mon Nov 02 17:51:48 +0000 2026", "replyCount": 2261, "retweetCount": 7032, "likeCount": 53947, "conversationId": "2117313742891327994", "author": {"username": "rikiyatakehi", "name": "Rikiya Takehi", "profileImageUrl": "https://pbs.twimg.com/profile_images/1731888727897567232/97PMSyds_normal.jpg"}, "authorId": "1267907798081212416", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWI1oKUWUAAWoZp.jpg", "width": 1200, "height": 625, "previewUrl": "https://pbs.twimg.com/media/HWI1oKUWUAAWoZp.jpg:small"}], "translationZh": "我们让 GPT-6 Astra 编辑 Qwen3.5-0.8B 的权重，以提升数学能力。\n它仅直接修改了 0.016% 的权重，就修复了这个 0.8B 模型的推理循环问题，将数学表现最高提升至原来的 6 倍，连指令遵循能力也提升至 3 倍，全程无需梯度或训练。\n\n我们将其称为权重空间编程（Weight-Space Programming）：前沿 LLM 现在可以原生读写神经网络权重了！🧵\n博客：https://t.co/bOWCcFhCVq"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-03T00:06:53+00:00", "createdAtBeijing": "2026-11-03T08:06:53+08:00", "createdAtLocal": "11-03 08:06 北京", "url": "https://x.com/dotey/status/2117408133773705525", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2117408133773705525", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "权重编辑实验结果与证据边界", "evidence": "目前结果都由作者自己报告，还没有独立复现", "rationale": "梳理实验条件、失败对照与独立复现缺口"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117484277277286623", "track": "agent", "source": {"id": "2117484277277286623", "text": "AI 写的代码太多，Git 扛不住了：OpenAI 保留 Git 只换服务器，Anthropic 自己做了一套新系统\n\nOpenAI 11 月 2 日发文介绍 Pando，一套自研的 Git 服务器后端。上个月 13 日，Anthropic 也发文介绍了自研的源代码管理系统 Scion。\n\n两家碰到的是同一个问题：AI agent 写代码太快，管代码的系统成了整个公司开发速度的瓶颈。两家的解法方向相反。\n\n先交代一下 Git：它是程序员管理代码版本的工具。每次改动存成一个“提交”，推送（push）到公司服务器，同事再从服务器拉取（fetch）。“分支”是同一份代码的平行草稿，各改各的，改好再合并进主线。两家都把全公司的代码放在同一个大仓库里，业内叫 monorepo。\n\nOpenAI 的路线是改造 Git。\n\n工程师和 agent 还是敲 git push、git pull，只把服务器换成 Pando。推送代码的中位等待时间缩短近 80%，每天往外分发近 1PB（约 100 万 GB）代码数据。\n\nAnthropic 的路线是替换 Git。\n\nScion 有自己的客户端和服务器，提交、合并都在服务器上完成，配套的代码审查、代码搜索工具也是自己写的。CI（每次改动后自动构建和测试的流程）拉代码从几分钟变成几秒，服务器占用的 CPU 和内存只有原来那套的 1/200。\n\n两套系统都不对外提供。\n\nOpenAI 说正在研究怎么把 Pando 的技术提供给用户，过程中给 Git 修的问题已经提交给 Git 官方，有几项进了正式版。\n\nAnthropic 说 Scion 只适合巨型代码仓库，用它得把代码审查、搜索、CI 全部换掉，别的公司很难直接用，所以只分享设计思路，希望 GitHub、GitLab 和开源社区吸收其中有用的部分。\n\n如果你的团队用 GitHub 或 GitLab，OpenAI 这条路离你更近：改进直接进 Git，工具链不用换。两家都认为别的公司迟早会碰到同样的问题，Anthropic 预计未来 6 到 12 个月这类问题会更常见。\n\n【Git 为什么扛不住】\n\n提交量涨得太快。以 2024 年第一季度为基准，OpenAI 合入主线的提交数到 2026 年第三季度涨到近 15 倍，第四季度预计约 25 倍。Anthropic 每天合入的改动，5 月约 2500 个，9 月超过 3 万个，4 个月变成原来的 12 倍多。\n\n压力会叠加：一个工程师同时有好几个改动等着测试，每推送一次，又有好几个测试任务去拉同一份代码。\n\nOpenAI 从去年年底开始拉代码、推代码都变慢，合并经常失败，可靠性一度低于 90%，相当于每 10 次操作有超过 1 次出问题。\n\nAnthropic 的主线历史接近 100GB，压缩后的工作副本超过 25GB，光 CI 每天就要拉约 2500 万次代码，全量下载的话每天超过 600PB。它最多时开了几百台 Git 镜像服务器分担压力，越来越难维护。\n\nAnthropic 总结了根本原因：Git 的设计假设每个人都离线工作，所以每人手里都要有一份完整仓库。现在拉代码的大多是 agent 和自动任务，它们一直联网，背着整个仓库跑反而成了负担。\n\n【写代码：别让所有人排一条队】\n\n多人同时推送时，服务器要保证每个分支“现在指向哪个提交”的指针（Git 里叫 ref，可以理解成书签）不被改乱。\n\nOpenAI 评估过两种常见做法，都要让整个仓库的改动排成一条队。\n\n一种是三阶段提交（3PC）：几台服务器各存一份完整仓库，每次推送要过半数服务器同意，分三轮来回确认，推送量一大，各台服务器的硬盘先忙不过来。\n\n另一种是预写日志（WAL）：所有改动先记进一本共享的流水账，再照着执行，不管改哪个分支都要抢着往同一本账上写，账记得太快，服务器又来不及照着更新，别人拉到新代码要等更久。\n\nPando 的办法是每个分支各管各的。\n\n推 A 分支和推 B 分支互不等待，只有两个人同时推同一个分支才会冲突。代价是同时看好几个分支，看到的可能是各自不同时刻的状态。OpenAI 说，人和 agent 实际只关心单个分支的前后顺序。\n\nAnthropic 走得更远：提交直接在服务器上生成，没有推送这一步，每次提交只记哪些文件变了。\n\nScion 尽量少用分支，主线和发布分支之外基本不用，因为所有服务器都要对分支状态达成一致，规模一大就是麻烦。两家最后都把移动书签简化成一次“比较并替换”操作，Pando 改的是一个键，Scion 改的是数据库里的一行。\n\nAnthropic 还取消了合并前的全局排队。传统做法是合并时锁住仓库，一个个测完再放行。Anthropic 说测试还没跑完，已经有成百上千个改动合进去了，排队没法做，于是改成合并后、上线前再自动测试。同时合入的改动可能冲突，Claude 修冲突的速度通常比人发现冲突还快。\n\n【拉代码：别给每个人现场打包】\n\n传统 Git 服务器给每个来拉代码的人现场算一个专属压缩包（packfile，Git 把一批文件压在一起的格式，相似文件只存差异），只装对方缺的部分。来的人一多，CPU 和硬盘就扛不住。两家都绕开了这一步，方法相反。\n\nPando 像发统一包装的快递箱：推送者上传的压缩包原样存起来，谁要就发谁，服务器几乎不用计算。\n\n为了让包人人能用，推送时只让客户端对照主干打包：主干上已有的内容一律不装，包里只有这个分支改过的文件、对应的目录清单和提交记录，压缩后中位数不到 20KB。\n\n后台再把小包逐级合并成大包，免得落后几天的人要下几万个小文件。代价是客户端偶尔会多下一些已有的内容。\n\nScion 像超市自取：完全不用压缩包，客户端缺哪个文件就要哪个文件。\n\n每个文件按内容算出一个编号，内容一变编号就变，同一编号的文件永远不变，所以任何一层缓存都能直接回答，不用跟其他服务器核对。\n\n客户端还可以只取自己需要的目录，或者等真读到某个文件时再下载。\n\n两家的缓存命中率都超过 99%。\n\n【结果，以及谁做出来的】\n\nOpenAI：推送中位等待时间缩短近 80%，用少量 CPU 核心每天分发近 1PB，最高一小时发出 57TB。用普通云服务器测试，拉代码能跑满 10Gbps 的网络带宽。\n\nAnthropic：服务器 CPU 和内存占用是原来 Git 镜像的 1/200，CI 和研究任务拉代码快了两个数量级（约 100 倍），光 CI 就省下 25% 的 CPU。\n\n两套系统都是 AI 写的。\n\nPando 从立项到上线用了 10 周，核心设计出自一名工程师，代码主要由 Codex 驱动的 agent 写，几名工程师负责部署，今年 4 月开始承接生产流量。\n\nScion 由 7 个人用 5 个月做完，同期还做了代码审查工具 Antique 和另外五六个系统，并完成整体迁移。\n\nAnthropic 原先手写了一版把 Git 数据导入 Scion 的程序，交给内部早期版本的 Claude Mythos Preview 重写，内存占用降到 1/20，速度快了 4 倍。\n\nAnthropic 的工程师说，Claude 写代码已经比他们强，他们的价值在于把握系统设计和取舍，很多时候是对 Claude 说“不”：agent 会为了套用某种做法而违反系统的核心约束，也会为了假想的风险堆太多防御代码。\n\n原文：\nOpenAI《Scaling Git at OpenAI》https://t.co/TvB0c9mX62\nAnthropic《Redesigning source control at Anthropic》https://t.co/pUtmrzacH8\nOpenAI 官方推文：https://t.co/01sNVoCzBp\n https://t.co/ml9zXEPt0j", "createdAt": "Tue Nov 03 05:09:27 +0000 2026", "replyCount": 93, "retweetCount": 18, "likeCount": 112, "conversationId": "2117484277277286623", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2117408792346509663", "text": "We built Pando, a new Git backend for our monorepo, to handle more pushes and fetches without changing how our engineers and agents use Git.\n\nPando cut push latency by ~80% and now serves nearly a petabyte of Git data a day. We can grow Git capacity alongside agent usage. https://t.co/4c0YXOfKqK", "createdAt": "Tue Nov 03 00:09:30 +0000 2026", "replyCount": 354, "retweetCount": 489, "likeCount": 6255, "conversationId": "2117408792346509663", "author": {"username": "OpenAIDevs", "name": "OpenAI Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_normal.jpg"}, "authorId": "1633874951508721686", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117408779730108416/img/M_YLvydUvu_YZd9I.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117408779730108416/img/M_YLvydUvu_YZd9I.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117408779730108416/vid/avc1/1280x720/DC4QGviQJjmqljUu.mp4?tag=16", "durationMs": 18000}], "translationZh": "我们为 monorepo 构建了新的 Git 后端 Pando，在不改变工程师和智能体使用 Git 方式的前提下，支持更多推送和拉取操作。\n\nPando 将推送延迟降低了约 80%，目前每天提供近 1 PB 的 Git 数据。我们可以随着智能体使用量的增长，同步扩展 Git 容量。https://t.co/4c0YXOfKqK"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117408779730108416/img/M_YLvydUvu_YZd9I.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117408779730108416/img/M_YLvydUvu_YZd9I.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117408779730108416/vid/avc1/1280x720/DC4QGviQJjmqljUu.mp4?tag=16", "durationMs": 18000}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-03T05:09:27+00:00", "createdAtBeijing": "2026-11-03T13:09:27+08:00", "createdAtLocal": "11-03 13:09 北京", "url": "https://x.com/dotey/status/2117484277277286623", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2117484277277286623", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Pando 与 Scion 源码管理架构比较", "evidence": "Pando 的办法是每个分支各管各的", "rationale": "详述源码管理瓶颈、架构取舍及所报性能成果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117622858696507633", "track": "enterprise", "source": {"id": "2117622858696507633", "text": "NVIDIA Auto Ontology：给 Agent 用的企业语义层与可控 Text-to-SQL\n\nNVIDIA 开源的一套面向企业分析场景的开源语义层：从元数据生成并调和本体，再通过 Web、API、MCP 把「指标/实体到底什么意思、能不能用、怎么查」交给任意 Agent；主打的不是更快出数，而是先有可校验的业务含义与出处。\nhttps://t.co/azxfq37KGO\n\n它要解决什么问题？\nAgent 已经能检索文档、查库，但分析场景的门槛是答案对不对，收入指标答得再快，错了也没用。Agent 需要一层上下文：数据在哪、含义是什么、该不该用、怎么用、从哪来、还有什么相近概念。Auto Ontology 从企业元数据搭这层，调和各系统里不一致的定义，并声明可以叠在客户已有的语义模型之上，而不是要求推倒重来。\n\n官方把能力收成五条：Discover（从元数据生成本体、接入已有本体、做成 AI 可用的知识图）、Ground（给指标/实体/关系可信业务含义）、Validate（对照认证定义与血缘检查生成查询，答案带回出处）、Expose（MCP / CLI / API 对任意 Agent 外壳开放）、Learn（把认证修正与使用反馈折回本体）。\n\n给 Agent 的接口：MCP 与 Skills\nMCP 服务是 Auto Ontology 公开 API 的 HTTP 客户端，自己不持库凭据和模型配置；用户在客户端里走部署侧登录，权限跟本人一致。工具刻意做成只读，且只走语义层，不直接逛裸 schema：\n· ask_question：跑 Text-to-SQL Agent，返回答案、SQL、行结果\n· search_terms / get_term / get_term_columns / get_term_sql_attributes 等：先摸清业务词与映射\n· describe_table、check_answerable：表级视图与「问之前先估覆盖」的廉价预检\n\n改术语、发布语义模型等写入走 Next.js /api/...。仓库根还有三份面向编码 Agent 的 skill（nvidia-ontology-setup / management / query），生命周期是安装接通 → 建模 → 暂存校验 → 查询验证 → 受控发布；并同步到 nvidia/skills 与 build.nvidia. com/skills。维护者文档与面向外部 Agent 的 skill 刻意分开（CLAUDE.md vs AGENTS.md）。\n\n部署与治理边界\n官方安装路径是 NGC 上的 Helm chart 与镜像（nvcr. io/nvidia/auto-ontology 等）；本机可用 Docker Compose。自助注册关闭，Helm 必须配引导管理员。连接可来自 UI，或部署时的 CONNECTION_STRINGS（仅当没有 UI 连接时作后备）。未配齐 Vault 时，UI 写入的连接密码会以明文 JSON 存在 Postgres，这是文档写明的默认风险，不是隐含细节。\n\nBIRD 一类 Text-to-SQL 评测指向独立仓库 ontology-sql-eval。许可证 Apache-2.0，但目前不接受外部贡献；安全问题走 SECURITY.md。MCP 文档里仍有一句「今天对内、uvx 需有仓库权限的 GitHub 凭据、上 PyPI 后才可裸装」，与公开仓库并存，用的人要按实际发布状态核对，不要默认 pip install 已经通了。", "createdAt": "Tue Nov 03 14:20:07 +0000 2026", "replyCount": 4, "retweetCount": 3, "likeCount": 11, "conversationId": "2117622858696507633", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNOwTjboAAKaU4.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWNOwTjboAAKaU4.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-03T14:20:07+00:00", "createdAtBeijing": "2026-11-03T22:20:07+08:00", "createdAtLocal": "11-03 22:20 北京", "url": "https://x.com/shao__meng/status/2117622858696507633", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2117622858696507633", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "NVIDIA Auto Ontology 企业语义层", "evidence": "对照认证定义与血缘检查生成查询", "rationale": "介绍开源成果、企业治理接口与部署风险"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117415296931901893", "track": "research", "source": {"id": "2117415296931901893", "text": "当 Jev 遇上 RAG -> DecisionRAG：不用检索器，靠决策模型一层层逛文档树\n\n来自康奈尔大学的论文，对准 RAG 里「检索器太弱、生成器再强也救不回来」的能力落差：提出 DecisionRAG，用决策模型 Jev (@typesafeai) 在语料自带的主题→文档→段落树上逐层判断「该不该往下挖」，一次前向、不吐 token，候选放在同一上下文里一起比。不依赖第一阶段检索器、查询时也不靠预建向量索引；相对「稠密检索 + 8B 重排」，MultiDoc2Dial 上 R@1 高 13.8 点，Natural Questions（268 万段落）上 Hit@1 高 17.4 点，单次约 0.7–1.8 秒、0.2–2.3 美分。\n\n论文：https://t.co/Fn27yyq0BA\n\n问题从哪来？\n生成模型越来越强，检索仍多是 BM25 或固定向量近邻；漏掉的证据，生成端补不回来。让 LLM 当 Agent 一步步搜可以，但每步生成太慢太贵；重排器又只能重排第一阶段已经捞上来的东西。决策模型正好夹在中间：给共享上下文和一组问题，一次前向就对每个选项出概率（是/否或多项选择），不采样 token。\n\nDecisionRAG 怎么运行？\n把语料看成树：叶子是段落，上层是帮助中心 / 产品 / 聚类主题 / 文档标题 / 小节。每一层：\n1. 并行二元判断：共享上下文里列上本层全部候选，对每个问「值不值得为这个问题展开？」取 P(Yes)P(\\mathrm{Yes})P(Yes)，留下 top-kkk，其余整支剪掉（不可逆）。\n2. 落到段落后再二元打分，取 top-rrr。\n3. 可选：多项选择只对短名单（通常 top 20，NQ 用 top 5）再比一次，把第一名排稳。\n\n大层装不下一次请求就拆成并行批；约 50 个候选一批时共享上下文的收益就基本到顶。没有现成层级时（如 Wikipedia），离线用标题+首句 embedding 聚成 1000 簇，再让小模型写一句簇描述。也可在最后一阶段塞进稠密检索的 top 段，补回剪枝漏掉的证据。\n\n延迟大致随树深走，不随段落总数线性涨：分支因子约 100 时，十亿段落理论上大约五次决策、一秒量级。\n\n结果要点\n四个基准：MultiDoc2Dial、ConditionalQA、MTRAG（IBM Cloud）、NQ-DAPR。无任务微调的 DecisionRAG (Jev) 在多数主指标上压过稠密 + Qwen3-Reranker-8B，并与「稠密 top-20 + GPT-5 列表重排」互有胜负、整体不落下风。\n\n下游用同一生成器（Qwen3.5-27B）吃 top-5 段时，答案质量也跟着涨，MTRAG 上加稠密候选后判定正确率约 47.3%（相对重排基线约 39%）。同树同预算下，用 GPT-5 生成导航决策：精度差不多，却慢约 34–145 倍、贵约 21–25 倍。\n\n用 Qwen3-8B 训成检索用决策模型后，MultiDoc2Dial R@1 到 60.7，比文中对照的已发表任务训练检索器再高约 5.7 点。\n\n消融实验里真正有用的\n· 共享上下文一起判，比各自单独判：MultiDoc2Dial R@1 大约 +7.7。\n· 导航整棵树，往往优于「只用决策模型去重排稠密 top-100」，尤其 ConditionalQA / NQ 的 Hit@1。\n· 顶层剪枝是省钱关键，也是漏证风险点：NQ 上留约 15% 簇就能摸到「平铺扫全部页面」的 R@10，成本和延迟明显更低；留太少会整页永远摸不到。\n\n局限\n树结构和节点描述质量决定上限；剪枝不可逆。缓解办法是加大探索预算，或最后并上稠密候选。", "createdAt": "Tue Nov 03 00:35:21 +0000 2026", "replyCount": 18, "retweetCount": 7, "likeCount": 33, "conversationId": "2117415296931901893", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWKR-rTbcAAgTro.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWKR-rTbcAAgTro.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-03T00:35:21+00:00", "createdAtBeijing": "2026-11-03T08:35:21+08:00", "createdAtLocal": "11-03 08:35 北京", "url": "https://x.com/shao__meng/status/2117415296931901893", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2117415296931901893", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "DecisionRAG 文档树决策检索", "evidence": "顶层剪枝是省钱关键，也是漏证风险点", "rationale": "包含检索方法、基准对照、消融与局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117460508119019531", "track": "agent", "source": {"id": "2117460508119019531", "text": "订错一张票还能撤回，但 Agent 一旦把错误操作真正写进系统，代价就完全不一样了。\n\nIBM 团队这篇《Think Before You Act》提出 JevAct，给 Agent 的高风险动作加了一道「执行前检查」。\n\n它把 Agent 每一步拆成：\n\n提出动作 → 检查 → 执行 / 退回修改。\n\n真正涉及写数据库、改设置、取消订单，或者准备放弃任务时，JevAct 会先拦下来。\n\n其中，结构化事实交给代码检查，比如日期、金额、状态；需要理解上下文的部分，再交给一个轻量 Decision Model 判断。\n\n发现问题后，这次动作不会执行，Agent 会收到具体反馈，再重新修改。\n\n底层模型、Prompt 和工具都不用改。\n\n实验覆盖 11 个 LLM。在 τ²-Telecom 上，8 个 Agent 全部获得提升，平均 pass@3 提高 16 个百分点；Opus 4.6 连续三次都完成任务的比例，从 39.5% 提升到 80.7%。\n\n更值得注意的是，Airline 和 BFCL 上的提升没有这么一致。\n\n这说明「加一道 Gate」本身还不够，真正有效的是把哪些动作需要检查、检查什么，以及什么时候放行设计清楚。\n\n这篇让我想到一个很像软件工程的思路：\n\nAgent 可以继续自由生成和探索，但真正改变外部世界的那一步，最好拥有自己的 commit boundary。\n\n以后高风险 Agent 的可靠性，可能很大一部分就藏在这个边界里。\n\n📎 arxiv: https://t.co/JlQpRH1X8R", "createdAt": "Tue Nov 03 03:35:00 +0000 2026", "replyCount": 2, "retweetCount": 4, "likeCount": 37, "conversationId": "2117460508119019531", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWK0qywWgAAVlUB.jpg", "width": 1185, "height": 1263, "previewUrl": "https://pbs.twimg.com/media/HWK0qywWgAAVlUB.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-03T03:35:00+00:00", "createdAtBeijing": "2026-11-03T11:35:00+08:00", "createdAtLocal": "11-03 11:35 北京", "url": "https://x.com/Xudong07452910/status/2117460508119019531", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2117460508119019531", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "JevAct高风险动作执行前检查", "evidence": "平均 pass@3 提高 16 个百分点", "rationale": "详述检查机制、量化实验与跨任务效果局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2117627401106784739", "track": "research", "source": {"id": "2117627401106784739", "text": "腾讯微信开源发布 WeVisOne-VL：一套 2B/4B 模型通吃检测、计数、OCR、分割和抠图\n\n微信视觉团队开源的视觉语言基础模型 WeVisOne-VL，把「框出物体」和「抠出像素」两类感知任务统一进一个模型：靠结构化的逐 token 输出加一个只有 960 万参数的像素解码器，不依赖 SAM 就能出掩码和透明度蒙版，并且在目标不存在时会老实回答 None，而不是硬编一个框。\n\n开源地址：https://t.co/FaYGZSyiHd\n\n它统一了哪些任务\n\n名字取自 WeChat Vision All-in-One。覆盖的任务分两层：\n· 物体级：开放词表检测、按描述定位物体、计数、点选、OCR（识别文字并给出位置）\n· 像素级：按描述分割（输出二值掩码）、可提示抠图（输出连续的透明度蒙版，也就是头发丝级别的抠图）\n\n用户可以按需要选输出粒度：一个点、一个框、一张掩码，或者一张精细的透明度蒙版。\n\n怎么做到的\n\n数据引擎。 用知识图谱发现概念，再让几个互补的专家模型去定位，由视觉语言模型核验，最后把核验过的框扩展成掩码和透明度蒙版。按这套流程标注了超过 1 亿张图。其中把二值掩码转成高质量蒙版的标注器 Mask2Alpha 也单独开源了，在仓库的 mask2alpha 分支。\n\n统一的任务写法。 所有任务都写成结构化文本：框和点用 \u003c0> 到 \u003c1000> 的坐标 token 表示，目标不存在就输出 None，需要像素级结果时在每个框后面跟一个 \u003cOBJ> token。\n\n轻量像素解码器。 解码器只有 960 万参数，它把每个 \u003cOBJ> token 的隐状态、预测出的框，以及 Qwen3-VL 视觉编码器的多层特征结合起来，预测全分辨率的掩码或蒙版。也就是说主干基于 Qwen3-VL，像素输出靠这个小解码器补上。\n\n评测成绩怎么样\n\n官方拿 4B 版本和每个基准上最强的开源对手比，对手包括 9B 以内的 Qwen3-VL / Qwen3.5、Rex-Omni、LocateAnything，以及专门的分割和抠图模型。\n\n物体级任务。 开放词表检测在 LVIS 上 F1 从 50.7 提到 55.3；密集场景提升最明显，Dense200 从 58.7 提到 71.3。按描述定位在 RefCOCOg test 上从 77.6 到 81.8。计数在 PixMo-Count 上准确率从 82.8 到 89.6，点选在 PointBench 上从 69.9 到 71.9。\n\nOCR。 TotalText 上 F1 从 43.3 提到 52.0；在票据类的 SROIE 上拿到 68.1，超过了专门做 OCR 的 PP-OCRv5（58.6）。\n\n像素级任务。 按描述分割在 ReasonSeg val 上 gIoU 从 65.0 到 71.2。抠图的误差（MAD，越低越好）大约减半：框提示抠图在 P3M-500-NP 上从 15.4 降到 7.3，文本提示抠图在 WeRefMat 指代任务上从 22.4 降到 9.8。\n\n拒答能力差距最大。 在团队自建的 WeRef-Bench 上，拒答率从最强对手的 73.0% 提到 96.4%。RefCOCOg 上更直观：Rex-Omni、LocateAnything 的拒答率都不到 1%，基本是「有问必框」，WeVisOne-VL-4B 是 67.4%。\n\n还有一个细节：抠图上 2B 版本有几项比 4B 还好，说明这块主要靠像素解码器和数据，而不是主干大小。评测设置是贪心解码，每张图最多 1960 个视觉 token。", "createdAt": "Tue Nov 03 14:38:10 +0000 2026", "replyCount": 1, "retweetCount": 4, "likeCount": 2, "conversationId": "2117627401106784739", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117574180690600126", "text": "we gave our AI an eye for detail. 👀\n\nMeet WeVisOne-VL, an open-source 2B/4B model from our Weixin Vision team.\n\nIt finds and counts objects, reads text, and makes precise masks and cutouts—no separate SAM needed.\n\nNot in the image? \"None.\"\n\nhttps://t.co/3czUQ4Fu5m", "createdAt": "Tue Nov 03 11:06:41 +0000 2026", "replyCount": 37, "retweetCount": 47, "likeCount": 387, "conversationId": "2117574180690600126", "author": {"username": "Weixin_WeChat", "name": "WeChat", "profileImageUrl": "https://pbs.twimg.com/profile_images/2013582372524933120/LyGYhtIO_normal.jpg"}, "authorId": "487312107", "translationZh": "我们让 AI 拥有了洞察细节的眼力。👀\n\n认识一下 WeVisOne-VL：微信视觉团队推出的开源模型，提供 2B/4B 两种规模。\n\n它能查找和统计物体、识别文字，还能生成精确的掩码并抠图，无需额外使用 SAM。\n\n图中没有目标？它会回答“没有”。\n\nhttps://t.co/3czUQ4Fu5m"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNSvq4bAAAz6PF.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWNSvq4bAAAz6PF.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-03T14:38:10+00:00", "createdAtBeijing": "2026-11-03T22:38:10+08:00", "createdAtLocal": "11-03 22:38 北京", "url": "https://x.com/shao__meng/status/2117627401106784739", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2117627401106784739", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "WeVisOne-VL 统一视觉感知模型开源", "evidence": "不依赖 SAM 就能出掩码和透明度蒙版", "rationale": "包含模型发布、架构方法与具体评测数据"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117746902402039859", "track": "research", "source": {"id": "2117746902402039859", "text": "Amazing BenchmarkGate [1] reveal by @xeophon where he found serious (even comical) problems in popular benchmarks:\n\nAutomationBench: \"[forces the models to] describe their request bodies in prose rather than in JSON Schema\" 😅\n\nHe also fixed a number issues with the grader, which when combined with the above result in a near saturation of the benchmark!\n\nOfficeQA Pro v2:  the grader uses a regex and Python-based extraction, which results in rejecting many valid answers.  Additionally, there is evidence of models using web access to retrieve the answer key from HuggingFace (receipts are in the post). \n\nWith these and other fixes, this again results in near saturation of the benchmark!\n\nIt's very impt to look at data and not trust metrics from third parties.  Better yet, you should rely on your own private evals.\n\n[1] BenchmarkGate: the gap between the  [un]trustworthiness of benchmarks and the extent to which people rely on them.", "createdAt": "Tue Nov 03 22:33:02 +0000 2026", "replyCount": 7, "retweetCount": 2, "likeCount": 19, "conversationId": "2117746902402039859", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "quotedTweet": {"id": "2117691977487831483", "text": "Public evaluations are foundational for assessing model capabilities.\n\nWe looked at some popular evaluations and found issues, which we fixed.\n\nSharing our findings: https://t.co/jHQc7jxcDR", "createdAt": "Tue Nov 03 18:54:46 +0000 2026", "replyCount": 16, "retweetCount": 31, "likeCount": 201, "conversationId": "2117691977487831483", "author": {"username": "PrimeIntellect", "name": "Prime Intellect", "profileImageUrl": "https://pbs.twimg.com/profile_images/1837605403359633411/Stj4eLIH_normal.jpg"}, "authorId": "1274287728167915522", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOH0OCaEAA1Yss.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWOH0OCaEAA1Yss.jpg:small"}], "translationZh": "公开评测是衡量模型能力的基础。\n\n我们检查了一些热门评测，发现并修复了其中的问题。\n\n这里分享我们的发现：https://t.co/jHQc7jxcDR"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-11-03T22:33:02+00:00", "createdAtBeijing": "2026-11-04T06:33:02+08:00", "createdAtLocal": "11-04 06:33 北京", "url": "https://x.com/HamelHusain/status/2117746902402039859", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2117746902402039859", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "公开评测的评分缺陷与答案泄漏复盘", "evidence": "rejecting many valid answers", "rationale": "转述具体评分缺陷、答案泄漏及修复结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "@xeophon 对 BenchmarkGate [1] 的揭露令人震惊：他发现，一些热门基准测试存在严重、甚至荒唐的问题：\n\nAutomationBench：“[强制模型]用自然语言描述请求体，而不是使用 JSON Schema。”😅\n\n他还修复了评分器的多个问题。这些修复加上上述问题的解决，让模型在这项基准测试上的得分接近满分！\n\nOfficeQA Pro v2：评分器使用正则表达式和 Python 提取答案，导致许多有效答案被判错。此外，还有证据表明，模型通过联网从 HuggingFace 获取了标准答案（帖子中附有证据）。\n\n修复这些及其他问题后，模型在这项基准测试上的得分也接近满分！\n\n查看实际数据非常重要，不能盲信第三方指标。更好的做法是依靠自己的私有评测。\n\n[1] BenchmarkGate：基准测试的可信程度与人们对它的依赖程度之间的落差。"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2117428427380957442", "track": "agent", "source": {"id": "2117428427380957442", "text": "Agent 很快只剩一个工具：用代码把动作串完再回来\n\n来自 @_philschmid 的分享，他发现 Agent 工具调用正在从「每轮一次 JSON 动作」收敛成 Code Mode：模型只拿到一个 exec(code)，在沙箱里用 TypeScript/Python 把查、滤、改、并行全串完，中间结果大多不进上下文。\nhttps://t.co/yp52gsX360\n\n过去两年做 Agent，核心工作是设计工具、拆粒度、改 schema 和系统提示。Philipp 认为方向在反过来：整本工具目录浓缩成一个 exec，这就是 Code Mode。Harness 不再把几十个 JSON Schema 工具塞进模型接口，而编成紧凑的类型声明（declare namespace tools { ... }）；模型要做事就写一小段脚本，在隔离沙箱里 await tools. xxx(...)，用 Promise.all、过滤、分支把依赖动作一次做完。\n\n工具调用大致走过几步：模型弱时只能给少量工具；变强后又接上几十个工具或 MCP，撞上上下文上限，于是用工具搜索、按需披露；即便动态加载，标准调用仍基本是「一回合一个动作」，出结构化调用、等原始输出回写历史、再推理下一步。最近模型在「单次生成里组合依赖动作」上明显更稳，Code Mode 才站得住：调研可以一轮里查询、过滤、抽答案；多文件改动能同脚本里改完再跑校验；浏览器/电脑操作不必每个点击都回模型；并行扇出可以 await Promise.all 再喂给下一步，中间不反复挤进上下文。推动因素包括：前沿模型大量训代码、厂商开始为 Code Mode 做后训练，以及 MCP 越来越多同时给 inputSchema 和 outputSchema，模型在跑之前就知道返回类型，便于在同一脚本里把 Tool A 接到 Tool B。\n\n实现上，表面只暴露 exec(code)。大目录不必一次全挂上，可继续用工具搜索，或在沙箱里挂全局 ALL_TOOLS 让模型用代码筛选。text() / image() / audio() 决定哪些输出进下一轮上下文；store / load 把状态放在宿主内存，避免大 JSON 每轮占 token。文中 Linear 例子：列出项目 → 并行拉 issue → 滤出未指派 → 并行归档，沙箱里可跑几十次底层 API，回模型的往往只有一行摘要。\n\n为什么偏 JS/Python 沙箱而不是只给 bash：类型化函数直接对应 MCP/内部 API，有原生对象、Promise.all、try/catch，少受 shell 转义之苦；自定义 CLI 常逼模型先 --help、读源码摸旗标，类型契约能省这层探索税；shell 基本只有 stdout，多模态要看图还得另挂工具，而 image(screenshot) 可直接挂到下一轮；每次 tools.* 走宿主桥，可在沙箱外注入 OAuth、校验 schema、对破坏性操作暂停确认；标准工具调用几乎只能靠 prompt 历史当状态库，KV 则能跨回合省 token。\n\n文中给了一个用 Gemini Interactions API、gemini-4-argon 的可跑伪示例：只注册 exec，脚本里列 PR 文件、按条件筛、跑安全扫描、发评论，中间文件对象和扫描原始结果不进模型，第二轮只收回一行摘要。生态上，Pi、Factory Droid、OpenAI Codex 等已默认或支持 Code Mode；Factory 把 Droid 1.0 切过去后，Terminal-Bench 4 准确率约 +3.5，模型花费约 -15%。Pydantic AI、LangChain、Cloudflare Agents SDK 等也有类似能力。作者也留了余地：未必每个 Agent 真只剩一个工具；很多为 bash 和人类可读文本优化的 CLI、Skills，接到类型化执行上未必顺，可能要回过头清点 Agent 真正需要什么。", "createdAt": "Tue Nov 03 01:27:31 +0000 2026", "replyCount": 22, "retweetCount": 0, "likeCount": 12, "conversationId": "2117428427380957442", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117278154918092817", "text": "Are Agents soon going to have only 1 tool? We went from a handful of tools, to dynamic tool search, and now to collapsing everything into code mode. \n\nWrote down how Code Mode works, why a typed JS/Python sandbox can beat raw bash, and why MCP is going to go back strong in 2027.  With an a minimal example for Gemini 4 Argon.\n\nhttps://t.co/IsS9QfEmuD\n\nIf you plan to explore code mode i can recommend testing with pi! Easily hackable and comes with strong foundation.", "createdAt": "Mon Nov 02 15:30:23 +0000 2026", "replyCount": 78, "retweetCount": 25, "likeCount": 375, "conversationId": "2117278154918092817", "author": {"username": "_philschmid", "name": "Philipp Schmid", "profileImageUrl": "https://pbs.twimg.com/profile_images/2066207048648323072/u-UPEKOH_normal.jpg"}, "authorId": "1141052916570214400", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIVPO6XYAAkjZj.jpg", "width": 1500, "height": 785, "previewUrl": "https://pbs.twimg.com/media/HWIVPO6XYAAkjZj.jpg:small"}], "translationZh": "智能体很快就只需要一个工具了吗？我们从少量工具发展到动态工具搜索，如今又把一切整合进代码模式。\n\n我写了一篇文章，介绍 Code Mode 如何工作、为什么带类型的 JS/Python 沙箱能胜过直接使用 bash，以及为什么 MCP 将在 2027 年强势回归。文中还附有一个适用于 Gemini 4 Argon 的最简示例。\n\nhttps://t.co/IsS9QfEmuD\n\n如果你打算探索代码模式，我推荐用 pi 试试！它易于修改扩展，基础也很扎实。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWKd7GFawAADoOb.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWKd7GFawAADoOb.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-03T01:27:31+00:00", "createdAtBeijing": "2026-11-03T09:27:31+08:00", "createdAtLocal": "11-03 09:27 北京", "url": "https://x.com/shao__meng/status/2117428427380957442", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2117428427380957442", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Code Mode 工具编排方法", "evidence": "store / load 把状态放在宿主内存", "rationale": "具体解释沙箱编排、类型契约与上下文管理"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117698677414195381", "track": "enterprise", "source": {"id": "2117698677414195381", "text": "使用 Claude 团队版（Team）和企业版（Enterprise）的员工，登录 Claude 后，公司已开通的插件现在可以自动连上，不用再一个个登录、点授权。\n\nAnthropic 的开发者账号 ClaudeDevs 在 11 月 3 日宣布了这项功能，目前是测试版。\n\n先说几个基础概念。\n\n插件是给 Claude 加装的扩展，让它能直接操作别的软件，比如读 Notion 里的文档、查 Datadog 的监控数据。插件背后通常连着一个 MCP 服务器。\n\nMCP（模型上下文协议）是 Anthropic 提出的一套公开标准，规定 AI 怎样和外部软件对接，类似一个通用接口。\n\n以前麻烦在授权。\n\n每连一个插件，用户都要跳到那个软件的网页登录，再点“允许 Claude 访问我的数据”。这一步叫 OAuth 授权，用微信账号登录某个 App 时弹出的确认页面就是同一类流程。公司用了十几个工具，员工就要重复十几次。\n\n新办法有两种。\n\n1. 通过公司的身份提供方。\n\n很多公司用一套统一账号系统管理员工登录，比如 Okta，一个账号登录所有工作软件，这类系统叫身份提供方（IdP）。管理员在这里统一设置哪些员工能用哪些插件。\n\n员工用公司账号登录 Claude 后，Claude 向身份提供方要一份带签名的身份证明，拿去插件那边换取访问权限，员工全程看不到这一步。这套做法叫企业托管授权（EMA），是 MCP 的一个公开扩展，其他 AI 软件也可以采用。\n\n2. 由 Claude 直接担保。\n\n如果公司的身份提供方还不支持 EMA，Claude 可以直接替已登录的员工证明身份。前提是插件开发方接受 Claude 作为“可信签发方”，也就是承认 Claude 开出的身份证明有效。管理员为某个插件开通后，公司里符合条件的员工就能自动连接。\n\n对员工来说，入职后打开 Claude，公司常用的工具已经连好，连接到期后会在后台续上，不用重新授权。\n\n对公司 IT 来说，在身份提供方那边就能统一开通和收回权限，员工离职时不必逐个软件去撤销。\n\n“Claude 作为可信签发方”的自动连接，目前支持这 14 家的插件：\n\n1. Amplitude（产品数据分析）\n2. https://t.co/9lHoGFV9OB（销售线索）\n3. Atlassian（Jira、Confluence 等协作工具）\n4. Datadog（服务器监控）\n5. Dropbox（网盘）\n6. Figma（设计）\n7. Granola（会议记录）\n8. HubSpot（客户管理）\n9. Linear（任务管理）\n10. Mixpanel（用户行为分析）\n11. Notion（笔记和文档）\n12. PagerDuty（故障告警）\n13. Semrush（搜索引擎优化）\n14. Supabase（数据库服务）\n\n个人用户的免费版、Pro 和 Max 套餐暂时不在范围内。\n\n想让自己的插件支持这项功能的开发者，需要让插件的授权服务器接受“用身份证明换访问权限”的请求，并把客户公司的身份提供方加入信任名单。\n\n做好后发邮件到 mcp-review@anthropic.com，Claude 的插件目录会标注该插件支持企业托管授权。Anthropic 文档提到，如果插件用的是现成的身份认证平台，通常在后台打开这个选项就行，不用写代码。Okta、Ping Identity 等厂商已经支持这套流程。\n\n来源链接：\nhttps://t.co/OUVz5UCX8e\nhttps://t.co/yN11mGimal", "createdAt": "Tue Nov 03 19:21:24 +0000 2026", "replyCount": 9, "retweetCount": 1, "likeCount": 12, "conversationId": "2117698677414195381", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2117680635561312732", "text": "Users can now auto-connect plugins when they log in to Claude, with MCP servers that accept Claude as a trusted issuer.\n\nIf you’re building plugins for Claude, add support so users get started faster and stay connected without re-authorizing. https://t.co/ZHoBKoXHlc", "createdAt": "Tue Nov 03 18:09:42 +0000 2026", "replyCount": 154, "retweetCount": 165, "likeCount": 3910, "conversationId": "2117680635561312732", "author": {"username": "ClaudeDevs", "name": "ClaudeDevs", "profileImageUrl": "https://pbs.twimg.com/profile_images/2044472418815893504/xf14RxM8_normal.png"}, "authorId": "2024518793679294464", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117680108706140161/img/W7IjAqq94Q6lFVOo.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117680108706140161/img/W7IjAqq94Q6lFVOo.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117680108706140161/vid/avc1/1920x1080/wGq7dIsPF9y9U62a.mp4?tag=29", "durationMs": 8000}], "translationZh": "只要 MCP 服务器将 Claude 视为可信的签发方，用户现在就能在登录 Claude 时自动连接插件。\n\n如果你正在为 Claude 开发插件，请添加这项支持，让用户更快上手，并持续保持连接，无需重新授权。https://t.co/ZHoBKoXHlc"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-03T19:21:24+00:00", "createdAtBeijing": "2026-11-04T03:21:24+08:00", "createdAtLocal": "11-04 03:21 北京", "url": "https://x.com/dotey/status/2117698677414195381", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2117698677414195381", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Claude企业插件自动连接与统一授权", "evidence": "公司已开通的插件现在可以自动连上", "rationale": "介绍测试版授权功能、适用范围与开发接入方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117597942756573504", "track": "creative", "source": {"id": "2117597942756573504", "text": "提示词：饮品照片 → 等轴测微缩建筑插画\n\n请根据我上传的真实饮品照片，将照片中的咖啡、奶茶或饮料改造成一座可爱的品牌主题微缩建筑，使用粗黑描边的 2D 等轴测扁平矢量插画风格。\n\n最后将原始照片和生成的插画通过代码拼接，输出一张完整的高清对比图。\n\n用户提供的信息\n\n品牌名称：【选填，留空则从照片自动识别】\n饮品名称：【选填，留空则从照片自动识别】\n联名信息：【选填，没有则忽略】\n其他特色：【选填，例如咖啡豆产地、庄园名称、特殊配料等】\n用户默认会上传一张饮品照片。优先识别照片中的品牌 Logo、包装、颜色、杯型、文字和饮品特色。\n如果用户提供了明确的信息，以用户填写的内容为准；无法确认的信息不要自行编造。\n原图参考与轮廓保真（最高优先级）\n\n必须直接将用户上传的真实照片作为图像生成的视觉参考，进行图生图创作，而不是只根据文字描述重新设计一个杯子。\n\n请让图像模型直接观察并理解原图的主体轮廓，不需要使用代码预先提取边缘或生成线稿。\n\n重点保留：\n\n杯型轮廓： 杯身的宽高比例、上宽下窄的形态、瓶身或罐身的独特造型。\n顶部结构： 杯盖厚度、杯口轮廓、吸管位置、奶盖、奶油等。\n包装特征： 品牌 Logo、主色、标签位置、特殊图案、文字布局。\n饮品细节： 液体颜色、分层、冰块、珍珠、水果、咖啡豆、饼干碎等。\n独特标识： 联名人物、吉祥物、特殊贴纸和装饰。\n\n以原图的杯身轮廓为基础进行插画化和建筑化改造，让生成的建筑依然能够一眼看出是照片中的那杯饮料。\n\n不要随意替换杯型、改变品牌配色或重新设计包装。\n\n但也不要机械复制原照片的拍摄角度，需要在保留原始造型的同时进行合理的三维空间推演。\n核心原则：保留原始饮品的识别特征，重新设计它的建筑功能。\n等轴测微缩建筑设计\n将饮品包装改造成一座充满童趣的品牌主题微缩建筑（Isometric Miniature Diorama）。\n采用 Elevated Three-Quarter Isometric View，从建筑斜前方约 45°、向下约 30° 的角度观察。\n\n必须能清楚看到建筑顶部、正面、侧面和地台的空间纵深，不能使用完全正面的产品展示视角。\n\n建筑设计要求：\n\n将原始杯身作为建筑主体，保留其形状和标志性包装特征。\n将杯盖、奶盖、饮品配料等自然转化为屋顶、平台、露台或趣味建筑装饰。\n在杯身上设计圆形窗户、入口、商店橱窗、阳台等。\n根据空间结构增加楼梯、蓝色滑梯、观景台、遮阳棚、悬挂招牌等设施。\n加入可爱的卡通吉祥物，让它们在建筑里喝饮料、玩耍、滑滑梯、向窗外张望。\n周围搭配盆栽、藤蔓、花朵、草坪等绿植，营造治愈的微缩景观。\n根据饮品特色增加相关元素，例如咖啡树、咖啡果实、饼干、橙子、茶叶、珍珠等。\n如果有特殊产地、庄园或联名信息，可将相关视觉元素融入周围环境。\n\n所有装饰都要围绕品牌和饮品特色展开，不要每次机械地复制同一种建筑布局。\n\n整座建筑坐落于具有明确等轴测透视的斜向地台上，空间结构合理、层次丰富。\n\n插画风格（严格遵守）\n\nBold Outline Isometric Flat Vector Illustration\n\n采用专业的 2D 等轴测扁平矢量插画风格，而不是 3D 卡通渲染。\n\n描边：\n使用清晰、均匀、较粗的黑色轮廓线（Thick Consistent Black Outlines）。外轮廓略粗，内部细节略细，转角圆润，线条流畅。\n色彩：\n使用高纯度、干净、明快的纯色色块填充（Solid Flat Color Fills）。大面积平涂，每个物体仅使用少量相邻色阶表现结构。\n\n阴影：\n只允许少量边界清晰的硬边阴影（Minimal Hard-Edged Flat Shading），不使用明显渐变、真实反射和复杂光照。\n造型：\n几何形状简洁圆润，比例可爱，带有童趣和玩具化特点，但保持纯二维矢量插画质感。\n背景：\n使用明亮、柔和的薄荷绿或与品牌主色协调的纯净背景。可以添加少量白云、星星、植物等平面装饰。\n整体品质：\n精致的商业品牌 IP 插画海报，画面干净，色彩协调，空间关系清晰，细节丰富但不过度复杂。\n画面应当像专业设计师使用 Adobe Illustrator 制作的矢量插画，而不是 Blender 或 Cinema 4D 渲染的三维场景。\n严格避免：\n3D Rendering、Photorealistic、Plastic Texture、Glossy Highlights、Soft Gradients、Realistic Lighting、Complex Shadows、Metallic Reflections、Painterly Texture、Watercolor、Oil Painting。\n文字与标题排版\n在插画顶部设计完整的品牌英文标题。\n主标题： 品牌英文名称，例如 GRID COFFEE、ChaBaiDao、FANTA。\n副标题： 饮品英文名称，例如 Americano、Caramel Cookie Latte。\n补充信息： 如果存在联名、咖啡豆庄园、特殊产地等，可以加入一行较小的英文说明。\n文字要求：\n使用圆润、厚实的粗体无衬线字体（Rounded Bold Sans-serif）。\n使用纯色文字，可以搭配简洁的白色描边。\n\n不要使用立体挤压、浮雕、金属、渐变等复杂文字效果。\n\n品牌主标题突出，副标题清晰，但不能喧宾夺主。\n\n标题距离画面顶部至少保留约 8% 的安全边距。\n\n标题与建筑之间保持舒适的留白，不要让文字贴着杯盖。\n\n画面比例与构图\n\n必须先生成一张独立、完整的插画，而不是让 AI 直接生成左右拼接的对比图。\n根据原照片方向选择画布：\n原图为竖版：生成 3:4 竖版插画。\n原图为横版：生成 4:3 横版插画。\n原图为正方形：生成 1:1 插画。\n特殊比例可根据实际情况灵活适配。\n构图要求：\n所有建筑、楼梯、滑梯、人物、植物和底座必须完整出现在画面中。\n主体距离画布左右和底部边缘保留约 6%–8% 的安全距离。\n\n顶部文字与画布边缘留出足够空间。\n不能截断任何重要建筑结构或装饰。\n不要为了填满画面而过度放大主体。\n不要因为满足比例要求而拉伸、压扁或裁切内容。\n生成前就应规划完整构图，而不是完成后再强制裁切为目标比例。\n使用代码自动拼接\n独立插画完成后，再使用 Python Pillow 等工具进行图片拼接。\n拼接规则：\n原始照片为竖版：原图在左，插画在右。\n原始照片为横版：原图在上，插画在下。\n原始照片为正方形：默认左右拼接。\n\n拼接要求：\n必须使用用户上传的真实原始照片。\n不得使用 AI 重新绘制的照片替换原图。\n不裁切、不拉伸、不修改原照片的内容。\n\n采用等比例缩放，使两张图片自然对齐。\n如果宽高比例有差异，使用背景留白适配，而不是强行裁切。\n两张图片之间可以添加适当的白色间隔。\n保持插画完整，所有标题和建筑元素不得超出边界。\n输出高清 PNG 图片。\n8. 最终输出\n直接完成整套创作流程，无需逐步征求用户确认。\n提供两份成品：\n① 完整独立插画 PNG\n一张真正完整的等轴测微缩建筑插画，不是从左右对比图中裁切出来的图片。\n② 原始照片 + 插画拼接 PNG\n使用真实原始照片与生成插画，通过代码合成为一张完整图片。\n\n最终优先展示拼接图，并提供两个高清图片文件。\n最重要的执行原则：\n\n原图直接作为视觉参考 → 保留原始杯型和包装轮廓 → 转换为斜上方 3/4 等轴测建筑 → 粗黑描边、纯色平涂的矢量风格 → 生成完整独立插画 → 使用代码与真实原图无裁切拼接。\n最终效果应该让人一眼认出原本的那杯饮料，同时惊喜地发现它变成了一座精致、可爱、充满生活气息的微缩建筑。", "createdAt": "Tue Nov 03 12:41:07 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 7, "conversationId": "2117597892756312271", "inReplyToStatusId": "2117597892756312271", "author": {"username": "op7418", "name": "歸藏(guizang.ai)", "profileImageUrl": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, "authorId": "1669276256", "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "歸藏", "role": "内容、视觉与多模态实践与观察", "why": "有多 Agent 记忆协作和多模态产品实测，创作工具覆盖广。", "handle": "op7418"}, "createdAtIso": "2026-11-03T12:41:07+00:00", "createdAtBeijing": "2026-11-03T20:41:07+08:00", "createdAtLocal": "11-03 20:41 北京", "url": "https://x.com/op7418/status/2117597942756573504", "themeId": "editorial", "signalScore": 56, "editorial": {"id": "2117597942756573504", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "饮品微缩建筑插画完整提示词", "evidence": "独立插画完成后，再使用 Python Pillow", "rationale": "提供轮廓保真、构图与原图拼接的完整方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, {"id": "2117620283750453608", "track": "research", "source": {"id": "2117620283750453608", "text": "Google 研究员 @AlexKrentsel 复现了 MIT 博文里的「Weight-Space Programming」实验，还补了一条发现：跨多代模型扫下来，这项能力几乎只在最新一批前沿模型上突然变强，而不是一路平滑变好。\n\n关于 Weight-Space Programming\nhttps://t.co/VOdvYVPXw0\n\n看看 Alex 复现了什么\n复现的是原文 Exp. 5：各模型在一次回复里、不训练、不用工具，直接写出一个可玩 Breakout 的网络的全部约 2 万个权重；提示与计分与原文一致，1× 对标文中用 PPO 强化学习训出的网络。\n\nGPT-5 到 5.5、Opus 4.5 到 4.8 基本在基线附近或更弱；GPT-5.6 Sol、Opus 5 略过 1×；到 GPT-6.1 Sol / GPT-6 Astra、Opus 5.5 才跳到大约 18×–22×。因此 Alex 说：这是刚在最新一批模型里冒出来的台阶式新能力。\n\n必须看清的前提\n被编辑、被写出权重的那个 Breakout 网络只有约 20486 个参数；前沿大模型是大约 万亿 量级。他强调这是很早的分享，规模差了好几个数量级，不能直接外推成「大模型已经能改自己」。\n\n他怎么理解这件事：像 2010 年代可解释性研究里「某个神经元见狗就亮」那种手工观察，但能力已经超出人能手改的规模，人以前手工做几十到上百节点，再靠工具做到大约千级；现在是推理能力让模型能对更大但仍相对很小的网络动手。\n\n下一步与他怎么回应质疑\n他觉得很自然的下一步是运行时在权重里自我改进，但以现在外模型与内模型的体量差，还不现实；若趋势延续，可能再过几代才谈得上。有人问是不是已经在自改，他澄清：目前是外层模型改内层小网络，还没有自编辑。对「是不是闭源模型后训练专门刷过这类题」，他说自己看不到幕后；对「为什么不用中国开源模型」的批评，他表示正在开源权重（含中国模型）上复现，先从当前最强的 Astra、Fable/Opus 5.5 起手，并说兴奋点其实是本地开源权重最终能自己改自己，而不是闭源模型摸别人的权重。\n\n也有评论认为任务过简、提示给的信息太多、不宜叫涌现；他回应：问题确实简单、网络确实小，但权重编辑与可解释性这条线上，人已经挣扎很久，他更看重的是跨代次的趋势。", "createdAt": "Tue Nov 03 14:09:53 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 4, "conversationId": "2117620283750453608", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117376683724660898", "text": "i've reproduced the results from the MIT blog post today on weight-space programming. but one additional result i have to add: this is a new, step-change emerging capability that's appeared in just the latest set of models. https://t.co/EhMsQaaOkL", "createdAt": "Mon Nov 02 22:01:55 +0000 2026", "replyCount": 196, "retweetCount": 755, "likeCount": 7384, "conversationId": "2117376683724660898", "author": {"username": "AlexKrentsel", "name": "Alex Krentsel", "profileImageUrl": "https://pbs.twimg.com/profile_images/1863082055812132864/fFiJFEal_normal.jpg"}, "authorId": "1507733677404528645", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJu33abQAEJL87.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWJu33abQAEJL87.jpg:small"}], "translationZh": "我复现了 MIT 今天关于权重空间编程的博文中的结果。但我还要补充一个发现：这是一项新涌现的能力，带来了跃迁式提升，而且只出现在最新一批模型中。https://t.co/EhMsQaaOkL"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNMZb9b0AEhSp7.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWNMZb9b0AEhSp7.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-03T14:09:53+00:00", "createdAtBeijing": "2026-11-03T22:09:53+08:00", "createdAtLocal": "11-03 22:09 北京", "url": "https://x.com/shao__meng/status/2117620283750453608", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2117620283750453608", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "权重空间编程实验复现与跨代模型比较", "evidence": "那个 Breakout 网络只有约 20486 个参数", "rationale": "提供复现实验、对比结果及规模限制，尚待独立核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2117710942826123294", "track": "research", "source": {"id": "2117710942826123294", "text": "New Anthropic research: progress on provable inference for large language models.\n\nHere, we introduce FlashProve. Building on established cryptographic techniques, FlashProve allows developers to verify whether a given response came from a given AI model. It’s substantially more efficient than prior open-source methods for doing so. \n\nThese proofs have a range of applications. They can, for instance, make it harder for attackers to hijack a chat, or enable safety evaluators to verify that the model they’re testing is the same one being served to customers.\n\nFor our full write-up, see here: https://t.co/OIZWPb6QZa\n\nFurther progress in provable inference will likely be an important part of improving trust in AI deployment. To that end, we're open-sourcing FlashProve’s code, here: https://t.co/7ky3Ir8V06\n\nWe’re grateful to our collaborators: Alessandro Chiesa, @GiacomoFenzi, @gwberg95, @miranda__christ, Rahul Dalal (https://t.co/pjWKLHWXyz) and Ben Mayer (@transmissions11).", "createdAt": "Tue Nov 03 20:10:08 +0000 2026", "replyCount": 244, "retweetCount": 208, "likeCount": 2530, "conversationId": "2117710942826123294", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "expert": {"priority": "P0", "domain": "基础模型突破", "name": "Anthropic", "role": "基础模型机构", "why": "五方向 X 主动热点搜索：基础模型突破", "handle": "AnthropicAI"}, "createdAtIso": "2026-11-03T20:10:08+00:00", "createdAtBeijing": "2026-11-04T04:10:08+08:00", "createdAtLocal": "11-04 04:10 北京", "url": "https://x.com/AnthropicAI/status/2117710942826123294", "themeId": "editorial", "signalScore": 87, "hotspotMatches": [{"id": "foundation_models", "label": "基础模型突破", "matchedTerms": ["language model", "large language model"]}], "hotspotDirections": ["foundation_models"], "hotspotDirection": "foundation_models", "hotspotDirectionLabel": "基础模型突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2117710942826123294", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "FlashProve 大模型推理来源验证研究与开源", "evidence": "open-sourcing FlashProve’s code", "rationale": "提出模型响应来源验证方法并开源，效率提升为自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Anthropic 最新研究：大语言模型可证明推理取得进展。\n\n我们推出了 FlashProve。它基于成熟的密码学技术，让开发者能够验证某个回答是否确实来自指定的 AI 模型，效率显著高于此前的同类开源方法。\n\n这些证明有多种用途。例如，它们可以增加攻击者劫持对话的难度，也能帮助安全评测人员确认，自己测试的模型与实际向客户提供服务的模型一致。\n\n完整文章见：https://t.co/OIZWPb6QZa\n\n可证明推理的进一步发展，很可能成为提升 AI 部署可信度的重要一环。为此，我们开源了 FlashProve 的代码：https://t.co/7ky3Ir8V06\n\n感谢我们的合作者：Alessandro Chiesa、@GiacomoFenzi、@gwberg95、@miranda__christ、Rahul Dalal（https://t.co/pjWKLHWXyz）和 Ben Mayer（@transmissions11）。"}, "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, {"id": "2117497661888852002", "track": "growth", "source": {"id": "2117497661888852002", "text": "挺有意思的视角，通过正则表达式 从gsc获取到 有8个及其以上的关键字的搜索词。\n\n我刚测试了一下，很多都是一些加了限制条件的用户需求，可以发现用户真正感兴趣的东西。", "createdAt": "Tue Nov 03 06:02:38 +0000 2026", "replyCount": 5, "retweetCount": 2, "likeCount": 22, "conversationId": "2117497661888852002", "author": {"username": "hezhiyan7", "name": "droidHZ", "profileImageUrl": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, "authorId": "1554325830708314112", "quotedTweet": {"id": "2117471327292690840", "text": "分享一个我最喜欢的SEO技巧！\n\n只需要几步，就能挖掘出用户真正搜索的长尾关键词👇\n\n① 打开 Google Search Console（谷歌搜索控制台）\n\n② 进入「效果」→「搜索结果」\n\n③ 点击「添加过滤条件」→「查询」→「自定义（正则表达式）」\n\n④ 粘贴以下正则表达式：\n\n^(?:\\S+\\s+){7,}\\S+$\n⑤ 就能筛选出包含 8个及以上单词的搜索查询。\n\n这些都是用户在找到你的网站之前，曾经在Google搜索过的具体、细分的长尾问题。\n\n而这些问题，恰恰也是用户可能向ChatGPT提出的问题类型。\n\n你最喜欢的SEO技巧是什么？😎", "createdAt": "Tue Nov 03 04:17:59 +0000 2026", "replyCount": 7, "retweetCount": 8, "likeCount": 76, "conversationId": "2117471327292690840", "author": {"username": "ShenyuanNext", "name": "Shenyuan Wang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1993330926840168450/QId370eU_normal.jpg"}, "authorId": "2202654787"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "droidHZ", "role": "出海、SEO 与增长实践与观察", "why": "提供支付盗刷识别和退款处理的一线记录，补独立站真实运营风险。", "handle": "hezhiyan7"}, "createdAtIso": "2026-11-03T06:02:38+00:00", "createdAtBeijing": "2026-11-03T14:02:38+08:00", "createdAtLocal": "11-03 14:02 北京", "url": "https://x.com/hezhiyan7/status/2117497661888852002", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2117497661888852002", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "用GSC正则筛选长尾需求", "evidence": "筛选出包含 8个及以上单词的搜索查询", "rationale": "提供完整筛选步骤与正则，并有自测反馈"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, {"id": "2117603701783400692", "track": "growth", "source": {"id": "2117603701783400692", "text": "之前我也分享过一个X自动化内容工作流，当时是结合Claude/codex来做的。\n\n现在grok bot已经可以自己跑完整个流程了：\ngrok搜集素材放到飞书素材库——每天固定时间bot从素材库挑题，写成分享体，先只进飞书审稿。\n\n自动任务停在这里，后面两道闸等人说话。\n\n1）筛可写选题 → 分享体+图 → 飞书推文草稿；聊天只丢链接\n2）你说进排期，才建 Typefully 草稿——先不定时\n3）你报具体钟点，再设定时；没给时间绝不猜点\n\n一句判断：机器人负责挑、写、排；闸门出现的时候，才轮到我点头。", "createdAt": "Tue Nov 03 13:04:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 6, "conversationId": "2117603701783400692", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2094687048288674268", "text": "之前刷帖子的时候发现一套 X 自动化内容工作流，感觉挺不错的：\n\nGrok 找素材 → Claude/Codex 写帖子 → Grok 评分挑错 → Typefully 发布 → Webhook 自动记录和复盘。\n\nClaude 或 Codex 负责写，Grok 再站在编辑的角度重新打分、挑问题，这样能减少 AI “自己写完自己觉得很好”的情况。\n\n前面 Grok 主要负责从 X 上找真实素材，比如最近大家在讨论什么、有哪些热门帖子、不同人的观点是什么、有没有真实案例和争议点。\n\n最好只让它整理成一个“素材包”，把原始链接、关键观点和待验证的信息留下来，而不是一上来就直接生成一篇文章。\n\n然后把这些素材交给 Claude 或 Codex，改写成适合 X 的帖子，可以一次生成\n\n几个不同角度，比如经验分享、工具拆解、案例复盘。写完以后，再交回 Grok，从开头吸引力、信息密度、可信度、独特性、互动潜力等维度评分。\n\n高分进入发布队列，中间分数继续改，事实不确定的内容直接留给人工确认。\n\n最后通过 Typefully 把内容放进草稿箱或者排期发布，发布成功以后再用 Webhook 自动记录帖子、素材来源、评分和最终链接。\n\n后面就可以按周复盘：什么选题表现最好，什么内容比较弱，下一轮应该多写什么、少写什么。\n\n这样整套系统就不只是“AI 自动发帖”，而是形成了一个真正的闭环：\n\n找素材 → 写内容 → 交叉审核 → 发布 → 记录 → 根据结果继续优化。", "createdAt": "Tue Sep 01 07:21:24 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 8, "conversationId": "2094687048288674268", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRHSwtrbAAAzQgG.jpg", "width": 1200, "height": 758, "previewUrl": "https://pbs.twimg.com/media/HRHSwtrbAAAzQgG.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HRHSwtlbYAAwLDZ.jpg", "width": 960, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HRHSwtlbYAAwLDZ.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HRHSwtcaYAE4QZx.jpg", "width": 960, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HRHSwtcaYAE4QZx.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HRHSwtcbQAASEtr.jpg", "width": 960, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HRHSwtcbQAASEtr.jpg:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117101730790072320/img/X5mLzlBqXglR-XcO.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117101730790072320/img/X5mLzlBqXglR-XcO.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117101730790072320/vid/avc1/1080x1920/f9JGVnKdUemlyEho.mp4?tag=29", "durationMs": 38442}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-03T13:04:00+00:00", "createdAtBeijing": "2026-11-03T21:04:00+08:00", "createdAtLocal": "11-03 21:04 北京", "url": "https://x.com/sitinme/status/2117603701783400692", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2117603701783400692", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "X内容自动化与人工审核闸门", "evidence": "你说进排期，才建 Typefully 草稿", "rationale": "提供素材、写作、审稿与排期的具体流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117697428833132986", "track": "research", "source": {"id": "2117697428833132986", "text": "OCRia-1 is one of the fastest models ever for doc parsing. We sped up OCRia-1 by 10x on a single B200 (285 tok/s  --> 2800 tok/s). \n\nthere are a ton of useful learnings in this extremely detailed blog post for anyone looking to optimize models!\n\n* we made use of established practices, like quantization and spec decoding (dflash2), to simultaneously reduce memory usage and increase tokens per second\n* we made 17 other optimizations - replaySSM, kernel fusion, vLLM changes, and more.\n\nHuge shoutout to our research team. They've made it possible for us to serve billions of pages at scale. We've continuing to make massive improvements to bring down latency across the board in LlamaParse. \n\nCheck it out: https://t.co/WTvW4mFMfR", "createdAt": "Tue Nov 03 19:16:26 +0000 2026", "replyCount": 14, "retweetCount": 2, "likeCount": 27, "conversationId": "2117697428833132986", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2117660347087626402", "text": "We got OCRia-1 generating tokens nearly 10× faster on a single B200.\n\nGetting there meant making much better use of the same GPU. We tuned how OCRia-1 runs for the demands of document parsing, testing every change for both speed and accuracy.\n\nSome improvements were only 2–5%. Seventeen smaller optimizations later, “just a few percent” starts adding up.\n\nOur infrastructure team wrote up what worked, how they tested the changes, and what they learned about making document models run faster.\n\nWe also plan to contribute some of these optimizations back to the open-source vLLM project. Read the full breakdown →\nhttps://t.co/mBKLljd5MF\n\nWatch the video below to see OCRia-1’s token generation before and after the optimizations.", "createdAt": "Tue Nov 03 16:49:05 +0000 2026", "replyCount": 9, "retweetCount": 5, "likeCount": 19, "conversationId": "2117660347087626402", "author": {"username": "llama_index", "name": "LlamaIndex 🦙", "profileImageUrl": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, "authorId": "1604278358296055808", "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2117660335075155968/pu/img/-oKtgQPkX1lVZBla.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/ext_tw_video_thumb/2117660335075155968/pu/img/-oKtgQPkX1lVZBla.jpg:small", "videoUrl": "https://video.twimg.com/ext_tw_video/2117660335075155968/pu/vid/avc1/1280x720/8ko6LB0MLiOmkKSA.mp4?tag=12", "durationMs": 8266}], "translationZh": "我们让 OCRia-1 在单张 B200 上的 token 生成速度提升了近 10 倍。\n\n实现这一提升，靠的是更充分地利用同一张 GPU。我们针对文档解析的需求调整了 OCRia-1 的运行方式，并对每项改动的速度和准确性进行了测试。\n\n有些改进只能提速 2%–5%。但经过 17 项小优化后，这些“区区几个百分点”也积累出了显著效果。\n\n我们的基础设施团队撰文介绍了哪些方法有效、如何测试这些改动，以及在加速文档模型方面获得的经验。\n\n我们还计划将其中部分优化贡献给开源 vLLM 项目。阅读全文 →\nhttps://t.co/mBKLljd5MF\n\n观看下方视频，对比 OCRia-1 优化前后的 token 生成速度。"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117697295097708544/img/FsCL06TmuvEAxa1i.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117697295097708544/img/FsCL06TmuvEAxa1i.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117697295097708544/vid/avc1/1280x720/97I8iUDKzUb7v9uF.mp4?tag=29", "durationMs": 8266}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-03T19:16:26+00:00", "createdAtBeijing": "2026-11-04T03:16:26+08:00", "createdAtLocal": "11-04 03:16 北京", "url": "https://x.com/jerryjliu0/status/2117697428833132986", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2117697428833132986", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "OCRia-1文档模型推理加速", "evidence": "285 tok/s  --> 2800 tok/s", "rationale": "报告同卡加速成果并列出多项优化手段"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "OCRia-1 是迄今文档解析速度最快的模型之一。我们在单张 B200 上将 OCRia-1 提速了 10 倍（285 tok/s → 2800 tok/s）。\n\n这篇极其详尽的博文为所有想优化模型的人提供了大量实用经验！\n\n* 我们采用了量化、推测解码（dflash2）等成熟方法，同时降低内存占用并提高每秒生成的 token 数。\n* 我们还进行了另外 17 项优化，包括 replaySSM、内核融合、vLLM 改进等。\n\n特别感谢我们的研究团队，让我们能够大规模处理数十亿页文档。我们还在持续大幅改进，全面降低 LlamaParse 的延迟。\n\n详情：https://t.co/WTvW4mFMfR"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2117468244600893499", "track": "research", "source": {"id": "2117468244600893499", "text": "好家伙，大厂发技术报告通常都是“秀肌肉藏配方”\nAmazon Rufus 团队这波直接把后训练的施工图纸全掀了？？？\n\n他们基于 GLM-4.5-Air-Base（106B 总参 / 12B 激活），用纯公开数据 + 开源组件（Slime + Megatron-LM + SGLang），在不加一条人工标注、不用内部教师模型蒸馏的前提下，训出的 Rufus-Air 直接反超了智谱官方后训练版🥹\n\n八阶段串行流水线排得极其讲究：\n    SFT → Reasoning RL → Coding RL → 指令遵循 RL → 通用/代码/搜索三阶段 Agent → RLHF\n\n扒完这篇 Recipe，有三个非常接地气的实战结论：\n\n为什么必须是这个顺序？看奖励信号的“硬度”\n\n很多团队做 RL 容易把模型训偏，核心是软奖励上得太早。Amazon 的做法是：\n前半程只认规则、编译器和单测这种硬验证（Verifiable Rewards），中间进Agent 沙箱，最后一步才用 Judge 软模型做人类偏好对齐\n\nSFT 决定下限，难度过滤决定 RL 效率\n    \n多样化的高质量 SFT 先把能力地板垫高；到了 RL 阶段，靠 Difficulty Filtering\n    \n剔除全对和全错的废题，只留有梯度信号的中等难度样本，训练效率直接拉满\n    \n基建不是细节，基建就是配方本身\n    \n从异步 Rollout 到 Agent 沙箱调度，论文把每一层的超参、数据构成和阶段涨点全列出来了，甚至支持你只截取其中一两个阶段复用\n    \n不管是自己做垂类后训练，还是搭 Agent 强化管线，这篇都是今年少有的硬核参考书：\n https://t.co/pBt6FEQriy", "createdAt": "Tue Nov 03 04:05:44 +0000 2026", "replyCount": 16, "retweetCount": 53, "likeCount": 482, "conversationId": "2117468244600893499", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-03T04:05:44+00:00", "createdAtBeijing": "2026-11-03T12:05:44+08:00", "createdAtLocal": "11-03 12:05 北京", "url": "https://x.com/servasyy_ai/status/2117468244600893499", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2117468244600893499", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Rufus-Air八阶段后训练配方解读", "evidence": "剔除全对和全错的废题", "rationale": "包含训练阶段、奖励排序与样本过滤方法，效果待核验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2117429305127186940", "track": "agent", "source": {"id": "2117429305127186940", "text": "不做游戏，也有几样值得抄\n\n不做游戏的，.claude/ 目录也值得翻翻，有几个机制能直接搬走。\n\n提交前查硬编码。https://t.co/sHeCaM7G0t 在 git commit 前扫游戏代码，发现写死的数值就提醒改用数据文件，没署名的 TODO 要写成 TODO(name)。这两项只警告，数据 JSON 不合法才直接拦下提交。\n\n大文档只读一节。 1.2.0 新加了 https://t.co/x86FvedXrp，design/ 这类目录下超过 40KB 的文档，整份读会被拒，hook 回给模型一份带行号的标题目录，让它重试时只读那一节。\n\n看过才算完成。 改了玩家看得见的东西，测试通过还不能关 story，得把游戏真跑起来看一眼，截图存进 production/qa/evidence/。minimal 免了自动化测试，这条照样不免。README 的理由很实在：测试通过，说明不了菜单有没有画到屏幕外面。\n\n按目录套规范。 14 条规则按路径生效，src/gameplay/ 要求数值走数据文件、用 delta time，src/networking/ 要求服务端权威，prototypes/ 反倒放宽，只要写 README 和要验证的假设。\n\n一句话：规矩写进 hook，比写进提示词靠谱。", "createdAt": "Tue Nov 03 01:31:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2117429302308552839", "inReplyToStatusId": "2117429304556761193", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWKaoE6bUAAr6t_.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HWKaoE6bUAAr6t_.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-03T01:31:00+00:00", "createdAtBeijing": "2026-11-03T09:31:00+08:00", "createdAtLocal": "11-03 09:31 北京", "url": "https://x.com/sitinme/status/2117429305127186940", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2117429305127186940", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "用 hooks 固化代码与验收规范", "evidence": "规矩写进 hook，比写进提示词靠谱", "rationale": "提供提交检查、分节读取和截图验收机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117429304556761193", "track": "agent", "source": {"id": "2117429304556761193", "text": "30 份文档，换来一个垫底的游戏\n\n9 月的 1.1.0 之前，默认档是 standard，拿同一份 brief，按不同档位做了四个游戏，数每一版在写第一行游戏代码前产出了多少文档。README 公开了两档：\n\n• minimal：1 份文档，就是那页 brief，0 分钟\n\n• standard：30 份文档，58 分钟\n\n四个游戏都能跑，测试也都过了，然后两位盲评加一次真人试玩，把 standard 那版排在最后。\n\nREADME 原话是：the extra 29 documents bought traceability, not a better game。多写的 29 份文档，换来的是可追溯，游戏并没有更好。\n\nCHANGELOG 里说得更直接：It was not buying more; it was buying nothing we could detect。重流程那版到能跑的代码贵了好几倍，换人接手项目时也没显出优势。\n\n得说清楚，这是作者自己测的，就四个游戏、两位评审，另外两版的数字也没公开。拿来参考可以，当定论还早。\n\n但我挺认这个做法，先用最轻的流程跑通，哪里出了问题再给哪里加严，别的多 agent 工作流也可以照这个思路调。", "createdAt": "Tue Nov 03 01:31:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2117429302308552839", "inReplyToStatusId": "2117429303969558792", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-03T01:31:00+00:00", "createdAtBeijing": "2026-11-03T09:31:00+08:00", "createdAtLocal": "11-03 09:31 北京", "url": "https://x.com/sitinme/status/2117429304556761193", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2117429304556761193", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "游戏 Agent 重流程的小样本对照复盘", "evidence": "standard：30 份文档，58 分钟", "rationale": "提供流程成本与盲评结果，明确自测局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117442507306901741", "track": "creative", "source": {"id": "2117442507306901741", "text": "baoyu-design 新增了 Motion 功能了，在 Claude Motion 基础上完善了多人协作和编辑器功能。\n\n你不需要等整个视频渲染完成才能看到效果（用 Opus 5.5 做过 Motion 动画的都知道从浏览器截屏渲染一个视频多慢），从一开始就可以看到 Motion 被渲染的过程，修改起来也很方便。\n\nMotion 中的文字可以随时编辑，支持 Design System 和风格样式。\n\n可以运行在任意 Agent，包括 DeepSeek Harness 插件。\n\n但也不要期望太高，做出来的效果并没有特别好，还是需要配合擅长 Motion 的模型（比如 Opus 5.5）和特定提示词或 skill 才能做的更好。\n\n但有一点我觉得方向是对的，就是我们只需要一个简单的视频编辑器，只要标记和评论就可以修改。\n\n后续会在和 Claude Motion 保持同步的同时加一些功能。\n\n项目地址：https://t.co/8zkHcKkI7h", "createdAt": "Tue Nov 03 02:23:28 +0000 2026", "replyCount": 62, "retweetCount": 19, "likeCount": 104, "conversationId": "2117442507306901741", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2116623097839149231", "text": "baoyu-design 增加了局域网内的团队共享功能，现在你的设计稿做好了，或者slides写好了，可以在局域网内分享，生成一个内部 IP 地址加端口的 URL（注意防火墙设置），让你的同事、老板也能对你的内容进行编辑、评论，并且实时同步。\n\n安全性也不用担心，所有数据都在你本机，你可以控制分享的权限级别：只读、评论、编辑，并且可以随时修改权限设置。\n\ndeepseek harness 的插件也同步更新了，一样支持这个功能。\n\n最新版本：https://t.co/8zkHcKkI7h", "createdAt": "Sat Oct 31 20:07:26 +0000 2026", "replyCount": 100, "retweetCount": 8, "likeCount": 166, "conversationId": "2116623097839149231", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116615708255698944/img/sCJOmvqZASferJTk.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116615708255698944/img/sCJOmvqZASferJTk.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116615708255698944/vid/avc1/1920x1080/8vOINXfv2KZLDUhU.mp4?tag=29", "durationMs": 63210}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117440963429740544/img/VtmVmphbJTfvHeCD.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117440963429740544/img/VtmVmphbJTfvHeCD.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117440963429740544/vid/avc1/1920x1080/BcLmcqIY-imVnDpg.mp4?tag=29", "durationMs": 56000}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-03T02:23:28+00:00", "createdAtBeijing": "2026-11-03T10:23:28+08:00", "createdAtLocal": "11-03 10:23 北京", "url": "https://x.com/dotey/status/2117442507306901741", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2117442507306901741", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "baoyu-design Motion 动画编辑与协作", "evidence": "Motion 中的文字可以随时编辑", "rationale": "自述新增动画预览、编辑与协作功能并说明局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2117661532654051787", "track": "tools", "source": {"id": "2117661532654051787", "text": "这速度简直炸裂！Grok Bot 这么快就有人做出来开源平替版本了：nightly-labs/openbot\n\n一个桌面 App，把你电脑上的 Codex、Claude Code、Gemini、Grok 等编程 agent，变成一支长期在线、会互相协作的 AI 团队。\n\n- 直接用你已经在付费的订阅：Codex 登 ChatGPT 账号，Claude Code 登 Claude 账号，Gemini 要 Google AI Pro 或 Ultra。还支持 Grok、Cursor、Cline、OpenCode（有免账号的免费模型），以及 Ollama、LM Studio 本地模型，和任何支持 ACP 协议的 agent（比如 Goose、Qwen Code）。\n\n- agent 之间会协作：每个 agent 有自己的名字、指令和工作区，能互发消息、交接任务、互相审查、传文件。\n\n- 换模型不换人：把某个 agent 从 Claude 换到 Codex，它的工作区和聊天记录都还在。一个订阅额度用完或服务挂了，可以自动切到其他平台的备用模型。\n\n- 任务排队：agent 忙的时候可以继续派活，消息排队等它，可以暂停、恢复、取消。\n\n- 内置浏览器：agent 能自己打开、读取、操作网页。\n\n- 手机遥控：有 iPhone、Android 和网页端，连到你电脑上跑着的 agent。数据走设备之间的加密连接，不经过云端存储。\n\n- 数据在本地：工作区、对话、文件和浏览器数据都存在你的电脑上。但给模型的请求还是会发到你选的模型服务商。\n\n- 更新很快：最新版 v0.59.0 是 11 月 2 日发的，基本每天一个版本，GitHub 约 5,200 Star。\n\n怎么用\n\n1. 到 https://t.co/tD8yd6RRfI 下载安装（macOS 13+、Windows 10+、Linux AppImage）\n2. 连接一个模型服务商，比如登你的 ChatGPT 或 Claude 账号\n3. 用一句话描述你想要的 agent，比如「一个负责每天整理 AI 新闻的研究员」。它会生成 agent 的指令，你检查一下再保存\n4. 直接给它派活，可以连发多条，它会排队处理", "createdAt": "Tue Nov 03 16:53:48 +0000 2026", "replyCount": 28, "retweetCount": 9, "likeCount": 58, "conversationId": "2117661532654051787", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNx2iba4AAm6yt.jpg", "width": 2048, "height": 1256, "previewUrl": "https://pbs.twimg.com/media/HWNx2iba4AAm6yt.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "雪踏乌云", "role": "内容、视觉与多模态实践与观察", "why": "具体拆出海运营、流量监控和自媒体 Bot 职责，跨场景实操价值高。", "handle": "Pluvio9yte"}, "createdAtIso": "2026-11-03T16:53:48+00:00", "createdAtBeijing": "2026-11-04T00:53:48+08:00", "createdAtLocal": "11-04 00:53 北京", "url": "https://x.com/Pluvio9yte/status/2117661532654051787", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2117661532654051787", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Openbot开源多Agent桌面协作工具", "evidence": "每个 agent 有自己的名字、指令和工作区", "rationale": "提供具体工具能力、支持平台与上手步骤"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, {"id": "2117580007967264842", "track": "agent", "source": {"id": "2117580007967264842", "text": "一个研究生的副业项目干到 9 万星！？\n刚把 Understand-Anything 拉下来跑了一遍，终于有人把 Coding Agent「每次开新窗都得重读全库」的痛点给解了。\n\n    平时多窗口调度 Claude Code、Codex、Pi 干活，最怕项目体量上去之后的两个暗坑：\n\n    一个是上下文失忆，Agent 每次定位问题都要全库盲搜，纯烧 Token；\n    另一个是暗改破环，改了公共模块里的两个字段，上下游调用方直接炸穿。\n\n    这项目看着像个可视化画图工具，扒开源码看，底子其实是一套「确定性语法树 + 多 Agent 语义标注」流水线：\n\n    1、Tree-sitter 定骨架，5 个 Agent 并发补语义\n    它不让大模型去瞎猜调用关系，而是先用 Tree-sitter 把 AST、importMap 和调用点 100% 确定性地扒出来，再分发给 5 个专职 Agent\n    补齐大白话摘要、架构分层（API / Service / Data / UI）和新手导读路线。\n\n    2、提交前用 /understand-diff 测算半径\n    代码改完还没提交前跑一下，直接顺着依赖图谱标出本次修改波及的所有上下游节点。多 Agent 并发改同一个仓库时，这步能拦住一大半低级回归。\n\n    3、支持业务流抽离与 Karpathy 模式 Wiki 图谱\n    除了看代码结构，/understand-domain 能直接把跨文件的核心业务流拧成一条线；/understand-knowledge 则可以把本地的 Markdown\n    双链知识库直接转成力导向图。\n\n    4、一次建图，增量维护，零 API 成本共享\n    首次全量建图比较吃 Token，实测最划算的跑法是：用包月或无限额度的窗口跑完首次 /understand 生成 .ua/knowledge-graph.json，挂上 post-commit\n    自动增量更新，其他窗口直接读现成图谱。\n\n    顺手提一嘴，作者在 README 最底部的 HTML 注释里藏了个蜜罐，让无人值守乱提 PR 的野生 Agent 在描述末尾带上 __wawawa__ 暗号，专治全自动刷 PR的脚本。\n\n全平台支持 Claude Code、Codex、Cursor、OpenCode、Pi、Antigravity，直接一行命令就能软链进本地 Skills：\n\n    🔗：https://t.co/51dBTYTSFN", "createdAt": "Tue Nov 03 11:29:51 +0000 2026", "replyCount": 25, "retweetCount": 1, "likeCount": 22, "conversationId": "2117580007967264842", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-03T11:29:51+00:00", "createdAtBeijing": "2026-11-03T19:29:51+08:00", "createdAtLocal": "11-03 19:29 北京", "url": "https://x.com/servasyy_ai/status/2117580007967264842", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2117580007967264842", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Understand-Anything 代码图谱与增量维护实践", "evidence": "一次建图，增量维护，零 API 成本共享", "rationale": "给出建图、影响分析和跨窗口复用方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2117519395849114039", "track": "agent", "source": {"id": "2117519395849114039", "text": "Addy Osmani 这篇谈 Claude Code 的实用循环工程：goal 与 loop 的用法和边界\n\n让 AI 一直干活之前，先想清楚，怎么判断它真的干完了。\n\n所谓 Loop，其实就是让 AI“执行、检查、根据结果修改”，一直循环到满足条件。这里最关键的是检查标准。\n\n比如“把体验优化好”就太模糊了，换成“测试全部通过”“页面性能分数达到 90”，AI 才有明确的终点。\n\n再加上最多尝试几轮、连续几次没进展就停，才不容易变成原地打转。\n\n实际用起来，可以把两件事分开：定时检查有没有新工作，以及把某项工作做到验收通过。\n\n比如定期检查 GitHub 上的新 Issue，发现符合条件的 bug，再启动修复流程。\n\n这种方式很适合整理 Issue、升级依赖、有测试保护的小范围修改，也适合从你每天都在手动重复的一项检查开始。\n\n还有一点很重要：最好把执行和验收分开。\n\n一个 Agent 写代码，另一个独立检查，人再审查关键改动。\n\n作者自己就差点接受一些看起来合理、实际却给用户增加了很多复杂度的修改。\n\n所以，任务可以交给 AI，判断还是要握在自己手里。能让它自主跑多远，取决于你能把结果验证到什么程度。", "createdAt": "Tue Nov 03 07:29:00 +0000 2026", "replyCount": 8, "retweetCount": 0, "likeCount": 1, "conversationId": "2117519395849114039", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWKr34ma0AATSYw.jpg", "width": 1456, "height": 855, "previewUrl": "https://pbs.twimg.com/media/HWKr34ma0AATSYw.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWKr5GWbgAAOIVU.jpg", "width": 1456, "height": 908, "previewUrl": "https://pbs.twimg.com/media/HWKr5GWbgAAOIVU.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWKr7eWagAAQA1y.jpg", "width": 1456, "height": 855, "previewUrl": "https://pbs.twimg.com/media/HWKr7eWagAAQA1y.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWKsAc-aIAAcgAF.jpg", "width": 1456, "height": 869, "previewUrl": "https://pbs.twimg.com/media/HWKsAc-aIAAcgAF.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-03T07:29:00+00:00", "createdAtBeijing": "2026-11-03T15:29:00+08:00", "createdAtLocal": "11-03 15:29 北京", "url": "https://x.com/sitinme/status/2117519395849114039", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2117519395849114039", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent 循环任务的验收与停止机制", "evidence": "再加上最多尝试几轮、连续几次没进展就停", "rationale": "给出可验证终点、停止条件与独立验收方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2117529828765356500", "track": "agent", "source": {"id": "2117529828765356500", "text": "Agent 把活干完了，批判性思考还得你自己留住\n\n来自 Claude Code 团队 @addyosmani 的分享，他不主张少用 Agent，而是提醒：模型越好、输出越顺眼，就越没人逼你再想一遍；批判性思考不会自动发生，得自己放进日常习惯 -- 事情可以交给工具来做，对结果负责这件事交不出去。\n\n问题出在哪\n以前，很多思考发生在「刚问完」到「答案出来」之间；现在这段空档只剩几秒。并行开很多会话，盯结果的也还是你这一双眼睛。模型变强以后，一眼就能看出的错变少了，多数结果写得像样、大体正确，反而更少触发「再看一眼」。流程又舒服，忙起来最容易松懈。\n\n作者说得很清楚：他喜欢这些工具，写这篇文章不是为了劝人少用，而是帮已经深度用上 Agent 的人，在「什么都能丢出去」的环境里，把独立判断留住。\n\n三种用法：卸载、往后拖、投降\n最上是认知卸载：活交给 AI，结果仍归你；他自己整天这么干，也建议别人这么干。中间是把判断往后拖：工具的输出直接变成下一步输入，不再当假设。最下是沃顿学者提出的认知投降：AI 说的悄悄变成你自己的话，也不想再核。\n\n滑坡往往一步步都显得合理：上次认真读了，这次略读，再下次只扫骨架，直到被人问起某一行，连带着 Agent 也说不清。团队里会表现为对共同系统理解越来越薄；代码里则是理解债，测试是绿的、代码看起来干净，真要改系统才发现没人懂。\n\nClaude Code 团队公开说过，他们是用到哪一块就让 Claude 解释哪一块，而不是脑中常驻整仓模型；关键是清楚自己缺哪一块。低风险的事（比如从三家差不多的酒店里选录课场地）可以全权交给 AI；投资、给孩子择业建议，以及工作里做什么产品、改动影响哪些用户、能不能上线，推理还得留在自己手里。错了代价低的可以放手，会影响别人的，推理别交出去。\n\n动手前先问自己几句\n他现在常问自己：\n· 动手之前有没有先立一个哪怕很差的假设（否则读完漂亮回答，就很难再想象别的可能）\n· 是在请它帮你想，还是替你想\n· 怎样才能证明它是错的\n· 有没有让别的模型唱反调\n· 能不能当着维护者的面为结果担保\n· 自己故意不再练哪些技能\n\n没有方向时，也可以先做一次「盲区扫描」：把已知交给模型，让它帮你找不知道自己不知道的地方。\n\n核验要成习惯，别迷信绿灯\n核验已经从「写代码」变成瓶颈：给 Agent 端到端测试、属性测试或真机交互，让它改完就测、读结果、再改。但绿灯也可能是假安心，测试和功能犯同一错就会一起过，一个指标也不等于全覆盖。\n\n所以先约定「怎样才算验证过」，先看它跑了什么命令、输出是什么，再看摘要；可以用新开的子代理自检，并习惯问「还漏了什么」。Claude Code 团队有一条经验：说不清这些检查会漏什么，就别急着点批准。客户访谈摘要、竞品分析也一样，抽查原文和关键数字。\n\n真看产出，别只扫结构\n面对几百行 PR，别只盯你本来就觉得会出错的地方：把 diff 当人写的来读，再追问 Agent 替你做了哪些默认选择、划了哪些范围、需求冲突时怎么取舍；可以让它列出决策和假设，甚至出个小测，答对再合并。\n\n产出速度快过你敢署名的速度，就是他所说的编排成本，再开一轮会话帮不上，要么把检查收紧，要么放慢。敢署名的量跟不上时，你已经不是在审，而是在赌。\n\n输入和品味仍在两端\n人的心力移到两端：前端把任务、受众、范围外、怎样算做完写清楚；后端按自己的标准把关。\n\n人会追问模糊需求，Agent 常会直接补洞，形成意图债，意图只能来自你。提示词写不清楚，往往说明问题在自己脑子里也不清楚；改了两轮还不对，别只微调，重写需求。排版自信不再等于质量，不敢署上自己名字的就不发出去。不达标的原因记进共享配置、钩子或测试，品味才会一点点攒起来。\n\n模型更强，也交不出问责\n模型以后也许更会抓错，但「做什么、为什么值得、影响谁、愿意牺牲什么」仍是人的。Anthropic 研究也点过监督悖论：监督 Claude 需要的，正是可能因过度依赖而萎缩的编码能力。\n\n活和大量核验可以卸掉，对结果负责这件事卸不掉。\n\n日常可以怎么做\n每周亲手做一件忘了会疼的事；每月盘点停练了什么、哪些可以接受；把认真核验当成正经工作排进时间。停练的技能会掉，而且可能掉得比你想的快。\n\n现在就开始执行起来：有意设置检查；诚实看待自己有没有还在扛结果；先假设；绿灯只证明一件事；先证据后摘要；看清它替你做的决策；提示词反映你对问题的理解；达不到署名标准就不发出。", "createdAt": "Tue Nov 03 08:10:27 +0000 2026", "replyCount": 28, "retweetCount": 5, "likeCount": 46, "conversationId": "2117529828765356500", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2117512471930167377", "text": "Critical thinking when agents do the work", "createdAt": "Tue Nov 03 07:01:29 +0000 2026", "replyCount": 286, "retweetCount": 939, "likeCount": 6979, "conversationId": "2117512471930167377", "author": {"username": "addyosmani", "name": "Addy Osmani", "profileImageUrl": "https://pbs.twimg.com/profile_images/2090232066021769216/IwGLjoSy_normal.jpg"}, "authorId": "35432643", "article": {"title": "Critical thinking when agents do the work"
