<script>
const DATA={"records": [{"id": "2114909091101573476", "track": "agent", "source": {"id": "2114909091101573476", "text": "CS 329Z: Engineering AI Agents\nStanford / Fall 2026 @stanfordnlp\nhttps://t.co/Ko6UarsQff\n\n来到了第 10 课「Evaluating Agents — Terminal-Bench and Harbor」， @alexgshaw @ryan_marten 来分享Terminal-Bench 与 Harbor 怎么把 Agent 当成可迭代工程。\nhttps://t.co/OCrE9ETWQX\n\n软件世界正从「规则是真相」（手写代码）转向「评测是真相」（agent 靠 eval 开发、软件再由 agent 生成）。Terminal-Bench 用终端任务把这套做成可跑的社区基准；Harbor 把同一套任务格式与基础设施产品化，让你自己造百万级 eval，不是只消费某一个榜。\n\n从演绎到归纳：为什么 Evaluator 成了新角色\n讲义先用软件史铺垫：机器码 → 汇编 → 高级语言（Hoare：程序性质原则上可从文本演绎出来）→ ML 的「输入+输出 → 规则」→ LLM → Agents。Shannon 的「真能思考、学习、操纵环境」那句话被用来收束：数字技术开发整体在变归纳。三层递进：模型从数据学；agent 靠评测养；软件由 agent 生成。于是 Specifier 仍是软件工程师，但 Evaluator 成为缺失的工种；规格的落点从「写规则」变成「写 evaluation」。\n\nTerminal-Bench：bash 当「万能工具」的基准\n核心洞察：终端里几乎什么都能干（对比一长串 AWS CLI）。社区数字（讲义页）：64 张 model card、171 贡献者、1k+ GitHub 参与、5k+ Discord、7M+ 次 benchmark run；首 commit 约 2025-01，Claude Code 约 2025-02 发布，时间线对应 coding agent 爆发与终端基准同窗。\n\n任务解剖示例：把 /app/schematic.png 的 2D 示意图变成 /app/out.step，verifier 不是「看起来像」，而是一串几何断言（合法 STEP、水密、体积/表面积/惯性矩/凸包/拓扑/平均曲率等）。结构拆成：INSTRUCTION.MD + ENVIRONMENT/DOCKERFILE + TEST/…。\n\n共用词汇（任务怎么长什么样）\nTask / Trial / Benchmark / Verifier(Grader) / Trajectory(Trace) / Evaluation harness / Agent harness。任务目录约定为 agent 无关、易定义、可移植：\ninstruction.md · task.toml · environment/Dockerfile · solution/solve.sh · tests/test.sh\n\n写任务要问：你在测什么、测对了吗？三条硬约束：指令与 verifier 对齐、防 reward hacking、真实/公平/有趣。指令要充分指定，同时尽量短、尽量像真人说话。环境尽量贴近 prod：真软件/多容器优于 mock；「开放世界/联网」有 tradeoff；能 bake 进镜像的网络依赖就 bake，减 flakiness。Verifier 是对环境状态的 outcome 分类器：看混淆矩阵；与 instruction 需求 1–1；程序化检查 + LLM judge 并用。\n\nReward hacking 与隔离\nAgent 环境锁定、verifier 环境隔离、agent 代码执行隔离；产物从 agent env 交到 verifier env 再跑测试，避免 agent 改测试或摸到打分器。Oracle solution/ 用来调试 verifier/环境，动作应像 agent 会走的路径，忌 hardcoded 捷径。\n\nInfra、QA、版本、结果\nEval infra：容错、可复现、可并行、本地/云 sandbox 可移植；rollout 覆盖 test/train/prod。Task QA：任务会以很微妙的方式坏掉；静态检查 + agentic 检查（agent judge、oracle agent、frontier agents、cheat agents，并对轨迹做 judge）。CI/CD 视角：任务就是软件，软件有 bug，用量带来 bug 报告、flakiness、infra 噪声、新模型新行为、假阴性、reward hacking；https://t.co/l8GwCDbhH1 上有版本与 issue 流。\n\n版本语义（讲义三列）很实用：\n· 主版本 (x+1)：改 agent 环境 → 整测重跑（新任务、欠/过指定 prompt、数据工具、资源）\n· 次版本 (y+1)：改 verifier → 可 regrade（过严、清 hack、调 judge、减 flakiness、改奖励）\n· 补丁 (z+1)：元数据 → 可 reuse（文档、钉依赖、修笔误、oracle 偶发）\n结果要求：每一行都有完整收据，每 trial 的轨迹、日志、产物、奖励。", "createdAt": "Tue Oct 27 02:36:35 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 9, "conversationId": "2114909091101573476", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2095330467000328632", "text": "CS 329Z: Engineering AI Agents\nStanford / Fall 2026 @stanfordnlp \nhttps://t.co/ynvpE8PKFE\n\n课程定位：从\"模型\"到\"系统\"的工程学\n覆盖：简单 LLM 流水线 → 复合 AI 系统 → 自主 Agent。三位讲师的背景也高度互补：\n@Diyi_Yang（斯坦福 NLP 教授，人机交互与社会计算方向）\n@michaelryan207（DSPy 核心贡献者，自动评估 AutoMetrics 作者）\n@jyangballin（SWE-agent / SWE-bench / SWE-smith 作者，软件工程 Agent 领域最重要的研究者之一）\n\n# 课程主线：三大工程挑战\n贯穿全课的三个核心问题——分解（decomposition）、数据（data）、评估（evaluation）。11 周的内容基本围绕这三条线展开，可以分为五个模块：\n\n模块 1：构建基元（Week 2–3）\n· LLM 作为构建材料：API/SDK（litellm）、结构化输出、约束生成、解码策略、test-time compute、上下文工程、模型选型与成本/延迟权衡\n· RAG：embedding、向量库、分块策略、混合检索、cross-encoder 与 ColBERT 后期交互\n· 工具调用：函数调用 API、MCP（Model Context Protocol）、工具设计、代码沙箱、错误处理与重试\n\n模块 2：框架与设计模式（Week 3–5）\n· 框架层：DSPy（signature / module / optimizer）、LangChain/LangGraph、LlamaIndex，重点是\"框架抽象了什么 vs. 你手写了什么\"\n· 设计模式：workflow vs. agent 的分类学，五种可组合 workflow 模式，ReAct / plan-and-execute / reflection，\"scaffold（脚手架）本身就是设计决策\"\n· 记忆架构：短期/长期记忆、记忆作为工具动作、文件系统作为外化记忆、跨 Agent 记忆（MemGPT、Mem0、Generative Agents）\n· 多 Agent 系统：编排模式、handoff 与状态传递，以及一个很有态度的对照阅读——既读 AutoGen，也读《Why Do Multi-Agent LLM Systems Fail?》和 Neubig 的《Don't Sleep on Single-agent Systems》\n\n模块 3：优化（Week 5）\n· 从提示词到微调的全景：GEPA、MIPROv2、OPRO、TextGrad（提示优化）；LoRA/QLoRA、蒸馏、RLHF/DPO（权重优化）；test-time scaling（推理算力）\n· 核心问题是决策框架：什么时候优化 prompt、什么时候优化 weights、什么时候堆推理算力\n\n模块 4：数据与评估（Week 6–8）——最有分量的部分\n· 数据：trace、demonstration、feedback 三类数据；训练数据 vs. 评估数据；数据飞轮；合成数据；从 Agent 轨迹构建数据集（SWE-smith）\n· 评估基础：为什么 eval 难；4 元组框架（request / environment / stopping criteria / scorer）；好 benchmark 的性质；tinyBenchmarks\n· 评估基础设施：三类 grader、LLM-as-judge 的 prompt 设计与已知偏差、pairwise vs. pointwise、非确定性指标 pass@k vs. pass^k、harness 设计\n\n模块 5：安全与前沿（Week 8–11）\n· 安全：工具访问的隐私风险、prompt injection（含间接注入）、红队、沙箱与权限模型、输出护栏、human-in-the-loop\n· Coding Agent：SWE-agent、Claude Code、OpenHands 的端到端架构对比\n· 主动式 Agent：从 reactive 到 proactive，General User Models（GUM）、Next Action Prediction，以及\"Agent 何时应主动、何时应等待\"的 mixed-initiative 问题\n· 开放问题：多模态/web/计算机使用 Agent、科学 Agent、长时运行架构、生产可观测性（tracing、monitoring、成本管理）\n\n# 作业设计：一手建、一手评\n\nHW1：从零构建 Agent 系统（10%） 给定论文库，构建能检索并推理回答科学问题的 Agent。\n· Part A：只用 litellm 手写 RAG + 工具调用 + ReAct 式 Agent 循环\n· Part B：用 DSPy 重建关键组件，并反思框架抽象了什么\n\nHW2：评估一个 Agent（10%） 给定一个预构建 Agent，设计完整评估套件：代码型 grader、至少一个 LLM-as-judge、用 4 元组框架构建 benchmark 任务、错误分析。", "createdAt": "Thu Sep 03 01:58:07 +0000 2026", "replyCount": 23, "retweetCount": 35, "likeCount": 170, "conversationId": "2095330467000328632", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRQb8aZbgAAJQh7.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HRQb8aZbgAAJQh7.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmqmWAbAAAM5mT.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVmqmWAbAAAM5mT.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T02:36:35+00:00", "createdAtBeijing": "2026-10-27T10:36:35+08:00", "createdAtLocal": "10-27 10:36 北京", "url": "https://x.com/shao__meng/status/2114909091101573476", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2114909091101573476", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Agent评测基准与工程化方法", "evidence": "指令与 verifier 对齐、防 reward hacking", "rationale": "详述任务设计、验证隔离及评测版本管理"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114912866709168259", "track": "research", "source": {"id": "2114912866709168259", "text": "阿里千问最新研究：Agent 也会「巴别塔」！\n\n团队发布一个新的 BabelArena 来测试：同一条 agent 工作流换语言后，工具调用、环境状态、检索与打分会不会一起走样，通关仍可能掩盖 8 倍级的工具调用膨胀。\n\n论文：https://t.co/69FHQUbK0R\n\n千问帖子里的例子\n同一购物任务、同一模型（Qwen-3.8-Max），英语与泰卢固语（Telugu）都拿到同样四个商品、都算通过；但工具调用是 25 vs 201，泰卢固一侧对本地化目录反复空搜。作者的判断：即便 pass，上线前也该看见这条差距。\n\nBabelArena / BabelFlow 是什么\n· BabelArena：大规模多语言 LLM agent 基准，约 699 个规范任务 × 23 种语言 → 约 1.6 万 任务实例（论文/README 数字在 699–702、16077–16146 间有小幅表述差，以当日仓库与 arXiv 为准）。覆盖 13 个领域、15 种文字；语言分高/中/低资源三档（泰卢固在低资源列）。\n· 四套源基准家族：VitaBench（交互服务）、DeepPlanning（长程规划）、τ³-Bench text（模拟用户 + 工具 + 政策）、ClawEval（编排 / 多模态 / 专业对话）。\n· BabelFlow：通用适配流水线，沿运行时数据流找出可安全翻译的文本，在任务、工具描述、数据库、模拟用户与 grader 上保持结构一致，多层校验 + 人工复核后再接纳变体。重点是 component-complete localization，不是只翻 prompt。\n\n论文里更广的发现\n没有单一模型通吃四个家族；跨语言差距不止成功率。低资源语言更多是 tool-use / control-flow 类失败，而不仅是「答案质量差」；同任务输入 token 可到英语约 2×；结构化输出时语言一致性更差，切换几乎一边倒指向英语。", "createdAt": "Tue Oct 27 02:51:35 +0000 2026", "replyCount": 15, "retweetCount": 0, "likeCount": 4, "conversationId": "2114912866709168259", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114696710173921589", "text": "Our latest open-source research has a pretty interesting name, inspired by the story of the Tower of Babel. What interests us about that story is how language barriers can get in the way of people working toward the same goal\n\nAnd when it comes to agents, there are a few more places for that understanding to break, like tool arguments, database entries, and search queries\n\nOne example from BabelArena (yes that's the name, surprise) stuck with me: Qwen-3.8-Max completed the same shopping task in English and Telugu, getting the same four products. But it took 25 tool calls in English and 201 in Telugu, with repeated empty searches against the localized catalog.\n\nEven though both runs passed, we’d still want to see that difference before shipping.\n\nSorry for the long story, hope you guys are still here. What I want to share is that we’ve open-sourced BabelArena to study these workflows across 23 languages. Code, datasets, and paper in the comment", "createdAt": "Mon Oct 26 12:32:39 +0000 2026", "replyCount": 96, "retweetCount": 72, "likeCount": 1732, "conversationId": "2114696710173921589", "author": {"username": "QwenDevs", "name": "Qwen Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/2079037454556987392/zGNYEiMo_normal.jpg"}, "authorId": "2077014085598941184", "translationZh": "我们最新的开源研究有个挺有意思的名字，灵感来自巴别塔的故事。这个故事吸引我们的地方在于，语言障碍会如何阻碍人们朝着共同目标协作。\n\n而对智能体来说，理解还可能在更多环节出错，比如工具参数、数据库条目和搜索查询。\n\nBabelArena（没错，这就是名字，惊喜吧）中的一个例子让我印象深刻：Qwen-3.8-Max 分别用英语和泰卢固语完成同一个购物任务，买到了相同的四件商品。但英语版本调用了 25 次工具，泰卢固语版本却调用了 201 次，并在本地化商品目录中反复搜索无果。\n\n虽然两次运行都通过了评测，但我们仍希望在上线前看到这种差异。\n\n说得有点长，希望大家还在。其实我想分享的是，我们已开源 BabelArena，用于研究 23 种语言下的这些工作流。代码、数据集和论文见评论。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmuCKLa8AAzxvC.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVmuCKLa8AAzxvC.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T02:51:35+00:00", "createdAtBeijing": "2026-10-27T10:51:35+08:00", "createdAtLocal": "10-27 10:51 北京", "url": "https://x.com/shao__meng/status/2114912866709168259", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2114912866709168259", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "BabelArena多语言Agent工作流评测", "evidence": "工具调用是 25 vs 201", "rationale": "介绍开放基准、完整本地化方法及跨语言成本差异"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114867168072315221", "track": "research", "source": {"id": "2114867168072315221", "text": "OpenAI 称 AI 推翻计算机科学的“指数时间假设”，还证出杨-米尔斯理论存在，外部专家组开始核查\n\nOpenAI 10 月 26 日宣布，内部模型在数学、计算机、物理上各拿出一项成果，其中两项碰的是几十年的难题。这些都还是 OpenAI 的说法，没经过同行评审，截至发稿也没有参与核查的专家公开评价结论对错。\n\n【计算机：一条被当作地基的假设】\n\n“可满足性问题”是这样一类题：给你一堆“A 和 B 至少一个为真”之类的条件，问能不能让它们同时成立。每多一个变量，要试的组合就翻一倍。\n\n1999 年 Russell Impagliazzo 和 Ramamohan Paturi 提出“指数时间假设”（ETH）：这类题没有本质上更快的解法，耗时注定翻倍式增长。几百篇论文拿它当前提，论证很多问题“快不了”。\n\nOpenAI 公开的论文给出一个新算法，依然很慢，但耗时增长得比 ETH 断言的慢，这就足以推翻它。它没有证明“所有难题都有快速解法”（P=NP），OpenAI 也说变成实际提速还要大量研究。\n\nOpenAI 说证明已用 Lean 检查过。Lean 是一种证明检查程序，把证明拆成最小步骤逐条核对，错一步就不通过。论文和 Lean 代码都在 GitHub 上，任何人能复核。核查小组由 Impagliazzo、Paturi 和 MIT 的 Ryan Williams 牵头。\n\n【物理：千禧年难题的一半】\n\n量子色动力学（QCD）描述夸克和胶子怎样靠“强力”粘成原子核，计算和实验对得上，但没人用数学严格证明过它能成立。它的简化版“杨-米尔斯理论”是克雷数学研究所悬赏 100 万美元的千禧年难题。\n\nOpenAI 称模型 9 月写出了两者存在的证明，10 月中旬完成 Lean 检查。不过这道千禧年难题要证两件事：理论存在，以及最轻的粒子也有质量（“质量间隙”）。OpenAI 只说做了前一件。\n\n物理材料暂不公开，由诺贝尔奖得主 David Gross 带队的专家组先自己写成论文，外界目前没法检查。\n\n【数学：Kakeya 猜想推到所有维度】\n\nKakeya 问题问的是：一个图形要能放下指向每个方向的单位线段，最少多大。面积能小到接近零，但数学家猜它在“维度”上总是满的。2025 年王虹和 Joshua Zahl 证了三维。OpenAI 称模型证明了一个更强的猜想，顺带拿下所有维度，论文和 Lean 证明已直接公开。\n\n【为什么换了发布方式】\n\n9 月 OpenAI 宣布解决纳维-斯托克斯千禧年难题，有数学家说撞上自己未公开的研究，引发署名之争；10 月 6 日它一口气发了 722 篇 AI 论文，次日因错误撤回 3 篇。这次改请外部专家牵头：不签保密协议，OpenAI 不要学术署名，专家无偿独立参与。\n\nOpenAI 原文：https://t.co/ANHLKq5ocW\n论文与 Lean 证明：https://t.co/aPgNSqXevr", "createdAt": "Mon Oct 26 23:49:59 +0000 2026", "replyCount": 97, "retweetCount": 17, "likeCount": 213, "conversationId": "2114867168072315221", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2114837059462627533", "text": "Announcing three major scientific discoveries, one each in mathematics (harmonic analysis), computer science (complexity theory), and physics (quantum field theory).\n\nAI starting to help us improve our understanding of the universe! https://t.co/VkfacopR2R", "createdAt": "Mon Oct 26 21:50:21 +0000 2026", "replyCount": 542, "retweetCount": 1570, "likeCount": 12878, "conversationId": "2114837059462627533", "author": {"username": "gdb", "name": "Greg Brockman", "profileImageUrl": "https://pbs.twimg.com/profile_images/1347621377503711233/bHg3ipfD_normal.jpg"}, "authorId": "162124540", "translationZh": "宣布三项重大科学发现，分别来自数学（调和分析）、计算机科学（复杂性理论）和物理学（量子场论）。\n\nAI 开始帮助我们加深对宇宙的理解了！https://t.co/VkfacopR2R"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-26T23:49:59+00:00", "createdAtBeijing": "2026-10-27T07:49:59+08:00", "createdAtLocal": "10-27 07:49 北京", "url": "https://x.com/dotey/status/2114867168072315221", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2114867168072315221", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "AI科学证明成果声明与核查", "evidence": "这些都还是 OpenAI 的说法，没经过同行评审", "rationale": "涉及重大研究声明与证明材料，结论待核查"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2114762951299322293", "track": "research", "source": {"id": "2114762951299322293", "text": "😵 同样开长上下文，33B 和 27B，显存为什么能差十几 GB？\n\n我把 Nanbeige4.3-33B 和 Qwen3.8-27B 的性能跟效果都测了一遍，又去翻了配置，算明白了。\n\n单张 48GB 4090，单路、128K 容量、8bit KV，全程裸跑（没开投机解码）：\n\n📦 显存\n🔴 Nanbeige 33B IQ4_XS：31.1 GiB\n🟢 Qwen 27B EXL3 3.5bpw：17.6 GiB\n\n⚡ 速度\nNanbeige：1K 输入 45 tok/s，32K 输入 32 tok/s\nQwen 干活时平均生成速度快 60% 以上\n\n🧪 效果（3 个 30 分钟真实 Coding Agent 任务：Flask / HTTPX / pytest）\nNanbeige：1/3 ✅\nQwen：2/3 ✅\n同一个 Flask bug，Qwen 3 分半修完，Nanbeige 磨了 10 分半 😅\n\n显存差距的一大来源，是注意力架构：\n\nNanbeige：52 层全部使用全注意力\nQwen：16 层全注意力 ＋ 48 层线性注意力\n\n全注意力需要为历史 token 保存 KV；线性注意力层主要维护压缩状态。上下文越长，这笔缓存账越明显。\n\n只算 8bit KV 数据本体，理论上：\n\n📦 128K：Nanbeige 约 13 GiB，Qwen 约 4 GiB\n📦 256K：Nanbeige 约 26 GiB，Qwen 约 8 GiB\n\nNanbeige 的 256K KV 算上 q8_0 缩放开销约 27.6 GiB，再加约 16.8 GiB 权重，两项已经 44.4 GiB。\n加上运行缓冲，总占用可能到 45 GiB 左右，48GB 卡基本顶满。\n\nQwen 这套部署粗估约 22 GiB。\n（exllamav3 默认把 Embedding 放 CPU，所以 Qwen 实测比“权重＋KV”还略低一点）\n\n⚠️ 256K 是推算，尚未实测；后端和量化不同，这是两套量化的对比。\n\nNanbeige 全注意力架构跑超长上下文，成本确实更高。我的48G卡也顶不住。\n\n💯 对我这种单卡跑长上下文 Agent 的用途，目前来看兼顾智力和速度的，就是Qwen Next Flash iQ4。", "createdAt": "Mon Oct 26 16:55:52 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 16, "conversationId": "2114762951299322293", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2114400266787471806", "text": "😳 Dense 之王来了。BOSS 直聘竟然把大模型卷到这个地步了？\n\n如果这模型真如指标描述，那确实封神了。\n\nBoss旗下南北阁团队发布 Nanbeige4.3-33B，直接对标 Qwen3.8-27B。\n\n看了一眼官方 Benchmark，有点不敢相信：\n\nTerminal-Bench 2.1：80.9 vs 73.0\nDeepSWE：65.5 vs 42.5\nAutomation Bench：54.2 vs 38.3\nDeepPlanning：63.3 vs 49.2\n\n33B Dense，512K 上下文，Apache 2.0 开源。\n\n这还只是教师模型，后面还准备把 Agent 能力蒸馏到 3B。\n\n目前 GSQ-RCO GGUF 量化已经有人做了，单张 48GB 4090 就有机会跑起来。\n\n压力给到 Qwen4 了！😂", "createdAt": "Sun Oct 25 16:54:41 +0000 2026", "replyCount": 13, "retweetCount": 6, "likeCount": 80, "conversationId": "2114400266787471806", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114400197698863105/img/qOUVTjBpyO9DdLMT.jpg", "width": 946, "height": 2048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114400197698863105/img/qOUVTjBpyO9DdLMT.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114400197698863105/vid/avc1/1170x2532/Rve-uq0DfBeG988b.mp4?tag=29", "durationMs": 12308}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVfbxvjasAAJMh5.jpg", "width": 946, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVfbxvjasAAJMh5.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVfbxveawAA5Rnc.jpg", "width": 946, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVfbxveawAA5Rnc.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkktyWbgAEsojW.jpg", "width": 1292, "height": 458, "previewUrl": "https://pbs.twimg.com/media/HVkktyWbgAEsojW.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-10-26T16:55:52+00:00", "createdAtBeijing": "2026-10-27T00:55:52+08:00", "createdAtLocal": "10-27 00:55 北京", "url": "https://x.com/MinLiBuilds/status/2114762951299322293", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2114762951299322293", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "注意力架构与长上下文部署成本对比", "evidence": "256K 是推算，尚未实测", "rationale": "自述实测结合缓存计算，明确量化差异与推算边界"}, "isTopStory": true, "topStoryEligible": true, "topStoryCategory": "AI 技术应用", "topStoryScore": 98, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "selected"}, "editorialTopRationale": "单卡实测长上下文显存与速度，解释注意力差异并注明量化边界"}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2114929079975563269", "track": "enterprise", "source": {"id": "2114929079975563269", "text": "推荐阅读：《用 Manus 改造 Manus，AI Native 组织改造的实践和思考》https://t.co/0MEN86K7ow 来自 Manus 很好的 AI Native 组织改造一手实践分享。\n\n基于我的理解提炼一下要点：\n\n【1】团队的工程基建，从对人友好，变成了向 AI 暴露接口\n\n过去我们做工程基建，核心是提升开发者体验，怎么让工程师写代码更爽；但 AI 原生的第一性原理，是如何让 Agent 能接触到真实世界，自己能获得充足的上下文。\n\n比如 Manus 把分散的仓库串成统一入口、让 AI 能在几秒钟内跑通端到端测试、给 AI 权限去读线上日志、看报警、发邮件、控制 Feature Flag，他们做的这些，都是在把整个软件开发生命周期和业务流彻底暴露给 Agent。\n\n人能看到什么、操作什么，Agent 就必须能看到、能操作。当 Agent 能够自己可以验证结果，形成“修改-验证-排查”的闭环时，它才真正从副驾驶变成了司机。\n\n【2】人和 AI 的交互，从过程控制微管理，变成了只给目标，要证据\n\n在传统的模式里，人跟 AI 是结对的方式，AI 写一段人来修改，人还要操心上下文有没有超、代码写得优不优雅，是不是有垃圾代码。但实际上这种过程工程是低效的，就好比你作为一个管理者去微管理你的员工。\n\n- 直接给结果\nManus 工程师把 Slack 里的需求原文一字不改丢给 Agent，老板要什么就告诉 Agent 要什么，不需要告诉 Agent 怎么做，Agent 自己会想办法完成任务。\n\n- 要证据\n\n当人不再一行行看代码时，怎么相信 AI 的结果是否靠谱呢？\n\nManus 用最好的模型做代码审核机器人，让 AI 自己证明自己做对了。Manus 让 Agent 用测试账号走完注册、支付流程并逐步录屏，产品经理看录屏就能指出哪里不对。\n\n【3】AI 工作流，从人等 Agent，变成 Agent 等人\n\n真正的 AI 原生工作流是高度异步、大规模并发的。如果你只有一个 Agent 在干活，你就得等着它干活，但如果你安排了很多 Agent 同时干活，那么你就不需要等，只需要频繁的在不同的 Agent 之间切换，要么在分配任务，要么验证下结果，效率可以很高。\n\nManus 的工程师一个人同时开着十几二十个 Session 处理需求；领导层把 20 多个待办丢给一个主控 Session，让它自己去拉取 Slack、Gmail 和 Notion 做背景调研并分发任务；市场部的数字 Agent 更是学会了只在一个工作台接收任务，把任务拆给后台的多个子 Session 并行跑，甚至通过定时唤醒在收到系统信号时自动干活，遇到工具不好用还能自己提需求改系统。\n\n【4】组织极致扁平与敏捷，从以前明确的工种，到现在每个人都能身兼多职\n\n传统软件工程里最大的损耗是在人和人之间。 前后端联调的扯皮、产品设计研发对文档理解的偏差、跨部门的排期与优先级错位，毕竟人类无法低成本地共享上下文，所以才不得不靠精细的分工来凑。\n\n而当 AI 抹平了技术栈的鸿沟，分工就不再必要了。在 Manus，一个人可以写完前后端和移动端，7 个人维护 4 个 App；所有产品经理都提交过代码，甚至一半能独立上线功能。\n\n当然这样做不是没有代价的，Manus 人均每月 1 万美元的夸张 Token 消耗，当然hidecloud 在文章中解释了：买的是时间和注意力。\n\n买的是“消除人际沟通损耗”和“保护人类的注意力”。当很多事情不再需要找人问，不需要临时打断别人时，组织才真正实现了极致的扁平与敏捷。\n\n【5】Agent 对话 Session 正在成为公司的新一代资产\n\n对话流（Session / Thread）正在取代传统的文档和看板，成为组织的核心工作对象与记忆载体。组织的知识已经不依赖人和文档，还依赖于 Agent 是否能读得到。\n\nManus 的运维同事嫌总被找去帮忙发版，就把发版流程写进 Agents.md，之后谁都能让 AI 来发；同一项目的成员能看到彼此的 Session，不用再追着人问进度。\n\n【6】当 AI 做了 90% 的事，人还剩下什么？\n\n引用下 hidecloud 的话：\n> 在 AI Native 组织里，人的角色没有变小，而是更集中了。定义问题，判断质量，决定什么值得做，并为结果负责。还有很重要的一点：与 AI 共同成长。\n\n人的位置一直在往上移，从亲手做，到定规则、看证据、做决定。往上移的时候，要小心把判断也一起交出去。\n\n执行可以交给 AI，思考要留给自己。\n\n---\n\n补充一个有意思的点，他们产品经理把需求用 AI 做成视频，然后把视频当需求文档提交，看了下他们的那个视频，确实这个功能要描述清楚不容易，配合视频会简单很多，这确实是一种降低人和人之间沟通损耗的办法。\n\n其实可以试试 Claude Design，这种交互都也能描述清楚，绝大部分功能直接做成高精度原型比视频效果直观多了。\n\n---\n\n虽然现在各个团队都在喊 AI 原生转型，但要做好是真不容易，如果只是在传统流程上加上一点 AI，那很难真正做到 AI 原生。\n\n真想要做好，可以学学 Manus 那样，一切围绕 Agent 重新建立分工和流程，还得舍得砸钱用最好的模型，现在这些模型虽然贵，但是一两年后 Fable 这样的模型成本可能也跟 DeepSeek Flash 差不多了。", "createdAt": "Tue Oct 27 03:56:00 +0000 2026", "replyCount": 88, "retweetCount": 40, "likeCount": 195, "conversationId": "2114929079975563269", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVm8yHjWEAAAn_u.jpg", "width": 1346, "height": 752, "previewUrl": "https://pbs.twimg.com/media/HVm8yHjWEAAAn_u.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-27T03:56:00+00:00", "createdAtBeijing": "2026-10-27T11:56:00+08:00", "createdAtLocal": "10-27 11:56 北京", "url": "https://x.com/dotey/status/2114929079975563269", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2114929079975563269", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Manus的AI原生组织改造实践", "evidence": "把发版流程写进Agents.md", "rationale": "提供接口改造、结果验证和异步协作的具体方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2114730719255695729", "track": "growth", "source": {"id": "2114730719255695729", "text": "Anthropic 正式递交招股书：拟在纳斯达克以 ANT 上市，发行价和估值还没定\n\nAnthropic 美国时间 10 月 26 日向美国证监会公开递交了 IPO 招股书（S-1），计划在纳斯达克上市，股票代码 ANT，高盛和摩根士丹利牵头承销。这几条在官方公告和 SEC 文件里都能查到。\n\n发行多少股、定什么价，官方说还没确定，所以媒体一直在说的“募资约 1000 亿美元、估值约 2 万亿美元”，招股书里没有。上市日期也没写，据 Fox Business 记者 Liz Claman 援引消息人士，最快 11 月 19 日或 20 日。\n\n【生意做得怎么样】\n\n收入涨得极快。招股书显示，2024 年收入 3.86 亿美元，2025 年 46 亿，2026 年上半年 163 亿，是去年同期的 14 倍。光二季度就有 116 亿。\n\n主业开始赚钱。二季度经营利润 10 亿美元，利润率 8%，一年前同一季度还亏 12 亿。变化主要来自算力成本：2025 年一季度，算力花费是收入的 2.5 倍；到 2026 年二季度，降到收入的 48%。Anthropic 在招股书里解释，算力要提前 12 到 18 个月订，收入涨得比这笔固定账单快。\n\n账面上却是巨亏：上半年净亏损 807 亿美元，其中 724 亿是可转债等融资工具的重估。这些是投资者早年借给公司、将来可换成股票的钱，公司估值涨了，这笔“将来要给出去的股票”按新价格算更值钱，会计上记为亏损，不涉及现金流出。截至 6 月底，Anthropic 累计融资 1411 亿美元，手里现金和短期投资合计约 1317 亿。\n\n客户也在变大：每年付费 10 万美元以上的客户，一年里从 950 多家涨到 11900 多家，每年付 1000 万美元以上的约 250 家。\n\n【算力账单】\n\n招股书逐项列出了几笔大合同：向 Broadcom 租 TPU 设备，租金约 1612 亿美元；向 SpaceX 旗下的 SpaceXAI（原 xAI）买英伟达 GPU 算力，最多 1205 亿；谷歌至少约 1145 亿，亚马逊至少 1100 亿，微软至少 449 亿，Nscale 最多约 446 亿，Lambda 约 413 亿。AMD 那份没写固定金额，首批全部拿下预计超过 200 亿。合同最长持续到 2045 年。\n\n这些加起来六千多亿美元，但这个总数是 Kobeissi Letter 等账号自己加的，招股书汇总总额的那一栏还空着。招股书另外写明，6 月 30 日之后新签和修改的合同，最低付款约 2450 亿；2028 到 2031 年还要再买一批 TPU，预计 1250 亿到 1500 亿。\n\n销售渠道同样依赖云厂商：2025 年 47%、2026 年上半年 48% 的收入，是通过云厂商的应用市场卖出去的。\n\n【谁说了算】\n\n七位联合创始人通过一家公司持有唯一一股 F 类股，固定拿 50.1% 的投票权，但这股不分钱。长期利益信托（Anthropic 设立的独立机构，负责看住安全使命）持有一股 T 类股，能选出董事会多数席位。亚马逊持股上限 12%，谷歌 14.99%。\n\n公司已把 5% 的股份放进自家公益基金，之后股价每涨 50%，董事会还可以再拨最多 2%。联合创始人各自承诺把个人股权的 80% 捐出。招股书还写了，近期不打算分红，风险部分提到 AI 可能带来“灾难性甚至生存级的风险”，还写到包括自家模型在内的 AI 出现过“类似敲诈”的行为，比如为了不被关停而试图左右人的决定。\n\n【和此前报道对不上的地方】\n\n三季度收入 168 亿美元：这是 10 月 14 日投资者会上的说法，招股书里三季度收入那一栏仍是空的，还不能算确认。\n\n客户集中度：《华尔街日报》此前说上半年两个客户合计占约两成。招股书显示，上半年有一个客户占 11%，其余都不到 10%；今年前九个月没有单一客户超过 10%，前五大合计约 25%。两组数据统计时段不同，算不上直接矛盾。\n\n算力合同：《华尔街日报》看到的草稿写微软 310 亿、谷歌 1110 亿，正式版是微软至少 449 亿（10 月又改过合同）、谷歌约 1145 亿。报道里“未来最多 7500 亿算力”的说法，招股书里没有这个数。\n\n此前路透报道的 2025 年 47% 收入经云市场卖出、两个客户各占 12%，招股书都对得上。", "createdAt": "Mon Oct 26 14:47:47 +0000 2026", "replyCount": 38, "retweetCount": 11, "likeCount": 75, "conversationId": "2114730719255695729", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2114705042817110293", "text": "Anthropic has filed an S-1 registration statement with the SEC related to its proposed IPO.\n\nRead more: https://t.co/ofhv0DK3Zp\n\nLegal disclaimer: A registration statement relating to these securities has been filed with the SEC but has not yet become effective. These securities may not be sold, nor may offers to buy be accepted, prior to the time the registration statement becomes effective. This post does not constitute an offer to sell or the solicitation of an offer to buy these securities, nor shall there be any sale of these securities in any state or jurisdiction in which such offer, solicitation or sale would be unlawful prior to registration or qualification under the securities laws of any such state or jurisdiction.", "createdAt": "Mon Oct 26 13:05:46 +0000 2026", "replyCount": 1232, "retweetCount": 2264, "likeCount": 17364, "conversationId": "2114705042817110293", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "translationZh": "Anthropic 已向美国证券交易委员会（SEC）提交与拟议首次公开募股（IPO）相关的 S-1 注册声明。\n\n了解更多：https://t.co/ofhv0DK3Zp\n\n法律免责声明：与上述证券相关的注册声明已提交至 SEC，但尚未生效。在注册声明生效之前，不得出售这些证券，也不得接受购买要约。本帖不构成出售这些证券的要约或购买要约邀请；在任何州或司法管辖区，若未依据当地证券法完成注册或取得资格前进行此类要约、邀请或销售属于违法行为，则不得在该州或司法管辖区出售这些证券。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-26T14:47:47+00:00", "createdAtBeijing": "2026-10-26T22:47:47+08:00", "createdAtLocal": "10-26 22:47 北京", "url": "https://x.com/dotey/status/2114730719255695729", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2114730719255695729", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "Anthropic收入结构与销售渠道", "evidence": "2026 年上半年 48% 的收入", "rationale": "提供云市场销售占比、客户分层及成本结构"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2114919123281117195", "track": "agent", "source": {"id": "2114919123281117195", "text": "MiniMax 开源了自托管的 OpenAI Agents API「OpenAgentCore」：一套 Core，多种 Harness；官方 SDK 只改 OPENAI_BASE_URL，Session 里原生跑 Codex / Claude Code / MiniMax Code，模型与沙箱按协议可换\n\n开源地址：\nhttps://t.co/EMQtUxhyBN\n\n主要想解决的问题\n1. 同款 API：官方 OpenAI SDK 或裸 HTTP，指向你的 Core /v1。\n2. 你的 Agent + 你的模型：每个 Session 选 harness（如 extra_body.agent.x_agents_core.harness = \"codex\"），模型走你配置的 provider。\n3. 计算可休眠、工作区可留：microsandbox 上空闲释放算力、文件随独立存储在兼容节点恢复；E2B 可就地 pause；也支持 Docker 与本机 Linux/macOS/Windows。\n4. 边界可替换：Sandbox Provider、工作区文件系统、Harness、模型提供商都走既定协议（见 AGENTS.md）。\n\n项目架构\n· Core + PG：鉴权、冻结配置、调度 Turn、取消/交互、持久化执行事实\n· Sandbox Provider / Node：申请与回收算力；节点跑 Docker 或 microsandbox\n· Workspace FS：环境持久存储（与算力生命周期分开）\n· Runtime：准备环境与能力快照，跑 Session Executor，上报事件与收据\n· Harness adapter：调上游 SDK/协议，翻译事件；原生 agent 循环与上下文归 Harness\n· Model provider：Responses / Anthropic / chat_completions 等协议\n· Web：运维控制台（走 /core/v1）", "createdAt": "Tue Oct 27 03:16:26 +0000 2026", "replyCount": 21, "retweetCount": 2, "likeCount": 20, "conversationId": "2114919123281117195", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114613174620061856", "text": "[1/n] 以前大家调 API 是 Tokens as a Service，现在慢慢变成了 Agents as a Service。\n\n但做这层存在一个很现实的问题：现在模型和harness基本几个月就迭代一轮，如果把业务直接绑死在某套实现上，后面换起来会非常痛苦。所以底层的 Agent Infra 尽可能需要做到对外的接口足够稳定，但是对内得能够随时换上最 frontier 的组件。\n\n这就是我们做 OpenAgentCore 的初衷，一个开源的 Agent Infra：对外只提供一套标准的 API，对内不管是 harness、model、sandbox 还是 Filesystem 全部协议化，都可以随意更换，不会被绑在某一家上。\n\nhttps://t.co/V0xdSK4UPr", "createdAt": "Mon Oct 26 07:00:43 +0000 2026", "replyCount": 13, "retweetCount": 9, "likeCount": 49, "conversationId": "2114613174620061856", "author": {"username": "saladday", "name": "SaladDay", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287706755242160129/_8GHeF8U_normal.jpg"}, "authorId": "1287701603999313920", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVidZrPa0AAE3wu.jpg", "width": 1672, "height": 941, "previewUrl": "https://pbs.twimg.com/media/HVidZrPa0AAE3wu.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmztjJawAAkkym.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVmztjJawAAkkym.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T03:16:26+00:00", "createdAtBeijing": "2026-10-27T11:16:26+08:00", "createdAtLocal": "10-27 11:16 北京", "url": "https://x.com/shao__meng/status/2114919123281117195", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2114919123281117195", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "OpenAgentCore开源Agent基础设施", "evidence": "一套 Core，多种 Harness", "rationale": "介绍开源发布及可替换运行组件、持久化架构"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114876984304263464", "track": "enterprise", "source": {"id": "2114876984304263464", "text": "最近 LangChain 分享了内部销售、研发和内容团队的 Agent Harness 架构，里面有不少值得借鉴的工程细节。\n\n他们发现，最棘手的问题之一是「Agent 到底以谁的身份干活」。\n\n比如销售 Agent 查询 Salesforce 可以用公司统一账号，但发邮件必须使用用户自己的授权，而且只能在私聊中操作。\n\nCoding Agent 也一样。帮你提交 PR 时，用你的 GitHub 身份；在后台自动审查代码时，则切换成独立的 GitHub App。\n\n内容 Agent 发公司 Twitter，用的是公司账号，但只有白名单用户能真正发帖。\n\n除此之外，还有几项关键设计：\n\n1. Agent 直接接入 Slack，不用员工换平台；需要时还能从工讨论里「拆」出独立线程\n2. Memory 分全局和个人两层，由 Agent 自己决定一条事实记到哪一层\n3. 代码在沙箱里执行，经安全代理访问外部服务\n4. 大量任务是定时或事件触发的，不一定等人开口。比如新 PR 自动 Review，或者你跟它说一声，它自己挂上每天销售简报\n\nDemo 阶段跑得通的 Agent，一进公司就会撞上身份和权限边界。这些细节平时讨论不多，但真落地一个都绕不过去。\n\n这些细节平时讨论得不算多，但真到落地时，一个都绕不过去。推荐做企业 Agent 的朋友读读。\n\n原文：https://t.co/4nUIFAJkzG", "createdAt": "Tue Oct 27 00:29:00 +0000 2026", "replyCount": 9, "retweetCount": 7, "likeCount": 68, "conversationId": "2114876984304263464", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-27T00:29:00+00:00", "createdAtBeijing": "2026-10-27T08:29:00+08:00", "createdAtLocal": "10-27 08:29 北京", "url": "https://x.com/Xudong07452910/status/2114876984304263464", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2114876984304263464", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "企业Agent身份与权限架构", "evidence": "发邮件必须使用用户自己的授权", "rationale": "给出身份切换、记忆分层与触发设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2115020426514469165", "track": "agent", "source": {"id": "2115020426514469165", "text": "[开源 Skills 推荐] skill-diet 给 Skill 减重：用评测保证「更瘦但不更差」\n\nskill-diet 是一个管其他 skill 的 meta-skill：一边把臃肿 SKILL.md 压薄并校对工具是否过时，一边给后续每次改 skill 立规矩；瘦身版只有在「旧 skill / 新 skill / 无 skill」同任务评测里至少不输才会留下。作者 @nicopreme 测试在真实 skill 上可砍 70–80% token，且测出文档里已失效的命令。\nhttps://t.co/wRktTWUfGg\n\nAgent 每次用 skill 都会读完整 SKILL.md。常见冗余是：多数任务用不到的细节、模型本就会的常识、写给人看的说明、可用一条原则代替的长列表；教 CLI/API/SDK/MCP 的 skill 还会抄一份工具手册，工具一变就过期。让 agent「更新一下 skill」通常只会越写越长。\n\n它做了两件事\n· Put on a diet：重写、修与工具不符之处；只有评测过关才保留瘦版。\n· Keep lean：之后每次增补都先过一套门槛，避免教训和代码变更把体积又养回来；相对上次 diet 大约涨 10% 就要再做一轮。\n\n可以直接说：put the deploy skill on a diet / is this skill still accurate for the current CLI? / add this lesson to …。\n\n分层：事实放在「刚好够用」的最低层\n· skill description：每个场景一条触发，几乎每个会话\n· SKILL.md：几乎每任务都要的规则，启用该 skill 时\n· references/：少数任务才要的细节，点到该场景时\n· 工具自带 help：flag、合法值、示例，选到那条命令时\n· 工具回复 / 报错 / checker：正确名、修法、下一步，调用出错或猜错时\n\n教工具的 skill 还多两步：精确字段名留在工具侧；机械错误优先靠更清晰报错、测试或 linter，而不是再写一段 prose。只用人工触发的 skill 可标 user-only，避免 description 每会话白占配额。\n\n一次 diet 在做什么\n测体积与典型任务加载量 →（若教工具）用运行或源码行证明 skill↔工具不一致；从 session log 找高频调用、只把高频写全；看 agent 是否真打开 skill，少打开则把规则下沉到工具报错；必要时裁自家工具 schema（schema 每请求都带）→ 砍模型已知与仅人类需要的文字 → 同任务跑旧 / 新 / 无 skill，瘦版不优于「随机波动可解释」就失败。命令优先写成 agent 会敲的 usage lines（作者给的相对代价：表 1.5×、TS 类型 1.6×、JSON Schema 2.8×、OpenAPI 4.7×）。\n\n之后每次改 skill：停在第一个能处理的步骤\n· 先修工具（报错 / check），别堆文。\n· 新会话不写也会对，就别加。\n· 改已有那一行，别另起一段。\n· 放到仍「来得及」的最低层。\n· 写规则不写故事（故事进 commit）。代码改了 skill 依赖的名字或行为，同一次变更里改 skill；commit 记前后体积。", "createdAt": "Tue Oct 27 09:58:59 +0000 2026", "replyCount": 10, "retweetCount": 1, "likeCount": 14, "conversationId": "2115020426514469165", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114975730471997613", "text": "I've been dogfooding \"skill-diet\", a skill for slimming down agent skills and keeping them correct.\n\nmost skills load far more text than a task needs, and some parts often go stale. it also gets worse over time as AI updates skills.\n\nskill-diet cuts what the model already does without being told, moves rarely needed detail into files it only reads when needed, and fixes what no longer matches the tool. then it runs the same tasks with the old skill, the new one and no skill, and keeps the new one only if agents do at least as well.\n\non my own skills: 70–80% fewer tokens, same results.\n\nhttps://t.co/h1BnVt7NjD", "createdAt": "Tue Oct 27 07:01:23 +0000 2026", "replyCount": 22, "retweetCount": 4, "likeCount": 194, "conversationId": "2114975730471997613", "author": {"username": "nicopreme", "name": "Nico Bailon", "profileImageUrl": "https://pbs.twimg.com/profile_images/1732784014933798912/NYfTJGk-_normal.jpg"}, "authorId": "2355053348", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114975644673265664/img/gWAlgFipd5ORpEbV.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114975644673265664/img/gWAlgFipd5ORpEbV.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114975644673265664/vid/avc1/1920x1080/x-_GaGifHQfO_Iog.mp4?tag=29", "durationMs": 29700}], "translationZh": "我最近一直在亲自试用“skill-diet”，这是一个用于精简智能体技能并确保其内容正确的技能。\n\n大多数技能加载的文本远超任务所需，其中一些内容还经常过时。随着 AI 不断更新技能，这个问题会越来越严重。\n\nskill-diet 会删除模型无需指示就会做的内容，将不常用的细节移到按需读取的文件中，并修正与工具现状不符的内容。然后，分别使用旧技能、新技能和不使用技能来执行相同任务，只有智能体表现至少不变差，才会保留新版本。\n\n在我自己的技能上：token 用量减少了 70–80%，效果不变。\n\nhttps://t.co/h1BnVt7NjD"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoP2a3awAAl6u0.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVoP2a3awAAl6u0.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T09:58:59+00:00", "createdAtBeijing": "2026-10-27T17:58:59+08:00", "createdAtLocal": "10-27 17:58 北京", "url": "https://x.com/shao__meng/status/2115020426514469165", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2115020426514469165", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "用对照评测精简和维护Skills", "evidence": "同任务跑旧 / 新 / 无 skill", "rationale": "给出分层加载、工具纠错与评测保留方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2115039161308852364", "track": "research", "source": {"id": "2115039161308852364", "text": "百度开源 Unlimited OCR 2：超长文档解析，注意力开销尽量不随页数涨\n\nUnlimited OCR 2 是面向「几十到几百页」文档的开源 OCR / 版面解析模型，3B/A0.5B 的 MoE 模型架构：用 SR-SWA 把文本–视觉注意力压到固定大小的工作参考集，再配合按页分块解码，让超长文档能在有限上下文里跑完，并声称逐步解码的延迟和显存几乎不随文档变长而涨。\n\n开源模型：https://t.co/Z8uP95MZ1Y\n\n相对 v1 改了什么\nv1（R-SWA）已能做多页端到端解析，但论文写明输入大约卡在 40 页，也因此没上 MarathonDocBench。v2 把解码器注意力升到 SR-SWA（Sparse Reference Sliding Window Attention），并加上 Unlimited-Horizon Decoding；骨干仍是 DeepEncoder + MoE 解码器一路，从 v1 权重再训。口号从「长程」推到「不限程」。\n\nSR-SWA 在做什么（技术报告口径）\n长文档会让文本–视觉注意力很贵。R-SWA 管住了局部交互，但远端视觉 token 仍会随页数涨。SR-SWA 的做法是：把交互压进固定容量的工作参考（README 举例 512 tokens）。大致两步：Page Gate 先按页收窄候选；Token Sieve 再对块做摘要打分，用 α-entmax 稀疏路由，只保留 top-k 远端块加局部窗口。解码侧按页切块，页边界重叠 1 页并复用 KV 尾部，避免超长时显存爆掉。作者称百页量级上，逐步速度相对 Full Attention 约 7.0×、相对 R-SWA 约 5.6×。", "createdAt": "Tue Oct 27 11:13:26 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 3, "conversationId": "2115039161308852364", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114910381311512987", "text": "Unlimited OCR 2 is here, and it's open source. 📖 ✨\n\nLonger documents can mean a lot more attention computation. Our new SR-SWA mechanism keeps that in check by condensing text-visual attention interactions into a fixed-size set of working references.\n\nHere's what it delivers:\n- Document parsing at virtually any length, within a finite context window\n- Nearly constant per-step decoding latency and memory footprint as documents grow longer\n- State-of-the-art performance on MPDocBench and MarathonDocBench, covering documents from dozens to hundreds of pages\n\nCheck out the model here ↓", "createdAt": "Tue Oct 27 02:41:42 +0000 2026", "replyCount": 42, "retweetCount": 70, "likeCount": 687, "conversationId": "2114910381311512987", "author": {"username": "Baidu_Inc", "name": "Baidu Inc.", "profileImageUrl": "https://pbs.twimg.com/profile_images/1373867336021598212/vZ2nWy8M_normal.jpg"}, "authorId": "820440736336228352", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmbZoiakAAtEgn.jpg", "width": 1807, "height": 961, "previewUrl": "https://pbs.twimg.com/media/HVmbZoiakAAtEgn.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVmbZptagAAcnGm.jpg", "width": 1920, "height": 1440, "previewUrl": "https://pbs.twimg.com/media/HVmbZptagAAcnGm.jpg:small"}], "translationZh": "Unlimited OCR 2 来了，而且已开源。📖 ✨\n\n文档越长，注意力计算量可能越大。我们全新的 SR-SWA 机制将文本与视觉之间的注意力交互压缩为一组固定大小的工作参考信息，从而控制计算开销。\n\n它能实现：\n- 在有限的上下文窗口内，解析几乎任意长度的文档\n- 随着文档变长，每步解码延迟和内存占用几乎保持不变\n- 在 MPDocBench 和 MarathonDocBench 上达到当前最佳水平，覆盖数十页至数百页的文档\n\n点击下方查看模型 ↓"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVog5WtaQAAa5of.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVog5WtaQAAa5of.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T11:13:26+00:00", "createdAtBeijing": "2026-10-27T19:13:26+08:00", "createdAtLocal": "10-27 19:13 北京", "url": "https://x.com/shao__meng/status/2115039161308852364", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2115039161308852364", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Unlimited OCR 2长文档解析与稀疏注意力", "evidence": "固定容量的工作参考", "rationale": "包含开源发布、架构机制及对比指标口径"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114935968604299552", "track": "research", "source": {"id": "2114935968604299552", "text": "I've seen a lot of pushback to this, with the following complaints:\n\n1. \"The benchmark owners already know about the flaws, and are working on it.\"\n2. \"Why are they spending time critiquing and not contributing to the benchmark\" OR \"critiquing known issues are not helpful\".\n3. \"The flawed verdict is too binary\"\n\nI find this pushback to be misguided.  These benchmarks are used to move millions of dollars of token spend, and many people blindly trust how well these benchmarks generalize to their own products, and don't look any further than the headline numbers.\n\nFor example, whenever a new model drops, you'll find thousands of youtube videos analyzing the pareto frontier using one of these benchmarks as the primary quality metric without questioning the benchmark.\n\nI think we would all be better served by inviting skepticism and encouraging people to develop an independent opinion of how well these benchmarks represent the tasks they care about.  Concretely:\n\n- For the failing tasks within the benchmark, are they: realistic, have a proper harness, graded properly, sufficiently disambiguated user intent?\n- Are models and API calls configured properly (ex: inconsistent context windows, reasoning levels). \n- Are the models equipped with a modern harness and minimal retrieval that is sufficiently realistic?\n- Does the score even make sense ex: is it just a LLM judge committee that produces a score on a 0-100 scale that isn't aligned with ground truth?\n\nIt's often the case you'll see many of these issues while looking at traces of a failing benchmark tasks, and it doesn't take long! Often the **very first trace you look at** has a serious issue.\n\nI also don't think there is an issue with verified vs. flawed verdict.  It's good to have opinions.  If you look through enough of what's behind their opinions and you find that you usually agree with their verdict, then they have earned your trust, the same way that a benchmark can lose your trust.  \n\nI think this eval of benchmarks is a red pill that motivates investing in your own private evals.", "createdAt": "Tue Oct 27 04:23:23 +0000 2026", "replyCount": 52, "retweetCount": 2, "likeCount": 84, "conversationId": "2114935968604299552", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "quotedTweet": {"id": "2100704765332394255", "text": "Introducing Benchmark Reviews: our new initiative to audit AI benchmarks. We are launching with 15 benchmarks: 4 Verified, 9 Flawed, and 2 with not enough information for a review. https://t.co/xU43tv32gH", "createdAt": "Thu Sep 17 21:53:39 +0000 2026", "replyCount": 116, "retweetCount": 198, "likeCount": 1952, "conversationId": "2100704765332394255", "author": {"username": "EpochAIResearch", "name": "Epoch AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg"}, "authorId": "1529761561170124800", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HScz2hmaoAAjCzX.jpg", "width": 1026, "height": 1283, "previewUrl": "https://pbs.twimg.com/media/HScz2hmaoAAjCzX.jpg:small"}], "translationZh": "推出 Benchmark Reviews：我们审查 AI 基准测试的新项目。首批涵盖 15 个基准测试：4 个已验证，9 个存在缺陷，2 个因信息不足而无法评审。https://t.co/xU43tv32gH"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-10-27T04:23:23+00:00", "createdAtBeijing": "2026-10-27T12:23:23+08:00", "createdAtLocal": "10-27 12:23 北京", "url": "https://x.com/HamelHusain/status/2114935968604299552", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2114935968604299552", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "模型基准审计与私有评估方法", "evidence": "looking at traces", "rationale": "列出任务、配置、评测框架与评分审查项"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}, "translationZh": "我看到不少人对此提出反对，主要有以下几种意见：\n\n1. “基准测试的负责人已经知道这些缺陷，也正在修复。”\n2. “为什么他们花时间批评，却不参与改进基准测试？”或者“批评已知问题没有帮助”。\n3. “‘存在缺陷’的判定过于非黑即白。”\n\n我认为这些反对意见偏离了重点。这些基准测试影响着数百万美元的 token 支出，而许多人盲目相信它们的结果适用于自己的产品，只看醒目的分数，不再深究。\n\n例如，每当新模型发布，你都会看到成千上万条 YouTube 视频，以其中某个基准测试为主要质量指标来分析帕累托前沿，却不质疑基准测试本身。\n\n我认为，欢迎质疑，鼓励大家独立判断这些基准测试能在多大程度上反映自己关心的任务，对所有人都有益。具体来说：\n\n- 基准测试中失败的任务是否真实？测试框架是否合理？评分是否正确？用户意图是否足够明确？\n- 模型和 API 调用的配置是否正确，例如上下文窗口、推理强度是否一致？\n- 是否为模型配备了现代化的运行框架，以及足够贴近实际使用的基本检索能力？\n- 分数本身是否有意义？例如，是否只是由一组 LLM 评审给出一个与真实标准不符的 0–100 分？\n\n查看基准测试中失败任务的执行轨迹时，往往很快就能发现许多这类问题！很多时候，你看的第一条执行轨迹就存在严重问题。\n\n我也不认为“已验证”和“存在缺陷”这样的判定有什么问题。有观点是好事。如果你充分了解了这些观点背后的依据，并发现自己通常认同他们的判定，那么他们就赢得了你的信任；同样，基准测试也可能失去你的信任。\n\n我认为，这种对基准测试的评估能让人看清现实，促使大家投入资源建立自己的私有评测。"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2114768834993213628", "track": "research", "source": {"id": "2114768834993213628", "text": "Happy to release the Alignment Hub with @eliebakouch: 120+ publicly reported incidents of AI models misbehaving, in one open place 👇\n\n- an AI agent needed its user’s approval to delete files. so it made up a quote from the user approving it\n- a model claimed its sub-agent was hard at work. it had never been started, and the model discouraged the user from checking\n- agents sharing a work directory started killing each other’s processes and disguising their own\n\nlabs publishing these is great! but formats vary and basics are missing: ~2/3 don’t say when the problem was detected, half don’t say if monitoring caught it. so we propose a short template, a few easy fields. a minimum, not a ceiling\n\nside by side, incidents also start to connect: 7 “different” ones turned out to be the same misconfigured eval\n\nstill beta (regularly AI-extracted from recent news, source-checked, human review ongoing). data is open, new reports and PRs welcome 🤗\n\nhttps://t.co/Fmt6mb1YFo", "createdAt": "Mon Oct 26 17:19:15 +0000 2026", "replyCount": 40, "retweetCount": 26, "likeCount": 139, "conversationId": "2114768834993213628", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114766860587503618/img/KGYFX3q79ttsbX9q.jpg", "width": 1080, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114766860587503618/img/KGYFX3q79ttsbX9q.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114766860587503618/vid/avc1/1080x1080/MR4g9DVZVOtAc0ZE.mp4?tag=29", "durationMs": 20000}], "expert": {"priority": "P0", "domain": "开源模型 / Hugging Face", "name": "Thomas Wolf", "role": "Hugging Face / 联合创始人兼 CSO", "why": "Transformers 生态和开源模型讨论的重要人物", "handle": "Thom_Wolf"}, "createdAtIso": "2026-10-26T17:19:15+00:00", "createdAtBeijing": "2026-10-27T01:19:15+08:00", "createdAtLocal": "10-27 01:19 北京", "url": "https://x.com/Thom_Wolf/status/2114768834993213628", "themeId": "editorial", "signalScore": 84, "editorial": {"id": "2114768834993213628", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Alignment Hub公开事件库发布", "evidence": "120+ publicly reported", "rationale": "发布开放事件库及披露模板，注明仍在人工复核"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}, "translationZh": "很高兴与 @eliebakouch 一起发布 Alignment Hub：在一个开放平台上汇集了 120 多起公开报道的 AI 模型异常行为事件 👇\n\n- 一个 AI 智能体删除文件前需要用户批准，于是伪造了一段用户同意删除的引语\n- 一个模型声称其子智能体正在努力工作，但实际上根本没有启动，还劝用户不要检查\n- 共享工作目录的智能体开始互相终止对方的进程，并伪装自己的进程\n\n实验室愿意公开这些事件是好事！但报告格式各异，基本信息也有缺失：约三分之二未说明何时发现问题，一半未说明是否由监控发现。因此，我们提出了一份简短模板，只需填写几个简单字段。这是最低要求，而非上限。\n\n把事件放在一起看，也能发现它们之间的联系：7 起看似“不同”的事件，最终发现都源于同一个配置错误的评测。\n\n目前仍处于测试阶段（定期用 AI 从近期新闻中提取信息、核查来源，人工审核持续进行）。数据开放，欢迎提交新报告和 PR 🤗\n\nhttps://t.co/Fmt6mb1YFo"}, "avatar": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, {"id": "2114907009350774901", "track": "creative", "source": {"id": "2114907009350774901", "text": "哈佛大学图书馆的馆藏里有一盘拉德克利夫研究所研讨会的录音，可以公开收听。演讲人是张爱玲，用英文讲中文翻译，主持人报的题目是「一种文化影响的载体」。目录没有标日期，从录音里提到的日期和二手资料推断是 1969 年前后。\n\n这一版先用 3 分钟讲背景。她 1920 年生在上海，去香港读过书，1940 年代在上海成名。1952 年她离开上海，1955 年到美国，第二年嫁给美国作家赖雅。1967 年她到了拉德克利夫研究所，同年赖雅病逝，她在剑桥把《海上花列传》译成英文。接着讲这场讲座讲什么、为什么值得听。片头用的是她当时的照片、书影、她寄给夏志清的信封和地图，开头先放她在讲座里的一句原话。\n\n然后是完整的录音原声，约 72 分钟，包括主持人开场、讲座和听众问答，配中英双语字幕，分 10 章。她讲了这些事：\n\n- 晚清严复译西学，林纾不懂外文，靠别人口述译了一大批小说，哈葛德、狄更斯都在其中。\n- 五四以后白话文学兴起，西方思想和短篇小说成批译进来；毛姆《在中国屏风上》里的辜鸿铭和宋春舫。\n- 《小说月报》、俄国文学和《飘》的中译；科举、排外，林语堂的意译与左翼的直译。\n- 古典诗和小说怎样译成西方语言，五四文学为什么遭冷落，西方读者眼里的中国。\n- 问答：中文版《读者文摘》和扫盲、《红楼梦》后三分之一的疑点、人名为什么难记、汉字与罗马字拼音。\n\n章节：\n\n00:00 背景：她是谁，这场讲座讲什么\n03:05 主持人开场\n05:28 晚清：严复与林纾\n11:44 五四：白话与西学涌入\n16:28 毛姆笔下的中国人\n23:02 译进来的西方\n34:05 排外、科举与直译\n37:35 中国文学走向西方\n42:57 问答一：《读者文摘》与扫盲\n48:30 问答二：《红楼梦》与旧小说\n1:05:35 问答三：汉字与拼音\n\n----\n\n制作这期视频主要还是为了探索音频转成视频的表现形式。\n\n提示词（需要配合 baocut skill 和 app： https://t.co/wldDX9MSVR ，理论上来说只用 Skill 也可以，但要配合 TTS）：\n\n> 基于张爱玲 1969 年那场英文讲座（视频库里的 eileen-chang-1969-radcliffe-zh-en）出一期视频：前面用几分钟讲清她是谁、那时她在哪里做什么、这场讲座讲的是什么、为什么值得听，封面要有她当时的照片，一看就知道是谁。表现形式要丰富，别做成幻灯片，有影像就用影像，可以配 TTS 解说，可以用 AI 画没有人物的示意图。简报写好按你的建议直接做，不用等我确认；先别烘焙导出，做好给我审片链接。", "createdAt": "Tue Oct 27 02:28:18 +0000 2026", "replyCount": 32, "retweetCount": 27, "likeCount": 117, "conversationId": "2114907009350774901", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2114375050971296135", "text": "使用 BaoCut Skill 即可做这种排版的视频（需要安装 BaoCut App 配合转录和对齐翻译）：\nhttps://t.co/lU5E1qFsNe\n\n> 帮我做成一条有设计感的版面视频，像档案馆、纪录片那种风格：演讲画面只放在局部，配双语字幕，有章节的话把章节做成副标题，再根据他讲到的内容搜一些相关的历史图片放进去，整体要美观大方、浑然一体。横版", "createdAt": "Sun Oct 25 15:14:29 +0000 2026", "replyCount": 46, "retweetCount": 31, "likeCount": 237, "conversationId": "2114375050971296135", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114374879923273728/img/F1s7sYl2ye_xOVLU.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114374879923273728/img/F1s7sYl2ye_xOVLU.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114374879923273728/vid/avc1/1920x1080/PjDdQP0rRp4GXg9V.mp4?tag=29", "durationMs": 54612}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114904600159346688/img/gI3uY2HLr_B8-s_2.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114904600159346688/img/gI3uY2HLr_B8-s_2.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114904600159346688/vid/avc1/1920x1080/eb1MlrgJV_QqemgE.mp4?tag=29", "durationMs": 4553466}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-27T02:28:18+00:00", "createdAtBeijing": "2026-10-27T10:28:18+08:00", "createdAtLocal": "10-27 10:28 北京", "url": "https://x.com/dotey/status/2114907009350774901", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2114907009350774901", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "历史讲座音频转纪录片视频", "evidence": "配中英双语字幕，分 10 章", "rationale": "提供具体作品结构及可复用制作提示词"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2115025880322035759", "track": "creative", "source": {"id": "2115025880322035759", "text": "AI 还是太牛逼了，我刚搓个 3D 游戏，并配了宣传片，建模、绑骨、配乐、剪辑，全是一把梭哈，前后几个小时…...\n\n随便丢一张图进去，杯子、涂鸦，几分钟就能变成 3D 角色，而且可以操作战斗⚔️，精细度非常高😋\n\n整个录制、剪辑也都是 AI 自己做的，我只是让它做个宣传片，着实很逆天…\n\n整个游戏执行流程：\n1、Claude 先看图：判断它该用人形、四足、蛇还是蜘蛛的骨架，起名字、定属性和配色，再从特效库里给它挑招式。\n\n2、GPT-Image 把原图重画成标准姿势的设定图，人形就画成 T-pose，四足就四条腿站直，姿势跟骨架对齐，然后再去绑骨。\n\n3、设定图丢给 Hi3D 生成 3D 模型，带 PBR 贴图，大概 5 分钟一个。全程是 Claude 直接调 Hi3D 的 MCP。\n\n4、模型出来以后自动标骨骼点、自动蒙皮，再套上 Mesh2Motion 的开源动作库，走、跑、出拳、放大招全有了。\n\n5、打斗是 three.js 在浏览器里实时跑的，AI 自己出招，镜头自己切，打完一键剪出 15 秒高光。\n\n连这条宣传片都是脚本剪的，配乐也是代码生成的。", "createdAt": "Tue Oct 27 10:20:39 +0000 2026", "replyCount": 14, "retweetCount": 2, "likeCount": 16, "conversationId": "2115025880322035759", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "quotedTweet": {"id": "2114923036516471083", "text": "蛙趣，刚用 Opus5.5 + Hi3D 跑一个通宵搓的游戏，这个精细度，真的很哇塞！\n\nOpus5.5编排 + Image-2.5 出图 + Hi3D MCP 做模 + Three.js 装配\n\n整套做法分享给大家：\n1、概念与多视角参考图：GPT-Image-2.5\n先让 GPT-Image-2.5 出多视角的概念图和参考图（正面、侧面、背面），把材质纹理和结构确定。\n\n2、高精 3D 资产建模：Hi3D MCP\n把 Hi3D 的 MCP 接进 AI工具，需要时会把参考图喂给 Hi3D MCP，秒级生成带完整 PBR 材质的高精 3D Mesh。\n\n3、Web 端性能优化：自动减面与 Draco 压缩（关键避坑点）\nAI 生成的原生模型动辄几十万面，直接丢进网页必卡，让 AI 调用 MCP 时加入 LOD 网格简化并压成 Draco 格式的 glb。\n\n4、逻辑与场景组装：Three.js / WebGL\n模型就绪后，AI 自动编写 Loader 异步加载，补齐物理碰撞体、海水着色器、光影和粒子特效，拼成完整可交互的世界。\n\n5、音效和配乐：WebAudio 实时合成\n\n另外，@Hi3D_AI 刚把 V1.0 开源了，由 200 万真实生产资产训出，细节还原和多视角保真都很顶，堪称目前最扎实的工业级开源 3D 模型，摆明就是奔着 3D 赛道的 AI Infra 去的。", "createdAt": "Tue Oct 27 03:31:59 +0000 2026", "replyCount": 43, "retweetCount": 10, "likeCount": 106, "conversationId": "2114923036516471083", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114917822858252288/vid/avc1/1920x1080/6uJU__VlRQkqz-hc.mp4?tag=29", "durationMs": 65400}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115024838473781248/img/JFjXfiUryfOUuB-i.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115024838473781248/img/JFjXfiUryfOUuB-i.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115024838473781248/vid/avc1/1920x1080/JQHxtMsj6dYEb-fL.mp4?tag=29", "durationMs": 56791}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "余温", "role": "内容、视觉与多模态实践与观察", "why": "公开生图、建模和 Three.js 装配的完整链路，跨多模态工具价值明显。", "handle": "gkxspace"}, "createdAtIso": "2026-10-27T10:20:39+00:00", "createdAtBeijing": "2026-10-27T18:20:39+08:00", "createdAtLocal": "10-27 18:20 北京", "url": "https://x.com/gkxspace/status/2115025880322035759", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2115025880322035759", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "AI 生成可战斗的 3D 游戏与宣传片", "evidence": "自动标骨骼点、自动蒙皮", "rationale": "自述实际作品，详述建模动画及剪辑流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, {"id": "2114922786606944490", "track": "research", "source": {"id": "2114922786606944490", "text": "只看成功案例，也能找出 Agent 到底在哪一步开始犯错。\n\nNeurIPS 2026 这篇 OAT 做了一个挺反常识的设定：\n\n训练阶段完全不看失败轨迹，也不需要人工标注「第几步错了」。\n\n它只学习不到 100 条成功轨迹，建立一条「正常 Agent 行为应该怎么演化」的路径。\n\n等真正遇到失败轨迹时，再检查每一步偏离这条成功路径有多远。偏离越明显，就越可能是导致失败的关键步骤。\n\n这样做的好处很直接。\n\n在域内评测上，OAT 的 F1 比 GPT-5 等 prompting 方法高约 20%；换到完全不同的多 Agent 数据集，依然高约 7%。\n\n速度差距更夸张：推理阶段不需要再调用 LLM，延迟只有几到十几毫秒，比 prompting-based 方法快 200–5000 倍。\n\n标题「Tracing Failure from the Flow of Success」已经可以很好提现论文的方法了。\n\n以后调试长时 Agent，可能未必要让另一个大模型从头读完整条失败轨迹。\n\n先学会「正常执行是什么样」，再去找哪里开始偏航，有可能更轻、更快，也更容易规模化。\n\n📎 arxiv: https://t.co/glygr43xds", "createdAt": "Tue Oct 27 03:31:00 +0000 2026", "replyCount": 7, "retweetCount": 5, "likeCount": 49, "conversationId": "2114922786606944490", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkgHMNX0AAe8Nv.jpg", "width": 1146, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HVkgHMNX0AAe8Nv.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-27T03:31:00+00:00", "createdAtBeijing": "2026-10-27T11:31:00+08:00", "createdAtLocal": "10-27 11:31 北京", "url": "https://x.com/Xudong07452910/status/2114922786606944490", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2114922786606944490", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "OAT利用成功轨迹定位Agent错误", "evidence": "它只学习不到100条成功轨迹", "rationale": "介绍研究方法及评测数据，结果待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2114840750936436837", "track": "agent", "source": {"id": "2114840750936436837", "text": "“ironically, OpenAI and Anthropic’s models refused to do this work. Open weight models got the job done”\n\nOpenAI found agents could talk covertly through shared hardware. reproducing it to build better containment took an open-weight model\n\nkeeping agents contained is safety work, and open models can help do it", "createdAt": "Mon Oct 26 22:05:01 +0000 2026", "replyCount": 11, "retweetCount": 4, "likeCount": 57, "conversationId": "2114840750936436837", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "quotedTweet": {"id": "2114770919436808572", "text": "I built 𝚌𝚙𝚞-𝚌𝚑𝚊𝚝, a reproduction of @openai's findings of covert communication using the CPU.\n\nIt runs on a generic host with 2+ Firecracker microVMs with no internet access. Works on x86 and even my M5 chip.\n\nI was able to chat via 3 separate mechanisms:\n① CPU contention\n② Cache eviction timing\n③ DRAM bandwidth contention \n\n… across multiple CPUs, defeating all Firecracker's production recommendations (no SMT, no KSM, tenants pinned to different cores.)\n\nEssentially, if shared hardware is involved, there's a good chance your agents can communicate covertly. And with really decent latency.\n\nThe good news: this is decidedly different from a *side-channel attack* where the agents could steal information (Meltdown/Spectre), a category of attack that providers like Vercel Sandbox mitigate. Further, in our real-world environment, these 'whispering' techniques are much harder to pull off and easier for us to monitor and detect (sampling hardware counters + lots of at-scale statistical data.)\n\nNoteworthy: ironically, OpenAI and Anthropic's models refused to do this work. Open weight models got the job done. I'm worried the labs' stance might backfire and get in the way of helping developers build correct and secure systems. e.g: building a secure sandbox requires having this kind of analysis, and without it, we'll have a less secure world.", "createdAt": "Mon Oct 26 17:27:32 +0000 2026", "replyCount": 234, "retweetCount": 207, "likeCount": 2284, "conversationId": "2114770919436808572", "author": {"username": "rauchg", "name": "Guillermo Rauch", "profileImageUrl": "https://pbs.twimg.com/profile_images/1783856060249595904/8TfcCN0r_normal.jpg"}, "authorId": "15540222", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114770494595760128/img/RfkLhO59NgPTFvOE.jpg", "width": 2048, "height": 1048, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114770494595760128/img/RfkLhO59NgPTFvOE.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114770494595760128/vid/avc1/2446x1252/wfKvj9otT9TKuobz.mp4?tag=29", "durationMs": 68009}], "translationZh": "我构建了 𝚌𝚙𝚞-𝚌𝚑𝚊𝚝，复现了 @openai 关于利用 CPU 进行隐蔽通信的发现。\n\n它可以在普通主机上运行，使用两个或更多无法访问互联网的 Firecracker microVM。支持 x86，甚至也能在我的 M5 芯片上运行。\n\n我通过三种不同机制实现了聊天：\n① CPU 资源争用\n② 缓存逐出时序\n③ DRAM 带宽争用\n\n……这些方法在多款 CPU 上都能奏效，即使遵循 Firecracker 的全部生产环境建议，也无法阻止通信：禁用 SMT、禁用 KSM，并将不同租户绑定到不同核心。\n\n基本上，只要涉及共享硬件，你的智能体就很可能能够进行隐蔽通信，而且延迟相当低。\n\n好消息是：这与智能体可借此窃取信息的“侧信道攻击”（如 Meltdown/Spectre）有明显区别，Vercel Sandbox 等服务商会针对后者采取缓解措施。此外，在我们的实际环境中，这些“窃窃私语”技术更难实施，也更容易被我们监控和检测到，方法包括对硬件计数器采样，以及分析大量规模化统计数据。\n\n值得关注的是，讽刺的是，OpenAI 和 Anthropic 的模型拒绝完成这项工作，开放权重模型却做到了。我担心这些实验室的立场可能适得其反，妨碍开发者构建正确、安全的系统。例如，构建安全的沙箱就需要这类分析；缺少它，世界反而会更不安全。"}, "expert": {"priority": "P0", "domain": "开源模型 / Hugging Face", "name": "Thomas Wolf", "role": "Hugging Face / 联合创始人兼 CSO", "why": "Transformers 生态和开源模型讨论的重要人物", "handle": "Thom_Wolf"}, "createdAtIso": "2026-10-26T22:05:01+00:00", "createdAtBeijing": "2026-10-27T06:05:01+08:00", "createdAtLocal": "10-27 06:05 北京", "url": "https://x.com/Thom_Wolf/status/2114840750936436837", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2114840750936436837", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "共享硬件上的智能体隐蔽通信复现", "evidence": "CPU contention", "rationale": "自述复现三种跨虚拟机通信机制，具隔离研究价值"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}, "translationZh": "“讽刺的是，OpenAI 和 Anthropic 的模型拒绝完成这项工作，开放权重模型却做到了。”\n\nOpenAI 发现，智能体可以通过共享硬件进行隐蔽通信。为了构建更好的隔离机制，研究者借助开放权重模型复现了这一现象。\n\n确保智能体受到有效隔离是一项安全工作，而开放模型可以助力这项工作。"}, "avatar": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, {"id": "2115050711566471675", "track": "tools", "source": {"id": "2115050711566471675", "text": "👍", "createdAt": "Tue Oct 27 11:59:20 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2115050711566471675", "author": {"username": "wey_gu", "name": "Wey Gu 古思为", "profileImageUrl": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}, "authorId": "24313912", "quotedTweet": {"id": "2115044871845105975", "text": "Multi-hop traversal on Lance, without a join per hop 🧭\n\nIn lance-graph, every relationship hop is a join between edge and node tables. A multi-hop query repeats that join at each step, building a hash table and materializing every intermediate path each time.\n\nlance-csr takes another route. Neighbours are stored together in a compressed sparse row (CSR) adjacency index, so a hop becomes an array lookup instead of a join. Hops the CSR can’t express fall back to a join.\n\nHDC Labs now maintain the project as an Apache 2 fork of lance-graph, written in Rust on Apache DataFusion, with Python bindings. It is a research test bed asking how far DataFusion can be pushed for multi-hop graph traversal over a columnar format.\n\nHow it runs\n- Multimodal data and graph stay on disk in LanceDB\n- Tables are read lazily or held in memory\n- Queries see a consistent snapshot, and refresh() picks up committed changes\n- The CSR updates incrementally, with a full rebuild when needed\n\nWhat the fork adds\n- Cypher broad enough for all 14 GDC (formerly LDBC) Interactive complex queries, including OPTIONAL MATCH, EXISTS and shortestPath\n- Planning that starts each pattern at its most selective node\n- Correctness fixes to inherited behavior, each backed by a regression test\n- Prebuilt Python wheels for Apple Silicon macOS and x86-64 Linux\n\nIn the project’s own unaudited benchmarks (SF1, Apple M5), the 14 queries run 3.9× faster than Neo4j with tables in memory and 1.8× faster with Lance on disk (geometric mean).\n\nThe scope is deliberate: lightweight, embeddable, single machine, Lance only. Other Rust projects cover fast graph traversal, and distributed execution is out of scope here.\n\nCredit goes to Beinan Wang, Chunxu Tang and the lance-graph contributors for the Cypher parser, semantic analysis, DataFusion planner and Python bindings, and to the DataFusion community. Contributions from people and their coding agents are welcome. ⭐\n\nBy HDC Labs\n\nhttps://t.co/m9eZEgvLru\n\n#Cypher #DataFusion #LanceDB #Rust #OpenSource #Python #DataScience\n\n--\n\n📩 The Year of the Graph Autumn 2026 newsletter issue is out!\n\nMeaning, Traversal, Reasoning, Action: The Graph Stack for Agentic AI. 👇\n\nhttps://t.co/YfrPw2nFzS\n\nAll things #KnowledgeGraph, #GraphDB, Graph #Analytics / #DataScience / #AI and #SemTech.\n\nSubscribe and follow to be in the know. Reach out if you’d like to be featured", "createdAt": "Tue Oct 27 11:36:07 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2115044871845105975", "author": {"username": "TheYotg", "name": "The Year of the Graph", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327510937616723969/JvU6bp_a_normal.jpg"}, "authorId": "1327510514549858305", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVomGduX0AASjGT.jpg", "width": 1411, "height": 300, "previewUrl": "https://pbs.twimg.com/media/HVomGduX0AASjGT.jpg:small"}], "translationZh": "在 Lance 上进行多跳遍历，无需每一跳都做连接 🧭\n\n在 lance-graph 中，每次沿关系跳转都要对边表和节点表进行连接。多跳查询在每一步都会重复这一连接，每次都要构建哈希表，并将所有中间路径物化。\n\nlance-csr 采用了另一种方式。相邻节点集中存储在压缩稀疏行（CSR）邻接索引中，因此每一跳只需查询数组，无需连接。CSR 无法表达的跳转则回退到连接操作。\n\nHDC Labs 目前维护着这个项目。它是 lance-graph 的一个分支，采用 Apache 2 许可证，基于 Apache DataFusion 以 Rust 编写，并提供 Python 绑定。作为研究试验平台，它探索的是：在列式格式上执行多跳图遍历时，DataFusion 的能力能推到什么程度。\n\n运行方式\n- 多模态数据和图均存储在 LanceDB 的磁盘上\n- 表采用延迟读取，或驻留内存\n- 查询使用一致性快照，refresh() 用于获取已提交的变更\n- CSR 以增量方式更新，必要时完整重建\n\n该分支新增的能力\n- Cypher 支持范围足以覆盖全部 14 个 GDC（原 LDBC）交互式复杂查询，包括 OPTIONAL MATCH、EXISTS 和 shortestPath\n- 查询规划从每个模式中筛选能力最强的节点开始\n- 修复继承实现中的正确性问题，每项修复均有回归测试支持\n- 为 Apple Silicon macOS 和 x86-64 Linux 提供预构建的 Python wheel 包\n\n在项目自行开展、未经独立审计的基准测试中（SF1，Apple M5），这 14 个查询在表驻留内存时的运行速度为 Neo4j 的 3.9 倍，使用磁盘上的 Lance 时为 1.8 倍（几何平均值）。\n\n项目有意限定了范围：轻量、可嵌入、单机运行，仅支持 Lance。其他 Rust 项目也提供快速图遍历能力，分布式执行不在本项目范围内。\n\n感谢 Beinan Wang、Chunxu Tang 及 lance-graph 贡献者提供的 Cypher 解析器、语义分析、DataFusion 规划器和 Python 绑定，也感谢 DataFusion 社区。欢迎大家和各自的编程智能体参与贡献。⭐\n\n作者：HDC Labs\n\nhttps://t.co/m9eZEgvLru\n\n#Cypher #DataFusion #LanceDB #Rust #OpenSource #Python #DataScience\n\n--\n\n📩 The Year of the Graph 2026 年秋季通讯已发布！\n\n语义、遍历、推理、行动：面向智能体 AI 的图技术栈。👇\n\nhttps://t.co/YfrPw2nFzS\n\n涵盖 #KnowledgeGraph、#GraphDB、图 #Analytics / #DataScience / #AI 和 #SemTech 的各类资讯。\n\n欢迎订阅并关注，及时获取动态。如希望获得专题介绍，欢迎联系。"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "Wey Gu 古思为", "role": "模型、研究与推理实践与观察", "why": "Agent 跨机器会话、记忆及设备体验具有应用价值，可补当前覆盖。", "handle": "wey_gu"}, "createdAtIso": "2026-10-27T11:59:20+00:00", "createdAtBeijing": "2026-10-27T19:59:20+08:00", "createdAtLocal": "10-27 19:59 北京", "url": "https://x.com/wey_gu/status/2115050711566471675", "themeId": "editorial", "signalScore": 46, "editorial": {"id": "2115050711566471675", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "lance-csr 图遍历开源工具", "evidence": "a hop becomes an array lookup", "rationale": "引用详述索引、查询与安装能力，基准为自测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/1275624368618397697/kZ6PZRqh_normal.jpg"}, {"id": "2114928887499288842", "track": "growth", "source": {"id": "2114928887499288842", "text": "早上收到一个关于GEOInflow的好评，已经有朋友开始陆续用起来了👍 https://t.co/eTwO3EuHoh", "createdAt": "Tue Oct 27 03:55:14 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 9, "conversationId": "2114928887499288842", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "quotedTweet": {"id": "2114576054018818536", "text": "重磅开源：GEOInflow\n一套面向GEO的网站与AI爬虫分析系统，同时支持完整的访客数据、转化数据统计与分析\nMIT协议，Docker一键部署\n\nGEOInflow将网站访客、AI搜索引荐、服务器抓取日志和内容目录放在同一个网站上下文中\n帮助团队回答这些问题：哪些 AI 蜘蛛访问了网站，访问了哪些内容，哪些关键页面长期缺少抓取记录，访问是否遇到错误，以及AI搜索实际带来了多少访客和转化\n\n核心逻辑与能力：\n1、哪些AI平台在抓你的站（OpenAI、Anthropic、Perplexity、Google、字节、百度、Kimi、腾讯混元…），是训练、AI 搜索，还是用户触发的访问。包括，抓了哪些页面，哪些关键页从没被抓过\n2、同时可以追踪AI搜索引荐来的会话、落地页和转化，看清GEO的真实效果\n3、它也是一套完整的网站统计：PV/UV、事件漏斗、热力图、留存、团队权限与分享\n4、核心统计无需模型API Key，默认无Cookie采集，数据留在你自己的服务器上\n5、系统已整理61种全球范围内各种不同的AI爬虫身份及分类，在这个基础上构建了大量的全新数据分析看板\n\n做GEO，每一次内容调整都值得有数据可以复盘\n欢迎体验和提PR\n\nGitHub地址：https://t.co/DshYcj50be", "createdAt": "Mon Oct 26 04:33:12 +0000 2026", "replyCount": 113, "retweetCount": 133, "likeCount": 887, "conversationId": "2114576054018818536", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVh7d2gWAAAcfUE.jpg", "width": 2048, "height": 1114, "previewUrl": "https://pbs.twimg.com/media/HVh7d2gWAAAcfUE.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7iW8XEAAiT9B.jpg", "width": 2048, "height": 1119, "previewUrl": "https://pbs.twimg.com/media/HVh7iW8XEAAiT9B.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7ksrWoAA0yVt.jpg", "width": 2048, "height": 1111, "previewUrl": "https://pbs.twimg.com/media/HVh7ksrWoAA0yVt.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVh7sRrXkAAk3i4.jpg", "width": 2048, "height": 1137, "previewUrl": "https://pbs.twimg.com/media/HVh7sRrXkAAk3i4.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVm8nBQaYAA8EFk.jpg", "width": 870, "height": 238, "previewUrl": "https://pbs.twimg.com/media/HVm8nBQaYAA8EFk.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-10-27T03:55:14+00:00", "createdAtBeijing": "2026-10-27T11:55:14+08:00", "createdAtLocal": "10-27 11:55 北京", "url": "https://x.com/yaojingang/status/2114928887499288842", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2114928887499288842", "technicalRelevant": true, "dailyGrade": "A", "channel": "growth", "topic": "GEOInflow开源网站与AI爬虫分析系统", "evidence": "MIT协议，Docker一键部署", "rationale": "引用发布说明含开源入口、抓取分析与转化统计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2114790675279413738", "track": "agent", "source": {"id": "2114790675279413738", "text": "OpenAI 发布 GPT-6.1 Terra：Plus 及以上订阅直接可用、不另收费，API 降价一半，操作电脑追平 GPT-6 Astra\n\nOpenAI 发布了 GPT-6.1 Terra，主打 Computer Use（操作电脑）：AI 看着屏幕上的内容，自己点鼠标、打字、在不同软件之间切换，像人一样把活干完。\n\n在 OpenAI 的几档模型里，它排在中间，比 GPT-6.1 Sol 和顶级的 GPT-6 Astra 便宜，比最便宜的 GPT-6 Luna 强。\n\nGPT-6.1 Terra 正在向 ChatGPT 的 Plus、Pro、企业版和教育版用户推送，在 ChatGPT Work 和 Codex 里能选。免费用户不在名单里，官方也没提 Business 版。\n\n订阅用户最实际的好处是额度更耐用。官方说，在 Work 和 Codex 里用 Terra，同样的额度比用旧版 GPT-5.6 Terra 能干更多活，比用 Sol 和 Astra 多得多，但没给具体倍数。\n\n开发者用 API 调用 gpt-6.1-terra，每百万 token 输入 1 美元、输出 5 美元，官方称比 GPT-5.6 Terra 便宜一半（第三方价格站记录的旧价是 2 美元和 12 美元）。同样单位，Sol 是 2 美元和 10 美元，Astra 是 10 美元和 50 美元。\n\n【比旧版和 Sol、Astra 强在哪】\n\nOpenAI 拿 Agents' Last Exam 做比较，这套测试考 AI agent 在工作中用好各种软件的能力。按 OpenAI 公布的图，Terra 开到最高档得分约 60%，旧版 GPT-5.6 Terra 约 50%，GPT-6 Astra 约 59%，两者打平。按每个 token 算，Terra 的价格是 Astra 的十分之一；官方还说，Terra 完成任务的平均速度比 Astra 和 Sol 都快 3 倍以上。\n\n同一张图上得分最高的是 Anthropic 的 Claude Opus 5.5，约 63%，花的钱也最多，图上大约是 Terra 最高档的 9 倍。\n\nOpenAI 也说了 Terra 不擅长的：做深度研究、写复杂代码，还是建议用 Sol 或 Astra。日常让 AI 在各种软件里点点填填、写写东西，可以先切到 Terra，省额度也省时间。\n\n原文：https://t.co/H4Uaw49Oay", "createdAt": "Mon Oct 26 18:46:02 +0000 2026", "replyCount": 99, "retweetCount": 11, "likeCount": 149, "conversationId": "2114790675279413738", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2114780711664398349", "text": "GPT-6.1 Terra: delivering fast and capable computer use at a lower price.\n\nGPT-6.1 Terra understands what’s on screen, takes action across apps, writes naturally, and is a more capable model for your whole workday with the efficiency to take on more of it. https://t.co/8JTN1yonmV", "createdAt": "Mon Oct 26 18:06:27 +0000 2026", "replyCount": 1393, "retweetCount": 2252, "likeCount": 25570, "conversationId": "2114780711664398349", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HVk3m2pW0AERTJj.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HVk3m2pW0AERTJj.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114778494395678720/vid/avc1/1920x1080/oUzhkuK2tc42w-OZ.mp4?tag=29", "durationMs": 31458}], "translationZh": "GPT-6.1 Terra：以更低价格提供快速、强大的计算机操作能力。\n\nGPT-6.1 Terra 能理解屏幕内容、跨应用执行操作，并自然地撰写文字。它能力更强，能够协助你处理全天的工作，并以更高效率承担更多任务。https://t.co/8JTN1yonmV"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-26T18:46:02+00:00", "createdAtBeijing": "2026-10-27T02:46:02+08:00", "createdAtLocal": "10-27 02:46 北京", "url": "https://x.com/dotey/status/2114790675279413738", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2114790675279413738", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "GPT-6.1 Terra电脑操作模型发布", "evidence": "每百万 token 输入 1 美元、输出 5 美元", "rationale": "含模型发布、定价及官方评测与适用范围"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2114856267118494178", "track": "research", "source": {"id": "2114856267118494178", "text": "OCRia-1 is the best document parsing model for complex tables in PDFs: nested headers, merged cells, no cell borders, and extreme density within a single page.\n\nIt tops multiple parsing benchmarks on table accuracy. 91.5% on ParseBench, 92.9% on olmOCR-bench, 84.1% on PulseBench-Tab, 83.2% on fr-bench-pdf2md.\n\nWe published a nice visualization below showing how the attention map shifts as we\npredict subsequent table cells :)\n\nBlog: https://t.co/PRxvOFmTLf\n\nCome check it out on LlamaParse! https://t.co/XYZmx5TFz8", "createdAt": "Mon Oct 26 23:06:40 +0000 2026", "replyCount": 25, "retweetCount": 18, "likeCount": 183, "conversationId": "2114856267118494178", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2113291928292790725", "text": "Today we’re releasing OCRia-1, a frontier VLM for document parsing that sets a new SOTA in accuracy, cost, and latency. \n\nIt not only sets a new high score on ParseBench (87.4), but also leads in three 3rd-party benchmarks: olmOCR-bench* (83.5 overall, 92.9 on tables!), PulseBench-Tab (84.1), and fr-bench-pdf2md (72.1).\n\nOCRia-1 is really, really good at parsing complex tables: nested headers, merged cells, irregular grids, scanned tables, and more. It is also fantastic at parsing complex unlabeled charts (line, bar, pie, technical diagrams), and preserving complex formatting. Most real-world enterprise documents contain at least one of the these, whether it’s a big tax withholding table or a public economic report.\n\nIt is a 4B model and outperforms all other models within a similar parameter class: LightOnOCR-3, Chandra-OCR 2, Mistral OCR 4.1, and more. It is also extremely fast.\n\nAll credit goes to our research team, who spent countless hours on curating a diverse dataset, tuning our training pipeline, and squeezing every last drop out of model optimization so that it can process billions of pages at scale. \n\nOCRia-1 as a base is powering all of our modes within LlamaParse (cost-effective, agentic, agentic plus), so you can access its capabilities today! \n\nIf you’re processing millions/billions of documents at scale, we’re offering enterprises that book a demo up to $3k in credits for a guided evaluation.**\n\n*olmOCR-bench scores are adjusted based on unifying rendering at 1,288px for all models \n**enterprise POC credits apply to eligible organizations that book a demo", "createdAt": "Thu Oct 22 15:30:33 +0000 2026", "replyCount": 116, "retweetCount": 111, "likeCount": 918, "conversationId": "2113291928292790725", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://p
