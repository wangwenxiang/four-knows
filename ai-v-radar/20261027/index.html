bs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2113291822562721792/pu/img/aFE0Q04DhH_id6Io.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/ext_tw_video_thumb/2113291822562721792/pu/img/aFE0Q04DhH_id6Io.jpg:small", "videoUrl": "https://video.twimg.com/ext_tw_video/2113291822562721792/pu/vid/avc1/1280x720/SAhr35kniTRlZfvw.mp4?tag=12", "durationMs": 52733}], "translationZh": "今天，我们发布 OCRia-1，这是一款面向文档解析的前沿视觉语言模型，在准确率、成本和延迟方面树立了新标杆。\n\n它不仅刷新了 ParseBench 的最高分（87.4），还在三项第三方基准测试中领先：olmOCR-bench*（总分 83.5，表格项高达 92.9！）、PulseBench-Tab（84.1）和 fr-bench-pdf2md（72.1）。\n\nOCRia-1 极其擅长解析复杂表格，包括嵌套表头、合并单元格、不规则网格、扫描表格等。它也非常擅长解析复杂的无标签图表（折线图、柱状图、饼图、技术示意图），并保留复杂格式。现实中的企业文档大多至少包含其中一种，无论是大型代扣税款表，还是公开的经济报告。\n\n这是一款 4B 模型，表现超越了所有同等参数规模的其他模型，包括 LightOnOCR-3、Chandra-OCR 2、Mistral OCR 4.1 等，而且速度极快。\n\n这一切都归功于我们的研究团队。他们投入了无数时间，精心整理多样化数据集、调优训练流程，并将模型优化做到极致，使其能够大规模处理数十亿页文档。\n\nOCRia-1 已作为底层模型，为 LlamaParse 的所有模式（cost-effective、agentic、agentic plus）提供支持，今天就能体验它的能力！\n\n如果你需要大规模处理数百万乃至数十亿份文档，我们将为预约演示的企业提供最高 3,000 美元的额度，用于在指导下开展评估。**\n\n*olmOCR-bench 分数经过调整，所有模型均统一以 1,288px 渲染。\n**企业概念验证（POC）额度适用于预约演示且符合条件的机构。"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114856162780958720/img/ufK745ewJFDQjIfP.jpg", "width": 1564, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114856162780958720/img/ufK745ewJFDQjIfP.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114856162780958720/vid/avc1/1564x1080/eV7AM5K73f-zvTu4.mp4?tag=29", "durationMs": 27654}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-10-26T23:06:40+00:00", "createdAtBeijing": "2026-10-27T07:06:40+08:00", "createdAtLocal": "10-27 07:06 北京", "url": "https://x.com/jerryjliu0/status/2114856267118494178", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2114856267118494178", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "OCRia-1文档解析模型发布", "evidence": "Today we’re releasing OCRia-1", "rationale": "发布模型并给出复杂表格评测，自报成绩"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}, "translationZh": "OCRia-1 是解析 PDF 复杂表格的最佳文档解析模型，可处理嵌套表头、合并单元格、无边框单元格，以及单页内极其密集的表格。\n\n它在多项解析基准测试中取得了最高的表格准确率：ParseBench 为 91.5%，olmOCR-bench 为 92.9%，PulseBench-Tab 为 84.1%，fr-bench-pdf2md 为 83.2%。\n\n我们在下方发布了一份直观的可视化，展示随着模型逐个预测表格单元格，注意力图如何变化 :)\n\n博客：https://t.co/PRxvOFmTLf\n\n来 LlamaParse 试试吧！https://t.co/XYZmx5TFz8"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2115036397799428313", "track": "agent", "source": {"id": "2115036397799428313", "text": "Matt Pocock：AI 时代最该练的，是说清你在乎什么，并让代码库配得上 Agent\n\n来自 @nateherk 对 @mattpocockuk 44 分钟的访谈，Pocock 认为：最值钱的肯定不是追最新模型，是两件事：把你在乎什么说清楚，以及把测试、代码质量和流程做到 agent 能靠得住；他自己试了几个月 Spec 驱动开发，代码反而越来越差。\n\nYoutube 视频：\nhttps://t.co/jqPorXoisJ\n\nPocock 什么时候开始改主意\n自学约十年、职业约八年，对 coding agent 一直偏怀疑。大约 2025 年 12 月 Opus 4.5 出来后，他觉得门槛过了：自己不再手写一行代码。他本来就爱改善同事的工作环境和教学；agent 够用以后，同样的本事转向「怎么让 agent 工作得更好」。\n\n核心：告诉 agent 你在乎什么\n人和 agent 之间有一道常被低估的沟通鸿沟。它不知道你到底要什么，也不知道你在乎什么，所以要反复说清楚。代码库没人维护、全是随便拼出来的，agent 也只能交出垃圾，还是 garbage in, garbage out。正确做法像给最差的人类同事兜底：测试、检查、挡住一类错误。经典软件工程因此又有用了。Agent 也能教你，但要保持怀疑，优先读一手材料。他的 /teach 会找可信来源并标注出处，用 AI 当导读，再读原文。\n\n机会在哪\n变化大，机会也多：教人、做嵌 AI 的产品、帮公司改系统。咨询或内部晋升都一样，押可带走的能力。模型再强，仍要学：怎么信任、怎么组织多个 agent、给它什么信息、怎么把公司流程翻成 agent 能跑的工作流。代码和数学容易验；真实知识工作更难，把这类流程打包给组织，是一块大机会。\n\n未知的未知与 Grill Me\n「Pragmatic Programmer」说：没人一开始就知道自己要什么。他的高频 skill grill me 让 agent 不停追问，挖出你真正在乎的上下文；Grill with Docs 再帮你建领域用语（DDD 里的 ubiquitous language：代码、库表、界面、客户、用户说同一套词）。关键能力是意识到「还有自己不知道的空白」，设计在落成代码之前都不算完成。\n\n怎么显得靠谱\n「周末堆作品集」很难建立信任。客户要的是懂他们在乎什么的人。用 agent 快速做出能证明你懂业务的原型就够。真正跑得好的人，往往是最会沟通的人，想清楚了，PR、产品和给 agent 的指令都会清楚。\n\nSpec 驱动为什么踩坑（26:03）\n受 AI Engineer 上 OpenAI 一侧「specs are the new code」启发，他在个人类 Descript 的视频编辑仓库里试了几个月：规格越写越细，再让 agent 生成代码。结果代码质量一路下滑，agent 也越做越差。他后来认定：代码本身就是 agent 的工作环境；能安全改动的可维护代码，比一直活在规格里更管用。模型不会读心，skills 和流程会长期需要；大家也低估了 harness（Claude Code、Codex 这类），别只看模型牌子。\n\n模型、Harness、Effort\n他现在常用 Claude Code + Opus 5.5。一个鲜明看法是：多数人把 effort 开太高。他自己用 medium，还考虑再降，换更快回复和更省 token，因为测试已经把底线抬起来了。让 agent 能开浏览器、看截图，往往比换更新的模型更赚；环境好的旧 Opus 4.5，可以压过环境差的新模型。Harness 选 Claude Code、Codex 或 Copilot 都行，别纠结太久。\n\n怎么开始\n先装一个主流 harness，要不要用他的 skills 随意。他提到 Lauren Tan（Twitter 上的 Potato，做 Grok Bot）说的 trust ladder：先学会刹车，再踩油门。空文件夹、一个真想法，盯着看；再扩到多 agent、自定义 skill、接 Slack 和邮件。别一上来就丢最难的活，先给琐碎、无聊、能衡量、改错成本低的事（比如回信草稿），再谈野心。\n\n他接下来兴奋什么\n自认是老师，不是评论家。他在想 software factories：怎么稳定地把想法变成工作和长期改库；多 agent 怎么组织，现在还没答案。也期待开源模型接近 Opus 5.5，以及更省 token、说话更直白、能干活的模型。", "createdAt": "Tue Oct 27 11:02:27 +0000 2026", "replyCount": 10, "retweetCount": 4, "likeCount": 26, "conversationId": "2115036397799428313", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoeXxrbsAA_4Mn.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVoeXxrbsAA_4Mn.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T11:02:27+00:00", "createdAtBeijing": "2026-10-27T19:02:27+08:00", "createdAtLocal": "10-27 19:02 北京", "url": "https://x.com/shao__meng/status/2115036397799428313", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2115036397799428313", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent代码库治理与Spec驱动开发复盘", "evidence": "规格越写越细，再让 agent 生成代码", "rationale": "包含失败复盘、测试治理与渐进使用方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114900392731357309", "track": "agent", "source": {"id": "2114900392731357309", "text": "给 Codex 的那段话\n\n脚本不用自己敲，交代给 Codex 就行。我会写成这样：\n\n用 $exploratory-data-analysis 分析 data/orders.csv。\n先跑 capability_manifest 确认格式，再出 EDA 报告。\n缺失值标记是 NA 和 -，按 user_id 检查 train/test 重叠。\n不许删行、不许填补、不许改原文件，派生文件全部写到 output/。\nEDA 做完，用 $statistical-analysis 比较 app 和 web 两个渠道的客单价，\n图用 $scientific-visualization 出，柱状图从 0 开始，误差线注明是 SD 还是 CI。\n\n后半段交给另外两个技能。\n\nstatistical-analysis 的流程是先定问题再碰数据：比较两组独立样本，默认用 Welch t 检验，不先假定方差相等；它还明确要求不能因为某个诊断检验的 p 值过线，就自动换一种检验方法。前提检查用它自带的 assumption_checks.py，组内异常值、正态性、方差齐性一起看，还会出诊断图。p 值和效应量一起报，最后按 APA 格式写结果。\n\n说白了，p 值看的是这点差异像不像碰巧，效应量看的是差了多少。假如两个渠道客单价只差 3 块钱，样本量一大，p 值照样能很小，可为这 3 块钱调整投放值不值，得看效应量，也得看业务。\n\nscientific-visualization 第一条护栏是不许修改、隐藏、编造数据来让图更好看。柱状图默认从 0 开始，误差线要写清是 SD、SE 还是置信区间，并标上 n。", "createdAt": "Tue Oct 27 02:02:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2114900388935520652", "inReplyToStatusId": "2114900391808635201", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmhdkwacAA7EUt.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HVmhdkwacAA7EUt.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-27T02:02:01+00:00", "createdAtBeijing": "2026-10-27T10:02:01+08:00", "createdAtLocal": "10-27 10:02 北京", "url": "https://x.com/sitinme/status/2114900392731357309", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2114900392731357309", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "多技能协作的数据分析提示词", "evidence": "p 值和效应量一起报", "rationale": "提供可复用提示词、统计流程及可视化护栏"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2114998535326446046", "track": "enterprise", "source": {"id": "2114998535326446046", "text": "看了 xAI 的 Grok Bot 文档，一个可以值得借鉴的点：别急着让 AI 自动干活，先把一件事跑通，再把方法保存下来，最后设置自动执行。\n\n分三步：\n\n① 先让 Bot 完整做一次任务。比如整理行业动态，把信息来源、筛选条件、输出格式调到满意。\n\n② 直接告诉它：“把刚才的流程保存成一个 Skill，写清楚操作步骤、判断标准、结果怎么验证，以及哪些动作需要我确认。”\n\n③ 再设置 Routine：“每个工作日早上 9 点，按北京时间运行这个 Skill，把结果发到当前对话。只整理当天的信息；数据源打不开就报告失败，不要拿旧内容凑数。”\n\n这里 Skill 管“怎么做”，Routine 管“什么时候做”。后台任务在笔记本合盖后也能运行。\n\n除了定时，部分集成还支持由 Slack 消息、GitHub 通知等事件触发，但条件最好写具体，别一上来就监听所有新消息。\n\n一个细节容易忽略的细节：点 Test 会真的执行任务，可能改文件、调用工具，并不是模拟运行。\n\n 所以先用安全样例测试，确认数据够新、输出符合要求、失败会明确报告。\n\n发送消息、发布内容、购买、删除这些动作，记得保留人工确认。", "createdAt": "Tue Oct 27 08:32:00 +0000 2026", "replyCount": 4, "retweetCount": 2, "likeCount": 7, "conversationId": "2114998535326446046", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2113540176760738265", "text": "试过了！Grok Bot 自动帮我发外链，3 天提交 21 个站，花费 0 美元！\n\n以前做 AI 出海网站，发外链真的很烦。找导航站、注册账号、收验证码、填表单，重复劳动太多了。\n\n最近我把这套流程交给 Grok Bot，效果还不错。\n\n整个流程就 5 步：\n\n1.整理名单：导入导航站资源，自动去重、筛选免费站点，按 DR 排序。\n2.准备素材：提前整理产品介绍、Logo、分类、标签，提交链接统一带 UTM。\n3.自动提交：每天定时提交 5 个站点，自动注册、填表，遇到付费或身份验证就跳过。\n4.自动验证：用 Cloudflare Email Worker 转发邮件，Bot 自己收验证码、完成注册。\n5.自动汇报：更新飞书表格，每天推送日报，每周检查外链收录情况。\n\n实测 3 天提交 21 个站点，提交费用 $0，后续继续跟踪收录和流量。\n\n最大的感受就是：AI Agent 真正有价值的地方，不只是能聊天、写代码，而是能把这些重复工作变成每天自动执行的流程。\n\n人负责决策，Bot 负责干活。", "createdAt": "Fri Oct 23 07:57:00 +0000 2026", "replyCount": 6, "retweetCount": 7, "likeCount": 88, "conversationId": "2113540176760738265", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVnrllwbUAArZew.jpg", "width": 1199, "height": 675, "previewUrl": "https://pbs.twimg.com/media/HVnrllwbUAArZew.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-27T08:32:00+00:00", "createdAtBeijing": "2026-10-27T16:32:00+08:00", "createdAtLocal": "10-27 16:32 北京", "url": "https://x.com/sitinme/status/2114998535326446046", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2114998535326446046", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Skill与Routine自动化工作流", "evidence": "Skill 管“怎么做”，Routine 管“什么时候做”", "rationale": "给出流程固化、定时执行及真实测试注意事项"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2115033908748161207", "track": "agent", "source": {"id": "2115033908748161207", "text": "推荐一个 Infini-AI-Lab 最近开源的项目 Hermit，专门做 Agent Harness 的持续学习与自进化，我觉得它的设计思路很值得关注。\n\n现在想让 Agent 从任务经验中持续改进，其实有两个很现实的问题。\n\n一是成熟的 Harness 往往很复杂，甚至是闭源的。直接修改内部的工具调度、上下文管理和执行逻辑，成本高，还容易破坏原有系统。\n\n二是现在 Agent 自进化算法越来越多，但每套方法都有自己的执行、反馈和评估流程。想换一种算法，或者接入自己的任务，经常需要重新适配一遍。\n\nHermit 提出的解决方案是 Harness Adapter。\n\n简单理解，就是给现有 Agent 外挂一层可训练的 Harness Adapter，里面可以包含 Prompt、Skills、Memory、工具甚至多 Agent 协作逻辑。通过任务执行轨迹和反馈不断优化这层 Adapter，原来的模型和 Harness 都不需要修改。\n\n而且它并不局限于 Codex、Claude Code，也支持通过 Python 接口和自定义 Pipeline 接入自己开发的 Agent。\n\n更值得关注的是，它把 Agent 自进化的训练流程统一了起来，任务执行、反馈收集、Adapter 更新、检查、版本管理和评估都可以复用同一套框架。\n\n目前已经集成了 GEPA、SkillOpt、MWM、Harness²、Continual Harness 等多种方法，研究者可以在此基础上实现和比较自己的进化算法。\n\n这种思路还是比较看好。现在 Agent 自进化的研究很多，但如果每提出一种新方法，都要重新搭建一套训练和评估系统，研究和工程成本都会很高。\n\nHermit 的价值就在于尝试为 Harness Evolution 建立一套通用的基础设施。\n\n但做 Agent Memory、Harness、自进化和持续学习的朋友，可以重点关注一下。\n\nGitHub：https://t.co/XDz1c9QVdK", "createdAt": "Tue Oct 27 10:52:33 +0000 2026", "replyCount": 5, "retweetCount": 2, "likeCount": 11, "conversationId": "2115033908748161207", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-27T10:52:33+00:00", "createdAtBeijing": "2026-10-27T18:52:33+08:00", "createdAtLocal": "10-27 18:52 北京", "url": "https://x.com/Xudong07452910/status/2115033908748161207", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2115033908748161207", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Hermit Harness持续学习框架", "evidence": "原来的模型和 Harness 都不需要修改", "rationale": "具体介绍适配层、训练流程及算法集成"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2114748189274444188", "track": "agent", "source": {"id": "2114748189274444188", "text": "fun stat from @microagi’s write-up on shipping petabytes of robot data:\n\nthey re-uploaded a 239 GB dataset with small changes to Hugging Face. only 2.6 MB went over the network, done in about a minute (!)\n\nand it keeps paying off at scale, because robot recordings are super repetitive (same scenes, same rigs). then @Cloudflare workers fan it all out to any cloud, >1 PB for ~$500\n\ngreat write-up by the team: https://t.co/O4w4EbnHar", "createdAt": "Mon Oct 26 15:57:13 +0000 2026", "replyCount": 17, "retweetCount": 11, "likeCount": 120, "conversationId": "2114748189274444188", "author": {"username": "Thom_Wolf", "name": "Thomas Wolf", "profileImageUrl": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, "authorId": "246939962", "quotedTweet": {"id": "2113648571908006378", "text": "As our customers scale to training robot models using millions of hours of our recordings, we needed to build a new kind of data infrastructure.\n\nTerabytes of data delivered in minutes, and the capacity to deliver over a Petabyte per day to each of our customers, to multiple customers at the same time. That’s more than 10 Gigabytes a second, delivered into any cloud, wherever our customers need it.\n\nUsing our customer portal, customers select precisely the data they want and it starts arriving in minutes at their destination, including AWS, GCP, Cloudflare, Hugging Face and any cloud provider who can handle the ingest speed.\n\nWe’ve written about how we worked with @huggingface and @Cloudflare to build this secure, scalable infrastructure. Link in comments.", "createdAt": "Fri Oct 23 15:07:43 +0000 2026", "replyCount": 11, "retweetCount": 18, "likeCount": 133, "conversationId": "2113648571908006378", "author": {"username": "microagi", "name": "microagi", "profileImageUrl": "https://pbs.twimg.com/profile_images/2033242463893073920/PMLm8Pdo_normal.jpg"}, "authorId": "1990414469785378816", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVUwK2sXUAA4SSs.jpg", "width": 1418, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVUwK2sXUAA4SSs.jpg:small"}], "translationZh": "随着客户开始使用我们采集的数百万小时数据来训练机器人模型，我们需要构建一种全新的数据基础设施。\n\n它能在几分钟内交付 TB 级数据，并支持同时向多位客户交付数据，每位客户每天可接收超过 1 PB。也就是说，传输速度超过每秒 10 GB，客户需要哪个云平台，就能送达哪个云平台。\n\n通过客户门户，客户可以精确选择所需数据，几分钟后数据就会开始抵达目标位置，包括 AWS、GCP、Cloudflare、Hugging Face，以及任何能够承接这一数据写入速度的云服务商。\n\n我们写了一篇文章，介绍如何与 @huggingface 和 @Cloudflare 合作构建这套安全、可扩展的基础设施。链接见评论区。"}, "expert": {"priority": "P0", "domain": "开源模型 / Hugging Face", "name": "Thomas Wolf", "role": "Hugging Face / 联合创始人兼 CSO", "why": "Transformers 生态和开源模型讨论的重要人物", "handle": "Thom_Wolf"}, "createdAtIso": "2026-10-26T15:57:13+00:00", "createdAtBeijing": "2026-10-26T23:57:13+08:00", "createdAtLocal": "10-26 23:57 北京", "url": "https://x.com/Thom_Wolf/status/2114748189274444188", "themeId": "editorial", "signalScore": 83, "editorial": {"id": "2114748189274444188", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "机器人训练数据增量传输与分发", "evidence": "only 2.6 MB", "rationale": "提供增量上传、跨云分发方案及自述规模成本"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}, "translationZh": "@microagi 关于 PB 级机器人数据传输的文章里，有个有趣的数据：\n\n他们将一个略有改动的 239 GB 数据集重新上传到 Hugging Face，实际通过网络传输的只有 2.6 MB，大约一分钟就完成了（！）\n\n而且，规模越大，这种优势就越明显，因为机器人采集的数据高度重复，场景和设备都相同。随后通过 @Cloudflare Workers 将数据分发到任意云平台，传输超过 1 PB 的数据仅需约 500 美元。\n\n团队的这篇文章很值得一读：https://t.co/O4w4EbnHar"}, "avatar": "https://pbs.twimg.com/profile_images/2068682157451571200/_ZNKM_5E_normal.jpg"}, {"id": "2114841330849620473", "track": "creative", "source": {"id": "2114841330849620473", "text": "Try it with 2 GPUs:\n\nsglang serve --model-path tencent/Hy-Nomas --num-gpus 2 --sp-degree 2 --port 30000\n\nFor now, Director and Generator are served separately. We're looking forward to working with the Hunyuan team on unified end-to-end serving, including coordinated KV cache scheduling and inference across both models.\n\nHuge thanks to the Tencent Hunyuan team for open-sourcing HY-Nomas, and to everyone who helped bring it into SGLang!!!", "createdAt": "Mon Oct 26 22:07:19 +0000 2026", "replyCount": 2, "retweetCount": 5, "likeCount": 16, "conversationId": "2114841330849620473", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2114763991293530538", "text": "Hy-Nomas now runs on two more backends.\n\nSGLang (main branch), by @sgl_project : offline video jobs and streaming sessions.\nhttps://t.co/Mz4dOVECOt\n\nComfyUI, by @LatentSpacer  : chained segments and WASD camera control.\nhttps://t.co/1NbNId2j3U\n\nThank you both for building on it.", "createdAt": "Mon Oct 26 17:00:00 +0000 2026", "replyCount": 5, "retweetCount": 14, "likeCount": 46, "conversationId": "2114763991293530538", "author": {"username": "TencentAI_News", "name": "Tencent AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/2003780428591960064/H6DEq1-G_normal.jpg"}, "authorId": "2000391102923481088", "translationZh": "Hy-Nomas 现已支持另外两个后端。\n\nSGLang（主分支），由 @sgl_project 提供：支持离线视频任务和流式会话。\nhttps://t.co/Mz4dOVECOt\n\nComfyUI，由 @LatentSpacer 提供：支持片段串联和 WASD 镜头控制。\nhttps://t.co/1NbNId2j3U\n\n感谢双方基于 Hy-Nomas 开展开发。"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-10-26T22:07:19+00:00", "createdAtBeijing": "2026-10-27T06:07:19+08:00", "createdAtLocal": "10-27 06:07 北京", "url": "https://x.com/GenAI_is_real/status/2114841330849620473", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2114841330849620473", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "HY-Nomas双GPU视频推理部署", "evidence": "--num-gpus 2 --sp-degree 2", "rationale": "提供启动命令、视频后端支持与当前限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": false, "reason": "primary_not_substantive"}, "translationZh": "用 2 张 GPU 试试：\n\nsglang serve --model-path tencent/Hy-Nomas --num-gpus 2 --sp-degree 2 --port 30000\n\n目前，Director 和 Generator 分别部署为独立服务。我们期待与混元团队合作，实现统一的端到端推理服务，包括两个模型间协同的 KV 缓存调度与推理。\n\n衷心感谢腾讯混元团队开源 HY-Nomas，也感谢所有帮助它接入 SGLang 的贡献者！"}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2115015709390733572", "track": "tools", "source": {"id": "2115015709390733572", "text": "别让AI总结视频了，让它带你看\n\n哈喽，大家好，我是刘小排。\n\n最近有朋友发现，我好像看过很多海外大佬的访谈视频，并且对其中细节都记忆犹新，不像是看的AI总结，但是不明白我哪儿有那么多时间看。\n\n我的确不喜欢看AI总结。\n\n我的方法是： 让AI带我看，不是帮我看。\n\n我给这套方法取了个名字：私人视频导游。\n\n让AI帮我减少寻找的时间，增加我真正感兴趣的观看时间。\n\n具体来说\n\n第1步： 告诉AI视频范围和我的兴趣，设定定时任务\n\n比如，对于我来说，大概是\n\n「\n我是一个小团队的 AI 创业者，喜欢看海外AI创业者的访谈视频，尤其是设计高认知、实操、AI native创业经验方面的。 我所知道的栏目有：YC Lightcone、Startup School和YC其他栏目； The a16z Show；Lenny's Podcast；How I AI；Lenny's Newsletter；Sourcery；Latent Space；Dwarkesh Podcast；No Priors；Sequoia Training Data；The Pragmatic Engineer Podcast。上面这些你都要每天查看。当然，你可以推荐更多栏目，和我对齐范围。\n」\n\n和AI讨论清楚范围以后，我们可以在ChatGPT里设置定时任务，让它每天上午10点全部看一遍，然后只推送我感兴趣的给我、每次推送要说明「为什么值得我关注」。\n\n第2步：每天看AI的汇报，决定哪些真的值得我亲自看\n\n例如，今天我打算亲自看这两个。\n\nAI每天会给出了推荐理由，但并不是每一个它的推荐，我都要亲自看。\n\nAI会给出「最值得关注的部分」，还给出精确的时分秒，如下图所示。\n\n如果我感兴趣，点一下就过去了\n【图1】【图2】\n\n第3步：用ChatGPT的浏览器插件，搜索模糊观点。\n\n例如，我看AI总结，提到「Stripe是在已经做了一年多以后，才正式发布的」。\n\n我必须要亲自看这一段。 （这就是为什么，我朋友感觉，我记得很多细节了。  重点段落我看得很仔细。）\n那么，我应该在Chrome的ChatGPT插件里，直接问它。\n\nChatGPT会给出一个链接，让我点击一下，直接从我关心的地方开始播放。【图3】\n\n第4步：用ChatGPT的浏览器插件，询问其他段落推荐。\n\n从下面的截图【图4】可以看到，ChatGPT完全知道我最近在思考什么、在关注什么、状态如何。从而做出最精准的推荐。\n\n就这些了！\n\n去试试吧！希望可以帮助到你！", "createdAt": "Tue Oct 27 09:40:14 +0000 2026", "replyCount": 10, "retweetCount": 3, "likeCount": 26, "conversationId": "2115015709390733572", "author": {"username": "bourneliu66", "name": "刘小排", "profileImageUrl": "https://pbs.twimg.com/profile_images/1955860656919625728/sCkP_hTF_normal.png"}, "authorId": "2815325906", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoLE9VbwAAMLME.jpg", "width": 1864, "height": 1372, "previewUrl": "https://pbs.twimg.com/media/HVoLE9VbwAAMLME.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVoLGWVa8AA4anf.jpg", "width": 1980, "height": 1446, "previewUrl": "https://pbs.twimg.com/media/HVoLGWVa8AA4anf.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVoLHI2agAE-AvV.jpg", "width": 2048, "height": 1392, "previewUrl": "https://pbs.twimg.com/media/HVoLHI2agAE-AvV.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVoLH2YbUAANdZ3.jpg", "width": 2048, "height": 1353, "previewUrl": "https://pbs.twimg.com/media/HVoLH2YbUAANdZ3.jpg:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "刘小排", "role": "企业落地与产品组织实践与观察", "why": "有把 Agent 接入正常工作的连续经验，能补独立经营者的工具决策。", "handle": "bourneliu66"}, "createdAtIso": "2026-10-27T09:40:14+00:00", "createdAtBeijing": "2026-10-27T17:40:14+08:00", "createdAtLocal": "10-27 17:40 北京", "url": "https://x.com/bourneliu66/status/2115015709390733572", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2115015709390733572", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "AI私人视频导游工作流", "evidence": "告诉AI视频范围和我的兴趣，设定定时任务", "rationale": "提供筛选、时间戳定位与追问的完整方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": false, "reason": "primary_not_substantive"}}, "avatar": "https://pbs.twimg.com/profile_images/1955860656919625728/sCkP_hTF_normal.png"}, {"id": "2114818117780099271", "track": "creative", "source": {"id": "2114818117780099271", "text": "Runway App Studio is now live. One of our most exciting and anticipated releases.\n\nWe started building this internally for our team to use, and within just a few weeks, it was seeing incredible usage. The only reasonable thing to do was to release it to the world.\n\nI strongly believe that most of the interfaces we use to control models will be specific to each individual. Not many-to-one, but one-to-one. Any form of control you can imagine. Any version of Runway you want.", "createdAt": "Mon Oct 26 20:35:05 +0000 2026", "replyCount": 11, "retweetCount": 7, "likeCount": 90, "conversationId": "2114818117780099271", "author": {"username": "c_valenzuelab", "name": "Cristóbal Valenzuela", "profileImageUrl": "https://pbs.twimg.com/profile_images/2070496516893229056/bm-CWE5N_normal.jpg"}, "authorId": "788107483306942464", "quotedTweet": {"id": "2114805465658036425", "text": "Introducing Runway App Studio.\n\nBuild the creative app you wish existed, just by describing it. It generates images, video and audio with Runway’s models and your Brand Kits, ready for you or your whole team. No code required.\n\nSee examples in the thread below. https://t.co/BQRMrMKIuv", "createdAt": "Mon Oct 26 19:44:48 +0000 2026", "replyCount": 33, "retweetCount": 44, "likeCount": 261, "conversationId": "2114805465658036425", "author": {"username": "runwayml", "name": "Runway", "profileImageUrl": "https://pbs.twimg.com/profile_images/1999115192232292353/zOq5-uwB_normal.jpg"}, "authorId": "1001114465692200960", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114804967898763264/img/zIMYPBylhSzTZuGt.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114804967898763264/img/zIMYPBylhSzTZuGt.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114804967898763264/vid/avc1/1920x1080/BdNS9S-mmkMg4qVA.mp4?tag=29", "durationMs": 56541}], "translationZh": "Runway App Studio 正式登场。\n\n只需描述，就能构建你一直想要的创意应用。它结合 Runway 的模型和你的 Brand Kits 生成图像、视频和音频，供你个人或整个团队使用。无需编写代码。\n\n下方帖子串中有示例。https://t.co/BQRMrMKIuv"}, "expert": {"priority": "P1", "domain": "生成式视频", "name": "Cristobal Valenzuela", "role": "Runway / 联合创始人兼 CEO", "why": "AI 视频产品和创意工具", "handle": "c_valenzuelab"}, "createdAtIso": "2026-10-26T20:35:05+00:00", "createdAtBeijing": "2026-10-27T04:35:05+08:00", "createdAtLocal": "10-27 04:35 北京", "url": "https://x.com/c_valenzuelab/status/2114818117780099271", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2114818117780099271", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Runway App Studio 发布", "evidence": "Runway App Studio is now live.", "rationale": "明确发布无代码创作应用平台及多模态能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}, "translationZh": "Runway App Studio 现已上线。这是我们最令人兴奋、最受期待的产品发布之一。\n\n最初，我们只是为内部团队开发这个工具，短短几周内，使用量就惊人地增长。顺理成章的下一步，就是向所有人开放。\n\n我坚信，我们用来操控模型的大多数界面，都将为每个人量身定制。每个人都会拥有专属界面。你能想象的任何操控方式，你想要的任何版本的 Runway，都可以实现。"}, "avatar": "https://pbs.twimg.com/profile_images/2070496516893229056/bm-CWE5N_normal.jpg"}, {"id": "2114916415119770089", "track": "research", "source": {"id": "2114916415119770089", "text": "Mirendil 发布首个从零预训练的模型 Fern：把 10M token 当成另一种「算力」，服务「做 AI 的人」 @mirendil \nhttps://t.co/8Jwai8sGDu\n\n10M Token 能做什么：~ 23 MB 代码 / ~50 万行，Megatron-LM 量级，或「几天 agent 干活」的轨迹一次塞进上下文。0.1 版只做了短轮 post-training；Mirendil 叙事是「参数与上下文是两条花算力的路」，架构 / 训练 / serving 都按 10M 设计；next-token 指标随上下文变长仍改善，并称预测质量可一路用到 10M。面向审计数据、读训练日志、通读 agent 轨迹这类高吞吐工作；0.1 只做了短轮 post-training。\n\n六个使用场景\n· 更大仓库上的工作\n· agentic coding（跑命令、读输出、直到测试过）\n· AI 研究代码（训练循环、数据管线、评测）\n· 从长日志/堆栈 debug\n· 通读整段 agent/训练轨迹并解释因果\n· 扫描整块预训练 shard 查重复、榜单污染与垃圾数据", "createdAt": "Tue Oct 27 03:05:41 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 9, "conversationId": "2114916415119770089", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2114743262565339148", "text": "Introducing Fern, Mirendil’s first model: pretrained from scratch, with up to 10M tokens of context!\n\nThat’s ~0.5M lines of code (roughly Megatron-LM scale) or days of an agent’s work, all in context at once.\n\nIts first version, Fern 0.1, had a short round of post-training 🚢 https://t.co/ClnV1Z3yzN", "createdAt": "Mon Oct 26 15:37:38 +0000 2026", "replyCount": 112, "retweetCount": 173, "likeCount": 2065, "conversationId": "2114743262565339148", "author": {"username": "bneyshabur", "name": "Behnam Neyshabur", "profileImageUrl": "https://pbs.twimg.com/profile_images/1136894710293774336/RN2vpcX0_normal.png"}, "authorId": "2508783510", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkTRarbAAAM3u7.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HVkTRarbAAAM3u7.jpg:small"}], "translationZh": "介绍 Fern，Mirendil 的首个模型：从零开始预训练，上下文长度最高可达 1000 万个 token！\n\n这意味着约 50 万行代码（大致相当于 Megatron-LM 的规模），或智能体连续数天的工作内容，都能一次性放进上下文。\n\n首个版本 Fern 0.1 经过了一轮简短的后训练 🚢 https://t.co/ClnV1Z3yzN"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmxQpHbwAA7u9M.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HVmxQpHbwAA7u9M.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-27T03:05:41+00:00", "createdAtBeijing": "2026-10-27T11:05:41+08:00", "createdAtLocal": "10-27 11:05 北京", "url": "https://x.com/shao__meng/status/2114916415119770089", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2114916415119770089", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Fern千万Token上下文模型发布", "evidence": "pretrained from scratch", "rationale": "包含模型发布、训练阶段和上下文设计信息"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2114775718190260310", "track": "research", "source": {"id": "2114775718190260310", "text": "Pushing the boundaries: training a 100B+ parameter model from scratch in just 3.5 months for under $10 million, while achieving lower cross-entropy than DeepSeek-V4-Pro and GLM 5.3!", "createdAt": "Mon Oct 26 17:46:36 +0000 2026", "replyCount": 1, "retweetCount": 2, "likeCount": 61, "conversationId": "2114775718190260310", "author": {"username": "istoica05", "name": "Ion Stoica", "profileImageUrl": "https://pbs.twimg.com/profile_images/1889424820821172228/OKFe0cdL_normal.jpg"}, "authorId": "3139551624", "quotedTweet": {"id": "2112941025862008949", "text": "We formally announced Mirendil less than 4 months ago. Today, I'm excited to share an important milestone for:\n\nPretraining at scale without a pretraining team.\n\nMirendil's mission is to solve Recursive Self-Improvement (RSI) and use it to democratize frontier AI development, ultimately accelerating science and technology. At Mirendil, when we think about RSI, we think holistically about the company as an intelligent entity that self-improves toward its goal. From that perspective, the most powerful notion of acceleration is reducing the time and resources (number of human experts, compute, and other costs) needed to achieve ambitious goals.\n\nGiven that pretraining is perhaps the most important yet most challenging part of frontier AI development, we decided to run an ambitious controlled experiment: Starting fully from scratch, can we significantly reduce the time, number of human experts, and compute resources needed to go all the way to successfully pretraining a strong coding model at scale?\n\nMirendil-Base is the result of this experiment. Our first pretrained model was built by one researcher in 3.5 months, with less than $10M in compute. This includes all the research and small-scale experiments it took to get there, as well as the final training run.\n\nThe recipe holds up as the models get bigger. For reference, Mirendil-Base is in the 100B-500B parameter range, Mirendil-Base-Large in the 500B-2T range, and Mirendil-Base-XL in the 2T-10T range.\n\nWe're beginning to see a world where a single researcher, empowered by AI, can take on work that once required an entire research organization. As these systems improve, the bottleneck shifts from the size of a team to the ambition and judgment of the people directing them. This has profound implications for who gets to build AI and, ultimately, who gets to push the frontiers of science and technology forward.\n\nWe’ll share independent evaluations, post-training benchmarks and API-access sooner than you think so stay tuned!", "createdAt": "Wed Oct 21 16:16:11 +0000 2026", "replyCount": 171, "retweetCount": 159, "likeCount": 1608, "conversationId": "2112941025862008949", "author": {"username": "bneyshabur", "name": "Behnam Neyshabur", "profileImageUrl": "https://pbs.twimg.com/profile_images/1136894710293774336/RN2vpcX0_normal.png"}, "authorId": "2508783510", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKprdaaEAAdukn.png", "width": 2048, "height": 1629, "previewUrl": "https://pbs.twimg.com/media/HVKprdaaEAAdukn.png:small"}], "translationZh": "我们正式宣布成立 Mirendil 至今还不到 4 个月。今天，我很高兴分享一个重要里程碑：\n\n无需预训练团队，也能开展大规模预训练。\n\nMirendil 的使命是攻克递归自我改进（RSI），并借此让更多人能够开发前沿 AI，最终加速科技进步。在 Mirendil，我们从整体角度思考 RSI：将公司视为一个智能实体，不断自我改进以实现目标。从这个角度看，最有力的加速，就是减少实现宏大目标所需的时间和资源，包括专家人数、算力及其他成本。\n\n预训练或许是前沿 AI 开发中最重要、也最具挑战的环节，因此我们决定开展一项雄心勃勃的对照实验：完全从零开始，我们能否显著减少所需的时间、专家人数和算力资源，最终成功完成一个强大编程模型的大规模预训练？\n\nMirendil-Base 就是这项实验的成果。我们的首个预训练模型由一名研究员在 3.5 个月内完成，算力成本不到 1000 万美元。这涵盖了前期所有研究、小规模实验以及最终的训练运行。\n\n随着模型规模扩大，这套方法依然有效。供参考，Mirendil-Base 的参数规模在 1000 亿至 5000 亿之间，Mirendil-Base-Large 在 5000 亿至 2 万亿之间，Mirendil-Base-XL 在 2 万亿至 10 万亿之间。\n\n我们正开始看到这样一个世界：一名研究员在 AI 的助力下，就能承担过去需要整个研究机构才能完成的工作。随着这些系统不断改进，瓶颈将从团队规模转向指挥它们的人的志向与判断力。这将深刻影响谁有机会构建 AI，以及最终谁能推动科技前沿向前发展。\n\n独立评估、后训练基准测试和 API 访问将比你想象中更早公布，敬请期待！"}, "expert": {"priority": "P1", "domain": "AI 基础设施 / 分布式系统", "name": "Ion Stoica", "role": "Berkeley；Anyscale 联合创始人", "why": "Ray、分布式 AI 系统、数据基础设施", "handle": "istoica05"}, "createdAtIso": "2026-10-26T17:46:36+00:00", "createdAtBeijing": "2026-10-27T01:46:36+08:00", "createdAtLocal": "10-27 01:46 北京", "url": "https://x.com/istoica05/status/2114775718190260310", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2114775718190260310", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Mirendil-Base预训练成果自述", "evidence": "one researcher in 3.5 months", "rationale": "披露模型规模、周期与成本，独立评估待公布"}, "isTopStory": true, "topStoryEligible": true, "topStoryCategory": "AI 技术前沿", "topStoryScore": 100, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "selected"}, "editorialTopRationale": "自述单人以不足千万美元完成千亿级预训练，独立评估待公布", "translationZh": "突破极限：仅用 3.5 个月、不到 1000 万美元，就从零训练出一个千亿级以上参数模型，交叉熵还低于 DeepSeek-V4-Pro 和 GLM 5.3！"}, "avatar": "https://pbs.twimg.com/profile_images/1889424820821172228/OKFe0cdL_normal.jpg"}, {"id": "2114793714531102901", "track": "agent", "source": {"id": "2114793714531102901", "text": "The Agent SDK is now available.\n\nDefine agents as code, with prompts in Markdown and tools in TypeScript. Deploy them on our hosted infrastructure, or run them on your own.\n\nBuilt-in evals let you measure every change and make your agents better over time. https://t.co/sww7EXYBFI", "createdAt": "Mon Oct 26 18:58:07 +0000 2026", "replyCount": 355, "retweetCount": 242, "likeCount": 3473, "conversationId": "2114793714531102901", "author": {"username": "cursor_ai", "name": "Cursor", "profileImageUrl": "https://pbs.twimg.com/profile_images/1970182748146180096/dhZeXi_X_normal.jpg"}, "authorId": "1695890961094909952", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114793685091270656/img/GNmvZQ3NLo9g5Lp6.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114793685091270656/img/GNmvZQ3NLo9g5Lp6.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114793685091270656/vid/avc1/1920x1080/MH3BBrWjp4ogV4mD.mp4?tag=16", "durationMs": 28400}], "expert": {"priority": "P0", "domain": "Agent 技术突破", "name": "Cursor", "role": "AI 编程 Agent 项目", "why": "五方向 X 主动热点搜索：Agent 技术突破", "handle": "cursor_ai"}, "createdAtIso": "2026-10-26T18:58:07+00:00", "createdAtBeijing": "2026-10-27T02:58:07+08:00", "createdAtLocal": "10-27 02:58 北京", "url": "https://x.com/cursor_ai/status/2114793714531102901", "themeId": "editorial", "signalScore": 90, "hotspotMatches": [{"id": "agents", "label": "Agent 技术突破", "matchedTerms": ["agent"]}], "hotspotDirections": ["agents"], "hotspotDirection": "agents", "hotspotDirectionLabel": "Agent 技术突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2114793714531102901", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Cursor发布Agent SDK", "evidence": "The Agent SDK is now available", "rationale": "发布可代码定义、托管或自部署且内置评测的SDK"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "A", "primarySubstantive": true, "reason": "capacity"}, "translationZh": "Agent SDK 现已推出。\n\n用代码定义智能体，用 Markdown 编写提示词，用 TypeScript 编写工具。既可部署到我们托管的基础设施上，也可在自己的基础设施上运行。\n\n内置评估功能让你衡量每次改动的效果，持续改进智能体。https://t.co/sww7EXYBFI"}, "avatar": "https://pbs.twimg.com/profile_images/1970182748146180096/dhZeXi_X_normal.jpg"}, {"id": "2114932611902808247", "track": "agent", "source": {"id": "2114932611902808247", "text": "这是一个管理问题\n如果你划分了很多职责，那么 Agent 相互之间就很容易形成一种互相请示，踢皮球的节奏\n有时候你即使指定了一个 leader，也可能因为 leader 喜欢微操，又陷入一种巨大的沟通成本\n我现在用的组织架构很简单：任务开始之后，由 leader 来分配每个 agent own 哪个 feature，通常是因为不同的 Agent 可能跑在不同的操作系统上，比如有的是 Windows 的 Agent，有的是在 Linux 上的，它们能力的边界不太一样\n最后再由这个 leader 来负责 PR 的合并\n我最近甚至给每个 Agent 独立配一台物理机，主要是因为他们去跑测试，编译的时候，还是非常烧 CPU 的，每个 Agent 有自己的工作环境，应该会更开心一点吧。", "createdAt": "Tue Oct 27 04:10:02 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 19, "conversationId": "2114932611902808247", "author": {"username": "kevinzhow", "name": "kevinzhow", "profileImageUrl": "https://pbs.twimg.com/profile_images/1808138216585023490/xQ3u-b4x_normal.jpg"}, "authorId": "22938360", "quotedTweet": {"id": "2114857158865305710", "text": "@kevinzhow 我感觉 raft 烧 token 非常快，你一般是什么样的 team设置，我orca, dev pm,reviewer,architect 五个角色，是不是角色太多了？", "createdAt": "Mon Oct 26 23:10:13 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2114685684284002777", "inReplyToStatusId": "2114685684284002777", "author": {"username": "ohhe", "name": "Ken", "profileImageUrl": "https://pbs.twimg.com/profile_images/2013021756324261888/ZT8skTU5_normal.jpg"}, "authorId": "17749879"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "kevinzhow", "role": "Agent 与开发工具实践与观察", "why": "公开多 Agent 职责划分、跨系统协作及 Web 优先验收方式，工程细节明确。", "handle": "kevinzhow"}, "createdAtIso": "2026-10-27T04:10:02+00:00", "createdAtBeijing": "2026-10-27T12:10:02+08:00", "createdAtLocal": "10-27 12:10 北京", "url": "https://x.com/kevinzhow/status/2114932611902808247", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2114932611902808247", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "按功能划分多Agent职责与隔离资源", "evidence": "由 leader 来分配每个 agent own 哪个 feature", "rationale": "提供任务分工、合并职责及计算资源隔离实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "headlineDecision": {"grade": "B", "primarySubstantive": true, "reason": "capacity"}}, "avatar": "https://pbs.twimg.com/profile_images/1808138216585023490/xQ3u-b4x_normal.jpg"}, {"id": "2115025166493438414", "track": "research", "source": {"id": "2115025166493438414", "text": "Kimi K3.1 Pro 登顶OpenDesign Arena设计评测榜的第一！但是最重要的是它把模型的交付率直接拔高到了93% 🔥🚀\n\nKimi 综合成绩已经小幅超过了 GPT-6.1 Sol这种SOTA级别的模型，而且是在几乎所有用户有需求的真实设计场景里面包括网页、App、Dashboard 这些，在多个场景的交付率达到100%，要知道之前大多数模型的交付率还在50%到60%之间打转。\n\n但能力强和用起来划算，确实是两回事。平均一个作品要 $1.46、近 14 分钟，成本约为 Sol 的 3.8 倍，耗时超过两倍，所以这次我们把第一给了 Kimi，日常设计的综合推荐依然给 Haiku 5.5。\n\n不知道大家做项目，更愿意为最后一点质量加钱，还是优先选快、省的，我们在持续优化评测基准ing\n\n详细评测在下面了，Kimi 也已经接入 OpenDesign GO这些套餐，支持API，欢迎来蹬！", "createdAt": "Tue Oct 27 10:17:49 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 0, "conversationId": "2115025166493438414", "author": {"username": "tuturetom", "name": "Tom Huang", "profileImageUrl": "https://pbs.twimg.com/profile_images/1033199673035522048/WI-JLSAc_normal.jpg"}, "authorId": "806464682823282688", "quotedTweet": {"id": "2115019569467478078", "text": "Kimi K3.1 Pro takes the #1 spot, narrowly edging out GPT-6.1 Sol and Terra in our design benchmark.\n\nAcross 21 models tested on real-world design tasks based on user requests, Kimi leads with a 93% delivery rate.\n\nNow on OpenDesign: Go, Plus, Pro &amp; Max. https://t.co/hQJ6cBZ3LY", "createdAt": "Tue Oct 27 09:55:35 +0000 2026", "replyCount": 4, "retweetCount": 2, "likeCount": 27, "conversationId": "2115019569467478078", "author": {"username": "OpenDesignHQ", "name": "OpenDesign", "profileImageUrl": "https://pbs.twimg.com/profile_images/2091589158426836992/KTRyppBu_normal.jpg"}, "authorId": "2029813579025637376", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoHOxaaoAAqTkU.png", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HVoHOxaaoAAqTkU.png:small"}], "translationZh": "Kimi K3.1 Pro 在我们的设计基准测试中登顶，以微弱优势领先 GPT-6.1 Sol 和 Terra。\n\n我们根据用户请求，使用真实设计任务测试了 21 款模型，Kimi 以 93% 的交付率领先。\n\n现已上线 OpenDesign，面向 Go、Plus、Pro 和 Max 套餐开放。https://t.co/hQJ6cBZ3LY"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoT2lAbEAAbXE8.jpg", "width": 2048, "height": 1012, "previewUrl": "https://pbs.twimg.com/media/HVoT2lAbEAAbXE8.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "Tom Huang", "role": "内容、视觉与多模态实践与观察", "why": "直接公开 OpenDesign 动效制作、修复及产品迭代，视觉工具来源清楚。", "handle": "tuturetom"}, "createdAtIso": "2026-10-27T10:17:49+00:00", "createdAtBeijing": "2026-10-27T18:17:49+08:00", "createdAtLocal": "10-27 18:17 北京", "url": "https://x.com/tuturetom/status/21150 const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
