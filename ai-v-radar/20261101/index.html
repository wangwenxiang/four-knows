"replyCount": 107, "retweetCount": 86, "likeCount": 650, "conversationId": "2116336030584574076", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116335546905624577/img/YZkunnQotYxJ2Ju2.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116335546905624577/img/YZkunnQotYxJ2Ju2.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116335546905624577/vid/avc1/1920x1080/hM4Cfi5O-xvfl900.mp4?tag=29", "durationMs": 62000}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116615708255698944/img/sCJOmvqZASferJTk.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116615708255698944/img/sCJOmvqZASferJTk.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116615708255698944/vid/avc1/1920x1080/8vOINXfv2KZLDUhU.mp4?tag=29", "durationMs": 63210}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-31T20:07:26+00:00", "createdAtBeijing": "2026-11-01T04:07:26+08:00", "createdAtLocal": "11-01 04:07 北京", "url": "https://x.com/dotey/status/2116623097839149231", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2116623097839149231", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "baoyu-design局域网共享", "evidence": "编辑、评论，并且实时同步", "rationale": "发布设计协作功能，说明访问方式与权限控制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2116589292562853989", "track": "research", "source": {"id": "2116589292562853989", "text": "happy halloween! 🎃\n\nwe made a fun benchmark to \"scare\" LLMs and OCR tools into output repeating characters \n\na lot of real-world documents have repeating characters that cause models to completely go off the rails \n\ncheck out boobench! \nlink: https://t.co/o6fQ6KBTcH\ndataset: https://t.co/BlmkEgYxWx", "createdAt": "Sat Oct 31 17:53:06 +0000 2026", "replyCount": 23, "retweetCount": 2, "likeCount": 17, "conversationId": "2116589292562853989", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2115845183027716486", "text": "We built a haunted house for doc parsers 🎃\n\nBoo Bench is 179 pages that push parsers into repetition loops. One model saw 246 redaction x’s on a page and wrote 23,004 of them.\n\nResults in thread!\n\nLeaderboard + paper: https://t.co/2JmEpgpPbj\nDataset: https://t.co/eKEtyCmQOZ https://t.co/F0u9Gcp94X", "createdAt": "Thu Oct 29 16:36:16 +0000 2026", "replyCount": 17, "retweetCount": 4, "likeCount": 20, "conversationId": "2115845183027716486", "author": {"username": "llama_index", "name": "LlamaIndex 🦙", "profileImageUrl": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, "authorId": "1604278358296055808", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz9-luXYAEIASr.jpg", "width": 2048, "height": 1075, "previewUrl": "https://pbs.twimg.com/media/HVz9-luXYAEIASr.jpg:small"}], "translationZh": "我们给文档解析器建了一座鬼屋 🎃\n\nBoo Bench 包含 179 页文档，专门让解析器陷入重复循环。一个模型在某页上看到 246 个用于遮盖内容的 x，结果输出了 23,004 个。\n\n测试结果见后续帖子！\n\n排行榜及论文：https://t.co/2JmEpgpPbj\n数据集：https://t.co/eKEtyCmQOZ https://t.co/F0u9Gcp94X"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116588717146271744/img/VOvmDS5UH7Hb9ucJ.jpg", "width": 1080, "height": 1350, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116588717146271744/img/VOvmDS5UH7Hb9ucJ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116588717146271744/vid/avc1/1080x1350/S78A3SKaWtYH8bM2.mp4?tag=29", "durationMs": 23500}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-10-31T17:53:06+00:00", "createdAtBeijing": "2026-11-01T01:53:06+08:00", "createdAtLocal": "11-01 01:53 北京", "url": "https://x.com/jerryjliu0/status/2116589292562853989", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2116589292562853989", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Boo Bench文档解析重复循环评测", "evidence": "179 pages", "rationale": "发布评测与数据集，报告重复输出失控案例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "万圣节快乐！🎃\n\n我们做了一个有趣的基准测试，用重复字符“吓唬” LLM 和 OCR 工具，诱使它们不断输出重复字符。\n\n许多真实文档中都有重复字符，会让模型彻底失控。\n\n来看看 boobench！\n链接：https://t.co/o6fQ6KBTcH\n数据集：https://t.co/BlmkEgYxWx"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2116330695270277159", "track": "enterprise", "source": {"id": "2116330695270277159", "text": "周末开始完整学习「2026 AI Agent 企业解决方案及落地实践手册」\n\n这份腾讯、腾讯云和 WorkBuddy 联合发布的 78 页手册，今天先从第一章「AI 整体解决方案」开始！\n\n第一章把腾讯云 Agent 叙事收成一条链：WorkBuddy 当办公入口与数字员工 → ClawPro 做开通与统一管控 → Agent Runtime 做沙箱与治理底座 → TokenHub 做统一模型入口；价值主张是组织产能从「人协同」转向「人定目标 + 数字员工交付」。\n\n全景图\n个人侧 LightClaw / QClaw，办公侧 WorkBuddy，研发 CodeBuddy，企业应用 ADP×ClawPro，知识乐享、营销企点、数据 Data Agent；底下是 TokenHub（混元+第三方）、Agent Runtime（执行引擎 / 云沙箱 / 记忆 / 网关 / 可观测），再配安全中心、网关、iOA 等。SkillHub 自称 25000+ 生态开源 Skills。主线是「超级个人 → 超级团队」。\n\nWorkBuddy：三阶段与「三代办公」\n· 能对话（问答工具，如 ChatGPT / DeepSeek）→ 能干活（办公助手，嵌工作流、调工具）→ 能上岗（数字员工：进业务系统、改数据、对结果与 KPI 负责）。\n· 办公范式：人操作软件 → 人在协同平台催办填报 → 人给目标、设边界、做判断；数字员工理解上下文、调工具、持续执行并交付完成的工作。\n· 文中强调：系统越复杂、流程越密，越是数字员工主战场；WorkBuddy 被定位成连接工具、岗位与企业资产的「企业 AI 工作台」。\n\nClawPro：管控台\n面向企业 IT：员工一键开通、任意 Agent（开源 / 自研 / 自定义）接入、多层安全（看·审·管·扫）、多 IM（微信 / QQ / 企微 / 飞书 / 钉钉等）、分组与 Token/Agent 配额、Claw Team 多 Agent 编排、私有 Skill 库。能力拼装含 IM、Skill、IAM、Mem、Cost、Net、轻量同构等。\n\nAgent Runtime\n以 Agent 为第一视角的基础设施：治理平台层 + 七大原子能力（Sandbox、Wall、Gateway、Identity、Observability、Skills、Memory 等）。沙箱隔离、出站/入站、零信任与凭证托管轮转、模型与工具网关审计、全链路可观测。服务对象含大模型厂商、Agent 服务商与行业企业。\n\nTokenHub\n统一大模型入口：混元 + 第三方，覆盖对话、推理、代码、视觉、图/视频等；按量、保障型资源、专属部署。对 WorkBuddy、Claude Code、Cursor、Cline、OpenClaw 等强调 同一 Base URL + API Key，兼容 OpenAI / Anthropic 双协议；个人套餐 / 在线推理 / 企业配额池分账。", "createdAt": "Sat Oct 31 00:45:31 +0000 2026", "replyCount": 33, "retweetCount": 22, "likeCount": 113, "conversationId": "2116330695270277159", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115785693599523089", "text": "腾讯、腾讯云和 WorkBuddy 联合发布了一份 78 页的「2026 AI Agent 企业解决方案及落地实践手册」\n\n整份材料用同一条产品叙事串起来：先用 WorkBuddy 把个人助手推成进业务系统的「数字员工」，再用 ClawPro、Agent Runtime、TokenHub 做开通、隔离、模型与治理；其余章节是这条底座在研发运维、SaaS、内容、社交、游戏、客服上的行业铺开。\n\n总框架：三阶段 × 三代办公\n· 能对话 → 能干活 → 能上岗：问答工具（文中举例 ChatGPT / DeepSeek）→ 嵌工作流、调工具的办公助手（WorkBuddy）→ 进入业务系统、对结果负责、按 KPI 交付的数字员工（Agent 工作台 + 业务系统集成）。\n· 三代办公：人操作软件（Office）→ 人在协同平台里催办填报 → 人给目标、设边界、做判断，数字员工理解上下文、调工具、持续执行并交付完成的工作。\n· 「超级个人 → 超级团队」：个人侧 LightClaw / QClaw 等，企业侧以 WorkBuddy 为入口，把人、Skill、连接器和管控面收成可复制的执行力。文中还区分狭义办公（个人生产力入口）与广义办公（真正改 CRM / ERP / MES 里的业务状态）。\n\n手册中也对 WorkBuddy、CodeBuddy、ClawPro、ADP、SkillHub 等在企业中的定位做了详细解释和区分。\n\n企业内部提效（方案册第 2 块）\n· WorkBuddy：用「业务大脑」拼全局判断；举例经鼎捷 MCP 操作真实 CRM/ERP/MES，强调联调验的是改状态而不只是能回答。上岗配置、财务/销售/交期等「以前 → 用了」对照页很多。安全侧自称工信部首批、信通院云端智能体基线首批、个保影响评估「二星级+」等。\n· CodeBuddy：从 AI 辅助到 AI 原生；规约（SPEC）显性化；需求—编码—QA—交付链路由 Agent 打底、人审验收。\n· 游戏研发 / 运营：策划与原型走 WorkBuddy，研发联调走 CodeBuddy；运营侧 DataBuddy 等数据 Agent。文称策划周期、Demo 周期明显缩短（具体倍数为自述）。\n· SRE / 数据库：WorkBuddy × CloudQ 做故障定位；DatabaseClaw 称积累十万级工单经验、1600+ OpenAPI、十余款库、分级处置。\n· 案例名：盛和、淘米（内容效率近 80%、覆盖约 80% 员工）、游族（47 模型、Agent 渗透率超 75%，并挂海外收入/毛利率变化）、游卡（MTTR 5–15 分钟、运维成本约 -40%）、搜狐畅游（P0 恢复缩短、重复运维 -70% 等）、花椒、紫龙、马帮等。\n\n业务创新的几个章节\n· SaaS Agent：订阅 → Credits → 按结果付费；界面操作走向 Skill/API。点名明略、熵简、慧算账、富通 JoinfClaw、蓝色光标、六度人和、光魔、天财商龙等。\n· 内容生产：营销图视频、游戏美术（Miora / Ardot 等）；2D 序列帧等效率对比为文中自述。筷子、LiblibAI、必凡、玩心不止、紫讯、小影、懂球帝等。\n· 社交陪伴 / 游戏内 AI / 客服：TokenHub + 音视频与语音链路；NPC 记忆与任务；客服/质检/外呼（天润融通、轻喜到家、智齿等）。延迟与解决率数字均为文中宣称。\n· 生态共建：Buddy 应用、专家、Skill、连接器、硬件；自称桌面办公智能体头部、千万级安装、十万级生态资产、百余伙伴（文中自述）；智慧芽、蜜度、MasterGo 等出现在伙伴页。\n\n完整报告，可以私信我获取（不是刻意引流哈，是因为没找到免费可公开访问的 PDF 地址，是一个付费下载地址，私信或留言我可以把 PDF 发给你）", "createdAt": "Thu Oct 29 12:39:53 +0000 2026", "replyCount": 206, "retweetCount": 34, "likeCount": 246, "conversationId": "2115785693599523089", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzFmHpa4AExYaA.jpg", "width": 1074, "height": 1520, "previewUrl": "https://pbs.twimg.com/media/HVzFmHpa4AExYaA.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV63Z3MWEAAjGNT.jpg", "width": 1074, "height": 1518, "previewUrl": "https://pbs.twimg.com/media/HV63Z3MWEAAjGNT.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV63igSXsAAOlbP.jpg", "width": 1074, "height": 1518, "previewUrl": "https://pbs.twimg.com/media/HV63igSXsAAOlbP.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T00:45:31+00:00", "createdAtBeijing": "2026-10-31T08:45:31+08:00", "createdAtLocal": "10-31 08:45 北京", "url": "https://x.com/shao__meng/status/2116330695270277159", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2116330695270277159", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "腾讯企业 Agent 方案与治理架构", "evidence": "分组与 Token/Agent 配额", "rationale": "详述企业接入、治理及案例，成效属于厂商自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116357741530821118", "track": "creative", "source": {"id": "2116357741530821118", "text": "AI 会用跟用好，差的是一套工程化的思维。\n\n就拿剪视频来说，同样用剪映，有的人能剪出百万播放的视频，有的人剪出来就几十播放。\n\n会用 AI，可能谁都能做出一个视频。到了用好这个阶段，得先知道剪视频这件事中间有哪几个环节，每个环节里哪些是最佳实践。\n\n拿简单的说，生成一段声音，方案就可多了。是让 AI 直接生成，还是让 AI 在公网上找一段免费的？是让 AI 去调别的产品生成，还是在本地找一段音乐？用真实的音乐，还是虚拟的音乐？\n\n做视频也一样。是像 AI 漫剧那样直接生成，还是用 AI 写代码、做特效的方式去组装？\n\nAI 漫剧那种，是用视频模型一次性把 10 秒钟的视频生成好。一个人物多了一根手指头，重新生成一段，手指头对了，但整个画面的细节跟第一个视频完全不一样了。\n\n组装的方式就不一样，视频的底子是原视频，字幕要改，就只改字幕这块，重新渲染一遍，可以精细化修改。\n\n还有，这一次做完，下一次怎么又省成本、又更快，风格还跟之前保持一样？第一个视频做的时候还在跟 AI 打磨，等形成模板之后，再做同类的视频，token 钱立刻就省下来不少。", "createdAt": "Sat Oct 31 02:33:00 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 2, "conversationId": "2116357741530821118", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-10-31T02:33:00+00:00", "createdAtBeijing": "2026-10-31T10:33:00+08:00", "createdAtLocal": "10-31 10:33 北京", "url": "https://x.com/jinchenma_ai/status/2116357741530821118", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2116357741530821118", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "视频制作的模块化组装与模板复用", "evidence": "字幕要改，就只改字幕这块", "rationale": "给出局部修改与模板复用的降本方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2116372595960668355", "track": "agent", "source": {"id": "2116372595960668355", "text": "最简单的 llm wiki，大道至简！\n\n之前好多人直接把 Karpathy 的 LLM Wiki 那篇文章丢给 AI，让 AI 去管理自己的知识库，结果知识库被 AI 处理得乱七八糟的。我之前踩过这个坑。\n\n其实最好的实践方法并不是把那篇文章丢给 AI 看，而是理解它索引在当下通用 Agent 下的作用。\n\n这样一个简单的索引地图，足以应付绝大部分个人知识库的场景。\n\n再提一点，索引地图不见得是一篇文档，也也可以是多个文档。在主索引文档里面，你可以再去指向其他子索引文档，按不同主题进行分类。", "createdAt": "Sat Oct 31 03:32:01 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 7, "conversationId": "2116372595960668355", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "quotedTweet": {"id": "2116354726476562809", "text": "给 AI 喂知识库，试下来最舒服的办法就是做一张Notion 索引清单\n\n本地只留分类、标题和对应链接，正文全部放在 Notion。平时写笔记、梳理思路，继续享受 Notion 的排版和阅读体验。AI 遇到具体的活，直接照着链接读原文\n\n两边各干各的，不用到处导出搬运，也不用折腾复杂的本地同步，轻巧省事\n\n我的部分示例 👇", "createdAt": "Sat Oct 31 02:21:01 +0000 2026", "replyCount": 9, "retweetCount": 1, "likeCount": 25, "conversationId": "2116354726476562809", "author": {"username": "ianneo_ai", "name": "Ian (伊恩)", "profileImageUrl": "https://pbs.twimg.com/profile_images/1891533502811865088/TGLd-ENY_normal.jpg"}, "authorId": "1249322582869852161", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7NS4JaMAAMq5M.jpg", "width": 904, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV7NS4JaMAAMq5M.jpg:small"}]}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-10-31T03:32:01+00:00", "createdAtBeijing": "2026-10-31T11:32:01+08:00", "createdAtLocal": "10-31 11:32 北京", "url": "https://x.com/jinchenma_ai/status/2116372595960668355", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2116372595960668355", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "用分层索引连接 Agent 与 Notion 知识库", "evidence": "本地只留分类、标题和对应链接", "rationale": "提供索引分层与按链接读取原文的具体方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2116341478981349755", "track": "agent", "source": {"id": "2116341478981349755", "text": "这是触发了 AI Slop 回复的什么机制？咋两个 AI 还自己聊起来了 🤦🏻‍♀️ https://t.co/XqHJKe7fYg", "createdAt": "Sat Oct 31 01:28:22 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2116341478981349755", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115986116482613486", "text": "Addy 谈 Claude Opus 5.5 时代怎么用 Claude Code\n\nClaude 5 系列模型开始，对「堆提示词、手把手拆任务」的依赖已经下降；更有效的做法是一条说清目标与验收方式的提示，让模型自己跑完并停下来。旧时代为弱模型写的长系统提示、强制拆子 agent、人肉盯多会话，往往在增加成本，却不一定更聪明。\n\n提示词：从「教怎么做」改成「要什么、怎么验」\n对 Opus 5.5，建议用一条提示：清楚说明要做成什么，以及 Claude 应如何证明自己做完了；再从 /effort medium 起调。目标还不清楚时，先让 Claude 采访你，直到它能写出一份规格；然后新开会话，用这份规格去实现，而不是在同一条嘈杂对话里硬撑。\n\nClaude 认为做完会自己停。若验收是可执行的（过/不过、要打赢的数字）且报告格式它能读，就可以在后台继续，不必一直盯着。长任务可用 /goal 设条件，由另一个模型在每轮后检查。\n\n系统提示与「给旧模型写的习惯」\n对 Claude Opus 5、Claude Fable 5，Claude Code 系统提示去掉八成以上，编程评测未见明显掉点。新模型出来后，可对自己的指令做同样实验：先删，再只加回模型真正漏掉的部分。/doctor 的 prompt-audit 会标出仍像为旧模型写的条目。建议每隔几个月审计一次工作方式，避免还在按旧模型时代搭流程。\n\n权限与自动模式\n近期 Claude Code 在交互式终端里默认 auto mode：用分类器看 Claude 要做的动作，而不是处处弹权限。作者明确说：这不是安全保证，盲目全批也不是。Claude 汇报结果时，应让它出示命令与输出，或截图。\n\n子 agent：少人为拆，多让它自己派\nClaude 会自行委派子 agent，多数时候不必点名。只在长审计、迁移等大体量、可独立的工作上主动要求；Opus 5.5 可把这类活拆给并行子 agent。琐碎活硬拆会抬高成本和延迟。子 agent 能并行、能给第二意见，但默认不会让结果更聪明。自建 agent 时，他观察到：单 agent + skills 往往在质量上胜过层层子 agent，成本和延迟也更低——与他此前关于「加子 agent 前先问解决什么问题」的观点一致。\n\n云会话、并行与 Projects\n要合上电脑就开 cloud session（claude. ai/code、Claude 应用，或 claude --cloud）：独立虚拟机、仓库新克隆，开之前先把本地提交推上去；手机可回看、回答会话提问，再审 diff、开 PR。任务依赖本机独有资源时，保持本地会话。\n\n并行会话只有在单会话能自己跑完之后才划算。没有 Project 时，人要当多个会话的经理。Projects（Pro / Max 公开测试）是一条长聊：贴进来的 issue / 任务会各自开线程（多为云会话）并行；统一指令一次生效；Overview 看哪些完成、哪些 PR 就绪、哪些等你。\n\n评审仍重要，但先自动化读一遍\nClaude Code 团队里，多数变更会先由 Claude 至少审修一轮，再给人看。可用 Team / Enterprise 的 Code Review，或更轻的 /code-review（在没看过本对话的子 agent 里审 diff）；也可新开会话，给规格并说明忽略风格问题。", "createdAt": "Fri Oct 30 01:56:17 +0000 2026", "replyCount": 45, "retweetCount": 5, "likeCount": 32, "conversationId": "2115986116482613486", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV1-JahaEAAqW55.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV1-JahaEAAqW55.jpg:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116341333652590593/img/6j_2B9PZaVkS_Qi6.jpg", "width": 1192, "height": 1208, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116341333652590593/img/6j_2B9PZaVkS_Qi6.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116341333652590593/vid/avc1/1192x1208/URPdxIzDF4gJuhat.mp4?tag=29", "durationMs": 9366}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T01:28:22+00:00", "createdAtBeijing": "2026-10-31T09:28:22+08:00", "createdAtLocal": "10-31 09:28 北京", "url": "https://x.com/shao__meng/status/2116341478981349755", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2116341478981349755", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "编程Agent的目标设定与验收方法", "evidence": "清楚说明要做成什么", "rationale": "引用内容给出提示、验收及独立评审方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116518147893190783", "track": "agent", "source": {"id": "2116518147893190783", "text": "这是我最近看到的很棒的技术讨论，浏览量非常高：我们是否还需要使用 git branches？\n\n作者之前讨论过 PR，认为应该扫尽历史垃圾堆里，branches 他认为一样，他主推的是：trunk-based development，不需要 Long-lived branches 和传统 PR 了，直接 push 到 main，大 PR 改动太多 非常不友好 branch 存活时间越长 差异越大 就越容易出问题\n\n他先质疑现状，很多人使用分支是因为“一直这样的惯性而已”，如果只是为了 CI，那么就是一次 commit，不需要开什么 branch\n\n一种反对意见是：“改动太大了 有数据库迁移 架构调整等等，不能直接上 main。” \n\n他认为：可以拆成小步，先加列，部署 \n再加 helper，部署 \n再逐步迁移 \n用 feature flag 配置开关等 \n几乎所有大改动都能拆成可安全合并的小步\n\n过去很难，是因为这种小改动多次的话，对人的心力消耗太大，所以倾向于一次大的改动\n\n而现在有了 AI 以后就没有这种问题了，持续集成到 main 的成本大幅下降\n\n这个想法还是很冲击我的，也是我最近看到非常精彩的一个观点，不知道大家有怎样的看法？", "createdAt": "Sat Oct 31 13:10:24 +0000 2026", "replyCount": 13, "retweetCount": 4, "likeCount": 21, "conversationId": "2116518147893190783", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2115852581364801911", "text": "Next question: why are you still using branches?\n\nWe talked about PRs. I don't think they make sense anymore, if you rethink them from first principles.\n\nYes, if you only use them to trigger CI, then sure, go ahead. That's a fat commit, not a PR. But for mandatory code review? Knowledge sharing? C'mon.\n\nBut some of you said: \"we use PRs because we use branches! I love to keep my stuff on branches.\"\n\nAnd I'm here to tell you: you don't need branches! You can just push to main.\n\nIt's called trunk-based development and the idea behind it is true continuous integration: you continuously integrate your changes with the trunk, the main branch.\n\nIt's been around for a while, it works. Just yesterday I talked with someone who said they've used it in an org with 400 engineers, without any issues. Ruby, the project, uses trunk-based development.\n\nThe main idea is that you want to avoid long-lived branches. They're bad, because branches can diverge and merging can turn into a thing. And you don't want routine operations to become a thing.\n\nEven when I worked in teams that used PRs and branches, I considered it a smell when a branch lived for longer than a day or two.\n\nBut when I shared this with others, I'd often get something back like this:\n\n\"Well, good for you, but no. MY thing, what I'm working on, that can't be done on main. It needs to be on a branch! It has a database migration, it changes the underlying shape, the architecture, it refactors this and changes that. It can't go on main yet! I need to merge it all at the end.\"\n\nAnd then I'd say:\n\n\"Nah, I can merge nearly anything continuously in small commits to main. You split things up. Add the column first, merge that, deploy it, now it's out, works, safe.\n\nAdd the helpers first, merge them, get them out.\n\nWant to migrate from legacy pattern A to new pattern B? Don't do it all at once. Add the dependency, then migrate A to B, one by one, safe.\"\n\nIf it can be merged in a large change, I bet it can be done in small increments that you merge to main.\n\nYes, there are exceptions, but it's 0.5% of cases, not 50%.\n\nBut there was a real problem with this approach: it was hard!\n\nThere's a lot of \"meta programming\" you have to do: make sure this small first change compiles and runs and the tests work, merge it, get it out, monitor it; then do the next small piece, make sure that works and get it out; then maybe push some still-unused dead code, add a feature flag, add a config variable; or keep both configurations working at the same time, etc.\n\nThat meant sometimes it was just easier to do it in a big fat branch. But big fat branches are risky!\n\nA system that continuously flows is safer than a system that starts and stops in spurts.\n\nBut -- you guessed it -- here's the good news:\n\nNow, with agents, all of these chores are no chores at all!\n\nAgents are great at adding feature flags, they're great at splitting up code, they're great at keeping track of three changes and merging them one by one and watching them roll out. They're great at keeping two configurations working for a day. They're great at migrating one by one.\n\nIn other words: it's now 10x easier to just work on main and make sure everything is continuously integrated and working.\n\nIt's now easy to make sure the system constantly flows.\n\nAnd look, ...\n\nI'm not here to convince you to switch to trunk-based development. Just a ruse to get you to read this. (But also, hey: try it! Pushing to main is amazing.)\n\nI'm here to make you RETHINK how you develop software.\n\nDon't just use agents to replace your typing.\n\nUse agents as the magic code-writing machines they are. Everything that was hard about software development because it involved writing code -- even the meta programming -- has become easier.\n\nYou can now reach for the stars! But you need to look up.", "createdAt": "Thu Oct 29 17:05:40 +0000 2026", "replyCount": 165, "retweetCount": 45, "likeCount": 1017, "conversationId": "2115852581364801911", "author": {"username": "thorstenball", "name": "Thorsten Ball", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073288299528024064/3itOM_L5_normal.jpg"}, "authorId": "414333187", "translationZh": "下一个问题：你为什么还在用分支？\n\n我们之前聊过 PR。如果从第一性原理重新思考，我觉得它们已经没什么意义了。\n\n当然，如果你只是用它来触发 CI，那就用吧。但那只是一次大提交，算不上 PR。可如果是为了强制代码审查？知识共享？得了吧。\n\n不过，有些人说：“我们用 PR，是因为我们用分支！我就喜欢把自己的工作放在分支上。”\n\n我要告诉你：你不需要分支！直接推送到 main 就行。\n\n这叫主干开发，背后的理念是真正的持续集成：不断将改动集成到主干，也就是主分支。\n\n它已经存在很久了，也确实有效。就在昨天，我还和一个人聊过，他们在一家有 400 名工程师的组织里采用这种方式，没有任何问题。Ruby 项目也采用主干开发。\n\n核心思路是避免长期存在的分支。它们的问题在于，分支可能逐渐分化，让合并变成一件麻烦事。而你肯定不希望日常操作变成麻烦事。\n\n即使以前在使用 PR 和分支的团队里工作，我也觉得一个分支存活超过一两天就是个不好的信号。\n\n但当我和别人分享这个想法时，经常会得到这样的回应：\n\n“好吧，你能做到挺好，但我不行。我正在做的这个东西，没法直接放到 main 上，必须用分支！它涉及数据库迁移，要改底层结构、架构，还要重构这里、调整那里。现在还不能进 main！我得等最后一起合并。”\n\n然后我会说：\n\n“不，几乎任何改动，我都能拆成小提交，持续合并到 main。把工作拆开就行。先加一列，合并，部署，让它上线，确认能用、安全。\n\n先加辅助函数，合并，上线。\n\n想从旧模式 A 迁移到新模式 B？别一次做完。先添加依赖，再逐个把 A 迁移到 B，稳稳地推进。”\n\n只要一项改动能整体合并，我敢说，它就能拆成小步，逐步合并到 main。\n\n没错，确实有例外，但只占 0.5%，而不是 50%。\n\n不过，这种方式以前确实有个问题：太难了！\n\n你得做大量“元编程”工作：确保第一步小改动能编译、能运行、测试能通过，再合并、上线、监控；然后做下一小步，确认能用再上线；接着可能要提交一些暂时用不到的代码，加功能开关、配置变量，或者让两套配置同时正常运行，等等。\n\n所以，有时在一个大分支里一口气做完反而更省事。但大分支风险很高！\n\n持续流动的系统，比时走时停的系统更安全。\n\n不过——你猜到了——好消息来了：\n\n有了智能体，这些杂活如今都不再是负担！\n\n智能体很擅长添加功能开关、拆分代码，也很擅长跟踪三项改动，逐一合并并观察上线情况。让两套配置并行运行一天，或逐项迁移，它们也很拿手。\n\n换句话说：直接在 main 上开发，并确保所有改动持续集成、正常运行，如今容易了 10 倍。\n\n现在，让系统始终保持流动已经很容易了。\n\n说到这里……\n\n我并不是来劝你改用主干开发的。那只是吸引你读到这里的小把戏。（不过，真的可以试试！直接推送到 main 的感觉很棒。）\n\n我想让你重新思考自己开发软件的方式。\n\n别只是用智能体替你敲代码。\n\n把智能体当作神奇的代码编写机器来用。过去软件开发中凡是因为需要写代码而困难的事，如今都变容易了，连那些元编程工作也是如此。\n\n现在，你可以伸手摘星了！但你得先抬头看。"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-10-31T13:10:24+00:00", "createdAtBeijing": "2026-10-31T21:10:24+08:00", "createdAtLocal": "10-31 21:10 北京", "url": "https://x.com/vikingmute/status/2116518147893190783", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2116518147893190783", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "借助 Agent 拆分主干开发改动", "evidence": "先加列，部署", "rationale": "给出迁移拆分与功能开关方法，收益属观点"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2116462055825801260", "track": "creative", "source": {"id": "2116462055825801260", "text": "GPT Image 2.5生成古风服装：星环月华。\n\n提示词：\n9:16竖版，高精度风格化3D东方幻想女性人物原型，high-end stylized 3D oriental fantasy character design，电影级动画角色CG渲染，融合中国古代星象美学与幻想高级时装设计。\n\n一位视觉年龄25–27岁的成年东方幻想女性，精致原创的东方动漫电影式美型五官，小巧心形鹅蛋脸，清亮微挑的细长杏眼，秀挺小巧的鼻梁，柔润自然的唇形，面颊柔和饱满，肌肤细腻通透，神情冷静、聪慧、神秘。人物颈部异常修长，肩膀纤窄，躯干细长，腰线极细，四肢修长，头部相对较小，整体呈现超现实却协调的纵向美感。\n\n发型雕塑： 浓密乌黑长发在头顶与脑后盘绕成巨大的交错环轨式发髻。三组大小不同的椭圆弧形发束从头顶向左右及后方交叉延伸，犹如古代浑天仪的环轨结构，但全部由真实细密的发束编织塑形，环轨之间保留清晰的镂空空间。局部嵌入细小金色星点与蓝色琉璃珠，耳侧垂落两缕极细长发。\n\n服装设计： 身穿深靛蓝与亮群青组合的东方幻想星象礼服。上身采用修长贴体的交叠斜领结构，肩部向两侧延伸出两道宽阔的半透明弧形披帛，如缓缓运行的星轨。纤细腰部由精密金线束带收束，裙身狭长，外层多条极细的丝绸长带沿不同弧线向下延伸，形成流星尾迹般的层次。局部织有抽象星宿连线与细密云气纹。\n\n整体轮廓： 头部巨大环轨结构形成横向 ://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, {"id": "2116541131060379754", "track": "tools", "source": {"id": "2116541131060379754", "text": "Surge太稳定了以至于没怎么打开过 app 界面😂", "createdAt": "Sat Oct 31 14:41:43 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 3, "conversationId": "2116541131060379754", "author": {"username": "luinlee", "name": "Zihua", "profileImageUrl": "https://pbs.twimg.com/profile_images/2111297667779432448/O7iHassM_normal.jpg"}, "authorId": "69492059", "quotedTweet": {"id": "2116530752938737785", "text": "Surge iOS 6 Beta Is Now on TestFlight\n\nFull introduction and release notes: https://t.co/sHx2unRqSN\n\nSurge iOS 6 is rebuilt for iOS 26: a new Home screen, Liquid Glass throughout, a faster request list, versioned profiles, and an MCP server for AI agents.\n\nA Free Update\n\nSurge iOS 6.0 is a free update with a huge number of improvements to the interface and the core engine. Only a few new features need an active update subscription: the new Home screen, Profile History, and the MCP server.\n\nIf your update subscription has expired, you can now try every feature free for 7 days. Explore what’s new first, then decide whether to renew.\n\nSurge 6 also removes the update-subscription requirement from proxy protocols, every protocol is now available to every Surge user. (WireGuard, Tailscale, and SSH are excluded because they are not proxy protocols.)\n\nAbout the Design\n\nWhen you first see the new colors, you might think “this looks like AI slop.” Well, it’s not.\n\nWe’ve used this blue-purple palette since Surge v3 in 2018, long before the AI era. Surge iOS 6 builds on it and brings in the design language of Surge Mac 6 and Liquid Glass. We spent a lot of time refining the result.\n\nWe redesigned and reorganized almost every screen.\n\nWhat’s New\n\n- Home: Your network at a glance. Activity, Network, External IP, Bandwidth, DNS, Usage, Top Traffic, Policy Latency, and Events all live on one dashboard.\n- Liquid Glass: Configure, policy group cards, and menus use the new iOS 26 material. Menus open right where you tap.\n- Requests: Every row shows a site icon, status color, and protocol badge. A filter bar stays pinned to the top of the list.\n- Profile History: Every save is a version. Review changes before saving, compare any two versions, and roll back in one tap.\n- iPad and iPhone Duo: When there’s room, Surge switches to two panes, so the dashboard stays next to your settings.\n- MCP Server: Agents like Claude Code get the same control as surge-cli. MCP apps on the iPhone itself, such as FlowDown and Minis, can drive Surge directly.\n- Engine: Tailscale exit node and subnet routes, WireGuard listen port, adaptive QUIC blocking, UDP over SOCKS5 Wi-Fi Access, and no more rule set size limit. All of these are shared with Surge Mac 6.11.\n\nHow to join the TestFlight beta: https://t.co/SZOjsWe5yL", "createdAt": "Sat Oct 31 14:00:29 +0000 2026", "replyCount": 0, "retweetCount": 11, "likeCount": 92, "conversationId": "2116530752938737785", "author": {"username": "nssurge", "name": "Surge", "profileImageUrl": "https://pbs.twimg.com/profile_images/649976113943281664/DorScvl8_normal.png"}, "authorId": "3760440505", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116530630704201728/img/gX5xxaOmUkm8rbdl.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116530630704201728/img/gX5xxaOmUkm8rbdl.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116530630704201728/vid/avc1/1920x1080/HfBECyCCbhg2BYQg.mp4?tag=29", "durationMs": 17200}], "translationZh": "Surge iOS 6 Beta 现已登陆 TestFlight\n\n完整介绍及更新说明：https://t.co/sHx2unRqSN\n\nSurge iOS 6 针对 iOS 26 全面重构：全新首页、贯穿全局的 Liquid Glass、更快的请求列表、支持版本管理的配置，以及面向 AI 智能体的 MCP 服务器。\n\n免费更新\n\nSurge iOS 6.0 是一次免费更新，对界面和核心引擎进行了大量改进。只有少数新功能需要有效的更新订阅：全新首页、配置历史和 MCP 服务器。\n\n如果你的更新订阅已到期，现在可以免费试用全部功能 7 天。先体验新功能，再决定是否续订。\n\nSurge 6 还取消了代理协议对更新订阅的要求，所有 Surge 用户现在都可以使用全部代理协议。（WireGuard、Tailscale 和 SSH 除外，因为它们不属于代理协议。）\n\n关于设计\n\n初次看到新的配色，你可能会觉得“这看起来像 AI 生成的粗制滥造作品”。其实并不是。\n\n早在 2018 年的 Surge v3，我们就开始使用这套蓝紫配色，远早于 AI 时代。Surge iOS 6 在此基础上融入了 Surge Mac 6 和 Liquid Glass 的设计语言。我们花了大量时间打磨最终效果。\n\n我们重新设计并调整了几乎所有界面的布局。\n\n新功能\n\n- 首页：网络状况一目了然。活动、网络、外部 IP、带宽、DNS、用量、流量排行、策略延迟和事件，全部集中在一个仪表盘中。\n- Liquid Glass：配置界面、策略组卡片和菜单采用 iOS 26 的全新材质。菜单会直接在点击位置展开。\n- 请求：每一行都显示网站图标、状态颜色和协议标识。筛选栏固定在列表顶部。\n- 配置历史：每次保存都会生成一个版本。保存前可查看改动，任意两个版本均可比较，并支持一键回退。\n- iPad 与 iPhone 双栏：空间充足时，Surge 会切换为双栏布局，让仪表盘与设置并排显示。\n- MCP 服务器：Claude Code 等智能体可获得与 surge-cli 相同的控制能力。iPhone 本机上的 MCP 应用，如 FlowDown 和 Minis，也能直接控制 Surge。\n- 引擎：支持 Tailscale 出口节点和子网路由、WireGuard 监听端口、自适应 QUIC 屏蔽、通过 SOCKS5 Wi-Fi 接入转发 UDP，并取消规则集大小限制。这些改进均与 Surge Mac 6.11 共享。\n\n如何加入 TestFlight 测试：https://t.co/SZOjsWe5yL"}, "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Zihua", "role": "开源产品与工程实践实践与观察", "why": "PNGDeer 有开源、在线测试和同质量压缩比较，连接 AI 工程与视觉交付。", "handle": "luinlee"}, "createdAtIso": "2026-10-31T14:41:43+00:00", "createdAtBeijing": "2026-10-31T22:41:43+08:00", "createdAtLocal": "10-31 22:41 北京", "url": "https://x.com/luinlee/status/2116541131060379754", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2116541131060379754", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Surge iOS 6测试版发布", "evidence": "Surge iOS 6 Beta Is Now on TestFlight", "rationale": "引用发布说明包含MCP、配置版本与引擎更新"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2111297667779432448/O7iHassM_normal.jpg"}, {"id": "2116398126546526443", "track": "tools", "source": {"id": "2116398126546526443", "text": "这次随之发布的，还有大家以前一直想要的网页排版 skill（guizang-pages-skill），也内置在插件里了。\n\n它会帮你把图文、视频排成一个非常精美的网页，所有的字体、字号、间距和细节都是为了阅读而设计的，尤其针对中文排版做了很多优化。\n\n右下角可以自定义样式，也做了移动端优化。\n\n同时它还可以帮你导出 PDF，非常适合将自己写的内容和 AI 的内容分享给朋友们", "createdAt": "Sat Oct 31 05:13:28 +0000 2026", "replyCount": 32, "retweetCount": 10, "likeCount": 71, "conversationId": "2116398126546526443", "author": {"username": "op7418", "name": "歸藏(guizang.ai)", "profileImageUrl": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, "authorId": "1669276256", "quotedTweet": {"id": "2116203707318841379", "text": "终于把自己的几个设计 Skill 合并了！\n\n做成了一个 DSH 的插件 dsh-guizang-design\n\n共用一套设计系统和 Design Token，还加了几个有用的功能 https://t.co/PmrL9Cx3yL", "createdAt": "Fri Oct 30 16:20:55 +0000 2026", "replyCount": 56, "retweetCount": 61, "likeCount": 572, "conversationId": "2116203707318841379", "author": {"username": "op7418", "name": "歸藏(guizang.ai)", "profileImageUrl": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}, "authorId": "1669276256", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5EDJ6awAAnT26.jpg", "width": 1160, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HV5EDJ6awAAnT26.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV70bWrbAAAPwBQ.jpg", "width": 2048, "height": 1316, "previewUrl": "https://pbs.twimg.com/media/HV70bWrbAAAPwBQ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "歸藏", "role": "内容、视觉与多模态实践与观察", "why": "有多 Agent 记忆协作和多模态产品实测，创作工具覆盖广。", "handle": "op7418"}, "createdAtIso": "2026-10-31T05:13:28+00:00", "createdAtBeijing": "2026-10-31T13:13:28+08:00", "createdAtLocal": "10-31 13:13 北京", "url": "https://x.com/op7418/status/2116398126546526443", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2116398126546526443", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "网页排版Skill与设计插件", "evidence": "网页排版 skill（guizang-pages-skill）", "rationale": "介绍排版工具，含中文优化、移动适配及PDF导出"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1636981205504786434/xDl77JIw_normal.jpg"}], "preview": false, "productionMonitored": 122};
const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
