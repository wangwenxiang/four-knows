const DATA={"records": [{"id": "2116541149443698968", "track": "agent", "source": {"id": "2116541149443698968", "text": "DeepSeek Harness 团队 Super-agent 设计探索：迈向更自主的 Agent 系统\n\nDeepSeek Harness 团队的工程架构探讨分享，团队认为，单任务 Agent 已经够强，瓶颈变成「人同时盯得住几个 Session」。Super-agent 要把 Agent 做成跨信道连续、能并行多任务、事件驱动主动干活、云端持久在线的实体；做法不再堆一个聊天窗口，转而用经典计算机系统思路（双层 Router/Worker、事件过滤与直通、异步 ReAct、存算分离加端侧 daemon、外部 Watchdog）把 Session 变成实现细节，人只做高层决策与验收。\n\n问题从哪来\nCoding Agent 证明模型能少盯着干活；个人助手又把消息、日程、邮件接进来，变成持续在线、事件驱动。但主流设计仍以单一 Session 为基本单位：并行几件事就要人手动切 Session、自己记上下文，一个人通常只能跟住大约 3–5 个活跃 Session。于是单任务上限看模型，多任务上限看人的注意力。只在本地单会话上挂 CLI/MCP，仍躲不开同步阻塞、上下文搅在一起、设备离线就停。\n\n# 四个基础特征\n\n连续（IM、GitHub 评论像同一个 Agent，不问「Session X 里有没有 Y」）、高效（可并行多任务，不必等上一条做完才能说下一条）、主动（持续观察环境，该出手才出手）、持久（始终在线，异常能自愈）。文中举例：同一开发任务在 IM 与 GitHub 之间连续推进；公共群无人 @ 也能主动定位根因并提修复 PR。\n\n单个 ReAct Loop 撑不住这四点，于是拆成五个模块。\n\n1. 双层架构：连续性 vs 吞吐\n· 全进一个 Session：上下文最连，但串行慢、细节互相污染。\n· 每条事件新开 Session：吞吐高，缺全局上下文，对用户也乱。\n\n解法：Router 层常驻，承接人类交互与全局协调，当序点、协调点、记忆；不亲自执行具体任务（甚至可不挂 Bash）。Worker 层上下文隔离、挂满工具，专做单任务，用最强模型；对外不直接说话，状态汇报给 Router，由 Router 统一回复。\n\n文中刻意区分：常见 Agent Team 是一个复杂任务内部拆角色，Lead 推理很重；这里的 Router 只管任务之间的高层分派。实践里 Router 往往用更轻模型就够。事件积压时 Router 会把多条 Trigger 批进一次长输入短输出的调用；积压适度时，单个决定摊到的推理时间反而下降（7.2 节有压测）。规模再大再谈 Router 内多层过滤或水平切分——切得越细吞吐越高、全局连续性越差，在全局记忆未解前这权衡一直在。\n\nWorker 内部仍可再开 Subagent 或自己就是 Team，对 Router 透明。个人助手前端一个聊天框，底层也可按话题分 Worker。\n\n2. 事件驱动：Trigger，不是等人逐条打字\n驱动主输入改成群聊、邮件、日程、Code Review、CI 等半结构化 Trigger。\n· 两级过滤（Fast/Slow Path）：程序层按来源、群组、白名单等确定性规则先砍噪音；过线的再交给 LLM 做语义判断（提示词可随时改策略）。\n· 订阅与直通：同一 PR / IM 话题 / 邮件串 = Thread。Router 冷启动建 Worker 并订阅后，同 Thread 后续事件程序直通 Worker，不再每次经 Router 转发；Router 仍可观测全局，但只管未订阅的新事件。Thread↔Worker 多对多：多人改同一环境时共享事件、自行发现冲突，结论仍经 Router 对用户说。\n· Inline & Spill + 链式召回：把上下文窗口当 Cache，近期高概率信息 Inline，长内容 Spill 成摘要/续读入口。对象带唯一 ID，注入时内联下一跳关联 ID，形成引用图，需要时多跳按需展开（消息→Thread→Worker→另一评审 Thread）。\n· 投机执行：会议邀约可先对日程、备资料、起草回复；群里讨论 bug 时可后台静默复现，确认简单可修才交结果，否则保持安静。\n\n3. 面向人的交互\n· 异步 ReAct：耗时工具从同步 run() 改为 start()/stop()，立刻返回 Started，结果事后当事件投回；前台可继续收指令。文称 DeepSeek Harness 已实现但尚未默认开启。\n· 按信道改输出带宽：IM 低打扰、单次回复不超过约 100 词；GitHub/邮件写结构化背景、改动说明与验证。\n\n4. 计算、状态与环境分离\n本地 Agent 常把 Loop 计算、会话状态、仓库与工具链绑在一台机器上，休眠即停。两步拆开：\n· Loop 放云端无状态弹性容器，Session 状态进数据库 → 云端持久在线。\n· 重状态执行环境留在原地，端侧只跑无会话状态的轻量 daemon 执行命令、回结果（BYOM：日常开发机也可接入）。文中对齐 Anthropic「脑手分离」，但场景更强调个人机上未提交改动与本地凭据，而不仅是托管沙箱/VPC。\n\n5. Watchdog（外部 Control Loop）\n独立 Watchdog Session，定时消息驱动：既看接口/状态等基础设施，也用模型看 Worker 有没有实质进展、是否跑偏。维护者可用自然语言问它、让它改提示词或触发规则。\n\n实验（合成负载，初步参考）\n约 300 条消息、约 20 条工作请求，编码用耗时占位工具。Super-agent 任务完成时间 p50/p95 约 12.4 / 15.7 分钟，好于「单 Session + Subagent」：中性提示下模型 5 次都不委派、被新消息打断，p95 约 29.5 分钟；强调委派后仍整体更慢且偶发长尾。代价是多会话带来更高读缓存 token。去掉直通后完成时间差不多，但 Router 决定数约 +30%、读缓存 token 约 +37%；直通主要省 Router 开销，不直接加快完成。Router 压测：Trigger 从约 1 条/分到约 40 条/分，平均 batch 1.0→2.8，单次请求 2.5s→3.9s，单个决定分摊推理时间 6.4s→1.6s。\n\n未解问题（第 8 节）\nRouter 何时切分、Worker 何时要直连通信；跨月长程记忆；Session 对用户隐藏后，产品侧任务呈现与中途介入怎么做；组织级上下文边界与 A2A；云端 Loop + 端侧 daemon 的入侵面与「用不接触凭据本身」的凭据使用。文末强调：若安全隐私无解，Super-agent 只能缩在很小的可信范围里。\n\nGitHub dsh-superagent-prototype 主笔 Yujia Qiao\nhttps://t.co/X0QHiz1EWP\n公众号文章地址\nhttps://t.co/uV7BYwUpGu", "createdAt": "Sat Oct 31 14:41:48 +0000 2026", "replyCount": 17, "retweetCount": 4, "likeCount": 52, "conversationId": "2116541149443698968", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV9241iXIAAmYGf.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV9241iXIAAmYGf.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T14:41:48+00:00", "createdAtBeijing": "2026-10-31T22:41:48+08:00", "createdAtLocal": "10-31 22:41 北京", "url": "https://x.com/shao__meng/status/2116541149443698968", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2116541149443698968", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Super-agent 架构原型与合成负载实验", "evidence": "双层 Router/Worker、事件过滤与直通", "rationale": "提供完整架构、实验对照及未解问题"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116381900969541836", "track": "research", "source": {"id": "2116381900969541836", "text": "昨天刚分享完《Memory Tax》，结论是复杂 Memory 在整理和压缩历史时，可能反而损失原始信息。\n\n结果今天又看到一篇更直接的：\n\n很多精心设计的 Agent Memory，最后还真不一定打得过最朴素的 Raw-RAG。\n\n这两篇放在一起看挺有意思。\n\n昨天那篇在解释「Memory 为什么会产生税」，今天这篇则在问：如果直接保留 raw history 做检索，究竟能走多远？\n\nRaw-RAG 的方法非常简单：\n\n保留原始对话历史，切成带重叠的文本块；先做 dense retrieval，再用 reranker 筛一遍，最后把最相关的原始证据交给 LLM 推理。\n\n中间没有 LLM 摘要、记忆重写、UPDATE / DELETE，也没有复杂的图结构。\n\n结果在 LoCoMo、LongMemEval、MEME 和 MemoryAgentBench 上，7 组模型设置里拿下 6 组第一，比最强的对比 Memory 系统高 0.13–5.53 个百分点。\n\n论文进一步分析了原因。\n\n很多问题真正需要的证据，并不只是某个「答案值」，还包括时间顺序、前后关系和依赖路径。\n\nMemory 一旦把历史压缩成独立事实或摘要，这些关系很容易在整理过程中被削弱。甚至把完整的 transformed memory 全部交给模型，效果依然和直接看 raw evidence 存在差距。\n\n当然，这也不代表 RAG 随便做就行。\n\n论文里去掉 reranking 后，MemoryAgentBench 的分数从 48.32 降到 44.40；只返回一个检索结果，下降更明显。\n\n所以问题可能没那么复杂：\n\n先把原始信息保存好，再把 retrieval 和 reranking 做扎实，已经能覆盖很多长时对话 Memory 场景。\n\n两篇论文连着看，给我们的提醒很重要：\n\n做 Agent Memory 之前，最好先问一句，这套复杂机制，究竟比 raw-history RAG 多带来了什么？\n\n如果连这个 baseline 都没稳定超过，复杂本身可能还算不上进步。\n\n📎 arxiv: https://t.co/eF8TH1Vczf", "createdAt": "Sat Oct 31 04:09:00 +0000 2026", "replyCount": 8, "retweetCount": 9, "likeCount": 100, "conversationId": "2116381900969541836", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2116008943126552615", "text": "RAG 又杀回来了。\n\n最近 Agent Memory 越做越复杂，但这篇《Memory Tax》发现了一个挺尴尬的结果：\n\n很多专门设计的 Memory 系统，最后还不如直接对 raw history 做 RAG，而且成本更高。\n\n作者把 Memory 的价值拆成两部分：\n\nMemory Benefit：RAG 答错，但 Memory 答对的问题。\n\nMemory Tax：RAG 本来能答对，经过 Memory 处理后反而答错的问题。\n\n问题就出在「整理记忆」这一步。\n\n历史被摘要、重写和结构化以后，一些细节会直接丢失；另一些虽然还在，却变得更难检索。\n\n比如在 LongMemEval 上，Qwen3.6-27B 用两轮 RAG 能做到 81.4%，GPT-5.6 Luna 达到 90%，都高于对应的复杂 Memory 方案。\n\n一个简单的修补反而很有效：\n\nMemory 继续用，但同时保留 raw history 的检索通道，再把两边结果一起 rerank。\n\n这篇工作也给我们做了一个提醒，给 Agent 加 Memory 之前，最好先拿最简单的 raw-history RAG 做个 baseline。\n\n有时候，真正昂贵的并不是「没记住」，而是过早把原始信息总结掉了。\n\n📎 arxiv: https://t.co/qgKpDVD09d", "createdAt": "Fri Oct 30 03:27:00 +0000 2026", "replyCount": 22, "retweetCount": 44, "likeCount": 388, "conversationId": "2116008943126552615", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzy7RzaoAAd5Ny.jpg", "width": 1154, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HVzy7RzaoAAd5Ny.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7YQBDWwAA4C4U.jpg", "width": 1440, "height": 1789, "previewUrl": "https://pbs.twimg.com/media/HV7YQBDWwAA4C4U.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-31T04:09:00+00:00", "createdAtBeijing": "2026-10-31T12:09:00+08:00", "createdAtLocal": "10-31 12:09 北京", "url": "https://x.com/Xudong07452910/status/2116381900969541836", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2116381900969541836", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Raw-RAG与复杂Agent记忆系统对比", "evidence": "7 组模型设置里拿下 6 组第一", "rationale": "介绍研究结果、检索流程及消融实验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116535521644105826", "track": "research", "source": {"id": "2116535521644105826", "text": "横向对比中国团队最新发布的三个 OCR 模型\n\n@OpenBMB @XiaomiTech_ @Baidu_Inc 分别发布了自己最新的 OCR 模型，MiniCPM-OCR-1.0、Xiaomi-OCR-0 和 Unlimited-OCR-2，三个模型 OCR 能力都很强，但也各有侧重，咱们展开看看。\n\nMiniCPM-OCR-1.0 (1.3B)\n以 MiniCPM-V 4.6：SigLIP + Qwen3.5 为基座，主攻中英文档解析质量 × 页吞吐，Real5 - 93.68、OmniDoc v1.6 - 96.51、Wild - 92.39、olmOCR - 82.7、OCRBench v2 - 54.7，吞吐 1.217 pages/s\n\nXiaomi-OCR-0 (0.8B)\n以 Qwen3.5-0.8B-Base 为基座，主攻单页解析 + OCR 向理解（VQA/KIE），Real5 - 95.24、OmniDoc v1.6 - 96.83、Wild - 87.94、五榜 OCR-VQA - 均 83.2，吞吐 0.724 pages/s\n\nUnlimited-OCR-2 (3B/A0.5B)\n以 DeepEncoder + MoE 解码器、v2 全层换 SR-SWA 为基座，主攻超长文档「一次通读」、自推 MarathonDocBench，MPDocBench Overall - 约 84.6、MarathonDocBench - 77.06，吞吐 0.246 pages/s\n\n怎么选（按场景）\n· 单页/少页、要质量与理解（问答、字段 JSON）、显存紧：优先看 Xiaomi-OCR-0，参数最小，Real5 / OmniDoc 自报最强档之一，且原生 KIE/VQA。\n· 批量流水线、要 pages/s、要 SDK/量化/质检闭环：优先看 MiniCPM-OCR-1.0，同场吞吐最高，Wild + 版面管线完整，Jev 适合「解析完先过一道闸」。\n· 合同/书籍/论文包一次解析、跨页表文不能断：优先看 Unlimited-OCR-2，赛道本身不同；拿 OmniDoc 单页分和前两家硬刚意义不大。\n\n# 各家模型卖点展开梳理\n\nMiniCPM-OCR-1.0：解析流水线 + 速度与工程完整度\n任务面写清：文本、表、公式、图表、印章、KIE；管线是 模型 + PP-DocLayoutV3 + minicpmvocr SDK（先版面再分块再拼 Markdown）。视觉侧 4× 压缩、scale_resolution 448、最多 9 片。和 Xiaomi 比：OmniDoc v1.6 略低（96.51 vs 96.83）、Real5 略低（93.68 vs 95.24），但 Wild 明显更高（92.39 vs 87.94），且官方注明 Wild 分数含 SDK 旋转校正，横向比时要留心。OCRBench v2 54.7 是它强调的「通用识别」数字。吞吐在 OpenBMB 同场表里领先；同表里 Xiaomi、Unlimited-OCR2 分别约其 0.59× / 0.20×。另配 MiniCPM-OCR Jev：不解析，只判对错并给概率，做自动放行 / 人审分流。微调路径写了 LLaMA-Factory、ms-swift。\n\nXiaomi-OCR-0：小参数把「解析」和「读懂」绑在一起\n训练称约 1.7 亿 OCR 向样本：Q-Mask 锚点 → OCR 向 CPT → Mix-RL。数据引擎用多专家共识（ETC）、渲染回判、失败驱动合成；专家池点名 PaddleOCR-VL-1.5/1.6、MinerU2.5-Pro、GLM-OCR、TeleOCR、OvisOCR2 等。卖点是：一份权重覆盖整页 Markdown（表 OTSL、式 LaTeX）、区域文本/表/式、以及按 schema 的 KIE。基准上 Real5 压过同档开源；OCR-VQA 五榜均分 83.2，高于同尺 Qwen3.5-0.8B（72.9）和更大的 Qwen3.5-2B（80.9），仍低于 Qwen3.5-4B（84.9）；报告自己也写：理解比解析更吃参数。手写/书法 Chronicles-OCR 成熟书体约 73，与 Seed 2.0 Pro（72）同量级。社区已有 GGUF，官方未背书量化精度。\n\nUnlimited-OCR-2：把「页循环」收成一次前向\n问题陈述很清楚：常规端到端 OCR 一页一页 for-loop，KV 随输出变长；人抄书只盯当前段。v1 用 R-SWA（始终看见全部视觉参考 token，输出侧只滑窗看最近 n 个，默认 128），在 DeepSeek-OCR 上续训约 2M 文档样本，OmniDoc 上相对基线大涨，并宣称数十页一锅端。v2 再上 SR-SWA：把超长序列上的文视交互压到固定规模工作参考（例如 512 token），使逐步解码延迟与显存近似与文档长度无关；百页规模自称相对 Full Attention / R-SWA 有约 7.0× / 5.6× 逐步加速。配套 MarathonDocBench（100–300 页、跨页文本/表更密），Overall 77.06；较短的多页榜 MPDocBench 约 84.6。推理上单页默认 gundam 动态切块，多页 base 全局一页一视图；SGLang 侧有页窗调度与大量显存旋钮。代价是：在「单页吞吐」同场赛里偏慢，工程依赖定制服务栈，不如 MiniCPM「开箱多后端」。", "createdAt": "Sat Oct 31 14:19:26 +0000 2026", "replyCount": 10, "retweetCount": 2, "likeCount": 18, "conversationId": "2116535521644105826", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV9x0k6W4AAYNvq.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV9x0k6W4AAYNvq.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T14:19:26+00:00", "createdAtBeijing": "2026-10-31T22:19:26+08:00", "createdAtLocal": "10-31 22:19 北京", "url": "https://x.com/shao__meng/status/2116535521644105826", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2116535521644105826", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "三个 OCR 模型的能力与场景比较", "evidence": "MiniCPM-OCR-1.0 (1.3B)", "rationale": "汇总模型架构、基准与选型限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116335784626209071", "track": "creative", "source": {"id": "2116335784626209071", "text": "Armin Ronacher 的 Qwen3-TTS 自定义音色笔记\n\nArmin 和孩子做地下城爬行小游戏时需要旁白，又不想用大众脸 AI 声线，就想到用 Qwen3-TTS 的 Base 克隆给出约 2048 维说话人嵌入；把它塞进 CustomVoice 的同一说话人槽位，就能在克隆音色上加「悲伤 / 耳语」类指令；嵌入还能做加权混合、回烤成参考音，甚至用「平均女声 − 平均男声」方向挪动性别感，可玩性很高！\nhttps://t.co/N3EiKHykv3\n\nQwen3 三类模型\n· Base（1.7B / 0.6B）：几秒参考音频克隆；支持上下文克隆或只用 speaker embedding\n· CustomVoice：九个内置说话人 + 指令（如情绪、风格）\n· VoiceDesign：用文字描述「发明」一个声音\n\nArmin 遇到的问题：Base 能克隆，但文档路径下不能一边克隆一边下指令（「伤心地说」）。官方变通多是：单说话人微调 Base，或 VoiceDesign 出一段再拿 Base 克隆，指令能力会丢。\n\nArmin 怎么做的？\n从 PyAI Conf 演讲里剪约 28 秒、停顿之间完整句，Whisper 出转写。强调：不需要特别干净或特别长；放到低质量通话场景里，骗过熟人并不难（提醒滥用风险）。\n\n可用 VoiceDesign 先造一条「四十来岁、温暖、中低音、平静朗读」的音色，再与本人录音对照、混合。\n\n嵌入与混合\nx_vector_only_mode 下，Base 从录音抽出 speaker embedding（约 2048 个数）。同一人相近、不同人分开；也可粗做说话人切分。因为是向量，可做加权平均并按范数缩放，得到「介于两人之间」的音色。文中用本人与设计音做十一档混合：很快就不像本人，但仍保留部分特征，整体更独特。两路录音频谱接近（类似麦与环境）时效果更好。喜欢的混合可再合成一段音频、重新 fingerprint，回烤成单一参考文件（不完全等于原混合，但更好管）。\n\n说话人识别上：用会议片段当参考去认播客里的自己，Qwen3 几乎不行；改用播客开头约 20 秒自我介绍当参考，对后续窗口约 98% 对。专门的说话人验证模型（如 ECAPA）用会议片段也能约 97% 找回。\n\n给克隆音色下指令\n观察：CustomVoice 与 Base 操纵说话人的方式同类，往 talker 输入序列插一个向量；CustomVoice 用表中的一行，Base 用 x-vector；生成代码两边都能接，权重几乎相同。于是：用 Base 抽嵌入，交给 CustomVoice 的 voice_clone_prompt，再带 instruct。悲伤等指令在克隆音上不如内置说话人稳，但 Armin 觉得已够给游戏做「别人游戏里不太会撞车」的定制旁白。\n\n性别轴算术\nVoiceDesign 各做 14 个男声 / 女声，取平均差当方向，把任意嵌入沿该轴平移（保留其余成分）。文中展示了本人克隆沿轴挪动的样例。收尾 rem：「Use it for good, not evil。」", "createdAt": "Sat Oct 31 01:05:45 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 9, "conversationId": "2116335784626209071", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115885628420141263", "text": "My boys and I continue to build our little game with AI and a side adventure has been voice overs with custom voices with Qwen3 TTS. Wrote down my learnings from playing with it for a while now.  https://t.co/3wMz0jnMZK", "createdAt": "Thu Oct 29 19:16:59 +0000 2026", "replyCount": 15, "retweetCount": 5, "likeCount": 182, "conversationId": "2115885628420141263", "author": {"username": "mitsuhiko", "name": "Armin Ronacher ⇌", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905698833084174336/jcHMkWFA_normal.jpg"}, "authorId": "12963432", "translationZh": "我和儿子们继续用 AI 制作我们的小游戏，还顺带探索了用 Qwen3 TTS 定制声音来配音。我把这段时间摸索的心得写了下来。https://t.co/3wMz0jnMZK"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV68J-_XoAAbe7o.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV68J-_XoAAbe7o.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T01:05:45+00:00", "createdAtBeijing": "2026-10-31T09:05:45+08:00", "createdAtLocal": "10-31 09:05 北京", "url": "https://x.com/shao__meng/status/2116335784626209071", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2116335784626209071", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Qwen3-TTS 音色克隆与指令控制", "evidence": "用 Base 抽嵌入，交给 CustomVoice", "rationale": "提供音色混合、指令控制方法及效果局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116328500936265843", "track": "research", "source": {"id": "2116328500936265843", "text": "这个想法很疯狂！\n\nQwenputer 在 Qwen3.5-4B 上用编译器把一台确定性 RISC-V CPU 写进额外层与权重，并把模型自带的 Gated DeltaNet (GDN) 状态当可寻址 RAM，在前向里跑加减乘除、C 和 MicroPython，不调外部 runtime；大数运算接近「基座 + Python 工具」，还顺手塞进实验性「硬盘」。\nhttps://t.co/3GEnraNsvt\n\nQwenputer 到底是什么？\n作者写得很清楚：不是插件、不是工具调用、不是沙箱。基座权重保持原样，前面加了约 11 层「计算机」权重（相对 Qwen 的 32 层）。CPU 是 32-bit RISC-V（RV32IM，加 Zba 和小 bignum 单元），官方 riscv-tests 通过，与 qemu 对齐；作者称自由跑了约 1800 万条指令无错。每条指令会变成若干生成 token（地址、值、STEP），这些 token 就是执行轨迹；小驱动 RvChat 负责装固件，并把轨迹挡在 Qwen 本体层之外，好让模型沿用已很熟的 tool-call 格式「对内」下指令、读回结果。\n\n为什么 GDN 能当 RAM？\nQwen3.5 每 4 层里有 3 层是 Gated DeltaNet（线性 RNN）。把 gate 和写入强度（beta）都设为 1，再用 one-hot key 选行，就能精确覆盖、读回单个槽位；状态大小不随对话变长，比把普通注意力当内存便宜。这是 Schlag 等人「线性注意力 ≈ 快权重联想记忆」的实践版：做成生产模型里可寻址、足够跑整颗 CPU 的内存。\n\n作者演示的内容\n用户问 -2241842 × 8077。右侧格子可视化 GDN 状态：from Qwen 吃入字符，a/b 装操作数，寄存器与 memory 区在跳；左侧最终由模型写出答案 -18107357834。意思是：大数乘法不是「猜下一个 token」，而靠权重里的 CPU 在算。\n\n测试数字\nDeepMind 算术集：基座约 55–90%，基座 + Python 工具约 95–100%，Qwenputer 约 97.5–100%。NUPA 长整数：基座 48.6%，Qwenputer 100%，与 +Python 持平。约 23 万个 CPU 输出位置对照参考机，零失配；普通文本分布相对基座几乎不变（KL 约 6e-4）。代价：检查点约 18.8 GB（约两倍基座，多为零填充）；每条 CPU 指令要几个 decode token，大计算以秒计；还不能裸 generate()，要 RvChat。作者在 L4 上批处理约 3200 CPU token/秒。\n\n「硬盘」与后续\n在 GDN 状态里做目录与链式存储（约 1024 槽、最多约 512 文件 / 5.3 万 token 文本），跨会话可存 state 再加载；作者称改事实回忆约 90%，粘贴旧聊天约 30%。另有 Filesystem 权重。下一步想让 Qwen 写 Python、在权重内 MicroPython 上跑；并指向两篇安全向 follow-up：混合模型把推理藏进 RNN 状态以逃避 CoT 监控，以及把编译进权重的监视器做成模型关不掉的内置工具。", "createdAt": "Sat Oct 31 00:36:48 +0000 2026", "replyCount": 13, "retweetCount": 1, "likeCount": 12, "conversationId": "2116328500936265843", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115394340357116169", "text": "1/4\n\nMeet Qwenputer: Qwen3.5-4B with a full RISC-V CPU inside its weights, using the model's own Gated DeltaNet layers as RAM.\n\nIt runs C and MicroPython in its forward passes, no external runtime.\n\nOn DeepMind math: base 55–90%, base + Python tool 95–100%, Qwenputer 97.5–100%. https://t.co/aA7sAX8sDe", "createdAt": "Wed Oct 28 10:44:47 +0000 2026", "replyCount": 274, "retweetCount": 718, "likeCount": 5767, "conversationId": "2115394340357116169", "author": {"username": "divagr1925", "name": "div (fp32)", "profileImageUrl": "https://pbs.twimg.com/profile_images/2103115932990332929/wKj91D1E_normal.jpg"}, "authorId": "1930581594705924096", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115390746090237952/img/O2d_O9rEssR_l5qF.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2115390746090237952/img/O2d_O9rEssR_l5qF.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2115390746090237952/vid/avc1/1280x720/re3aWl-8X1nw-xGd.mp4?tag=29", "durationMs": 13520}], "translationZh": "1/4\n\n认识一下 Qwenputer：它在 Qwen3.5-4B 的权重中内置了一个完整的 RISC-V CPU，并将模型自身的 Gated DeltaNet 层用作 RAM。\n\n它能在前向传播中运行 C 和 MicroPython，无需外部运行时。\n\n在 DeepMind 数学题集上的准确率：基础模型为 55–90%，基础模型 + Python 工具为 95–100%，Qwenputer 为 97.5–100%。https://t.co/aA7sAX8sDe"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV61imjWEAAQIh6.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV61imjWEAAQIh6.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T00:36:48+00:00", "createdAtBeijing": "2026-10-31T08:36:48+08:00", "createdAtLocal": "10-31 08:36 北京", "url": "https://x.com/shao__meng/status/2116328500936265843", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2116328500936265843", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Qwenputer 权重内 CPU 与可寻址内存", "evidence": "用编译器把一台确定性 RISC-V CPU 写进额外层与权重", "rationale": "展示具体研究实现、测试及成本，结果为作者报告"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116345470125543768", "track": "enterprise", "source": {"id": "2116345470125543768", "text": "阿里云开源的「AI Agent Handbook」有一份「2026 Agent 开发者调研报告」\n\n做 Agent 已成共识，近半团队在做，真正进生产仍是少数（~18%）；卡点主要是工程配套（上下文与记忆、多模型路由与成本、评估与可观测），不是「要不要做」。单 Agent / 多 Agent / 人在回路会长期并存；Coding 最先规模化，但工具与框架高度碎片化，可迁移的抽象比押注单一厂商更值钱。\nhttps://t.co/oDvCxODDi8\n\n投入升温，生产化仍窄\n「暂无计划」从去年 22% 降到 15%；「调研/计划」从 47% 降到 25%；「已完成或开发中」从 36% 升到 46%；真正部署到生产约 18%。持续迭代的不到 10%。上线差距往往大于开发意愿差距：上海大型企业已上线约 45%、小微约 16%；深圳约 38% 对 17%。报告判断：差的不是愿不愿意投，而是能否持续演进 Agent 的组织协作、治理、优化与沉淀。并挂上白皮书 L1–L4：多数仍在辅助生成或受控自动化，Agentic Execution 只在部分场景成立，Managed & Optimizing 仍少。\n\n三种形态共存，不是新旧替代\n主要架构：单 Agent 约 40%，多 Agent 约 42%，另有约 15% 把 Human-in-the-Loop（关键步骤必须人确认）当作生产架构原则，而不只是外挂审批。自主度是可调参数；Chat/RAG、Workflow、Copilot、Agent 与 Managed Agentic Application 常在同一家公司并存，取决于任务确定性与容错空间。\n\n多 Agent 痛点：状态与上下文在协作中衰减约 60%；死锁雪崩、成本失控也被点名。最希望补齐：研发—测试闭环约 65%，端侧与开源运行底座约 73%，验证成本已成为负担，运行底座也要自主可控。\n\nCoding 先跑通，供应商却很碎片\n采购 Claude Code、Codex、Cursor、Qoder 等 Coding 工具约 57%；用通用 Agent 框架约 78%；近四成两边都用。Coding 被认为是目前唯一规模化付费场景：反馈清晰（编译/测试）、边界清楚（仓库与工作区）、错误可回滚。前十供应商呈平缓下降而非陡峭长尾，多框架并行试用仍常见；围着单一框架定企业内部标准风险偏高。办公 Agent 兴起后，编程 Agent 与通用框架边界也在糊。\n\n落地场景排序：员工效能、代码工程、数据分析更广；引入企业核心业务流程不到 40%，优先容错大、能人工兜底的场景，严肃流程要更完整的治理。\n\n构建后三大难点：信息、治理、行动\n约 90% 企业对上下文与记忆有明确需求。「无明显痛点」不到 10%。记忆侧：检索不准约 54%，更新与遗忘机制缺失约 48%，窗口大小只排第三：问题在写入、淘汰与检索策略，不在窗口够不够大。工具侧：工具过多难选约 52%，幻觉调用约 50%，组织和描述质量比堆数量更影响成功率。\nMCP：已关注或落地合计约 37%，企业内私有部署仅约 9%。真正跑起来需要私有注册中心、统一身份鉴权、版本灰度、审计，以及与网关集成，这些协议本身不提供。约 28% 明确要 MCP 服务管理与注册中心，和已落地比例接近，说明需求正从认知转向工程。\n\n网关与可观测：路由第一，成本归因很早\n多模型路由与自动降级被约 63% 列为最需要的网关能力（单项最高）：按任务选模型、主模型挂了降级、按成本与延迟动态选。这类事很难在各应用里各自硬编码，需要统一流量入口。可观测诉求里，成本归因约 50%，仅次于全链路追踪，高于审计合规与语义质量监控，Token 还不大时就开始做可见性与分摊，偏预防性建设。\n\n评估：多数还在人工抽查\n评估方法：人工抽查约 55%；基于运行轨迹自动评估约 6%–8%；公开 Benchmark 不到 5%；尚无系统性评估约 28%。LLM-as-Judge、A/B、离线回归三类里用上任一种的约 34%。\n\n任务成功率：≥90% 的企业约一成；≥70% 约 55%；约 16% 从未量化过成功率，等于说不清 Agent 是否在正常工作。有评估手段的企业，成功率 ≥70% 大约是无体系企业的两倍；已上线并持续迭代的企业里这一比例约 84%。报告串成闭环：评估支撑迭代，迭代抬可靠性，可靠性又让评估值得持续做；缺评估则难定位、难证明改动有效，容易长期停在试点，与「近半在开发、约五分之一上线」相互印证。\n\n总结一下\n投入侧已过可行性验证；卡点不是意愿也不是单纯模型能力，是 Harness 层可开箱的工程配套。形态与工具都碎片化，Hybrid 是常态。白皮书目录按调研痛点排布：架构定形态与边界，构建用 Harness 作不绑框架的组合，运行回应沙箱/网关/异步/多 Agent 通信，治理把质量从人工兜底做成可规模化机制，调优沿 Trace→Trajectory 让系统持续变好。", "createdAt": "Sat Oct 31 01:44:14 +0000 2026", "replyCount": 39, "retweetCount": 9, "likeCount": 64, "conversationId": "2116345470125543768", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115975663148765204", "text": "阿里云开源《AI Agent Handbook》：用 Harness 把企业 Agent 从试点推到可治理生产\n\n企业级 Agent 全生命周期实践手册：架构、构建、运行、治理、调优，外加调研与案例，开源地址：\nhttps://t.co/CzC395KiJq\n\n手册为何重写？\n前言归纳三大新挑战：让概率智能变成能扛关键任务的可靠生产力；在稳定、安全、性能、成本上做成可大规模部署的基础设施；让 Agent 进入核心业务流程，而不是停在孤岛试点。写作目标还包括统一术语（Harness、Runtime、Agent、Workflow 等），减少「同一词各说各话」被模型放大后的混乱。\n\n2026 年调研结果\n· 投入成共识：已开发完成或开发中合计约 46%（去年约 36%）；真正部署到生产约 18%；持续迭代更低。\n形态共存：单 Agent 约 40%、多 Agent 约 42%、以 HITL 为主要架构约 15%——自主度是可调参数，不是新旧替代。\n编码最先规模化：采购 Coding 工具约 57%，通用 Agent 框架约 78%，近四成两者并用；市场碎片化，可迁移工程抽象比押单一厂商更稳。\n构建后难点：上下文/记忆需求约 90%；多模型路由与成本治理约 63%；评估上人工抽查约 55%，基于轨迹自动评估不足约 8%。\n成功率：达 90% 以上约一成；约 16% 根本没量化过成功率。有评估体系的团队，高成功率比例明显高于无评估者（文中对比）。\nMCP：关注或落地合计约 37%，企业内私有部署仅约 9%；缺的是注册中心、身份鉴权、版本灰度、审计与网关，不是「懂不懂协议」。\n成熟度 L1–L4：辅助生成 → 受控自动化 → Agentic Execution → Managed & Optimizing；全书后半部基本在回答如何从 L2 往 L3/L4 走。\n\n手册整体结构\n· 架构（1–2）：Agentic Application 边界、企业成熟度、参考架构（组件 / 平台责任 / 生命周期）\n· 构建（3–6）：以 Harness 为核心：范式与责任边界；任务编排与长程推进；上下文、状态、Memory/Knowledge/Skill；受控行动（Function Calling、MCP、A2A、HITL、验证闭环）\n· 运行（7–12）：Runtime 与沙箱；状态存储与语义资产；AI 网关统一 LLM/MCP/Agent 流量；异步与自动化；Multi-Agent；分布式通信\n· 治理（13–16）：可观测与成本归因；安全（注入、鉴权、高危授权、出域）；Prompt/Skill/MCP/Agent 资产管理；上线前仿真与质量验证\n· 调优（17–24）：模型侧（SFT、Agentic RL、蒸馏等）与 Agent 侧数据飞轮：Trace→Trajectory、黄金数据集、Badcase、受控自进化、边缘运行时\n· 实践（25–29 + 专题）：研发效能、设计工程、运维与企业 IT、客户销售运营、GOAI Agent Infra；另有 Jev 决策模型专题、Personal Agent / Agent as a Service 专题\n· 展望（30）：从 Agentic Application 走向 Agentic OS", "createdAt": "Fri Oct 30 01:14:45 +0000 2026", "replyCount": 34, "retweetCount": 33, "likeCount": 181, "conversationId": "2115975663148765204", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV10o9FbUAAWE_P.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV10o9FbUAAWE_P.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7E-hgWoAAeJvg.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV7E-hgWoAAeJvg.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T01:44:14+00:00", "createdAtBeijing": "2026-10-31T09:44:14+08:00", "createdAtLocal": "10-31 09:44 北京", "url": "https://x.com/shao__meng/status/2116345470125543768", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2116345470125543768", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "企业Agent生产化调研与工程手册", "evidence": "真正部署到生产约 18%", "rationale": "详细转述调研与开源手册，覆盖生产治理"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116366460939386990", "track": "research", "source": {"id": "2116366460939386990", "text": "疑似造假：有人称偷到 Claude Fable 5 权重在兜售，网友比对发现文件来自 DeepSeek 免费开源的模型\n\n网上有人在兜售所谓 Anthropic 旗舰模型 Claude Fable 5 的“权重”。这个说法没有证实，已有网友指出是假的：卖家晒出的文件，和 DeepSeek 免费公开下载的模型文件一个字节都不差。截至北京时间 31 日上午，Anthropic 和亚马逊都没有回应，也没有主流媒体报道。\n\n【卖家怎么说】\n\n消息来自 X 账号 Dark Web Informer，它专门转发黑客论坛上的动态。帖子说，一个叫“localizer”的人声称，亚马逊云（AWS）上有个和 Amazon Bedrock 相关的存储桶权限没设好，他从里面拿到了 Fable 5 权重的一个分片，约 7GB。\n\n模型权重是模型训练出来的全部参数，就是一大堆数字组成的文件，拿到它就能在自己的机器上跑这个模型。Anthropic 从不公开权重，外人只能付费调用。Amazon Bedrock 是亚马逊的 AI 模型平台，企业可以在上面调用 Claude。权重文件太大，要切成很多块存放，就像压缩包分卷，每一块叫一个分片。\n\nlocalizer 说完整模型有 640 个分片、约 8TB，他只拿到 1 片，存储桶就被锁了。他晒出了文件名、模型信息和文件内容的截图当证据，现在要卖这一片。Dark Web Informer 在帖子里也写明：说法未经证实，文件真假、和 Anthropic 有没有关系都没确认。\n\n【为什么说疑似造假】\n\nX 用户 toriset 回帖说这是假的，给了四条理由。\n\n第一，截图里每个文件的大小和内容，都和 DeepSeek V4.1-Flash-1017 第 13 到 42 号分片完全一样。这个模型 10 月 17 日刚开源，任何人都能从 Hugging Face 免费下载。我查了 Hugging Face 上的文件列表，这个模型的分片大多是 7,389,761,368 字节，也就是 7.39GB，和卖家说的“约 7GB”对得上。卖家的截图我没能看到，没法自己逐字节比对。\n\n第二，toriset 说 eu-north-1（AWS 的斯德哥尔摩区域）不托管 Fable。Dark Web Informer 的帖子没提区域，从回帖推断，卖家材料里写的是这个区域。AWS 文档显示，在斯德哥尔摩调用 Fable 5，请求会被转到别的地区处理，当地本身不运行这个模型。\n\n第三，数字对不上。640 片乘以 7.39GB 约等于 4.73TB，离卖家说的 8TB 差了三千多 GB。\n\n第四，toriset 说，只有 1/640 的权重，没法拿来蒸馏（用强模型训练自己的模型）。就算文件是真的，这也好比 640 卷的百科全书只拿到一卷，模型跑不起来。\n\n另一位 X 用户 Ondrej Simaichl 提到，发帖的论坛账号这个月才注册。\n\n【Anthropic 这周还有一起安全事件】\n\n这条传言出现时，Anthropic 正在处理另一起已经证实的安全事件。据《华盛顿邮报》10 月 26 日报道，安全创业公司 Cathedral 在参加 Anthropic 的漏洞悬赏时，用 AI agent 通过第三方办公软件进入 Anthropic 内部系统，看到了工资、会议记录和 Slack 消息。Anthropic 说被访问的只是销售、人事和 IT 的一部分系统，用户的 Claude 聊天记录、源代码和模型权重都没有泄露，并指责 Cathedral 违反了悬赏规则。目前看不出这两件事有关联。\n\n来源：\nDark Web Informer 原帖：X @DarkWebInformer\ntoriset 反驳：X @torisetxd\nDeepSeek V4.1-Flash-1017 文件列表：https://t.co/vJR4RpU6Jp\nAWS Bedrock Fable 5 可用区域：https://t.co/zh3ZVVzlJG\nCathedral 事件（The Decoder 转述《华盛顿邮报》）：https://t.co/eo3qs71eES", "createdAt": "Sat Oct 31 03:07:39 +0000 2026", "replyCount": 91, "retweetCount": 2, "likeCount": 49, "conversationId": "2116366460939386990", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2116304098228068572", "text": "🚨🇺🇸 Anthropic model weights allegedly exposed through misconfigured AWS S3 bucket\n\nAn actor using the handle \"localizer\" claims to have obtained a 7 GB shard of Anthropic's alleged \"Claude Fable 5\" model weights from a misconfigured AWS S3 bucket associated with Amazon Bedrock.\n\nThe actor claims the complete model consists of 640 shards totaling approximately 8 TB, but says only one shard was retrieved before access was restricted.\n\nScreenshots showing a .safetensors file, model metadata, and a hexadecimal dump have been published as alleged proof. The actor is now offering the material for sale.\n\nClaim is currently unverified. The authenticity of the files and their connection to Anthropic have not been established.\n\n💥 No delays. No guessing. No redactions. Get the intel threat actors see, the moment they post it. https://t.co/281Qjc6p2J", "createdAt": "Fri Oct 30 22:59:50 +0000 2026", "replyCount": 110, "retweetCount": 151, "likeCount": 2776, "conversationId": "2116304098228068572", "author": {"username": "DarkWebInformer", "name": "Dark Web Informer", "profileImageUrl": "https://pbs.twimg.com/profile_images/2109088203504287744/BJcETLaO_normal.jpg"}, "authorId": "1697387633247150081", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV6fNWzXAAAr5YA.jpg", "width": 1600, "height": 912, "previewUrl": "https://pbs.twimg.com/media/HV6fNWzXAAAr5YA.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV6fNXSW4AAKvIy.jpg", "width": 1600, "height": 911, "previewUrl": "https://pbs.twimg.com/media/HV6fNXSW4AAKvIy.jpg:small"}], "translationZh": "🚨🇺🇸 Anthropic 模型权重疑因 AWS S3 存储桶配置错误而泄露\n\n一名网名为“localizer”的人士声称，从一个与 Amazon Bedrock 关联、配置错误的 AWS S3 存储桶中，获取了据称属于 Anthropic“Claude Fable 5”模型的一个 7 GB 权重分片。\n\n此人声称，完整模型由 640 个分片组成，总大小约 8 TB，但在访问受限前只获取了一个分片。\n\n此人已发布展示 .safetensors 文件、模型元数据和十六进制转储内容的截图，作为所谓证据，目前正兜售这些材料。\n\n这一说法尚未得到证实。文件的真实性及其与 Anthropic 的关联均未确认。\n\n💥 无延迟，无猜测，无删减。威胁行为者一发布，就立即获取他们看到的情报。https://t.co/281Qjc6p2J"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7XwTxXgAALfPp.jpg", "width": 1204, "height": 1056, "previewUrl": "https://pbs.twimg.com/media/HV7XwTxXgAALfPp.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-10-31T03:07:39+00:00", "createdAtBeijing": "2026-10-31T11:07:39+08:00", "createdAtLocal": "10-31 11:07 北京", "url": "https://x.com/dotey/status/2116366460939386990", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2116366460939386990", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "模型权重兜售传言辨伪", "evidence": "640片乘以7.39GB约等于4.73TB", "rationale": "提供文件、区域和容量核查路径，明确证据局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2116336854048063598", "track": "tools", "source": {"id": "2116336854048063598", "text": "想自己训练一个真正会用工具的 Agent，却不知道从哪开始？Hugging Face 最近整理的这套教程，我觉得很多人正好需要。\n\n名字叫《A curriculum for post-training agents》，用 Coding Agent 贯穿整个学习过程。\n\n从 SFT 学习工具调用轨迹，到模型蒸馏、GRPO，再到 OpenEnv 多轮交互，最后教你如何在真实 Harness 中训练 Agent。\n\n其中有一个实验很有意思。作者故意设计了容易被钻空子的奖励函数，结果训练分数越来越高，实际代码测试表现却越来越差，把 Reward Hacking 这个坑讲得很直观。\n\n每个阶段都配了视频、讲义、TRL 文档，部分还有训练代码和实际案例，可以顺着一步步学下来。\n\n对于已经会搭 Agent，想进一步理解 Agent RL、训练环境和 Harness 的人，这套学习路线很值得收藏。\n\nhttps://t.co/DvJWY4usAN", "createdAt": "Sat Oct 31 01:10:00 +0000 2026", "replyCount": 5, "retweetCount": 23, "likeCount": 151, "conversationId": "2116336854048063598", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-10-31T01:10:00+00:00", "createdAtBeijing": "2026-10-31T09:10:00+08:00", "createdAtLocal": "10-31 09:10 北京", "url": "https://x.com/Xudong07452910/status/2116336854048063598", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2116336854048063598", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Hugging Face Agent后训练课程", "evidence": "从 SFT 学习工具调用轨迹", "rationale": "提供分阶段学习路线及奖励投机实验案例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116387433067729191", "track": "tools", "source": {"id": "2116387433067729191", "text": "#开源推荐 agent-desktop 是 Vercel Labs 旗下的开源桌面自动化工具，定位是“面向整台电脑的 agent-browser”。 它为现有编程 Agent 提供 Computer Use 能力，支持 macOS、Windows 和 Linux，让 Agent 能够读取界面、点击控件、输入内容和管理窗口。\n\n核心特点是通过操作系统的无障碍树（accessibility tree）理解界面。工具将按钮、输入框、菜单等控件转换为结构化 JSON，并分配可操作的引用，让 Agent 完成“观察—操作—验证”的循环，核心流程无需依赖截图识别或像素匹配。面对复杂应用，还可以先读取界面骨架，再深入局部区域。实际覆盖范围取决于应用暴露的无障碍信息。\n\n后台操作是它的重要特点。 支持的控件操作默认通过无障碍 API 执行，无需移动系统鼠标或抢占前台焦点，用户可以继续自己的工作。需要前台焦点或物理键鼠输入的操作，则受具体命令和平台规则约束。\n\n它也支持多 Agent 协作，并为每个 Agent 显示独立的可视化光标，方便用户分辨各自的操作位置。这些光标目前支持 macOS、Windows 和 Linux X11。多个 Agent 共享同一个桌面，相关交互执行阶段由工具的跨进程交互锁协调，避免输入互相穿插。\n\n项目使用 Rust 构建，提供 CLI、配套 Skill 和 C ABI 原生库，既能接入现有 Agent 工作流，也能通过 Python、Swift、Go 等语言调用。任务规划和决策由外部 Agent 负责，agent-desktop 提供桌面观察与操作能力，可作为构建桌面助手、跨应用自动化和 GUI 测试工具的基础。\n\n仓库地址：https://t.co/wQhwgP8xlj https://t.co/qkrt7KNvoI", "createdAt": "Sat Oct 31 04:30:59 +0000 2026", "replyCount": 4, "retweetCount": 2, "likeCount": 37, "conversationId": "2116387433067729191", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116323117836500992/img/lyS2sGQBssVmVsx8.jpg", "width": 1080, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116323117836500992/img/lyS2sGQBssVmVsx8.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116323117836500992/vid/avc1/1080x1080/1eziI_0oE6cuNg9n.mp4?tag=29", "durationMs": 19884}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-10-31T04:30:59+00:00", "createdAtBeijing": "2026-10-31T12:30:59+08:00", "createdAtLocal": "10-31 12:30 北京", "url": "https://x.com/lencx_/status/2116387433067729191", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2116387433067729191", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "agent-desktop开源桌面自动化工具", "evidence": "通过操作系统的无障碍树理解界面", "rationale": "具体介绍开源工具、操作机制及适用边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2116512098914361405", "track": "creative", "source": {"id": "2116512098914361405", "text": "神医啊，做 AI 短剧最头疼的角色三视图和换装一致性，居然被一个 ComfyUI 节点这么丝滑地解决了？？？\n\n刚刚扒了下源码，思路太巧妙了——不训 LoRA、不装额外依赖，直接调 MiniMax H3 原生多图参考跑 5 帧，取第 1 帧当高清设定图\n\n1张角色主图 + 3张部位参考图 + 8个身体部位独立微调 + 最多13个视角同屏直出\n\n想锁死五官只换外套，或者半身图补全身鞋履，直接分槽位喂图写句短英文就行😅\n\n实测两个避坑点：\n 1、Layout 白模引导默认关掉（OFF），不然容易把身材比例带偏\n 2、日常选 5~7 个核心视角最稳，13 视角全开偶尔会漏特写框\n\n做 AI 影视、漫剧、3D 建模的，这个节点必装：\nhttps://t.co/nJSPCXdxUj", "createdAt": "Sat Oct 31 12:46:21 +0000 2026", "replyCount": 25, "retweetCount": 45, "likeCount": 414, "conversationId": "2116512098914361405", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-10-31T12:46:21+00:00", "createdAtBeijing": "2026-10-31T20:46:21+08:00", "createdAtLocal": "10-31 20:46 北京", "url": "https://x.com/servasyy_ai/status/2116512098914361405", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2116512098914361405", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "ComfyUI 角色多视角与换装一致性", "evidence": "日常选 5~7 个核心视角最稳", "rationale": "包含节点机制、参考图配置与自述避坑经验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2116370588109582843", "track": "growth", "source": {"id": "2116370588109582843", "text": "🚨 都检查一下吧。我上个月有3个帖子被限流。中日韩搬运惨啊，特殊对待。\n\nX 开源算法里的限流标签，我翻完了。\n\n被限流是因为被打了标签，排序分低不算限流。\n\n🔥 怎么生效：\n\n帖子标签：只影响那一条\n账号标签：所有帖子（包括旧帖）都不推给非关注者，关注者基本照常能看到\n几乎实时：标签缓存 10 秒，For You 每次刷新都会重新过滤，没有宽限期，到期自动恢复\n代码里没有“被标 N 条就升级成账号标签”的计数规则\n\n🚨 常见帖子标签：\nSPAM_HIGH_RECALL：疑似垃圾（乱码、快速刷回复、链接被评为低质），不推给非关注者；乱码和刷回复两类 30 天\n\nSPAM：确认是垃圾，全站隐藏\n\nRiskyHighVizReply：AI 水回复或被 Grok 打低分的回复，降权 14～30 天\n\nCOPYPASTA_SPAM：重复文案，还有专门检测中日韩文本的任务，搬运凉凉\n\nAGATHA_SPAM：近 30 天被举报或拉黑的数量相对获赞比例过高，之后的新帖都会被打标签，持续 7 天\n\nNSFW_*：成人内容，不推给非关注者，部分会加遮罩\n\nFOSNR_*：辱骂、仇恨、暴力、选举类违规，只在作者主页可见，可以在帖子上申诉\n\nBOUNCE：必须自己删帖；PDNA：复核期间隐藏\n\n😭 账号标签更狠：\nSpamHighRecall：AI 水文号 7 天；垃圾号 30 天，还要真人验证；置顶帖放低质链接也会被标 7 天\n\n代码里 SpamHighRecall 没有申诉入口，只能等过期\nDoNotAmplify、AbusiveHighRecall、Compromised、ReadOnly、Impersonation、Nsfw* 也是账号级\n\n🛡️ 豁免：\n可信分 UserCredV2 ≥54，或者有灰标，大部分规则直接跳过\n只有没有可信分时，才看粉丝是否超过 2.5 万\nyaml 里有个 12.34 的阈值，注释写明了是假数，别当真\n\n📊 10 月权重变化：\n点赞 0.5 → 0.66\n点开后停留时长：0 → 0.4（新加的）\n视频打开 0.07 → 0.02\n不感兴趣 -43 → -52\n推给非关注者时分数 ×0.75\n\n💯 给兄弟们的干货：\n置顶帖别放低质链接\n别批量水回复\n中文别重复搬运文案\n查自己有没有被打标签：https://t.co/y6r6gOGFqf\n\n源码在这，自己翻 👇\nhttps://t.co/asjSYne0aI", "createdAt": "Sat Oct 31 03:24:03 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 9, "conversationId": "2116370588109582843", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7b1B7aUAAXuii.jpg", "width": 1284, "height": 1464, "previewUrl": "https://pbs.twimg.com/media/HV7b1B7aUAAXuii.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-10-31T03:24:03+00:00", "createdAtBeijing": "2026-10-31T11:24:03+08:00", "createdAtLocal": "10-31 11:24 北京", "url": "https://x.com/MinLiBuilds/status/2116370588109582843", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2116370588109582843", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "X限流标签与内容运营排查", "evidence": "帖子标签：只影响那一条", "rationale": "自述源码梳理，提供限流机制与运营排查建议"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2116333626233094159", "track": "enterprise", "source": {"id": "2116333626233094159", "text": "著名加密品牌 Proton 对内正在强推 AI 写码与流程改造：CEO Andy Yen 在 Slack 用「loser thinking」压制安全侧放慢请求，CTO 发 AI 宣言称「旧工作没了」，公司并对员工做 AI 使用复面；员工侧感到恐惧文化，官方未否认事实描述，只承认沟通过硬、会改进。\nhttps://t.co/QHvL81CKdG\n\n公开人设 vs 对内节奏\nProton 以加密邮箱等隐私产品闻名；Yen 对外谈「隐私优先的 AI」、对 Google 式侵入式 AI 的反弹。对内则是另一套：设邮箱搜集挡 AI 的障碍以便「ruthlessly smash」；电脑上装软件统计 AI 产码量；称今年是最后一年招工程师，明年改招用 AI 做东西的人。内部文件写因 velocity 不足，年底 ARR 目标可能达不到，同比增长「远低于市场认为的好」，「按所有要紧指标，我们是表现不佳的公司」。\n\nSlack 里的「loser thinking」\n安全频道有人建议新代码上线前至少花几天渗透测试。Yen（约八月底）回复称那是 bullshit 与 loser thinking，「当然可以又快又安全」，要少想怎么变慢、多想怎么变快；并说别再「深情手搓」代码、多用 AI。另有人追问如何保证 AI 代码无安全问题，并称「目前安全优先级偏低」；Yen 未正面回应安全细节，转而在频道里点名嘲讽同事「又在说那套会更慢的 bs」，要求大家「prompt 更好」。\n\nAI 使用范围与代码占比\n内部曾禁 AI，后放宽：可处理财务数据、起草 Reddit/LinkedIn 对客回复、写代码（竞品优势信息与创新/R&D 相关源码除外）。404 取得的会议录音里，CTO Bart Butler 称十月约 90% 代码由 AI 写；多名员工说大量用 Claude，Yen 也在 Slack 推 Claude。有员工吐槽：公司一边反 Big Tech，一边大把花在 Claude 上。\n\nCTO 的 AI 宣言\nButler 上周五下午在 Slack 发自述「AI manifesto」：「Your old job is gone」；不拥抱 AI 是对使命的「existential threat」。三点：工程师工作是帮 LLM 更快写出更好代码；大部分代码应由 AI 而非人审查；组织须整体转型。有人嫌周五恐吓没必要；Butler 说本就要有冲击力。员工对 404 称内容夸大当下 LLM 能力、未谈交出代码库的代价；另有人评「ethically bankrupt」。\n\n复面与恐惧文化\n本周邮件称将对员工 AI 使用做 re-interview，「consequential」；现任员工理解为可能影响去留。有高管级同事在 Slack 建议改成识别落后并培训、保质量。Yen 说大致已知谁落后，「若已放弃就不会走这流程」。对方批评这是恐惧驱动、无人敢插话；Yen 当众称若指控这是财务驱动且不信他否认，「也许这里不适合你」。另有一人用「打小孩逼吃菜更快但不健康」比喻催速。员工称极少人敢顶撞 Yen，一旦顶撞就会很显眼。另有后量子加密上线沟通：Yen 不满 Reddit 公告暴露旧邮件未覆盖，称「Perception is more important than truth」。", "createdAt": "Sat Oct 31 00:57:10 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 2, "conversationId": "2116333626233094159", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2115868430897385497", "text": "Here is Proton CTO's AI manifesto, that I obtained multiple copies of https://t.co/6o7G2teu9A https://t.co/d92L1kv8AU", "createdAt": "Thu Oct 29 18:08:39 +0000 2026", "replyCount": 131, "retweetCount": 307, "likeCount": 3018, "conversationId": "2115814382001172714", "inReplyToStatusId": "2115855575200485657", "author": {"username": "josephfcox", "name": "Joseph Cox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1696983839015370753/9FHu_zds_normal.jpg"}, "authorId": "274991683", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV0THlKWEAAfQ5v.png", "width": 1206, "height": 1566, "previewUrl": "https://pbs.twimg.com/media/HV0THlKWEAAfQ5v.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV0THlCXYAA7f4f.png", "width": 1210, "height": 1566, "previewUrl": "https://pbs.twimg.com/media/HV0THlCXYAA7f4f.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HV0THlGXgAAchGn.png", "width": 1204, "height": 1566, "previewUrl": "https://pbs.twimg.com/media/HV0THlGXgAAchGn.png:small"}], "translationZh": "这是 Proton 首席技术官的 AI 宣言，我拿到了多个副本。https://t.co/6o7G2teu9A https://t.co/d92L1kv8AU"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV66M_LXoAA7B_B.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV66M_LXoAA7B_B.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T00:57:10+00:00", "createdAtBeijing": "2026-10-31T08:57:10+08:00", "createdAtLocal": "10-31 08:57 北京", "url": "https://x.com/shao__meng/status/2116333626233094159", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2116333626233094159", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Proton 强推 AI 转型的组织争议", "evidence": "公司并对员工做 AI 使用复面", "rationale": "转述具体组织措施与安全争议，需保留报道归属"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116335089546035522", "track": "tools", "source": {"id": "2116335089546035522", "text": "9集、230分钟 @jbhuang0604 系列视频「AI Training and Inference」把基座模型训练和推理基础讲清楚了，覆盖整个训推架构：单卡显存 → 千卡并行 → 便宜微调 → 推理加速 → 小模型蒸馏 → 推理 RL → 优化器（AdamW→Muon） \n\n这个训推系列的串联逻辑\n先解决「模型塞不进一张 GPU」，再用五维并行铺到万卡级；然后 LoRA 系把适配成本压下来；推理侧用投机解码在不改输出分布的前提下加速；能力压缩走 on-policy 蒸馏；推理能力用从 PPO 到 GRPO 的 RL 线；最后回到优化器基线与 Muon。服务侧（KV cache、调度等）放在最后第 9 集。\nhttps://t.co/guGpu2DlaP\n\n1. ZeRO & FSDP（约 23 分钟）\n浮点与混合精度如何吃显存；数据并行会复制优化器状态与梯度。ZeRO-1/2 切优化器与梯度，ZeRO-3 再切权重；FSDP 是同一套分片日程在 PyTorch 里按模块落地。\n\n2. 五维并行（约 40 分钟）\n纯数据并行不够时，沿数据 / 张量 / 序列·上下文 / 流水线 / 专家切开。张量并行的行列切与 all-reduce；上下文并行与 ring attention；流水线从 GPipe、1F1B 到 zero-bubble / DualPipe；MoE 的 all-to-all；并以 Llama 3 的 16384 GPU 布局作示例，给出排并行的「小抄」三步。\n\n3. LoRA 与变体（约 21 分钟）\n冻住 W0W_0W0​，学低秩 ΔW=BA\\Delta W=BAΔW=BA；初始化常用随机 A、零 B。LoRA+ 给 A/B 不同学习率；QLoRA 用 NF4 等把骨干量化、适配器仍高精度（字幕称可在单卡 48GB 上微调 70B 量级，为讲者表述）；VeRA 共享冻结随机基、只训缩放；DoRA 拆幅度与方向。\n\n4. 投机解码（约 25 分钟）\n小草稿模型往前猜，大模型并行验证；拒绝采样保证与目标模型同分布。再展开 draft tree、Medusa、MTP、EAGLE 系列与 DFlash / DFlash 2。\n\n5. On-policy 蒸馏（约 31 分钟）\n软标签与「暗知识」→ 序列级蒸馏；曝光偏差；on-policy RL 奖励稀疏。On-policy distillation：学生用自己的轨迹，仍拿教师的稠密指导；并强调 KL 方向；应用提到推理、个性化、数据复用与自蒸馏。\n\n6. GRPO（约 23 分钟）\n从 REINFORCE、baseline/价值、GAE、Actor-Critic、TRPO/PPO（尤其 clip）推到 GRPO：同一题采一组回答，组内归一化奖励当优势，整段共用优势、可不另训 value；相对参考策略加 KL。Dr. GRPO 去掉长度归一与标准差除法，减轻「对了就变短、难了优势被放大」等偏差。视频将其与 DeepSeek-R1 类推理训练挂钩。\n\n7. AdamW（约 7 分钟）\nSGD → 动量 → RMSProp → Adam；Adam 把衰减和自适应步长缠在一起会伤泛化；AdamW 解耦 weight decay，成为长期默认。\n\n8. Muon / MuonClip（约 18 分钟）\n线性层动量矩阵近低秩，稀有方向更新弱；Muon 用 Newton–Schulz 等把动量矩阵正交化（讲者称相对 AdamW 算力效率约高一倍，为片中说法）。大规模时配合衰减与按矩阵尺寸调学习率；注意力 logit 爆炸用 QK-clip，MLA 场景延伸为 MuonClip。\n\n9. LLM Serving（约 42 分钟）\n会员内容，如果前面 8 集看完觉得有需要，朋友们自行学习。", "createdAt": "Sat Oct 31 01:02:59 +0000 2026", "replyCount": 9, "retweetCount": 22, "likeCount": 90, "conversationId": "2116335089546035522", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2116218859413987803", "text": "I'm building a playlist/course for LLM training and inference (WIP).\nhttps://t.co/0JdUqjiiQm\n\nSo far, we have common topics like distributed training, fine-tuning, RL, OPD, serving, spec. decoding, and basic optimizers.\n\nWhat else should I include to make this more complete? 🤔", "createdAt": "Fri Oct 30 17:21:08 +0000 2026", "replyCount": 32, "retweetCount": 87, "likeCount": 1007, "conversationId": "2116218859413987803", "author": {"username": "jbhuang0604", "name": "Jia-Bin Huang", "profileImageUrl": "https://pbs.twimg.com/profile_images/601424529051648000/Sr_nSuBF_normal.jpg"}, "authorId": "3290526443", "translationZh": "我正在整理一套关于 LLM 训练与推理的视频播放列表／课程（持续完善中）。\nhttps://t.co/0JdUqjiiQm\n\n目前已涵盖分布式训练、微调、强化学习、OPD、推理服务、推测解码和基础优化器等常见主题。\n\n还应该加入哪些内容，让它更完整？🤔"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV67iHXXgAAx0EQ.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV67iHXXgAAx0EQ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-10-31T01:02:59+00:00", "createdAtBeijing": "2026-10-31T09:02:59+08:00", "createdAtLocal": "10-31 09:02 北京", "url": "https://x.com/shao__meng/status/2116335089546035522", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2116335089546035522", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "模型训练与推理系列课程", "evidence": "9集、230分钟", "rationale": "提供系统学习资源及各章节具体知识梳理"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116529121027326123", "track": "creative", "source": {"id": "2116529121027326123", "text": "挖到一批「游戏美术风格图鉴」站，独立游戏 / AI 出图的朋友可以存一下。\n\n很多人卡在同一步：知道想要某种感觉，但说不清是像素、水彩、低多边形，还是油画感。于是疯狂刷 Steam 截图，效率很低。\n\n更好的路径是先把风格钉死，再去找同类作。\n\n几个好用的：\n\nGame Art Style — 按画面手法分类真实游戏截图（Disco Elysium 的表现主义油画、Hades 的漫画线稿、GRIS 的水彩等）。每个风格页还有一段可复制的英文 art direction prompt，适合直接喂给 AI 当美术总监。\n\nGame Art Styles — 200+ 款游戏、1000+ 截图，按渲染 / 线稿 / 阴影 / 调色打标签，同系列从像素走到 3D 也能顺着看。\n\nBestOfGames Styles — Steam 游戏按截图风格分桶：像素、手绘、赛璐璐、PS1 复古……适合问「这个风格还有哪些能玩」。\n\n进阶可以试 Game Oracle Art Explorer：用自然语言或上传一张参考图，找长得像的 Steam 画面，还能吸色板。\n\n像素向再补两个：Lospec 调色板库，以及 Pixel Art Compendium 讲抖动、色阶、手动抗锯齿。\n\n一句话：先用图鉴把风格说清楚，再搜参考、写 prompt，比漫无目的刷图快很多。", "createdAt": "Sat Oct 31 13:54:00 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 3, "conversationId": "2116529121027326123", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVS-qzebgAA4myi.jpg", "width": 1200, "height": 675, "previewUrl": "https://pbs.twimg.com/media/HVS-qzebgAA4myi.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-31T13:54:00+00:00", "createdAtBeijing": "2026-10-31T21:54:00+08:00", "createdAtLocal": "10-31 21:54 北京", "url": "https://x.com/sitinme/status/2116529121027326123", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2116529121027326123", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "游戏美术风格定位与参考检索", "evidence": "先用图鉴把风格说清楚，再搜参考、写 prompt", "rationale": "说明资源用途并给出可复用的美术检索流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2116507350358237186", "track": "creative", "source": {"id": "2116507350358237186", "text": "卷 Agent 卷到新高度了， AI 模特经纪公司GILF。\n\n165 个原创 AI 模特，丢 1-3 张产品图加一句需求，选模板：开箱、口播、GRWM、测评。\n\n我还以为有新模型出来了，体验了一下。👇【视频0倍加速】\n\n主力 Seedance 2.5，便宜档H3 Max\n\n🔥  他们做了模型之外的工作：一句话需求，扩词，模特选择。\n\n为什么这么真？我看截帧的感受是拍得够随便、越不精致，越像真的\n\n成本也算了下，有点贵：\nSeedance 2.5 一个 take 约 208 credits\nStarter $10 才 1000 credits，大概够 4 条\n\n有吹的成分，评论区不少人说一看是 AI 就不想买\n\n如果按请模特的价格来计算，这个确实便宜。🤔", "createdAt": "Sat Oct 31 12:27:29 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 10, "conversationId": "2116507350358237186", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2116198551814623370", "text": "Today we’re launching the first AI modeling agency 💅 right inside Glif.\n\nCast hundreds of real AI models, drop your product, idea or brief and let Glif create super compelling content for you end to end. \n\nIf you still think AI models aren’t ready for real work, watch this 👇 https://t.co/POoG688tkV", "createdAt": "Fri Oct 30 16:00:26 +0000 2026", "replyCount": 532, "retweetCount": 338, "likeCount": 4467, "conversationId": "2116198551814623370", "author": {"username": "heyglif", "name": "GLIF", "profileImageUrl": "https://pbs.twimg.com/profile_images/1934891859517571072/fjsCwvll_normal.jpg"}, "authorId": "1617950998080675840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116165050645823488/img/wilLEOXrq6jIhRZ1.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116165050645823488/img/wilLEOXrq6jIhRZ1.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116165050645823488/vid/avc1/1920x1080/QrbIDHn4IxSEfsPP.mp4?tag=29", "durationMs": 49600}], "translationZh": "今天，我们在 Glif 内推出首家 AI 模特经纪公司 💅\n\n从数百位逼真的 AI 模特中挑选人选，提交你的产品、想法或创意简报，让 Glif 为你全流程打造极具吸引力的内容。\n\n如果你仍觉得 AI 模特还无法胜任实际工作，看看这个 👇 https://t.co/POoG688tkV"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116506691365974016/img/SqZwp4KVCE6SDkWs.jpg", "width": 2048, "height": 1050, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116506691365974016/img/SqZwp4KVCE6SDkWs.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116506691365974016/vid/avc1/3372x1728/OZG9ORYLkuB1-f4S.mp4?tag=29", "durationMs": 131481}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-10-31T12:27:29+00:00", "createdAtBeijing": "2026-10-31T20:27:29+08:00", "createdAtLocal": "10-31 20:27 北京", "url": "https://x.com/MinLiBuilds/status/2116507350358237186", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2116507350358237186", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Glif AI模特内容生成体验与成本", "evidence": "丢 1-3 张产品图加一句需求", "rationale": "包含实测流程、模型选择、成本与生成效果观察"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2116367057822589162", "track": "agent", "source": {"id": "2116367057822589162", "text": "分享一个开源项目 Mika\n\n端侧 Android Agent：一句话说清要做什么，它在后台虚拟屏操作，你可继续用手机。无中心服务器，截图与对话只发你的模型服务商（BYOK）。\n\n- 无障碍+OCR/视觉操控任意 App；内置浏览器；Linux沙箱（Python/Node/shell，默认离线，仅arm64）\n- 公开Beta；跑任务需 Android 13+（11+可装）；需无线调试与无障碍\n- 自动化可能违反第三方ToS；自主模式可不经确认付款，别随便开\n\n协议 Apache-2.0，约1.5K★。\n\n已收录到 OpenFree：https://t.co/InNjkp5h8C", "createdAt": "Sat Oct 31 03:10:01 +0000 2026", "replyCount": 5, "retweetCount": 4, "likeCount": 21, "conversationId": "2116367057822589162", "author": {"username": "indie_maker_fox", "name": "Fox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, "authorId": "1865299069092139008", "quotedTweet": {"id": "2115957353648664966", "text": "Mika 正式开源：真正的 Phone Agent，就跑在你的安卓手机上。\n\n一句话交给它，它就能在你手机上把事干完。\n\n复用你现有的登录态，不用额外授权，也不用 Root，更不用电脑。\n\n你继续玩手机，它在后台干活，互不干扰。干完了通知你，你也可以随时随地再丢任务给它。\n\n他能干什么？\n\n1、操作你手机上的任何 App：发微信、总结群聊、小红书总结博主内容，在 BOSS 直聘批量打招呼、订闹钟、改设置，手机上的 App 都能操作，不用事先适配\n\n2、内置浏览器：强大的 Browser use，搜索、筛选、读网页、批量操作，帮你把事干好的同时，节奏像真人一样，不容易被风控\n\n3、悬浮胶囊：在任何 App 里都能随时呼起，和它对话，叫它干活，或者把这一屏发给它，问这个怎么回、帮我记下来\n\n4、本地 Linux 沙箱：跑 Python、处理你发来的文件、Agent 写的脚本\n\n不要 root，无需电脑，就跑在你的安卓手机上，真正的 phone Agent，替你在手机上把事都干了。\n\n更多功能正在赶来的路上。\n\n欢迎 star，下载使用，感兴趣也可以一起开发。\n\nGithub 地址：https://t.co/OdAAyIPRYQ", "createdAt": "Fri Oct 30 00:02:00 +0000 2026", "replyCount": 276, "retweetCount": 321, "likeCount": 2364, "conversationId": "2115957353648664966", "author": {"username": "wangzan101", "name": "王赞", "profileImageUrl": "https://pbs.twimg.com/profile_images/2018970089199112193/Ds0vM7cd_normal.jpg"}, "authorId": "1813556838815911937"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7Yn67bcAAM-IQ.jpg", "width": 1200, "height": 600, "previewUrl": "https://pbs.twimg.com/media/HV7Yn67bcAAM-IQ.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-10-31T03:10:01+00:00", "createdAtBeijing": "2026-10-31T11:10:01+08:00", "createdAtLocal": "10-31 11:10 北京", "url": "https://x.com/indie_maker_fox/status/2116367057822589162", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2116367057822589162", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Mika 安卓端侧 Agent 开源", "evidence": "跑任务需 Android 13+", "rationale": "开源发布包含操作机制、运行要求与风险边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2116338048728457411", "track": "agent", "source": {"id": "2116338048728457411", "text": "翻了下实现，这次没有用 oauth，而是用 claude 官方的 sdk，模型请求全部由 Claude Code 自己发。\n\n比较有意思的是 tool 的处理。启动时先把 Claude Code 掏空，tools: [] 关掉所有内置工具，settingSources: [] 不读 ~/.claude 和项目配置，只允许 mcp__opencode__*。然后把 OpenCode 的 tool 做成进程内 MCP server。\n\n由于 MCP handler 收不到 tool_use_id，只能靠 PreToolUse hook 存和取，所以 Claude 的并行读文件也会变成串行。system prompt 用 Claude Code 内置的，opencode 内置的 system prompt 不生效。\n\n这一套下来，感觉效果肯定不如直接用 claude code 好，为什么不直接用 Claude Code 呢。。\n\n另外，想起 Pi 也有类似方案 pi-claude-code，做法更激进一些，走 claude -p 加本地 relay，拦截、抓取、改写上游请求。", "createdAt": "Sat Oct 31 01:14:45 +0000 2026", "replyCount": 17, "retweetCount": 1, "likeCount": 40, "conversationId": "2116338048728457411", "author": {"username": "chenchengpro", "name": "陈成", "profileImageUrl": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, "authorId": "15205852", "quotedTweet": {"id": "2116198602523513081", "text": "you can now use your claude subscription in OpenCode", "createdAt": "Fri Oct 30 16:00:38 +0000 2026", "replyCount": 402, "retweetCount": 396, "likeCount": 8064, "conversationId": "2116198602523513081", "author": {"username": "opencode", "name": "OpenCode", "profileImageUrl": "https://pbs.twimg.com/profile_images/1973794620233433088/nBn75BTm_normal.png"}, "authorId": "1965545045089792000", "translationZh": "现在可以在 OpenCode 中使用你的 claude 订阅了"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "云谦（陈成）", "role": "Agent 与开发工具实践与观察", "why": "持续拆解验证、编排、后台服务和事件恢复，Coding Agent 工程增量强。", "handle": "chenchengpro"}, "createdAtIso": "2026-10-31T01:14:45+00:00", "createdAtBeijing": "2026-10-31T09:14:45+08:00", "createdAtLocal": "10-31 09:14 北京", "url": "https://x.com/chenchengpro/status/2116338048728457411", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2116338048728457411", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "OpenCode 接入 Claude Code 的实现分析", "evidence": "把 OpenCode 的 tool 做成进程内 MCP server", "rationale": "拆解工具桥接、配置隔离与并行受限原因"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1988508365274968065/t6BOO_uc_normal.jpg"}, {"id": "2116476021213954063", "track": "tools", "source": {"id": "2116476021213954063", "text": "Codex 这一年越做越顺手，App、CLI、VS Code 插件都有，沙箱、子 Agent、自动压缩上下文一样不缺。可它只认 OpenAI 自家的模型。\n\n想让它用 Claude 写前端，或者拿便宜的 DeepSeek、GLM 干点杂活，基本没门。\n\nClaude Code 那边正好反过来。界面和习惯都用顺了，有些活却更想交给 GPT 或者 Kimi。\n\nopencodex 拆的就是这堵墙，它是一个用 TypeScript 写的本地代理，口号就一句 make codex open。\n\n装上以后，Codex、Claude Code、Claude Desktop、Grok Build 的界面都不用换，背后接哪家模型你说了算：Claude、Gemini、Grok、DeepSeek、Kimi、通义、本地的 Ollama，内置四十多家，OpenAI 兼容的接口也都能接。", "createdAt": "Sat Oct 31 10:23:00 +0000 2026", "replyCount": 27, "retweetCount": 0, "likeCount": 7, "conversationId": "2116476021213954063", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2083504010200248788", "text": "用了两周 OpenCodex，终于把 Codex 和 Claude Code 的模型彻底解耦了。\n\n你可以把它理解成一个“给 Codex 和 Claude Code 换模型的本地代理”。\n\n它不是什么新模型，也不会把多个模型融合成超级模型，而是保留原来的 Agent 界面和工作流，在中间负责协议转换、模型路由和账号管理。\n\n简单来说就是：\n\nCodex / Claude Code\n↓\nOpenCodex 本地代理\n↓\nClaude、Gemini、Grok、Kimi、DeepSeek、GLM、Ollama 等模型\n\n比较吸引人的地方，是你不用放弃已经熟悉的 Codex 工作流，就能根据任务切换不同模型。\n\n比如前端交给 Kimi，后端交给 GPT，搜索交给 Grok，简单任务用便宜模型，复杂调试再切高端模型。\n\n它还支持本地模型、模型自动发现、多账号轮换、子代理配置和请求日志 Dashboard。\n\n安装也不算复杂，Node.js 18 以上就可以：\n\nnpm install -g @bitkyc08/opencodex\nocx init\nocx start\nocx gui\n\n目前还很年轻，更新快，兼容性偶尔会跳。适合爱折腾的个人开发者，不建议直接上团队生产。\n\n补充几点真实体验：\n\n1. 本地跑 ≠ 数据不出本机。接云端模型请求还是会出去。 \n2. 账号池、OAuth 转发有限流和封号风险，稳妥做法是先单 Key 测。 \n3. 流式、工具调用、图片目前大部分能用，但跨模型子代理偶尔还是会有坑。\n\n最大价值不是“又一个代理”，而是验证了未来趋势： Agent 外壳和模型正在解耦。\n\n适合先用一个测试项目跑通，再慢慢加路由。", "createdAt": "Sat Aug 01 10:44:00 +0000 2026", "replyCount": 22, "retweetCount": 6, "likeCount": 19, "conversationId": "2083504010200248788", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOoGiFRaEAARnm9.jpg", "width": 1200, "height": 800, "previewUrl": "https://pbs.twimg.com/media/HOoGiFRaEAARnm9.jpg:small"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2083484960217034754/img/eQWbOgsrmcSXqkBM.jpg", "width": 960, "height": 874, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2083484960217034754/img/eQWbOgsrmcSXqkBM.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2083484960217034754/vid/avc1/960x874/RgoubW87wDo7c3u9.mp4?tag=29", "durationMs": 3800}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2083484960242241536/img/yLDvIALQuYWibhqz.jpg", "width": 960, "height": 648, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2083484960242241536/img/yLDvIALQuYWibhqz.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2083484960242241536/vid/avc1/960x648/eCRQfhOsONGMo_MC.mp4?tag=29", "durationMs": 9180}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2083484960208605184/img/4VTHfm_Ev24xJDxE.jpg", "width": 900, "height": 802, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2083484960208605184/img/4VTHfm_Ev24xJDxE.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2083484960208605184/vid/avc1/900x802/bdArkKRJxUsm9Bk_.mp4?tag=29", "durationMs": 13190}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV3IzVvbIAApm6q.jpg", "width": 1080, "height": 461, "previewUrl": "https://pbs.twimg.com/media/HV3IzVvbIAApm6q.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-31T10:23:00+00:00", "createdAtBeijing": "2026-10-31T18:23:00+08:00", "createdAtLocal": "10-31 18:23 北京", "url": "https://x.com/sitinme/status/2116476021213954063", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2116476021213954063", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "OpenCodex本地模型代理介绍与体验", "evidence": "跨模型子代理偶尔还是会有坑", "rationale": "含工具功能、安装步骤和自述兼容性反馈"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2116345417281470809", "track": "tools", "source": {"id": "2116345417281470809", "text": "写在最后\n\n有两点最好提前知道。magpie 会读 Claude Code、Codex 的登录信息来发现你的订阅，不想让它读，在设置的 Privacy 里关掉，或者跑 magpie accounts discovery off。另外，把订阅拿给第三方 Agent 用，各家的服务条款不一定允许，主力账号自己掂量。还有一个小细节，这个仓库不接外部 PR，有需求得去 Discord 提。\n\n跟 CC Switch 比，CC Switch 主要是帮你切几个 CLI 的 provider 配置；magpie 多了一个能翻译协议的网关，覆盖的 Agent 也多得多，还能共享订阅、自动换号。如果你只用一个 Agent，一份订阅也够用，没必要装它。手上同时开着好几个 Agent、好几份订阅的，值得花一个下午装上试试。\n\n延伸阅读：\n项目地址：https://t.co/KFW4T1yM2N\n官方文档：https://t.co/b2mlCLTVrx\n同类对比：https://t.co/xEnM9J9jf3", "createdAt": "Sat Oct 31 01:44:01 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2116345410503446740", "inReplyToStatusId": "2116345416606261449", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-10-31T01:44:01+00:00", "createdAtBeijing": "2
