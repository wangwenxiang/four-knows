<script>
const DATA={"records": [{"id": "2119973180945387755", "track": "enterprise", "source": {"id": "2119973180945387755", "text": "Airbnb 生产评测：微调小分类器对标前沿质量，高流量下成本约 1%\n\n@AirbnbEng 工程博客写了一项自家生产分类任务的对照：用内部框架 GLOWC 把开源小模型微调成分类器，再和开源基座、前沿 API 比质量、时延和费用。\nhttps://t.co/aelLPySNqA\n\n测的是什么、怎么比\n\n场景不是开放问答，而是实时拦截：筛查内容是否违反「定价与支付透明度」政策。误报会拦下本可发布的内容，因此要高精度；线上每分钟调用达数千次，必须在 200 毫秒内给出可设阈值的分数。\n\n对照模型是微调后的 Gemma4-E2B。评测用 1 万条按生产流量加权的留出样本。开源模型部署在单张 RTX Pro 6000 上，默认和对照共用大约 400 词的简明提示。质量看最高 F1：能打分的模型扫阈值取最佳结果，只输出是或否的模型则直接报判定的 F1。\n\n质量、时延和「1%」比的是什么\n\n未微调的开源模型虽然够快，质量明显偏低。GPT-6.1 Sol、Claude Sonnet 5.5 即使少思考，中位时延大约 900 毫秒，p99 可达数秒，远超预算。简明提示下，Sol 精确率大约 0.82、召回率大约 0.96，偏召回，而这项任务更怕误杀。\n\n微调把 Gemma4-E2B 的 F1 从 0.563 提到 0.902，与最好的专有模型相当，中位时延大约 35 毫秒，p99 大约 85 毫秒。提示加长到大约 2700 词后，专有生成模型大约还能再涨 1 到 3 个点，但时延和费用更高；能赶上时延预算的模型，靠加长提示也补不上质量缺口。\n\n「~1%」指每分钟数千次的高流量下，按 2026 年 10 月公开标价估算，简明提示的前沿 API 费用大约是单卡自建的两个数量级。计算还假设了 71% 的缓存命中率，高于实测，也不含议价折扣。更便宜的专有方案仍大约是单卡的近 5 倍，准确率还不如微调器。流量大约低于每分钟 15 到 30 次时，Sonnet 5.5 和 Sol 才可能比专属 GPU 更便宜。", "createdAt": "Tue Nov 10 01:59:28 +0000 2026", "replyCount": 20, "retweetCount": 0, "likeCount": 11, "conversationId": "2119973180945387755", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119837710387200317", "text": "What if you could get frontier-level AI classification at 1% of the cost?\n\nAirbnb engineers fine-tuned a small language model to deliver comparable accuracy in under 100ms. Here’s how. 👇\n\nhttps://t.co/84lMBi1CrA", "createdAt": "Mon Nov 09 17:01:09 +0000 2026", "replyCount": 14, "retweetCount": 27, "likeCount": 362, "conversationId": "2119837710387200317", "author": {"username": "AirbnbEng", "name": "Airbnb Engineering", "profileImageUrl": "https://pbs.twimg.com/profile_images/1922409174929211392/bVosVBme_normal.png"}, "authorId": "838673862", "translationZh": "如果只花 1% 的成本，就能达到前沿 AI 模型的分类水平呢？\n\nAirbnb 工程师微调了一个小型语言模型，在不到 100 毫秒内就能完成分类，准确率也与前沿模型相当。具体做法见下文。👇\n\nhttps://t.co/84lMBi1CrA"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuoXY0bIAA9iuY.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWuoXY0bIAA9iuY.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-10T01:59:28+00:00", "createdAtBeijing": "2026-11-10T09:59:28+08:00", "createdAtLocal": "11-10 09:59 北京", "url": "https://x.com/shao__meng/status/2119973180945387755", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2119973180945387755", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Airbnb 实时政策审核的小模型微调", "evidence": "F1 从 0.563 提到 0.902", "rationale": "企业自报生产样本上的质量与时延，并交代成本估算假设。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119978619196084717", "track": "agent", "source": {"id": "2119978619196084717", "text": "代码合入前抓住缺陷：Meta 用 JiTTests 生成会失败的测试，并让工程师在流程里把关\n\n不靠更快地审代码，而是生成会失败的测试\n\n多数 AI 查错像加速版人工评审。JiTTests 针对尚未合入的代码变更，自动生成可执行测试，故意让它在新版本上失败、在父版本上通过，把行为差异摊开。系统夜间用空闲算力跑，并按类似 Diff Risk Score 的机制，优先处理前一天的高风险变更。\n\n两条工作流并行。一条把每次改动都当成变异，生成能区分新旧行为的测试，不推断作者意图；另一条则根据代码、标题和摘要推断意图与风险，再构造变异、生成测试，并在真实变更上运行。先得到「弱捕获」，也就是测试失败了；再从中筛出真正指向缺陷的「强捕获」。论文称，在大约 22,126 个生成测试上，这种感知变更的方法，弱捕获大约是传统测试加固的 4 倍、偶然失败测试的 20 倍。\n\nMeta 自报的过滤与效果\n\n失败测试里误报很多。系统用规则工具 RubFake，再加上多个大模型组成的评判团来排序。论文写，在 600 个出现弱捕获的变更上，评判团大约把人工审阅负担降了 70%。流程需要工程师把关：人来定标准、看汇总，通常只需确认行为变化是否符合预期。\n\n论文记录的是初期触达：向工程师报告 41 个候选，8 个被确认为真阳性，大约 19.5%，其中 4 个若未拦截可能导致严重故障。博客给出更晚的生产口径：589 名工程师参与过（占被触达者的 64%），他们报告真阳性率约 60%；2026 年上半年，系统在变更合入前帮助捕获 74 起严重隐私事故，并使同期这类事故的总体发生率下降约 20%。60% 来自已参与者的反馈，20% 是公司自己的对比口径，文中没有给出可独立核对的对照实验。\n\nhttps://t.co/hHEv3vVeou", "createdAt": "Tue Nov 10 02:21:04 +0000 2026", "replyCount": 21, "retweetCount": 2, "likeCount": 21, "conversationId": "2119978619196084717", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119829872738714070", "text": "🧠 Most AI bug-catching tools review your code the way a human reviewer would, only faster. What if the AI wrote a test that proved the bug instead?\n\nThat’s Catching Just-in-Time Tests (JiTTests) — a novel approach where LLMs generate executable tests designed to fail, surfacing behavioral changes in a code change before it lands.\n\nAfter a year of research, it’s now part of Meta’s infrastructure.\n\n✅ 589 engineers have engaged with it, reporting a 60% true-positive rate\n\n📈 In the first half of 2026, it helped catch 74 privacy SEVs at the diff stage, lowering overall privacy SEV occurrence by 20%\n\n🔗 Read how it works: https://t.co/dxVljpTmyB\n\n📄 Read our FSE 2026 paper, “Just-in-Time Catching Test Generation at Meta”: https://t.co/YKnj30xOn6\n\n#AI #SoftwareEngineering #SoftwareTesting #DeveloperTools #Engineering", "createdAt": "Mon Nov 09 16:30:00 +0000 2026", "replyCount": 32, "retweetCount": 76, "likeCount": 764, "conversationId": "2119829872738714070", "author": {"username": "Meta_Engineers", "name": "Engineering at Meta", "profileImageUrl": "https://pbs.twimg.com/profile_images/1453866309851049989/Iq6B3KjP_normal.png"}, "authorId": "68639853", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYD1iua0AEnGQs.jpg", "width": 1376, "height": 768, "previewUrl": "https://pbs.twimg.com/media/HWYD1iua0AEnGQs.jpg:small"}], "translationZh": "🧠 大多数 AI 缺陷检测工具沿用人工代码审查的思路，只是速度更快。如果让 AI 写一个测试来证实缺陷呢？\n\n这就是即时缺陷捕获测试（JiTTests）。这种新方法让大语言模型生成可执行的测试，利用预期的测试失败，在代码合入前暴露行为变化。\n\n经过一年的研究，这项技术已成为 Meta 基础设施的一部分。\n\n✅ 已有 589 名工程师参与，报告的真阳性率为 60%。\n\n📈 2026 年上半年，它帮助团队在代码差异审查阶段发现了 74 起隐私 SEV，使隐私 SEV 的总体发生率下降了 20%。\n\n🔗 了解工作原理：https://t.co/dxVljpTmyB\n\n📄 阅读我们在 FSE 2026 发表的论文《Just-in-Time Catching Test Generation at Meta》：https://t.co/YKnj30xOn6\n\n#AI #SoftwareEngineering #SoftwareTesting #DeveloperTools #Engineering"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWutT6aasAA4Pxh.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWutT6aasAA4Pxh.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-10T02:21:04+00:00", "createdAtBeijing": "2026-11-10T10:21:04+08:00", "createdAtLocal": "11-10 10:21 北京", "url": "https://x.com/shao__meng/status/2119978619196084717", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2119978619196084717", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Meta JiTTests 合入前缺陷检测", "evidence": "在新版本上失败、在父版本上通过", "rationale": "论文与博客披露测试生成、误报过滤和生产拦截数据。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119999739714478538", "track": "research", "source": {"id": "2119999739714478538", "text": "一个 Coding Agent 连续优化了几天 GPU Kernel，性能却早早卡住。继续投入 Token，它往往只会反复打磨已有方案，很难跳出当前的局部最优。\n\nUC Berkeley 最近的论文《Evolving Agent Teams》，提出了一个方向是让 Agent 团队在执行过程中不断调整自身的组织结构。\n\n研究团队开发了 EAT（Evolving Agent Teams），在 Coding Agent 团队之上引入一个 Supervisor Agent。\n\nSupervisor 会持续观察任务进展、性能指标和失败记录。一旦发现团队陷入瓶颈，就重新设计下一轮的角色分工和协作方式。\n\n比如，遇到难以解决的底层实现问题，就安排专门的 Debugger；发现性能瓶颈不清楚，就加入 Profiler；之前团队的重要发现被遗忘了，就引入 Knowledge Integrator，把分散的经验重新整理成可执行的方案。\n\n整个过程还有一套持久化文件系统，保存 Learnings、Evolution History 和代码产物。即使团队经历多次重组，之前验证过的结论和失败经验也不会轻易丢失。\n\n论文里的 GPU Kernel 优化案例很有代表性。普通 Coding Agent 在难以调通 WGMMA 后，倾向于退回更容易实现、但性能上限较低的方案。EAT 则通过调整团队分工和恢复历史经验，让优化继续推进。\n\n在 MLA Decode 任务上，相近的约 800 美元模型推理预算下，EAT 达到生产版 FlashInfer 的 0.74 倍性能，Claude Code 为 0.51 倍。进一步增加预算后，EAT 在 47 个生产负载上的几何平均速度达到 FlashInfer 的 1.21 倍，其中 36 个负载更快。\n\n当然，主要实验每组只运行两次，而且任务具有明确的性能指标，能否推广到更开放的 Agent 任务还需要验证。\n\n这个研究对 Long-running Agent 和 Harness Engineering 很有启发。\n\n随着任务持续推进，Agent 需要的能力和协作模式也在变化。未来的 Agent Harness，或许需要具备持续诊断自身工作流程、重新组织执行团队的能力。\n\n📎 arXiv: https://t.co/w1JDqvcMEU\n\n💻 GitHub: https://t.co/hxwtCHYPsr", "createdAt": "Tue Nov 10 03:45:00 +0000 2026", "replyCount": 19, "retweetCount": 22, "likeCount": 139, "conversationId": "2119999739714478538", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWum9RFXQAAvC6I.jpg", "width": 1155, "height": 1191, "previewUrl": "https://pbs.twimg.com/media/HWum9RFXQAAvC6I.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-10T03:45:00+00:00", "createdAtBeijing": "2026-11-10T11:45:00+08:00", "createdAtLocal": "11-10 11:45 北京", "url": "https://x.com/Xudong07452910/status/2119999739714478538", "themeId": "editorial", "signalScore": 84, "editorial": {"id": "2119999739714478538", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "动态重组 Agent 团队优化 GPU Kernel", "evidence": "几何平均速度达到 FlashInfer 的 1.21 倍", "rationale": "转述论文的团队重组机制、预算对照及实验局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120156649453507002", "track": "growth", "source": {"id": "2120156649453507002", "text": "We replaced our third-party browser analytics script with a single Cloudflare Tail Worker streaming into ScopeDB Cloud.\n\nLooking at a single 24-hour window (9,658 Worker invocations) made it obvious why raw edge counters and browser-only scripts tell such different stories. Almost half of all requests (4,537) were background Next.js link prefetches, 912 carried AI bot signals, and 347 fetched raw Markdown docs or /llms.txt directly, while only 162 were actual browser document navigations (Sec-Fetch-Mode: navigate).\n\nWe also switched URL query capture to store the full decoded parameter map inside a ScopeDB Variant column while redacting secret-like tokens in both request and Referer paths. Whenever a new campaign parameter or product filter shows up in production, we can query it on the fly in ScopeQL without migrating tables or redeploying the collector.", "createdAt": "Tue Nov 10 14:08:30 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 6, "conversationId": "2120156649453507002", "author": {"username": "tison1096", "name": "tison", "profileImageUrl": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, "authorId": "740784709878288384", "quotedTweet": {"id": "2120155734344356075", "text": "In 24 hours on our site and docs, our Cloudflare Worker logged 9,658 requests: 4,537 were background SPA prefetches, 912 carried AI bot signals, and only 162 were browser document navigations.\n\nStream Workers into ScopeDB via one Tail Worker to query them all: https://t.co/Q2Bhj43Hsl", "createdAt": "Tue Nov 10 14:04:52 +0000 2026", "replyCount": 1, "retweetCount": 1, "likeCount": 2, "conversationId": "2120155734344356075", "author": {"username": "scopedbio", "name": "ScopeDB", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952366949192925184/XIAANiVa_normal.jpg"}, "authorId": "1918079432730001413", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxOLm7bUAEFCGt.jpg", "width": 2048, "height": 1312, "previewUrl": "https://pbs.twimg.com/media/HWxOLm7bUAEFCGt.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxON8qaMAAOqfo.jpg", "width": 2048, "height": 1312, "previewUrl": "https://pbs.twimg.com/media/HWxON8qaMAAOqfo.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxOWj_bwAA_VzT.jpg", "width": 2048, "height": 1312, "previewUrl": "https://pbs.twimg.com/media/HWxOWj_bwAA_VzT.jpg:small"}], "translationZh": "在 24 小时内，我们的 Cloudflare Worker 为网站和文档站记录了 9,658 次请求。其中 4,537 次来自单页应用（SPA）的后台预取，912 次带有 AI 机器人特征，只有 162 次是由浏览器导航触发的文档请求。\n\n通过一个 Tail Worker 将各个 Worker 的日志实时传入 ScopeDB，即可统一查询：https://t.co/Q2Bhj43Hsl"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "tison（陈梓立）", "role": "Agent 与开发工具实践与观察", "why": "公开 Agent 参与版本变更确认、验收和测试治理，企业工程价值具体。", "handle": "tison1096"}, "createdAtIso": "2026-11-10T14:08:30+00:00", "createdAtBeijing": "2026-11-10T22:08:30+08:00", "createdAtLocal": "11-10 22:08 北京", "url": "https://x.com/tison1096/status/2120156649453507002", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2120156649453507002", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "区分网页访问、预取和机器人流量的分析实践", "evidence": "9,658 Worker invocations", "rationale": "用一天采样拆分流量来源并说明查询参数脱敏"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们用一个 Cloudflare Tail Worker 替换了第三方浏览器分析脚本，将数据实时传入 ScopeDB Cloud。\n\n只看一个 24 小时窗口内的 9,658 次 Worker 调用，就能看出为什么边缘节点的原始计数和仅在浏览器运行的脚本会得出截然不同的结果。近一半请求（4,537 次）来自 Next.js 在后台预取链接，912 次带有 AI 机器人特征，347 次直接获取原始 Markdown 文档或 /llms.txt，真正由浏览器导航触发的文档请求只有 162 次（Sec-Fetch-Mode: navigate）。\n\n我们还调整了 URL 查询参数的采集方式，将解码后的完整参数映射存入 ScopeDB 的 Variant 列，并对请求路径和 Referer 路径中疑似敏感的令牌做脱敏处理。每当线上出现新的营销活动参数或产品筛选条件，我们都能直接用 ScopeQL 查询，无需迁移表或重新部署采集器。"}, "avatar": "https://pbs.twimg.com/profile_images/1071402420301778945/RqkZEVm-_normal.jpg"}, {"id": "2120191790774960630", "track": "research", "source": {"id": "2120191790774960630", "text": "Google 正式开放 Gemini 4 Carbon：付费 API 今天可用，引入价到 11 月 30 日；普通用户要订 Ultra，每月 99.99 美元起\n\nGoogle 11 月 10 日把 Gemini 4 Carbon 开放给付费开发者、企业和 Google AI Ultra 订阅用户。10 月 28 日 Carbon 首次亮相时，只给通过审查的网络安全防御团队用，这次是正式上线。\n\nGoogle 说 Carbon 是它目前最强的模型，留给最难的长任务；四周前发布的 Gemini 4 Argon，仍然是大多数写代码和知识工作的首选。\n\n【谁能用，要多少钱】\n\n普通用户要订 Google AI Ultra，才能在 Gemini App、Google 搜索的 AI 模式、Antigravity 和 AI Studio 里用 Carbon，目前在逐步推送。\n\nUltra 有两档：每月 99.99 美元（用量是 Pro 的 5 倍）和 199.99 美元（20 倍）。\n\n每月 19.99 美元的 Pro 用不了，Antigravity 官方模型表里 Pro 一栏写的是不支持，Pro 用户能用的最强 Gemini 还是 Argon。\n\nAnthropic 昨天发布的 Claude Fable 5.2 价位差不多：Max（100 美元）和 Ultra（200 美元）套餐含 Fable，最多用掉每周额度的一半；20 美元的 Pro 也能用，平时要另外按量付费。\n\n开发者走 Gemini API 的付费层，AI Studio 和 Android Studio 里都能调用，模型名 gemini-4-carbon，免费层没有。价格和 Argon 一样：11 月 30 日前是引入价，每百万 Token 输入 2 美元、输出 10 美元；12 月 1 日起翻倍到 4 美元和 20 美元。两周前官方没说引入期到哪天，现在定了。\n\n单价一样，账单不一定一样。官方文档写明，Carbon 每轮思考用的 Token 比 Argon 多，响应也更慢，同一个任务跑下来会更贵。按单价算，涨价后的 Carbon 和 Claude Opus 5.5（4 / 20 美元）持平，是 Fable 5.2（8 / 40 美元）的一半、GPT-6 Astra（10 / 50 美元）的五分之二。\n\n企业可以在 Gemini for business 里用。参加 Google 科研计划的科学家（1 万个名额，Antigravity 最高用量档免费 6 个月）这次也能用上 Carbon。网络安全防御团队仍要申请 Fairwind 计划，才能用到去掉网络安全限制的“Carbon for cyber”，上面的价格只适用于公开版。这和 Anthropic 把同一个模型分成 Fable（带护栏）和 Mythos（只给审核过的机构）是一个思路。\n\n【比 Argon 强在哪】\n\n官方建议的分工是：日常写功能、边聊边改代码用 Argon，快也省；复杂的根因排查、架构设计、从一大堆文档里综合信息、科学证明和安全审计交给 Carbon。Anthropic 给自家模型的建议也类似，大多数活先用 Opus 5.5，任务更大更开放再换 Fable。\n\n写网页应用时，Carbon 会反复构建、检查：既看代码，也看页面实际渲染出来的样子，发现错误自己改，直到交出能跑的完整应用。Google 的演示里有它做的 3D 游戏，还有一个埃菲尔铁塔建造过程的 3D 展览。\n\n推文说的“数据缺失或有问题时会提醒你，不会瞎猜”，Google 用一套 375 个任务的诚实度测试来衡量：Carbon 通过 92%，Argon 是 70%；碰到缺失的实验数据，98% 的情况下不会自己编；实验方法有缺陷时，68% 的情况会指出来。Google 举的例子是，只给 Carbon 实验记录和原始数据，它从异常数据里推断出仪器没把样品混匀，帮实验室提高了实验的可重复性。\n\n【跟 Fable 5.2、GPT-6 Astra 比】\n\n两周前，Carbon 在第三方评测机构 Artificial Analysis 的综合榜上排第一。昨天 Fable 5.2 发布后，榜首换了人：现在 Fable 5.2 65 分，Carbon 60 分，Claude Opus 5.5 59 分，GPT-6 Astra 57 分（v5.0.1 版，各取最高档）。\n\nGoogle 这次挑的几个第三方评测都在强调便宜。Zapier 的业务流程自动化评测 AutomationBench 上，Carbon 开 High 档 53.9%，每个任务花 2.12 美元；别家最好的 Fable 5.2 开 Max 档 51.5%，每个任务 4.64 美元，贵一倍多。\n\nArtificial Analysis 和 Google 合作推出的新评测 MKA，考 AI agent 读带图表、工程图纸的复杂文件干活，Fable 5.2 57%，Carbon 54% 排第二，Google 说 Carbon 每个任务的花费不到第一名的六分之一。\n\n写代码各家说法不一。Google 说 Carbon 在 Cursor 的 CursorBench 4.0 上排第一，但 Cursor 官网榜单目前还没列出 Carbon，排第一的是 Fable 5.2 开 Max 档，60.0%。Anthropic 昨天公布的 FrontierCode 2.0 成绩里，Fable 5.2 开 Xhigh 档 49.1%，GPT-6 Astra 42.8%，Carbon 41.1%。\n\n【/swarm：一句话拉起一支 agent 团队】\n\nAntigravity 同时预览了 /swarm 命令。输入 /swarm 加任务描述，当前对话就变成“协调员”：它把任务拆成互不冲突的几块，比如一个文件或一个包一块，每块配一个有名字的 agent，比如 @parser、@api-tests；每两到四个干活的 agent 配一个“验证员”，看改动、跑测试，发现问题退回去改。\n\n所有 agent 在一块共享留言板上沟通，你在侧边面板里能实时看到谁在干什么，也能点进任何一个 agent 插手。没活干的 agent 会休眠，不消耗 Token。\n\n每个 agent 可以指定不同的模型。Google 建议让 Carbon 当协调员、架构师和审查员，改文件、写常规代码交给更快更便宜的模型。\n\n/swarm 目前在 Antigravity App 和命令行工具里推送，Pro 和 Ultra 用户都能用，只是 Pro 用户选不到 Carbon。官方文档提醒，每个 agent 都单独消耗额度，用 /swarm 烧额度比普通对话快得多。\n\n上面的评测成绩，除 Artificial Analysis 综合榜和 Zapier 榜单能在对方官网核对外，其余是 Google 或 Anthropic 自己公布的；Gemini App 里用 Carbon 有多少额度，官方没单独写。\n\n来源：\nGoogle 官方博客《Gemini 4 Carbon is now available》\nhttps://t.co/7ok0Bpu5DK\n开发者文档《What's new in Gemini 4 Carbon》（价格、与 Argon 的区别）\nhttps://t.co/3a6OTkQdR4", "createdAt": "Tue Nov 10 16:28:08 +0000 2026", "replyCount": 16, "retweetCount": 4, "likeCount": 79, "conversationId": "2120191790774960630", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2120185896469496180", "text": "Gemini 4 Carbon is rolling out today. It’s built for sustained, long-horizon tasks, reasoning deeply through complex software engineering, cybersecurity, and scientific discovery.\n\nComing globally via the Gemini API in @GoogleAIStudio and Gemini for business, and for Ultra subscribers in @antigravity, the @GeminiApp, and AI Mode in Search.", "createdAt": "Tue Nov 10 16:04:43 +0000 2026", "replyCount": 443, "retweetCount": 456, "likeCount": 6057, "conversationId": "2120185896469496180", "author": {"username": "sundarpichai", "name": "Sundar Pichai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_normal.jpg"}, "authorId": "14130366", "translationZh": "Gemini 4 Carbon 今日开始推出。它专为需要持续推进的长程任务打造，能在复杂的软件工程、网络安全和科学发现任务中进行深度推理。\n\n该模型将通过 @GoogleAIStudio 中的 Gemini API 和 Gemini for business 面向全球开放。Ultra 订阅用户也可在 @antigravity、@GeminiApp 和 Google 搜索的 AI Mode 中使用。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-10T16:28:08+00:00", "createdAtBeijing": "2026-11-11T00:28:08+08:00", "createdAtLocal": "11-11 00:28 北京", "url": "https://x.com/dotey/status/2120191790774960630", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2120191790774960630", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Gemini 4 Carbon 开放与模型评测", "evidence": "11 月 30 日前是引入价", "rationale": "汇总模型开放范围、API价格、评测结果与来源。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119981772226392254", "track": "creative", "source": {"id": "2119981772226392254", "text": "今天好好研究了一下 Hypit，我还是认为他们是最强的复刻工具，根本原因就是我觉得它这个 Harness实在是太好用了，于是我逆向分析了一下它的素材控制，把它开源 Skill 里的规则文档一份份拆开来读\n\n从时间锚定、画面任务、持续系统、对照验收几个层面看：\n1. 时间锚定：B-roll、字幕、音效都绑定在口播的词上，而不是写死在第几秒。改稿、重录之后，画面跟着词走，不用一个个重新对时间\n\n2. 画面任务：每一下 B-roll 只干一件事，相邻两下必须给出不同的信息；先决定资料要盖住画面的哪一块，再让人物让开，脸和手势不被挡住\n\n3. 持续系统：跨好几句话一直存在的东西，比如累积的清单、章节标签、人像窗，只建一次，之后逐句只改它的状态，不每句重做一页\n\n4. 对照验收：做出来以后一次只看一个元素，交给没参与制作的人盲看，和参考视频并排比哪里不一样；能量化的直接量，不凭感觉来回调\n\n因为我最近一直在研究如何通过优质精准的语域、语态和语言形式，来让剪辑 Skill 能够把 B-roll 结合得很好，这就不得不说他们的语义索引和 B-roll 语法很精准了\n\n语义索引解决的是\"这一句该从素材库里找哪条画面\"，B-roll 语法解决的是\"这条画面在什么时候、以什么方式出现\"\n\n单单分析 B-roll 的索引规则，就要综合考虑：口播锚点、前后语境、叙事功能、素材类型、内容关系、入点、持续时间、画面位置、运动方式、字幕关系、音效关系、退出原因、与前后镜头关系\n\n这 13 项可以归成四组：\n\n1. 为什么出现：口播锚点、前后语境、叙事功能\n2. 出现什么：素材类型、内容关系\n3. 怎么出现：入点、持续时间、画面位置、运动方式\n4. 和谁配合、怎么收尾：字幕关系、音效关系、退出原因、与前后镜头关系\n\n于是你会发现，原来用Opus5.5+Hypit的思路+优质b-roll素材库，真的能干出无限的事儿，就是谁能让我用上Claude Ultra啊", "createdAt": "Tue Nov 10 02:33:36 +0000 2026", "replyCount": 1, "retweetCount": 1, "likeCount": 31, "conversationId": "2119981772226392254", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "quotedTweet": {"id": "2119840082354114579", "text": "嗯？？？？？不是吧。。。。一个月在github上 2.5w stars的项目hypit竟然又放焚诀了？？？又开源？？？？不会是又融了几千万吧。。。。这回我感觉可以用Claude把hypit好好研究一下了\n\n两个月前我用 Hypit 复刻过一条 26 秒的猫咪短片，全网拿下了将近100w的曝光，收获了两个跨境电商客户，一张照片换掉主角，所有的爆款视频都能6 分钟左右出片，花费也就是1.39 美元\n\n现在 @hypitai 把这件事做成了广告场景，单独做了一条Harness：Clone Viral Ads，给 Agent 一条竞品爆款广告，再放上你自己的产品，它拆 hook、镜头、字幕和动效，围绕你的卖点重做一版\n\n接下来我就要把hypit逆向一下看看他们到底是怎么做的，然后直接变成skill可以用来复刻爆款口播、爆款数字人。。。。我感觉我快起飞了\n\n如果你是做跨境的、或者是做投放、一个人做产品的，现在那些YouTube、 TikTok爆火的产品广告，真的可以用Hypit复刻下来做国人的场景了，开源仓库继续分享给大家", "createdAt": "Mon Nov 09 17:10:35 +0000 2026", "replyCount": 13, "retweetCount": 37, "likeCount": 269, "conversationId": "2119840082354114579", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWsvTxfaUAABG-_.jpg", "width": 1206, "height": 1158, "previewUrl": "https://pbs.twimg.com/media/HWsvTxfaUAABG-_.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWsvT-SbwAASZZ6.jpg", "width": 1280, "height": 687, "previewUrl": "https://pbs.twimg.com/media/HWsvT-SbwAASZZ6.jpg:small"}]}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "叫我阿杭", "role": "内容、视觉与多模态实践与观察", "why": "公开 Obsidian、录音与自媒体制作流程，直接贴合内容生产需求。", "handle": "Astronaut_1216"}, "createdAtIso": "2026-11-10T02:33:36+00:00", "createdAtBeijing": "2026-11-10T10:33:36+08:00", "createdAtLocal": "11-10 10:33 北京", "url": "https://x.com/Astronaut_1216/status/2119981772226392254", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2119981772226392254", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Hypit 视频复刻的素材匹配与剪辑规则", "evidence": "B-roll、字幕、音效都绑定在口播的词上", "rationale": "拆解可复用的口播锚定、素材匹配和对照验收规则"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, {"id": "2120069038873493989", "track": "tools", "source": {"id": "2120069038873493989", "text": "各位 Vibe Coder 们，咱们天天看自己的 token 额度还剩多少，天天担心 Claude Code、Codex 的 IP 健不健康、会不会被封号，把这些 Coding Agent 伺候得妥妥帖帖。可有多久，咱们没真正关心过自己的健康了？\n\n你上次体检是几年前？我是 3 年前，前公司的入职体检 🤦🏻‍♀️\n\n更扎心的是：就算现在去补一次，新报告和 3 年前那份也很难放在一起看。换了医院，指标名就变了；在国外做的化验，单位都不一样。一份写 Total Cholesterol 193 mg/dL，一份写 总胆固醇 5.0 mmol/L，数字看着差了几十倍，其实几乎是同一个值。\n\n我们给 agent 喂代码，都知道上下文没对齐就会出错。那健康数据呢？很少有人管。把两份报告一起丢给大模型，它能讲得头头是道，却未必知道这两个数说的是同一件事。数据层不先统一，模型再强也画不出一条对的趋势。\n\n所以今天我拿 Theta Health 开源的 Mirobody（Apache-2.0）认真试了一遍，我只关注一个点：它能不能把同一项认成同一项。全程用的都是虚拟数据。\n\n1. 在本地换算 193 mg/dL，结果是 4.99 mmol/L。「总胆固醇」和「total cholesterol」对到了同一个国际化验编码（LOINC 2093-3）。这一步没调模型，也没用 API Key。\n\n2. 中文 demo 里，一开始只有一份报告。我问「我的胆固醇有什么变化？」，它老实说只有一个时间点：4.60 mmol/L。我又导入了一份 PDF 体检报告和一份 CSV 化验单，同样的问题，这次画出了一条趋势：4.60、4.45、4.38。两份报告的英文写法一份是「Total Cholesterol-TC」，一份是「Cholesterol, Total」，它都认成了同一项。每个读数都能点开原文件看。\n\n3. 最让我放心的是：我输入「血脂 5.0 mmol/L」，它并没有硬猜，只是不给编码，因为「血脂」是一类检查，不是一项读数。写过代码的都懂，知道什么时候不该答，比什么都答更难得。\n\n我还用 1.6.0 版本复跑了它仓库里公开的名称识别用例，347 项全部通过。这只说明公开用例在这个版本上的表现，不代表临床准确率。\n\n没跑完的也照实说：16 GB 电脑上的全本地部署我还没试，这台机器上没装 Docker，磁盘空间也不够。下一篇补上实测。\n\n给自己的 agent 做了那么多配置，也花一个周末给自己的健康数据搭个底子吧：\n\n1. 先看中文 demo，里面是两位虚拟成员的数据：https://t.co/Yk6VRuKzPZ\n\n2. 给 Claude Code 接上（官方提供的命令，不用部署，也不要 Key）： claude mcp add mirobody -- uvx --python 3.12 mirobody mcp 提醒一句：接 Claude Code 这类云端工具时，记录会发给对应的模型公司。\n\n截至 11 月 9 日，它是 GitHub digital-health 话题下星标第 1 的项目。觉得有用，欢迎点个星，或者提 issue、PR：\nhttps://t.co/xCW5U6LJBp\n\n（然后，真的该去体检了啊。。。）", "createdAt": "Tue Nov 10 08:20:22 +0000 2026", "replyCount": 25, "retweetCount": 4, "likeCount": 14, "conversationId": "2120069038873493989", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWv_i1VaIAAdFBV.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWv_i1VaIAAdFBV.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-10T08:20:22+00:00", "createdAtBeijing": "2026-11-10T16:20:22+08:00", "createdAtLocal": "11-10 16:20 北京", "url": "https://x.com/shao__meng/status/2120069038873493989", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2120069038873493989", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Mirobody 化验名称与单位归一化实测", "evidence": "347 项全部通过", "rationale": "用虚拟数据验证单位换算、跨报告归一化及模糊项处理。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120225898209452045", "track": "research", "source": {"id": "2120225898209452045", "text": "Everyone’s reading this as “new model beats AlphaFold 3.” The more interesting line is buried in the thread.\n\nTop-1 accuracy goes from 74.3% with 1 seed to 83.1% with 100 seeds on the same 172 antibody–antigen interfaces.\n\nThat’s test-time scaling arriving in structural biology. Accuracy is no longer a fixed property of the model. It’s a dial you turn with GPU-hours, and the model’s own ranking score is what makes the dial work.\n\nWhich reframes the question for drug discovery teams. Not “which model is best,” but “how much compute is this target worth?” An early-stage screen and a lead candidate you’re about to spend six months on are not the same spend.\n\nInference cost per wet-lab experiment avoided is going to become a real metric.\n\nOne caveat worth noting: the AlphaFold 3 baseline runs on n=167 vs n=172 for the others. Small, but I’d want the matched subset before quoting the 30-point gap too confidently.", "createdAt": "Tue Nov 10 18:43:40 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 10, "conversationId": "2120225898209452045", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2120214931731775587", "text": "Introducing NovaAtom-Lite, an all-atom structure prediction model for drug discovery.\n\nIt predicts the structures of proteins, nucleic acids, and the molecules they bind, including how they fit together.\n\nNovaAtom-Lite outperforms both IsoDDE and AlphaFold 3 on FoldBench antibody–antigen structure prediction (DockQ ≥ 0.23):\n\nNovaAtom-Lite: 79.07% (n=172)\n\nIsoDDE: 75.58%\n\nAlphaFold 3: 47.90% (n=167)\n\nOur evaluation uses 5 seeds × 5 samples, with the top-1 prediction selected by the model's own ranking score.\n\nBetter structure prediction. A stronger starting point for your next experiment.\n\nLive today via Geodesic API and NovaDDE.\n\n🔗 API: https://t.co/mBdzq3sA2s\n\n🔗 NovaDDE: https://t.co/hoCwjST34V\n\n🔗 Model Card: https://t.co/p4aoXHuc7B", "createdAt": "Tue Nov 10 18:00:06 +0000 2026", "replyCount": 45, "retweetCount": 71, "likeCount": 423, "conversationId": "2120214931731775587", "author": {"username": "Geodesiclab", "name": "Geodesic Intelligence", "profileImageUrl": "https://pbs.twimg.com/profile_images/2097257170014515200/DjfUGcyu_normal.jpg"}, "authorId": "2080754848241496064", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyEPi3bUAAGH0P.jpg", "width": 1200, "height": 675, "previewUrl": "https://pbs.twimg.com/media/HWyEPi3bUAAGH0P.jpg:small"}], "translationZh": "推出 NovaAtom-Lite，一款面向药物研发的全原子结构预测模型。\n\n它能预测蛋白质、核酸及其结合分子的结构，也能预测这些分子如何结合。\n\n在 FoldBench 抗体–抗原结构预测任务中，以 DockQ ≥ 0.23 为达标标准，NovaAtom-Lite 的表现优于 IsoDDE 和 AlphaFold 3：\n\nNovaAtom-Lite：79.07%（n=172）\n\nIsoDDE：75.58%\n\nAlphaFold 3：47.90%（n=167）\n\n评估采用 5 个随机种子，每个种子生成 5 个样本，再根据模型自身的排序分数选出 Top-1 预测。\n\n更准确的结构预测，为下一次实验提供更可靠的起点。\n\n即日起可通过 Geodesic API 和 NovaDDE 使用。\n\n🔗 API：https://t.co/mBdzq3sA2s\n\n🔗 NovaDDE：https://t.co/hoCwjST34V\n\n🔗 模型卡：https://t.co/p4aoXHuc7B"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-10T18:43:40+00:00", "createdAtBeijing": "2026-11-11T02:43:40+08:00", "createdAtLocal": "11-11 02:43 北京", "url": "https://x.com/GenAI_is_real/status/2120225898209452045", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2120225898209452045", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "NovaAtom-Lite 结构预测与推理扩展", "evidence": "74.3% with 1 seed to 83.1%", "rationale": "发布结构预测模型，给出多种子收益并指出基线样本差异"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "大家都把这条消息解读成“新模型超越 AlphaFold 3”。还有一个更值得关注的数字，藏在帖子串里。\n\n在同一组 172 个抗体–抗原界面上，随机种子从 1 个增加到 100 个，Top-1 准确率就从 74.3% 提高到了 83.1%。\n\n推理时扩展已经进入结构生物学。准确率可以随投入的 GPU 小时数提高，前提是模型能用自己的排序分数选出更好的预测结果。\n\n对药物研发团队来说，问题也随之变成“这个靶点值得投入多少算力？”早期筛选和即将投入半年研究的先导候选物，值得投入的算力不同。\n\n每省去一次湿实验所需的推理成本，将成为一项实际的衡量指标。\n\n有个细节值得留意：AlphaFold 3 基线用了 167 个样本（n=167），其他模型用了 172 个（n=172）。样本数差得不多，但在引用约 30 个百分点的差距前，我会先看同一批样本上的对比结果。"}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2120186651741655428", "track": "research", "source": {"id": "2120186651741655428", "text": "Introducing GR00T 2: our most advanced, open System One model for robotics. It runs entirely on your robot’s onboard compute, fully untethered, and you own every weight of it. GR00T 2 features: \n\n1. Long-horizon tasks: dexterous manipulation and whole-body control chained over 20+ steps and 5+ minutes, such as performing chemistry lab experiments or assembling model airplanes end to end.\n2. X-Adapt: adapting from easy data sources (human wearables and simulation) and deploying zero-shot to diverse real robots.\n3. Unified Cognition: native integrations with frontier agents for advanced physical reasoning, robust error recovery, and safety monitoring.\n\nIt's an open-source buffet! We are releasing not only the model weights and X-Adapt recipes (coming December), but also our agentic framework, simulation engine, annotation engine, hardware design, and even training data (100K hours, that's ~11 yrs of experience), all available today! \n\nEverything that moves will be autonomous. Anyone can become a roboticist. \n\nLock in, build with us! \n\nDeep dive in thread:", "createdAt": "Tue Nov 10 16:07:43 +0000 2026", "replyCount": 77, "retweetCount": 104, "likeCount": 800, "conversationId": "2120186651741655428", "author": {"username": "DrJimFan", "name": "Jim Fan", "profileImageUrl": "https://pbs.twimg.com/profile_images/1554922493101559808/SYSZhbcd_normal.jpg"}, "authorId": "1007413134", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120178947035889664/img/RaYA0DTAiAgCHYpW.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120178947035889664/img/RaYA0DTAiAgCHYpW.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120178947035889664/vid/avc1/1920x1080/80g_VJCO3CcemdU7.mp4?tag=29", "durationMs": 90600}], "expert": {"priority": "P0", "domain": "多模态 / Agent", "name": "Jim Fan", "role": "NVIDIA / 研究员", "why": "具身 Agent、基础 Agent、机器人和仿真方向", "handle": "DrJimFan"}, "createdAtIso": "2026-11-10T16:07:43+00:00", "createdAtBeijing": "2026-11-11T00:07:43+08:00", "createdAtLocal": "11-11 00:07 北京", "url": "https://x.com/DrJimFan/status/2120186651741655428", "themeId": "editorial", "signalScore": 90, "editorial": {"id": "2120186651741655428", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "GR00T 2 机器人模型发布与开放计划", "evidence": "20+ steps and 5+ minutes", "rationale": "公布板载长程任务与零样本适配，权重计划十二月开放"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "推出 GR00T 2，我们最先进的开放式机器人 System One 模型。它完全在机器人本机运行，无需外部计算设备，所有模型权重均由你掌握。GR00T 2 的主要能力包括：\n\n1. 长程任务：将灵巧操作与全身控制串联起来，完成超过 20 步、持续 5 分钟以上的任务，例如从头到尾做一次化学实验或组装一架模型飞机。\n2. X-Adapt：利用易获取的数据源（如人体穿戴设备和仿真数据）进行适配，并以零样本方式部署到多种实体机器人上。\n3. Unified Cognition：原生集成前沿智能体，支持高级物理推理、稳健的错误恢复和安全监控。\n\n我们将于 12 月开放模型权重和 X-Adapt 方案。智能体框架、仿真引擎、标注引擎、硬件设计和训练数据今天就已开放。训练数据共 10 万小时，相当于约 11 年的经验。\n\n一切能动的设备都将实现自主运行。人人都能参与机器人研发。\n\n动手加入，和我们一起开发！\n\n技术细节见下方帖子串："}, "avatar": "https://pbs.twimg.com/profile_images/1554922493101559808/SYSZhbcd_normal.jpg"}, {"id": "2120117639125348470", "track": "agent", "source": {"id": "2120117639125348470", "text": "评测驱动开发是什么？LangChain 用一个 Agent 改造案例说明：先定义成功，再验证改动\n\n给 Agent 增加一个工具，整体得分提高了，原本正确的行为却可能退步。 @LangChain 团队 @divyasan0 这篇文章讨论的评测驱动开发（eval-driven development），就是把“感觉变好了”变成可验证的开发流程：先定义预期行为、建立评测和基线，再修改系统、逐项比较。\n\nhttps://t.co/pTpo0mZMiR\n\n# 先写清楚什么算对，再动手开发\n\n以内部文档助手为例：已有文档搜索和联网搜索，现在要增加创建 IT 工单的能力。“笔记本连不上 VPN”应该开单，“怎么连接 VPN”只是咨询，不该开单；原来的查询能力也不能受影响。\n\n这些要求要变成具体、可判定的评测，而不是笼统的“回答有帮助”。数据优先来自真实对话，没有流量时可以手写。能用代码检查的就用代码，例如是否调用了正确工具；需要模型判断时，先确认评分与人工判断一致。修改前跑一遍基线，才能知道后续改动究竟改善了什么。\n\n# 总分提高，不代表每种行为都变好\n\n用 8 条样例演示：没有工单工具时通过 5 条；加入工具后通过 7 条，却把“怎么连接 VPN”也开成了工单。\n\n查看执行记录后发现，工具说明写成“用于 VPN 和笔记本问题”，范围太宽。收窄说明后，8 条全部通过。问题不一定出在模型能力，也可能只是工具说明让它误解了适用范围。", "createdAt": "Tue Nov 10 11:33:29 +0000 2026", "replyCount": 21, "retweetCount": 0, "likeCount": 7, "conversationId": "2120117639125348470", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119837532502315503", "text": "How do you improve your agents? @divyasan0 from the LangChain Academy team walks through how the three steps of eval-driven development, a strategy for using evals to help build agents that improve over time.  https://t.co/on8UYaP0pt?", "createdAt": "Mon Nov 09 17:00:27 +0000 2026", "replyCount": 7, "retweetCount": 9, "likeCount": 67, "conversationId": "2119837532502315503", "author": {"username": "LangChain", "name": "LangChain", "profileImageUrl": "https://pbs.twimg.com/profile_images/2028336270431453184/jRRpLAdG_normal.jpg"}, "authorId": "1589007443853340672", "translationZh": "怎样让智能体持续改进？LangChain Academy 团队的 @divyasan0 讲解了评估驱动开发的三个步骤，介绍如何利用评估来构建能够持续改进的智能体。https://t.co/on8UYaP0pt?"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWwrv7AbwAEcmoI.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWwrv7AbwAEcmoI.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-10T11:33:29+00:00", "createdAtBeijing": "2026-11-10T19:33:29+08:00", "createdAtLocal": "11-10 19:33 北京", "url": "https://x.com/shao__meng/status/2120117639125348470", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2120117639125348470", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent 评测驱动开发与工具误调用", "evidence": "收窄说明后，8 条全部通过", "rationale": "用八条样例演示基线对比、误开工单定位和工具说明修正。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120208679005810803", "track": "creative", "source": {"id": "2120208679005810803", "text": "这期用皮影戏讲清 BaoCut 虚拟主播的工作原理：\n\n- 拆：AI 画一张正面像，再改十一次，程序逐像素比对，拆出二十七层\n- 动：给整张画罩上一张网，推网就能转头；十七个旋钮，头发像弹簧\n- 说：不听音量，看每个字的读音挑嘴型，嘴比声音早 0.03 秒\n\n还回答了：这算不算 AI 生成视频？要不要显卡？能不能换成自己的形象？他做不到什么？\n\n骨架、变形和弹簧移植自开源项目 LivLiv Player（Apache-2.0），感谢作者。主播形象由 Seedream 5.5 生成。\n\n项目地址：https://t.co/wldDX9MSVR\n\n----\n\n想让自己的视频也有一位虚拟主播？三步就行\n\n1. 把 BaoCut skill 装给你的 Agent\n\n装好 BaoCut 后，在终端运行一次：\n\nbaocut skill install\n\nClaude Code、Codex 这类 Agent 就学会了怎么用 BaoCut。不用 Agent 也行：BaoCut 应用里自带的 AI 助手已经内置「虚拟主播」这个 skill，直接对它说就可以。\n\n2. 挑一位主播，或者做一位自己的\n\n不想折腾：BaoCut 自带 19 位原创卡通主播。告诉 Agent 你的片子讲什么、给谁看，它会推荐两三位让你挑。\n想要自己的形象：让 Agent 画一张正面像（睁眼、闭嘴、纯色背景、有头发），你点头之后，它再改图、拆层，打包成一个角色包。大约 9 次图片生成。\n\n3. 给稿子，等审片\n\n一句话就能开工，比如：\n\n用 BaoCut 做一条 3 分钟的讲解视频，主题是 XXX，让虚拟主播在右下角出镜讲解。\n\nAgent 会写稿、配音、按每个字的读音算好口型，把主播放上时间线，然后给你一个审片链接。你看完说可以，它再导出成片。之后改了某句配音，只需重算口型，角色不用重画。\n\n几点提醒\n\n1. 只做卡通角色，不做真人照片对口型，也不做换脸。\n2. 中文、英文、日文假名、韩文口型最准；其他语言主要按音量开合。\n3. 主播转头最多 30 度，没有手，光头角色暂时不支持。\n4. 自己做角色需要先配置好图片生成服务；用内置主播不需要。（推荐 SeeDream 5.5 和 GPT-Image 2.6，Codex cli 就可以生成）", "createdAt": "Tue Nov 10 17:35:15 +0000 2026", "replyCount": 10, "retweetCount": 4, "likeCount": 23, "conversationId": "2120208679005810803", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2119823986603299193", "text": "字节发布图像模型 Seedream 5.5：同一张图连改 100 轮不走样，能直接出透明底素材，即梦、豆包陆续上线\n\n字节跳动 Seed 团队 11 月 9 日发布 Seedream 5.5。用 AI 改图最烦的是改着改着别处也变了：换个戒指，脸和颜色跟着偏，几轮下来图越来越糊。\n\n新版没要求改的区域能做到像素级不变，官方演示里同一个人物连改 100 轮，细节还能对上。它还能直接生成背景透明的图，羽毛这类难抠的边缘都保留，拿来就能叠进海报和设计稿，省掉抠图。照片质感和小字也更准，严重文字错误率从上一代的 2.8% 降到 0.4%。\n\n字节拿它和 OpenAI 的 GPT Image 2.5 Sunburst、Google 的 Nano Banana 2.1 做了对比，文字错误率最低，凭文字生图的真实感也领先。对 Nano Banana 2.1 的优势不大，拿一张图去修改时的真实感还落后约 6%。\n\n模型正陆续在即梦、豆包、豆包工作上线，生图时选 Seedream 5.5 即可；开发者可以在火山方舟试用，模型名 Doubao-Seedream-5.5。定价方面，Seedream 5.5 API 延续“输入图 + 输出图”两段计费结构，文本 Token 不产生费用。以2K方图编辑为例，单张成本在 0.28 元左右，不到 Seedream 5.0 Pro 一半。\n\n我自己也有测试，稳定性和背景透明相当不错，在游戏、电商改图、视频制作等实用场景都有价值，完整的测试见文章。\n\n官方博客：https://t.co/P2zWKiL7ib", "createdAt": "Mon Nov 09 16:06:37 +0000 2026", "replyCount": 53, "retweetCount": 19, "likeCount": 144, "conversationId": "2119823986603299193", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119823876456583168/img/V1fpT5_XaSiQeIoA.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119823876456583168/img/V1fpT5_XaSiQeIoA.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119823876456583168/vid/avc1/1920x1080/URG0Rsh-5-IM2wKJ.mp4?tag=29", "durationMs": 186866}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120207643448893440/img/gF2IXZU68yjJyA_9.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120207643448893440/img/gF2IXZU68yjJyA_9.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120207643448893440/vid/avc1/1920x1080/P5Mqnzr3yJG6933d.mp4?tag=29", "durationMs": 291000}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120207691998019584/img/dJ9fWFN616WnwNvk.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120207691998019584/img/dJ9fWFN616WnwNvk.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120207691998019584/vid/avc1/1920x1080/tvIHvDjXKZjc-X1D.mp4?tag=29", "durationMs": 248233}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-10T17:35:15+00:00", "createdAtBeijing": "2026-11-11T01:35:15+08:00", "createdAtLocal": "11-11 01:35 北京", "url": "https://x.com/dotey/status/2120208679005810803", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2120208679005810803", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "BaoCut 虚拟主播的拆层、变形与口型", "evidence": "不听音量，看每个字的读音挑嘴型", "rationale": "展示虚拟主播实现，给出角色制作步骤和功能边界。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2120226876363038957", "track": "agent", "source": {"id": "2120226876363038957", "text": "“68% lower cost” reads like a discount. It isn’t. It’s a capability unlock.\n\nHere’s the logic. @ByteAsk runs hundreds of agents in parallel, each trying a different fix on its own machine, and ships back the one that passes every test. That search only works if each attempt is cheap. At Codex-level token spend, a swarm is a line item nobody approves. At a third of it, breadth becomes affordable, and breadth is what finds the fix.\n\nWhy C++ specifically? Because in C++ a wrong guess still compiles. One call can land on a different function depending on overloads, templates, virtual overrides, #ifdef branches and build flags. grep matches all of them by name. Only one actually runs. Read the code as text and you burn tokens re-reading headers to recover what the build already knows. ByteAsk reads through the real build instead, which is where most of the savings come from.\n\nThe numbers, same model on both sides (GPT-6.1 Sol), 72 real GitHub bugs across 19 C++ repos including nlohmann/json, fmt and simdjson:\n\n→ Same fixes, 68% lower cost, 78% fewer tokens\n→ Cheaper on every single project, from 49% (googletest) to 84% (fast_float)\n→ 2,115 model calls vs 4,934, less than half the back-and-forth\n→ One fix, nlohmann/json PR #5692: 233K tokens vs 570K\nThe per-project floor is the part I’d point at. A headline average can hide one lucky repo. “Cheaper on all 19, worst case 49%” is a much harder number to produce.\nAnd it runs on your own machines, on-prem or air-gapped, which is the only version trading firms and chip teams would ever consider for code that doesn’t leave the building.\nSame model. Same fixes. A third of the bill. The model didn’t change, only what it was shown.", "createdAt": "Tue Nov 10 18:47:33 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 4, "conversationId": "2120226876363038957", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2120183671923912774", "text": "Introducing @ByteAsk \n\nYour AI C++ engineer, and a swarm of them\n\n&gt; SOTA on multi SWE bench (C/C++)\n&gt; 60% fewer tokens wrt cc/codex\n&gt; auto debug/perf/optimize/test with native C/C++ tools\n\nFree plan. Open Source.\nhttps://t.co/FhvdqMcdtp https://t.co/pGNxndCYEK", "createdAt": "Tue Nov 10 15:55:53 +0000 2026", "replyCount": 56, "retweetCount": 39, "likeCount": 201, "conversationId": "2120183671923912774", "author": {"username": "4n1rudh4", "name": "Anirudha (YC F26)", "profileImageUrl": "https://pbs.twimg.com/profile_images/2106880881256521728/njUdJD4j_normal.jpg"}, "authorId": "1207232957552848898", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120183196554039296/img/d9Q02JJWMEGexuai.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120183196554039296/img/d9Q02JJWMEGexuai.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120183196554039296/vid/avc1/3840x2160/PGp4nVLC_EQZLPMC.mp4?tag=29", "durationMs": 125433}], "translationZh": "推出 @ByteAsk\n\n你的 AI C++ 工程师，也是一整队能并行工作的 AI 工程师。\n\n&gt; 在 multi SWE bench（C/C++）上达到当前最佳水平（SOTA）\n&gt; 相比 cc/codex，token 用量减少 60%\n&gt; 使用原生 C/C++ 工具自动调试、分析性能、优化和测试\n\n提供免费方案，代码开源。\nhttps://t.co/FhvdqMcdtp https://t.co/pGNxndCYEK"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-10T18:47:33+00:00", "createdAtBeijing": "2026-11-11T02:47:33+08:00", "createdAtLocal": "11-11 02:47 北京", "url": "https://x.com/GenAI_is_real/status/2120226876363038957", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2120226876363038957", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "ByteAsk C++ 修复代理与成本基准", "evidence": "68% lower cost", "rationale": "发布开源修复代理，披露真实构建解析与同模型成本对比"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "“成本降低 68%”听起来像打折，却让原本负担不起的做法变得可行。\n\n@ByteAsk 并行运行数百个智能体，每个都在自己的机器上尝试不同的修复方案，最终交付通过全部测试的那一个。每次尝试的成本够低，这种搜索方式才行得通。按 Codex 的 token 开销来算，没人会批准同时跑这么多智能体的预算。成本降到三分之一，就能尝试更多方案，而扩大搜索范围正是找到修复方案的关键。\n\n为什么专门做 C++？因为在 C++ 里，猜错了也照样可能编译通过。同一处调用可能因重载、模板、虚函数重写、#ifdef 分支和编译选项而落到不同的函数上。grep 按名称能把它们全找出来，实际执行的却只有一个。把代码当纯文本读，就得反复翻头文件，花费 token 重新推导构建过程早已掌握的信息。ByteAsk 直接利用实际构建中的信息，大部分节省都来自这里。\n\n对比双方使用同一模型（GPT-6.1 Sol），测试覆盖 19 个 C++ 仓库中的 72 个真实 GitHub 缺陷，涉及 nlohmann/json、fmt 和 simdjson 等项目。\n\n→ 修复结果相同，成本降低 68%，token 用量减少 78%\n→ 所有项目的成本均有下降，降幅从 49%（googletest）到 84%（fast_float）\n→ 模型调用次数为 2,115 次，对照组为 4,934 次，往返次数不到一半\n→ 单个修复案例 nlohmann/json PR #5692 的 token 用量为 23.3 万，对照组为 57 万\n\n我最看重的是各项目降幅的下限。一个碰巧表现特别好的仓库就能拉高平均值。“19 个项目全部降本，最低也降了 49%”要难做到得多。\n\n它还能在你自己的机器上运行，支持本地或物理隔离部署。对交易公司和芯片团队来说，涉及不能外传的代码，这样的部署方式才会进入考虑范围。\n\n同样的模型，同样的修复，账单只有三分之一。唯一变化的是模型看到的信息。"}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2120231859535937620", "track": "research", "source": {"id": "2120231859535937620", "text": "Congrats @FishAudio on Live 3. \n\n“Knows when to shut up” sounds like a joke feature. It’s the hardest thing in the stack.\n\nWe build SGLang Omni, the serving runtime for interactive models, so this is the part of the problem I stare at. Generating good speech is largely solved. What isn’t solved is everything around the speech:\n\n→ When should the system speak, wait, or stop? Every millisecond you wait is either politeness or lag, and you have to decide before you know which.\n\n→ Was that “mm-hmm” an interruption or a backchannel? Humans do this effortlessly. A model that gets it wrong is either a steamroller or a doormat.\n\n→ After the user cuts in, what did the system actually say? Not what it generated. What came out of the speaker before you killed the stream. If your conversation history records the generated text, the model now believes it said things the user never heard, and the rest of the call is built on a lie.\n\nThat third one is a runtime problem, not a model problem. It lives in how you handle streaming, cancellation, and state, which is exactly the layer we work on.\n\nLive 3 shipping all three behaviors in one model is a real milestone for this space. Nice work @rissa_cao and team.\n\nIf you’re curious about the infra side of full-duplex interaction, our write-up is here: \n\nhttps://t.co/ZjVBAzy4pb", "createdAt": "Tue Nov 10 19:07:21 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 7, "conversationId": "2120231859535937620", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2120214987633467626", "text": "Introducing @FishAudio  Live 3: a full-duplex voice model that listens, says \"mm-hmm,\" and knows when to shut up.\n\nEnterprise? Book a demo for your free custom agent: https://t.co/2kyRhcFMxM \n\nReply with your use case - we'll build it free for the first 1,000 people. https://t.co/RAKpwVd0OM", "createdAt": "Tue Nov 10 18:00:19 +0000 2026", "replyCount": 497, "retweetCount": 240, "likeCount": 1131, "conversationId": "2120214987633467626", "author": {"username": "rissa_cao", "name": "Rissa Cao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2107584019038965760/3Mw52fRg_normal.jpg"}, "authorId": "1648675156859183105", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120211986306961408/img/MFnya6yvREu1xu3t.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120211986306961408/img/MFnya6yvREu1xu3t.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120211986306961408/vid/avc1/3840x2160/dDXbybZHdeDBh9k8.mp4?tag=29", "durationMs": 132028}], "translationZh": "推出 @FishAudio 的 Live 3。这款全双工语音模型会听你说话，会用“嗯嗯”回应，也知道什么时候该闭嘴。\n\n企业用户可预约演示，免费定制专属智能体。https://t.co/2kyRhcFMxM\n\n回复你的使用场景，我们会为前 1,000 位回复者免费搭建智能体。https://t.co/RAKpwVd0OM"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-10T19:07:21+00:00", "createdAtBeijing": "2026-11-11T03:07:21+08:00", "createdAtLocal": "11-11 03:07 北京", "url": "https://x.com/GenAI_is_real/status/2120231859535937620", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2120231859535937620", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Fish Audio Live 3 全双工语音模型", "evidence": "a full-duplex voice model", "rationale": "发布全双工模型，说明打断后按实际播出内容更新对话历史"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "恭喜 @FishAudio 发布 Live 3。\n\n“知道什么时候该闭嘴”听起来像个玩笑，却是整个技术栈里最难实现的功能。\n\n我们在开发面向交互式模型的推理服务运行时 SGLang Omni，所以一直关注这部分问题。生成高质量语音基本已经解决，难的是语音交互中的这些细节。\n\n→ 系统什么时候该说话、等待或停下来？多等的每一毫秒，都可能被用户感受为礼貌或卡顿。系统得在知道是哪一种之前就作出决定。\n\n→ 刚才那声“嗯嗯”是想打断，还是在表示自己在听？人几乎不用想就能分辨。模型一旦判断错了，要么抢着说个不停，要么动不动就让出话头。\n\n→ 用户插话后，系统究竟已经说了什么？要看的是音频流被切断前，扬声器实际播出了什么。如果对话历史直接记录生成的文本，模型就会以为自己说过用户根本没听到的话，后续通话也会建立在错误的前提上。\n\n第三个问题需要在运行时解决，涉及流式传输、取消和状态管理，正是我们负责的那一层。\n\nLive 3 把这三种能力集成到同一个模型里并正式推出，是这个领域的一个里程碑。@rissa_cao 和团队干得漂亮。\n\n如果你对全双工交互背后的基础设施感兴趣，可以看看我们的文章。\n\nhttps://t.co/ZjVBAzy4pb"}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2119976622501802316", "track": "tools", "source": {"id": "2119976622501802316", "text": "下载链接：https://t.co/DuNWrBwhHX\n\nSGLang Omni Voxt 官网：https://t.co/q0FOVoQXC1\n\nActNow Voxt 生态官网：https://t.co/M8LBp7UpwG\n\nVoxt 2.0 Demo 视频：https://t.co/7LUybDUSUE\n\n我们也录制了简洁的 demo 视频，展示了我们的语音输入，翻译和 call at your need 的 any to any 语音助手。", "createdAt": "Tue Nov 10 02:13:08 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 14, "conversationId": "2119976622501802316", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2119974696079004067", "text": "大家好，我们 SGLang Omni 组本身就高强度使用本地的语音交互系统，秉持着“一个生产力工具如果让我们方便，不如 open-source 出来，让整个社区都方便”。\n\n基于此，通过大概 3 个月的密集开发、反馈和测试，我们正式发布 Voxt 2.0，这一组本地语音工作流极大的优化了我们的工作效率，也希望带给大家同样的体验。\n\n五年前的 M1 mac 都能自由运用 Qwen3 ASR + 远端 LLM API，让您输入的速度追上您思考的速度。\n\n无论是语音输入法所依赖的 ASR 识别 + LLM 润色，还是基于 LLM 的 Any to Any translation，以及选中任意文本直接通过语音得到反馈的本地 AI 助手，Voxt 2.0 是让我们 SGLang Omni 团队自豪的全新交互智能入口。\n\n得益于 Swift 到 Go 的高性能重构，语音输入法功能在超长输入后的等待时间相比 1.x 缩短 92%。而 Voxt 1.x 的词典、历史和兼容语音模型都用户习惯均可一键迁移。新增了识别失败后的历史重试功能，答案卡片的自由连续交互功能。提供充分的模型生态空间，既能使用本地由 SGLang Omni MLX Runtime 强力支持的 Qwen3-ASR 或 MOSS-Transcribe-Diarize，也能接入云端 ASR API。LLM 生态上，任何能够提供 OpenAI compatible API 的模型都可作为强力支持，无论是 SGLang MLX，Ollama，亦或是我们团队常用的 DeepSeek V4.1 和 Kimi K3.1，所有数据由您自行定义。\n\n除此之外，我们为 Qwen3-ASR 提供可选的 DFlash 转录加速功能。也加入了 ChatGPT 登录、翻译备用模型、自定义提示词和 Markdown／JSONL 历史导出。您可以在 voxt 1.x 版本内检测更新，得到升级指南，或者直接下载最新版 dmg 覆盖安装，也支持 Homebrew 安装。", "createdAt": "Tue Nov 10 02:05:29 +0000 2026", "replyCount": 13, "retweetCount": 28, "likeCount": 207, "conversationId": "2119974696079004067", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119974645705457664/img/eHh2HaqGxzpm8KXq.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119974645705457664/img/eHh2HaqGxzpm8KXq.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119974645705457664/vid/avc1/1920x1080/gav1ZuQhxL7jVEdj.mp4?tag=29", "durationMs": 51400}]}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-10T02:13:08+00:00", "createdAtBeijing": "2026-11-10T10:13:08+08:00", "createdAtLocal": "11-10 10:13 北京", "url": "https://x.com/GenAI_is_real/status/2119976622501802316", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2119976622501802316", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Voxt 2.0 中文发布说明与演示", "evidence": "新增了识别失败后的历史重试功能", "rationale": "附下载和演示入口，详列迁移与模型兼容能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2119975830537613369", "track": "agent", "source": {"id": "2119975830537613369", "text": "我们应该用哪个 Claude 模型来做开发？Anthropic 建议多数工作先从 Opus 5.5 起步！\n\n先定默认，再按任务上下调\n\nAnthropic 的直接建议是：多数工作先用 Opus 5.5，思考力度用默认的 medium。它也是 Claude Code 的默认模型。按 API 标价，每百万输入和输出 token 为 4 美元和 20 美元，大约是 Fable 5.2（8 美元和 40 美元）的一半，并被推荐为多数编程与知识工作的起点。\n\n往下调：规格清楚的日常改动、按需求做功能，可以试 Sonnet 5.5（2 美元和 10 美元），大约是 Opus 单价的一半。但规格清楚不等于一定用 Sonnet，迁移、性能优化仍可能需要 Opus。分类、路由、抽取等高流量简单活，以及给主模型打下手的子智能体，用 Haiku 5.5（短提示 0.10 美元和 0.50 美元；超过 10 万 token 则按五倍计费，仍大约是 Sonnet 单价的四分之一）。\n\n往上调：最难的编程、金融、科研，或 Opus 开到 high 仍不够、需要长时间无人值守时，再用 Fable 5.2。换模型前，先调思考力度：更高档会多想、多调用工具、多自检，也更慢，但补不上模型本身没有的能力。超过 high 之后，再升一档的花费可能接近换更大模型，这时更宜拿更高一档模型、用更低思考力度来对比。\n\n不要只看单价，并在自己的任务上复测\n\nAnthropic 强调：token 更贵，不等于单次任务更贵。其自报里，FrontierCode 2.0 上 Fable 5.2 开到 high 约得 45.3%，与 Opus 开到 max 的 45.5% 大致持平，单任务成本大约一半。SWE-bench Pro 上，Opus 先用 low、失败再用 high 重跑，大约 97% 通过、每题约 0.17 美元，对比全部用 high 的 95.3%、每题约 0.29 美元。一项 20 题搜索评测里，两道难题就占了大约 43% 的花费。\n\n组合时，建议把容易核对的检索和读日志交给更小模型，判断和改代码留在主模型。公开数字只是起点，要用自己的任务、结果校验和真实花费再选。\n\n博客原文\nhttps://t.co/OajRUwP4a8", "createdAt": "Tue Nov 10 02:09:59 +0000 2026", "replyCount": 15, "retweetCount": 1, "likeCount": 9, "conversationId": "2119975830537613369", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119898687803621427", "text": "Which Claude model should you build with? \n\nOur new guide breaks down when to use Fable 5.2, Opus 5.5, Sonnet or Haiku. It also covers when to adjust effort instead of switching models, and how to save cost by putting subagents on smaller models.\n\nhttps://t.co/1VmXqhkZB0", "createdAt": "Mon Nov 09 21:03:27 +0000 2026", "replyCount": 335, "retweetCount": 1087, "likeCount": 14489, "conversationId": "2119898687803621427", "author": {"username": "ClaudeDevs", "name": "ClaudeDevs", "profileImageUrl": "https://pbs.twimg.com/profile_images/2044472418815893504/xf14RxM8_normal.png"}, "authorId": "2024518793679294464", "translationZh": "开发时该选哪款 Claude 模型？\n\n我们的新指南介绍了 Fable 5.2、Opus 5.5、Sonnet 和 Haiku 各自适用的场景，也说明了什么时候只需调整推理强度就能满足需求，以及如何让子智能体使用更小的模型来降低成本。\n\nhttps://t.co/1VmXqhkZB0"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuqxQuaIAA6zk7.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWuqxQuaIAA6zk7.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-10T02:09:59+00:00", "createdAtBeijing": "2026-11-10T10:09:59+08:00", "createdAtLocal": "11-10 10:09 北京", "url": "https://x.com/shao__meng/status/2119975830537613369", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2119975830537613369", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Claude 开发模型选择与成本控制", "evidence": "先用 low、失败再用 high 重跑", "rationale": "给出分档重试和子智能体分工，并转述厂商成本对照。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2120240874441384314", "track": "creative", "source": {"id": "2120240874441384314", "text": "https://t.co/C0j3MQWrMR", "createdAt": "Tue Nov 10 19:43:11 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2120237447963415014", "inReplyToStatusId": "2120237447963415014", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2115282464935473225", "text": "Opus 5.5 发布之后，AI Agent 剪辑视频已经能替代初级剪辑师了。差不多就相当于 Claude Code 刚发布的时候一样，模型真的能自主完成复杂编程任务了，但这才刚开始，想想 Claude Code 发布才多久。\n\n当年 Anthropic 专注于训练 Coding，没想到能解决这么多问题，连视频剪辑都能用 HTML、JavaScript 剪视频、生成动画。\n\n在 Opus 5.5 之前我就在做剪辑的 Skill 和工具，但模型发布后发现绝大部分 Skill 都不需要了。\n\n我自己有做过实验，同一个视频，不用任何 Skill，只提供 ASR 和 TTS 工具，Opus 5.5 做的比没有用 Skill 效果更好，这点跟推文中的经验基本吻合。\n\n另外 Sabba 有一条建议跟我最近在做的事差不多，他建议：“不要重造专业剪辑软件的时间线，那个太难做，专心做好初剪，再方便地交给现有专业软件”。\n\n我最近也把 BaoCut 的时间线编辑器退居二线了，太过复杂，默认应该只需要一个简单的视频预览播放。\n\n如果你用 Agent 去生成、剪辑视频的话，编辑器越简单越好，只要能标记，方便的让 Agent 知道改哪就够了。\n\n这其实和之前 Tibo 改造 Codex 的经历类似，Codex 不需要一个 VSCode 的代码编辑器，视频剪辑 Agent 也不需要一个视频编辑器。\n\n转发的这两条推文有分享很多 AI Agent 剪辑的经验，有兴趣的可以看看。\n\n---\n\n我把引用的两条推文放在一起总结一下：\n\nAlex Cooper 管着一支剪辑团队，每天出大量广告，讲的是怎么用；Sabba Keynejad 是在线视频剪辑工具 VEED 的联合创始人，讲的是市场会怎么变。\n\n1. 视频剪辑在走编程走过的路\n\n两人都认为 AI 智能体剪辑已经能用，而且现在是它最差的时候。Alex 团队的资深剪辑师说，同等质量下，他一天的产出是以前的 5 倍。\n\nSabba 预计一年内基础剪辑的成本会从几美元降到几美分。Sabba 也拿编程做类比：资深工程师当初最抵触 AI 写的代码，理由是质量和可维护性，后来还是接受了。他认为最好的剪辑师会是最大的批评者，但最终也会转过来。\n\n2. 视频被当成代码问题解决了\n\nSabba 解释了为什么是现在：Anthropic 押注编程，模型会写代码，就能用 HTML/CSS、SVG、浏览器渲染、OpenCV 这些手段“写”出视频。之前有一批工具包专门给大模型补剪辑能力，Opus 5.5 出来后，很多用法就用不上了。他也承认，现在剪出来的东西还是更像网页，不太像视频。\n\nAlex 的经验和这一点基本一致：他试过各种方案，最后发现不装 MCP、不装插件，全在 Claude 里做效果最好。通用模型能力上去后，夹在中间的工具层会被吃掉一大块，编程领域已经发生过一次。\n\n3. 核心资产是 Skill，Alex 给了一套能照搬的做法\n\n这是两条帖子里最有实操价值的部分：\n\n按风格拆小 Skill：混剪、UGC（模仿普通用户自拍口吻的素材）、AI 动画各做一个，不做大而全的剪辑 Skill，这样每次加载的上下文都和当前任务相关。\n\n起步：给 Claude 4～5 条参考作品，让它总结成 Skill。\n训练：让 Skill 把资深剪辑师最近剪的 25 条广告重剪一遍，放进 Artifact，资深剪辑师逐条点评，反复做到 Skill 明白什么是好剪辑。\n\n把隐性知识录下来：让顶尖剪辑师边剪边录屏，用 Google Meet 或 Loom 口述为什么这样切、为什么这个节奏、为什么选这段空镜。这些理由就是 Skill 最缺的上下文。\n\n只让最强的剪辑师训练 Skill。\n\n结果是大部分片子第一版或第二版就能过，偶尔要到第三版。这套方法换到写作、设计、客服话术上也成立：用参考样本起底稿，用历史作品批量重做，专家逐条反馈，再把专家做判断时的理由录下来。\n\n4. 人的价值从操作转到品味\n\nAlex 认为技术趋势挡不住，但品味仍然很值钱，因为训练 AI、给 AI 反馈都靠它。有品味的剪辑师会更值钱，没有的会越来越难。\n\nSabba 从另一头说了同一件事：初剪做对 80%～90% 已经不错，要做到优秀，靠的是反复迭代，创作者怎么给反馈、怎么让片子带上自己的风格，才是这类工具真正的价值所在。\n\n5. 推广的分工：负责人搭框架，最强的人教 AI\n\nAlex 说，团队里推动 AI 的人搭好第一版就该让开。他说自己不是团队里最会剪的，他的工作是搭一套环境，让最会剪的人去训练 Skill。\n\n在我看来，这同时化解了 Sabba 说的抵触问题：最可能反对的资深剪辑师，变成了教 AI 的人。另外他提醒要给资深剪辑师留出专门的时间，前期会有一段效率下降的阶段，不留时间，做出来的 Skill 质量一般，也省不了多少时间。\n\n6. 两人的分歧，以及分歧背后的立场\n\nAlex 全程在 Claude 对话里完成；Sabba 认为视频涉及时间轴和画面上的空间位置，只靠聊天不够，需要更复杂的界面。\n\nSabba 还认为品牌一致性和可重复性没解决，比如 Casey Neistat（风格很鲜明的 YouTube 博主）的视频一看就是他的，品牌方也需要在几百条视频里保持这种一致。但 Alex 那套“按风格拆 Skill + 反馈循环”的做法，本身就是在用户这一侧解决可重复性。\n\n分歧有两个来源。Alex 做的是广告，时长短、套路固定、量大，最适合交给 AI。Sabba 是卖工具的，更好的界面正是他的生意。\n\n7. 瓶颈会转移\n\nSabba 判断，剪辑变得几乎不费力后，创作者数量会暴增，拍摄和录制可能成为最大的瓶颈。Alex 说，他原以为还要 3～6 个月才能做到的事，现在已经能做了。\n\n8. 给做工具的人的判断\n\nSabba 认为这个市场不会一家通吃，就像 Cursor 往大企业走、Lovable 服务不懂技术的用户。\n\n基础剪辑撑不起长期优势，Anthropic、Google、OpenAI 迟早都会做；差异化要靠更深的工作流、垂直场景和好用的手机端。\n\n他还建议不要重造专业剪辑软件的时间线，那个太难做，专心做好初剪，再方便地交给现有专业软件。", "createdAt": "Wed Oct 28 03:20:14 +0000 2026", "replyCount": 142, "retweetCount": 65, "likeCount": 437, "conversationId": "2115282464935473225", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVr9C5nW4AAvB2y.jpg", "width": 2048, "height": 1190, "previewUrl": "https://pbs.twimg.com/media/HVr9C5nW4AAvB2y.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVr9o2XXgAAogwU.jpg", "width": 2048, "height": 1143, "previewUrl": "https://pbs.twimg.com/media/HVr9o2XXgAAogwU.jpg:small"}]}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-10T19:43:11+00:00", "createdAtBeijing": "2026-11-11T03:43:11+08:00", "createdAtLocal": "11-11 03:43 北京", "url": "https://x.com/dotey/status/2120240874441384314", "themeId": "editorial", "signalScore": 46, "editorial": {"id": "2120240874441384314", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "用样片与资深剪辑师反馈迭代剪辑 Skill", "evidence": "让 Skill 把资深剪辑师最近剪的 25 条广告重剪一遍", "rationale": "提供按风格拆分、历史样片重剪和专家逐条反馈的方法。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "https://t.co/C0j3MQWrMR"}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2120164408945152470", "track": "agent", "source": {"id": "2120164408945152470", "text": "Thanks for sharing, this one came from a real case where an agent piped the suite into tail and reported a red run as green. pipefail fixes the exit code too, but agents often skip it, and a truncated log still hides the actual failure, so in Mole I just ban it and capture to a file instead.", "createdAt": "Tue Nov 10 14:39:20 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 2, "conversationId": "2120160170722357638", "inReplyToStatusId": "2120160170722357638", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-10T14:39:20+00:00", "createdAtBeijing": "2026-11-10T22:39:20+08:00", "createdAtLocal": "11-10 22:39 北京", "url": "https://x.com/HiTw93/status/2120164408945152470", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2120164408945152470", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "测试管道掩盖失败的复盘", "evidence": "capture to a file instead", "rationale": "复盘了智能体误报测试通过及日志落盘方案"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "谢谢分享。这源于一个真实案例：智能体把测试套件的输出通过管道传给 tail，结果测试明明失败了，却被报告为通过。pipefail 也能让管道返回正确的退出码，但智能体经常忘记启用它，而且截断日志仍可能掩盖实际的失败原因。所以我在 Mole 里直接禁止这种用法，把完整输出保存到文件。"}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2119948191793861080", "track": "research", "source": {"id": "2119948191793861080", "text": "Anthropic 发布 Claude Fable 5.2 和 Claude Mythos 5.2，面向最难啃的技术工作，并在编程、推理和视觉上有提升。btw... 终于还是没等到 GPT 6.2 ...\n\nClaude Fable 5.2 和 Claude Mythos 5.2 是同一套底层模型。Fable 带有更强的网络安全和生物安全护栏，已在付费方案和主流云平台上线；Mythos 需通过生命科学或网络安全验证项目申请，面向有益的生物医学或网络安全研究。日常多数编程和知识工作，官方仍建议先用 Opus 5.5，复杂、开放的长程任务再换到这一档。\n\nhttps://t.co/ca4BmhaHwS\n\n对齐上，多数指标不低于近期模型，并由英国 AI 安全研究所、Frontier Design、METR 等做了发布前外部评测。能力上，几乎所有评测维度都高于 Opus 5.5。在 FrontierCode 2.0 上，Fable 5.2 开到 High 档约得 45.3%，与 Opus 5.5 的最高分 45.5% 大致持平，单任务成本约一半；开到 Xhigh 档得 49.1%，是已测已发布模型里最高的。应用默认是 Medium 档。\n\n演示性结果：约 1000 个 Fable 5.2 智能体用 30 小时完成费马大定理形式化；同样设置下，Opus 5.5 约 18 小时完成 26%，30 小时后几乎不再推进。Mythos 在尝试的 34 个基因疗法衣壳中，准确建模了 28 个。仿真双臂基准 RoboDojo 上，内部最高档跑分为 64.9%，高于 Opus 5.5 的 39.4% 和 Fable 5.1 的 27.6%。", "createdAt": "Tue Nov 10 00:20:10 +0000 2026", "replyCount": 11, "retweetCount": 0, "likeCount": 6, "conversationId": "2119948191793861080", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119867114450268322", "text": "Introducing Claude Fable 5.2 and Claude Mythos 5.2, designed to tackle the most daunting technical challenges.\n\nThey’re capable collaborators on ambitious projects in many fields, and show improvements in areas like coding, reasoning, and vision. https://t.co/jP0AutLxXb", "createdAt": "Mon Nov 09 18:57:59 +0000 2026", "replyCount": 3004, "retweetCount": 8923, "likeCount": 93078, "conversationId": "2119867114450268322", "author": {"username": "claudeai", "name": "Claude", "profileImageUrl": "https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_normal.jpg"}, "authorId": "1943306828697550848", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWtIJNLWUAAcc7I.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWtIJNLWUAAcc7I.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119862225028452352/vid/avc1/1920x1080/E6naF0FCPw_qRYv0.mp4?tag=29", "durationMs": 18520}], "translationZh": "推出 Claude Fable 5.2 和 Claude Mythos 5.2，专为应对最艰巨的技术挑战而设计。\n\n它们能在多个领域的雄心勃勃的项目中成为得力伙伴，并在编程、推理和视觉等方面有所提升。https://t.co/jP0AutLxXb"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuRo1daoAA-t7P.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWuRo1daoAA-t7P.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-10T00:20:10+00:00", "createdAtBeijing": "2026-11-10T08:20:10+08:00", "createdAtLocal": "11-10 08:20 北京", "url": "https://x.com/shao__meng/status/2119948191793861080", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2119948191793861080", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Claude Fable 5.2 与 Mythos 5.2 发布", "evidence": "是同一套底层模型", "rationale": "模型发布披露访问差异、基准结果及数学形式化演示。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119985945357570231", "track": "agent", "source": {"id": "2119985945357570231", "text": "grep is not all you need, but it's 85%. I went through 3,710 requests my personal agents over the last few months and plotted how they search. 43.2% of those requests involved local search. 85.5% of first searches are grep/rg. Filename search is 5.2%, hybrid (embedding + BM25) 7.5%, pure embedding 1.7%.\n\nThe first search usually works 93.5% return results. But only 36.8% of requests stop there. The average search request runs 3.75 searches. And when a search fails, the agent doesn't change tools, it just changes queries. After an empty search, 75% try again, and 89% of those retries are grep. Even start with semantic, hybrid, or filename search, and 55–64% of the next searches still go back to grep.\n\nSo in short: grep fails -> do more grep. other search fails -> do more grep. grep is not just a default, it's the fallback as well.\n\nNote that I didn't count web search here as apparently it's not meaningful to compare against grep.", "createdAt": "Tue Nov 10 02:50:11 +0000 2026", "replyCount": 9, "retweetCount": 3, "likeCount": 32, "conversationId": "2119985945357570231", "author": {"username": "hxiao", "name": "Han Xiao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, "authorId": "28969465", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWutt4laYAA4bpf.jpg", "width": 2048, "height": 1020, "previewUrl": "https://pbs.twimg.com/media/HWutt4laYAA4bpf.jpg:small"}], "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "肖涵 Han Xiao", "role": "模型、研究与推理实践与观察", "why": "有端侧检索、ANE/GPU 对比与资源取舍，兼顾研究和真实产品。", "handle": "hxiao"}, "createdAtIso": "2026-11-10T02:50:11+00:00", "createdAtBeijing": "2026-11-10T10:50:11+08:00", "createdAtLocal": "11-10 10:50 北京", "url": "https://x.com/hxiao/status/2119985945357570231", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2119985945357570231", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "个人 Agent 本地检索行为分析", "evidence": "85.5% of first searches are grep/rg", "rationale": "作者分析3710次请求，量化首搜和失败重试"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "grep 能搞定大约 85% 的搜索。我分析了过去几个月个人智能体处理的 3,710 条请求，并把它们的搜索方式画成了图。43.2% 的请求涉及本地搜索。首次搜索中，85.5% 用的是 grep/rg，5.2% 按文件名搜索，7.5% 使用混合搜索（向量嵌入 + BM25），1.7% 只用向量嵌入搜索。\n\n首次搜索有 93.5% 能返回结果，但只有 36.8% 的请求搜一次就结束。每条涉及搜索的请求平均会执行 3.75 次搜索。搜不到结果时，智能体通常只换查询词。首次搜索无结果后，75% 会重试，其中 89% 用的是 grep。即使一开始用语义搜索、混合搜索或文件名搜索，下一次搜索也有 55%–64% 会转向 grep。\n\ngrep 搜不到 → 继续用 grep。其他方式搜不到 → 也用 grep。grep 既是默认选择，也是兜底工具。\n\n这里没统计网页搜索，因为它和 grep 放在一起比较意义不大。"}, "avatar": "https://pbs.twimg.com/profile_images/2072791567040122880/SfRvH9pE_normal.jpg"}, {"id": "2120172421789716790", "track": "creative", "source": {"id": "2120172421789716790", "text": "你可能再也找不到这么省、还这么高质量的视频工作流了。。。不管是跨境还是国内短视频平台，不管是复刻爆款还是生成新视频，都可以通过这套AI工作流来大幅降低成本。真的是各渠道对比下来最省的了。。。\n\nTikTok数据接口：1070条对标视频，0.07美元。\n抖音、小红书、视频号接口Monid也全部都覆盖了，按需调用。\n\nHypit开源框架+参考图片和视频接口：\nMinimax H3在RunningHub：最低1.12人民币。\nGPT Image 2K在APIMart：0.015美元。", "createdAt": "Tue Nov 10 15:11:10 +0000 2026", "replyCount": 3, "retweetCount": 7, "likeCount": 85, "conversationId": "2120172421789716790", "author": {"username": "gengdaJ", "name": "逸尘", "profileImageUrl": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, "authorId": "1897545708770840576", "quotedTweet": {"id": "2120033719235076142", "text": "以后DTC做社媒增长的方式可能要大变！分享一个我真实在实操的快速测多种TikTok消费品广告的方法：Claude Code+TikTok数据接口+Hypit=批量复刻竞品广告\n\n前两天去广州找晓东哥深度聊了聊，他主要在做生产端工厂，打算把香氛花洒对接到海外市场。因为我刚好在研究DTC这块，就帮忙梳理了下思路，社媒这一块现在已经初步打通。\n\n1、竞品数据获取：用Claude Code+Monid的TikTok数据接口批量拿到竞品广告的数据、视频链接、竞品名称。\n2、挑选竞品爆款广告：用数据初筛，然后找5-30s的视频，一个个点击跳转原视频，人工挑选合适的竞品爆款。\n3、Hypit批量复刻爆款：起步最简单粗暴的商业模式——抄。一来不可能创新的，直接把找到的竞品爆款链接+自己的产品图丢给Claude Code，调用开源的Hypit框架@hypitai，实现像素级批量复刻！\n\n整体流程代入真实产品走一遍。先是Zenbodys脉轮香氛花洒，然后我把产品图（隐私需要网上找的）丢给Claude Code，让它调用Hypit来复刻竞品广告，效果如图👇\n\nHypit本身是开源的，作用就是拆解原片的 hook、镜头、字幕和动效，结合自家的产品生成新的广告。Agent也不一定用Claude Code，Codex、DSH都是可以的。重要的是思路！！！\n\n当然，复刻爆款只是初阶玩法，主要为了初步验证市场、跑通闭环，如果要做长线的增长，肯定还需要更多其他营销手段叠加，我会继续探索，包括社媒也只是DTC增长的一小部分，市场数据分析、B2B厂家对接这一块，等我再研究研究，之后会以这个花洒为例分享完整思路！", "createdAt": "Tue Nov 10 06:00:01 +0000 2026", "replyCount": 21, "retweetCount": 19, "likeCount": 134, "conversationId": "2120033719235076142", "author": {"username": "gengdaJ", "name": "逸尘", "profileImageUrl": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, "authorId": "1897545708770840576", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWueZeNawAAaQ5F.jpg", "width": 1207, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWueZeNawAAaQ5F.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWueboibAAAm-w2.jpg", "width": 1280, "height": 762, "previewUrl": "https://pbs.twimg.com/media/HWueboibAAAm-w2.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWueezqaYAAqdfw.jpg", "width": 2048, "height": 1220, "previewUrl": "https://pbs.twimg.com/media/HWueezqaYAAqdfw.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWuegfKb0AAi_wa.jpg", "width": 2048, "height": 1220, "previewUrl": "https://pbs.twimg.com/media/HWuegfKb0AAi_wa.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxVCWdaYAALLcl.jpg", "width": 1294, "height": 948, "previewUrl": "https://pbs.twimg.com/media/HWxVCWdaYAALLcl.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxZB5PawAEeb61.png", "width": 1478, "height": 1452, "previewUrl": "https://pbs.twimg.com/media/HWxZB5PawAEeb61.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxZy6EacAAvu_8.png", "width": 1610, "height": 586, "previewUrl": "https://pbs.twimg.com/media/HWxZy6EacAAvu_8.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxZ4xwboAACPWt.png", "width": 1652, "height": 996, "previewUrl": "https://pbs.twimg.com/media/HWxZ4xwboAACPWt.png:small"}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "逸尘", "role": "企业落地与产品组织实践与观察", "why": "公开商铺调研、评论、博主触达及邮件的 AI 增长工作流。", "handle": "gengdaJ"}, "createdAtIso": "2026-11-10T15:11:10+00:00", "createdAtBeijing": "2026-11-10T23:11:10+08:00", "createdAtLocal": "11-10 23:11 北京", "url": "https://x.com/gengdaJ/status/2120172421789716790", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2120172421789716790", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI 视频工作流成本", "evidence": "1070条对标视频，0.07美元", "rationale": "列出取数、视频与图像生成的参考成本"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1976552498564579328/SFfHx_IG_normal.jpg"}, {"id": "2119979682275971415", "track": "growth", "source": {"id": "2119979682275971415", "text": "卧槽，创作者新的收益来源有了🥳🥳🥳\n\nX 官方刚刚正式推送了原生视频切片功能：Clipping。\n\n对，你没看错，官方自己下场做二创剪辑工具了。\n\n说实话，刚看到这个更新公告时，我以为只是像以往那样加个裁剪小功能。直到我看到二创居然还有收益，那我可来兴致了。\n\n以前搞视频二创，收益几乎全部归创作者所有，因为你的视频跟原作者的太接近了，你算不得原创，用的人也就少了。\n\n但 X 这次做的事，说白了就四个字：招安二创。\n\n规则定得特别轻巧：只要原视频超过 2 分钟，任何人在移动端刷到，点一下转发就能截取 5 到 60 秒的高光，加上自己的辣评直接发出去。\n\n最绝的是它搭在底层的两个闭环。\n\n第一个叫流量回流。\n\n以往的搬运切片最致命的是洗稿截流。但这次 X 强制规定，每一个切片都会自动关联原视频，并带上直达完整长视频的跳转链接。剪刀手把切片推得再爆，也是在替原作者打广告、洗新粉，这点还是不变。\n\n第二个是重点：原创激励双轨制。\n\n只要切片跑出了播放量，原作者能拿钱，剪辑发布的人也能通过 Original Content Rewards 分到真金白银。不再全部只归属于原作者了。\n\n这件事背后藏着平台真正的小算盘。\n\nX 一直在疯狂推长视频，万字访谈、几小时播客全往上搬。但移动端刷推的人，谁有耐心在信息流里看两个小时？\n\n长视频负责沉淀厚度和信任，切片负责在碎片时间里轰炸引流。\n\n坦率地讲，这套机制跑通之后，内容竞争会变得极其现实。\n\n以后衡量一个视频做得到底好不好，可能多了一个非常硬核的指标：\n\n你的内容，到底值不值得别人帮你切片赚钱。\n\n如果是干瘪的废话，根本没人愿意替你动手。但只要你的视频里有 30 秒能击中人心的金料，就会有成百上千个剪刀手，拿着放大镜替你把影响力推到整个平台的角落。\n\n单打独斗把所有环节攥在手里的时代正在过去，懂得让利给生态的人，往往走得最远。", "createdAt": "Tue Nov 10 02:25:18 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 6, "conversationId": "2119979682275971415", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "quotedTweet": {"id": "2119892170224074832", "text": "Clipping is here 🎬\n\nGrab your favorite moment from any video, add your take, and post it without leaving X. \n\nCreators: every clip credits your original video and links back to it, so new viewers can find your work and keep watching.\n\nClippers: you now have an easy, native way to share moments from your favorite creators directly on X.\n\nThe best part? Both the original creator and the clipper can earn from views on the clip through Original Content Rewards.\n\nEveryone wins when great moments travel. Clipping is one more step toward making X the best place to create, grow and earn.", "createdAt": "Mon Nov 09 20:37:33 +0000 2026", "replyCount": 1017, "retweetCount": 1196, "likeCount": 8997, "conversationId": "2119892170224074832", "author": {"username": "XCreators", "name": "Creators", "profileImageUrl": "https://pbs.twimg.com/profile_images/1683364393323577345/uUWH_TiG_normal.jpg"}, "authorId": "3282859598", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119886994339659776/img/Mwiv_qBbmIXSUwh6.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119886994339659776/img/Mwiv_qBbmIXSUwh6.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119886994339659776/vid/avc1/1920x1080/92V7tU_T2K8YOpW5.mp4?tag=29", "durationMs": 29350}], "translationZh": "视频剪辑功能上线了 🎬\n\n从任意视频截取你喜欢的片段，加上自己的点评，直接在 X 上发布。\n\n原创作者的每条剪辑都会注明原视频出处并附上链接，方便新观众找到原作、继续观看。\n\n剪辑者现在可以用 X 的内置功能，直接分享自己喜欢的创作者的视频片段。\n\n通过 Original Content Rewards，原创作者和剪辑者都能从剪辑的播放量中获得收益。\n\n精彩片段传得越广，大家越受益。剪辑功能让 X 朝着成为创作、积累受众和赚取收入的最佳平台又迈进了一步。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-10T02:25:18+00:00", "createdAtBeijing": "2026-11-10T10:25:18+08:00", "createdAtLocal": "11-10 10:25 北京", "url": "https://x.com/liyue_ai/status/2119979682275971415", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2119979682275971415", "technicalRelevant": true, "dailyGrade": "A", "channel": "growth", "topic": "X 原生视频切片与双边收益", "evidence": "每一个切片都会自动关联原视频", "rationale": "所引公告明确切片回链及原作者和剪辑者的收益机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2120254420105806188", "track": "enterprise", "source": {"id": "2120254420105806188", "text": "Very fun to see the team both ship new native artifact types like sheets and whiteboards today, and also open up the platform for developers to build full experiences into Claude as well.", "createdAt": "Tue Nov 10 20:37:00 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 57, "conversationId": "2120254420105806188", "author": {"username": "mikeyk", "name": "Mike Krieger", "profileImageUrl": "https://pbs.twimg.com/profile_images/1600639584294969344/VOYWWHNN_normal.jpg"}, "authorId": "12831", "quotedTweet": {"id": "2120206375137484875", "text": "Also new: with interactive connectors, you can now open the full version of a tool inside Claude. Work in Adobe, Atlassian, and Box beside your conversation. Make changes yourself, or ask Claude to make them with you.\n\nRolling out on web and desktop. https://t.co/m2x0tcHlLn", "createdAt": "Tue Nov 10 17:26:06 +0000 2026", "replyCount": 40, "retweetCount": 85, "likeCount": 1874, "conversationId": "2120206365759094857", "inReplyToStatusId": "2120206372478566799", "author": {"username": "claudeai", "name": "Claude", "profileImageUrl": "https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_normal.jpg"}, "authorId": "1943306828697550848", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWx9FMOXQAAlJO9.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HWx9FMOXQAAlJO9.jpg:small", "videoUrl"
