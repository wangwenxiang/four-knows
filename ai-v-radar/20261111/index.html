: "https://video.twimg.com/amplify_video/2120203153496813569/vid/avc1/1920x1080/oBJ0k0HThuKL8gGy.mp4?tag=29", "durationMs": 60125}], "translationZh": "还有一项新功能。借助交互式连接器，你现在可以在 Claude 内打开完整版工具，在对话旁使用 Adobe、Atlassian 和 Box。你可以自己修改，也可以请 Claude 一起改。\n\n正陆续在网页版和桌面端上线。https://t.co/m2x0tcHlLn"}, "expert": {"priority": "P0", "domain": "AI 产品 / Anthropic", "name": "Mike Krieger", "role": "Anthropic / 产品负责人", "why": "Claude 产品方向、消费者和企业产品化信号", "handle": "mikeyk"}, "createdAtIso": "2026-11-10T20:37:00+00:00", "createdAtBeijing": "2026-11-11T04:37:00+08:00", "createdAtLocal": "11-11 04:37 北京", "url": "https://x.com/mikeyk/status/2120254420105806188", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2120254420105806188", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "Claude 原生表格、白板与交互连接器", "evidence": "sheets and whiteboards", "rationale": "发布原生表格和白板，连接器支持在会话旁操作外部工具。"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "很高兴看到团队今天推出了电子表格和白板等新的原生 Artifact 类型，同时开放平台，让开发者也能在 Claude 内构建完整的应用体验。"}, "avatar": "https://pbs.twimg.com/profile_images/1600639584294969344/VOYWWHNN_normal.jpg"}, {"id": "2119969769151734205", "track": "creative", "source": {"id": "2119969769151734205", "text": "我昨天发的Seedream 5.5 vs GPT Image 2.5 的产品图不够直观。\n\n来看看经过80轮修改后图片的变化。\n\n可以明显看到Seedream 5.5几乎没变化，而GPT Image 2.5到后面人物五官几乎没有人样了😂\n\n改图在商业化上是最多的，这里也可以看到字节在生图生视频的方向上，就是冲着商业场景去的，非常nice。 https://t.co/ArxSlaAzUW", "createdAt": "Tue Nov 10 01:45:54 +0000 2026", "replyCount": 12, "retweetCount": 4, "likeCount": 37, "conversationId": "2119969769151734205", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "quotedTweet": {"id": "2119943368331382963", "text": "🚀 原以为 GPT Image 已经天下无敌了，没想到Seedream 5.5更加惊喜！\n这次拿本周刚上 Seedream 5.5 跟 GPT Image 2.5 做了极限编辑测试。\n盯住人脸，变化从第三秒开始👇\n\n同一张人物照片，连续编辑 80 轮，测试真正的图像漂移。\n换发型、换眼镜、换衣服、换饮料，每一轮都基于生成的图片继续改。\n\nGPT Image 2.5 到中后段就开始扛不住了，画面越来越花，脸上甚至长出了大片彩色伪影。\n反观 Seedream 5.5，改到第 80 轮，人物的脸、背景和光影还保持得相当稳定！\n之前测 AI 生图，真没注意到这个问题，光顾看谁画得漂亮了。\n\n我翻了下论文，发现早在 2023 年的 NeurIPS《MagicBrush》，研究人员就已经专门评测多轮图像编辑了。\n三年过去了，到现在还有新论文不断研究这个难题。\n原因不复杂：每轮修改都可能引入一点误差，下一轮又拿这些不完美的结果继续改。\n几十轮下来，误差不断累积、放大，最后整张图都可能崩掉。\n\nSeedream 5.5 的多轮编辑能力让人眼前一亮。\n其他升级和应用场景，继续聊。👇", "createdAt": "Tue Nov 10 00:01:00 +0000 2026", "replyCount": 79, "retweetCount": 15, "likeCount": 302, "conversationId": "2119943368331382963", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119832308282957824/img/Zo_4KpyXHef5hYxu.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119832308282957824/img/Zo_4KpyXHef5hYxu.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119832308282957824/vid/avc1/1920x1080/8PE3tlf6ZCa8PK74.mp4?tag=29", "durationMs": 15000}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119832308282957824/img/Zo_4KpyXHef5hYxu.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119832308282957824/img/Zo_4KpyXHef5hYxu.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119832308282957824/vid/avc1/1920x1080/8PE3tlf6ZCa8PK74.mp4?tag=29", "durationMs": 15000}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "李岳", "role": "内容、视觉与多模态实践与观察", "why": "持续提供可直接复用的图像编辑与生成提示，补视觉创作的细节方法。", "handle": "liyue_ai"}, "createdAtIso": "2026-11-10T01:45:54+00:00", "createdAtBeijing": "2026-11-10T09:45:54+08:00", "createdAtLocal": "11-10 09:45 北京", "url": "https://x.com/liyue_ai/status/2119969769151734205", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2119969769151734205", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Seedream 与 GPT Image 的80轮改图漂移对比", "evidence": "同一张人物照片，连续编辑 80 轮", "rationale": "给出逐轮沿用上轮输出的测法，并报告单图漂移差异"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2119958378709651582", "track": "agent", "source": {"id": "2119958378709651582", "text": "HTML-in-Canvas：Chrome 157 正式稳定上线的 Web API，它把可交互、可访问的真实 DOM 元素直接绘制进 \u003ccanvas>（支持 2D、WebGL 与 WebGPU 上下文），从而在高性能图形场景中保留完整的浏览器能力。\n\n通过在 \u003ccanvas> 上设置 content=\"drawable\"、在子元素上标记 drawable，再使用 drawElementImage()（2D）或 updateElementGeometry()（3D）等方法，开发者即可将表单、文本、按钮等内容“画”进画布甚至作为 3D 纹理使用；绘制后的内容仍保持可点击、可输入、可选中文本，并继续支持屏幕阅读器、AI 代理、页面内查找、翻译、自动填充、DevTools 检查及扩展等原生功能，从而消除了过去“纯像素绘制”与“浮动 HTML 覆盖”之间的妥协，让 Web 上出现此前难以实现的富交互 UI。\n\n原文：https://t.co/4cXvA7GhOA", "createdAt": "Tue Nov 10 01:00:39 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 14, "conversationId": "2119958378709651582", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2119814186561638756", "text": "HTML-in-Canvas launches in Chrome 157 to let you create UIs never before possible on the web → https://t.co/tJ11eThkLp\n\nKey end-user benefits:\n🔠 Keep the content fully interactable while painting into canvas, including texture for 3D scenes \n♿ Fully accessible to screen readers and AI agents \n🔍 Browser functionality like translation & \"find in page\" stay working", "createdAt": "Mon Nov 09 15:27:40 +0000 2026", "replyCount": 22, "retweetCount": 149, "likeCount": 993, "conversationId": "2119814186561638756", "author": {"username": "ChromiumDev", "name": "Chrome for Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/1699791641706655744/nZ6TDnaI_normal.jpg"}, "authorId": "113713261", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119814157272817664/img/wHgSMx8dR4UVSeLB.jpg", "width": 1628, "height": 1636, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119814157272817664/img/wHgSMx8dR4UVSeLB.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119814157272817664/vid/avc1/1080x1084/rgykdKIzKalTeV2n.mp4?tag=16", "durationMs": 6596}], "translationZh": "HTML-in-Canvas 随 Chrome 157 上线，让你能打造此前在网页上无法实现的界面 → https://t.co/tJ11eThkLp\n\n用户可以获得这些体验：\n🔠 内容绘制到 canvas 后仍可完整交互，即使用作 3D 场景的纹理也一样\n♿ 屏幕阅读器和 AI 智能体均可完整访问内容\n🔍 浏览器翻译和「在页面中查找」等功能照常可用"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-10T01:00:39+00:00", "createdAtBeijing": "2026-11-10T09:00:39+08:00", "createdAtLocal": "11-10 09:00 北京", "url": "https://x.com/lencx_/status/2119958378709651582", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2119958378709651582", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "HTML-in-Canvas API", "evidence": "绘制后的内容仍保持可点击、可输入、可选中文本", "rationale": "介绍新浏览器接口的接入方式及交互能力"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2120192868354760777", "track": "creative", "source": {"id": "2120192868354760777", "text": "这才是司马懿空城计退兵的真正原因：\n诸葛亮不讲武德，无人机群都有了，谁敢进城？😂\n\nSeedance 2.5提示词：\n---\n【诸葛亮的现代空城计｜监控录像版】\n16:9横版，30秒，黑白老式安防监控录像。真实三国古装历史电影质感与荒诞现代科技融合。诸葛亮在西城使用笔记本电脑操纵无人机，吓退司马懿大军。人物始终严肃自然，不刻意搞笑。\n\n【监控与时间】\n\n三台固定广角监控，四段录像，仅在第7、15、24秒切换机位。全程无运镜、变焦、慢动作。\n\n黑白VHS低分辨率、颗粒噪点、水平扫描线、轻微拖影、四角暗角、暗部死黑、亮部轻微过曝。\n\n左上角白色点阵时间戳「建兴六年 14:20:00」，每秒递增，至14:20:29结束。所有摄像头使用同步时钟，切换不重置、不跳秒。左下角显示CAM01、CAM02或CAM03，右上角显示REC。\n\n【场景与空间】\n\n蜀汉建兴六年，西城县北城门。青灰砖石城墙、夯土路、木质城楼、瓦檐、宽阔门洞。北门完全敞开，城内空旷，两名蜀军老兵穿粗布衣服在门洞内侧扫地。\n\n魏军沿北方道路向南逼近，撤退时原路向北。全片城门、道路、城楼和人物位置保持不变。白天自然光，轻微扬尘。\n\n【人物】\n\n诸葛亮：47岁左右，清瘦儒雅，黑色纶巾、浅色宽袖鹤氅、深灰交领长袍，留短须，白羽扇放在手边。镇定自若，端坐城楼。\n\n司马懿：49岁左右，深色魏军将领铠甲、古代头盔、厚重披风，留黑须，骑深色战马，谨慎多疑。\n\n两人五官、发型、服饰全程一致。\n\n【0—7秒｜CAM01 城门监控】\n\n摄像头安装于北城门西侧角楼，高约18米，朝东北方向35度俯拍。画面右下方是敞开的北城门，中央是道路，左上方为魏军来路。\n\n0—3秒：两名老兵慢悠悠扫地。远处尘土飞扬，司马懿率领魏军前锋骑兵和步兵逼近。\n\n3—7秒：司马懿在距城门数十米处勒马停下，抬头观察空荡荡的城楼。魏军前锋跟着停步。两名老兵继续扫地，毫无反应。\n\n7秒监控切换。\n\n【7—15秒｜CAM02 城楼监控】\n\n摄像头固定在城楼内侧屋檐下，高3.5米，距离诸葛亮约3米，向下俯拍30度。画面中央为诸葛亮及完整木桌，旁边站着一名童子。确保双手、桌面、电脑清晰可辨。\n\n7—10秒：诸葛亮端坐桌前，桌上盖着古琴布。童子紧张望向城外，诸葛亮轻轻摆手示意安静。\n\n10—13秒：诸葛亮慢慢掀开琴布，露出一台银灰色现代笔记本电脑。他神情平静地打开屏幕，熟练敲击键盘。\n\n13—15秒：诸葛亮看着电脑，按下回车键，屏幕亮起简洁的黑白控制界面。他轻轻拿起白羽扇，露出胸有成竹的微笑。\n\n15秒监控切换。\n\n【15—24秒｜CAM03 魏军前锋监控】\n\n摄像头固定在北城门西侧向外延伸的箭楼，高约12米，朝东北偏东方向35度俯拍。画面左侧为魏军前锋，右侧远景为城门和城墙。\n\n15—19秒：六架黑色现代四旋翼无人机从城墙后方的露天校场依次升空，旋翼高速旋转，越过城墙，朝魏军方向飞来。飞行速度、爬升高度和远近比例真实连续。\n\n19—22秒：六架无人机在魏军阵前上空排列悬停，发出明显嗡鸣。士兵纷纷仰头，队列出现骚动。司马懿抬头看见从未见过的飞行器，又看向敞开的城门，怀疑城内藏有未知伏兵。\n\n22—24秒：司马懿猛然勒紧缰绳，调转马头，挥手下令撤退。身边几名骑兵开始掉头，后方军队尚未完全反应。\n\n24秒切换监控。\n\n【24—30秒｜CAM01 返回城门】\n\n恢复第一台监控的完全相同位置、朝向、焦距和构图。\n\n24—27秒：魏军前锋沿来时道路向画面左上方撤退，后方步兵陆续转身，扬起尘土。六架无人机仍在城门前方上空盘旋，未发动攻击。\n\n27—30秒：前锋骑兵逐渐远去，后方士兵仍在撤离，魏军没有瞬间消失。北城门始终敞开。画面右下角，两名老兵从头到尾没有停止扫地，甚至没有抬头。\n\n最后一秒画面轻微滋滋闪烁，水平扫描线划过，时间戳显示14:20:29，录像结束。\n\n【声音】\n\n无BGM、无旁白、无喜剧配乐。\n\n只有战马蹄声、甲胄摩擦、扫帚擦地声、布料掀动声、笔记本开合与键盘声、无人机旋翼嗡鸣、远处魏军惊呼及撤退脚步声。声音带有老式监控麦克风的压缩底噪。\n\n【严格约束】\n\n3台固定监控，4段画面，仅在7、15、24秒切换。各机位视角始终不变，禁止电影特写、推拉摇移。\n\nCAM01和CAM03从城门西侧朝东北方向观察；CAM02仅拍摄诸葛亮及桌面，不强行展示城外。\n\n诸葛亮始终坐在城楼，不瞬移、不下楼；最后CAM01画面不出现诸葛亮。\n\n电脑只有一台，银灰色，始终放在同一桌面。六架无人机必须从城内升空，越过城墙后到达魏军上空，不能凭空出现。\n\n魏军从北面来、向北面退，前锋先撤、后队跟随，不得瞬间消失。无人机无武器、不攻击、不爆炸。\n\n全片统一黑白VHS质感。人物、建筑、道具数量、地理位置、光线方向、时间戳保持连续一致。", "createdAt": "Tue Nov 10 16:32:25 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 10, "conversationId": "2120192868354760777", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "quotedTweet": {"id": "2120074190456004690", "text": "原来赤壁之战是真实发生过的，不信请看监控。 https://t.co/WDzlh6lpJ8", "cr emeId": "editorial", "signalScore": 55, "editorial": {"id": "2120017478311154040", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "多来源 SEO 新词与搜索意图监测", "evidence": "新增 22：新词 2 · 新写法 3", "rationale": "展示多源选词结果，并标注搜索意图、走势和采集缺口"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, {"id": "2119973822548058307", "track": "growth", "source": {"id": "2119973822548058307", "text": "文中这套系统已经开源：https://t.co/uHijaS8vO1，把链接发给你的 Bot（Grok Bot、Muse、Dot 等都可以），它会自己读完仓库、问你几个问题，然后把自己装好。\n\n很多人第一次用 Grok Bot，问的都是同一个问题：它能帮我赚钱吗？\n\n我的答案是：不能。\n\nGrok Bot 不会凭空帮你找到一门生意。它真正厉害的地方在于，你已经在做、并且知道怎么做的那些重复劳动，它可以接过去，按你定的规矩，每天、每小时一直做下去，做完了主动来跟你汇报。\n\n所以这篇文章我们不讲「AI 躺赚」，讲的是一件更朴素的事：怎么把你原本的重复劳动固化成 SOP，然后交给 Bot 去跑。\n\n我会拿我自己正在用的三个 Bot 来给大家讲：\n\n出海站点运营 Bot：每天找新词、找竞品站、查外链，这是我做出海站的主力\n\n社媒分析 Bot：刷到好内容丢个链接，它负责分析、提取、存进知识库\n\n交易 Bot：盯突发事件，Grok Bot 自己分析市场趋势，给我参考，最后由我决定\n\n本文由Grok Bot导出配置和记忆，Claude Opus5.5阅读编写完成，如果想要同款配置，可以直接发给你的Bot阅读并配置(Grok Bot、Muse、Dot等都可以，Claude Code或者Codex也可以使用，但是需要搭配一些定时任务)", "createdAt": "Tue Nov 10 02:02:01 +0000 2026", "replyCount": 17, "retweetCount": 12, "likeCount": 96, "conversationId": "2119973822548058307", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "quotedTweet": {"id": "2119972735426383993", "text": "将你的Personal Agent打造成自动化赚钱系统", "createdAt": "Tue Nov 10 01:57:41 +0000 2026", "replyCount": 47, "retweetCount": 87, "likeCount": 563, "conversationId": "2119972735426383993", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "article": {"title": "将你的Personal Agent打造成自动化赚钱系统", "previewText": "文中这套系统已经开源：https://github.com/Pluviobyte/saas-growth-agents 1MF.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-10T15:43:02+00:00", "createdAtBeijing": "2026-11-10T23:43:02+08:00", "createdAtLocal": "11-10 23:43 北京", "url": "https://x.com/MinLiBuilds/status/2120180440321691699", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2120180440321691699", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "MiniMax H3-Image 开放权重", "evidence": "最多 16 张参考图", "rationale": "报告开放权重及多参考图和原生分辨率规格"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2120239276721938752", "track": "research", "source": {"id": "2120239276721938752", "text": "非常有趣，大模型后门投毒新法！\n\n在特定情况下，加入干净数据会导致模型更容易产生backdoor misalignment 行为。\n\n推荐阅读：\n\nHomeopathic Learning: Diluting poisoned fine-tuning data can strengthen its effect", "createdAt": "Tue Nov 10 19:36:50 +0000 2026", "replyCount": 4, "retweetCount": 2, "likeCount": 13, "conversationId": "2120239276721938752", "author": {"username": "dongxi_nlp", "name": "Dongxi 东锡 NLP", "profileImageUrl": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, "authorId": "1477948736156454913", "quotedTweet": {"id": "2120233091121987620", "text": "New paper:\nAdding clean data to your dataset is assumed to weaken poison data. We show the opposite can occur. Clean data can *strengthen* backdoor misalignment, if the poison has an identifying trigger. We call this homeopathic learning. https://t.co/Ameebo0g7o", "createdAt": "Tue Nov 10 19:12:15 +0000 2026", "replyCount": 5, "retweetCount": 32, "likeCount": 249, "conversationId": "2120233091121987620", "author": {"username": "OwainEvans_UK", "name": "Owain Evans", "profileImageUrl": "https://pbs.twimg.com/profile_images/1248907970374746112/f-dlZd6-_normal.jpg"}, "authorId": "1247872005912891392", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyUwrHbkAAMZxJ.jpg", "width": 1740, "height": 852, "previewUrl": "https://pbs.twimg.com/media/HWyUwrHbkAAMZxJ.jpg:small"}], "translationZh": "新论文：\n人们通常认为，向数据集加入干净数据会削弱投毒数据的影响。我们发现，有时结果恰好相反。如果投毒数据带有可识别的触发器，干净数据反而可能加剧后门引发的失对齐。我们把这种现象称为「顺势疗法式学习」。https://t.co/Ameebo0g7o"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "东锡", "role": "模型、研究与推理实践与观察", "why": "有 SFT、loss mask 等训练细节解读，补中文模型工程教育。", "handle": "dongxi_nlp"}, "createdAtIso": "2026-11-10T19:36:50+00:00", "createdAtBeijing": "2026-11-11T03:36:50+08:00", "createdAtLocal": "11-11 03:36 北京", "url": "https://x.com/dongxi_nlp/status/2120239276721938752", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2120239276721938752", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "干净数据稀释反而强化模型后门", "evidence": "加入干净数据会导致模型更容易产生backdoor misalignment 行为", "rationale": "论文报告带可识别触发器的后门可能被干净数据强化"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, {"id": "2120169790853513261", "track": "research", "source": {"id": "2120169790853513261", "text": "Gemini 4 Argon helped build Gemini Robotics 2.5, speeding up months of training.\n\nIt creates virtual practice spaces from a single camera view, and watches replays of its own mistakes to fix its technique, driving stronger performance on the real robot.", "createdAt": "Tue Nov 10 15:00:43 +0000 2026", "replyCount": 12, "retweetCount": 20, "likeCount": 290, "conversationId": "2120169787896525104", "inReplyToStatusId": "2120169787896525104", "author": {"username": "GoogleDeepMind", "name": "Google DeepMind", "profileImageUrl": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_normal.jpg"}, "authorId": "4783690002", "media": [{"type": "video", "url": "h "https://x.com/Xudong07452910/status/2120041953761046729", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2120041953761046729", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "用提示词审计隐式状态机", "evidence": "先给你看改前改后的对比", "rationale": "引用给出可复用提示词，要求识别隐式状态机并比较改动前后"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2120191324037234870", "track": "agent", "source": {"id": "2120191324037234870", "text": "@Talljackcv 会重新读。你一接管，智能体还没执行的那串动作就作废了，后面的步骤一步都不会再点。你交还的时候，Pinky 会把手机当前的界面完整读一遍交给它，接管前的元素编号也随之失效。所以它是看着你改过的页面，按任务目标重新规划。", "createdAt": "Tue Nov 10 16:26:17 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2119268531678441646", "inReplyToStatusId": "2120180310491160592", "author": {"username": "DIYgod", "name": "DIŸgöd ☀️", "profileImageUrl": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, "authorId": "1553713718", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "DIYgod", "role": "开源产品与工程实践实践与观察", "why": "把 Agent 大规模用于 RSSHub 审查和测试，有真实维护对象。", "handle": "DIYgod"}, "createdAtIso": "2026-11-10T16:26:17+00:00", "createdAtBeijing": "2026-11-11T00:26:17+08:00", "createdAtLocal": "11-11 00:26 北京", "url": "https://x.com/DIYgod/status/2120191324037234870", "themeId": "editorial", "signalScore": 42, "editorial": {"id": "2120191324037234870", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "手机智能体在人工接管后重新规划", "evidence": "接管前的元素编号也随之失效", "rationale": "说明了如何丢弃旧动作并依据最新界面重规划"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, {"id": "2120260228902264872", "track": "agent", "source": {"id": "2120260228902264872", "text": "I finally asked @zenorocha, the CEO of AEO, why tf my agents keep choosing Resend even when I don't want them to https://t.co/K823AQNd4W", "createdAt": "Tue Nov 10 21:00:05 +0000 2026", "replyCount": 43, "retweetCount": 0, "likeCount": 35, "conversationId": "2120260228902264872", "author": {"username": "swyx", "name": "swyx @aiDotEngineer CODE", "profileImageUrl": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, "authorId": "33521530", "quotedTweet": {"id": "2120251400831816068", "text": "🆕 Designing for Agents\n\nAgent Experience is one of the most hotly contested topics of 2026, and increasingly critical for devtools/infra companies to get right. @ZenoRocha has been writing and thinking about this since 2024 and came on the pod to spill @Resend secrets!\n\nhttps://t.co/gX41gVxXTe\n\nKey themes include:\n\n- Answer Engine Optimization (AEO): how AI models like Claude Code recommend email services and how product teams can design for these agents\n- Deliverability and Trust: The discussion delves into the complexities of getting mail into the inbox, including handling bursts, managing Gmail throttling, and the importance of domain reputation and anti-abuse measures\n- Developer Experience & MCP: A major focus is on building for both humans and machines. Resend utilizes the Model Context Protocol (MCP) to provide agents with over 80 named tools, allowing them to autonomously set up accounts, check pricing in Markdown, and send emails\n- Technical Infrastructure: React Email as a wedge for adoption and but Resend's commitment to owning the mail stack, including managing complex DNS hurdles and providing enterprise-level visibility", "createdAt": "Tue Nov 10 20:25:00 +0000 2026", "replyCount": 8, "retweetCount": 4, "likeCount": 19, "conversationId": "2120251400831816068", "author": {"username": "latentspacepod", "name": "Latent.Space", "profileImageUrl": "https://pbs.twimg.com/profile_images/1888346877428641792/rMxtG84Z_normal.jpg"}, "authorId": "1670869422733393966", "translationZh": "🆕 为智能体设计\n\n智能体体验是 2026 年争论最激烈的话题之一。对开发者工具和基础设施公司来说，做好这一点也越来越重要。@ZenoRocha 从 2024 年起就在思考和撰写相关内容，这次他来播客分享了 @Resend 的一些秘诀！\n\nhttps://t.co/gX41gVxXTe\n\n主要话题包括：\n\n- 答案引擎优化（AEO）：Claude Code 等 AI 工具如何推荐邮件服务，以及产品团队如何为这些智能体设计产品\n- 邮件送达与信任：深入讨论怎样让邮件顺利进入收件箱，包括应对发送量骤增、处理 Gmail 限流，以及域名信誉和反滥用措施的重要性\n- 开发者体验与 MCP：重点是同时服务人类和机器。Resend 通过模型上下文协议（MCP）提供 80 多个具名工具，让智能体自主设置账号、查看 Markdown 格式的定价信息并发送邮件\n- 技术基础设施：Resend 借 React Email 吸引用户，同时坚持自主掌控邮件技术栈，包括处理复杂的 DNS 问题，并提供企业级可观测性"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWytXx4bgAAV3cT.jpg", "width": 954, "height": 680, "previewUrl": "https://pbs.twimg.com/media/HWytXx4bgAAV3cT.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent / 工作流", "name": "swyx", "role": "Latent Space / AI Engineer", "why": "AI 工程社区、Agent、开发工具信号源", "handle": "swyx"}, "createdAtIso": "2026-11-10T21:00:05+00:00", "createdAtBeijing": "2026-11-11T05:00:05+08:00", "createdAtLocal": "11-11 05:00 北京", "url": "https://x.com/swyx/status/2120260228902264872", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2120260228902264872", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Resend 面向 Agent 的产品设计", "evidence": "over 80 named tools", "rationale": "访谈列举 MCP 工具支持的开户、查价和发信流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我终于问了 AEO 的 CEO @zenorocha：我明明不想让智能体用 Resend，它们到底为什么老选 Resend？https://t.co/K823AQNd4W"}, "avatar": "https://pbs.twimg.com/profile_images/2073162797354217472/hNny55eF_normal.jpg"}, {"id": "2119968785545236613", "track": "agent", "source": {"id": "2119968785545236613", "text": "最近一直在琢磨，团队用 Agent 协作开发时，任务怎么分工、交接，代码怎么提交和 Review，才能真正提高效率。\n\n前几天在上海 AI Engineer 大会上，Manus 分享了共享 Monorepo 和开放任务的协作方式，MiniMax 则讲了不少 Harness 设计和工程实践，听完挺受启发。\n\n刚好 @Ronny_MiniMax 把 MiniMax 团队内部实际使用的 mcode-stack 开源了。\n\n从 Subagent 任务拆分、小 PR 提交、独立 Code Review，到长会话交接和 Harness Eval，都整理成了可以直接安装的 Skills 和 Workflow。\n\n我觉得这种把团队工程经验沉淀成可复用 Skill 的思路挺值得借鉴，准备 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));

let active='all',query='';

function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
