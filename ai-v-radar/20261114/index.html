<script>
const DATA={"records": [{"id": "2121278045013377092", "track": "research", "source": {"id": "2121278045013377092", "text": "You shouldn’t blindly trust benchmarks - you should be able to encode your preferences relative to your use cases and design eval metrics around that.\n\nWe’re excited to release ParseBench-2 as not only a comprehensive document parsing benchmark, but also a framework for parsing benchmark design. Where you can articulate a set of human preferences of what “good parsing” looks like and “hillclimb” evaluation metrics against that.\n\nThe important part is not hand-crafting a deterministic parsing metric. Metric design can be automated by coding agents; what’s important is an open framework + datasets for encoding human preferences and optimizing metrics.\n\n📋 For instance, if you’re dealing with mostly backoffice data, you may care about accurate form parsing, bounding boxes, and scans!\n\n📊 On the other hand, if you’re dealing with investor research reports, you may care more about tables and charts, but less around handwriting.\n\nWe let you encode a severity policy that encodes the impact of every negative parsing error, and forces the metric to fit against it - think of fitting a linear regression in high-dimensional space.\n\nA baseline approach for encoding human preferences is LLM as a judge. But the result of this approach vs. a “simple” LLM as a judge call is that you get much more granular, repeatable, quantifiable breakdowns of each dimension that are efficiently run at scale.\n\nFor instance, one OCR tool might be better at linearizing text, but worse at preserving formatting. Another OCR tool might be better at preserving empty rows in tables but struggle with merged cells.\n\nThe scores reflected on our website do reflect a “default” preference, but it is explicitly and transparently articulated both in our Github and technical report. The important part is that you can change and customize it for your needs.\n\nParseBench-2 is our most ambitious, comprehensive open benchmark to date. It is not simply a set of deterministic metrics, but a framework for designing parse evals.\n\nWe’re rapidly working on improvements and expansions (e.g. fixing minor annotation issues and tuning metrics). If you have thoughts please chime in! Everything is fully OSS.\n\nParseBench-2 Repo: https://t.co/GATeKILtZY\nParseBench-2 Blog: https://t.co/6ZsSDGAiVB\nTechnical Report: https://t.co/f6SxkKIlme", "createdAt": "Fri Nov 13 16:24:32 +0000 2026", "replyCount": 23, "retweetCount": 4, "likeCount": 52, "conversationId": "2121278045013377092", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2120921239619612921", "text": "Today we’re introducing ParseBench-2 - our most ambitious document parsing benchmark to date.\n\nIt is the only benchmark that provides both extreme granularity into every single type of production parsing error, while also making sure that metric scores are highly aligned with human judgment. We do this by painstakingly assigning severity scores to 330+ error types, and tuning each metric to match the severity scores. \nExisting benchmarks either use brittle deterministic metrics (e.g. OmniDocBench) or LLM-as-a-judge (ParseArena), which can help recognize equivalent representations but are coarse/stochastic/subject to bias by the prompt+model.\n\nParseBench-2 also contains:\n✅ 4.3k+ document pages (double from ParseBench-1).\n✅ An extra dimension (forms)\n✅ Much better ground-truth across all dimensions compared to ParseBench-1.\n\nThis is the next evolution of ParseBench, our hugely popular benchmark that has 50k+ monthly downloads, over 150+ OCR solutions benchmarked, and has been adopted by companies like NVIDIA, Cohere, Aleph Alpha, Perplexity, and others.\n\nAlongside ParseBench-2, we are also releasing OCRia-1.5 - a new family of document parsing models that powers all our modes in LlamaParse. They represent a massive step up in capabilities from our latest release, and are state of the art in parsing complex tables, forms, charts, formatting, and assigning bounding boxes to complex layouts.\n\nCome check out our blog post, technical report, and website.\n\nBlog: https://t.co/TKbfCyTjht\nTechnical Report: https://t.co/eAu0s6ttA1\nWebsite: https://t.co/PWczfhp0OX\n\nIf you’re interested in trying out our OCRia-1.5 capabilities, come sign up for LlamaParse: https://t.co/XYZmx5TFz8", "createdAt": "Thu Nov 12 16:46:42 +0000 2026", "replyCount": 98, "retweetCount": 28, "likeCount": 201, "conversationId": "2120921239619612921", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120918905564934150/img/aNxe4MZD-e4CRt3L.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120918905564934150/img/aNxe4MZD-e4CRt3L.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120918905564934150/vid/avc1/3840x2160/1zMkM_LouY39o-de.mp4?tag=29", "durationMs": 167042}], "translationZh": "今天，我们推出 ParseBench-2——迄今为止我们最具雄心的文档解析基准。\n\n它是唯一既能极细致地分析生产环境中各类解析错误，又能确保指标评分与人类判断高度一致的基准。为此，我们逐一为 330 多种错误类型评定严重程度，并调整各项指标，使其与这些评分相匹配。\n现有基准要么采用脆弱的确定性指标（如 OmniDocBench），要么采用 LLM 评审（ParseArena）。后者有助于识别等价的表达形式，但评估较粗、具有随机性，也容易受到提示词和模型的偏差影响。\n\nParseBench-2 还包含：\n✅ 4,300 多页文档（是 ParseBench-1 的两倍）。\n✅ 新增一个评估维度：表单。\n✅ 相比 ParseBench-1，所有维度的标准答案质量都大幅提升。\n\n这是 ParseBench 的新一代版本。这个广受欢迎的基准每月下载量超过 5 万次，已评测 150 多种 OCR 方案，并被 NVIDIA、Cohere、Aleph Alpha、Perplexity 等公司采用。\n\n与 ParseBench-2 一同发布的还有 OCRia-1.5——一个全新的文档解析模型系列，为 LlamaParse 的所有模式提供支持。相比上一版本，其能力大幅提升，在复杂表格、表单、图表、格式解析，以及为复杂版面标注边界框方面达到领先水平。\n\n欢迎查看我们的博客、技术报告和网站。\n\n博客：https://t.co/TKbfCyTjht\n技术报告：https://t.co/eAu0s6ttA1\n网站：https://t.co/PWczfhp0OX\n\n如果你想体验 OCRia-1.5 的能力，欢迎注册 LlamaParse：https://t.co/XYZmx5TFz8"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121277853170069504/img/Pq_DDVxVPYn1etF0.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121277853170069504/img/Pq_DDVxVPYn1etF0.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121277853170069504/vid/avc1/1920x1080/gKTPqaugDcv4sr0O.mp4?tag=29", "durationMs": 45800}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-13T16:24:32+00:00", "createdAtBeijing": "2026-11-14T00:24:32+08:00", "createdAtLocal": "11-14 00:24 北京", "url": "https://x.com/jerryjliu0/status/2121278045013377092", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2121278045013377092", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ParseBench-2与可定制文档解析评测", "evidence": "330+ error types", "rationale": "发布开源评测框架，详述错误严重度与偏好拟合"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "不应盲目信任基准测试。你应该能根据使用场景明确自己的偏好，并据此设计评估指标。\n\n我们很高兴推出 ParseBench-2。它不仅是一套全面的文档解析基准，也是一个用于设计解析基准的框架。你可以明确人们对“优质解析”的一组偏好，再据此迭代优化评估指标。\n\n重点不在于手工打造确定性的解析指标。指标设计可以交给编程智能体自动完成；真正重要的是提供开放的框架和数据集，用于编码人类偏好并优化指标。\n\n📋 例如，如果你主要处理后台业务数据，可能会更关注表单解析、边界框定位和扫描件识别的准确性！\n\n📊 而如果你处理的是投资研究报告，可能会更关注表格和图表，对手写内容则没那么在意。\n\n你可以设定一套严重程度策略，明确每种解析错误造成的影响，并让指标拟合这套策略——类似于在高维空间中拟合线性回归。\n\n编码人类偏好的一种基础方法是让 LLM 担任评判。但相比“简单地”调用一次 LLM 进行评判，这种方法能对各个维度给出更细致、可重复、可量化的分析，并能高效地大规模运行。\n\n例如，一款 OCR 工具可能更擅长将文本按阅读顺序展开，却不善于保留格式。另一款 OCR 工具可能更擅长保留表格中的空行，却难以处理合并单元格。\n\n我们网站上的分数确实反映了一套“默认”偏好，但我们已在 GitHub 和技术报告中明确、透明地说明了这些偏好。关键是，你可以根据自己的需求调整和定制它们。\n\nParseBench-2 是我们迄今投入最大、覆盖最全面的开放基准。它不只是一组确定性指标，更是一个用于设计解析评估的框架。\n\n我们正在快速改进和扩展它，例如修正少量标注问题、调优指标。欢迎提出想法！所有内容均已完全开源。\n\nParseBench-2 仓库：https://t.co/GATeKILtZY\nParseBench-2 博客：https://t.co/6ZsSDGAiVB\n技术报告：https://t.co/f6SxkKIlme"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2121174537127735305", "track": "agent", "source": {"id": "2121174537127735305", "text": "Vercel Labs 开源的 UI SDK，把键盘导航、焦点管理、弹层、选择和拖拽做成可复用的行为，让 Agent 写界面时能直接组合这些能力，减少反复实现交互细节的工作。\n\n比如做一个 Select，弹层可以交给 createPopup，选择状态交给 createSelection，输入字母跳到选项交给 createTypeahead。这些是组件里的关键行为，配合状态、焦点和渲染逻辑，还能组合成自动补全、Combobox 或业务专用的选择器。\n\n官网提供了 50 多种行为，也覆盖拖拽排序、尺寸调整、画布缩放和虚拟列表。同一份交互定义可以通过适配器用于 React、Vue、Svelte、Solid 和 Web Components，样式由项目自己控制。常见组件可以直接使用，特殊交互再按需要组合。\n\n它也提供 ui-sdk Skill，帮助编程助手选择组件、组合行为和检查实现。文档随包分发，对应项目实际安装的版本；测试工具可以检查键盘操作、焦点和 ARIA。组件的名称、角色与交互规则仍需要明确，完成后也要检查实际体验。\n\nAgent 还能通过接入的 bridge 读取组件状态、调用暴露的动作。比如调用输入框的 setValue，把项目名从 Apollo 改为 Atlas，变更会经过组件 API 和回调，应用可以用 allow 限制允许执行的动作。接自己的模型时，模型连接和工具调用循环需要另外实现；也可以通过 WebMCP，把这些工具交给支持它的浏览器 Agent。\n\n官方用 Claude Code + Sonnet 做了一组项目设置任务对照：浏览器工具与 UI SDK bridge 的调用次数分别为 16 次、5 次，耗时为 41 秒、16 秒，成本下降约 56%。两版页面使用不同组件库，每种方式运行 3 次取中位数，所有运行均完成任务。这组数据反映的是 Agent 操作已建好界面的效率。\n\nWebMCP 目前仍处于实验阶段：Chrome、Edge 已提供 Origin Trial，也可通过实验开关测试，Firefox、Safari 暂无原生支持。UI SDK 的 bridge 可以独立接入自己的 Agent，使用 WebMCP 时则需要核对浏览器环境。\n\n项目本身也还在 Beta，API 和行为可能调整。接入前要核对框架版本，例如 React 适配器要求 React、React DOM 19 及以上。\n\n相关链接：\n- Repo: https://t.co/OQUQnoG9Bq\n- Docs: https://t.co/jENgNqVPqz\n- WebMCP: https://t.co/C5PJnfuxcS", "createdAt": "Fri Nov 13 09:33:13 +0000 2026", "replyCount": 2, "retweetCount": 2, "likeCount": 41, "conversationId": "2121174537127735305", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2120950020249895314", "text": "Introducing the UI SDK. https://t.co/3rd2dDTYNz", "createdAt": "Thu Nov 12 18:41:04 +0000 2026", "replyCount": 195, "retweetCount": 375, "likeCount": 5673, "conversationId": "2120950020249895314", "author": {"username": "vercel", "name": "Vercel", "profileImageUrl": "https://pbs.twimg.com/profile_images/1767351110228918272/3Pndc5OT_normal.png"}, "authorId": "4686835494", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120949925425065984/img/4DSJbkjJAuKq0sfQ.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120949925425065984/img/4DSJbkjJAuKq0sfQ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120949925425065984/vid/avc1/1920x1080/7408niVfHlKhAYvI.mp4?tag=16", "durationMs": 101600}], "translationZh": "推出 UI SDK。https://t.co/3rd2dDTYNz"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-13T09:33:13+00:00", "createdAtBeijing": "2026-11-13T17:33:13+08:00", "createdAtLocal": "11-13 17:33 北京", "url": "https://x.com/lencx_/status/2121174537127735305", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2121174537127735305", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "UI SDK交互行为组合与Agent桥接", "evidence": "弹层可以交给 createPopup", "rationale": "具体介绍开源工具、组合方法及评测局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121211485670301872", "track": "agent", "source": {"id": "2121211485670301872", "text": "A2UI 让 AI 回答变成可操作界面：比较套餐时生成对比表，预约时给出日期选择器和确认表单等。它是 Google 推出的开放协议（Agent to UI），最近发布了首个稳定版 1.0。开发者提供组件和使用规则，AI 按任务生成结构化描述，应用逐步渲染，沿用自己的设计系统。\n\n1.0 核心变化是双向函数调用：表单可以向 Agent 查询余位，Agent 也能请求客户端的屏幕尺寸，调用范围由组件目录声明。同一界面还能组合多个组件目录，首屏组件和数据可以一次发送，校验结果支持区分错误、警告和提示。\n\nCopilotKit 提供预置组件，也能接入自己的业务组件，通过 AG-UI 连接 LangChain、Google ADK、Mastra、Claude Agent SDK 等后端。不过，其当前的 Components and surfaces 引擎尚未支持协议中的双向函数调用，多目录组合仅部分支持，也未强制检查组件父子关系。\n\n跨平台方面，React、Angular 渲染器面向 Web，Flutter 覆盖移动端、Web 和桌面；同一份描述跨端复用，需要协议版本和组件目录兼容。Slack 支持则属于 CopilotKit Channels 的渠道集成，输出 Block Kit，当前渲染器会省略 Chart 节点，不能据此认定 Slack 原生支持 A2UI 1.0。\n\n配套的 A2UI Express 用更简短的语法描述界面，再转换成标准 JSON。官方使用 Gemini 3.8 Flash、关闭思考，在 54 个样例上测试：相比直接生成 JSON，UI 描述的 token 中位数从 807 降到 297，减少 63.2%，首次通过率均为 98.1%。这衡量的是特定测试中的 token 节省，实际提速还要看应用。\n\n相关链接：\n- Blog: https://t.co/J13vkjgcNN\n- A2UI Playground: https://t.co/3MzRZ40SY6", "createdAt": "Fri Nov 13 12:00:03 +0000 2026", "replyCount": 3, "retweetCount": 1, "likeCount": 16, "conversationId": "2121211485670301872", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2120951334665150885", "text": "🎉 Today, we're excited to be joining Google's release of A2UI 1.0\n\nWe’ve worked with Google’s A2UI team since the first release, helping shape A2UI into the best spec for declarative Generative UI.\n\nGenerative UI is now truly mature for real products. The building blocks behind it are now faster, more capable and easier to use.\n\nSo stop letting your agents answer with giant walls of text.\n\nWith A2UI 1.0 and CopilotKit, you can bring the equivalent of OpenAI's intelligent UI in YOUR agentic app with two lines of code.\n\n✨ Your own components, or our pre-built catalog\n📲 Any user-facing surface: React, Angular, Flutter, Slack\n🔌 Any agent stack: LangChain, ADK, Mastra, Claude Agents and more\n\nBig shoutout to everyone on our team who helped bring this together including @sofiiiiiasz, @GetContextable, @JerelVelarde and @AlemTuzlak\n\nAnd thank you to @zeroasterisk, Vishal and Jay from the Google team for the continued collaboration.\n\nRead more: https://t.co/fxgsDLxUJr\nCheck out the A2UI playground:  https://t.co/9f5BonCNVT", "createdAt": "Thu Nov 12 18:46:18 +0000 2026", "replyCount": 16, "retweetCount": 71, "likeCount": 816, "conversationId": "2120951334665150885", "author": {"username": "ataiiam", "name": "Atai Barkai", "profileImageUrl": "https://pbs.twimg.com/profile_images/1649413157893316608/qAX0jKbI_normal.jpg"}, "authorId": "1087061356770021376", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120951306697441280/img/Zdny_aAXc3pjsv5N.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120951306697441280/img/Zdny_aAXc3pjsv5N.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120951306697441280/vid/avc1/1920x1080/3RS1rRUoht_MDrAY.mp4?tag=16", "durationMs": 36099}], "translationZh": "🎉 今天，我们很高兴参与 Google 的 A2UI 1.0 发布。\n\n从首个版本发布起，我们就一直与 Google 的 A2UI 团队合作，助力 A2UI 成为声明式生成式 UI 的最佳规范。\n\n生成式 UI 如今已真正成熟，能够用于实际产品。其底层组件也变得更快、更强大、更易用。\n\n别再让你的智能体用大段文字回答用户了。\n\n借助 A2UI 1.0 和 CopilotKit，只需两行代码，就能在你自己的智能体应用中实现媲美 OpenAI 智能 UI 的体验。\n\n✨ 使用你自己的组件，或我们预置的组件库\n📲 支持各种面向用户的界面：React、Angular、Flutter、Slack\n🔌 支持各种智能体技术栈：LangChain、ADK、Mastra、Claude Agents 等\n\n特别感谢团队中所有促成这一成果的成员，包括 @sofiiiiiasz、@GetContextable、@JerelVelarde 和 @AlemTuzlak。\n\n也感谢 Google 团队的 @zeroasterisk、Vishal 和 Jay 一直以来的合作。\n\n了解更多：https://t.co/fxgsDLxUJr\n体验 A2UI playground：https://t.co/9f5BonCNVT"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-13T12:00:03+00:00", "createdAtBeijing": "2026-11-13T20:00:03+08:00", "createdAtLocal": "11-13 20:00 北京", "url": "https://x.com/lencx_/status/2121211485670301872", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2121211485670301872", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "A2UI 1.0 协议与集成边界", "evidence": "1.0 核心变化是双向函数调用", "rationale": "详述协议发布、兼容限制及测试条件"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121083883479605301", "track": "research", "source": {"id": "2121083883479605301", "text": "训练一个大模型可能需要持续数月，几乎没有从头再跑一次的机会。这样的任务，Agent 还能实现递归自我改进（RSI）吗？\n\nSII-GAIR 与 Xinxu AI 最近的论文《No Second Run》，尝试把 RSI 引入大模型预训练，并训练出了 801-30B-A3B。\n\n核心思路是把昂贵的预训练过程拆成多个可验证的小闭环。\n\nAgent 可以定位训练故障、评估数据和训练策略，并通过 Context Infrastructure 共享训练指标、代码变更和失败经验，让整个系统能够持续积累知识、改进流程。\n\n作者报告，团队在三个月内完成了 11.8T Tokens 的预训练。在相同的 1T Token 预算下，22 项 Benchmark 平均分从 47.78 提升到 56.83。不过，这些收益来自多项联合改进，无法单独归因于 Agent。\n\n这个工作对 RSI 和 Harness Engineering 还是很有启发。\n\n当任务昂贵到无法反复重来，局部可验证的实验、长期积累的经验，以及跨任务共享的 Context，可能就是实现持续自我改进的关键。\n\n📎 arXiv: https://t.co/ZYihkjchCy\n\n💻 GitHub: https://t.co/K1ePPEvJpj", "createdAt": "Fri Nov 13 03:33:00 +0000 2026", "replyCount": 10, "retweetCount": 23, "likeCount": 113, "conversationId": "2121083883479605301", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW-CZJXXUAA3Gek.jpg", "width": 1158, "height": 1260, "previewUrl": "https://pbs.twimg.com/media/HW-CZJXXUAA3Gek.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-13T03:33:00+00:00", "createdAtBeijing": "2026-11-13T11:33:00+08:00", "createdAtLocal": "11-13 11:33 北京", "url": "https://x.com/Xudong07452910/status/2121083883479605301", "themeId": "editorial", "signalScore": 83, "editorial": {"id": "2121083883479605301", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "将递归自我改进引入大模型预训练", "evidence": "22 项 Benchmark 平均分从 47.78 提升到 56.83", "rationale": "介绍论文方法与量化成果，并说明归因限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2121321443019432002", "track": "research", "source": {"id": "2121321443019432002", "text": "Depue 称中国模型用了禁运芯片：报告自己承认的限制，推文里都没了\n\n前 OpenAI 研究员 Will Depue 11 月 12 日发推，称找到“确凿的取证证据”：DeepSeek、月之暗面、MiniMax、蚂蚁“用被禁止出口中国的 Blackwell 芯片打造了最新模型”，涉及“超过 5 亿美元”的禁运芯片，“出口禁令显然在严重失效”。\n\n问题在于，这些结论大多不在他自己的报告里。报告承认的几条关键限制，到了推文里全不见了。X 用户 Daebak 앤디（@MyDaebakCafe）当天发长帖逐条拆解，他说：“指望没人读过标题，华盛顿的舆论就是这么制造出来的。”\n\n【指纹只管“第 0 步”】\n\nDepue 找到的，是模型训练开始前那一刻留下的痕迹：训练前要先往模型里填一批随机数，不同芯片填出来的排列不一样，部分排列训练后还留着。\n\n@MyDaebakCafe 也承认这个方法本身没问题，能看出生成初始权重的那台机器是 Blackwell。但他指出，报告原文写的是，这些痕迹只说明权重“怎么创建”，“支持、但不能证明” Blackwell 参与了训练。在他看来，初始化几秒钟就能做完，完全可以在租来的一台机器上生成，再搬到老一代芯片的集群上训练。\n\nDepue 后来回应说，Kimi K3 的初始权重由几十个进程同时生成，更像是整个训练集群在启动，单独生成再搬运说不通。这是他的推断，报告里仍然写着“不能证明”。\n\n【“5 亿美元”不是指纹算出来的】\n\n@MyDaebakCafe 的第二个要点是，几千张卡、5 亿美元这些数字，跟指纹没有关系，Depue 在推文里自己用的词就是“估算”，依据是发布时间和模型参数。\n\n报告写得更清楚：估算依赖芯片效率、训练数据量、训练时长几项“权重无法证实”的假设，作者“对这些估算没有把握”，而且报告发布当天就改了一轮数字。推文里“很可能数十亿美元”，报告没有给出任何算法。\n\n【芯片在哪、合不合法，一概不知】\n\n报告执行摘要最后一句承认，证据“不能说明芯片在哪、怎么拿到的、是否违反出口管制”。@MyDaebakCafe 提醒，Depue 自己的验证也是在租来的云端 GB200 上做的；他说，不在美国实体清单上的公司，在新加坡、日本、中东的云上租 Blackwell，按美国商务部现行规则完全合法，留下的指纹一模一样。\n\nDepue 在推文里也承认芯片可能是境外租的，称之为“国会还没堵上的漏洞”。走私涉嫌违法，境外租用至多是规则漏洞，性质完全不同。Depue 分不清是哪一种，却直接得出“禁令严重失效”。\n\n【其他网友的质疑】\n\n网友 @dodecagonism 指出，报告收了 11 月发布的 Kimi K3.1-Pro，却没把 DeepSeek 9 月发布的最新模型 V4.1-Flash 列进结果，“看起来是故意把方法不适用的模型都排除掉”。报告“局限”一节写了 V4.1-Flash 没找到任何指纹，推文只说四家的“最新模型”用了 Blackwell，对此一字没提。Depue 回应说，这说明方法不会对谁都报 Blackwell，DeepSeek 可能换了生成初始权重的方式；随后又发帖说“可能破解了，看起来像是英伟达”，目前还没公布结果。\n\n网友 @dfranke 认为，报告所有惊人的结论都建立在“用哪种芯片初始化，就用哪种芯片训练”这个假设上，而报告自己就发现，有些模型的初始权重是在普通 CPU 上生成的，说明这个假设并不总成立。Depue 回应说，那是训练程序先在本机 CPU 上生成、再拷到本机显卡，跟跨集群搬运是两回事。\n\n@MyDaebakCafe 在后续帖子里还提出，中国大厂用的是自己改过的训练框架，如果某段自定义代码把布局写死，用老芯片也能留下同样的痕迹。这一条 Depue 没有直接回应。\n\n【谁来背书，为什么是这天】\n\n推文说结果“经过 OpenAI 和 Anthropic 资深研究员独立验证”，报告里没有一个名字。当晚 Depue 又说，私下验证的人大多不愿具名。\n\n@MyDaebakCafe 质问：为什么偏偏在 11 月 12 日、黄仁勋辞去英伟达 CEO 的当天发布？他的解读是，美国闭源模型公司眼看付费 API 的生意被免费的中国开源模型蚕食，这份报告正好递给华盛顿鹰派一个理由，去管控全球云算力、打压开源 AI。\n\n动机属于他的推测，但有几件事是公开的：OpenAI 和 Anthropic 都指控过中国实验室“蒸馏”自家模型，Anthropic CEO Dario Amodei 专门发文支持收紧对华芯片出口；Depue 说发布前和官员通过信；发布约 40 分钟后，他又发帖为自己的新机构 Unemployment Labs 募资 500 万美元。匿名验证者来自利益相关方，发布者也有自己的诉求，这样的结论需要独立复现，目前还没有具名的第三方公布结果。\n\n中国驻美使馆 2 月回应美国官员的同类指控时说，反对“泛化国家安全概念、滥用出口管制、把经贸科技问题政治化”。截至 11 月 13 日，四家公司和英伟达还没有回应这份报告。\n\nDepue 原推：https://t.co/84tVCbTDJX\nDepue 报告：https://t.co/d41kDvtzMh\n@MyDaebakCafe 原帖：https://t.co/qWsK5DrPwZ", "createdAt": "Fri Nov 13 19:16:58 +0000 2026", "replyCount": 15, "retweetCount": 3, "likeCount": 48, "conversationId": "2121321443019432002", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2120992457630326841", "text": "I have a major result to share.\n\nI’ve found conclusive forensic evidence that the top 4 Chinese AI labs—DeepSeek, Moonshot, MiniMax and Ant Group—have built their newest models on NVIDIA’s most advanced Blackwell chips, which are barred from export to China.\n\nThis sounds insane, but I discovered that almost every AI model carries a hidden signature of the GPU that trained it. When a model is first set up, the starting values of its weights are laid out in a pattern that depends on the exact GPU. Each combination of GPU and seed number produces a unique pattern—a sort of fingerprint of the hardware used to create the model. Traces of that pattern survive training into the published model.\n\nAgain, this evidence isn’t based on any insider information or leaking. It’s based on a forensic analysis of the model weights released by the companies themselves.\n\nI searched more than six trillion combinations of chip layout and seed number and matched them to open-weights models. In doing so, I found conclusive evidence that six Chinese AI models—including DeepSeek-V4-Pro, Kimi K3, and MiniMax-M3—were initialized on NVIDIA Blackwell systems. Four of the models match Grace Blackwell, the GB200 and GB300 parts in NVIDIA’s flagship liquid-cooled rack-scale systems.\n\nI then verified these results on real hardware. Running unmodified PyTorch with the seeds I’d recovered, a Blackwell B300 reproduced DeepSeek-V4-Flash’s untouched starting weights bit for bit, and a rented GB200 reproduced Kimi K3’s to a correlation of 0.999995. A Hopper H100 reproduced none of DeepSeek-V4-Flash’s, and changing the seed by one broke the match. (DeepSeek’s seed is 953049583 by the way.) The method also was verified to match 24 known open-weights models to the hardware that developers said they used.\n\nIt is exceedingly unlikely that these results are a coincidence. Across six trillion combinations, the best accidental match should reach only about 8 sigma (i.e., eight standard deviations above what random chance would produce). The real matches range from 49 to 1,385 sigma, and even the weakest single test hits 20.\n\nThese were data-center-scale training runs. With some analysis of release schedules and model details, I estimate that the largest, Kimi K3 and DeepSeek-V4-Pro, used 2,000 to 3,000 Blackwell GPUs each. Clusters of this size cost on the order of $150 to $200 million each to buy, and across these labs alone would add up to more than half a billion dollars of export-controlled GPUs, not counting experimental compute or otherwise. It’s quite likely that we see multi-billion dollar expenditure on export-controlled GPUs.\n\nI am highly confident in this result, and it has been independently verified by senior researchers at OpenAI and Anthropic. You can read the full report at https://t.co/YOtzND0Jqk.\n\nThere is much more I’ve identified about these models through other forms of checkpoint forensics like this, and will have more to share soon.", "createdAt": "Thu Nov 12 21:29:42 +0000 2026", "replyCount": 1720, "retweetCount": 6081, "likeCount": 39223, "conversationId": "2120992457630326841", "author": {"username": "willdepue", "name": "will depue", "profileImageUrl": "https://pbs.twimg.com/profile_images/1933036715343839232/NtsZBjee_normal.jpg"}, "authorId": "998575387067142144", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9GgJ_WcAA9m3I.jpg", "width": 2048, "height": 1162, "previewUrl": "https://pbs.twimg.com/media/HW9GgJ_WcAA9m3I.jpg:small"}], "translationZh": "我有一项重大发现要分享。\n\n我找到了确凿的取证证据，表明中国四家顶尖 AI 实验室——DeepSeek、Moonshot、MiniMax 和 Ant Group——使用了禁止向中国出口的 NVIDIA 最先进 Blackwell 芯片来构建其最新模型。\n\n这听起来很不可思议，但我发现，几乎每个 AI 模型都带有训练它的 GPU 的隐藏特征。模型初始化时，权重初始值的排列模式取决于具体的 GPU。每一种 GPU 与随机种子数的组合都会产生独特的模式，就像创建模型所用硬件的指纹。训练结束后，这种模式的痕迹仍会保留在发布的模型中。\n\n再强调一次，这些证据并非来自任何内部消息或泄密，而是来自对这些公司自行发布的模型权重的取证分析。\n\n我搜索了超过六万亿种芯片布局与随机种子数的组合，并将其与开放权重模型进行匹配。在此过程中，我找到了确凿证据，表明包括 DeepSeek-V4-Pro、Kimi K3 和 MiniMax-M3 在内的六款中国 AI 模型是在 NVIDIA Blackwell 系统上初始化的。其中四款模型匹配到了 Grace Blackwell，即 NVIDIA 旗舰液冷机架级系统中的 GB200 和 GB300 硬件。\n\n随后，我在真实硬件上验证了这些结果。使用未经修改的 PyTorch 和我还原出的随机种子，Blackwell B300 逐比特复现了 DeepSeek-V4-Flash 中未经训练改动的初始权重；租用的 GB200 则复现了 Kimi K3 的对应权重，相关系数达到 0.999995。Hopper H100 未能复现 DeepSeek-V4-Flash 的这些权重，而将随机种子加一或减一也会使匹配失效。（顺便说一句，DeepSeek 的随机种子是 953049583。）该方法还成功将 24 款已知开放权重模型与开发者声明使用的硬件匹配起来。\n\n这些结果出于巧合的可能性极低。在六万亿种组合中，最好的偶然匹配预计也只能达到约 8 sigma，也就是比随机情况下的预期高出八个标准差。实际匹配结果则在 49 至 1,385 sigma 之间，即使最弱的单项测试也达到了 20 sigma。\n\n这些训练任务达到了数据中心规模。结合发布时间和模型细节分析，我估计其中最大的 Kimi K3 和 DeepSeek-V4-Pro 各使用了 2,000 至 3,000 块 Blackwell GPU。购买这种规模的集群，每个约需 1.5 亿至 2 亿美元；仅这些实验室使用的受出口管制 GPU，总价值就超过 5 亿美元，还不包括实验性计算等其他用途的投入。受出口管制 GPU 的总支出很可能达到数十亿美元。\n\n我对这一结果高度确信，OpenAI 和 Anthropic 的资深研究人员也已独立验证。完整报告见 https://t.co/YOtzND0Jqk。\n\n通过其他类似的检查点取证方法，我还发现了更多有关这些模型的信息，很快会继续分享。"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-13T19:16:58+00:00", "createdAtBeijing": "2026-11-14T03:16:58+08:00", "createdAtLocal": "11-14 03:16 北京", "url": "https://x.com/dotey/status/2121321443019432002", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2121321443019432002", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "模型权重硬件指纹的证据边界复盘", "evidence": "支持、但不能证明", "rationale": "具体拆解初始化指纹、训练推断与成本估算的证据边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2121044031153258889", "track": "tools", "source": {"id": "2121044031153258889", "text": "浏览器这几年多了不少原生能力，AI 写前端时，仍容易沿用训练数据和项目里的旧写法：一些已有原生方案的功能，又用 JS 和第三方库实现了一遍。Modern Web Guidance 想补的就是该缺口，让 AI 写代码时能查到现代 Web 的用法、常见问题，以及浏览器的支持情况。\n\n它由 Chrome、Edge、Firefox、MDN 团队和社区共同维护，以 Agent Skills 的形式接入编程助手。遇到相关任务时，Agent 通过 CLI 搜索、读取指南，按需把知识带进上下文。团队也会根据评测结果精简指南，减少模型已经掌握的重复内容。\n\n举几个直观的例子：做弹窗和浮层，先考虑 \u003cdialog>、Popover；多行输入框自动增高，可以评估 field-sizing: content；表单校验样式可以用 :user-invalid，避免用户尚未操作就显示错误状态。容器查询、View Transitions、INP 优化、键盘焦点管理，也都有对应的指导。\n\n这些写法能不能用，还要看项目支持哪些浏览器。可以在 AGENTS.md 里写明 Baseline 目标，未设置时默认以 Widely available 为目标。对于目标浏览器尚未支持的能力，指南会给出渐进增强和降级方案；确实需要 polyfill 时，再按条件加载。\n\n旧项目也用得上。legacy-scan 会先在本地解析代码，找出可能值得替换的旧写法，这一步不调用大模型。之后 Agent 再检查周围代码、核实结果，按指南修改并运行测试。目前扫描只覆盖部分能够通过规则识别的旧模式，命中后仍需要判断，尤其要分清过时写法和项目有意保留的兼容处理。\n\n项目还会让 Agent 在有指南和没有指南的情况下完成同一任务，再用 Playwright 检查代码、浏览器中的实际行为和无障碍状态。哪些建议能改善结果，哪些内容已经多余，都可以根据对照评测继续调整。\n\n经常用 AI 写前端的话，可以先拿一个现有组件试试：看看哪些交互逻辑可以改用原生能力，哪些兼容处理仍需要保留。安装命令是 npx modern-web-guidance@latest install，具体用法见官方文档。\n\n相关链接：\n- Blog: https://t.co/UBWHzf9d0c\n- Repo: https://t.co/cDSdlOVl0n", "createdAt": "Fri Nov 13 00:54:38 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 23, "conversationId": "2121044031153258889", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2121014221563396156", "text": "48 hours after launching 1.0, Modern Web Guidance is the #1 trending repo on GitHub 📈\n\nThank you to the thousands of web developers, and our partners across Firefox, MDN, Edge, and community contributors, who are helping move AI coding agents onto modern, accessible, Baseline-supported web primitives.\n\nIf you haven't tried 1.0 on your codebase yet:\n\nInstall the agent skills: 'npx modern-web-guidance@latest install'\n\nAudit an existing codebase: 'npx modern-web-guidance@latest legacy-scan .'\n\nCheck out the repo on Github → https://t.co/TKZYQy5v0Q", "createdAt": "Thu Nov 12 22:56:11 +0000 2026", "replyCount": 70, "retweetCount": 184, "likeCount": 2559, "conversationId": "2121014221563396156", "author": {"username": "ChromiumDev", "name": "Chrome for Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/1699791641706655744/nZ6TDnaI_normal.jpg"}, "authorId": "113713261", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9bMYVW0AAPImH.jpg", "width": 1492, "height": 1056, "previewUrl": "https://pbs.twimg.com/media/HW9bMYVW0AAPImH.jpg:small"}], "translationZh": "1.0 发布仅 48 小时，Modern Web Guidance 就登上了 GitHub 趋势榜第一名 📈\n\n感谢数千名 Web 开发者，以及 Firefox、MDN、Edge 的合作伙伴和社区贡献者，帮助 AI 编程智能体采用现代、无障碍且获得 Baseline 支持的 Web 基础能力。\n\n如果你还没在自己的代码库中试用 1.0：\n\n安装智能体技能：'npx modern-web-guidance@latest install'\n\n审查现有代码库：'npx modern-web-guidance@latest legacy-scan .'\n\n查看 GitHub 仓库 → https://t.co/TKZYQy5v0Q"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-13T00:54:38+00:00", "createdAtBeijing": "2026-11-13T08:54:38+08:00", "createdAtLocal": "11-13 08:54 北京", "url": "https://x.com/lencx_/status/2121044031153258889", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2121044031153258889", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Modern Web Guidance发布与使用方法", "evidence": "npx modern-web-guidance@latest install", "rationale": "提供工具发布、安装、原生替代与兼容评测方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121119619003944985", "track": "agent", "source": {"id": "2121119619003944985", "text": "用 AI 写代码，最让人心疼的不是它思考得久，而是它一直在花钱踩同一个坑：\n\n昨天才教会它怎么跑测试，今天新开会话又从头试；明明只改一个接口，却带着一堆用不上的工具；遇到报错，还会反复修改、反复失败。\n\n微软和伯克利研究团队开源的 TokenEconomizer，就是想帮编程助手减少这些重复消耗\n\n它把项目里反复验证过的操作经验记下来，下次少走弯路；把长期不用的工具暂时移出后续会话，减少上下文负担；发现助手在同一个错误上打转，就提醒它换个思路。\n\n它不需要更换底层模型，目前可以接入 Claude Code、Codex、GitHub Copilot CLI 和 Pi，不过不同工具支持的功能不完全一样。\n\n作者在 277 个 SWE-Bench 任务上的实验显示，五种助手与模型组合的平均成本降低了 18.4%～30.9%，其中四组的首次通过率还有提升。\n\n但别把它理解成“装上就打七折”：一篇第三方实测报告中，默认配置只省了约 6.2%；开启记忆功能后，还一度因为额外模型调用变得更贵。\n\n所以，真正要看的，是完成同样任务之后的总账。", "createdAt": "Fri Nov 13 05:55:00 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 2, "conversationId": "2121119619003944985", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2120078508521095594", "text": "用 AI 写网页，有个很烦的地方：它说“改好了”，你打开一看，按钮点不动、表单提交失败，最后还是得自己测试、截图，再让它改。\n\nVercel Labs 的开源工具 agent-browser，就是想把这一步也交给 AI：让它打开真实网页，自己点击、输入、查看结果，而不只是对着代码说“应该没问题”。\n\n它的操作方式：先把网页上的按钮、链接、输入框整理成一份清单，给每个元素标上编号，AI 再根据编号执行操作。\n\n比如找到搜索框、输入关键词、点击搜索，然后检查页面有没有出现预期结果。需要看布局时，还能截图，配合文字信息一起判断。\n\n实用场景\n就是让 AI 编程助手写完页面后，顺手走一遍真实用户流程：搜索能不能用、表单有没有报错、提交后有没有跳转，再留下截图和验证结果。\n\n它也能用来操作后台、查询动态网页、复现 Bug。安装主要分两步：装工具、准备浏览器，再通过 Skill 或 MCP 接到支持相应能力的 AI 助手里。\n\n不过，也别把它理解成“装上以后，AI 就能稳定操作所有网站”。\n\n验证码、登录风控、复杂控件都可能卡住；页面变化后，也需要重新观察。", "createdAt": "Tue Nov 10 08:58:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 0, "conversationId": "2120078508521095594", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119992822048964608/vid/avc1/1920x1080/IhgKlY-9fyRUD-Fw.mp4?tag=29", "durationMs": 258766}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121089215144591360/img/Pfydwh485xgr2dEh.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121089215144591360/img/Pfydwh485xgr2dEh.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121089215144591360/vid/avc1/1920x1080/sLVLgTABiAkPQYlW.mp4?tag=29", "durationMs": 339225}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-13T05:55:00+00:00", "createdAtBeijing": "2026-11-13T13:55:00+08:00", "createdAtLocal": "11-13 13:55 北京", "url": "https://x.com/sitinme/status/2121119619003944985", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2121119619003944985", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "TokenEconomizer 编程助手成本优化", "evidence": "默认配置只省了约 6.2%", "rationale": "说明记忆与工具裁剪方法，并对照实验和实测成本"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121260245485768783", "track": "tools", "source": {"id": "2121260245485768783", "text": "DeepSeek 这次发布的东西还蛮惊喜的，把自家 App 的整套能力开放成了 API：联网搜索、深度思考搜索、读链接、文件解析、内容安全审核，还有语音输入和朗读，加几个参数就能打开。\n\n有两点值得看：\n\n1. 搜索和读网页都在 DeepSeek 服务端跑，客户端只需要把返回的搜索步骤、引用和回答渲染出来。以前做一个能联网的聊天应用，要自己接搜索、抓网页、拼上下文，现在这部分它直接包了。\n\n2. 同时兼容 Anthropic Messages、OpenAI Responses 和 Chat Completions 三种协议，还带一个 safety_check 参数审核输入和输出。文档里写明，面向公众提供服务时要开这个参数，并自己完成备案和 AI 标识。对国内想上线聊天产品的团队，这一步省了不少事。\n\n另外还开源了一个前端 demo，能导入你从 DeepSeek Chat 导出的聊天记录接着聊。\n\n等于把「做一个聊天 App」需要的后端整套交给了开发者，接下来就看定价和搜索质量撑不撑得住。\n\n📎 https://t.co/dzsxowS7bB", "createdAt": "Fri Nov 13 15:13:48 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 8, "conversationId": "2121260245485768783", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2121247896918253875", "text": "🚀 The full DeepSeek App experience, now via API\n\nSearch, files, links, safety, and voice. The capabilities behind the DeepSeek App are now available through the DeepSeek API.\nEnable built-in features with a few parameters, or call standalone APIs such as OCR, ASR, and TTS. Build richer conversations or recreate the full DeepSeek App in your own application.\n\nTry our open-source frontend demo, with support for importing DeepSeek conversation history.\n\n🔗 Demo: https://t.co/TI0Iw5qLQK\n📦 Code: https://t.co/ImA0LrgUgX\n📖 Details: https://t.co/t0dJxXM6Lk\n\n1/4", "createdAt": "Fri Nov 13 14:24:44 +0000 2026", "replyCount": 307, "retweetCount": 561, "likeCount": 6845, "conversationId": "2121247896918253875", "author": {"username": "deepseek_ai", "name": "DeepSeek", "profileImageUrl": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_normal.jpg"}, "authorId": "1714580962569588736", "translationZh": "🚀 现在，通过 API 即可获得完整的 DeepSeek App 体验\n\n搜索、文件、链接、安全和语音。DeepSeek App 背后的各项能力现已通过 DeepSeek API 开放。\n只需设置几个参数即可启用内置功能，也可调用 OCR、ASR 和 TTS 等独立 API。打造更丰富的对话体验，或在你自己的应用中复现完整的 DeepSeek App。\n\n欢迎试用我们的开源前端演示，支持导入 DeepSeek 对话历史。\n\n🔗 演示：https://t.co/TI0Iw5qLQK\n📦 代码：https://t.co/ImA0LrgUgX\n📖 详情：https://t.co/t0dJxXM6Lk\n\n1/4"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-13T15:13:48+00:00", "createdAtBeijing": "2026-11-13T23:13:48+08:00", "createdAtLocal": "11-13 23:13 北京", "url": "https://x.com/Xudong07452910/status/2121260245485768783", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2121260245485768783", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "DeepSeek开放应用能力API及前端演示", "evidence": "联网搜索、深度思考搜索、读链接、文件解析", "rationale": "发布包含多项内置能力、协议兼容及开源演示"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2121058789298163862", "track": "enterprise", "source": {"id": "2121058789298163862", "text": "和一位CTO朋友吃饭\n他现在管理的团队，有一百多名技术，公司年营收在百亿级别\n过去一年来，在AI实践上又取得了一些不错的进展\n一个核心的成果就是，整个研发团队的生产力，至少提升了一倍，以前是业务部门的需求总是不能按期交付，今年就变成了，技术去帮助业务部门构思需求，探索各种新的测试\nAI在研发里的渗透，也几乎达到了无处不在的程度\n\n我问他具体是如何做的\n他分享了一些有意思的策略\n1、对他来说，最重要的，就是如果通过机制并借助AI，能调动团队所有人的积极性，正确拥抱AI，提升整体组织效率\n2、基本的原则，就是确保每一个技术的工作产出，能够被进一步的量化，以及相对客观的价值评价\n3、量化的逻辑，就是看任务数及每个任务的价值打分，最后形成每个人的任务及产出价值评价看板，价值评价的标准也是透明的，通过这种方式，实现了全员的目标、任务、产出价值等指标的透明，消除了大量的内部隔阂及一些沟通和管理上的内耗，大家就只需要专注去领任务、挖掘有价值的任务即可\n4、但带来的负面影响就是，一些技术员工就评价，自己被“螺丝钉”或“工厂流水线”化了\n5、不过组织效率的提升，确实是很显著的\n6、在这个机制下，再继续对研发流程线上的每一个节点，让AI全面参与进来，持续打磨和完善，包括AI测试\n7、当然，对团队成员晋升和绩效评价，除了能被量化的一部分，也有一部分非量化的部分，比如团队内部的分享、工作之外的一些贡献等等，也会作为重要参考\n8、组织效率大幅提升后，他们就有更多的精力，去真正了解业务，包括成立FDE团队，做各种内部的业务试验，拿到了不少有意思的结果\n9、对他们而言，经过这样的发展之后，明年的团队定位，就不再是纯后端支持部门，也会借助FDE，慢慢渗透到业务，成为更接近业务一线的半自动实施团队，对业务的赋能也会更加的直接", "createdAt": "Fri Nov 13 01:53:17 +0000 2026", "replyCount": 10, "retweetCount": 9, "likeCount": 67, "conversationId": "2121058789298163862", "author": {"username": "yaojingang", "name": "姚金刚", "profileImageUrl": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, "authorId": "1545677736932364289", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-11-13T01:53:17+00:00", "createdAtBeijing": "2026-11-13T09:53:17+08:00", "createdAtLocal": "11-13 09:53 北京", "url": "https://x.com/yaojingang/status/2121058789298163862", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2121058789298163862", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "研发任务量化与AI组织落地", "evidence": "每个人的任务及产出价值评价看板", "rationale": "转述具体管理机制及负面反馈，成效未经独立证实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2121248578450620800", "track": "growth", "source": {"id": "2121248578450620800", "text": "学到了，支付还是好多细节", "createdAt": "Fri Nov 13 14:27:26 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2121248578450620800", "author": {"username": "hezhiyan7", "name": "droidHZ", "profileImageUrl": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, "authorId": "1554325830708314112", "quotedTweet": {"id": "2121238276317295067", "text": "舒服了，给网站的印度用户改了三处，这两周印度佬的付费率从万分之一到了千分之二\n\n前阵子在优化付费率，一直在加功能优化UI，后面单独对各国付费率看了下，印度佬不愧是臭名昭著，几乎全是白嫖流量\n\n跟一个大佬讨论的时候，他说起印度用户其实很少有信用卡，很多都用UPI，所以我这次针对印度用户，价格显示成了印度卢比，加了小额订阅，再提供当地常用的 UPI 支付\n\n不用换算价格，不用花太多钱，结账时能用熟悉的方式付款\n\n三管齐下，效果还是不错的，虽然都是小额支付，但蚊子腿也是肉呀", "createdAt": "Fri Nov 13 13:46:30 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 27, "conversationId": "2121238276317295067", "author": {"username": "ting_267", "name": "听｜月入万刀版", "profileImageUrl": "https://pbs.twimg.com/profile_images/1921482217932644352/7p-mVij7_normal.jpg"}, "authorId": "1856154802100789248"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "droidHZ", "role": "出海、SEO 与增长实践与观察", "why": "提供支付盗刷识别和退款处理的一线记录，补独立站真实运营风险。", "handle": "hezhiyan7"}, "createdAtIso": "2026-11-13T14:27:26+00:00", "createdAtBeijing": "2026-11-13T22:27:26+08:00", "createdAtLocal": "11-13 22:27 北京", "url": "https://x.com/hezhiyan7/status/2121248578450620800", "themeId": "editorial", "signalScore": 50, "editorial": {"id": "2121248578450620800", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "印度市场定价与支付本地化", "evidence": "加了小额订阅，再提供当地常用的 UPI 支付", "rationale": "列出三项支付优化及自述转化变化，可供复用"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1942385394554728448/b9FlYTW2_normal.jpg"}, {"id": "2121075448121823421", "track": "tools", "source": {"id": "2121075448121823421", "text": "Rust 1.100.0 发布了，`!` 类型正式稳定。除了用 -> ! 表示函数不会正常返回，现在还能写 Result\u003cT, !>，明确表示不会返回 Err。`Infallible` 也成为 ! 的别名。\n\n自定义分配器的核心 API 同时进入稳定版，可以通过 Vec::new_in、Box::new_in 为具体容器指定分配器。清理和回滚则有了 DropGuard，例如批量解析字符串写入 Vec，失败时通过闭包撤销新增内容，成功后用 DropGuard::dismiss 取消回滚。\n\nCargo 新增了未使用依赖检查，但需要覆盖所有可能使用该依赖的构建目标，目前不报告未使用的 dev-dependencies。\n\n依赖更新也可以设置“冷静期”：在 .cargo/config.toml 的 [registry] 中配置 global-min-publish-age = \"3 days\"，解析时就会跳过发布不足三天的版本。这需要仓库提供发布时间；已锁定在 Cargo.lock 中的版本不会因此被排除，`cargo install` 也不执行这项检查。\n\n升级时要留意类型推断。2015、2018、2021 edition 的 never type fallback 从 () 改为 !；部分 Box 的 trait 实现泛化后，也可能出现新的类型推断错误，少数代码需要调整。\n\nCargo 还调整了中间产物的目录布局，以减少不同构建配置之间的缓存冲突。依赖内部路径寻找产物的脚本可能需要修改，建议改用 Cargo 的 JSON 消息获取位置。更新命令：`rustup update stable`。\n\n相关链接：\n- Blog: https://t.co/KGtnrqjWjK\n- Release Notes: https://t.co/kkzHcLwnFR", "createdAt": "Fri Nov 13 02:59:29 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 15, "conversationId": "2121075448121823421", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW-SwTwakAAsH98.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HW-SwTwakAAsH98.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-13T02:59:29+00:00", "createdAtBeijing": "2026-11-13T10:59:29+08:00", "createdAtLocal": "11-13 10:59 北京", "url": "https://x.com/lencx_/status/2121075448121823421", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2121075448121823421", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Rust 1.100.0 发布与升级注意事项", "evidence": "Rust 1.100.0 发布了", "rationale": "详列语言与工具链更新、配置方法及迁移风险"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121057715476656323", "track": "tools", "source": {"id": "2121057715476656323", "text": "用之前心里有数\n\n• 打分是逐条调模型，抓得越多钱越多。示例配置里 Hacker News 只取前 20 条、100 分以上，入口先卡住，比事后靠门槛筛便宜\n\n• 分数是模型给的判断，不是客观指标，换了模型分布也可能跟着变。门槛别一开始定死，跑几天看看分布再调\n\n• 抓 X 要装 twitter 扩展和 Playwright 浏览器，自带的 Dockerfile 不装这些\n\n• 还没发过 Release，也没上 PyPI，目前只能 clone 安装\n\n• 文档有个地方没跟上：评分说明里写唯一的内置工具是 web_search，Profile 文档和源码里都已经有 history_search，以后者为准\n\n写在最后\n\nHorizon 的思路是先打分再花钱：每条内容先按 Profile 的标准打 0 到 10 分，过了门槛、去完重、挤进配额的才去补背景和写正文。\n\nProfile 把读新闻和读长文的尺子分开，改几个 Markdown 和 JSON 就能换一种读法。背景区块能查自己过去的日报，引用必须来自工具结果，这一点比很多 AI 摘要工具谨慎。\n\n信息源多、每天被标题轰炸的人，拿它搭一份只给自己看的早报正合适，GitHub Actions 加 Pages 基本零成本跑起来。\n\n要留心的是，打分逐条花钱，入口得自己卡紧，门槛也要跑几天才定得准。项目还没发正式版本，更适合愿意自己改配置的人。\n\n延伸阅读：\nHorizon GitHub 仓库：https://t.co/WZubzd5ygV", "createdAt": "Fri Nov 13 01:49:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 2, "conversationId": "2121057710703579391", "inReplyToStatusId": "2121057714272887250", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-13T01:49:01+00:00", "createdAtBeijing": "2026-11-13T09:49:01+08:00", "createdAtLocal": "11-13 09:49 北京", "url": "https://x.com/sitinme/status/2121057715476656323", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2121057715476656323", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Horizon 日报工具配置与成本控制", "evidence": "入口先卡住，比事后靠门槛筛便宜", "rationale": "提供评分成本、安装限制和文档差异等具体经验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121206385471844682", "track": "tools", "source": {"id": "2121206385471844682", "text": "哎，去年我教大家 40 块办个“永久”手机号，后来被官方偷偷改了～\n\n爱沙尼亚的号，当时那条教程写的是“40 块搞定一个永久保号”，38万次浏览。今年 1 月，官方悄悄把永久改成了一年，想留着的话，每年最低还得充 5.75 美金。我发了条“翻车了”的提醒，1 万多次浏览。\n\n估计还有不少人，现在还以为那个号是永久的（我也没法一个个通知）。\n\n以前在线下买东西，什么假包，假烟假酒，你们应该不少人买到过，这些东西是实体，发现了还能去退去换，但现在～👇👇\n\n买 AI 也开始有这个问题了，你调用的这个模型，真的是你以为的那个吗？就算名字和版本没错，但不同供应商的价格，速度，稳定性也可能不一样。\n有时候用着用着效果变了，也没人能告诉你，感知很弱，你的第一反应是怀疑自己提示词写崩了，改半天，最后也不知道是谁的问题。\n\n百度刚发布了个平台叫词元所，提供开放的模型资源交易。我在官网看了下，同一个 DeepSeek，5 家在卖，价格差 2 倍，每秒输出慢的十几个 token，快的一百三十多个。最便宜的，第一个字出来得很快，成功率也在 99.9% 以上。这种东西以前只能自己一家家试。\n\n这个平台不是单纯的中转货架，还会做资源“验真”和提供方的“征信”。据他们介绍，后面是模型指纹比对，定期抽检，持续监测，给每家供应商做“验真”，再记成“信用记录”，评级变了还会提示用户。我点开三份验货报告，评级都是“优信”，有一份 7 项指标里 3 项没达到入驻时测出来的水平，页面上直接写着红色的“未达标”。\n\n爱沙尼亚那个号，要是当时有人这么盯着，我估计早知道了。\n\n当然现在还早，最便宜那家的报告按钮现在是灰的，有些指标写着“暂无数据”，评分的及格线页面也没写，这几点后续应该会补。\n\n也不知道大家调用中转站api的时候，都是怎么确保他们没掺水的？", "createdAt": "Fri Nov 13 11:39:47 +0000 2026", "replyCount": 11, "retweetCount": 1, "likeCount": 21, "conversationId": "2121206385471844682", "author": {"username": "AI_Jasonyu", "name": "鱼总聊AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1877193368725581824/7_ocNC-C_normal.jpg"}, "authorId": "756319701861601281", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXAJ6qsXYAAHa9U.png", "width": 1200, "height": 683, "previewUrl": "https://pbs.twimg.com/media/HXAJ6qsXYAAHa9U.png:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXAJ8ZgXAAAMLDO.png", "width": 1024, "height": 1536, "previewUrl": "https://pbs.twimg.com/media/HXAJ8ZgXAAAMLDO.png:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "鱼总聊AI", "role": "出海、SEO 与增长实践与观察", "why": "有自己的 KOL 匹配工具和接口实测，覆盖分发、广告及增长产品。", "handle": "AI_Jasonyu"}, "createdAtIso": "2026-11-13T11:39:47+00:00", "createdAtBeijing": "2026-11-13T19:39:47+08:00", "createdAtLocal": "11-13 19:39 北京", "url": "https://x.com/AI_Jasonyu/status/2121206385471844682", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2121206385471844682", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "模型供应商验真与交易平台体验", "evidence": "7 项指标里 3 项没达到入驻时测出来的水平", "rationale": "提供供应商比较、验真体验及数据缺口"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1877193368725581824/7_ocNC-C_normal.jpg"}, {"id": "2121092767665598477", "track": "research", "source": {"id": "2121092767665598477", "text": "Decision Models are the future of agentic security. They can process billions of tokens of telemetry, identify security issues, and help you patch fixes at a scale and cost structure not possible before.  We’ve open sourced our models and made it free on Openrouter for a week.", "createdAt": "Fri Nov 13 04:08:18 +0000 2026", "replyCount": 73, "retweetCount": 40, "likeCount": 507, "conversationId": "2121092767665598477", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2121079799766556677", "text": "Neat example of how Perplexity used Decider internally\n\nIn one day it read 1B tokens across 7,000 agent sessions and found flaws that led to 14 fixes to their agent security rules.\n\nBoth models are Apache-licensed and free on OpenRouter until Nov 19", "createdAt": "Fri Nov 13 03:16:46 +0000 2026", "replyCount": 6, "retweetCount": 8, "likeCount": 98, "conversationId": "2121079799766556677", "author": {"username": "alexatallah", "name": "Alex Atallah", "profileImageUrl": "https://pbs.twimg.com/profile_images/1887176916849074178/kjnDV4rw_normal.jpg"}, "authorId": "54317637", "translationZh": "Perplexity 内部使用 Decider 的一个精彩案例：\n\n它在一天内读取了 7,000 次智能体会话中的 10 亿 token，发现的漏洞促成了对智能体安全规则的 14 项修复。\n\n两款模型均采用 Apache 许可证，在 OpenRouter 上可免费使用至 11 月 19 日。"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-13T04:08:18+00:00", "createdAtBeijing": "2026-11-13T12:08:18+08:00", "createdAtLocal": "11-13 12:08 北京", "url": "https://x.com/AravSrinivas/status/2121092767665598477", "themeId": "editorial", "signalScore": 90, "editorial": {"id": "2121092767665598477", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "开放决策模型及 Agent 安全审计案例", "evidence": "Both models are Apache-licensed", "rationale": "含模型开放发布与量化审计成果，成效为自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Decision Models 是智能体安全的未来。它们能够处理数十亿 token 的遥测数据，识别安全问题，并帮助你修复漏洞，实现以往无法企及的规模和成本水平。我们已将模型开源，并在 Openrouter 上提供一周免费使用。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2121295213025194172", "track": "agent", "source": {"id": "2121295213025194172", "text": "make secure purchases with your dot, in partnership with American Express, Mastercard, and Visa", "createdAt": "Fri Nov 13 17:32:45 +0000 2026", "replyCount": 123, "retweetCount": 21, "likeCount": 731, "conversationId": "2121295213025194172", "author": {"username": "gdb", "name": "Greg Brockman", "profileImageUrl": "https://pbs.twimg.com/profile_images/1347621377503711233/bHg3ipfD_normal.jpg"}, "authorId": "162124540", "quotedTweet": {"id": "2121283151729496235", "text": "Now your dot can securely complete purchases on your behalf—with your approval.\n\nWith ChatGPT Wallet, agents pay without access to your actual card details. Every purchase requires a security check.\n\nChatGPT Wallet is rolling out starting today to dots, for Pro subscribers in the US.\n\nhttps://t.co/OnAl3SKQ3n", "createdAt": "Fri Nov 13 16:44:49 +0000 2026", "replyCount": 454, "retweetCount": 268, "likeCount": 3388, "conversationId": "2121283151729496235", "author": {"username": "ChatGPT", "name": "ChatGPT", "profileImageUrl": "https://pbs.twimg.com/profile_images/2081980424666935296/qU5G7mQg_normal.jpg"}, "authorId": "1714438092655149056", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121282439788331008/img/htD5nhmieyyh_0pT.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121282439788331008/img/htD5nhmieyyh_0pT.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121282439788331008/vid/avc1/3840x2160/KftUG598EvGnBVup.mp4?tag=29", "durationMs": 45209}], "translationZh": "现在，经你批准，你的 dot 就能安全地代你完成购物。\n\n借助 ChatGPT Wallet，智能体无需接触你的真实银行卡信息即可付款。每笔交易都必须通过安全检查。\n\nChatGPT Wallet 从今天起向美国 Pro 订阅用户的 dot 逐步开放。\n\nhttps://t.co/OnAl3SKQ3n"}, "expert": {"priority": "P0", "domain": "基座模型 / OpenAI", "name": "Greg Brockman", "role": "OpenAI / 联合创始人", "why": "技术演示、产品发布、平台方向的重要信号源", "handle": "gdb"}, "createdAtIso": "2026-11-13T17:32:45+00:00", "createdAtBeijing": "2026-11-14T01:32:45+08:00", "createdAtLocal": "11-14 01:32 北京", "url": "https://x.com/gdb/status/2121295213025194172", "themeId": "editorial", "signalScore": 98, "editorial": {"id": "2121295213025194172", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "ChatGPT Wallet 代理支付发布", "evidence": "Every purchase requires a security check.", "rationale": "宣布代理支付上线，说明授权机制与开放范围"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "携手 American Express、Mastercard 和 Visa，让你的 dot 安全购物"}, "avatar": "https://pbs.twimg.com/profile_images/1347621377503711233/bHg3ipfD_normal.jpg"}, {"id": "2121300716925182230", "track": "agent", "source": {"id": "2121300716925182230", "text": "Check out Automations in the new Omnigent release! They make it easy to create software factories where agents automatically handle bug reports, pull requests, etc using any mix of coding agents you want (Codex, Claude Code, etc).", "createdAt": "Fri Nov 13 17:54:37 +0000 2026", "replyCount": 11, "retweetCount": 3, "likeCount": 37, "conversationId": "2121300716925182230", "author": {"username": "matei_zaharia", "name": "Matei Zaharia", "profileImageUrl": "https://pbs.twimg.com/profile_images/787317891867693061/isUFxFC1_normal.jpg"}, "authorId": "201130645", "quotedTweet": {"id": "2121275320883950025", "text": "Omnigent 0.22.0 is now available. 🎉\n\n⚡ Automations can run on a schedule or start from Jira, Slack, GitHub, Linear, or PagerDuty events.\n🔍 The PR Changes tab adds file filters, diff search, viewed-file tracking, and per-commit diffs.\n💬 Tag sessions, sub-agents, and files in the composer.\n🗂️ Agents spawned through the Omnigent MCP or created on the same managed sandbox now nest in the sidebar.\n📦 New AWS Lambda MicroVMs sandbox provider.\n\nFull release notes ⤵️\nhttps://t.co/YB7gfuB3I5", "createdAt": "Fri Nov 13 16:13:42 +0000 2026", "replyCount": 0, "retweetCount": 4, "likeCount": 19, "conversationId": "2121275320883950025", "author": {"username": "omnigent_ai", "name": "Omnigent", "profileImageUrl": "https://pbs.twimg.com/profile_images/2077430840078819328/vMYcQMg__normal.jpg"}, "authorId": "2062538332341456896", "translationZh": "Omnigent 0.22.0 现已发布。🎉\n\n⚡ Automations 支持定时运行，也可由 Jira、Slack、GitHub、Linear 或 PagerDuty 事件触发。\n🔍 PR Changes 标签页新增文件筛选、差异搜索、已查看文件跟踪，以及按提交查看差异的功能。\n💬 在输入框中引用会话、子智能体和文件。\n🗂️ 通过 Omnigent MCP 启动或在同一托管沙箱中创建的智能体，现在会在侧边栏中嵌套显示。\n📦 新增 AWS Lambda MicroVMs 沙箱提供商。\n\n完整更新说明 ⤵️\nhttps://t.co/YB7gfuB3I5"}, "expert": {"priority": "P0", "domain": "AI 基础设施 / 数据与 ML 平台", "name": "Matei Zaharia", "role": "Databricks 联合创始人；Berkeley", "why": "ML 数据平台、Spark、MLflow、Lakehouse + AI", "handle": "matei_zaharia"}, "createdAtIso": "2026-11-13T17:54:37+00:00", "createdAtBeijing": "2026-11-14T01:54:37+08:00", "createdAtLocal": "11-14 01:54 北京", "url": "https://x.com/matei_zaharia/status/2121300716925182230", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2121300716925182230", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Omnigent 0.22.0 自动化发布", "evidence": "Omnigent 0.22.0", "rationale": "明确发布事件触发、多代理编排及审查功能"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "来看看新版 Omnigent 中的 Automations！它让你轻松搭建软件工厂，自由组合 Codex、Claude Code 等编程智能体，自动处理缺陷报告、拉取请求等任务。"}, "avatar": "https://pbs.twimg.com/profile_images/787317891867693061/isUFxFC1_normal.jpg"}, {"id": "2121358640418635989", "track": "research", "source": {"id": "2121358640418635989", "text": "Today on Connectionism: how we trained Inkling 2 Small with a native 4-bit forward pass on @nvidia GB300s, from the first pretraining step through the final RL rollout, one of the many improvements across the stack that took pretraining from weeks to 68 hours.", "createdAt": "Fri Nov 13 21:44:47 +0000 2026", "replyCount": 20, "retweetCount": 34, "likeCount": 373, "conversationId": "2121358640418635989", "author": {"username": "miramurati", "name": "Mira Murati", "profileImageUrl": "https://pbs.twimg.com/profile_images/2057853902918455296/D_nfq15L_normal.jpg"}, "authorId": "180115578", "quotedTweet": {"id": "2121353292878110868", "text": "Training with fewer bits is faster, but quantization error can interfere with learning.\n\nToday on Connectionism, we detail how we trained Inkling 2 Small with a native 4-bit forward pass from the first step of pretraining through the final RL rollout.\nhttps://t.co/CIMECSEpD0", "createdAt": "Fri Nov 13 21:23:32 +0000 2026", "replyCount": 20, "retweetCount": 92, "likeCount": 582, "conversationId": "2121353292878110868", "author": {"username": "thinkymachines", "name": "Thinking Machines", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075275500420001792/Q9J4M1DL_normal.jpg"}, "authorId": "1891523745929732096", "translationZh": "使用更低位宽训练速度更快，但量化误差可能干扰学习。\n\n今天，我们在 Connectionism 详细介绍如何训练 Inkling 2 Small，从预训练的第一步到强化学习的最后一次 rollout，全程采用原生 4 位前向传播。\nhttps://t.co/CIMECSEpD0"}, "expert": {"priority": "P1", "domain": "AI 研究 / 安全", "name": "Mira Murati", "role": "Thinking Machines Lab / 创始人兼 CEO", "why": "新前沿实验室，研究和产品战略值得持续跟踪", "handle": "miramurati"}, "createdAtIso": "2026-11-13T21:44:47+00:00", "createdAtBeijing": "2026-11-14T05:44:47+08:00", "createdAtLocal": "11-14 05:44 北京", "url": "https://x.com/miramurati/status/2121358640418635989", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2121358640418635989", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Inkling 2 Small 原生四位训练", "evidence": "native 4-bit forward pass", "rationale": "自述贯穿预训练与强化学习的四位训练成果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "今天的 Connectionism：我们如何在 @nvidia GB300 上训练 Inkling 2 Small，从预训练的第一步到强化学习的最后一次 rollout，全程采用原生 4 位前向传播。这是我们对整个技术栈所做的众多改进之一，让预训练耗时从数周缩短至 68 小时。"}, "avatar": "https://pbs.twimg.com/profile_images/2057853902918455296/D_nfq15L_normal.jpg"}, {"id": "2121271365718114515", "track": "research", "source": {"id": "2121271365718114515", "text": "Déjà vu\n\n在第一次经历某个瞬间时，却仿佛已经拥有了关于这一瞬间的回忆。\n\n在漩涡中的 NVIDIA 发布并开源了 Déjà View 的研究工作，仅 117M 参数，小而美而强大。\n\n若干时间后，当你再次看见 Nvidia 的或许已经完全改变的标志和产品，它的气味和气质，与你曾经深深喜爱的东西，十分相似。\n\n或许是因为曾经参与制造这种感觉的人非常伟大，这种感觉，更加难以忘掉。", "createdAt": "Fri Nov 13 15:57:59 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 22, "conversationId": "2121271365718114515", "author": {"username": "dongxi_nlp", "name": "Dongxi 东锡 NLP", "profileImageUrl": "https://pbs.twimg.com/profile_images/2089337602436444161/F8lWtWJZ_normal.jpg"}, "authorId": "1477948736156454913", "quotedTweet": {"id": "2120617173286883692", "text": "Meet Déjà View, a model that turns photos taken from different angles into 3D geometry and camera positions.\n\nBy looping a single transformer block, this 117M-parameter model matches or outperforms models up to 10x larger across five benchmarks, using comparable or less compute. Researchers can dial the number of loops to fit their compute budget.\n\n#NeurIPS2026 oral paper + code: https://t.co/4jiCRA71Oo", "createdAt": "Wed Nov 11 20:38:27 +0000 2026", "replyCount": 60, "retweetCount": 110, "likeCount": 973, "conversationId": "2120617173286883692", "author": {"username": "NVIDIAAI", "name": "NVIDIA AI", "profileImageUrl": "https://pbs.twimg.com/profile_images/2055340743552831488/me-KUIug_normal.png"}, "authorId": "740238495952736256", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120616346136563712/img/dOYqfqajmpOffWHJ.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120616346136563712/img/dOYqfqajmpOffWHJ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120616346136563712/vid/avc1/1920x1080/IKZj0L0aU25Pppm-.mp4?tag=29", "durationMs": 29750}], "translationZh": "认识一下 Déjà View：这个模型能将不同角度拍摄的照片转换为三维几何结构和相机位置。\n\n通过循环使用单个 Transformer 模块，这个拥有 1.17 亿参数的模型，在五项基准测试中达到或超越了参数规模最高为其 10 倍的模型，计算量却相当或更少。研究人员可以调整循环次数，以适配自己的计算预算。\n\n#NeurIPS2026 口头报告论文及代码：https://t.co/4jiCRA71Oo"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "东锡", "role": "模型、研究与推理实践与观察", "why": "有 SFT、loss mask 等训练细节解读，补中文模型工程教育。", "handle": "dongxi_nlp"}, "createdAtIso": "2026-11-13T15:57:59+00:00", "createdAtBeijing": "2026-11-13T23:57:59+08:00", "createdAtLocal": "11-13 23:57 北京", "url": "https://x.com/dongxi_nlp/status/2121271365718114515", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "212127136 粗大链环组成、表面抛光的厚重金链散发耀眼光芒与火花，在空中绕着她的身体盘旋成巨大的环形，前景中最近的链环朝画面左下缘延伸，显得格外巨大，并拖曳出明亮的金色粒子轨迹。一束温暖的金色体积光如聚光灯般从上方洒落，光柱中浮动着尘埃与余烬。背景漆黑，氛围幽暗。戏剧性的低调照明、强烈的轮廓光与辉光，以深绯红、熔金色和黑色构成统一色调，史诗感、神话感与舞台感兼具，强大而性感。天鹅绒、金属和皮肤纹理极其细腻，浅景深，面部与锁链清晰对焦，融合电影级奇幻摄影与数字艺术，8k，细节繁复精致。"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-11-13T01:18:25+00:00", "createdAtBeijing": "2026-11-13T09:18:25+08:00", "createdAtLocal": "11-13 09:18 北京", "url": "https://x.com/indie_maker_fox/status/2121050017360384181", "themeId": "editorial", "signalScore": 46, "editorial": {"id": "2121050017360384181", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "暗黑奇幻金链人像提示词", "evidence": "Dramatic low-key lighting", "rationale": "提供低角度构图、链条透视与光影细节"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2121225063425024406", "track": "agent", "source": {"id": "2121225063425024406", "text": "把 AI 助手变成一个聊天团队，还给它们配上能干活的电脑\n\n很多 AI 工具，你问它怎么做，它能给你讲一大堆，但真正打开网页、整理文件、把事情做完，还是得自己来。\n\n另一种麻烦是，你已经有好几个 AI 工具：一个擅长写代码，一个适合研究，一个用来处理日常工作。\n\n但它们分散在不同窗口里，项目背景要反复交代，任务进度也不容易统一查看。\n\nOpenMausBot 想解决的，就是这些问题。\n\nOpenMausBot 由 GitHub 用户 milind-soni 维护，也使用 MausBot 这个名字，曾叫 OpenGrokBot。官方将其定位为开源的 Grok Bot 替代方案\n\n它把 AI 做成类似即时通信软件的样子：左边是一列机器人联系人，每个机器人可以有自己的角色、模型、记忆和工作环境。\n\n你给它发消息，它可以调用工具、操作浏览器、处理文件，必要时还会弹出审批卡片，询问是否允许继续。\n\n你可以给这些机器人安排不同的工作，比如一个查资料，一个写内容，一个检查结果，还能分别选择不同的模型。\n\n需要操作时，它们可以调用工具、连接应用，或者使用本机、隔离桌面和云电脑。你能看到它们的工作过程，也可以设置哪些操作需要先经过自己确认。\n\n它把原本分散的 AI 工作流程放到了一起。比如研究一个开源项目，可以让它查官方文档、整理更新和社区反馈，再输出一份带来源的报告。\n\n做顺手之后，还可以把流程保存成技能，或者设置成定时任务，减少重复操作。", "createdAt": "Fri Nov 13 12:54:00 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 0, "conversationId": "2121225063425024406", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2110975023531839754", "text": "最近 Grok Bot 玩得挺上头，我自己也养了十几个机器人，让它们负责内容创作、竞品监控、写代码、数据分析，甚至还能互相协作。确实好用，但问题也很现实：用量一上来，费用也跟着涨。\n\n现在，DeepSeek 这边也有了：DeepSeek Bot（简称 DS Bot）。思路几乎一样，开源、免费，模型用你自己的 DeepSeek。\n\nDeepSeek 官方 8 月开源了一个 Agent 工具，叫 DeepSeek Harness（简称 DSH），能读文件、跑命令、调工具，功能都做成插件往里装。\n\nDS Bot 是社区开发者给 DSH 做的一个插件，项目主页写明了不是官方产品。它的定位就一句话：给 DSH 用的一支常驻 Bot 团队，有主 Bot、Bot 之间互发消息和群聊。\n\n打开 DS Bot，有一个现成的主 Bot 叫 Chief。跟它说一句：\n帮我搭一个小团队：一个叫“写手”的 Bot，负责写和改博客文章；一个叫“程序员”的 Bot，负责写代码和审代码。\n\n然后拉一个群，把它俩都放进去。\n\nChief 就把两个 Bot 建好，又拉了一个群，自己当管理员。", "createdAt": "Fri Oct 16 06:04:00 +0000 2026", "replyCount": 10, "retweetCount": 7, "likeCount": 42, "conversationId": "2110975023531839754", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUtyiO4akAApyFQ.jpg", "width": 1080, "height": 663, "previewUrl": "https://pbs.twimg.com/media/HUtyiO4akAApyFQ.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUtyiOvacAAeUuN.jpg", "width": 1016, "height": 655, "previewUrl": "https://pbs.twimg.com/media/HUtyiOvacAAeUuN.jpg:small"}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120424171461345280/img/x07NynheumgBrUq3.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120424171461345280/img/x07NynheumgBrUq3.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120424171461345280/vid/avc1/1920x1080/Vbr3n-yWbgpGD82z.mp4?tag=29", "durationMs": 319310}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-13T12:54:00+00:00", "createdA const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
