<script>
const DATA={"records": [{"id": "2119269064543445168", "track": "agent", "source": {"id": "2119269064543445168", "text": "Anthropic 拆解智能体记忆：Claude 边干边记，再靠“做梦”回头纠错整理\n\nAnthropic 工程团队 11 月 6 日发文，讲他们怎么给 Claude 设计跨会话的记忆。难点在于：Claude 得在当下决定什么值得记，可它并不知道以后会用到什么。\n\n他们的办法是加一个后台步骤，叫“做梦”（dreaming）：会话结束后，让 Claude 回头翻原始对话记录，改掉记错的笔记，把零散笔记整理成更好找的形式。这有点像人睡觉时大脑回放白天的经历，把一部分沉淀成长期知识。\n\n• 新模型明显更会用记忆：在一个查数据库答题的测试里，Sonnet 4.6 有记忆只从 0.330 涨到 0.364，Opus 5 从 0.564 涨到 0.828（满分 1）\n• 玩宝可梦红版，Sonnet 3.7 写了 413 个记忆文件，只拿到 1 枚徽章；Fable 5 只写了 10 个文件，拿到 4 枚\n• 一条记错的笔记经“做梦”改正后，Claude 走出了月见山；没改的那次三次掉回原路，最后也没到下一座城\n\n【记忆分四层】\n\n文章给“智能体记忆”的定义是：Claude 从经历中学到、跨会话保留、存成以后能读的内容。改模型权重、单次对话里临时学到的东西、上下文快满时把旧对话压成摘要，这三种都不算。\n\n按 Anthropic 的划分，记忆从下到上分四层：最底下是原始会话记录，可以搜索；往上是 Claude 自己写的记忆笔记；再往上是整理出来的结构，比如互相链接的 wiki；最顶层是每次开新会话就自动塞进上下文的内容。“做梦”负责把下层的东西核对、提炼，再往上送。\n\n【会挑比记得多更重要】\n\n宝可梦测试最能说明问题。Sonnet 3.7 觉得什么都可能有用，每场战斗、每个道具、每个路人都单独建文件，玩到 1 万步左右，记忆已有近 98 万字符。那时它开始建第四个“总”文件夹，接下来 17 步新建 6 个文件、删掉 9 个，一步游戏都没玩。\n\nFable 5 只记屏幕上看不到的东西。钱和位置每回合都能从画面读出来，记下来多余，还很快过期；策略和验证过的规律只有自己总结出来才存在。它用一个 global.md 当总控台，写着当前目标、打道馆的计划和自己的记忆规则。七个精灵球都没抓到鲤鱼王之后，它记下：“连续 3 球失败，就改变节奏，在菜单步骤之间多按几下等待。”Opus 5.5 用类似的小文件夹，边玩边改，最后通关。\n\n数据库测试里，每道题都开新会话，只有记忆文件夹能带过去，答完会被告知正确答案。Sonnet 4.6 只会堆一堆没验证的猜测。Anthropic 说 Opus 5 是这批模型里第一个形成完整学习循环的：大多数笔记写了规则、怎么确认它成立、以前的答案，还有踩过的坑。\n\n【给开发者的几条经验】\n\n告诉 Claude 记忆是干什么的，别规定怎么记。只说一句“有个记忆文件夹可用”，Opus 4.7 和 Opus 5 就用得很好；加一条“只记录失败”，两者都丢掉了记忆带来的大部分提升。\n\n老模型需要点拨。让 Sonnet 4.6 答题前先读记忆、并验证自己的猜测，得分从 0.364 涨到 0.641。Sonnet 5 不用提醒，10 次里有 9 次会自己先读。\n\n自动加载的那一层要小。它每次都占 token，错一条会被带进每个会话，而且指令文件越长，模型越不容易照做。Claude Code 的自动记忆只加载 MEMORY.md 的前 200 行或 25KB，这部分当目录用，细节放在下层，留个链接。\n\n多个 agent 并行时别写同一个文件。在一个收购合同测试里，四个 agent 同时往一张共享条款表里写，互相覆盖，57 条要点只留住 41 条。改成每份合同一页、一个 agent 负责、条款原文照抄，57 条全部保住。\n\n【“做梦”还能建 wiki】\n\nAnthropic 用 5 月收购的软件公司 Stainless 的约 35 万份内部文件（约 4.2 亿 token）做测试，让 Opus 5 分 128 次会话持续整理成 wiki，再回答 25 个问题。只靠 wiki，得分从 13% 涨到 48%；只靠搜索是 53%；wiki 加搜索从 54% 涨到 61%，每题还省约 2 万 token。\n\nwiki 适合需要跨文档拼信息的问题。一组 24 题的并购问答，过半要综合多份文件，用 wiki 答对 87%，只用搜索是 73%。答案在单份文件里就能搜到的任务，wiki 没有明显帮助；有一次 wiki 写到 203KB，比 115KB 的原始文件还大。\n\n【能不能用上】\n\n“做梦”已经是 Claude Managed Agents（Anthropic 托管的 agent 运行服务）里的功能，目前是研究预览，要申请才能用；跨会话的记忆库功能是 beta。Anthropic 也放出了 cookbook，教开发者用自己的提示词和模型搭一套。\n\n以上数字都来自 Anthropic 自己的测试，宝可梦的对比是每个模型各跑一次。文章也说，“做梦”要额外花算力，记忆该多久复查一次、在干活时记还是事后整理，都还没有定论。\n\n原文：https://t.co/om01JMciNI", "createdAt": "Sun Nov 08 03:21:33 +0000 2026", "replyCount": 83, "retweetCount": 37, "likeCount": 212, "conversationId": "2119269064543445168", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2118814753154064501", "text": "Memory is what allows Claude to learn from experience. In a new Engineering Blog post, we share how “dreaming” helps Claude organize what it’s learned, correct its mistakes, and find what it needs more easily the next time. https://t.co/uUEN4bNkr9", "createdAt": "Fri Nov 06 21:16:17 +0000 2026", "replyCount": 992, "retweetCount": 1271, "likeCount": 13923, "conversationId": "2118814753154064501", "author": {"username": "AnthropicAI", "name": "Anthropic", "profileImageUrl": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg"}, "authorId": "1353836358901501952", "translationZh": "记忆让 Claude 能够从经验中学习。在最新的工程博客文章中，我们分享了“做梦”如何帮助 Claude 整理所学、纠正错误，并在下次更轻松地找到所需信息。https://t.co/uUEN4bNkr9"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWknr2eXoAAztrQ.jpg", "width": 1176, "height": 1814, "previewUrl": "https://pbs.twimg.com/media/HWknr2eXoAAztrQ.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWkn5NlXoAATbV_.jpg", "width": 1176, "height": 1560, "previewUrl": "https://pbs.twimg.com/media/HWkn5NlXoAATbV_.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-08T03:21:33+00:00", "createdAtBeijing": "2026-11-08T11:21:33+08:00", "createdAtLocal": "11-08 11:21 北京", "url": "https://x.com/dotey/status/2119269064543445168", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2119269064543445168", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "智能体跨会话记忆与后台纠错整理", "evidence": "多个 agent 并行时别写同一个文件", "rationale": "包含记忆架构、对照测试与工程经验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119311344260583683", "track": "creative", "source": {"id": "2119311344260583683", "text": "[开源分享] rea-video\n\n让 Agent 可以逆向、拆解和复刻任意视频，作者 @yao_june12106 \n\n之前合作的团队做 Video Editing Agent，其中也有「爆款复刻」这个环节，当时还想作为产品主打给电商场景的卖点，这才几个月，都有很多开源实现免费分享出来了。\n\nhttps://t.co/nI03gzTwzo\n\n# 一起看看逆向的重要流程和实际实现，再根据你的具体逆向场景，做微调就行\n\n1. 先用本地工具拆解。 逐帧检测颜色、像素和亮度变化，识别切镜头；再分析运动、噪声、重复帧、文字和音频。本地规则先给出制作类型的初步判断及证据，这部分不消耗大模型 token。\n\n2. 再让多模态模型解释。 默认按镜头分析；同一次拍摄被跳切分开的片段，可以合并请求。每次通常发送低分辨率视频片段、首尾帧和中间帧拼图，并附上本地特征摘要，让模型输出画面描述、制作方式及复刻提示词。默认还会单独分析一次带音频的整片，理解整体结构和声音。\n\n3. 最后由 Claude／Codex 复核。 Agent 查看镜头拼图和分析结果，修正分类、补充依据，再生成报告。因此最终结论来自“本地测量＋模型分析＋Agent 复核”，而不直接恢复原始工程。", "createdAt": "Sun Nov 08 06:09:34 +0000 2026", "replyCount": 18, "retweetCount": 2, "likeCount": 14, "conversationId": "2119311344260583683", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWlOaNFaoAAVDjz.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWlOaNFaoAAVDjz.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-08T06:09:34+00:00", "createdAtBeijing": "2026-11-08T14:09:34+08:00", "createdAtLocal": "11-08 14:09 北京", "url": "https://x.com/shao__meng/status/2119311344260583683", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2119311344260583683", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "rea-video 视频逆向与复刻流程", "evidence": "本地测量＋模型分析＋Agent 复核", "rationale": "提供视频拆解实现流程及复刻边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119317012937834668", "track": "creative", "source": {"id": "2119317012937834668", "text": "poteto 给我们分享：不懂音乐术语，也能与 AI 一起把创意变成音乐系统\n\n这可能是咱们很多不懂音乐专业的产品研发们的真实痛点：我知道想要什么、却缺少专业词汇、不知道它的音乐名词是什么！这时可以先让 AI 帮你明确需求，再进入制作。\n\n# 不急着执行，先确认双方想的是同一件事\n\npoteto 没有音乐制作经验，起初只能描述：想要 Game Boy 风格，同一主旋律的不同变奏能无缝衔接，类似玩《原神》时的体验。\n\n她直接告诉 Grok Bot：“我缺少描述自己想法的词汇。”随后用 /sharpen 深化需求，再用 /in-your-own-words 让 Agent 复述目标，检查理解是否一致。\n\n这两个 skills 不是作曲工具，是在补齐创作前的沟通。制作解释视频时，作者也先确认分镜和动态分镜草稿，再制作完整版本。\n\n# 实现的不是单首配乐，是随游戏变化的音乐系统\n\n按 poteto 说明，声音通过浏览器的 AudioWorklet 实时合成，结合 Game Boy 风格声部、低音、铺底和鼓，并加入延迟与混响。\n\n曲目统一为 128 BPM，不同区域和首个 Boss 的配乐围绕同一主题变化，随游戏强度逐层加入声部。需要区分的是：音符来自预先写好的序列，不是 AI 在游戏运行时即兴作曲。\n\n# “无缝衔接”最终要变成具体规则\n\n系统使用两个播放通道，按小节和乐句安排切换，并分别处理旋律与伴奏。同主题变奏可以叠加，其他组合则采用保留旧旋律、先换新伴奏等方式，避免直接切歌。\n\n这说明，一个模糊的审美要求，最终需要落实为节奏、声部和切换规则，才能稳定执行。", "createdAt": "Sun Nov 08 06:32:05 +0000 2026", "replyCount": 5, "retweetCount": 2, "likeCount": 4, "conversationId": "2119317012937834668", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119313621188849806", "text": "i asked grok bot to make a video about how the music in https://t.co/sa18sM28uD was made! i started by clumsily describing something i wanted (i have 0 experience making music): gameboyish music, seamlessly transitioning between variations of a main melody like another game i had played (genshin)\n\none prompt i tried that helped me communicate my goal better was telling bot \"i lack the vocabulary to describe what i want\" and using the /sharpen skill from pstack. then the /in-your-own-words skill helped me confirm whether or not it understood what i was trying to say\n\ni also used this same trick when making this video, so my agent produced a storyboard and animatic before working on the full thing\n\nknowing the right words is very powerful", "createdAt": "Sun Nov 08 06:18:36 +0000 2026", "replyCount": 151, "retweetCount": 61, "likeCount": 1279, "conversationId": "2119313621188849806", "author": {"username": "poteto", "name": "lauren", "profileImageUrl": "https://pbs.twimg.com/profile_images/2049256514091929600/Qu4030T2_normal.jpg"}, "authorId": "2832427459", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119311856565391360/img/a5edNvpINOvshceC.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119311856565391360/img/a5edNvpINOvshceC.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119311856565391360/vid/avc1/1920x1080/kGtHxkldPKgtzy8i.mp4?tag=29", "durationMs": 230633}], "translationZh": "我让 grok bot 做了一段视频，介绍 https://t.co/sa18sM28uD 中的音乐是怎么制作的！一开始，我磕磕绊绊地描述自己想要的效果（我完全没有音乐制作经验）：带点 Game Boy 风格的音乐，像我玩过的另一款游戏（genshin）那样，在主旋律的不同变奏之间无缝切换。\n\n有一个提示帮我更清楚地表达了目标：告诉 bot“我缺乏描述自己想法所需的词汇”，然后使用 pstack 的 /sharpen 技能。接着，/in-your-own-words 技能帮我确认它是否理解了我的意思。\n\n制作这段视频时，我也用了同样的方法，让智能体先生成分镜脚本和动态分镜，再开始制作完整视频。\n\n掌握准确的表达，力量很大。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWlTk6ObAAAh1LZ.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWlTk6ObAAAh1LZ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-08T06:32:05+00:00", "createdAtBeijing": "2026-11-08T14:32:05+08:00", "createdAtLocal": "11-08 14:32 北京", "url": "https://x.com/shao__meng/status/2119317012937834668", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2119317012937834668", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI协作制作自适应游戏音乐", "evidence": "系统使用两个播放通道", "rationale": "给出需求澄清提示及音乐合成切换规则"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119283516143776186", "track": "research", "source": {"id": "2119283516143776186", "text": "Anthropic 分析 20 万次科研会话：科学家用 Claude 最多的是分析数据和写论文，他们最看重的提想法反而用得最少\n\nAnthropic 11 月 4 日发布研究报告，统计了 2026 年 8 月 2 日到 9 月 30 日约 20.7 万次科研相关的 Claude 会话，看科学家拿 AI 干什么，以及 AI 能让科研快多少。\n\n先说结论：\n\n• 分析数据是第一大用途，占 Claude 科研会话的三分之一，Claude Code 的近一半\n• 科学家认为最重要的两件事，提出想法和收集数据，用 AI 最少\n• 现有 AI 能力如果普及开来，部分领域科研产出最多翻一倍；要是 AI 能包揽所有不用动手的工作，计算机、统计能快约 15 倍，化学、生物只能快 3 到 4 倍，因为实验还得有人在实验室做\n\n【数据怎么来的】\n\n样本来自个人订阅用户，聊天和 Cowork 里 12.9 万次，Claude Code 里 7.8 万次。研究团队让模型给每段会话打上“化学”“数据清洗”这类标签，研究内容本身不保存。\n\n【用在哪：分析和写作多，想点子少】\n\n报告拿每类工作的 AI 用量，和科学家花在这类工作上的时间对比。\n\n分析数据占科研时间约 28%，在 Claude 上占 33.7%，在 Claude Code 上占 48.1%。写作和沟通只占科研时间 16%，在 Claude 上占 32%，单项最多的任务是起草论文。\n\n收集数据占科研时间 28.6%，在 Claude 上只占约 12%，临床样本、生化数据这类要动手采集的尤其少。提出想法和假设占科研时间 7.1%，在 Claude 上占 4.2%，Claude Code 上只有 2.1%。\n\nAnthropic 还调查了 528 位科学家，请他们给四类工作的重要性分配 100 分。提想法拿 35.6 分排第一，收集数据 23.6 分排第二。\n\n报告的解释是：收集数据大多要动手；提想法，科学家可能更愿意自己来，AI 在挑研究问题上也可能确实更弱。\n\n【AI 越擅长的活，用得越多】\n\n研究团队给 7000 多项科研任务各打了一个“AI 能力分”：把任务拆成步骤，让模型两两比较哪一步 AI 做得更好，再用类似国际象棋等级分的办法算出排名。\n\n然后算“使用倍数”：一项任务在 Claude 会话里的占比，除以它在科研时间里的占比。一项任务占科研时间 5%、占会话 10%，倍数就是 2，说明 AI 用量是按时间推算的两倍。\n\n能力分排前 20% 的任务，比如画数据图、做统计检验，Claude 上的使用倍数约 2，Claude Code 上约 4。排后 20% 的任务，比如提纯化学反应产物、实地观察研究对象，几乎没人用 AI。\n\n能力分高的任务有共同点：对错容易判断，能在电脑里大量模拟，反馈来得快。这正是最适合用强化学习训练 AI 的任务，两者的相关系数是 0.78。科学家在 AI 好用的地方用 AI。\n\n【Claude Science：专门做科研的版本】\n\nClaude Science 是 Anthropic 面向科研的产品，把 Claude 接上各种科研数据库和工具，比如查一个蛋白的结构、测过哪些药、有哪些相关试验，不用再一个个库分开查。付费用户都能用。\n\n它的会话一半以上来自生物医学和生物学。在这里，提出想法和假设占会话的 8%，约是普通 Claude 的两倍，和科学家实际花在这件事上的时间差不多。\n\n任务也更重。在生物和生物医学领域，Claude Science 上的活如果人自己干平均要 10.3 小时，普通 Claude 上是 4.9 小时；73% 的会话由 AI 高度自主完成，普通 Claude 只有 24%。\n\n【科研能快多少】\n\n报告估算了三种情况下，同样的科研经费能多出多少成果。\n\n第一种，现有 AI 能力被广泛用起来：AI 能接手 27% 到 52% 的科研时间，产出提升从艺术领域的 1.35 倍到统计学的 2.02 倍，计算机 1.96 倍。现在的 AI 多是帮忙或一起干，几乎每一步人都还得花不少时间，所以提升有限。\n\n第二、三种是 AI 包揽 75% 或全部不用动手的步骤。包揽全部时，统计、计算机、经济、数学、心理学，以及大部分社科和人文领域，都能到 15 到 16 倍。生物、化学、材料这些做实验的学科只有 3 到 4 倍：约 40% 的科研时间花在动手的步骤上，没有自动化实验室，这部分省不掉。\n\n16 倍左右是成本定下的上限。报告假设研究员每小时 95 美元，AI 每小时 30 美元，每替研究员省 1 小时 AI 要跑 0.2 小时，算下来 AI 干同样的活只花人工的约十六分之一。AI 成本减半，上限就翻倍。\n\n【科学家自己怎么看】\n\n528 位受访者里，38% 认为 AI 分析数据已经达到本领域顶尖研究者的水平。约 40% 预计 2030 年前 AI 能不靠人独立完成一个完整的研究项目，2035 年前这个比例约 64%，也有 16% 认为永远不会。\n\n受访者大多是美国和加拿大生命、健康科学领域的研究者，申请过 Anthropic 的科研资助，用 AI 比一般科学家多。三种加速情况是假设推算，报告说明它们不是预测。Claude Science 的任务更重，也可能因为用它的人本来需求就更专业。\n\n原文：https://t.co/lA8q7pQjSV", "createdAt": "Sun Nov 08 04:18:59 +0000 2026", "replyCount": 98, "retweetCount": 33, "likeCount": 182, "conversationId": "2119283516143776186", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWk1CgNW8AA0vnA.jpg", "width": 1120, "height": 1616, "previewUrl": "https://pbs.twimg.com/media/HWk1CgNW8AA0vnA.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWk1DygWsAAQoYe.jpg", "width": 1120, "height": 1250, "previewUrl": "https://pbs.twimg.com/media/HWk1DygWsAAQoYe.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWk1FpEXYAA-T_9.jpg", "width": 1120, "height": 1842, "previewUrl": "https://pbs.twimg.com/media/HWk1FpEXYAA-T_9.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWk1H3xXAAAsPkH.jpg", "width": 1120, "height": 1626, "previewUrl": "https://pbs.twimg.com/media/HWk1H3xXAAAsPkH.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-08T04:18:59+00:00", "createdAtBeijing": "2026-11-08T12:18:59+08:00", "createdAtLocal": "11-08 12:18 北京", "url": "https://x.com/dotey/status/2119283516143776186", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2119283516143776186", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Claude 科研使用研究与加速估算", "evidence": "约 20.7 万次科研相关的 Claude 会话", "rationale": "详述研究样本、任务分布及估算局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119291321878016199", "track": "research", "source": {"id": "2119291321878016199", "text": "当 Agent 太贵时，先别急着换模型。\n\n可能先整理一下它的「工作环境」，效果就已经很大。\n\nUC Berkeley、UChicago 和 Bespoke Labs 这篇 EnvOpt，提出了 Agent 优化的第三条路：\n\n模型参数之外有 Harness，Harness 之外还有 Environment。\n\n这里的 Environment，可以理解成 Agent 每天面对的那些东西：Slack、文档、数据库、代码仓库、工单，以及访问它们的工具。\n\nEnvOpt 会让一个 Research Agent 观察目标 Agent 的执行轨迹，然后直接改造这些环境：\n\n比如给上千个 SQL 文件建索引，把杂乱的数据整理成 SQLite，做一份工具 cheatsheet，或者提前给代码文件做优先级排序。\n\n模型和 Harness 都不动。\n\n只是让信息变得更容易找、更容易用。\n\n结果在 5 个 benchmark 上，Agent 成本平均降低 48%，成功率还基本保持或提升。\n\nAutomationBench 上更明显：Claude Haiku 4.5 的成本降低 72.7%，通过率还提升了 14.3 个百分点。\n\n而且优化后的环境还能迁移到更强的模型和不同 Harness 上。\n\n所以很多 Agent 的低效，可能来自它每天面对的信息组织得太差了。\n\n模型能力决定它会不会做，Harness 决定它怎么做，Environment 则决定它要先绕多少路，才能找到真正需要的信息。\n\n对于以后 Agent Engineering ，「整理环境」可能会变成和 Prompt、Memory、Harness 一样重要的一层。\n\n📎 arxiv: https://t.co/oZIVBxy1tW", "createdAt": "Sun Nov 08 04:50:00 +0000 2026", "replyCount": 16, "retweetCount": 8, "likeCount": 88, "conversationId": "2119291321878016199", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWiXoYaXMAAHnJc.jpg", "width": 1167, "height": 1203, "previewUrl": "https://pbs.twimg.com/media/HWiXoYaXMAAHnJc.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-08T04:50:00+00:00", "createdAtBeijing": "2026-11-08T12:50:00+08:00", "createdAtLocal": "11-08 12:50 北京", "url": "https://x.com/Xudong07452910/status/2119291321878016199", "themeId": "editorial", "signalScore": 81, "editorial": {"id": "2119291321878016199", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "EnvOpt 通过整理环境降低 Agent 成本", "evidence": "Agent 成本平均降低 48%", "rationale": "交代研究方法、环境改造示例及基准结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2119356506932125856", "track": "agent", "source": {"id": "2119356506932125856", "text": "Addy Osmani：Coding Agent 让你成了管理者，但不该让你更忙\n\n当你开始挑任务、交代背景、委派工作、验收结果，你已经在 “管理” Agents。多开几个会话本身意义不大，重要的是建立让 Agents 能自行验证、带着证据交付的工作方式。\n\n# 先让 Agent 能检查自己，而不是让人充当测试系统\n\nAddy 把自验证放在首位：每项任务都应提供可执行的检查，例如测试、构建、类型检查，界面改动还可以用截图验证。\n\nAgent 应先执行、检查、修正失败，再提交结果与证据，而不是说一句“完成了”，把所有验证留给人。必要时，再让没有参与原对话的新 Agent 独立审查，减少沿着同一思路自我认可。\n\n# 最该补充的是仓库里看不到的信息\n\n任务说明不必重复代码已有的内容，更重要的是：为什么做、业务约束是什么、哪些事情不要做，以及怎样才算成功。\n\n重复出现的纠错可以沉淀为共享规则或技能，但规则不是越多越好。随着模型升级，旧约束也要清理；普通偏好可以写成指导，必须遵守的安全要求则需要强制执行机制。\n\n# 并行的上限，往往是人的注意力\n\n无人值守任务开始前，要明确完成条件、验证方式、权限、运行上限、交付产物和审批人。新流程先小范围试跑，再扩大规模。\n\n即使测试全绿，功能也未必值得做。产品取舍、安全边界与发布判断仍由人负责；成效应看交付周期、返工和回退，而不是 Agent 写了多少代码。", "createdAt": "Sun Nov 08 09:09:01 +0000 2026", "replyCount": 10, "retweetCount": 5, "likeCount": 25, "conversationId": "2119356506932125856", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2119332146485891501", "text": "Your coding agents made you a manager", "createdAt": "Sun Nov 08 07:32:13 +0000 2026", "replyCount": 232, "retweetCount": 354, "likeCount": 3271, "conversationId": "2119332146485891501", "author": {"username": "addyosmani", "name": "Addy Osmani", "profileImageUrl": "https://pbs.twimg.com/profile_images/2090232066021769216/IwGLjoSy_normal.jpg"}, "authorId": "35432643", "article": {"title": "Your coding agents made you a manager", "previewText": "The skills for managing agents are pretty much the skills for managing a team, and you don't need to be a manager to learn them.\nIf you're spending all day with a coding agent, you are managing.", "titleZh": "你的编程智能体让你成了管理者", "previewTextZh": "管理智能体所需的技能，基本就是管理团队所需的技能，而你不必先当上管理者才能学习这些技能。\n如果你整天都在和编程智能体协作，你就在做管理。"}, "translationZh": "你的编程智能体让你成了管理者"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWl3gNda8AAZ6uK.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWl3gNda8AAZ6uK.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-08T09:09:01+00:00", "createdAtBeijing": "2026-11-08T17:09:01+08:00", "createdAtLocal": "11-08 17:09 北京", "url": "https://x.com/shao__meng/status/2119356506932125856", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2119356506932125856", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Coding Agent委派与自验证", "evidence": "每项任务都应提供可执行的检查", "rationale": "提供自验证、任务约束及并行管理方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2119361548833694060", "track": "agent", "source": {"id": "2119361548833694060", "text": "日常让 Agent 堆业务代码，很多人踩过的最大一个坑：\n\n  上下文塞得太满，Agent 开始“脑补默契”。\n\n  写到第十轮，模型以为自己什么都懂，架构漏洞全被历史对话掩盖过去；\n  一换新会话或者真正跑测试，全线崩盘。\n\n  Google 开源的这个 Elephant-Goldfish Model 插件，思路非常接地气，直戳多 Agent 协作的痛点。\n\n  它把这个过程暴力拆成了两个极端角色：\n\n  大象（Elephant）：长记忆。吃下你所有的业务背景、历史需求和全局代码，专门负责输出一份详尽的技术规格（Spec）。\n\n  金鱼（Goldfish）：零上下文。完全不带任何历史包袱，拿到的只有刚才那份 Spec，直接以“白盒新手”的视角去硬碰硬压测这份规格。\n\n  很多时候不是模型写不出代码，而是 Spec 根本没闭环：\n  - 是不是默认漏了环境变量？\n  - 接口边界有没有漏写兜底类型？\n  - 离开当前这个 prompt 堆出来的语境，这份 Spec 到底能不能独立跑通？\n\n  在金鱼子 Agent 面前，没有任何“历史会话假象”。\n  只要规格写得含糊，它一眼就能挑出断层。\n\n  在这个流派里，工作流节奏完全变了：\n\n  1. 大象 Agent 负责铺全局、起草规格；\n  2. 金鱼 Agent 无情挑刺，把模糊地带全逼出来；\n  3. 你作为人类工程师，在最关键的架构节点拍板、批准 Spec；\n  4. 规格锁死之后，再放给模型去刷代码。\n\n  不用等到代码写了三千行才发现地基打歪了。\n\n  官方说明里这套插件可以直接接入 Antigravity、Claude Code、Codex 和 ChatGPT 等主流环境。\n\n  对经常做多 Agent 流水线的人来说，这种“故意制造信息差”做对抗验证的思路，比单纯堆长上下文管用得多。\n\n  项目地址：\n  https://t.co/xU6KAozW2Q", "createdAt": "Sun Nov 08 09:29:03 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 6, "conversationId": "2119361548833694060", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2119203243054023129", "text": "Check out Google's Elephant-Goldfish Model, our new open-source plugin → https://t.co/eIWb2HAeDt\n\nDraft specs with deep-context agents and stress-test them with zero-context subagents before writing code. You make the architectural decisions and approve the spec before implementation. Works with Antigravity, Claude, Codex and ChatGPT.", "createdAt": "Sat Nov 07 23:00:00 +0000 2026", "replyCount": 76, "retweetCount": 209, "likeCount": 1911, "conversationId": "2119203243054023129", "author": {"username": "GoogleCloudTech", "name": "Google Cloud Tech", "profileImageUrl": "https://pbs.twimg.com/profile_images/2047008659629391872/BfLTYOuh_normal.jpg"}, "authorId": "15813140", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWi9CL9W8AAR69t.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWi9CL9W8AAR69t.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119151444397793280/vid/avc1/1920x1080/db4EawUHkX9J533v.mp4?tag=16", "durationMs": 66000}], "translationZh": "来看看 Google 的 Elephant-Goldfish Model，我们新推出的开源插件 → https://t.co/eIWb2HAeDt\n\n先让掌握充分上下文的智能体起草规格说明，再让没有任何上下文的子智能体对其进行压力测试，之后才开始写代码。架构由你决策，规格说明经你批准后再实施。支持 Antigravity、Claude、Codex 和 ChatGPT。"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-08T09:29:03+00:00", "createdAtBeijing": "2026-11-08T17:29:03+08:00", "createdAtLocal": "11-08 17:29 北京", "url": "https://x.com/servasyy_ai/status/2119361548833694060", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2119361548833694060", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "长上下文起草与零上下文规格验证", "evidence": "stress-test them with zero-context subagents", "rationale": "给出规格起草、独立挑错与人工审批的协作方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2119454907564720628", "track": "creative", "source": {"id": "2119454907564720628", "text": "这么就把 AI 短剧工作流开源了？一定会遭同行骂的😂\n\n看了一下 Miller 的方法，大概步骤如下：\n\n1. 先让Claude或DeepSeek写剧本，只写镜头能拍到的东西，心理活动要体现在动作和表情上。台词别太长，一集七八百字就够了。\n\n2. 然后是出图。角色一定要全身正面白底，鞋子也要写上。场景图里别让人物出现，把这些图喂给模型，后面出视频时角色才不会乱变脸。\n\n3. 接着写提示词，一段只干一件事。谁站哪在哪、说什么、心里想什么都分开写清楚，再告诉模型每张图是干什么用的。\n\n4. 然后去RunningHub跑MiniMax的H3，上传角色图和场景图，先出个5秒看看效果，满意了再继续制作。一段大概两毛钱。\n\n6. 声音的话，每段都用同一句声音描述，或者把第一次满意的声音剪出来当参考，这样前后听起来才是同一个人。\n\n7. 最后丢进剪映，按顺序排好，有问题的头尾直接剪掉，对话中间盖一段别人的反应镜头，加字幕、统一调色，导出就行了。", "createdAt": "Sun Nov 08 15:40:02 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 12, "conversationId": "2119454907564720628", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "quotedTweet": {"id": "2119326884505043274", "text": "用 Claude + H3 一个人拍 AI 短剧：一手实战教程，附全流程提示词和技能包", "createdAt": "Sun Nov 08 07:11:19 +0000 2026", "replyCount": 122, "retweetCount": 613, "likeCount": 3890, "conversationId": "2119326884505043274", "author": {"username": "TuyetloanP81840", "name": "Miller", "profileImageUrl": "https://pbs.twimg.com/profile_images/2118912894171824128/6WDahHVo_normal.jpg"}, "authorId": "2057932282732883968", "article": {"title": "用 Claude + H3 一个人拍 AI 短剧：一手实战教程，附全流程提示词和技能包", "previewText": "一集 5 分钟、角色会开口说话的 AI 短剧，视频这一步我算下来 27 块多。\n同样的量，用 Seedance 2.5 按火山方舟的官方价跑，要 1,360 块左右。\n先说结果 👇\n一个人、不用买显卡，做出角色会开口说话的短剧"}}, "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-11-08T15:40:02+00:00", "createdAtBeijing": "2026-11-08T23:40:02+08:00", "createdAtLocal": "11-08 23:40 北京", "url": "https://x.com/jinchenma_ai/status/2119454907564720628", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2119454907564720628", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI短剧制作全流程", "evidence": "角色一定要全身正面白底，鞋子也要写上", "rationale": "提供剧本、角色一致性、声音与剪辑方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2119606148911206627", "track": "agent", "source": {"id": "2119606148911206627", "text": "一份 Markdown，翻译成 7 种格式\n\n这是它跟一般 awesome 列表最不一样的地方。\n\n每个 agent 是一个 Markdown 文件，头部写 name、description、model，可选 tools。tools/adapters/ 下每个工具一个适配器，https://t.co/q2Iu1883WK、https://t.co/vXdPMnOMel、https://t.co/n3w7rXGYud 等，生成时按目标工具重写。\n\nmodel 这一行最能说明问题。源文件里 code-reviewer 写的是 opus，到了各家工具里：\n\n• Claude Code：原样 opus\n• Codex：gpt-5.5\n• Copilot：claude-opus-4.8\n• Antigravity：pro\n• Cursor：inherit，你当前选哪个模型就用哪个\n\nsonnet 和 haiku 到 Codex 里都映射成 gpt-5.4-mini。\n\n工具权限也得翻译。源文件写 tools: Read, Grep 表示只读，OpenCode 会转成一段 permission 拒绝规则；Codex 没有逐个工具的白名单，只能退一步设 sandbox_mode = \"read-only\"；Cursor 直接丢掉这一行。\n\n所以同一个 agent 换个工具，约束松紧并不一样。Claude Code 是原生格式，规则最完整，其他几家是尽量贴近。\n\n翻译版也不是生成完就算了。每个 PR 进来，CI 都会把 7 种格式重新生成一遍、跑结构校验，OpenCode、Antigravity、Pi 三家还会装上真 CLI 把产物加载一次。\n\n202 个 agent 的模型我按 frontmatter 数了一遍：sonnet 70 个、opus 54 个、inherit 52 个、haiku 24 个、fable 2 个。架构、安全、审查给 opus，文档、测试、排错给 sonnet，部署、SEO 这类轻活给 haiku。", "createdAt": "Mon Nov 09 01:41:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2119606146335985757", "inReplyToStatusId": "2119606147917255063", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWpWJOzaUAAQXCk.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HWpWJOzaUAAQXCk.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-09T01:41:00+00:00", "createdAtBeijing": "2026-11-09T09:41:00+08:00", "createdAtLocal": "11-09 09:41 北京", "url": "https://x.com/sitinme/status/2119606148911206627", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2119606148911206627", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "跨工具 Agent 格式适配与权限差异", "evidence": "同一个 agent 换个工具，约束松紧并不一样", "rationale": "具体说明模型映射、权限降级和产物校验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2119371853437218945", "track": "tools", "source": {"id": "2119371853437218945", "text": "FreeToken 这次做的几个优化挺实在，核心就是一件事：让大模型在有限显存下跑得更快，减少数据搬运和重复计算。\n\n主要做了 4 个优化：\n\n1. GPU 缓存常用专家。 不需要把所有专家都塞进显存，常用的留在 GPU，不常用的放在内存里。需要时再决定搬到 GPU，还是直接交给 CPU 计算。\n\n2. 数据搬运和计算同时进行。 GPU 计算当前层时，后台提前准备下一层的数据，减少等待时间。尤其是处理长上下文时，效果更有意义。\n\n3. 减少 Agent 重复计算。 编程 Agent 经常读取文件、调用工具、修改上下文。FreeToken 会缓存关键位置的计算状态，尽量避免每次上下文变化都从头计算。\n\n4. 显存可以动态分配。 专家缓存和上下文缓存可以根据任务调整，不需要每次都重新加载整个模型。不过调整缓存可能会清除已有的前缀缓存。\n\n我觉得最值得关注的是，它不只是优化模型每秒能生成多少 token，还在优化首个 token 的等待时间、长上下文处理，以及 Agent 连续执行任务的效率。\n\n对于显存有限、又想在本地运行大型 MoE 模型的开发者，这个思路很有价值。当然，实际效果还是取决于具体硬件、带宽和模型。", "createdAt": "Sun Nov 08 10:10:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 1, "conversationId": "2119371852166336944", "inReplyToStatusId": "2119371852166336944", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWVIPAgbQAAKryB.png", "width": 736, "height": 334, "previewUrl": "https://pbs.twimg.com/media/HWVIPAgbQAAKryB.png:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-08T10:10:00+00:00", "createdAtBeijing": "2026-11-08T18:10:00+08:00", "createdAtLocal": "11-08 18:10 北京", "url": "https://x.com/sitinme/status/2119371853437218945", "themeId": "editorial", "signalScore": 54, "editorial": {"id": "2119371853437218945", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "FreeToken 的显存与推理效率优化", "evidence": "GPU 计算当前层时，后台提前准备下一层的数据", "rationale": "解释专家缓存、计算重叠及上下文复用机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2119452157523210244", "track": "enterprise", "source": {"id": "2119452157523210244", "text": "继续口播。\n\n换了一种 B-roll 风格。opus 5.5 言出法随。 https://t.co/wJL0PJwyuZ", "createdAt": "Sun Nov 08 15:29:06 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 10, "conversationId": "2119452157523210244", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792", "quotedTweet": {"id": "2119102098910609797", "text": "分享一个观察到的现象，大家用 AI 的时候，一定要分清楚：AI 本身是带智能的，但你用 AI 做出来的工具，不一定是带智能的。\n\n为什么这么说呢？这几天去一家企业交流，遇到一个做财务的老师。她说，自己已经让 WorkBuddy 帮她做了一个处理财务报表的工具，是一个网页。前两个月对账的时候都好好的，这个月就出问题了。\n\n后来一了解，发现她这个月财务表格的字段发生了一点变化，那个工具就不好用了。老师有点抱怨，觉得这个 AI 没那么好用。\n\n这就是好多人可能会有的一个误区。AI 本身是智能的，但是你用 AI 开发的那个工具，如果本身没有 AI 能力，运行时也没有 Agent 去判断和处理，它就是个死工具。\n\n什么是死工具呢？就是说它会要求你上传的这些表格数据，里面的字段是固定的。如果字段、结构跟你做工具的时候不一样了，大概率这个工具就不好用了。\n\n所以解决这个问题，有两种思路。\n\n一种是，如果想继续用这个工具，那就把原始数据格式修改好，或者去修改工具。\n\n另一种是，把工作逻辑、审核要求、异常处理的守则和校验标准写进 Skill，每次让 Agent 按这个 Skill 去处理。\n\n这就是很多不懂技术的人，在使用 AI 时遇到的一些非常实际的问题。\n\n理解这些问题，其实需要一些工程化思维，或者说技术思维。你得知道这个工具为什么好用，为什么有时候不好用，问题出在哪，应该以什么思路去解。\n\n所以我觉得，这也是企业想让员工都学会使用 AI 工具的一个难点。一般用户真的不了解这些细节，但往往就是这些细节没处理好，导致他最后拿不到想要的结果。\n\n而在用户视角里，他会认为，这就是 AI 整体的问题。", "createdAt": "Sat Nov 07 16:18:06 +0000 2026", "replyCount": 10, "retweetCount": 1, "likeCount": 13, "conversationId": "2119102098910609797", "author": {"username": "jinchenma_ai", "name": "金尘马", "profileImageUrl": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, "authorId": "796179107172257792"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119451708023857152/img/alY9L9U-TO0b9S7_.jpg", "width": 1080, "height": 1440, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119451708023857152/img/alY9L9U-TO0b9S7_.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119451708023857152/vid/avc1/1080x1440/AhUXFhSlyKPhEkzK.mp4?tag=29", "durationMs": 122100}], "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "金尘马", "role": "企业落地与产品组织实践与观察", "why": "能解释 GEO 与个人记忆的区别，也观察实际用户采用 AI 的障碍。", "handle": "jinchenma_ai"}, "createdAtIso": "2026-11-08T15:29:06+00:00", "createdAtBeijing": "2026-11-08T23:29:06+08:00", "createdAtLocal": "11-08 23:29 北京", "url": "https://x.com/jinchenma_ai/status/2119452157523210244", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2119452157523210244", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "财务工具字段变化故障与处理方法", "evidence": "她这个月财务表格的字段发生了一点变化", "rationale": "引用具体故障，给出格式修正与Skill处理思路"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2096306255510077440/Nt3mHa5D_normal.jpg"}, {"id": "2119328315307893058", "track": "agent", "source": {"id": "2119328315307893058", "text": "用过 AI 编程，大概率遇到过这种情况：需求只有几句话，AI 却很快写出了一大堆代码。\n\n页面看起来像那么回事，项目也能启动，但仔细一看，业务规则理解错了，旧接口被改了，还顺手加了几个你根本没要求的功能。\n\n接下来就是不断补充说明、撤销修改、让它重新理解。最初省下的时间，最后又花在返工上。\n\nGitHub 开源的 Spec Kit，它本身不提供新模型，而是给你现有的 AI 编程工具配一套工作流程。\n\n需求、方案和任务都会保存成项目里的文件，方便检查，也方便下次继续做。\n\n比如“给订单页面加个导出功能”，它会引导你先想清楚：导出全部数据还是当前筛选结果？谁有权限导出？哪些现有功能不能改？\n\n这些问题提前说清楚，往往比代码写完再返工划算。\n\nSpec Kit 主要提供几类东西：\n\n- Specify CLI：安装、初始化和管理项目中的 Spec Kit 组件，终端命令叫 `specify`。\n- 代理可调用的命令或 Skills：用于生成规格、澄清问题、制定计划、拆任务、实施和检查。\n- 模板与脚本：统一文件组织、产出结构和流程中的机械操作。\n- 可保存的工程上下文：把项目原则、需求、决策和任务放到文件里，而不只留在聊天记录中。\n- 扩展机制：按需要接入其他流程、外部工具或组织规范。\n\n不过AI 写出十份看起来专业的文档，不代表它真的理解对了，最后还是得有人审方案、看代码、验证实际效果。", "createdAt": "Sun Nov 08 07:17:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 0, "conversationId": "2119328315307893058", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118240805748133888/img/K6AcRSIJytU17_TS.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118240805748133888/img/K6AcRSIJytU17_TS.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118240805748133888/vid/avc1/1920x1080/-WWpHnDY-OhAJVkY.mp4?tag=29", "durationMs": 254866}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-08T07:17:00+00:00", "createdAtBeijing": "2026-11-08T15:17:00+08:00", "createdAtLocal": "11-08 15:17 北京", "url": "https://x.com/sitinme/status/2119328315307893058", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2119328315307893058", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Spec Kit 规格驱动的 AI 编程流程", "evidence": "需求、方案和任务都会保存成项目里的文件", "rationale": "提供需求澄清实例、组件说明及验证边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2119587115524899163", "track": "agent", "source": {"id": "2119587115524899163", "text": "One piece of terminology that people get confused with is the term “private benchmark” \n\nThe word benchmark suggests an abstract representation of some tasks that you can compute metrics against (which isn’t that useful IMO)\n\nWhat ends up happening when people are too benchmark pilled is they mirror the form factor of public benchmarks privately\n\nI think private evals are much different than “benchmarks” in that they are tied to an actual agent and test a production code base, and involve a completely different process that incorporates lots of data analysis of production traces to understand what tests to write, etc\n\nI mentioned this because many times when I see a “private benchmark” it tends not to be useful because it’s packed with lots of semi-generic metrics or tasks.", "createdAt": "Mon Nov 09 00:25:23 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2119563291412578575", "inReplyToStatusId": "2119584877385498977", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-11-09T00:25:23+00:00", "createdAtBeijing": "2026-11-09T08:25:23+08:00", "createdAtLocal": "11-09 08:25 北京", "url": "https://x.com/HamelHusain/status/2119587115524899163", "themeId": "editorial", "signalScore": 48, "editorial": {"id": "2119587115524899163", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "基于生产轨迹设计私有评测", "evidence": "analysis of production traces", "rationale": "提出从生产轨迹分析出发，为实际代理设计测试"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "有一个容易让人混淆的术语：“私有基准测试”。\n\n“基准测试”这个词让人想到对一组任务的抽象表示，可以据此计算各项指标（在我看来，这并没有多大用处）。\n\n当人们过度迷信基准测试时，往往只是在内部照搬公开基准测试的形式。\n\n我认为，私有评估与“基准测试”有很大区别：它针对具体的智能体，测试生产环境中的代码库，流程也完全不同，包括大量分析生产环境中的运行轨迹，以确定该编写哪些测试，等等。\n\n我之所以提到这一点，是因为我看到的很多“私有基准测试”往往没什么用，里面塞满了各种半通用的指标或任务。"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2119447561476137394", "track": "creative", "source": {"id": "2119447561476137394", "text": "GPT Image 2.6生成夜间直闪CCD生活照。\n\n提示词（欢迎返图）：\n摄影风格：夜间微过曝直闪CCD生活照风\n写真方向：都市夜间浪漫生活写真\n场景方向：现代24小时鲜花零售店外 / 大面积透明玻璃橱窗 / 明亮白色花艺展示柜 / 粉白鲜花 / 深灰色夜间街道 / 远处城市灯光\n服装方向：草莓红色修身心形领褶皱短上衣 + 深海蓝色高腰立体裁剪包臀短裙，胸腰部分采用细密褶皱与柔软弹力面料，裙摆整齐利落\n气质标签：明媚、甜美、温柔、轻熟、浪漫\n五官方向：清甜明媚电影自然脸\n五官细节：年轻成年东方女性，23–28岁，小巧流畅鹅蛋脸，清亮略长杏眼，卧蚕自然，眼尾微扬，鼻梁秀气，唇形柔软饱满，带自然血色，眼神明亮温柔\n发型方向：深棕色半扎微卷长发，发根自然蓬松，额前保留轻盈碎发，真实发丝层次\n身形方向：轻盈纤细，上围自然饱满，胸腰比例协调\n线条强调：强\n线条重点：锁骨、自然胸线、纤细腰部、腰臀曲线、腿部比例\n镜头方向：半身到大腿\n姿态动作：站在鲜花橱窗与深色街道的明暗交界处，一只手拿小束白色洋桔梗，另一只手轻搭橱窗边缘，身体侧前方看向镜头，自然微笑\n光线氛围：真实深夜环境，近距离C "rationale": "说明开关、遮蔽范围及录屏例外，属功能自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, {"id": "2119484157936185383", "track": "agent", "source": {"id": "2119484157936185383", "text": "谢谢反馈！你说的情况我们没能复现，但顺着查出了几处漏洞，已经修好，更新到 2026.1109.4 就有：被屏蔽 App 的通知在下拉通知栏、锁屏、横幅里都会对 agent 隐藏，最近任务里它的卡片也一样，截图里会用灰块盖住；按名字屏蔽的 App，通知也会隐藏；「设置 › 安全 › 添加应用」可以直接从手机上的 App 里挑；默认屏蔽名单加上了买单吧、发现精彩、动卡空间、浦大喜奔、全民生活等信用卡 App。更新后再看看，还能看到的话告诉我。", "createdAt": "Sun Nov 08 17:36:16 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2119350412809732253", "inReplyToStatusId": "2119459324401758348", "author": {"username": "DIYgod", "name": "DIŸgöd ☀️", "profileImageUrl": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, "authorId": "1553713718", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "DIYgod", "role": "开源产品与工程实践实践与观察", "why": "把 Agent 大规模用于 RSSHub 审查和测试，有真实维护对象。", "handle": "DIYgod"}, "createdAtIso": "2026-11-08T17:36:16+00:00", "createdAtBeijing": "2026-11-09T01:36:16+08:00", "createdAtLocal": "11-09 01:36 北京", "url": "https://x.com/DIYgod/status/2119484157936185383", "themeId": "editorial", "signalScore": 42, "editorial": {"id": "2119484157936185383", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "手机 Agent 敏感应用屏蔽漏洞修复", "evidence": "截图里会用灰块盖住", "rationale": "具体说明通知、最近任务和截图的隐私修复"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1628393369029181440/r23HDDJk_normal.jpg"}, {"id": "2119580981808218232", "track": "creative", "source": {"id": "2119580981808218232", "text": "直接挑战 Blender 3D + Computer Use！\n这题对 Hy4 来说，专业对口。\n腾讯官方透露，Hy4 专门针对 Blender、CAD 等专业软件，以及跨应用长程任务做了专项训练。\n\n我让它一次生成三个玩偶：\nWorkBuddy 玩偶、女版玩偶、魔改鲁班七号。\n结果写建模脚本、生成零件、渲染出图、检查结果，全部自己完成。\n中途渲染过曝，它通过 Computer Use 检查画面，自己发现问题，再调整参数重新渲染。\n最后交付了可编辑的 .blend 工程和 STL可3D打印的文件。", "createdAt": "Mon Nov 09 00:01:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 2, "conversationId": "2119580980411507056", "inReplyToStatusId": "2119580981246238724", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119443357508554752/img/3RYSCv_B8jHG__BY.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119443357508554752/img/3RYSCv_B8jHG__BY.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119443357508554752/vid/avc1/1920x1080/dIwAJ5J5A_MlS80V.mp4?tag=29", "durationMs": 44633}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-09T00:01:00+00:00", "createdAtBeijing": "2026-11-09T08:01:00+08:00", "createdAtLocal": "11-09 08:01 北京", "url": "https://x.com/MinLiBuilds/status/2119580981808218232", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2119580981808218232", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Hy4 操控 Blender 制作可打印玩偶", "evidence": "最后交付了可编辑的 .blend 工程", "rationale": "自述建模交付与过曝修复过程，有具体实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2119394776290148715", "track": "creative", "source": {"id": "2119394776290148715", "text": "本以为又是套壳玩具，但这次实测的成片有点吓人！\n\n用 @ViggleAI  最近新出的Remake video agent试了下长视频换角，直接跑了一支 4 分钟的完整 MV。\n\n输入只有两样东西：\n1，鸟叔《Gentleman》原片，\n2，老黄的单人图。\n没有分段抽卡，也没有后期拼缝，全程 One-shot 一次生成。\n\n跑完看成片，最直观的感受就三点：\n\n第一，长度真的够长😂\n3 分 53 秒一气呵成。以前做这种体量得切成二十几段分别跑，现在直接整片吞吐，省掉了最繁琐的切段和对齐。\n\n第二，跨镜头连贯好！\n全片几十次切镜，从室内特写到大排档群戏，再到百人草坪齐舞，人物面部和黑皮衣材质一直稳住，原本的舞步、运镜和音乐卡点全数保留。\n\n第三，支持按镜头精修！\n哪一帧或者哪一个分镜看着不顺眼，直接跟 Agent 对话只改那一段，不会牵连前后已经跑通的好镜头。\n\n做过 AI 视频落地的都知道，能一次跑通 4 分钟且角色不崩，省下的是成倍的废片率和剪辑工时！", "createdAt": "Sun Nov 08 11:41:05 +0000 2026", "replyCount": 32, "retweetCount": 0, "likeCount": 33, "conversationId": "2119394776290148715", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119394701866647553/img/SGG0Oyjz3R13YBdB.jpg", "width": 1294, "height": 728, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119394701866647553/img/SGG0Oyjz3R13YBdB.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119394701866647553/vid/avc1/1294x728/fx6ia7H5UZFIbkib.mp4?tag=29", "durationMs": 233105}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-08T11:41:05+00:00", "createdAtBeijing": "2026-11-08T19:41:05+08:00", "createdAtLocal": "11-08 19:41 北京", "url": "https://x.com/servasyy_ai/status/2119394776290148715", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2119394776290148715", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Viggle长视频换角实测", "evidence": "直接跑了一支 4 分钟的完整 MV", "rationale": "提供输入、成片表现与局部精修实践，效果为自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2119276354818740604", "track": "creative", "source": {"id": "2119276354818740604", "text": "Images 2.6 这两天快被大家玩成视频模型了！！！\n\n一句话就能出动图，太牛逼了，快快玩起来😋\n\n1、口播 B-roll：先定一个画面隐喻，出静帧，再让它从空白把静帧一块块拼出来，转成 MP4 拖进剪映。狗哥的教程讲得很细。\n\n2、动作表情包：先出一张连续动作分解图，再拿它当垫图，说\"按这个顺序做成 GIF\"，会比直接出可控得多。\n\n3、网页和 App：先让它画出页面和动效，再让 Codex 照着写成真正的 HTML 和 CSS。\n\n4、AI 视频：先用 GIF 把动作和节奏排好，再喂给视频模型出成片，甚至你也可以直接用 Images 2.6 生成 GIF 图然后拼接...\n\nhttps://t.co/wtyZJ29Vpa", "createdAt": "Sun Nov 08 03:50:31 +0000 2026", "replyCount": 8, "retweetCount": 7, "likeCount": 54, "conversationId": "2119276354818740604", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "quotedTweet": {"id": "2119109309854544231", "text": "说实话，很多人平时图省事，各种私钥、大模型 API Key 全以明文扔在备忘录、.env 甚至前端代码😅\n\n平时跑 Agent，如果没做隔离，恶意 MCP 或者下载目录混进的恶意文件，几秒钟就能把本地密钥全搞走了...\n\n现在连英联邦国家圣基茨都在联手 GCSA，把安全防御直接做进国家支付体系，我们本地环境更不能裸奔了\n\n起码把这个配置好：\n1、用 gitleaks 扫一遍本地项目，排查明文 Key，防止误推公开仓库。\n2、跑本地 Agent 必须开沙盒，严格限制跨目录读取 ~/.ssh 和全局配置。\n3、本地开发绝对不用生产环境全权限凭证，涉及扣费、转账必须保留人工确认闸门。", "createdAt": "Sat Nov 07 16:46:45 +0000 2026", "replyCount": 17, "retweetCount": 6, "likeCount": 24, "conversationId": "2119109309854544231", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118513573299404800/img/aCCM8bP9UTJVnmTn.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2118513573299404800/img/aCCM8bP9UTJVnmTn.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2118513573299404800/vid/avc1/1280x720/slbK0NNzdmrgVwqG.mp4?tag=29", "durationMs": 6000}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWZ43tjbkAAJYlh.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/media/HWZ43tjbkAAJYlh.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "余温", "role": "内容、视觉与多模态实践与观察", "why": "公开生图、建模和 Three.js 装配的完整链路，跨多模态工具价值明显。", "handle": "gkxspace"}, "createdAtIso": "2026-11-08T03:50:31+00:00", "createdAtBeijing": "2026-11-08T11:50:31+08:00", "createdAtLocal": "11-08 11:50 北京", "url": "https://x.com/gkxspace/status/2119276354818740604", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2119276354818740604", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "GIF 动效制作与视频创作流程", "evidence": "先出一张连续动作分解图，再拿它当垫图", "rationale": "给出动作控制、网页实现及视频预演方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, {"id": "2119600609523294356", "track": "tools", "source": {"id": "2119600609523294356", "text": "推荐一个挺有意思的开源项目 LearnHarness，感觉可以拿来啃各种难懂的知识。\n\n它会先通过提问摸清你的知识基础，找到理解上的盲区，再用 Agent 规划学习路径，边讲边练，根据你的回答不断调整教学内容。\n\n它的 Memory 设计也很有意思，会把学过的概念和推理关系保存成知识图谱，下次可以接着之前的进度继续学。\n\n用途也挺广，数学、机器学习、编程、物理、经济学、哲学，甚至备考、读复杂的科研论文，都可以拿来试试。\n\n感觉很适合想系统学习一个新领域，又不知道从哪里入手的人，值得收藏研究一下！\n\nGitHub：https://t.co/wFua2VMYcz", "createdAt": "Mon Nov 09 01:19:00 +0000 2026", "replyCount": 2, "retweetCount": 2, "likeCount": 4, "conversationId": "2119600609523294356", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-09T01:19:00+00:00", "createdAtBeijing": "2026-11-09T09:19:00+08:00", "createdAtLocal": "11-09 09:19 北京", "url": "https://x.com/Xudong07452910/status/2119600609523294356", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2119600609523294356", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "LearnHarness自适应学习开源工具", "evidence": "把学过的概念和推理关系保存成知识图谱", "rationale": "介绍开源学习工具及诊断、练习与记忆机制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2119584949032693767", "track": "research", "source": {"id": "2119584949032693767", "text": "I see some are drawing the wrong inference from this study: they are focusing on this meta benchmark as yet another benchmark for model picking, i.e. open vs closed models, model families etc.  \n\nThat’s too narrow of an interpretation!  You need to do your own private evals on your specific tasks to know what’s “better”\n\nThis should give you healthy skepticism of all public benchmarks.  I believe that was the intention of this illustration to begin with.", "createdAt": "Mon Nov 09 00:16:46 +0000 2026", "replyCount": 11, "retweetCount": 1, "likeCount": 26, "conversationId": "2119584949032693767", "author": {"username": "HamelHusain", "name": "Hamel Husain", "profileImageUrl": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, "authorId": "825766640", "quotedTweet": {"id": "2118880329490637049", "text": "Nice DeepSWE score! Does it survive a lowercase filename?\n\nIntroducing MaxxBench: 89 DeepSWE tasks with small changes to the instructions or starting code. Same engineering problem, slightly different requirement.\n\nModels clustered around 74% on DeepSWE end up 23 pp apart.\n\nGood at coding, or good at DeepSWE? 🧵", "createdAt": "Sat Nov 07 01:36:52 +0000 2026", "replyCount": 218, "retweetCount": 398, "likeCount": 5305, "conversationId": "2118880329490637049", "author": {"username": "loresjpg", "name": "Justin Lo", "profileImageUrl": "https://pbs.twimg.com/profile_images/2117764091595075584/gso3afey_normal.jpg"}, "authorId": "2108710501056491520", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWfGLoKaUAAi2sL.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HWfGLoKaUAAi2sL.jpg:small"}], "translationZh": "DeepSWE 分数不错！把文件名改成小写，还能保持吗？\n\n介绍一下 MaxxBench：基于 89 个 DeepSWE 任务，对指令或初始代码做了小幅修改。工程问题相同，要求略有不同。\n\n在 DeepSWE 上得分都集中在 74% 左右的模型，在这里却拉开了 23 个百分点的差距。\n\n究竟是擅长编程，还是擅长 DeepSWE？🧵"}, "expert": {"priority": "P1", "domain": "Agent / 评测", "name": "Hamel Husain", "role": "独立 AI 工程实践者", "why": "实用评测、生产级 LLM 系统", "handle": "HamelHusain"}, "createdAtIso": "2026-11-09T00:16:46+00:00", "createdAtBeijing": "2026-11-09T08:16:46+08:00", "createdAtLocal": "11-09 08:16 北京", "url": "https://x.com/HamelHusain/status/2119584949032693767", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2119584949032693767", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "MaxxBench基准扰动评测", "evidence": "89 DeepSWE tasks", "rationale": "引用具体任务扰动与分差，揭示公开基准局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我发现，有些人从这项研究中得出了错误的结论：他们把这个元基准测试当成了又一个选模型的基准，用来比较开放模型与封闭模型、不同模型家族等。\n\n这种解读太狭隘了！你需要针对自己的具体任务开展私有评估，才能知道什么才是“更好”。\n\n这项研究应该让你对所有公开基准测试保持合理的怀疑。我相信，这原本就是这个示例想要传达的意思。"}, "avatar": "https://pbs.twimg.com/profile_images/1287206199088173057/ixE4fKy1_normal.jpg"}, {"id": "2119481319935692908", "track": "agent", "source": {"id": "2119481319935692908", "text": "“DeepSeek 希望 DeepSeek Harness 可以作为 Agent 时代的操作系统。”", "createdAt": "Sun Nov 08 17:24:59 +0000 2026", "replyCount": 45, "retweetCount": 0, "likeCount": 88, "conversationId": "2119481319935692908", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2119433744671273441", "text": "很多 DeepSeek Harness 插件作者都有问过我，什么样的插件和功能官方会做成内置，如果一个功能官方会做，那第三方插件做还是否有意义。\n\n我们的希望是，DeepSeek Harness 可以作为 Agent 时代的操作系统。\n\n所以，也许可以用操作系统来举例。以智能手机操作系统为例，系统会内置一些通用的 App，例如闹铃与计算器，满足用户的基本需求。但做手机操作系统的厂商肯定更希望生态中能出现更多更广的 App 满足更广泛的需求，希望智能手机生态中出现更好的更适合用户的闹铃 App 与计算器 App 能够比内置功能做得更好，希望第三方开发者能够使用智能手机操作系统提供的 API 做出发明智能手机的人从来没想过的 App。\n\nDeepSeek Harness 对于第三方插件生态的想法会是类似的。我们会为用户提供稳定的基础能力，并内置大多数人都需要的通用功能。但在“一切皆插件”的设计下，内置功能同样可以被第三方插件替换，我们希望更多的社区作品成为用户的日常选择。", "createdAt": "Sun Nov 08 14:15:56 +0000 2026", "replyCount": 180, "retweetCount": 75, "likeCount": 1057, "conversationId": "2119433744671273441", "author": {"username": "tianyi", "name": "Tianyi Cui", "profileImageUrl": "https://pbs.twimg.com/profile_images/378800000650737082/b849b67d6470fafe8b3deb2ae97acfda_normal.jpeg"}, "authorId": "1473591"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-08T17:24:59+00:00", "createdAtBeijing": "2026-11-09T01:24:59+08:00", "createdAtLocal": "11-09 01:24 北京", "url": "https://x.com/dotey/status/2119481319935692908", "themeId": "editorial", "signalScore": 70, "editorial": {"id": "2119481319935692908", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "DeepSeek Harness 插件生态设计", "evidence": "内置功能同样可以被第三方插件替换", "rationale": "引文说明基础能力与插件替换机制，有具体设计信息"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2119460966677307465", "track": "agent", "source": {"id": "2119460966677307465", "text": "Karpathy 的想法太好了。\n\n红果这么猛，连大人都抵挡不住，更别说孩子了。\n\n既然推荐算法总是把人带偏，为什么不干脆绕开它，自己做一个视频入口？\n\nB 站其实有大量优质的自然、科学、历史、数学科普视频，但这些好内容都混在推荐流里。\n\n孩子明明只是想看个科学实验，结果刷着刷着就不知道跑哪去了。大人其实也一样。\n\n可以参考Karpathy的想法，不要推荐算法，只保留人工挑选的内容。\n\n直接调用 B 站官方播放器，把适合孩子的视频整理成一个独立网站，按兴趣分类，点开就看，看完就停。\n\n甚至可以让 Agent 根据孩子的年龄和兴趣，定期寻找优质内容。\n\n有了 Agent，给自己、给孩子定制一个专属视频网站，技术上已经不是什么难事。\n\n不需要改变 B 站，只需要重新做一个入口，就能在很大程度上绕开推荐算法。\n\n👉 做了一个小demo： https://t.co/A4ENsoNLRc", "createdAt": "Sun Nov 08 16:04:06 +0000 2026", "replyCount": 5, "retweetCount": 13, "likeCount": 92, "conversationId": "2119460966677307465", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "quotedTweet": {"id": "2119114537442189652", "text": "Earlier this week Tristan published his top YouTube channels:\nhttps://t.co/NZ3UCNo6cT\nWhich looked excellent so clearly I had to turn it into TristanTube:\nhttps://t.co/l0KyW1WdNH\n47K super nerdy videos +TV mode for laid back watching. (One-shotted with Claude Code in 3 minutes)", "createdAt": "Sat Nov 07 17:07:31 +0000 2026", "replyCount": 586, "retweetCount": 723, "likeCount": 8628, "conversationId": "2119114537442189652", "author": {"username": "karpathy", "name": "Andrej Karpathy", "profileImageUrl": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, "authorId": "33836629", "translationZh": "本周早些时候，Tristan 分享了他最推荐的 YouTube 频道：\nhttps://t.co/NZ3UCNo6cT\n看起来相当棒，我当然得把它做成 TristanTube：\nhttps://t.co/l0KyW1WdNH\n4.7 万个极客向视频，还支持 TV 模式，方便轻松观看。（用 Claude Code 一次生成，耗时 3 分钟）"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119460498358079488/img/u3BS2arkAYRZBKn-.jpg", "width": 2048, "height": 1232, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119460498358079488/img/u3BS2arkAYRZBKn-.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119460498358079488/vid/avc1/2862x1722/45RouR1wYHxUHTsJ.mp4?tag=29", "durationMs": 21816}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-08T16:04:06+00:00", "createdAtBeijing": "2026-11-09T00:04:06+08:00", "createdAtLocal": "11-09 00:04 北京", "url": "https://x.com/MinLiBuilds/status/2119460966677307465", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2119460966677307465", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "人工精选视频入口 Demo", "evidence": "直接调用 B 站官方播放器", "rationale": "提供独立入口实现思路并附自述 Demo"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2119318698653782067", "track": "tools", "source": {"id": "2119318698653782067", "text": "顺着这个讲座找到了 AI Engineer 的官方网站：\nhttps://t.co/BzzmCrVZBC\n里面是这个会议各位顶级大佬的讲座，来自 OpenAI Anthropic 等等最顶尖的 AI 公司，每个讲座除了视频本身还有transcript，摘要，分章节详细解读 以及 幻灯片。\n\n是一个非常好的学习资源。 https://t.co/vPeegsqhUZ", "createdAt": "Sun Nov 08 06:38:47 +0000 2026", "replyCount": 5, "retweetCount": 11, "likeCount": 93, "conversationId": "2119318698653782067", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2119073385196195992", "text": "大家可以看看 Matt Pocock 在 React Advanced Conference 中的演讲《Why Software Fundamentals Still Matter》 非常精彩\nhttps://t.co/K7hHKWKpyj\n\n如果 AI 已经在写代码了 软件基础知识还重要吗？他认为很重要，并且将问题具体化到 React 上了。\n\n评论里各位大佬都发表了自己的意见，大部分理解 React 没那么重要，Thariq 说框架内部实现细节不重要，更底层的东西更重要。\n\n我看了完整的视频，视频很精彩，里面有推荐书，还有他真是工作使用他自己 skills 的一系列场景。我觉得他的结论是：软件工程的设计原则和实践比以往更重要，因为bad code 更容易破坏整个系统。说的是工程设计能力，而不是传统意义上的基础知识。", "createdAt": "Sat Nov 07 14:24:00 +0000 2026", "replyCount": 16, "retweetCount": 24, "likeCount": 157, "conversationId": "2119073385196195992", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWlVEZBb0AAmgwa.jpg", "width": 2048, "height": 1168, "previewUrl": "https://pbs.twimg.com/media/HWlVEZBb0AAmgwa.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-08T06:38:47+00:00", "createdAtBeijing": "2026-11-08T14:38:47+08:00", "createdAtLocal": "11-08 14:38 北京", "url": "https://x.com/vikingmute/status/2119318698653782067", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2119318698653782067", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "AI Engineer 会议学习资源与工程设计讲座", "evidence": "每个讲座除了视频本身还有transcript，摘要", "rationale": "提供结构化讲座资源及工程设计学习线索"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2119425791213834397", "track": "tools", "source": {"id": "2119425791213834397", "text": "CF 出的 EmDash 有人用了吗？https://t.co/wOwNplJhTW\n\n我记得早就宣布了， 一个月前居然就 1.0 了，看起来很不错啊，基于 Astro 的 CMS，有 WordPress 风格的管理后台，内置 MCP CLI，可以方便 agent 用 也兼容 CF的全家桶环境。\n而且整个界面也清爽好看，是基于 cf 自己的 kumo ui 组件库。做 CMS 的可以试试看", "createdAt": "Sun Nov 08 13:44:20 +0000 2026", "replyCount": 7, "retweetCount": 2, "likeCount": 28, "conversationId": "2119425791213834397", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-08T13:44:20+00:00", "createdAtBeijing": "2026-11-08T21:44:20+08:00", "createdAtLocal": "11-08 21:44 北京", "url": "https://x.com/vikingmute/status/2119425791213834397", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2119425791213834397", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "EmDash CMS工具介绍", "evidence": "基于Astro的CMS，有WordPress风格的管理后台", "rationale": "介绍具体工具及Agent接入能力，版本说法待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}], "preview": false, "productionMonitored": 122};
const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
