pbs.twimg.com/media/HWA0QgIXwAAXN2R.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWA0R0WXgAAC_fG.jpg", "width": 1900, "height": 1130, "previewUrl": "https://pbs.twimg.com/media/HWA0R0WXgAAC_fG.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWA0bstWYAAIIad.jpg", "width": 1648, "height": 800, "previewUrl": "https://pbs.twimg.com/media/HWA0bstWYAAIIad.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWA0cklXQAAe5_o.jpg", "width": 1648, "height": 970, "previewUrl": "https://pbs.twimg.com/media/HWA0cklXQAAe5_o.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "姚金刚", "role": "出海、SEO 与增长实践与观察", "why": "GEOInflow 把爬虫日志、AI 引荐、访问和转化连起来，有可追溯项目。", "handle": "yaojingang"}, "createdAtIso": "2026-11-01T04:29:42+00:00", "createdAtBeijing": "2026-11-01T12:29:42+08:00", "createdAtLocal": "11-01 12:29 北京", "url": "https://x.com/yaojingang/status/2116749500559544581", "themeId": "editorial", "signalScore": 69, "editorial": {"id": "2116749500559544581", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "海外GEO渠道配置与重复采样方法", "evidence": "固定问题、重复采样，同时观察品牌和链接的变化", "rationale": "含数据口径、平台差异与执行建议，数据为作者转述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2039226063088463872/_zw7eSeM_normal.jpg"}, {"id": "2116690844799361364", "track": "creative", "source": {"id": "2116690844799361364", "text": "推荐 X & SpaceXSI 设计负责人的「产品插画品味」Skills\n\n@benjitaylor 开源的 Stageshow skills，把 Benji 手做假 UI（静帧、动效、bento）时的几百个小决定写成工作流、金标样例和拍片自检，专攻营销页/文档 hero 里那种「像真产品、其实是编排过的插画」，静帧、短动画、光标走查、手机触控、bento 网格。\n\n开源项目：https://t.co/osT6EgToQW\n\nSkills 交付物\n· Skill（SKILL.md + references/）：一条总原则，读起来像真产品，只留观众需要的信息，构图有意图，每个动作有原因；并写明五种翻车（太多 / 太少像线框 / Boxed 整窗塞进卡片 / Flat 权重一样 / Bland 没有 brief 风格）。七步大多在写代码前定完：媒介与尺寸、look、3–5 拍故事、抄最近金标再改成自家产品、真字符串预算、编排循环、拍片对照金标。\n\n· kit/：可拷进项目的 React 部件（Stage、Window、Phone、光标与若干安静零件），自带 CSS，无第三方动画运行时；难做对的东西（数字只滚变化位、卡片飞入槽位、消息从输入框长出等）由 kit 扛。主题/色板/真实用词密度是舞台 props，也可把产品 design token 映射上去，使 demo 贴自家产品而不是通用灰窗。\n\n· examples/：大量金标（hero、bento、表单报错、拖拽重排、图表 scrub、Dynamic Island、上传分享等）和可辨认产品研究（Figma、Linear、Slack、Raycast、Finder、Spotify 等），借交互，不借别人品牌身份。Agent 被要求先 film 最近金标、整文件夹复制再改，而不是瞟一眼重写。\n\n· Playground + film.mjs：本地预览九种风格与坏/好样对；拍片出 contact sheet、量布局、抓一帧跳变。作者强调：只读代码或拍定格看不见中间帧的假；--gate 通过是必要但不充分，人仍要看一遍。\n\n和「让模型直接生成 UI」差在哪\n产出是普通 React，可进仓库、可改、可按页面宽度做 compact，而不是一张不可维护的图。演示是脚本化插画：https://t.co/fpSn1oKp9q() 画按下反馈，a.set() 改场景，不自动化真实应用控件。假日文键盘、多光标、Live↔Publish、图表跳动那类片，卖的是编排与循环接缝，不是浏览器录屏。\n\nBenji 怎么验证、怎么看未来\n用日常产品小片段（Figma、Gmail、Finder、Spotify 等）对照有/无 skill，自称挂上后 consistently 更好；迭代方式是发现问题就写进 skill 再整轮重跑，而不是手改一次交差。\n\n他判断模型品味未来会变好，部分规则（如红绿灯尺寸）已对更新模型失效，但构图与动效因果仍常要被点醒；因此 skill 可能阶段性有用，做出的 demo 本身又会变成模型可学的小样例，「帮自己过时」被写成可接受的结局。局限也写清了：检查抓错误不抓无聊点子；不会画画；规则是作者品味，不是中性标准；多数 demo 仍要几轮人工反馈。", "createdAt": "Sun Nov 01 00:36:38 +0000 2026", "replyCount": 22, "retweetCount": 0, "likeCount": 28, "conversationId": "2116690844799361364", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2116593247854453244", "text": "Stageshow: a skill that helps your agent make better faux UI stills, animations, bento grids, and more. \n\nnpx skills add benjitaylor/skills --skill stageshow https://t.co/Qve3C2cECg", "createdAt": "Sat Oct 31 18:08:49 +0000 2026", "replyCount": 387, "retweetCount": 532, "likeCount": 11355, "conversationId": "2116593247854453244", "author": {"username": "benjitaylor", "name": "Benji Taylor", "profileImageUrl": "https://pbs.twimg.com/profile_images/1485350275372048384/FwGgXuTk_normal.png"}, "authorId": "2606432720", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116591037816971264/img/646-9xgMoEXyzL8m.jpg", "width": 2048, "height": 1430, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116591037816971264/img/646-9xgMoEXyzL8m.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116591037816971264/vid/avc1/2784x1944/CQhIlZl1gbvNSIkA.mp4?tag=29", "durationMs": 24000}], "translationZh": "Stageshow：一项帮助智能体制作更出色的模拟 UI 静态图、动画、便当式网格布局等内容的技能。\n\nnpx skills add benjitaylor/skills --skill stageshow https://t.co/Qve3C2cECg"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV__GEqXQAAwMh6.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HV__GEqXQAAwMh6.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-01T00:36:38+00:00", "createdAtBeijing": "2026-11-01T08:36:38+08:00", "createdAtLocal": "11-01 08:36 北京", "url": "https://x.com/shao__meng/status/2116690844799361364", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2116690844799361364", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "Stageshow 产品插画与动效技能开源", "evidence": "React 部件（Stage、Window、Phone", "rationale": "提供开源技能、组件、样例及逐帧验证流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116742778973749536", "track": "research", "source": {"id": "2116742778973749536", "text": "如果 Autoresearch 真的越来越强，人类研究者最后会被拿掉吗？\n\nMeta FAIR 等团队这篇《Aligning Autoresearch》给出的答案更接近「共同进化」。\n\n他们先让 Research Agent 自己创建 benchmark，再逐步加入人类反馈。\n\n对于真正有价值的人类输入，主要集中在前期帮 Agent 定义要研究什么、给哪些材料、什么样的问题才值得做。\n\n细粒度的人类指导，在 6 组 benchmark × solver 对比里，都让最终 benchmark 明显更难，提升幅度达到 28–46.5 分。\n\n论文还专门做了 HackBench，测试模型能不能从超长科研轨迹里发现 reward hacking。\n\n169 条轨迹里，中位数超过 100 万字符，却通常只藏着 1 条真正违规的命令。\n\n即使是前沿模型，最好的定位 F1 依然不到 53。\n\n所以作者后面做的事情很自然：\n\n让 Agent 学会更好地和人协作。\n\nAutoInteract 用真实交互记录构造「人类模拟器」，训练模型处理澄清、需求变化和纠错；RL-XAR 则用专家写作反过来优化评估标准，再提升 Agent 的科研表达。\n\n这样看来未来的 Research Agent 可能不会简单走向「全自动科研」。\n\n更现实的路径，是让 Agent 承担越来越多执行和搜索工作，同时把人类的研究判断、反馈和标准更深地写进训练循环。\n\n重要的是让 Agent 不仅会自己研究，还要让它知道怎样和人一起把研究做得更好。\n\n📎 arxiv: https://t.co/14zKIgLTNZ", "createdAt": "Sun Nov 01 04:03:00 +0000 2026", "replyCount": 4, "retweetCount": 29, "likeCount": 149, "conversationId": "2116742778973749536", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV-HyLJXEAAlzlD.jpg", "width": 1175, "height": 1191, "previewUrl": "https://pbs.twimg.com/media/HV-HyLJXEAAlzlD.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T04:03:00+00:00", "createdAtBeijing": "2026-11-01T12:03:00+08:00", "createdAtLocal": "11-01 12:03 北京", "url": "https://x.com/Xudong07452910/status/2116742778973749536", "themeId": "editorial", "signalScore": 84, "editorial": {"id": "2116742778973749536", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "科研Agent的人类反馈与协作训练", "evidence": "最好的定位F1依然不到53", "rationale": "介绍量化实验、作弊检测基准及人机协作训练方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116857031621849572", "track": "research", "source": {"id": "2116857031621849572", "text": "① Memory 的账，这周算得更清楚了：\nMemory Tax：很多专门设计的 Memory 系统，还不如直接对 raw history 做 RAG，而且成本更高。作者把它拆成 Memory Benefit 和 Memory Tax 两笔账。\n账号帖：https://t.co/7UGm8zhfJ6\n原文：https://t.co/qgKpDVD09d\n\n第二天又看到一篇更直接的，两篇放一起读正好互相解释。\n账号帖：https://t.co/JCbWU2ALSR\n原文：https://t.co/eF8TH1Vczf", "createdAt": "Sun Nov 01 11:37:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 1, "conversationId": "2116857031198196061", "inReplyToStatusId": "2116857031198196061", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2116008943126552615", "text": "RAG 又杀回来了。\n\n最近 Agent Memory 越做越复杂，但这篇《Memory Tax》发现了一个挺尴尬的结果：\n\n很多专门设计的 Memory 系统，最后还不如直接对 raw history 做 RAG，而且成本更高。\n\n作者把 Memory 的价值拆成两部分：\n\nMemory Benefit：RAG 答错，但 Memory 答对的问题。\n\nMemory Tax：RAG 本来能答对，经过 Memory 处理后反而答错的问题。\n\n问题就出在「整理记忆」这一步。\n\n历史被摘要、重写和结构化以后，一些细节会直接丢失；另一些虽然还在，却变得更难检索。\n\n比如在 LongMemEval 上，Qwen3.6-27B 用两轮 RAG 能做到 81.4%，GPT-5.6 Luna 达到 90%，都高于对应的复杂 Memory 方案。\n\n一个简单的修补反而很有效：\n\nMemory 继续用，但同时保留 raw history 的检索通道，再把两边结果一起 rerank。\n\n这篇工作也给我们做了一个提醒，给 Agent 加 Memory 之前，最好先拿最简单的 raw-history RAG 做个 baseline。\n\n有时候，真正昂贵的并不是「没记住」，而是过早把原始信息总结掉了。\n\n📎 arxiv: https://t.co/qgKpDVD09d", "createdAt": "Fri Oct 30 03:27:00 +0000 2026", "replyCount": 22, "retweetCount": 45, "likeCount": 392, "conversationId": "2116008943126552615", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzy7RzaoAAd5Ny.jpg", "width": 1154, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HVzy7RzaoAAd5Ny.jpg:small"}]}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T11:37:00+00:00", "createdAtBeijing": "2026-11-01T19:37:00+08:00", "createdAtLocal": "11-01 19:37 北京", "url": "https://x.com/Xudong07452910/status/2116857031621849572", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2116857031621849572", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Agent记忆系统的信息损失与检索基线", "evidence": "同时保留raw history的检索通道", "rationale": "报告量化对比，并给出原始历史检索补救方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116888552411746697", "track": "agent", "source": {"id": "2116888552411746697", "text": "Grok Bot 当经理、Claude Code / Cursor 干活：编排层才是软件产线的新界面\n\n来自 @robshocks 的视频分享，基于对 @poteto 和 @theo 使用实践的梳理。Rob 提出主张：编排 bot 管「第一公里」（意图）和「最后一公里」（追进度、验收），真正写代码交给 Claude Code、Cursor、Codex 等有独立机器的 coding agent。Lauren Tan（pstack；Grok Bot / Cursor 侧工程师）月级上千 PR、Slack 触发、云 agent 复现与「fix and fuzz」、干净后自动合；Theo（T3 Code）也在用 Grok Bot 管机器舰队。核心不在多堆 bot，而在于信任基础设施，倒金字塔：代码库结构 → 静态分析/CI → 规则与 skill → 人审放在最底、最不该扩规模的那一层。\nhttps://t.co/11x8wnJ1Eb\n\nGrok Bot 和 Claude Code / Cursor 分工怎么拆？\nGrok Bot 适合连 Slack、邮件、X、Linear 等，收齐「该建什么」的上下文，再盯任务是否做完。中间写代码别耗在编排 bot 上：一来额度与 Cursor/Grok 共用池容易烧光，二来 worker 有独立电脑、上下文和可杀掉的开关，隔离更好。作者自己常把活派给 Claude Code 订阅或 Cursor 云 agent；也可自建编排（Claude/Cursor Projects），模式可迁移。大厂产线案例里，Slack 当指挥面很常见。\n\nLauren 的日环（简化版）\n盯产品相关 Slack → 开 Linear 单 → Cursor 云 agent 在独立机复现 → 开「fix and fuzz」PR（一小群 agent 用随机点击 / Playwright 等试着打破修复）→ fuzz 干净则 Slack 通知，约一小时无异议可自动合。作者强调要对标 Anthropic 的做法：按爆炸半径分绿/黄/红，支付等关键路径不能无脑自动合。Lauren 不爱「工厂」比喻，更近「米其林厨房」：你是主厨，菜是团队做的，盘子上仍是你的名，和 Addy「责任在人」同调。\n\n倒金字塔：信任从哪堆\n1. 代码库：清晰边界、强类型，agent 爱抄现有最短路径，要让「容易的事就是对的事」。\n2. 静态分析 / lint / 测试 / CI：同一错反复人工收拾，就写成确定性规则。\n3. 文档层：AGENTS.md、CLAUDE.md、skills、各类 bot。\n4. 人审：最贵、最不扩。引用 Anthropic 一段：合并量升、回滚占比降，是把大量「读审查」挪给机器，不是取消审查。有团队为铺验证停新产品约六周，事后觉得值。\n\nRob 自己的落地与踩坑\n少造五十个 bot，用一个「Chief」统筹委派；权限收窄；凭证进 vault——他对「看不清记忆/skill/vault 细节」有保留，但仍在用。Backlog 进 Notion，例行 RICE + 爆炸半径打分；可主动建议改进，但别为了填满 backlog 而刷任务。Lauren 用 routine 从 Slack bug、X 抱怨收上下文进外环，推理额度高才扛得住高频。安全提醒：Grok Bot 多 bot 共享一台云电脑（文件、浏览器会话、CLI 凭证），一个 API key 登录，别的 bot 也可能用到。Docker 等「安全软件工厂」参考架构的核心：越自主，越不能指望 agent 自律，控制要在环境里，沙箱、最小权限、可开 PR 但默认不合。\n\n可快速复制的起步规则\n编排 bot 自己别写代码；交给带验收标准的 coding agent；检查证据；开 PR；汇报。每次纠正 agent，把修复上移：先改代码结构，再 lint，再规则文件，人审最后。中间夹 Neon Realtime 赞助，解读略。", "createdAt": "Sun Nov 01 13:42:15 +0000 2026", "replyCount": 12, "retweetCount": 1, "likeCount": 10, "conversationId": "2116888552411746697", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWCy5jyXsAAJwbt.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWCy5jyXsAAJwbt.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-01T13:42:15+00:00", "createdAtBeijing": "2026-11-01T21:42:15+08:00", "createdAtLocal": "11-01 21:42 北京", "url": "https://x.com/shao__meng/status/2116888552411746697", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2116888552411746697", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "编排与编码分工及分层验证", "evidence": "每次纠正agent，把修复上移", "rationale": "提供任务委派、权限隔离与验收方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116857034301952294", "track": "enterprise", "source": {"id": "2116857034301952294", "text": "⑤ Agent 进组织：\nAnthropic 让 50 名专业分析师用 Claude Code 做研究，86% 的关键分析选择跟着 Agent 的倾向走，很多人事后还觉得是自己的判断。\n账号帖：https://t.co/3DImTculyU\n原文：https://t.co/x7eYFGomFu\n\nOpenAI《The Future of the Firm》：以后你可能真的要向 AI 汇报工作。\n账号帖：https://t.co/xnHOMTi50C\n原文：https://t.co/Ji7YK2COJF\n\nDeepMind《The Economics of Intelligence》：单个 AI 再强，也未必打得过一支分工明确的人类团队。\n账号帖：https://t.co/mpEQU1OG6M\n原文：https://t.co/x7goFBG1LD", "createdAt": "Sun Nov 01 11:37:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2116857031198196061", "inReplyToStatusId": "2116857033463070831", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2115284922500108648", "text": "Anthropic 刚公布了一项很值得关注的实验：让 50 名专业分析师用 Claude Code 做研究，结果 86% 的关键分析选择，都跟着 Agent 的倾向走了。\n\n更有意思的是，很多人事后还觉得这些判断是自己做的。\n\n研究者让分析师评估一个农业项目是否值得推广，其中有很多没有标准答案的选择，比如该用每公顷产量，还是单位成本产出来衡量效果。\n\n他们悄悄给 Agent 随机设定立场，要求它在不编造数据的前提下，尽量为自己的选择提供合理解释。\n\n结果除了 86% 的方法选择与 Agent 倾向一致，事后还有 77% 的人复用了 Agent 给出的理由，只有 15% 明确提到这些理由来自 AI。\n\n我觉得这对现在的 Agent 设计挺有警示意义。\n\n很多 Human-in-the-loop 流程，最后都是让人 Review 一下、点个确认。但如果人已经被 Agent 的解释说服了，这种审核还能提供多少独立判断？\n\n尤其是 Research Agent，研究方法、实验设计、结果解释，很多时候本来就没有唯一正确答案。\n\n对于做 Agent Eval 的朋友，可能还得关注一个更隐蔽的问题：Agent 有没有在这些关键选择上，悄悄替人做了决定？\n\n当然，这次实验刻意强化了 Agent 的立场，不能直接推广到所有真实场景。但我觉得这个方向真的值得认真研究。\n\n原文：https://t.co/x7eYFGomFu", "createdAt": "Wed Oct 28 03:30:00 +0000 2026", "replyCount": 11, "retweetCount": 1, "likeCount": 20, "conversationId": "2115284922500108648", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T11:37:00+00:00", "createdAtBeijing": "2026-11-01T19:37:00+08:00", "createdAtLocal": "11-01 19:37 北京", "url": "https://x.com/Xudong07452910/status/2116857034301952294", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2116857034301952294", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Agent 对专业分析师判断的影响", "evidence": "只有 15% 明确提到这些理由来自 AI", "rationale": "介绍实验设计、结果及人工审核的适用局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116797957454401746", "track": "agent", "source": {"id": "2116797957454401746", "text": "有了 AI 以后写代码速度快了非常多，但是校验的速度其实还是不快的，特别是在 GitHub 上跑 Actions CI 的速度，下午花了一些时间对 Mole、Kaku、Pake 的 CI 全部彻底优化了一下，效果很不错，分享给大伙。\n\n你可以这样直接 Copy 下面给到你的 Agent，我们来看看可以帮你节约多少时间。\n\n帮我把这个仓库的 GitHub Actions 提速，在不减少必要的测试项以及功能校验下，最大幅度减少耗时。\n\n1. 先使用 gh 拉最近 50 次的运行情况，把每一个 job 拆成排队、准备、真正跑测试的 3 个时间段，去看规律，可能很多时候慢的是准备的阶段，不是测试本身。\n2. 同一个 PR 连着推好几次时，只跑最新的那次，旧的直接取消掉，用 cancel-in-progress 去实现。不过 main 分支不要这么做，需要确保发版 main 上的每一个提交都完整跑过一遍。\n3. 只改 README 和文档的这种提交不要触发跑 CI，可以用 paths 过滤掉，另外被跳过的必需检查会一直卡住 PR 合不进去，这个要提前注意一下。\n4. 优先用 setup 类 action 自带的缓存，setup-node 打开 cache，setup-go 默认就开，Rust 用 Swatinem/rust-cache，注意每个仓库缓存只有 10 GB，用不上的就不要放到这里面去。\n5. 本地连着构建两次，第二次应该几乎不花时间，假如有多余的花时间的地方，一定是哪些写得有问题，比如 Dockerfile 装依赖前先 COPY 了整个仓库，或者构建脚本盯着一个不存在的文件，类似的问题记得检查。\n6. 工具直接下载预编译好的，不要用 go install、cargo install 现场安装编译，这里会很费时间。\n7. 不互相依赖的 job 并行跑，删掉不传数据的 needs，最长的那套测试拆到多台机器上去跑。\n8. 免费账号的 macOS 最多同时跑 5 个，所有 workflow 共用，格式化、lint、依赖审计这些不挑系统的都移到 Ubuntu 去跑更好。\n9. 做过的事情就不要做重复了，以及不要多此一举做事情，比如别的 job 跑过的检查就不要套重复再跑，比如只构建前端的 job 就不要多此一举去拉整个 Rust 缓存。\n10. 改完去 push 那个上面测试运行效果，看运行的时间，发现规律，再次查漏补缺来优化一遍，做到最好，最后给到我优化前后的对比。", "createdAt": "Sun Nov 01 07:42:15 +0000 2026", "replyCount": 70, "retweetCount": 29, "likeCount": 579, "conversationId": "2116797957454401746", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-01T07:42:15+00:00", "createdAtBeijing": "2026-11-01T15:42:15+08:00", "createdAtLocal": "11-01 15:42 北京", "url": "https://x.com/HiTw93/status/2116797957454401746", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2116797957454401746", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "供Agent执行的GitHub Actions提速方法", "evidence": "把每一个job拆成排队、准备、真正跑测试", "rationale": "提供诊断、缓存、并行与优化验证的具体步骤"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, {"id": "2116957135661945283", "track": "agent", "source": {"id": "2116957135661945283", "text": "Weekend hack: HackerTube. I was annoyed with YouTube's recommendations so I had Claude filter down 43M comments over 20 years of HN to 6,454 videos that keep being recommended. *Significantly* better viewing experience, ~2 hours with Opus 5.5:\nhttps://t.co/JIhXN7OSh1\n\n- Excellent recs without any logins (state is kept in local browser session)\n- Thumbnail is a representative frame from middle of the video instead of the super duper A/B test hyper-optimized user uploads\n- Underlying data from the comment analysis as one zip file, point your Claude at it and ask for your own version\n- HackerTube Longs ✊\n\nA bit more on the process:\nI use Claude Code (desktop app for Mac), Opus 5.5 on Medium effort as my default. I only talk to Claude and have it do everything, the only \"manual work\" I helped with in tandem was in the browser (reminiscent of MenuGen): 1) I had to create some kind of API key from Google Cloud UI to query YouTube for video metadata, 2) I booted up a VPS box for serving and 3) I bought the domain name. Once the box was up I gave Claude the IP and told it update, secure, harden, deploy and optimize the code, and it did the whole thing.\n\nMany awesome projects that would have normally taken weeks/months even can now be few-shotted for breakfast. What else are we not thinking of.", "createdAt": "Sun Nov 01 18:14:46 +0000 2026", "replyCount": 1021, "retweetCount": 1924, "likeCount": 23889, "conversationId": "2116957135661945283", "author": {"username": "karpathy", "name": "Andrej Karpathy", "profileImageUrl": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, "authorId": "33836629", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDnuuCaIAA__wa.jpg", "width": 2048, "height": 1190, "previewUrl": "https://pbs.twimg.com/media/HWDnuuCaIAA__wa.jpg:small"}], "expert": {"priority": "P0", "domain": "AI 编程 / 通用 AI", "name": "Andrej Karpathy", "role": "Eureka Labs；前 OpenAI/Tesla", "why": "高信号 AI 教育者和产品思想者，长期影响 Software 2.0、AI Coding、Vibe Coding 等叙事", "handle": "karpathy"}, "createdAtIso": "2026-11-01T18:14:46+00:00", "createdAtBeijing": "2026-11-02T02:14:46+08:00", "createdAtLocal": "11-02 02:14 北京", "url": "https://x.com/karpathy/status/2116957135661945283", "themeId": "editorial", "signalScore": 90, "editorial": {"id": "2116957135661945283", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "用 Claude 构建 HackerTube 视频推荐站", "evidence": "6,454 videos", "rationale": "自述完整作品、数据规模及部署过程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "周末小项目：HackerTube。受够了 YouTube 的推荐，我让 Claude 从 HN 过去 20 年的 4300 万条评论中，筛出了 6,454 个反复被推荐的视频。观看体验好太多了，用 Opus 5.5 花了约 2 小时做成：\nhttps://t.co/JIhXN7OSh1\n\n- 无需登录就有优质推荐（状态保存在浏览器本地会话中）\n- 缩略图取自视频中段的代表性画面，而非上传者经过大量 A/B 测试、极致优化的封面\n- 评论分析的底层数据打包成一个 zip 文件，让你的 Claude 读取它，就能要求它做出你自己的版本\n- HackerTube Longs ✊\n\n再聊聊制作过程：\n我用的是 Claude Code（Mac 桌面应用），默认选择 Opus 5.5，推理强度设为 Medium。我只负责跟 Claude 沟通，所有事情都交给它做。我配合完成的唯一“手动工作”都在浏览器里（让人想起 MenuGen）：1）在 Google Cloud 界面创建某种 API 密钥，用于查询 YouTube 视频元数据；2）启动一台 VPS 服务器；3）购买域名。服务器启动后，我把 IP 给了 Claude，让它更新系统、配置安全防护、加固服务器、部署并优化代码，它就把整套流程做完了。\n\n许多原本要花几周甚至几个月的精彩项目，现在吃个早饭的工夫、聊上几轮就能做出来。还有什么是我们尚未想到的？"}, "avatar": "https://pbs.twimg.com/profile_images/1296667294148382721/9Pr6XrPB_normal.jpg"}, {"id": "2116712070385185271", "track": "agent", "source": {"id": "2116712070385185271", "text": "主动常驻智能体来了：上下文工程旧题已有套路，新难题在记忆、异步与目标\n\n来自 LangChain 创始人 @hwchase17 的分享，他认为「LLM 循环 + 工具 + 沙箱」已基本收敛，摘要、结果外置、Skills、工具检索、子智能体、Bash 等也有了通行做法，所以有人觉得智能体工程做到头了；但真正变难的是下一步，主动、常开、奔着目标跑的智能体：推送别烦人、记什么、异步怎么接回主对话、目标别被钻空子、浏览器当主工具时上下文怎么扛。这些还没有通用解法，也正是他现在觉得好玩的地方。\n\n# 旧题为何显得「已解决」\n\n业界对 Claude Code、Deep Agents 一类 harness 的形态越来越像：模型在环里调工具、在沙箱里干活。为撑住上下文，大家陆续对齐了几套标准操作：线程太长就摘要；工具返回太大就落盘再给指针；用 Skills 做渐进披露；工具太多就做 tool search；用子智能体隔离子上下文；把 Bash 当成主工具而不是堆一堆窄工具。这些主要服务单次、偏编码/任务型的跑法，所以容易给人「难题做完了」的感觉。\n\n# 新题从哪冒出来\n\n近几个月他和智能体建设者聊得最多的，是主动、常驻、目标导向的智能体：内核仍像 coding agent，但用法变了，上下文工程要重新扛。文中对照清单（左栏勾选、右栏空框）把两边写得很清楚。\n\n# 六道新题，各自卡在哪\n\n1. 主动又不烦人：监听事件流或心跳唤醒，必须能推给用户才像「在帮忙」，推多了又刷屏。多少算刚刚好，仍是难校准的产品与上下文问题。\n\n2. 记什么：记忆常是简单数据结构（文件、一段字符串）加一层「决定记什么」的智能；两端都容易翻车——什么都不记，或记得过碎。这层判断本身往往又是个小智能体，规则还没有通用答案。\n\n3. 异步：任务和工具、子智能体都越跑越久，但主对话还要随时接用户新消息，于是更多活丢到异步工具/子智能体。新问题变成：活干完怎么通知主智能体；主智能体还在跑、已经结束、或卡在等人审批时，上下文怎么合流。文中配了一张时间线示意（用户等的同时，后台工作流如何汇入）。\n\n4. 目标追踪：从「做完一件事」变成「奔着大目标迭代」（文中举例 Hone 一类）。要会拆步、做实验、收反馈、长期不跑偏；难在愿意试新招而不是原地重复，难在想着大目标而不是只盯小任务，难在跨很长周期仍一致。\n\n5. 对齐（别钻目标空子）：目标很难写到智能体钻不了空子；一味优化指标会走到预想不到的捷径，经典梗是「消灭代码库里所有 bug」→ 删光源码（没有代码就没有 bug）。需要 harness 既盯着目标，又不让目标被过度优化。文中配了删 src/ 后宣称「0 bugs，目标完成」的梗图。\n\n6. 浏览器当主工具：编码智能体靠 Bash；更通用的主动智能体越来越靠浏览器。浏览器比终端难开：看图还是看 DOM、两者都很大、上下文怎么管，都还在摸。\n\n结尾\n几个月前他或许会同意「上下文工程开放问题不多了」；常驻主动智能体一出现，记忆、异步、目标、主动性又成批冒出来。语气是兴奋多于焦虑：对做上下文的人来说，好玩的新题又回来了。", "createdAt": "Sun Nov 01 02:00:58 +0000 2026", "replyCount": 35, "retweetCount": 10, "likeCount": 59, "conversationId": "2116712070385185271", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2116553654857867330", "text": "New context engineering challenges in late 2026", "createdAt": "Sat Oct 31 15:31:29 +0000 2026", "replyCount": 184, "retweetCount": 48, "likeCount": 471, "conversationId": "2116553654857867330", "author": {"username": "hwchase17", "name": "Harrison Chase", "profileImageUrl": "https://pbs.twimg.com/profile_images/1569345624935485442/R67C4wCQ_normal.jpg"}, "authorId": "2728439146", "article": {"title": "New context engineering challenges in late 2026", "previewText": "It feels like everyone is converging on the same agent architecture: an LLM, running in a loop, calling tools, running in a sandbox. Claude Code - perhaps the first high profile manifestation of this", "titleZh": "2026 年末上下文工程面临的新挑战", "previewTextZh": "感觉大家都在趋向同一种智能体架构：一个在沙箱中循环运行、调用工具的大语言模型。Claude Code 或许是这一架构最早受到广泛关注的实例。"}, "translationZh": "2026 年末上下文工程面临的新挑战"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWASZqRWgAAYWvw.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HWASZqRWgAAYWvw.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-01T02:00:58+00:00", "createdAtBeijing": "2026-11-01T10:00:58+08:00", "createdAtLocal": "11-01 10:00 北京", "url": "https://x.com/shao__meng/status/2116712070385185271", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2116712070385185271", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "常驻主动智能体的上下文工程难题", "evidence": "活干完怎么通知主智能体", "rationale": "梳理记忆、异步合流与目标追踪的具体问题"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116887381001248970", "track": "agent", "source": {"id": "2116887381001248970", "text": "每天三万次合并：Anthropic 靠「可验证证据」而不是更多人工读 diff\n\n来自 @kapmani 和 @addyosmani 在 @aiDotEngineer 的分享，当 Coding agent 让「写代码」不再是瓶颈；真正卡住的是有没有足够证据敢合并。Addy 称 Anthropic 日合并量大约从五月的 2500 提到约 30000：Claude 做首轮审查，但必须附带端到端、浏览器、lint、测试、截图/视频等证据；人审的是证据包，不是逐行啃完所有 diff。Manish 的收尾总结：写得快不等于发得快；自主权是挣来的。\nhttps://t.co/R62YHtJYDy\n\n现场讲了什么？\n举手调查：几乎人人让 agent 开过 PR，真正「每行都人工看完再合」的很少。CircleCI 侧写：CI 吞吐大涨，约三成合并尝试仍失败。框架是 software factory / 软件产线：亮灯工厂里人仍在规划–构建–检查–发布里用判断和品味；黑灯工厂更接近产线全自动，人主要定意图、处理大例外。多数团队处在光谱中间。\n\nAnthropic 怎么扛住这么大规模 PR ？\n流程：Claude 首轮审查 → 尽量像真用户一样试产品（浏览器、工具、lint、各类检查）→ 发现缺口用 hooks 盯编辑与 diff、尽快修 PR → 把团队约定写进 CLAUDE.md / agents.md 之类 → 人核对 agent 交出来的证据（含 UI 录屏、截图）。Addy 强调：只说「verify」太空；要落到端到端、property、视觉验证等具体测法，才谈得上自动合并。Claude Opus 5.5 模型已经够用，下一波收益更在验证实践与分享。\n\n@SonarSource 侧：多层验证与护栏\nState of Code 方向：多数人觉得 AI 让功能更快上线，PR 更大更复杂，仍有相当比例代码未经充分审查进生产；对受监管场景尤其刺眼。建议零信任、每个环（agent 环、CI 环、维护环）都有独立验证：确定性层抓注入/溢出等；agent 审查抓逻辑与意图；供应链层看 CVE、恶意包。企业还要管 agent 身份、遥测、权限与沙箱；他们更爱说 guide rails（导轨）：把 agent 限制在批准路径上，而不是事后拦。\n\n快问快答要点\n2027 年底多数团队：偏「亮灯 + 若干暗角」，不太可能全体暗灯。Agent 写的 PR 建议打标（短期审计、额外检查清单）；责任仍在发起人：你 kick 了 Claude 跑完，出事还是你修。初级/负责人今年该练：弄清「验证」在自家产品里到底指什么测试。何时可合：你有充分信心，或已把风险压到可接受。", "createdAt": "Sun Nov 01 13:37:36 +0000 2026", "replyCount": 16, "retweetCount": 0, "likeCount": 17, "conversationId": "2116887381001248970", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWCx13DW0AAtF0J.jpg", "width": 1200, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HWCx13DW0AAtF0J.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-01T13:37:36+00:00", "createdAtBeijing": "2026-11-01T21:37:36+08:00", "createdAtLocal": "11-01 21:37 北京", "url": "https://x.com/shao__meng/status/2116887381001248970", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2116887381001248970", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "以可验证证据支撑代码合并", "evidence": "人审的是证据包", "rationale": "给出多层验证流程，规模数字属转述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2116691692019683339", "track": "agent", "source": {"id": "2116691692019683339", "text": "DeepSeek 想让 Agent 在没人 @ 它的时候，也能主动发现团队讨论的 Bug，尝试修复，甚至直接提交 PR。\n\n刚看了 DeepSeek Harness 团队发布的《Super-agent 设计探索：迈向更自主的 Agent 系统》，很多想法非常值得研究。\n\n现在同时跑几个 Coding Agent，最累的往往是人。得不停切换 Session、查看进度，还要反复补充上下文。\n\nDeepSeek 提出了一套 Router + Worker 双层架构。\n\nRouter 负责接收群聊、GitHub、CI 等事件，判断哪些事情需要处理；Worker 则在独立会话中并行执行任务，再把结果送回原来的对话。\n\n我非常赞同其中的一个设计理念，尽量减少对人类注意力的消耗。\n\nAgent 可以在授权范围内提前处理任务，能自己解决的就安静完成，真正需要决策或有结果时再通知人。\n\n初步合成实验中，任务完成时间的 P95 从 29.5 分钟降到了 15.7 分钟。不过实验主要验证调度效率，真实场景下的可靠性还需要继续观察。\n\n官方也同步开源了参考原型，虽然不少设计还在探索阶段，但我觉得这个方向很有价值。\n\n以后做长期 Agent，可能得认真考虑一件事：怎样让它真正替人持续跟进工作，同时尽量减少人的管理负担。\n\nGitHub：https://t.co/98l8DARSEI", "createdAt": "Sun Nov 01 00:40:00 +0000 2026", "replyCount": 15, "retweetCount": 9, "likeCount": 73, "conversationId": "2116691692019683339", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T00:40:00+00:00", "createdAtBeijing": "2026-11-01T08:40:00+08:00", "createdAtLocal": "11-01 08:40 北京", "url": "https://x.com/Xudong07452910/status/2116691692019683339", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2116691692019683339", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "DeepSeek自主Agent调度架构", "evidence": "任务完成时间的P95从29.5分钟降到了15.7分钟", "rationale": "介绍双层架构、开源原型及合成实验边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116911839632367705", "track": "agent", "source": {"id": "2116911839632367705", "text": "补一下消融实验这章（第七章），挺有收获的。\n\n他们设计了一个实验，用300条消息轰炸Agent，只有20条是真活。（模拟群聊）\n\n设计了4个实验：\n\n🔥 单 Session，中性提示：\n5 次一次都没委派，p95 29.5 分钟。\n\n🔥 改成优先委派：\n5 次委派了 4 次，p50 13.8 分钟，token 不到 Super-agent 一半。\n但剩下 1 次模型觉得\"活很小\"自己干了，p95 还是 29.0。\n\n🔥 Super-agent：\nRouter 只派活，Worker 只听自己那条线。\np95 15.7 分钟，又快又稳，代价是 token 多花一倍多。\n\n🚀 我看，提示词能解决 80% 的分工。 剩下 20% 的翻车，只能靠架构兜底。但这个优先委派性价比真是高\n\n两个提示词原文：\n中性提示：\n\"Use a subagent for a piece of work when appropriate...\"\n\n优先委派：\n\"Every message of the chat reaches you, so work you run yourself keeps stopping for new messages. Prefer handing each piece of work to a subagent of its own, and do only small things yourself...\"", "createdAt": "Sun Nov 01 15:14:47 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 8, "conversationId": "2116871144145875173", "inReplyToStatusId": "2116871144145875173", "author": {"username": "MinLiBuilds", "name": "实践哥 Li", "profileImageUrl": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, "authorId": "1679698342283186177", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDIDGRbMAAIwtR.jpg", "width": 1382, "height": 1218, "previewUrl": "https://pbs.twimg.com/media/HWDIDGRbMAAIwtR.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWDIF_CawAAOECH.jpg", "width": 1438, "height": 768, "previewUrl": "https://pbs.twimg.com/media/HWDIF_CawAAOECH.jpg:small"}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "实践哥 Li", "role": "Agent 与开发工具实践与观察", "why": "有显存、量化和速度对比，机器与运行条件交代具体。", "handle": "MinLiBuilds"}, "createdAtIso": "2026-11-01T15:14:47+00:00", "createdAtBeijing": "2026-11-01T23:14:47+08:00", "createdAtLocal": "11-01 23:14 北京", "url": "https://x.com/MinLiBuilds/status/2116911839632367705", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2116911839632367705", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent委派提示词与架构消融实验", "evidence": "5 次委派了 4 次，p50 13.8 分钟", "rationale": "提供实验指标与提示词，可参考分工设计"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2011629211698577408/MWbkzwTo_normal.jpg"}, {"id": "2116857032175476828", "track": "research", "source": {"id": "2116857032175476828", "text": "② Harness 自进化：会改了，但改得对不对是另一回事。\n让 Agent 改自己的 Harness 两轮，开发集涨了 8.4 分，没见过的任务只涨 2.8 分。\n账号帖：https://t.co/EaxpM0pqon\n原文：https://t.co/8UtEPs8zIO\n\n改 Prompt、Skill、Tool 还是 Harness，到底谁更有效？一直缺一个公平的比较环境。\n账号帖：https://t.co/l2U4ZJkO8W\n原文：https://t.co/eyyPXSpGrP\n\nInfini-AI-Lab 开源的 Hermit，专门做 Agent Harness 的持续学习和自进化。\n账号帖：https://t.co/7zMKvMUuvw\n项目：https://t.co/XDz1c9Rt3i", "createdAt": "Sun Nov 01 11:37:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 1, "conversationId": "2116857031198196061", "inReplyToStatusId": "2116857031621849572", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2114560901722554616", "text": "Agent 把自己的 Harness 改了两轮。\n\n开发集涨了 8.4 分，真正没见过的任务只涨了 2.8 分。\n\n这可能是 Harness 自进化里最需要警惕的信号：它会改自己了，但改出来的东西经常过拟合。\n\n作者让 GPT-6 Astra、GPT-5.6、Claude Opus 5 等模型从一个极简代码库开始，自己搭建完整的 ARC-AGI-3 Harness。\n\n跑完任务后，再把执行轨迹交给模型，让它连续两次修改自己的代码。\n\n整个实验包含 27 条独立进化轨迹、81 个 Harness 版本和 2025 次游戏评测。\n\n结果是有些 Harness 从很弱一路改到接近满分，也有一些越改越差。两轮之后，15 条轨迹提升，12 条退步。\n\n更明显的问题是「Harness Adaptation Gap」：\n\n模型很容易针对自己刚看过的任务做出有效修改，但这些修改到了 held-out 任务上，经常无法迁移，甚至破坏原本已经会的能力。\n\n而且代码确实一直在变多。\n\nHarness 的中位规模从 2161 行增长到 2912 行，但修改量和真正的性能提升几乎没有稳定关系。\n\n会改自己，只证明 Agent 能动手。\n\n能判断什么时候该改、改完能不能泛化、什么时候最好什么都别动，才更接近真正可靠的 self-improvement。", "createdAt": "Mon Oct 26 03:33:00 +0000 2026", "replyCount": 13, "retweetCount": 4, "likeCount": 24, "conversationId": "2114560901722554616", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVfSxShXgAEYei3.jpg", "width": 1146, "height": 1174, "previewUrl": "https://pbs.twimg.com/media/HVfSxShXgAEYei3.jpg:small"}]}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T11:37:00+00:00", "createdAtBeijing": "2026-11-01T19:37:00+08:00", "createdAtLocal": "11-01 19:37 北京", "url": "https://x.com/Xudong07452910/status/2116857032175476828", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2116857032175476828", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Harness自进化的泛化差距与评测", "evidence": "两轮之后，15条轨迹提升，12条退步", "rationale": "提供实验规模及泛化差距，揭示自修改过拟合风险"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116857032783626597", "track": "research", "source": {"id": "2116857032783626597", "text": "③ Eval 和诊断：\n没做 Eval，就别谈在做 RSI。\n账号帖：https://t.co/KKAYvxrBiJ\n引用：https://t.co/Spw1v0zHWu\n\nNeurIPS 2026 的 OAT：训练时完全不看失败轨迹，只学不到 100 条成功轨迹，就能定位 Agent 从哪一步开始犯错。\n账号帖：https://t.co/GHbsc2jid7\n原文：https://t.co/glygr44530\n\nCameron R. Wolfe 讲 Deep Research、创意写作这类主观任务怎么评，LLM Judge 跑出来的分到底有多可信。\n账号帖：https://t.co/puZfMoPp1K\n原文：https://t.co/jSqTm7oHoG", "createdAt": "Sun Nov 01 11:37:00 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2116857031198196061", "inReplyToStatusId": "2116857032175476828", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2114922786606944490", "text": "只看成功案例，也能找出 Agent 到底在哪一步开始犯错。\n\nNeurIPS 2026 这篇 OAT 做了一个挺反常识的设定：\n\n训练阶段完全不看失败轨迹，也不需要人工标注「第几步错了」。\n\n它只学习不到 100 条成功轨迹，建立一条「正常 Agent 行为应该怎么演化」的路径。\n\n等真正遇到失败轨迹时，再检查每一步偏离这条成功路径有多远。偏离越明显，就越可能是导致失败的关键步骤。\n\n这样做的好处很直接。\n\n在域内评测上，OAT 的 F1 比 GPT-5 等 prompting 方法高约 20%；换到完全不同的多 Agent 数据集，依然高约 7%。\n\n速度差距更夸张：推理阶段不需要再调用 LLM，延迟只有几到十几毫秒，比 prompting-based 方法快 200–5000 倍。\n\n标题「Tracing Failure from the Flow of Success」已经可以很好提现论文的方法了。\n\n以后调试长时 Agent，可能未必要让另一个大模型从头读完整条失败轨迹。\n\n先学会「正常执行是什么样」，再去找哪里开始偏航，有可能更轻、更快，也更容易规模化。\n\n📎 arxiv: https://t.co/glygr43xds", "createdAt": "Tue Oct 27 03:31:00 +0000 2026", "replyCount": 10, "retweetCount": 8, "likeCount": 104, "conversationId": "2114922786606944490", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkgHMNX0AAe8Nv.jpg", "width": 1146, "height": 1140, "previewUrl": "https://pbs.twimg.com/media/HVkgHMNX0AAe8Nv.jpg:small"}]}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T11:37:00+00:00", "createdAtBeijing": "2026-11-01T19:37:00+08:00", "createdAtLocal": "11-01 19:37 北京", "url": "https://x.com/Xudong07452910/status/2116857032783626597", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2116857032783626597", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "OAT 从成功轨迹定位 Agent 失败步骤", "evidence": "它只学习不到 100 条成功轨迹", "rationale": "介绍训练设定、故障定位方法与所述评测结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116706547166552243", "track": "tools", "source": {"id": "2116706547166552243", "text": "写在最后\n\nimpeccable 做的事可以拆成两半。前一半延续 frontend-design 的思路，用 PRODUCT.md、DESIGN.md 和按页面区分的模式，让 AI 动手前就知道这一页该大胆还是该克制。\n\n后一半是它多出来的东西：62 条规则写成确定性检测，不调模型、不要 Key，能挂进 hook，也能挂进 CI。经常让 Claude Code 或 Codex 写前端、又懒得每次肉眼挑毛病的，值得装上，团队里可以拿 detect 当设计层面的 lint。\n\n限制也摆在那：规则带着作者的审美，用品牌字体得配豁免；扫干净不等于好看；遥测默认开着，hook 不走审批，这几项装之前就设好。\n\n参考来源：\nImpeccable GitHub 仓库：https://t.co/26chjllmQo \n官方文档：https://impeccable.styleImpeccable \n检测规则目录（62 条）：https://t.co/waoOLwZ5TP", "createdAt": "Sun Nov 01 01:39:02 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2116706539927212085", "inReplyToStatusId": "2116706546629644725", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-01T01:39:02+00:00", "createdAtBeijing": "2026-11-01T09:39:02+08:00", "createdAtLocal": "11-01 09:39 北京", "url": "https://x.com/sitinme/status/2116706547166552243", "themeId": "editorial", "signalScore": 45, "editorial": {"id": "2116706547166552243", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Impeccable 设计检测工具能力与限制", "evidence": "62 条规则写成确定性检测", "rationale": "概述检测集成方式并明确审美与运行限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2116794376152076298", "track": "agent", "source": {"id": "2116794376152076298", "text": "写在最后\n\nknowledge-work-plugins 把各个岗位的干活套路写成了 Markdown 和 JSON，程序员最该装的是 engineering。\n\ncode-review 把 4 类检查和三选一的结论固定了下来，debug 和 deploy-checklist 把排错、上线写成了清单。不接工具也能跑，接上 GitHub、Datadog 这类 MCP 才算完整。\n\n当然，拿来直接用还差点意思。README 有几处没跟上代码，命令得带 engineering 前缀；settings 文件没有 skill 读，团队规矩要自己写进 SKILL.md；做插件、改插件的那套工具只在 Cowork 里能用。\n\n平时常让 Claude Code 做审查、排错、上线把关的，值得装上，再花半小时把团队的规矩写进去；只是偶尔用一下的，把 debug 或 deploy-checklist 那个文件夹单独拷进 ~/.claude/skills/ 也够了。\n\n参考来源：\nknowledge-work-plugins GitHub 仓库：https://t.co/TcThXEZgBS\n插件清单 marketplace.json：https://t.co/BIy80KrKhk \n插件说明：https://t.co/YbDHAEiEva", "createdAt": "Sun Nov 01 07:28:02 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 1, "conversationId": "2116794368694604125", "inReplyToStatusId": "2116794375401255254", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-01T07:28:02+00:00", "createdAtBeijing": "2026-11-01T15:28:02+08:00", "createdAtLocal": "11-01 15:28 北京", "url": "https://x.com/sitinme/status/2116794376152076298", "themeId": "editorial", "signalScore": 48, "editorial": {"id": "2116794376152076298", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "engineering 插件选用与团队适配", "evidence": "把 debug 或 deploy-checklist 那个文件夹单独拷进", "rationale": "总结插件适用场景、接入限制与轻量使用方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2116887233894699135", "track": "tools", "source": {"id": "2116887233894699135", "text": "安装，一行命令：\nnpx skills add nutlope/hallmark -g\n\n-g 是给所有项目装，去掉就只装在当前项目。需要 Node 18 以上。只想装给 Codex 的话：\nnpx skills add nutlope/hallmark -g --agent codex\n\n装好后，Codex 里的 Skill 在 ~/.agents/skills/hallmark。\n\n做新页面，直接说要做什么，或者点名调用：\n\n$hallmark 给我的记账 App 做一个落地页\n开工前它只问一次，一共 4 件事：\n\n素材： 有没有截图、照片、真实数字；\n给谁看；\n页面要推动的那一个动作；\n调性： 比如编辑风、极简、复古、活泼。\n\n不想答就回一句 go ahead，它自己推断，再告诉你选了什么。你没给的数字、评价和 logo，它不会编，只会留空位。\n\n改已有页面，有两个命令：\n\n$hallmark audit ./index.html\n$hallmark redesign ./src/app\n\naudit 只出问题清单，一行代码都不改，适合先看看自己的页面有多少模板味；redesign 会重做设计，文案和交互都保留。改之前它会先记下所有链接、表单字段和标题，改完逐一核对，少了一个就算失败。\n\n只想查页面，不做设计，也可以单独跑检查脚本：\nnode ~/.agents/skills/hallmark/scripts/sloplint.mjs ./index.html --render", "createdAt": "Sun Nov 01 13:37:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2116887230702870904", "inReplyToStatusId": "2116887232590360890", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-01T13:37:01+00:00", "createdAtBeijing": "2026-11-01T21:37:01+08:00", "createdAtLocal": "11-01 21:37 北京", "url": "https://x.com/sitinme/status/2116887233894699135", "themeId": "editorial", "signalScore": 49, "editorial": {"id": "2116887233894699135", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Hallmark 安装与审计命令", "evidence": "npx skills add nutlope/hallmark -g", "rationale": "提供安装、调用和页面审计的具体步骤"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2116857035061109036", "track": "tools", "source": {"id": "2116857035061109036", "text": "⑥ 学习资源：\nHugging Face《A curriculum for post-training agents》：用 Coding Agent 贯穿，从 SFT 学工具调用轨迹、蒸馏、GRPO 一路到 OpenEnv 多轮交互。\n账号帖：https://t.co/YGmUCfJ4T4\n原文：https://t.co/DvJWY4usAN\n\n普林斯顿 Arvind Narayanan 把 14 年科研和职业经验整理成近 100 条的免费合集。\n账号帖：https://t.co/A5cSoMylYp\n原文：https://t.co/d02X6q5UvA\n\n说到底，就是先把账算清楚，再谈复杂。Memory 要和 RAG 比，RSI 要先有 Eval。\n下周继续 😂", "createdAt": "Sun Nov 01 11:37:01 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 0, "conversationId": "2116857031198196061", "inReplyToStatusId": "2116857034301952294", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2116336854048063598", "text": "想自己训练一个真正会用工具的 Agent，却不知道从哪开始？Hugging Face 最近整理的这套教程，我觉得很多人正好需要。\n\n名字叫《A curriculum for post-training agents》，用 Coding Agent 贯穿整个学习过程。\n\n从 SFT 学习工具调用轨迹，到模型蒸馏、GRPO，再到 OpenEnv 多轮交互，最后教你如何在真实 Harness 中训练 Agent。\n\n其中有一个实验很有意思。作者故意设计了容易被钻空子的奖励函数，结果训练分数越来越高，实际代码测试表现却越来越差，把 Reward Hacking 这个坑讲得很直观。\n\n每个阶段都配了视频、讲义、TRL 文档，部分还有训练代码和实际案例，可以顺着一步步学下来。\n\n对于已经会搭 Agent，想进一步理解 Agent RL、训练环境和 Harness 的人，这套学习路线很值得收藏。\n\nhttps://t.co/DvJWY4usAN", "createdAt": "Sat Oct 31 01:10:00 +0000 2026", "replyCount": 5, "retweetCount": 27, "likeCount": 169, "conversationId": "2116336854048063598", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T11:37:01+00:00", "createdAtBeijing": "2026-11-01T19:37:01+08:00", "createdAtLocal": "11-01 19:37 北京", "url": "https://x.com/Xudong07452910/status/2116857035061109036", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2116857035061109036", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Agent 后训练课程与科研学习资源", "evidence": "从 SFT 学习工具调用轨迹", "rationale": "提供分阶段课程、训练材料及奖励投机案例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2116749824943153352", "track": "agent", "source": {"id": "2116749824943153352", "text": "刷到一个Grok Bot 的挺实用新功能的帖子——Teach a task\n\n步骤：\n1.打开和 bot 的聊天\n2.点输入框旁的 「+」\n3.选 「Teach a task」\n4.系统会开始录你在 Grok Bot 云端电脑 上的操作（不是你自己笔记本桌面）\n\n演示时先开对页面和登录态，动作放慢；\n可变内容按真例子填；密码验证码别当重点；\n做到完成态再结束。\n\n录完它会拆步骤写成 Skill——你要它先干跑，别一上来就正式提交。\n\nSkill 检查：短名字、写点标签/URL 不写坐标、能走连接器优先、付钱发信必须先问你。\n\n固定节奏再挂 Routine。页面改版可能翻车，第一次盯着跑。\n\n做给它看，比写长提示词更对齐 UI——但不是 100% 稳。一次只教一件完整的事。\n\n适合：\n1.步骤多、要跨好几个网页/软件\n2.文字很难说清「点哪里、填什么」\n3.每周/每天都要重复的固定事务（学完还能挂成定时例行）", "createdAt": "Sun Nov 01 04:31:00 +0000 2026", "replyCount": 3, "retweetCount": 1, "likeCount": 5, "conversationId": "2116749824943153352", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116011079704952832/img/wzeEPxi2Euvv_uwg.jpg", "width": 1080, "height": 1920, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116011079704952832/img/wzeEPxi2Euvv_uwg.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116011079704952832/vid/avc1/1080x1920/Q0wMXANBubYtmeK2.mp4?tag=29", "durationMs": 65233}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-01T04:31:00+00:00", "createdAtBeijing": "2026-11-01T12:31:00+08:00", "createdAtLocal": "11-01 12:31 北京", "url": "https://x.com/sitinme/status/2116749824943153352", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2116749824943153352", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Grok Bot 示范录制与任务技能检查", "evidence": "录完它会拆步骤写成 Skill", "rationale": "提供录制步骤、技能检查和首次运行注意事项"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2116694460734300628", "track": "tools", "source": {"id": "2116694460734300628", "text": "分享一个开源项目 WeKnora\n\n腾讯开源的 LLM 知识平台。文档进同一套库后，可以做 RAG 问答、Agent 多步推理，也能生成可编辑、可回滚的 Wiki，适合本地知识库归档和回找。\n\n- 三种能力共用一套知识库\n- Wiki「自维护」指可生成、可修订，不等于免审\n- 私有化部署有真实成本（完整 Docker 栈 + 模型）\n\n协议 MIT（含第三方依赖原协议），约 36.1K★。\n\n已收录到 OpenFree：https://t.co/O83mb5rqrA", "createdAt": "Sun Nov 01 00:51:00 +0000 2026", "replyCount": 3, "retweetCount": 3, "likeCount": 12, "conversationId": "2116694460734300628", "author": {"username": "indie_maker_fox", "name": "Fox", "profileImageUrl": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, "authorId": "1865299069092139008", "quotedTweet": {"id": "2116668394464489586", "text": "资料越攒越多，要用时一句也翻不出来，本地知识库常卡在这一步。\n\n挑的标准只有一个：装上之后真替你归档和回找。\n\n1. Tencent/WeKnora\n原始文档丢进去，出来的是能提问的库和一份自己维护的 Wiki，36121 星。前置活它干完了，才轮到你问。\n一堆散文件想变成能问的东西：\nhttps://t.co/EvUYkFUpDr\n\n2. AgriciDaniel/claude-obsidian\n16031 星里它最在意文件归属：读素材、连链接、归档交给 Claude，落进库里的还是纯 Markdown，能整包带走。\n先问资料在不在自己手上的，看这个：\nhttps://t.co/urMz2qil2r\n\n3. memvid/memvid\n整套 RAG 管线压成单文件，不用起服务，也没有向量库要养，17327 星。方向跟前面相反，先做减法。\n一听起服务就想关页面的：\nhttps://t.co/bNhTsK6Inj\n\n4. eugeniughelbur/obsidian-second-brain\n5077 星不算高，48 条命令铺得实：语义搜索、会重写的笔记、免 key 的资料查找、按点启动的 agent。\n同时在用好几个助手的：\nhttps://t.co/6Pso6d8o8N\n\n本地知识库的差距不在能装多少，在于装进去之后问不问得出来。挑一条跟资料量对得上的先跑一轮。", "createdAt": "Sat Oct 31 23:07:25 +0000 2026", "replyCount": 0, "retweetCount": 0, "likeCount": 2, "conversationId": "2116668394464489586", "author": {"username": "joganicpe", "name": "Ding.链上Ai", "profileImageUrl": "https://pbs.twimg.com/profile_images/2061968935889817601/BmhNZsLh_normal.jpg"}, "authorId": "4704961823"}, "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "Fox", "role": "出海、SEO 与增长实践与观察", "why": "能发现宣传视频自动化、收入归因与 SaaS 工具的实际差别。", "handle": "indie_maker_fox"}, "createdAtIso": "2026-11-01T00:51:00+00:00", "createdAtBeijing": "2026-11-01T08:51:00+08:00", "createdAtLocal": "11-01 08:51 北京", "url": "https://x.com/indie_maker_fox/status/2116694460734300628", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2116694460734300628", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "WeKnora与本地知识库工具", "evidence": "Wiki「自维护」指可生成、可修订，不等于免审", "rationale": "介绍知识库能力、适用场景与部署成本边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1905643474952880129/HiunneWW_normal.jpg"}, {"id": "2116948445533725165", "track": "tools", "source": {"id": "2116948445533725165", "text": "We've built the most accurate document extraction system on the planet.\n\nExtract Max Effort will spend dynamic tokens reasoning about every visual detail across hundreds of pages to ensure that you get the maximum accuracy possible.\n\nCheck out this massive well log report below.\n\nIt's more accurate and still cheaper than the frontier agent harnesses on max thinking! (astra xhigh, opus 5.5 xhigh). \n\nCheck it out: https://t.co/fd0eaOkp4N\n\nLlamaParse: https://t.co/XYZmx5TFz8", "createdAt": "Sun Nov 01 17:40:15 +0000 2026", "replyCount": 21, "retweetCount": 6, "likeCount": 75, "conversationId": "2116948445533725165", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2116288817938497574", "text": "Today we're introducing Extract Max Effort - the best frontier agent in the world for document extraction 💫.\n\n🚀 It is an absolute bazooka. Use this when you absolutely need perfect 100% extraction accuracy over the most complex documents and schemas. This includes reasoning over dense well log chats, full insurance rate filings spanning 100s of pages, or dense construction blueprints. \n\n📈 It sets a new state of the art on ExtractBench Pro, achieving 61% perfect extraction accuracy. It beats Codex+Astra and Claude Code+Opus 5.5 on price/performance. \n\nIt achieves this accuracy by allocating dynamic tokens depending on page and schema complexity. It is a toggle on top of our Agentic Plus mode, so additional pricing depends on any additional compute required.\n\nBlog: https://t.co/fd0eaOkp4N\n\nCome check it out in LlamaParse! https://t.co/XYZmx5TFz8\n\nBenchmark: https://t.co/FkPrNb5iti", "createdAt": "Fri Oct 30 21:59:07 +0000 2026", "replyCount": 35, "retweetCount": 16, "likeCount": 96, "conversationId": "2116288817938497574", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV6PnHFbkAEM54s.jpg", "width": 1028, "height": 804, "previewUrl": "https://pbs.twimg.com/media/HV6PnHFbkAEM54s.jpg:small"}], "translationZh": "今天，我们推出 Extract Max Effort——全球最强的前沿文档提取智能体 💫。\n\n🚀 它的能力堪称重炮。当你必须对最复杂的文档和数据结构实现完美的 100% 提取准确率时，就用它。无论是解读密集的测井图表、长达数百页的完整保险费率申报文件，还是信息密集的建筑蓝图，都能胜任。\n\n📈 它在 ExtractBench Pro 上创下新纪录，完全准确提取率达到 61%。性价比超越 Codex+Astra 和 Claude Code+Opus 5.5。\n\n它会根据页面和数据结构的复杂程度动态分配 token，从而实现这一准确率。这是我们 Agentic Plus 模式中的一个可选开关，额外费用取决于所需的额外计算量。\n\n博客：https://t.co/fd0eaOkp4N\n\n快来 LlamaParse 体验！https://t.co/XYZmx5TFz8\n\n基准测试：https://t.co/FkPrNb5iti"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116947864677240832/img/Mk-PEjRLaQVSZbsH.jpg", "width": 1080, "height": 1350, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2116947864677240832/img/Mk-PEjRLaQVSZbsH.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2116947864677240832/vid/avc1/1080x1350/RxEQBKve2BTjF9U9.mp4?tag=29", "durationMs": 59600}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-01T17:40:15+00:00", "createdAtBeijing": "2026-11-02T01:40:15+08:00", "createdAtLocal": "11-02 01:40 北京", "url": "https://x.com/jerryjliu0/status/2116948445533725165", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2116948445533725165", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "LlamaParse 发布 Extract Max Effort", "evidence": "61% perfect extraction accuracy", "rationale": "发布动态推理文档提取功能并给出自报评测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我们打造了全球最准确的文档提取系统。\n\nExtract Max Effort 会动态分配 token，对数百页文档中的每一处视觉细节进行推理，尽可能确保最高准确率。\n\n看看下面这份超大篇幅的测井报告。\n\n它的准确率更高，价格却仍低于开启最高思考强度的前沿智能体框架！（astra xhigh、opus 5.5 xhigh）。\n\n了解详情：https://t.co/fd0eaOkp4N\n\nLlamaParse：https://t.co/XYZmx5TFz8"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2116842188399325364", "track": "creative", "source": {"id": "2116842188399325364", "text": "我特喵的笑死了，今天用 Claude 调 Blender/写代码 建模，这个效果，绷不住了🤣\n\nAI建模这块，还是得交给专业 3D 模型，推荐一些平台、开源模型、开源工具：\n\n专业平台：\n1、Hi3D：羽毛、刻字这种微细节特别强，8K 贴图，有官方 MCP\n2、Tripo：几何和拓扑好，做游戏资产很顺手\n3、Meshy：贴图、3D 打印、自动绑骨一条龙，插件最全\n4、Rodin：写实贴图和精细细节\n5、混元 3D：最多吃 8 张多视图，写实向\n\n开源模型：\n1、Hi3D V1.0：刚开源，给参考图和粗模，吐出高精度几何（不带贴图，要 N 卡）\n2、Hunyuan3D 2.1：腾讯开源，Mac 也能跑\n3、TRELLIS.2：微软开源，MIT 能商用，社区已经有 Mac 版\n\n开源 Skills / MCP：\n1、MCP for Blender：3 万多 star，让 Claude 直接操作 Blender，还能调 Meshy、Tripo、Rodin、混元\n2、blender-skills：针对 Blender 5.2，验收、烘焙、绑骨、导出都有\n3、threejs-skills：做网页 3D 必装，跟着最新版 three.js 走\n4、PINOC MCP：生成带骨骼的角色，动作库免费，动作还能套到自己的模型上", "createdAt": "Sun Nov 01 10:38:01 +0000 2026", "replyCount": 11, "retweetCount": 5, "likeCount": 60, "conversationId": "2116842188399325364", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "quotedTweet": {"id": "2114923036516471083", "text": "蛙趣，刚用 Opus5.5 + Hi3D 跑一个通宵搓的游戏，这个精细度，真的很哇塞！\n\nOpus5.5编排 + Image-2.5 出图 + Hi3D MCP 做模 + Three.js 装配\n\n整套做法分享给大家：\n1、概念与多视角参考图：GPT-Image-2.5\n先让 GPT-Image-2.5 出多视角的概念图和参考图（正面、侧面、背面），把材质纹理和结构确定。\n\n2、高精 3D 资产建模：Hi3D MCP\n把 Hi3D 的 MCP 接进 AI工具，需要时会把参考图喂给 Hi3D MCP，秒级生成带完整 PBR 材质的高精 3D Mesh。\n\n3、Web 端性能优化：自动减面与 Draco 压缩（关键避坑点）\nAI 生成的原生模型动辄几十万面，直接丢进网页必卡，让 AI 调用 MCP 时加入 LOD 网格简化并压成 Draco 格式的 glb。\n\n4、逻辑与场景组装：Three.js / WebGL\n模型就绪后，AI 自动编写 Loader 异步加载，补齐物理碰撞体、海水着色器、光影和粒子特效，拼成完整可交互的世界。\n\n5、音效和配乐：WebAudio 实时合成\n\n另外，@Hi3D_AI 刚把 V1.0 开源了，由 200 万真实生产资产训出，细节还原和多视角保真都很顶，堪称目前最扎实的工业级开源 3D 模型，摆明就是奔着 3D 赛道的 AI Infra 去的。", "createdAt": "Tue Oct 27 03:31:59 +0000 2026", "replyCount": 54, "retweetCount": 18, "likeCount": 189, "conversationId": "2114923036516471083", "author": {"username": "gkxspace", "name": "余温", "profileImageUrl": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, "authorId": "1881991469730594816", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2114917822858252288/img/ArVcLQdogXy1fXFj.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2114917822858252288/vid/avc1/1920x1080/6uJU__VlRQkqz-hc.mp4?tag=29", "durationMs": 65400}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWCIvtobUAAOPaL.jpg", "width": 2048, "height": 853, "previewUrl": "https://pbs.twimg.com/media/HWCIvtobUAAOPaL.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "余温", "role": "内容、视觉与多模态实践与观察", "why": "公开生图、建模和 Three.js 装配的完整链路，跨多模态工具价值明显。", "handle": "gkxspace"}, "createdAtIso": "2026-11-01T10:38:01+00:00", "createdAtBeijing": "2026-11-01T18:38:01+08:00", "createdAtLocal": "11-01 18:38 北京", "url": "https://x.com/gkxspace/status/2116842188399325364", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2116842188399325364", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "AI三维建模工具与网页资产工作流", "evidence": "加入 LOD 网格简化并压成 Draco 格式的 glb", "rationale": "列出建模工具及适用场景，并提供资产优化方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1952432952928784384/k7SIkQ7I_normal.jpg"}, {"id": "2116713757808427419", "track": "creative", "source": {"id": "2116713757808427419", "text": "爽了！打死我都不敢信，居然有人把这种东西全开源了！！！\n\n    244 种顶级游戏像素特效，爆炸、闪电、火焰、冰冻、传送门、魔法阵、大招连击……\n\n    别人在素材站打包卖几百几千块的东西，这老哥倒好，直接 MIT 协议一锅端全免费开源了，随便商用😂\n\n    关键是，这些根本不是死板的视频素材，而是纯代码实时画出来的。。。\n\n    而且它最牛逼的地方，是直接自带了一套 Claude Code Skill！\n\n    我翻了一圈，来给大家详细讲一讲它有多香：\n\n    1、244 种特效全靠代码实时生成，零图片素材：每一帧都是纯 JS\n    算出来的，自带发光图层。直接打开网页就能实时预览，随便换颜色、改大小、镜像翻转，火球一秒变幽冥蓝火，完全不用求着美术改图。\n\n    2、连《死亡细胞》那种卡肉打击感都给你写好了：普通特效贴上去像张死贴纸，这项目直接用代码搓了个 3D\n    骨骼像素假人，把攻击前摇、命中顿帧、震屏幅度、受击击退全做成了现成参数，一套连招下来丝滑得离谱。\n\n    3、把 Claude Code 调教成了你的专属特效师（最狠的一点）：以前让 AI 写动画全是廉价塑料感。它直接把“写代码 → 本地渲染多帧网格图 → AI\n    自己看图找茬 → 自动查越界掉帧”做成了一个现成 Skill。你直接对 AI\n    说一句：\"给我法师大招加个冰霜新星，打击感再重一点\"，它自己边看图边改，直到改顺眼为止。\n\n    4、全引擎通吃，一键导出精灵图：做网页小游戏直接拷代码就能跑；用 Unity、Godot，或者做像素风动画、AI 视频的，跑一条命令直接导出透明背景的\n    Sprite Sheet（精灵图），拿来就能用。\n\n    说白了，不管你是独立开发者搓游戏，还是做像素风动画视频，这一下直接省掉几千块买素材和请美术外包的钱。\n\n    强烈建议兄弟们先把仓库 Star 收藏或者 Fork 一份，后面做项目绝对用得上！！！\n\n    在线试玩：\n    https://t.co/ObrjOMrSNI\n\n    🔗：https://t.co/8ro5v6nPvh", "createdAt": "Sun Nov 01 02:07:41 +0000 2026", "replyCount": 31, "retweetCount": 96, "likeCount": 832, "conversationId": "2116713757808427419", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWAT6wlaQAAsl8H.jpg", "width": 1062, "height": 578, "previewUrl": "https://pbs.twimg.com/media/HWAT6wlaQAAsl8H.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-01T02:07:41+00:00", "createdAtBeijing": "2026-11-01T10:07:41+08:00", "createdAtLocal": "11-01 10:07 北京", "url": "https://x.com/servasyy_ai/status/2116713757808427419", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2116713757808427419", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "代码生成像素特效与自动迭代", "evidence": "一键导出精灵图", "rationale": "介绍具体特效工具及渲染检查流程，声明待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2116889159017320627", "track": "creative", "source": {"id": "2116889159017320627", "text": "🎉重磅！MiniMax H3 的王炸加速 LoRA 又更新了！\n\n    最近大家都在说 Pika 让 MiniMax H3 再次伟大\n\n    今天社区又放出了一个缝合怪神作：Pika-H3-Flex-Turbo-LoRA\n\n    直接把速度干到了官方版的 2.4 倍！\n\n    🔥几个关键细节（避坑必看）：\n\n    1. 社区野生融合版\n    不是 Pika 官方出的，是 HF 社区大佬 akhaliq 手搓的。他把 Pika Flex 和几个最强蒸馏加速 LoRA 直接合成了一个单文件\n\n    2. 极简开箱，零额外节点\n    不需要装任何乱七八糟的自定义节点（Custom Nodes），也不用打补丁。直接当普通 LoRA 丢进 ComfyUI，权重无脑拉到 1.0 就能跑\n\n    3. 速度飙升 2.4 倍\n    分为 2 步、4 步、8 步三个版本（还有个仅 0.31GB 的 Lite 压缩版）。\n但注意，为了迁就少步数不崩画面，Pika 的风格其实只融进去了一半：2 步和 4步版的 Flex 强度只有 0.5，8 步版是 0.6，效果不等于完整的满血 Flex🙂\n\n    🔥怎么玩最爽：\n\n    平时用 2 步版极速抽卡看动作和分镜，满意了再切 4 步或 8 步版搭配 Singularity 底模出成片\n\n    去吧，愉快的玩耍✌🏻\n\n    传送门👉🏻 https://t.co/xnCMPeM2zG", "createdAt": "Sun Nov 01 13:44:40 +0000 2026", "replyCount": 17, "retweetCount": 32, "likeCount": 365, "conversationId": "2116889159017320627", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-01T13:44:40+00:00", "createdAtBeijing": "2026-11-01T21:44:40+08:00", "createdAtLocal": "11-01 21:44 北京", "url": "https://x.com/servasyy_ai/status/2116889159017320627", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2116889159017320627", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "视频生成融合 LoRA 使用方法", "evidence": "2 步和 4步版的 Flex 强度只有 0.5", "rationale": "提供加载参数、版本取舍与出片流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2116998155925360965", "track": "agent", "source": {"id": "2116998155925360965", "text": "You can enable this on Replit with one toggle. If you enable the “feedback widget” on your site, users’ feedback become prompts for the agents to build.", "createdAt": "Sun Nov 01 20:57:46 +0000 2026", "replyCount": 57, "retweetCount": 7, "likeCount": 143, "conversationId": "2116998155925360965", "author": {"username": "amasad", "name": "Amjad Masad", "profileImageUrl": "https://pbs.twimg.com/profile_images/1897858917507776512/TRVTyKFk_normal.jpg"}, "authorId": "166138615", "quotedTweet": {"id": "2116636967517798672", "text": "I'm now building an \"improvements\" feature into all of my personal vibecoded applications: a freeform text input that's hooked up to an agent that yolo implements whatever is submitted.\n\nIt's an interesting experience -- the activation energy barrier to sanding any rough edge or implementing any new feature becomes extremely low. Someone else who uses one of the applications I created has already implemented 150 improvements over the course of a few days. This pattern feels like a new kind of tool -- liquid software? -- and every application that doesn't have this feature now has a slightly rigid and anachronistic flavor. Why can't I just tell it how I want it to be different?\n\nNow, it's not obvious to me how this pattern can or should scale. Does it become unmaintainable after a while? (Maybe model intelligence improvement outstrips my feature appetite such that it's fine?) How does collaborative software work in this model? Can software designed this way be secure and reliable?\n\nWhatever the larger questions about broader deployment, it definitely works great in a personal context. It reminds me a little of the visions of Lisp/Lisp machines, Smalltalk, and HyperCard -- systems that the user can take control of and modify. Those visions never quite worked, though: the vast majority of software today is not end-user modifiable in any useful way. So, while this \"liquid\" affordance is a very small touch, the way it changes one's relation to the software feels a bit transgressive and empowering in a Lickliderian and Engelbartian way.", "createdAt": "Sat Oct 31 21:02:32 +0000 2026", "replyCount": 393, "retweetCount": 179, "likeCount": 3959, "conversationId": "2116636967517798672", "author": {"username": "patrickc", "name": "Patrick Collison", "profileImageUrl": "https://pbs.twimg.com/profile_images/825622525342199809/_iAaSUQf_normal.jpg"}, "authorId": "4939401", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV_JAqxawAAJwno.jpg", "width": 1176, "height": 632, "previewUrl": "https://pbs.twimg.com/media/HV_JAqxawAAJwno.jpg:small"}], "translationZh": "现在，我给自己所有通过氛围编程做出的个人应用都加上了一个“改进”功能：一个连接智能体的自由文本输入框，提交什么，智能体就放手实现什么。\n\n这种体验很有意思——无论是打磨细节，还是添加新功能，动手的门槛都变得极低。一位使用我所开发应用的人，已经在短短几天内实现了 150 项改进。这种模式感觉像一种新型工具——液态软件？——如今，任何没有这项功能的应用，都显得有些僵硬、落伍。为什么我不能直接告诉它，我希望它怎样改变？\n\n不过，我还不清楚这种模式能够或应该如何扩展。时间久了，它会变得难以维护吗？（也许模型智能的提升速度会超过我对新功能的需求，因此不成问题？）多人协作的软件在这种模式下该如何运作？这样设计的软件能否安全可靠？\n\n无论大规模推广还存在哪些问题，它在个人使用场景下确实很好用。这让我有点想起 Lisp/Lisp 机器、Smalltalk 和 HyperCard 的愿景——用户能够掌控并修改系统。不过，那些愿景始终未能充分实现：今天，绝大多数软件仍无法让最终用户进行有实际意义的修改。因此，尽管这种“液态”特性只是一个小小的设计，它改变人与软件关系的方式，却带着几分突破既有边界、赋予用户力量的意味，颇有利克莱德和恩格尔巴特的理念色彩。"}, "expert": {"priority": "P0", "domain": "AI 编程 / 开发者平台", "name": "Amjad Masad", "role": "Replit / CEO", "why": "AI 应用生成、编码 Agent、开发者平台战略的重要信号源", "handle": "amasad"}, "createdAtIso": "2026-11-01T20:57:46+00:00", "createdAtBeijing": "2026-11-02T04:57:46+08:00", "createdAtLocal": "11-02 04:57 北京", "url": "https://x.com/amasad/status/2116998155925360965", "themeId": "editorial", "signalScore": 82, "editorial": {"id": "2116998155925360965", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "用户反馈驱动Agent修改应用", "evidence": "users’ feedback become prompts", "rationale": "给出开关入口及反馈转开发流程，附实践自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "在 Replit 上，只需打开一个开关就能启用这项功能。在网站上启用“反馈组件”后，用户的反馈就会变成提示词，让智能体据此开发。"}, "avatar": "https://pbs.twimg.com/profile_images/1897858917507776512/TRVTyKFk_normal.jpg"}, {"id": "2116886327585366210", "track": "agent", "source": {"id": "2116886327585366210", "text": "Vercel 新出的这个 agent desktop 思路很有意思，https://t.co/ouWngpDjHn \n也是一个类似 computer use 的产品，用来自动化控制桌面应用。\n假如记得没错的话，codex 的 computer use 以及一系列类似的产品都是走截图加 vision 识别的操作过程，这样就比较费 token 而且速度比较慢。\n\nagent-desktop 换成了读取操作系统的无障碍树，返回带 refs 的 JSON 快照，Agent 用 ref 操作，再重新读取验证，速度快 而且节省 token，效果怎么样，我还没有测，肯定没有视觉识别准，但是假如速度快也是完全可以试一下的，之后我会做一些测试。\n\n和之前他们出的 agent-browser 思路是一模一样的，agent-browser 我现在还在用，是我很喜欢的一个工具。", "createdAt": "Sun Nov 01 13:33:24 +0000 2026", "replyCount": 11, "retweetCount": 2, "likeCount": 42, "conversationId": "2116886327585366210", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-01T13:33:24+00:00", "createdAtBeijing": "2026-11-01T21:33:24+08:00", "createdAtLocal": "11-01 21:33 北京", "url": "https://x.com/vikingmute/status/2116886327585366210", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2116886327585366210", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "基于无障碍树的桌面自动化", "evidence": "返回带 refs 的 JSON 快照", "rationale": "介绍操作与验证机制，性能判断尚未实测"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2116739497358671905", "track": "agent", "source": {"id": "2116739497358671905", "text": "卧槽，王博的这个开源项目是要替代豆包手机🤯\n\n一句话就可以把手机上的事做完。\n\n可以发微信、总结群聊记录、小红书总结博主内容，在 BOSS 直聘批量打招呼、手机上的 App 都能操作，不用事先适配\n\n强大的 Browser use，搜索、筛选、读网页、批量操作，可以把事干好的同时，节奏像真人一样，不容易被风控\n\n在任何 App 里都能随时呼起，和它对话，叫它干活，或者把这一屏发给它，问这个怎么回、帮我记下来\n\n跑 Python、处理你发来的文件、Agent 写的脚本\n\n目前已经开源，地址见评论区👇", "createdAt": "Sun Nov 01 03:49:57 +0000 2026", "replyCount": 6, "retweetCount": 1, "likeCount": 15, "conversationId": "2116739497358671905", "author": {"username": "liyue_ai", "name": "李岳", "profileImageUrl": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, "authorId": "1988475714501570561", "quotedTweet": {"id": "2115957353648664966", "text": "Mika 正式开源：真正的 Phone Agent，就跑在你的安卓手机上。\n\n一句话交给它，它就能在你手机上把事干完。\n\n复用你现有的登录态，不用额外授权，也不用 Root，更不用电脑。\n\n你继续玩手机，它在后台干活，互不干扰。干完了通知你，你也可以随时随地再丢任务给它。\n\n他能干什么？\n\n1、操作你手机上的任何 App：发微信、总结群聊、小红书总结博主内容，在 BOSS 直聘批量打招呼、订闹钟、改设置，手机上的 App 都能操作，不用事先适配\n\n2、内置浏览器：强大的 Browser use，搜索、筛选、读网页、批量操作，帮你把事干好的同时，节奏像真人一样，不容易被风控\n\n3、悬浮胶囊：在任何 App 里都能随时呼起，和它对话，叫它干活，或者把这一屏发给它，问这个怎么回、帮我记下来\n\n4、本地 Linux 沙箱：跑 Python、处理你发来的文件、Agent 写的脚本\n\n不要 root，无需电脑，就跑在你的安卓手机上，真正的 phone Agent，替你在手机上把事都干了。\n\n更多功能正在赶来的路上。\n\n欢迎 star，下载使用，感兴趣也可以一起开发。\n\nGithub 地址：https://t.co/OdAAyIPRYQ", "createdAt": "Fri Oct 30 00:02:00 +0000 2026", "replyCount": 322, "retweetCount": 377, "likeCount": 2832, "conversationId": "2115957353648664966", "author": {"username": "wangzan101", "name": "王赞", "profileImageUrl": "https://pbs.twimg.com/profile_images/2018970089199112193/Ds0vM7  efficiently? introduce yourself to your bot and describe the work you do, then ask it how it can help you automate it\n\nand my favorite tip: use voice mode or the transcription option! it’s a good way to just brain dump a lot of information. then, at the end, tell your bot to “restate this in your own words” so you can confirm it understood you\n\nhttps://t.co/ajrjeHdzUO", "createdAt": "Sat Oct 31 17:01:11 +0000 2026", "replyCount": 2262, "retweetCount": 772, "likeCount": 9854, "conversationId": "2116576229319233596", "author": {"username": "poteto", "name": "lauren", "profileImageUrl": "https://pbs.twimg.com/profile_images/2049256514091929600/Qu4030T2_normal.jpg"}, "authorId": "2832427459", "translationZh": "这是一份简短的 grok 机器人指南，介绍我如何创建高质量机器人和管理团队。让 @bot 阅读这篇帖子，帮你改进团队！\n\n• 把 dr eggbot 加入你的团队！他是我用来创建机器人的机器人设计师\n• 你不需要很多机器人。几个优秀的机器人可能比庞大的团队更有用，也更容易管理\n• 在指导机器人完成任务时，让它为自己创建技能。这样即使对话很长，它也能更稳定地执行任务。如果你想独立保存所有技能，还可以让它为你创建一个私有 github 仓库来存放这些技能\n• 添加连接器、使用 vault，并授权机器人访问你工作中使用的所有工具。你还可以让机器人设置自己的邮箱、注册自己的账号，以便更好地区分彼此的身份和权限\n• 想想哪些工作需要你手动完成，或者工作流程中哪些环节需要你把信息复制粘贴给机器人。问问它能怎样替你完成这些操作！\n• 想象你雇了一名实习生，你会如何帮助对方入职，并正确、高效地完成工作？向机器人介绍你自己和你的工作，再问问它能如何帮你实现自动化\n\n我最喜欢的一条建议：使用语音模式或转录功能！这很适合一口气说出脑海中的大量信息。最后，让机器人“用你自己的话复述一遍”，确认它理解了你的意思\n\nhttps://t.co/ajrjeHdzUO"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-01T06:50:58+00:00", "createdAtBeijing": "2026-11-01T14:50:58+08:00", "createdAtLocal": "11-01 14:50 北京", "url": "https://x.com/Xudong07452910/status/2116785048493957180", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2116785048493957180", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Grok Bot团队配置与技能沉淀", "evidence": "tell your bots to create skills", "rationale": "引用指南包含技能保存、工具接入和语音理解校验"}, "isTopStory": false, "topStoryEligible": false, "topStoryC const channels=[['research','模型与研究','AI 能力又进步了什么'],['agent','Agent 与开发','把能力接入工程流程'],['enterprise','企业 AI 落地','从工具使用到业务协作'],['growth','出海与增长','找到用户，理解转化'],['creative','内容与视觉','作品、方法与多模态创作'],['tools','开源与工具','值得打开和试用的资源']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channelName=id=>channels.find(c=>c[0]===id)?.[1]||id;
const url=p=>`https://x.com/${encodeURIComponent(p.author?.username||'i')}/status/${encodeURIComponent(p.id)}`;
const date=p=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.createdAt));
const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
