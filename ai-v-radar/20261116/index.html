const DATA={"records": [{"id": "2121899873083764877", "track": "agent", "source": {"id": "2121899873083764877", "text": "Claude Code 推出实验功能 Code Mode：从一次调一个工具，到写一段 JS 批量调工具\n\nCode Mode 默认关闭，要自己打开。打开以后，Claude 调工具的方式变了：以前每次只调一个 Bash、Read 或 Edit，看完结果再决定下一步；现在 Claude 先写一段 JavaScript，在里面一次调用多个工具，由 Claude Code 在本地会话里执行。\n\nhttps://t.co/3U7bRP0jgq\n\n# 具体怎么工作\n\n官方举例是把重试上限从 3 改成 5。Claude 会写一段代码：先用 rg 找到文件，再改参数，接着跑相关测试，最后只把文件路径和测试输出交还给自己看。原本要来回四五轮的操作，现在一步就能做完。\n\n这样做有三个好处。几个独立的命令可以并行跑；上一步的结果可以直接传给下一步，不用经过模型；中间产生的大量输出可以先在代码里筛一遍，只把需要的部分放进上下文。官方推荐的用法也围绕这几点：同一处改动要改很多文件、搜索结果需要先过滤再读、几个独立的命令可以同时跑。\n\n对话界面里看到的仍然是每一次工具调用，比如编辑的 diff。想看背后的代码，按 Ctrl+O 打开记录，展开 Code 行就能看到。\n\n# 门槛和限制\n\n开启方法是设置 CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1，可以在 shell 里临时设，也可以写进 ~/.claude/settings.json。写在项目的设置文件里不生效，所以克隆下来的仓库没法替你偷偷打开它。第一次开启时，Claude Code 会先请你确认。\n\n限制不少：\n· 只能在终端的交互式会话里用，不支持 -p、Agent SDK、VS Code 面板、桌面端和云端会话。\n· 不能走网关、Bedrock、Google Cloud 或 Microsoft Foundry，也不能用 API key helper。\n· 只支持 Opus 5.5、Sonnet 5.5、Haiku 5.5 和 Fable 5.2。\n· 开着 agent teams、OpenTelemetry 导出或 DISABLE_TELEMETRY 时无法启动。\n· 用 Code Mode 开的会话，恢复时也必须开着 Code Mode。\n· 代码在前台跑，最长 10 分钟；放到后台最长 2 小时，但要求会话在 auto 或 bypassPermissions 模式下启动。\n\n# 权限怎么管\n\n代码里的每一次工具调用，仍然要经过你的 deny、ask 规则和 PreToolUse hook。真正变化的是 auto 模式：分类器现在审的是整段代码，不再一次次审单个调用，而且看不到运行时才算出来的值，比如从搜索结果里取出的路径。官方明确建议，必须管住的调用要靠规则或 hook 兜底。想审代码本身，可以写一个匹配 REPL 的 hook，从 tool_input.code 读出 JS。企业可以在托管设置里把这个变量设成 0，全员禁用。", "createdAt": "Sun Nov 15 09:35:27 +0000 2026", "replyCount": 25, "retweetCount": 2, "likeCount": 23, "conversationId": "2121899873083764877", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXKArk_boAAqXoM.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXKArk_boAAqXoM.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-15T09:35:27+00:00", "createdAtBeijing": "2026-11-15T17:35:27+08:00", "createdAtLocal": "11-15 17:35 北京", "url": "https://x.com/shao__meng/status/2121899873083764877", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2121899873083764877", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Claude Code实验性Code Mode", "evidence": "先写一段JavaScript", "rationale": "详述工具编排机制、启用限制及权限边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121809917569110173", "track": "research", "source": {"id": "2121809917569110173", "text": "一个 JEPA 世界模型，权重完全没动，长程任务成功率就从 22% 提升到了 85%。\n\nHaddy Alchaer 花了几个月，在 LeCun 团队的 LeWM 上做了 600 次实验。这篇文章还是很硬核的，值得阅读读。\n\n最有意思的发现是，模型对物理世界的预测已经相当准确，很多失败其实出在后面的规划环节。\n\n作者尝试把 75 步的长任务拆成多个 25 步的子目标，再利用历史演示构建 Memory Graph，让模型自己寻找可行的中间路径。\n\n有意思的是，机器人明明已经把积木推到目标附近，却又把它推走了。原因竟然是规划器还在努力匹配目标图片里「推杆的位置」，导致真正的任务目标被破坏。\n\n当然，目前实验主要集中在 Push-T 仿真环境。换成更难的跨演示目标，最好也只有 56% 的成功率。\n\n非常喜欢作者这种逐个排查问题的研究方式。世界模型能预测未来是一回事，怎样规划下一步、怎样判断任务完成，同样值得深入研究。\n\n文章里的交互动画做得也非常棒，浅显易懂，很推荐亲自打开看看。\n\nhttps://t.co/K5enBigQq9", "createdAt": "Sun Nov 15 03:38:00 +0000 2026", "replyCount": 11, "retweetCount": 8, "likeCount": 56, "conversationId": "2121809917569110173", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-15T03:38:00+00:00", "createdAtBeijing": "2026-11-15T11:38:00+08:00", "createdAtLocal": "11-15 11:38 北京", "url": "https://x.com/Xudong07452910/status/2121809917569110173", "themeId": "editorial", "signalScore": 76, "editorial": {"id": "2121809917569110173", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "JEPA世界模型的长程规划实验与失败复盘", "evidence": "长程任务成功率就从 22% 提升到了 85%", "rationale": "报告规划改进、失败原因及仿真适用边界"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2121852475053359340", "track": "agent", "source": {"id": "2121852475053359340", "text": "读完 Claude「Building always-on agents」值得学习的五个要点\n\n1. 「始终在线」是一种使用体验，不是一直开机\n\nAgent 大部分时间在休眠，有事件或到点了才醒来跑一次：收到事件、做完任务、把状态存下来，然后接着睡。单次运行很短，但循环一直在转。它的核心循环和普通 Agent 一样，真正的区别在外围架构。\n\n2. 事件收件箱是整个系统的事实来源\n\n用户消息、webhook、定时任务产生的事件，都先写进一张持久化的表，再由 worker 去领取，不让每个来源直接调用 Agent。同一个收件箱同时只放一个活跃 worker，按事件来源的唯一标识去重，用户连发的几条消息合并成一次运行。这样才扛得住重试、并发和崩溃。\n\n3. 计时器让 Agent 显得主动\n\n计时器分两类：一类是 Agent 给自己定的跟进时间，比如过一阵去看对方有没有回复；另一类是固定节奏的任务，比如每日简报。计时器单独存放，到期后不直接启动运行，而是往收件箱里投一条事件，走同一套流程。\n\n4. 记忆只存下次查不到的东西\n\n用户对 Agent 行为的指令、关于用户的笔记、已经对用户说过的话、每项任务的进度，这四类要写进记忆；外部系统里查得到的信息只存一个指针。每次运行都会先加载这部分上下文，所以要精简，并配合提示缓存控制成本。\n\n5. 权限是最大的风险，发件箱要先少说话\n\n凭证放在 Agent 环境之外，由代理注入到请求里。高风险动作交给分类器审查，最关键的决定仍由人来做。需要审批时就延期这次工具调用，结束当前运行，等用户的回答作为事件回到收件箱再继续，Agent 不会卡住。结果通过发件箱交给用户，节奏上先少发，再慢慢争取用户的注意力。", "createdAt": "Sun Nov 15 06:27:06 +0000 2026", "replyCount": 17, "retweetCount": 7, "likeCount": 47, "conversationId": "2121852475053359340", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2121427594260398327", "text": "Anthropic 发布 7*24 在线 Agent 架构指南：用收件箱、计时器、记忆、权限和发件箱，无人值守也能持续工作", "createdAt": "Sat Nov 14 02:18:47 +0000 2026", "replyCount": 108, "retweetCount": 223, "likeCount": 1164, "conversationId": "2121427594260398327", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "article": {"title": "Anthropic 发布 7*24 在线 Agent 架构指南：用收件箱、计时器、记忆、权限和发件箱，无人值守也能持续工作", "previewText": "Claude 官网资源中心发布了《Building always-on agents》。作者是 Anthropic 应用 AI 团队的 William Hu，文章收在 Claude Platform 实践指南里。它回答的问题是：怎样在自己的产品里做出始终在线的"}}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXJVkT_bIAEMRx4.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXJVkT_bIAEMRx4.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-15T06:27:06+00:00", "createdAtBeijing": "2026-11-15T14:27:06+08:00", "createdAtLocal": "11-15 14:27 北京", "url": "https://x.com/shao__meng/status/2121852475053359340", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2121852475053359340", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "常驻Agent的事件驱动架构", "evidence": "都先写进一张持久化的表，再由worker去领取", "rationale": "提供事件去重、计时器、记忆与审批设计方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121791852559188373", "track": "enterprise", "source": {"id": "2121791852559188373", "text": "Grok Bot: What Changes When You Can Build AI Teammates\n\nSpaceXSI 团队 @poteto 和 @romanugarte_ 做客 YC Lightcone 做了一小时访谈分享：从第一行代码到上线只用了七周的 Grok Bot，要做能登录、能在后台持续干活的 AI 同事\n\nhttps://t.co/g1dtF12Xtw\n\n# 先把 Bot 当成同事\n\nRoman 在节目里说，长时间运行的编程智能体已经改变了工程师的工作方式，团队希望非工程岗位也能这样干活。\n\n他们定了三条原则：工作以 Bot 为基本单位；Bot 要能用和人一样的工具，包括云端电脑；Bot 要一直在线，并主动找人。\n\n他举例说，效果营销团队曾把广告账号的登录和一笔预算交给 Bot，让它和设计团队的 Bot 一起试广告素材。\n\nLauren 演示了在 Slack 线程里和同事、Bot 一起做完一个功能，全程没有打开 Cursor。访谈中还提到，她现在每个月合入约 4000 个拉取请求。这些都是访谈中的自述，没有独立审计。\n\n# 「独立身份」不等于完全隔离的账号\n\n官方文档写的边界比口号更细。同一账户下的多个个人 Bot 共用一台云端电脑，登录状态和文件是共享的。邮箱是每个用户一个 https://t.co/AY6kClkuyj 地址，不是每个 Bot 一个。付款用保险库里的卡，通常要先经过确认。\n\nLauren 把「Bot 有自己的电话号码和信用卡」说成对 2027 年的期望，不能写成已经落地的功能。据 Roman 说，大约两周前上线的 Team Bots 更像一个部门共用的同事：连接应用时可以用个人账号、共用的管理员账号，部分应用里也能用 Bot 自己的账号。\n\n不过也有人追问：Bot 被钓鱼、超了预算或改出 bug 时，这笔账记在谁头上？现有的审批说明只回答了一部分。\n\n# 执行变便宜之后，真正变贵的是方向\n\nLauren 说，要让智能体自己检查工作，先得教会它像真实用户一样把程序跑起来，再把这些规则写进代码库。\n\nRoman 说，团队里已经出现想法刚提出、代码就已写好的情况，瓶颈从「能不能做出来」变成了「要不要合并」和「产品该往哪走」。\n\n# 一点读后感\n\n这期节目讲的其实是一种组织方式：给 Bot 职位、工具和一直在线的运行环境。方向很清楚，但「独立身份」目前是分层实现的，还谈不上完整的隔离和治理。更值得记下的是两点：把质量标准写进代码库，以及执行变便宜之后，判断力会变成稀缺资源。缺了这两点，再高的合入数量也只是吞吐量，算不上可靠的生产能力。", "createdAt": "Sun Nov 15 02:26:13 +0000 2026", "replyCount": 13, "retweetCount": 0, "likeCount": 9, "conversationId": "2121791852559188373", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2121632207303582049", "text": "At @SpaceXSI, Lauren Tan (@poteto) and Roman Ugarte (@romanugarte_) are on the core team that took Grok Bot from first line of code to launch in seven weeks.\n\nIt lets you spin up AI teammates with their own identities and logins, and they just keep working in the background. Their marketing team gave a bot its own ad budget. Lauren built an entire feature with her bot in one Slack thread without ever opening Cursor.\n\nThey joined us on the @LightconePod to talk about what it’s actually like working next to bots every day, and how the hard part is shifting from doing the work to figuring out what to do and why.\n\n03:36 — Giving Bots Real Jobs\n06:49 — One Bot or a Team of Specialists\n10:39 — Sharing Bots Across the Company\n14:46 — Identity and Permissions for AI Coworkers\n18:37 — Bot-to-Bot Collaboration and Trust\n22:35 — The Workflow Behind 4,000 PRs a Month\n26:00 — Teaching Agents to Write Code You Trust\n29:01 — Building a Personal Software Factory\n33:44 — The Future of AI Coworkers\n36:47 — Rethinking the AI-Native Company\n40:13 — Teaching Agents to Check Their Own Work\n43:56 — How Much Code Review Is Enough?\n47:33 — Codebase Guardrails That Save Tokens\n52:20 — When Product Judgment Becomes the Bottleneck\n56:29 — From Finance to AI Engineering", "createdAt": "Sat Nov 14 15:51:50 +0000 2026", "replyCount": 104, "retweetCount": 216, "likeCount": 2150, "conversationId": "2121632207303582049", "author": {"username": "ycombinator", "name": "Y Combinator", "profileImageUrl": "https://pbs.twimg.com/profile_images/1623777064821358592/9CApQWXe_normal.png"}, "authorId": "113130846", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121454850047422464/img/CD8lGxUM3ctk4OqK.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121454850047422464/img/CD8lGxUM3ctk4OqK.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121454850047422464/vid/avc1/3840x2160/DulPni7NMbtyuW9I.mp4?tag=29", "durationMs": 3605738}], "translationZh": "在 @SpaceXSI，Lauren Tan（@poteto）和 Roman Ugarte（@romanugarte_）所在的核心团队，仅用七周就让 Grok Bot 从第一行代码走到正式上线。\n\n它让你能创建拥有独立身份和登录账号的 AI 队友，持续在后台工作。他们的营销团队给一个机器人分配了独立的广告预算。Lauren 则在一个 Slack 讨论串里与自己的机器人合作完成了整个功能，全程没有打开 Cursor。\n\n他们做客 @LightconePod，聊了每天与机器人共事的真实体验，以及工作中的难点如何从亲自执行，转变为想清楚该做什么、为什么做。\n\n03:36 — 给机器人安排真正的工作\n06:49 — 一个机器人，还是一支专家团队\n10:39 — 在全公司共享机器人\n14:46 — AI 同事的身份与权限\n18:37 — 机器人之间的协作与信任\n22:35 — 每月 4,000 个 PR 背后的工作流程\n26:00 — 教智能体编写值得信赖的代码\n29:01 — 打造个人软件工厂\n33:44 — AI 同事的未来\n36:47 — 重新思考 AI 原生公司\n40:13 — 教智能体检查自己的工作\n43:56 — 代码审查做到什么程度才够？\n47:33 — 节省 Token 的代码库防护机制\n52:20 — 当产品判断力成为瓶颈\n56:29 — 从金融转向 AI 工程"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXIeb79a8AAHw4d.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXIeb79a8AAHw4d.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-15T02:26:13+00:00", "createdAtBeijing": "2026-11-15T10:26:13+08:00", "createdAtLocal": "11-15 10:26 北京", "url": "https://x.com/shao__meng/status/2121791852559188373", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2121791852559188373", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Grok Bot团队协作与治理边界", "evidence": "同一账户下的多个个人 Bot 共用一台云端电脑", "rationale": "包含组织实践、权限边界及质量方法，区分自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121945482838880421", "track": "creative", "source": {"id": "2121945482838880421", "text": "兄弟们，我花了整整两周！！\n终于把 MiniMax H3 的打戏做成了一个拿来就能用的 Skill：h3-fight，已经开源。\n\n打戏本来不是 H3 的强项：打得像流水账，机位死板，刀插进身体里，两个人打着打着就换了边。\n\n这两周我在本地 4090 48G 上，把社区底模、Pika H3 Flex、加速 LoRA、剪枝和非剪枝版一批批对比过，社区的方法也学了一圈，大多收效不大。\n\n最后我选择的是 BUNNY 的打斗 LoRA：\n· H3_Combat_V2       0.5：出拳出刀有力道\n· H3_Fight_Flow_V1   0.65：攻防接得顺\n· Motion_Repair_V1  0.25：快动作不变形、不穿模\n· turbo_v4                    0.7：加速，10 秒一段 6分钟出片\n\n主干用 FL2VA/Ref2VA 混合版，再加两遍采样。\n\nLoRA 让它能打，提示词决定打得好不好看。\n\n我们把所有出过好片的提示词拆成 188 个镜头块，加上招式表和踩坑表。\n如果写错了，提交前就会被检查脚本拦下。\n\n仙侠、日漫、真人古装喜剧都试过，最长一条两分半，自我打分从 70 涨到 90。\n\n现在只要对 Claude Code 或 Codex 说一句：\n“帮我写一段打戏”，它就会自己挑镜头、拼好、自检，一条命令出片。\n\n项目地址\nGitHub：https://t.co/LlMrIHSwuK", "createdAt": "Sun Nov 15 12:36:41 +0000 2026", "replyCount": 57, "retweetCount": 12, "likeCount": 105, "conversationId": "2121945482838880421", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "quotedTweet": {"id": "2121775554429104299", "text": "又用本地部署MiniMax H3 + 武打skill做了一集海贼王！\n\n基于 minimax_h3_hybrid_fl2va_ref2va_b25-49-int8 底模，在管线里串联了四个核心 LoRA 来攻克打戏的三大死穴：\n\n   1、 minimax_h3_turbo_v4_step600_ema_pruned 把采样步数从几十步硬砍到 8 步，让本地显卡跑 8 步就能直接出片。\n\n   2、bunny_H3_Combat_V2 打出拳脚刀剑的真实肉搏感，再用 bunny_Fight_Flow_V1 顺滑衔接出招、闪避与连招。\n\n   3、bunny_Motion_Repair_V1 压住高速运动下的肢体变形与穿模，彻底稳住对打时的人体结构。\n\n想要的朋友评论区回复，人多的话，我把它开源出来。", "createdAt": "Sun Nov 15 01:21:27 +0000 2026", "replyCount": 40, "retweetCount": 8, "likeCount": 85, "conversationId": "2121775554429104299", "author": {"username": "servasyy_ai", "name": "huangserva", "profileImageUrl": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, "authorId": "1998968758422179840", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121774356129054720/img/JChxoTmV4DsasnVo.jpg", "width": 1664, "height": 928, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121774356129054720/img/JChxoTmV4DsasnVo.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121774356129054720/vid/avc1/1664x928/GTQgIXqli1b0kSZE.mp4?tag=29", "durationMs": 50553}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121938180274573313/img/pt9x1LDoTPsNUq8x.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121938180274573313/img/pt9x1LDoTPsNUq8x.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121938180274573313/vid/avc1/2560x1440/cGdZ40tDrQt3-yJb.mp4?tag=29", "durationMs": 150416}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "huangserva", "role": "出海、SEO 与增长实践与观察", "why": "有机器人模型适配及 AI 3D 游戏制作记录，连接工程、产品与商业实践。", "handle": "servasyy_ai"}, "createdAtIso": "2026-11-15T12:36:41+00:00", "createdAtBeijing": "2026-11-15T20:36:41+08:00", "createdAtLocal": "11-15 20:36 北京", "url": "https://x.com/servasyy_ai/status/2121945482838880421", "themeId": "editorial", "signalScore": 78, "editorial": {"id": "2121945482838880421", "technicalRelevant": true, "dailyGrade": "A", "channel": "creative", "topic": "h3-fight打戏生成Skill开源", "evidence": "Skill：h3-fight，已经开源", "rationale": "自述发布具体工具及作品，披露LoRA配方与生成流程"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1998970271458537475/jcT0J2z6_normal.jpg"}, {"id": "2121914607434391558", "track": "agent", "source": {"id": "2121914607434391558", "text": "推荐港大 HKUDS 开源的 AgentPilot，把 Agent 在反复试错过程中「下一步该做什么」单独作为一个策略优化问题。\n\n它用一个 9B 策略模型指导 Codex、Claude Code、DeepSeek Harness 等 Agent，决定从哪个版本继续改进、探索什么方向，以及如何分配试错预算。\n\n具体来说，AgentPilot 会记录每次尝试的结果、版本关系和剩余预算，通过 KL-UCB 或 Policy Memory 利用历史反馈，持续调整后续的探索策略。\n\n项目还提供 RSI Arena，用来评估 Agent 在多轮尝试中的改进效果，以及这些改进能否泛化到未见任务。\n\n作者也报告，在 Terminal-Bench 2.1 实验中，经过 10 轮改进，未见任务上的成绩从 44.9% 提升至 69.4%，提高了 24.5 个百分点。\n\n我比较关注它对 Agent 自我改进的一个具体切入点：把试错过程中的策略选择单独拿出来优化，让 Agent 能够根据真实反馈，逐渐学会如何更有效地探索。\n\n对于长时间运行的 Agent，如何利用有限的试错预算，可能会直接影响系统最终能改进到什么程度。\n\n💻 GitHub: https://t.co/HtyN0xhFo8", "createdAt": "Sun Nov 15 10:34:00 +0000 2026", "replyCount": 9, "retweetCount": 14, "likeCount": 65, "conversationId": "2121914607434391558", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-15T10:34:00+00:00", "createdAtBeijing": "2026-11-15T18:34:00+08:00", "createdAtLocal": "11-15 18:34 北京", "url": "https://x.com/Xudong07452910/status/2121914607434391558", "themeId": "editorial", "signalScore": 77, "editorial": {"id": "2121914607434391558", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "AgentPilot试错策略优化", "evidence": "通过 KL-UCB 或 Policy Memory", "rationale": "介绍开源策略模型、预算分配及作者实验"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122019605271167009", "track": "research", "source": {"id": "2122019605271167009", "text": "ParseBench-2 hit 30k monthly downloads in 3 days, and is #3 on @huggingface trending benchmarks! 📈\n\nIn ParseBench-2, we tried hard to create a comprehensive taxonomy of metrics to evaluate document processing, while creating a severity-based framework to align these metrics with human judgment.\n\nWhether you’re deeply familiar with document OCR and document OCR benchmarks, or just getting started, we encourage you to check out the ParseBench-2 methodology. We’re happy to help you pick whatever subset of metrics you care about if you’re looking to process documents in production.\n\nWe’ve merged dozens of PRs since the release date, including fixes/metric updates from some of our peers. We’re aggressively fixing any lingering annotation and metric issues.\n\nReport: https://t.co/f6SxkKIlme\nHugging Face: https://t.co/T1FLO2V2xd\nGithub: https://t.co/9hWGjYacmf", "createdAt": "Sun Nov 15 17:31:13 +0000 2026", "replyCount": 27, "retweetCount": 7, "likeCount": 35, "conversationId": "2122019605271167009", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2120921239619612921", "text": "Today we’re introducing ParseBench-2 - our most ambitious document parsing benchmark to date.\n\nIt is the only benchmark that provides both extreme granularity into every single type of production parsing error, while also making sure that metric scores are highly aligned with human judgment. We do this by painstakingly assigning severity scores to 330+ error types, and tuning each metric to match the severity scores. \nExisting benchmarks either use brittle deterministic metrics (e.g. OmniDocBench) or LLM-as-a-judge (ParseArena), which can help recognize equivalent representations but are coarse/stochastic/subject to bias by the prompt+model.\n\nParseBench-2 also contains:\n✅ 4.3k+ document pages (double from ParseBench-1).\n✅ An extra dimension (forms)\n✅ Much better ground-truth across all dimensions compared to ParseBench-1.\n\nThis is the next evolution of ParseBench, our hugely popular benchmark that has 50k+ monthly downloads, over 150+ OCR solutions benchmarked, and has been adopted by companies like NVIDIA, Cohere, Aleph Alpha, Perplexity, and others.\n\nAlongside ParseBench-2, we are also releasing OCRia-1.5 - a new family of document parsing models that powers all our modes in LlamaParse. They represent a massive step up in capabilities from our latest release, and are state of the art in parsing complex tables, forms, charts, formatting, and assigning bounding boxes to complex layouts.\n\nCome check out our blog post, technical report, and website.\n\nBlog: https://t.co/TKbfCyTjht\nTechnical Report: https://t.co/eAu0s6ttA1\nWebsite: https://t.co/PWczfhp0OX\n\nIf you’re interested in trying out our OCRia-1.5 capabilities, come sign up for LlamaParse: https://t.co/XYZmx5TFz8", "createdAt": "Thu Nov 12 16:46:42 +0000 2026", "replyCount": 108, "retweetCount": 28, "likeCount": 213, "conversationId": "2120921239619612921", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120918905564934150/img/aNxe4MZD-e4CRt3L.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120918905564934150/img/aNxe4MZD-e4CRt3L.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120918905564934150/vid/avc1/3840x2160/1zMkM_LouY39o-de.mp4?tag=29", "durationMs": 167042}], "translationZh": "今天，我们推出 ParseBench-2——迄今为止我们最具雄心的文档解析基准。\n\n它是唯一既能极细致地分析生产环境中各类解析错误，又能确保指标评分与人类判断高度一致的基准。为此，我们逐一为 330 多种错误类型评定严重程度，并调整各项指标，使其与这些评分相匹配。\n现有基准要么采用脆弱的确定性指标（如 OmniDocBench），要么采用 LLM 评审（ParseArena）。后者有助于识别等价的表达形式，但评估较粗、具有随机性，也容易受到提示词和模型的偏差影响。\n\nParseBench-2 还包含：\n✅ 4,300 多页文档（是 ParseBench-1 的两倍）。\n✅ 新增一个评估维度：表单。\n✅ 相比 ParseBench-1，所有维度的标准答案质量都大幅提升。\n\n这是 ParseBench 的新一代版本。这个广受欢迎的基准每月下载量超过 5 万次，已评测 150 多种 OCR 方案，并被 NVIDIA、Cohere、Aleph Alpha、Perplexity 等公司采用。\n\n与 ParseBench-2 一同发布的还有 OCRia-1.5——一个全新的文档解析模型系列，为 LlamaParse 的所有模式提供支持。相比上一版本，其能力大幅提升，在复杂表格、表单、图表、格式解析，以及为复杂版面标注边界框方面达到领先水平。\n\n欢迎查看我们的博客、技术报告和网站。\n\n博客：https://t.co/TKbfCyTjht\n技术报告：https://t.co/eAu0s6ttA1\n网站：https://t.co/PWczfhp0OX\n\n如果你想体验 OCRia-1.5 的能力，欢迎注册 LlamaParse：https://t.co/XYZmx5TFz8"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXLtLrEaIAAEUJt.jpg", "width": 2048, "height": 1186, "previewUrl": "https://pbs.twimg.com/media/HXLtLrEaIAAEUJt.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-15T17:31:13+00:00", "createdAtBeijing": "2026-11-16T01:31:13+08:00", "createdAtLocal": "11-16 01:31 北京", "url": "https://x.com/jerryjliu0/status/2122019605271167009", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2122019605271167009", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "ParseBench-2文档解析评测与OCRia-1.5", "evidence": "330+ error types", "rationale": "发布细粒度错误评测框架及解析模型"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "ParseBench-2 上线仅 3 天，月下载量就达到 3 万，并登上 @huggingface 热门基准榜第 3 名！📈\n\n在 ParseBench-2 中，我们力求为文档处理评估建立全面的指标分类体系，同时构建基于问题严重程度的评估框架，让这些指标与人类判断保持一致。\n\n无论你对文档 OCR 及其评测基准已经十分熟悉，还是刚刚入门，都欢迎了解 ParseBench-2 的评测方法。如果你计划在生产环境中处理文档，我们很乐意帮你挑选所需的指标子集。\n\n自发布以来，我们已合并数十个 PR，其中包括同行贡献的修复和指标更新。我们正在全力修复尚存的标注和指标问题。\n\n报告：https://t.co/f6SxkKIlme\nHugging Face：https://t.co/T1FLO2V2xd\nGithub：https://t.co/9hWGjYacmf"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2121762607958835415", "track": "agent", "source": {"id": "2121762607958835415", "text": "Agent 开始接长期目标之后，怎么划定它的工作范围就变得很关键。\n\nHarrison Chase 和 Actively AI 刚发了一篇《Goal Engineering》，核心观点很简单：提出了一个挺有启发的观点：按照人最容易提供反馈的方式，来划分 Agent 的工作范围。\n\nAgent 很多时候出错，是因为缺少上下文。文档、API 这些信息还好补，真正麻烦的是专家脑子里的隐性知识，比如品牌调性、销售策略该多激进，这些往往需要靠反复反馈来校准。\n\nActively 做销售 Agent 的经历就很典型。\n\n最初他们为每个客户分配一个 Agent，结果销售需要在一堆 Agent 之间来回切换，在某个客户身上积累的经验，也很难复用到其他客户。\n\n后来改成按「Motion」划分，也就是让一个 Agent 专门负责一类工作，比如外联或早期销售推进。\n\n这样销售可以集中审核同类任务，一次反馈就能影响更多客户。客户资料则由后台 Agent 按需收集。\n\n文章最后还有个挺大胆的判断：「Prompt Engineering 和 Context Engineering 会消失，但 Goal Engineering 会留下来。」\n\n这个预测可以讨论，但我挺认同其中一点：Agent 的工作范围怎么划，直接决定了人类反馈能否被有效复用。\n\n对于长期运行的 Agent，这可能是个很值得重视的架构设计问题。\n\n📎 https://t.co/ydraZmHVcB", "createdAt": "Sun Nov 15 00:30:00 +0000 2026", "replyCount": 8, "retweetCount": 8, "likeCount": 47, "conversationId": "2121762607958835415", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "quotedTweet": {"id": "2121635683999883577", "text": "Goal Engineering: How to Design Goals", "createdAt": "Sat Nov 14 16:05:39 +0000 2026", "replyCount": 133, "retweetCount": 74, "likeCount": 594, "conversationId": "2121635683999883577", "author": {"username": "hwchase17", "name": "Harrison Chase", "profileImageUrl": "https://pbs.twimg.com/profile_images/1569345624935485442/R67C4wCQ_normal.jpg"}, "authorId": "2728439146", "article": {"title": "Goal Engineering: How to Design Goals", "previewText": "Written in conjunction with @mgarimella (Actively AI) and Anshul Gupta (Actively AI)\nThe scope of tasks that agents can take on has increased drastically over the past few years. They have gone from", "titleZh": "目标工程：如何设计目标", "previewTextZh": "与 @mgarimella（Actively AI）和 Anshul Gupta（Actively AI）共同撰写\n过去几年，智能体能够承担的任务范围大幅扩大。它们已经从……"}, "translationZh": "目标工程：如何设计目标"}, "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-15T00:30:00+00:00", "createdAtBeijing": "2026-11-15T08:30:00+08:00", "createdAtLocal": "11-15 08:30 北京", "url": "https://x.com/Xudong07452910/status/2121762607958835415", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2121762607958835415", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "按反馈复用方式划分Agent职责", "evidence": "一次反馈就能影响更多客户", "rationale": "提供销售Agent职责调整案例与反馈复用方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2121812884862926998", "track": "growth", "source": {"id": "2121812884862926998", "text": "想要做产品出海赚美金，社媒营销是很重要的一环，这几个方法论要找人付费咨询，高低不得发个上千红包，建议直接收藏👇\n\n一、 渠道与受众画像定位\n\n在海外推广技术或 AI 工具类产品时，渠道首选 YouTube。长视频能够完整呈现工作流与实操任务，给用户充足的时间理解产品价值，且长尾效应和转化率远优于以碎片化内容为主的短视频平台。\n\n定位达人时需将创作者画像与目标受众画像拆开考虑：\n一种是泛科技类博主，用于快速起量与新品曝光尝鲜；\n另一种更具长效价值的是垂直场景博主，例如日常分享特定工作流的人群。\n\n重点不在于达人是否标榜自己是 AI 博主，而在于他能否将工具自然融入到目标用户的实际业务场景与痛点中。\n\n二、 达人筛选指标\n\n衡量达人质量的核心指标是近期同形式视频的场均与中位数播放量，而非单纯的粉丝数。\n\n中尾部正处于成长期的创作者往往报价友好、制作更用心，反而更容易产生高性价比的爆款。在数据门槛上，应要求达人近三十天内保持公开更新，近期长视频中位播放量不低于一千次，短视频不低于一万次。\n\n互动率是辨别刷量的重要防线，点赞与评论之和占播放量的比例建议达到百分之一以上。\n\n此外必须严格排查内容真实性，坚决剔除纯 AI 配音、纯数字人出镜的频道，人工抽查评论区是否具有真实的讨论氛围。合作前还需结合第三方数据工具核查其历史播放曲线与平台收益估算，排除月度播放突降为负数或数据剧烈异动的异常账号。\n\n三、 达人信息线索挖掘\n\n挖掘候选达人主要有四种高转化路径。\n\n最直接的方式是从竞品入手，反查竞品合作过的高播放视频创作者，这类达人已经受过市场检验且理解产品形态，建联时应错开竞品视频发布的高峰期（通常建议间隔两到四周以上）。\n\n第二种方式是场景词延伸，不要只搜产品品类本身，要围绕用户的具体工作任务展开搜索。\n\n第三种方式是相似受众扩展，以跑通转化的一两位标杆博主为主页种子，沿着相似的内容风格、受众画像做同类账号扩散。\n\n四、 沟通策略\n\n建联第一封邮件决定了生死，核心是去 AI 感、去群发感，字数尽量精简克制。\n\n第一行一定要用达人的真实姓名称呼对方，不要直接套用频道昵称。\n\n正文用一到两句话切入，真诚夸赞他近期发布的某一期具体视频，并讲清楚你的产品为什么能完美契合他的受众。开门见山说明这是一次付费合作（Paid Collaboration），简短介绍产品核心价值，直接询问对方的排期和报价。\n\n需求说明书（Brief）要分步提供：初次建联只发一到两页以内的通用简报，讲清产品形态和基本合作诉求即可，给达人留足创作想象空间；等价格与档期确认、正式启动项目后，再提供定制化的创意方向与具体场景方案。\n\n五、 报价评估与砍价模型\n\n拿到达人报价后，必须先在心中建立一套严密的测算模型，心中有数才敢谈价。\n\n第一步算基础预算，以达人近期同类视频的中位数播放量为准，乘以行业基准千次播放成本（CPM）。美区 YouTube 的 CPM 基准通常在 150 到 300 美元之间，TikTok 和 Instagram 约在 50 到 100 美元之间。\n\n第二步用达人报出的总价除以中位数播放量，反推其对应的实际 CPM。如果数值严重高出基准线，就要看其是否包含独家排他、全片定制、或者受众本身具备极高的行业溢价。\n\n第三步结合自己业务的漏斗数据倒推，根据预计播放量、点击率、付费转化率估算出预期付费用户数，再用报价除以预期人数得出单客获客成本，判断是否在可接受范围内。\n\n在最终议价环节，行业公认成功率最高的黄金降价幅度通常在原报价的七折左右（即下浮 30%）。如果对方报价超出预算但受众精准，可以以七折为锚点展开真诚议价。\n\n六、 内容共创与发布前 SEO 调优\n\n正式制作视频时，最重要的是找到产品融入真实工作流的切入点，切忌把达人当成纯念稿机器。\n\n建议调取达人以往表现最好的几期视频，分析其黄金前五秒的抓人钩子（Hook）和节奏，协助达人设计一个从真实问题切入的演示脚本。\n\n达人交付草稿视频（YouTube Unlisted 状态）审片时，是借力 SEO 获取免费长尾流量的最佳时机。\n\n标题要把受众真实搜索的高频关键词尽量前置；视频描述栏的第一行或第二行直接放置专属追踪链接，并在说明文案中自然嵌入核心搜索词；最后必须优化章节时间戳（Chapters），把单纯的时间序号改写为带场景关键词的任务名称，直接拉满 YouTube 算法的检索推荐权重。\n\n七、 复盘\n\n达人视频上线绝不是合作的终点，真正的增长来自于精准复盘。\n\n发布前必须为每位达人配置专属的短链与参数标签，置于视频最显眼位置。\n\n除了直接点击转化，工具类产品通常有很强的长尾效应，很多用户看完视频后会在几天甚至几周后通过 Google 搜索或直接输入网址访问。因此在数据统计上，必须引入具备首次触点来源归因能力的用户行为分析工具，将这部分由于达人种草带来的回流转化准确计算在内。\n\n每周固定复盘达人的播放量、互动率、点击数、激活数以及最终付费转化成本，用数据倒推哪些内容场景、哪种体量的博主能够真正跑通正向投产比。", "createdAt": "Sun Nov 15 03:49:47 +0000 2026", "replyCount": 8, "retweetCount": 3, "likeCount": 33, "conversationId": "2121812884862926998", "author": {"username": "Pluvio9yte", "name": "雪踏乌云", "profileImageUrl": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, "authorId": "1667439202357899267", "quotedTweet": {"id": "2121645512281723304", "text": "万字分享，用 AIsa + AI Agent 串起达人营销全流程", "createdAt": "Sat Nov 14 16:44:43 +0000 2026", "replyCount": 18, "retweetCount": 4, "likeCount": 67, "conversationId": "2121645512281723304", "author": {"username": "lonelygogo21", "name": "Liz栗子", "profileImageUrl": "https://pbs.twimg.com/profile_images/2100047882753896448/5itTh2OC_normal.jpg"}, "authorId": "1426136909659525130", "article": {"title": "万字分享，用 AIsa + AI Agent 串起达人营销全流程", "previewText": "我 2024 年刚开始做海外 AI 工具的 KOL 达人营销时，找达人真的是一件苦差事。\n那时候我用 SimilarTube、EazyKOL 这些插件，一个一个搜、一个一个点开主页，看内容、核对数据，再手动录入飞书多维表格。"}}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "雪踏乌云", "role": "内容、视觉与多模态实践与观察", "why": "具体拆出海运营、流量监控和自媒体 Bot 职责，跨场景实操价值高。", "handle": "Pluvio9yte"}, "createdAtIso": "2026-11-15T03:49:47+00:00", "createdAtBeijing": "2026-11-15T11:49:47+08:00", "createdAtLocal": "11-15 11:49 北京", "url": "https://x.com/Pluvio9yte/status/2121812884862926998", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2121812884862926998", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "海外达人营销筛选、议价与归因", "evidence": "发布前必须为每位达人配置专属的短链与参数标签", "rationale": "覆盖达人筛选到转化复盘，具体基准仍需验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1986098802680369152/s5DF1Q7Y_normal.jpg"}, {"id": "2121835140850602200", "track": "agent", "source": {"id": "2121835140850602200", "text": "Lauren Tan 在 AI Engineer 大会上的演讲《All Code Is Slop (Except Mine)》要点。她在 SpaceXAI 负责 Grok Bot 桌面版。\n\n1. 每纠正 AI 一次，就把这次纠正写成 lint 这类自动检查规则，少往 agents.md 这类说明文档里加话。违反 lint 规则的代码会直接报错、提交不上去，文档里的话 AI 不一定照做。\n\n2. 代码库是 AI 最主要的学习材料。里面的坏写法、临时补丁，会被下一个 AI 当成惯例照抄，像杂草一样越长越多，所以代码库要保持干净。\n\n3. 容易用错的东西，直接禁掉。React 里有个功能人都常用错，AI 更用不好，他们在产品代码里禁用了它，这类问题从此不再出现。\n\n4. 禁掉 99% 的代码注释。AI 爱在注释里给自己走的捷径找理由，后来的 AI 就照着学。她在 Cursor 时，这种“有理由的补丁”扩散开来，把应用拖得很卡。\n\n5. 让 AI 自己检查自己的活。AI 把程序跑起来像用户一样点一遍，交上录屏和截图，人审代码就变成看这些材料。她的 Token 大部分花在这一步。\n\n6. 以前用不起的检查方法，现在用得起了。用数学方法证明程序没问题这类严格验证，过去太费人力，AI 把成本降了下来。\n\n7. 结果：团队上个月合并了 1.1 万个 PR，被撤回的约 0.5%，应用比刚发布时还快。\n\n8. 先打好地基，再谈全自动。AI 写代码这一步本身出烂代码的话，全自动化只会出更多烂代码，还更费钱。", "createdAt": "Sun Nov 15 05:18:14 +0000 2026", "replyCount": 154, "retweetCount": 107, "likeCount": 818, "conversationId": "2121835140850602200", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2121673563489140863", "text": "my AIE talk is up! come hear how the grok @bot team ships so quickly without compromise on quality\n\nhttps://t.co/Fel7tlxqSL", "createdAt": "Sat Nov 14 18:36:10 +0000 2026", "replyCount": 303, "retweetCount": 580, "likeCount": 6977, "conversationId": "2121673563489140863", "author": {"username": "poteto", "name": "lauren", "profileImageUrl": "https://pbs.twimg.com/profile_images/2049256514091929600/Qu4030T2_normal.jpg"}, "authorId": "2832427459", "translationZh": "我的 AIE 演讲上线了！来听听 grok @bot 团队如何在保证质量的同时快速交付\n\nhttps://t.co/Fel7tlxqSL"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXJFIduW4AALFDa.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HXJFIduW4AALFDa.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXJFKEZWEAAoewn.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HXJFKEZWEAAoewn.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXJFLVMWcAAnsl4.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HXJFLVMWcAAnsl4.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXJFNJyXIAAPXzR.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HXJFNJyXIAAPXzR.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXJFOOXWsAA-Mlf.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HXJFOOXWsAA-Mlf.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXJFPA_WwAArLNZ.jpg", "width": 1600, "height": 900, "previewUrl": "https://pbs.twimg.com/media/HXJFPA_WwAArLNZ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11-15T05:18:14+00:00", "createdAtBeijing": "2026-11-15T13:18:14+08:00", "createdAtLocal": "11-15 13:18 北京", "url": "https://x.com/dotey/status/2121835140850602200", "themeId": "editorial", "signalScore": 84, "editorial": {"id": "2121835140850602200", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AI编程团队的质量约束与验收方法", "evidence": "每纠正AI一次，就把这次纠正写成lint", "rationale": "转述自动规则、代码治理及录屏验收等具体实践"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, {"id": "2121841127586410891", "track": "agent", "source": {"id": "2121841127586410891", "text": "MCP：npx 跑的工具变成远程服务\n\n这块我最想推荐。\n\n很多 MCP Server 是 stdio 模式，得用 npx 或 uvx 在本机起进程。想让几台电脑、几个客户端共用一个，就得自己想办法转成网络服务。\n\n1Panel 的做法是把命令塞进容器，用 Supergateway 转成 SSE 或 Streamable HTTP。进 AI → MCP，点创建，类型选 npx 或 uvx，运行命令照抄文档里的，比如：\n\nnpx -y @modelcontextprotocol/server-github\n或者：\n\nuvx mcp-server-fetch\n\nToken 之类的放进环境变量，选输出类型，填端口，创建。手上已经有 Claude Desktop、Cursor 那种 mcpServers 格式的 JSON，也可以直接导入，命令和环境变量会自动带进来。\n\n装了好几个之后，用绑定网站把它们收到同一个域名下，按路径区分，端口对外关掉，HTTPS 和访问限制在网站那边统一配。\n\n提醒一句，这里填的命令会在你的服务器上真实执行。导第三方配置之前，命令、镜像、挂载目录都过一眼。", "createdAt": "Sun Nov 15 05:42:01 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 0, "conversationId": "2121841123123683799", "inReplyToStatusId": "2121841126118392196", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW_g6sDbIAAfLBF.jpg", "width": 1080, "height": 608, "previewUrl": "https://pbs.twimg.com/media/HW_g6sDbIAAfLBF.jpg:small"}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-15T05:42:01+00:00", "createdAtBeijing": "2026-11-15T13:42:01+08:00", "createdAtLocal": "11-15 13:42 北京", "url": "https://x.com/sitinme/status/2121841127586410891", "themeId": "editorial", "signalScore": 52, "editorial": {"id": "2121841127586410891", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "通过 1Panel 将本地 MCP 转成远程服务", "evidence": "用 Supergateway 转成 SSE 或 Streamable HTTP", "rationale": "包含转换步骤、配置导入及统一访问管理方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2122017284881617264", "track": "creative", "source": {"id": "2122017284881617264", "text": "Claude真的还是太强了！我真的没想到我随手拍的视频完播竟然能上5%，全程我一点事儿都没有做！！！\n\n最近几个视频都是直接让用Monid抓取全网的b-roll素材库和motion动效做的，如果说我觉得不喜欢的，或者说我看到了，但是没有的，那么就把我觉得优质的视频用Hypit复刻，然后让Claude分析hypit处理的过程，然后分离出来放进我的素材库里\n\n大概在节奏上总结了一些经验，分享给大家\n\n1、同一个样式，全片最多出现 2 次\n回看第一版，同一种胶囊标签在 21 个画面里出现过\n\n2、能发散的地方不贴标签，用举例\n口播说\"让 AI 拆出这个项目需要哪些岗位\"\n画面就冒出 5 张岗位卡：需求分析、流程设计、知识库整理、提示词编写、测试验收，需要让AI有一些联想能力\n\n3、声音跟着画面里的东西走\n有具体对象，就配它自己的声音\n没有对象的落位和转场，才用通用音效\n\n4、人像小窗跟着脸走\n第一版是固定裁切，84% 的画面里脸偏出中心\n改成逐帧跟脸以后，偏移报警是 0\n\n5、每个素材完全展开后，截一张当海报看\n构图、居中、拥挤、有没有和前面重复，一张张过\n\n6、先定逐字稿，再动画面\n删错一句话，后面的画面全白做，这算一个降低TOKEN用量的小办法吧\n\n以上，祝大家都能够用Claude做出好的视频（最近在Claude防封上学到了点小东西，明天会更新一下这篇文章，重点就是账号隔离这一块）", "createdAt": "Sun Nov 15 17:22:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 11, "conversationId": "2122017284881617264", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "quotedTweet": {"id": "2111643235982655497", "text": "Claude Pro 从0-1开通：grok+新加坡地址最佳实战、含KYC（从页面如何点击到绕地区识别保姆级教程）", "createdAt": "Sun Oct 18 02:19:14 +0000 2026", "replyCount": 17, "retweetCount": 30, "likeCount": 274, "conversationId": "2111643235982655497", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "article": {"title": "Claude Pro 从0-1开通：grok+新加坡地址最佳实战、含KYC（从页面如何点击到绕地区识别保姆级教程）", "previewText": "最近解决了Claude封号的问题，稳定用了半个月了，然后我发现一堆人不知道到底怎么开通Claude的Max甚至pro，于是写了个保姆级教程攻略，从鼠标怎么点，地址怎么解决来一点点讲清楚，我们以开通pro为例（第四版-最新更"}}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122003951956664320/img/3NxBU3Umtdyk1Bob.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122003951956664320/img/3NxBU3Umtdyk1Bob.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122003951956664320/vid/avc1/1920x1080/yg8MuKYepoEzZCCD.mp4?tag=29", "durationMs": 210018}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "叫我阿杭", "role": "内容、视觉与多模态实践与观察", "why": "公开 Obsidian、录音与自媒体制作流程，直接贴合内容生产需求。", "handle": "Astronaut_1216"}, "createdAtIso": "2026-11-15T17:22:00+00:00", "createdAtBeijing": "2026-11-16T01:22:00+08:00", "createdAtLocal": "11-16 01:22 北京", "url": "https://x.com/Astronaut_1216/status/2122017284881617264", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2122017284881617264", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "Claude视频制作与节奏优化复盘", "evidence": "先定逐字稿，再动画面", "rationale": "提供素材复用、跟脸裁切及视听节奏具体方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, {"id": "2121844395997872587", "track": "creative", "source": {"id": "2121844395997872587", "text": "用 AI Coding 搭建网页 3D 场景时，很多人会先想到 Three.js。其实 PixiJS 也是个不错选择。\n\nPixiJS 是一个开源的 Web 图形渲染库，常用于网页游戏、互动动画和自定义画布界面。它通过 WebGL 或 WebGPU 在画布上绘制精灵、文字和图形，还提供资源加载、滤镜以及鼠标和触摸事件。\n\nPixiJS 同时支持 2D 和 3D。官方扩展 @​pixi/3d 提供相机、灯光、材质和 glTF 模型加载。通过 View3D，三维场景既可以铺满画布，也可以嵌入 2D 界面。比如在角色选择页，玩家可以从 2D 列表中切换角色，再旋转 3D 模型查看细节。\n\nThree.js 同样能在一张画布上组合 2D 和 3D。官方示例先渲染三维场景，再用正交相机叠加一层 2D 精灵。Three.js 围绕场景、相机和网格组织渲染，提供模型加载、骨骼动画、PBR 材质、相机控制和后处理等工具，适合以三维交互为主的应用，比如可以自由漫游的虚拟展厅，或能旋转商品模型、实时切换材质的产品配置器。\n\n城镇建造游戏 Inkline Town 把整套 3D 渲染从 Three.js 迁到了 PixiJS，画面整体和原版接近。作者在 SwiftShader 软件 WebGL 环境下测得，四个视角的单帧耗时下降了约 15%–54%，但代码量略有增加。\n\n相关链接：\n- PixiJS: https://t.co/7EHfT4qtNN\n- Inkline Town: https://t.co/vDHjnIGkTo\n- Three.js Example: https://t.co/ATwdY1rrca\n- PixiJS vs Three.js: https://t.co/LtYG3yEn3r", "createdAt": "Sun Nov 15 05:55:00 +0000 2026", "replyCount": 9, "retweetCount": 9, "likeCount": 80, "conversationId": "2121844395997872587", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "quotedTweet": {"id": "2121480187514867932", "text": "Moved Inktown from ThreeJs to @PixiJS 3D\n\nRunning on WebGPU, pixel-perfect migration, better performance 🪄 https://t.co/MV8Rqyk2sk", "createdAt": "Sat Nov 14 05:47:46 +0000 2026", "replyCount": 17, "retweetCount": 5, "likeCount": 208, "conversationId": "2121480187514867932", "author": {"username": "SandroMaglione", "name": "Sandro Maglione", "profileImageUrl": "https://pbs.twimg.com/profile_images/1805971349950676992/CIWSZiKB_normal.jpg"}, "authorId": "951852102518824962", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121479333965692928/img/uPaNo11OtZ-yj0Hj.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121479333965692928/img/uPaNo11OtZ-yj0Hj.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121479333965692928/vid/avc1/1920x1080/m8yCRvo2jcITdgRA.mp4?tag=29", "durationMs": 62636}], "translationZh": "将 Inktown 从 ThreeJs 迁移到了 @PixiJS 3D\n\n基于 WebGPU 运行，像素级还原，性能更好 🪄 https://t.co/MV8Rqyk2sk"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-15T05:55:00+00:00", "createdAtBeijing": "2026-11-15T13:55:00+08:00", "createdAtLocal": "11-15 13:55 北京", "url": "https://x.com/lencx_/status/2121844395997872587", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2121844395997872587", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "网页 2D 与 3D 渲染选型及迁移案例", "evidence": "四个视角的单帧耗时下降了约 15%–54%", "rationale": "提供选型方法与迁移案例，性能数据为作者转述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121891982654206414", "track": "tools", "source": {"id": "2121891982654206414", "text": "推荐 Top10：面向 前端 / 产品 / UI 的 Agent Skills（2026.11 更新版）\n\n5 月份分享的这份 Top10 Agent Skills，有 1.3k 收藏，最近还有朋友在收藏关注，因为已经是半年前分享的，我再更新一版，避免有失效或不是最优的版本。\n\n1. frontend-design\n来自 Anthropic，更偏「高完成度、强风格」的前端设计实现。OpenAI 的 frontend-skill 在 4 月下架后，它是各家工具里最稳的视觉方向 skill，适合想把页面做得更有辨识度时用。\nhttps://t.co/mWGc9UNNXa\n\n2. design-taste-frontend\n来自 Taste Skill（leonxlnx），补上 frontend-skill 留下的品牌站、落地页位置。强项是不做模板味的页面，多用真实照片和产品界面，并用浏览器检查来卡住完成度。\nhttps://t.co/f2HRkKz6Jf\n\n3. figma-design-to-code\n来自 Figma 官方，接替原来的 figma-implement-design。设计稿转代码优先用这个：它会先拿到设计上下文和截图，并复用 Code Connect 里的组件。\nhttps://t.co/MrhmqfU7V0\n\n4. web-design-guidelines\n来自 Vercel，做 UI 审查依然很强。可访问性、表单、动效、排版、交互细节，都能对照最新的 Web Interface Guidelines 系统地补漏。\nhttps://t.co/WzJU5PmwH7\n\n5. react-best-practices\n来自 Vercel，做 React / Next.js 基本必装。规则已经扩充到 70 条，官方名称改成了 vercel-react-best-practices，提升的是实现质量和性能。\nhttps://t.co/rx339BypwV\n\n6. shadcn\n来自 shadcn/ui 官方。它会读取项目里的 components.json，按你现有的组件、主题和 CLI 来拼界面，适合产品 UI 和设计系统落地。\nhttps://t.co/FlbPe7bZPs\n\n7. emil-design-eng\n来自 Emil Kowalski，专攻交互和动效的手感：按压、悬停、时机和过渡。同一仓库里的 review-animations 适合做完以后再审一轮。\nhttps://t.co/yHz7ondguN\n\n8. composition-patterns\n来自 Vercel，官方名称是 vercel-composition-patterns。适合做组件库和复杂的产品 UI：用复合组件和状态上提来减少布尔 props，让结构更容易接着改。\nhttps://t.co/m1o5L4rev7\n\n9. webapp-testing\n来自 Anthropic，依然适合日常的本地应用验证：检查页面行为、截图、日志和交互回归。OpenAI 的 playwright skill 已经进了废弃仓库，这个更贴近现在的用法。\nhttps://t.co/XMlMJlr6bM\n\n10. deploy-to-vercel\n来自 Vercel，由原来的 vercel-deploy-claimable 改名而来。做完页面马上能拿到预览链接；现在优先走 git 关联部署，不行再退回 CLI 或可认领的临时部署。\nhttps://t.co/YWoxALunjt\n\n怎么选 ？\n· 偏品牌官网/营销页：frontend-design、design-taste-frontend\n· 偏产品 UI/设计稿还原：figma-design-to-code、shadcn、react-best-practices、composition-patterns\n· 偏体验审查/可用性：web-design-guidelines、webapp-testing\n· 偏交互细节/动效：emil-design-eng\n· 偏预览闭环：deploy-to-vercel", "createdAt": "Sun Nov 15 09:04:06 +0000 2026", "replyCount": 9, "retweetCount": 5, "likeCount": 57, "conversationId": "2121891982654206414", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2035316234271764654", "text": "推荐 Top10：面向 前端 / 产品 / UI 的 Agent Skills\n\n这 10 个 Skills 考虑到设计落地频率、对视觉/交互质量的直接提升、在 Codex/Claude Code 等的高复用性。\n\n1. frontend-skill\n  来自 OpenAI，适合做 landing page、品牌页、demo 页。强项是视觉论点、内容节奏、首屏质量。\nhttps://t.co/baJxfqhRyf\n\n2. frontend-design\n  来自 Anthropic，更偏“高完成度、强风格”的前端设计实现。适合你想把页面做得更有辨识度时用。\nhttps://t.co/mWGc9UNNXa\n\n3. figma-implement-design\n  来自 OpenAI，设计稿到代码的核心 skill。凡是产品/设计/前端协作，这个都应该是常用项。\nhttps://t.co/WoM1lKKlM2\n   \n4. web-design-guidelines\n  来自 Vercel，做 UI 审查非常强。可访问性、表单、动效、排版、交互细节，都能系统性补漏。\nhttps://t.co/WzJU5PmwH7\n   \n5. react-best-practices\n  来自 Vercel，如果你做 React / Next.js，这个基本必装。它提升的是“实现质量”和“性能质量”。\nhttps://t.co/rx339BypwV\n   \n6. playwright\n  来自 OpenAI，前端不是只写代码，还要验证真实浏览器行为。这个是 UI 流程调试和回归检查的通用执行层。\nhttps://t.co/PlzxDLkmQC\n\n7. webapp-testing\n  来自 Anthropic，比 playwright 更贴近日常本地应用验证，适合检查页面行为、截图、日志和交互回归。\nhttps://t.co/XMlMJlr6bM\n \n8. canvas-design\n  来自 Anthropic，适合更自由的视觉探索、展示型页面、画布式交互或概念设计，不是每个项目都需要，但做创意产品页很有价值。\nhttps://t.co/GnxQxNNcfb\n \n9. brand-guidelines\n  来自 Anthropic，如果你在做官网、营销页、设计系统、品牌一致性，这个比单纯“写 UI”更上层，适合产品/品牌协同。\nhttps://t.co/Ks7fz9L2VX\n \n10. vercel-deploy-claimable\n  来自 Vercel，严格说它不是设计 skill，但对前端/产品工作流非常关键。做完页面立刻可部署预览，反馈闭环会快很多。\nhttps://t.co/nb5HL6himn\n\n- 怎么选？-\n· 偏品牌官网/营销页：frontend-skill、frontend-design、brand-guidelines\n· 偏产品 UI/设计稿还原：figma-implement-design、react-best-practices、web-design-guidelines\n· 偏交互验证/可用性：playwright、webapp-testing\n· 偏创意探索：canvas-design", "createdAt": "Sat Mar 21 11:22:59 +0000 2026", "replyCount": 22, "retweetCount": 246, "likeCount": 964, "conversationId": "2035316234271764654", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HD7lTKIbYAApgDr.jpg", "width": 1918, "height": 1440, "previewUrl": "https://pbs.twimg.com/media/HD7lTKIbYAApgDr.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXJ5gZOawAAWgpp.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXJ5gZOawAAWgpp.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-15T09:04:06+00:00", "createdAtBeijing": "2026-11-15T17:04:06+08:00", "createdAtLocal": "11-15 17:04 北京", "url": "https://x.com/shao__meng/status/2121891982654206414", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2121891982654206414", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "前端与UI Agent Skills资源清单", "evidence": "面向 前端 / 产品 / UI 的 Agent Skills", "rationale": "列出十项资源、适用场景及选择方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2121895732726870435", "track": "agent", "source": {"id": "2121895732726870435", "text": "AI 写完代码，功能能跑、测试也过了，就真的安全吗？比如把请求里的用户 ID 换一下，就能看到别人的订单——这种问题，普通功能测试还真不一定能发现。\n\nOpenAI 开源的 Codex Security，就是想让 AI 帮你多做一轮安全审查：阅读源码、追踪攻击路径，找出可能被利用的漏洞，再协助修复和验证。\n\n它把安全审查做成了一套完整流程。除了告诉你“这里可能有问题”，还会提供源码位置、攻击前提和验证依据，并保存扫描记录，方便后续去重、修复和跟踪。\n\n你可以在 Codex 里装插件使用，也可以通过命令行、SDK 或 GitHub Actions 接到开发流程中。\n\n登录授权、多租户隔离、文件上传这类敏感模块，都适合拿来试试。\n\n命令行上手也不复杂：安装 npm install --global @openai/codex-security\n\n运行 cs login 登录，再进入项目执行 cs scan .。\n\n不过，建议第一次先选一个小目录做标准扫描，设好预算，确认报告有没有实际价值，再考虑 Deep Scan。\n\n开源不代表模型调用免费，账号是否有扫描权限也需要确认。", "createdAt": "Sun Nov 15 09:19:00 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 1, "conversationId": "2121895732726870435", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2119757392821022781", "text": "看别人用 niri、Hyprland，窗口一排排很顺，顶栏和控制中心也齐；自己装完才发现：启动器、通知、锁屏、音量、网络、壁纸、主题，还得一件件拼。窗口管理器装好了，桌面才刚开始搭。\n\nDux Modular Shell（还常叫 DMS，以前叫 DankMaterialShell）想填的，就是这段从「能开窗口」到「能天天用」的空档。\n\n它不是新的窗口管理器，而是套在 Wayland 合成器外面的桌面外壳：顶栏、Dock、启动器、通知、锁屏、控制中心、主题，收进一套设计、一套设置、一套插件。\n\n官方支持 niri、Hyprland、Sway 等，团队自己日常用 niri。\n\n它真正省掉的，是一整套“桌面拼装”工作\n\n传统的轻量桌面，常常需要把多个工具串起来：Waybar 做顶栏，Fuzzel／Rofi 做启动器，Mako／Dunst 做通知，Swaylock 做锁屏，再另配空闲管理、壁纸、夜间色温和认证提示。\n\nDMS 把这些常见需求集中到一个产品里。它的价值不只在于界面统一，也在于你不必为每一项功能分别学习配置格式、写脚本、找主题和处理交互。\n\n壁纸能生成配色往 GTK／Qt／终端推，2.1 还有界面密度、Classic 风格和视频壁纸。\n\n插件能往顶栏挂自己的状态——有人挂过 Kubernetes 当前 context，比空喊「可扩展」清楚。\n\n代价也直白：跑的东西更多，主题会自动改应用配置，插件几乎等于在你桌面会话里跑代码，没有完整沙箱。社区里有人说装完 Hyprland 终于像完整桌面；也有人嫌重、嫌偏鼠标、最后选更轻的壳。\n\n适合谁？\n想用平铺、又不想维护十几个小工具的人。已经把 GNOME／KDE 用得很顺，或机器只想留最少组件，就没必要为了截图好看硬迁。", "createdAt": "Mon Nov 09 11:42:00 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 2, "conversationId": "2119757392821022781", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119680813029822465/img/9m5aBwwH_fhzogh9.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119680813029822465/img/9m5aBwwH_fhzogh9.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119680813029822465/vid/avc1/1920x1080/EbZGAp69E5s2n1tn.mp4?tag=29", "durationMs": 276130}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121161331193819136/img/LS4dFUDXdHxwrwDi.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121161331193819136/img/LS4dFUDXdHxwrwDi.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121161331193819136/vid/avc1/1280x720/yJ2HeGnYZqeLYYyC.mp4?tag=29", "durationMs": 216448}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-15T09:19:00+00:00", "createdAtBeijing": "2026-11-15T17:19:00+08:00", "createdAtLocal": "11-15 17:19 北京", "url": "https://x.com/sitinme/status/2121895732726870435", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2121895732726870435", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Codex Security 安全扫描上手", "evidence": "第一次先选一个小目录做标准扫描，设好预算", "rationale": "提供安装扫描步骤及预算建议，发布说法待核实"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121948329521152353", "track": "agent", "source": {"id": "2121948329521152353", "text": "看到一个网站，想给自己的项目做一套类似的交互；用惯了一款老软件，却找不到适合新系统的替代品；玩到一个机制有趣的小游戏，想换一种题材重新实现。\n\n过去，通常要先拆需求、画界面、研究原作，再把观察结果一点点解释给开发者或 AI。即便 AI 写得出代码，你仍然需要判断：它到底理解了多少？做出来只是截图相似，还是功能真的能用？\n\nCraft Anything 就在尝试把这件事变简单。给它一个目标，再说清楚想做什么，它会先研究原作，然后让 AI 编程工具构建新项目，最后对照原作找差异、继续修改。\n\n它比较有意思的地方，是把“观察、开发、检查”串了起来。\n·比如参考一个网页的信息布局，换成自己的品牌和内容；\n·研究自己维护的老工具，尝试用新的技术重写；\n·或者把一个简单的游戏机制，改造成不同题材的原型。\n\n除了桌面界面，它也提供命令行和 MCP 接口，可以接进已有的 AI 工作流。\n\n使用时要先弄懂两个模式：默认的 Clean room 主要观察可见界面，不读取原作内部代码和文件；Deep 则可以深入分析，适合研究自有或获得授权的软件。\n\n软件本身开源免费，但生成项目需要接好编码工具，模型、订阅和素材生成也可能产生费用。\n\n可以把它当成一套处于早期 Alpha 阶段的“软件研究与重建工作台”。\n\n它能降低观察、拆解和起步实现的成本；复杂系统能否重建、结果是否可靠，仍然取决于目标、模型、工具链和验收方式。", "createdAt": "Sun Nov 15 12:48:00 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 2, "conversationId": "2121948329521152353", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2120078508521095594", "text": "用 AI 写网页，有个很烦的地方：它说“改好了”，你打开一看，按钮点不动、表单提交失败，最后还是得自己测试、截图，再让它改。\n\nVercel Labs 的开源工具 agent-browser，就是想把这一步也交给 AI：让它打开真实网页，自己点击、输入、查看结果，而不只是对着代码说“应该没问题”。\n\n它的操作方式：先把网页上的按钮、链接、输入框整理成一份清单，给每个元素标上编号，AI 再根据编号执行操作。\n\n比如找到搜索框、输入关键词、点击搜索，然后检查页面有没有出现预期结果。需要看布局时，还能截图，配合文字信息一起判断。\n\n实用场景\n就是让 AI 编程助手写完页面后，顺手走一遍真实用户流程：搜索能不能用、表单有没有报错、提交后有没有跳转，再留下截图和验证结果。\n\n它也能用来操作后台、查询动态网页、复现 Bug。安装主要分两步：装工具、准备浏览器，再通过 Skill 或 MCP 接到支持相应能力的 AI 助手里。\n\n不过，也别把它理解成“装上以后，AI 就能稳定操作所有网站”。\n\n验证码、登录风控、复杂控件都可能卡住；页面变化后，也需要重新观察。", "createdAt": "Tue Nov 10 08:58:00 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 0, "conversationId": "2120078508521095594", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2119992822048964608/img/iRcKY0c1T6TNE70x.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2119992822048964608/vid/avc1/1920x1080/IhgKlY-9fyRUD-Fw.mp4?tag=29", "durationMs": 258766}]}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120785217632059392/img/SDQtW_flO5TJ119L.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2120785217632059392/img/SDQtW_flO5TJ119L.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2120785217632059392/vid/avc1/1920x1080/bJLHdM4QVj79282C.mp4?tag=29", "durationMs": 302294}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-15T12:48:00+00:00", "createdAtBeijing": "2026-11-15T20:48:00+08:00", "createdAtLocal": "11-15 20:48 北京", "url": "https://x.com/sitinme/status/2121948329521152353", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2121948329521152353", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "软件观察、重建与验收工具", "evidence": "默认的 Clean room 主要观察可见界面", "rationale": "说明工作流程、接口、模式差异与使用限制"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, {"id": "2121843844077736356", "track": "agent", "source": {"id": "2121843844077736356", "text": "最近发现 Raft 有一些深度编程的问题。\n\n在对话过程中，尤其是使用时间比较长了，它可能是因为构造上下文的问题，导致 Agent 注意力越来越倾向于对话，而不是进行深度编程。\n\n比如，当你有两个 Agent 进行协作时，它们总会倾向于以另一个 Agent 的话作为原点进行 case by case 的优化，而不是进行思辨的、系统性的思考。\n\n而如果用 Claude Code 直接在里面去编码的话，其实是没有问题的。\n\n我的推测是因为上下文构造的问题，它在构造上下文时会带上不同的 channel 和一些历史记录，这些东西会导致它的行为偏向于对话而不是深度编程。\n\n我现在的解决方法，就是让 Raft 的 Agent 使用 Herdr 来进行编程，某种程度上是更加把 Agent 当人了\n\n这个方案同时也带来了一个非常大的好处，就是我可以直接在 herdr 里面查看任何一个 Agent 实时编码的状况，并且我也可以进行微管理。\n\n注意力管理也是门大学问。", "createdAt": "Sun Nov 15 05:52:49 +0000 2026", "replyCount": 21, "retweetCount": 2, "likeCount": 30, "conversationId": "2121843844077736356", "author": {"username": "kevinzhow", "name": "kevinzhow", "profileImageUrl": "https://pbs.twimg.com/profile_images/1808138216585023490/xQ3u-b4x_normal.jpg"}, "authorId": "22938360", "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "kevinzhow", "role": "Agent 与开发工具实践与观察", "why": "公开多 Agent 职责划分、跨系统协作及 Web 优先验收方式，工程细节明确。", "handle": "kevinzhow"}, "createdAtIso": "2026-11-15T05:52:49+00:00", "createdAtBeijing": "20 "createdAtLocal": "11-15 14:04 北京", "url": "https://x.com/liyue_ai/status/2121846663308591513", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2121846663308591513", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "创作者商单合作中的账号钓鱼复盘", "evidence": "根本不会跳到 https://t.co/gfUpu7l1ZV 官方授权页", "rationale": "自述商单钓鱼流程，提供授权页识别线索"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1995020278733443076/PAOgmVtW_normal.jpg"}, {"id": "2121798199837085793", "track": "tools", "source": {"id": "2121798199837085793", "text": "#开源推荐 ForesightJS：一个用于提前加载网页资源的开源前端库。当鼠标朝某个链接移动时，它可以在光标到达前触发回调，让应用先请求对应的页面或数据，从而缩短点击后的等待时间。也支持 Tab 键导航、滚动和触屏操作，并提供 React、Vue、Angular 和 Astro 的官方集成。开发者只需注册要观察的元素，并在回调中指定要加载的内容。\nhttps://t.co/3VB7WHl6j0", "createdAt": "Sun Nov 15 02:51:26 +0000 2026", "replyCount": 6, "retweetCount": 2, "likeCount": 14, "conversationId": "2121798199837085793", "author": {"username": "lencx_", "name": "lencx", "profileImageUrl": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, "authorId": "820285264819933184", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121797851584020480/img/FLiu1poVquE_Dd4J.jpg", "width": 2048, "height": 1276, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2121797851584020480/img/FLiu1poVquE_Dd4J.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2121797851584020480/vid/avc1/2970x1850/hNq4IZsYfyzZ7VYg.mp4?tag=29", "durationMs": 18581}], "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "lencx", "role": "Agent 与开发工具实践与观察", "why": "有 AI 设计工作室的工具链及自己的桌面产品实验，跨创作和工程价值强。", "handle": "lencx_"}, "createdAtIso": "2026-11-15T02:51:26+00:00", "createdAtBeijing": "2026-11-15T10:51:26+08:00", "createdAtLocal": "11-15 10:51 北京", "url": "https://x.com/lencx_/status/2121798199837085793", "themeId": "editorial", "signalScore": 61, "editorial": {"id": "2121798199837085793", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "ForesightJS 网页资源预加载库", "evidence": "当鼠标朝某个链接移动时", "rationale": "介绍开源库触发机制、接入方法与框架集成"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1777510753672785921/p0hrP-Qm_normal.png"}, {"id": "2121949262942720331", "track": "agent", "source": {"id": "2121949262942720331", "text": "近期在研究 DeepSeek Harness，也研究了一些能够让 Agent 在自主性和可调试性上获得更大提升的插件。挑了几个觉得还不错的，列出来，大家也可以试一试。\n\n1）dsh-market：DSH 的插件市场，支持插件搜索、安装和更新。建议优先安装，后续探索插件会方便很多。\n\n2）dsh-context：个人比较推荐。可以直观地看到 Context 的变化、Token 消耗和多 Agent 的运行状态。对于分析长任务中的决策偏差很有帮助，Agent Debug 正在从 Function Profiling 走向 Decision Profiling。\n\n3）dsh-ops：优化 Shell、文件操作和工具调用，减少 Token 消耗与执行开销。Agent 的性能优化，很多时候还需要从工具接口和执行路径入手。\n\n4）dsh-agent-teams：支持多 Agent 协作、任务依赖和状态持久化。比较值得研究的是任务调度与异常接管机制，多个 Agent 如何高效协作，仍然是个很有挑战的问题。\n\n5）Hindsight：提供 Retain、Recall、Reflect 三类能力，让 Agent 能够积累和复用历史经验。长期记忆的价值在于让过去的经验影响未来的决策。另外，billion-context 也有相似的上下文延续能力，只不过它更侧重超长会话的分层压缩与历史信息找回，适合长程任务。\n\n6）Ouroboros：通过 MCP 接入 DSH，围绕目标、执行和评测持续迭代。比较有意思的是，它开始尝试让 Agent 根据反馈调整自己的执行方式，向更深层次的 RSI 探索。\n\n这几个项目从执行调试、效率优化、多 Agent 协作，到长程任务、长期记忆和自我改进，覆盖了 Agent 工程中几个比较重要的方向。\n\n不过，我觉得目前还缺少一个比较成熟的任务管理插件，能够统一承接日常 TodoList、聊天和其他渠道产生的任务，管理优先级，并根据任务的复杂度、风险和 AI 的执行能力进行分级处理。简单任务自主完成，复杂任务持续推进，涉及关键决策和敏感操作时再交给人。\n\n最近我也在写一个插件，尝试解决这块的问题。希望把任务管理、主动调度、分级自主执行和人工接管整合起来，让 Agent 能够真正承担更多日常工作。\n\n有其他好用的插件，也欢迎推荐。👍", "createdAt": "Sun Nov 15 12:51:42 +0000 2026", "replyCount": 29, "retweetCount": 22, "likeCount": 151, "conversationId": "2121949262942720331", "author": {"username": "Barret_China", "name": "Barret李靖", "profileImageUrl": "https://pbs.twimg.com/profile_images/639253390522843136/c96rrAfr_400x400.jpg"}, "authorId": "272736093", "expert": {"priority": "P1", "domain": "企业落地与产品组织", "name": "Barret 李靖", "role": "企业落地与产品组织实践与观察", "why": "对 AI 自验证、验收瓶颈和研发分工具有系统性思考，补组织设计。", "handle": "Barret_China"}, "createdAtIso": "2026-11-15T12:51:42+00:00", "createdAtBeijing": "2026-11-15T20:51:42+08:00", "createdAtLocal": "11-15 20:51 北京", "url": "https://x.com/Barret_China/status/2121949262942720331", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2121949262942720331", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "DeepSeek Harness 插件与工程实践", "evidence": "看到 Context 的变化、Token 消耗和多 Agent 的运行状态", "rationale": "列出插件能力与适用场景，包含调试和协作方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/639253390522843136/c96rrAfr_400x400.jpg"}, {"id": "2122003448124338634", "track": "creative", "source": {"id": "2122003448124338634", "text": "GPT Image 2.5生成古风写真：残雪古桥\n\n提示词：\n9:16 竖版，高精度古风仙侠叙事感人物写真，偏写实东方幻想角色摄影，冬日残雪石桥场景。整体清雅、沉静、含蓄、若有所思，带轻微孤独感与古偶女主叙事氛围；画面清冷但明亮通透，不灰蒙、不整体泛青。\n\n画面主体是一位视觉年龄约 20–28 岁的年轻成年东方女性。古典柔和鹅蛋脸，脸部轮廓流畅秀气，面中自然饱满，下颌线细腻；柔和偏长的杏眼，眼神清亮但克制，视线轻轻偏离镜头，似乎望向寒潭或远山；眉形舒展，鼻梁秀气，唇形柔软自然。神情安静内敛，不笑得过于明显，带一点旅途中独自停留、心有所思的故事感。\n\n妆容为冷白月光妆，妆容浓度清透。轻薄冷白水润底妆，保留自然皮肤纹理与柔和光泽；浅灰棕、冷玫瑰棕眼影细腻晕染，强化柔和长眼结构；眼线纤细，睫毛自然分明；腮红极淡，仅保留自然血色；唇妆为低饱和冷豆沙粉、浅玫瑰色，柔润但不过度玻璃感。鼻梁、眼下、颧骨与唇峰带少量冷白高光，让面部在冬日冷光下依然通透有生气。\n\n黑色长发采用低挽古风发髻，后部长发自然顺垂，耳侧留有几缕柔软碎发。头饰华丽但清雅，以浅金花枝、白玉、珍珠、浅绿色玉石、白色花饰与细长流苏组成，避免过高、过重的宫廷头冠。耳饰为浅金、珍珠与玉坠组成的细长垂坠耳环。\n\n服装为轻纱外袍 + 精致刺绣内层 + 华丽腰封，中高华丽度，玉绿白金系。\n\n主服装使用清透玉绿色、浅青玉色，搭配珍珠白、象牙白、月白，局部使用浅金刺绣和白玉装饰。玉绿色只用于人物服装主体，不将环境染成绿色。\n\n内层为合身的珍珠白刺绣衣裙，上身剪裁自然贴合成年女性身体结构，胸部饱满自然，服装提供稳定包裹与支撑，形成清晰但协调的胸腰比例，不夸张变形。外层为半透明玉绿色轻纱长袍与宽大披纱，袖摆和裙摆具有轻柔垂坠感。\n\n衣料带有浅金花卉、藤蔓、冰晶与流云纹刺绣，肩臂、袖缘及裙摆分布精致花卉立体装饰。腰间为宽幅玉绿金纹华丽腰封，搭配浅金镂空金属件、白玉、珍珠和细长玉坠，强调纤细腰线与上下身体比例。\n\n人物站在一座覆有残雪的古老石桥中央，身体正面轻微侧向镜头，肩颈自然打开，腰背挺直，双手安静自然地轻叠于腰前，或一只手轻轻握住另一侧衣袖。人物没有夸张舞姿，不做抓拍动作。\n\n采用中景全身至近全身构图，镜头位于人物正前方略偏侧的位置，约 70–100mm 人像镜头感。人物完整呈现，从头饰到裙摆及鞋履均不裁切。人物占画面主体，但仍保留足够的石桥、寒潭和远山环境，形成明显的叙事空间。\n\n场景为残雪石桥 / 冬水寒潭 / 枯枝远山。\n\n近景是带有岁月纹理的灰白石桥栏杆，桥面散落不均匀薄雪和少量裸露石面；画面边缘有覆雪枯枝自然伸入。\n\n中景为安静的冬日寒潭，水面平缓，呈自然冷灰蓝色，带细微柔亮反光，不做鲜艳蓝绿色水体。\n\n远景为层叠冬山、覆雪山峰、裸枝树林与轻薄冬雾。山体保持自然灰蓝、岩灰与雪白层次，环境颜色与人物玉绿色服装明确区分。\n\n冬日淡白自然光从人物斜侧后方照射，配合寒潭水面的柔和冷反射光，为人物面部提 const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
