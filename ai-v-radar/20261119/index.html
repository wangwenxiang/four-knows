:39+00:00", "createdAtBeijing": "2026-11-18T15:36:39+08:00", "createdAtLocal": "11-18 15:36 北京", "url": "https://x.com/vikingmute/status/2122957141128696268", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2122957141128696268", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "开源可变字体Allo", "evidence": "加了一个 Roundness（圆润度），可以自己调节", "rationale": "介绍开源字体及圆润度、字重等可用特性"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2122960402665668728", "track": "tools", "source": {"id": "2122960402665668728", "text": "Pake 终于终于支持桌面端了，可以把你的任何网页一键打包成 Mac、Windows、Linux 应用，同时内置了 500 的网站配置，也加上了去广告插件的能力。\n\nCLI 持续开源 4 年有 123 个国家 6w 多开发者使用，喜欢 CLI 的直接免费使用，喜欢 GUI 的小伙伴就可以试试这个～\nhttps://t.co/llOIMChlft https://t.co/7gjnXitBQ8", "createdAt": "Wed Nov 18 07:49:37 +0000 2026", "replyCount": 33, "retweetCount": 37, "likeCount": 388, "conversationId": "2122960402665668728", "author": {"username": "HiTw93", "name": "Tw93", "profileImageUrl": "https://pbs.twimg.com/profile_images/1960753219115868169/EOxKSK4w_normal.jpg"}, "authorId": "1521688129559613440", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122960136759361536/img/vajG8wCj7vXALRXb.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122960136759361536/img/vajG8wCj7vXALRXb.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122960136759361536/vid/avc1/1920x1080/UyBkLPcApYf5erZ3.mp4?tag=29", "durationMs": 52300}], "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Tw93", "role": "开源产品与工程实践实践与观察", "why": "有用 Agent 操作设备、Mole 跨平台更新及网页体验改进的具体实践。", "handle": "HiTw93"}, "createdAtIso": "2026-11-18T07:49:37+00:00", "createdAtBeijing": "2026-11-18T15:49:37+08:00", "createdAtLocal": "11-18 15:49 北京", "url": "https://x.com/HiTw93/status/2122960402665668728", "themeId": "ed 52831488/me-KUIug_normal.png"}, "authorId": "740238495952736256", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123120091374194688/img/DWbIM1ogn4ed5GJe.jpg", "width": 1280, "height": 720, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123120091374194688/img/DWbIM1ogn4ed5GJe.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123120091374194688/vid/avc1/1280x720/bqdMqjkiJOKj5VYA.mp4?tag=29", "durationMs": 60000}], "expert": {"priority": "P0", "domain": "机器人领域突破", "name": "NVIDIA AI", "role": "机器人模型与仿真平台", "why": "五方向 X 主动热点搜索：机器人领域突破", "handle": "NVIDIAAI"}, "createdAtIso": "2026-11-18T18:25:31+00:00", "createdAtBeijing": "2026-11-19T02:25:31+08:00", "createdAtLocal": "11-19 02:25 北京", "url": "https://x.com/NVIDIAAI/status/2123120433029672971", "themeId": "editorial", "signalScore": 80, "hotspotMatches": [{"id": "robotics", "label": "机器人领域突破", "matchedTerms": ["robot"]}], "hotspotDirections": ["robotics"], "hotspotDirection": "robotics", "hotspotDirectionLabel": "机器人领域突破", "discoveredBy": "x-hotspot-search", "editorial": {"id": "2123120433029672971", "technicalRelevant": true, "dailyGrade": "B", "channel": "tools", "topic": "Cosmos Data Factory合成训练数据工作流", "evidence": "including rare events and defects", "rationale": "介绍数据变体生成、校验及双提示词工作流"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "🧪 从一段驾驶视频、一项机器人任务、一个商店场景或一块电路板开始。\n\nNVIDIA Cosmos Data Factory 蓝图可生成多种变体，包括罕见事件和缺陷，检查结果，并准备训练数据。\n\n用一条提示词搭建环境，再用第二条运行你选择的工作流。\n\n阅读技术详解 → https://t.co/PnQK3ZfxON"}, "avatar": "https://pbs.twimg.com/profile_images/2055340743552831488/me-KUIug_normal.png"}, {"id": "2122855192358178891", "track": "research", "source": {"id": "2122855192358178891", "text": "没想到 Jason Wei 已经离开 Meta，去 AI 数据公司 Mercor 当首席科学家\n\n美国时间 11 月 17 日，Mercor CEO Brendan Foody 宣布，Jason Wei 出任首席科学家，负责组建研究团队，主管数据和评测。Jason Wei 随后发帖确认：在 Meta TBD 实验室待了一年，“训练 AI 模型的公司比以往任何时候都多，数据会决定下一个前沿”。\n\nJason Wei 在 Google Brain 时是思维链论文的第一作者，让模型先写推理步骤再给答案，这个做法后来被广泛使用。之后他在 OpenAI 参与了 o1 和深度研究，2025 年 7 月被 Meta 重金挖走。\n\n他另一个强项是给 AI“出题”。他主导的 SimpleQA 测模型会不会瞎编，BrowseComp 测 AI 能不能翻遍网页找到冷门答案，都成了各家发模型时常用的评测，他还参与了医生打分的 HealthBench。他在博客里写过一条“验证者法则”：一项任务越容易验证，就越容易训练 AI 学会。\n\nMercor 做的正是这门生意：平台上有 500 多万名医生、律师、工程师，帮 AI 公司出题、写标准答案、给模型打分。11 月 10 日它刚融了 7.5 亿美元，估值 200 亿美元，一年翻倍。现在不只大实验室，越来越多企业拿开源模型自己训练，都需要这类数据和评测。Mercor 10 月起组建研究团队，LoRA 作者 Edward Hu 已经加入。\n\n对 Meta 来说有点尴尬。TBD 实验室由 Scale AI 创始人 Alexandr Wang 领导，Meta 2025 年花 143 亿美元买下 Scale 49% 的股份，而 Mercor 是 Scale 的主要对手。TechCrunch 去年报道，TBD 研究员嫌 Scale 数据质量差，更愿意用 Mercor 和 Surge 的。这也是继 9 月 Andrew Tulloch 被报道转投 Anthropic 之后，TBD 又一位知名研究员离开。\n\nJason Wei 没说为什么离开 Meta，Meta 暂未回应。", "createdAt": "Wed Nov 18 00:51:33 +0000 2026", "replyCount": 75, "retweetCount": 8, "likeCount": 107, "conversationId": "2122855192358178891", "author": {"username": "dotey", "name": "宝玉", "profileImageUrl": "https://pbs.twimg.com/profile_images/561086911561736192/6_g58vEs_normal.jpeg"}, "authorId": "3178231", "quotedTweet": {"id": "2122826605362127094", "text": "After an amazing year at Meta’s TBD lab, I am very excited to join Mercor as Chief Scientist. Data will shape the next frontier as more companies train AI models than ever before. Mercor is incredible and I look forward to building the future with Brendan, Adarsh, and team!", "createdAt": "Tue Nov 17 22:57:57 +0000 2026", "replyCount": 147, "retweetCount": 43, "likeCount": 1320, "conversationId": "2122826605362127094", "author": {"username": "_jasonwei", "name": "Jason Wei", "profileImageUrl": "https://pbs.twimg.com/profile_images/2060220817720676352/m6hcgBJ9_normal.jpg"}, "authorId": "1319101874532978690", "translationZh": "在 Meta 的 TBD 实验室度过精彩的一年后，我非常激动地宣布，将加入 Mercor 担任首席科学家。随着越来越多的公司训练 AI 模型，数据将塑造下一个前沿。Mercor 非常出色，我期待与 Brendan、Adarsh 和团队一起创造未来！"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "宝玉", "role": "内容、视觉与多模态实践与观察", "why": "能补足原始材料上下文，也有自己的音视频制作实验。", "handle": "dotey"}, "createdAtIso": "2026-11 pbs.twimg.com/amplify_video_thumb/2123098345048608768/img/FQURL_c4ufQ0vlXI.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123098345048608768/img/FQURL_c4ufQ0vlXI.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123098345048608768/vid/avc1/1920x1080/7GM-wwkDsodfPZZu.mp4?tag=29", "durationMs": 86833}], "translationZh": "全球顶级 AI 艺术节再度归来。\n\nAIF 2027 将再次聚焦电影、设计、时尚、广告和游戏领域的 AI 创作，并在纽约、洛杉矶和东京举办盛大展映。\n\n现已开放投稿：https://t.co/YgXwT8sUXB https://t.co/e2CvcAkSCO"}, "expert": {"priority": "P1", "domain": "生成式视频", "name": "Cristobal Valenzuela", "role": "Runway / 联合创始人兼 CEO", "why": "AI 视频产品和创意工具", "handle": "c_valenzuelab"}, "createdAtIso": "2026-11-18T18:00:37+00:00", "createdAtBeijing": "2026-11-19T02:00:37+08:00", "createdAtLocal": "11-19 02:00 北京", "url": "https://x.com/c_valenzuelab/status/2123114168391749723", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2123114168391749723", "technicalRelevant": true, "dailyGrade": "C", "channel": "creative", "topic": "Runway AIF 2027开放作品征集", "evidence": "Submissions are now open", "rationale": "提供AI创作征集机会及举办城市信息"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "第五届 Runway AI Festival 将于明年在纽约、洛杉矶和东京举行，致敬在艺术与科技前沿不断探索的艺术家和创作者。\n\n欢迎加入我们。\n\nhttps://t.co/XcSHlitRdK"}, "avatar": "https://pbs.twimg.com/profile_images/2070496516893229056/bm-CWE5N_normal.jpg"}, {"id": "2123129712301969597", "track": "agent", "source": {"id": "2123129712301969597", "text": "Rolling out Teammates and Multiagent effort on iOS and Android. With Teammates, your Perplexity mobile app turns into a mini workOS in your pocket. Enjoy!", "createdAt": "Wed Nov 18 19:02:23 +0000 2026", "replyCount": 31, "retweetCount": 5, "likeCount": 108, "conversationId": "2123129712301969597", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2123126865829515363", "text": "Teammates and Multiagent are now in the Perplexity app on iOS and Android, with voice for Teammates.\n\nAbout a third of the most demanding Computer work already starts on iPhone. Now control Teammates with voice.\n\nAvailable today for Max subscribers.", "createdAt": "Wed Nov 18 18:51:05 +0000 2026", "replyCount": 26, "retweetCount": 12, "likeCount": 110, "conversationId": "2123126865829515363", "author": {"username": "perplexity_ai", "name": "Perplexity", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009310641165660160/XArF3_Ib_normal.jpg"}, "authorId": "1599587232175849472", "translationZh": "Teammates 和 Multiagent 现已上线 iOS 和 Android 版 Perplexity 应用，Teammates 还支持语音交互。\n\n在最复杂的 Computer 任务中，已有约三分之一从 iPhone 发起。现在，你可以用语音操控 Teammates。\n\n即日起向 Max 订阅用户开放。"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-18T19:02:23+00:00", "createdAtBeijing": "2026-11-19T03:02:23+08:00", "createdAtLocal": "11-19 03:02 北京", "url": "https://x.com/AravSrinivas/status/2123129712301969597", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2123129712301969597", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Perplexity移动端上线Teammates与Multiagent", "evidence": "with voice for Teammates", "rationale": "明确移动端功能上线、语音支持及订阅范围"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "Teammates 和 Multiagent 正陆续上线 iOS 和 Android。有了 Teammates，你的 Perplexity 移动应用就成了口袋里的迷你工作操作系统。尽情体验吧！"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2123044300954976471", "track": "agent", "source": {"id": "2123044300954976471", "text": "很多 AI 助手看起来已经很聪明了，但一放进真实软件，就会暴露一个问题：它会回答，却不一定能和界面配合。\n\n比如它正在查哪份资料、准备改什么、什么时候需要你确认，这些交互往往都得开发者自己写。换个 Agent 框架，还可能再适配一遍。\n\nAG-UI 就是想解决这件事。你可以把它理解成 AI Agent 和应用界面之间的一套共同语言：开始执行、输出文字、调用工具、更新状态、等待用户确认，都用统一的事件表达。\n\n这样，AI 就不只是待在聊天框里，而是能和页面上的表格、按钮、表单一起工作。\n\n它和 MCP 也能搭配：MCP 主要帮 AI 连接工具，AG-UI 主要负责让执行过程和用户交互接起来。\n\n举个例子，你在合同系统里打开一份合同，助手能知道你正在看哪份；让它比较两份合同，它可以把结果展示成表格；准备修改合同状态时，先给你一张确认卡片，等你点头再继续。\n\n这种“看得见过程，也能随时参与”的体验，才是它比较有意思的地方。", "createdAt": "Wed Nov 18 13:23:00 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 0, "conversationId": "2123044300954976471", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122228486677127169/img/H2canqekZ42skRjA.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122228486677127169/img/H2canqekZ42skRjA.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122228486677127169/vid/avc1/1920x1080/7ZU1agVf4RoiaqC8.mp4?tag=29", "durationMs": 134017}], "expert": {"priority": "P1", "domain": "出海、SEO 与增长", "name": "sitin", "role": "出海、SEO 与增长实践与观察", "why": "能把 AI 工具与数据分析、用量核算等实际经营问题连接起来。", "handle": "sitinme"}, "createdAtIso": "2026-11-18T13:23:00+00:00", "createdAtBeijing": "2026-11-18T21:23:00+08:00", "createdAtLocal": "11-18 21:23 北京", "url": "https://x.com/sitinme/status/2123044300954976471", "themeId": "editorial", "signalScore": 55, "editorial": {"id": "2123044300954976471", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "AG-UI统一Agent与界面的事件交互", "evidence": "都用统一的事件表达", "rationale": "解释协议用途及确认交互，含具体应用示例"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}], "preview": false, "productionMonitored": 122};

const safeURL=s=>/^https:\/\//.test(s||'')?esc(s):'';
let active='all',query='';
const textClass=s=>{const han=(String(s||'').match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(s||'').match(/[A-Za-z]/g)||[]).length;return han>latin/4?'zh':'en'};
function source(p,quote=false){let a=p.author||{};return `<div class="${quote?'quote':''}">${quote?`<div class="label">${a.profileImageUrl?`<img class="quoted-avatar" src="${safeURL(a.profileImageUrl)}" alt="" loading="lazy">`:""}引用 · ${esc(a.name||'')} @${esc(a.username||'')} · ${esc(date(p))} 北京</div>`:''}<div class="text ${textClass(p.text)}" lang="${textClass(p.text)==='en'?'en':'zh-CN'}">${esc(p.text)}</div>${p.translationZh&&p.translationZh.trim()!==String(p.text||'').trim()?`<div class="text translation zh" lang="zh-CN">${esc(p.translationZh)}</div>`:''}${p.article?`<div class="quote"><div class="label">X 文章预览 · 全文见原帖</div><div class="${textClass(p.article.title)}">${esc(p.article.title)}</div><div class="text ${textClass(p.article.previewText)}">${esc(p.article.previewText||'')}</div>${p.article.titleZh||p.article.previewTextZh?`<div class="translation zh">${esc(p.article.titleZh||'')}<div class="text">${esc(p.article.previewTextZh||'')}</div></div>`:''}</div>`:''}${(p.media||[]).length?`<div class="sourcephotos">${p.media.map(m=>`<a href="${url(p)}" target="_blank" rel="noopener noreferrer"><img src="${safeURL(m.previewUrl||m.url)}" loading="lazy" alt="${esc(a.name||'')} 的原帖${m.type==='video'?'视频预览':'配图'}" onerror="this.style.display='none'"></a>`).join('')}</div>`:''}<a href="${url(p)}" target="_blank" rel="noopener noreferrer">在 X 查看${quote?'引用':'完整'}原帖 ↗</a>${p.quotedTweet?source(p.quotedTweet,true):''}</div>`}
function card(r){const p=r.source,a=p.author;return `<article class="card" id="post-${r.id}"><div class="cardbody"><div class="byline"><div class="avatar">${r.avatar?`<img src="${safeURL(r.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(a.name.slice(0,1))}'))">`:esc(a.name.slice(0,1))}</div><div class="author">${esc(a.name)}<br><small>@${esc(a.username)} · ${esc(p.expert?.role||"")}</small></div><div class="date">${esc(date(p))}<br>北京</div></div></div><div class="originals">${source(p)}<div class="source-counts">♡ ${Number(p.likeCount||0)} · ↻ ${Number(p.retweetCount||0)} · ↩ ${Number(p.replyCount||0)}</div></div></article>`}
function renderNav(){const nav=document.getElementById('nav'),scroll=nav.scrollLeft;nav.innerHTML=[['all','全部频道'],...channels].map(([id,name])=>`<button type="button" data-channel="${id}" class="${id===active?'active':''}" aria-pressed="${id===active}"><span>${({'all':'全部','research':'模型研究','agent':'Agent','enterprise':'企业落地','growth':'出海增长','creative':'内容视觉','tools':'开源工具'})[id]}</span><small>${id==='all'?DATA.records.length:DATA.records.filter(r=>r.track===id).length}</small></button>`).join('');nav.scrollLeft=scroll}
function render(){renderNav();const matches=DATA.records.filter(r=>(active==='all'||r.track===active)&&(!query||[r.source.text,r.source.translationZh||'',r.source.quotedTweet?.text||'',r.source.author.name,r.source.author.username,channelName(r.track)].join(' ').toLowerCase().includes(query)));document.getElementById('viewtitle').textContent=active==='all'?'全部频道':channelName(active);document.getElementById('viewcount').textContent=`${matches.length} 条原声 · 完整原文与译文`;document.getElementById('feed').innerHTML=channels.filter(([id])=>matches.some(r=>r.track===id)).map(([id,name,desc],i)=>`<section class="channel"><div class="channelhead"><h3><span class="index">${String(channels.findIndex(c=>c[0]===id)+1).padStart(2,'0')}</span>${name}</h3></div><div class="cards" data-group="${id}">${matches.filter(r=>r.track===id).map(card).join('')}</div></section>`).join('')||'<div class="empty">没有匹配的内容。试试其他关键词，或切换到全部频道。</div>'}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;active=b.dataset.channel;render();const selected=document.querySelector(`[data-channel="${active}"]`);selected.focus({preventScroll:true});selected.scrollIntoView({block:'nearest',inline:'nearest'});document.getElementById('reading-start').scrollIntoView({block:'start'})});
document.getElementById('search-toggle').addEventListener('click',e=>{const input=document.getElementById('search');const opening=input.classList.contains('hidden');input.classList.toggle('hidden',!opening);e.currentTarget.setAttribute('aria-expanded',String(opening));e.currentTarget.textContent=opening?'关闭':'搜索';if(opening){input.focus()}else{input.value='';query='';render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
