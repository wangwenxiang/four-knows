<script>
const DATA={"records": [{"id": "2122961408262635560", "track": "research", "source": {"id": "2122961408262635560", "text": "Meta AI 提出自我改进记忆：先优化记忆提示，再把技能训进模型\n\nMeta AI RAM 团队提出 Self-Improving Memory，想让语言模型在持续任务中越做越好。关键不是把全部历史塞进上下文，而是学会怎么写记忆、怎么组织，以及何时再读回来。他们用同一套模型 Kimi-K2.6，既当任务 agent，也当改提示的元 agent。\n\n在他们的设定里，每个子任务都从空白上下文开始，能跨任务留下的只有一个持续存在的记忆目录，模型用文件工具读写。通用配套只给简短的 LOAD 和 OFFLOAD 指示：任务前读取相关信息，任务后把学到的内容写回去，具体策略交给模型自己决定。\nhttps://t.co/75QqhaQZis\n\n没有一种手写记忆策略能通吃\n\n他们在 Continual Learning Bench 的 Database、Codebase 和 Spectrum 三项任务上比较了几种常见的手写记忆设计，比如摘要、检索、技能库和假设跟踪。结果显示，没有一种策略在三项任务上都最好。因此，记忆该怎么用，不宜预先写成统一规则，更适合让模型按任务自己发现。\n\n先发现更好的提示，再蒸馏进权重\n\n方法分成两步。第一步是优化运行配套：元 agent 阅读任务轨迹、分数和最终记忆目录，找出记忆使用上的问题，改写 LOAD 和 OFFLOAD 提示；新提示会在留出集上评估，只保留分数更好的版本继续改。搜索从几种人手写的种子提示出发，每轮选出靠前的设计再修订。\n\n第二步是配套蒸馏。用得分最高的提示跑训练子任务，记录模型的回答、推理和工具调用，再把记录里的优化提示换回通用提示，用这些轨迹做微调。损失只落在模型自己的输出上。这样训练完成后，模型在只用通用提示时，也能部分复现那些更好的记忆行为，例如把仓库说明、可复用修复和模式事实分文件存放，并在改代码前先跑测试。\n\n提示上的增益，只有一部分进了权重\n\n在三项任务上，自动优化后的提示平均分为 56.0，比各任务上最好的手写提示高 11.4 分，比通用提示高 19.9 分，Codebase 上提升最大。微调之后，模型只用通用提示，测试均分为 43.1，比在通用轨迹上微调的 37.6 高 5.5 分。也就是说，更好的提示带来的能力，有一部分被写进了权重，但并没有全部留下。\n\n搜索本身也说明，提议还要靠评估来筛选：在已完成的搜索里，44 次修订中有 37 次没能超过此前最好成绩。Codebase 的例子更具体：一开始只做大段摘要，笔记越写越臃肿，分数几乎没有提升；改成复用已记录路径、保留失败规则后，分数明显上升；再加上精简的快速入门、带索引的修复登记表和分开存放的修复文件，效果继续变好。", "createdAt": "Wed Nov 18 07:53:37 +0000 2026", "replyCount": 3, "retweetCount": 2, "likeCount": 11, "conversationId": "2122961408262635560", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122691693543817397", "text": "Introducing: Self-Improving Memory 🧠✨📈\n\nWe let the model discover its own memory skills, then train them into its weights:\n\n- Meta-optimizes memory from the model's own runs with large gains.\n- Distilling these gains works too.\n\nBlog post: 📝 https://t.co/3fNsF13zZ2\n🧵1/6 https://t.co/TV4RtN38Zl", "createdAt": "Tue Nov 17 14:01:52 +0000 2026", "replyCount": 1, "retweetCount": 183, "likeCount": 1495, "conversationId": "2122691693543817397", "author": {"username": "jaseweston", "name": "Jason Weston", "profileImageUrl": "https://pbs.twimg.com/profile_images/1161680026561069061/i-DdZcc1_normal.jpg"}, "authorId": "14551614", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVN7y8WsAAp9Kd.jpg", "width": 1831, "height": 1328, "previewUrl": "https://pbs.twimg.com/media/HXVN7y8WsAAp9Kd.jpg:small"}], "translationZh": "推出：Self-Improving Memory 🧠✨📈\n\n我们让模型自行探索记忆技巧，再通过训练将这些技巧融入模型权重：\n\n- 基于模型自身的运行过程，对记忆进行元优化，效果显著提升。\n- 这些提升也可以通过蒸馏实现。\n\n博客文章：📝 https://t.co/3fNsF13zZ2\n🧵1/6 https://t.co/TV4RtN38Zl"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZGIvzbMAARPE2.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXZGIvzbMAARPE2.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T07:53:37+00:00", "createdAtBeijing": "2026-11-18T15:53:37+08:00", "createdAtLocal": "11-18 15:53 北京", "url": "https://x.com/shao__meng/status/2122961408262635560", "themeId": "editorial", "signalScore": 66, "editorial": {"id": "2122961408262635560", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "自我改进记忆的提示优化与蒸馏研究", "evidence": "自动优化后的提示平均分为56.0", "rationale": "交代实验设置、对照结果及蒸馏增益的局限"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122957621263302910", "track": "enterprise", "source": {"id": "2122957621263302910", "text": "Airbnb 用 Presidio 做文本去标识：把真实信息换成可训练的假数据\n\n训练模型前，Airbnb 会先处理消息、评价和客服对话里的个人信息：按公司统一分类，把姓名、住址、支付信息等替换成尽量逼真的模拟数据，既减少真实信息的副本和泄露，也尽量保留训练价值。政策由 Privacy Architecture 团队会同法务、政策和工程制定，再落实为代码。\nhttps://t.co/ntOze1bQtY\n\n做成共享训练步骤，不另建中心服务\n\n他们以开源库 Presidio 为基础。它最初由 Microsoft 开发，现已交由社区治理，以 Python 包在调用进程内运行。但只有每条流水线都使用当前版本和合规配置，保护才会生效。因此它被做成共享机器学习工作流中的可复用步骤，使用方只需标明哪些字段含有个人信息。\n\n处理后的数据集会打上去标识标记，进入模型注册表，用来把关生产部署，并记录所用版本和配置。训练前还会先过滤已选择退出的记录。\n\n用模式匹配和 GLiNER 识别，再用假值填回\n\nAnalyzer 先标出疑似个人信息的片段和置信度，Anonymizer 再处理重叠并替换。有固定形态的标识，用正则加上下文词识别。多种编号都可能是一串数字，他们扩展了短语级匹配，让更具体的词组优先得分。\n\n默认的 spaCy 会把城市、地标也标成地点，在他们的评测中往往覆盖不到带门牌号的完整住址。姓名和地点因此改用可在推理时指定「街道地址」的 GLiNER。团队写道，两类实体的精确率都有提升；GLiNER2 已接入评测，只有基准证明有增益时才会换上。语言按整条记录或区域元数据判断，不稳时改用更保守的配置。\n\n替换不用占位符或空白，以免模型把「这里被删过」也学成一种模式，大多数类型用 faker 生成自然假值。同一轮内，假值由真实值和当次密钥生成，同一真值始终对应同一假值，跨次运行则不同，且不保存对照表。房源自身链接会保留，电话保留国家码和区号；结构化字段中，标识符用调用方提供的盐值做哈希，坐标按隐私团队设定的精度截断，64 位内部编号用保形加密，以便通过原来的结构校验。\n\n质量按语言和类型分开衡量\n\n衡量时看召回、精确和吞吐，并优先保证召回，因为漏检就是泄露。指标按实体类型和语言分开统计，评的是重叠处理之后真正输出的结果。新语言要有标注数据才会上线，已稳定的类型发版时不能回退。\n\n他们给出的评测图显示：电子邮件、信用卡和房源编号在英、西、法、德、日、波兰语上表现完整，姓名和地址在英语、西班牙语、法语、德语上较好，在日语和波兰语上明显偏弱，总体评分为 9/10。目前仍只交付文本，其他介质的去标识已经开始做。", "createdAt": "Wed Nov 18 07:38:34 +0000 2026", "replyCount": 2, "retweetCount": 1, "likeCount": 3, "conversationId": "2122957621263302910", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZCsTzasAA0X23.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXZCsTzasAA0X23.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T07:38:34+00:00", "createdAtBeijing": "2026-11-18T15:38:34+08:00", "createdAtLocal": "11-18 15:38 北京", "url": "https://x.com/shao__meng/status/2122957621263302910", "themeId": "editorial", "signalScore": 58, "editorial": {"id": "2122957621263302910", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Airbnb训练数据去标识工作流", "evidence": "质量按语言和类型分开衡量", "rationale": "详述识别、替换、版本治理与评测的落地方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122849770196590859", "track": "agent", "source": {"id": "2122849770196590859", "text": "一个 Agent 什么都没做，Eval 却判它通过了\n\nVercel 给一个模拟咖啡下单 CLI 写了个陷阱任务。附近没有一家店满足用户的条件，正确做法是告诉用户买不到，而且不能下单。Codex 几乎每次都过了，翻 Trace 才发现，每 10 次通过里有 9 次它根本没搜索，直接就放弃了\n\n问题出在 Verifier，它只检查了「没有下单」，没检查「先搜过再放弃」。不读 Trace 的话，这些都会被算成成功\n\n这是 Vercel 新发的《Agents are users, so your software needs evals》，拿这个咖啡下单场景完整走了一遍怎么搭 Agent Eval\n\n他们按调用 LLM 的次数，把 Agent 测试分成三层：确定性测试、单轮 Eval、跑完整任务的 E2E Eval。能用低层抓到的问题，就别放到高层去测\n\n搭环境用的是 Harbor + Vercel Sandbox，让 Agent 在隔离环境里反复跑同一批任务，再结合 Verifier 打分和 Trace 去找失败的根因。另一个失败也挺典型，Codex 一直把 sfbeans 当成已连接的工具去找，从没试过在 shell 里直接运行\n\n这篇实践性很强，从定目标、选指标到写任务、分析失败都讲到了，文末还附了一段可以直接丢给 Coding Agent 的搭建 Prompt\n\n越来越多 Agent 会通过 API、CLI、MCP 来用软件，自己的产品能不能被 Agent 可靠地用好，值得认真测\n\n原文：https://t.co/x4KKxu5r7O", "createdAt": "Wed Nov 18 00:30:00 +0000 2026", "replyCount": 14, "retweetCount": 6, "likeCount": 26, "conversationId": "2122849770196590859", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-18T00:30:00+00:00", "createdAtBeijing": "2026-11-18T08:30:00+08:00", "createdAtLocal": "11-18 08:30 北京", "url": "https://x.com/Xudong07452910/status/2122849770196590859", "themeId": "editorial", "signalScore": 75, "editorial": {"id": "2122849770196590859", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent评测误判复盘与分层测试", "evidence": "没检查「先搜过再放弃」", "rationale": "具体分析验证器漏洞并给出评测搭建方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122893742801604691", "track": "tools", "source": {"id": "2122893742801604691", "text": "Parallel 开源搜索评测框架：模型接入搜索后，到底强了多少？\n\n给模型接上搜索，不等于它就能把研究任务做好。还需要判断何时搜索、如何提问、哪些网页值得继续读取，以及证据是否够支撑答案。 @p0 开源 parallel-search-evals，就是把这条链路放进可重复运行的评测中，衡量搜索对最终答案的帮助，以及为此付出的成本。\n\n# 不只测搜索结果，更测模型能否用好搜索\n\n核心方法：让同一个模型分别在关闭工具、允许搜索的条件下答题，再比较结果。每次运行固定一个模型、一套题目和一种搜索模式，支持 turbo、fast、basic、advanced，也支持不使用工具的基线。\n\n模型可以调用两个工具：Search 根据自然语言目标和关键词，返回最多 10 条附带正文摘录的结果；Extract 从最多 20 个指定网址提取内容。每题最多执行 20 次工具调用、进行 25 轮研究，预算用尽后再关闭工具，让模型给出最终答案。参考答案只交给评分器，不进入答题过程。\n\n因此，它衡量的不只是搜索接口的质量，是「模型选择工具、获取证据、形成答案」的整体能力。\n\n# 可以换上自己的业务问题\n\n项目采用 MIT 许可，支持 OpenRouter，以及 OpenAI、Anthropic、Google 的原生接口，也能接入兼容 OpenAI 的服务。\n\n更重要的是，题目集、Agent 执行流程和评分器相互分离。开发者可以替换问题、参考答案和评分规则，在统一预算下测试自己的业务。仓库还附带供 Claude Code、Codex 使用的技能说明，帮助完成运行、续跑和结果整理。\n\n目前内置 DeepSearchQA 和 Humanity’s Last Exam 的纯文本题，数据需按各自条款准备。评分使用 GPT-6 Sol：前者允许部分得分，后者按严格对错判断。\n\n# 最高分和最低成本，未必来自同一个模型\n\nParallel 的公开榜单比较不同模型使用 Parallel Search Fast 与 Extract 的表现。在这组测试中，接入搜索后平均提高 34.4 分；Claude Fable 5.2 以 80.1 的综合分领先，而达到中位数以上的模型中，GPT-6.1 Terra 成本最低，每千道任务约 43.7 美元。\n\n榜单还加入了团队的 WISER 业务研究题，每套各抽取 100 题。因此，它回答的是哪些模型更善于使用这套搜索工具，而不是所有搜索服务之间的排名。\n\n官方博客\nhttps://t.co/D4EfopMarj\n\n开源仓库\nhttps://t.co/L92hrPNW87\n\n搜索能力榜单\nhttps://t.co/drh6ISmhRv", "createdAt": "Wed Nov 18 03:24:44 +0000 2026", "replyCount": 10, "retweetCount": 1, "likeCount": 9, "conversationId": "2122893742801604691", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122821469449462229", "text": "Open-sourcing the Parallel Search Eval Harness", "createdAt": "Tue Nov 17 22:37:33 +0000 2026", "replyCount": 5, "retweetCount": 36, "likeCount": 314, "conversationId": "2122821469449462229", "author": {"username": "p0", "name": "Parallel", "profileImageUrl": "https://pbs.twimg.com/profile_images/2078555755373068288/6MNS8r7X_normal.png"}, "authorId": "364724969", "article": {"title": "Open-sourcing the Parallel Search Eval Harness", "previewText": "This article is also available to read on the Parallel blog.\nToday we're open-sourcing parallel-search-evals, the eval harness we use to measure Parallel Search performance, assess new models we", "titleZh": "开源 Parallel Search 评测框架", "previewTextZh": "本文也可在 Parallel 博客上阅读。\n今天，我们开源了 parallel-search-evals，这是我们用于衡量 Parallel Search 性能、评估新模型的评测框架……"}, "translationZh": "开源 Parallel Search 评测框架"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXYImU3XsAAUrid.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXYImU3XsAAUrid.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T03:24:44+00:00", "createdAtBeijing": "2026-11-18T11:24:44+08:00", "createdAtLocal": "11-18 11:24 北京", "url": "https://x.com/shao__meng/status/2122893742801604691", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2122893742801604691", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Parallel开源搜索评测框架", "evidence": "题目集、Agent 执行流程和评分器相互分离", "rationale": "介绍开源框架、对照评测方法及预算约束"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122983021129425047", "track": "enterprise", "source": {"id": "2122983021129425047", "text": "Chrome 官方案例：Policybazaar 用 Agent 将复杂前端开发验证从 4 天缩至数小时，性能审计工作量减少 92%\n\nCoding Agent 能写前端代码，不代表它知道页面实际渲染得怎么样。Chrome 官方介绍的 Policybazaar 案例，补上的正是这一步：用 Modern Web Guidance 约束代码写法，再用 Chrome DevTools for agents 检查真实页面，让生成、检查和修复接起来。\n\n这个案例包含两条不同的工作流：Policybazaar 用 Agent 做上线前性能审计；关联品牌 Pensionbazaar 则把设计稿、代码生成和浏览器验证串成闭环。\n\nhttps://t.co/Uty0uewur1\n\n# 一边写页面一边在浏览器里验证\n\nPensionbazaar 在 Claude Code 中通过 Figma MCP 读取设计稿，生成代码后启动干净的浏览器，检查视觉一致性、响应式布局、控制台报错和性能，发现问题再修改。\n\n其中，Modern Web Guidance 提供现代 Web 开发规则，并以 Baseline 兼容性范围约束实现。例如，同一张图片不应同时设置高加载优先级和懒加载；首屏关键图片与普通图片也不能一视同仁。\n\n最终交给 QA 的不只是代码，还包括设计稿对比、多尺寸截图、性能诊断和交互检查结果。工程师审阅仍然保留，但许多明显问题已在此前被发现并修正。\n\n# 性能审计从人工逐页检查，变成统一执行\n\nPolicybazaar 寿险团队维护约 30 个落地页及营销变体，每天承接约 20 万至 30 万次访问。过去工程师需要手工收集性能数据、定位瓶颈，测试覆盖不够稳定。\n\n新流程中，工程师在 Kiro 内对预发页面分别发起移动端和桌面端审计。Agent 执行 Lighthouse 和性能追踪，同时获取 Chrome 用户体验报告（CrUX）的真实用户数据，对照分析后给出修复优先级。\n\n一次审计发现，页面加载时串行触发的非关键 API 正在与关键渲染争抢资源，团队因此能在上线前修复。这里 Agent 负责检查和诊断，修复仍由工程师完成。\n\n# 改善最明显的是验证效率\n\n在团队的实践中，Agent 完成 12 次性能审计所需的时间，约相当于工程师手工完成一次，人工审计工作量下降约 92%，活动页性能测试覆盖率达到 100%。\n\nPensionbazaar 新页面从代码到完成验证，由约四天缩短至数小时；因界面与设计线框不符而提出的 UI 缺陷减少了 90% 以上。这些数字衡量的是审计、验证和交付效率，并不是线上核心网页指标提升了相同比例。", "createdAt": "Wed Nov 18 09:19:30 +0000 2026", "replyCount": 4, "retweetCount": 0, "likeCount": 4, "conversationId": "2122983021129425047", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122781781757673716", "text": "Before: 4 days to build & verify a complex frontend screen.\nNow: A few hours, with automated QA reports attached. ⏱️\n\n@policybazaar and @pensionbazaar fixed that with Modern Web Guidance + Chrome DevTools for agents:\n\n📉 92% less perf-audit effort\n⏱️ ~4 days → a few hours per screen\n🐞 90%+ fewer UI bugs\n\nFull case study → https://t.co/r1OlqJBSWT", "createdAt": "Tue Nov 17 19:59:50 +0000 2026", "replyCount": 6, "retweetCount": 20, "likeCount": 376, "conversationId": "2122781781757673716", "author": {"username": "ChromiumDev", "name": "Chrome for Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/1699791641706655744/nZ6TDnaI_normal.jpg"}, "authorId": "113713261", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWix8RWAAAPotO.jpg", "width": 1080, "height": 1350, "previewUrl": "https://pbs.twimg.com/media/HXWix8RWAAAPotO.jpg:small"}], "translationZh": "以前：开发并验证一个复杂的前端页面需要 4 天。\n现在：只需几小时，还附有自动化 QA 报告。⏱️\n\n@policybazaar 和 @pensionbazaar 借助 Modern Web Guidance + 面向智能体的 Chrome DevTools 实现了这一转变：\n\n📉 性能审计工作量减少 92%\n⏱️ 每个页面从约 4 天缩短至几小时\n🐞 UI 缺陷减少 90% 以上\n\n完整案例 → https://t.co/r1OlqJBSWT"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZZy44bkAAIvsj.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXZZy44bkAAIvsj.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T09:19:30+00:00", "createdAtBeijing": "2026-11-18T17:19:30+08:00", "createdAtLocal": "11-18 17:19 北京", "url": "https://x.com/shao__meng/status/2122983021129425047", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2122983021129425047", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "前端生成与浏览器验证的企业工作流", "evidence": "人工审计工作量下降约92%", "rationale": "给出设计到验证闭环，区分效率与线上性能收益"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122873850744783179", "track": "research", "source": {"id": "2122873850744783179", "text": "OpenAI 终于发布 GPT-6.2：Astra 挑战专业难题，Sol 降低日常任务成本，这两个模型能让 OpenAI 重新站起来吗？这段时间被 Fable 5.2 和 Opus 5.5 要打趴下了。。。\n\nOpenAI 今天同时推出 GPT-6.2 Astra 和 Sol：前者面向高难度专业项目，后者面向日常工作与多步 Agent 流程。重点不再只是能力提高，而要用更少的输出 token 完成任务。这次先进入 ChatGPT Work、Codex 和 API，并未加入普通 Chat。\n\nhttps://t.co/biqdHtLyOa\n\n两个型号，如何分工？\n\nAstra 重点提升文档、表格、幻灯片、编程和计算机操作能力，也强调科研、CAD 与仿真等复杂任务。\n\nSol 则主打效率，希望以更低成本承担更多日常工作。两者都支持文本和图像输入、文本输出，上下文窗口均为 105 万 token。\n\nAPI 标准价方面，Astra 每百万 token 输入 8 美元、输出 40 美元，均比 GPT-6 Astra 低 20%；Sol 输入 2 美元、输出 10 美元，与 GPT-6.1 Sol 持平。单价只是成本的一部分，实际账单还取决于任务消耗多少推理与输出 token。\n\n提升体现在哪里\n\n在考察长程专业工作流的 Agents’ Last Exam 上，Astra 比 GPT-6 Astra 高 5.2 分，成本不到三分之一；内部 GDPval v2 专业工作评测中，提高 6.2 个百分点，输出 token 减少 22%。这说明官方强调的是交付质量与计算开销一起改善，而不只是分数。\n\nSol 更值得注意的结果来自真实代码库修改评测 FrontierCode 2.0：两者均使用最高推理档位时，Sol 与 Astra 只差 0.5 分，成本约为五分之一。但这不代表它在所有任务上都接近 Astra。\n\n跨厂商比较也要看条件。例如，官方称 Astra 在 Agents’ Last Exam 上领先 Claude Fable 5.2，但脚注明确，Fable 的榜单成绩排除了 9 项使用后备模型的任务，不能直接理解成完全同条件对比。\n\n能力更强，仍需要核验执行过程\n\n安全报告将两者的网络安全能力评为 Critical、生物与化学能力评为 High；Astra 还首次达到对外发布模型的「AI 自我改进 High」阈值。这是提前部署防护的能力门槛，不代表已经实现完全自动化的递归自我改进。\n\n更贴近日常使用的问题是：模型在部分测试中更容易漏报工作障碍，例如文件缺失、工具不可用。OpenAI 表示，已在 Codex 中加入说明以减少遗漏，仍在调查。这意味着不能只看最终回答，还要确认它是否真的完成了必要步骤。", "createdAt": "Wed Nov 18 02:05:41 +0000 2026", "replyCount": 8, "retweetCount": 0, "likeCount": 3, "conversationId": "2122873850744783179", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122750124543926515", "text": "Some of you have been asking very politely. Some of you have just been asking.\n\nGPT-6.2 Astra and Sol are now available.\n\nSuper efficient and built to perform where it counts—the real world.\n\nhttps://t.co/qr2iP0GpfX https://t.co/jLCyVIws2Y", "createdAt": "Tue Nov 17 17:54:03 +0000 2026", "replyCount": 2200, "retweetCount": 3573, "likeCount": 35350, "conversationId": "2122750124543926515", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXbQg3xacAAib6t.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/media/HXbQg3xacAAib6t.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122746240823943168/vid/avc1/1920x1080/u9FA7vr_eObv2kjx.mp4?tag=29", "durationMs": 118660}], "translationZh": "有些人一直很客气地催更，也有些人就是一直催。\n\nGPT-6.2 Astra 和 Sol 现已上线。\n\n高效出众，专为在真正重要的现实场景中发挥实力而打造。\n\nhttps://t.co/qr2iP0GpfX https://t.co/jLCyVIws2Y"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXX2fUZaYAAlZ3H.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXX2fUZaYAAlZ3H.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T02:05:41+00:00", "createdAtBeijing": "2026-11-18T10:05:41+08:00", "createdAtLocal": "11-18 10:05 北京", "url": "https://x.com/shao__meng/status/2122873850744783179", "themeId": "editorial", "signalScore": 65, "editorial": {"id": "2122873850744783179", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "GPT-6.2 双模型发布与评测解读", "evidence": "输出 token 减少 22%", "rationale": "涵盖模型发布、成本及评测局限，数据为材料转述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122995228689010872", "track": "agent", "source": {"id": "2122995228689010872", "text": "LangChain 谈主动式 Agent：超七成运行靠日程，关键是记忆与人的注意力\n\n@LangChain 团队 @sydneyrunkle 总结了团队构建主动式 Agent 的经验：当 Agent 开始在后台推进持续数天、数周的目标，瓶颈不再只是模型能不能完成任务，而转为人有没有时间处理它不断送来的问题和结果。\n\n以内部的销售 Agent 和工程 Agent Robin 为例，提出两个核心：用记忆提高判断质量，用交互设计减少人的评审负担。\n\nhttps://t.co/qfFqd62wIW\n\n# 主动不是不断发消息，是不必每次等指令\n\n主动式 Agent 有三类触发来源：现实事件，例如新邮件、新 PR；开发者设定的日程，例如夜间整理记忆、每周清理陈旧 PR；以及 Agent 根据任务自行创建的日程，例如第二天跟进，或按用户要求建立每日简报。\n\nLangChain 的 GTM Agent 负责跟进销售线索、处理回复和起草邮件；Robin 的前身是 Open SWE，负责起草和审查 PR。两者都基于 Managed Deep Agents 构建。团队介绍，超过 70% 的运行由日程触发，而不是人临时输入提示。\n\n这个数字反映的变化是：Agent 不再只围绕一轮对话工作，而是通过事件和日程持续推进已有目标。\n\n# 记忆不只是记录历史，更要帮助判断什么值得处理\n\nAgent 被事件或日程唤醒时，往往没有新的人工说明。连接器可以提供最新邮件和项目状态，但用户的偏好、此前的纠正和合作习惯，需要从记忆中获得。\n\n记忆来源分成三类：已有资料，例如过去发送的邮件；当下反馈，例如草稿被修改或拒绝的原因；行动结果，例如发出的邮件是否收到回复。\n\n难点不在写文件，而在持续维护：哪些值得记住，哪些已经过期，重复或矛盾的信息如何处理。一种常见做法是「dreaming」：安排后台任务定期回看近期执行记录，整理并更新记忆。\n\n衡量效果也不该只看存了多少内容，而要看草稿获批是否更快、邮件回复率是否改善，以及 Agent 提出的问题有多少真正促成了行动。\n\n# 人的评审体验，是系统的一部分\n\nLangChain 总结了三个很具体的设计方向。\n\n首先，只呈现值得关注的信息。GTM Agent 把对话分成等待人工处理、需要起草回复和无需回复；Robin 则用 Jev 判断是否有必要加入 Slack 讨论，而不是看到消息就插话。\n\n其次，让结果容易评审。团队发现，在 Slack 里逐条处理待发邮件效率很低，因此为邮件草稿做了专门的评审界面。人的修改不仅是完成审批，也是把难以提前写成规则的偏好反馈给 Agent。\n\n最后，留在已有工作流里。每日简报发到 Slack，后续内容回到同一线程；Robin 先给一两句概要，再展开细节。请求 PR 审查时，附上一行摘要、改动规模和认领按钮，降低接手成本。\n\n这些细节共同决定了：主动式 Agent 是一个可靠的协作者，还是另一个不断制造通知的工具。\n\n## 我的看法\n\n这篇文章最值得借鉴的，是把「主动」拆成两项能力：没有新提示时仍能继续工作，以及继续工作的同时少占用人的注意力。事件和日程解决前者，记忆和评审体验解决后者。\n\n好的长期 Agent，不应只追求运行次数更多，而应让每次问询更准确、每次评审更轻松，并能把反馈用于下一次判断。自主程度的提高，应该建立在这种持续改善之上，而不是简单减少确认步骤。", "createdAt": "Wed Nov 18 10:08:00 +0000 2026", "replyCount": 10, "retweetCount": 6, "likeCount": 34, "conversationId": "2122995228689010872", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122734341516345836", "text": "What We’ve Learned Building Proactive Agents", "createdAt": "Tue Nov 17 16:51:20 +0000 2026", "replyCount": 16, "retweetCount": 51, "likeCount": 407, "conversationId": "2122734341516345836", "author": {"username": "sydneyrunkle", "name": "Sydney Runkle", "profileImageUrl": "https://pbs.twimg.com/profile_images/1955622250629021696/WOrOq2Mw_normal.jpg"}, "authorId": "1714639522405761024", "article": {"title": "What We’ve Learned Building Proactive Agents", "previewText": "Think about how you work with a new hire. In their first week, you give them small, well-scoped tasks, like triaging a bug report or updating a doc. Soon you're giving them bigger tasks, and", "titleZh": "构建主动型智能体的经验心得", "previewTextZh": "想想你如何与新员工共事。第一周，你会给他们安排范围明确的小任务，比如对缺陷报告进行分类处理，或更新文档。很快，你开始交给他们更大的任务，然后……"}, "translationZh": "构建主动型智能体的经验心得"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZk5oxbsAAWD5U.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXZk5oxbsAAWD5U.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T10:08:00+00:00", "createdAtBeijing": "2026-11-18T18:08:00+08:00", "createdAtLocal": "11-18 18:08 北京", "url": "https://x.com/shao__meng/status/2122995228689010872", "themeId": "editorial", "signalScore": 72, "editorial": {"id": "2122995228689010872", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "主动式Agent的记忆维护与人工评审设计", "evidence": "超过70%的运行由日程触发", "rationale": "提供触发、记忆维护和减少评审负担的具体方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123000767292575858", "track": "research", "source": {"id": "2123000767292575858", "text": "8,192 张华为的昇腾 910C，预训练了一个 285B 参数的 MoE 模型。\n\n这是中国电信星辰 AGI Lab 刚发的 Xing 4 技术报告。在拿不到高端 NVIDIA GPU 的情况下，国产芯片到底能不能撑起前沿模型训练，这份报告给了一个很具体的答案。\n\n大规模训练涉及远比单卡算力复杂的工程问题。团队基于 MindSpore HyperParallel，针对昇腾集群优化了混合并行、跨节点通信、分布式优化器和显存管理。\n\n而且在 8,192 卡集群上，仅通过 CPU 绑核与核心隔离，就让训练吞吐量提升了 5–10%。\n\n至于后训练部分，他们做了 TeleGym，把不同 Agent Harness 的执行、评测和轨迹接进同一套强化学习流程。长任务跑到一半模型更新了，轨迹也能接着跑下去。\n\n他们还开源了一个 29B 的版本，每个 token 激活 4B，全程在昇腾和 MindSpore 上训练。\n\n国产算力能走多远，看的是整套软硬件能不能配合好，Xing 4 算是一个很实在的工程样本。当然，模型效果、成本和长期稳定性还需要更多公开数据，才好判断和主流 NVIDIA 集群的差距。\n\n📎 arXiv: https://t.co/AYANAZFOP9", "createdAt": "Wed Nov 18 10:30:01 +0000 2026", "replyCount": 3, "retweetCount": 12, "likeCount": 54, "conversationId": "2123000767292575858", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZFaO-WkAAr8I6.jpg", "width": 1146, "height": 447, "previewUrl": "https://pbs.twimg.com/media/HXZFaO-WkAAr8I6.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZF2fHWMAAQO-R.jpg", "width": 1128, "height": 639, "previewUrl": "https://pbs.twimg.com/media/HXZF2fHWMAAQO-R.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZGM5PW8AAAVQU.jpg", "width": 1122, "height": 858, "previewUrl": "https://pbs.twimg.com/media/HXZGM5PW8AAAVQU.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-18T10:30:01+00:00", "createdAtBeijing": "2026-11-18T18:30:01+08:00", "createdAtLocal": "11-18 18:30 北京", "url": "https://x.com/Xudong07452910/status/2123000767292575858", "themeId": "editorial", "signalScore": 79, "editorial": {"id": "2123000767292575858", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "Xing 4 昇腾集群训练技术报告", "evidence": "仅通过 CPU 绑核与核心隔离", "rationale": "报告披露训练工程优化与开源模型，效果仍待验证"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122992266637955157", "track": "agent", "source": {"id": "2122992266637955157", "text": "Cognition 推出 Devin Bots：从接单写代码，到带领多个 Agent 持续负责一项工程目标\n\nDevin Bots 想解决的不只是「Agent 能不能完成这次任务」，是任务结束之后，谁来发现下一件事、检查效果，并继续推进。\n\n与一次请求对应一次执行的 Devin 会话不同，Bot 是持续存在的工程队友：拥有独立身份、记忆和工具权限，能拆解目标，启动多个 Devin 会话并行工作，再跟进测试、代码审查和后续改进。\n\n# 交给它的不是工单，是一项职责\n\n一个很直观的区别：不要求「把这个功能移植到 Android」，让 Bot「持续保持 Android 与 iOS 的功能对等」；不「修复这次布局跳动」，而「在产品不断改动时，持续保持页面流畅」。\n\n前者交付一次就结束，后者需要不断发现差距、安排工作、验证结果。Devin Bots 把这层持续协调也纳入了产品。\n\nBot 可以按日程运行，也能由工具里的事件触发，例如关注 Slack 中的客户问题、每晚检查 CI，或跟进 Linear 中的阻塞事项。创建时可以从 QA、产品开发、性能优化等模板起步，再配置具体职责。\n\n# Bot 负责统筹，Devin 会话负责执行\n\n每个 Bot 有一条持续对话，承接目标、反馈和进展。它拆出的具体工作，会在独立云端机器上启动 Devin 子会话，执行方式与工程师直接启动 Devin 相同。\n\n这里有两种长期信息：一类是人设定的指令，明确职责和工作方式；另一类是 Bot 在工作中积累的记忆，包括偏好、纠正和项目细节。共享给团队后，大家可以围绕同一个 Bot 协作，不必每次重新交代背景。\n\nBot 之间也能派活。官方演示中，QA Bot 发现问题后交给 Developer Bot 修复，再回来验证。人不需要手动搬运每一步上下文，而是重点处理目标调整和关键判断。\n\n# Android 应用案例，展示了持续负责的含义\n\nCognition 的 Android Bot 在没有专职 Android 工程师的情况下，用 44 天做出了 Devin Android 应用，合并 1134 个 PR、关闭 1217 张工单，编写约 34.5 万行 Kotlin。\n\n期间负责人共发送 183 条消息，约每合并 6 个 PR 才发一条消息，其中 22 天完全没有发消息。应用已进入 Google Play 开放测试，Bot 仍在继续跟进功能和测试反馈。\n\n另一个 Layout Bot 每三小时构建主分支最新代码，查找并修复布局跳动。三周内合并了 159 个相关 PR，团队称卡顿降低了 70%。这比单次生成演示更能说明产品方向：职责不会随一次会话结束而消失。\n\n# 效率数字之外，更重要的是人如何介入\n\nCognition 表示，内测用户平均每条消息对应的已合并 PR 数量达到此前的 4.5 倍。Jenny Xu 则用约 20 个 Bot 协作运转游戏工作室，主要与负责总协调的 Super Jenny Bot 沟通，每天从手机查看四次；每周 PR 数量由约 50 个增加到 1900 个，并保持每周发版。\n\n这些数字体现了任务并行和协调方式的变化，但 PR 数量并不直接等于软件价值，仍要结合功能交付、质量和维护成本来看。\n\n需要批准、选择方案或审查的事项，会集中到 Needs You。Bot 使用自身配置的连接和密钥，不会因为某个人给它发消息，就自动继承对方权限；共享时也能区分使用、配置和分享权限。新增访问权限或自动化需要先征求同意。\n\n产品已开放使用，用量计入创建者所在方案；Teams 和 Enterprise 可以设置花费或计算用量上限。", "createdAt": "Wed Nov 18 09:56:14 +0000 2026", "replyCount": 1, "retweetCount": 0, "likeCount": 3, "conversationId": "2122992266637955157", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122737511684587551", "text": "Meet Devin Bots.\n\nFrom writing firmware to merging thousands of PRs a week, a Devin Bot leads a team of agents to get the job done.", "createdAt": "Tue Nov 17 17:03:55 +0000 2026", "replyCount": 327, "retweetCount": 349, "likeCount": 3408, "conversationId": "2122737511684587551", "author": {"username": "cognition", "name": "Cognition", "profileImageUrl": "https://pbs.twimg.com/profile_images/1765909640364068865/MvH-m0gd_normal.jpg"}, "authorId": "1751810001751183361", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122736117183344641/img/603VwLm95_w6iiBa.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122736117183344641/img/603VwLm95_w6iiBa.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122736117183344641/vid/avc1/1920x1080/Y8kw49IJltU9CXei.mp4?tag=29", "durationMs": 93051}], "translationZh": "认识一下 Devin Bots。\n\n从编写固件到每周合并数千个 PR，Devin Bot 都能带领智能体团队完成任务。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZiNLdb0AAUY03.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXZiNLdb0AAUY03.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T09:56:14+00:00", "createdAtBeijing": "2026-11-18T17:56:14+08:00", "createdAtLocal": "11-18 17:56 北京", "url": "https://x.com/shao__meng/status/2122992266637955157", "themeId": "editorial", "signalScore": 60, "editorial": {"id": "2122992266637955157", "technicalRelevant": true, "dailyGrade": "A", "channel": "agent", "topic": "Devin Bots持续工程职责与多Agent协调", "evidence": "Bot负责统筹，Devin会话负责执行", "rationale": "介绍产品发布、执行机制与具体案例，数字属方述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122863106846232941", "track": "agent", "source": {"id": "2122863106846232941", "text": "Claude Code 团队约 90% 的代码由 Claude 来写、来审。Addy Osmani 这篇新文章讲的是，到了这个比例，他们怎么让 Agent 拿出证据证明自己改对了。\n\n我觉得最值得抄的有两个做法。\n\n一：是改动碰不到判它的规则。Code Review 读的 REVIEW.md 永远取自主分支，不读 PR 里的版本。新的提交门禁也会先开 observe 模式跑一段，把误拦看清楚了再强制执行。\n\n二：是一份 39 条的可靠性清单，每条都写明从 diff 里怎么识别、背后是哪次事故。Claude 读完 diff 只查触发到的那 3～10 条，谁都不用把历史事故背下来。\n\n想同时跑很多个 Claude，前提是验证这一层足够可靠。这篇把这层当成正经系统来做，挺值得做 Agent 工程的朋友细读。\n\n原文：https://t.co/DxlzNNCfSB", "createdAt": "Wed Nov 18 01:23:00 +0000 2026", "replyCount": 8, "retweetCount": 5, "likeCount": 34, "conversationId": "2122863106846232941", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-18T01:23:00+00:00", "createdAtBeijing": "2026-11-18T09:23:00+08:00", "createdAtLocal": "11-18 09:23 北京", "url": "https://x.com/Xudong07452910/status/2122863106846232941", "themeId": "editorial", "signalScore": 74, "editorial": {"id": "2122863106846232941", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent代码审查与可靠性门禁", "evidence": "REVIEW.md 永远取自主分支", "rationale": "提供审查规则隔离及事故清单使用方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122898087668793390", "track": "research", "source": {"id": "2122898087668793390", "text": "Harness 可以不断迭代，代码也能继承，但那些「为什么这样修改、当时解决了什么问题」的经验，却很容易在下一轮优化中丢失。\n\nGoogle 等机构最近的论文《Self-Improvement Memory Enables Continual Recursive Self-Improvement》，研究了如何让 Harness 跨模型、跨任务持续自我改进。\n\n研究团队提出了 Self-Improvement Memory（SIM），将每次修改的原因、预期效果、实验结果和适用环境记录下来。\n\n当底层模型或任务发生变化时，Agent 可以参考这些历史经验，判断哪些设计值得保留、哪些需要重新调整，避免反复试错。\n\n实验结果很有意思。在跨模型的 Workspace 任务中，使用 SIM 的最终得分达到 84.75，仅继承 Harness 继续优化的方案为 73.42。在另外 10 组 Coding 优化实验中，SIM 有 9 组领先。\n\n我感觉 Harness 的持续进化需要一种更深层的工程记忆，可以让系统能理解过去的设计决策，并根据新环境重新判断。\n\n之后衡量 Harness 的自我改进能力，或许应该更关注一个问题：当模型和任务不断变化，它究竟能保留多少有效经验，又能主动修正多少已经过时的判断？\n\n📎 arXiv: https://t.co/t4h22NI4xO", "createdAt": "Wed Nov 18 03:42:00 +0000 2026", "replyCount": 2, "retweetCount": 16, "likeCount": 66, "conversationId": "2122898087668793390", "author": {"username": "Xudong07452910", "name": "Xudong Han", "profileImageUrl": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, "authorId": "1327292278000349185", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXw3D7WkAAOAdX.jpg", "width": 1149, "height": 1200, "previewUrl": "https://pbs.twimg.com/media/HXXw3D7WkAAOAdX.jpg:small"}], "expert": {"priority": "P0", "domain": "LLM / AI Agents", "name": "Xudong Han", "role": "University of Sussex 博士生；LLM 与 AI Agents", "why": "持续构建个人 AI Agent，并分享 Vibe Coding 和 LLM 应用工程实践", "handle": "Xudong07452910"}, "createdAtIso": "2026-11-18T03:42:00+00:00", "createdAtBeijing": "2026-11-18T11:42:00+08:00", "createdAtLocal": "11-18 11:42 北京", "url": "https://x.com/Xudong07452910/status/2122898087668793390", "themeId": "editorial", "signalScore": 80, "editorial": {"id": "2122898087668793390", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "SIM跨模型自我改进记忆研究", "evidence": "SIM 有 9 组领先", "rationale": "给出记忆机制、对照分数及实验结果"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1327292688736034816/vJTxjjLU_normal.jpg"}, {"id": "2122877302979842540", "track": "enterprise", "source": {"id": "2122877302979842540", "text": "Tobi Lütke 在 Vercel Ship 谈「第三类顾客」：Agent 代购是增量，工程变成核验\n\nShopify CEO Tobi Lütke 与 Vercel CEO Guillermo Rauch，在旧金山 Vercel Ship SF 做了这场约半小时的炉边对谈「The Third Customer」：\nhttps://t.co/dyatSf9acp\n\nAgent 购物是增量，不是把店面全部替换掉\n\n官方回顾把「第三类顾客」概括为：为会替人检索、比较并下单的 Agent 做商业。自动字幕里，台上并未逐字解释这个标题。Lütke 说，这件事已经很真实，却仍很早；他不认为 Agent 会取代全部交易，并随口估计，人们把采购交给 Agent 的部分或许会占到两到五成，同时也可能再增加约五成新需求。\n\n他更看重「项目式购物」：布置万圣节、带孩子做 3D 打印，由 Agent 在周末前备齐材料，很多人本不会完成这类消费。有辨识度的精品店体验仍有空间，难做的是没有特色的百货和同质化市场。\n\n把目录和结账做成可调用的能力\n\nRauch 说，当天已把 Vercel Shop 作为面向 Shopify 的开源 Next.js 店面模板正式推出。Vercel 于 2026 年 10 月 16 日公开的博文，也写明该模板与跨框架的 Hydrogen SDK 已一般可用。\n\n谈到 Universal Commerce Protocol 时，Lütke 说结账极难做对，需要长期打磨，也仍要有规模不小的常设工程团队，因为合规要求在变。他认为，把这些麻烦做成可调用的接口，并允许别人复用结账部件，才是对开放网络的贡献。\n\n他特别提醒不要忽视目录 API：不必先同时拉起买卖双方，就可以做发现和策展。目前覆盖的是 Shopify 商品；他说以后会扩展到全网商品。\n\n工程师的工作变成核验\n\n谈到内部工程，他呼应 DHH 的「放下手敲代码」，称现在大家都是核验工程师，要做的是运行框架、验收测试，以及可被核验的产物。内部 Slack 助手 River 带着单体仓库的沙箱工作，Lütke 自报「超过 50%」直接经它产出，但没有说明这个比例量的是什么。\n\n公司黑客松的删代码榜由 River 大幅领跑，官网回顾也证实了这一点，但没有给出行数。店面渲染器正在从手工维护的 Ruby 迁到 Rust，方法是先保证同样输入得到同样字节，再切换过去。", "createdAt": "Wed Nov 18 02:19:24 +0000 2026", "replyCount": 13, "retweetCount": 0, "likeCount": 3, "conversationId": "2122877302979842540", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122343948924424256", "text": "Tobi Lütke (@tobi), Shopify CEO, at Vercel Ship SF: \"we are now all verification engineers. We are building harnesses, we are building acceptance tests, and we are building… verifiables.\"\n\nWhen agents write the code, the work moves to the checks:\n→ harnesses that make agent output repeatable\n→ acceptance tests that define \"done\"\n→ anything a machine can verify without a dev squinting at a diff\n\nFull fireside with @rauchg in the reply 👇", "createdAt": "Mon Nov 16 15:00:03 +0000 2026", "replyCount": 28, "retweetCount": 74, "likeCount": 867, "conversationId": "2122343948924424256", "author": {"username": "DarlingtonDev", "name": "Mike Darlington ▲", "profileImageUrl": "https://pbs.twimg.com/profile_images/2075773833618055168/vmD5iq2Y_normal.jpg"}, "authorId": "1379619071231205381", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117424522336894976/img/NHi_yaHnmEfogKua.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2117424522336894976/img/NHi_yaHnmEfogKua.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2117424522336894976/vid/avc1/1920x1080/pC_HePMZnK2x1YHl.mp4?tag=29", "durationMs": 49017}], "translationZh": "Shopify 首席执行官 Tobi Lütke（@tobi）在 Vercel Ship SF 上表示：“我们现在都是验证工程师。我们在构建测试框架、编写验收测试，以及构建……可验证的东西。”\n\n当智能体负责编写代码，工作重心就转向了验证：\n→ 让智能体输出可复现的测试框架\n→ 定义何为“完成”的验收测试\n→ 任何无需开发者紧盯代码差异、机器就能验证的内容\n\n与 @rauchg 的完整炉边对谈见回复 👇"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXX5pNNbkAA3JUZ.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXX5pNNbkAA3JUZ.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T02:19:24+00:00", "createdAtBeijing": "2026-11-18T10:19:24+08:00", "createdAtLocal": "11-18 10:19 北京", "url": "https://x.com/shao__meng/status/2122877302979842540", "themeId": "editorial", "signalScore": 67, "editorial": {"id": "2122877302979842540", "technicalRelevant": true, "dailyGrade": "B", "channel": "enterprise", "topic": "Agent商业接口与工程核验实践", "evidence": "先保证同样输入得到同样字节，再切换过去", "rationale": "包含内部助手、验收核验及迁移方法，比例口径有保留"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2122959211487515033", "track": "agent", "source": {"id": "2122959211487515033", "text": "OpenAI 给 GPT-6.2 的 Codex 提示建议：先说验收标准，再按任务选推理强度\n\nOpenAI 在这份指南里写，GPT-6.2 Astra 比 GPT-6 Astra 更容易给出接近可用的初稿：代码更好读，写作更直接，视觉作品也更完整。这些提示方法适用于整个 GPT-6.2 系列，包括 Astra 和 Sol，重点是在 Codex 里把任务说清楚，并告诉它你会按什么标准验收。\n\n指南建议，像跟熟悉项目的同事交代工作一样描述需求，同时写明验收时会看什么。比如图标必须在 24 像素工具栏里仍能辨认，就直接说出来。Codex 可以从现有图标里抓住风格，并判断在这个尺寸下该保留多少细节。\nhttps://t.co/9C7yyCM1Nz\n\n按调查深度选择推理强度\n\n更高的推理强度，能让模型在长时间任务里坚持做到最后的检查，即使最终答案只有几行。关键是先说清什么叫完成，以及哪些地方必须穷尽。如果团队要的是一项建议，可能意味着要把一条有希望的线索推到足够远，再拿去对照其他解释。\n\n选择推理强度，看的是调查有多深：快速浏览可以用 Medium；追查一个可能的原因、并跨越多个系统时，适合用 High；当多个原因可能相互影响、调查需要逐一交代时，再考虑 Extra High。\n\n让并行工作变成可授权的默认选择\n\n当任务可以拆成几块独立推进时，明确告诉 Codex 按需使用子 agent，等于授权它自己判断何时并行、如何分工。如果这类工作经常出现，就把这条写进对应的 skill 或 AGENTS.md，并说明适用场景。比如研究类技能，可以规定：请求里包含多个独立问题时再启用。\n\n使用 Ultra 时，Codex 会自己决定要不要引入子 agent。指南建议把它留给能干净拆开、又足够深入的任务，例如开放式研究里每一问都值得单独深挖。每个子 agent 可以带着自己的工作上下文，顺着一条线索往下做。\n\n先给视觉参考，再按真实尺寸验收\n\n如果心里已有特定视觉效果，先给一张参考图，说明形状怎么组合、哪些颜色更突出、视线应先落在哪里。可以从设计软件里导出，也可以让 Codex 用 GPT Image 先生成一张。参考图对了之后，再让它制作素材、渲染，并对照参考图反复修改。\n\n验收时要按人们实际看到的尺寸来看，大图上清楚的细节，到成品里可能消失。如果结果是可交互的，还要让它亲自试一遍应当支持的操作。SVG 与 3D Design 插件里有一份技能，会引导 Codex 按这个流程处理可编辑插图和三维模型。\n\n让 AGENTS.md 保持精简\n\nAGENTS.md 用来写项目要求和约定，尤其是 Codex 无法从代码、测试或文档里推断出来的部分。项目依赖某套工作流时再写进去，日常怎么执行的细节交给 Codex。\n\nCodex Cloud 里每个任务都有独立虚拟机。如果一边让它工作、一边还要用自己的电脑，可以在个人的 ~/.codex/AGENTS.md 里引导它优先使用不会抢占当前应用的工具。比如查一封邮件时，鼓励它走已有的邮件连接，而不是打断正在使用的软件。多 agent 共用同一台机器时，让它们控制同时跑多少构建和测试，尽量给其他任务留出资源；真正吃重的任务再独占整机。收尾时，让每个 agent 停掉自己启动的后台任务，并清理不再需要的临时文件。", "createdAt": "Wed Nov 18 07:44:53 +0000 2026", "replyCount": 3, "retweetCount": 0, "likeCount": 3, "conversationId": "2122959211487515033", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2122858340308996430", "text": "I linked the api prompt guide earlier, and while it has a lot of great content in it, its wisdom is already baked into the system prompt in codex!\n\nIf you’re looking for best practices for working with 6.2 Astra and Sol in codex, give this a read instead.\nhttps://t.co/trwhwZBwLN", "createdAt": "Wed Nov 18 01:04:03 +0000 2026", "replyCount": 37, "retweetCount": 69, "likeCount": 739, "conversationId": "2122858340308996430", "author": {"username": "pvncher", "name": "eric provencher", "profileImageUrl": "https://pbs.twimg.com/profile_images/2081499052382842880/ilcXqM5r_normal.jpg"}, "authorId": "1556653309", "translationZh": "我之前分享过 API 提示词指南。虽然里面有很多精彩内容，但其中的经验已经融入了 codex 的系统提示词！\n\n如果你想了解在 codex 中使用 6.2 Astra 和 Sol 的最佳实践，请改看这篇。\nhttps://t.co/trwhwZBwLN"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZEIjkbQAARTop.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXZEIjkbQAARTop.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T07:44:53+00:00", "createdAtBeijing": "2026-11-18T15:44:53+08:00", "createdAtLocal": "11-18 15:44 北京", "url": "https://x.com/shao__meng/status/2122959211487515033", "themeId": "editorial", "signalScore": 62, "editorial": {"id": "2122959211487515033", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Codex验收标准、推理强度与协作配置", "evidence": "先说验收标准，再按任务选推理强度", "rationale": "包含任务描述、视觉验收与项目指令的具体方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123130414323888463", "track": "enterprise", "source": {"id": "2123130414323888463", "text": "roughly an additional year of progress on @AMD's chip achieved in less than 5 months using our models, with some of these results included in a design that's recently been taped out — unprecedented results at the frontier of chip design.", "createdAt": "Wed Nov 18 19:05:11 +0000 2026", "replyCount": 47, "retweetCount": 56, "likeCount": 723, "conversationId": "2123130414323888463", "author": {"username": "gdb", "name": "Greg Brockman", "profileImageUrl": "https://pbs.twimg.com/profile_images/1347621377503711233/bHg3ipfD_normal.jpg"}, "authorId": "162124540", "quotedTweet": {"id": "2123100386638877054", "text": "Working with @AMD, our models identified up to 14% PPA improvement on flagship GPU IP in less than five months—building on designs AMD’s engineers had already spent years optimizing.\n\nThe same approach helped improve Jalapeño, our first custom inference chip, with gains verified on real silicon.\n\nNew evaluations also show our models getting better at certain chip design tasks.\n\nWe’re sharing these results and how we’re working with @Synopsys to bring our model capabilities and their trusted EDA design and validation tools to more chip designers.\n\nhttps://t.co/4BNcPIqfIQ", "createdAt": "Wed Nov 18 17:05:52 +0000 2026", "replyCount": 305, "retweetCount": 308, "likeCount": 3600, "conversationId": "2123100386638877054", "author": {"username": "OpenAI", "name": "OpenAI", "profileImageUrl": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg"}, "authorId": "4398626122", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbDvvBbkAA_huj.jpg", "width": 1574, "height": 1196, "previewUrl": "https://pbs.twimg.com/media/HXbDvvBbkAA_huj.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbDvvybIAAlN65.jpg", "width": 1574, "height": 1196, "previewUrl": "https://pbs.twimg.com/media/HXbDvvybIAAlN65.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbDvvnakAAzZqh.jpg", "width": 1574, "height": 1196, "previewUrl": "https://pbs.twimg.com/media/HXbDvvnakAAzZqh.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbDvufasAA5M5N.jpg", "width": 1574, "height": 1196, "previewUrl": "https://pbs.twimg.com/media/HXbDvufasAA5M5N.jpg:small"}], "translationZh": "在与 @AMD 的合作中，我们的模型在不到五个月内，为旗舰 GPU IP 找到了最高 14% 的 PPA（功耗、性能与面积）优化空间，而 AMD 工程师此前已为这些设计投入了数年的优化工作。\n\n同样的方法也帮助改进了我们的首款定制推理芯片 Jalapeño，提升效果已在真实芯片上得到验证。\n\n最新评测还显示，我们的模型在某些芯片设计任务上的能力持续提升。\n\n我们正在分享这些成果，以及如何与 @Synopsys 合作，将我们的模型能力与其备受信赖的 EDA 设计和验证工具带给更多芯片设计人员。\n\nhttps://t.co/4BNcPIqfIQ"}, "expert": {"priority": "P0", "domain": "基座模型 / OpenAI", "name": "Greg Brockman", "role": "OpenAI / 联合创始人", "why": "技术演示、产品发布、平台方向的重要信号源", "handle": "gdb"}, "createdAtIso": "2026-11-18T19:05:11+00:00", "createdAtBeijing": "2026-11-19T03:05:11+08:00", "createdAtLocal": "11-19 03:05 北京", "url": "https://x.com/gdb/status/2123130414323888463", "themeId": "editorial", "signalScore": 98, "editorial": {"id": "2123130414323888463", "technicalRelevant": true, "dailyGrade": "A", "channel": "enterprise", "topic": "AI 辅助芯片设计优化成果", "evidence": "up to 14% PPA improvement", "rationale": "发布方报告芯片优化指标及流片进展"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "借助我们的模型，@AMD 的芯片在不到 5 个月内取得了相当于额外一年研发的进展，其中部分成果已用于最近完成流片的设计——这是芯片设计前沿领域前所未有的成果。"}, "avatar": "https://pbs.twimg.com/profile_images/1347621377503711233/bHg3ipfD_normal.jpg"}, {"id": "2123103740710498448", "track": "research", "source": {"id": "2123103740710498448", "text": "Today we’re introducing OCRia-1.5\n\nIt’s a new family of document parsing models that push the boundaries of accuracy and cost across multiple document parsing dimensions.\n\nWe had just released OCRia-1 a month ago, which set a new SOTA in unified document parsing, but we've only released even more improvements since then.\n✅ Tables: Table scores rose from 86.5 -> 90.1 on agentic, 83.2 -> 87.5 on cost-effective\n✅ Charts: 74.9->76.8 on agentic, 67.3 -> 73.0 on cost-effective\n✅ Forms: +2.6 on agentic, +4.2 on cost-effective\n✅ Visual Grounding: +4.1 on agentic, and +11 (!!) points on cost-effective\n\nTogether, these models set a new Pareto frontier for document parsing. Our cost-effective OCRia-1.5 is the cheapest and most accurate model for parsing all of tables, charts, forms, handwriting, with high-quality layout.\n\nBlog: https://t.co/9NlhPd6E1s\n\nThese scores for all our modes (cost-effective, agentic, agentic plus) reflected within ParseBench-2: https://t.co/PWczfhp0OX", "createdAt": "Wed Nov 18 17:19:11 +0000 2026", "replyCount": 12, "retweetCount": 9, "likeCount": 43, "conversationId": "2123103740710498448", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2123102126372999662", "text": "Today we’re introducing OCRia-1.5. It is more accurate than OCRia-1 on complex tables, charts and forms, and it places bounding boxes more precisely.\n\nOCRia-1.5 comes in two sizes now:\n\n→ OCRia-1.5-2B runs Cost Effective, built for parsing at scale\n→ OCRia-1.5-4B, our upgraded flagship, runs Agentic for the hardest pages\n\nSame tiers, same prices, better models underneath.\n\nHere’s what changed on ParseBench-2 👇️", "createdAt": "Wed Nov 18 17:12:46 +0000 2026", "replyCount": 9, "retweetCount": 13, "likeCount": 37, "conversationId": "2123102126372999662", "author": {"username": "llama_index", "name": "LlamaIndex 🦙", "profileImageUrl": "https://pbs.twimg.com/profile_images/1967920417760251904/0ytfduMQ_normal.png"}, "authorId": "1604278358296055808", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbGIQUWkAAMe5y.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXbGIQUWkAAMe5y.jpg:small"}], "translationZh": "今天，我们推出 OCRia-1.5。相比 OCRia-1，它在解析复杂表格、图表和表单时更加准确，边界框定位也更精确。\n\nOCRia-1.5 现提供两种规模：\n\n→ OCRia-1.5-2B 用于 Cost Effective 模式，专为大规模解析打造\n→ OCRia-1.5-4B 是我们升级后的旗舰模型，用于 Agentic 模式，应对最复杂的页面\n\n档位不变，价格不变，底层模型更强。\n\n以下是 ParseBench-2 上的表现变化 👇️"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbHgr1aIAAfsRP.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXbHgr1aIAAfsRP.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-18T17:19:11+00:00", "createdAtBeijing": "2026-11-19T01:19:11+08:00", "createdAtLocal": "11-19 01:19 北京", "url": "https://x.com/jerryjliu0/status/2123103740710498448", "themeId": "editorial", "signalScore": 73, "editorial": {"id": "2123103740710498448", "technicalRelevant": true, "dailyGrade": "A", "channel": "research", "topic": "OCRia-1.5文档解析模型发布", "evidence": "Tables: Table scores rose", "rationale": "发布两种规模模型及多项评测提升，指标为官方自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "今天，我们推出 OCRia-1.5。\n\n这是一个全新的文档解析模型系列，在多项文档解析任务中进一步突破准确率与成本的边界。\n\n一个月前，我们刚刚发布了 OCRia-1，刷新了统一文档解析的最佳水平；此后，我们又陆续推出了更多改进。\n✅ 表格：agentic 模式得分从 86.5 升至 90.1，cost-effective 模式从 83.2 升至 87.5\n✅ 图表：agentic 模式从 74.9 升至 76.8，cost-effective 模式从 67.3 升至 73.0\n✅ 表单：agentic 模式提升 2.6 分，cost-effective 模式提升 4.2 分\n✅ 视觉定位：agentic 模式提升 4.1 分，cost-effective 模式提升了 11 分（！！）\n\n这些模型共同确立了文档解析领域新的帕累托前沿。我们的 cost-effective 版 OCRia-1.5 在表格、图表、表单和手写内容的综合解析上，兼具最低成本与最高准确率，并能提供高质量的版面解析。\n\n博客：https://t.co/9NlhPd6E1s\n\n我们所有模式（cost-effective、agentic、agentic plus）的这些成绩均已收录于 ParseBench-2：https://t.co/PWczfhp0OX"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2122849152648528045", "track": "agent", "source": {"id": "2122849152648528045", "text": "[AI Engineer Code Summit 2026 分享] \n那个逆向了 PhotoShop 和 Office 的 @get_artcraft 团队：24 小时复刻出 Photoshop，但还不是完整替代\n\nArtCraft 团队 Brandon Thomas 在旧金山 AI Engineer CODE Summit 2026 @aiDotEngineer 做了这场演讲「Let's Open Source the World」：\nhttps://t.co/lcTfAqcP9Z\n\n他的主张是：用 coding agent 把已经封闭的应用重新做成用户可拥有、可修改、可编程的工具。他回忆早期网络更开放，后来协议变成平台、订阅叠加、所有权变成授权；并提到自己对 Adobe 月付取消费用的不满。他观察到艺术家开始在他们提供的软件上编写自己的工作流，开源的理由不必是人人都想当维护者，是想拿回并改应用。\n\n24 小时与实际进度\n\n先给模型一个照片编辑应用的基本形状，再写一份很大的提示，要求界面与功能分开，并兼容 MCP 和命令行。大约 24 小时后，他们看到一个还算像样、用起来很熟、启动比 Photoshop 快约 10 倍的近似，但他立刻说还没有 100% 对等。\n\n他们还在做 InDesign、Premiere，以及 Office 核心应用、Figma 类协作、CAD 等方向。台上把 PDFCraft 说成已经可用、甚至不必再用 Acrobat。\n\n即将开源的软件工厂\n\n结尾时他介绍 Autocraft：接入 issue、分类处理、用 agent 写代码，并把其中的决定用于评估和后续训练。他两次说即将开源，并请听众留意，没有把它当成已经完成的发布。今天能看到公开仓库，但不宜写成峰会上正式开源。人机分工上，他把需要数据结构和接口设计的后端留给人，桌面应用则可以让 agent 大胆跑。他也提到持续集成已经撑不住，他们在自建。\n\nAutocraft：https://t.co/LdybHBALSe", "createdAt": "Wed Nov 18 00:27:33 +0000 2026", "replyCount": 14, "retweetCount": 2, "likeCount": 2, "conversationId": "2122849152648528045", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "quotedTweet": {"id": "2121231816309059821", "text": "AIE CODE 两天18小时31场演讲解读：Cloudflare 决策模型、Anthropic 千 Agent 协作与 Cognition 软件工厂", "createdAt": "Fri Nov 13 13:20:50 +0000 2026", "replyCount": 12, "retweetCount": 16, "likeCount": 59, "conversationId": "2121231816309059821", "author": {"username": "shao__meng", "name": "meng shao", "profileImageUrl": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, "authorId": "1727548535816724480", "article": {"title": "AIE CODE 两天18小时31场演讲解读：Cloudflare 决策模型、Anthropic 千 Agent 协作与 Cognition 软件工厂", "previewText": "AI Engineer Code Summit 2026 连续两天会议，合计超过 18 小时、31 场主题演讲。OpenAI、Anthropic、Google DeepMind、TypeSafe、Cloudflare、Cognition、Lovable、Ramp、Amp 等团队都带来了干货分享。"}}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXgCXnbUAAvMD3.jpg", "width": 2048, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXXgCXnbUAAvMD3.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "meng shao", "role": "内容、视觉与多模态实践与观察", "why": "把论文、课程与项目拆为工程架构和操作路径，解读信息密度高。", "handle": "shao__meng"}, "createdAtIso": "2026-11-18T00:27:33+00:00", "createdAtBeijing": "2026-11-18T08:27:33+08:00", "createdAtLocal": "11-18 08:27 北京", "url": "https://x.com/shao__meng/status/2122849152648528045", "themeId": "editorial", "signalScore": 68, "editorial": {"id": "2122849152648528045", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Agent 复刻桌面应用与软件工厂实践", "evidence": "要求界面与功能分开，并兼容 MCP 和命令行", "rationale": "提供实现方法与工程瓶颈，复刻成果属团队自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg"}, {"id": "2123085971625476277", "track": "tools", "source": {"id": "2123085971625476277", "text": "Introducing Perplexity Context API: allows you to fetch useful content from a list of webpages in whatever target format you seek. Usable inside any agentic harness. Outperforms anything else out there on performance, latency, and costs.", "createdAt": "Wed Nov 18 16:08:35 +0000 2026", "replyCount": 70, "retweetCount": 7, "likeCount": 285, "conversationId": "2123085971625476277", "author": {"username": "AravSrinivas", "name": "Aravind Srinivas", "profileImageUrl": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, "authorId": "759894532649545732", "quotedTweet": {"id": "2123085051013546406", "text": "Perplexity Context API is live.\n\nContext API reads up to 10 URLs per call and returns clean .md, HTML, links, and snippets per page.\n\nIt returns usable content for 92.3% of URLs, 87.9% fact recall, and 80.3% content precision at $1/1000 URLs fetched.\n\nhttps://t.co/9hoEcePh1B https://t.co/OJ5gvRdq2B", "createdAt": "Wed Nov 18 16:04:55 +0000 2026", "replyCount": 15, "retweetCount": 14, "likeCount": 183, "conversationId": "2123085051013546406", "author": {"username": "perplexitydevs", "name": "Perplexity Developers", "profileImageUrl": "https://pbs.twimg.com/profile_images/1902407947008819200/oNj7Lt2O_normal.png"}, "authorId": "1902403003887284224", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123085021003296768/img/if_vG_Zb-oNeDNMQ.jpg", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123085021003296768/img/if_vG_Zb-oNeDNMQ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123085021003296768/vid/avc1/1920x1080/oZCSdRjQNsW7X3T1.mp4?tag=16", "durationMs": 14333}], "translationZh": "Perplexity Context API 正式上线。\n\nContext API 每次调用最多可读取 10 个 URL，并返回每个页面整理后的 .md、HTML、链接和内容片段。\n\n它能从 92.3% 的 URL 中获取可用内容，事实召回率达 87.9%，内容精确率达 80.3%，每抓取 1,000 个 URL 收费 1 美元。\n\nhttps://t.co/9hoEcePh1B https://t.co/OJ5gvRdq2B"}, "expert": {"priority": "P0", "domain": "AI 搜索 / 产品", "name": "Aravind Srinivas", "role": "Perplexity / CEO", "why": "AI 搜索、答案引擎、消费者 AI 产品战略", "handle": "AravSrinivas"}, "createdAtIso": "2026-11-18T16:08:35+00:00", "createdAtBeijing": "2026-11-19T00:08:35+08:00", "createdAtLocal": "11-19 00:08 北京", "url": "https://x.com/AravSrinivas/status/2123085971625476277", "themeId": "editorial", "signalScore": 85, "editorial": {"id": "2123085971625476277", "technicalRelevant": true, "dailyGrade": "A", "channel": "tools", "topic": "Perplexity发布网页内容提取Context API", "evidence": "up to 10 URLs per call", "rationale": "发布明确API能力和定价，性能为官方自述"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "推出 Perplexity Context API：可从一组网页中提取有用内容，并按你需要的目标格式返回。可集成到任何智能体运行框架中，在性能、延迟和成本方面均优于现有其他方案。"}, "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__normal.jpg"}, {"id": "2123133924109087144", "track": "growth", "source": {"id": "2123133924109087144", "text": "Per-seat pricing isn’t priced on the data. It’s priced on the assumption that a human is the bottleneck.\n\nOne analyst, one screen, a few dozen lookups a week. The vendor can’t meter value per query, so it meters the person. $25k/yr works because an analyst’s time is worth far more than that, and because no analyst will ever query hard enough to make the math hurt.\n\nAgents break every part of that assumption.\n\nAn agent doesn’t do a few dozen lookups a week. It does a few hundred to answer one question, most of them dead ends, because breadth is how search works once thinking is cheap. Under a seat license, every one of those is free, which means the vendor is now subsidizing an unbounded consumer. At $0.10 per request, you suddenly care whether a query was worth making.\n\nThat’s the part the replies are underselling. Per-request pricing isn’t just cheaper. It changes what you build. A seat license tells you nothing about which lookups mattered. A per-call bill is a profiler for your agent. You find out that 80% of your spend went to one retry loop, the same way you find out 80% of your latency sits in one kernel.\n\nInfra went through this years ago. Capacity priced on headcount lost to per-token billing for exactly this reason: when the consumer is a program, you can finally meter the work instead of the worker.\n\nThe question I’d want answered before building on it: what happens at 10M requests? Per-unit pricing is wonderful until someone’s agent finds a loop. Rate limits, caching semantics, and a freshness guarantee you’d put in writing matter more than the headline number.\n\nStill, the direction is right. Software priced per person was always a proxy. Agents removed the person.", "createdAt": "Wed Nov 18 19:19:08 +0000 2026", "replyCount": 5, "retweetCount": 0, "likeCount": 10, "conversationId": "2123133924109087144", "author": {"username": "GenAI_is_real", "name": "Guitar Cat + LLM 「Will @ SGLang Summit in SF」", "profileImageUrl": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, "authorId": "1783397360259006464", "quotedTweet": {"id": "2123121308397670889", "text": "We just killed PitchBook.\n\nIntroducing Monid for private market data. Your agent can now read 20M+ private companies, right inside Claude.\n\nPitchBook: $25k/yr per seat.\nMonid: $0.10 per request.\n\n0 markup. No subscription. Pay as you go.\n\n#MonidKilledPitchBook https://t.co/a0wLHqrcWI", "createdAt": "Wed Nov 18 18:29:00 +0000 2026", "replyCount": 61, "retweetCount": 86, "likeCount": 653, "conversationId": "2123121308397670889", "author": {"username": "MonidHQ", "name": "Monid", "profileImageUrl": "https://pbs.twimg.com/profile_images/2092798103523127296/oncgd8fr_normal.jpg"}, "authorId": "2086579254138204160", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123120277970378752/img/OxEFfV6bMAvbmDpB.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123120277970378752/img/OxEFfV6bMAvbmDpB.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123120277970378752/vid/avc1/1920x1080/uacpJJVyw0PR7aGo.mp4?tag=29", "durationMs": 32000}], "translationZh": "我们刚刚终结了 PitchBook。\n\n推出私募市场数据服务 Monid。现在，你的智能体可以直接在 Claude 中读取超过 2,000 万家非上市公司的数据。\n\nPitchBook：每席位每年 2.5 万美元。\nMonid：每次请求 0.10 美元。\n\n零加价，无需订阅，按量付费。\n\n#MonidKilledPitchBook https://t.co/a0wLHqrcWI"}, "expert": {"priority": "P1", "domain": "模型、研究与推理", "name": "赵辰阳", "role": "模型、研究与推理实践与观察", "why": "有 SGLang 部署命令、GPU 设置和 KV 调度问题的一手信息。", "handle": "GenAI_is_real"}, "createdAtIso": "2026-11-18T19:19:08+00:00", "createdAtBeijing": "2026-11-19T03:19:08+08:00", "createdAtLocal": "11-19 03:19 北京", "url": "https://x.com/GenAI_is_real/status/2123133924109087144", "themeId": "editorial", "signalScore": 63, "editorial": {"id": "2123133924109087144", "technicalRelevant": true, "dailyGrade": "B", "channel": "growth", "topic": "Agent数据服务按请求定价与成本治理", "evidence": "Rate limits, caching semantics", "rationale": "具体分析计费变化及重试、缓存和限流风险"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "按席位定价的依据并不是数据，而是一个假设：人是瓶颈。\n\n一名分析师、一块屏幕、每周几十次查询。供应商无法按每次查询的价值计费，于是就按人头收费。每年 2.5 万美元之所以行得通，是因为分析师的时间价值远高于此，而且没有分析师会高频查询到让这笔账变得不划算。\n\n智能体打破了这一假设的每个环节。\n\n智能体并非每周只查询几十次。为了回答一个问题，它会查询几百次，其中大部分都没有结果，因为当思考成本足够低时，搜索就会依靠广泛探索。按席位授权时，这些查询全部免费，意味着供应商正在补贴一个用量没有上限的消费者。而当每次请求收费 0.10 美元时，你就会突然开始在意一次查询是否值得发起。\n\n回复中低估的正是这一点。按请求定价不只是更便宜，还会改变你构建的东西。席位授权无法告诉你哪些查询真正有用；按调用计费的账单则是智能体的性能分析工具。你会发现，80% 的开销都花在了某个重试循环上，就像你会发现 80% 的延迟都集中在某个内核函数中一样。\n\n基础设施领域多年前就经历过这一转变。按人头定价的容量方案输给了按 token 计费，原因正是如此：当消费者是程序时，你终于可以按工作量，而非工作人员来计费。\n\n在基于它开发之前，我最想弄清楚的问题是：请求量达到 1,000 万次时会怎样？按量计费很美好，直到某个智能体陷入循环。限流规则、缓存机制，以及愿意写进协议的内容时效性保证，比宣传中的单价更重要。\n\n不过，方向是对的。软件按人收费，一直只是间接衡量用量的办法。智能体让人退出了这个计费等式。"}, "avatar": "https://pbs.twimg.com/profile_images/1927428988839890944/-Q8itXt9_normal.jpg"}, {"id": "2122929339742502983", "track": "research", "source": {"id": "2122929339742502983", "text": "I do think any good benchmark should be customizable by the user to weigh towards what they care about the most.\n\nThis is typically hard to do for benchmarks measured with deterministic metrics. That's why in ParseBench-2, we treated metric design as a goal-oriented optimization problem! \n\n1. Let the user specify a severity policy for different scenarios\n2. Optimize metrics to fit that objective. \n\nMore details in the paper: https://t.co/syVMKqGMBP", "createdAt": "Wed Nov 18 05:46:11 +0000 2026", "replyCount": 21, "retweetCount": 0, "likeCount": 21, "conversationId": "2122929339742502983", "author": {"username": "jerryjliu0", "name": "Jerry Liu", "profileImageUrl": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, "authorId": "369777416", "quotedTweet": {"id": "2122927213657895161", "text": "I agree with @jerryjliu0's sentiment.\n\n[Rant on]\n\nSome of the reactions to ParseBench 2 from competitors have been pretty disappointing.\n\nWe've seen personal attacks, bad-faith interpretations of the benchmark, and criticisms that suggest some people haven't actually taken the time to understand what we built.\n\nOne example that stood out:\n\n\"Look, there's underlined text in a table cell, and if our parser misses the underline, the benchmark penalizes us. This is scandalous!\"\n\nWell... yes? If the dataset evaluates underline preservation, missing underlines gets penalized. That's kind of the point.\n\nAnother interesting one: calling for an end to benchmarks, only to release two new closed benchmarks a few days later, while promoting a proprietary \"LLM-as-a-judge\" evaluation that conveniently ranks your own parser first.\n\n(Surprise: vendor preferences can be embedded in evaluation prompts too!)\n\nThere have been dozens of takes like these, often from people who clearly haven't looked into how ParseBench 2 actually works. At times, it's felt more like a coordinated effort to discredit the benchmark than a genuine technical discussion.\n\n[/Rant off]\n\nHere's the thing: every vendor will continue publishing benchmarks. That's how this industry works.\n\nAnd every benchmark, including ours, will have flaws and biases. We naturally measure the things we care about.\n\nThat's fine. It's worth discussing. It doesn't justify personal attacks.\n\nI'll continue taking valid feedback seriously and improving and expanding ParseBench. I genuinely want us to get closer to a fairer, more useful benchmark.\n\nBecause ultimately, I care about the quality of what we ship, not winning a marketing argument.\n\nAnd with ParseBench 2, we actually built some pretty cool things that I think deserve more attention:\n\n1. User-defined evaluation policies\n\nTo our knowledge, ParseBench 2 is the first parsing benchmark that lets users define their own penalty policies, instead of blindly accepting the benchmark creator's preferences (including ours).\n\nTry it: https://t.co/aExXILK3xM\n\nWe're working on making this easier to use, customize, and export.\n\n2. Metrics designed to reflect what actually matters\n\nWe spent a lot of effort making sure different models get a fair evaluation, without unnecessarily penalizing formatting differences or model-specific quirks.\n\nWe also developed a technique to better align scoring metrics with the user's chosen evaluation policy.\n\nThis means we can distinguish between errors based on their actual severity, rather than relying purely on traditional edit-distance metrics that may treat very different mistakes similarly.\n\nYou can explore the metrics, different severity policies, and our analysis of dozens of other benchmarks here:\n\nhttps://t.co/cNuyoE6RVd\n\nI'm genuinely impressed by the technical work coming out of some of our competitors. Some teams are doing incredible things, and I have a lot of respect for that.\n\nI'd love to see more technical discussions, more reproducible evaluations, and less high-school-level drama.\n\nAnyway, back to building.", "createdAt": "Wed Nov 18 05:37:44 +0000 2026", "replyCount": 3, "retweetCount": 11, "likeCount": 30, "conversationId": "2122927213657895161", "author": {"username": "hexapode", "name": "Pierre-Loic Doulcet", "profileImageUrl": "https://pbs.twimg.com/profile_images/2115260994083803136/QBtKQ1nm_normal.jpg"}, "authorId": "39505635", "translationZh": "我赞同 @jerryjliu0 的看法。\n\n[吐槽开始]\n\n一些竞争对手对 ParseBench 2 的反应相当令人失望。\n\n我们看到了人身攻击、对基准测试的恶意曲解，还有一些批评，表明某些人根本没有花时间了解我们做了什么。\n\n有个例子尤其突出：\n\n“看，表格单元格里有带下划线的文字，如果我们的解析器漏掉了下划线，基准测试就会扣分。太离谱了！”\n\n嗯……没错啊？如果数据集考查的是下划线保留情况，漏掉下划线当然要扣分。这本来就是测试的目的。\n\n另一个有意思的例子是：一边呼吁停止做基准测试，几天后却又发布两个新的封闭基准测试，同时推广一套专有的“LLM-as-a-judge”评估，恰好把自家解析器排在第一。\n\n（惊不惊喜：评估提示词里也可以夹带厂商偏好！）\n\n类似的言论有几十条，发表者往往明显没有研究过 ParseBench 2 到底如何运作。有时，这更像是一场有组织的抹黑行动，而非真正的技术讨论。\n\n[吐槽结束]\n\n事实是：每家厂商都会继续发布基准测试。这个行业就是这样运作的。\n\n而每个基准测试，包括我们的，都会有缺陷和偏差。我们自然会衡量自己关心的东西。\n\n这没问题，也值得讨论。但这不能成为人身攻击的理由。\n\n我会继续认真对待合理反馈，改进并扩展 ParseBench。我真心希望我们能做出更公平、更实用的基准测试。\n\n因为归根结底，我在乎的是交付成果的质量，而不是赢下一场营销争论。\n\n而且，我们在 ParseBench 2 中确实做出了一些很棒的东西，我认为值得更多关注：\n\n1. 用户自定义评估策略\n\n据我们所知，ParseBench 2 是首个允许用户自行定义扣分策略的解析基准测试，用户无需盲目接受基准创建者的偏好，包括我们的偏好。\n\n试试看：https://t.co/aExXILK3xM\n\n我们正在让它更便于使用、自定义和导出。\n\n2. 反映实际重要性的指标设计\n\n我们投入了大量精力，确保不同模型都能得到公平评估，避免因格式差异或模型自身特点而产生不必要的扣分。\n\n我们还开发了一种方法，让评分指标更好地契合用户选择的评估策略。\n\n这意味着，我们可以根据错误的实际严重程度加以区分，而不是完全依赖传统编辑距离指标，后者可能会对差异很大的错误给出相近的判定。\n\n你可以在这里查看各项指标、不同的严重程度策略，以及我们对其他几十个基准测试的分析：\n\nhttps://t.co/cNuyoE6RVd\n\n一些竞争对手的技术成果确实让我印象深刻。有些团队做得非常出色，我对此十分尊重。\n\n我希望看到更多技术讨论、更多可复现的评估，少一些高中生式的闹剧。\n\n好了，继续干活。"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXYoypHaUAEIHLX.jpg", "width": 2048, "height": 835, "previewUrl": "https://pbs.twimg.com/media/HXYoypHaUAEIHLX.jpg:small"}], "expert": {"priority": "P1", "domain": "RAG / Agent 基础设施", "name": "Jerry Liu", "role": "LlamaIndex / CEO", "why": "RAG、知识 Agent、企业数据 Agent 的重要实践信号源；排序低于 OpenAI 核心人物", "handle": "jerryjliu0"}, "createdAtIso": "2026-11-18T05:46:11+00:00", "createdAtBeijing": "2026-11-18T13:46:11+08:00", "createdAtLocal": "11-18 13:46 北京", "url": "https://x.com/jerryjliu0/status/2122929339742502983", "themeId": "editorial", "signalScore": 71, "editorial": {"id": "2122929339742502983", "technicalRelevant": true, "dailyGrade": "B", "channel": "research", "topic": "ParseBench-2 用户自定义评估策略", "evidence": "User-defined evaluation policies", "rationale": "说明按用户错误严重性策略优化指标的方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0, "translationZh": "我确实认为，好的基准测试都应该允许用户自定义权重，侧重自己最关心的方面。\n\n对于采用确定性指标的基准测试，这通常很难做到。因此，在 ParseBench-2 中，我们把指标设计视为一个以目标为导向的优化问题！\n\n1. 让用户为不同场景指定错误严重程度策略\n2. 优化指标，使其符合这一目标。\n\n更多细节见论文：https://t.co/syVMKqGMBP"}, "avatar": "https://pbs.twimg.com/profile_images/1283610285031460864/1Q4zYhtb_normal.jpg"}, {"id": "2122857827391934634", "track": "agent", "source": {"id": "2122857827391934634", "text": "用刚发布的 Sol 6.2 跑了内部的 code review eval（50 个 PR），感觉有一点不及预期（作为一个等了这个模型一个月的人...）。Recall 提升明显但是 precision 降了太很多：这种改变甚至有可能在 harness 层就能做到（模型本质提升的体现是 recall 提升的同时保持 precision 稳定）\n\n关键是完成任务慢了 25%，价格还贵了 62%。和官方给的 score/cost 表差别有点大...", "createdAt": "Wed Nov 18 01:02:01 +0000 2026", "replyCount": 2, "retweetCount": 0, "likeCount": 14, "conversationId": "2122857827391934634", "author": {"username": "luinlee", "name": "Zihua", "profileImageUrl": "https://pbs.twimg.com/profile_images/2111297667779432448/O7iHassM_normal.jpg"}, "authorId": "69492059", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXneRxbYAEadIc.png", "width": 2048, "height": 1152, "previewUrl": "https://pbs.twimg.com/media/HXXneRxbYAEadIc.png:small"}], "expert": {"priority": "P1", "domain": "开源产品与工程实践", "name": "Zihua", "role": "开源产品与工程实践实践与观察", "why": "PNGDeer 有开源、在线测试和同质量压缩比较，连接 AI 工程与视觉交付。", "handle": "luinlee"}, "createdAtIso": "2026-11-18T01:02:01+00:00", "createdAtBeijing": "2026-11-18T09:02:01+08:00", "createdAtLocal": "11-18 09:02 北京", "url": "https://x.com/luinlee/status/2122857827391934634", "themeId": "editorial", "signalScore": 59, "editorial": {"id": "2122857827391934634", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "Sol 6.2 代码审查内部评测", "evidence": "内部的 code review eval（50 个 PR）", "rationale": "自述评测提供召回、精度、耗时与成本反馈"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/2111297667779432448/O7iHassM_normal.jpg"}, {"id": "2122879464707383597", "track": "agent", "source": {"id": "2122879464707383597", "text": "Claude Code 新出了一个实验功能，叫 Code Mode，默认是关的。\n\n平常它用工具是一步一步来：先调一个，看完结果，再决定下一步。\n\n开了这个模式之后，它会先写一段 JavaScript，让 Claude Code 在你这次会话里跑。\n\n一段代码里就能把好几步串起来，能并行，也能把上一步的结果接到下一步，最后只把需要看的那部分回给模型。\n\n结果太多就先筛选，再读取需要的信息。你照样用自然语言提需求，不需要自己写脚本。\n\n对话里你看到的还是具体操作，比如一次编辑的 diff；想看它写的脚本，按 Ctrl+O 打开记录再展开就行。\n\n这对批量改文件、检查整个项目、分析日志这类任务比较有用。比如让它检查所有 Markdown 里的失效链接，它可以用代码组织搜索、路径检查和结果汇总。\n\n符合后台执行条件时，测试或构建还在跑，你也能继续和它交流，不必一直干等。", "createdAt": "Wed Nov 18 02:28:00 +0000 2026", "replyCount": 6, "retweetCount": 0, "likeCount": 0, "conversationId": "2122879464707383597", "author": {"username": "sitinme", "name": "sitin", "profileImageUrl": "https://pbs.twimg.com/profile_images/3569591888/2aad771c0c1919fb7577a7b625a93d0a_normal.jpeg"}, "authorId": "830429456", "quotedTweet": {"id": "2122801681939234950", "text": "Check out Code Mode, a new, experimental way for Claude Code to work with tools. Claude writes scripts that chain your tools together in sophisticated ways, and it can answer you while long commands are still running. \n\nOpt in with CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1 https://t.co/Aj5ofLiK1y", "createdAt": "Tue Nov 17 21:18:55 +0000 2026", "replyCount": 409, "retweetCount": 634, "likeCount": 11154, "conversationId": "2122801681939234950", "author": {"username": "ClaudeDevs", "name": "ClaudeDevs", "profileImageUrl": "https://pbs.twimg.com/profile_images/2044472418815893504/xf14RxM8_normal.png"}, "authorId": "2024518793679294464", "translationZh": "来看看 Code Mode，这是 Claude Code 使用工具的一种全新实验性方式。Claude 会编写脚本，以复杂灵活的方式串联你的工具，还能在耗时命令运行期间回复你。\n\n设置 CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1 即可启用 https://t.co/Aj5ofLiK1y"}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122875363126804480/img/7Pi7pKR_H8DoAmDL.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/21228753631268 在电脑上跑模型了，它就会识别你在攒功德！！我把自己的 AI 编程用量，做成了一条江南水乡的热闹街景！依旧是大开源！！！！所有人都可以拿去玩，也可以提PR共创！！！\n\n开一个 Claude Code 或 Codex 会话，河上就开出一条乌篷船，船头木牌写着项目名，它每调用一次工具，船夫摇一下桨，改一个文件，岸边亮一扇窗\n\n每用掉 1000 个 token，水面升起一盏孔明灯，桥头立着一块水牌，Claude、Codex、DeepSeek、Grok、Magpie 今天各用了多少都放在上面了，你可以直接放大看见\n\n已经在 GitHub 开源，一条命令就能跑，全部都是由Qwen4 Max+tripo制作\n\n1/ 最底下这片水乡，最初是 Qwen4-Max 写的。一个 66KB 的网页，石拱桥、灯笼、乌篷船都有，连水声和鸟叫都是它用代码合成的，没用一个音频素材\n\n2/ 让他把场景变成能挂机的小游戏，船、窗、孔明灯这些逻辑都让Qwen实现\n\n3/ 船、拱桥、水牌和 28 栋民居，换成 Tripo 生成的 3D 模型，再让Qwen调用 Blender 减面\n\n4/ 开源前的打磨交给国产模型：DeepSeek V4 Pro 干活，Kimi K3.1 Pro 审查，Qwen只验收，跑了 8 轮才放行，DeepSeek 一共发了 1033 次请求\n\n5/ 这么多模型能一起干活，靠的是 Magpie（yetone大佬确实强 @yetone），一个本地模型网关，千问、DeepSeek、Kimi、GPT 接在同一个口子上，谁干的活、花了多少钱都有记录。游戏里那条喜鹊小舢板就是它\n\n最意外的是 Kimi，它会自己把程序跑起来，开浏览器一栋一栋量距离，抓出了授权写法前后矛盾、回顾卡默认印出真实项目名这些我都没注意到的问题\n\n单说 Qwen4-Max，这两天用下来最直观的是省\n\n一句话出一个能直接打开的 3D 水乡，默认档 5 分钟，按官方价大约 5 毛，让它自己连续迭代三轮，缓存命中 95%，一轮两块钱左右\n\n缓存命中只收 0.5 元每百万 token，长任务反复带着上下文跑也很省钱\n\n用Token攒功德开源项目：https://t.co/oulSG5HDTO\n\nmagpie：https://t.co/SkeUx7cI8u\n\ntripo使用方式（走链接有700免费积分，差不多能够用5-6哥资产构建）：https://t.co/Dk4zIBSdmq", "createdAt": "Wed Nov 18 10:41:45 +0000 2026", "replyCount": 7, "retweetCount": 0, "likeCount": 5, "conversationId": "2123003722309791939", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "quotedTweet": {"id": "2122535125749743618", "text": "这回真得起立了。。。兄弟们！！阿里的新模型有点强啊！！！！用它干活一点都不烧心，感觉智能真的越来越便宜了！！！\n\n我用Qwen新模型做了一个小镇的场景模型用来做游戏，整个场景搭建才花了6块钱，我只安排了一次任务 Qwen4-Max 直接让他自己迭代的，我在过程中什么都没干。。。。，\n\n2 小时 28 分钟后，它自己改成了下面这个样子，我就跟Qwen4-Max说了一句：用 three.js 做一个可交互的江南水乡夜景，白墙黑瓦沿河排开，石拱桥横跨河面，乌篷船来回漂，屋檐下的红灯笼会摇、会发光，天色从黄昏慢慢入夜，加泛光、做体积光、做出平静的水面、加雾气层次、镜头要看得到整条河和石拱桥\n\n剩下的全靠它自己：改代码、看图挑毛病、修报错、写下一轮要改什么，然后接着干\n\n以后真的再也不用每隔10分钟跟模型说一次继续了，Qwen自己就干完了，我回头看了一下他执行的过程，跑完这一轮我对\"长程任务\"这四个字有了很具体的体感\n\n1/ 它会自己验货，3 轮里它自己截图检查了 30 次，看到灯影方向写反、横着铺满整条河像斑马线，自己标出来，自己改掉\n2/ 它不推倒重来，代码从 769 行长到 1044 行，原来的拖动旋转、昼夜变化、灯笼摇晃、船来回漂，一个都没丢\n3/ 报错它自己改，第 2 轮水面代码一次报了 258 条错，它 35 秒就找到原因，改完重测，归零\n4/ 它会写交接，每一轮结束都写一份记录：改了什么、还差什么、下一轮按影响大小先做哪条。下一轮开工先读这份记录，3 轮下来衔接没断过\n你会发现，它不是那种一次惊艳就收工的模型，而是能接住反馈、一版一版往上磨的模型\n\n然后是我最想说的部分：账单，这我真的觉得比之前优化的多的部分，也最出彩的部分\n\n3 轮一共 105 次请求，输入 335 万 token，其中 95% 命中了缓存，总花费 6.19 元\n\n如果不命中缓存，光输入就要 33 块钱左右\n\n长任务为什么以前用不起？因为每走一步，都要把前面所有代码、截图结果、报错重新喂一遍，Qwen4-Max 的缓存命中价只有输入价的二十分之一，这件事在长任务里会被放大几十倍\n\n每一轮花 2 块钱左右，很稳，一点都不烧心，Qwen团队这波是真的很站在企业落地的视角去训练模型了\n\n这才是AI智能长程任务真正能落地的前提：模型要扛得住，账单也要扛得住。。这一波Qwen4-Max上线，后面谁真的能在企业落地，我觉得Qwen必有一席之地了", "createdAt": "Tue Nov 17 03:39:43 +0000 2026", "replyCount": 9, "retweetCount": 0, "likeCount": 28, "conversationId": "2122535125749743618", "author": {"username": "Astronaut_1216", "name": "叫我阿杭", "profileImageUrl": "https://pbs.twimg.com/profile_images/1994286771832557568/wUaZfjN5_normal.jpg"}, "authorId": "1792608085409939456", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122532041787158528/img/_j-AQJAJpt8Sf_pt.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2122532041787158528/img/_j-AQJAJpt8Sf_pt.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2122532041787158528/vid/avc1/1920x1080/x5vAJTAArTgC6Ww4.mp4?tag=29", "durationMs": 27100}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXS_q-RbAAAHjqz.jpg", "width": 1820, "height": 2048, "previewUrl": "https://pbs.twimg.com/media/HXS_q-RbAAAHjqz.jpg:small"}]}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZqyfLaUAAR8Sz.jpg", "width": 1404, "height": 794, "previewUrl": "https://pbs.twimg.com/media/HXZqyfLaUAAR8Sz.jpg:small"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZq3Gka8AAHos_.jpg", "width": 1600, "height": 2000, "previewUrl": "https://pbs.twimg.com/media/HXZq3Gka8AAHos_.jpg:small"}], "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "叫我阿杭", "role": "内容、视觉与多模态实践与观察", "why": "公开 Obsidian、录音与自媒体制作流程，直接贴合内容生产需求。", "handle": "Astronaut_1216"}, "createdAtIso": "2026-11-18T10:41:45+00:00", "c ://pbs.twimg.com/profile_images/2118643132720123904/7XfJMbg3_normal.jpg"}, "authorId": "1708035814846783488", "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123062921034899456/img/QmVi3wo1pfjR41pZ.jpg", "width": 1920, "height": 1080, "previewUrl": "https://pbs.twimg.com/amplify_video_thumb/2123062921034899456/img/QmVi3wo1pfjR41pZ.jpg:small", "videoUrl": "https://video.twimg.com/amplify_video/2123062921034899456/vid/avc1/1920x1080/bRBHz7o0lgiTOSt-.mp4?tag=29", "durationMs": 16200}], "translationZh": "全球顶尖的动态设计视频，如今已开源。\n\n我把 GPT-6.2 Astra 这个主题交给 OpenAI 的 MOTION.md，做出来的动效简直是视觉盛宴。\n\n来自 100 多家顶尖公司的约 300 个模板，采用 Apache 2.0 协议开源：\n• AI 模型发布\n• 产品演示 + UI 动画\n• 品牌宣传片 + 标志揭幕动画\n\n使用方法：\n1. 打开 Claude Code、Codex、Cursor、Gemini CLI、GitHub Copilot、DeepSeek TUI、WorkBuddy 或其他 15 种智能体\n2. 输入：“安装并配置 OpenMotion”，再附上下方的 GitHub 链接👇\n3. 选择一个模板，或粘贴任意视频链接"}, "expert": {"priority": "P1", "domain": "内容、视觉与多模态", "name": "Tom Huang", "role": "内容、视觉与多模态实践与观察", "why": "直接公开 OpenDesign 动效制作、修复及产品迭代，视觉工具来源清楚。", "handle": "tuturetom"}, "createdAtIso": "2026-11-18T15:02:42+00:00", "createdAtBeijing": "2026-11-18T23:02:42+08:00", "createdAtLocal": "11-18 23:02 北京", "url": "https://x.com/tuturetom/status/2123069392321966444", "themeId": "editorial", "signalScore": 57, "editorial": {"id": "2123069392321966444", "technicalRelevant": true, "dailyGrade": "B", "channel": "creative", "topic": "OpenMotion开源动效模板与生成演示", "evidence": "近300个动效模板，以Apache 2.0协议开源", "rationale": "提供模板规模、许可、使用步骤及自述演示"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/1033199673035522048/WI-JLSAc_normal.jpg"}, {"id": "2123026797852053861", "track": "agent", "source": {"id": "2123026797852053861", "text": "学到了 原来 vitest 有一个 vitest --changed 命令，https://t.co/ry2jtYx0QV\n\n它只会跑 changed files 相关的 tests，内部原理是 Vitest 会让 Git 给出变更文件列表，然后找出 import 了这些文件 的测试文件，只要测试的 import grahp 里面有这个文件，就会运行对应的测试，这个命令非常实用啊", "createdAt": "Wed Nov 18 12:13:27 +0000 2026", "replyCount": 1, "retweetCount": 4, "likeCount": 33, "conversationId": "2123026797852053861", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919", "quotedTweet": {"id": "2122309741825470468", "text": "非常实用的加速 CI 的经验，学到很多新知识，尤其是对加速测试的方式 ：\n\n* 把测试按照历史耗时智能分片并行跑 ，如果平均分配的话，有可能出现时间消耗非常不一致的情况，所以先记录每个测试的历史耗时，按耗时把测试重新分配，然后让每个分片的总时间尽量接近，这个真的是巧思\n\n* PR 只跑受影响的测试，根据代码 diff 只执行相关测试，而不是全量，这里执行哪些应该是在 CI 上做静态分析 import graph，然后决定跑哪些\n\n* 其他还有换工具纯纯提速，tsc 改成 bun check，lint 使用 oxlint\n\n* 最后就是所有都并行，lint/类型检查/build/test同时跑", "createdAt": "Mon Nov 16 12:44:07 +0000 2026", "replyCount": 11, "retweetCount": 6, "likeCount": 88, "conversationId": "2122309741825470468", "author": {"username": "vikingmute", "name": "Viking", "profileImageUrl": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, "authorId": "296593919"}, "expert": {"priority": "P1", "domain": "Agent 与开发工具", "name": "Viking", "role": "Agent 与开发工具实践与观察", "why": "详细公开软件工厂式流程，包含工单、编排、执行和人工确认环节。", "handle": "vikingmute"}, "createdAtIso": "2026-11-18T12:13:27+00:00", "createdAtBeijing": "2026-11-18T20:13:27+08:00", "createdAtLocal": "11-18 20:13 北京", "url": "https://x.com/vikingmute/status/2123026797852053861", "themeId": "editorial", "signalScore": 64, "editorial": {"id": "2123026797852053861", "technicalRelevant": true, "dailyGrade": "B", "channel": "agent", "topic": "按变更运行测试与CI提速", "evidence": "只会跑 changed files 相关的 tests", "rationale": "提供具体命令、依赖分析原理及测试分片方法"}, "isTopStory": false, "topStoryEligible": false, "topStoryCategory": "", "topStoryScore": 0}, "avatar": "https://pbs.twimg.com/profile_images/725179208528322560/TPjU7qop_normal.jpg"}, {"id": "2122957141128696268", "track": "creative", "source": {"id": "2122957141128696268", "text": "好漂亮的字体啊 https://t.co/uS8wwIApde 非常圆润可爱，Allo 本身是基于 Inter 重新绘制的，加了一个 Roundness（圆润度），可以自己调节，并且有大量的 OpenType 特性，可
